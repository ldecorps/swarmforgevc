org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# BL-1635: org.gradle.jvmargs above only pins the Gradle daemon's own JVM.
# The Kotlin compile daemon is a separate JVM and, unset, inherits whatever
# locale the process that first started it happened to have - under the
# acceptance handlers' Gradle lib (no LANG at all) that JVM's default
# charset follows JDK 17's locale-derived file.encoding (JEP 400 only
# defaults to UTF-8 from JDK 18), so a test source set recompiled by such
# a daemon can decode a UTF-8 literal wrong while main classes compiled
# earlier stay correct - two compiles, two charsets, one repository.
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8
systemProp.file.encoding=UTF-8
