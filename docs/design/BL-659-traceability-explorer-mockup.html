    el.innerHTML=`<h3>${t.id} — ${t.t}</h3><div class="chips"><span class="chip">${t.st}</span></div><div class="note" style="padding:0">Pas de feature APS liée dans la maquette.</div>`;
  } else {const m=DATA.milestones.find(x=>x.id===S.ms);
    el.innerHTML=`<h3>${m.id} — ${m.name}</h3><div class="fstats"><div><b>${m.total}</b><span>tickets</span></div><div><b>${m.done}</b><span>done</span></div><div><b>${Math.round(100*m.done/m.total)}%</b><span>progress</span></div></div>`;}
  crumb([["🏠",()=>{S={root:"specs",ms:"M8",tk:null,sc:null};render();}],[S.ms],(S.tk?[S.tk,()=>{S.sc=null;render();}]:null),(S.sc?["Scenario "+S.sc]:null)]);
}
/* DOCS / CONSTI / BRIEF / EVID = corpus markdown */
function renderCorpus(){
  const src=S.root==="docs"?DATA.docs:S.root==="consti"?DATA.consti:null;
  const flat=S.root==="brief"?DATA.brief:S.root==="evid"?DATA.evid:null;
  if(src){
    const cats=Object.keys(src); if(!S.cat)S.cat=cats[0];
    col($("c1"),S.root==="docs"?"Docs — Diátaxis":"Constitution",cats.map(c=>({sel:S.cat===c,html:c,on:()=>{S.cat=c;S.doc=null;render();}})));
    col($("c2"),"Fichiers",src[S.cat].map(d=>({sel:S.doc===d.f,html:`<span class="id" style="font-size:.72rem">${d.f.length>26?d.f.slice(0,25)+"…":d.f}</span>`,title:d.d,on:()=>{S.doc=d.f;render();}})));
    const d=src[S.cat].find(x=>x.f===S.doc);
    $("details").innerHTML=d? (d.body?`<div class="md">${esc(DATA.bodies[d.body])}</div>`:`<h3>${d.f}</h3><p class="note" style="padding:0">${d.d} — (corps non embarqué dans la maquette ; au build réel, le markdown est pré-rendu ici, liens BL-xxx cliquables.)</p>`)
      : `<div class="note" style="padding-top:1.5rem">Choisis un fichier — essaie <b>coder.prompt</b> (constitution) ou <b>lessons-2026-07-25</b> (explanation).</div>`;
    crumb([["🏠",()=>{S={root:"specs",ms:"M8"};render();}],[S.root.toUpperCase()],[S.cat],(S.doc?[S.doc.slice(0,18)+"…"]:null)]);
  } else {
    col($("c1"),S.root==="brief"?"Briefings":"Evidence",flat.map(d=>({sel:S.doc===d.f,html:`<span class="id" style="font-size:.74rem">${d.f.slice(0,24)}${d.f.length>24?"…":""}</span>`,title:d.d,on:()=>{S.doc=d.f;render();}})));
    col($("c2"),"",[],""); $("c2").innerHTML="";
    const d=flat.find(x=>x.f===S.doc);
    $("details").innerHTML=d?(d.body?`<div class="md">${esc(DATA.bodies[d.body])}</div>`:`<h3>${d.f}</h3><p class="note" style="padding:0">${d.d}</p>`)
      :`<div class="note" style="padding-top:1.5rem">${S.root==="brief"?"La série des matins — essaie 2026-07-26 (le gap-fill).":"Les 194 récits d'incidents — essaie le bounce #3 de BL-629."}</div>`;
    crumb([["🏠",()=>{S={root:"specs",ms:"M8"};render();}],[S.root.toUpperCase()],(S.doc?[S.doc.slice(0,22)+"…"]:null)]);
  }
}
function col(el,title,items,note){
  el.innerHTML=title?`<h2>${title}</h2>`:"";
  (items||[]).forEach(it=>{const d=document.createElement("div");d.className="item "+(it.sel?"sel ":"")+(it.cls||"");d.innerHTML=it.html;if(it.title)d.title=it.title;d.onclick=it.on;el.appendChild(d);
    if(it.extra){const x=document.createElement("div");x.innerHTML=it.extra;el.appendChild(x);}});
  if(note)el.innerHTML+=`<div class="note">${note}</div>`;
}
function gwt(k,i){return `<div class="gwt"><div class="kw">${k}</div>${i.map(x=>`<p>${x}</p>`).join("")}</div>`;}
function crumb(parts){parts=parts.filter(Boolean);
  $("crumb").innerHTML=parts.map((p,i)=>`${i?'<span class="sep">›</span>':''}<a>${p[0]}</a>`).join("");
  [...$("crumb").querySelectorAll("a")].forEach((a,i)=>{if(parts[i][1])a.onclick=parts[i][1];});}
function renderMap(){
  const levels={specs:["Milestone","Ticket","Feature","Scenario"],docs:["Racine","Catégorie","Document"],consti:["Racine","Catégorie","Document"],brief:["Racine","Jour"],evid:["Racine","Récit"]}[S.root];
  const depth=S.root==="specs"?(S.sc?3:S.tk?2:1):(S.doc?levels.length-1:S.cat?1:0);
  $("minimap").innerHTML=levels.map((l,i)=>`<div class="${i===depth?'on':''}">${l}</div>`).join("");}
function jumpTicket(id){S={root:"specs",ms:"M8",tk:id,sc:null};render();}
/* recherche transverse */
function openPal(){$("ovl").classList.add("open");$("q").value="";$("results").innerHTML="";$("q").focus();}
function closePal(){$("ovl").classList.remove("open");}
function doSearch(q){q=q.toLowerCase();const R=$("results");if(!q){R.innerHTML="";return;}let out="";
  const tks=Object.values(DATA.tickets).flat().filter(t=>(t.id+" "+t.t).toLowerCase().includes(q));
  if(tks.length)out+=g("Tickets")+tks.map(t=>hit(t.id,t.t.slice(0,40),"specs",`jumpTicket('${t.id}')`)).join("");
  for(const F of Object.values(DATA.features)){const scs=F.scenarios.filter(s=>(s.name+s.g.join()+s.t.join()).toLowerCase().includes(q));
    if(scs.length)out+=g("Scenarios")+scs.map(s=>hit("✔",s.name.slice(0,42),"BL-629",`S={root:'specs',ms:'M8',tk:'BL-629',sc:${s.n}};render()`)).join("");}
  [["docs",DATA.docs],["consti",DATA.consti]].forEach(([root,src])=>{for(const[cat,list]of Object.entries(src)){
    const ds=list.filter(d=>(d.f+" "+d.d).toLowerCase().includes(q));
    if(ds.length)out+=g(root==="docs"?"Docs":"Constitution")+ds.map(d=>hit("📄",d.d.slice(0,40),cat.split(" ")[0],`S={root:'${root}',cat:'${cat}',doc:'${d.f}'};render()`)).join("");}});
  [["brief",DATA.brief,"Briefings","📰"],["evid",DATA.evid,"Evidence","🔎"]].forEach(([root,list,label,ic])=>{
    const ds=list.filter(d=>(d.f+" "+d.d).toLowerCase().includes(q));
    if(ds.length)out+=g(label)+ds.map(d=>hit(ic,d.d.slice(0,40),d.f.slice(0,12),`S={root:'${root}',doc:'${d.f}'};render()`)).join("");});
  R.innerHTML=out||`<div class="note" style="padding:1rem">aucun résultat — essaie « override », « invariant », « expeditor »</div>`;}
function g(t){return `<div class="grp">${t}</div>`;}
function hit(id,txt,ctx,call){return `<div class="hit" onclick="${call};closePal()"><span class="id">${id}</span> ${txt} <span class="ctx">${ctx}</span></div>`;}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="p"){e.preventDefault();openPal();}if(e.key==="Escape")closePal();});
render();
</script>
