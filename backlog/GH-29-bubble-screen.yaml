id: GH-29
title: "bubble screen"
source: https://github.com/ldecorps/swarmforgevc/issues/29
description: |2
  Send note to Drop-down Agents
  Can also do
  Amend note
  Remove note

specifier_disposition: |
  2026-07-31 — NOT drained. Four words ("Send note to Drop-down Agents /
  Amend note / Remove note") are not enough to spec responsibly. Best
  reading is a Bubble screen that composes a `note` handoff to a chosen
  swarm role, with amend/remove of a pending one — but "drop-down agents",
  and whether amend/remove act on a queued handoff or on an approval-style
  card, are both guesses.

  Not asked, because `role_ask.bb` allows ONE pending question per role and
  the specifier's slot has been held since 2026-07-30 by the three-intake
  disposition question (see the INTAKE-*.md footers). Ask this the moment
  that slot clears, or the human can just answer it directly.

  2026-08-01 — the 07-30 question was answered and those three intakes were
  drained (BL-772..777), but the freed slot went to a different question (what
  a stray priority-00 note reading "use staging please" meant). GH-29 is
  therefore STILL unasked and is FIRST in line for the next free slot. On
  reflection GH-29 was the better use of it — do not repeat that ordering.
  The question to ask, unchanged: does "drop-down agents" mean a role picker
  on a Bubble note-composer screen, and do amend/remove act on a queued
  handoff or on an approval-style card?

  2026-08-02 — ASKED at last. The slot was free after the BL-638 spec parcel,
  and per the 08-01 note GH-29 took it ahead of anything else. Question posted
  to the specifier Telegram topic with three tappable options:
    1. Role picker; amend/remove a QUEUED handoff
    2. Role picker; amend/remove an APPROVAL card
    3. Role picker; amend/remove BOTH
  (free-text reply always available, so a fourth reading is not foreclosed).

  RESUME CONTEXT — for whoever holds the specifier hat when the answer lands,
  which on a mono-router pack is likely a later rotation, not this session:
  the answer arrives either live in the specifier pane or as a `note` from
  `ready_for_next.sh`. On receipt, drain GH-29 straight into a spec —
  do NOT re-ask. Everything except these two forks is already settled:
    - it is a Bubble screen (native Android, `android/`), not the LIVE
      holistic UI and emphatically not the static PWA, which has no write
      path at all (local-engineering Architecture Rule 5);
    - it composes a `note`, and a note's `message` is ONE line, 80 chars max
      (handoff-protocol) — that cap is a real UI constraint for the composer
      and should be stated in the spec, not discovered by the coder;
    - the role list is the pipeline roles the swarm actually runs.
  Still open beyond the asked question, and worth folding into the same spec
  once the shape is known: whether "remove" means un-queueing a delivered
  parcel (which the mailbox may not support idempotently) or only discarding
  an unsent draft. Prefer the draft-only reading if the human does not say.
