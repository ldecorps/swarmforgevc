id: BL-1077
title: "The launch guard ignores BAILIAN_TOKEN_PLAN_API_KEY, the very name the Qwen packs tell the operator to export, so a correctly-configured host is refused a launch and told a different variable is missing"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarm-intelligence-layer
priority: 10
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1077-a-documented-qwen-credential-name-is-honored.feature
human_approval: approved
approval_context: >
  One judgement call is yours, and it is the severity, because the number
  routes the ticket.

  Filed as medium, not high, deliberately. Today every Qwen pack window line
  carries the endpoint URL, so the defect hits the guard branch that FAILS
  LOUD - the launch is refused with a misleading message and nothing else
  happens. That is contained and nothing live is degraded.

  It would be high if the silent branch were reachable, because there the
  guard does not refuse: it simply declines to map, leaving whatever
  OPENAI_API_KEY the pane inherited from the shell profile in place, which on
  this host is a real OpenAI credential against a Qwen model name. That is a
  cross-provider key crossing, not an inconvenience. That branch becomes
  reachable the moment a pack ships whose window line carries no endpoint URL
  - which is exactly the shape BL-1052 is building right now. The coder has
  been told; if BL-1052 lands such a pack before this is fixed, raise this to
  high.

  Everything else here is settled: the packs already document the name, and
  two of the three credential paths already accept it, so this is bringing
  the third into line rather than choosing a new convention.

required_wiring:
  - 'swarmforge/scripts/swarmforge.sh::BAILIAN_TOKEN_PLAN_API_KEY::the accepted name must land at the site that generates the launch script, because a fix living only in a test fixture or an uncalled helper leaves every real launch refusing exactly as before'
  - 'specs/pipeline/steps/index.js::bl1077::the new step handler must be registered in the step registry, since specs/pipeline/runtime.js THROWS on any scenario with no handler and an unregistered file fails every scenario in this feature file rather than skipping them'

invariants:
  - "Every Qwen credential variable name that any launch entry point accepts is accepted identically by all of them. A name honored by one path and ignored by another IS this defect: the operator reads one document, exports one variable, and cannot know which of the three paths their launch happens to take."

description: |
  ## What is wrong

  `swarmforge/packs/qwen-mono-router.conf` tells the operator, in its own
  PREREQ block, exactly what to export:

      export BAILIAN_TOKEN_PLAN_API_KEY=sk-sp-...   # preferred; or QWEN_API_KEY

  The launch guard that `swarmforge/scripts/swarmforge.sh` generates for a
  Qwen pack (`qwen_guard`, both branches at lines 1578 and 1580) falls back
  only from `BAILIAN_CODING_PLAN_API_KEY`. It never reads
  `BAILIAN_TOKEN_PLAN_API_KEY`. An operator who follows the documentation
  literally, on a host where that is their only Qwen credential, gets:

      SwarmForge: QWEN_API_KEY required (launch CLI targets token-plan...)

  naming a variable the documentation never asked them to set, while the
  variable they did set sits in the environment unread.

  The name is not exotic and the swarm is not confused about it elsewhere.
  `start-swarm-qwen.sh` (lines 22-25) accepts it. `ancillary_provider_lib.sh`
  (lines 95-98) accepts it. Only the generated launch guard does not, which
  is why the wrapper script works and `./swarm --pack qwen-mono-router` does
  not. Three credential paths, two conventions.

  It is latent on this host only because the operator profile exports
  `QWEN_API_KEY` directly, so the fallback never has to fire. A fresh host
  provisioned from the documentation has no such luck.

  ## Why it is small

  The accepted-name set is three literals in two string constants. The
  behavior is already proven correct twice in this repo, so the fix is
  copying an existing convention into the one place that missed it, not
  designing one.

  ## How (direction, not mandate)

  Teach both `qwen_guard` branches the `BAILIAN_TOKEN_PLAN_API_KEY` fallback,
  ordered ahead of `BAILIAN_CODING_PLAN_API_KEY` to match
  `ancillary_provider_lib.sh` and `start-swarm-qwen.sh`, and leaving an
  explicitly-set `QWEN_API_KEY` untouched. Make the refusal message name
  every variable the guard accepts, so the next operator to hit it is told
  the truth rather than a third convention.

  The pack PREREQ text needs no correction: it was right, and the code was
  wrong. Do not "fix" the documentation to match the defect.

  The guard is currently a bash string constant interpolated into a generated
  script, which is awkward to test. Lifting the guard body into a sourceable
  helper beside `ancillary_provider_lib.sh` would make it directly testable
  and would give the invariant one obvious home - but that is a suggestion,
  not a requirement, and any approach that lets the scenarios run without
  launching a real swarm is fine.

  ## Testing constraints that matter here

  These are not generic hygiene; both have already bitten this repo.

  - The suite must never source the operator shell profile. `~/.zshenv`
    re-exports the real provider keys over fixture values, which is how a
    live OpenAI key leaked through a `swarmforge.sh` probe on 2026-08-22.
    Scrub the whole Qwen-family name set (`env -u`, or the existing BL-1049
    scrub) before each case, and assert on variable NAMES and fixture values
    only.
  - Fixture credentials are obviously-fake literals. No real key value goes
    near a test, a fixture, or a commit.

  Babashka and shell code in this project have no mutation, CRAP or DRY
  tooling wired (Engineering Rules, Startup Tools), so the gate is real unit
  coverage under `swarmforge/scripts/test/`. A hardening pass must record
  that degraded fallback rather than imply a mutation run happened.

notes: |
  Human 2026-08-23 (Cursor): HELD — focus swarm on Cursor-as-swarm-agent chain (1078→1079→1080[+1081]). Reinstate when that lands.
  Reported by the coder as a priority-00 note while holding BL-1052:
  "qwen-mono-router PREREQ names BAILIAN_TOKEN_PLAN_API_KEY; launcher ignores
  it". Verified at spec time before minting, per the standing rule to grep the
  named artifact rather than trust a symptom search: the name appears in
  `start-swarm-qwen.sh`, `ancillary_provider_lib.sh`,
  `harness_env_scrub_lib.bb` and the pack PREREQ, and is absent from both
  `qwen_guard` branches in `swarmforge/scripts/swarmforge.sh`. No existing
  ticket covers it - BL-1049 names the same variable but owns pane-env
  scrubbing, not the guard fallback.

  Relationship to BL-1052 and BL-1053: none of the three depends on another.
  BL-1052 builds the qwen-code seat and its own new pack, and its spec already
  describes the guard accurately as falling back from
  `BAILIAN_CODING_PLAN_API_KEY`, so nothing in BL-1052 is wrong and nothing
  there needs rebuilding. The overlap is forward-looking only, and is recorded
  in the approval context above.

  IR-DRY: five findings, all `possible-synonym`, none `duplicate`; all five
  reviewed and deliberately kept. Four of them separate the two guard branches
  (scenarios 01 and 04) or separate the outline placeholder `<key>` from the
  literal variable names scenario 02 must name in order to assert which of two
  credentials won. The fifth pairs a Given with a Then inside scenario 02.
  Collapsing any pair would delete the contrast the scenario exists to draw.

qa_e2e_procedure: |
  Run from a shell that does NOT carry the operator Qwen credentials - start
  by scrubbing them, since this host exports all of them and the defect is
  invisible while `QWEN_API_KEY` is set:

      env -u QWEN_API_KEY -u BAILIAN_TOKEN_PLAN_API_KEY \
          -u BAILIAN_CODING_PLAN_API_KEY -u BAILIAN_API_KEY bash

  1. Export ONLY the documented preferred name, with the real Token Plan
     credential: `export BAILIAN_TOKEN_PLAN_API_KEY=<real key>`.
  2. Launch the existing aider pack against a SCRATCH target, never the live
     repo: `./swarm <scratch-root> --pack qwen-mono-router`.
  3. Confirm the panes come up and the roles reach the Token Plan endpoint -
     before the fix this refuses with `QWEN_API_KEY required`.
  4. Scrub every Qwen name again and relaunch. Confirm the refusal now names
     all three accepted variables, not just `QWEN_API_KEY`.
  5. Export only `BAILIAN_CODING_PLAN_API_KEY` and relaunch. Confirm the
     legacy alias still works - this fix adds a name, it removes none.
  6. Export `QWEN_API_KEY` and `BAILIAN_TOKEN_PLAN_API_KEY` to two different
     values and confirm the explicit `QWEN_API_KEY` is the one that reaches
     the pane.
  7. Confirm no credential reached disk: `git -C <scratch-root> status
     --short` shows no generated file carrying a key, and `grep -rl` for each
     exported value across `<scratch-root>` and `swarmforge/packs/` prints
     nothing.

