description: |
  ## The locked human decision

  Verbatim, from the intake (human via Cursor, 2026-08-28 ~07:34 BST):

  > Workers **may** clear their context window when they hit `NO_TASK` **only
  > if** their current context is **at least 75% full**.

  > **Intent (verbatim):** do **not** pay for a reload when it is not needed.

  **Unavailable reading (locked 2026-08-28 ~08:05 BST, human via Cursor):**
  when no fullness reading can be obtained, **do not clear** — same intent
  (Scenario 04). Do not fall back to today's unconditional clear.

  ## What is wrong

  BL-141 shipped this gate for the extension-host path
  (`extension/src/swarm/idleClear.ts`, `contextFullness.ts`, setting
  `swarmforge.contextClear.fullnessThresholdPercent`, default 75).

  The agent-side path that roles actually take after `done_with_current` does
  not honour it. `swarmforge/scripts/ready_for_next_task.bb`:

      (defn maybe-clear-at-idle-boundary! []
        (when (and idle-boundary?
                   (handoff-lib/idle-clear-enabled? (handoff-lib/current-role)))
          (handoff-lib/respawn-self! (handoff-lib/current-role))))

  `ready_for_next_batch.bb` carries its own copy of the same function. Neither
  reads fullness. So whenever idle-clear is enabled and the call is
  `--idle-boundary` with `NO_TASK`, the role re-execs the launch script and
  re-pays the boot prefix and model reload — even with most of its window
  free. That is exactly the cost the human asked not to pay.

  ## Scope note that is easy to get wrong

  There are TWO call sites, one per receive mode. Roles configured `batch`
  (cleaner, hardener) go through `ready_for_next_batch.bb`; the rest go
  through `ready_for_next_task.bb`. Fixing one file leaves half the pack
  uncovered, and nothing in either file would reveal the omission — hence both
  are named in `required_wiring`.

  ## How (direction, not mandate)

  - **Gate the existing decision, do not rebuild it.** Add fullness as a
    second condition alongside `idle-clear-enabled?`; opt-in stays the first
    condition and stays authoritative.
  - **Reuse BL-141's contract rather than inventing a second one.** It already
    distinguishes an exact `telemetry` reading from a labelled deterministic
    `proxy` reading, and clamps. A second, differently-shaped notion of
    "fullness" on the bb side is how the two paths come to disagree about the
    same pane. Read the same setting key too, not a new one.
  - **Keep the decision pure and testable.** The comparison wants to be plain
    logic in a lib (the same pure/IO split as `branch_claim_guard_lib.bb` and
    `reference_freshness_lib.bb`), with the bb entry points doing only the
    reading and the respawn.

qa_e2e_procedure: >
  (1) On a live swarm, pick a role with idle-clear enabled and a freshly
  started pane (window mostly empty). Drive it to an idle boundary with
  NO_TASK and confirm it does NOT respawn — before this ticket it re-execs the
  launch script. Confirm by process start time and by the absence of a fresh
  boot-prefix render in the pane. (2) Repeat with the same role after its
  window is past the configured threshold and confirm it DOES respawn.
  (3) Repeat both against a batch-mode role (cleaner or hardener) so the
  ready_for_next_batch.bb path is exercised, not only the task path.
  (4) Set swarmforge.contextClear.fullnessThresholdPercent to a low value,
  confirm a role that previously stayed now respawns, and restore it.
  (5) Confirm a role with idle-clear NOT enabled never respawns at either
  fullness.

out_of_scope: |
  - Changing the 75% default. It is already the Spec/BL-141 default and the
    human's intake names it explicitly as out of scope.
  - Making idle-clear non-opt-in. The roles.tsv / window flag stays opt-in
    (BL-089); this ticket only adds a second condition to roles that already
    opted in.
  - Mid-task and mid-batch clears. Still forbidden, unchanged.
  - The extension-host path. BL-141 already gates it correctly; this ticket
    brings the agent side into line with it, not the reverse.

