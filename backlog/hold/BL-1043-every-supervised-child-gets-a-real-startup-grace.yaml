id: BL-1043
title: "The 3-arity `poll-heartbeat-stale?` passes `started-at-ms` as nil, so its grace clause can never fire - onboarder and negotiation_relay call exactly that arity and have NO startup grace at all, strictly worse than BL-1035's defeated one"
milestone: M8
type: defect
severity: high
# high, same as BL-1035 and for the same reason: a broken health signal that
# spends a bounded restart budget on a fault that is not there. Measured
# live, not read off the code. Not critical: the children do come back up
# and no work is lost.
status: todo
epic: swarm-reliability
assigned_to: none
priority: 14
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1043-every-supervised-child-gets-a-real-startup-grace.feature
human_approval: approved

invariants:
  - "No supervisor declares a freshly spawned child stalled before that child has had one full startup grace in which to produce its first heartbeat - and no call site can opt out of that grace by accident."
  - "A freshly spawned child is never judged on a heartbeat written by a process that is no longer running."

description: |
  ## The mechanism

  `front_desk_supervisor_lib.bb`'s `poll-heartbeat-stale?` has two arities:

      ([last-heartbeat-ms now-ms stall-ms]
       (poll-heartbeat-stale? last-heartbeat-ms now-ms stall-ms nil stall-ms))
      ([last-heartbeat-ms now-ms stall-ms started-at-ms startup-grace-ms]
       (if (and started-at-ms (nil? last-heartbeat-ms)
                (< (- now-ms started-at-ms) startup-grace-ms))
         false
         ...))

  The short arity passes `started-at-ms` as **nil**. The grace clause opens
  with `(and started-at-ms ...)`, so with nil it can never be true: **the
  short arity has no startup grace at all.** It even passes `stall-ms` as
  `startup-grace-ms`, which reads to a reviewer like a deliberate,
  generous grace - that argument is dead code and is never reached.

  Both of these call the short arity:

  - `swarmforge/scripts/onboarder_supervisor.bb:147`
  - `swarmforge/scripts/negotiation_relay_supervisor.bb:145`

  Neither clears its heartbeat file at spawn either, so BL-1035's stale-file
  problem applies on top.

  ## This is worse than BL-1035, not the same

  BL-1035's front-desk supervisor DOES pass a real grace; its bug is that a
  stale file left by the dead instance defeats the nil-guard. So a
  first-ever start there is still protected.

  Here there is no grace to defeat. The predicate reduces to
  `(or (nil? last-heartbeat-ms) (>= (- now-ms last-heartbeat-ms) stall-ms))`,
  and a missing heartbeat is stale **immediately** - so a first-ever start,
  with no file at all, is declared stalled on the first tick.

  ## Measured live, in `.swarmforge/operator/onboarder-supervisor.log`

      2026-08-21T17:15:50.006749Z started onboarder pid= 73633 attempt= 1
      2026-08-21T17:15:52.022265Z stalled onboarder no heartbeat within 120000 ms
      2026-08-21T17:15:54.074859Z started onboarder pid= 74442 attempt= 2

  **2.016 seconds**, against a declared 120000ms window. Across the whole
  log: 39 starts, 27 stalls, 14 `started`->`stalled` adjacent pairs of which
  **7 are under 10 seconds, the fastest 2.00s**. The other 7 are genuine
  long-gap stalls (median 1249s) and are the guard working correctly.

  There is one instructive non-firing case, the last start in the log
  (19:34:50): no spurious stall, because the previous instance had been
  healthy and left a FRESH heartbeat. **The supervisor is protected only by
  the dead process's leftovers** - it passes for precisely the wrong reason,
  and only when the predecessor was healthy, which is the case that least
  needs protecting.

  ## The reference implementation is already in the tree

  `cursor_bridge_supervisor.bb` gets both halves right and needs no change:
  it passes `(:started-at-ms entry)` with its own
  `CURSOR_BRIDGE_HEARTBEAT_STARTUP_GRACE_MS` (90000, line 107-109), and it
  calls `clear-poll-heartbeat!` at spawn (line 96) so the nil-guard actually
  fires. Copy that shape rather than inventing a third one.

  ## How (direction, not mandate)

  Give both supervisors a real startup grace and clear the stale heartbeat
  at spawn, as cursor_bridge does. Beyond that, the short arity should not
  survive as a trap for the next supervisor: a call site that does not ask
  for a grace should still GET one, or should not compile. Which of those it
  is, is the architect's call.

  ## Sequencing, for the coordinator rather than a `depends_on`

  BL-1035 is ACTIVE and its declared scope includes
  `front_desk_supervisor_lib.bb`'s `poll-heartbeat-stale?` - the very
  function whose short arity is this defect. **These two should not be in
  flight simultaneously.** Landing BL-1035 first is the cheaper order: this
  ticket then merges `main` and can retire the short arity against a
  settled function. Nothing here blocks on BL-1035's outcome, so this is
  ordering, not a dependency.

  ## Out of scope

  - The front-desk supervisor. That is BL-1035, and its siblings BL-1036
    (Telegram 409) and BL-1037 (restart cadence).
  - `cursor_bridge_supervisor.bb`, which is already correct.
  - `operator_runtime_supervisor.bb`, which does not use this heartbeat
    model at all - checked, not assumed.
  - Restart budgets, cadences, and give-up cooldowns. Only the false
    positive that spends them is in scope.

qa_e2e_procedure: >
  1. At the parent commit, reproduce for BOTH supervisors: start each with
     no heartbeat file present and watch its log. Confirm the defect -
     `started` followed by `stalled ... within <stall-ms> ms` within a few
     seconds, far inside the declared window.

  2. Confirm the second trigger too: leave a heartbeat file whose timestamp
     is already older than the stall window, start the supervisor, and
     confirm the same immediate stall.

  3. At the parcel commit, repeat both. Confirm each child survives its full
     startup grace and that exactly one spawn happens in that window.

  4. Confirm the guard is still ARMED, which is the regression that matters
     most: let a child run past its startup grace without ever writing a
     heartbeat and confirm it IS then declared stalled and restarted.

  5. Confirm the clearing case: let a child write a heartbeat during its
     grace and confirm no stall is declared.

  6. Confirm the trap is closed: call the staleness check the way a new
     supervisor would - without explicitly asking for a grace - and confirm
     a grace still applies (or that the call is refused outright).

  7. Read both supervisor logs for all of the above and confirm each stall
     is still recorded with the window it exceeded - BL-1035's intake
     constraint, which this ticket inherits and must not regress.

  8. Confirm `cursor_bridge_supervisor.bb`'s behaviour is byte-for-byte
     unchanged: it was already correct and is the reference, not a subject.

approval_context: >
  From a coder `note`: "onboarder+negotiation_relay supervisors get no
  startup grace (BL-1035 shape)". The coder is right, and probing it before
  writing turned it from a code-reading into a measurement.


  IT IS NOT QUITE THE BL-1035 SHAPE - IT IS WORSE. BL-1035's supervisor asks
  for a 90s grace and gets it defeated by a stale file. These two never ask:
  they call a convenience arity that passes `started-at-ms` as nil, and the
  grace clause tests `(and started-at-ms ...)`, so it cannot fire. The arity
  even passes the stall window in the grace slot, which reads like a generous
  grace and is dead code. So a first-ever start with no heartbeat at all is
  declared stalled on the first tick.


  MEASURED, NOT INFERRED. `onboarder-supervisor.log` has 39 starts and 27
  stalls; 7 of the 14 adjacent started->stalled pairs are under ten seconds,
  the fastest **2.00s against a declared 120s window**. The one recent start
  that did NOT stall is the tell: the previous instance had been healthy and
  left a fresh heartbeat, so the supervisor was protected by a dead process's
  leftovers - passing for the wrong reason, in exactly the case that needed
  protection least.


  TWO CALLS OF MINE.


  (1) **`severity: high`, matching BL-1035.** I have been deliberately
  conservative with severity this week, but this is the same broken health
  signal spending the same bounded restart budget, and it is strictly worse
  than the ticket already rated high. Rating it lower would be inconsistent
  rather than careful.


  (2) **One ticket for both supervisors, not two.** Same root cause, same
  fix, two call sites four lines apart in shape. Two tickets would be
  near-identical and would each have to re-establish the same evidence.


  ONE THING I FLAGGED RATHER THAN DECIDED. BL-1035 is ACTIVE and its scope
  names the very function whose short arity is this defect. I wrote the
  sequencing into the ticket - land BL-1035 first, then this merges main and
  retires the trap - but which order to run them is the coordinator's, not
  mine. They should not be concurrent.

