notes: |
  ## Runtime status of the two subjects

  - **onboarder** - live and exercised. Its log runs to 2026-08-21 19:44 and
    `.swarmforge/operator/onboarder-heartbeat.json` was rewritten
    2026-08-22 08:16, so the child is healthy and heartbeating; the false
    stalls are real and recent.
  - **negotiation_relay** - same code shape, but
    `.swarmforge/operator/negotiation-relay-supervisor.log` does not exist,
    so on this host it appears never to have run. Its defect is therefore
    LATENT and fixed here on the strength of the shared shape, not of its
    own incident. Do not spend a QA pass hunting for a relay log that is not
    there; construct the case instead.

  ## Related

  - **BL-1035** (active) - the front-desk sibling. See the sequencing note.
  - **BL-1036 / BL-1037** - BL-1035's other two siblings from the same
    intake. Untouched here.
  - `cursor_bridge_supervisor.bb` - the correct reference for both halves.

  ## IR-DRY judgment recorded

  4 findings -> 3. One was real drift: scenario 04's `When` omitted the
  timing qualifier its siblings carry, so it now reads "inside the startup
  grace" like the rest - more precise, not just DRYer.

  The remaining three are all deliberate CONTRASTS, which is what this
  feature is about: "declared stalled" against "not declared stalled" (a
  polarity pair the checker cannot see as negation, and the whole contract),
  "inside the startup grace" against "after the startup grace has passed"
  (the boundary itself), and "just spawned" against "just spawned and has
  written no heartbeat" (the short form is used where the next `Given` states
  the heartbeat situation instead). Collapsing any of them would erase the
  distinction the scenario exists to draw.

