description: |
  ## What BL-1022 uncovered

  BL-1022 widened the daemon's subprocess-API gate to follow process-spawn
  edges as well as load-file edges. The closure went 38 -> 53 files, and the
  new territory was not empty. Three live libraries in it make UNBOUNDED
  `babashka.process/sh` calls on the daemon's critical path - the same class
  of call whose stream-drain blocked forever and deadlocked handoffd in
  BL-1021.

  Seven call sites, all verified present at `main`:

  | File | Sites | Reached by |
  |---|---|---|
  | `handoff_inject_lib.bb` | `tmux!` (:42) | handoffd -> spawn `swarm_handoff.bb` -> load |
  | `pre_qa_gate_gather_lib.bb` | `run-git` (:32), `bb gherkin-parser` (:278), `node resolve_contract_steps.js` (:328) | handoffd -> spawn `swarm_handoff.bb` -> load |
  | `salvage_lib.bb` | `sh-out` (:38), `git tag` (:128), spawn of `swarm_handoff.sh` (:157) | ... -> load `ticket_close_guard_lib.bb` -> load |

  Every one of these is reached from `handoffd.bb:1756`, which spawns
  `bb swarm_handoff.bb` on the dispatch-gap, unassigned-active and open-slot
  sweeps. A wedged tmux, git, node or bb here is a wedged daemon.

  ## Why this is its own ticket, and why it is only worth doing now

  BL-1022 could not fix these: removing the banned API from a specific script
  was out of its scope by construction. So it did the honest thing and held
  them as a RATCHET - an equality assertion in
  `daemon_cycle_guard_lib_test_runner.bb` naming exactly these three files, so
  a NEW offender fails the gate and a STALE entry fails it too. That was
  strictly better than silence, and it is also a promise to come back. This is
  coming back.

  Until the ratchet is empty, the gate's headline assertion - "no subprocess
  path outside the chokepoint anywhere in handoffd.bb's reachability closure" -
  is still narrower than it reads, because three known files are carved out of
  it by name.

  ## How (direction, not mandate)

  - Route each call through `daemon-cycle-guard-lib/sh!`, the same bounded
    chokepoint BL-1021 put in front of `swarm_handoff.bb`. No new wiring is
    needed in any of the three: each already load-files `handoff_lib.bb`,
    which load-files `daemon_cycle_guard_lib.bb`.
  - `sh!`'s `split-sh-args` accepts all three shapes these files use - bare
    varargs, a leading opts map, and a command vector plus opts - so the
    conversion is mechanical. Verify that per site rather than assuming it:
    dropping a `:dir` silently runs git in the wrong repository, and nothing
    about that failure is loud (invariant 2).
  - `:continue true` at :278 and :328 appears to be inert (neither
    `process/sh` nor `process/process` throws on a non-zero exit; only
    `check`/`shell` do). Confirm rather than assume before dropping or keeping
    it.
  - Retire the ratchet in the SAME parcel: the assertion is an equality, so
    a fixed file still listed fails it. The gate should end up asserting the
    empty set, or the ratchet block should collapse back into the general
    "no offenders in the closure" assertion it was carved out of.
  - The undecided half is the acceptance-contract fail-open path - see
    `approval_context` above. Do not settle it in the parcel; it is an
    operator ruling.

  ## Scope

  - `swarmforge/scripts/handoff_inject_lib.bb`
  - `swarmforge/scripts/pre_qa_gate_gather_lib.bb`
  - `swarmforge/scripts/salvage_lib.bb`
  - `swarmforge/scripts/test/daemon_cycle_guard_lib_test_runner.bb` - the
    BL-1022 ratchet block only
  - `specs/features/BL-1031-bounded-chokepoint-covers-the-spawn-reachable-subtree.feature`
    and its step handlers

  Out of scope: widening the closure further or changing what
  `resolve-daemon-executed-paths` compares for the master-checkout drift check
  (BL-1022 deliberately left that alone); the value of the wait bound itself
  (BL-1008 covers bare-constant deadlines); and the acceptance-contract
  fail-open ruling, which is pending human approval above.

required_wiring:
  - "swarmforge/scripts/handoff_inject_lib.bb::daemon-cycle-guard-lib/sh!::tmux! must reach the bounded chokepoint, not babashka.process directly"
  - "swarmforge/scripts/pre_qa_gate_gather_lib.bb::daemon-cycle-guard-lib/sh!::the git helper and the parser/resolver shells must reach the bounded chokepoint"
  - "swarmforge/scripts/salvage_lib.bb::daemon-cycle-guard-lib/sh!::sh-out, the tag call and the swarm_handoff.sh spawn must reach the bounded chokepoint"

qa_e2e_procedure: >
  1. Confirm the debt exists at the parent commit: grep the three files for
     `process/sh` and confirm seven call sites, and run BL-1022's gate
     (`bb swarmforge/scripts/test/daemon_cycle_guard_lib_test_runner.bb`) and
     confirm it PASSES only because the ratchet names those three files.

  2. At the parcel commit, run the same gate and confirm it passes with the
     ratchet EMPTY (or removed) - i.e. the general closure assertion now
     covers those files with nothing carved out. A gate that passes because
     the ratchet was widened rather than emptied is the defect, not the fix.

  3. Prove the gate can still go red: reintroduce a bare `process/sh` in one
     of the three files, run the gate, confirm it FAILS naming that file and
     that line, then revert and confirm green. A ratchet that cannot fail
     after being emptied is not gating (scenario 05).

  4. Prove the bound is real, per file: with
     SWARMFORGE_SUBPROCESS_WAIT_BOUND_MS=2000, drive each of the three
     converted helpers at a child that never exits, and confirm each returns
     inside ~2s with exit 124 rather than hanging (scenario 02). A `sleep 600`
     child is sufficient; also cover a child that exits promptly while a
     grandchild holds the pipe open, which is the BL-1021 shape the exit-code
     bound alone misses.

  5. Prove options survived: call salvage_lib.bb's `sh-out` with a `:dir` of a
     DIFFERENT git repository than the process cwd and confirm the result
     reflects that directory (scenario 03). This is the silent failure mode of
     the conversion - it looks fine and reads the wrong repo.

  6. Confirm a bound hit is not silent on the acceptance-contract path: force
     the step resolver to exceed the bound and confirm the pre-QA gate's output
     NAMES the wait-bound hit and is distinguishable from a clean check
     (scenario 04) - under whichever fail-open/fail-closed ruling the human
     gave in `approval_context`.

  7. Confirm the daemon still works end to end: with the parcel commit live,
     send a real handoff through `swarm_handoff.sh` and confirm it delivers,
     and confirm handoffd's dispatch-gap sweep still fires (its spawn of
     `bb swarm_handoff.bb` now nests a bounded call inside a bounded call).

  8. Confirm the acceptance feature runs: all five scenarios (seven example
     rows) execute with registered handlers, no runtime THROW on a missing
     handler.

notes: |
  Human 2026-08-23 (Cursor): HELD — focus swarm on Cursor-as-swarm-agent chain (1078→1079→1080[+1081]). Reinstate when that lands.
  ORTHOGONALITY - read before promoting. This ticket edits
  `swarmforge/scripts/test/daemon_cycle_guard_lib_test_runner.bb`, which is the
  file BL-1022 is currently rewriting, and the ratchet block it retires does
  not exist until BL-1022 lands. `depends_on: [BL-1022]` is therefore a real
  ordering constraint, not just provenance: do not run these two concurrently,
  and do not promote this one until BL-1022 has reached `done/`. The coder must
  merge `main` before starting, or the ratchet will not be there to retire.

  NESTED BOUNDS are expected and are not a defect. handoffd spawns
  `bb swarm_handoff.bb` under a 60s bound; after this ticket the calls INSIDE
  that child are also bounded at 60s, so an inner call at 59s can blow the
  outer bound. Both layers are bounded either way - the outer bound destroys
  the tree - so the daemon is never unbounded. If the operator wants inner
  bounds strictly under the outer one, that is a separate ticket about the
  bound VALUE (BL-1008's family), not this one.

  SAME FAMILY as the repo's standing lesson that a derived guard still has a
  depth. BL-1021 was the outage, BL-1022 was the reason it was invisible, and
  this is the debt that becoming visible revealed. It is the third ticket in
  one chain, and each was found only because the previous one looked one hop
  further than the last.
