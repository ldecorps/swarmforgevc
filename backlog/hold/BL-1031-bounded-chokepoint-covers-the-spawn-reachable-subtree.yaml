human_approval: approved
approval_context: >
  Needs sign-off on ONE decision, and it is a live operational trade-off, not a
  style question. Two of the seven call sites are the acceptance-contract gate's
  own tools: pre_qa_gate_gather_lib.bb shells the vendored `bb gherkin-parser`
  (line 278) and `node specs/pipeline/scripts/resolve_contract_steps.js` (line
  328). Today a non-zero exit from either folds into `:loadable false`, and
  acceptance_contract_gate_lib.bb's `evaluate` treats that as a WARNING with no
  finding - it FAILS OPEN by documented design. Bounding those two calls creates
  a new way to reach that path: a healthy-but-slow parser or resolver on a loaded
  host now returns exit 124 and the acceptance-contract gate silently stops
  gating, with only a warning to show for it. The alternatives are (a) keep the
  existing fail-open and accept that a loaded host can disarm the gate, (b) treat
  a wait-bound hit specifically as a finding (fail CLOSED) while a genuine
  resolver crash keeps failing open, or (c) give these two call sites a longer
  bound than the daemon default so a timeout means something is really wedged.
  The direction below is (b), on the grounds that "we could not check" and "we
  checked and it was fine" must never be the same outcome - but a wrong call here
  either blocks legitimate handoffs on a busy Mac or quietly turns a QA-edge gate
  off, so it is the operator's ruling, not the implementer's.

invariants:
  - "Every subprocess call in a file the handoff daemon can reach, by any edge kind, runs under the bounded chokepoint - a call added to a spawn-reachable file is inside the bound by construction, not by anyone remembering."
  - "Converting a call site preserves its options and its result contract: a call that carried a working directory still runs in that directory, and every outcome the caller could already distinguish it still distinguishes."
  - "A wait-bound hit is surfaced by name at the call site - never absorbed into an outcome indistinguishable from a check that ran and passed."

