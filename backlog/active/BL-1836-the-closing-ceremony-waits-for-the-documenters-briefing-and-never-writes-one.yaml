     nothing, or only callers the evidence names.
  6. No register row names BL-1836: hotfix 4d089d21e5 retired both.
  After the land (the specifier's or coordinator's check on the next
  closing ceremony, not QA's): `.swarmforge/daemon/closing-ceremony-state.json`
  has no `briefing-composed-headless`, and the day's briefing on main is a
  documenter commit ("Compose the ..."), landed before the stop or after
  the restart.

