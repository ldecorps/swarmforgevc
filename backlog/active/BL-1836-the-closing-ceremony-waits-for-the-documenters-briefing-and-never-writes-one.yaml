id: BL-1836
title: "At its hard deadline the closing ceremony composes the headless git-log briefing and commits it, so the documenter finds a briefing on main and writes none - every morning email from 2026-09-23 was that dump; the human ruled to wait for the documenter and, if it has not finished when the swarm must be down, stop without a dump and let it write after the restart - the ceremony lands the documenter's briefing the moment it exists, ends when the day is recorded as sent in the ledger's own {\"sent\": [...]} shape (it read a bare list and never matched), and never writes a briefing itself"
milestone: M8
type: defect
severity: high
# high: a live fault degrading behaviour (the human's morning briefing has
# been a raw dump for eight days), and this ticket owns a standing red at
# first sighting: BL-1640's feature, scenarios 01-02, red on main since
# 2026-09-22 (register rows added in this mint, 2026-09-05 amendment).
status: todo
epic: swarm-reliability
priority: 2
direction: human-intake
