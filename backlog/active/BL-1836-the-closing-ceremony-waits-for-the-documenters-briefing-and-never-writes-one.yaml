human_approval: approved
approval_context: >
  A new feature file; the one choice was put to the human and answered
  (A, 2026-09-30, source), so no ruling_options. FIRM: the ceremony never
  composes or commits a briefing itself; every briefing it puts on main is
  the documenter's commit, byte-identical. FIRM: the limit is the existing
  hard deadline; past it the swarm stops with no briefing written, loud,
  and the documenter writes it after the restart. FIRM: a briefing already
  on main, or recorded as sent, ends the ceremony without the missing
  alarm.

invariants:
  - "Every briefing the closing ceremony puts on main is the documenter's own commit, byte-identical; the ceremony composes none."
  - "The ceremony never stops the swarm while a documenter commit adding only the day's briefing exists and is not yet on main."
  - "The ceremony reads docs/briefings/.sent.json in the shape the email sweep writes (one shape, asserted on both sides, BL-897)."

source: |
  Root intake `backlog/INTAKE-pretty-documenter-shift-briefings-20260930.md`
  (also `.swarmforge/operator/INTAKE-pretty-documenter-shift-briefings-20260930.md`),
  the human via Let's Talk, 2026-09-30 ~10:47 BST; drained by the
  specifier the same day into BL-1835 (the root cause, 810f0cd0e3), this
  ticket (the human's ruling), and a documenter.prompt amendment. The
  human's sentences, verbatim (Article 5.3; BL-1835 carries them too):

  > Est-ce qu'il y aurait moyen d'avoir le documenteur qui fait des jolis briefs comme c'était le cas, il y a une semaine ou plus avec en intro ce qui s'est passé pendant le shift et puis à la fin un petit, il y a des suggestions pour améliorer le process ce genre de choses, mais parce que là les derniers étaient vraiment moches.

  The preceding turn, recorded in the intake as verbatim:

  > the emails for about a week have been quite ugly; go back to the state of a week ago when it was pretty, with a small intro saying what happened during the shift, a pause, then a bit of ticket detail (opened, closed, and so on).

  The ruling, human via Let's Talk, 2026-09-30 ~10:50 BST:

  > C'est ça le fixe qu'il faut laisser. Il faut attendre que le documentaliste est fini avant de fermer le shift.

  The specifier's question (role_ask, 12:36Z): if the documenter still
  has not finished by the time the swarm must be down before the next
  shift, what then - A stop anyway, no dump, the documenter writes the
  briefing right after the restart; B keep waiting, the next shift stays
  frozen; C send the old headless dump, then stop. The human's answer,
  typed in the specifier pane ~13:00Z, verbatim:

  > A: stop, no dump, documenter writes after restart (recommended)

description: |
  ## What happens today

  - `nightClosingCeremonyLive.ts` `advanceBriefing` waits in the briefing
    phase until `briefingAlreadySent`, else until `hardDeadlineMs`, then
    emits `ensure-briefing` + `night-stop`.
  - `night-closing-ceremony-run.ts` `applyEnsureBriefing`: lands the
    documenter branch's briefing-only commit (`landDocumenterBriefing`),
    otherwise runs `composeHeadlessBriefing`
    (`compose_banked_briefing_cli.bb`, first line "Closing ceremony -
    headless briefing for <day>") and commits it. BL-1641 built both.
  - `briefingSent` parses `.sent.json` as `string[]`. The sweep writes
    `{"sent": [...]}` (`briefing_email_lib.bb`), so it never matches in
    production; every ceremony runs to its deadline.
  - Result, 2026-09-23..09-30: headless dump at the deadline, stop, and
    the documenter's "briefing <date> already on main" after the restart.

  ## What is wanted

  1. In the briefing phase, on any tick, a documenter commit that adds
     only `docs/briefings/<day>.md` and is not on main is landed
     byte-identical, as BL-1641 lands it today at the deadline (scenario
     01, both rows). Landing is not the missing alarm.
  2. The sent check reads the ledger's real shape; a day recorded as sent
     ends the ceremony with `send-confirmed` (scenario 02).
  3. At the hard deadline: nothing is composed. With no briefing on main
     and none on the documenter branch: `briefing-missing`, loud, stop
     (scenario 03). The documenter's instruction is left where it is, and
     with no dump on main its "already on main" check does not stop it
     after the restart. With the briefing already on main: stop, not loud
     (scenario 04).
  4. Retire BL-1641's feature scenarios 01-04 (retire, never reword): each
     asserts either the headless composer or the missing alarm after a
     briefing exists. Leave the feature file as a scenario-less tombstone
     whose narrative names the ticket that took its scenarios out, and
     retire its step handler,
     property test and shell test. `compose_banked_briefing_cli.bb` and
     its test lose their only caller: remove them if `grep` still finds no
     other. `banked_briefing_lib.bb` stays; handoffd's banked mode (BL-308)
     uses it.
  5. BL-1640's shell fixture: hotfix 4d089d21e5 (2026-10-01) already
     writes the simulated day (`sent_today <root> 2026-09-21`), so the red
     is gone and both register rows are retired. Review that commit; this
     ticket is its stamp-off. What is left here: the fixture still writes
     the bare-list shape the current reader takes. When item 2 moves
     `briefingSent` to the sweep's real `{"sent": [...]}` shape, move
     `sent_today` to that shape in the same commit, or BL-1640's 01-02 go
     red again.

  ## How (direction, not mandate)

  - The ledger shape belongs to `briefing_email_lib.bb`
    (`load-sent-briefings` / `record-briefing-sent!`). Mirror it in the TS read and pin
    both literals with a test (BL-897).
  - Step handler `specs/pipeline/steps/bl1836CeremonyWaitsForTheDocumenterSteps.js`,
    registered in `specs/pipeline/steps/index.js` in the same commit as
    the feature's first green run (BL-233). BL-1641's handler already
    builds the git fixture with a main and a documenter branch and drives
    the run CLI with stand-in deps. Move what you need, then retire it.
    Fixtures under mkdtemp, `git init`, proven by `rev-parse
    --git-common-dir` before any git command (BL-1390).
  - The documenter moves BL-1641's reference/how-to pages that describe
    the headless composer to `docs/deprecated/` and links them from
    `docs/index.md` (Article 3.6).

  ## Scope

  `extension/src/quality/nightClosingCeremonyLive.ts`,
  `extension/src/tools/night-closing-ceremony-run.ts` and their unit
  tests; the `retires:` paths; `compose_banked_briefing_cli.bb` and
  `test_compose_banked_briefing_cli.sh` if unreferenced; the step
  handler and its registration; docs; evidence.

out_of_scope: |
