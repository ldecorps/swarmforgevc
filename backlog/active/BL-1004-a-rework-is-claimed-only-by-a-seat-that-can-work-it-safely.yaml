id: BL-1004
title: "BL-983's one stage queue lets a bounce be claimed by a seat that holds none of the parcel's history, so a rework gets authored on a tree without the work it is reworking - measured live on BL-994, where the fix commit does not have the build as an ancestor"
milestone: M8
type: defect
severity: high
status: todo
epic: multi-seat-stages
priority: 20
direction: pipeline-note
depends_on: [BL-983]
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1004-a-rework-is-claimed-only-by-a-seat-that-can-work-it-safely.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl1004::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "A deferral is always bounded. No parcel waits on this decision forever - every path that declines a claim carries a deadline after which some seat claims it, and a stage whose other seat never returns still drains."
  - "Seat identity never escapes the mailbox layer - BL-983's own invariant, unchanged. The decision is taken inside the claim path; no downstream role, board, metric, or forwarded parcel learns which seat did the work."
  - "A single-seat stage is behaviourally identical to today for every input. The deferral path is unreachable when a stage has one seat, so this ticket cannot regress the seven single-seat stages."

description: >
  BL-982 gave a stage seats with their own models; BL-983 gave the stage ONE
  addressable queue and let any idle seat claim from it. Seat selection is
  therefore a pure race - `handoff_lib.bb`'s `stage-queue-dir` resolves every
  seat of a stage to the stage-named row's mailbox, and whichever seat runs
  `ready_for_next.sh` first claims what is there. There is no seat-selection
  logic at all today.

  That is correct for FRESH work and wrong for a REWORK. Seats do not share a
  worktree: `coder` is on `swarm/coder` in `.worktrees/coder`, `coder@sonnet2`
  is on `primary/coder-sonnet2` in `.worktrees/coder-sonnet2` (verified in
  `.swarmforge/roles.tsv` and `git worktree list`). A bounce addressed to the
  STAGE can therefore be claimed by a seat that has none of the parcel's
  history.

  MEASURED, not hypothesised - BL-994 on 2026-08-20:

  - The build `782b343a4` is a first-parent commit on `primary/coder-sonnet2`:
    seat coder@sonnet2 built it.
  - The hardener bounced a `git_handoff` addressed to `coder`, commit
    `a05fc0cc27`, payload `merge_and_process hardender a05fc0cc27`.
  - Seat `coder` claimed it and committed the fix `080b30253`. Its only parent
    is `9be8e9a90`, a merge of `origin/main`;
    `git merge-base --is-ancestor 782b343a4 080b30253` is FALSE. The fix for
    the parcel was authored on a tree that did not contain the parcel.
  - It merged `a05fc0cc27` afterwards at `ce52f9b42` and forwarded that, so
    the FORWARD's lineage is sound (both `a05fc0cc27` and `782b343a4` are
    ancestors) and the delivered tree is correct - verified by reading it.

  So the observed outcome was fine. Nothing made it fine. The constitution's
  "Forwarded Commits Carry Their Lineage" already says merge FIRST, then work,
  then forward; on a single-seat stage, working before merging is a mild slip
  because the seat's branch already holds the parcel. On a multi-seat stage it
  is a different thing entirely, and two hazards were live for the whole
  window:

  - The reconciling merge had to compose two independent edits to the same two
    files and owed no conflict marker for a drop - the BL-571 / BL-954 /
    BL-958 silent-revert family, which has already bitten this swarm four
    times.
  - The verification was blind. The fix targets BL-929 scenario 03's amended
    assertion, which reads the ticket out of the fullscreen Expand head. On
    PRE-patch code `buildFullscreenHeadHtml` renders the same ticket block
    (`main:extension/src/bridge/residentSpyUiHtml.ts:500-502`), so that
    scenario passes identically with and without the layout patch. A green run
    on the unmerged tree proves nothing, and looks exactly like a real pass.

  The property this ticket buys: a stage queue hands a rework only to a seat
  that can work it safely, and when it cannot, it says so out loud.

  How (direction, not mandate) - two mechanisms both satisfy the property and
  both are one sitting. Pick one; do not build both:

  1. SEAT AFFINITY IN THE CLAIM PATH. A seat about to claim a `git_handoff`
     whose `task:` a SIBLING seat has already worked defers it. The primitives
     exist: `stage-sibling-seats` already enumerates the siblings and their
     mailbox roots, and a seat's `completed/` (plus `in_process/`) is a
     durable record of the tasks it has worked - no new state to invent.
     Bounded by invariant 1: past a deadline any seat may claim.
  2. MERGE-BEFORE-WORK ENFORCED AT THE CLAIM. The claim refuses to hand a
     `git_handoff` to a seat until the named `commit:` is an ancestor of that
     seat's branch, i.e. it makes `merge_and_process` mechanical rather than
     advisory. Generic - it would also catch the same slip on a single-seat
     stage - but it changes the claim contract for every stage, which
     invariant 3 then has to carry.

  The architect settles which. What is NOT negotiable is the property and the
  three invariants.

constraints: >
  - Do NOT change the pipeline order, the address on a forward (parcels stay
    STAGE-addressed - BL-983's design is right and is not being reversed), or
    the one-queue-per-stage layout. This ticket adds a decision at the CLAIM,
    nothing else.
  - Do NOT implement BL-1001's difficulty-aware routing here, and do not
    depend on it. BL-1001 decides which seat gets a ticket FIRST, by
    `mutation_cost` against a declared tier; this decides who may claim a
    REWORK of a parcel that already exists. They are orthogonal and must land
    independently - this one does not wait for BL-1001.
  - The BL-994 parcel is IN FLIGHT (at the cleaner as of 2026-08-20 21:01Z,
    commit `ce52f9b42c`). Do not touch it, revert it, or "tidy" either coder
    seat's branch as part of this work. It landed correctly; this ticket is
    about the next one.
  - No hand-maintained list of seat names anywhere. Seats are read from
    `roles.tsv` via the existing BL-982 parse, per invariant 2 of BL-1001
    ("a seat's tier is DECLARED, never inferred from its name") and this
    codebase's standing rule against spelling lists.

qa_e2e_procedure: >
  From the repo root:

  1. Reproduce the hazard at the parent commit, on fixtures rather than the
     live swarm: build a two-seat stage in a fixture root (a stage row plus an
     `@`-seat row in `roles.tsv`, separate worktrees), have seat B complete a
     task, then enqueue a `git_handoff` for that same task to the stage and run
     the claim as seat A. At the parent commit seat A claims it. That is the
     defect.
  2. At the parcel commit, re-run 1 and confirm seat A declines and the parcel
     is still in the stage queue, while seat B claims it.
  3. Confirm invariant 1 by advancing the fixture clock past the deadline and
     re-running as seat A: it now claims, and the claim output says the seat
     did not build this parcel. Use the pinned fixture clock, not a real sleep.
  4. Confirm invariant 3 on the SEVEN single-seat stages, not by argument: run
     the existing handoff/claim shell and bb suites unchanged and confirm no
     diff in behaviour, plus the scenario 03 case where a single seat reclaims
     a task it has itself already worked.
  5. Confirm invariant 2 by grepping a forwarded parcel and the pipeline board
     for the seat id: `coder@sonnet2` must appear in neither. A forward still
     names the stage.
  6. Run the acceptance feature and confirm all five cases pass (three Examples
     rows plus scenarios 02 and 03), and that the handler is registered in
     `specs/pipeline/steps/index.js`.
  7. Prove non-vacuity: remove the deferral decision and confirm scenario 01's
     first Examples row fails while the other two stay green; restore it, then
     remove the deadline and confirm scenario 02 fails. Revert both.
  8. Wiring check the gate cannot make for you - this ticket's whole value is a
     call site, so confirm by hand that the decision is reached through the
     REAL `ready_for_next.sh`, not only through a unit-tested predicate. A
     library nobody calls is the BL-419 shape and would pass every step above.

notes: >
  Source: coordinator `note` of 2026-08-20 20:56Z - "FYI: BL-994 bounce landed
  on a different coder seat than build - BL-981?". Their read was right and
  their pointer was right: it belongs to the BL-981 multi-seat epic. It is NOT
  covered by any existing slice - BL-982 (done) gives a seat its own model,
  BL-983 (done) gives the stage one queue and is the thing that created this
  exposure, BL-1001 (paused) routes FRESH work by difficulty. None of them
  decides who may claim a rework. Recorded on the epic in the same pass:
  BL-981's `decomposes_into` now names BL-1004, and its `remaining_slices`
  carries the slice with the measurement.

  BL-983's own invariant is the proximate cause and is worth quoting, because
  it is not wrong - it is just silent on rework: "Seat identity never escapes
  the mailbox layer: a seat forwards to the next STAGE, so no downstream role,
  board, or metric ever learns which seat did the work." Invariant 2 above
  preserves it verbatim; both candidate mechanisms keep the decision inside
  the mailbox/claim layer.

  Severity `high`, deliberately, and it is a judgement call worth stating.
  Nothing is down and BL-994 itself landed correctly, which argues `medium`.
  What puts it at `high` is that the broken thing is a SAFETY property, not an
  output: the swarm produced a rework commit with no lineage to the work it
  reworked, and the only reason that was harmless is a merge that happened to
  compose. It recurs on the next bounce - both coder seats are live now - and
  the blind-verification half means a future recurrence can present as a clean
  green run. A broken safety signal is the `high` band as this role defines it.

  `human_approval` deliberately OMITTED, not forgotten. There is no design
  decision needing the operator's sign-off here: the property follows from
  constitutional law they already ratified ("Forwarded Commits Carry Their
  Lineage"), the wait-is-acceptable posture is already their ruling on BL-1001,
  and the one genuinely open choice (which of the two mechanisms) is the
  architect's, not theirs. Marking it `pending` would only block promotion of a
  live-hazard defect while nobody was actually waiting on an answer.

  Only ONE `required_wiring` entry, and that is the considered choice. The
  value of this ticket IS a call site, so a wiring entry on it is tempting -
  but the call site's file depends on which mechanism the architect picks
  (`ready_for_next_task.bb` vs `handoff_lib.bb`), and a pattern naming a
  literal nobody will write is the BL-874 failure: it arms the gate against an
  unmatchable string and blocks the documenter's forward to QA for no reason.
  `qa_e2e_procedure` step 8 carries that obligation instead, end-to-end through
  the real `ready_for_next.sh`, which is a stronger check than a grep.

  IR-DRY run: 6 medium-confidence findings, all reviewed and all kept. Every
  one is the same inherent class - the Scenario Outline's parameterized step
  paired against the literal instances of it in scenarios 02 and 03
  (`the prior worker of that task is <prior>` vs `... is cleaner`,
  `seat <asking> asks for its next task` vs `seat coder asks ...`). One step
  handler regex serves each pair; merging them is not possible without either
  deleting the edge cases or bolting a condition onto a step, which would hide
  which case a regression broke. No Background hoisting of the two-seat Given:
  scenario 03 is deliberately single-seat, so hoisting it would contradict the
  scenario that proves invariant 3.

