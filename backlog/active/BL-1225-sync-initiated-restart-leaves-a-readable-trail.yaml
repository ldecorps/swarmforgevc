  by-hand timestamp correlation - but it is the human's call whether an
  optional bullet earns a slice at all. Second, the log fix is scoped to
  appending rather than to the larger change of routing the whole restart
  through start_operator_runtime.sh. That larger change would fix the log as a
  side effect and would also close a documented convention breach, but it
  carries a behaviour question this slice must not answer (what a sync should
  do when SWARMFORGE_SKIP_OPERATOR is set), so it is recorded as a remaining
