description: |
  ## Status: hotfix 1bbc66bc1d landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  The local-model coder seat keeps a model resident on the GPU, and the
  fans stay loud for as long as that model is loaded. Stopping the seat
  by hand is not enough: babysitter's half-launch check treats a pane
  with no qwen as a fault and its repair starts the seat again, which
  loads the model and brings the fans back.

  ## What landed

  /gpu in the control topic posts 30 minutes, 1 hour, and 2 hours.
  Fans back on, and the text `/gpu off`, clear the marker. Arming writes
  `.swarmforge/operator/gpu-pause.json` first, then stops qwen under each
  local-model pane, asks Ollama to unload the model, and stops a
  leftover llama-server. ollama serve stays up. The marker is not
  control-pause.json, so intake is not frozen.

  While pause-active? is true, babysitter stamps every local-model role
  :gpu-quiet?. Check 1 returns no finding and no ensure-session repair.
  The remote-control unavailable note, the stuck-parcel warning, the
  busy-but-frozen warning, and that role's claim-risk finding are
  skipped the same way. When untilMs passes, the next sweep sees an
  ordinary missing process and repairs the seat.
