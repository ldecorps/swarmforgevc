id: BL-1010
title: "A secondary swarm publishes fleet status under the primary's name - TypeScript resolves swarm_name from the conf only and never reads the identity file the launcher actually writes"
milestone: M8
type: defect
severity: medium
status: todo
epic: fleet-topology
priority: 6
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1010-a-secondary-swarm-publishes-under-its-own-name.feature

required_wiring:
  - "extension/src/bridge/holisticProjections.ts::swarm-identity::readSwarmName must actually reach the identity file. This literal appears ZERO times in that file today, so the pattern cannot match before the work is done, and a conf-only reader carrying only a comment about the identity file would leave it absent"
  - "specs/pipeline/steps/index.js::bl1010::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "One resolution order everywhere: every TypeScript reader of this swarm's own name resolves it identically to swarm_identity_lib.bb - identity file, then conf, then the shared default - with no caller keeping a private order of its own."
  - "No cross-name write: publishing fleet status from a tree whose identity names swarm X writes only under X. No input, and no absent input, causes a write under any other swarm's name."

description: >
  WHAT. Make TypeScript resolve this swarm's own name the same way Babashka
  and the Telegram fleet credentials already do, so a secondary swarm
  publishes its health under its own name; and make the secondary bring-up
  path require whatever the publisher needs in order to run at all.

  Operator naming: swarm1 / swarm2, short s1 / s2. s1 is the Mac primary
  coordinator swarm, wire name `swarm_name primary`. s2 is the WSL2 secondary,
  wire name `swarm_name second`, checkout /home/carillon/code/swarmforgevc,
  pack second-swarm, remote-control names already SwarmForge-Second-*.

  WHY (all three legs re-verified against live code at spec time, not taken
  from the report):
  - swarmforge/scripts/swarm_identity_lib.bb read-swarm-identity reads
    .swarmforge/swarm-identity, the file swarmforge.sh's write_swarm_identity_file
    actually writes, and only falls back to a default.
  - extension/src/bridge/holisticProjections.ts readSwarmName delegates to
    util/swarmforgeConfig readConfigValue, which reads
    swarmforge/swarmforge.conf and nothing else, returning the default
    "primary" when the key is absent. The identity file is never consulted.
  - extension/src/tools/emit-fleet-status.ts buildFleetStatusDoc names the
    published document from readSwarmName, and emitFleetStatus writes to
    fleetStatusPath(doc.identity.name). So on the live s2 tree - whose conf
    carries no swarm_name and whose identity file says `second` - the emit
    would publish s2's health as "primary" and write over the primary's own
    status document on any host the two share.

  The two agree on the Mac today only by coincidence: its conf also carries no
  swarm_name and its identity file also says primary. That coincidence is
  exactly what has kept this invisible.

  Compounding it, /home/carillon/code/swarmforgevc has no compiled
  extension/out at all, so handoffd's fleet-status-sweep fails every cycle
  with a module-not-found naming a build artifact rather than the bring-up
  step that is missing. Fixing the compile WITHOUT fixing the name would turn
  a loud repeated error into a silent mis-publish, which is why both halves
  are one ticket - and it is the intake's own suggested slice 1, verbatim:
  "Fix emit name source + s2 checkout compile/docs (unblocks same-host fleet)."

  HOW (direction, not mandate). One shared TypeScript resolver mirroring the
  Babashka order, used by every existing readSwarmName caller
  (emit-fleet-status, backlogDashboard, bridgeState) so none keeps a private
  order. Because no import can bridge TypeScript and Babashka, the shared
  default literal needs a test asserting the two agree - a "kept in sync"
  comment is not a gate and drift there fails silently. Scenario 03 is that
  test's acceptance face.

  NON-GOALS, verbatim from the intake. "Auto-registering s2 as a peer
  coordinator." "Requiring a second Telegram front-desk / getUpdates poller
  for presence." "Replacing `swarm:` ticket assignment (still the work-routing
  mechanism; value remains `second` unless a rename ticket changes wire names
  to `s1`/`s2`)." And, verbatim: "Do not invent a second primary coordinator.
  s2 remains secondary (`swarm_mode secondary`)."

  SEVERITY medium, deliberately. The broken health signal belongs to s2 only;
  s1's own fleet status is unaffected and no swarm behaviour is degraded - s2
  works, it is merely invisible to fleet tooling. The clobber is latent rather
  than live, because the two swarms are on different hosts today and
  ~/.swarmforge/fleet/ is host-local.

  DEFERRED, deliberately. The intake's desired-behavior 4 also asks for a
  durable channel by which the s1 coordinator learns that s2 exists across
  hosts. Its thin v1 - the standing prose telling the coordinator that s2 is
  an assignable capacity and how to assign to it - was landed by the specifier
  directly on main rather than ticketed, since a role prompt is the
  specifier's own deliverable to land (see notes). The machinery half - a
  roster s1 can actually READ to know s2 is UP across hosts - needs a
  cross-host transport that does not exist and cannot be estimated without
  choosing one, so it is recorded on epic fleet-topology (BL-543)
  remaining_slices rather than minted unestimable.

qa_e2e_procedure: >
  1. On the Mac (s1), confirm swarmforge/swarmforge.conf still carries no
     `config swarm_name` line and .swarmforge/swarm-identity says primary. Run
     `node extension/out/tools/emit-fleet-status.js $PWD` and confirm it still
     publishes to ~/.swarmforge/fleet/primary/status.json - the primary must be
     completely unchanged by this ticket.
  2. Make a throwaway copy of the identity file naming a different swarm (for
     example `swarm_name second`) in a scratch checkout, run the same emit
     against it with SWARMFORGE_FLEET_DIR pointed at a scratch directory, and
     confirm it writes ONLY <scratch>/second/status.json, that the document
     identifies the swarm as second, and that no <scratch>/primary/ is created.
  3. Add `config swarm_name third` to that scratch checkout's conf while the
     identity file still says second; re-run and confirm it still publishes as
     second - identity wins over conf.
  4. Delete the identity file in the scratch checkout and re-run; confirm it
     now publishes as third, from the conf.
  5. On a checkout with no compiled extension/out, attempt the publish and
     confirm the reported failure names the compile step to run rather than a
     bare module-not-found path.
  6. Delete the scratch fleet directory and checkout.

source:
  - "backlog/INTAKE-s2-advertise-fleet-and-s1-coordinator.md (operator, 2026-08-21) - archived to backlog/archive/ on drain. This ticket is that intake's own suggested slice 1 (emit name source + s2 compile/docs) plus its desired behaviors 1, 2 and 3; desired behavior 4's prose half was landed on main by the specifier and its machinery half split out to epic fleet-topology remaining_slices."

notes: |
  2026-08-21 coordinator: priority raised 35 -> 6 on direct operator
  instruction to prioritize tickets enabling starting s2 on wsl2. This
  ticket is the direct blocker: without it a launched s2 publishes fleet
  status under s1's name.

  2026-08-21 specifier: drained from the backlog root under Consolidation
  Authority as a 1:N split of INTAKE-s2-advertise-fleet-and-s1-coordinator.md,
  following the intake's own suggested slice boundary. Sibling result of the
  same drain: BL-1009 (unified pipeline board grid), from the sibling intake.
  BL-1009 calls readSwarmName and inherits this fix transparently; it is
  priority 45 to this ticket's 35 so this one lands first, but neither
  depends_on the other - BL-1009 is already correct on the s1 host.

  The engineering guardrail this ticket is an instance of: "A constant
  mirrored by hand across a language boundary no import can bridge (here
  TS <-> Babashka) needs a test asserting both literals agree - a 'kept in
  sync' comment is not a gate, and drift fails silently."

  IR-DRY reviewed 2026-08-21: 3 findings on the first draft, 2 were genuine
  accidental drift and were edited out (a When/Then pair whose wordings were
  near-identical, and "published for" vs "publication is attempted for"
  describing the same action). The 1 remaining finding is the known
  quoted-literal limitation - a Scenario Outline placeholder against the same
  step written with a literal - and is legitimate.

