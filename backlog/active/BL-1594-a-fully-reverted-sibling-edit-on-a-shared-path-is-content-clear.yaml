id: BL-1594
title: "The land step's BL-1481 content check folds a :vacuous verdict in with :unlanded, so a bounced sibling whose every change on a shared path is reverted at the tip - a pure register-row removal restored to origin/main's content - still blocks the lander although no changed line attributes to it and the verdict's own docstring calls that path silent, not an obstacle; BL-1589 needed a ruled hand-built land on 2026-09-16 because of it; :vacuous becomes content-clear in path-content-blocked-ids only, while landed-siblings keeps dropping vacuous paths and never scores silence as landing"
milestone: M8
type: defect
