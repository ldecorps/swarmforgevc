id: BL-1083
title: "The extension host promotes tickets into backlog/active without consulting the promotion gates: promoteToActive is a bare file move, so the Telegram Expedite verb and the paused-pager endpoint both walk past depends_on, hold and the depth cap"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
priority: 50
direction: swarm-reported
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1083-every-promotion-path-goes-through-the-gate.feature
human_approval: approved
approval_context: >
  Minted 2026-08-23 from the coordinator note "Expedite path skips
  depends_on/approval gate (BL-1078 incident)". Root cause found and confirmed
  in code, so this needs your sign-off on scope rather than on diagnosis.

  One decision is genuinely yours. Scenario 02 refuses an expedited promotion
  on THREE gates: depends_on, hold, and the depth cap. The first two are not
  arguable - promoting onto an unlanded dependency or out of a human hold is
  wrong however it is requested. The depth cap is the one you may want
  different. Article 3.2.4 says expedite "reorders the queue only - never an
  extra active slot", which is why it is refused here. But BL-538 built the
  paused-pager Expedite deliberately as "force-promote semantics", and a human
  tapping Expedite on a phone may well mean "I know the cap, do it anyway".
  Approve to enforce the constitutional reading; Amend if you want the depth
  cap to remain overridable by an explicit human tap while depends_on and hold
  stay hard - that is a coherent position and I would rather you chose it than
  discover it in a bounce.

required_wiring:
  - "extension/src/panel/backlogWriter.ts::promotion_gates_cli.bb::the mover itself must reach the shared gate CLI, not one of its two callers - putting the check in a caller leaves the other caller and every future one ungated, which is the exact shape of this defect. Verified absent from the file at spec time, so the anchor cannot pass before the work is done"
  - "specs/pipeline/steps/index.js::bl1083::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler. Verified absent at spec time"

invariants:
  - "Every path that moves a ticket into backlog/active takes its verdict from the one promotion-gates chokepoint — a second copy of the rules, in any language, is the defect and not the fix."
  - "A refused promotion leaves the ticket exactly where it was and tells the operator which gate refused it and why — never a silent no-op."

description: |
  ## What is wrong

  `promotion_gates_lib.bb`'s `evaluate` is documented as the one chokepoint
  every promotion candidate passes: hold marker, `human_approval`,
  `depends_on` (BL-957), then `active_backlog_max_depth`, first failing gate
  wins. Exactly one caller uses it — `promote_and_route_next.sh`.

  `extension/src/panel/backlogWriter.ts`'s `promoteToActive` (line 86) is a
  bare `findBacklogFilePathIn(paused) -> moveBacklogFileTo(active)`. The module
  holds no reference to a gate, a dependency or an approval. Two live callers
  reach it:

  - `extension/src/tools/telegram-front-desk-bot.ts:2199`
    (`promoteTicketIfPaused`), the Telegram Expedite verb.
  - `extension/src/bridge/bridgeServer.ts:782`, the paused-pager Expedite
    endpoint, whose comment describes the semantics as "force-promote".

  ## Evidence

  2026-08-22: BL-1078, BL-1079, BL-1080 and BL-1081 were promoted through this
  path in one pass ("Expedite BL-1078: record approval + promotion"). BL-1078
  declared `depends_on: [BL-713]` with BL-713 in `backlog/active/` and not
  `backlog/done/` — `depends-on-refusal` would have refused it by name. The
  coordinator parked three of the four back by hand the same evening
  (5288fa017, 1572d2f2d, f86cbfde8). Had it not, the coder would have built
  BL-1078 against a seat driver that does not exist.

  ## How (direction, not mandate)

  Make `promoteToActive` itself consult the gates and refuse, returning the
  gate's own reason. The mover, not its callers: a check placed in one caller
  leaves the other — and every future one — ungated, which is precisely this
  defect. `promotion_gates_cli.bb evaluate` already exists as a thin CLI for
  this purpose, and the codebase already has the shape for a TypeScript
  caller shelling to a swarm script (`runExpediteDispatch` ->
  `route_backlog_to_coder.sh`).

  Do NOT restate the gate rules in TypeScript. The rules are Babashka, the
  mover is TypeScript, and no import crosses that boundary — a second copy
  would pass this feature file and drift silently (the BL-897 shape). Take the
  verdict; do not recompute it.

  Expedite remains a real verb: it records the human's approval BEFORE the
  gates are consulted, so `human_approval` is satisfied rather than skipped.

  ## Not in this slice

  Not the gate rules themselves — `promotion_gates_lib.bb` is correct and must
  not change to accommodate a caller. Not `promote_and_route_next.sh`, which
  is already correct. Not the four tickets promoted by the incident; the
  coordinator has already reconciled those.

qa_e2e_procedure: >
  1. Reproduce first: at the parent commit, take a paused ticket whose
     depends_on names a ticket that is not in backlog/done/, tap Expedite in
     the Approvals topic, and confirm it lands in backlog/active/ anyway.
     Record the commit the bot writes.
  2. At the parcel commit, repeat: the ticket must stay in backlog/paused/ and
     the operator must be told the gate and the unsatisfied id, in the topic
     itself - not only in a log the operator will never open.
  3. Repeat via the OTHER path, the paused-pager Expedite endpoint in
     bridgeServer.ts. Both must refuse. A fix that only covers the Telegram
     verb is the defect again with one caller fewer.
  4. Repeat with the ticket in backlog/hold/ and with the active count at the
     cap, confirming each refusal names its own gate rather than a generic one.
  5. Confirm Expedite still WORKS on a ticket that no gate refuses, including
     one that was merely awaiting approval - if approval now blocks Expedite,
     the fix over-corrected and the verb is dead.
  6. Grep the parcel diff for the gate rule names (depends_on, hold, max
     depth) appearing as NEW logic in TypeScript. Finding them there means the
     rules were copied rather than consulted; that is a bounce even with every
     scenario green.
  7. Confirm promote_and_route_next.sh is untouched and still promotes.

notes: |
  Reported by the coordinator as note
  40_20260822T232126Z_001052, "Expedite path skips depends_on/approval gate
  (BL-1078 incident)", after the specifier flagged the same gap while speccing
  BL-1078/1079/1080. Root cause located in code before minting rather than
  taken from the report: promoteToActive read at main, both callers read, and
  promotion_gates_lib.bb's evaluate chain read to confirm which gates exist.

  SEVERITY high, with the trade-off stated. This is a safety gate that is fully
  bypassed on the path the operator uses most - the phone - and it did live
  damage the night it was found. Under Article 3.2.4 `high` puts it in the
  expedite lane, which is already carrying nine critical/high defects with the
  queue-jump batch starved behind it; that cost is real and is recorded here so
  whoever schedules can weigh it rather than discover it. Lower it if you
  disagree; nothing else in this ticket depends on the value.

  NOT the same as BL-1059 (status: todo drift on closed tickets), which also
  names backlogWriter.ts but concerns the status field, not promotion gating.
  Checked before minting.

  IR-DRY (2026-08-23): clean, zero findings.

