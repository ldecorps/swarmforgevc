  > (same discipline as `[[glm-bai-specifier-lite-20260909]]` - only score
  > what was actually run).

description: |
  ## What

  New file `swarmforge/packs/candidate-diversified-fallback-mono-router.conf`,
  a `config rotation router` pack with the same config block as
  anthropic-mono-router.conf, whose window lines are (agent syntax per
  the shipped packs: `window <role> cursor <role> --model auto`,
  `window <role> codex <role> --model gpt-5.3-codex`, the Qwen Token Plan
  line as qwen-mono-router.conf writes it):

  | seat | agent | model | plan |
  |---|---|---|---|
  | coder (HOME) | codex | gpt-5.3-codex | OpenAI |
  | specifier | cursor | auto | Cursor |
  | cleaner | cursor | auto | Cursor |
  | architect | codex | gpt-5.3-codex | OpenAI |
  | hardender | cursor | auto | Cursor |
  | documenter | aider or the qwen line the shipped qwen pack uses | qwen3.7-plus | Alibaba Token Plan |
  | QA | cursor | auto | Cursor |
  | coordinator | per human_ruling | | |

  Header: the role -> agent -> model table with one line of rationale per
  seat (score and evidence ref from the steward, why this plan and not a
  repeat of the previous seat's), the plan-diversity intent, which
  coordinator picks were proven live and which were not, PREREQ (keys
  by env var name only, never a value), and the LAUNCH line - the
  bob-multi-provider-mono-router.conf convention.

  ## Why

  anthropic-mono-router.conf is the tier-1 fallback already; this is the
  tier-2 pack for two plans down at once, so the swarm degrades one tier
  per exhausted plan instead of stopping.

  ## Scenario notes for the coder

  - Scenario 01 parses the pack with the launcher's `parse_config` and
    resolves each line's provider through `pack_staffing_gate_lib.bb`'s
    own lookups (agent-model-providers, api-base-host-providers).
  - Eligibility is an e2e check on the launch root (amended 2026-09-16):
    `bb swarmforge/scripts/model_steward_cli.bb eligible <provider>/<model>
    --role <role>` with the provider/model the GATE resolves for the line
    (cursor/auto, openai/gpt-5.3-codex, qwen/qwen3.7-plus - the aider
    `--model openai/qwen3.7-plus` prefix is aider's OpenAI-compatible
    routing, not the steward id; the gate maps the Token Plan host to
    provider qwen). `.swarmforge/model-steward/` is gitignored, per-worktree
    and stale in every worktree (the coder's registry knows three models),
    so no acceptance scenario reads it.
  - Scenario 02 (amended 2026-09-16) is the BL-1511 shape: the handler
    builds a scratch root with a steward registry ranking cursor/auto on
    specifier, cleaner, hardender and QA and qwen/qwen3.7-plus on
    documenter, plus scorecards carrying `<role>-gate` pass entries,
    derives the windows-file from the pack's `window` lines by the
    launcher's field rules (role, agent, worktree, optional task|batch,
    optional propagation, optional idle-clear, rest = extra-cli), pins it
    at 7 lines, and runs `bb swarmforge/scripts/pack_staffing_gate_cli.bb
    <scratch-root> <windows-file>` with `env -u PACK_STAFFING_SKIP_GATE`
    (decide the variable in the handler; BL-1485): the cursor and qwen
    lines pass, and with the documenter-gate entry removed the qwen line
    refuses role-gate-not-pass (sensitivity, BL-1445). The two codex
    lines read seat-model-unresolved in every fixture until BL-1597 lands
    and are not asserted here (BL-1006: a slice-boundary assertion is the
    successor's to retire, so none is written).
  - Never pass the pack file itself as the CLI's second argument: it
    reads it as a tab-less windows-file and prints a vacuous pass per
    line (BL-1511's own false premise).
  - Scenario 04 reads the header and the coordinator config lines against
    the ticket's `human_ruling`.
  - If a pick fails ELIGIBILITY on the launch root, STOP and note the
    specifier with the verdict - the pick is the operator's to change, not
    the coder's. A gate refusal of a codex or qwen line on this host is
    the known state above, not a stop.

  ## Not in scope

  - Running a coordinator trial (a separate ticket if option 2 is ruled).
  - Changing any existing pack; automatic switching between packs.

qa_e2e_procedure: |
  1. Against the MASTER checkout root (`/home/carillon/swarmforgevc`, the
     launch root), derive the windows-file from the pack's `window` lines
     (the awk in BL-1511's e2e step 1) and run `env -u
     PACK_STAFFING_SKIP_GATE bb swarmforge/scripts/pack_staffing_gate_cli.bb
     /home/carillon/swarmforgevc tmp/div-windows.tsv` -> 7 lines: the
     four cursor lines `pass`; the two codex lines
     `seat-model-unresolved` until BL-1597 lands, then `pass`; the qwen
     documenter line `role-gate-not-pass` until its documenter gate is
     recorded, then `pass`. Record the verdict column verbatim; the
     header's PREREQ must match it.
  2. For each line, on the master root, with the provider/model the gate
     resolves (cursor/auto, openai/gpt-5.3-codex, qwen/qwen3.7-plus):
     `bb swarmforge/scripts/model_steward_cli.bb eligible <provider>/<model> --role <role>`
     -> eligible for all seven (verified 2026-09-16).
  3. `SWARMFORGE_TERMINAL=none ./swarm <scratch-root> --pack
     candidate-diversified-fallback-mono-router` on a scratch root with fake keys and PACK_STAFFING_SKIP_GATE=1 reaches
     the staffing gate and prints the override warning per refused seat
     (codex, qwen) and pass for the cursor seats (the launcher may then
     fail on missing real keys - that is after the gate, and expected).

