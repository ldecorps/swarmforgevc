approval_context: >
  A new feature file is authored here, so it needs a tap, and the one
  open question the intake itself raises is recorded as ruling_options
  below - the coordinator seat. The intake's own discipline is "don't list
  an untested pick as a real option", and only Anthropic (claude-sonnet-5)
  and b.ai (glm-5.3-flash) are proven live on coordinator, both of which
  this pack exists to survive. Option 1 keeps claude-sonnet-5 on the
  coordinator with a header caveat that this seat is NOT diversified;
  option 2 holds this ticket until a real coordinator trial of cursor/auto
  (or claude-fable-5-1) lands as a separate ticket the specifier mints on
  your reply. FIRM, the seven pipeline seats (the intake's Fallback 2
  column, with one deviation flagged): specifier cursor/auto; coder
  openai gpt-5.3-codex via the codex agent; cleaner cursor/auto; architect
  gpt-5.3-codex; hardender cursor/auto; documenter qwen/qwen3.7-plus on
  the Alibaba Token Plan - the intake's table names claude-sonnet-5 here,
  which is Anthropic and so cannot serve a pack for "BOTH b.ai and
  Anthropic unavailable"; qwen3.7-plus is the documenter's next certified
  non-Anthropic pick (0.72-0.8) - Amend if you prefer another; QA
  cursor/auto. FIRM: every seat's model must be certified for its role (steward
  eligible on the LAUNCH root, no override) - verified by the specifier
  on 2026-09-16 on the master checkout: all seven picks eligible when
  named by the id the gate resolves (qwen/qwen3.7-plus, never
  openai/qwen3.7-plus). AMENDED 2026-09-16 (specifier, after the coder's
  eligibility note): the staffing gate passes the four cursor lines
  today; the two codex lines refuse seat-model-unresolved because the
  gate's agent-model-providers table has no codex row (BL-1597, minted
  the same pass), and the qwen documenter line refuses role-gate-not-pass
  because its scorecard records no documenter-gate (steward work). So the
  LAUNCH line keeps PACK_STAFFING_SKIP_GATE=1 and the PREREQ names those
  three verdicts and what clears each; the acceptance gates the pack's
  shape against a steward fixture, never the live root. If a pick fails
  eligibility on the launch root, the coder reports it via note rather
  than substituting silently. Split by the specifier from
  the operator's 2026-09-09 intake (1:N): section 3.
