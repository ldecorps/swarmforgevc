id: BL-1645
title: "A completion gate's evidence window opens when the inbound was created, not when it was dequeued: the Work-note gate (BL-1422/BL-1614) and the forward gate (BL-1609) count a commit or handoff naming the ticket from the inbound's created_at, so work done between a dispatch and its (re-)dequeue completes plainly instead of being refused both ways - the coder was stuck on BL-1637's Work note on 2026-09-19 with the work forwarded and live at the cleaner"
milestone: M8
type: defect
severity: high
# high: a live fault on the default pack's home role. The coder seat cannot
# complete Work note 009529 by any path (plain: WORK_NOT_EVIDENCED, since
# its work predates the dequeue stamp; --no-work: WORK_ACTIVE_ON_MAIN, since
# BL-1637 is active on main because it is in flight downstream), and
# ready_for_next.sh resumes in_process first, so the seat is blocked until
# an interim clears it. Any inbound whose dequeue is re-stamped after the
# work - a queue with older in_process items, a drift refusal before the
# first dequeue - hits the same wall. Not critical: BL-1637 itself is
# unaffected and progressing.
status: todo
epic: swarm-reliability
priority: 8
direction: swarm-reported
