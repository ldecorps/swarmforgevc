id: BL-1012
title: "The freshness watchdog restart-storms a merely-slow handoffd - a fixed 120s threshold against load average 80, 694 rotated logs in one day, and each restart rotates away the evidence the next check reads"
milestone: M8
type: defect
severity: high
status: todo
