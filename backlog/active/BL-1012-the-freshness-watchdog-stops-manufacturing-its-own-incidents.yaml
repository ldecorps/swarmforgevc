acceptance: specs/features/BL-1012-the-freshness-watchdog-stops-manufacturing-its-own-incidents.feature
human_approval: approved
approval_context: >
  You constrained BL-815 with "do not make these green by raising the 20s
  budget" - so you should see this before it is built, because the shape looks
  adjacent even though it is not the same move.

  This does NOT raise the threshold. At contention factor 1 - an idle or
  nominal host - the effective threshold stays exactly today's 120s, so a
  genuinely hung daemon still reds in two minutes on a quiet box. What changes
  is that a host at 20x core count stops being held to a number that was only
  ever true at 1x.

  The two numbers to approve: the multiplier is the contention factor itself
  (load average / core count, floored at 1), and the ceiling is 600s - chosen
  because babysitterd already carries 600 in this very conf, so it is a bound
  the fleet has already blessed. A dead daemon is therefore always caught
  within 10 minutes no matter how loaded the box gets.

  Also firm unless you say otherwise: the watchdog stops treating a missing
  log as a violation within a grace window after a restart IT performed, since
  start_handoff_daemon.sh rotates the log away on every start.

required_wiring:
  - "swarmforge/scripts/daemon_log_freshness_check.sh::FRESHNESS_LOAD::the contention signal must be injectable, matching this script's own documented FRESHNESS_* env-seam convention (FRESHNESS_NOW_EPOCH, FRESHNESS_COOL_OFF_SECS) - without a seam the scenarios cannot pin a factor deterministically. Zero occurrences today"
  - "swarmforge/scripts/daemon_log_freshness_check.sh::FRESHNESS_RESTART_GRACE::the post-restart grace window must be a named, injectable seam for the same reason. Zero occurrences today"
  - "specs/pipeline/steps/index.js::bl1012::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "Bounded: the effective threshold is capped by a finite ceiling. An arbitrarily loaded host never earns an arbitrarily long window - past the ceiling a genuinely dead daemon is always caught, no matter the contention."
  - "Never acts on evidence it destroyed: within the post-restart grace window, an absent or heartbeat-less log never produces a restart or an announce, because the watchdog's own restart is what rotated that log away."
  - "Attributable: every incident record names the effective threshold and the contention factor that produced it, so a past decision is interpretable from the record alone and never needs re-running at the same load to classify."

description: >
  WHAT. Stop the watchdog from generating its own incidents: make the
  threshold relative to host contention within a hard ceiling, and stop
  treating a log the watchdog itself just rotated away as a fresh violation.

  WHY - measured on the live Mac, 2026-08-21 11:00-11:12 BST:
  - Load average 80 on a four-core box (20x core count), with a single
    handoffd chase sweep taking 17.2 seconds (`sweep-boundary
    sweep=chase-sweep ms=17218`).
  - Recorded violation ages against the fixed 120s: 132, 133, 174, 200, 223,
    229, 291, 343, 350. Restarts at 09:34, 09:40, 09:46, 09:56, 10:02, 11:10.
    Several are within 13 seconds of the threshold - the daemon is late, not
    hung, and is being killed for it.
  - 694 rotated handoffd.log.* archives had accumulated by 11:11.

  This is the same family the operator already ruled on for the unit lane
  (BL-1007, 2026-08-21): an absolute wall-clock number that encodes an
  assumption about host contention which nothing records and nothing rechecks.
  Conceptual sibling only - no code is shared, because nothing can import a
  vitest helper into a POSIX sh cron script. The architect should read the
  duplication as deliberate, not as a missed extraction.

  THE SECOND HALF - the watchdog destroys its own evidence.
  start_handoff_daemon.sh:107-108 does `mv "$HANDOFFD_LOG"
  "$HANDOFFD_LOG.<stamp>"` on every start. The freshness checker calls that
  same start script to restart the daemon. So immediately after a restart the
  log the next check reads is one the checker's own restart rotated away, and
  `heartbeat_age_secs` returns its file-absent sentinel. If the restart itself
  fails to bring the daemon up, that state is permanent and the watchdog
  alarms every two minutes forever with nothing left to diagnose from.

  HOW (direction, not mandate). Contention factor = load average / core count,
  floored at 1 and unreadable-falls-back-to-1 (scenario 01's `unreadable`
  row). Effective threshold = base x factor, capped at 600s. A grace window
  after a restart the checker performed, during which an absent or
  heartbeat-less log is not a violation. Both signals injectable via
  FRESHNESS_* env seams, matching the script's existing documented convention.

  SEVERITY high: the swarm's own delivery daemon is being killed and restarted
  every few minutes while it is working, mid-cycle, on a loaded host. That is
  a live fault degrading behaviour, not a contained one.

  NOT IN SCOPE. Whether restarting should rotate the log at all (a real
  question, but rotation has independent value and the grace window addresses
  the consequence); reducing host load; sweeping the 694 accumulated
  handoffd.log.* archives; what the announced text says (BL-1011).

qa_e2e_procedure: >
  1. In a scratch checkout with a handoffd.log whose newest heartbeat is 300s
     old, run the checker with FRESHNESS_LOAD injected at factor 1 and stubbed
     kill/start/announce commands. Confirm it restarts - 300 > 120 at idle, so
     today's behaviour is preserved exactly.
  2. Re-run the same fixture at factor 4. Confirm it does NOT restart
     (effective threshold 480) and announces nothing.
  3. Re-run at factor 20 with a heartbeat 900s old. Confirm it DOES restart -
     the ceiling still catches a dead daemon on the busiest host.
  4. Write an incident-file fixture recording a restart 10 seconds ago, remove
     handoffd.log entirely, and run. Confirm no restart and no announce.
  5. Change that record to 600 seconds ago and re-run. Confirm it announces.
  6. Inspect the incident records written in steps 1-5 and confirm each names
     the effective threshold and the contention factor it used.
  7. On the live Mac afterwards, watch `ls .swarmforge/daemon/handoffd.log.* |
     wc -l` across an hour under normal load and confirm it stops climbing at
     the pre-fix rate.
  8. Delete the scratch checkout.

