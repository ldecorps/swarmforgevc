approval_context: >
  New feature draft needs review. No scope fork to decide here: the fix shape is
  already settled by BL-802 (production, `start_babysitterd.sh`) and by one
  sibling test in this very suite that already does it correctly
  (`test_handoffd_role_context_clear_skip_rotation_router.sh:65`), so this is
