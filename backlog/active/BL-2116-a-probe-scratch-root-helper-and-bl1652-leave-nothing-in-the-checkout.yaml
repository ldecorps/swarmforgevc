description: |
  ## What is wrong
  A non-vacuity probe writes its deliberately broken copy of a script
  inside the checkout (beside the real script, so the copy's relative
  loads resolve) and removes it only in a finally. A killed run skips the
  finally. On 2026-09-25 a killed bl1652 run left two broken copies in
  swarmforge/scripts/, and the launch's sync_worktree_scripts copied them
  into seven worktrees (full history: BL-1743, backlog/done).

  ## What is wanted
  - A helper, extension/test/helpers/nonVacuityProbe.js, exporting
    exactly the API the BL-1743 salvage (stash "BL-1743 WIP salvage
    before respawn (coder loop-halt 01:56Z)") already calls, so BL-2117
    can apply that salvage:
    - createScratchRoot(prefix) -> { root, cleanup }: a temporary root
      named so its owner pid is recorded, made through tmpDir.js's
      mkProcessTmpDir; before making it, sweepStaleTmpDirs({ prefix })
      reaps roots whose owner pid is dead (never a blind prefix sweep -
      BL-971, BL-1385). cleanup() removes the root.
    - writeBrokenCopy(root, realPath, transform) -> brokenPath: writes
      transform(original text) at root/<realPath relative to the repo
      root>, and symlinks every other entry of each real ancestor
      directory, from the copy's directory up to the repo root, into the
      mirror, so a sibling load-file (fs/parent (fs/canonicalize *file*)),
      a relative ".." load, or a Node relative require from the copy
      resolves to the real tree. Nothing is written under the checkout.
  - extension/test/bl1652ChaseRespawnBusyGuardInvariants.property.test.js
    uses it at its three sites (lines ~123, ~240, ~242). The runner copy
    at ~242 then loads ".." "chase_sweep_lib.bb" from the mirror and gets
    the broken lib under its real name, so the basename rewrite there can
    go. Read with offset and limit around those lines, never the whole
    file.
  - Both bl1652 probes still fail their assertion against the broken
    copy, as today.
  - The feature's step handler, bl2116ProbeScratchRootSteps.js, drives
    the helper in a child node process, SIGKILLs it after the broken copy
    is written, checks the checkout (git status --porcelain and a find for
    the child's pid), then calls createScratchRoot with the same prefix
    and checks the dead child's root is gone.

  ## Where to read (local seats: never read a whole large file)
  - extension/test/helpers/tmpDir.js: sweepStaleTmpDirs (~line 64),
    mkProcessTmpDir (~line 135), module.exports (~line 206).
  - bl1652 sites above.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2116-a-killed-probe-leaves-nothing-in-the-checkout.feature`:
     1 of 1 ok.
  2. Read from the gather's property row:
     bl1652ChaseRespawnBusyGuardInvariants green.
  3. `git status --short -- swarmforge/ extension/test/helpers/` in the QA
     worktree: no new *non-vacuity* path.

