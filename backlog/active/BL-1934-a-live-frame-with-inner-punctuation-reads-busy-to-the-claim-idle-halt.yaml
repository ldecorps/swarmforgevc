description: |
  ## Status: hotfix 033dd1780c landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  Between 19:42:46Z and 19:55:53Z on 2026-10-03, handoffd counted the
  local-model coder's claim 8 times toward the claim-without-progress halt
  (threshold 10, action kill_all_swarm), each time with busy=false, while
  the pane showed a live status frame with an advancing timer. The frame
  pattern admitted only letters, spaces and hyphens before a closing
  ellipsis, so these live frames read idle:

  - `.. Almost there... probably... (1h 2m 3s · ↑ 1.3k tokens · esc to cancel)` (inner ellipsis)
  - `.  My other loading screen is even funnier. (1h 4m 19s · ↑ 1.3k tokens · esc to cancel)` (final full stop)
  - `.. Greasin' the cogs of the machine... (13m 14s · ↑ 156 tokens · esc to cancel)` (apostrophe; found at mint)

  The coordinator reset the claim sidecar at 19:58:59Z, which bought 30
  minutes and fixed nothing.

  ## What the hotfix changed

  - swarmforge/scripts/chase_sweep_lib.bb `live-status-frame-pattern` gains
    a second branch: after the spinner glyph, any phrase without parentheses
    whose parenthesis opens on a unit-led elapsed (`1h 2m 3s`, `13m 14s`,
    `45s`) and a `·` separator. The original branch is unchanged.
  - extension/src/panel/agentPaneState.ts `LIVE_STATUS_FRAME_PATTERN`: the
    same change (BL-897 parity).
  - Regression cases: three busy frames and two idle qwen shapes in
    swarmforge/scripts/test/actively_processing_test_runner.bb; the same in
    extension/test/agentPaneState.test.js.

  ## What the coder checks

  - Both literals against this description and the three invariants; that
    the two branches are the same on both sides.
  - The idle side: a qwen tool line such as `✓ Read x.ts (lines 201-400)`,
    the qwen footer, the Claude `Worked for` footer and BL-970's
    contamination shapes stay idle. Name any live frame shape you find that
    still reads idle.
  - Evidence: backlog/evidence/BL-1934-coder-<date>.md.

  ## Not covered here

  - The running handoffd loads the lib once at start, so the fix is live only
    after a restart (build_freshness_cli.bb sync). That is the coordinator's
    step, asked for by note on the hotfix.
  - The evidence file's other two findings: handoffd's
    `:on-claim-idle-bounce!` at threshold 6 only logs although its message
    says it releases the claim, and a local-model seat has no claim-idle
    exemption like the hardener's 90 minutes. Each is its own ticket.

