description: |
  ## What is wrong

  Pane text is the control channel for every seat, and two expensive incident
  families exist only because of it. Idleness is inferred from a frozen pane,
  which a truncated tail, a ghost suggestion and a lying `pane_current_command`
  each defeat differently. A permission moment arrives as an interactive menu
  and blocks the agent until a human notices — the babysitter carries a
  dedicated CRIT check for that class alone.

  ACP makes both facts rather than inferences: `session/prompt` returns a stop
  reason, `session/request_permission` is a structured message.

  ## How (direction, not mandate)

  Build a thin ACP host that lives in the role's own tmux pane, hosts the agent
  CLI as an ACP subprocess over stdio, renders the transcript into the pane,
  and exposes stop reason, tool status and permission requests where the
  deterministic layer can consume them (file or FIFO — designer's call). Wire
  exactly one seat. The provider table gains an ACP dimension; it is not
  forked.

  ## Which seat

  The intake requires an ACP-NATIVE CLI. Cursor is not one, and per BL-1078
  does not need an ACP host to staff a seat, so it is not the subject here.
  Proposed: **Mistral Vibe** — ACP-native, already a supported agent token,
  already live-verified, which lets the ACP control path be measured against
  the pane path on the same CLI. Qwen Code is the alternative and converges
  with BL-1077. See `approval_context`.

  ## Falsifiable

  If idle detection cannot be taken from a stop reason, or a permission moment
  cannot be handled without the menu block, the spike concludes **reject for
  our control model**. That is a valid, cheap outcome and must be recorded as
  the ticket's result rather than worked around. It is deliberately NOT an
  acceptance scenario: a spike's verdict is a written finding, and a scenario
  asserting "we concluded something" would be a prose grep, not a gate.

  Out of scope: replacing PromptEngine / Model Steward / ModelFactory;
  migrating Claude Code seats (adapter dependency, and it would cost the `/rc`
  remote-control affordance the human uses daily); aider; any swarm-wide
  migration decision.

qa_e2e_procedure: >
  1. Launch a pack with the spiked seat behind the ACP host. Watch the pane:
     the transcript must be readable there exactly as it is for an ordinary
     seat, and the babysitter must still return a pane verdict for that session
     (babysitter_check.bb, the live gatherer - NOT babysitter_assess.bb, which
     is dead code awaiting deletion under BL-781). A blank or machine-only pane
     fails invariant 2 whatever else passes.
  2. Let the seat finish a turn. Confirm the deterministic layer marked it idle
     from the stop reason - check the decision trail, do not infer it from the
     seat happening to be picked up. Then reproduce a pane-reading trap that
     defeats the old path (scroll the transcript past the tail) and confirm the
     idle verdict is unaffected.
  3. Drive the seat into a permission moment. Confirm it arrives as a
     structured request, is routed or escalated, and that the babysitter
     interactive-menu CRIT check does NOT fire.
  4. Give the seat a real parcel and confirm it completes the stage and the
     handoff leaves through swarm_handoff.sh into the next role mailbox, with
     no regression in handoff mechanics.
  5. Confirm the non-ACP seats are untouched: launch an ordinary claude pack
     and confirm wake style, bootstrap and idle detection behave as before.
  6. If 2 or 3 cannot be made to pass, record the reject verdict in the ticket
     with the evidence - that is a completed spike, not a bounce.

