  live-verified, so the ACP control path can be compared against the pane path
  on the same CLI. Qwen Code is the alternative and converges with BL-1077.

  2. THE WRITTEN REASON YOU ASKED FOR. You said do not merge with BL-713
  without a written reason. Here it is, and it is a reason NOT to merge: BL-713
  spikes a Cursor seat, and Cursor is not ACP-native; BL-1081 spikes the ACP
  control channel on a CLI that is. Different agent, different protocol,
  different question. Sharing host machinery if BL-713 lands first stays
  sensible; merging the tickets would collapse two distinct experiments.

  3. THE INTAKE WAS TICKETED TWICE. Its archived copy carries "DISPOSITIONED
  2026-08-22 (specifier): Ticketed as BL-713", and BL-1081 was then minted from
  the same intake the same day. BL-713 dropped the intake's ACP-native
  requirement in the process. Re-scoping BL-1081 to the intake as written is
  the repair; BL-713 keeps the Cursor spike it actually describes. If you would
  rather retire one of the two, say which - that is a call I should not make
