  Three things need your decision, because the survey changed what this ticket
  should be.

  1. THE SEAT IS NOT CURSOR. The source intake says "Wire exactly one seat,
  chosen among the ACP-NATIVE CLIs" and lists them - Gemini CLI, Qwen Code,
  Mistral Vibe, Copilot CLI. Cursor is not among them, and BL-1078 found that
  cursor-agent is a terminal-native CLI that needs no ACP host at all to staff
  a seat. Spiking ACP on Cursor would prove nothing about either. Proposed
