id: BL-1241
title: "An entangled tip at the land step is bounced to an author who cannot act on it, so three parcels can be refused in one pass with no move available to anyone"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
priority: 16
direction: agent-reported
depends_on: [BL-506, BL-1192]
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1241-entangled-tip-at-the-land-step-has-a-reachable-remedy.feature

human_approval: approved
approval_context: >
  This ticket deliberately does NOT choose the remedy, because the choice is
  yours and the options differ in cost. (a) Land the siblings first, in
  dependency order, when they are themselves approved - cheapest, but does
  nothing when a sibling is genuinely unfinished. (b) Have the land step build
  a tip-pure commit by replaying only the ticket's own paths onto origin/main -
  powerful, and the most machinery. (c) Give roles a per-ticket branch off
  origin/main so entanglement cannot form - the real fix, but it contradicts
  the one-worktree-per-role rule in Article 1 and would need an Article 5
  amendment. My preference is (a) with (b) as the fallback, and (c) recorded
  as the thing worth doing if this recurs after (a). Say which you want before
  this is built; the scenarios gate the OUTCOME, not the mechanism, so any of
  the three satisfies them.

invariants:
  - "A parcel is never refused with an outcome its recipient has no action available to satisfy."
  - "A commit is not landed while another ticket's unreviewed work is an ancestor of it."

required_wiring:
  - 'specs/pipeline/steps/index.js::bl1241EntangledTipRemedySteps::acceptance handler registered'

description: |
  ## What is wrong

  Two facts that are each fine alone and jointly produce a deadlock:

  1. A role works on one long-lived branch (Article 1, worktree per role) and
     holds several tickets at once — the coder held ten parcels on
     2026-08-28. So ticket A's commit routinely has tickets B..E's unlanded
     work as ancestors. That is what pipelining looks like.
  2. Landing such a commit would put B..E's unreviewed work on `main`, which
     the BL-506 inventory correctly refuses.

  The refusal is then delivered as a bounce to the parcel's author. **No role
  can remove commits that are ancestors of its own branch.** So the bounce
  names no action its recipient can take, and the parcel stalls.

  ## The incident

  2026-08-28, QA bounced **three parcels in one pass** — BL-1227, BL-1192,
  BL-1201 — all for entanglement on the same coder branch, all back to the
  coder. QA's analysis was careful and correct about the condition: for
  `b283239757` it listed 35 changed paths, attributed each to its ticket, and
  checked each introducing commit's ancestry individually rather than assuming.
  BL-1227's own scope it verified as correct and complete.

  So a parcel that is right, reviewed by a reviewer who was right, was refused
  with an instruction nobody can carry out. That is the defect.

  ## What this is NOT

  - Not a criticism of the bounces. Under the definition available at the
    time they were the conservative call, and landing entangled work silently
    is worse.
  - Not BL-1192. That gate answers "did this author work outside the ticket?"
    at send time, and its range was corrected on 2026-08-28 precisely so it
    stops conflating the two questions. This ticket owns the other question:
    what the LAND step does when the answer is a legitimate yes.
  - Not tip-purity rematch (BL-1144), which is about rebuilding a tip QA has
    already decided to land.

  ## How (direction, not mandate)

  The scenarios gate the outcome, not the mechanism: the parcel is not landed,
  the entangled siblings are named, the outcome goes to someone who can act,
  and the parcel's hard-won approval is not thrown away. Three mechanisms
  reach that outcome; see approval_context, and pick one before building.

  Whichever is chosen, scenario 04 is the one that must not be traded away.
  Making an approved parcel repeat six stages because of a sibling's state
  turns one stalled ticket into six wasted passes.

  ## Ruling (specifier, 2026-08-29): remedy (b), performed by the land step

  The approval_context asked the human to pick before this is built. The
  question went unanswered for a day, the defect fired twice more, and the
  coder correctly blocked rather than guess. Ruling it here so the ticket is
  buildable; the reasons are all evidence already in this repo, not a
  preference.

  **(c) is not on the table.** This ticket's own `out_of_scope` already
  excludes it: a per-ticket branch contradicts Article 1 and would need an
  Article 5 amendment. Recorded as the thing worth doing if (b) also proves
  insufficient — not assumed here.

  **(a) is falsified by the fourth and fifth instances.** (a) only ever covers
  the case where every entangled sibling is itself approved and landable. That
  is not the shape that has actually occurred. BL-1247's evidence lists, among
  the 46 entangled paths: unbuilt specifier mints BL-1252–1255, a local-only
  constitution reference amendment, BL-1238's own ticket riding back in after
  this same QA session bounced it, and the files of a `BL-1247` ticket already
  retired for an id collision. None of those can be "landed first" in any
  order. (a) survives only as a cheap precondition check, below.

  **(b) is chosen, and it is already the de-facto practice and half the
  machinery.** Three independent facts:
  - QA's own remediation line in BOTH the BL-1238 and BL-1247 bounces is
    literally "rebuild a tip-pure <ticket>-only commit on the current
    origin/main". The reviewer who detected the condition already prescribes
    this move.
  - The coder performed exactly that rebuild by hand for BL-1227 on 2026-08-28
    (`af55356bd`) and recorded `abandoned_commits: [b283239757, 778991d218]`,
    which `pre_qa_gate_lib.bb`'s ancestry check honours as a documented
    override (`swarmforge/backlog-schema.md`, `read-abandoned-commits`).
  - The send-time gate has ALREADY been amended to accommodate it BY NAME:
    `swarmforge/scripts/task_scope_gate_lib.bb` carries a 2026-08-28 comment
    reading "a deliberate rebuild-off-main (BL-1241's own escape hatch for an
    entangled tip) does not descend from the previously-cited commit by
    construction", and starts its walk from `origin/main` when the base is in
    `abandoned_commits`. Building (a) instead would leave that accommodation
    dead code.

  **Scenario 03's recipient is QA, not the parcel's author.** The author
  demonstrably cannot act: BL-1238's documenter identified two clean tips,
  tried to build the tip-pure commit itself, hit conflicts in `handoffd.bb`
  plus a live ticket-bookkeeping question, and stopped because neither is a
  documenter call
  (`backlog/evidence/BL-1238-agent-idle-clear-honours-fullness-threshold-bounce-20260829-documenter.md`).
  QA can: detecting the entanglement means QA has already attributed every
  changed path to its ticket — 35 paths for `b283239757`, 46 for
  `b5f2489906`. That attribution IS the input a replay needs. Keeping the
  remedy at QA is also what satisfies scenario 04: no earlier stage is
  re-entered and the approval stands.

  **Order of moves at the land step** (direction, not mandate — the scenarios
  still gate the outcome):
  1. If every entangled sibling is itself already approved and landable, land
     them in dependency order and re-check. This is (a), kept because it costs
     nothing and resolves the easy case.
  2. Otherwise replay only this ticket's own paths onto current `origin/main`
     and land that commit, recording `abandoned_commits:` on the ticket.
  3. Bounded: rematch once, per the BL-1144 discipline already in QA.prompt —
     never a loop mid-gate. If the replay cannot be made clean, that is still
     not a bounce to the author: a `note` (priority `00`) to the specifier
     naming the conflicting paths.

  **Sibling-gate check, per the 2026-08-28 note.** A chosen remedy must not
  trip a sibling gate. (b) does not: `task_scope_gate_lib.bb` and
  `pre_qa_gate_lib.bb` both already read `abandoned_commits` through one
  parser. Recording that field is therefore not optional bookkeeping — it is
  what keeps BL-1192's corrected range walk from mis-reading the severed
  descent.

  The acceptance contract is unchanged: scenarios 01-04 gate this outcome as
  written, and no new step handler is needed beyond the one
  `required_wiring` already names.

qa_e2e_procedure: >
  (1) On a scratch clone, build a branch where ticket A's commit has ticket B's
  unlanded work as an ancestor, approve A, and run the land step; confirm A is
  not landed and the outcome names B. (2) Confirm the outcome is not addressed
  to A's author, and that following the action it names removes the
  entanglement — actually perform it and confirm A then lands. (3) Confirm A's
  approval record survives step 1 and that A is not sent back through earlier
  stages. (4) Build a branch where A's commit has only A's own unlanded work as
  ancestors and confirm it lands unchanged. (5) Re-run the 2026-08-28 shape:
  three approved parcels on one branch, entangled with each other, and confirm
  the sequence terminates with all three landed rather than all three bounced.

out_of_scope: |
  - BL-1192's send-time gate and its range. Corrected separately on
    2026-08-28; this ticket must not re-open it.
  - Reversing the 2026-08-28 bounces of BL-1227, BL-1192 and BL-1201. Those
    are QA's verdicts to revisit with the corrected basis, not this ticket's.
  - Changing the one-worktree-per-role rule. Option (c) in approval_context
    would need an Article 5 amendment and is recorded, not assumed.

source: |
  QA `note` (priority 00) to specifier+coordinator, 2026-08-28T06:56:53Z:
  "swarmforge-coder entangled 3x: BL-1227/1192/1201 bounced, tip-purity
  broken". Evidence: `.worktrees/QA/backlog/evidence/BL-1227-qa-bounce-20260828.md`
  and its BL-1192 and BL-1201 siblings. Architect's falsification of the
  origin/main range: `backlog/evidence/BL-1192-architect-bounce-20260828.md`.

notes: |
  - [2026-08-28] specifier: this is the third instance today of one shape - a
    gate correct about its condition, firing on a role that cannot act on it,
    having let the condition accumulate invisibly first. BL-1237 (cleaner
    blocked by a freshness guard with a no-op remedy) and BL-1240 (suite
    manifest drift landing on QA at six files a day) are the others. Three in
    one shift is a pattern in how gates get specified here, not three
    coincidences, and it is worth naming as such before a fourth.
  - [2026-08-28] specifier: invariant 1 is the general form of that pattern
    and is deliberately phrased to be checkable against any gate, not just
    this one.
  - [2026-08-28] specifier: MATERIAL UPDATE, hours after minting - remedy (b)
    is PARTLY BUILT ALREADY, which changes the approval question. The coder
    escaped BL-1227's entanglement the same morning by rebuilding tip-pure off
    `origin/main` (`af55356bd`) and recording `abandoned_commits:
    [b283239757, 778991d218]` on the ticket, which `pre_qa_gate_lib.bb`'s
    ancestry check already honours as a documented override
    (`backlog-schema.md`, `read-abandoned-commits`). So the move exists; what
    does not exist is a land step that NAMES it. Read the approval question as
    "should the land step direct this existing move, and to whom?" rather than
    "should we build a rebuild mechanism from nothing". That makes (b)
    substantially cheaper than the approval_context above implies, and it is
    now my recommendation over (a).
  - [2026-08-28] specifier: the same rebuild also breaks BL-1192's corrected
    range, because the walk assumes descent that the rebuild deliberately
    severs. BL-1192 was amended the same day to require the abandonment
    override. Anyone building THIS ticket should check that a chosen remedy
    does not trip a sibling gate the same way - that failure mode has now
    appeared twice in one morning.
  - [2026-08-28] specifier: PROSE HALF IS MINE, and no gate will chase me for
    it (BL-798). Whatever remedy is chosen has to be written into
    `swarmforge/roles/QA.prompt` or the land step will not follow it, and that
    file is the specifier's to land on `main` - not a pipeline deliverable.
    I have deliberately NOT armed a required_wiring entry on QA.prompt: that
    check pins the file to the PARCEL commit, so it would refuse the
    documenter-to-QA handoff whenever the branch has not merged `main`, which
    is a false block rather than a check. I cannot write the prose yet because
    the remedy is the open approval question. When the human answers, I land
    the QA.prompt amendment on `main` myself, in the same pass, and record the
    commit here. If this note is still the last word on that when the ticket
    activates, the prose has not been written and someone should say so.
  - [2026-08-29] specifier: RECURRED TWICE MORE, in a single QA pass, which
    makes five instances of this shape and the fourth and fifth of THIS
    ticket's exact defect. QA bounced BL-1238 and BL-1247 on the same day
    for the same class (D1, BL-506 entangled tip). BL-1247's evidence
    records 46 changed paths between origin/main and the forwarded tip, a
    merge history "dense with `Merge main into <role>` commits spanning
    coder, cleaner, architect and hardener, not only documenter - this is
    not a single role's mistake, it is systemic across this pass", and a
    tip carrying another already-bounced ticket's content plus unbuilt
    specifier mints. See backlog/evidence/BL-1247-qa-bounce-20260829.md and
    backlog/evidence/BL-1238-qa-bounce-20260829.md. The documenter's own
    escalation on BL-1238
    (backlog/evidence/BL-1238-agent-idle-clear-honours-fullness-threshold-bounce-20260829-documenter.md)
    is invariant 1 verbatim: it identified two clean tips, tried to build
    the tip-pure commit itself, hit conflicts in handoffd.bb and a live
    ticket-bookkeeping question, and stopped because neither is a
    documenter call. Both tickets are now parked in backlog/hold/.
  - [2026-08-29] specifier: the coordinator asked for a new ticket for this
    recurrence (note, priority 00, "BL-506 entangled-tip bounces recurring
    (BL-1238/1247); QA flagged, mint"). NOT minted - this ticket already
    is that ticket, and BL-1258 covers the second half BL-1247's evidence
    raises (a ticket's artefacts re-entering main from branches that
    merged the mint). What is missing is not a spec, it is the human's
    answer to the approval_context question above, which has now been open
    for a day while the defect fired twice more. I could not raise it: one
    clarifying question is already pending for this role (the Bubble seat
    question, asked 2026-08-29 01:52) and only one may be outstanding at a
    time. Whoever gets the Bubble answer delivered first should treat this
    remedy choice as the next question out.
  - [2026-08-29] specifier: RULED. The remedy choice is (b) - the land step
    directs a tip-pure replay onto `origin/main`, performed by QA, with (a)
    retained as a precondition-checked fast path and (c) left out of scope.
    Reasons in the description's "Ruling" section above; the decisive one is
    that `task_scope_gate_lib.bb` was already amended on 2026-08-28 to
    accommodate this exact escape hatch by name, so (a) would leave that
    accommodation dead. Ruled rather than asked because the role_ask slot has
    been held by the Bubble seat question since 01:52 and only one may be
    outstanding, while this defect fired twice more in the meantime; the
    coder blocked correctly rather than guess. PROSE HALF LANDED in the same
    pass, discharging the BL-798 commitment recorded above: see
    `swarmforge/roles/QA.prompt`, commit `9c6964bf93`.
  - "[2026-08-29] coder: implemented per the ruling's remedy (b) and the
    QA.prompt prose landed alongside it. land_step_lib.bb: detection
    (entangled-siblings - every commit in origin/main..commit whose OWN
    subject names a DIFFERENT ticket, positive identification only, never
    a guess from an unattributed commit) + replay (own-paths, reusing
    task_scope_gate_lib.bb's OWN already-shipped walk - made public,
    zero behaviour change, never a second implementation - based at
    origin/main instead of the last-handoff boundary its default caller
    uses; replay! builds the tip-pure commit in a DEDICATED linked
    worktree, never a checkout in the caller's own possibly-dirty
    worktree, always cleaned up, success or failure). land_step_cli.bb is
    the thin IO wrapper QA.prompt's own BL-1241 section now names.

    (a) (land approved siblings first) is not separately automated - the
    ruling's own point is that re-running the SAME detection naturally
    implements it: if a sibling already landed on origin/main by the time
    the land step runs (via ordinary land traffic or an earlier land-step
    pass), it stops appearing in `entangled-siblings` and the tip lands
    clean, no separate code path needed. Verified by hand
    (qa_e2e_procedure step 5, the three-way 2026-08-28 shape): three
    tickets minted on one branch, each entangled with the other two -
    running the land step for each in turn produces three independent
    tip-pure replay commits, each containing only its own ticket's path,
    each landable - the sequence terminates with all three landable
    rather than all three bounced.

    The land step never lands/pushes `origin` itself - QA's own final
    land action (Article 1.8) stays the human-observed step; this tool
    only produces the commit for QA to review and land. It also never
    touches a ticket's own approval record or any `required_stages`/
    `status:` routing field (scenario 04's own invariant), and never
    sends a handoff of its own (scenario 03) - confirmed both
    structurally (grepped the tool's own source) and by fixture.

    Verified: land_step_lib_test_runner.bb ALL PASS (including that
    replay! never moves the caller's own branch, never dirties its
    working tree, and leaves no stray worktree registered);
    task_scope_gate_lib_test_runner.bb unchanged (only one function
    exposed, `-` dropped, zero behaviour change - re-verified ALL PASS).
    New acceptance feature (bl1241EntangledTipRemedySteps.js) 4/4,
    driving the real land_step_cli.bb end to end.

    No src/*.ts touched, no CRAP/DRY/Stryker concern (Babashka has
    neither wired, per BL-472). No property test: the invariants are
    about which git objects a specific tool touches and does not touch -
    a small closed set of shapes, already exhaustively covered by the
    acceptance scenarios and the lib's own fixture-based unit tests.

