id: BL-1089
title: "BL-1035 correctly stopped judging a child on its predecessor's heartbeat, but the BL-370 liveness fixture fakes 'stopped listening' with a heartbeat older than the child's own spawn - so 8 checks fail on main and BL-370's whole outage guarantee (stall detection, restart-to-cap, human escalation) is now unverified"
milestone: M8
type: defect
severity: medium
# medium, deliberately NOT high: production behaviour is correct here and was
# verified directly against the pure function - the loss is regression cover,
# not live behaviour. It is not low either: this is the cover for a real
# ~9-hour outage, it has been red long enough that three roles have already
# recorded it as "pre-existing, unrelated", and a suite nobody trusts protects
# nothing.
status: todo
epic: swarm-reliability
assigned_to: coder
priority: 16
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1089-the-front-desk-liveness-suite-gates-the-guarantee-it-names.feature
human_approval: approved
invariants:
  - "The repaired suite must go RED again if BL-1035's own-heartbeat guard or BL-370's stall detection regresses. A fixture made green by widening the grace, zeroing `FRONT_DESK_HEARTBEAT_STARTUP_GRACE_MS`, or asserting less is a worse outcome than the current red."
  - "Every heartbeat the fixture writes to mean 'this child has served' is timestamped after that same child's own spawn - the fixture models a real child, never a timestamp that could only belong to a predecessor."

description: |
  ## What is actually broken

  `swarmforge/scripts/test/test_front_desk_supervisor_liveness.sh` fails **8
  checks on main**. The production code is right. The fixture is stale.

  BL-370's suite covers the 2026-07-13 outage: a front-desk bot held a live
  pid for ~9 hours while it had stopped listening. It simulates that by
  starting a bot that stays alive forever (`setInterval(() => {}, 1000)`) and
  writing a poll heartbeat aged 5000ms, against `FRONT_DESK_STALL_MS=1000`.

  BL-1035 (`1cea4f7a3`) then added the own-heartbeat guard, which is correct:

      own-heartbeat-ms = last-heartbeat-ms, but only if it is >= started-at-ms

  A heartbeat older than this child's spawn belongs to the instance this child
  replaced, so it says nothing about this child. The fixture's 5000ms-old
  heartbeat is written ~2 seconds after the child spawned - so it PREDATES the
  spawn, `own-heartbeat-ms` becomes nil, and the child falls into its 90-second
  startup grace (`FRONT_DESK_HEARTBEAT_STARTUP_GRACE_MS`, default 90000). The
  supervisor answers "not stalled", which is the right answer to the question
  the fixture is now actually asking.

  ## Measured against the pure function, not inferred

  With the fixture's own numbers (spawn 2s ago, heartbeat 5s old, stall 1000ms,
  grace 90000ms):

      heartbeat predates spawn?      => true
      5-arity (the live path)        => false     <- "not stalled"
      3-arity (pre-BL-1035 shape)    => true      <- what the fixture expects

  And with a heartbeat that models what "stopped listening" really looks like -
  written AFTER the child spawned, then gone quiet past the stall window:

      heartbeat after spawn?         => true
      5-arity                        => true      <- correctly stalled

  So the supervisor detects a genuinely stopped-listening bot exactly as BL-370
  requires. Only the fixture is wrong.

  ## Why 8 checks and not 1

  Everything downstream of the first stall is a cascade: the bot never reaches
  `stalled`, so it is never restarted, never reaches the attempt cap, never
  gives up, and never escalates. Observed on main:

      FAIL front-desk-liveness-01: a stopped-listening bot is reported as stalled
      FAIL the stall is logged
      FAIL the bot transitions to stalled
      FAIL front-desk-liveness-03: a stalled front desk is restarted with no human action
      FAIL front-desk-liveness-04: repeated stalls stop restarting at the cap
      FAIL front-desk-liveness-04: the failure is escalated to the human
      FAIL front-desk-liveness-05 setup: the bot gives up
      FAIL front-desk-liveness-05: the supervisor attempts the escalation again

  That is BL-370's entire guarantee - detect, restart, bound, escalate -
  currently gating nothing. Any future regression in that path ships silently.

  ## The gate gap that let it through

  BL-1035 changed the exact semantics this suite covers, and **never ran it**.
  Neither `backlog/evidence/BL-1035-architect-pass-20260822.md` nor
  `backlog/evidence/BL-1037-hardener-pass-20260822.md` mentions the liveness
  suite at all - both ran the sibling `test_front_desk_supervisor_tick.sh` and
  several other supervisor runners, but not this one. The sibling suite was
  reported and reasoned about carefully; this one was simply never in view.

  ## How (direction, not mandate)

  Repair the fixture so it models the outage it names: let the bot write a
  heartbeat AFTER it starts (so the supervisor accepts it as this child's own),
  then let that heartbeat age past the stall window. Do not reach for the
  shortcuts that would turn the suite green while emptying it - widening the
  stall window, zeroing or shrinking the startup grace, or dropping the
  assertions - because each of those deletes the BL-1035 semantics the suite
  should now be pinning.

  While the fixture is being corrected, it is worth LOCKING IN what BL-1035
  established, since nothing currently asserts it end-to-end: a heartbeat
  predating the child's spawn must not count as that child having served
  (feature scenario 03), and the guard must still fire once the grace has
  passed (scenario 04). Those two are cheap here and are what stops this
  regressing in the other direction.

  ## Scope

  - `swarmforge/scripts/test/test_front_desk_supervisor_liveness.sh` - the
    fixture and its assertions.
  - Step handlers for this ticket's feature file land in this same parcel
    (BL-233: the acceptance runner throws on a scenario with no handler).
  - Explicitly OUT of scope: `front_desk_supervisor_lib.bb` and
    `front_desk_supervisor.bb`. Production behaviour here is correct and
    verified; a parcel that changes it is answering a different question. If
    the coder becomes convinced production IS wrong, that is a spec gap - send
    a `note`, do not widen this ticket.

qa_e2e_procedure: >
  1. At the parent commit, run
     `bash swarmforge/scripts/test/test_front_desk_supervisor_liveness.sh` and
     confirm the 8 failures listed in the description, starting at
     `front-desk-liveness-01`.

  2. At the parent commit, confirm the production side is NOT the fault: drive
     `poll-heartbeat-stale?` with a heartbeat written after the child's spawn
     and older than the stall window, and confirm it answers stale=true. The
     supervisor already detects a stopped-listening bot.

  3. At the parcel commit, run the suite and confirm it is fully green.

  4. Confirm it is green for the right reason, which is the whole point of this
     ticket. Read the diff and confirm the fixture now writes its heartbeat
     AFTER the child spawns, and that the stall window, the startup grace
     (`FRONT_DESK_HEARTBEAT_STARTUP_GRACE_MS`) and the assertions were not
     weakened to achieve it.

  5. Confirm the suite still BITES - the check that matters most. Temporarily
     revert BL-1035's own-heartbeat guard in a scratch copy (accept a
     predecessor's heartbeat as the child's own) and confirm the repaired suite
     goes RED. Restore it. A suite that stays green through that revert has
     been emptied, not fixed.

  6. Confirm the full cascade is genuinely exercised, not just the first check:
     the bot is restarted, the attempt cap bounds the restarts, and the human
     escalation fires past the cap - each observed in the suite output rather
     than assumed from an overall PASS line.

  7. Confirm scope: `git diff` the parcel and confirm
     `front_desk_supervisor_lib.bb` and `front_desk_supervisor.bb` are
     untouched.

  8. Re-run `bash swarmforge/scripts/test/test_front_desk_supervisor_tick.sh`
     and confirm this parcel changed nothing there (its own remaining failure
     is BL-1088's, not this ticket's).

approval_context: >
  Filed MEDIUM, and that grade is the judgement worth confirming. Production
  behaviour is correct here - verified directly against the pure function - so
  nothing is misbehaving in the live swarm today. What is lost is the
  regression cover for a real ~9-hour outage, and it has been lost quietly:
  three role passes have already recorded these failures as "pre-existing,
  unrelated" and moved on, which is how a red suite becomes furniture.

  A case for HIGH could be made on the grounds that BL-370 protects a
  swarm-visible outage mode and is currently protecting nothing. It was not
  taken because severity here should track impact, and the impact is contained
  to test cover.

  What is firm: production code stays untouched, and the suite must be repaired
  in a way that leaves it able to fail. Making it green by widening the grace
  or dropping assertions would close the ticket and keep the hole.

source: |
  Escalated by the hardener as a priority-00 note, 2026-08-23:
  "test_front_desk_supervisor_liveness.sh: 7 checks fail on main, untracked" -
  the second of two such notes in one turn (the first became BL-1088). The
  test file is git-tracked; "untracked" means no ticket owned the failure.

  Verified by the specifier before minting: suite run on main (8 failing checks
  observed, one more than the note's count - the note is otherwise exact);
  root cause traced to `1cea4f7a3` (BL-1035) via `git log -L` on the
  own-heartbeat guard; and the conclusion that production is CORRECT and the
  fixture is stale established by driving `poll-heartbeat-stale?` directly with
  both the fixture's numbers and a realistic stopped-listening heartbeat.

notes: |
  RELATED, ALL DISTINCT - do not merge these:
  - BL-1088 (paused, minted the same turn) is the other hardener note:
    `check-one!`'s `gave-up` branch re-arming on a dead pid. Different
    function, different failure, and it does not interfere with THIS suite,
    whose bot stays alive throughout (so the dead-pid disjunct never fires).
  - BL-1043 (ACTIVE) is `poll-heartbeat-stale?`'s 3-arity passing a nil
    `started-at-ms`, which leaves the onboarder and negotiation-relay
    supervisors with no startup grace. This ticket is about the front desk's
    5-arity path, where the grace works correctly. BL-1043 edits the lib; this
    ticket edits only the test - so they are file-orthogonal, unlike BL-1088.
  - BL-1035 (done) is the change that flipped this suite red. It is correct and
    is not being reverted.

  IR-DRY: the checker reports two medium-confidence near-duplicate findings,
  both positive/negative pairs of the same predicate ("has completed a poll" vs
  "has not completed a poll"; "is declared stalled" vs "is not declared
  stalled"). Reviewed and deliberately kept: they are the two sides of the
  behaviour under test, not accidental drift, and collapsing either pair would
  delete the contract. The checker's own guidance is to normalize only
  accidental drift. Do not re-litigate this as a lint failure.

  PROCESS SIGNAL for the closing-ceremony lean pass: two suites went red under
  changes to the code they cover, and in both cases the reviewing roles ran
  SOME supervisor suites but not the one whose semantics were being edited.
  Worth asking whether a parcel touching `front_desk_supervisor_lib.bb` should
  have to name every suite that loads it.
