id: BL-1063
title: "The nvm-PATH property test's invariant 1 is wrong twice over: it reads a BACKGROUNDED daemon's marker with no wait at all, and it then asserts node came from the fake nvm tree - which contradicts BL-796's own no-shadow invariant and is deterministically red on any host with a system node"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
priority: 55
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1063-assertion-races-a-backgrounded-daemon.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl1063::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them. Verified absent from index.js at spec time, so the anchor cannot pass before the work is done"

invariants:
  - "Every assertion about a backgrounded child's side effect waits for that side effect under a bounded deadline, and returns as soon as it appears; no assertion reads a path the child may not have written yet."
  - "An assertion tests the invariant it names, not one host's way of satisfying it: where a lib documents a fallback, the test accepts every branch the lib may legitimately take, and never asserts a branch the lib is required NOT to take."

description: >
  `extension/test/bl796NvmNodePathFollowUpAdoptInvariants.property.test.js`,
  invariant 1 ("the launched daemon inherits a PATH on which both bb and node
  resolve, however minimal the caller PATH") spawns
  `swarmforge/scripts/start_handoff_daemon.sh` with `spawnSync`. That script
  BACKGROUNDS the daemon and returns immediately, so `spawnSync` returning tells
  us nothing about whether the child has run. The child is a stub whose body is
  `{ command -v bb; command -v node; } > "$resolvedLog"`, and the test then
  reads `resolvedLog` on the very next line with no wait, no poll, and no
  synchronization of any kind:

    assert.equal(fs.existsSync(resolvedLog), true,
      `expected the launched daemon to have run at all ...`)

  The observed red was that assertion, failing on the first generated case
  (counterexample `["/usr/bin:/bin", false]`) after 476ms.

  This is the ONE file in the reporting note's list of five where the note's own
  diagnosis - "flaky under worktree load" - is accurate: the race exists on an
  idle host and widens as contention delays the child's first scheduling slice.
  The other four have mechanisms unrelated to load (see notes).

  HOW (direction, not mandate). Poll for the marker under a bounded maximum
  deadline, returning as soon as it appears - the engineering rule is "bounded
  retries with backoff; max-wait deadlines on lock loops". A fixed `sleep` is
  explicitly NOT the fix: it trades a fast race for a slow one, is still wrong
  under enough load, and taxes every passing run for the worst case. The
  codebase already has `test/helpers/boundedWatchWait.js` in this shape; whether
  to reuse it or add a local helper is the implementer's call, but note BL-1008
  covers a defect in that helper's own inner deadline, so reuse should be a
  deliberate check rather than an assumption.

  --- THE SECOND DEFECT, same file, same property, same edit ---

  Found by the architect 2026-08-22 and reproduced by the specifier before
  minting. Invariant 1 carries a SECOND, independent defect, four lines below
  the racing read:

    assert.ok(lines[1].includes(path.join(home, '.nvm', 'versions', 'node')),
      `expected node resolved from the fake nvm tree ...`)

  The property is named "both bb and node RESOLVE, however minimal the caller
  PATH". That is a claim about resolvability. The assertion instead demands
  node resolve from the FAKE NVM TREE specifically - a claim about which
  branch answered.

  Those are not the same claim, and on this host they are opposites.
  `callerPathArb` generates `/usr/bin:/bin`; this host has a real
  `/usr/bin/node`. `operator_path_lib.sh` reaches nvm only as a fallback -
  `if [ -z "$_node_dir" ]` - and its own comment states the rule: "a binary
  the caller's PATH already resolves ... is never shadowed by a different
  installation the curated/nvm fallback would otherwise find". So the lib
  correctly returns `/usr/bin/node`, and the assertion fails.

  **The test is red exactly BECAUSE the production code is correct.** The
  assertion contradicts BL-796's own third invariant, which the same lib is
  built to honour. Nothing is wrong in production; the fixture bound a host
  fact - the absence of a system node, true on the nvm-only macOS box where
  it was authored, false here. Same class as BL-1061 (fixture binds a live
  tunnel name) and BL-1058 (BSD-only syntax, silently wrong on GNU).

  Measured 2026-08-22: 3 runs, 3 failures, always invariant 1, shrunk to
  `["/usr/bin:/bin", false]`. Deterministic - NOT the race above, whose
  signature is the intermittent "expected the launched daemon to have run at
  all". Here `resolvedLog` exists and holds both lines; the child ran.

  WHY THE TWO CANNOT BE SPLIT. They sit in one property, and the race fix
  alone cannot turn this file green on this host: repair the wait and the
  deterministic assertion still fails on the next line. Shipping the race fix
  by itself would leave the lane red and read as a failed fix - the next
  person would re-diagnose it, or bounce a parcel that was correct. Both are
  in scope here. Reviewers: the assertion repair is IN SCOPE and is not an
  out-of-scope diff.

  HOW (direction, not mandate). Assert what invariant 1 claims: that node
  resolves at all. If the nvm fallback branch is worth its own coverage - it
  is - drive it by generating a caller PATH on which node genuinely does not
  resolve, so the branch is reached by construction rather than by luck about
  the host. Do not assert a branch the lib is required not to take.

  SCOPE. This test file's invariant-1 assertions: its wait on the backgrounded
  child, and its over-specified assertion about where node resolved. Not
  `start_handoff_daemon.sh` itself - backgrounding the daemon is the behaviour
  under test and correct. Not `operator_path_lib.sh`, which is correct as
  written and must not be changed to satisfy a wrong assertion. Not the other
  property files in the same report.

qa_e2e_procedure: >
  1. At the parent commit, run
  `npx vitest run --config vitest.properties.config.mjs
  test/bl796NvmNodePathFollowUpAdoptInvariants.property.test.js` from
  extension/ repeatedly while the host is under load (the live swarm running is
  sufficient; record the load average you tested at) and confirm the absence of
  the behaviour by reproducing the "expected the launched daemon to have run at
  all" failure. 2. At the parcel commit, repeat under the same load and confirm
  the file passes. 3. Confirm the wait is bounded, not unbounded: make the stub
  never write its marker and confirm the test fails after the declared deadline
  rather than hanging, with a message naming the marker that never appeared.
  4. Confirm it returns early: with the marker written promptly, confirm the
  file's wall-clock is not inflated to the deadline - a fixed sleep would show
  up here. 5. Confirm no fixed sleep was introduced: grep the parcel diff for
  added `sleep`/`setTimeout` constants used as synchronization. 6. For the second defect, confirm the
  premise on this host first: `ls /usr/bin/node` must exist, since that is what
  makes the old assertion red. At the parent commit run the file 3 times and
  confirm 3 deterministic invariant-1 failures shrinking to
  `["/usr/bin:/bin", false]` - deterministic, not intermittent, which is what
  distinguishes it from the race. 7. At the parcel commit confirm the file
  passes on THIS host, with a system node present and the caller PATH resolving
  it. 8. Confirm the nvm fallback branch is still genuinely exercised, not
  merely no longer asserted: force a caller PATH on which node does not resolve
  and confirm the test still proves node came from the nvm tree there. 9.
  Confirm `swarmforge/scripts/operator_path_lib.sh` is untouched by the parcel
  diff - a change there would be the fix pointed at the wrong file. 10. Record
  the degraded gate: the property lane is deliberately separate from unit
  coverage and mutation (engineering.prompt, Design And Testability), so a
  hardening pass must not imply mutation ran over it.

notes: >
