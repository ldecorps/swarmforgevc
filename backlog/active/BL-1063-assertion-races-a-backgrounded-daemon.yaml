  SECOND DEFECT PROVENANCE. Architect `note`
  50_20260822T163408Z_000635 to specifier and coordinator: "BL-796 property
  test regressed on this host (BL-1058 evidence) - a ticket?" - answered by
  folding it here rather than minting a separate ticket, under the specifier's
  Consolidation Authority (N:1). The word "regressed" is worth correcting for
  the record: nothing regressed. The assertion has been wrong since it was
  written and is red on any host with a system node; this host merely has one.
  Reproduced by the specifier before amending - 3 runs, 3 deterministic
  failures - and `operator_path_lib.sh` read at `main` to confirm the
  production side is correct.

  WHY FOLDED, NOT A NEW TICKET. Same file, same property, same function body:
  two tickets would collide in one edit, would be barred from running
  concurrently under Concurrent Work Orthogonality, and - decisively - the
  race fix alone cannot turn the file green, so a separate race ticket would
  ship looking failed. Still INVEST-small: two assertions in one test file,
  mutation_cost unchanged at low.

  IR-DRY: 0 findings at mint. On the amendment, 1 medium-confidence
  possible-synonym between scenario 04's parameterized "a caller PATH on which
  node <caller_resolves>" and scenario 06's "a caller PATH on which node does
  not resolve" - real drift, since 06 was restating row 2 of 04. Resolved by
  rewriting 06 around the property that is genuinely distinct: the file's
  verdict must not depend on whether the HOST carries a system node, which is
  the claim the second defect actually falsifies. Re-run clean: 0 findings.


  SEVERITY RAISED medium -> high (specifier, 2026-08-23). Third independent
  report, this time from the hardener mid-parcel: `note`
  00_20260822T232806Z_000543, "BL-796 property test fails here (nvm PATH);
  unrelated to BL-1015, triage". Reproduced again before amending - 1 run, same
  deterministic invariant-1 failure, same counterexample
  `["/usr/bin:/bin", false]`, `/usr/bin/node` present on this host as the
  ticket predicts. The raise is not about this defect getting worse; it is
  about what it costs. `test:properties` is a REQUIRED lane, and while this
  file is deterministically red every hardening pass on every ticket has to
  triage it, decide it is unrelated, and carry a known-red - which is exactly
  how a gate stops being read (green-suite-is-not-evidence). It has now cost
  three roles a triage detour (QA, architect, hardener) on three unrelated
  parcels. Under Article 3.2.4 `high` puts it in the expedite lane.

  TRADE-OFF, stated rather than hidden: the expedite lane is already carrying
  nine critical/high defects and the queue-jump batch is starved behind it, so
  this raise makes a known starvation slightly worse. It is judged worth it
  because `mutation_cost` is `low` - two assertions in one test file - so the
  ticket should clear quickly and stop taxing every later hardening pass.
  Coordinator/human may overrule by lowering it back; that decision is theirs,
  and nothing else in this ticket depends on the severity value.

source: >
  QA note 00_20260822T134343Z_000879 to specifier (via coordinator).
  Failure observed in the property-lane run at .worktrees/QA, 2026-08-22.


  FOURTH REPORT, 2026-08-23 (specifier). QA `note`
  50_20260823T001601Z_000921 to specifier and coordinator: "BL-796 property
  test red here: real /usr/bin/node on host, pre-existing". QA's read is
  exactly right on both halves — the host does carry a real `/usr/bin/node`
  (verified again this pass), and the failure is pre-existing rather than
  anything QA's own parcel introduced.

  No new ticket, no severity change, and nothing for QA to do: this is the
  same defect this ticket already describes, now reported by a fourth
  distinct role (QA, architect, hardener, QA again) across four unrelated
  parcels. Recorded here only so the triage cost stays visible and a fifth
  role can find it by grep.

  WHY IT IS STILL SITTING, checked rather than assumed. Every content gate
  passes. `promotion_gates_cli.bb evaluate` at cap 6 returns exactly one
  refusal: `active_backlog_max_depth | active count 6 >= cap 6 - no open
  slot`. In particular the absent `human_approval` field is NOT a blocker —
  `promotion_gates_lib.bb` documents absence as "not applicable, no approval
  needed" and passes it; only a PRESENT non-`approved` value fails closed. So
  this needs a slot, not a signature, and being `high` it takes the next one
  ahead of non-expedited work under Article 3.2.4.

  CONSIDERED AND REJECTED: registering this as a tolerated known-red so roles
  stop re-triaging it. That would buy a fifth role's triage detour at the
  price of teaching the swarm to carry a red in a REQUIRED lane, which is the
  failure this ticket exists to end. `mutation_cost` is `low` — two assertions
  in one file — so the honest fix is cheaper than the machinery to tolerate
  it. The answer is a slot.

  FIFTH REPORT, 2026-08-23, three minutes after the fourth. Architect `note`
  50_20260823T001920Z_000659: "BL-796 property test flakes on hosts with a
  real /usr/bin/node - please ticket". Correct about the host condition,
  wrong about "flakes" — this is deterministic, not intermittent, which is
  the second time that mislabel has been applied (the third report called it
  a regression). The word matters: "flaky" invites a retry, "deterministic"
  invites a fix.

  ACTED ON THE LOOP, not just the report. Five reports from four roles across
  five unrelated parcels is no longer a property of this ticket; it is a gap
  in how a role decides whether an out-of-parcel red is already tracked. The
  architect prompt already carried exactly the right rule — grep the backlog
  before reporting — but scoped it to architecture GATE failures (forbidden
  edges from the acyclic scan), so a red property test did not read as
  covered, and QA and the hardender had no such rule at all. Amended
  2026-08-23 (specifier, landed on `main` per BL-798): the architect rule now
  generalizes to ANY out-of-parcel failure and names the failing test file's
  basename as the grep key, and the equivalent rule is added to
  `swarmforge/roles/QA.prompt` and `swarmforge/roles/hardender.prompt`. All
  three also now require evidence before the words "flaky" or
  "deterministic". No ticket minted for this: it is prompt prose, which has
  no executable gate and is the specifier's to land directly.

