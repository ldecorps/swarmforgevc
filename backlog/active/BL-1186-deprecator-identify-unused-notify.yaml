description: |
  ## What

  Ship a read-only deprecator pass that scans code paths, conf keys, and operator
  verbs against a trailing usage ledger and notifies the human with retirement
  candidates. Two classes, thresholds locked by the human:

  | Class | Rule |
  | --- | --- |
  | unused | zero hits in trailing 90 days |
  | seldom | fewer than 3 hits in trailing 90 days |

  Output is a ranked report + human notification. No auto-delete, no ticket close.

  ## Why

  BL-1174 `/deprecate` handles one retirement at a time after human adjudication.
  This slice gives the operator a periodic inventory of what to consider retiring
  before stale logic re-ships from old paused tickets.

  ## How (direction, not mandate)

  Reuse telemetry / usage ledger sources where they exist; fail open with an
  honest empty report when ledger data is unavailable. Notification may ride the
  daily briefing or a dedicated operator topic — pick the surface that already
  reaches the human on this pack.

qa_e2e_procedure: >
  (1) Seed ledger with zero-hit and 2-hit surfaces — report classes them unused
  and seldom respectively. (2) Seed a 40-hit surface — omitted. (3) Confirm
  notification queued and no code/config mutated. (4) Run on easy seat — refuse
  with needs hard-tier reasoner if judgment path invoked.

out_of_scope: |
  - Auto-retirement or auto-close (BL-1174 owns adjudicated retirement).
  - Replacing Boy Scout code-debt scan (BL-1013).

