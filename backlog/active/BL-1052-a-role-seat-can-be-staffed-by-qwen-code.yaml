id: BL-1052
title: "A role seat can be staffed by qwen-code: the shell-capable Qwen CLI has no agent shape, no launch adapter and no pack, so the only Qwen path in the swarm is the aider one that cannot execute"
milestone: M8
type: feature
status: todo
epic: swarm-intelligence-layer
priority: 0
direction: queue-jump
depends_on: []
