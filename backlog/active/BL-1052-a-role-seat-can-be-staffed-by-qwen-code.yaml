qa_e2e_procedure: |
  On the live host, with `QWEN_API_KEY` (or `BAILIAN_CODING_PLAN_API_KEY`)
  exported and `qwen` on PATH:

  1. Launch the new pack against a SCRATCH target - never the live repo:
     `./swarm <scratch-root> --pack qwen-code-mono-router`.
  2. Confirm the seat is a real agent, not a narrator: in the role pane, ask
     it to run `ready_for_next.sh` and confirm the pane shows the command's
     actual output, not a description of what it would do. This is the exact
     check the aider-based pack fails.
  3. Confirm the role prompt was embedded at launch, not pasted afterwards -
     the agent answers a question about its own role from the first turn.
  4. Confirm the key never reached disk:
     `grep -rl "$QWEN_API_KEY" <scratch-root> swarmforge/packs/` prints
     nothing, and `git -C <scratch-root> status --short` shows no generated
     file carrying it.
  5. Confirm the existing aider-based pack is untouched: launching
     `--pack qwen-mono-router` behaves exactly as it did before.
  5a. Confirm the pack does not demand an agent it never uses: on a host
     with no `aider` on PATH, the launch in step 1 still comes up. Before
     this ticket, the pack name alone routed it to the aider family, which
     refuses without aider installed (specifier answer 2 above).
  6. Read the new pack file and confirm the ToS caution is present in it.

