human_approval: approved
approval_context: >
  Nothing here needs a technical decision from you - you already made the
  hard one by smoke-testing the CLI and confirming it really executes. Two
  things worth your eye before it is built:

  ONE. The ToS caution travels into this ticket rather than being quietly
  dropped, as you asked: `qwen-mono-router.conf`'s own comment warns that
  "Personal ToS limits use to interactive coding tools; headless swarm may
  risk key revocation - prefer Team Edition for automation, or verify
  eligibility in console first." This ticket BUILDS the capability; it does
  not decide that running it headless against a Personal plan is allowed.
  Scenario 06 pins the warning into the pack file so nobody launches it
  without reading it.

  TWO. This is slice (a) of the ordering you accepted - agent shape, launch
  adapter, base pack. The ModelFactory `provider->agent` entry and the Model
  Steward cost-class registration are BL-1053, which depends on this one,
  because registering a provider with nothing to launch is inert bookkeeping.
  The trial run - short-lived second swarm, scratch target, live Claude
  pipeline untouched - is operational and is not ticketed.

required_wiring:
  - 'swarmforge/scripts/prompt_engine_lib.bb::"qwen-code"::the capability entry must land in the live provider-capabilities map - the launch adapter reads its shape from there, and an adapter built against a map with no entry falls through to the default and silently launches the wrong agent shape'
  - "specs/pipeline/steps/index.js::bl1052::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "A capability entry describes the AGENT, never the model. qwen-code and the aider-based qwen pack share a model catalog, an endpoint and a key, and must never share a capability shape - the two differ in whether the agent can execute a shell command at all, which is the whole reason one works as a swarm role and the other does not."
  - "The API key reaches the pane only through the launching environment and tmux `-e`. It is never written into a pack file, a generated launch script, a prompt, or anything that reaches a commit."

description: |
  ## What is wrong

  The swarm has exactly one Qwen path, and it is the broken shape. The
  `qwen-mono-router` pack drives Qwen models through `aider` - a file editor
  with no autonomous shell execution - which is the same structural failure
  already proven live with Mistral, where roles narrated `ready_for_next.sh`
  instead of running it. `@qwen-code/qwen-code` (npm, binary `qwen`) is
  Alibaba's own agentic CLI, Gemini-CLI-derived and genuinely tool-use
  capable, and the swarm cannot staff a seat with it.

  The operator smoke-tested it outside any production path and confirmed the
  one thing that matters: with `--auth-type openai -y` against the Token Plan
  OpenAI-compat endpoint, it ACTUALLY EXECUTED a shell command and returned
  the real result. Without `-y` it refused and said so, rather than
  pretending - a better failure mode than the aider incident.

  ## Why it is small

  Almost everything it needs already exists.

  `prompt_engine_lib.bb`'s `provider-capabilities` map already carries the
  exact shape this takes: `"vibe"` and `"gemini"` are registered
  `:wake-style :chat-message, :bootstrap-style :embedded` precisely because
  they are real bash-capable agents, and the map's own comment already spells
  out the distinction this ticket turns on - "Do NOT model it on aider:
  aider shares Mistral as a MODEL but is a file editor that cannot execute
  ... Capability entries describe the AGENT, not the model."

  The credential plumbing exists too. `swarmforge.sh`'s `qwen_guard` already
  maps `QWEN_API_KEY` (falling back to `BAILIAN_CODING_PLAN_API_KEY`) onto
  `OPENAI_API_KEY` / `OPENAI_API_BASE` / `OPENAI_BASE_URL` for the Token Plan
  SEA endpoint, and `ancillary_provider_lib.sh` already passes it to a pane
  through `-e`. Same credentials, different launcher.

  So what is genuinely missing is: an agent shape, a launch adapter that
  composes `qwen --auth-type openai -y -m <model> ...` with the role prompt
  embedded the way `vibe` embeds it, and a base pack to launch.

  ## How (direction, not mandate)

  Register `qwen-code` in `provider-capabilities` mirroring `vibe`. Teach the
  launch-command composer the `qwen` invocation, reusing `qwen_guard` rather
  than adding a second credential path. Add a NEW pack -
  `qwen-code-mono-router.conf` - beside the existing `qwen-mono-router.conf`,
  leaving that one untouched.

  Deliberately NOT in this slice: the ModelFactory `provider->agent` entry
  and the Model Steward cost-class registration (BL-1053, depends on this);
  any change to the aider-based `qwen-mono-router` pack; and the trial run
  itself, which is operational.

  Testing bar: this project's Babashka scripts have no mutation, CRAP or DRY
  tooling wired (Engineering Rules, "Startup Tools"), so the gate is real
  unit-test coverage of the new adapter code under
  `swarmforge/scripts/test/` - a hardening pass here must record that
  degraded fallback rather than imply a mutation run happened.

  ## Specifier answers to two coder questions, 2026-08-22 (nothing to rebuild)

  Both were raised by the coder as priority-00 notes while holding this
  parcel, and both are answered here. Neither changes anything already built
  and no acceptance scenario was added or altered, so this is a read, not a
  rebuild. The one contract change is an extra confirmation step added to
  `qa_e2e_procedure` below.

  ### 1. Which credential variable the new pack PREREQ should name

  The coder observed that `qwen-mono-router.conf` PREREQ names
  `BAILIAN_TOKEN_PLAN_API_KEY` while the generated launch guard ignores it.
  That is correct and it is a genuine defect, but it is NOT this ticket: it
  is now BL-1077, minted separately so this slice stays independent of it.

  For THIS ticket, write the new pack PREREQ against what the guard honors
  TODAY - `QWEN_API_KEY`, or `BAILIAN_CODING_PLAN_API_KEY` as a fallback.
  Do not add a second credential path to make the other name work; that is
  BL-1077 fixing it in one place for both packs. Do not wait for BL-1077
  either. When it lands it will name both pack files and correct this one.

  ### 2. The pack name lands in the aider family, which demands aider

  Also correct, and unlike the first this one IS in scope here, because a
  pack that refuses to launch is not a pack and step 1 of the QA procedure
  below launches exactly this pack.

  `ancillary_provider_lib.sh`s `ancillary_provider_family_for_pack` maps
  `qwen-*` to the `openai_aider` family (line 46), and that family hard
  requires `aider` on PATH (line 208) and supplies aider-shaped model
  defaults. A pack named `qwen-code-mono-router` therefore demands an agent
  it does not use.

  Renaming the pack cannot escape this - the catch-all arm below the case
  also routes any pack whose name merely CONTAINS `qwen` to the same family
  (line 52). Both arms match.

  Direction, not mandate: give qwen-code its own family arm ordered ahead of
  the `qwen-*` arm, the way `gemini-*` and `codex-*` already have their own,
  and give it the endpoint mapping without the aider requirement. The
  credential mapping it needs is the same one the aider family already does.
  Any approach that launches the pack on a host with no aider installed, and
  leaves the existing `qwen-mono-router` pack behaving exactly as before, is
  fine.

