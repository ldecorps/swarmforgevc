id: BL-2056
title: "A local seat's repeat guard reads the file a compaction summary named at the path the summary wrote - it drops a leading slash, so a seat that edits the named file at its absolute path is still judged to have missed the write, and its restart message tells the seat that a file which exists does not exist yet"
milestone: M8
type: defect
severity: high
# high: a live fault degrading behaviour. BL-1991's "a seat that writes
# first is left alone" fails for the seat's own writes (all absolute), so
# a seat that did write is restarted and, on the third count, released
# (BL-1992); and the "does not exist yet" line led the iq3 coder to
# replace an existing step handler with write_file on 2026-10-06.
status: todo
