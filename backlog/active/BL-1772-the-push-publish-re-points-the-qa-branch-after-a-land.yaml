description: |
  ## What

  An operator hotfix is live on main and has never been through a gate.
  This is that gate: a REVIEW ticket - confirm or refute, and open narrow
  follow-ups for anything found.

  ## The failure it fixed (from the commit message)

  QA's standing land recipe never runs `--land`, so the BL-1438 re-point
  never fired and every land walked the leftover QA history (about 2700
  branch-only commits, about 20 minutes, 2026-09-26, recorded on BL-1768
  and left out of that ticket's scope).

  ## What landed (files to review)

  - `swarmforge/scripts/land_main_publish.sh`: `run_push` invokes
    `land_step_cli.bb repoint` after `LAND_PUBLISHED`, passing the
    published commit's subject as the BL-1467 landed-task when present;
    a skip never fails the publish; a `LAND_STOPPED` path never re-points.
  - `swarmforge/roles/QA.prompt`: the standing recipe publishes through
    `--push`, does not hold the land lock across that call, and names
    `LAND_REPOINTED` / `LAND_REPOINT_SKIPPED` on that path.
  - `swarmforge/scripts/test/test_bl1772_push_repoints.sh` and its
    `suite-manifest.tsv` standing row: clean --push re-points, dirty
    skip, refused --push never re-points.

  ## Review goals

  1. Scenarios 01-03 green against the real `--push` (convert the draft,
     handler in the same commit, BL-233).
  2. `bash swarmforge/scripts/test/test_bl1772_push_repoints.sh` ALL PASS
     on the parcel commit (already landed with the hotfix; re-run, do
     not rewrite unless a finding says the suite is wrong).
  3. PROBE, do not fix: a dirty QA worktree still skips, so one unclean
     land leaves the branch long. A follow-up is a note, not an edit
     of the hotfix.

  ## How (direction, not mandate)

  - Drive the REAL `land_main_publish.sh --push` against a fixture
    repository with a bare origin under mkdtemp, the BL-1438 shape,
    never the live checkout.
  - Scenario 03 uses verify-push-safe's refusal (a merge commit), never
    the live checkout.

constraints: >
  Fixture repositories are mkdtemp git init roots (BL-1390). The parcel
  does not edit land_main_publish.sh or QA.prompt.

out_of_scope: |
  Re-implementing the re-point, re-bounding the walk (BL-1461), BL-1768,
  qa-gather duration, a hand re-point of the live QA branch, and writing
  human_decision into the hotfix ledger.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1772-the-push-publish-re-points-the-qa-branch-after-a-land.feature`:
     four cases ok (01, two rows of 02, 03). Record the duration.
  2. `bash swarmforge/scripts/test/test_bl1772_push_repoints.sh`: ALL PASS.
  3. `git diff main...HEAD --name-only` names only evidence, the converted
     feature, its handler, and test files under swarmforge/scripts/test/.

