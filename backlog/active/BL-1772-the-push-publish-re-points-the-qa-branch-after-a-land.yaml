description: |
  ## What is wrong

  Every QA land walks `origin/main..tip` on the QA branch (BL-1461) and
  pays for every review merge and tip-pure leftover that branch still
  carries. BL-1432 / BL-1438 made the cost bound a re-point of
  `swarmforge-QA` to `origin/main` after a successful land. That re-point
  runs only in `land_main_publish.sh` `run_land`, after `LAND_PUBLISHED`.

  QA's standing recipe (`swarmforge/roles/QA.prompt`) is not `--land`.
  It is: acquire the lock, `--decide-only`, ALWAYS hand-build a tip-pure
  commit off current `origin/main` from the parcel's evidence-listed
  paths, `git push origin <sha>:main`, release the lock. The prompt
  still says "the publish re-points your branch after every land
  (BL-1438)" and names `LAND_REPOINTED` / `LAND_REPOINT_SKIPPED` - those
  lines describe `--land`, which this recipe never runs. `--push` (BL-1678)
  exists for exactly this hand-built SHA and also does not re-point.

  Live numbers, 2026-09-26, on BL-1768: about 2700 branch-only commits,
  about 20 minutes per land walk, then often `LAND_ESCALATE` and another
  hand-build. BL-1768's `out_of_scope` names this walk and the `--push`
  path never re-pointing as not its job.

  ## What is wanted

  After `land_main_publish.sh --push` prints `LAND_PUBLISHED`, it invokes
  the same `land_step_cli.bb repoint` verb `--land` already runs, prints
  that verb's line, and does not let a skip fail the publish. A
  `LAND_STOPPED` `--push` never re-points.

  QA's standing land recipe publishes the hand-built SHA through
  `land_main_publish.sh --push` (not a raw `git push origin <sha>:main`),
  so the re-point actually runs. The recipe must not hold the land lock
  across that `--push` call: `--push` acquires the lock itself, and a
  held lock would time out the publish.

  The prompt's existing BL-1438 sentences are retensed to the path QA
  actually runs. The hand-built tip-pure step stays (the prompt's ALWAYS).

  ## How (direction, not mandate)

  - `run_push` already prints `LAND_PUBLISHED $commit` on success and
    returns. The `--land` block immediately below that line in `run_land`
    is the shape to match: capture the verb, print it, ignore its exit.
  - `--push` has no task name today (`LAND_TASK` is the commit). The
    verb accepts an optional landed-ticket id (BL-1467). Passing the
    ticket id from the published commit's subject, when one is there,
    drops that ticket's own bookkeeping as redundant; omitting it keeps
    today's classify-on-shape behaviour. Either is fine if the scenarios
    hold.
  - Fixture: reuse BL-1438's bare-origin-plus-QA-worktree shape, driven
    through `--push <sha>` rather than `--land <task> <sha>`. Scenario 03
    uses verify-push-safe's refusal (a merge commit, or a foreign path),
    never the live checkout.
  - Prove the root with `rev-parse --git-common-dir` before any mutating
    git command (BL-1390). `post-land-repoint!` moves a branch, so the
    fixture must be its own repository.

  ## Out of scope

  - Re-bounding the candidate walk to the parcel (BL-1461 undid that
    bound for a silent-CLEAN reason; it stays wide).
  - BL-1768's stray-superseded ground (c).
  - Speeding `qa-gather` or the unit/property lanes (BL-791).
  - A one-time operator re-point of the live QA worktree (the operator
    can run `bb swarmforge/scripts/land_step_cli.bb repoint <qa-root>
    <ticket>` today if that tree is clean and `in_process` is empty;
    this ticket makes the next land do it).

constraints: >
  Fixture repositories are mkdtemp git init roots (BL-1390). No change to
  which commits are candidates, to post-land-repoint!'s guards, or to the
  ALWAYS hand-built tip-pure step.

out_of_scope: |
  The walk bound, BL-1768, qa-gather duration, and a hand re-point of the
  live QA branch.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1772-the-push-publish-re-points-the-qa-branch-after-a-land.feature`:
     four cases ok (01, two rows of 02, 03). Record the duration.
  2. From the QA checkout, after the next successful hand-built land that
     used `--push`: the publish output shows `LAND_PUBLISHED` then
     `LAND_REPOINTED <old> <new>` (or `LAND_REPOINT_SKIPPED` naming a
     real dirty tree or in_process parcel); when it re-pointed,
     `git -C .worktrees/QA rev-list --count origin/main..HEAD` is 0
     afterwards.
  3. `git diff main...HEAD --name-only` names only the Scope files,
     the converted feature, its handler, and evidence.

