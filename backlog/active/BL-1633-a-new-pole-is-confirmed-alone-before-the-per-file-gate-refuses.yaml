id: BL-1633
title: "The unit lane's per-file budget gate refuses on fork contention, not on code: it reads each file's IN-SUITE duration from npm test's report (10-11 forks) and refuses any unregistered file at or above 1.5x the 7000 ms budget, and telegramFrontDeskBotCli.test.js - 3.7-5.0 s alone after BL-1620's cut - measured 8.0, 9.1, 10.5, 12.3, 12.4, 12.5, 14.3 and 19.7 s in-suite across eight runs at load below 8 with no code change, six of them over the line (hardener, 2026-09-18); the gate confirms a suspected new pole ALONE before refusing, reports one that is under budget alone as contention with both numbers, and the file's register row - re-owned here so BL-1620 can land - leaves in this land"
milestone: M8
type: defect
severity: high
# high: a gate whose verdict flips with the fork pool's contention is a
# broken safety signal - npm test, every role's unit lane, read red on six
# of eight runs for a file that is under budget alone, and would do so for
# any unregistered file whose solo time is a third of the budget. It is
# contained today only because the file keeps a register row (this ticket
# owns it), which is why BL-1620 cannot remove that row as minted.
status: todo
epic: unit-suite-speed
priority: 8
direction: swarm-reported
depends_on: []
