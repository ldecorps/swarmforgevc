# ratchet) are in backlog/done; BL-1620 (active, at the hardender) keeps
# this file's row in place and lands first. BL-1007's contention helper
# (specs/pipeline/steps/lib/contentionBudget.js) exists and is not the
# remedy chosen here - see How.
mutation_cost: medium
# medium: one TypeScript decision extension in check-suite-file-budget.ts
# (under Stryker via out/**), one injected confirmer in the recorder's
# thin wrapper, unit tests, one feature and handler, evidence, one
# register row.
slice_size_envelope: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]

acceptance: specs/features/BL-1633-a-new-pole-is-confirmed-alone-before-the-per-file-gate-refuses.feature

required_wiring:
  - 'extension/scripts/recordTestDuration.js::confirmPoleAlone::the recorder is the pre-existing live consumer of the guard and passes the real confirmer into it; the name is chosen at mint so the literal exists only with the fix (BL-874, BL-1235)'
  - 'specs/pipeline/steps/bl1633NewPoleConfirmedAloneSteps.js::registerSteps::the handler lands in the same parcel as the feature (BL-233, BL-1371)'

human_approval: approved
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: an unregistered file at or
  above the refusal line is refused ONLY after a confirming measurement of
  that file alone also exceeds the budget; a file under budget alone is
  reported as contention with both durations and never refuses the run.
  FIRM: the confirmation is not a bypass - a file over budget alone is
  refused exactly as today, and a confirmation that does not finish
  within three times the budget counts as over budget alone. FIRM: no
  confirmation runs for a file that has a register row or sits below the
  refusal line, and each candidate is confirmed at most once per run.
  FIRM: the 7000 ms budget, the 1.5x line, the stale and unowned rules and
  the work ratchet are unchanged. FIRM: telegramFrontDeskBotCli's register
  row leaves in this land and no other row is touched.

invariants:
  - "A file under the per-file budget alone is never refused as a new pole: every refusal of an unregistered file is preceded by a confirming solo measurement of that file that also exceeds the budget."

description: |
  ## What is wrong

  BL-1598 made the per-file gate refuse only a NEW offender - an
  unregistered file at or above `NEW_POLE_REFUSAL_FRACTION` (1.5x) of the
  7000 ms budget - precisely so that "a snapshot gate that refuses on
  ordinary host-load jitter" would not be red on day one. The margin is
  not enough. The gate reads each file's duration from
  `extension/.vitest-report.json`, `endTime - startTime` per file
  (`extractFileDurations`), measured while the file shares the host with
  the lane's 10-11 forks. The hardener, hardening BL-1620 on 2026-09-18
  (evidence `BL-1620-hardener-20260918.md`, hardender branch 16ef87cee7):

  > Solo `npx vitest run test/telegramFrontDeskBotCli.test.js` measured
  > 3.7-5.0s across 6 runs at load < 8 ... But the REAL `npm test` run -
  > which measures this file's duration from inside its own 10-11
  > concurrent vitest forks ... showed wild variance for this exact file,
  > unchanged across runs: 8.0s, 9.1s, 10.5s, 12.3s, 12.4s, 12.5s, 14.3s,
  > 19.7s. Several of these cross the register's own 1.5x refusal
  > threshold (10500ms), flipping `npm test`'s exit code from 0 to 1
  > non-deterministically, with zero code change between runs.

  Six of eight runs over the line. The in-suite duration is two to four
  times the solo duration, and the ratio itself is not stable, so no fixed
  fraction of the budget separates a pole from contention. BL-1620 as
  minted removed this file's register row in its land ("a surviving row
  reads stale"); with the row gone, every npm test run on main after that
  land would refuse whenever the pool put this file over 10.5 s - most
  runs - and the same is true of any unregistered file whose solo time is
  a third of the budget. That is a broken safety signal for every role's
  unit lane, and it is why BL-1620 was amended on 2026-09-18 to keep the
  row, re-owned here. It is NOT BL-1620's regression (the cut is real:
  22.9 s to 3.7-5.0 s alone) and NOT BL-1599's territory (the work
  ratchet is a whole-suite sum). BL-1007's contention helper
  (`loadNormalizedDurationMs`, load divided by cores) was considered: a
  normalized number still jitters with the pool's real interleaving, and
  the hardener's data spans 2.5x at the same load band, so a normalized
  duration would move the line, not remove the flip.

  ## What is wanted

  - An unregistered file at or above the refusal line in the run's report
    is CONFIRMED ALONE before the gate refuses: the file alone under
    budget -> the verdict is `contention`, the run passes, and the verdict
    line names the file with its in-suite and its solo duration; the file
    alone over budget too -> `new-pole`, refused exactly as today
    (scenario 01).
  - No confirmation runs for a file that has a register row or sits below
    the refusal line, each candidate is confirmed at most once per run,
    and a confirmation that does not finish within three times the budget
    counts as over budget alone (scenario 02).
  - The recorder passes a real confirmer that runs one file alone under
    the unit config and returns its measured duration (scenario 03, a
    fixture test file under the real vitest, about two seconds).
  - `extension/test/telegramFrontDeskBotCli.test.js` is under budget alone
    on the parcel and its register row is gone at the parcel; every other
    row is byte-identical to main (scenario 04).
  - BL-1006, the slice-boundary rule: BL-1620's scenario
    `two-unit-lane-poles-02` ("the register row stays ... the parcel
    leaves the row in backlog/suite-poles.tsv", its Given "names the file
    under BL-1633") is TRUE only while this ticket is open and goes false
    the day this lands - it is RETIRED in this parcel (scenario removed
    from BL-1620's feature, its five handler steps removed from
    bl1620TwoUnitLanePolesSteps.js, never reworded), and BL-1620's
    narrative sentence about the row is re-tensed to the past (scenario
    04's last step). BL-1620's scenarios 01 and 03 stay untouched.
  - BL-1006 again, found by the hardender (note 001399): BL-1598's
    scenario `unit-suite-pole-register-03` ("the committed register names
    the nine poles of 2026-09-16 with an open owner each": exactly 9 rows,
    telegramFrontDeskBotCli among them) is a census pin that this land
    falsifies by design (9 -> 8, the named file gone) - it is RETIRED in
    this parcel (scenario and its four scoped handler steps removed, never
    reworded; its "every row names an open ticket" clause is the gate's
    own unowned-row verdict, scenario 01), and BL-1598's narrative
    sentence about the nine poles is re-tensed to the past (scenario 04's
    last step covers both features). BL-1598's scenarios 01 and 02 stay.

  ## How (direction, not mandate)

  - `checkFileDurationBudget` gains an optional last argument
    `{ confirmAlone?: (file) => number | null }` (or a sibling function
    that wraps it - the existing four-argument callers, including
    BL-1598's and BL-1620's handlers, stay green). For each would-be
    offender it calls the confirmer once; `null`/timeout -> over budget
    alone; under budget -> moved from `offenders` to a new `contention`
    list with `{ file, durationMs, aloneMs, budgetMs }`; `BudgetVerdictKind`
    gains `'contention'` between `watch` and `stale-row` in precedence.
    `formatGuardReport` prints a contention line per file with both
    numbers. Pure, injectable, unit-tested in milliseconds with a fake
    confirmer (the BL-1598 test file's own idiom).
  - `recordTestDuration.js` defines `confirmPoleAlone(file)`: one
    `npx vitest run <file> --reporter=json --outputFile <tmp>` with the
    unit config, `timeout: 3 * PER_FILE_DURATION_BUDGET_MS`, reading that
    file's duration from the JSON report; passed into
    `runGuardAgainstReport` (which forwards it). The script stays a thin
    wrapper (engineering.prompt); the function is exported for scenario 03.
  - The feature's handler drives `checkFileDurationBudget` with fixture
    reports and a recording fake confirmer (scenarios 01-02) - BL-1598's
    `a per-file duration report where <token>` idiom in a scope of its
    own; scenario 03 runs the exported confirmer on a mkdtemp test file
    that sleeps 200 ms (BL-1390 fixture rules, the file under
    `extension/test/` is NOT created - point vitest at the fixture path);
    scenario 04 runs the real file alone once (about 4 s) and reads the
    real register.
  - Register: this parcel deletes the telegramFrontDeskBotCli row; no
    other row changes.
  - BL-1620's feature and handler: delete the `# BL-1620
    two-unit-lane-poles-02` block (comment, Scenario, five steps) and the
    five `scoped(` registrations for its step texts; change the narrative
    clause "that its register row stays, re-owned by BL-1633 (...)" to
    "that its register row stayed, re-owned by BL-1633, until BL-1633
    retired it" - a re-tense, not a rewrite. The runner throws on a
    scenario with no handler, never on a handler with no scenario, so
    remove the scenario and its handlers in the same commit. BL-1620 lands
    before this ticket; if it has not, merge main until it has.
  - BL-1598's feature and handler: delete the `# BL-1598
    unit-suite-pole-register-03` block (comment, Scenario, four steps) and
    the four `scoped(` registrations at bl1598SuitePoleRegisterSteps.js
    lines 229-249 (`backlog/suite-poles.tsv is read`, `it holds exactly 9
    rows`, `every row names a ticket present ...`, `... are among the
    files`); change the narrative clause "and that the nine poles measured
    on 2026-09-16 are registered with an open owner" to "and that the nine
    poles measured on 2026-09-16 were registered with an open owner (the
    census pin retired by BL-1633 as rows drain)" - a re-tense, not a
    rewrite. BL-1629's later accepted row (naming a ticket that closes)
    would have broken the same clause; retiring now preempts it.
  - Documenter: BL-1598's how-to (if any) and engineering-detailed.prompt
    "Test Speed And Isolation" gain the rule: the per-file gate refuses a
    new pole only after confirming it alone; a verdict of `contention` is
    the pool, not the code.

constraints: >
  check-suite-file-budget.ts (the decision extension and its print),
  recordTestDuration.js (the confirmer and its one call), their unit
  tests, one register row, the feature and handler, BL-1620's and
  BL-1598's features and handlers (scenario retirements and narrative
  re-tenses only - BL-1006; the acceptance pointer below is not a claim on
  either sibling's contract), evidence and docs.
  No change to PER_FILE_DURATION_BUDGET_MS, NEW_POLE_REFUSAL_FRACTION,
  STALE_ROW_FRACTION, the unowned rule, the work ratchet, any vitest
  config, or any test file's content. The step handler lands with the
  feature (BL-233). Evidence named BL-1633-*.

out_of_scope: |
  - Making the stale-row rule read solo durations (a row is stale under
    80 percent of budget IN-SUITE today; with confirmation in place a
    stale row only ever costs a report line).
  - The remaining seven register rows (BL-791 slice D, next cuts) and
    the accepted-pole disposition (BL-1629).
  - The bb cold-start cost of BL-1518's real swarm_handoff.bb run inside
    telegramFrontDeskBotCli (about 2.5 s alone; a BL-791 question).
  - Fork-pool sizing (vitest-worker-memory-budget) and the property
    lane's own budgets (BL-1606).

qa_e2e_procedure: |
  On the parcel commit, from `extension/`, with extension/out compiled:
  1. `npx vitest run test/checkSuiteFileBudget*.test.js` (or the lib's
     test file) once -> green, the contention and timeout cases present.
  2. Acceptance resolving all four scenarios
     (`bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1633-*.feature`);
     BL-1598's feature resolving with scenarios 01 and 02 only (03 retired
     here) and BL-1620's with scenarios 01 and 03 only (02 retired here) -
     BL-1006, both.
  3. ONE `npm test` at a 1-minute load below 8 -> exit 0; the verdict
     names telegramFrontDeskBotCli as `contention` with both durations if
     the pool put it over the line, or nothing if it did not; no new-pole,
     no unowned-row; its row absent from backlog/suite-poles.tsv; the
     evidence records the verdict lines verbatim and how many
     confirmations ran. Never "run it N times".
  4. `git diff main...HEAD --name-only` names the two source files, their
     tests, the register, the feature, the handler, evidence and docs
     only.

