description: |
  ## What

  Shared operator verb `/postmortem` (soft confirm tier) that after recovery:
  qualifies cause (`failure_class`, hypotheses, evidence), updates babysitter
  failure-class registry (gitignored JSON), updates operator playbook JSON,
  and mints `backlog/INTAKE-disaster-<class>-<timestamp>.md` stub.

  Reuses `collect_daemon_postmortem.sh`, BL-958 incident record, BL-653
  escalation shape. Refuses when no recent incident in lookback.

qa_e2e_procedure: >
  (1) Starvation-cascade fixture → /postmortem writes qualified record + registries
  + intake stub. (2) Second occurrence → babysitter uses registry (with BL-1171).
  (3) No recent incident → refuse. (4) Parse-error class → human hotfix playbook.

out_of_scope: |
  - Fully automated LLM root-cause without human confirm on learn artefacts.
  - Replacing collect_daemon_postmortem.sh.

