description: >
  WHAT. Mechanical exit gates so claimed deliverables are tracked and
  wired before close — Rank 6 / BL-FIX-006 from the recurring-failure-mode
  audit. Specifier prose already says git status must be clean (BL-314);
  this ticket enforces it and the multi-slice runtime-wiring checklist.

  WHY. Specs and modules get reported ready while untracked or unwired
  (dark features). Rule proposals L8–L9; BL-256 coverage-never-built.

  HOW (direction, not mandate).
  1. Extend specifier_backlog_hygiene_gate so an acceptance: path that
     exists on disk but is absent from git ls-files fails closed.
  2. Ensure pre-QA / handoff-to-QA acceptance checks refuse when the
     path is missing from the cited commit (partner to BL-1027 dangling
     pointer — this is the untracked/working-tree half).
  3. Epic wiring exit checklist: epics with >=2 decomposes_into children
     fail unless at least one child declares non-empty required_wiring
     (BL-531 shape). Hook into backlog_epic_milestone_audit or the
     promotion/close path — one chokepoint, fail closed.
  Prefer extending existing gates over a third parallel CLI.

qa_e2e_procedure: >
  (1) Fixture ticket pointing at an untracked .feature → hygiene exits
  non-zero naming the path. (2) git add that feature → commit-tracking
  check passes. (3) Fixture epic with two children and no
  required_wiring → wiring checklist fails. (4) Add required_wiring to
  one child → checklist passes. (5) Documenter→QA still refuses missing
  acceptance blob at cited commit. Record degraded Babashka gate if any.

out_of_scope: |
  - Rewriting every historical epic that lacks wiring (grandfather or
    one-shot backfill is a follow-up if the audit fails loud on main).
  - Replacing BL-531's per-ticket required_wiring pre-QA check.
  - Changing the BL-314 prose rule beyond pointing at this gate.

