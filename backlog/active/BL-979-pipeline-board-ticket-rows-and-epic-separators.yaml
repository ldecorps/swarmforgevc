approval_context: >
  Three calls to say the word on, all of them your "open for specifier"
  questions answered rather than asked back: (1) row overflow keeps a
  visible budget with a "+N more active" line rather than showing every
  active ticket - say if you would rather the board grow unbounded;
  (2) "(no epic)" gets its own last group with a separator, EXCEPT on a
  wholly epic-less board where no separators are emitted at all;
  (3) the epic separator shows the kebab slug per your mockup - flag if
  a human-readable epic title should win instead. The addendum
  (elapsed time on RECENTLY CLOSED) is split out as BL-980 so this
  reshape can land on its own; say if you would rather have them
  together.
