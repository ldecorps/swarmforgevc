id: BL-979
title: "Pipeline board pivot: tickets become ROWS with the eight stages as shared left-to-right columns, and the caption list gains -- epic-slug -- separators with a blank line before every ticket summary"
milestone: M8
type: feature
status: todo
epic: pipeline-board
human_approval: approved
priority: 0
direction: queue-jump
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
assigned_to: coder
acceptance: specs/features/BL-979-pipeline-board-ticket-rows-and-epic-separators.feature

invariants:
  - "The board never drops a ticket silently: every active ticket either occupies a visible row with its own caption, or is counted in a visible overflow line - and the caption list covers exactly the visible rows, never more and never fewer."
  - "The grid's width is a property of the stage set, not of the ticket count: with eight fixed stage columns plus the id gutter, no ticket is ever dropped for width - only the row budget can drop one."

description: >
  What and why: BL-585's live matrix gives each active ticket its own
  COLUMN with the pipeline stages as shared rows, so the board grows
  sideways with every ticket promoted - and on a phone, width is the
  scarce axis while vertical growth is cheap. This pivots the axis back:
  one row per active ticket, the eight stages as shared columns flowing
  left to right (NS SP CO CL AR HD DC QA), marks still X / . , still ONE
  matrix with a single shared header (NOT a return to BL-455's per-ticket
  pivoted blocks). Below the grid the captions keep BL-956's content
  exactly - display id + truncated full title - but are grouped under
  "-- <epic-slug> --" separator lines, with a blank line before every
  ticket summary, so epic membership is readable at a glance instead of
  being implied by adjacency.

  The human reviewed and approved a verbatim mockup in the same
  conversation ("Perfect.") before the intake was written; it is
  reproduced in the intake and its shape is what scenarios 01-02 pin.

  How (direction, not mandate): the live renderer is
  extension/src/concierge/pipelineBoard.ts - renderGridMatrixLines and
  renderGridLines today iterate PIPELINE_BOARD_COLUMN_ORDER as rows and
  the ticket rows as columns; the pivot transposes that iteration.
  PIPELINE_BOARD_GRID_MAX_WIDTH (30) currently doubles as the column
  DROPPER via maxVisibleGridColumns; after the pivot the dropping axis is
  height, so the budget that drops is a row budget and the width budget
  becomes an assertion (invariant 2). The caption loop already emits one
  blank line at each epic CHANGE (BL-956) - that becomes a separator
  line plus a blank line before every summary.

  Four questions the intake left open, decided here rather than deferred:

  1. Row overflow: keep a visible budget with a "+N more active" tail-drop
     line, same never-a-silent-cap posture as BL-585 - the dropped rows
     are simply the tail of the same epic-grouped stable order, no second
     ordering rule.
  2. The epic-less bucket: "(no epic)" renders as its own LAST group
     behind a "-- (no epic) --" separator; when NO ticket on the board
     carries an epic, no separator is emitted at all rather than one
     lone meaningless header.
  3. Width budget: eight fixed stage columns plus an id gutter is ~27
     chars at today's 3-digit display ids and still fits at 4- and
     5-digit ids, all inside the existing 30-char budget - so ids never
     force a drop (invariant 2, scenario 05).
  4. Relative-time units on RECENTLY CLOSED: that is the intake's
     addendum and is BL-980, not this ticket.

constraints: >
  Firm lines, from the human's locked decisions - do not silently drop
  one:

  - Tickets = rows, stages = columns, left to right in today's order
    NS SP CO CL AR HD DC QA. Marks stay "X" / ".".
  - ONE matrix with a single shared header of stage glyphs. Not BL-455's
    per-ticket pivoted blocks.
  - Caption content is unchanged (BL-956): display id + truncated full
    title, ellipsis truncation, "(no backlog entry)" fallback. Not
    epic-only captions.
  - The epic separator shows the kebab SLUG as in the approved mockup
    (e.g. "-- code-quality-gates --"), not a prettier epic title.
  - Out of scope: the Bubble / Mini App Pipeline page (a separate
    surface); changing mark glyphs or stage order; the PARKED /
    AWAITING APPROVAL / ROOT INTAKE / LINKS section chrome; re-opening
    BL-956's parked/epic caps; and anything about RECENTLY CLOSED
    (BL-980's ticket).
  - Row membership and stage mapping are unchanged: rows are exactly
    backlog/active/ membership (BL-473), and a coordinator-held ticket
    still renders at QA.
  - Unit AND acceptance are updated in the SAME parcel - BL-949 is the
    standing lesson that a layout change leaves stale asserts behind
    otherwise. No standing "pre-pivot" reds.
  - Scenario Outline step handlers validate their parameters against
    explicit KNOWN_VALUES; no passthrough or binary checks.

qa_e2e_procedure: >
  1. Scenario 01: render a board from a fixture active set held at
     distinct stages - assert the header glyph order, one row per ticket,
     and exactly one "X" per row in the held column.
  2. Scenario 02: fixture spanning three epics - assert a
     "-- <slug> --" line opens each group, a blank line precedes every
     summary, and summaries read id + truncated title.
  3. Scenario 03: both example rows - mixed epic membership ends with a
     "-- (no epic) --" group; a wholly epic-less board emits no
     separator.
  4. Scenario 04: more tickets than the row budget - assert the visible
     rows are the leading tail-drop of the same order, the "+N more
     active" line is present with the right N, and the caption list
     covers exactly the visible rows (invariant 1).
  5. Scenario 05: 3-, 4- and 5-digit display ids - no row dropped for
     width, widest line within the grid width budget.
  6. Scenario 06: over-long title and missing backlog entry - caption
     content matches BL-956 unchanged.
  7. Live confirmation: post one real board to the Telegram pipeline
     topic and read it on a phone - the grid must not wrap, and the
     epic groups must be legible without horizontal scrolling. Attach
     the screenshot to the parcel.
  8. Regression: the empty-active board still renders
     "(no active tickets)".
  9. INHERITED FROM BL-1016 (superseded by this parcel, 2026-08-21) - this
     parcel is what turns `main` green, so these are gating here or nowhere:
     a. Run `node specs/pipeline/cli.js
        specs/features/BL-585-pipeline-board-ticket-column-matrix.feature`
        on the parcel tip and confirm ZERO failures. On `main` before the
        merge the same command gives 12 pass / 2 fail - both failures are
        BL-585 scenario 03's Examples rows, stale since BL-956 moved the
        grid caption from the epic to the title. Confirm that red on `main`
        too, so the fix is shown to be real and not a fixture artifact.
     b. Grep every `.feature` file for "appears below the matrix" and for
        "active ticket BL-537 whose epic is" - zero hits must remain.
        (BL-854's feature also contains "whose epic is"; its handler is
        anchored on the literal "active ticket BL-537" and must be left
        alone.)
     c. Confirm no orphaned step handler survives in
        specs/pipeline/steps/bl585PipelineBoardTicketColumnMatrixSteps.js
        for the retired scenario, and run the FULL acceptance suite -
        specs/pipeline/runtime.js throws on a scenario lacking a handler,
        so an over-deletion fails loudly rather than silently.
     d. Run BL-956's own feature and confirm it is untouched and green:
        its scenarios 01/02 are the named successor coverage for everything
        the retired scenario asserted, and that coverage must survive.
     e. Read the BL-585 `Feature:` narrative and confirm no sentence still
        promises the epic appears in a caption line.

