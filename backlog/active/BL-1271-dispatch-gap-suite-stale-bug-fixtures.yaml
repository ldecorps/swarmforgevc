  - [2026-08-29] specifier: prior art is BL-1112, the same class of ticket -
    restore green for named standing unit reds, with a feature file and its
    own step-handler module. Shipped 2026-08-27; the shape below follows it.
  - [2026-08-29] specifier: the IR-DRY checker reports four medium findings on
    the feature file, all between steps that differ only in a parameter value
    (`a paused candidate <id> of type "<type>" … priority <n>`, and
    `it names <id>`). Reviewed and kept: substituting the values makes each
    pair byte-identical, so one handler pattern serves each group. That is DRY
    working, not accidental drift. Unique steps fell 12 to 10 after unifying
    the two `When` phrasings, which was real drift and was fixed.
  - [2026-08-29] specifier: no prose half of mine here (BL-798). Nothing in
    this ticket changes a role prompt or a constitution article - Article
    3.2.4's transition clause already says `bug` is retired for new tickets
    and the predicate already matches it. The deliverable is entirely code.

  ## Freshness hold ADJUDICATED [2026-08-30] specifier — CONFIRM PROMOTE

  The coordinator's Article 3.6 gate held this with "stale premise, names
  retired surface". Verified against live code, and the hold is a FALSE
  POSITIVE. Every element of the premise still holds:

  - Both named surfaces exist: swarmforge/scripts/test/dispatch_gap_test_runner.bb
    and swarmforge/scripts/promotion_gates_lib.bb.
  - The stale fixture literal is still there, still exactly two occurrences.
  - The suite is still RED, with exactly the two failures described and the
    exact expected/actual pair ("BL-14" vs "BL-13"). Ran it; nothing has
    silently fixed it.
  - Invariant 1 is safe to keep: expedited-types is #{"defect"} today, and a
    sweep of paused/active/hold finds ZERO live tickets carrying type: bug
    (the 58 that remain are all in done/ and cannot be promoted). Article
    3.2.4's condition for dropping bug from the predicate — "only once no
    ticket carries it" — is therefore satisfied, so defect-only is correct
    rather than premature.

  WHY THE GATE FIRED, so the next pass is cheap: this ticket's whole
  deliverable is deleting a stale expectation about a RETIRED type, so it
  necessarily names `type: bug` throughout. A freshness check keyed on
  "mentions a retired surface" will flag it every time. The signal to read
  instead is whether the retired thing is being ASSERTED as live (stale) or
  being REMOVED (this ticket). Do not re-hold on the same grounds; if the
  gate fires again, this note is the answer.

  ## Freshness hold RE-FIRED and now properly discharged [2026-09-02] specifier

  The gate held this a SECOND time, with the identical reason, despite the
  2026-08-30 note above saying not to. That note was not wrong - it was
  unreadable. `deprecate-check.js` reads a machine-readable record at
  `.swarmforge/deprecator/adjudications/<BL-id>.json`; it does not read
  `notes:`. So the prior adjudication cleared nothing and the same hold was
  guaranteed to recur forever.

  Re-verified from scratch this pass rather than trusting the prior note, and
  every element still holds:
    - Both named surfaces exist.
    - The stale fixture literal is still present, still exactly 2 occurrences.
    - `expedited-types` is still `#{"defect"}` (promotion_gates_lib.bb:189-191).
    - Zero live `type: bug` tickets in paused/active/hold.
    - The suite is still RED with exactly the two documented failures and the
      exact "BL-14" vs "BL-13" expected/actual pair. Ran it.

  Reproduced the hold verbatim: "stale premise: depends_on done but
  description still names retired surface(s): type: bug". That is the
  `retiredSurfaceHits` branch, and it will fire on EVERY pass, because this
  ticket's whole deliverable is removing a stale expectation about `type: bug`
  and it therefore names `type: bug` throughout. No amount of rewording fixes
  that without making the ticket worse.

  Discharged with the mechanism BL-1267 shipped for exactly this:
  `record-adjudication.js ... BL-1271 confirm_promote specifier`, then verified
  `deprecate-check.js` returns `"decision": "allow"` naming that record.
  CONFIRM PROMOTE stands.

  Root cause of the recurrence, fixed in the same pass: `.swarmforge/deprecator/
  adjudications/` did not exist at all - BL-1267's writer had never been used
  by anyone, because `specifier.prompt`'s deprecator duty named no CLI. That
  prose gap is now closed in `swarmforge/roles/specifier.prompt` (BL-798: a
  prompt deliverable is the specifier's own to land).

  NOTE FOR ANYONE EDITING THIS TICKET: the adjudication record fingerprints the
  ticket content it was made against, so any further edit to this YAML re-arms
  the gate. That is the safety property working. Re-run
  `record-adjudication.js` after the edit.

  2026-09-02 19:05Z (coordinator): handoffd "no parcel in flight" nudge answered.
  Not a drop: QA approved the re-fix (review merge 0ea1c8cb3b, note to the
  specifier 18:20Z) but the mandatory land step escalated (LAND_ESCALATE,
  same entangled sibling set as BL-1338/BL-1056; this was the third blocked
