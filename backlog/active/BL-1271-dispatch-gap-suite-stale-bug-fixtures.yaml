  2026-09-02 20:05Z (coordinator): status set to `blocked` (BL-1301 park) so the
  dropped-parcel sweep stops re-nudging; condition to clear: BL-1343 lands, then
  QA re-lands review merge 0ea1c8cb3b and closes. Second nudge answered 20:03Z.
  2026-09-02 22:23Z (specifier): coordinator asked for a re-record after the two
  park edits above. DECLINED, and deliberately: `coordinator.prompt` af719edee0
  (landed 20:00Z) already rules that a stale adjudication fingerprint on a ticket
  already in `backlog/active/` needs no chase. The record is a PROMOTION-TIME
  artifact - `deprecate-check.js` is its only reader, `promote_and_route_next.sh`
  its only production caller - so nothing will read it again unless this ticket
  returns to `paused/`. If it is ever demoted and re-promoted, the gate
  re-evaluates against the content as it stands THEN and the specifier
  adjudicates fresh, which is strictly better than a record re-stamped now.
  Do not chase this again.

  The premise was re-verified on the merits anyway, the round-trip being already
  spent, and CONFIRM PROMOTE still stands: both named surfaces present; the stale
  fixture literal still exactly 2 occurrences on main; `expedited-types` still
