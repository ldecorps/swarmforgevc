id: BL-1276
title: "the task-scope gate refuses a ticket for editing the very feature file its own landed YAML declares (acceptance: or retires:), leaving the coder no move that does not either violate the spec or defeat the gate"
milestone: M8
type: defect
severity: high
# high: a live, committed, fully-tested parcel (BL-1246 at 3c07857a5) cannot be
# forwarded, and every move available to its author is worse than the block.
# Not critical: nothing is lost or corrupted, the gate is right about every
# other shape, and the blocked work sits safely on the coder branch.
status: todo
epic: code-quality-gates
priority: 40
direction: agent-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1276-a-tickets-own-declared-paths-are-not-foreign.feature

invariants:
  - "A parcel is never refused with an outcome its recipient has no action available to satisfy."
  - "The exemption covers only the exact path strings the ticket declares in its own acceptance: or retires: fields; any other path belonging to that same foreign ticket is still reported."
  - "The exemption is derived from the ticket's own landed declaration, never from a list of ticket-id pairs; a declaration that cannot be read grants no exemption."

required_wiring:
  - 'specs/pipeline/steps/index.js::bl1276::the acceptance handler for this feature file is registered'
  - 'swarmforge/scripts/task_scope_gate_lib.bb::declared-exempt-paths::the ticket own declared paths reach the scope decision. Name fixed here so the wiring gate has a literal to match (BL-874); everything else about the shape is the implementer call.'

description: |
  ## What is wrong

  `foreign-scope-findings` (`swarmforge/scripts/task_scope_gate_lib.bb`)
  attributes a changed path to a ticket by the id in the path's own BASENAME,
  and exempts exactly one thing: `backlog/evidence/<task-id>-*` for the named
  task. Nothing else.

  A ticket whose own landed YAML DECLARES another ticket's path as part of its
  own deliverable therefore cannot be forwarded at all. The specifier writes
  those declarations deliberately, and there are two kinds:

  - `acceptance:` - a defect filed against a shipped check amends the durable
    contract for that check rather than forking it in two.
  - `retires:` - a retirement ticket, by construction, edits the SUPERSEDED
    ticket's feature file. BL-1006 requires exactly this ("retire, never
    reword"), so the constitution mandates the very edit the gate refuses.

  Either way the one file the ticket MUST edit is the one file the gate reads
  as foreign.

  ## The live instance

  BL-1246 - a human ruling, "Exempt git-ignored dirs (tmp/) by construction" -
  is implemented, unit-tested 22/22, acceptance 9/9, and committed at
  `3c07857a5` on `swarmforge-coder`. `swarm_handoff.sh` refuses it verbatim:

      Cannot send git_handoff for BL-1246: this task's own commits since its
      last handoff carry a path (specs/features/BL-1230-no-leaked-git-
      repository-inside-the-working-tree.feature) belonging to BL-1230, not to
      BL-1246 ... Rebuild or cherry-pick a tip-pure commit and re-send.

  BL-1246's `acceptance:` field IS that file. Evidence, written by the coder
  rather than worked around:
  `backlog/evidence/BL-1246-handoff-blocked-by-task-scope-gate-20260829.md`.

  ## The second live instance (added 2026-08-29, and why this ticket widened)

  BL-1251 - retire BL-1248 scenario 04 now the reconcile sweep is re-armed - is
  implemented and committed at `4ba1d0c9e` on `swarmforge-coder`, and is refused
  for editing `specs/features/BL-1248-master-main-reconcile-kill-switch.feature`.
  That file carries `RETIRE-WITH: BL-1251` on main: it NAMES BL-1251 as its
  retirer. BL-1251 has no `acceptance:` field at all, so an exemption keyed only
  on `acceptance:` - which is what this ticket originally proposed - would leave
  BL-1251 blocked with no move. That is why the predicate is now stated over the
  ticket's declarations rather than over one field. Evidence:
  `backlog/evidence/BL-1251-handoff-blocked-by-task-scope-gate-20260829.md`.

  The retirement case is the sharper of the two: BL-1006, in the specifier's own
  role prompt, REQUIRES the retiring ticket to edit the superseded ticket's
  feature file ("retire, never reword"), so here the gate refuses a
  constitutionally mandated action. The untagged-commit escape is also worse
  here than for BL-1246, because it destroys the retirement attribution BL-1006
  exists to keep greppable.

  ## Why the prescribed remedy is a no-op here

  Every move the refusal offers, and every move around it, is worse:

  - **Tip-pure commit**: the only way to make BL-1246's tip pure is to drop
    the scenarios it exists to add - leaving handlers with no scenarios, or
    scenarios with no handlers, which makes the acceptance runner throw
    (BL-233).
  - **BL-1241's rebuild-off-main hatch**: it replays "this task's own paths",
    which is precisely the set that EXCLUDES the foreign-named feature file.
    The hatch cannot express this case.
  - **A commit subject leading with `BL-1230`**: the gate would skip it, and
    the gate's answer would be wrong for the same reason it is wrong now. That
    is passing by re-labelling, not by fixing.

  This is the fourth instance of the shape named in BL-1237, BL-1240 and
  BL-1241: a gate whose refusal reaches someone with no action available.
  Invariant 1 is BL-1241's own checkable general form, reused verbatim.

  ## How (direction, not mandate)

  Exempt by construction, from a predicate the ticket YAML already carries:
  a path is not foreign when the task's OWN ticket declares that exact path in
  one of its declaring fields - today `acceptance:` (a single path) and
  `retires:` (a list of paths, added to backlog-schema.md by this amendment).
  No list of ticket pairs, no pairing table, nothing to maintain. Read both
  fields through ONE declared-paths accessor, so that a third declaring field
  later is a one-line addition rather than a new branch.

  Read the declaration from the landed ticket, not the sender's working copy -
  `swarm_handoff.bb`'s own `active-ticket-yaml-content` already does exactly
  this (freshest of `main`/`origin/main` first via `declaration-refs`, exact
  `id:` match, working-tree glob only as a last-resort fallback), and it is
  already in the file that calls the gate. Reusing it also means an amendment
  the specifier landed on `main` is honoured immediately, without the sender
  merging first.

  Keep `foreign-scope-findings` pure: the declared path is an input to it, the
  read happens at the one impure entry point (`findings-for-git-handoff`) or at
  its caller. A declaration that cannot be read grants no exemption, and the
  refusal must SAY the exemption could not be evaluated - otherwise this fix
  reproduces the very shape it removes, sending its recipient off to rebuild a
  commit that did not need rebuilding.

  ## Constraints

  - Exactness. Only the declared path string is exempt. `backlog/active/BL-1230-*.yaml`
    is still foreign to BL-1246 even though `specs/features/BL-1230-*.feature`
    is not. The exemption must not widen to "any path of a ticket I reference".
  - Everything BL-1192 shipped stays. The seven scenarios in
    `specs/features/BL-1192-pre-handoff-task-scope-gate.feature` must still
    pass unchanged, including the fail-open posture on an unreadable walk.
  - No new bypass, env var, or override flag. The predicate is derived or it
    does not exist.

qa_e2e_procedure: >
  (1) Rebuild BL-1246's literal shape in a scratch repo: a ticket whose
  acceptance: names another ticket's feature file, and a commit tagged for it
  that edits exactly that file; confirm the send is accepted. (2) Add a second
  file belonging to that same foreign ticket (its backlog YAML) to the commit
  and confirm the send is refused, naming that path and not the exempt one -
  the exemption must not widen. (3) Point the ticket's acceptance: at its own
  feature file, keep the foreign edit, and confirm the send is refused.
  (4) Land an acceptance: amendment on main WITHOUT merging it into the
  sender's branch and confirm the exemption is honoured from the landed ref.
  (5) Make the ticket unresolvable on every ref and in the working tree, and
  confirm the send is refused AND the refusal says the exemption could not be
  evaluated. (6) Re-run the whole BL-1192 acceptance feature and confirm all
  seven scenarios still pass. (7) Against the live repo, from
  .worktrees/coder with this fix present, re-send BOTH held parcels unchanged
  and confirm each is delivered: BL-1246 at 3c07857a5 (acceptance-declared) and
  BL-1251 at 4ba1d0c9e (retires-declared).

out_of_scope: |
  - BL-1246 itself, and BL-1251 itself. Both commits are correct and stay
    exactly as they are; this ticket unblocks them, it does not rebuild them.
  - A two-sided handshake. The `RETIRE-WITH: <id>` marker inside a feature file
    is documentation, NOT a gate input: do not build a predicate that greps it,
    and do not require it to agree with `retires:`. The trust model is the one
    `acceptance:` already has - the specifier writes the declaration in the
    ticket's own landed YAML, and that is the whole authority. Grepping a
    free-form prose comment would be fragile in exactly the way this repo has
    been bitten by before, and the marker's existing usages are not all ticket
    ids (one reads "whichever ticket reopens the genuine-conflict recovery
    path").
  - The land step's entangled-siblings report (BL-1272) and BL-1192's range
    walk. Different mechanism, different file; only the foreign/not-foreign
    predicate changes here.
  - Any general "ticket A may touch ticket B's paths" relation. The only
    relation this ticket adds is the one the ticket YAML already states about
    itself.
  - Folding this ticket's scenarios into BL-1192's feature file. See notes.

source: |
