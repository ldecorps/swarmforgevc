description: |
  ## What

  The bridge's mono-router live-screen capture is a synchronous tmux +
  filesystem walk. The Resident Spy Mini App polls `/resident-pane` faster
  than that walk can finish under load, so overlapping polls pile onto
  Node's single event-loop thread and wedge the whole bridge (HTML shells
  time out too).

  ## Draft already written (land this; do not rewrite)

  Uncommitted on the master worktree at mint time — **keep it**:

  - `extension/src/bridge/residentPaneLive.ts` — `RESIDENT_PANE_CACHE_TTL_MS
    = 5_000` around `captureMonoRouterLiveScreen`; uncached body as
    `captureMonoRouterLiveScreenUncached`; `clearResidentPaneLiveCache()`
    test hook.
  - `extension/src/bridge/residentSpyUiHtml.ts` — refresh interval 1500 →
    4000 ms (comment ties it to the cache TTL).
  - `extension/test/residentPaneLive.test.js` — `withFreshPaneCache` clears
    the TTL cache around capture assertions.

  ## Constraints

  - Stamp-and-land posture: review and gate the draft; open narrow
    follow-ups if something is wrong. Do not replace it with a different
    design in the same parcel.
  - Cache key includes `targetPath` so two roots cannot share a snapshot.
  - No broader bridge worker-thread / async-capture redesign in this ticket.
  - Committing the three-file draft (under this ticket) is what clears the
    build-freshness blocker the coordinator flagged; leaving it dirty keeps
    sync refused.

  ## Out of scope

  - BL-775 Bubble Live Screen shell and sibling Bubble remote pages, except
    insofar as they already share this capture source.
  - BL-569 interactive pane input.
  - Changing `/resident-pane` HTTP routing or auth.

  ## e2e QA procedure

  1. Confirm the three draft files are the ones under test (diff vs main
     is only the TTL cache, poll interval, and test hook).
  2. Unit: `npm test` covering `residentPaneLive.test.js` — cache-clear
     hook leaves capture assertions green; overlapping same-path captures
     within TTL do not each pay a full walk (assert via the test hook /
     cache behaviour the suite already pins).
  3. Manual or bridge-level: with the Mini App Live / Resident Spy open,
     bridge HTML shells must not time out under the previous 1.5s poll
     burst pattern; poll interval in the served HTML is 4s.
  4. Confirm build-freshness: after the draft is committed under this
     ticket, `build_freshness_cli.bb sync` is no longer refused for this
     dirty path.

