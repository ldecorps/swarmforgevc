id: BL-1469
title: "A ticket whose deliverable the host gates by date (a mutation run under mutation_cooldown_days) has no machine-readable earliest promotion date, so prose in notes is all that stops the coordinator promoting it into a slot it cannot use - BL-1439 on 2026-09-05 froze the swarm at cap 1, BL-1468 was promoted 14:04Z on 2026-09-07 by the batch promotion after an approval sweep and demoted three minutes later; the promotion gates refuse a candidate before its not_before date on every path, queue-jump included"
