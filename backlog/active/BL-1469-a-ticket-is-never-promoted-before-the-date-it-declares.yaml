notes: |
  Minted 2026-09-07 by the specifier on the coder's note, the same pass.
  Landed with this mint (prose halves, BL-798): the `not_before` row in
  backlog-schema.md and the coordinator prompt bullet; BL-1468 parked
  under `status: blocked` + `not_before: 2026-09-10`.

  Grepped first: no field or gate for a date exists (backlog-schema.md,
  promotion_gates_lib.bb); `status: blocked` is the nearest mechanism and
  needs a hand to clear it.

  Why a field and not the park alone: a park must be cleared by someone
  on the right day and a forgotten park never promotes; a date clears
  itself.

