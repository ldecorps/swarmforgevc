id: BL-1090
title: "A lost tick baseline re-posts an exact duplicate approval ask: the concierge edge path never consults the ask store, so a crash between the Telegram post and the durable tick-state write puts a second identical buttoned ask in the human's Approvals topic"
milestone: M8
type: defect
severity: medium
# medium, not high: the duplicate is NOISE in the Approvals topic, not
# corruption - both asks name the same ticket, so tapping either records the
# same verdict. It needs a crash inside a narrow window to fire. Deliberately
# NOT high/critical, so it does not enter the Article 3.2.4 expedite lane and
# cannot jump the Cursor-seat chain the human pinned on 2026-08-23.
status: todo
epic: swarm-reliability
priority: 20
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1090-a-lost-tick-baseline-reposts-an-exact-duplicate-approval-ask.feature
human_approval: approved
invariants:
  - "At most one live approval ask per (ticket, live Approvals topic): no crash point between the Telegram post and the durable tick-state write may produce a second identical ask for the same ticket."
  - "Suppression is never silent loss: an ApprovalRequested the edge guard drops is recorded as emitted in that same tick, so the durable dedup key carries the fact forward instead of the next tick re-deriving it."
  - "Remint is never suppressed: an ask recorded against a topic id that is not the live Approvals topic is still re-posted onto the live one, exactly as reconcile already does."

description: |
  ## The mechanism

  `runConciergeTick` (`extension/src/concierge/conciergeTick.ts`) derives its
  events by diffing the previous durable snapshot against the current one:

      const state = adapters.readTickState();
      const alreadyEmitted = new Set(state.emittedKeys);
      const edgeEvents = deriveSwarmEvents(state.snapshot, curr, alreadyEmitted);

  For an approval, the tick then does three things in order: post the ask to
  Telegram, record it in `telegram-approval-ask-messages.json`, and finally
  write the new tick state. Those are three separate writes with no
  transaction across them.

  There are TWO consumers of the resulting ApprovalRequested, and only one of
  them knows about the ask store:

  - **The reconcile path** — `approvalAsksNeedingRepost`
    (`extension/src/concierge/approvalAskReconcile.ts`) already filters out any
    id whose recorded ask sits on the live Approvals topic. It is correct.
  - **The edge path** — `deriveSwarmEvents` / `diffApprovalRequested` decides
    purely from `state.snapshot` vs `curr` and `state.emittedKeys`. It never
    reads the ask store.

  ## The failure

  If the process dies after the Telegram post and the ask-store write but
  before `writeTickState`, the durable baseline still says the ticket was not
  pending and `emittedKeys` still lacks `ApprovalRequested:<id>`. On the next
  tick the edge re-derives the transition and posts a second, byte-identical
  buttoned ask into the Approvals topic. Reconcile looks at the same state and
  correctly does nothing — so the two halves of the same mechanism disagree,
  and the half that wins is the one that posts.

  The window is narrow but it is exactly the window that opens under the
  conditions the swarm already has on record: supervisor restarts, the
  handoffd flap of 2026-08-20, and the front-desk respawn loop of BL-1088.
  A restart during a burst of newly-pending tickets duplicates every one of
  them.

  ## Why the human sees it and the swarm does not

  Nothing in the tick logs a duplicate as a duplicate — the second post is a
  perfectly ordinary successful send. The only observer is the human, looking
  at two identical asks in the Approvals topic and having to guess whether the
  first tap registered.

  ## A draft already exists — land it, do not rewrite it

  A complete draft of this fix was found UNCOMMITTED in the master worktree at
  mint time (mtime 2026-08-23 01:48 BST, base `c152a33e5`), with no ticket and
  no branch. It is a continuation of the human's own out-of-band module —
  `approvalAskReconcile.ts` was itself created by `87546a748`, a human commit,
  never through the pipeline.

  It is captured verbatim, with full provenance and the freshness evidence, in:

  - `backlog/evidence/BL-1090-uncommitted-draft-20260823.md`
  - `backlog/evidence/BL-1090-uncommitted-draft-20260823.patch` (applies clean
    onto `c152a33e5`)

  **Disposition, following the BL-881 precedent (2026-08-11, archived intake
  `INTAKE-resident-pane-live-capture-ttl-cache.md`, where the human chose
  keep + ticket): treat the draft as the intended landing — a review-and-stamp
  of a pre-written fix, not a greenfield rewrite.** Re-implement only if the
  architect finds the draft wrong, and say so explicitly if you do.

  The draft's shape:

  - Extract `approvalAskRecordedOnLiveTopic(backlogId, recordedAsks,
    liveApprovalsTopicId)` out of the existing `approvalAsksNeedingRepost`
    filter, so ONE predicate answers "is this ask already live" for both
    consumers and they cannot drift apart. This is the load-bearing part.
  - In `runConciergeTick`, filter the derived edge events through that
    predicate before they are processed, adding each dropped event's key to
    `alreadyEmitted` so the durable state catches up.
  - Leave the remint case alone: a recorded ask on a STALE topic id must still
    re-post.

  ## Where it came from

  Reported by the coordinator as a `note` (2026-08-23 01:16Z, "Orphaned
  uncommitted WIP in extension/src/concierge/*.ts blocks freshness") after
  `build_freshness_cli.bb sync` refused for `:dirty-surface` while closing
  BL-1043. The coordinator was right not to sweep or `--override` it.

  ## How (direction, not mandate)

  The draft's own direction is the recommended one: a shared predicate, and
  the edge path consulting it. An architect who prefers to fix this a layer
  down — by making the post/record/persist sequence recoverable rather than by
  filtering after the fact — should say so; that is a bigger slice and would
  need its own ticket rather than being absorbed here.

  What must NOT happen either way: a fix that suppresses the remint case, or
  one that drops the event without recording it as emitted (invariant 2) —
  that trades a duplicate ask for a lost one, which is the worse defect.

  ## Scope

  - `extension/src/concierge/approvalAskReconcile.ts` — extract the shared
    predicate.
  - `extension/src/concierge/conciergeTick.ts` — the edge guard in
    `runConciergeTick`.
  - `extension/test/approvalAskReconcile.test.js`,
    `extension/test/conciergeTick.test.js` — the draft already carries four
    tests; keep them and add whatever the gates need.
  - Step handlers for this ticket's feature file land in THIS parcel (BL-233:
    the acceptance runner throws on a scenario with no handler).
  - Out of scope: the roster/index message, the reply-parsing path, and the
    Approvals topic's own creation — those are BL-434's and are untouched.
  - Out of scope: the standing process gap that let an untracked draft block
    the freshness sync for the third time. That is a separate concern and is
    recorded in this ticket's notes for the closing-ceremony lean pass, not
    fixed here.

qa_e2e_procedure: >
  1. At the parent commit, reproduce the duplicate directly against the tick.
  Seed a durable tick state whose snapshot does NOT list the ticket as pending
  and whose `emittedKeys` is empty, while the ask store DOES record an ask for
  that ticket against the LIVE Approvals topic id — i.e. the exact state a
  crash between the ask-store write and `writeTickState` leaves behind. Run
  the tick and confirm a second ask is sent. That send is the defect; do not
  accept a code reading in its place.

  2. At the parcel commit, repeat step 1 and confirm NO ask is sent, and that
  the tick still reports the ticket as pending in its written snapshot.

  3. Confirm the catch-up half of the fix: after step 2, read the written tick
  state and confirm `ApprovalRequested:<id>` is now in `emittedKeys`, so a
  third tick would not re-derive it even if the ask store were emptied.

  4. Confirm remint is still ARMED — the regression that matters most. Seed
  the same state but with the recorded ask against a STALE topic id, run the
  tick, and confirm the ask IS re-posted, onto the LIVE Approvals topic id.

  5. Confirm the no-ask-store case is unchanged: with an empty ask store, a
  genuinely newly-pending ticket still gets exactly one ask.

  6. Confirm the two consumers agree, which is the point of the extraction:
  drive `approvalAsksNeedingRepost` and the edge guard over the same three
  inputs (live match / stale match / absent) and confirm they classify each
  identically.

  7. Confirm scope: `git diff` the parcel and confirm the roster message, the
  reply-parsing path and Approvals topic creation are untouched.

  8. In the LIVE swarm, watch the Approvals topic across a real front-desk
  restart with at least one ticket newly pending, and confirm exactly one ask
  appears.

approval_context: >
  Two things need a human, and they are separable.

  FIRST, and blocking nothing else: the draft in the master worktree is yours,
  not an agent's. It is captured verbatim in
  `backlog/evidence/BL-1090-uncommitted-draft-20260823.patch`, so it is now
  safe from a `git checkout` either way — but the working tree is still dirty
  and `build_freshness_cli.bb sync` will keep refusing (`:dirty-surface`)
  until you commit it or discard it. Four of six supervised processes are
  running stale code right now: front_desk_supervisor, handoffd,
  handoffd_supervisor, operator_runtime. Neither the coordinator nor the
  specifier may sweep or commit work they did not write, so this is genuinely
  yours to settle.

  SECOND, the ticket itself: the recommendation is to land your draft as
  written rather than rebuild it, because it is complete, tested, and its
  shared-predicate shape is the right one. Say so if you would rather the
  swarm treat it as a sketch.

  Note on ordering: this is minted `medium`, deliberately, so it stays out of
  the expedite lane and cannot jump the BL-1078/1079/1080/1081 Cursor-seat
  chain you pinned at 02:20 BST.

