  stays; the PREREQ tells the truth; scenario 02 is a fixture-based gate
  check with a sensitivity row; scenario 03's launch step is literal. The
  human ruling (model) is untouched, so human_approval stays approved;
  the amended text is what the coder builds. No bounce recorded: the
  coder produced nothing wrong and record-bounce.js cannot name the
  specifier as the producing role. Recorded, not ticketed: (a)
  .swarmforge/swarm.env defaults PACK_STAFFING_SKIP_GATE to 1 since
  2026-09-04, so every launch on this host skips the gate whatever a
  pack's LAUNCH line says - an operator file, surfaced for the operator;
  (b) certifying the seven seats for real means running the
  compliance_battery gate per role for both models and recording the
  scorecards - steward work with live provider calls, the operator's to
