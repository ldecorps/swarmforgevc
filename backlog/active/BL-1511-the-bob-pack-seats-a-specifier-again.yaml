description: |
  ## What

  `swarmforge/packs/bob-multi-provider-mono-router.conf` gains a
  `window specifier ...` line on the ruled model, placed after the coder
  home line like every other mono-router pack (e.g.
  anthropic-mono-router.conf: `window specifier claude master --model
  claude-fable-5-1 --dangerously-skip-permissions --effort high`). The
  header's "Role -> agent -> model" table gets the specifier row; the
  "specifier is deliberately ABSENT" sentence and the window-block
  comment go. The PREREQ's reason for `PACK_STAFFING_SKIP_GATE=1` is
  rewritten to the truth: the old reason (no `["aider"
  "openai/glm-5.3-flash"]` row in agent-model-providers) no longer
  holds - the gate resolves every b.ai line to tencentcloud2/glm-5.3-flash
  and the specifier line to anthropic/claude-fable-5-1 - but the gate
  still REFUSES every line: on this host's live root every window line
  reads `role-gate-not-pass` because no compliance scorecard exists under
  `.swarmforge/model-steward/scorecards/` for either model (both are
  ranked on the role matrices by live-battery evidence; check 3 needs a
  `<role>-gate` entry with status pass), and on the committed seed
  (`swarmforge/model-steward/seed/models.seed.json`, a fresh checkout or
  a stale worktree copy) every line reads `not-on-role-matrix`. So the
  PREREQ keeps the hatch, names that failing check and the steward
  command that clears it (`bb swarmforge/scripts/compliance_battery.bb
  gate <role> ...` then `bb swarmforge/scripts/model_steward_cli.bb show
  <provider>/<model>`), and the LAUNCH line keeps
  `PACK_STAFFING_SKIP_GATE=1`. The specifier's original claim ("measured
  2026-09-10 ... pass on every b.ai line") came from passing the raw pack
  file where the CLI expects a tab-separated windows-file, which reads a
  vacuous pass on every line; the coder caught it (spec-gap note,
  `backlog/evidence/BL-1511-coder-spec-gap-20260916.md`). If the human
  rules all-GLM, the prerequisite for the specifier seat is the same
  B_AI_API_KEY the workers use; if Claude, the Anthropic subscription the
  coordinator seat already needs.

  ## Why

  With no specifier line, `rotate_to_role.sh specifier` has nothing to
  resolve on this pack: root intakes and unowned-red notes cannot be
  drained by a swarm running it (four such notes were structurally
  undeliverable on 2026-09-09).

  ## Scenario notes for the coder

  - Scenario 01/03 parse the pack with the launcher's own `parse_config`
    (the test_alternate_runtime_launch.sh shape) and read the header
    text; the ruled agent/model comes from the ticket's `human_ruling`.
  - Scenario 02 (amended 2026-09-16) never reads the live steward state
    (`.swarmforge/` is gitignored, per-worktree, and stale in every
    worktree - the coder's copy dates from 2026-09-06): the handler builds
    a scratch root with `.swarmforge/model-steward/registry.json` (role
    matrix entries for the pack's worker model on every worker role and,
    per row, the ruled specifier model on specifier) and
    `scorecards/<provider>__<model>.json` carrying `{competency:
    "<role>-gate", status: "pass"}` entries (the hy3 scorecard's shape),
    derives the windows-file from the pack's `window` lines by the
    launcher's own field rules (role, agent, worktree, optional
    task|batch, optional propagation, optional idle-clear, the rest is
    extra-cli; `swarmforge.sh` parse_config), pins its length at 7, and
    runs `bb swarmforge/scripts/pack_staffing_gate_cli.bb <scratch-root>
    <windows-file>` with `env -u PACK_STAFFING_SKIP_GATE` (BL-1485: decide
    the variable in the handler). Row 2 is the sensitivity draw: with no
    specifier-model entry the specifier line must refuse
    `not-on-role-matrix`, so a no-op invocation cannot pass (BL-1445).
  - Scenario 03's launch-line step is now literal: the LAUNCH line
    carries `PACK_STAFFING_SKIP_GATE=1`, and the PREREQ names
    `role-gate-not-pass` and the compliance_battery steward command.

  ## Not in scope

  - Any worker seat change; the diversified fallback pack (BL-1512).

qa_e2e_procedure: |
  1. Against the MASTER checkout root (the launch root; a worktree's
     gitignored steward copy is stale), derive the windows-file and run
     the gate with the hatch unset:
     `grep -E '^window ' swarmforge/packs/bob-multi-provider-mono-router.conf | awk '{role=$2; agent=$3; i=5; if($i=="task"||$i=="batch") i++; if($i=="forward-only"||$i=="back-one"||$i=="back-all") i++; if($i=="idle-clear") i++; extra=""; for(j=i;j<=NF;j++) extra=extra (j>i?" ":"") $j; printf "%s\t%s\t%s\t%s\n", role, role, agent, extra}' > tmp/bob-windows.tsv`
     then `env -u PACK_STAFFING_SKIP_GATE bb swarmforge/scripts/pack_staffing_gate_cli.bb /home/carillon/swarmforgevc tmp/bob-windows.tsv`
     -> 7 lines, the specifier line among them, every one resolving a
     provider/model (no `seat-model-unresolved`); record the verdict
     column verbatim. On 2026-09-16 every line reads
     `refuse role-gate-not-pass`; the header's PREREQ must match what
     this prints. Never pass the pack file itself as the second argument:
     the CLI reads it as a windows-file with no tabs and prints a
     meaningless `pass` per line.
  2. On a scratch root, `swarmforge/scripts/rotate_to_role.sh specifier`
     dry shape (bl931 runner) resolves a launch line for the pack.
  3. Header read: role table lists specifier; no "deliberately ABSENT";
     LAUNCH line carries `PACK_STAFFING_SKIP_GATE=1`; PREREQ names
     `role-gate-not-pass`, both models, and the compliance_battery steward
     command; no mention of an agent-model-providers gap.

