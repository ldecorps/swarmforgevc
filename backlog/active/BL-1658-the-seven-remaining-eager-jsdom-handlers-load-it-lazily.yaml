approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: no scenario of any of the
  seven handlers changes - jsdom is required inside the step that builds
  the DOM, exactly as bl1153 and bl1412 now do after BL-1630. FIRM: all
  seven move in ONE parcel (the cascade makes a partial fix invisible).
  FIRM: the guard's allowlist ends this parcel with no jsdom entry.
  AMENDED 2026-09-21 by the specifier on the coder's unowned-red note
  002085 ("unowned-red: stepHandlerModuleLoadBudget bl1050 fails
  full-suite, clean alone"): bl1050CursorRunFailureLogSteps.js joins the
  population - it requires extension/out/bridge/cursorBridgeAgentSession
  (and cursorBridgeRunLog) at module scope, a production graph that
  pulls @cursor/sdk, telegramCursorBridgeCore, letsTalkCore and more;
  the same fix shape (the require moves inside the step that needs it),
  the same guard, the same census. Severity re-classed to high because
  this ticket now owns a red on main (standing-red rule). Nothing else
  changes and no choice is posed, so the approval stands (BL-1455: a
  re-pend would post no fresh ask).
  AMENDED AGAIN 2026-09-21 by the specifier on the coder's unowned-red
  note 000037 ("unowned-red BL-687-epic-reorder feature sc08 (drilled-into
  BL-517) fails"): BL-687's landed feature, scenario 06 (TAP 8), asserts
  that an epic whose only child is done still drills down to an empty
  state; BL-905's human-approved hotfix 0f5394a2d0 (2026-08-16) hides a
  childless epic from the tile list by design ("so a tap cannot land on
  an invisible shell"), and BL-905's own scenario "An epic with no live
  children is not listed" pins it. The scenario has been red on main
  since, unrun by any lane. It is RETIRED (never reworded, BL-1006) in
  this parcel, which already edits BL-687's handler for the jsdom move -
  a separate owner would queue behind this one on orthogonality. FIRM:
  scenarios 01-05 and 07 of BL-687's feature and every scenario of
  BL-905's stay green; the handler's "the drill-down shows" step goes
  only if no feature file references it after the retirement; the
  feature's mutation-stamp header is the parcel's to refresh. No choice
  is posed; the approval stands.
  AMENDED (3) 2026-09-21 by the specifier on the coder's unowned-red note
  000039 ("unowned-red bl1146 cursor-session eager require
  (stepHandlerModuleLoadBudget)"), sent from inside this parcel: with
  bl1050 lazy, the sequential census charged the cursor-bridge graph to
  the next eager requirer, bl1146 (243 / 204 / 199 ms alone at load 5.4
  on the master checkout) - the jsdom cascade this ticket already
  describes. The cursor-bridge population is therefore the CENSUS, not
  one handler: the fifteen handlers `grep -ln cursorBridgeAgentSession
  specs/pipeline/steps/*Steps.js` names whose require is at module scope
  (bl1050, bl1146, bl1253, bl1322, bl1384, bl545, bl696 x2, bl697, bl717,
  bl718, bl767, bl790, bl810, bl894; bl1116, bl1207, bl720, bl915, bl941
  already require it inside a step - twenty in all). All fifteen move in
  THIS parcel, scenario 03
  pins the set by name and the grep count; the register row for the guard
  file (owner BL-1658) stays one row. No choice is posed; the approval
  stands.
  AMENDED (4) 2026-09-21 on the coder's spec-gap note 000044: the census
  is TWENTY, not nineteen - bl1207AbandonedLockLivenessSteps.js (already
  lazy, MODULE_PATH) carries a NUL byte in a fixture string, so the
  specifier's shell grep (ugrep) skipped it as binary; GNU grep and
  `git grep -l` count twenty. Scenario 03's pinned count is twenty; the
  fifteen and the fix are unchanged. No choice is posed; the approval
  stands.

invariants:
  - "No step handler named in this ticket loads jsdom or the cursor-bridge session graph at module scope: each such require happens inside the step that needs it, so a fresh-child require of the handler alone stays under the guard's budget under any host load."

description: |
  ## What is wrong

  BL-1630's coder, moving bl1153's and bl1412's module-level
  `const { JSDOM } = require('jsdom')` inside their functions, found that
  the sequential require census pays jsdom's real load exactly once -
  charged to whichever eager requirer is alphabetically first among the
  handlers still eager at that moment. Fixing bl1153 unmasked bl1412;
  fixing bl1412 unmasked bl592 (about 300 ms). Seven handlers remain
  eager (`grep -rln "^const.*JSDOM.*=.*require\|^const { JSDOM }"
  specs/pipeline/steps/*.js`, minus the two BL-1630 fixed):
  bl592SpecTreeOnLiveConsoleWithEpicTierSteps.js,
  bl609ResidentSpyFontSizeControlSteps.js, bl674EpicDrilldownUiSteps.js,
  bl686EpicDrilldownSlugMatchSteps.js,
  bl687EpicReorderIncludesActiveChildrenSteps.js,
  bl775BubbleLiveScreenShellSteps.js, bl929LiveScreenPackLayoutSteps.js.
  Fixing bl592 alone would hand the same 300 ms to bl609, then bl674,
  and so on down the alphabet - seven bounces of the guard, one per fix.
  BL-1630 allowlisted bl592 with this ticket as the owner (coder evidence
  `backlog/evidence/BL-1630-coder-out-of-scope-findings-20260920.md`).

  ## What is wanted

  - All seven require jsdom inside the step that builds a DOM; their own
    features still resolve.
  - The bl592 entry leaves `extension/test/stepHandlerModuleLoadBudget.test.js`'s
    allowlist (and the acceptance handler's mirror of it) in the same
    parcel; the guard over the real tree passes with no jsdom entry.

  ## Amendment 2026-09-21 - bl1050 joins the population (unit red on main)

  `specs/pipeline/steps/bl1050CursorRunFailureLogSteps.js` lines 29-30
  require `extension/out/bridge/cursorBridgeAgentSession` and
  `cursorBridgeRunLog` at module scope; the session module's own top
  requires `@cursor/sdk`, `../tools/telegramCursorBridgeCore`,
  `./letsTalkCore`, `../tools/swarmEnv`, `./cursorBridgeProgress` -
  BL-968-compliant production code, but a heavy graph to pay at registry
  load. BL-1630's guard (landed 2026-09-21, `stepHandlerModuleLoadBudget.test.js`)
  deliberately did NOT allowlist it ("timing variance is not an accepted
  reason") on the reading that its best-of-three confirm-alone
  re-measurement clears a genuinely heavy 137-180 ms require. It does
  not under the full unit suite: the three fresh-child samples run
  concurrently with the suite's other forks, so all three exceed 400 ms
  and the guard reports `bl1050CursorRunFailureLogSteps.js: incremental
  require cost <N> ms exceeds the 400ms budget (confirmed alone)` -
  the coder's sighting on its branch with main merged; the guard file
  alone is green. Specifier measurement on the master checkout,
  2026-09-21 09:3xZ, load 3.4: `censusOneHandler` three times 201 / 204
  / 174 ms; `bl1049CursorBridgeRunSteps.js` and `bl1002ExampleSteps.js`
  0 ms - the cost is the handler's own requires, not the host.

  - bl1050 requires both bridge modules inside the step that uses them
    (the pattern this ticket applies to the seven); its scenarios still
    resolve. Scenario 01 pins it by name; scenario 02's "none of the
    eight" covers it.
  - The guard's comment block that says bl1050 is cleared by the
    confirm-alone re-measurement is re-tensed to say it now loads
    lazily; the allowlist stays free of any bl1050 entry (the 2026-09-20
    ruling stands: no "timing variance" entries).
  - The register row `unit extension/test/stepHandlerModuleLoadBudget.test.js
    BL-1658 2026-09-21` leaves in this parcel's land (BL-1631).
  - QA e2e addition: `cd extension && npm test` once on the parcel commit
    (the whole unit lane, not the guard file alone) - the guard names no
    violation; and `node -e` over `test/helpers/stepHandlerRequireCensus`
    `censusOneHandler('bl1050CursorRunFailureLogSteps.js')` reads under
    20 ms.

  ## Amendment 2026-09-21 (4) - the census is twenty; a NUL byte hid bl1207 from the mint's grep

  Coder spec-gap note 000044 (14:04Z): scenario 03's "exactly nineteen"
  is wrong on the real tree - twenty handlers name the module. The one
  the mint missed is `bl1207AbandonedLockLivenessSteps.js`, already lazy
  (`MODULE_PATH` const, `require(MODULE_PATH)` inside a function, its own
  f61cbabf76 of 2026-08-28). Why: the file's fixture table holds a NUL
  byte ('a NUL byte then nine nines'), so the specifier's shell `grep` -
  ugrep, a shell function here - classed it binary and dropped it from
  `-l`; GNU grep, ugrep `-a` and `git grep -l` all count twenty (`git
  grep -Il` counts nineteen, the same skip). The fifteen eager members,
  the fix and the register row are unchanged; scenario 03's pinned count
  becomes twenty and its census command is `git grep -l
  cursorBridgeAgentSession -- 'specs/pipeline/steps/*Steps.js'`. The
  coder's in-parcel adjustment of the step's expected count is confirmed.

  ## Amendment 2026-09-21 (3) - the cursor-bridge population is the census of fifteen

  The coder made bl1050 lazy and the guard named
  `bl1146HostQueueEnqueueNextHoldOnHostQuestionSteps.js` next (its
  `createMockCursorBridgeAgentSession` require at module scope pulls the
  same graph: 243 / 204 / 199 ms alone, load 5.4). A sequential require
  census charges a shared graph to the alphabetically first eager
  requirer, so fixing one handler at a time re-arms the guard fourteen
  more times - this ticket's own jsdom finding. Census, 2026-09-21
  (`git grep -l cursorBridgeAgentSession -- 'specs/pipeline/steps/*Steps.js'`
  - never a shell grep that skips NUL-bearing files as binary, see
  amendment (4) - then whether the require sits at column 0 or inside a
  function):
  EAGER - bl1050CursorRunFailureLogSteps, bl1146HostQueueEnqueueNextHoldOnHostQuestionSteps,
  bl1253DeadFeederOwnsGetUpdatesStampSteps, bl1322BridgeLazyCursorApiKeySteps,
  bl1384LocalSeatTopicForwardedSteps, bl545CatchUpPagerSteps, bl696LetsTalkSteps,
  bl696TelegramCursorBridgeOperatorSteps, bl697LetsTalkHandsFreeSteps,
  bl717SilentReturnAfterHoldMusicSteps, bl718BubbleTalkMirrorSteps,
  bl767QueuedBridgeQuestionsAnswerInOriginTopicSteps, bl790BridgeQueuesNoteForRoleSteps,
  bl810HostQueuePollClearAllTtlSteps, bl894QueueRepostsSelectionPollSteps
  (15); lazy already - bl1116, bl1207, bl720, bl915, bl941 (5; twenty in
  all). Several of the
  fifteen also require `bridgeServer` at module scope (bl696, bl697,
  bl718, bl790, bl1322): move that too where it is the heavy one - the
  guard's verdict, not the module name, is the contract.

  - Every eager member requires the cursor-bridge session graph (and any
    `bridgeServer`/`letsTalk*` graph beside it) inside the step that uses
    it; its own feature still resolves.
  - Scenario 03 pins the fifteen by name and pins the grep count at
    twenty (BL-1445); scenario 02 reads "none of the twenty-two".
  - QA e2e addition: `cd extension && npm test` once; for each of the
    fifteen, `censusOneHandler` under 20 ms; and the fifteen features
    green through the runner once each (about 20 s of registry load per
    feature - a few minutes, once).

  ## Amendment 2026-09-21 (2) - retire BL-687 scenario 06, superseded by BL-905

  `specs/features/BL-687-epic-reorder-includes-active-children.feature`
  scenario 06 ("An epic whose only child is done drills down to the
  reorderable-topics empty state"; TAP 8 of 9) fails on main at `When the
  "BL-517" tile is drilled into`: `expected a drill button for epic
  BL-517` (specifier's one run on main 7fdd96e8d8, 2026-09-21 12:15Z:
  `# pass 8`, `# fail 1`). The drill button renders for every tile
  (`epicReorderUiHtml.ts` ~213, unchanged since 2026-07-26); the tile
  itself is gone: `readEpicReorderMembership` (bridgeServer.ts ~1085)
  lists only `filterEpicsWithTopics(epics, topics)` - the hotfix
  0f5394a2d0 "Land hide-childless-epics reorder screen fix (BL-905
  stamp-off; human-approved hotfix landing)": "Human wants shell epic
  trackers (no live children) excluded from the Reorder epics tile list
  and its Move up/Move down neighbours, so a tap cannot land on an
  invisible shell." BL-905 (done) pins it: "An epic with no live children
  is not listed". BL-687's scenario 06 states the pre-BL-905 present and
  has been red since 2026-08-16; no lane runs landed features (BL-1625,
  paused), so the coder's changed-path census on 2026-09-21 was the first
  sighting.

  - Retire scenario 06 (its `# BL-687 ...-06` tag and body); never reword
    it into "has no tile" - BL-905's scenario is that coverage.
  - In `bl687EpicReorderIncludesActiveChildrenSteps.js`, remove the
    `the drill-down shows "..."` step only if `grep -rn 'the drill-down
    shows' specs/features/` returns nothing after the retirement (the
    "tile is drilled into" step stays: scenarios 01-05 and BL-674/BL-686
    use it).
  - The feature's mutation-stamp header is refreshed by the hardener's
    pass as for any feature this parcel touches.
  - Register row `acceptance specs/features/BL-687-epic-reorder-includes-active-children.feature
    BL-1658 2026-09-21` leaves in this parcel's land (BL-1631).
  - QA e2e addition: `specs/pipeline/scripts/run_acceptance.sh
    specs/features/BL-687-epic-reorder-includes-active-children.feature`
    once on the parcel commit: 8/8 (scenario 06 absent), and the BL-905
    feature 6/6.

  ## How (direction, not mandate)

  - The same two-line move BL-1630 made in bl1153/bl1412. Scenario 01
    reuses BL-1630's `stepHandlerRequireCensus.js` loader intercept to
    list the modules a handler's require loads (extend the helper to
    return them if it does not already).

constraints: >
  The seven handlers (moves only, no scenario change), the guard's
  allowlist, the feature and its handler, evidence. No change to
  index.js, runtime.js, any feature file of the seven, or any library.
  The step handler lands with the feature (BL-233).

out_of_scope: |
  - The 75 node:test-at-load handlers: BL-1659.
  - Any handler that requires jsdom lazily already (bl1046, bl1160,
