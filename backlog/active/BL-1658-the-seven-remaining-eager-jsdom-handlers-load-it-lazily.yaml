qa_e2e_procedure: >
  (1) `node specs/pipeline/cli.js specs/features/BL-1658-the-seven-remaining-eager-jsdom-handlers-load-it-lazily.feature`
  ONCE on the parcel commit: 8 rows ok. (2)
  `cd extension && npx vitest run test/stepHandlerModuleLoadBudget.test.js`
  once: green, and `grep -c jsdom extension/test/stepHandlerModuleLoadBudget.test.js`
  is 0 outside comments. (3) Each of the seven handlers' own feature runs
