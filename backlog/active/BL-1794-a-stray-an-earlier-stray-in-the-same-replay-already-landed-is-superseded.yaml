description: |
  ## Why

  The land step (`land_step_lib.bb` `replay!`) cherry-picks every closed
  owner's stray onto a scratch branch off origin/main, oldest first in
  the candidate order, before the landing ticket's own commit. BL-1785
  widened the stray set to a closed owner's own ticket-record edits. A
  post-land record reaches the role branches as several commits carrying
  the same change: the original, copies re-applied by merge-ups and
  re-points, and a follow-up that appends after it. Once one copy and the
  follow-up have landed on the scratch branch, a later copy conflicts on
  lines the scratch branch already carries. `stray-superseded-verdict`'s
  grounds (a) to (c) all measure against origin/main, never against the
  scratch branch built so far. Ground (b) also requires the HEAD-side
  lines to be written by commits ON origin/main, and here they were
  written by the replay's own earlier cherry-pick. So no ground holds, and
  the replay aborts with `could not cherry-pick stray evidence commit
  <sha>`.

  Reproduced at mint in an isolated clone (git clone under mkdtemp,
  `rev-parse --git-common-dir` checked), off origin/main c24afe2529:
  - `fa79e88fa7` alone cherry-picks cleanly (exit 0). Its done-copy
    hunk is already on main, and its evidence append is not.
  - Cherry-picking `f37671e359` ("BL-1711: QA land record", the SAME
    patch-id 552af80d0b as fa79e88fa7), then `fd6191c893` (the
    follow-up), then `fa79e88fa7` gives exit 1, CONFLICT (content) in
    `backlog/evidence/BL-1711-QA-20260926-2.md`. The escalated parcel tips
    carry all of them, in that order: f37671e359 and fd6191c893 at
    positions 1118-1119 of `git rev-list --reverse --no-merges
    origin/main..986dcdb1fd`, fa79e88fa7 at 1190.
  - `d61cb0d081`, a copy carrying the evidence append alone (a different
    patch-id), conflicts the same way after f37671e359 and fd6191c893. So
    de-duplicating by patch-id would not be enough.

  ## What is wanted

  1. A superseded ground over the replay branch itself. On a real
     cherry-pick conflict, and before the abort, the stray is superseded
     when its own post-image, at every path it touches, adds no line
     relative to the scratch branch's current HEAD. That is ground (a)'s
     test, measured from the replay head instead of origin/main. Reason:
     `content-subset-of-replay-head`.
  2. `land_step_cli.bb` prints it on the existing line,
     `LAND_STRAY_SUPERSEDED <sha> <paths> content-subset-of-replay-head`,
     and the verdict (LAND_REPLAY, exit 0) is unchanged. The stray is
     never added to the landed set and never printed LANDED_SIBLING
     (BL-1272).
  3. Everything else stays as it is. The existing grounds, their order
     and their reasons are unchanged. The completeness (BL-1447) and
     registry-row (BL-1604) checks and the land-approval record run
     exactly as today. A replay where no earlier stray landed has its
     scratch HEAD at origin/main, so there ground (a) already decides
     everything the new ground would.

  ## Not in scope

  - Deferring strays the land step cannot land at all (BL-1787, paused;
    it never defers ticket-record strays). BL-1787 and this ticket both
    edit `land_step_lib.bb`, so the orthogonality rule keeps them from
    being active together. Either order works. The replay-head ground is
    one more ground inside the verdict, and BL-1787 adds a deferral only
    after every ground has failed.
  - Stopping merge-ups and re-points from multiplying record copies on
    the role branches.
  - Landing closed BL-1711's remaining records by hand.

  ## How (direction, not mandate)

  - The scratch worktree is a linked worktree of `root`, so its HEAD
    commit is readable from `root`. `rev-range-line-changes` from the
    scratch HEAD sha to the stray sha over its paths is the same
    measurement ground (a) makes. Check it after (a) and before (b).
  - Fixtures follow BL-1785's handler: a mkdtemp repo with its own
    origin, the second copy made on another branch and merged after the
    follow-up so it comes later in the candidate order. Name the handler
    `bl1794ReplayHeadSupersededStraySteps.js` and land it in the SAME
    commit as the feature (BL-233).

constraints: >
  Fixture roots are mkdtemp directories with their own origin (BL-1390).
  The step never publishes, pushes or edits a role branch; QA's land
  procedure is unchanged.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1794-a-stray-an-earlier-stray-in-the-same-replay-already-landed-is-superseded.feature`:
     3 cases ok (01 x2, 02).
  2. Regression, same lib: `node specs/pipeline/cli.js
     specs/features/BL-1785-a-closed-owners-own-ticket-record-stray-lands-onto-its-done-copy.feature`
     gives 5 ok (measured at mint on main c24afe2529: 5 of 5 in 10 s).
     `node specs/pipeline/cli.js
     specs/features/BL-1650-the-land-step-lands-a-pure-evidence-closed-owner-stray-itself.feature`
     gives 11 ok (measured at mint: 11 of 11 in 15 s), or 9 if BL-1787
     has landed first and retired scenario 08's two rows.
  3. `bb swarmforge/scripts/test/land_step_lib_test_runner.bb`: ALL PASS
     (measured at mint: 48 s).
  4. In-process probe of the real incident, in an isolated clone (git
     clone under mkdtemp; `git rev-parse --git-common-dir` prints `.git`
     before any mutating command). Check out origin/main on a scratch
     branch, then cherry-pick `f37671e359` and `fd6191c893` (both exit 0
     at mint). Cherry-picking `fa79e88fa7` then conflicts on
     `backlog/evidence/BL-1711-QA-20260926-2.md` (exit 1 at mint). With
     the conflict still in place, the parcel's `stray-superseded-verdict`
     returns reason `content-subset-of-replay-head` for fa79e88fa7. Repeat
     for `d61cb0d081`. Skip this step and say so if those commits have
     reached origin/main by then.
  5. `git diff main...HEAD --name-only` names only `land_step_lib.bb`,
     `land_step_cli.bb` if the print needed a change, the lib's test
     runner, the feature, its handler (plus lib/) and evidence.
  6. After the land: QA's next land does not escalate on fa79e88fa7 or
     d61cb0d081, and prints LAND_STRAY_SUPERSEDED naming them if the
     replay reaches them. Record that in that land's evidence.

