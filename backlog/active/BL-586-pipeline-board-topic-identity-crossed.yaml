required_wiring:
  - "extension/src/tools/telegramTopicDecisions.ts::PIPELINE_BOARD_SUBJECT_ID::the board needs a standing-topic subject key of its own, exactly as APPROVALS_SUBJECT_ID exists on line 100 of this file - without it there is nothing durable to reuse and invariant 2 cannot hold"
  - "extension/src/concierge/pipelineBoardSync.ts::validateBoardTopic::the collision guard must be REACHED FROM resolveBoardTopicId's own trust branch, not merely exist as a tested helper. This is the BL-419 shape the gate exists to catch: a pure decision function can be green in isolation while the live path still returns prevState.topicId unvalidated. The name is pinned by this gate - see Scope"
  - "specs/pipeline/steps/index.js::bl586PipelineBoardTopicIdentitySteps::the step handlers must be registered in the domain list - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "The board never posts into a topic the topic map attributes to another purpose — validated before every post, not only at mint time."
  - "Re-establishing board identity is reuse-or-create: no state reset mints a new topic while the previous board topic is still durably known."

