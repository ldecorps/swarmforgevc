id: BL-586
title: "The pipeline board trusts its stored topic id without ever validating it, and mints a fresh topic whenever that id is cleared - so it has twice ended up posting (and pinning) into the human's support thread while spawning untracked zombie topics"
milestone: M8
type: defect
status: todo
epic: pipeline-board
