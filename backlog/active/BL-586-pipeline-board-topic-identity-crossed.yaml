source: |
  Human, 2026-07-23 ~15:45Z, with screenshot. Operator investigation found
  TickState.pipelineBoard.topicId = 1634 — which telegram-topic-map.json
  records as SUP-7, a support thread. The live board (and its only-pin
  enforcement) had been posting into the human's support topic. Repaired
  live: state cleared WITH THE STACK DOWN (a running bridge rewrote the
  crossed id from memory over a file-only repair), topic 6795 minted and
  seeded, board now posted (6796) + pinned there; stray board posts
  deleted from SUP-7 (6788 deleted; 6785 already gone). The two zombie
  "Pipeline Board" topics' ids were never recorded anywhere and must be
  deleted by hand from the Telegram UI.

  Recurred 2026-08-21; intake .swarmforge/operator/INTAKE-pipeline-board-duplicate-topic.md
  (archived on drain per BL-311). No sibling ticket was minted, per the
  intake's own directive.

description: |
  ## The whole defect is five lines

  `resolveBoardTopicId` (extension/src/concierge/pipelineBoardSync.ts:186):

      if (prevState?.topicId !== undefined) {
        return Promise.resolve({ topicId: prevState.topicId });
      }
      return adapters.ensureBoardTopic();

  Both branches are wrong, and they fail in opposite directions.

  **The trust branch** returns the stored id with no validation, forever.
  `telegram-topic-map.json` is sitting right there and already knows what
  that id is: on 2026-07-23 it said 1634 was SUP-7; today it says 14647 is
  SUP-5. One lookup would have refused the post. Instead the board — and
  its only-pin enforcement — writes into the human's support thread.

  **The create branch** calls `ensureBoardTopicAdapter`
  (extension/src/tools/telegram-front-desk-bot.ts:1026), which is a bare
  `createForumTopic` with no reuse-lookup and no durable record. Its own
  comment states the reasoning: the board "stays a bare
  create-and-map-the-result call, mirroring the OTHER ensureXTopic
  functions' own createForumTopic call but WITHOUT their reuse-or-create
  branch (the board's own state already gates repeat calls)". That premise
  is exactly what fails — the board's own state is a single mutable JSON
  field, and BL-497's topic-gone self-heal deliberately clears it. So every
  topic-gone failure mints another "Pipeline Board" topic, untracked,
  invisible to the Bot API, and only removable by hand.

  Note that `ensureBoardTopicAdapter` does not even take `targetPath`, so
  as written it *cannot* read the standing store or the topic map.

  ## Why this is high, not medium

  Verified live by the specifier at 12:26Z and re-verified at 15:50Z on
  2026-08-21, rather than quoted from the report:

  - `pipelineBoard.topicId` = 14647; `telegram-topic-map.json` maps
    `"14647": "SUP-5"`
  - the board is actively rewriting there — `messageId` advanced
    31978 -> 32608 -> 32923 across the observation windows, and
    `lastPinnedBoardMessageId` = 32923, so it is pinning there too
  - `orphanMessageIds` = 16 against a cap of 20 — the delete+repost trail
    is close to overflowing
  - `telegram-standing-topic-ids.json` = `{"APPROVALS": 1785, "OPERATOR": 3864}`
    — still no `PIPELINE_BOARD` key, so there is no durable identity to
    resolve back to

  This is the identical shape as 2026-07-23, which is the point: it
  recurred unchanged because nothing durable was fixed. Per the severity
  rubric ("high for a live fault degrading behaviour or a broken
  safety/health signal") this is high, which under Article 3.2.4 places it
  in the expedite lane — the constitutional route to the operator's
  "promote it ahead of the paused queue", no special-case favour needed.

  ## How (direction, not mandate)

  The symmetric fix already exists in this codebase and should be mirrored
  rather than invented. `ensureApprovalsTopic`
  (telegram-front-desk-bot.ts:700) is reuse-or-create over
  `readStandingTopicIds`/`rememberStandingTopicId`, and its decision logic
  is a pure, fs-free function — `decideEnsureApprovalsTopicAction` in
  extension/src/tools/telegramTopicDecisions.ts — which is what makes it
  testable. Do the same for the board:

  - A pure decision function alongside it, over (topic map, last known
    standing id, current tick-state id), returning reuse / rebind /
    refuse-and-re-ensure / create. All the judgement lives here, with no
    fs and no HTTP, so it is unit- and mutation-testable.
  - `resolveBoardTopicId` calls it on EVERY resolve, including the trust
    branch. An id the map attributes to any other subject — SUP-*,
    standing, role topics — is treated as corrupt: refuse, alert the
    Operator topic, re-ensure. This is invariant 1, and it is the line
    that would have prevented both incidents.
  - `ensureBoardTopicAdapter` takes `targetPath`, becomes reuse-or-create
    against a `PIPELINE_BOARD` standing key, and records a freshly minted
    id durably BEFORE the first post, so a crash between create and post
    cannot orphan it. This is invariant 2.
  - Its call site (telegram-front-desk-bot.ts:2863,
    `ensureBoardTopic: () => ensureBoardTopicAdapter(botToken, chatId)`)
    already has `targetPath` in scope two lines up, where
    `ensureOperatorTopic(targetPath, ...)` is wired — so this is a
    signature change, not a plumbing problem.

  ## Scope

  - extension/src/concierge/pipelineBoardSync.ts — `resolveBoardTopicId`
  - extension/src/tools/telegramTopicDecisions.ts — the pure decision
    function and `PIPELINE_BOARD_SUBJECT_ID`
  - extension/src/tools/telegram-front-desk-bot.ts —
    `ensureBoardTopicAdapter` and its adapter wiring
  - specs/features/BL-586-pipeline-board-topic-identity-crossed.feature
  - specs/pipeline/steps/bl586PipelineBoardTopicIdentitySteps.js, registered
    in specs/pipeline/steps/index.js

  Two names above are pinned by `required_wiring` and are a naming
  contract, not a design opinion: the guard reached from
  `resolveBoardTopicId` must contain the literal `validateBoardTopic`, and
  the step-handler file must be named `bl586PipelineBoardTopicIdentitySteps`.
  Everything else about the shape is the implementer's call.

  The documenter stage owns the runbook the intake asks for: the zombie
  cleanup procedure (ids are not enumerable via the Bot API — the
  record-before-use change above is the real fix) and the stack-down repair
  sequence used on 2026-07-23, marked as the legacy procedure that scenario
  04 makes unnecessary going forward.

design_2026_08_21: |
  Settling `status: needs_design`. Two decisions, both cuts.

  **Scenario 04 was replaced, not dropped.** The old 04 asked for an
  operator's file-level repair to take effect within one tick, because in
  2026-07-23 a running bridge overwrote a file-only repair from memory. But
  that requirement is a consequence of the defect, not an independent want:
  once identity is validated on every resolve (invariant 1) and re-ensured
  from a durable standing record (invariant 2), a crossed in-memory id is
  refused and self-corrects on the very next tick with no operator action at
  all. Making repair UNNECESSARY discharges the human's "in-memory state
  must not defeat a file repair" more completely than adding a repair path
  would. The new scenario 04 gates exactly that, so the claim is verified
  rather than asserted — and QA step 4 checks it against the live crossed
  value.

  **Scenarios 05 and 06 were parked**, in
  specs/features/BL-586-pipeline-board-noise-and-multi-writer.feature.draft.
  05 targets a race this ticket's own description calls "root mechanism
  unproven (writes interleaved, no audit trail)" and the intake found "not
  an obvious dual-stack today"; a fix for an unreproduced race is a spike,
  and its one gateable assertion — no post into a topic the surviving state
  cannot validate — is precisely what the new scenario 01 gates on every
  resolve, whichever writer won. 06 and the pin/delete+repost noise are
  covered by the human's conditional directive in `human_directives`, which
  says not to mint them unless the identity fix leaves the storm intact.
  That condition is checked in `post_landing_check` below.

  No sibling ticket was minted, per the intake. This pass narrowed BL-586
  in place; nothing was added.

post_landing_check: |
  Owner: whoever closes this ticket (coordinator bookkeeping), within one
  shift of BL-586 reaching backlog/done/. This exists so the human's
  conditional directive cannot be silently dropped.

  After the identity fix is live, observe the board for one shift and answer:
  does the notification storm persist — a lot of updates, chat-level pin
  service messages fanning into another topic, or the delete+repost trail
  still growing `orphanMessageIds`?

  - If NO: record that on this ticket and close the loop. Nothing to mint;
    the conditional directive is satisfied and spent.
  - If YES: the human's condition is met and a follow-up slice IS now
    authorised — "stop chat-level pin fan-out / stop delete+repost notifying
    every tick". Mint it from the parked draft file, which already carries
    scenarios 06 and 07 and the reasoning.

  Also confirm the intake's own requested outcome 2: that the board has
  stopped posting into SUP-5.

qa_e2e_procedure: >
  Read-only against live state where possible. Do NOT repair the live
  crossing by hand as part of this procedure, and do not kill PIDs — the
  intake forbids it, and step 4 needs the crossed value present to be
  meaningful. If the crossing has already been repaired out of band by the
  time you run this, say so and use a staged fixture for step 4 instead.

  1. Reproduce the trust branch at the parent commit. In a scratch fixture,
     set the pipeline-board tick state topicId to an id the topic map
     attributes to SUP-5, resolve the board topic, and confirm the parent
     returns that id unvalidated and posts into it. This is the defect;
     confirm it exists before confirming it is gone.

  2. At the parcel commit, repeat step 1 and confirm the resolve refuses,
     emits an operator alert naming both the id and the subject it is
     mapped to, and re-ensures. Confirm the support thread received
     nothing.

  3. Confirm invariant 2 mechanically. With a PIPELINE_BOARD standing id
     recorded and the tick-state topicId cleared (the exact state BL-497's
     topic-gone self-heal leaves behind), resolve and confirm the recorded
     id is reused and createForumTopic is NOT called. Then clear the
     standing record too, resolve, and confirm the newly minted id is
     written to the standing record BEFORE the first post — assert on the
     write ordering, not merely on the end state, since the end state is
     identical either way and that is precisely the crash window.

  4. Confirm the operator-repair claim that replaced the old scenario 04.
     Using the live crossed value (tick-state topicId 14647, which
     telegram-topic-map.json maps to SUP-5) staged into a fixture, run two
     consecutive resolves and confirm the second resolves to the standing
     PIPELINE_BOARD id with no operator file edit and no restart between
     them. This is the check that the ticket's central design claim — that
     validation makes stack-down repair unnecessary — is true and not just
     argued.

  5. Confirm the collision guard is reached from the live path, not only
     from tests: read resolveBoardTopicId at the parcel commit and confirm
     its trust branch calls the guard. A green unit suite over a helper
     nothing calls is the BL-419 failure this ticket's required_wiring
     exists to prevent.

  6. Confirm the acceptance feature runs: all four scenarios in
     specs/features/BL-586-pipeline-board-topic-identity-crossed.feature
     execute with registered handlers (no runtime THROW on a missing
     handler), and the Scenario Outline covers all three example rows.

