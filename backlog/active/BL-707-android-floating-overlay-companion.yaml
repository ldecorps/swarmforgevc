description: |
  ## What

  Ship a thin native Android companion that draws a movable floating bubble
  over other apps (system overlay), expands to a mini talk panel, and sends
  discrete turns to the existing SwarmForge Let's Talk / Cursor bridge using
  the same console control token auth as the Mini App.

  ## Why (human words)

  BL-706 only shrinks chrome inside the open Mini App. The human wants a
  bubble that stays reachable while using Telegram or other apps.

  ## First-slice scope (thin)

  1. Android companion project in-repo (Kotlin), installable on a device/emulator.
  2. Request and handle "draw over other apps" permission.
  3. Draggable bubble (edge magnet nice-to-have); tap expands mini panel.
  4. Mini panel: text and/or mic turn → existing bridge Let's Talk turn path
     with bearer; show/speak reply.
  5. How-to for install, overlay permission, pairing token / bridge base URL.
  6. Collapse back to bubble; stop/pause service without leaking a stuck overlay.

  ## Architecture pins (must not invent parallel product)

  - Transport: reuse existing bridge HTTP Let's Talk turn routes (same host as
    Mini App), not a guessed WebSocket/MCP from ChatGPT notes.
  - Auth: console control token / allowlisted bearer already used by Let's Talk.
  - Product home: child of epic swarmforge-console (BL-517); companion to
    BL-696 / BL-706, not a replacement of Telegram Cursor Remote.

  ## Out of scope this slice

  - iOS
  - Replacing Telegram Cursor Remote or the Mini App host wholesale
  - Full notification-bubble / confirmation matrix (may follow)
  - Duplex continuous-call audio
  - Treating ChatGPT's library list as required deps

  ## Research links (optional, not required)

  - Android Notification Bubbles docs
  - Jetpack Compose floating-window patterns
  - OSS floating-bubble-view (advisory only)

