source: |
  Found 2026-08-31 by the specifier from an idle ready_for_next.sh returning
  NO_TASK, while checking whether BL-1307's park was stale. Full evidence:
  backlog/evidence/BL-1300-hold-is-not-a-withholding-20260831.md and
  backlog/evidence/BL-1307-landed-park-is-stale-20260831.md.

description: |
  ## What is wrong

  QA.prompt's landing step is: acquire the lock, run
  `land_main_publish.sh <root> --decide-only`, rematch when advised, then
  `git push origin HEAD:main`. That decide step is the one part of landing QA
  cannot skip.

  `swarmforge/scripts/land_main_publish.sh` fetches `origin/main`, compares tip
  ancestry, and prints an EDN decision from `master_main_reconcile_lib`. It
  asks whether the push is fast-forwardable. It never asks whose work the tip
  carries: `grep -n 'entangled\|land_step_lib\|sibling' land_main_publish.sh`
  returns **nothing**.

  The check that would answer it exists and works. `entangled-siblings` in
  `land_step_lib.bb` was built by BL-1241 and widened to full ancestry by
  BL-1308. But it is reachable only through `land_step_cli.bb`, which QA runs
  BY HAND, when QA notices there might be something to notice. So the swarm's
  answer to "did this land ship someone else's unlanded work" depends on a
  human step being remembered, while the step that is enforced stays blind.

  `main`'s first-parent chain IS the `swarmforge-QA` branch. So a plain push of
  the branch tip ships everything ever merged into it, including work QA
  explicitly decided NOT to land.

  ## The instance, verified by reflog rather than argued

  `origin/main@{20}` (`a4dc4742d8`) does not contain `68a36bcfae`, QA's merge of
  BL-1300. `origin/main@{19}` (`82347884f3`, "BL-1308: QA pass") does.

  So **BL-1308's own land is the push that shipped BL-1300** - a ticket QA had
  deliberately held four commits earlier (`d4b666a336`, "verified green,
  landing blocked on pending human_ruling"), whose `human_approval: pending`
  was a deliberate re-ask for a binary choice between two shapes. One of those
  two shapes is now live on `origin/main` without the choice ever being made.

  The same push carried BL-1307, held at `6d9e987a07` for exactly this reason.
  BL-1295 landed the same way on 2026-08-30. Three instances in two days.

  The irony is load-bearing, not decoration: BL-1308 was the ticket that FIXED
  the detector, and its own land bypassed it. A hold that only stops the replay,
  and leaves the merged content sitting on the branch `main` is advanced from,
  is not a hold. Compare the constitution's "A Bounce Must Be Reverted Out Of
  The Bouncing Branch" (BL-490/BL-495): a bounce has that rule; a hold has no
  equivalent, and this is what that gap costs.

  ## How (direction, not mandate)

  Give the answer where it cannot be skipped: have `--decide-only` consult the
  finished detector and refuse rather than advise, printing a stable marker
  (`ENTANGLED_SIBLING_BLOCK`) plus one line naming each unlanded ticket, so the
  caller keys off a literal rather than parsing prose. The existing remedy does
  not change: QA's answer to a refusal is the tip-pure replay it already runs
  today, only now it is told to rather than expected to remember.

  Two constraints the implementer should not have to rediscover:

  - `land_main_publish.sh` runs under `set -euo pipefail` (line 11). A guard
    that can legitimately exit non-zero must not abort the script by inheriting
    that - capture the status (`guard || st=$?`) rather than letting `set -e`
    take it, per the constitution's Guardrails rule (BL-1242/BL-1252).
  - The fail-open half is not optional politeness; it is what keeps a blind
    detector from becoming a swarm-wide land outage. See invariant 2.

