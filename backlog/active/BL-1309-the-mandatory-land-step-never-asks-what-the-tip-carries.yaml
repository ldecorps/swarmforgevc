qa_e2e_procedure: |
  1. On a scratch clone, build a branch tip that merges two tickets' work where
     only one is on `origin/main`. Run
     `swarmforge/scripts/land_main_publish.sh <root> --decide-only`.
     It must print `ENTANGLED_SIBLING_BLOCK` and name the unlanded ticket, and
     must NOT advise a push.
  2. Land the unlanded sibling, re-run step 1: the marker is gone and the
     decision is the ordinary one.
  3. Fail-open: make the detector unrunnable (rename `land_step_lib.bb` in the
     scratch clone) and re-run step 1. The step must print the ordinary
     decision and no marker - a blind detector must never refuse.
  4. Regression on the real path: run step 1 against the live `swarmforge-QA`
     tip and confirm the decision it prints matches what
     `bb swarmforge/scripts/land_step_cli.bb <task> <commit>` reports
     independently. A disagreement between the two is the defect still present.
  5. Confirm the script still behaves under `set -euo pipefail`: a refusal must
     exit with the documented status, not abort mid-script leaving the land
     lock held.

  FIELD OCCURRENCE 2026-09-02, recorded by the specifier (bookkeeping only -
  no scope, acceptance or design change). BL-1324's content reached
  origin/main as a passenger on the BL-1254 land rather than through its own
  land step: its own land attempt returned LAND_ESCALATE at 13:30, and by
  13:33 the BL-1254 land merge (3259284085) had carried BL-1324's handler,
  feature file and docs entry onto origin/main, with the close commit
  7d832d9dbe recording "landed 3259284085" for both tickets at once. The
  outcome here was benign - BL-1324 was QA-approved and its content is
  verified correct on origin/main - but it is the same mechanism this ticket
  describes, and it landed a ticket whose own land step had explicitly
  refused. Evidence:
  backlog/evidence/BL-1324-specifier-land-escalate-adjudication-20260902.md.

human_approval: approved
ruling_options:
  - refuse every entangled tip, so the tip-pure replay becomes the normal land
  - refuse only when the entangled sibling is withheld or awaiting approval
approval_context: >
  A new feature file is authored here, so it needs a tap. One question is
  genuinely yours.

  The defect is not in question and is verified by reflog: BL-1308's own land
  pushed BL-1300 onto origin/main, four commits after QA deliberately held it
  for a human ruling you have not yet given. BL-1307 rode the same push.

  Yours is how wide the refusal should be. QA.prompt says an entangled tip is
  the NORMAL state of a long-lived role branch - "the BL-506 inventory's
  legitimate YES, which is what ordinary pipelining produces". So option 1
  refuses most lands and makes the tip-pure replay the everyday path. It is the
  simplest rule, it has no judgment in it, and BL-1241 already built the remedy
  it forces. The cost is a slower land, every time, including the many where
  the entangled sibling was going to land ten minutes later anyway.

  Option 2 refuses only when the sibling is actually being withheld - in
  backlog/hold, or human_approval pending, or QA recorded a hold for it. It
  costs nothing on ordinary lands and stops exactly the case that has now
  happened three times in two days. Its risk is that it needs to read ticket
  state to decide, so it has more ways to be wrong, and a sibling withheld in a
  way the predicate does not recognise slips through - which is how this class
  of defect keeps recurring.

  Settled, not a question: the refusal fails OPEN on anything it cannot read,
  under either option. A land step that refuses because it could not run the
  detector would be a swarm-wide outage, and BL-806, BL-1293 and BL-1307 all
  already hold that line.

