  That channel reaches no approval route, so nothing was flipped and nothing
  recorded. It is a THIRD way a ruling goes missing, distinct from BL-1367's
  pager route which flips the field and drops the answer - and both leave the
  identical record, which is why they read as one thing. Now BL-1369.

  Every check QA, the coordinator and I ran was correct. None of us could see
