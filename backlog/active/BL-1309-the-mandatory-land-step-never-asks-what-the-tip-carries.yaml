  provenance rather than letting the record stand, having already corrected its
  own BL-1296 evidence unprompted the same hour.

  Unchanged: `human_approval` stays `pending` and `status: blocked` stands.
  The field is the human's tap. One tap restores it - the fork is not open, it
  only reads that way.

  ## 2026-09-03 - re-pended to collect the ruling that was never recorded

  Raised by QA (priority-00 note). QA's substantive finding is CORRECT: this
  ticket declares `ruling_options` and carries no `human_ruling:`, so the fork
  in `approval_context` - how wide the land refusal should be - has never been
  answered, and it is being built right now.

  Re-pended deliberately. The approval was real: commit `bd7d675e74`,
  2026-09-01 03:54. Only the human restores it, never an agent.

  **QA's attribution is mistaken, and the mistake is the system's fault, not
  QA's.** QA read the approval commit's `By coder.` byline as proof an agent
  self-flipped the field. That byline is HARDCODED IN THE BOT -
  `extension/src/bridge/bridgeServer.ts:834` and
  `extension/src/tools/telegramFrontDeskBotCore.ts:1321` both commit
  `Approve <id>: record human_approval\n\nBy coder.` So every genuine
  human tap produces a commit that claims a coder wrote it, and the byline
  cannot discriminate. Ticketed separately as BL-1367.

  **Root cause found, and nobody guessed it: there are TWO approval entry
  points and only one can record a ruling.** The paused-pager Mini App's
  Approve route (`bridgeServer.ts` `computePausedPagerApproveOutcome`) calls
  `recordApprovalReply(targetPath, backlogId)` - a signature with NO ruling
  parameter, which only flips `human_approval`. The bot's own callback path
  reaches `pendingApprovalReply.ts`'s `human_ruling:` writer; the pager path
  cannot, for any ticket, however many options it declares. So a ticket
  approved from the phone pager loses its ruling silently.

  That fits every observation: this ticket was approved 2026-09-01 03:54 and
  lost its ruling, while BOTH rulings raised today (BL-1361, BL-1363) recorded
  correctly within minutes because they were answered on the bot's ruling
  keyboard. 36 tickets carry a `human_ruling:` block, so the mechanism works -
  it is one entry point that bypasses it. Ticketed as BL-1367.

  Nobody self-flipped anything. The approval is genuine; only its ruling was
  dropped in transit.

  **Do not finish the refusal predicate on a guess.** Option 1 and option 2
  differ in exactly what the mandatory decide step refuses, which is the whole
  deliverable. If work has already been built against an assumed option, say so
  rather than quietly keeping it.

