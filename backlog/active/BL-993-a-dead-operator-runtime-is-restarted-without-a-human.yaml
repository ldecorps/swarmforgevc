id: BL-993
title: "nothing continuously watches operator_runtime.bb: handoffd, the front-desk trio and the headless bridge each have a supervisor, but a crashed operator runtime leaves a stale pidfile and stays down indefinitely until a human types ./swarm ensure - and it is the layer that is supposed to notice when other daemons die"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 20
direction: human-intake
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-993-a-dead-operator-runtime-is-restarted-without-a-human.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl993::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "A deliberate stop is never undone. Whenever the runtime is intentionally down - the skip-operator env flag, a park flag, a shift-close stop - the watch observes and reports but never restarts."
  - "A restart is never silent. Every restart the watch performs is announced on the human channel and recorded, so a runtime that keeps dying is visible as flapping rather than indistinguishable from uptime."
  - "The watcher is never the watched. Whatever hosts the watch must not require operator_runtime.bb to be alive in order to run, or the two die together and nothing recovers."

description: >
  Observed live 2026-08-20 ~15:45 by the operator: `./swarm status` showed
  `operator-runtime` DOWN with a STALE PID - `.swarmforge/operator/runtime.pid`
  named a dead process and no `operator_runtime.bb` was running. handoffd,
  babysitterd and the front desk were all up, and the swarm kept moving on
  Telegram, so nothing looked wrong. Operator recurrent ticks - health, nudge,
  tunnel ensure - were simply gone until a human noticed.

  The gap, verified in code rather than re-derived:

  - `swarm_ensure.bb` HAS the repair. `operator-healthy?` (line 282) and
    `ensure-operator!` (line 305) already detect and restart it, wired
    through `ensure-component!` at line 868. But `./swarm ensure` runs only
    when a human runs it.
  - `start-swarm.sh` / `start_ancillary_services.sh` start it once and never
    watch it again.
  - Nothing else watches it. `handoffd_supervisor.bb`,
    `front_desk_supervisor.bb`, `bridge_headless_supervisor.bb`,
    `cursor_bridge_supervisor.bb` and `negotiation_relay_supervisor.bb` all
    exist; there is no `operator_runtime_supervisor`.
  - BL-906 is the REVERSE relationship: operator-runtime watches babysitterd
    freshness and TELLS, never restarts. There is no path back.

  So the decision logic already exists and is correct. What is missing is
  something always-alive that calls it.

  The human's direction, verbatim from the intake:

    "1. Close the always-on gap: something that is already always-alive
        (babysitterd, front-desk supervisor, a tiny dedicated supervisor, or
        an extended ensure-on-a-timer that is *not* human-gated) must detect
        a missing/stale operator-runtime and restart it via the existing
        `start_operator_runtime.sh` entry point.
     2. Prefer **tell + restart** for operator-runtime itself (it is the
        external supervisor's host process - leaving it dead silently defeats
        BL-906's babysitterd watchdog).
     3. Honor deliberate stops (`SWARMFORGE_SKIP_OPERATOR=1`, park/stop files,
        finish-shift) - never undo an intentional park (same posture as
        BL-785 / front-desk PARKED).
     4. Do **not** "fix" by only documenting "run `./swarm ensure` when you
        notice" - that is the current gap."

  How (direction, not mandate): the four hosts above are genuinely open
  options and this ticket does not pick one - the architect should. What it
  does fix is the behaviour: a down runtime is detected and restarted through
  `start_operator_runtime.sh` without a human, a deliberate stop is reported
  and left alone, and every restart is announced. Reuse
  `operator-healthy?`/`ensure-operator!` rather than writing a second
  liveness check that can disagree with `./swarm status`.

constraints: >
  Verbatim from the intake, "Not in scope":

    "- Re-enabling the vscode.dev ops tunnel (`SWARMFORGE_SKIP_TUNNEL` /
       `tunnel.authed`) - separate question.
     - Changing BL-906's babysitterd tell-never-restart contract except as
       needed to *add* a peer watch of operator-runtime."

  Also firm:

  - The manual relaunch the human already ran is an ops unblock, not the fix.
    Verbatim: "Ops unblock already done by human (manual
    `start_operator_runtime.sh`) - do not treat relaunch as the fix."
  - Do not write a second liveness check. `operator-healthy?` is the one that
    `./swarm status` and `./swarm ensure` already agree on; a watch that
    decides differently would produce a runtime that status calls dead and
    the watch calls fine, or the reverse.
  - Restart attempts are bounded with backoff and escalate on repeated
    failure. An unbounded restart loop against a runtime that cannot start
    burns the host and buries the cause - the standing guardrail on retries
    applies here in full.
  - If the chosen host is babysitterd, invariant 3 needs an explicit answer
    in the design review: babysitterd is already watched by operator-runtime
    (BL-906), so a mutual pair recovers either single death but neither
    double death. That may be an acceptable limit, but it must be a stated
    decision rather than an accident.

qa_e2e_procedure: >
  From the repo root. The runtime is currently UP (pid 59115, the human's
  manual restart), so every step below must first take it down deliberately
  rather than waiting for a crash.

  1. Reproduce the gap at the parent commit. Kill `operator_runtime.bb`,
     leaving `.swarmforge/operator/runtime.pid` in place, and wait past the
     watch interval the ticket introduces. Confirm on the OLD code that it
     stays down indefinitely and `./swarm status` reports `stale-pid`. That
     staleness is the signal - a fix verified only against a cleanly-removed
     pidfile misses the field condition entirely.
  2. At the parcel commit, repeat step 1 and confirm the runtime comes back
     with no human action, and that `pgrep -f operator_runtime.bb` names a
     NEW pid.
  3. Cover the other two down-states from scenario 01 separately: no pidfile
     at all, and a pidfile naming a live but unrelated process (write the
     pid of a sleep). Pid reuse is the case a naive `kill -0` check gets
     wrong.
  4. Confirm invariant 1 in both spellings: with `SWARMFORGE_SKIP_OPERATOR=1`
     set, and with the park flag in place, a down runtime must stay down and
     be REPORTED as deliberately stopped. Assert the report, not just the
     absence of a restart - silence and a deliberate park must not look the
     same.
  5. Confirm invariant 2: each restart in step 2 produced an announcement on
     the human channel and a durable record. Kill it three times in a row and
     confirm the flapping is visible as three announcements.
  6. Confirm invariant 3 directly: kill `operator_runtime.bb` and assert the
     watch process is STILL ALIVE afterwards. If the watch is hosted inside
     anything that operator-runtime starts or supervises, this step fails and
     the design is wrong.
  7. Confirm the bounded-retry constraint: make the entry point fail (point
     `start_operator_runtime.sh` at a stub that exits non-zero via the test
     seam), and confirm attempts stop after the bound with a growing delay
     and an escalation - not an unbounded loop.
  8. Run the acceptance feature and confirm all scenarios pass, and that the
     handler is registered in `specs/pipeline/steps/index.js`.
  9. Prove non-vacuity: disable the new watch and confirm scenario 01 fails
     on all three rows while scenarios 02 and 03 still pass, then re-enable.

notes: >
  Source: `.swarmforge/operator/INTAKE-operator-runtime-no-always-on-watchdog.md`
  (human via Cursor, 2026-08-20 ~15:45 CEST), archived to
  `.swarmforge/operator/archive/` in the same pass that minted this ticket.

  Severity is the human's, verbatim: "Severity: **high** - Operator is the
  external recovery / human channel host; silent death removes the layer that
  is supposed to notice other daemons." I have kept `high` unchanged. It fits
  the project's own bar - a broken safety signal rather than a contained
  fault - and it is the same reading BL-951 and BL-992 used.

  Specifier verification, done deliberately narrowly because the intake said
  the gap was already confirmed in code and asked not to have it re-derived.
  I checked only the facts that shape the ticket, and all held:
  `start_operator_runtime.sh` exists and is executable; `operator-healthy?`
  and `ensure-operator!` are at swarm_ensure.bb:282/305 and are reached from
  `ensure-component!` at :868; `SWARMFORGE_SKIP_OPERATOR` is real and gates
  at swarm_ensure.bb:327; five `*_supervisor.bb` files exist and none is for
  operator-runtime. The runtime was alive again at spec time (pid 59115),
  matching the human's note that they had restarted it manually.

  One correction to the intake's citation, worth recording so nobody hunts
  for the wrong file: the front-desk park posture it points at is NOT in
  `front_desk_supervisor.bb`. The flag is
  `.swarmforge/operator/front-desk-PARKED.md`, guarded in
  `launch_front_desk.sh` and cleared by `unpark_front_desk.sh`. No equivalent
  park flag exists for operator-runtime yet, so scenario 03's "park flag
  file" row is a NEW artifact this ticket introduces, mirroring that shape -
  it is not an existing file to wire up.

  Deliberately NOT bundled: BL-653 (escalation-driven operator - the runtime
  wakes only on a real event) touches the same process but is a wake-policy
  change, not a liveness one. They will interact if both land, since a
  runtime that idles by design must still look alive to this watch; that is
  a note for whoever schedules them, not a dependency.

  IR-DRY: 3 medium-confidence findings, all reviewed and kept. All three are
  deliberate contrasts rather than drift - "observes it" vs "observes it
  repeatedly" (repetition is the variable scenario 04 tests), "the restart is
  announced" vs "nothing is announced" (a positive paired with its negative),
  and "the operator runtime is running" vs "the operator runtime dies" (the
  transition is the whole point of scenario 05). No Background hoisting
  beyond the shared premise: scenarios 03 and 04 share a down-state Given but
  01, 02 and 05 each contradict it.

approval_context: >
  I have deliberately NOT chosen where the watch lives. Your intake listed
  four candidates - babysitterd, the front-desk supervisor, a tiny dedicated
  supervisor, or a non-human-gated ensure-on-a-timer - and called it
  direction rather than mandate, so the ticket specifies the behaviour and
  leaves the host to design review. If you would rather pin it now, say
  which and I will fold it in as a firm constraint; that would make the slice
  smaller and the architect's job shorter.

  One thing I want your eye on either way: if the answer turns out to be
  babysitterd, then operator-runtime and babysitterd watch each other and
  nothing recovers a double death. I have written that up as a decision the
  design review must state out loud rather than ruling it out - a mutual pair
  may well be good enough, but it should not become the answer by accident.

  Everything else follows your four numbered directions as written, including
  that the manual relaunch is not the fix.

