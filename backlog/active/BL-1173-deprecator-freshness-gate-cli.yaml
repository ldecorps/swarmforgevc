description: |
  ## What

  Ship `node extension/out/tools/deprecate-check.js <root> <BL-id>` printing
  `{"decision":"allow"}` or `{"decision":"hold","reason":"..."}`. Wire into
  every paused→active promotion site (coordinator prompt already requires it;
  `promote_and_route_next.sh` and any other promote helper must consult the
  CLI and refuse on hold).

  Hold signals (any one): `.swarmforge/superseded/<id>`; ticket claims
  superseded/retired without done closure; all depends_on done but description
  names RETIRED surfaces; repeated spec-gap bounces on the same ticket.

  ## How (direction, not mandate)

  Pure check core + thin CLI (Boy Scout / onboarding-contract-gate shape).
  Coordinator keeps fail-closed manual checklist as fallback until CLI lands;
  after land, prefer CLI.

qa_e2e_procedure: >
  (1) Supersede marker → hold. (2) Clean ticket → allow. (3) depends_on done +
  RETIRED surface in description → hold. (4) Promote helper refuses on hold and
  leaves ticket in paused. (5) CLI crash → hold, never allow.

out_of_scope: |
  - Full /deprecate scan and retirement (BL-1174).
  - Auto-closing stale tickets without specifier adjudication.

