id: BL-1830
title: "The land step's tip-pure replay writes every path the landing ticket changed from the reviewed tip, whole, so an unlanded sibling's lines in that same file reach main without their sibling's other files (BL-1801's land e1cb2615de published two BL-1821 rows in suite-manifest.tsv naming test files main lacked; QA dropped them in a86fd40c17) - a shared own path lands only the landing ticket's own changes, or escalates by name"
milestone: M8
type: defect
severity: high
# high: a broken safety property of the land. This time the passenger lines
# were two manifest rows; the same mechanism publishes an unlanded,
# unreviewed sibling's CODE whenever it shares a file with the landing
# ticket. BL-1717 closed the path-level half (paths the landing ticket never
# touched); this is the line-level half.
status: todo
