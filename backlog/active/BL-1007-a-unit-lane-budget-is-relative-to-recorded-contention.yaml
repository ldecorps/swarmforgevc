id: BL-1007
title: "An absolute wall-clock test budget cannot survive a host whose contention swings 3x - four measured raises in four days, and BL-815's own 'comfortable margin' verdict for dependencyGateCliStorageGlobals decayed from 10.7s at load ~50 to a ~26s failure at load ~100"
milestone: M8
type: defect
severity: medium
status: todo
epic: code-quality-gates
priority: 30
direction: pipeline-note
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1007-a-unit-lane-budget-is-relative-to-recorded-contention.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl1007::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"
  - "extension/vitest.config.mjs::contentionBudget::the lane default must actually READ the new helper. A helper that computes a scaled budget nobody calls is the BL-419 shape - shipped, unit-tested, green, and wired into zero of the places the ticket was filed to fix. Anchored to the helper's module name rather than to testTimeout, which already appears in this file today and would match before any work was done"

invariants:
  - "Attributable: every budget decision is recorded with the contention factor it used and the test's load-normalized duration, so a red is interpretable from the run's own evidence and never needs a re-run at a different load to classify."
  - "Bounded: scaling is capped by a finite absolute ceiling. An arbitrarily contended host never grants an arbitrarily large budget - past the ceiling a test fails on wall-clock no matter how loaded the box is."
  - "Statically parseable base: each call site keeps a base budget readable from source text alone, so the existing BL-969 presence guard and BL-999 justification guard keep reading it unchanged."

description: >
  Four measured budget raises in four days on the same surface (BL-815
  classify, BL-914 raise, BL-969 raise, BL-999 raise), and a fifth is now
  due: six unit-lane reds that ALL pass in clean sequential isolation.
  Coder evidence 25412a8f1b, reproduced in
  backlog/evidence/specifier-disposition-bl999-class-unit-lane-load-budgets-20260821.md:
  a 4-core box at load 129-158, i.e. 25-45x core count, with the resident
  swarm live.

  The recurring failure is not any one budget being wrong. It is that an
  absolute wall-clock budget encodes an assumption about host contention
  that nothing records and nothing rechecks. BL-815 examined
  dependencyGateCliStorageGlobals directly on 2026-08-17 and recorded "no
  fix ticket, comfortable isolated margin" - at load ~50, where it ran
  10746ms. At load ~100 the same unchanged test takes ~26s and fails the
  20000ms default. The verdict did not become wrong; the load it was
  measured at silently stopped being the load it runs at. That is the same
  family this epic already names (BL-986 false zero, BL-987 dead archive,
  BL-998 live-state guards): an assertion that holds while the thing it
  guards does not.

  WHY THIS DOES NOT VIOLATE THE BL-815 DIRECTIVE. The human's constraint on
  BL-815 was "do not make these green by raising the 20s budget, skipping,
  widening exclude globs, or deleting coverage". This ticket does not raise
  the budget: on an idle or nominal host the effective budget stays exactly
  the base, so a genuine regression still reds on a quiet box just as it
  does today. What changes is only that a budget measured on a quiet host
  stops being silently reinterpreted as a promise about a host at 40x core
  count. Scope shape ruled by the operator 2026-08-21, choosing
  "make budgets load-relative to a recorded contention factor" over three
  alternatives (another round of measured per-test overrides, bounding lane
  load, or a separate serial lane).

  SCOPE. The unit lane (extension/vitest.config.mjs) and the four files
  currently red on it. This is NOT a licence to reprice every test in the
  suite: the four named files plus the lane default, and nothing else.

  OUT OF SCOPE, deliberately. (a) The PROPERTY lane
  (vitest.properties.config.mjs) is excluded: its own config records that
  Vitest's bundled birpc layer has a hardcoded 60000ms onTaskUpdate
  heartbeat that no public config option can raise, so scaling a property
  budget past it buys nothing and would fail the run through a different
  mechanism entirely. Property-runner reachability floors likewise stay
  absolute, never scaled. (b) The bounceWatcher red is NOT a budget failure
  and is not fixed here - it is its own inner 10000ms race deadline in
  test/helpers/boundedWatchWait.js, split out as BL-1008.

  HOW (direction, not mandate). extension/src/metrics/resourceTelemetry.ts
  already exports sampleHostLoadRatio(loadavg1m, cpuCount) - injectable,
  unit-tested, returning null rather than a fabricated ratio when a reading
  is unusable. Reuse it rather than sampling load again. Note the one hard
  constraint on placement: vitest.config.mjs is evaluated BEFORE any
  compile step has necessarily run, and extension/out/ is gitignored, so
  the config cannot safely import from compiled output - a config that
  require()s a missing out/ file takes the whole lane down rather than
  failing one test. specs/pipeline/steps/lib/testTimeoutParser.js is the
  established precedent for a compile-free shared test helper. The
  ceiling's VALUE is the implementer's measured call in the BL-914/BL-969
  tradition; the ticket fixes only that a finite one exists and is enforced.

qa_e2e_procedure: >
  1. From extension/, run the four named files in clean sequential
  isolation on a quiet host and confirm each passes with the effective
  budget equal to its base - the mechanism must be inert when the box is
  idle. 2. Re-run the full unit lane while the swarm is live (load >= 4x
  cores) and confirm the four files pass and the run's evidence names the
  contention factor used and each budgeted test's normalized duration.
  3. Force an extreme factor through the helper's injection seam and
  confirm the effective budget clamps to the declared finite ceiling rather
  than growing. 4. Confirm the BL-969 guard
  (test/bl969RealRepoTimeoutInvariant.test.js) still passes unchanged -
  it parses trailing numeric timeout arguments from source text and is the
  fastest check that invariant 3 held. 5. Confirm `npm run test:properties`
  is untouched by the change. NOTE for the hardener: this parcel touches
  extension/test/ and specs/pipeline/steps/, so the standing whole-tree
  guards apply - a targeted run cannot see a repo-wide invariant.

