description: |
  ## What is wrong

  BL-570's acceptance Background step
  (`specs/pipeline/steps/bl570PropertySuiteDriftGuardSteps.js`, "the shared
  pre-commit property guard is installed") reads `swarmforge/git-hooks/
  pre-commit` and asserts a non-comment line names
  `check_property_suite_drift.sh`. `test_property_suite_drift_guard.sh` case
  07 asserts the same line, then copies the hook plus a hand-picked set of
  guards and libs into a scratch repo and commits through it.

  BL-1252 (`76dd67b692`, 2026-08-30) made the hook a thin wrapper:

      exec "$REPO_ROOT/swarmforge/scripts/run_commit_guards.sh" "$REPO_ROOT"

  and `run_commit_guards.sh` is now the file that names the guard
  (`run_guard check_property_suite_drift.sh`, tier 2). The guard has been
  wired on every commit since; the assertion is one level too shallow. The
  Background fails, so all seven scenario runs of
  `BL-570-property-suite-drift-guard.feature` fail before their first step
  (reproduced 2026-09-05: 0 pass / 7 fail, "pre-commit must invoke
  check_property_suite_drift.sh (not only name it in a comment)"). Case 07
  fails the same grep, and its copied hook would then exec a runner the
  fixture never had.

  ## How (direction, not mandate)

  - Extract the wiring check into one function, `propertyGuardIsWired`, in a
    small requireable module under `specs/pipeline/steps/lib/` (the
    directory already holds such helpers). It takes `{ repoRoot }` with the
    hook and runner paths defaulting to the live ones (a seam for the
    scenarios), and decides: the hook invokes the runner in a non-comment
    line, AND `deriveCommitGuardFixtureSet(...).guards` from BL-1398's helper
    (`extension/test/helpers/commitGuardFixtureSet.js`) contains
    `check_property_suite_drift.sh`. On failure it names the missing hop.
    The name is fixed by the `required_wiring` declaration so the anchor is a
    literal that will exist (BL-874); the shape inside is the coder's.
  - The BL-570 handler's Background calls it against the real repo. Case 07
    calls it through `node -e`, the way `test_bl1398_guard_fixture_derives_
    set.sh`'s `derive()` reaches JS from bash.
  - Case 07's commit-through-the-hook half: drive the copied hook with
    `SWARMFORGE_COMMIT_GUARD_DIR` pointing at a directory holding the REAL
    property guard (and the libs it sources) plus a passing stub for every
    OTHER derived guard. That keeps a docs-only fixture commit from booting
    handoffd (`check_bb_scripts_load.sh`) or reading the step registry inside
    a scratch repo, and it still proves the delegation end to end: hook, then
    runner, then the guard's own skip-paths decision. Copying the helper's
    full `files` set instead is the alternative; prefer the stubs.
  - The BL-570 feature file is NOT amended: its Background text is still
    true, and its seven runs are the thing this ticket makes green again.
    Its mutation stamp is unchanged.

  ## Explicitly NOT in scope

  - Whether the hook may call a guard directly, bypassing the runner: the
    runner test's case 10 owns that (and BL-1408 fixes its list).
  - The hand-written guard lists in the other commit-guard tests: BL-1408,
    minted the same pass.

qa_e2e_procedure: |
  1. On the parcel: `specs/pipeline/scripts/run_acceptance.sh
     specs/features/BL-570-property-suite-drift-guard.feature` passes all
     seven scenario runs (0/7 on main 2026-09-05).
  2. `bash swarmforge/scripts/test/test_property_suite_drift_guard.sh`
     prints `PASS: 07` and every case through 10 passes; its first failure,
     if any, is case 11 or later - BL-1448's allowlist cases, not this
     ticket's (amended 2026-09-06, see notes; was "passes every case").
  3. Seam: a scratch tree whose hook execs a runner copy that names the
     property guard: the check passes. Comment out the exec line in the hook
     copy: the check fails naming run_commit_guards.sh. Restore it and delete
     the `run_guard check_property_suite_drift.sh` line from the runner copy:
     the check fails naming check_property_suite_drift.sh.
  4. `grep -c 'run_guard' specs/pipeline/steps/bl570PropertySuiteDriftGuardSteps.js`
     returns 0 and `grep -c propertyGuardIsWired` returns at least 1; the
     same two greps on `test_property_suite_drift_guard.sh` (invariant 2).
  5. Fixture roots are removed on exit; nothing sweeps by prefix.

