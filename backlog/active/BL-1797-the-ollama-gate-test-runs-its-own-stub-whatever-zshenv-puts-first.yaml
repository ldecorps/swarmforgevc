id: BL-1797
title: "test_ollama_ancillary_launch_gate.sh is red on main because its PATH-prepended ollama stub loses to the host's real binary: zsh -c sources ~/.zshenv, which puts ~/.local/bin (a real ollama since 2026-09-28 19:26) first, so scenario 01 starts the real server, which fails to bind 11434 and never answers ('never answered within 5s'), and scenario 02's stub-never-ran check passes vacuously; the test names its stub through SWARMFORGE_OLLAMA_BINARY, and an acceptance scenario proves a decoy zshenv cannot swap it"
milestone: M8
type: defect
severity: high
# high: a standing red on main at first sighting (standing-red amendment
# 2026-09-05). Not load: reproduced deterministically, twice at mint.
status: todo
