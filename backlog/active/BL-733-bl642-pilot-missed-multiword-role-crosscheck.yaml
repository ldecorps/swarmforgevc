  display_name_for_role emits multi-word and @-seat names the regex missed.
description: |
  ## What

  BL-642's tests reuse the exact live-pane text from its own repro plus a
  handful of negative cases, but nobody checked the new pattern against
  swarmforge.sh's display_name_for_role() — the actual generator of the
  strings the pattern is supposed to match everywhere, not just in the one
  observed repro.

  ## Question to answer

  For any ticket that adds a regex/pattern meant to recognize output
  produced elsewhere in the codebase (here, role display names), what gate
  should require checking the pattern against that producer's real output
  space rather than only the one observed instance? This is a smaller
  instance of the same class of gap "consumer sweep must be exhaustive, not
  sampled" already names for consumers — apply the same discipline to
  producer/pattern pairs, and harden `/pilot` accordingly.
qa_e2e_procedure: >
  (1) Pattern ticket + repro-only coverage → land refused. (2) Producer with
  enumerable space (e.g. display_name_for_role) → exhaustive crosscheck before
  land. (3) Green exhaustive run lands with receipt metadata. (4) Incomplete
  crosscheck inert refuse.
out_of_scope: |
  - Fixing the pane-title regex itself (BL-732 remaining-work).
  - Replacing BL-727 acceptance gate or reimplementing the pipeline.
  - Rewriting BL-642 chrome filters or display_name_for_role.
