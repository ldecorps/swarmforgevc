description: |
  ## What is wrong

  BL-698 closed with an acceptance feature that no step handler binds.
  Run, every scenario fails with "no step handler matched" (one generic
  step binds elsewhere, which is why the 2026-10-03 census missed it). On
  2026-10-06 the specifier retired 17 of its 26 scenarios and three
  outline rows: nine duplicated BL-702/BL-704 scenarios that are already
  wired green; the rest were contradicted, never built, unwireable or
  meta. What remains describes behaviour that ships.

  ## What is wanted

  One new step-handler file, `specs/pipeline/steps/bl698OperatorCommandSurfaceSteps.js`,
  binding every remaining step as written, so the feature passes 9 of 9
  against the shipped code. Where each scenario lands (from the
  adjudication's evidence):

  - Background (three steps, same text as BL-702's): bind under BL-698's
    own feature name, as `bl702OperatorDangerTiersSteps.js` does for its own.
  - `/pilot refuses while the swarm is live`, `/hydrate refuses when a
    full-pack role is up`, `/stop offers drain-stop and emergency-stop
    modes`: the Live inbound handler (`telegramCursorBridgeLive.ts`,
    `handleInboundDecision`) with a fake context, agent session and post
    function, the `mkCtx` pattern in `extension/test/telegramCursorBridgeLive.test.js`.
    Liveness is `isSwarmLive` over tmux sessions: a fake `tmux` on PATH
    makes the swarm "live". The Given "the swarm tmux session or handoffd
    is live" is a disjunction; its tmux branch is the one the code reads.
  - `Soft lifecycle verbs need a light confirm before run` (one row,
    `/pull`), `/ambulance engages and releases exclusive hold`, `/hold
    parks to backlog/hold and /reinstate restores`: `executeOperatorVerb`
    on a mkdtemp root with stub scripts, `bl702OperatorDangerTiersSteps.js`
    as the template. Ambulance engages only a ticket in `backlog/active/`
    (BL-691 D3), so the fixture seeds BL-698 there. For "the principal
    sends" a confirm-tier verb, `bl704OperatorShiftsHolidaysSteps.js` is
    the precedent: the step drives the verb's executor; the confirm tap
    itself is BL-702's scenario.
  - `/autopilot dry ...` and `/land dry lists in-flight tickets only`:
    `selectAutopilotQueue` / `selectLandQueue` (read tier) over a fixture
    backlog.
  - `Control topic accepts the same slash forms as Cursor Remote`:
    `telegramControlCore`'s `/ambulance` decision, then the same
    `engageOperatorAmbulance` backend on the fixture.

  ## How (direction, not mandate)

  - Drive compiled modules (`extension/out/...`) in-process. Build fixtures
    under mkdtemp; prove a fixture repo with `rev-parse --git-common-dir`
    before any mutating git command.
  - Register every step with `defineScoped` under the feature's own
    `Feature:` name so it never answers another feature's steps (BL-1277);
    the collision guard in the unit lane stays green. "the swarm is
    stopped" currently binds to an unrelated handler
    (`resourceSamplerActivationSteps.js`); BL-698 no longer uses that step.
  - If the file writes a fake `tmux` onto PATH and names a server-creating
    subcommand, it is in `tmuxReaperGuard.test.js`'s scope: require
    `./lib/fixtureReaper`, `track(root)` at fixture creation and `reap(root)`
    before `rmSync`, as `bl958ControlPlaneLossSteps.js` does. Run `npm test`
    before forwarding, not only the feature.
  - A scenario that fails on its merits once bound is a real defect in
    shipped behaviour. Send the specifier a note naming the scenario and
    the observed value, and keep binding the rest. Never edit a scenario to
    pass.

