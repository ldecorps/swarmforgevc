id: BL-1480
title: "Two promote_and_route_next standing shell tests have been red on main since 2026-08-20 with no owner: their fixtures hand-copy the promotion gates' 2026-08-08 bb closure, backlog_depth_lib.bb now load-files daemon_cycle_guard_lib.bb and promotion_gates_lib.bb three more libs, so the fixture's bb dies at load - the priority test fails outright and the no-limit test falls back to the default cap of 5 and asserts on the wrong thing; both fixtures derive their copy set with copy_bb_closure and are enrolled in BL-973's closure guard"
