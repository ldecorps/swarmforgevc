    ```
      - { at: 2026-08-07, by: QA, blamed: coder, class: behavior, commit: 8ac82a0e, evidence: backlog/evidence/BL-819-qa-bounce-20260807.md }
    ```

    Every field is taken from `.swarmforge/bounces/2026-08.jsonl` and the
    committed evidence file; nothing is reconstructed by guess. Do not touch
    BL-681 (already carries both) or BL-789 (see Out of scope).

  - Aside, deliberately not acted on: BL-819's architect entry cites commit
    `a6f61c2895` while the JSONL record for the same bounce says
    `a6f61c28e3` — same 8-char prefix, different 10-char hash. Whatever
    produced that disagreement is not this ticket's defect and the entry is
    left exactly as it stands.

  - Gherkin parked as `.feature.draft` per BL-233; the coder promotes it to
    `.feature` and wires step handlers in the same commit.

  - IR-DRY reviewed: 12 remaining near-duplicate findings are all
    outline-placeholder vs concrete-literal pairs between the Scenario
    Outline and the three-bounce scenario, which needs its own second
    `Given`. Merging the identical-bounce case into the outline already took
    the findings from 25 to 12; the rest are structural, not drift.

