qa_e2e_procedure: |
  On the parcel commit, from the QA worktree root:
  1. `node extension/out/tools/qa-gather.js --ticket BL-1554 --task <this
     parcel's task name>` -> one JSON document on stdout with eight check
     rows in the order stragglers_before, sibling, register, wiring, unit,
     properties, acceptance, stragglers_after, each with command, cwd,
     status, exit, duration_ms, excerpt; a register_join section; exit 0.
  2. `jq 'keys'` on the report shows no verdict/pass/bounce/approve key;
     `grep -ci '"verdict"'` on it is 0.
  3. With the properties lane red on a registered file (any current
     standing-red row), the register_join names that file as owned with
     its ticket id; with `--task` omitted the wiring row is `blocked` with
     a reason and the remaining rows still ran.
  4. `node extension/out/tools/qa-gather.js` with no `--ticket` exits 2.
  5. `git diff main...HEAD --name-only` names the quality module, the CLI,
     their unit tests, the step handler, the feature, evidence and docs;
     nothing under `swarmforge/scripts/` is changed (no check was
     reimplemented).

