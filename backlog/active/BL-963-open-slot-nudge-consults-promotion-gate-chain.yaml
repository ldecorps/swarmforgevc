     refuses. Applied here by hand, since the gate that will enforce it is
     precisely what BL-957 is building.
  2. human_approval: pending - not `approved`. An answer owed by a human.
  3. Capacity: active/ holds 7 against an effective cap of 7 (live full-forge
     pack). At the cap, no slot.

  RANK WHEN UNBLOCKED: type defect / severity medium, so NOT expedited under
  Article 3.2.4. It queues on its ordinary priority: 30, behind BL-962
  (defect/high, currently the only expedited ticket in paused/).

  NOTE FOR WHOEVER BUILDS THIS: BL-963 is itself a live instance of the defect
  it fixes. It is dependency-blocked right now, yet nothing in
