  A concrete regression fixture, not a hypothetical. See evidence 76cbd1067.

  No orthogonality conflict, no ambulance freeze (status: inactive), no
  onboarding-contract hold.

  APPROVAL LANDED 2026-08-20: human_approval is now `approved`, clearing blocker
