approval_context: >
  One design ruling to confirm, the rest is consumer plumbing. Refusal
  handling is asymmetric by design: human_approval refusals stay surfaced
  (named + flagged, per the BL-798 scenario 03 ruling you already approved)
  because approving is the human's own next action; every OTHER gate
  refusal filters the candidate out of naming, counting, and escalation,
  because promoting or approving it cannot succeed and repeated nudges for
  it are exactly the SUP-1 noise shape. The alternative - naming the
  top-ranked candidate flagged "blocked by <deps>" - was considered and
  rejected: it makes the nudge suggest a non-action, keeps the eternal-fire
  problem when everything is blocked, and duplicates information the
  coordinator gets from the gate's own REFUSE reason at promotion time. Say
  the word if you want blocked candidates surfaced instead of filtered.

