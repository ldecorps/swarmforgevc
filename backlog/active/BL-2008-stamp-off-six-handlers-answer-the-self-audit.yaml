description: |
  ## Status: hotfix 0c1de3028c landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## The census

  39 features whose handlers send a git_handoff through the real
  swarm_handoff.bb without naming AUDIT_REQUIRED / HANDOFF_NOT_QUEUED, run
  once each: 32 green; BL-606 green but slow (18/18 in 204 s - it timed out
  only under the census's 300 s ceiling with the host loaded); six red,
  none in the standing-red register.

  ## What was wrong, and what the hotfix changed

  - BL-748, BL-951, BL-953, BL-991, BL-992: each handler sent once. Since
    the Article 2.3 self-audit (BL-1529) the first send queues nothing; the
    output carried AUDIT_REQUIRED exactly once per failing scenario. New
    `specs/pipeline/steps/lib/answerHandoffAudit.js` `spawnHandoffSend`
    re-sends the identical draft only on the challenge; the five handlers
    call it instead of `spawnSync`.
  - BL-983: "no seat of its own stage is addressed" asserted no `@`
    anywhere in the parcel; BL-1637 (2026-09-19) deliberately stamps the
    reserved, tool-stamped `from_seat:` header that a seat's completion
    gate reads. The step now drops that header line before the check and
    still requires from:/to:/recipient:/role:/body and the filename to be
    seat-free. Per BL-1006, the later deliberate ticket retires the
    assertion it falsifies; BL-1637 missed it.

  ## What the coder does (all of it)

  1. Run qa_e2e_procedure steps 1-6 once each, in your worktree, each
     output saved to its own file under tmp/.
  2. Read `git show 0c1de3028c` against the sections above and the
     invariants.
  3. Write backlog/evidence/BL-2008-coder-<date>.md: the six results and
     one line saying whether the hotfix matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

