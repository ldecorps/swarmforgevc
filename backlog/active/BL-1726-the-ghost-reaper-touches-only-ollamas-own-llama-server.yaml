id: BL-1726
title: "BL-1705's landed ghost reaper (ca2a683e48) reaps ANY llama-server whose parent is not a live ollama serve, at any age - so a llama.cpp server the human starts by hand outside the swarm (parent: a shell) is killed at the next janitor sweep; a runner counts as ollama's own only when its executable is inside an ollama installation's lib directory AND its --model is an ollama model blob, and every other llama-server is never signalled"
milestone: M8
type: defect
severity: high
# high: a live safety fault - the swarm's janitor (run by operator_runtime
# and onboarder_supervisor) can kill a process it does not own, outside
# the swarm, the moment one exists; the human's GPU is due within days and
# local-model experiments are the queue-jump priority. The specifier's own
# BL-1705 spec asked for the over-broad rule ("reap, any age"); QA passed
# the build against it and flagged it (note 003143). Not critical: no such
# process runs now - the only llama-server is ollama serve's own child.
status: todo
epic: local-llm-swarm
priority: 4
direction: swarm-reported
depends_on: []
# BL-1705 (landed) wrote the rule; BL-1723 (paused, after BL-1705) edits
# the same file's disposable-root regex - orthogonal functions, but the
# coordinator should not run the two concurrently (same file).
mutation_cost: low
# low: one Babashka predicate (no mutation/CRAP/DRY wired, BL-472); the
# feature is a pure classifier read, milliseconds per run.
slice_size_envelope: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]

acceptance: specs/features/BL-1726-the-ghost-reaper-touches-only-ollamas-own-llama-server.feature

# Handler pin only (BL-233, BL-1371). The consumer (the janitor sweep's
# reapable-ollama-ghost? call) exists before the fix (BL-1235); the
# feature drives the real predicate.
required_wiring:
  - 'specs/pipeline/steps/bl1726GhostReaperOllamaOwnRunnerSteps.js::registerSteps::the handler lands in the same parcel as the feature (BL-233, BL-1371)'

human_approval: approved
approval_context: >
  A new feature file is authored here, so it would ordinarily need a tap;
  it is minted approved under the 2026-09-17 operator hotfix (severity
  defect, no choice posed, no ruling_options). FIRM: a llama-server is
  ollama's worker only with BOTH marks - its executable path is inside an
  ollama installation's lib directory (".../lib/ollama/llama-server") and
  its --model argument names an ollama model blob (".../models/blobs/sha256-") -
  the narrower of the possible rules, because the cost of a false reap is
  killing a process the swarm does not own. FIRM: `ollama runner` stays
  ollama's by name. FIRM: nothing else in BL-1705 changes (serve never
  touched, the live-window exemption, the run-client rule).

invariants:
  - "The janitor never signals a llama-server unless its command line shows it is ollama's own worker: its executable inside an ollama lib directory and its --model an ollama model blob."

description: |
  ## What is wrong

  QA note 003143 on BL-1705 ("reaps any non-ollama-parented
  llama-server"), QA evidence `backlog/evidence/BL-1705-QA-20260924.md`:
  "any llama-server whose parent isn't a live ollama serve is reaped at
  any age. A hand-started llama.cpp server outside tmux would therefore be
  killed. The ticket asks for exactly this rule." The specifier's BL-1705
  spec said: "a model runner (command line `llama-server ...` or `ollama
  runner ...`) whose parent is not a live `ollama serve` -> reap, any age".

  Landed code (ca2a683e48, orphan_janitor_lib.bb):
  `ollama-model-runner-cmdline?` matches `(?:^|/)llama-server\b` - any
  path - and `reapable-ollama-ghost?` returns true for it whenever the
  parent is not a live ollama serve. Checked on main:
  `/home/u/llama.cpp/build/bin/llama-server -m /home/u/models/q.gguf` ->
  true; `/usr/lib/ollama/llama-server --model /data/models/local.gguf` ->
  true. The sweep runs inside operator_runtime.bb and onboarder_supervisor.bb.

  Ollama's real worker on this host (2026-09-24, pid 16536, child of
  `ollama serve` pid 1989):
  `/mnt/d/dev/ollama/lib/ollama/llama-server --model
  /home/carillon/.ollama/models/blobs/sha256-64b53b64... --port 40483
  --host 127.0.0.1 --no-webui --offline ...` - both marks present.

  ## What is wanted
  - Scenario 01 (outline): an old runner-shaped process with no live
    ollama serve parent is reaped only as ollama's own worker (both marks)
    or an `ollama runner`; a llama.cpp build's server, a PATH-resolved
    llama-server on an ollama blob, and an ollama-installed server on a
    non-blob model are kept.
  - A kept llama-server is still a sweep candidate: the sweep classifies it
    and counts it in its own `swept N candidate(s)` line, and never skips it
    unscanned. No per-process "kept" line is required. (Amended 2026-09-25,
    QA D3: the mint said "logged as not ollama's" and named neither a
    scenario nor a target log. One line per kept process on every sweep
    would repeat for as long as a hand-started server runs. The count
    already shows it was seen.)

  ## Send-back 2026-09-25 (QA evidence 91d5967fe5, parcel 9c10e2985f)
  - D1 (invariant-unencoded, coder): the rebuild adds a coder-authored,
    non-vacuous property test for invariant 1,
    `extension/test/bl1726*.property.test.js`. It drives
    `reapable-ollama-ghost?` over a CONSTRUCTED command-line space: the
    executable (inside an ollama lib dir / a llama.cpp build / PATH-resolved
    / `ollama runner`) x the model (an ollama blob / any other path) x
    parent liveness, age and the live-window flag. Its property: whenever
    the predicate says reap for a llama-server, both marks are present.
    Assert the reach floor, and show it red against a broken predicate
    (the pattern is `extension/test/bl1705OllamaGhostJanitor.property.test.js`).
    The invariant is encodable, so a stated non-encodability reason does
    not discharge it.
  - D2 (spec-gap, specifier): the fix falsified BL-1705's Examples row 2
    (a bare `llama-server`, parent init, reaped), and this ticket's Scope
    did not name it. The coder's amendment is RATIFIED by the specifier.
    Row 2 now carries both ollama marks and is still reaped, so BL-1705's
    point (a ghost runner is reaped) stands under the narrower
    classification. The bl1705 audit assertion is loosened to match the
    full executable path, and the bl1705 acceptance runner's fixture
    command lines carry both marks. All three paths are in Scope below.
    Nothing is reverted.

  ## Scope
  - `swarmforge/scripts/orphan_janitor_lib.bb` (`ollama-model-runner-cmdline?`
    or its use in `reapable-ollama-ghost?`) and its bb test.
  - `specs/features/BL-1726-...feature` + the pinned handler.
  - Docs: the janitor reference's ollama paragraph.
  - Ratified at the 2026-09-25 send-back (D2):
    `specs/features/BL-1705-the-orphan-janitor-reaps-ghost-ollama-runners-and-detached-run-clients.feature`
    (Examples row 2), `specs/pipeline/steps/bl1705OllamaGhostJanitorSteps.js`
    (audit assertion), `swarmforge/scripts/test/bl1705_ollama_ghost_janitor_acceptance_runner.bb`
    (fixture command lines).
  - Added at the send-back (D1): `extension/test/bl1726*.property.test.js`.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1726-the-ghost-reaper-touches-only-ollamas-own-llama-server.feature`:
     all ok (5 of 5).
  2. The BL-1705 feature and the orphan-janitor bb runner: green.
  3. Live read, no signal sent: with the local ollama serve running a
     model, call `reapable-ollama-ghost?` on its real llama-server child's
     command line with `:parent-live-ollama-serve? false` - true (still
     ollama's worker by its marks); on the same command line with the
     executable path replaced by `/home/u/llama.cpp/build/bin/llama-server`
     - false.
  4. `git diff main...HEAD --name-only` names only the Scope files
     (including the three ratified BL-1705 paths and the bl1726 property
     test), the feature, the handler, docs and evidence.
  5. `cd extension && npx vitest run --config vitest.properties.config.mjs test/bl1726*.property.test.js`:
     green, with its reach floor asserted.

