required_wiring:
  - "swarmforge/scripts/context_telemetry_lib.bb + context-events.jsonl::compaction:true events::primary structured detection signal (requires BL-665 producer)"
  - ".swarmforge/telemetry/compaction-<YYYY-MM>.jsonl::derived compaction records::append-only gitignored {role, model, tokens-at-compaction, ts}"
