  - [2026-08-28] specifier: spec-gap corrected, no rebuild. The documenter's
    pre-QA wiring gate refused this parcel because required_wiring entry 2
    named `quarantine-lift-check.ts` for `filterRecoveryPaths`, which lives in
    the sibling CLI `recovery-filter-check.ts` the coder built after the
    architect bounce. The implementation is correct and needs no change; the
    YAML was wrong. Verified independently before amending: the documenter
    worktree's `recovery-filter-check.ts` contains `filterRecoveryPaths` 4x
    and `quarantine-lift-check.ts` contains it 0x.
  - [2026-08-28] specifier: mint-time lesson, worth generalising. This ticket
    said in its own notes that "hosting both verbs in one CLI is direction,
    not mandate" - and then pinned both required_wiring entries to one file
    anyway. A wiring anchor is a literal substring match, so it silently
    converts a stated non-mandate into a hard one, and the gate fires on the
    documenter, five stages downstream of the decision. When a ticket leaves
    a hosting choice open, anchor to the function name in whatever file
    exports it, or split the entry when the slice ships, but never pin an
    optional location. Same family as BL-874 (placeholder patterns) and
    BL-960 (quoting); this is the third distinct way a required_wiring entry
    can be unmatchable by construction.
