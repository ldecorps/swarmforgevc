source: |
  Specifier census, 2026-10-03:
  backlog/evidence/BL-1870-merge-path-decline-census-20261003.md, cause 1.
  Reproduced in a `git clone --shared` scratch copy with the lander's own
  command (`git merge --no-ff -m "Land BL-1891: merge origin/main
  ce40995d90" ce40995d90` on a detached d3bb22043c):
  "Error: merge deletes 'tmp/BL-1867-tmpdir/.../project.prompt' (BL-1834,
  introduced at 7faaee00db on this branch), not named in the commit
  message." (29 lines), while `git merge-tree` reported no conflict.

description: |
  ## What is wrong

  check_merge_deletion.sh (commit-msg hook, every merge) collects two kinds
  of deletion: paths the receiving side (HEAD) had that the merge result
  lacks ("this branch"), and paths the incoming side had that it lacks
  (BL-1341). When the incoming side is origin/main, every "this branch"
  deletion is a path origin/main deleted after the line was cut, a
  deletion that has already landed. The guard refuses it unless the
  message names the ticket that introduced the path.

  On 2026-10-03 this kept three clean lines off BL-1901's merge path
  (BL-1891, BL-1893 and BL-1906 each carried the 29 leaked
  `tmp/BL-1867-tmpdir/` files that origin/main deleted in 0cd819a49f). The
  merge path reported each one as a conflict (BL-1914 owns that label).
  The same refusal meets a role that merges origin/main into its own line,
  and roles have been working round it by naming the introducing ticket.
  A retirement on main (5 files since 2026-10-02 00:00) does the same to
  every line older than it. Once BL-1870 deletes the land step, the merge
  path will have no fallback and such a line cannot land at all.

  ## What is wanted

  - Merging origin/main (or a commit on it) into a line carries
    origin/main's own deletions without the message naming anything.
  - A merge from a branch that is not on origin/main is refused for a path
    it deletes, exactly as today (BL-1242's QA-branch incident).
  - The lander lands a clean line cut before a deletion on origin/main by
    the merge path.

  ## How (direction, not mandate)

  In the "this branch" direction, skip a path when the incoming commit
  (MERGE_HEAD) is origin/main or an ancestor of it and the path is absent
  there, because then the deletion came from origin/main. Resolve
  origin/main the way the guard's callers already see it (the lander
  worktree fetches first) and fail closed when it does not resolve. Leave
  the incoming-side direction and the exemption-by-naming model alone.

  ## Scope

  swarmforge/scripts/check_merge_deletion.sh, its shell test, the new
  feature and its step handler bl1913MergeOfOriginMainCarriesItsDeletionsSteps.js.

qa_e2e_procedure: |
  On the parcel commit, ONE run each:
  1. `node specs/pipeline/cli.js specs/features/BL-1913-a-merge-of-origin-main-carries-a-deletion-origin-main-already-made.feature`:
     01, 02, 03 ok.
  2. `node specs/pipeline/cli.js specs/features/BL-1242-merge-never-silently-drops-branch-work.feature`:
     every scenario ok (measured at mint, see notes).
  3. check_merge_deletion.sh's shell test(s): ALL PASS.
  4. Repro on the live repository, read-only, in a `git clone --shared`
     scratch copy (prove `git rev-parse --git-common-dir` is the clone's
     own `.git` first): with core.hooksPath set to swarmforge/git-hooks
     and `git checkout --detach d3bb22043c`, `git merge --no-ff -m "Land
     BL-1891: merge origin/main ce40995d90" ce40995d90` prints no "merge
     deletes" line. (A check_closed_ticket_subject.sh refusal of the
     subject is expected, because BL-1891 has since closed.)

