  cleaner: "one predicate and one map key; no structure to refactor"
acceptance: specs/features/BL-1301-a-parked-ticket-is-not-a-dropped-parcel.feature

invariants:
  - "Suppression is opt-in and fails closed: an active ticket with no status field, or any status other than blocked, is nudged exactly as it is today."
