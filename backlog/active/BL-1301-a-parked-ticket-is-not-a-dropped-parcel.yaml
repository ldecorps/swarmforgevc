id: BL-1301
title: "A deliberately parked active ticket matches the dropped-parcel shape exactly, so the sweep re-reports it as a possible drop every cooldown window until the park ends"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarm-reliability
priority: 14
direction: agent-reported
depends_on: []
mutation_cost: low
slice_size_envelope: low
required_stages: [coder, architect, hardender, documenter, qa]
