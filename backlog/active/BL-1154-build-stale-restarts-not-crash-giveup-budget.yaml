id: BL-1154
title: "Healthy build-stale front-desk restarts must not burn the crash give-up attempt budget"
milestone: M8
type: defect
severity: high
# high: same live outage class as BL-1151 — false crash-budget exhaustion
# keeps the desk cycling into give-up.
status: paused
epic: swarm-reliability
priority: 0
direction: queue-jump
depends_on: [BL-1151]
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1154-build-stale-restarts-not-crash-giveup-budget.feature
human_approval: approved
approval_context: >
  Sibling to BL-1151 from INTAKE-front-desk-bridge-giveup-email-spam.md.
  Live logs showed build-stale detect/restart churn around the give-up email
  spam window. Specifier disposition: voluntary stale-build rolls must not
  consume the crash give-up attempt budget the same way as crash restarts
  (or must reset attempts when the restart was a voluntary stale-build roll).
  True crash loops must still reach give-up. Approve = ship; Amend if
  evidence shows a different burner and this should be deferred with a
  written reason instead.
required_wiring:
  - "specs/pipeline/steps/index.js::bl1154BuildStaleNotCrashGiveupBudgetSteps::acceptance handler registered so the runner executes every scenario"
invariants:
  - "A voluntary build-stale restart of an otherwise healthy child never alone exhausts the crash give-up attempt budget."
  - "A true unsuccessful exit / crash loop still reaches give-up within the configured attempt budget."

description: |
  ## What

  Front-desk supervisor build-stale restarts (BL-582) may be consuming the
  same attempt budget as crashes, driving give-up without a true crash loop.
  Human intake requires the underlying budget-burner be addressed, not only
  quieter email (BL-1151).

  ## Why

  If healthy children roll for stale builds and each roll counts as a
  crash attempt, give-up (and human escalation) fires falsely.

  ## How (direction, not mandate)

  Separate voluntary build-stale restart accounting from crash/unsuccessful
  exit accounting in front_desk_supervisor_lib / supervisor tick. Confirm
  against live logs; if build-stale is NOT the burner, record evidence and
  defer with a written reason rather than a cosmetic counter change.

qa_e2e_procedure: >
  (1) Fixture: N voluntary build-stale restarts on a healthy child — attempt
  budget must not hit give-up solely from those.
  (2) Fixture: crash/unsuccessful exits still reach give-up at max attempts.
  (3) Cite live supervisor log evidence from the 2026-08-26 window for or
  against build-stale as the burner.

out_of_scope: |
  - Email arming policy (BL-1151).
  - Removing build-stale detection.
  - Unrelated swarm emails.

