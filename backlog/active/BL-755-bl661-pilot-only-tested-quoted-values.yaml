description: |
  ## What

  `take-flow-reason` has three distinct branches (double-quoted, single-quoted,
  unquoted) but every test BL-661 added exercises only the double-quoted branch.
  Coder/cleaner/architect all praised the parsing-hazard tests that DO exist
  without noticing the other two branches had zero coverage (BL-754 remaining
  work).

  ## What to do

  1. **hardener.prompt (specifier-landed this turn, BL-798):** rule
     "A multi-branch parser needs one distinct test per branch (BL-755)" —
     do not remove unless human_approval amends.
  2. **`/pilot` prompt (coder):** extend `composePilotExpeditorPrompt` so the
     hardener hat enumerates cond/case/if-else arms (≥3) on new/changed
     functions and requires a distinct test per arm before pass.
  3. **Land gate (coder):** `checkMultiBranchParserCoverage` on
     `landPilotedTicket` — for functions modified in the run with ≥3 arms,
     each arm needs a distinct exercising test; else refuse
     `reasonKind: 'untested-parser-branch'` (inert). No-op if none touched.
     Fail open with warning if analysis cannot resolve (mirror BL-729/737).
  4. How-to on BL-727 gate doc or sibling BL-755.

  ## Out of scope

  - Covering take-flow-reason's missing branches (BL-754)
  - Requiring per-arm tests for every 2-arm if/else in the repo
  - Full mutation as the only way to discover arms

qa_e2e_procedure: >
  (1) Grep hardener.prompt for BL-755 per-arm rule. (2) composePilotExpeditorPrompt
  carries the rule. (3) Touched 3-arm parser with one tested arm → refuse.
  (4) All arms tested → land completes. (5) No multi-arm touch → no-op.
  (6) Refused land inert.

