id: BL-1053
title: "The intelligence layer cannot route work to a local-model seat: provider->agent knows cloud providers only, so a downloaded model registered under the openai key would launch through a cloud binary"
milestone: M8
type: feature
status: todo
epic: swarm-intelligence-layer
priority: 6
direction: queue-jump
depends_on: [BL-1052]
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1053-the-intelligence-layer-can-route-work-to-a-local-model-seat.feature
human_approval: approved
approval_context: >
  Operator reframed the pair on 2026-08-22 via Let's Talk. BL-1082 now pulls
  and serves a named model on the host, BL-1052 staffs a seat against it, and
  this ticket stays the bookkeeping half: give the intelligence layer a
  provider key and a Steward registration so routing can select that seat.
  Needs your re-approval of the wider framing. One specifier decision to sign
  off: on-host models register under the existing `low` cost class rather than
  a new `free` rank - `low` is already the cheapest rank, and adding a rank
  below it would re-order every existing cloud candidate for a gain this slice
  does not need. Inert until BL-1052 lands something to launch.

required_wiring:
  - 'swarmforge/scripts/model_factory_lib.bb::"local-model"::the provider key for on-host models must resolve to the local-model seat agent in the live provider->agent map - agent-for-provider reads that map and falls back to the provider name itself, so a key registered anywhere else leaves ModelFactory naming a launch agent that does not exist'
  - "specs/pipeline/steps/index.js::bl1053::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "Every provider key in the registry resolves to exactly one launch agent, and no provider key resolves to an agent that cannot serve it. A provider added without its own provider->agent entry falls through to the provider name itself rather than failing, which is the confusing failure this ticket exists to prevent."
  - "Registration is model-generic. Adding a second downloaded model under the same local provider must be Steward registration only - never a new provider->agent map edit."

description: |
  ## What is wrong

  ModelFactory's provider->agent map knows cloud providers only: anthropic,
  openai and cerebras. Once BL-1052 makes a downloaded local-model seat
  launchable, the intelligence layer still cannot select it, because no
  provider key points at that seat agent.

  The trap is the shape this ticket exists to prevent: a local endpoint speaks
  the OpenAI-compatible protocol, so registering an on-host model under
  provider `openai` looks right and resolves to a cloud CLI. Worse, an
  unregistered provider does not fail - `agent-for-provider` falls back to
  returning the provider name itself, so the caller is handed a launch agent
  that does not exist. On-host models need their own provider key, and an
  unknown provider needs to say so.

  ## First quest (not the whole product)

  Register one Qwen coder build as the first candidate under the local provider
  key with an honest cost class, so cost-sensitive routing can select it. The
  map entry itself must stay reusable for the next downloaded model.

  ## How (direction, not mandate)

  Specifier decisions, open to challenge at approval but not to be
  re-litigated in a coder ticket:

  - **Provider key: `local`**, resolving to the `local-model` agent BL-1052
    registers. One entry, reusable by every future on-host model.
  - **Cost class: the existing `low`.** A model running on this host is free at
    the margin, but `low` is already rank 0, so it is already preferred in
    cheap mode. Introducing a `free` rank below it would re-rank every existing
    cloud candidate - a change this slice does not need and should not smuggle
    in.
  - **An unknown provider reports itself unknown** instead of falling through
    to its own name. That is the second half of the confusing failure above,
    and it is cheap to fix in the same pass.

  Registration makes a model SELECTABLE; it never changes a live seat on its
  own.

  Deliberately NOT in this slice: pulling and serving the model (BL-1082); the
  seat path itself (BL-1052); autonomous seat mutation; pricing or ranking of
  every future local model.

