qa_e2e_procedure: |
  On the live host, after BL-1052 has landed:

  1. Register one Qwen coder build through the Steward CLI and confirm it is
     stored under provider `local`, not `openai`.
  2. Ask ModelFactory to resolve that model's launch agent and confirm it names
     the local-model seat agent - not a cloud CLI.
  3. Confirm the negative: resolve an openai-provider model and confirm it
     still resolves to codex exactly as before.
  4. Resolve a provider that is not registered at all and confirm it reports
     the provider as unknown rather than echoing the provider name back as an
     agent.
  5. Register a second model id under the same provider key and confirm no
     provider->agent edit was needed.
  6. Confirm registration alone changed no live seat.

