source: |
  Found during BL-723 (pilot-tonight quality review), coder viewpoint pass,
  2026-07-30. BL-559's landing commits contain zero code diff — they only
  flip status paused->done (twice: Jul 29, reverted, re-landed Jul 30) plus
  an evidence note. The real fix (9b211456a, "test: realign pipelineBoard
  prefix-property oracle with shortened link HTML") predates this ticket's
  own filing/landing entirely. specs/features/BL-559-*.feature has no
  matching step handlers anywhere in specs/pipeline/steps/; running it via
  specs/pipeline/cli.js would throw "no step handler matched" — the
  acceptance contract was never mechanically gated, only asserted in commit
  message prose.

