description: |
  ## What

  Coder/cleaner/architect all noted BL-694's unexercised step registration as
  a "minor dead-code nit", correctly identifying the symptom but not asking
  what BEHAVIOR that dead step handler was meant to prove was therefore
  untested (BL-752 remaining work).

  ## What to do

  1. **Role prompts (specifier-landed this turn, BL-798):** cleaner, hardener,
     and architect prompts carry "An unreachable step handler is an
     untested-behavior flag until proven otherwise (BL-753)". Do not remove
     unless human_approval amends.
  2. **`/pilot` prompt (coder):** extend `composePilotExpeditorPrompt` with the
     same rule for review hats.
  3. **Land gate (coder):** extend `landPilotedTicket` with
     `checkUnreachableStepHandlers` — for `specs/pipeline/steps/*.js` touched
     by the run paired with the ticket's acceptance feature, every
     `registry.define` / registered regex must match at least one rendered
     step; else refuse `reasonKind: 'unreachable-step-handler'` (inert).
     No-op when no step files touched. Fail open with warning if feature/steps
     cannot be resolved (mirror BL-729/737).
  4. How-to on BL-727 gate doc or sibling BL-753.

  ## Out of scope

  - Adding BL-694's missing Examples row (BL-752)
  - Repo-wide unreachable-handler CI for all step files (explicitly deferred
    by BL-752 approval_context)

qa_e2e_procedure: >
  (1) Grep three role prompts for BL-753 rule. (2) composePilotExpeditorPrompt
  carries the rule. (3) Touched step file with unmatched pattern → land
  refused. (4) All patterns matched → land completes. (5) Refused land inert.

