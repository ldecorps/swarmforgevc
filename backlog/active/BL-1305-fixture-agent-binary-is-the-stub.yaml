id: BL-1305
title: "Acceptance fixtures launch real Claude agents: the fake-binary PATH shim is defeated by the pane shell's own PATH prepend"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
priority: 15
direction: agent-reported
depends_on: []
mutation_cost: medium
slice_size_envelope: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1305-fixture-agent-binary-is-the-stub.feature

source: "Found by the specifier 2026-08-30 while idle-checking swarm liveness: pgrep showed 29 claude processes, of which 21 were launched from /tmp/aps-role-lifecycle-* acceptance fixture roots rather than the swarm."

description: >
  specs/pipeline/steps/roleLifecycleParkUnneededSteps.js intends to stub the
  agent binary: mkFakeBin() writes an `exit 0` script named `claude` into a
  temp dir, and fakeEnv() prepends that dir to PATH. The stub is never
  reached. The fixture config writes the bare command name (`window coder
  claude coder --model x`), and the command is resolved inside a tmux pane
  whose shell sources the user startup file, which prepends the directory
  holding the REAL agent binary ahead of the fixture directory. The bare name
  therefore resolves to the real binary and a real, billable Claude agent
  boots against a throwaway fixture root, told to begin its role loop.

  Measured on this host 2026-08-30: 21 real agent processes from 7 fixture
  roots, alive about 1h50m, about 2.6 GB resident, alongside 22 orphaned
  fixture roots and 13 orphaned fake-bin dirs. The only other claude
  processes on the box were the swarm's own 8.

  Reproduced directly, without the suite: writing a stub named `claude` into
  a dir, prepending that dir to PATH, opening a tmux session on an isolated
  socket and asking the pane to resolve `claude` returns the real binary at
  the directory the shell startup file prepends, not the stub.

  WHY THIS IS NOT ALREADY FIXED. BL-458 and BL-817 both addressed REAPING -
  tearing down what a fixture spawned, including on abnormal exit. Neither
  prevents the real binary from being reached, so even a perfect reaper still
  boots real agents for the duration of every run. This ticket is the
  prevention half, and it is what makes the reaper a second line of defence
  rather than the only one.

  How (direction, not mandate): a shim that depends on PATH precedence cannot
  hold across a shell that re-orders PATH, so stop depending on PATH order.
  Any approach that makes the stub unconditionally the thing that runs is
  acceptable, and that sentence is the whole of the requirement.

  AMENDED 2026-08-31. This paragraph used to offer one for-instance - writing
  the stub's absolute path into the fixture config's command column - and
  scenario 01 and invariant 2 then froze that for-instance into the contract,
  which is the opposite of direction-not-mandate. The route is also not
  buildable: validate_agent (swarmforge/scripts/swarmforge.sh:522) is a closed
  allowlist and refuses a path with exit 1 before anything launches, and
  write_role_launch_script (:1683) dispatches on `case "$agent" in claude)`
  with the literal command hardcoded into the launch body, behind ~26 further
  `$agent` comparison sites driving model resolution, the billing guard and
  provider-key forwarding. Relaxing the allowlist therefore means basename
  dispatch across the launch path EVERY live seat boots through - a
  mutation-heavy change that must not ride a fixture-hygiene slice.

  Fixture-owned ZDOTDIR isolation is the direction now, measured achievable by
  the coder: zsh reads $ZDOTDIR/.zshenv rather than ~/.zshenv when ZDOTDIR is
  set, which removes the re-orderer instead of out-racing it, and it was
  verified to propagate into a tmux pane. It is a direction, not a mandate
  either - anything that makes the stub unconditionally win satisfies this.

  SCOPE. One handler only - and that is the whole of it, not a first
  instalment. The fake-bin-prepended-to-PATH idiom appears in about 20 step
  handlers, so a sibling sweep looked likely; it was surveyed before minting
  and is not needed. The shim can only be defeated where a bare command name
  is resolved inside a tmux pane: a direct spawnSync with fakeEnv runs
  non-interactive, sources no startup file, and the shim holds. Exactly one
  other handler both starts tmux sessions and mentions a claude command,
  bl804BabysitterMonoRouterTopologyAwarenessSteps.js, and it is already safe
  by construction - it runs `exec -a "claude --remote-control fake" sleep
  999`, renaming a sleep process's argv so pgrep sees it, and never resolves
  a real binary at all. So there is no sweep ticket to follow, and this
  slice is not blocked on one.

invariants:
  - "No acceptance step handler ever executes a real agent binary: a fixture's agent command runs the fixture's own stub, whatever the pane shell's startup files do to PATH."

required_wiring:
  - 'specs/pipeline/steps/index.js::bl1305FixtureAgentBinarySteps::the three scenarios must actually run, so the handler this ticket adds has to be registered in the step index rather than merely existing as a file'

qa_e2e: >
  With the swarm stopped, record the pre-run count of real agent processes
  whose command line contains an aps-role-lifecycle fixture path (expect 0
  after the current orphans are dealt with). Run the role-lifecycle
  acceptance scenarios to completion. Re-run the same count: it must still be
  0, both immediately and after the runner exits. Then repeat with the runner
  killed mid-scenario (SIGTERM) - the count must still be 0, since no real
  binary should ever have been launched to survive. Confirm the fixture stub
  did run, so the scenarios are not passing merely because nothing launched.

human_approval: approved
approval_context: >
  Review of the new feature file, plus one live operational decision that is
  not this ticket's to take.

  The scope question I expected to raise here is already settled by evidence
  and needs no ruling: I surveyed the roughly 20 step handlers sharing the
  fake-bin idiom before minting, and only roleLifecycleParkUnneededSteps.js
  can be defeated. The one other pane-starting candidate fakes its argv with
  exec -a and never resolves a real binary. So this is a one-file fix with no
  follow-on sweep, and I am not asking you to choose narrow versus wide.

  What does need your decision: 21 real agent processes from this defect are
  alive on the host right now, from 7 fixture roots, about 1h50m old and
  about 2.6 GB resident. BL-458's notes explicitly asked that orphans of this
  class not be silently hand-killed, so I have left them running and am
  surfacing them instead. They are also the live evidence for this ticket.
  Say whether to kill them now or leave them until the fix lands.

notes: |
  Evidence gathered 2026-08-30 by the specifier, all reproducible:

  - `pgrep -af claude` -> 29 processes, 21 of them with
    `--settings /tmp/aps-role-lifecycle-<id>/.swarmforge/launch/<role>.claude-settings.json`
    and `--append-system-prompt-file /tmp/aps-role-lifecycle-<id>/.swarmforge/prompts/<role>.md`,
    ages 01:45:44 to 01:50:29, RSS 88-147 MB each.
  - 7 distinct fixture roots among those processes; 22 aps-role-lifecycle-*
    roots and 13 aps-role-lifecycle-fakebin-* dirs left on disk.
  - The remaining 8 claude processes are the live swarm's own roles.
  - Direct repro of the shim defeat: a stub named `claude` in a fixture dir,
    that dir prepended to PATH, `tmux -S <isolated.sock> new-session -d`,
    then asking the pane to resolve the command, returns the real binary in
    the directory the shell startup file prepends - not the stub.

  The orphaned processes were left running deliberately: BL-458's own notes
  say not to "fix" this class by a silent manual kill of the day's orphans.
  They are also the live evidence for this ticket.

  Related, both already landed and neither sufficient here:
  BL-458 (acceptance-fixture process leak - reaping, incl. abnormal exit) and
  BL-817 (six step handlers adopt BL-458's shared reaper).

  ## Renumbered BL-1294 -> BL-1305, and the approval on it was not this ticket's [2026-08-30 specifier]

  This ticket was minted as BL-1294 at 07:52 on 2026-08-30 (commit
  1caa7827e7). BL-1294 was already taken: the fixture-closure-resolver defect
  had claimed it an hour earlier at 06:54 (commit 80c4a33713). Two different
  tickets carried one id for the rest of the day. The earlier mint keeps
  BL-1294 - it also owns `backlog/topics/BL-1294.json` and is the BL-1294 that
  BL-1303 and the coder-red triage evidence refer to - so this one moves to
  BL-1305, id and feature file together.

  `human_approval` is reset to `pending`, deliberately. It read `approved`,
  set by the sweep in commit 2830aec113 ("Approve BL-1282, BL-1283, BL-1293,
  BL-1294"), which touched THIS file. But the Telegram topic the human was
  shown for BL-1294 renders the closure-resolver ticket's title and its
  approval context, so the tap behind that commit was cast against the other
  ticket. An approval is not transferable between two tickets that merely
  shared an id, so this ticket has none and asks again. It fails closed: the
  cost is one more tap, where keeping it would have shipped a ticket on an
  approval nobody gave for it.

  Its `approval_context` still stands unchanged and still needs an answer -
  including the live question about the orphaned agent processes, which was
  never actually put to the human.

  ## Spec-gap adjudicated: mechanism retired, outcome unchanged [2026-08-31 specifier]

  The coder raised an Article 4.4 spec gap by `note` (evidence
  backlog/evidence/BL-1305-coder-spec-gap-20260831.md at 745fffc16f) rather
  than bouncing a parcel or quietly redefining the scenario. The report is
  accurate: I re-ran its two load-bearing claims against live code before
  ruling. The defect is MINE - the description said "direction, not mandate"
  and then scenario 01 and invariant 2 mandated one mechanism anyway.

  Ruled: option (a), amend. What changed:

  - Invariant 2 RETIRED. "Reaches its stub by a path the shell cannot
    re-order" is a mechanism mandate wearing an invariant's clothes; the
    property it was reaching for is already invariant 1 in full ("whatever the
    pane shell's startup files do to PATH"). One invariant is the honest count
    here, not a gap to backfill.
  - Scenario 01 rewritten to name NO mechanism - it now asserts the direct
    repro (the agent command resolves to the fixture's stub inside a pane
    shell). Deliberately not re-frozen onto ZDOTDIR: swapping one mechanism
    mandate for another repeats the mistake being fixed.
  - Scenario 02's Given tightened to the actual defect shape - the prepend
    comes from the PANE SHELL'S STARTUP FILE. As written it said only
    "prepended to PATH", which is ambiguous: read as a prepend the fixture
    itself makes ahead of the stub dir, nothing short of the refused
    path-naming route could satisfy it, and the coder would be blocked a
    second time on the same ambiguity.
  - Feature narrative re-tensed; it stated the retired mandate as a present
    requirement.

  Option (b) - widen scope so the agent column may name a binary by path -
  was declined, and NOT split into a follow-on ticket. It is a legitimate
  capability but nobody has asked for it, so minting it now would fail
  INVEST's Valuable letter; recorded here so it is not re-derived from
  scratch. The harm this ticket exists to stop is real agents booting, and
  (a) stops it completely at low risk.

  The coder also caught a false-green that (b) would have produced: with a
  path in the command column, parse_config exits 1, NOTHING launches, and
  scenarios 02 and 03 would then pass vacuously - which this ticket's own
  qa_e2e explicitly forbids ("Confirm the fixture stub did run"). That is the
  strongest argument against (b) and it came from measurement, not reading.

  Scope, envelope and deliverable are unchanged, so `human_approval:
  approved` STANDS and is not reset - the amendment strictly REMOVES
  prescription rather than adding scope, and the approved outcome (no real
  agent binary ever executes from a fixture) is untouched. Flagging it here
  rather than re-asking, because a re-ask would stall a severity:high defect
  that boots billable agents, over a change that narrows what the coder is
  told to do.

  The live-orphan question in `approval_context` is MOOT and needs no answer:
  the coder measured 0 real agents from aps-role-lifecycle fixture roots and
  0 leftover fixture/fakebin dirs on this host. Nothing was hand-killed - they
  are simply gone. The approval_context text is left as the human first saw
  it rather than rewritten under them.

  Note for whoever builds this: the feature file is live on `main` as
  `.feature` with no registered handler, so a fresh acceptance generation
  picks up three scenarios with nothing to run them. That exposure is BL-1303's
  subject and BL-1303 is already queued to the coder - it is not a second
  defect to raise, and it closes here as soon as
  bl1305FixtureAgentBinarySteps lands registered in the SAME commit (BL-233).

