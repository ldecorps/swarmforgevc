source: |
  Architect note to specifier, 2026-07-31: "Dep-gate: unticketed acyclic
  cycle in telegramCursorOperator* - please ticket". First recorded during
  the BL-723 pilot review (docs/how-to/BL-723-pilot-tonight-quality-review.md,
  "Hard gate" section), where a full-repo scan surfaced it but it was
  correctly ruled out of that parcel's scope. Introduced by the Cursor
  Remote landing e54d2129a ("Land Let's Talk float surfaces and Android
  overlay companion", BL-700..704).

notes: |
  Reproduced 2026-07-31 from a clean `main`:

      $ node extension/out/tools/dependency-gate.js
      Dependency-rule gate FAILED:
        src/tools/telegram-front-desk-bot.ts -> src/tools/telegramCursorOperatorExec.ts violates "acyclic"
        src/tools/telegram-front-desk-bot.ts -> src/tools/telegramCursorOperatorLiveness.ts violates "acyclic"
        src/tools/telegramCursorOperatorExec.ts -> src/tools/telegramCursorOperatorLiveness.ts violates "acyclic"

  Severity `medium`, deliberately, not `high`: nothing misbehaves at
  runtime today. The bot's own edge into the operator modules is a lazy
  `await import(...)`, so there is no circular module-init hazard — the
  cost is a genuine module-boundary violation plus a gate that now fails
  for anyone who touches these files. It is contained, not a live fault
  and not a broken health signal, so it does not buy the Article 3.2.4
  expedite lane.

  Coordinator, one sequencing note (not a `depends_on`): BL-725 already
  names `telegramCursorOperatorExec.ts` in its scope. Whichever of the two
  runs second inherits the other's tree, and BL-725 will trip the
  architect's hard gate on an edge it did not introduce unless this lands
  first. Landing this one first is the cheaper order; they are not
  orthogonal, so do not run them concurrently.

  2026-08-17 specifier — SECOND independent re-observation, still live.
  The architect tripped over these same three edges again during the BL-911
  repass and raised a `note` asking for them to be ticketed, stating "No
  ticket currently tracks this cycle (`grep -rl telegramCursorOperator
  backlog/` -> none)". That grep result was wrong — THIS ticket has tracked
  it since 2026-07-31 — so no new ticket was minted. Evidence:
  `backlog/evidence/BL-911-architect-repass-20260817.md`.

  Re-verified from `main` rather than trusting either report: the gate still
  fails with exactly the three edges quoted above, and the back-edges are
  `telegramCursorOperatorLiveness.ts:7` importing `isPipelineEmpty` and
  `controlDrainTimeoutMs`, plus `telegramCursorOperatorExec.ts:43` importing
  `isPipelineEmpty`, both from `telegram-front-desk-bot.ts` (defined there at
  :1595 and :1659). The bot's own edges remain lazy `await import(...)` at
  :2167 and :2172, so the no-runtime-hazard reasoning above still holds
  unchanged.

  `priority:` tightened 84 -> 60 on that recurrence. Severity stays `medium`
  — nothing misbehaves at runtime and this still does not buy the Article
  3.2.4 expedite lane. What changed is cost of delay, not impact: the cycle
  has now derailed attention in two separate architect passes, and each
  future reviewer who touches these files pays the same toll of re-deriving
  that a repo-wide gate failure is not theirs. That is recurring friction
  with a known, contained fix, which is what the priority number is for.

  2026-08-19 specifier — THIRD independent re-observation, still live. The
  architect sent a priority-00 `note` ("acyclic violation:
  telegram-front-desk<->operatorExec/Liveness cycle, unticketed"). As on
  2026-08-17, the "unticketed" claim is wrong — and this time it was checked
  rather than assumed: `grep -rl telegramCursorOperator backlog/` from the
  master checkout returns THIS file, and the ticket is also present in the
  architect's own worktree at
  `.worktrees/architect/backlog/paused/BL-759-...yaml`. So the ticket was
  readable from where the report was made; the grep was simply not run. No
  new ticket minted.

  Re-verified from `main` (local `main` measured 24 ahead / 0 behind
  `origin/main`, so it is the fresher ref): the gate still fails with exactly
  the same three edges quoted above, unchanged.

  Line numbers refreshed — the ones quoted earlier in these notes and in the
  `description:` have drifted as the bot file grew, which costs each reviewer
  a re-search. As of this observation:
  `telegram-front-desk-bot.ts` defines `controlDrainTimeoutMs` at :1615 and
  `isPipelineEmpty` at :1679, and its two lazy `await import(...)` edges are
  at :2187 and :2192. The back-edges remain
  `telegramCursorOperatorExec.ts:43` and
  `telegramCursorOperatorLiveness.ts:7`. The no-runtime-hazard reasoning is
  unchanged: the bot's own edges are still lazy.

  RULED OUT, deliberately — do not propose it a fourth time: adding a
  known-failure baseline / allowlist to the dependency gate so the three
  edges stop showing as red. It is the obvious reflex after a third
  re-derivation, there is no such mechanism in
  `extension/src/tools/dependency-gate.ts` today, and no ticket asks for one.
  It is the wrong fix here. An allowlist converts a contained, cheap,
  `mutation_cost: low` structural move into permanent suppression, and
  suppression is precisely how a normalized red survives — the failure mode
  the boot-budget gate rule (BL-859) already calls out after it happened
  twice there. The cycle is fixable in one sitting; make the red go away by
  removing the cycle, not by teaching the gate to ignore it.

  `priority:` tightened 60 -> 40 on this recurrence. Severity still stays
  `medium`: nothing misbehaves at runtime, so this does not buy the Article
  3.2.4 expedite lane. Only cost of delay moved, and it has now moved three
  times — three architect passes have each spent attention re-deriving that a
  repo-wide gate failure is not theirs.

  Feature-file status, so the next holder is not surprised:
  `specs/features/BL-759-cursor-operator-front-desk-cycle.feature` is a live
  `.feature` (not a `.draft`) whose four scenarios have no step handlers yet,
  and whose scenario 01 asserts the gate passes — which is false today, by
  design. This is NOT a BL-233 breakage: acceptance generation here is
  on-demand, not a repo-wide glob (4 files in `specs/pipeline/generated/`
  against 595 feature files), so nothing generates or throws on it while the
  ticket is unbuilt. The handlers land with the implementation, and scenario
  01 goes green exactly when the cycle is broken.

  2026-08-22 specifier — FOURTH independent re-observation, still live. The
  architect sent a `note` to specifier+coordinator: "Acyclic gate fails:
  telegram-front-desk-bot<->CursorOperatorExec/Liveness cycle". Unlike the
  2026-08-17 and 2026-08-19 reports this one made no "unticketed" claim, so
  no duplicate was proposed and none was minted; it reads as a plain
  re-report of the same three edges.

  Re-verified from `main` rather than from the report (local `main` measured
  26 ahead / 0 behind `origin/main`, so it is the fresher ref). The full-repo
  scan `node extension/out/tools/dependency-gate.js` still fails with exactly
  the three edges quoted above and NOTHING else — this cluster is the whole
  of the repository's `acyclic` debt, which is what keeps the fix one sitting.

  Line numbers refreshed again — they drift on every observation because the
  bot file keeps growing (3101 -> 3346 lines since 2026-08-19), so the
  `description:` above and these notes now read: `controlDrainTimeoutMs` at
  :1745, `isPipelineEmpty` at :1809, `resolveLiveRoles` at :2683, and the two
  lazy `await import(...)` edges at :2332 and :2337. Back-edges unchanged at
  `telegramCursorOperatorExec.ts:43` and `telegramCursorOperatorLiveness.ts:7`,
  and `telegramCursorOperatorExec.ts:25` still closes the third edge. The
  no-runtime-hazard reasoning is unchanged: the bot's own edges are still lazy.
  Confirmed too that `telegramControlCore.ts` still has ZERO imports of its
  own, so it remains a true leaf and a viable landing site for the pure
  `controlDrainTimeoutMs` — the disk-reading pair's home stays the coder's and
  architect's call, as the `description:` says.

  `priority:` tightened 40 -> 30 on this recurrence. Severity still stays
  `medium` — nothing misbehaves at runtime, so this still does not buy the
  Article 3.2.4 expedite lane, and that is the point below.

  COORDINATOR — the priority number is no longer the thing holding this back,
  so please do not read the tightening as the whole ask. Four tightenings in
  three weeks (84 -> 60 -> 40 -> 30) have not moved it, because under a
  throttled `active_backlog_max_depth` every `critical`/`high` defect is
  promoted ahead of every non-expedited ticket regardless of its `priority:`
  value (Article 3.2.4), and there is a standing queue of high-severity
  defects. A correctly-triaged `medium` cannot win that race by getting
  smaller numbers; it is structurally starved. Escalating its `severity:` to
  buy the lane would be a lie about impact and is refused here. If this is to
  land, it needs a deliberate scheduling decision — a slot chosen for it — not
  another priority tick. Sequencing constraint from 2026-07-31 still stands:
  BL-725 also names `telegramCursorOperatorExec.ts`, the two are not
  orthogonal, and this one is the cheaper of the two to run first.

description: |
  ## What

  Three modules form an import cycle, and the architect's REQUIRED HARD
  GATE (`node extension/out/tools/dependency-gate.js`, ruleset
  `extension/.dependency-cruiser.cjs`) reports it as three forbidden
  `acyclic` edges on a full-repo scan.

  The cycle:

  - `telegram-front-desk-bot.ts:2332,2337` lazily loads
    `telegramCursorOperatorExec` and `telegramCursorOperatorLiveness`
    (`await import(...)`) to dispatch an operator verb.
  - `telegramCursorOperatorExec.ts:43` statically imports
    `isPipelineEmpty` **from** `./telegram-front-desk-bot`.
  - `telegramCursorOperatorLiveness.ts:7` statically imports
    `isPipelineEmpty, controlDrainTimeoutMs` **from**
    `./telegram-front-desk-bot`.
  - `telegramCursorOperatorExec.ts:25` also imports
    `telegramCursorOperatorLiveness`, closing the third edge.

  Break the cycle so a whole-repository gate scan passes, without changing
  what any of the moved helpers decide.

  ## Why it matters

  The gate is per-changed-file and architect-run, so this is latent rather
  than breaking today — but it is armed. The next parcel that touches any
  of these three files fails the architect's hard gate on an edge it did
  not introduce, and the architect's own prompt says to bounce on any
  reported forbidden edge. That is a wasted round-trip charged to an
  innocent ticket. `telegram-front-desk-bot.ts` is 3346 lines and one of
  the hottest files in the repo, so the wait is short.

  Beyond the gate, the coupling is real in its own right: the operator
  verb executor cannot be loaded without dragging in the entire front-desk
  bot module graph, purely to reach two drain helpers.

  ## Constraint the fix has to reckon with — the extraction is transitive

  Do not assume this is a two-function move. `isPipelineEmpty`
  (`telegram-front-desk-bot.ts:1809`) calls `resolveLiveRoles`, which is
  **also defined in `telegram-front-desk-bot.ts`** (line 2683). Extracting
  only the leaf leaves the same back-edge in place under a new name.
  `notify-dead-letters.ts:24` imports `resolveLiveRoles` from the bot
  module too — that direction is one-way and forms no cycle, but it is a
  consumer whose resolution must not change.

  Note also that the existing pure-decision module `telegramControlCore.ts`
  documents itself as having "no I/O at all". `controlDrainTimeoutMs` is a
  pure env parse and would fit; `isPipelineEmpty` and `resolveLiveRoles`
  read disk and would not. Choosing where the disk-reading pair lands is
  the coder's and architect's call — this ticket does not prescribe it,
  only that the cycle goes and the ruleset's other rules stay satisfied.

  ## Scope

  - `extension/src/tools/telegram-front-desk-bot.ts`
  - `extension/src/tools/telegramCursorOperatorExec.ts`
  - `extension/src/tools/telegramCursorOperatorLiveness.ts`
  - whichever module the shared helpers land in (new or existing)
  - consumers whose imports move with them:
    `extension/src/tools/notify-dead-letters.ts`,
    `extension/test/telegramFrontDeskBotCli.test.js`

  Explicitly NOT in scope: any change to what a drain-stop, an operator
  verb, or the liveness wait actually does. This is a structural move.
  A diff that alters drain semantics is a defect, not a bonus.

  ## Acceptance signal

  `node extension/out/tools/dependency-gate.js` (no arguments — the
  full-repo scan) exits zero and reports no forbidden edge, and the
  existing unit and acceptance suites stay green with no test deleted or
  weakened to get there.

  ## QA end-to-end procedure

  1. From a clean checkout of the QA-approved commit, `npm run compile`
     (`extension/out/` is gitignored; do not trust a stale build).
  2. Run `node extension/out/tools/dependency-gate.js` with no arguments.
     Expect exit 0 and no `FAILED` block — in particular none of the three
     `acyclic` edges quoted in `notes:` above.
  3. Run the same gate against each of the three named source files
     individually, as the architect would on a real parcel; each must pass.
  4. Run the full unit suite and the acceptance runner. Confirm the four
     BL-759 scenarios execute (not skipped) and pass, and that
     `telegramFrontDeskBotCli.test.js`'s existing `controlDrainTimeoutMs`
     and `isPipelineEmpty` tests still run and still pass.
  5. Confirm by reading the diff that no drain, verb-dispatch or liveness
     decision changed — only where symbols live and who imports them.
