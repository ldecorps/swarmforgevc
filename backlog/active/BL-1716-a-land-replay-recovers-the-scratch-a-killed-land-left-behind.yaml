human_approval: approved
approval_context: >
  A new feature file is authored here, so it would ordinarily need a tap;
  it is minted approved under the 2026-09-17 operator hotfix (severity
  defect, no choice posed, no ruling_options). FIRM: a scratch worktree
  or branch is cleared only when the run that made it is provably dead; a
  scratch whose owner is alive, or cannot be established, is refused with
  its owner named and left exactly as it was (BL-1385/BL-1390: a blind
  sweep destroys sibling runs). FIRM: every replay refusal to create its
  worktree carries git's own error text. FIRM: nothing else about the
  replay's content, its guards or its cleanup on the paths it already
  reaches changes.

invariants:
  - "A land replay never fails because of a scratch worktree or branch left by a dead earlier run, and never removes one whose owning run is alive or unknown."

description: |
  ## What is wrong

  `bash swarmforge/scripts/test/test_bl1366_land_is_one_command.sh`, run
  by the specifier on main at 9d6fa31f6d (2026-09-24, load 3.4): case
  5's second half fails - (CORRECTED 2026-09-24: case 1 fails too, "origin/main
  is <x>, expected <approved sha>"; the specifier read a truncated tail at
  mint - see notes)
  `FAIL: the next land could not proceed: BL-9366-fixture-task: entangled
  tip - ... specifier adjudication needed.` /
  `land-step replay: could not create worktree
  /tmp/bl1366-land-*/five/.git/land-replay-worktrees/BL-9366-3aaf388713
  off origin/main`. coder@2 reported it (note 000065) while building
  BL-1713.

  Case 5 starts `land_main_publish.sh --land`, sends SIGTERM after 2 s,
  checks the publish lock is gone (it is - the shell trap holds), then
  lands the same commit again. `replay!` (land_step_lib.bb) builds in
  `<git-common-dir>/land-replay-worktrees/<id>-<sha10>` on branch
  `land-replay/<id>-<sha10>`, both named by ticket and commit only, and
  its `cleanup!`/`drop-branch!` run on every path the Babashka process
  reaches - but a SIGTERM (or SIGKILL, a pane kill, a respawn) ends the
  process inside the replay and reaches none of them. The second land's
  `worktree add -b` then fails on the leftover branch or path; its own
  failure path does clean up, which is why an attempt after it succeeds,
  but that attempt has already escalated with a reason that names an
  adjudication and omits git's stderr.

  Likely red since BL-1678 (4823eafa41, 2026-09-21): a clean land now
  builds a replay too, so the 2 s kill lands inside `replay!`. (QA's
  hand removal of `.git/land-replay-worktrees/test-BL-1691` this morning
  does not follow `replay!`'s naming and is not this mechanism.)

  ## What is wanted
  - Scenario 01: a scratch worktree and branch recorded to a run that is
    no longer alive are cleared, and the replay builds as usual.
  - Scenario 02: one recorded to a live run is refused, the owner named,
    worktree and branch untouched.
  - Scenario 03: a create failure's reason carries git's own error text.
  - `test_bl1366_land_is_one_command.sh` passes on the parcel commit;
    its register row leaves with this land (BL-1631).

  ## How (direction, not mandate)
  - Record the owning run in the scratch at creation (pid plus start
    time, so a reused pid is not mistaken for the owner) and decide
    dead/alive from it; a scratch with no record (made before this fix)
    is dead only past an age bound. BL-1385/BL-1390's posture: reap only
    what no live run owns.
  - A shutdown hook that cleans up on SIGTERM is welcome but cannot be
    the fix - SIGKILL and a host restart reach no hook.
  - The publish lock already serialises `land_main_publish.sh`; QA also
    runs `land_step_cli.bb` directly, so the owner record, not the lock,
    is what proves a scratch is dead.

  ## Scope
  - `swarmforge/scripts/land_step_lib.bb` (`replay!` only).
  - `swarmforge/scripts/test/test_bl1366_land_is_one_command.sh`: two
    assertions BL-1678 made stale (added 2026-09-24, coder spec-gap note
    002121). Case 1 asserts the land's published commit, not the cited
    SHA: origin/main's new tip is the sha the land printed as
    LAND_PUBLISHED, its one parent is the previous origin/main, and its
    tree carries the approved commit's fixture paths byte-identical.
    Case 5's second land lands a FRESH approved commit, not the same SHA
    again - the case proves the killed land released the lock, and a
    repeat land of an already-landed commit correctly has nothing to land.
  - `specs/features/BL-1716-...feature` + the pinned handler.
  - Docs: the land-step reference/how-to's replay section.

  ## Not in scope
  - `land-plan` and `land_step_cli.bb` (BL-1713, landed). A repeat land of
    an already-landed ticket and commit escalating "nothing to commit" is
    not a defect: there is nothing to land, and QA should hear so.
  - Any other case of test_bl1366.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1716-a-land-replay-recovers-the-scratch-a-killed-land-left-behind.feature`:
     all ok (3 of 3).
  2. `bash swarmforge/scripts/test/test_bl1366_land_is_one_command.sh`:
     no FAIL line; case 1's published-commit checks and case 5's "and a
     subsequent land succeeds" (a fresh commit) pass.
  3. The BL-1678, BL-1241 and BL-1713 features: all ok (the replay's
     other paths unchanged).
  4. `git diff main...HEAD --name-only` names only the Scope files, the
     feature, the handler, docs and evidence.
  5. After landing: the land prints REGISTER_ROW_RETIRED for the
     test_bl1366 row, and `bb swarmforge/scripts/standing_red_register_cli.bb .`
     reports `"unowned":[]`.

