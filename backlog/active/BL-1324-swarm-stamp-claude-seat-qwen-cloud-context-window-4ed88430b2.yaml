  - The cross-pack `SWARMFORGE_USE_QWEN=1` side-effect note and the
    1M-window platform-claim caveat (approval_context items 3-4 above).
  - Two feature scenarios: the global-flag cross-pack behaviour, and an
    explicit "the review never certifies the hotfix by itself" scenario —
    both added to this ticket's acceptance feature as scenarios 07-08.

