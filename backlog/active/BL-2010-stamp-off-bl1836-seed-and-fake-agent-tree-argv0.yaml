description: |
  ## Status: hotfix e0cfdfc95a landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong, and what the hotfix changed

  - `extension/test/bl1836CeremonyNeverWritesABriefing.property.test.js`:
    400 unseeded draws must land before the deadline at least 5 times.
    Over 300 seeds the mean is 11.2, the lowest 4, and 2 seeds (0.7%) fall
    below 5; QA's gather drew 4. Now `{ numRuns: 400, seed: 1 }` (11; the
    other floors 207 and 40), measured with a seedable scratch copy of the
    test running the real compiled ceremony.
  - `extension/test/helpers/fakeAgentTree.js` `waitForChildPid`: it
    returned on ANY child of the shell; between fork and exec that child
    still carries the parent's args (`node ...`), so
    `listProcessTree names a PATH-spawned claude child by argv0` could read
    `node`. It now waits for a child whose first args= token basenames to
    `claude` (an `argv0` parameter defaulting to it).

  ## What the coder does (all of it)

  1. Run `cd extension && npx vitest run test/resourceSamplerActivation.test.js test/sampleResourcesCli.test.js`
     and the bl1836 property file under `vitest.properties.config.mjs`,
     once each (the ticket is about these files alone), outputs saved under
     tmp/.
  2. Read `git show e0cfdfc95a` against the section above and the
     invariant.
  3. Write backlog/evidence/BL-2010-coder-<date>.md: the results and one
     line per change saying whether it matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

