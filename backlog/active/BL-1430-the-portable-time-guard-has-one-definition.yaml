description: |
  ## What is wrong

  `extension/test/bl874PortableTimeInvariants.property.test.js` fails on
  main (run alone under `vitest.properties.config.mjs` on 2026-09-05, 23 s):

      × findPortableTimeViolation is defined in exactly one file repo-wide
        (the shared guard module, never a reimplementation)
      AssertionError: Expected values to be strictly deep-equal

  It was allowlisted on 2026-08-27 as "tracked under BL-1175 pending fix"
  and no open ticket named it. `git grep "function findPortableTimeViolation"`
  over `extension/src` and `specs/pipeline` finds exactly one definition,
  `specs/pipeline/steps/lib/portableTimeGuard.js:25`. The cause, confirmed
  2026-09-05: the property walks from the repository root and its
  `EXCLUDED_DIR_NAMES` (line 75: node_modules, .git, out, coverage,
  .stryker-tmp, vendor) does not exclude `.worktrees`, so it counts the copy
  of the same file in every linked role worktree - eight on this host that
  day. The definition is single; the walk is not scoped to the source tree.

  ## What changes

  - The property's walk excludes `.worktrees` (and any other linked
    checkout under the root), the same scoping the sibling repo-wide
    properties need; check them for the same hole in the same parcel and
    list what was found in the evidence. The assertion itself is not
    weakened (invariant 1): one definition, counted over source trees.
  - The property passes alone and inside `npm run test:properties`; its row
    leaves `backlog/standing-reds.tsv` in the same commit (BL-1428's rule).

  ## How (direction, not mandate)

  - Run the file alone first and read the `actual` array; that names every
    path counted.
  - Scenario 01's count is a grep over `extension/src` and `specs/pipeline`
    for the definition, deliberately the same scope a reader would check by
    hand; scenario 02 runs the property file alone.

  ## Out of scope

  - Any other allowlisted red (their own tickets).
  - Changing BL-874's guard behaviour.

qa_e2e_procedure: |
  1. The BL-1430 feature passes (two scenarios).
  2. `cd extension && npx vitest run --config vitest.properties.config.mjs
     test/bl874PortableTimeInvariants.property.test.js` passes.
  3. `backlog/standing-reds.tsv` no longer carries the bl874 row, and the
     allowlist row for it is gone.

