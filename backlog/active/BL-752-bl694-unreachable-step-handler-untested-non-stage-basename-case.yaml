description: |
  ## What

  Add the missing `Examples:` row to Scenario Outline 04 in
  `specs/features/BL-694-residual-word-allowlist-survives-stage-moves.feature`
  so the already-written step handler for "a non-stage path under the
  backlog" (e.g. `backlog/topics/`) actually runs, confirming a basename
  match there does NOT inherit the stage-move exemption.

  ## Acceptance

  - The new Examples row exercises the registered-but-dead step handler.
  - `node specs/pipeline/cli.js
    specs/features/BL-694-residual-word-allowlist-survives-stage-moves.feature`
    passes with the new row included.

qa_e2e_procedure: |
  From the repo root:

  1. Baseline the dead handler on the PRE-fix tree: confirm
     bl694ResidualAllowlistSteps.js registers the "non-stage path under the
     backlog" pattern and that BL-694's Outline 04 Examples table has only
     "outside the backlog" and "elsewhere in the tree". The handler must be
     unmatched by every rendered step.
  2. Run `node specs/pipeline/cli.js
     specs/features/BL-694-residual-word-allowlist-survives-stage-moves.feature`
     on the parcel. It must pass with the new row included, and the run must
     execute the previously-dead handler at least once.
  3. Run the BL-752 acceptance feature. Scenario 01 must report a file at a
     backlog/topics path sharing a grandfathered basename as an unexpected
     match.
  4. Prove non-vacuity: in a scratch checkout, relax BACKLOG_STAGE_RE in
     onboarderResidualAllowlist.js to ^backlog/ and re-run. Scenario 01 must
     go RED. Restore.
  5. Prove the fix did not over-tighten: scenario 02 must still excuse the
     grandfathered file at its own stage path, and BL-694's existing
     scenarios 01-03 and 05 must stay green.
  6. Scenario 03 must fail if a handler is added to
     bl694ResidualAllowlistSteps.js with no matching rendered step - add a
     throwaway one, confirm red, remove it.

