  property makes today stays, the three shapes keep their reach floor, and
  the real land_step_cli.bb still runs for at least one draw per run.

invariants: []

description: |
  ## What is wrong

  QA note 003170, evidence 211e8b6ae4 (BL-1727's pass, full property lane
  through qa-gather, load 5.56):
  `FAIL test/bl1670LandStrayConflictSupersededInvariant.property.test.js >
  BL-1670/BL-654 invariant ... Error: Test timed out in 20000ms.` No
  register row and no open ticket, so it is unowned and holds BL-1727.

  Measured at mint on main: 5.1 s alone at load 3.2, passed. The test
  loops 3 shapes x `runsPerCell(9, 3)` draws, and every draw calls a
  `SHAPE_BUILDERS` fixture builder (a fresh repository with commits) and
  `runCli` (a full `bb land_step_cli.bb` process). It passes no timeout,
  so it runs under `vitest.properties.config.mjs`'s `testTimeout: 20000`.
  With lane parallelism, 4x its solo time is enough to kill it.

  ## Census (land-step property files that run the real CLI per draw)
  `grep -l 'land_step_cli.bb' extension/test/*.property.test.js`, 5 files:
  - bl1650 (no timeout declared) - owned by BL-1725 (active), same fix
    shape.
  - bl1670 (no timeout declared) - this ticket.
  - bl1308 (`timeout: 300_000`), bl1678 (`timeout: 120000`), bl1713
    (`SUBPROCESS_HEAVY_TIMEOUT_MS`, 240 s): not red. Run together at mint
    (three forks, load 5-10), their slowest single tests took 25 s, 35 s
    and 16 s. That is lane cost, not a red, so nothing is minted for them.

  ## Consolidated 2026-09-25: bl1108 and bl1565 (QA note 003185)

  QA's property run on BL-1729's parcel a724ae759e (load 11.70, evidence
  433082e8ee) timed out two more invariants at 20000 ms:
  - `bl1108CursorSeatReadiness.property.test.js` > invariant 1 ("every
    configured agent token uses its own process marker"). Alone on main
    at load ~4: 6.2 s (invariant 2: 3.6 s). It spawns `bb` from inside
    the property.
  - `bl1565CoordinatorNeverReceivesGitHandoffInvariants.property.test.js` >
    the reverse-hop invariant ("reverse-hop copies never address the
    coordinator"). Alone: 6.3 s.
  Neither declares a timeout. Both have the bl1670 shape, a third of the
  ceiling alone, so this ticket owns all three rather than minting one
  per file (BL-680 N:1; it was paused and unclaimed).

  Wider census, NOT this ticket's scope: 187 property files spawn a
  subprocess and 112 of them declare no timeout (`for f in
  extension/test/*.property.test.js` with a spawn call and none of
  `SUBPROCESS_HEAVY_TIMEOUT_MS|timeout: N|}, N)`). Most spawn one fast
  process and are fine. A lane-wide fix (a per-test duration census
  against the ceiling from the lane's JSON report) is a separate process
  question if more of them surface.

  ## What is wanted
  - Each of the three invariants completes inside the lane under
    contention (the direction below applies to each file). How
    (direction, not mandate): either BL-1725's shape (one fixture per
    shape reset between draws, draws decided in one bb process through
    the lib the CLI wraps, one real CLI run kept as the wiring case), or
    declaring `SUBPROCESS_HEAVY_TIMEOUT_MS` as bl1713 does. The first
    also makes the lane faster; say in the evidence which was chosen and
    why.
  - The assertions, the three shapes and `assertReachFloor` stay as they
    are.

  ## Scope
  - `extension/test/bl1670LandStrayConflictSupersededInvariant.property.test.js`,
    `extension/test/bl1108CursorSeatReadiness.property.test.js`,
    `extension/test/bl1565CoordinatorNeverReceivesGitHandoffInvariants.property.test.js`
    (and a helper beside them if one is needed).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `cd extension && npx vitest run --config vitest.properties.config.mjs test/bl1670LandStrayConflictSupersededInvariant.property.test.js test/bl1108CursorSeatReadiness.property.test.js test/bl1565CoordinatorNeverReceivesGitHandoffInvariants.property.test.js`:
     green; record each file's duration and the 1-minute load.
  2. `node specs/pipeline/cli.js specs/features/BL-1650-the-land-step-lands-a-pure-evidence-closed-owner-stray-itself.feature`:
     all ok (8 of 8).
  3. `git diff main...HEAD --name-only` names only the test file, a helper
     if any, and evidence.
  4. After landing: REGISTER_ROW_RETIRED for this ticket's three property
     rows (bl1670, bl1108, bl1565).

