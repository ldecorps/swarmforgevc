  day one. Amendment, to be applied INSIDE the parcel by the coder on
  QA's bounce (the feature carries the hardener's mutation stamp, so
  main-side feature edits are not made - BL-1385):
  - check-suite-file-budget.ts: NEW_POLE_REFUSAL_FRACTION = 1.5 beside
