    unowned-row | new-pole; only new-pole and unowned-row fail the exit
    code; the recorder row gains watch_files (count) beside
    new_offenders.
  - Feature scenario 01 rows become:
      | one file measures 9000 ms  | names that file with an open owner            | ok, the file reported as a registered pole |
      | one file measures 9000 ms  | is empty                                      | watch naming the file and 9000 ms, exit 0  |
      | one file measures 11000 ms | is empty                                      | new-pole naming the file and 11000 ms      |
      | every file measures under 5000 ms | names one of them with an open owner   | stale-row reported naming that file, exit 0 |
      | one file measures 9000 ms  | names that file with a closed or absent owner | unowned-row naming the file and its owner  |
      | every file measures under 7000 ms | is empty                               | ok                                         |
    and scenario 02 gains rows | 0 | watch | pass | 0 | and
    | 0 | stale-row | pass | 0 |; scenario 03 is unchanged (the nine
    rows stay; a stale row is harmless and leaves with its slice D cut).
  - Invariant 1 is re-worded above; invariant 2 unchanged. No register
    row is added for emitLifecycleSnapshotCli: it is a watch file, and
    BL-791's slice D inventory gains it.
  Bounce routing: QA bounces to the coder (Article 4.3, the guard is the
  coder's domain); the spec defect is the specifier's and no bounce is
