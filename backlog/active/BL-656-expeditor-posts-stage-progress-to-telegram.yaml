approval_context: >
  Operator, 2026-07-26 ~01:30, watching the BL-654 expedition from a terminal
  relay and asking whether the Expeditor can have a /remote-control. It cannot
  — stages are `claude -p` print-mode runs with no session to attach, and the
  timeout/group-kill robustness DEPENDS on that mode. The right cut: post the
  ride's milestones to Telegram deterministically. "ok oui fais ça".

invariants:
  - "Announcer delivery failure never changes expedite gate outcomes, verdicts, or restart behavior — the log file remains the source of truth."
  - "Each expedite milestone posts one new Operator-topic message; milestones are never folded into a single edited roster message."

required_wiring:
  - 'swarmforge/scripts/expedite_cli.bb::EXPEDITE_ANNOUNCE_CMD::announce seam invokes announcer per milestone without failing the run'
  - 'extension/src/tools/notify-dead-letters.ts::sendOperatorTopicMessage::default announcer reuses standing Operator send machinery'
  - 'specs/pipeline/steps/index.js::bl656ExpeditorPostsStageProgressSteps::acceptance handler registered so the runner executes every scenario'

description: |
  ## Why not remote-control (settled, do not reopen)

  Each Expeditor stage is `claude -p` under `setsid`, output to files, killed as a
  process group on timeout. Remote-control needs a live interactive session; observability
  comes from EMISSION, not attachment.

  ## Shape

  1. An `--announce` seam in `expedite_cli.bb` (`EXPEDITE_ANNOUNCE_CMD` overridable for
     tests): each MILESTONE — initiation verdict (incl. REFUSE + survivors), park, stage
     entered, stage verdict, final verdict, restart result — is passed to the announcer.
  2. Default announcer posts one compact line per milestone to the Operator topic (BL-346).
     One message per milestone, NOT an edited roster (BL-649 lesson).
  3. Announcer failure NEVER fails the expedition — fire-and-forget with logged warning.
  4. Message shape mirrors the log line + BL-id, e.g.:
     "🚑 BL-654 architect: SEND BACK #1 — invariant 3 fabricates zero".

qa_e2e_procedure: >
  (1) Run expedite on fixture ticket with EXPEDITE_ANNOUNCE_CMD capturing lines —
  assert initiation, each stage entry, each verdict, final verdict, restart all
  announced. (2) REFUSE path — announce names survivors (babysitterd fixture).
  (3) Broken announcer — expedition completes identically, warning logged. (4) Long
  bounce reason — truncated line includes evidence path. Live: Operator topic shows
  ride timeline during a real expedite run.

source: |
  Operator 2026-07-26 ~01:30: cannot remote-control headless `claude -p` stages;
  post milestones to Telegram instead ("ok oui fais ça"). Builds on expedite_cli
  milestone logging and notify-dead-letters / handoffd alarm send patterns.

specifier_decisions: |
  Minted 2026-08-26 per coordinator route. Five scenarios map inline acceptance 1–5.
  required_stages coder+qa per ticket; stage_skip_reasons preserved. Reuses BL-346
  Operator topic; out of scope remote-control and two-way Telegram control unchanged.

notes: |
  Smallest ticket of the 2026-07-25/26 series, deliberately: one seam, one
  default announcer, reusing shipped send machinery. Named the "ride log"
  after BL-655's ambulance framing — lane, ambulance, expeditor: whichever
  rung carries the urgent ticket, the human's phone should hear the siren.

out_of_scope: |
  - Remote-control on stages (settled above).
  - Two-way control (pause/abort from Telegram). The Expeditor is supervised
    at a terminal by design; the phone gets the ride log, not the wheel.
  - Announcing to any topic other than the standing Operator topic.
