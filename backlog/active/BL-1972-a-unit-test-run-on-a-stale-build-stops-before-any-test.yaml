description: |
  ## What is wanted

  When the default unit test configuration (the one `npx vitest run
  <file>` uses from extension/) starts, it checks that every source file
  under extension/src has a compiled file under extension/out written
  after it. If one does not, the run stops before any test with a message
  naming the stale or missing file and `npm run compile`. A run whose
  out/ is current goes on with nothing printed. `npm test` and `npm run
  test:properties` compile first, so they never see it.

  The hardener's evidence records the dry-run line of one Stryker run
  inside a sandbox with the check in place, green.

  ## How (direction, not mandate)

  - A pure function over the source and compiled paths and an injected
    stat, unit-tested on fake times; a globalSetup entry calls it with the
    real file system.
  - Map a source file to its compiled path the way tsconfig's rootDir and
    outDir do; read them from tsconfig rather than hard-coding them.

  ## What each stage checks

  - Coder: the three scenarios; the check's own unit tests; npm test green.
  - Hardender: mutation on the check; one Stryker dry run inside a sandbox
    stays green.

