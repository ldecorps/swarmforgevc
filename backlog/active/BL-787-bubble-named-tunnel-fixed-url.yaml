approval_context: >
  This adopts work the human already did by hand and is using in production
  right now (Bubble is paired to a fixed hostname today). Two things need
  sign-off because the spec CHANGES that hand work rather than rubber-stamping
  it:

  1. The tracked scripts currently default to the operator's own domain
  (a `bubble.<operator-domain>` hostname and its zone) when nothing is
  configured. The spec removes those defaults: named mode with no configured
  hostname must fail loud pointing at the setup script. The concrete domain
  stays in the `.example` config and the how-to, as documentation.

  2. The launcher currently treats "the tunnel process is still alive after
  the wait window" as ready, then writes state and notifies a URL that may
  never have reached the Cloudflare edge — which is the BL-716 dead-hostname
  symptom re-created from the inside. The spec makes that path fail instead.

  If the human wants either behaviour kept as-is, say so on this ticket and
  the corresponding scenario (named-02 / named-03) comes out before promotion.

description: |
  ## What

  A Cloudflare **named** tunnel mode for the resident-spy tunnel launcher, so
  Bubble reaches the bridge on a hostname the operator owns instead of a fresh
  `*.trycloudflare.com` name on every cloudflared restart. Quick tunnels remain
  the default; named mode engages only when configured.

  The work already exists in the master working tree, unticketed and unreviewed
  (surfaced by the coder 2026-08-02, cf BL-763):

  - `swarmforge/scripts/launch_resident_spy_tunnel.sh` (modified) — named vs
    quick start paths, readiness wait, `mode` field in the tunnel state file,
    and a detached macOS idle-sleep keepalive with its own pidfile.
  - `swarmforge/scripts/stop_ancillary_services.sh` (modified) — signals the
    keepalive pidfile.
  - `swarmforge/scripts/setup_bubble_named_tunnel.sh` (untracked) — one-shot
    operator setup: login, create tunnel, route DNS, write cloudflared config
    and the gitignored operator env file.
  - `swarmforge/scripts/check_bubble_named_tunnel_dns.sh` (untracked) — DNS
    readiness preflight.
  - `swarmforge/config/named-tunnel.env.example` (untracked) — example config.
  - `swarmforge/scripts/test/test_launch_resident_spy_named_tunnel.sh`
    (untracked) — named vs quick wiring test with stubbed binaries.
  - `docs/how-to/named-tunnel-bubble-musicalsifu.md` (untracked) — the how-to.

  ## Why stamp this now

  Per BL-506, ticket-less functional work is retroactively ticketed or
  reverted; per BL-709/BL-763 the cheap honest path is adopt + review, not a
  silent commit past QA. This code is live on the operator's phone today, so
  reverting it would take the phone down; adopt is the right fork.

  ## Scope

  Adopt the files above **with two corrections** the review must not wave
  through — they are the reason this is a defect ticket and not a plain
  commit:

  1. **No operator-specific default.** The launcher and setup script currently
     fall back to the operator's own hostname/zone when nothing is set. A
     tracked script must not carry one operator's domain as a default. Named
     mode with no hostname in the environment or the gitignored operator
     config must exit non-zero naming the setup script. The concrete values
     stay in `named-tunnel.env.example` and the how-to.

  2. **Readiness is observed, never inferred from liveness.** The launcher's
     named-mode wait currently ends with "process still alive after the window
     → treat as ready", then writes tunnel state and sends the Telegram
     pairing notification. That publishes a URL that may resolve to nothing —
     the exact BL-716 symptom, manufactured locally. If no edge registration
     was observed, fail: no state write, no notification, non-zero exit,
     pointing at the tunnel log.

  Also in scope: link the how-to from `docs/index.md` (BL-756 orphan lesson),
  and run the shell test and record its output in evidence.

  ## Out of scope

  - Discovery of rotating quick-tunnel hostnames — that was BL-716 (done);
    this ticket does not re-open or re-close it. Quick mode stays the default
    and a phone paired to a stale quick hostname still fails the same way.
  - The bridge `/lets-talk/meta` bounce path and the Cursor Remote always-on
    contract — BL-763.
  - The 2026-08-02 pairing / client-logs hotfix (Android `AppLog`,
    `PairingSave`, the bridge `/pair` page and APK serving, the
    `pairingHttpsUrl` notify change) — still ticket-less, see notes.
  - Automatic shell-test discovery — BL-724.
  - Lid-closed / clamshell sleep, which needs `sudo pmset` and is deliberately
    not attempted.

  ## STEERING note

  Adopt-and-review of live operator work. Queue-jump so it does not rot, but
  do not displace priority-0 evidence-gate work unless the human says so.

