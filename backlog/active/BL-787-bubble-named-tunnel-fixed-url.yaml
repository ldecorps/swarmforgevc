source: |
  Coder `note` 2026-08-02 (priority 00): "Untracked named-tunnel scripts, no
  ticket, in coder tree (cf BL-763)". The three scripts reached the coder
  worktree through the `swarmforge/scripts` hot-sync (BL-373), which is why a
  build role saw operator-authored files it had no ticket for. Sibling of
  BL-716 (rotating-hostname discovery, done), BL-762 (bedtime keeps the phone
  reachable) and BL-763 (bounce meta + always-on).

notes: |
  ## Severity rationale

  `medium`. Unreviewed functional code in the tree can become an ancestor of
  an unrelated QA approval (BL-506), and the launcher can currently publish a
  URL it never verified — but nothing is swarm-down or losing data, and the
  path works for the operator today.

  ## Acceptance contract is runnable (BL-761)

  These scenarios drive the real scripts with stubbed `cloudflared`,
  keepalive and `dig` binaries on PATH — no live Cloudflare account, no
  network. The untracked
  `swarmforge/scripts/test/test_launch_resident_spy_named_tunnel.sh` already
  proves that shape for named-01, quick-01 and the keepalive outline; named-02,
  named-03, keepalive-02, setup-01 and setup-02 are new and land with this
  parcel. Nothing here needs an Android device or a real domain, so this is not
  the BL-769 inert-contract situation.

  ## IR-DRY findings — reviewed, deliberately kept

  The vendored IR-DRY checker reports three medium-confidence findings on the
  feature file; each is a real difference in assertion, not accidental drift,
  so none was normalized:

  - `zone nameservers are Cloudflare-backed` vs `are not` — opposite
    preconditions for setup-02 and setup-01.
  - state file records mode `"named"` vs `"quick"` — the two modes are what
    the ticket is about; folding them into one outline would hide that named
    mode prints a configured URL while quick mode reads one out of the log.
  - setup script `runs twice` vs `runs without the pending-DNS override` —
    idempotence versus refusal.

  ## Adjacent ticket-less work NOT covered here

  The 2026-08-02 master tree carries at least two further unticketed bodies
  the specifier has not yet triaged, both recorded only in their own how-to
  and evidence files:

  - Bubble pairing / client logs: `AppLog.kt`, `PairingSave.kt`, the Android
    test dir, the bridge `/pair` page + pre-auth APK download, and
    `residentSpyTunnelNotify`'s `pairingHttpsUrl`
    (`docs/how-to/hotfix-2026-08-02-bubble-client-logs-and-pairing.md`).
  - Mac host-switch freshness/bridge changes across
    `daemon_log_freshness_check.sh`, `install_freshness_cron.sh`,
    `front_desk_supervisor.bb`, `handoffd.bb`, `remote_control_health_lib.bb`
    and the Stryker configs
    (`docs/how-to/hotfix-2026-08-02-mac-host-switch-freshness-bridge.md`).

  Both need the same BL-506 disposition (adopt-and-review or revert) in a
  dedicated triage pass, in the shape of the 2026-07-31 review that produced
  BL-763..BL-766. Deliberately not folded in here: this ticket stays the size
  of one slice (BL-634).

  ## e2e procedure for QA

  1. With the operator config absent, run the launcher with named mode
     requested — expect a non-zero exit naming the setup script, no
     `resident-spy-tunnel.json` written, no Telegram post.
  2. With operator config present and a stubbed cloudflared that never logs a
     registration, run the launcher — expect non-zero, no state, no post.
  3. With the real named tunnel configured, run the launcher — expect the
     fixed `https://<hostname>` printed, state `mode: named`, and the phone
     reaching `/resident-spy` on that URL.
  4. Run the ancillary stop path; confirm both the cloudflared and keepalive
     pidfiles are signalled and no process survives under either.
  5. Remove the operator config and run the launcher again — expect the quick
     tunnel default, state `mode: quick`, unchanged from before this ticket.
