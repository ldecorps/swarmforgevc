approval_context: >
  A new feature file is authored here, so it would ordinarily need a tap;
  it is minted approved under the 2026-09-17 operator hotfix (severity
  defect, no choice posed, no ruling_options). FIRM: lane-running? keeps
  every reading it makes today for OTHER processes - a real vitest,
  stryker, bb test runner or run_acceptance.sh process whose cwd is under
  the worktree or whose argv names it still reads true (BL-1652's
  invariant 1 stands); only the scanning process itself is excluded.
  FIRM: lane-process-pattern is unchanged - a Stryker run's own children
  carry the sandbox path in their argv and ARE lane activity; the defect
