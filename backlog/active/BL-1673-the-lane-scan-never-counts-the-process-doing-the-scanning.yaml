description: |
  ## What is wrong

  `swarmforge/scripts/lane_process_lib.bb` `lane-running?` scans the
  whole process table and reads true for any process whose cmdline
  matches `lane-process-pattern`
  (`(?i)stryker|vitest\.properties\.config\.mjs|\bnpm exec vitest\b|\bnpx
  vitest\b|\(vitest|_test_runner\.bb|run_acceptance\.sh`) AND is
  project-scoped to the worktree (`process_table_lib.bb`
  `project-scoped-process?`: the cmdline names the path at a component
  boundary, or the cwd is under it). Nothing excludes the scanning
  process itself. `extension/test/bl1652HandoffdRespawnReadingsWiring.test.js`
  probes the daemon with `execFileSync('bb', ['-e', '(load-file
  "<REPO_ROOT>/swarmforge/scripts/handoffd.bb")\n(println
  (handoffd/role-lane-running? {:worktree-path "/tmp/bl1652-role-lane-quiet-..."}))',
  '--', root])` - the form, and so the worktree path, is on the bb
  process's own command line. Under plain vitest that cmdline matches no
  lane token and the case reads false. Under Stryker's dry run the test
  runs from `extension/.stryker-tmp/sandbox-<id>/`, `REPO_ROOT`
  (`path.join(__dirname, '..', '..')`) resolves under `.stryker-tmp/`,
  the load-file path in the bb argv contains `stryker`, the pattern
  matches the probe's own process, the probe names the worktree, and
  `lane-running?` reads TRUE - `expected false, got true`, twice,
  deterministic (hardener, BL-1640, evidence
  `backlog/evidence/unowned-red-bl1652-role-lane-running-full-suite-hardener-20260921.md`,
  hardender branch 8d84cc5231). The hardener suspected an unreaped fake
  lane process from a peer test; the pairing with `laneProcessLib.test.js`
  is green and no peer is needed.

  Three-way probe on the master checkout, 2026-09-21 (script in the
  adjudication evidence): a bb whose argv names a fresh empty worktree
  and carries no lane token reads `false`; the same argv plus one extra
  token `/x/.stryker-tmp/sandbox-abc` reads `true`; the form read from a
  FILE with the same extra token (argv names no worktree) reads `false`.

  ## What is wanted

  1. `lane-running?` skips the scanning process's own pid
     (`(.pid (java.lang.ProcessHandle/current))`) before classifying;
     every other process is classified exactly as today (scenario 01).
  2. `bl1652HandoffdRespawnReadingsWiring.test.js`'s `loadHandoffdAndRun`
     passes its script through a temp file (or stdin) rather than `-e`,
     so no bb probe in that file names a fixture worktree on its own
     command line - the same hygiene as probe C above; all seven cases
     keep their names and verdicts.
  3. `laneProcessLib.test.js` gains a case named `the scan never counts
     its own process` that invokes the lib with an argv naming the
     worktree and carrying a `.stryker-tmp/` token and asserts false;
     scenario 03 pins that PASS line (BL-1445).
  4. Documenter: `lane_process_lib.bb`'s header names the self-exclusion
     and why; the BL-1652 how-to gains one line. No diagram trigger.

  ## How (direction, not mandate)

  - `(let [self (.pid (java.lang.ProcessHandle/current))] ... (some (fn
    [{:keys [pid cmdline]}] (and (not= pid self) ...))))` - one line in
    the `some`; bb exposes `ProcessHandle` (the shell tests' own zombie
    probes use it). Keep the pattern literal and `project-scoped-process?`
    untouched.
  - The acceptance handler builds a mkdtemp worktree, runs the real lib
    through the real bb three ways (the probe's A/B/C shapes) and asserts
    false/false/true where C's third arm is a real `exec -a
    run_acceptance.sh sleep 30` child with cwd under the worktree,
    killed in a finally; validate the outline column against explicit
    KNOWN_VALUES.

  ## Not in scope

  - `lane-process-pattern` matching a Stryker sandbox path in a child's
    argv: a mutation run's children are lane activity by definition.
  - The daemon's respawn ladder (BL-1652's decisions) and
    `project-scoped-process?` (BL-887's shared classification).

qa_e2e_procedure: |
  On the parcel commit, from the repo root; fixture roots per BL-1390.
  1. `cd extension && npx vitest run test/laneProcessLib.test.js
     test/bl1652HandoffdRespawnReadingsWiring.test.js` once: green, with
     `the scan never counts its own process` among the passing names and
     all seven wiring cases present.
  2. Probe B from the adjudication evidence (`bb -e '<form naming a fresh
     mkdtemp worktree>' -- /x/.stryker-tmp/sandbox-abc`) prints `false`.
  3. `specs/pipeline/scripts/run_acceptance.sh` on this ticket's feature:
     5/5 (01 x3, 02, 03), once.
  4. Hardening lane, once: `npx stryker run --mutate
     out/quality/nightClosingCeremonyLive.js --force` from `extension/`
     gets past its dry run (the wiring case green inside the sandbox);
     record the dry-run line, then stop the run - the mutation result is
     not this ticket's.
  5. Break-then-restore: remove the own-pid exclusion; scenario 01 row 2
     fails on `true`; restore.

