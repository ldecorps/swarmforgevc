description: |
  ## Status: hotfix dfa78c6ead landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `specs/pipeline/steps/bl754StageSkipReasonsSteps.js`'s `sendHandoff`
  ran `swarm_handoff.bb` once. Since the Article 2.3 self-audit (BL-1529)
  the first send of a git_handoff draft prints AUDIT_REQUIRED /
  HANDOFF_NOT_QUEUED and queues nothing; an identical second send queues
  it. Scenarios 03 and 05, which expect a delivery, failed.

  ## What the hotfix changed

  - `sendHandoff` re-sends the identical draft when the first answer is
    the challenge (matched on AUDIT_REQUIRED or HANDOFF_NOT_QUEUED).

  ## Census, same pass

  39 other features whose handlers send a git_handoff through
  swarm_handoff.bb without naming the challenge were run once each
  (refusal scenarios never reach the audit, so a single send is fine for
  them). Results are recorded in this ticket's notes when the census
  finishes; any red among them is hotfixed and folded in here while this
  ticket is paused.

  ## What the coder does (all of it)

  1. Run qa_e2e_procedure step 1 once, in your worktree, its output saved
     to tmp/out.txt.
  2. Read `git show dfa78c6ead` against the sections above and the
     invariant.
  3. Write backlog/evidence/BL-2006-coder-<date>.md: the result and one
     line saying whether the hotfix matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

