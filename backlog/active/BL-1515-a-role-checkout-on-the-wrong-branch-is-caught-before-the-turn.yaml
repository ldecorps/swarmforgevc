id: BL-1515
title: "A role's worktree can sit on a branch that is not the one roles.tsv names and nothing notices (the coder has been on `side` since 2026-09-03 12:46:29 while roles.tsv says `swarmforge-coder`, and the local `swarmforge-coder` ref no longer exists); ready_for_next.bb gains a pre-turn branch-identity guard that repairs the one provably safe shape by renaming and refuses every other mismatch fail-closed, and the live coder worktree is put back on its declared branch in this parcel"
milestone: M8
type: defect
severity: high
# high: a broken safety signal. Every guard that resolves a role's branch
# from roles.tsv's session column (tree_collapse_guard_lib.bb's
# recipient-branch-ref, the land walk's `git log main..swarmforge-coder`
