description: |
  ## The defect

  Two thresholds govern the same waiting parcel and they are ordered the
  wrong way round:

  - `note_actionable_after_ms` = 20 min — before this, the chase sweep is
    forbidden to rotate the resident for a note in a dormant queue
    (BL-576, protecting against QA's five-role merge-up broadcast thrashing
    the resident through five rotations).
  - `flow_watchdog_warn_ms` = 15 min — after this, the human is alarmed that
    the parcel is stalled.

  So for the whole 15–20 minute window the system alarms a human about a
  parcel it is itself refusing to act on, and every note that ages into
  actionability has already produced a warn. BL-651's Shape names the
  intended relationship explicitly ("the swarm drains a queue before the
  human is ever alarmed about it"); this is the one parcel type where the
  current defaults make that impossible.

  ## Human choice (option a)

  Lower the shipped default `note_actionable_after_ms` to ten minutes
  (600000 ms) — the same posture as BL-651's `rotation_starve_after_ms`
  default — so note rotation can act before the fifteen-minute warn tier.
  Do not raise `flow_watchdog_warn_ms` or leave the inversion in place.

  ## Shape

  Whichever numbers ship, the durable part is ORDERING: every threshold that
  gates rotating for a parcel must be lower than the threshold that alarms a
  human about that same parcel. A config that inverts them is reported once
  at daemon start (`config-threshold-inversion` log line naming both values),
  never silently accepted or auto-rewritten.

  ## BL-576 retirement (BL-1006)

  When this lands, retire BL-576 aged-note-actionability-04's default row
  (empty conf line → 10 minutes, not 20). Do not reword the other rows.

qa_e2e_procedure: >
  (1) Unit tests on mono_router_lib / flow_watchdog_lib defaults show
  note_actionable_after_ms < flow_watchdog_warn_ms.
  (2) Fixture conf with inverted ordering emits config-threshold-inversion once
  at handoffd startup and handoffd keeps running.
  (3) BL-576 scenario 05 regression green (five-role merge-up one rotation per
  sweep).
  (4) Acceptance feature green after compile.

out_of_scope: |
  - BL-651's own `rotation_starve_after_ms` (already specced below warn).
  - The watchdog's tier logic and escalate tier (BL-650 / BL-577).
  - Clamping a bad config automatically — report, do not silently rewrite an
    operator's number.

