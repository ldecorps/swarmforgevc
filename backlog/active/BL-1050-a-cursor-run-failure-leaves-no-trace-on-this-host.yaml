id: BL-1050
title: "A Cursor Remote run failure leaves no trace on this host: the bridge throws the SDK's reason straight into a Telegram message and prints nothing, so cursor-bridge.log holds only supervisor-spawn lines"
milestone: M8
type: defect
severity: medium
# medium: real and contained. Nothing is lost or corrupted and the bridge
# keeps serving, but every diagnosis of a bridge failure starts from a
# Telegram screenshot - a scrollback nobody can grep, on the one surface
# that is unavailable precisely when the bridge is the thing that is broken.
# Not high: no live fault degrades behaviour; this is the evidence trail.
status: todo
epic: swarmforge-console
priority: 0
direction: queue-jump
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1050-a-cursor-run-failure-leaves-no-trace-on-this-host.feature
human_approval: approved
approval_context: >
  Nothing about this needs a decision from you - it is a one-sided
  observability gap with an obvious fix and no design fork. Flagged pending
  only because the feature file is new and your standing rule is that a
  feature file is reviewed before it is built.

  What it does: the bridge prints its run failures and session resets to
  stderr, which the supervisor ALREADY redirects into cursor-bridge.log. No
  new file, no rotation, no new path.

  What it deliberately does NOT do: change any Telegram-facing text, add a
  second log file, or log prompt or reply CONTENT. Only the run id, the error
  reason, and whether the session was reset.

required_wiring:
  - "specs/pipeline/steps/index.js::bl1050::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "A failure surfaced to a human is also written to disk. Every bridge run failure the operator can be told about through Telegram leaves a line in cursor-bridge.log, whether or not the Telegram post itself succeeds - the log path must not be reachable only through the code path that also posts."
  - "No secret and no conversation content is logged. Lines carry the run id, the error reason and the reset decision; never a prompt, a reply, an API key, or a bot token - the log is world-readable to anything on this host."

description: |
  ## What is wrong

  When a Cursor run fails, `cursorBridgeAgentSession.ts` builds the reason and
  throws it:

      // assertCursorRunSucceeded
      throw new Error(`Cursor run failed (${result.id}): ${detail}`);

  Callers in `telegramCursorBridgeLive.ts` catch it, turn it into a Telegram
  post, and that is the end of it. There is no `console.error` anywhere in
  `extension/src/bridge/cursorBridgeAgentSession.ts`. So the reason exists in
  exactly one place: a Telegram message.

  ## Why that is worse than it sounds

  The supervisor already solved the hard half. `cursor_bridge_supervisor.bb`
  spawns the bridge with

      :out-file (str bridge-log-file)
      :err-file (str bridge-log-file)

  both pointing at `.swarmforge/operator/cursor-bridge.log`. Anything the
  bridge prints is already captured, already appended, already next to the
  supervisor's own spawn lines. The bridge simply never prints. That is why
  the operator's own triage found the log holding "almost only
  supervisor-spawn lines" while the failures were live.

  The cost lands exactly when it hurts most. On 2026-07-29 the Cursor Remote
  topic answered `Connection failed repeatedly`, then `Busy` to everything
  else, and diagnosing it took a live `Agent.resume` repro against the sticky
  `agentId` from `cursor-bridge-state.json` - because the only record of what
  had failed was a Telegram scrollback. Telegram is also the surface most
  likely to be unusable in the failure being diagnosed.

  ## Already fixed, and deliberately not re-specified here

  The intake this comes from asked for four things. Three have since landed
  and are NOT in this ticket's scope: `shouldResetCursorAgentSession` now
  includes `isCursorConnectionFailure` (`'connection failed'`, `'fetch
  failed'`, `'[unavailable]'`, `'service unavailable'`), so a connection
  failure clears the sticky agent; `BRIDGE_READY_MESSAGE` is posted once per
  process spawn; and `MAX_QUEUED_PROMPTS` gives the inbound queue. Only the
  logging ask is still open, and this ticket is exactly that ask.

  ## How (direction, not mandate)

  Print a single structured line per event to stderr at the points that
  already know the outcome - the run-failure path and the session-reset
  decision - carrying the run id, the reason, and whether the agent session
  was reset. Format it so `grep` and a human both read it. Nothing else in
  the bridge changes.

notes: |
  Source intake:
  `.swarmforge/operator/INTAKE-cursor-remote-connection-failed-stuck-agent.md`
  (operator, 2026-07-29, urgency high; archived to
  `.swarmforge/operator/archive/` on drain).

  The intake's four asks, verbatim, and where each stands:

  1. "Widen recovery in `telegramCursorBridgeCore.ts` / session layer: Treat
     `connection failed` / `connection failed repeatedly` (and maybe generic
     network/`fetch failed` from SDK) like auth/active-run -> clear cached
     agent + clear persisted `agentId` -> one retry with `Agent.create`."
     -> ALREADY LANDED; verified at spec time in
     `shouldResetCursorAgentSession`. Not in this ticket.
  2. "Immediate ops unblock (no code): `/new` on Cursor Remote, or clear
     `agentId` in `cursor-bridge-state.json` and redeploy/restart bridge -
     forces a fresh agent (fresh create already works)." -> a runbook step
     the operator performed at the time; nothing to build.
  3. "Logging: write run failures (run id + error message) to
     `cursor-bridge.log` (or a dedicated `cursor-bridge-runs.log`) so
     Telegram is not the only evidence." -> THIS TICKET. Of the intake's two
     offered destinations, `cursor-bridge.log` is chosen because the
     supervisor already redirects both streams there; a dedicated
     `cursor-bridge-runs.log` would need its own path, rotation and cleanup
     for no gain.
  4. "Optional product follow-up: inbound prompt queue while busy (user
     request in-thread) - separate intake if desired." -> ALREADY LANDED
     (`MAX_QUEUED_PROMPTS`, `QUEUED_PROMPT_TTL_MS`). Not in this ticket.

  The intake's own non-goals are carried unchanged: "Do not change model away
  from `auto` unless connection errors correlate with model selection (fresh
  `auto` is healthy)" and "Do not conflate with swarm autopilot idle
  (separate surface)."

  IR-DRY: one `near-duplicate` at 0.90 was real and normalized away - scenario
  03's "still gains a line" now reads identically to scenario 01's "gains a
  line", since its Given ("posting to Telegram fails") already carries the
  contrast the word "still" was doing. Four `possible-synonym` findings remain
  and are deliberately kept: three are the Examples placeholder "<reason>"
  against literal reasons (same handler, one parameterized) and one is "gains
  a line naming that run id" against "gains no failure line", which are the
  two opposite assertions this feature exists to separate. No `duplicate`
  findings.

  The sibling intake `INTAKE-cursor-remote-ready-after-bounce.md` is fully
  discharged by `BRIDGE_READY_MESSAGE` and archived without a ticket.

qa_e2e_procedure: |
  On the live host, with the Cursor Remote bridge running under its
  supervisor:

  1. Force a failing run - the cheapest is to point the bridge at an agent id
     that no longer exists (stop the bridge, set `agentId` in
     `.swarmforge/operator/cursor-bridge-state.json` to
     `agent-00000000-0000-0000-0000-000000000000`, restart, send one prompt).
  2. Confirm Telegram still reports the failure exactly as it does today -
     no user-visible wording changed.
  3. `grep -i 'run failed' .swarmforge/operator/cursor-bridge.log` - there is
     now a line naming the run id and the SDK's reason, timestamped, sitting
     alongside the supervisor-spawn lines.
  4. Confirm the reset decision is recorded too: the same log shows whether
     the stored `agentId` was cleared.
  5. `grep -iE 'api[_-]?key|bot[_-]?token' .swarmforge/operator/cursor-bridge.log`
     prints nothing, and no prompt or reply text appears in the new lines.
  6. Send one healthy prompt and confirm the log gains no failure line for it.
