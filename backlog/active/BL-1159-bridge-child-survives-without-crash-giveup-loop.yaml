description: |
  ## What

  The front-desk bridge child repeatedly exits 4–6 seconds after
  `BRIDGE_LISTENING`, logging `:crashed` (pid dead) — not `:build-stale`.
  The supervisor cycles until `gave-up bridge after 5 attempt(s)`, then
  cooldown re-arms. Bot often stays running; bridge oscillates running →
  waiting → gave-up.

  ## Why

  Live outage: `curl -sf http://127.0.0.1:8765/lets-talk` fails during
  give-up windows; `https://bubble.musicalsifu.com/resident-spy` returns
  502 when origin 127.0.0.1:8765 is down. Manual `rearm_front_desk_bridge.sh`
  brings bridge up briefly but does not hold.

  ## What is already fixed (do not re-open)

  | Ticket | What it fixed |
  |--------|---------------|
  | BL-1158 | Dual supervisor on 8765 — single front_desk_supervisor owner |
  | BL-1154 | Build-stale restarts no longer burn crash give-up budget |
  | BL-1151 | One escalation email per give-up episode |

  Recompile is **not** the operator fix here: on 2026-08-26 ~13:17,
  `extension/out/BUILD_SHA` matched `git HEAD` (`a19dce261…`). Aligning compile
  to tip did not stop the crash loop.

  ## How (direction, not mandate)

  Unknown child exit after successful bind — supervisor sees `pid-alive?`
  false and logs `:crashed`. Investigate:

  1. Bridge stderr between `BRIDGE_LISTENING` and exit (supervisor log / inherit)
  2. Whether supervisor or another actor kills the child (build-stale restart,
     port adopt/free race, orphan reap — see BL-789)
  3. Bridge process stability when run manually with `BRIDGE_TOKEN` vs under
     supervisor spawn env
  4. Bot build-stale restart pulling bridge respawn in same tick (bridge+bot order)

qa_e2e_procedure: >
  (1) Cold `./start-swarm.sh` with Telegram configured — assert bridge status
  JSON shows running with stable pid for 10+ minutes (no manual re-arm).
  (2) Probe `curl -sf http://127.0.0.1:8765/lets-talk` every minute — all succeed.
  (3) Supervisor log: no repeated `:crashed` / `gave-up bridge` without healthy period.
  (4) Probe resident-spy on bridge port — 200 while bridge up; confirm
  bubble.musicalsifu.com/resident-spy returns 200 over same window (origin up,
  not a cloudflared URL change). Use controllable clocks and fixture supervisor
  for CI; live 10-minute hold is the operator acceptance anchor.

