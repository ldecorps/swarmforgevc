description: |
  ## Status

  A Cursor agent landed this on main as part of 1e64496d93 with a raw
  intake asking the specifier to mint the acceptance (intake item 2). The
  coder reviews the landed lines, builds the handler, and fixes what
  review finds; the parcel never re-applies the code.

  ## What is gated

  In recruiter_weekly.sh, after `ollama pull` and `ollama cp`:
  - `local_model_prepare_cli.bb <pulled tag> --alias prepared-<alias>
    --num-ctx 32768` runs, and the alias it returns replaces the copied
    alias for register, the coder and compliance batteries and certify
    (scenario 01).
  - A failing prepare finishes the run `prepare-failed` before anything is
    registered (scenario 02). Observed, not changed here: the pulled
    weights stay on disk on that path; the script's own comment says the
    refusal cleanup is never reached from it.
  - A refused certify removes the prepared alias, the copied alias and the
    pulled tag, and nothing else (scenario 03, invariant), unless
    `RECRUITER_KEEP_UNFIT=1`.
  - Living doc: docs/how-to/BL-547-model-steward-overview.md's recruiter
    lines match.

  ## How (direction, not mandate)

  - Copy recruiter_weekly.sh and its bb closure into a mkdtemp scripts
    directory (swarmforge/scripts/test/lib/bb_closure_copy.sh) with fake
    recruiter_hf_discover.py, local_coder_battery.sh, compliance battery
    and model_steward_cli.bb siblings, and fake `ollama`, `curl` and `df`
    first on PATH, each recording its argv. A seam for SCRIPT_DIR or the
    discovery command is fine if copying is not enough.

constraints: >
  Temp project roots, fake ollama/curl/df and fake sibling scripts only;
  never the live Ollama, the live .swarmforge/recruiter or model-steward
  state, or the network. The step handler lands with the feature (BL-233).

out_of_scope: |
  - The steward side of prepare (prepare!, probe --prepare, the re-probe):
    BL-2106.
  - Whether a failed prepare should also free the pulled weights.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2108-the-weekly-recruiter-benchmarks-the-prepared-alias.feature`:
     3 of 3 ok.
  2. `bb swarmforge/scripts/test/local_model_prepare_lib_test_runner.bb`:
     ALL CHECKS PASSED (measured on main at mint).
  3. `grep -n "local_model_prepare_cli.bb" swarmforge/scripts/recruiter_weekly.sh`:
     one call, after the `ollama cp` line and before the register line.

