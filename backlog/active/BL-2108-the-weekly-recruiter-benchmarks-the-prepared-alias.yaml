approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: the code is already on main
  (1e64496d93); this ticket reviews and gates it and fixes what review
  finds. FIRM: the recruiter still only offers - it never staffs a seat,
