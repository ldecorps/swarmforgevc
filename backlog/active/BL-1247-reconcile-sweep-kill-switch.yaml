notes: |
  - [2026-08-28] specifier: no human_approval gate on this one deliberately.
    The ruling IS the authorisation and it is unambiguous about the goal; the
    two open details (off means not-running, and fail-closed on an absent key)
    are decided in the description under stated rationale rather than sent back
    for a second round trip while work is still being destroyed. Both choices
    are the conservative one. If the human wants either reversed, amend.
  - [2026-08-28] specifier: expedited by Article 3.2.4 (defect, severity
    critical) and priority 10 puts it ahead of BL-1236 (18) within the
    expedited set. That ordering is intended — the stopgap should land first;
    it is cheap, and it stops the loss while the real fix is built.
  - [2026-08-28] specifier: IR-DRY leaves three medium possible-synonym
    findings, all of them the Scenario Outline's `<setting>` placeholder
    against the concrete `on`/`off` its sibling scenarios pin. Reviewed and
    left as-is; that is the shape of the feature, not accidental drift.
  - "[2026-08-28] coder: implemented. Pure kill switch
    (master-main-reconcile-lib/reconcile-enabled?, master_main_reconcile_lib.bb):
    `config master_main_reconcile_enabled <bool>` from conf text, fail-
    CLOSED for every shape but the literal \"true\" - absent, empty,
    malformed, unreadable (nil conf-text) all degrade to off. Wired at the
    DAEMON entry point (handoffd.bb's master-main-reconcile-sweep!, read
    fresh via a plain slurp every call, never cached): off means
    master-main-reconcile-lib/sweep! - the only function with any write
    path (merge!, the rematch-onto-origin escape, escalate!) - is never
    called at all, satisfying \"off means the sweep does not run\" per
    the ticket's own stated judgment call. A separate READ-ONLY divergence
    check (the existing push-sweep-rev-counts! adapter) still runs and is
    logged even while off, so the operator's eyes stay on what the sweep
    would have seen. Added `--reconcile-sweep-once`, the same one-shot-
    and-exit flag shape this file already uses for --sweep-once/
    --chase-sweep-once, so the switch is acceptance-testable
    deterministically against a real diverged fixture without a
    background process or wall-clock wait. swarmforge.conf ships the key
    present and set off, per the ruling.

    Regression note: test_handoffd_chase_sweep_wiring.sh's scenario 01
    fails on unmodified HEAD too (checked directly via a temporary git
    stash) - pre-existing, unrelated to this change.

    Non-vacuity proven by hand twice: (1) broke reconcile-enabled? to
    always return true (fail-open), confirmed all 6 new fail-closed unit
    tests fail; (2) forced the daemon's own gate to always take the
    disabled branch, confirmed 2 of 7 acceptance scenarios fail through
    the REAL daemon end to end (the \"on\" cases correctly expect it to
    run). Restored and re-confirmed green after each.

    Verified: master_main_reconcile_lib_test_runner.bb ALL PASS (new
    reconcile-enabled? tests + all pre-existing); master_main_reconcile_lib_property_runner.bb
    ALL PROPERTIES HOLD unchanged; acceptance feature 7/7, driving the
    real handoffd.bb against a real bare-origin + diverged-clone fixture
    (genuine ahead=1/behind=1, not simulated)."
  - "[2026-08-29] hardener: found and fixed a fail-open gap in the switch
    itself before hardening the rest. `reconcile-enabled?` matched
    `\\btrue\\b` ANYWHERE on the matched conf line, not just the value
    token - so `config master_main_reconcile_enabled false # flip to true
    once BL-1236 lands` (an entirely plausible edit to a line already
    carrying a 15-line prose comment above it) read as ENABLED despite its
    own value being \"false\". Confirmed by hand: `(reconcile-enabled?
    \"config master_main_reconcile_enabled false # ... true\")` returned
    true pre-fix. This is the exact fail-open the ticket's own second
    invariant exists to forbid, introduced by the new code this ticket
    adds - squarely in scope, not a pre-existing pattern to route
    elsewhere. Fixed by anchoring on the first whitespace-delimited token
    after the key (`^config\\s+master_main_reconcile_enabled\\s+(\\S+)`)
    instead of a bare word-boundary search over the whole line; a trailing
    comment can no longer influence the parsed value. Added 2 regression
    tests (false-with-a-trailing-\"true\"-comment stays off,
    true-with-a-trailing-comment still works); confirmed non-vacuously by
    reverting only the fix and watching the new test go red (actual: true,
    expected: false), then restoring and re-confirming green.

    Full BL-113 soft Gherkin mutation over the one Scenario Outline
    (reconcile-sweep-kill-switch-01, 4 example rows / 8 mutable cells): ran
    once pre-fix (8/8 killed - the fix does not touch example values,
    only the implementation, so the outline's own coverage was already
    tight), then a `full` re-run post-fix to refresh the manifest against
    the corrected implementation: 8/8 killed, 0 survived, 0 errors, fresh
    timestamp recorded in the feature file's own manifest. Acceptance
    (7/7, real handoffd.bb via --reconcile-sweep-once against a real
    bare-origin + diverged-clone fixture) re-run clean after the fix.
    master_main_reconcile_lib_test_runner.bb ALL PASS (8 reconcile-enabled?
    cases now, up from 6) and master_main_reconcile_lib_property_runner.bb
    ALL PROPERTIES HOLD, both unchanged in shape.

    No wired mutation/CRAP/DRY tool covers any changed file this pass
