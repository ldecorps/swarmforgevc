id: BL-1845
title: "The swarm launches a local-model seat's qwen with its kickoff prompt as a bare argument, which qwen 0.22.2 reads as --prompt: one headless run - so the coder@iq3 pane shows nothing of qwen's work, has no input box for the human to steer it, and never reads the wakes handoffd types into it (it sees new mail only when relaunched; six qwen runs between 15:36 and 16:14 BST on 2026-09-30); the launch hands qwen the kickoff through -i, so qwen opens interactive with it as the first message"
milestone: M8
type: defect
severity: high
# high: a live fault degrading behaviour. The seat's declared wake style
# (chat-message, BL-1052) cannot reach a headless qwen, the human cannot
# see or steer it, and it works only by being relaunched.
status: todo
epic: local-llm-swarm
priority: 2
