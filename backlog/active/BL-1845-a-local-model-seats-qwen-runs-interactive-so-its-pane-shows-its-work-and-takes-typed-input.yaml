source: |
  The human, specifier pane, 2026-09-30 ~16:15 BST, verbatim (Article 5.3):

  > Why is iq3 pane not showing whzt qwen is doing, alsonwhy hasn't it got a steering text input area?

  The specifier answered with the cause below, offered to mint a
  queue-jump defect or treat it as a hotfix the human directs, and the
  human replied, verbatim:

  > Yed please

  Read as the first offer: mint it through the pipeline.

  The human then green-lit a hotfix (coordinator note 014079, 16:24Z,
  "Human green-lit BL-1845 hotfix now"). While verifying it, an
  interactive qwen installed its own update (0.22.2 to 0.24.7); the
  specifier reverted it, and the human ruled, verbatim:

  > What is wrong with auto ipdating to the current version? I think it's ok.

  > Claude cli auto updates, so qwen might as well do it too

description: |
  ## Status: hotfix c885d0c071 landed the launch line

  Hotfix c885d0c071 (2026-09-30) already passes the kickoff through `-i`.
  This parcel is its stamp-off: the step handler that makes the feature
  run, the documenter's pages, evidence, and the pipeline's review of the
  hotfix. The coder finds the line already changed; review it, do not
  re-apply it.

  ## What happened before the hotfix

  - `swarmforge/scripts/swarmforge.sh` `write_role_launch_script`, branch
    `local-model)` (line 2239 at mint), writes
    `qwen --auth-type openai -y <cli> "<kickoff>"`: the kickoff is a bare
    argument.
  - qwen 0.22.2 copies a bare argument into `--prompt` unless `-i` is
    given, and any `--prompt` makes the session non-interactive
    (`~/.npm-global/lib/node_modules/@qwen-code/qwen-code/chunks/chunk-BAJKAAOY.js`,
    around lines 39365-39373 and 39645-39656; its own help text reads
    "Positional prompt. Defaults to one-shot; use -i/--prompt-interactive
    for interactive.").
  - Headless text mode draws no screen and prints only the final answer
    when the run ends. On 2026-09-30 the coder@iq3 pane showed only the
    echo of a wake ("You have new handoff mail. If idle, run
    ready_for_next.sh."), which no process read. The seat picked up work
    only when relaunched with RESUME-ON-START: qwen chat records
    2e25c1d9, 3ff18451, 7710ce8a and be97fcfc, each a fresh process,
    between 15:54 and 16:14 BST.

  ## What is wanted

  1. A local-model seat's launch hands qwen its kickoff as the value of
     its interactive prompt option, so qwen opens its interactive screen
     with the kickoff as the first message (scenario 01). The kickoff text
     is unchanged, including the resume note when the seat's in_process
     mailbox holds a parcel.
  2. No prompt reaches qwen through `-p`, `--prompt` or a bare argument
     (scenario 02).
  3. Every other agent's launch is unchanged (invariant 2).

  ## How (direction, not mandate)

  - The fix is the one launch line. `-i` and `--prompt-interactive` are
    the same option.
  - Step handler `specs/pipeline/steps/bl1845LocalSeatQwenInteractiveSteps.js`,
    registered in `specs/pipeline/steps/index.js` in the same commit as
    the feature's first green run (BL-233). Generate the launch script
    the way `bl1052LocalModelSeatSteps.js` `composeLaunchScript` does,
    in a mkdtemp fixture (`git init`, `rev-parse --git-common-dir`
    first, BL-1390). Read the qwen command's arguments with the shell's
    own quoting rules; a text search for "-i" alone also matches other
    flags.
  - Phrase the steps as this feature does, not as BL-1837's feature
    does: both handlers build the same launch script and must not
    register the same pattern unscoped (stepRegistry.js, BL-425).
  - This changes the swarm's own launch path. Route it to the primary
    coder, not coder@iq3 (STEERING, 2026-09-30).

  ## Scope

  `swarmforge/scripts/swarmforge.sh` (the local-model launch line), the
  step handler and its registration, evidence; the documenter's pages
  that describe how a local-model seat starts.

out_of_scope: |
  - qwen's own auto-update stays on (the human's ruling, source). An
    interactive qwen installs updates under `~/.qwen/updates/npm/` and
    runs them from its next launch; the seat runs qwen 0.24.7 from the
    first relaunch after c885d0c071.
  - The busy probe (`chase_sweep_lib.bb` `actively-processing?`) matches
    Claude's status line, not qwen's "(esc to cancel, Ns)", so a wake can
    be typed into a qwen turn in progress. What qwen does with it is
    observed in the procedure's live step d. If it misbehaves, that needs
    its own ticket.
  - The window budget (BL-1838), compression (BL-1840), thinking left on
    (BL-1841) and the local-seat health report (BL-1842).
  - The "@" in the card path (BL-1837): same launch line, builds after.
  - The `gemini)` branch passes its prompt the same way. No gemini seat is
    live, and gemini-cli's behaviour was not checked at mint.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1845-a-local-model-seats-qwen-runs-interactive-so-its-pane-shows-its-work-and-takes-typed-input.feature`:
     2 of 2 ok. Measured 0 at mint: no handler exists yet.
  2. `node specs/pipeline/cli.js` on the BL-1052, BL-1829 and BL-1801
     features, which also generate this launch script: 9 of 9, 3 of 3 and
     7 of 7 ok. Measured the same on main 9108e8ca51 at mint.
  After the land (the coordinator's or specifier's check at the next swarm
  launch, not QA's: launch scripts are written when the swarm launches):
  a. `.swarmforge/launch/coder@iq3.sh` hands the kickoff to qwen through
     `-i`.
  b. `tmux capture-pane -p -t 'swarmforge-coder@iq3'` shows qwen's
     interactive screen: its input box and its tool-call lines.
  c. After the seat ends a turn, its qwen process is still the same one
     (`ps -o etime` on it covers more than one turn), with no new
     RESUME-ON-START chat record.
  d. A wake handoffd delivers to coder@iq3 is followed by a
     `ready_for_next.sh` call in qwen's newest chat record under
     `~/.qwen/projects/-home-carillon-swarmforgevc--worktrees-coder-iq3/chats/`.
  e. A line the human types into the pane appears as a user message in
     that record.

