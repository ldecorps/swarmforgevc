human_approval: approved
approval_context: >
  A new feature file. The human asked for the input box (specifier pane,
  2026-09-30) and answered "Yed please" to minting this ticket, so there
  are no ruling_options. FIRM: the kickoff text is unchanged; only how it
  reaches qwen changes. FIRM: -y stays, so qwen still runs shell commands
  unattended. Accepted consequence: one qwen session now lasts across the
  seat's parcels until the pane is respawned, so its history grows across
  them. qwen's compression (BL-1840) and the window budget (BL-1838)
  govern that, not this ticket.

