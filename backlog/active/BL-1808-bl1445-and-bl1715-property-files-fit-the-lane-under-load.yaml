     4 of 4 ok (12.3 s).
     `node specs/pipeline/cli.js specs/features/BL-1445-the-staffing-gate-wiring-test-decides-the-override-itself.feature`:
     4 of 4 ok (9.1 s).
     `node specs/pipeline/cli.js specs/features/BL-1324-claude-seat-qwen-cloud-context-window.feature`:
     10 of 10 ok (10.7 s).
     `node specs/pipeline/cli.js specs/features/BL-1642-qa-approval-completes-on-note-evidence.feature`:
     8 of 9 ok; scenario 9 ("one shared seat-stage helper") red as the
