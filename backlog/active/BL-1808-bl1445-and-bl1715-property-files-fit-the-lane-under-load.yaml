description: |
  ## What is wrong

  QA note 003353, evidence 1db06f92 (BL-1806's review pass, ONE full
  `npm run test:properties` run on 0e31ce3adf, exit 1):
  - `bl1445StaffingGateWiringTestDecidesOverrideInvariants.property.test.js`
    > "BL-1445/BL-654 invariant 1: the wiring test decides
    PACK_STAFFING_SKIP_GATE and MODEL_STEWARD_STATE_DIR itself, never
    inheriting either from the pane": `Error: Test timed out in 20000ms.`
  - `bl1715DriverSeatGiveUp.property.test.js` > "invariants 1 and 2:
    revert-attempt-commits! reverts only the attempt, keeping the
    post-merge tree, over generated claim shapes and attempt chains":
    `Error: Test timed out in 20000ms.`
  Neither file was touched by BL-1806. Only closed tickets name either
  file (BL-1445, BL-1587, BL-1715, BL-1778), so both were unowned.

  ## Measured at mint (2026-09-29, main 6468594733, load 13-14)

  Both files together, alone (`npx vitest run --config
  vitest.properties.config.mjs <the two files>`): green, 36.6 s, 5 forks.
  Per test:
  - bl1445 invariant 1: 8069 ms. It runs the real wiring test 8 times in
    sequence (4 pane gate values x 2 state-dir shapes, an exhaustive
    sweep, not sampling). One run of the wiring test alone: 0.86 s.
    Invariant 2 (static text check): 3 ms.
  - bl1715 "invariants 1 and 2: revert-attempt-commits!": 17758 ms, 89%
    of the ceiling with only two files in the run. `numRuns: 60`, and
    every draw builds a fresh git fixture (init, commits, merges, up to 4
    attempt commits) and runs one `bb` process.
  - bl1715 "invariant 1b: given-up-task-names-in is seat-specific":
    9719 ms (30 draws x 3 `bb` processes). Not red yet; it is half the
    ceiling alone and the same shape, so it is in scope.
  - bl1715 "invariant 1b: worked-task-names-in never attributes":
    4945 ms; "invariant 1a": 3139 ms; the rest under 300 ms.
  Neither file declares a per-test timeout, so every test runs under
  `vitest.properties.config.mjs`'s `testTimeout: 20000`. In the full lane
  (5 forks contending, load ~14) 2-3x the solo time is enough to kill
  them. Same class as BL-1745 (bl1670/bl1108/bl1565), BL-1588, BL-1592,
  BL-1606.

  ## Consolidated 2026-09-29: bl1642 and bl1324 (QA note 003359)

  QA's full property run on BL-1790's parcel e177599d02 (evidence
  596cc1a8) found two more files red, neither touched by that parcel, and
  holds BL-1790 on them (Article 4.2):
  - `bl1642QaNoteEvidenceInvariants.property.test.js` > "property (BL-1642
    invariants 1 & 2): note evidence completes a QA forward, never another
    role's, and both kinds obey the same since/ticket-match rule":
    `Error: Test timed out in 20000ms.` (file 23.2 s in the lane).
  - `bl1324ClaudeSeatQwenCloudContextWindowInvariants.property.test.js`:
    vitest recorded the file `failed: true` at 22690 ms, but QA's excerpt
    did not reach its FAIL block, so the failing test and message were
    not captured. The coder's first run of the file in the lane must
    capture them and record them in the evidence.
  Measured at mint (both files together, alone, 2 forks, load 13-17):
  green, 9.7 s. bl1642 invariants 1 & 2: 8458 ms (12 draws through `bb`);
  bl1642 invariant 3: 952 ms. bl1324 invariant 3 (qwen seat remap, 8 + 8
  draws, each a `zsh -f` sourcing swarmforge.sh to write a launch script):
  6830 ms, the likely red; invariant 1 (git history walk from the hotfix):
  1259 ms; invariant 2: 61 ms. Neither file declares a timeout. Same
  shape as the two files above, so this ticket owns all four rather than
  minting one per file (BL-680 N:1; it was paused and unclaimed).

  ## What is wanted
  - Every test in both files completes inside the full property lane
    under contention. How (direction, not mandate): either cut the
    process count (the BL-1663/BL-1564 shape: decide many draws in one
    `bb` process through the lib, keeping one real per-draw wiring case),
    or declare a per-test budget through `propertyLaneTimeoutMs(<base>)`,
    with the base taken from a quiet-host measurement plus stated
    headroom. For bl1445 invariant 1 only the budget route (or running
    the 8 real child processes concurrently) keeps the real script per
    combination. Say in the evidence which was chosen for each test and
    why, with the before/after durations.
  - Assertions, generators, `numRuns`, the exhaustive 4x2 sweep and
    `assertReachFloor` calls stay as they are.

  ## Scope
  - `extension/test/bl1445StaffingGateWiringTestDecidesOverrideInvariants.property.test.js`,
    `extension/test/bl1715DriverSeatGiveUp.property.test.js`,
    `extension/test/bl1642QaNoteEvidenceInvariants.property.test.js`,
    `extension/test/bl1324ClaudeSeatQwenCloudContextWindowInvariants.property.test.js`
    (and a helper beside them if one is needed), plus evidence.

