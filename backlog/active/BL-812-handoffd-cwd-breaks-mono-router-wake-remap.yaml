description: |
  ## What

  handoffd is invoked as `bb handoffd.bb <project-root>` but often runs with
  process cwd = the launcher's home (verified live: cwd `/Users/ldecorps`).
  Mailbox delivery uses argv `project-root` and works. Wake remap does not:
  `handoff_lib/target-root` runs `git rev-parse --git-common-dir` from **cwd**,
  so `mono-router-resident-session` / `tmux-socket` / `wake-session` miss the
  real `.swarmforge/`. Resident looks absent → chase degrades to
  `:wake-own-session` → inject targets `swarmforge-architect` (etc.) which do
  not exist under mono-router → unbounded `chase-wake-error … tmux
  send-literal failed`. Depth cap 1 then blocks all promotion while the
  mid-pipeline ticket sits in a dormant mailbox → full swarm starve.

  ## Fix posture (specifier owns the contract; coder implements)

  Every handoffd caller of `wake-session`, `mono-router-resident-session`,
  `tmux-socket`, and `rotate-resident-to!` must resolve project-scoped state
  from the daemon's argv project-root (binding, parameter, or equivalent) —
  not from cwd-dependent `target-root` alone. Acceptance must prove the live
  failure mode (cwd ≠ project-root), not only the pure remap table that
  already passes when cwd is correct.

  ## Live evidence (2026-08-05)

  - BL-638 architect parcel waiting from 08:56:59Z while resident at coder
    NO_TASK; ~600+ `chase-wake-error architect`.
  - After manual rotate to architect, same storm on hardender/documenter once
    architect forwarded (parcel 11:17:00Z); handoffd cwd still home.
  - `lsof -p <handoffd-pid> -d cwd` → `/Users/ldecorps`.
  - From project cwd, `wake-session` remaps architect→coder and
    `rotate-resident-to!` succeeds; inject at `swarmforge-architect` fails
    with `can't find pane: swarmforge-architect`.

acceptance: specs/features/BL-812-handoffd-cwd-breaks-mono-router-wake-remap.feature

