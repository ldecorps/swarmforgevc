description: |
  ## What is wrong

  `./gradlew :app:testDebugUnitTest` through the acceptance handlers' own
  Gradle lib (`specs/pipeline/steps/lib/androidGradle.js`, portable JDK
  `.swarmforge/tooling/jdk-17`) on main 858f8fca6c, 2026-09-18 14:03
  local: `275 tests completed, 4 failed`, all in
  `com.swarmforge.floatcompanion.BridgeClientTest`
  (`android/app/build/test-results/testDebugUnitTest/TEST-...BridgeClientTest.xml`;
  in the lines below `[???]` stands for the three U+FFFD replacement
  characters the XML shows, one per byte of the em-dash, and `[-]` for
  the real em-dash U+2014):

  ```
  classifies a refused connection distinctly from an unresolvable host :: org.junit.ComparisonFailure: expected:<...nnect to the bridge [???] the tunnel may be d...> but was:<...nnect to the bridge [-] the tunnel may be d...>
  classifies an unresolvable host as a stale-pairing connection failure :: expected:<...ind the bridge host [???] pairing URL may be ...> but was:<...ind the bridge host [-] pairing URL may be ...>
  falls back to a generic io message for other io exceptions :: expected:<...ge connection error [???] the tunnel may be d...> but was:<...ge connection error [-] the tunnel may be d...>
  classifies a timeout distinctly from an unresolvable host :: expected:<...onnection timed out [???] the tunnel may be d...> but was:<...onnection timed out [-] the tunnel may be d...>
  ```

  Both sources carry the em-dash as the same three UTF-8 bytes
  (`e2 80 94`, checked with od in the test at line 24 and in
  `BridgeClient.kt`; the test file's blob is byte-identical to its last
  commit 1adc748a34, BL-864, 2026-08-13). The EXPECTED side - the test's
  literal - compiled into three replacement characters, one per byte: the
  compile that produced the test classes decoded the source with a
  single-byte charset. The ACTUAL side - production's literal - is intact:
  the main classes came from a compile that read UTF-8. Two compiles, two
  charsets, one repository.

  Why the charset can differ per compile: JDK 17 derives
  `file.encoding` from the locale (JEP 400 made UTF-8 the default only
  in 18). `android/gradle.properties` pins `-Dfile.encoding=UTF-8` in
  `org.gradle.jvmargs` - the Gradle daemon's JVM only. The Kotlin compile
  daemon is a separate JVM (`kotlin.daemon.jvmargs`, unset) and inherits
  the environment of whichever process first started it. The handlers'
  lib spawns gradlew with `env: { PATH, HOME }` and nothing else
  (`androidGradle.js:135-137`), so under the swarm's tmux session the
  daemons start with no `LANG` at all: the live Gradle daemon (pid 3853)
  and Kotlin daemon (pid 10395), both started 14:03 today by that lib,
  carry no LANG/LC_* in `/proc/<pid>/environ`. A test source set
  recompiled by such a daemon reads ASCII; main classes compiled earlier
  under a UTF-8 shell (QA's BL-829 pass on 2026-08-17 ran the suite green,
  48.6 s) stay up to date and keep their real em-dash. No Android source
  landed since 2026-09-01, so the recompile came from daemon or cache
  state, not from a change - which is exactly why this is a build defect,
  not a test defect: the outcome depends on which process compiled what,
  when.

  Blast radius, measured 2026-09-18 (one run each, the acceptance runner):
  BL-829's feature scenarios 03 [1-4] red; BL-825 0 ok / 6 not ok; BL-828
  0/8; BL-769 2/4; BL-826 0/6 - every landed feature that shells
  `testDebugUnitTest`, all failing at "Then it exercises ..." or "reports a
  passing result" on the same suite exit. Unseen for the same reason as
  BL-1626's four: no lane runs landed features (BL-1625).

  One hygiene finding in the same file: `BridgeClientTest.kt` line 96
  carries a RAW NUL byte inside a string literal (a control-character test
  input written as the byte itself), so `file` classifies the source as
  data and grep treats it as binary. Legal to kotlinc, hostile to every
  text tool; write it as the six-character escape backslash-u-0000 instead.

  ## What is wanted

  - Every JVM the Android build launches reads sources as UTF-8 whatever
    the locale: `org.gradle.jvmargs` keeps `-Dfile.encoding=UTF-8`,
    `kotlin.daemon.jvmargs` carries it too, and the app module's Java
    compile options set `encoding = "UTF-8"` (scenario 01, source checks).
  - The handlers' Gradle lib exports the environment it launches gradlew
    with, and that environment carries an explicit UTF-8 locale and
    `JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8`, which every JVM including
    the Kotlin daemon honours (scenario 02, the exported builder driven in
    milliseconds).
  - No Kotlin source under `android/app/src` contains a NUL byte or an
    invalid UTF-8 sequence, and the population checked is pinned
    (scenario 03: 70 `.kt` files on 2026-09-18 - re-count at build).
  - The reproduction and the fix in evidence; the suite 275/275 through
    the lib; the five features' JVM scenarios green (QA e2e).
  - The five register rows leave in this land.

  ## How (direction, not mandate)

  - `android/gradle.properties`: add `kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8`
    and `systemProp.file.encoding=UTF-8`. `android/app/build.gradle.kts`
    `compileOptions { encoding = "UTF-8" }` beside the existing block.
    If measurement shows kotlinc ignores `file.encoding` for source
    reading, the honest belt is the lib's `JAVA_TOOL_OPTIONS` plus locale
    - keep whichever the reproduction proves necessary, drop none that
    the invariant needs.
  - `androidGradle.js`: extract `buildGradleEnv(baseEnv)` returning
    `{ PATH, HOME, LANG: 'C.UTF-8', LC_ALL: 'C.UTF-8', JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF-8' }`
    (merged with any JAVA_HOME it resolves), export it, and use it in the
    spawn. Stop the live daemons once (`./gradlew --stop` and the Kotlin
    daemon) so the fixed environment is what starts the next ones -
    record the pids in evidence.
  - Reproduction (evidence, before the fix): `./gradlew --stop`; kill the
    Kotlin daemon; with `LANG=C LC_ALL=C` run `:app:compileDebugUnitTestKotlin --rerun-tasks`
    then `:app:testDebugUnitTest` with the main classes untouched -> the
    four failures; then the same under `LC_ALL=C.UTF-8` -> 275/275.
  - Scenario 03's handler walks `android/app/src/**/*.kt` as bytes,
    checks for a zero byte and decodes as strict UTF-8; prints the count.
  - `BridgeClientTest.kt:96`: replace the raw byte with the six-character escape backslash-u-0000 (the
    test's meaning unchanged).
  - Documenter: `docs/how-to/BL-769-android-jvm-unit-suite.md` gains the
    rule that the suite's charset is pinned in the build, never assumed
    from the shell, and the one-time daemon stop.

constraints: >
  android/gradle.properties, android/app/build.gradle.kts (one block),
  specs/pipeline/steps/lib/androidGradle.js, one escaped byte in
  BridgeClientTest.kt, the feature and handler, evidence and docs, five
  register rows. No test assertion, no production string, no other Kotlin
  source, no other feature changes. The step handler lands with the
  feature (BL-233). Evidence named BL-1635-*.

out_of_scope: |
  - BL-829's scenario 02 (BL-1634).
  - A lane that runs landed features or the JVM suite on a schedule
    (BL-1625).
  - Upgrading the portable JDK past 17 (JEP 400 would make the default
    UTF-8; the pin is still right).

qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `node -e "require('./specs/pipeline/steps/lib/androidGradle').runGradle(process.cwd(), [':app:testDebugUnitTest','--console=plain'])"`
     ONCE after the daemons were stopped -> BUILD SUCCESSFUL, 275 tests,
     0 failed; record the run's wall and the daemons' environ lines.
  2. Acceptance resolving all three scenarios
     (`bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1635-*.feature`).
  3. `bash specs/pipeline/scripts/run_acceptance.sh` ONCE each on
     BL-829, BL-825, BL-828, BL-769 and BL-826's features: every JVM-suite
     scenario passes (BL-829's scenario 02 depends on BL-1634). Never
     "run it N times".
  4. `bb swarmforge/scripts/standing_red_register_cli.bb .` names no row
     for any of the five features or the Kotlin test; `git diff
     main...HEAD --name-only` names the build files, the lib, the one
     Kotlin test, the feature, the handler, evidence, docs and the
     register only.

