qa_e2e_procedure: |
  The ticket's claim is that the old suite stayed green while the real
  script regressed — so prove the rewritten suite goes RED under exactly
  those regressions, then green on the real script:

  1. Clean run: `swarmforge/scripts/test/test_lifecycle_script_scope.sh`
     passes end to end on the parcel commit.
  2. Wording regression: in a scratch working-tree edit (never committed),
     change stop-swarm.sh:96's success line (e.g. back to "clean slate").
     Re-run the suite — the success-path scenario must now FAIL. Revert.
  3. kill_rc regression: delete or neuter the kill_rc refuse block
     (stop-swarm.sh:91-94), re-run — the kill_rc scenario must FAIL.
     Revert.
  4. Survivor regression: invert or short-circuit the survivor-scan refuse
     (stop-swarm.sh:84-89), re-run — the babysitterd and Operator
     scenarios must FAIL. Revert.
  5. Reimplementation audit: in the stop-path blocks of the test file, no
     inline re-derivation of the refuse/success branch remains; the only
     surviving direct `source .../stack_survivor_scan.sh` uses are the
     scanner unit cases (04a/05a/04b).
  6. BL-746's acceptance feature scenarios pass via their step handlers.

