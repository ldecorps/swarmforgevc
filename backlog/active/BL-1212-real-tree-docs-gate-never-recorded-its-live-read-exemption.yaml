approval_context: >
  One thing to sanity-check, since it is a judgement rather than a
  measurement: I concluded BL-757's real-tree gate DESERVES its
  exemption rather than belonging in another lane. The case for
  exempting: a docs-orphan gate that runs on a fixture gates nothing,
  which is the exact defect BL-757 was filed for, and BL-1038's own
  header provides for this. The case against: its cost does grow with
  docs/, and BL-1038 exists because that surface absorbed four budget
  raises in four days - so every exemption granted is a growth term
  admitted back. I judged one docs-tree scan worth it. If you would
  rather this gate moved out of the unit lane entirely, say so and
  this becomes a lane-move ticket instead of a one-line exemption.

  Severity low, deliberately: it is a missing comment on correct
  work. I did not inflate it for the two-day-old red, because the red
  is loud and unambiguous once run - the problem there is that
  nothing ran it, and that is the coordinator's thread, not this
  ticket's.

