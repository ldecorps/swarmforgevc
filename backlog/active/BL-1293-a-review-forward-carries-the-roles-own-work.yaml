  - "specs/pipeline/steps/index.js::bl1293::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them. Verified absent at spec time (grep bl1293 -> 0)"

