id: BL-1293
title: "The BL-806 review-forward evidence gate compares commit IDENTITY, so a bare merge passes it - the architect forwarded BL-1224 having produced no review output at all, and only a QA bounce caught it"
milestone: M8
type: defect
severity: high
# high: a required Article 4.1 gate can be skipped silently, and the thing that
# hides the skip is the commit shape this swarm produces most often. The
# structural backstop that exists to prevent it (BL-806) is shipped, wired, and
# blind to it. Caught twice in one session (BL-1224, BL-1183) and only by a
# human-authored QA bounce noticing a missing evidence file. Not critical:
# nothing is destroyed and QA did catch both, so the outer net held. Not medium:
# a gate that reports pass while its stage produced nothing is a broken safety
# signal, not a contained bug.
