invariants:
  - "The fixture root's observable lifetime is unchanged: one root per test, allocated inside makeFixture from each test body and swept after that test; never a beforeAll or module-scope allocation and never a shared or process-lifetime variant (BL-1280 invariant 1)."
  - "The fallback test's coverage posture survives: every test in it still reaches the real compiled night-closing-ceremony-run.js and the real swarmforge/scripts/consult_spawn_cli.bb with its real .bb dependency closure; no stub of either is introduced (the gap the hotfix closed, BL-1591's review premise)."

description: |
  ## What is wrong

  Hotfix `a27d082c2d` (2026-09-16, human, landed directly on main outside
  the pipeline) added
  `extension/test/nightClosingCeremonyRotateDocumenterFallback.test.js`,
  so no guard ran against it before it landed. Three guard files are red
  on main because of its fixture builder `makeFixture()`, called from
  each of the file's three `test()` bodies. The coder found the first in
  BL-1588's full-lane verification (note 00_20260916T093427Z_001976,
  evidence `backlog/evidence/BL-1588-coder-unowned-red-bl1280-20260916.md`
  in BL-1588's parcel); QA found all three holding BL-1510 under Article
  4.2 (note 00_20260916T094344Z_002783, evidence
  `backlog/evidence/BL-1510-QA-unowned-red-20260916.md` at ed1f739525);
  the specifier reproduced each on main at `bdb76c3c8a`, verbatim:

  1. `extension/test/bl1280MkdtempMigrationInvariants.property.test.js`
     (property lane), invariant 2, 1 failed / 5 passed, 1.14 s:
     ```
     Expected values to be strictly deep-equal:
     + [ { file: '.../nightClosingCeremonyRotateDocumenterFallback.test.js', line: 29 } ]
     - []
     ```
  2. `extension/test/tmpDirMigrationGuard.test.js` (unit lane), the BL-420
     real-tree scan at line 146:
     ```
     AssertionError: expected zero raw mkdtemp call sites, found:
     .../extension/test/nightClosingCeremonyRotateDocumenterFallback.test.js:29
     ```
  3. `extension/test/liveRepoDerivationGuard.test.js` (unit lane), the
     BL-1038 real-tree scan at line 295, 1 failed / 23 passed, 0.7 s:
     ```
     AssertionError: every live-repository derivation must read a pinned fixture or record why it cannot:
       nightClosingCeremonyRotateDocumenterFallback.test.js: enumerates a live repository directory (cost grows with repo size)
     ```

  Two defects in the one builder. Line 29:
  `const root = fs.mkdtempSync(path.join(os.tmpdir(), 'ncc-rotate-fallback-'));`
  - the raw call BL-420/BL-1280 migrated every other test away from; the
  file never removes the root, so three `ncc-rotate-fallback-*`
  directories leak into `os.tmpdir()` per run. Lines 54 to 59:
  `const scriptsDir = path.join(__dirname, '..', '..', 'swarmforge', 'scripts'); for (const name of fs.readdirSync(scriptsDir)) { if (name.endsWith('.bb')) symlink... }`
  - the exact growth term BL-1038 exists to stop (every new script in the
  repo makes this fixture slower forever; 200-plus symlinks per test
  body today). The hotfix's own comment chose the whole directory over
  "a hand-picked list that silently rots"; that concern is what
  `pinnedRepoFixture.js` answers by DERIVING the closure from load-file
  edges, and `consult_spawn_cli.bb` has four of them.

  No open ticket owns any of the three guard files for this defect. BL-1591
  (the hotfix's stamp-off review) names the fallback test as part of the
  landed diff it reviews and its notes now name this ticket as the owner of
  both fixes. The register carried no row for any of the three.

  ## What is wanted

  - The fallback test allocates its fixture root through `mkTmpDir` from
    `./helpers/tmpDir` and carries no raw `fs.mkdtempSync` call site; the
    raw-mkdtemp detector finds none in the file or anywhere in the tree
    (scenario 01), and the file allocates that root through `mkTmpDir`
    exactly once (scenario 02).
  - The fallback test builds its `swarmforge/scripts` from
    `consult_spawn_cli.bb`'s derived closure, so the BL-1038 detector finds
    no violation anywhere in the tree and the file records no
    `BL-1038-EXEMPT` marker (scenario 03).
  - The fallback test still passes, three of three, with the migrated
    fixture (scenario 04, about 1.4 s).
  - The three guard files green in their lanes (e2e) and the three
    register rows removed in the same land, with
    `bb swarmforge/scripts/standing_red_register_cli.bb .` reporting no
    row for any of them and `"unowned":[]`.

  ## How (direction, not mandate)

  - Root: `const { mkTmpDir } = require('./helpers/tmpDir');` and
    `const root = mkTmpDir('ncc-rotate-fallback-');` - the shape every
    other test in the directory uses
    (`extension/test/activateBounceWatcher.test.js:28`). The per-test
    variant is right because each `test()` builds its own root;
    `mkSharedTmpDir` and `mkProcessTmpDir` would keep three roots alive
    past their tests (invariant 1). The unit lane's `tmpDirSetup.js`
    afterEach does the removal; add no `rmSync`.
  - Scripts: `const { copyLiveScriptClosureInto } = require('./helpers/pinnedRepoFixture');`
    then `copyLiveScriptClosureInto(path.join(root, 'swarmforge', 'scripts'), ['consult_spawn_cli.bb'])`
    in place of the readdir-and-symlink loop
    (`extension/test/bl1091ExpeditePromotionCommit.property.test.js` is a
    consumer). The helper copies rather than symlinks; the CLI resolves its
    libs from its own script dir either way. Keep the stub
    `rotate_to_role.sh` written AFTER the closure so it is never
    overwritten. If the closure misses a runtime-loaded lib (a `load-file`
    the static walk cannot see), name that lib as a second entry point
    rather than falling back to the directory.
  - Scenario 01 and 03 handlers call the REAL detectors in process:
    `findRawMkdtempCallSites` from `extension/test/helpers/rawMkdtempGuard.js`
    and `findLiveRepoDerivations` from
    `extension/test/helpers/liveRepoDerivationGuard.js` (both re-export
    compiled `out/tools` code; compile first) - never a restated regex.
    Scenario 02's "exactly once" and scenario 03's "no exemption marker"
    pin the census (BL-1445): a fixture deleted or exempted also scans
    clean.
  - Documenter: nothing beyond the evidence file; no diagram trigger.

constraints: >
  One test file and evidence only; `extension/src` unchanged; the three
  guards, their exempt lists, tmpDir.js and pinnedRepoFixture.js
  unchanged. No assertion in the fallback test touched; the fixture keeps
  the stub rotate_to_role.sh, the fake tmux and the real CLI. No
  `BL-1038-EXEMPT` marker. The step handler lands with the feature
  (BL-233). The evidence file this parcel writes is named `BL-1593-*`,
  never `BL-1591-*`, `BL-1588-*` or `BL-1510-*`.

out_of_scope: |
  - Reviewing the hotfix's production diff (night-closing-ceremony-run.ts,
    consult_spawn_cli.bb, handoffd.bb): BL-1591's stamp-off.
  - Any other raw call site or live-repo derivation a future scan finds:
    its own unowned-red note.
  - The guards' exempt lists and detectors (BL-420, BL-1038, BL-1209,
    BL-1280).

qa_e2e_procedure: |
  On the parcel commit, from `extension/` after `npm run compile`:
  1. `npx vitest run --config vitest.properties.config.mjs test/bl1280MkdtempMigrationInvariants.property.test.js`
     -> 6 of 6 green.
  2. `npx vitest run test/tmpDirMigrationGuard.test.js test/liveRepoDerivationGuard.test.js`
     -> all green (the two real-tree scans return `[]`).
  3. `npx vitest run test/nightClosingCeremonyRotateDocumenterFallback.test.js`
     -> 3 of 3 green; `ls /tmp | grep -c ncc-rotate-fallback-` is
     unchanged before and after the run (no leak); `ls <fixture>/swarmforge/scripts`
     during a run, or the evidence's recorded listing, shows the closure
     (consult_spawn_cli.bb plus its libs), not 200-plus files.
  4. Acceptance resolving all four scenarios
     (`swarmforge/scripts/run_acceptance.sh specs/features/BL-1593-*.feature`).
  5. `git diff <parent>..<parcel> -- extension/test/nightClosingCeremonyRotateDocumenterFallback.test.js`
     touches only the require lines, the allocation line and the
     scripts-dir block; no `assert` line changes; no `BL-1038-EXEMPT`.
  6. The evidence records each guard's failure text verbatim before the
     change and the green runs after.
  7. `bb swarmforge/scripts/standing_red_register_cli.bb .` after landing
     reports no row for any of the three guard files and `"unowned":[]`.

