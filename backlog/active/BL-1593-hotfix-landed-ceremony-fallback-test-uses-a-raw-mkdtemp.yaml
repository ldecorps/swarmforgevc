notes: |
  Minted 2026-09-16 by the specifier while completing the coder's
  unowned-red note (bdb76c3c8a, one row: the bl1280 property guard) and
  AMENDED the same morning while completing QA's Article 4.2 hold note on
  BL-1510, which showed the same file trips the BL-420 unit guard and the
  BL-1038 live-repo guard too: now three register rows in
  backlog/standing-reds.tsv name this ticket, the feature gained the
  live-repo scenario, and QA was sent the resume note (BL-1566 shape) the
  same pass; the coordinator was told. Amended before any human tap, so
  the approval ask covers the amended scope (approval_context says so).
  Shares the fallback test file with BL-1591 (stamp-off of the same
  hotfix): not orthogonal, do not co-activate (Article 3.2.3); this one is
  expedited and small, so it lands first, and BL-1591's notes tell its
  coder not to touch the fixture builder. Not folded into BL-1591: that
  ticket is approved with its feature file reviewed, and adding scenarios
  there would need a re-pend that posts no fresh ask (BL-1455). INVEST:
  Independent (helpers and guards exist, no unbuilt sibling), Negotiable
  (only the variant and the closure instrument are fixed, by the file's
  own structure and BL-1038's own rule), Valuable (three health-signal
  guards stop being the normal red, a tmpdir leak stops, and a
  repo-size growth term leaves a fixture), Estimable (two require lines,
  one allocation line, one block swap, one sitting), Small (four
  scenarios, two invariants), Testable (the real detectors in process,
  one 1.4 s runner - BL-1541). Severity high per the standing-red rule,
  not medium.

