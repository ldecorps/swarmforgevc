approval_context: >
  Sibling of BL-1206, minted rather than folded into it for the same reason
  BL-1200 was minted beside BL-1196: BL-1206 is already human-approved, its
  scope is explicitly the 13 PROPERTY-lane files and the property allowlist,
  and it enumerates them by name. This is a distinct, larger set in the unit
  lane with no allowlist involved. Each lands independently.

  What is worth your eye: this ticket asserts the two lanes' files are not
  merely uncollected but genuinely UNRUN, and BL-1206's own severity comment
  says the opposite ("the 13 files' assertions do run and pass under
  node:test's own runner"). That sentence appears to be false — measured
  2026-08-28, `npm test` runs `scripts/recordTestDuration.js`, which spawns
  Vitest and nothing else, and that file's own BL-124 comment reads "the suite
  now runs under Vitest (node --test can no longer run the...)". There is no
  `node --test` invocation in package.json or in swarmforge/scripts. BL-1206
  has been amended in the same pass to correct its rationale and severity; if
  you know of a runner this sweep missed, say so and both corrections should
  be reverted together.

  Ten of these 25 files ALSO carry BL-1221's defect. Repairing collection here
  will make those ten start failing on `deps.checkOrphanedAuthoredDocs is not
  a function` instead of failing to collect. That is progress, not a
  regression, and it is called out in out_of_scope so QA does not read it as
  one.
description: |
  ## What

  Remove `const { test } = require('node:test');` (and any `describe`/`it`
  imported the same way) from the 25 main-lane `extension/test/*.test.js`
  files that carry it, so those bindings resolve to the ones
  `extension/vitest.config.mjs` already provides via `globals: true`. Do not
  otherwise rewrite the tests.

  The 25, measured 2026-08-28:

      benchmarkNodeTestEvaluator.test.js   nightClosingCeremonyLive.test.js
      bl1147ProbeLegacyTopicAdoption.test.js  nightClosingCeremonyRun.test.js
      bl1150OutageFailoverCliLoadFileSafe.test.js  operatorPostmortem.test.js
      contextTelemetryProducer.test.js     pendingApprovalsAnnouncement.test.js
      crossFileDuplicationCheck.test.js    perHatRolePromptEvidenceCheck.test.js
      devBounceLib.test.js                 pilotAcceptanceGate.test.js
      hostActivityFeed.test.js             pilotMkdtempConventionCheck.test.js
      humanLoopReliability.test.js         pilotScopedCrapCheck.test.js
      multiBranchParserCoverageCheck.test.js  propertyGeneratorReachCheck.test.js
      multiworktreeAcceptanceFixture.test.js  shellEntryPointDriveCheck.test.js
      nightClosingCeremony.test.js         telegramCursorBridgePilot.test.js
      nightClosingCeremonyGate.test.js     transcriptWalker.test.js
      unreachableStepHandlerCheck.test.js

  Add one guard test, scoped to the unit lane's own glob, that fails when a
  file matching `test/*.test.js` (excluding `*.property.test.js`) imports from
  `node:test`. The guard is deliberately lane-scoped so this ticket stays
  independent of BL-1206; widening it to the property glob is a one-line
  follow-up once BL-1206 lands, and belongs to whichever lands second.

  ## Why this is worse than a red

  A file importing `test` from `node:test` declares its tests to a runner
  Vitest is not, so Vitest collects nothing from it and reports
  `No test suite found in file ...`. Verified directly on
  `crossFileDuplicationCheck.test.js`: `1 failed`, `Tests no tests`.

  The part that matters is what does NOT then happen. **Nothing in this
  repository runs `node --test`.** `npm test` is
  `npm run compile && node scripts/recordTestDuration.js`, and that script
  spawns `node_modules/.bin/vitest run` — its own comment at line 41 records
  why: "BL-124: the suite now runs under Vitest (node --test can no longer run
  the...)". So these 25 files' assertions have not executed at all since
  BL-124. They are read as coverage by every role that greps for a test
  covering a module, and they cover nothing.

  This is also, concretely, a large slice of the standing unit red that every
  role is currently told to normalize past (QA measured 206 failures across 47
  files on 2026-08-28 and had to diagnose all 47 by hand to clear an unrelated
  ticket). Draining these 25 makes the next role's "is this mine?" question
  cheaper, which is the second reason to do it.

  ## How (direction, not mandate)

  The import line is the whole defect; deleting it is expected to be
  sufficient, because `globals: true` already supplies the same names. Where a
  file's assertions then fail for a real reason, that failure is a finding to
  report, not something to paper over — see the constraint below.

  ## Constraints

  - **A file that will not pass is not to be allowlisted, skipped, or deleted
    to clear the lane.** If removing the import reveals a genuine failure,
    report it (with the file and the reason) and leave that file's import
    removed and failing, or bounce it as a finding. Silencing is the one
    outcome this ticket must not produce — an allowlist is how the property
    lane's identical 13 became invisible in the first place.
  - Do not rewrite assertions, restructure suites, or migrate any file to a
    different test style beyond removing the import.
  - Do not touch the 13 property-lane files or
    `property_suite_standing_allowlist.tsv` — that is BL-1206.

qa_e2e_procedure: >
  (1) `cd extension && npx vitest run test/crossFileDuplicationCheck.test.js`
  — before the fix this reports `No test suite found in file`; after it,
  a non-zero number of tests is collected and runs. (2) For all 25 named
  files, confirm each now collects at least one test:
  `npx vitest run <the 25 paths>` and check the reported test count is greater
  than zero for every file, with no file reporting "no tests". (3) Confirm the
  full unit suite's failing-FILE count dropped by at least 15 versus the
  pre-change baseline — at least, because ten of the 25 are expected to remain
  red on BL-1221's separate defect, and that is the correct outcome here.
  (4) Confirm the new guard fails on a deliberately reintroduced
  `require('node:test')` in a scratch main-lane file, and passes once removed.
  (5) Confirm the guard does NOT fire on the 13 property-lane files, which are
  out of scope and still carry the import. (6) `grep -rn "node:test"
  extension/test/*.test.js` excluding property files returns nothing but the
  guard's own reference to the string.

out_of_scope: |
  - The 13 property-lane files and the property standing allowlist — BL-1206,
    approved and paused. Same root cause, different lane, lands independently.
  - BL-1221's `deps.checkOrphanedAuthoredDocs` stub gap. Ten of this ticket's
    25 files carry both defects and will move from "fails to collect" to
    "collects, then throws on the missing dep" once this lands. That is the
    expected intermediate state and must not be read as a regression caused
    here, nor fixed here.
  - The other diagnosed members of the standing unit red: the ambient
    `CURSOR_API_KEY` gap (infra-environment, ~10 files), and the assorted
    repo-hygiene guard reds (`constitutionDocCitations`, `tmpDirMigrationGuard`,
    `tempDirTrapGuard`, `socketFixtureShortRootGuard`, `liveRepoDerivationGuard`).
    Separate causes, separately owned.
  - Adding a unit-lane standing allowlist. This ticket removes reds by
    repairing them; it must not introduce the mechanism that hid the property
    lane's copy of this same defect.

invariants:
  - "No file in the unit lane declares its tests to a runner the lane does not execute — every test declared in extension/test/*.test.js is collected and run by Vitest."
  - "A test file contributing zero collected tests fails its lane; it is never allowlisted, skipped, or deleted into a pass."
  - "A repaired file reports the same number of tests it declared under the node:test runner — a repair that silently drops assertions is a regression, not a fix."

