id: BL-1220
title: "Twenty-five main-lane test files import test from node:test, fail Vitest collection, and their assertions therefore run nowhere at all"
milestone: M8
type: defect
severity: high
# high: a broken safety signal, not merely a red. These files are counted as
# test coverage by everyone who reads the suite, and none of their assertions
# has executed since the lane moved to Vitest. Nothing in this repository runs
# `node --test` (see the description), so there is no second runner picking
# them up. Contrast BL-1206, whose 13 property-lane files are the same shape
# but allowlisted: same darkness, different visibility.
