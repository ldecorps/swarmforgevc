id: BL-1103
title: "The wall-clock-bounded subprocess runner exists twice, hand-copied trap for hand-copied trap: fold expedite_cli.bb's sh-bounded and babysitter_check.bb's run-bounded! into one shared lib both source"
milestone: M8
type: chore
status: todo
assigned_to: coder
epic: swarm-reliability
priority: 40
direction: swarm-reported
depends_on: [BL-1030, BL-1071]
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1103-one-shared-bounded-runner.feature

required_wiring:
  - 'swarmforge/scripts/expedite_cli.bb::bounded_run_lib.bb::the expeditor must source the shared runner, not keep its own sh-bounded copy'
  - 'swarmforge/scripts/babysitter_check.bb::bounded_run_lib.bb::the babysitter must source the shared runner, not keep its own run-bounded! copy'

human_approval: approved
approval_context: >
  Nothing about the extraction itself needs a ruling - the two copies are the
  same function and BL-571 already records this hand-copy shape as a defect
  class. The one decision is the new lib's NAME, because it is pinned in this
  ticket's required_wiring and so must be settled before the coder starts:
  the direction below is swarmforge/scripts/bounded_run_lib.bb, following the
  daemon_cycle_guard_lib.bb / control_plane_lib.bb convention. Say so here if
  it should instead live inside daemon_cycle_guard_lib.bb, which already owns
  the daemon's other bounded shell-out - that would be one fewer file but
  would give the expeditor a dependency on the daemon-guard lib it has so far
  deliberately avoided.

invariants:
  - "Both callers reach the same implementation - after this lands, no second copy of the group-kill or the no-deref-after-timeout logic exists in the tree."
  - "Each caller's observable behaviour is unchanged: same bound, same result shape, same env seam overriding it."

description: >
  WHAT. `swarmforge/scripts/expedite_cli.bb` line 62 defines a private
  `sh-bounded`; `swarmforge/scripts/babysitter_check.bb` line 903 (landing via
  BL-1071) defines `run-bounded!`, written by mirroring the first's docstring.
  Fold them into one shared lib that both `load-file`.

  WHY. Both carry the same two traps, each recorded because a first
  implementation got it wrong: `.destroyForcibly` kills only the DIRECT child,
  so the command is wrapped in `setsid` and the whole group killed with
  `kill -KILL -- -<pgid>` (the `--` is load-bearing and its absence is silent);
  and dereferencing a destroyed process BLOCKS while a surviving grandchild
  holds the stdout pipe, so output goes to files and a timed-out process is
  never deref'd. Two copies means the next person to fix one of those fixes it
  in one place - the BL-571 hand-copy shape, already documented across six
  sites.

  CONSTRAINTS. Both callers are in flight as this is written, which is why the
  coder deliberately did NOT extract it during BL-1071: `expedite_cli.bb` is
  being edited by BL-1030, and `babysitter_check.bb`'s copy arrives with
  BL-1071 itself. This ticket depends on both landing - Concurrent Work
  Orthogonality, not a preference. Note the coder's note names the expedite
  side `run-bounded!`; on every branch in the tree it is actually the private
  `sh-bounded`, so grep for both names before assuming a rename happened.

  HOW (direction, not mandate). One new `swarmforge/scripts/bounded_run_lib.bb`
  holding the runner and its docstring traps, sourced by both callers with the
  `load-file` idiom the other libs use. Keep each caller's existing bound
  default and its env seam; this is an extraction, not a re-parameterisation.
  Do not fold in `daemon_cycle_guard_lib/sh!` - that is a different contract
  (a returned result map, not a timed-out? flag) and BL-1102 is separately
  changing it.

qa_e2e_procedure: >
  (1) Grep the tree for the group-kill and no-deref-after-timeout logic and
  confirm exactly one implementation remains. (2) Run the expeditor's own
  suites and the babysitter's shell and Babashka suites; both green.
  (3) Exercise the bound live on each caller: give the expeditor a stop command
  that sleeps past its bound and confirm the whole group dies and the run
  reports the bound expiring; do the same for the babysitter's ensure via
  BABYSITTER_ENSURE_TIMEOUT_MS. (4) Confirm `ps` shows no orphaned child from
  either run.

