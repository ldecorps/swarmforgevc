  ## Every intake measurement re-verified at mint, none taken on trust

  - `PER_WORKER_HEAP_MB = 1280`, `SAFE_HOST_RAM_FRACTION = 0.5`,
    `MAX_WORKERS = 6` - all three at
    `extension/src/tools/vitest-worker-memory-budget.ts` lines 20-26.
  - `resolveWorkerPoolSize` takes `min(ceiling, safeCount)`, so the override
    returned by `resolveVitestForkCeiling` is clamped by RAM afterwards. This
    is the mechanism behind "override 8/12/16 all resolve to 7".
  - This host measures 20 cores and 19904 MB, so `safeCount` is 7 and the
    default pool is 6. Both numbers reproduce exactly.
  - `extension/vitest.properties.config.mjs` already reads
    `process.env.SWARMFORGE_VITEST_MAX_FORKS` and passes it as `override`.
    The env var is wired; it is the clamp downstream of it that defeats it.
  - 305 property files under `extension/test/*.property.test.js`.

  ## One correction to the intake's own diagnosis, recorded so it is not
  ## re-derived

  The intake reads as though the RAM model alone produces the 6. It does not:
  6 is `MAX_WORKERS`, the CPU ceiling, and RAM independently allows 7. That is
  why option 1 raises no default - lowering the heap reservation moves
  `safeCount` from 7 to 15 but `min(6, 15)` is still 6. Only option 2 moves
  the default. The intake's own "so the default lands at ~cores/2 here" needs
  the ceiling raised as well, which is why that is written as its own option
  rather than folded into the first.

  ## Why this is not merged into BL-1336

  BL-1336 touches the same file and the intake suggests folding. It should not
  be. BL-1336 is already human-approved with a recorded `human_ruling`, its
  `out_of_scope` explicitly excludes the RAM floor and the MAX_WORKERS
  baseline, and one of its invariants is that the memory-derived size REMAINS
  the binding cap - which options 2 and 3 here would contradict. Folding would
  silently rewrite an approved ruling. They are sequenced instead, and they
  overlap on one file, so the coordinator should not co-promote them
  (Concurrent Work Orthogonality). Whichever lands second merges first.

  ## Why there is no required_wiring

  Deliberate, and recorded so its absence does not read as an oversight. The
  mechanism has no new call site: `resolveVitestWorkerPool` is already the
  live composition point and both `extension/vitest.config.mjs` and
  `extension/vitest.properties.config.mjs` already call it. An anchor on
  either would match identically before and after the fix and would gate
  nothing (BL-1235). An anchor on the acceptance handler's own registration
  would be satisfied by this parcel's own diff, and is unnecessary anyway
  because `acceptance:` points at a real `.feature` from the start - the
  runner throws on an unregistered scenario, so the acceptance run is itself
  the gate.

  ## On the acceptance file's three IR-DRY findings

  Three medium-confidence findings remain, all of the same shape: the outline
  step with its `<placeholder>` paired against scenario 02's concrete
  instance. Reviewed and deliberately kept. Scenario 02 asserts a BOUND (at
  least one, and within the safe fraction) rather than a value, because the
  value depends on which option is ruled - so it cannot join the outline
  without pinning a number this ticket has no authority to pin yet.

