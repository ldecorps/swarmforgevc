approval_context: >
  Re-pended 2026-09-06 - DELIBERATELY, not an erased approval. Your ruling
  of 2026-09-02 (56e56a0a49) chose option 2: lower the heap reservation
  and raise the default ceiling to the host's cores. The coder built
  exactly that and measured it on this host before forwarding: with no
  override the pool becomes 15 (was 6), and two back-to-back full property
  runs failed 4 then 16 files - almost all git- or bb-spawning property
  tests timing out at 20 s while 15 forks contend with the live swarm
  (load average 12-13 from the other role sessions). Each victim passes
  alone; the set of victims differs every run, so bumping timeouts does not
  converge, and BL-1407's rerun net shares one 180 s ceiling that sixteen
  files cannot fit. The pre-ticket default of 6 was an incidental safety
  net on a full-forge Linux host; the darwin full-forge rule (ceiling 1)
  never fires on Linux. Memory is not the constraint - shared cores are.
  The question is which shape you want on THIS host, where the swarm is
  always running. B is recommended: it honours "use the cores this host
  has" as cores the host has free, backs off while the swarm is busy, and
  keeps one composition point for both lanes. Whatever you pick, BL-1349
  (the 79 s longest file) remains the binding half of the wall clock, and
  no option reaches 40-50 s while it stands. The feature gains one
  Examples row for full-forge on linux once you rule.
ruling_options:
  - A - full-forge keeps a fixed default on every platform (darwin 1, linux 6, today's number); the cores-following default applies to other packs; an explicit override still wins up to the RAM budget
  - B (recommended) - the default ceiling follows the cores the host has FREE, cores minus the 5-minute load average, floor 1 and cap cores, passed in by both configs through the one composition point; override still wins up to RAM
  - C - full-forge on linux gets a static half-cores default (10 here), darwin stays 1; other packs follow cores; override wins up to RAM
  - D - ship as ruled, pool 15 here; the timeouts are BL-1349's and BL-1407's to absorb (measured 16 files red on the second run)

invariants:
  - "Both vitest lanes size their pool through the single resolveVitestWorkerPool composition point: neither lane gains a sizing route the other does not share (BL-935 invariant 3)."
  - "A resolved pool is never smaller than one worker, whatever the host RAM and whatever the override."
  - "The existing full-forge-on-darwin ceiling of one is unchanged by this ticket."

description: |
  ## What is wrong

  `resolveVitestWorkerPool` (`extension/src/tools/vitest-worker-memory-budget.ts`)
  composes two independent caps and returns the smaller:

      safeCount = floor(hostRamMB * SAFE_HOST_RAM_FRACTION / PER_WORKER_HEAP_MB)
      pool      = max(1, min(ceiling, safeCount))

  with `PER_WORKER_HEAP_MB = 1280`, `SAFE_HOST_RAM_FRACTION = 0.5` and
  `MAX_WORKERS = 6` as the default ceiling. Verified on this host
  (20 cores, 19904 MB): `safeCount` is `floor(9952 / 1280)` = 7, the ceiling
  is 6, so the pool is 6.

  The CPU ceiling is what binds the DEFAULT. The RAM reservation is what binds
  an OVERRIDE: `resolveVitestForkCeiling` returns an explicit
  `SWARMFORGE_VITEST_MAX_FORKS` unchanged, but `resolveWorkerPoolSize` then
  takes `min(override, 7)`. So 8, 12 and 16 all resolve to 7 - measured, and
  the reason the env var appears not to work.

  The reservation itself is the stale part. Sampled every 2 s through a full
  `npm run test:properties`: peak 298 MB for the largest fork, 1.26 GB for all
  forks together, 14 GB still available. The model over-reserves by roughly
  four times. It was sized against the reference 15360 MB host of the BL-422
  OOM incident and has not been re-measured since.

  ## How (direction, not mandate)

  Whichever option is chosen, the change belongs inside the one
  `resolveVitestWorkerPool` composition BL-935 established, not in a second
  route added beside it. If the per-worker figure moves, derive it from the
  measured peak with real margin rather than picking a round number - 298 MB
  observed argues for something near 640, not for removing the cap.

constraints: >
  - Stay inside the single resolveVitestWorkerPool composition point. Adding
    router or host logic to one lane only would break BL-935 invariant 3
    rather than extend it.
  - Do not remove the memory budget. Whichever option is chosen, a host that
    genuinely cannot fit the pool must still be protected, and under option 3
    the budget must still be computed and reported even though it no longer
    clamps.
  - Leave the full-forge + darwin ceiling of 1 alone.
  - Keep the module free of process.env and os reads. Every environment input
    is passed in by the caller today, which is what makes it unit-testable.

qa_e2e_procedure: >
  Unit-level first, since the whole mechanism is a pure function. Call
  resolveVitestWorkerPool with each row of the acceptance Examples table and
  confirm the resolved pool, including that full-forge on darwin is still 1.
  Then confirm the clamp is genuinely gone in the direction the ruling chose -
  at the parent commit, SWARMFORGE_VITEST_MAX_FORKS=12 on a 19904 MB host
  resolves to 7, which is the defect. Then live - from extension/, run
  `SWARMFORGE_VITEST_MAX_FORKS=12 npm run test:properties` and confirm from
  the run's own reporting that twelve forks were used, that the suite's
  pass/fail verdict is unchanged from the parent commit, and that the host
  does not swap. Finally run `npm test` under the same override and confirm
  both lanes report the same resolved pool size, which is BL-935 invariant 3
  observed rather than asserted.

out_of_scope: |
  - The property lane's spawn-heavy files and its 79 s longest file. That is
    BL-1349, and it is the half that actually binds the lane's wall clock.
  - The router-rotation CPU ceiling. That is BL-1336, already approved with a
    human ruling, and it deliberately leaves the RAM model alone.
  - Stryker's pool, which hardcodes threads with maxThreads 1 and is
    independent of this mechanism.

