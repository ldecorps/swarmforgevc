  human's "Do get the missing slice minted"). The raw intake is removed
  from the backlog root in the mint commit.
  The split, with every slice recording the intake it came from:
  - BL-1901 (this): the merge-path land, the core of ruling A.
  - BL-1902: reverse-hop copies and QA's merge-up send retire, once the
    cleaner and hardender run in task mode.
  - BL-1903: a bounce reverts nothing, and check_bounce_revert_scope.sh
    (with its deferred wrong-ticket naming) retires.
  - Stays on BL-1870 as its remaining line: deleting the land step's
    rebuild machinery (own-path replay, strays, abandoned_commits, the
    LAND_ESCALATE conditions, the post-land re-point, most of
    land_step_lib.bb). Not minted now. Its size depends on which of those
    paths still fire once this merge path runs, and minting it now would
    fail INVEST Estimable. Its trigger is this ticket's land records:
    mint it when 20 consecutive lands record the merge path.
  Amendment 2026-10-02, specifier ruling on QA note 003735 ("BL-1901
  spec-gap: merge path skips BL-1631 own-row retire; see QA evidence
  776fb"): decline to the land step rather than give the merge path its
  own registry writer, so one implementation of the register rules exists
  until BL-1870's deletion slice moves it. The parcel's feature carries
  the hardener's mutation stamp, so the feature is NOT edited on main
  (BL-1385). The coder adds these two scenarios inside the parcel, after
  scenario 03, and their handler steps in bl1901CleanLineLandsAsAMergeSteps:

    # BL-1901 a-land-never-leaves-the-owners-row-04
    Scenario: a land never leaves the landing ticket's own register row on origin/main
      Given origin/main's backlog/standing-reds.tsv carries a row owned by BL-9001
      And the lander queue holds an entry for BL-9001 whose line carries only BL-9001 commits on top of origin/main
      When the lander sweep runs until the queue is empty
      Then BL-9001's work is on origin/main
      And origin/main's backlog/standing-reds.tsv has no row owned by BL-9001

    # BL-1901 a-land-keeps-another-open-tickets-row-05
    Scenario: a land never drops another open ticket's register row from origin/main
      Given origin/main's backlog/standing-reds.tsv carries a row owned by BL-9002, an open ticket
      And the lander queue holds an entry for BL-9001 whose line deletes that row
      When the lander sweep runs until the queue is empty
      Then BL-9001's work is on origin/main
      And origin/main's backlog/standing-reds.tsv still has the row owned by BL-9002

  In 05 BL-9002 is open when a backlog/paused/BL-9002-*.yaml exists in the
  fixture, which is what qa_hold_lib's open-ticket-ids-for reads. Not run
  at amendment (no handler exists yet). Expected red on the parcel commit
  2bceb52e48: its merge path accepts both lines and publishes them as-is,
  per QA's evidence "Spec gap" and land_merge_path_lib.bb's line check,
  which reads subjects and parents, never registry content. Run both
  against 2bceb52e48 first and record the red in evidence, so the
  scenarios are shown to gate. If the land step does not publish 05's line
  at all, send the specifier a note; do not weaken the Then.
  Promotion is the coordinator's. BL-1870 carries the human's "Prioritize
  this work." (2026-10-01), and the 2026-09-30 promotion restriction
  names local-llm work and high/critical defects.

