description: |
  ## What is wanted

  Measured at mint: the 53 land records written on 2026-10-01 and
  2026-10-02 all name a rebuilt commit (commit differs from source). Since
  BL-1678 the land step's `land-plan` rebuilds a parcel's own paths onto
  origin/main by cherry-pick even when nothing is entangled, and
  BL-1887's land took an hour. Ruling A's "landing is merge origin/main
  and fast-forward push" was never built.

  - When the lander starts a queued land, it first checks the line from
    origin/main to the queued commit. The line is clean when every commit
    on it either names the landing ticket and no other in its subject, or
    is a merge whose other parent is already on origin/main.
  - A clean line lands in the lander's own worktree: merge origin/main
    into the queued commit (no merge when it already contains origin/main),
    then push fast-forward to origin/main. The commit-msg guards run on
    the merge as they do today. The land record names the ticket, the
    published commit, the queued commit as source, and the path
    (`merge`). It also tells the coordinator, exactly as a land-step land
    does.
  - Any other line, and a clean line whose merge conflicts or whose push
    loses a race it cannot redo by merging again, runs the land step
    exactly as today. Its record names the `land-step` path.
  - The step handler `bl1901CleanLineLandsAsAMergeSteps`, registered in
    the same parcel. BL-1872's lander steps are scoped to its own feature,
    so this handler defines its own.
  - Amended 2026-10-02 (QA spec-gap note 003735, evidence 10781b1004):
    the land step runs a registry pass that the merge path has no
    equivalent of. land_step_lib.bb's restore-other-tickets-registry-rows!
    retires the landing ticket's own rows (BL-1631) and restores an open
    other ticket's row that the line lacks (BL-1604), in standing-reds.tsv,
    the property allowlist and suite-poles.tsv. Publishing the line as-is
    leaves an owner's row on main, where it reads UNOWNED once the ticket
    closes and throttles intake (BL-1429). The merge path declines to the
    land step whenever that pass would change the merged tree, that is,
    when rows-to-retire or rows-to-restore is non-empty for any registry.
    Direction, not mandate: reuse land_step_lib.bb's registry-specs,
    rows-to-retire and rows-to-restore (expose them), never a second
    definition. Scenarios 04 and 05 (text in notes) pin the outcome on
    origin/main, not the path, so they stay true when BL-1870's deletion
    slice moves the pass.

  ## Scope

  lander_lib.bb (or a lib it calls), the land record writer, their bb
  tests, the step handler, the lander how-to, evidence.

  ## Out of scope

  Deleting or changing the land step (BL-1870's remaining line). QA's
  queue command. Which parcels arrive clean: that depends on the cleaner
  and hardender running in task mode (BL-1902).

qa_e2e_procedure: |
  On the parcel commit:
  1. ONE run: `node specs/pipeline/cli.js specs/features/BL-1901-a-clean-parcel-line-lands-as-a-merge-of-origin-main.feature`:
     all ok.
  2. `node specs/pipeline/cli.js specs/features/BL-1872-the-lander-daemon-lands-what-qa-approves.feature`:
     all ok (8 of 8 at mint).
  3. After the land, read `.swarmforge/land-approvals/` for the next lands:
     a [coder, qa] stamp-off, whose line is origin/main plus coder and QA
     commits, should record the merge path.

