id: BL-946
title: "EPIC_ICON_POOL holds 10 musical/performance glyphs against 39 distinct epics, so every epic past the tenth shares an icon and the concierge tick logs pool exhaustion on every pass"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarmforge-console
human_approval: approved
priority: 40
direction: human-directed
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-946-epic-icon-pool-wider-stock-set.feature

invariants:
  - "Every EPIC_ICON_POOL member is present in the live getForumTopicIconStickers set. An absent glyph fails SILENTLY - syncTopicIcon returns 'skipped-unresolved-icon' and the topic simply stays unbadged, with no error logged anywhere - so nothing downstream will ever report a bad pick."
  - "EPIC_ICON_POOL is disjoint from the values of ICON_EMOJI, STANDING_TOPIC_ICON and ROLE_TOPIC_ICON, and carries no glyph that reads as one of theirs at badge size. KNOWN_EPIC_ICON's pinned glyphs are the deliberate exception: they are pool members by design."
  - "resolveEpicIcon stays pure and total - no I/O, never throws, and still returns a usable icon when the pool is exhausted. Its callers include a live tick that must not be able to crash on an unusual epic id."

description: >
  Architecture Rule 6 required a Telegram epic topic icon to be "the closest
  stock PERFORMANCE sticker". The human amended that rule on 2026-08-19: the
  Telegram surface now draws from the WHOLE stock `getForumTopicIconStickers`
  set. The amendment is already landed in
  `swarmforge/constitution/articles/local-engineering.prompt` and its
  reference article; this ticket brings the code to it.

  What is wrong today. `extension/src/concierge/epicIcon.ts` exports
  `EPIC_ICON_POOL` with 10 glyphs. Measured 2026-08-19, the backlog carries
  29 distinct epics across `active/` + `paused/` + `hold/`, and 39 counting
  `done/` - done epics can still own live topics. So `resolveEpicIcon` falls
  through to its graceful-reuse tail for roughly three epics in four: they
  are all assigned the pool's last icon, which is precisely the collision the
  pool exists to prevent. `resolveAllEpicIcons` in `conciergeTick.ts` then
  logs one exhaustion line per overflowing epic on every tick.

  Why the pool could not simply be enlarged before. The old rule confined
  picks to the musical/performance corner of the stock set - about 14 glyphs
  of the 112 (census stamped 2026-07-15 in `docs/branding/icon-system.md`
  §5a, not re-measured for this ticket). The pool already held 10 of them,
  the musical note is reserved for ticket-state `feature`, its double-note
  sibling is excluded because it reads as that note at badge size, and the
  rest were taken by standing-topic and role-topic picks. The reachable ceiling was about 12
  against 39 epics: distinct-icon-per-epic was unreachable by construction.

  Dropping the musical restriction lifts that ceiling. Subtracting the ~17
  glyphs reserved across the three other icon tables leaves on the order of
  95 candidates - comfortably above 39, with room for the epics still to
  come.

  How (direction, not mandate). The obvious implementation is to enlarge the
  literal array, and that is acceptable. Consider instead DERIVING the pool -
  a committed snapshot of the live sticker set, minus the reserved tables and
  the badge-size exclusions, in a stable order. Deriving it is what makes
  invariant 1 true by construction rather than by care, and hand-picking is
  the exact step that bounced BL-469 twice on 2026-07-17 (glyphs absent from
  the live set, then glyphs colliding with the epic pool). Either way the
  module stays pure: no I/O in `epicIcon.ts`, live validation stays
  `syncTopicIcon`'s job.

constraints: >
  Preserve these behaviours exactly - they are load-bearing and already
  gated by BL-449/BL-457:

  - `KNOWN_EPIC_ICON`'s three pinned epics (role-benchmarking, dynamic-routing,
    onboarding-target-repo) keep their exact glyphs. They were finalised with
    the human on 2026-07-16 and must survive any reordering of the pool.
  - `isKnownEpic` keeps letting a caller reserve pinned glyphs before handing
    pool icons to unknown epics.
  - The graceful-reuse tail stays. A pool large enough that exhaustion never
    fires in practice is still not a pool that may throw when it does.
  - The badge-size exclusion stays and generalises: the pool holds no glyph
    that reads as another table's icon at badge size. The existing case is the
    musical note pair.

  Out of scope:

  - Any change to `ICON_EMOJI`, `STANDING_TOPIC_ICON` or `ROLE_TOPIC_ICON`.
    Those tables are the fixed points this ticket avoids colliding with.
  - Re-verifying the 112-sticker census itself, or building a tool to refresh
    it on a schedule. The stock set changes rarely; a drift check is separate
    work and is noted below.
  - Updating `docs/branding/icon-system.md` §5a, whose sticker census and
    ceiling-of-12 arithmetic this amendment makes stale. That doc is not on
    `main` at all - BL-945 is landing it, unchanged, and explicitly forbids
    touching icon behaviour. Refreshing §5a is a follow-up that can only be
    written once BL-945 has landed, and must not be folded in here.
  - A hash-to-icon assignment strategy. The intake offered it as an
    alternative; it is not one. Hashing changes WHICH icon repeats when the
    pool is too small, it does not create icons. Recorded here so it is not
    re-proposed.

qa_e2e_procedure: >
  From `extension/` (never the repo root):

  1. Reproduce before the fix: check out the received commit's parent and
     confirm `EPIC_ICON_POOL.length` is 10, then resolve the 39 distinct epic
     ids from the backlog in one pass and confirm the assignments collapse -
     many epics share the pool's last glyph.
  2. Run the acceptance feature and confirm all scenarios pass (8 cases:
     01, 02, 04, 05, 06 and 03's three outline rows).
  3. Run the standing extension suite (`npm test`) and confirm the pool
     guards execute as part of it, not only when invoked by name.
  4. Prove each guard bites, then revert. Add a duplicate entry to the pool
     and confirm scenario 02's check fails naming the repeated glyph.
     Separately, add `ICON_EMOJI.done` ("white check mark") to the pool and
     confirm scenario 03's ICON_EMOJI row fails naming the collision. `git
     restore` after each and confirm green.
  5. Confirm invariant 1 against the LIVE set, which no unit test can do.
     With the bot token in the extension-host environment, fetch
     `getForumTopicIconStickers` once and confirm every pool glyph resolves
     to a sticker id - `resolveIconStickerId` returning undefined for any
     entry is a fail, and it is a SILENT one in production, so this step is
     the only place it can be caught. Record the count checked.
  6. Confirm invariant 3: resolve an epic id containing unusual characters
     and an empty-string epic id; both must return a glyph and neither may
     throw.
  7. Confirm the pinned glyphs survived: resolve each of the three known epic
     ids and confirm they still return their 2026-07-16 glyphs, including
     when every other pool icon is already assigned.
  8. `git show --stat`: expect `epicIcon.ts`, its tests, this ticket's
     feature file and step handler, and at most the snapshot data file if the
     derived approach was taken. No change to `topicIcon.ts`'s three tables,
     and no change to `docs/branding/`.

notes: >
  Source: the operator intake `backlog/INTAKE-epic-icon-pool-scale-up.md`,
  drained 2026-08-19. The intake's remaining-work directives, verbatim:

    "Expand `EPIC_ICON_POOL` with more distinct emoji that render well at
    badge size and don't collide with existing ticket-state icons
    (`ICON_EMOJI`) or `STANDING_TOPIC_ICON`/`ROLE_TOPIC_ICON`."

    "Alternatively, consider a deterministic hash-to-icon strategy so the
    pool never exhausts."

  The first is this ticket. The second is answered in the constraints above
  and deliberately not built.

  The intake also recorded a hotfix: "`resolveAllEpicIcons` in
  `conciergeTick.ts` now emits a single summary line per tick instead of
  per-epic. This stops the log spam and CPU waste." That change is real but
  is NOT committed - it sits uncommitted in the shared master checkout and is
  not recorded in `backlog/hotfix-ledger.yaml`. It is surfaced to the
  coordinator, not swept into this parcel; whoever wrote it should land it.
  If it has been lost by the time this ticket is implemented, the coder need
  not restore it: a pool sized above the epic count means the exhaustion
  branch stops firing regardless.

  Blocked on a human question from 2026-08-19 until the answer arrived:
  "Broaden beyond musical emoji - use the wider stock set, amend Architecture
  Rule 6." The amendment half is landed; this is the code half.

  Follow-up, not minted (it would depend on an unbuilt sibling): once BL-945
  lands `docs/branding/icon-system.md` on `main`, §5a's sticker census and
  its ceiling-of-12 arithmetic need refreshing to match the amended Rule 6.

approval_context: >
  The direction is settled by your 2026-08-19 answer and is already
  implemented in the constitution. Two sub-choices I made on your behalf are
  worth a glance before this goes to the coder.

  First, scope of the broadening. I read "wider stock set" as the TELEGRAM
  surface only, and left the owned orchestra FORM marks on the
  PWA/fleet-console/bot-avatar surfaces musical. Those are drawn SVG assets,
  not stock emoji, so no platform ceiling applies to them and the brand
  reading survives where it actually lands. If you meant to retire the
  musical vocabulary everywhere, say so and I will amend Rule 6 again - it is
  a one-line change to the half I deliberately kept.

  Second, the size threshold. I set the acceptance bar at 60 pool icons: 39
  distinct epics exist today counting done/, and ~95 stock glyphs are
  available after the reserved tables are subtracted. 60 clears today's count
  with half again in headroom without claiming most of the set. Say a number
  if you want a different one.

