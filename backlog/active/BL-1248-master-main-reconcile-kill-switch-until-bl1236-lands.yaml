description: >
  Severity rationale: critical - data loss, already realised twelve times.
  The reconcile sweep has discarded local ahead commits repeatedly; on
  2026-08-28 it destroyed a human ruling three minutes after it was
  committed and one minute before QA merged, so BL-1230 shipped and closed
  against the pre-ruling contract with no bounce and no signal. This ticket
  is the stopgap that stops the bleeding, and it also gates a restart: the
  sweep does not fire while the swarm is down, so the next start-swarm is
  exactly when the hazard rearms.

  The human directive this ticket exists to execute, verbatim from
  .swarmforge/operator/role-answers/specifier.json (recorded 2026-08-28
  12:16:17Z, in answer to the specifier role_ask asking what stops the reset
  bleeding until BL-1236 lands):

  > Disable the master-main-reconcile sweep until BL-1236 lands

  Verified at mint that the directive cannot be carried out today, rather
  than assumed: handoffd.bb wires (run-sweep! "master-main-reconcile-sweep"
  #(master-main-reconcile-sweep!)) unconditionally into its cadence block at
  line 4063, master-main-reconcile-sweep! at line 3280 has no enable guard,
  and grepping swarmforge.conf for "reconcile" finds only BL-920's
  escalation-threshold key. There is no enable/disable key anywhere:
  grep -rn "master_main_reconcile_enabled" over swarmforge/ and
  extension/src/ returns nothing. A backlog grep across paused, active, hold
  and done found no ticket owning this either, so the directive has been sat
  unexecuted since 12:16Z.

  Why the switch and not just the fix: BL-1236 IS the fix (its
  merge-tree-reports-conflict? greps git merge-tree CONTENT for the word
  "CONFLICT", which this repo's backlog prose contains constantly, so the
  predicate fires on ordinary activity rather than on rare divergence). At
  mint BL-1236 sat in backlog/paused/ with human_approval: pending, so it
  could not be promoted, routed, or worked, and this ticket was made
  deliberately independent of it so the bleeding stopped on the earlier of
  the two.

  THAT PREMISE HAS EXPIRED - BL-1236 LANDED FIRST (deprecator freshness
  amendment, specifier stage of the expedite re-run, 2026-08-28 ~17:05).
  871f2fa85 replaced the text-search predicate with git merge-tree
  --write-tree's own exit-code verdict at BOTH call sites that carried it,
  2b3c796d1 merged it, and 112027d99 closed the ticket into backlog/done/.
  The condition this switch names for turning itself back on is therefore
  already satisfied on the day the switch ships.

  The switch is still wanted and is still UNBUILT on main: grepping
  master_main_reconcile_enabled over origin/main's swarmforge/ and
  extension/ returns nothing, so BL-1236's landing did not incidentally
  deliver a lever. Two independent reasons to finish it rather than retire
  it. First, the value of an operator-facing on/off switch for a sweep that
  rewrites refs does not depend on which defect prompted it - BL-1236 fixed
  one predicate, it did not make the sweep non-destructive. Second,
  BL-1236's fix has never run in production: the swarm is down under the
  BL-1191 ops hold, so the corrected predicate is untested against live
  traffic, and the next start-swarm rearms a sweep with thirteen realised
  commit losses behind it and zero production runs of its fix in front of
  it.

  What is wanted: a config key master_main_reconcile_enabled, consulted
  before the sweep does anything, failing closed to disabled on every value
  that is not an explicit affirmative, shipped set to false with BL-1236
  named as the condition for turning it back on - and, per the freshness
  amendment above, that conf comment must ALSO record that BL-1236 has now
  landed and that the flip is BL-1251's operator decision, so the shipped
  comment does not read as a standing invitation to enable the sweep
  unreviewed. The literal token "BL-1236" stays in the conf and the line
  stays an active `config master_main_reconcile_enabled false`, so scenario
  04 and its step handler are unchanged by this wording change. And a
  daemon log line when a tick skips the sweep by config (a silently-absent
  sweep is how nobody notices it is still on, or still off, months later).
  The key name is
  specified because it is an operator-facing contract; mirror BL-920's
  escalation-threshold parse in master_main_reconcile_lib.bb (parse-
  escalation-threshold, line ~398) for the parse.

  Guard placement is NOT free, and the obvious seam is the wrong one
  (corrected at specifier stage of the expedite run, 2026-08-28; the mint
  had named the handoffd call site and that contradicts this ticket's own
  firm constraint below). handoffd.bb:3280 injects :surface! and :escalate!
  INTO master-main-reconcile-lib/sweep!, so the human-notification paths
  fire from inside the very call at line 4063. Guarding that call site would
  silence drift logging, dirty-blocked surfacing and escalation along with
  the reconcile - the exact "going quiet about divergence" the constraints
  forbid. Put the guard instead at the :should-reconcile branch inside
  sweep! (lib line ~790), skipping only ((:merge! adapters)) - which is the
  destructive path, the one dispatching BL-1214's absorb/reset plans - and
  logging the config skip there. Everything above that branch (rev-counts,
  drift-report, the drift log line, :up-to-date, :dirty-blocked and its
  surface!/escalate!) keeps running untouched. Scenario 05 gates this: it
  fails if the guard is put at the call site.

constraints: >
  Out of scope / firm lines:

  - Do NOT fix the conflict predicate here. That is BL-1236, it is a
    different slice, and it has ALREADY LANDED (871f2fa85, closed
    112027d99) - so there is nothing left here to fix and any predicate
    change in this parcel is now a straight out-of-scope diff, not merely
    a scope widening. At mint this line read "widening this one would make
    the stopgap wait on the approval that is blocking the fix"; that
    coupling is gone, the boundary is not.
  - Do NOT flip the shipped value to true in this parcel, even though
    BL-1236 has landed and the conf comment's stated re-enable condition is
    therefore satisfied. Re-arming a sweep with thirteen realised commit
    losses, on the day its fix landed and before that fix has run in
    production even once, is an operator decision - it is BL-1251, minted
    alongside this amendment with human_approval: pending. Shipping OFF is
    the reversible direction and costs one config line to undo, which is
    the whole point of building a switch.
  - Do NOT default the key to enabled, and do not treat an absent key as
    enabled. The dangerous state must be reachable only by an explicit
    operator affirmative; absent, empty and malformed all mean off.
  - Do NOT remove or comment out the sweep call site. The sweep must stay
    wired and switchable, so that turning it back on after BL-1236 lands is
    a one-line config edit rather than a code revert.
  - Do NOT touch the push-sweep, post-qa-branch-sweep, main-sync-deadlock
    sweep or any other member of the same cadence block. One sweep, one
    switch.
  - The switch governs the reconcile sweep only; it must not suppress the
    escalation or surfacing paths that tell a human main and origin have
    diverged. Going quiet about divergence is a different failure from
    declining to act on it.

qa_e2e_procedure: >
  1. Scenario 01: for each of the five values (true, false, absent, empty,
     the word banana) run one daemon cadence tick against a fixture root and
     assert the sweep ran only for true. Fixture, not the live repo.
  2. Scenario 02, the one that matters: in a fixture repo, put local main
     one commit ahead of origin with that commit reachable from no other
     ref, switch off, run a tick, and assert the commit is still reachable
     from main afterwards - by rev-list, not by the absence of a log line.
     Then flip the switch on and confirm the fixture is one that WOULD have
     been reset, so the off case is not vacuously green.
  3. Scenario 03: assert the skip log line is present with the switch off
     and absent with it on.
  4. Scenario 04: read the shipped swarmforge/swarmforge.conf and assert the
     key is present, set to false, and carries BL-1236 as the named
     condition for re-enabling.
  5. Scenario 05, the anti-overreach case: in a fixture whose local main and
     origin have diverged with local changes blocking a merge, switch OFF and
     run a tick, then assert the drift log line AND the surfaced divergence
     note are both still produced. This is the scenario that fails if the
     guard was placed at handoffd's call site instead of at the
     :should-reconcile branch, so do not accept a green here that was
     obtained by asserting only the absence of a reset.
  6. Both invariants carry coder-authored property tests per BL-654:
     invariant 1 fuzzes tick state and asserts main reachability is never
     reduced while off; invariant 2 fuzzes the config value and asserts
     disabled for every string but the affirmative.
  7. Do not verify any part of this against the live repo checkout. The
     behaviour under test is the one that destroys commits.

