approval_context: >
  You already ruled on this - "Exempt git-ignored dirs (tmp/) by
  construction", 2026-08-28, asked and answered while BL-1230 was at architect
  review. What needs your sign-off is only that a NEW ticket is the right
  vehicle: the amendment I committed to BL-1230 was destroyed by a
  reset-to-origin minutes later, and BL-1230 reached QA, landed and closed
  without it. A closed ticket is not the place to describe unbuilt work, so
  the ruling is carried here instead. Nothing about the ruling itself is
  re-opened, and if you would rather BL-1230 were reopened than a new ticket
  minted, say so and I will do that instead.

  Firm, from your original ruling and unchanged: the exemption is derived from
