id: BL-1578
title: "Three property files under extension/test assert a reach floor over a population they only sample and are flaky red on main with no owner: bl1529ScriptSenderAuditOutcomesInvariant draws outcome kind x stage uniformly for 20 runs and asserts each kind reached 5 (a kind lands under 5 about 1 run in 70), meanTicketTimeCost draws the corpus regime 50/50 for 12 runs and asserts the large regime reached 2 (1 run in 270), and bl622TelegramTokenSeparationInvariant constructs a token collision the subject swarm only sees when exactly two names were drawn (no genuine collision in 30 draws about 1 run in 600); each floor is met by construction on every run and stays asserted at its value"
milestone: M8
type: defect
severity: high
# high: a standing red on main in the property lane is a broken safety
# signal at first sighting (Article 3.2.4, 2026-09-05); QA withheld BL-1509
# on these reds under Article 4.2. Same class as BL-1555, BL-1559, BL-1572.
status: todo
epic: code-quality-gates
priority: 8
direction: swarm-reported
depends_on: []
mutation_cost: low
# low: test-file changes only, the shared reachFloors helper already
# exists (BL-1062/BL-1555); no production code, no Stryker target.
slice_size_envelope: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]

acceptance: specs/features/BL-1578-three-sampled-reach-floors-are-constructed.feature

required_wiring:
  - 'specs/pipeline/steps/bl1578SampledReachFloorsConstructedSteps.js::registerSteps::the handler lands in the same parcel as the feature (BL-233, BL-1371)'
# No production anchor on purpose (BL-1235): the three test files and the
