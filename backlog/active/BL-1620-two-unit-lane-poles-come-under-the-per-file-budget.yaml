invariants:
  - "No test is deleted, skipped or excluded: each file's test count at the parcel is greater than or equal to its count at the received commit."
  - "Under-budget is measured, never asserted: three recorded solo runs under 7000 ms at a 1-minute load below 8, and one recorded in-suite duration from npm test beside them; the register row leaves only in BL-1633's land (amended 2026-09-18)."

description: |
  ## What is wrong

  BL-791's slice D ("the poles, per file, once BL-1598's register owns
  them") has sat unminted since 2026-09-16 while the human asks why the
  swarm runs tests for hours. `backlog/suite-poles.tsv` (BL-1598) names
  nine files over the 7000 ms budget, owned by the epic with "cut work not
  yet minted". The two largest - `bl968StepRegistryMaterializedTreeGuard.test.js`
  69.9 s and `telegramFrontDeskBotCli.test.js` 65.3 s - are 135 s of the
  nine's 273 s. Both are the shapes slice B named: a guard that walks the
  live repository (BL-1038) and a CLI test that spawns real processes per
  case (BL-1039).

  ## What is wanted (amended 2026-09-17, see notes)

  - `extension/test/telegramFrontDeskBotCli.test.js` under 7000 ms in
    three consecutive `npm test` runs at a 1-minute load below 8, test
    count equal or higher, nothing skipped (scenario 01; invariants 1-2).
  - Its suite-poles.tsv row STAYS, re-owned by BL-1633 on main (amended
    2026-09-18, see notes): the per-file gate reads the file's IN-SUITE
    duration from npm test's own report (10-11 forks), which the hardener
    measured at 8.0-19.7 s across eight runs at load below 8 while the
    file is 3.7-5.0 s alone, and a file with no row at or above 1.5x the
    budget refuses the run - so removing the row makes npm test red on
    most runs for everyone. The parcel's evidence records one real npm
    test run's in-suite duration for the file beside the three solo runs;
    the guard, run against that duration and the register as it stands,
    reports no new-pole and no unowned-row for the file (scenario 02).
    bl968's row moved to BL-1629 on 2026-09-17; this row leaves in
    BL-1633's land, once the gate confirms a suspected pole alone before
    refusing.
  - The cause named in evidence with the pattern that replaced it
    (scenario 03): every call to `enqueueRoleAnswerNote` starts a real
    `bb swarm_handoff.bb` process (about 1.3 s each; the BL-1203 tests
    call it twice by construction) - replaced by an injected exec
    function, the file's own `postFn` convention, with the real call as
    the default.

  ## How (direction, not mandate)

  - `enqueueRoleAnswerNote(targetPath, role, text, updateId?, runHandoff?)`
    in `extension/src/tools/telegram-front-desk-bot.ts`: one optional
    trailing parameter whose default is today's
    `execFileAsync('bb', [cli, draftPath], {...})` (line 1844) - an
    injected side effect, never a `*_FORCE_RESULT` env (engineering.prompt
    "CLI main() is a thin wrapper"). Every production caller is unchanged.
  - In the test file, the BL-1203 and BL-607 cases (the ten slowest, 95
    percent of the file) pass a fake that records `[cli, draftPath, opts]`
    and resolves; their assertions read the recorded draft path and the
    role-answer file exactly as they read the real queue today. BL-1518's
    test keeps the real `bb` (it proves the real script's refusal and
    delivery). `runCli`/`runCliSubprocess` are already in-process where
    they can be - unchanged.
  - Profile before and after with `npx vitest run <file> --reporter=json`;
    evidence names the per-file ms from the JSON report at the same load
    band, and the ten tests' before/after.
  - Documenter: BL-791's how-to gains the entry; nothing else.

constraints: >
  The test file, evidence, and ONE production change (no change to
  backlog/suite-poles.tsv: its row is re-owned by BL-1633 on main - merge
  main and KEEP the row, resolving the parcel's earlier deletion in main's
  favour; amended 2026-09-18): the optional injected exec parameter on
  enqueueRoleAnswerNote with the current call as its default (amended
  2026-09-17 - the original "no production code" made the file's budget
  unreachable, coder evidence). No other production code, no config, no
  budget or register rule change. The step handler lands with the feature
  (BL-233). Evidence named BL-1620-*.

out_of_scope: |
  - bl968StepRegistryMaterializedTreeGuard.test.js: its two full registry
    loads cost 13-19 s each by construction; it is an accepted pole under
    BL-1629 (register disposition) and cheaper only through BL-1630 (the
    registry load's own cost). Its blind temp-dir sweep goes with BL-1629.
  - The other seven poles and the watch file (BL-791 slice D, next cuts).
  - bl1277UnscopedStepCollisionGuard's 20 s timeout red (BL-1607 active).
  - The bb cold-start cost itself (about 1.3 s per swarm_handoff.bb run,
    paid by every live send): a BL-791 question in its own right.

qa_e2e_procedure: |
  On the parcel commit, from `extension/`, at a 1-minute load below 8:
  1. `npx vitest run test/telegramFrontDeskBotCli.test.js --reporter=json`
     three times, sequentially -> under 7000 ms each, 275 or more tests,
     none skipped; the BL-1518 test still runs the real script (its own
     duration about 2.5 s is expected).
  2. `npm test` once -> the file is reported as a registered pole under
     BL-1633 (or under budget), never new-pole and never unowned-row; its
     in-suite ms from extension/.vitest-report.json is recorded in the
     evidence beside the three solo runs and the host's 1-minute load;
     its row is PRESENT in backlog/suite-poles.tsv with ticket BL-1633
     (amended 2026-09-18).
  3. Acceptance resolving all scenarios
     (`bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1620-*.feature`).
  4. `git diff main...HEAD --name-only` names the test file, the one
     production file, the register, evidence and docs only; the production
     diff adds one optional parameter and no other behaviour.

