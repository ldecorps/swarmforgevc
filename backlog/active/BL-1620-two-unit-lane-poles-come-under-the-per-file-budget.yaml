  this ticket: BL-1629 makes it an accepted pole (a register disposition
  BL-1598 lacks), BL-1630 cuts the registry load itself (twelve handlers
  carry 10.5 of the 12.6 s; six sweep the temp dir at module load). The
  approved FIRMs hold for the file that stays (no test lost, measured
  under-budget, its row leaves with the land); bl968's row moves to
  BL-1629 in the amendment commit instead of leaving here - the human
  may reject in the topic. Scenario 01's Examples lose the bl968 row.
  The Work note coder@2 completed at 14:00Z is the closed trail; the
  coordinator re-routes this ticket as a fresh Work note (BL-1415: a
  dropped trail routes without --force). The 12:10Z note above about
  bl968's blind sweep now belongs to BL-1629.

  Amended 2026-09-18 09:1xZ by the specifier on the hardener's spec-gap
