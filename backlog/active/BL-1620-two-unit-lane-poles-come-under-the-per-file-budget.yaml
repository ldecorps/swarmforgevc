  Your 2026-09-17 ask, the cutting half for the unit lane: the epic's slice
  D exists since 2026-09-16 and was not minted; this is its first cut, the
  two largest files. FIRM: no test deleted, skipped or excluded; test count
  per file may only rise (BL-791's own rule). FIRM: under-budget is
  measured (three runs under 7000 ms at load below 8), never asserted.
  FIRM: the two register rows move to this ticket now and leave with its
  land (BL-1598: a surviving row reads stale). AMENDED 2026-09-18 by the
  specifier (hardener spec-gap note 001390): the telegramFrontDeskBotCli
  row does NOT leave with this land - it is re-owned by BL-1633 and leaves
  there - because the premise in the FIRM is false under the measure the
  gate actually reads: a surviving row reads stale only under 80 percent
  of budget, and the file's in-suite duration is 8-20 s, not its 4-5 s
