description: |
  ## What is wrong

  BL-791's slice D ("the poles, per file, once BL-1598's register owns
  them") has sat unminted since 2026-09-16 while the human asks why the
  swarm runs tests for hours. `backlog/suite-poles.tsv` (BL-1598) names
  nine files over the 7000 ms budget, owned by the epic with "cut work not
  yet minted". The two largest - `bl968StepRegistryMaterializedTreeGuard.test.js`
  69.9 s and `telegramFrontDeskBotCli.test.js` 65.3 s - are 135 s of the
  nine's 273 s. Both are the shapes slice B named: a guard that walks the
  live repository (BL-1038) and a CLI test that spawns real processes per
  case (BL-1039).

  ## What is wanted

  - Both files under 7000 ms in three consecutive `npm test` runs at a
    1-minute load below 8, test count equal or higher, nothing skipped
    (scenario 01; invariants 1-2).
  - Their suite-poles.tsv rows, moved to BL-1620 at mint (this commit),
    removed in the same land; the verdict prints no new-pole and no
    stale-row for them (scenario 02).
  - The cause per file named in evidence with the pattern that replaced it
    (scenario 03): a materialized fixture tree instead of the live repo, an
    in-process CLI main with stubbed cwd/argv instead of a spawned node per
    case (engineering.prompt "CLI main() is a thin wrapper").

  ## How (direction, not mandate)

  - Profile each file alone (`npx vitest run <file> --reporter=json`) to
    find the per-test cost; the epic's slice B tickets (BL-1038, BL-1039)
    show the two remedies. Keep every assertion; add a shared fixture
    builder only if both files need it.
  - Evidence names the before/after per-file ms from the JSON report at the
    same load band.
  - Documenter: BL-791's how-to gains the two entries; nothing else.

constraints: >
  The two test files, any fixture helper they gain, backlog/suite-poles.tsv
  rows, evidence. No production code, no config, no budget or register
  rule change. The step handler lands with the feature (BL-233). Evidence
  named BL-1620-*.

out_of_scope: |
  - The other seven poles and the watch file (BL-791 slice D, next cuts -
    minted one or two files at a time as this one lands).
  - bl1277UnscopedStepCollisionGuard's 20 s timeout red (BL-1600 landed;
    BL-1607 active).

qa_e2e_procedure: |
  On the parcel commit, from extension/:
  1. Acceptance resolving all scenarios
     (`bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1620-*.feature`).
  2. `npm test` once (the three-run measurement is the parcel's own, in its
     evidence): the verdict line shows no new-pole and no stale-row for
     either file; `backlog/suite-poles.tsv` has no row for either.
  3. `git diff <received>..<parcel> --stat` touches only the two test
     files, any helper, the register and evidence.

