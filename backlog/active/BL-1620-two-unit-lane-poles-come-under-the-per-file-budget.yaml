  2026-09-17 12:10Z (specifier, BL-1623 mint): bl968StepRegistryMaterializedTreeGuard.test.js
  is the unit lane's one blind temp-dir sweep (`readdirSync(os.tmpdir())`
  by prefix, no owner pid) - the shape that made bl1309 red under a
  concurrent lane today. The cut this ticket makes to that file takes
  the sweep with it: build the roots as `<prefix><process.pid>-` and
  sweep through tmpDir.js's `sweepStaleTmpDirs` once BL-1623 lands, or
  the pid-guarded loop inline if this lands first. Not a new scenario;
  recorded so the two parcels do not both edit the file.

  Amended 2026-09-17 14:10Z by the specifier on coder@2's note 000009
  ("neither named remedy applies to either file", evidence
  BL-1620-coder-investigation-20260917.md in .worktrees/coder2): both
  remedies the mint named were already in place, and the measured cost
  is elsewhere. telegramFrontDeskBotCli: ten tests, 21.8 of 22.9 s, each
  starting one or two real bb processes through enqueueRoleAnswerNote -
  reachable only with a production seam, so the "no production code"
