id: BL-1861
title: "The local LLM leaves the running swarm and frees the GPU - local_llm.sh <root> remove takes every local-model seat out of every roster copy, stops its session, unloads the model those seats name from the model server (which keeps running for an outside task), reports every parcel they hold, and records what it took out in .swarmforge/local-llm/removed.json, while every Claude seat keeps working"
