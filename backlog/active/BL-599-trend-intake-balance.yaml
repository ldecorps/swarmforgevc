source: |
  Human, 2026-07-23, epic BL-594. ~15 tickets were filed in one session; is
  the swarm shipping faster than it is being fed? deliveryMetrics tracks
  velocity (closes) but not intake, so net backlog trajectory is unmeasured.

description: |
  Add an intake-vs-drain series: per day, tickets ADDED to the backlog
  (new BL-*.yaml appearing in active/paused, or the backlog root INTAKE-*.md)
  vs tickets CLOSED (moved to done/), and the running net (backlog growing or
  shrinking).

  Data source is the same git-history-of-backlog-moves deliveryMetrics /
  gitHistoryAdapter already read for velocity - this ADDS the intake side of
  the ledger, it does not build a second history reader. A file first
  appearing under backlog/ is an intake event; a file moving to backlog/done/
  is a close event; the net is their difference over a window, plotted through
  trend.ts.

  Value: answers "are we keeping up" directly, and feeds BL-591's ETA - a
  backlog that grows faster than it drains means every epic's ETA is receding,
  which a velocity-only view hides.

  ## Reuse (specifier, 2026-08-15; still binding)

  `notDoneBurndown.ts` and `deliveryMetrics.ts` already share
  `deriveTicketLifecycles` / intake-balance helpers from BL-896 work. Extend or
  extract — do not add a third remaining-count implementation. Requirement 3
  (backlog-root `INTAKE-*.md` as intake) is implemented in
  `deriveIntakeBalanceEvents`; wire acceptance scenarios to prove it.

qa_e2e_procedure: >
  (1) Fixture git history → filed/closed/net per window via deriveIntakeBalanceEvents
  and computeIntakeBalance. (2) Pure aggregator unit tests green without live git.
  (3) INTAKE-*.md counts; epic paths excluded. (4) trend.ts net series with
  current/prior/delta. (5) computeDeliveryMetrics exposes intakeBalance.

out_of_scope: |
  - Velocity/burndown of closes (deliveryMetrics owns those); this adds the
    intake counterpart and the net.
  - Briefing PNG rendering (notDoneBurndown owns email surface).

notes: |
  ## Most of this aggregator already exists — reuse it (specifier, 2026-08-15)

  The morning-briefing chart landed as `14724edae7` brought
  `extension/src/metrics/notDoneBurndown.ts`'s `computeNotDoneBurndownSeries`,
  which already derives, from the same `deriveTicketLifecycles` adapter this
  ticket names: per-day `filed` and `closed` counts, and in aggregate
  `totalFiled` / `totalClosed` / `mintPerDay` / `closePerDay` / `net`. That is
  requirement 1 and most of requirement 2 already written.

  The two tickets are NOT merged, because the surfaces differ — that one
  renders a PNG into the briefing email, this one feeds `trend.ts` and the
  PWA. But whoever builds this must extend or extract from that function
  rather than write a third remaining-count implementation; there are already
  two (`deliveryMetrics.ts`'s per-milestone `burndownForMilestone` and the new
  repo-wide one), and BL-896 is the ticket deciding what to do about that
  duplication. Wait for, or read, BL-896's outcome before choosing which to
  build on. Requirement 3 (counting backlog-root `INTAKE-*.md` items as
  intake) is genuinely new work either way.

