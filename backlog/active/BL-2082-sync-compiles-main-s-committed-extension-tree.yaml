human_approval: approved
approval_context: >
  From the documenter's spec-gap note on BL-2065 (001711). No choice is
  posed: BL-2065's invariant (the live build equals main's committed tree)
  now covers sync too. FIRM: an override still lets sync pass its refusal
  and restart the stale groups, and it is still logged; it no longer
  compiles uncommitted extension code. A failed main build restarts
  nothing, as a failed compile does today.

description: |
  ## What is wrong

  `build_freshness_cli.bb sync` recompiles the extension before it
  restarts a stale daemon group. Its `recompile-extension!` runs
  `npm run compile` inside the master checkout's `extension/`, so tsc
  compiles whatever the working tree holds, and the build is stamped with
  main's commit. sync refuses an uncommitted change under the deployed
  surface (BL-629's `:dirty-surface` reason), but `--override` passes that
  refusal and compiles the change anyway.

  `.swarmforge/build-freshness/sync-overrides.jsonl` holds 258 overrides
  from 2026-07-27 to 2026-10-07: 131 code-drift, 126 dirty-surface, 1
  gather-failed. 170 of them list uncommitted deployed-surface paths, so
  each of those compiled them. On 2026-10-07 at 10:23:40Z a code-drift
  override listed `extension/src/tools/localQwenSeatLive.ts` and
  `extension/src/tools/localSeatRepoRead.ts`, the stray BL-1911
  implementation whose secret filter leaked (QA note 003900); the cursor
  bridge child that loaded it started at 10:23:52Z (BL-2065's notes).

  BL-2065 fixed the front desk's own recompile with
  `safe_recompile_lib.bb`'s `recompile-extension-from-main!` and left
  sync's copy alone. Its documenter recorded the gap in
  docs/reference/BL-629-build-freshness-qa-approval-gate.md ("Known Gap:
  `sync`'s Own Recompile Reads The Working Tree").

  ## What is wanted

  - sync's recompile builds main's committed tree through
    `recompile-extension-from-main!`, with the main sha sync already
    gathers (scenario 01, invariant 1). The override keeps its refusal
    bypass and its audit record; it no longer changes what is compiled.
  - The lib returns an error string where today's adapter throws. sync
    keeps today's outcome on a failed compile: it exits non-zero naming
    the failure, and restarts no group (scenario 02).
  - BL-629's, BL-433's and BL-1225's features stay green with their text
    unchanged. Their handlers put a fake `npm` on PATH over fixtures that
    may commit no `extension/`; if the lib's export needs one, give the
    fixture one in this parcel.
  - Documenter: retire the "Known Gap" section of
    docs/reference/BL-629-build-freshness-qa-approval-gate.md and the
    paragraph of docs/how-to/BL-1154-build-stale-restarts-not-crash-giveup-budget.md
    that says sync's recompile was left unfixed; both say sync builds
    main's committed tree.

  ## How (direction, not mandate)

  - The `:recompile!` adapter in `run-sync!` calls the lib and throws
    `ex-info` on an error string, so `execute-sync!` and `-main` stay as
    they are.
  - The step handler builds the fixture with `git init` under mkdtemp
    (BL-1390), a tiny `extension/` whose compile script writes a file
    from its sources, and a stale tracked process the way
    bl629SyncQaApprovalGateSteps.js does, then shells the real CLI.

constraints: >
  Fixture repositories under mkdtemp only, proven by rev-parse
  --git-common-dir before any mutating git command (BL-1390); never the
  live checkout, never the live operator runtime. bash 3.2 rules for any
  shell.

out_of_scope: |
  - A role running `npm run compile` by hand in the master checkout
    (BL-2065's out_of_scope; still a separate path).
  - Uncommitted swarmforge/scripts files: the daemons run them from the
    checkout, and the master-checkout drift sweep owns that.
  - The override's refusal reasons and its audit record (BL-629).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2082-sync-compiles-main-s-committed-extension-tree.feature`:
     3 ok (01 x2, 02), 0 fail.
  2. `node specs/pipeline/cli.js specs/features/BL-629-sync-refuses-non-qa-approved-main.feature`:
     13 ok; BL-433-build-freshness-operator-restart-race.feature: 5 ok;
     BL-1225-sync-initiated-restart-leaves-a-readable-trail.feature: 3 ok
     (all three measured at mint, 2026-10-08, before the change).
  3. `git diff <parcel>^..<parcel> --stat` names only
     build_freshness_cli.bb, the feature, the step handlers, the two docs
     and the ticket's evidence.
  4. After the land, on the live swarm: the next sync that recompiles
     leaves extension/out/BUILD_SHA equal to `git rev-parse main`, and
     `git status --porcelain` in the master checkout is unchanged across
     it.

