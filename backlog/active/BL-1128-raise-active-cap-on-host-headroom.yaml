description: |
  WHAT. Asymmetric intake cap today: Article 3.5 may lower effective depth;
  host headroom never raises the standing configured max. When the box is
  quiet, coordinator cannot fill more concurrent actives. Same turn should
  unhold eligible backlog/hold → paused and prefer depth/cap/throttle tickets.

  WHY. Human ask 2026-08-25 (verbatim): increment cap at config level when
  CPU and memory usage permit; unhold held tickets as well as depth tickets.
  Immediate hand unholds of BL-1079/1081 must become repeatable.

  HOW (design lock — see feature file): deterministic CLI; single write
  target (pack conf if pack pins depth, else swarmforge.conf); sustained
  host_load window; step/ceiling/cooldown; durable reversible audit; never
  raise/unhold under degraded/severe throttle; hold→paused only.
out_of_scope: |
  - GPU / Ollama VRAM as primary headroom signal.
  - Replacing Article 3.5 rework throttle.
  - Auto-switching packs or models (BL-1119).
  - Making local/CPU inference instant.
  - New Telegram product/UI.
