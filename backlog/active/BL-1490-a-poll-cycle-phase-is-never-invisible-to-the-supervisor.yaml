id: BL-1490
title: "handoffd supervisor kills a PROGRESSING daemon again: the per-tick phases BL-977 never covered - outbox delivery (poll-once!) and startup-notify - publish no progress, so a burst of four or five coordinator notes delivered at ~9 s each outruns the 30 s stall window with the sweep marker reading idle and alarm-and-halt kills every role session; 7 full-swarm kills in ten hours on 2026-09-07/08 and 65 of the 150 halts on record; every poll-cycle phase publishes its progress and :stalled requires true silence across the WHOLE cycle"
milestone: M8
type: defect
severity: critical
# critical: recurring swarm-down. Every alarm-and-halt kills all nine role
# sessions and the tmux server; this shape fired four times in eight hours on
# 2026-09-08 (one of them killed the specifier mid-mint at 03:21:16Z) and
# babysitterd needs ~8 min to rebuild the swarm each time. BL-977 was high as
# a one-off false positive; this is the loop it left open.
status: todo
epic: swarm-reliability
priority: 1
direction: swarm-reported
depends_on: []
