acceptance: specs/features/BL-1490-a-poll-cycle-phase-is-never-invisible-to-the-supervisor.feature

# No consumer anchor can be named honestly (BL-1235): the mechanism is the
# implementer's (marker or heartbeat, see How), and both literals already
# exist in handoffd.bb, so a pattern on either would pass before the fix. The
