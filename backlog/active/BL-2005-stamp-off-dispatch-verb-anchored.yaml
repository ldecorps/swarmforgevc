description: |
  ## Status: hotfix 6b5f524550 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `swarmforge/scripts/chase_sweep_lib.bb`'s `spec-work-ticket-id-pattern`
  was `(?i)\b(?:Spec|Work)\s+(BL|GH)-?(\d+)\b`: case-blind and matched
  anywhere. `dispatch-trail-ticket-id` reads a note's `message:` through
  it, so "Human reservation controls: do not work BL-1082", the
  specifier's "New spec BL-205 ready in backlog/paused/" and "BL-296
  landed; spec BL-297: ..." each counted as dispatching the ticket they
  mention.

  ## What the hotfix changed

  - The pattern is `(?:^|[.:;!]\s+)(?:Spec|Work)\s+(?i:(BL|GH))-?(\d+)\b`:
    the verb is case-sensitive and opens the message or a sentence; the
    prefix stays case-blind (BL-503).
  - Measured over 13975 distinct `message:` lines in every mailbox: 1063
    old matches, 1051 new; the 12 dropped are all mentions; none gained;
    no message yields a different id.
  - `swarmforge/scripts/test/bl1097_router_dispatch_trail_test_runner.bb`:
    ten cases (five dispatches incl. a mid-message "Supersede stale holds.
    Work BL-1082" and a lower-case id; five mentions that must give nil).
  - handoffd uses the new pattern from its next load of the lib.

  ## What the coder does (all of it)

  1. Run qa_e2e_procedure steps 1-4 once each, in your worktree.
  2. Read `git show 6b5f524550` against the sections above and the
     invariant.
  3. Write backlog/evidence/BL-2005-coder-<date>.md: the four results and
     one line saying whether the hotfix matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

