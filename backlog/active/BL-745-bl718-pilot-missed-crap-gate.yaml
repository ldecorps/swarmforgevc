description: |
  ## What

  BL-718 is now the second ticket this same BL-723 review batch has found
  a CRAP gap on (see also BL-627/BL-740-743) — same root gap: hardener-
  equivalent CRAP checking was skipped or not verified for tonight's
  batch as a class, not a one-off.

  ## Question to answer

  Given BL-718 alone accumulated three independent shortfalls across
  three different review lenses (coder's acceptance-wiring gap, architect's
  vacuous property test, hardener's CRAP gap), was the offline pilot's
  hardener-equivalent step run at all for this ticket, or run and not
  verified? Harden `/pilot` so a CRAP pass against every touched
  `extension/src/**` file is a mandatory, logged step for every ticket
  that touches TypeScript — not something a downstream live-swarm review
  has to rediscover from scratch two tickets in a row.

qa_e2e_procedure: >
  (1) Pilot fixture touching extension/src/** — land writes receipt with CRAP
  evidence naming those paths. (2) Fixture that would omit evidence — land
  refused, yaml unmoved, no receipt. (3) Post-land reviewer reads receipt
  without re-running crapReport. (4) Non-src touch — missing src evidence alone
  does not refuse. Live: /pilot on src-touching ticket leaves auditable CRAP log.

specifier_decisions: |
  Minted 2026-08-27 per coordinator route. Five scenarios: src touch requires
  logged CRAP evidence; omit evidence refuses land; evidence inspectable without
  re-run; non-src tickets not refused for missing src evidence; refused land
  writes nothing durable. Answer: BL-741 made the gate mandatory; BL-745 makes
  the pass leave durable path-scoped evidence so a second shortfall in the same
  review batch is auditable. Coverage fix for the six BL-718 functions remains BL-744.

out_of_scope: |
  - Fixing mergeTopicId / other BL-718 functions to CRAP<=6 (BL-744).
  - Replacing crapReport.js measurement or the CRAP<=6 threshold.
  - Retroactively inventing CRAP receipts for historical pilot lands.
