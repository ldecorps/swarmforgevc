qa_e2e_procedure: |
  On the parcel commit, from `extension/`, after `npm run compile`:
  1. `for i in $(seq 1 20); do npx vitest run test/bl1277UnscopedStepCollisionGuard.test.js || echo FAIL; done` -> 20 of 20 green.
  2. `npm test` 3 times, recording `uptime` before each -> the scan green
     in every run; any other red recorded with its text and raised as an
     unowned-red note.
  3. `node -e "const {resolveUnitLaneTimeout}=require('../specs/pipeline/steps/lib/contentionBudget');const {unitLaneHeavyContentionFactor}=require('./test/helpers/unitLaneContentionBudget');console.log(resolveUnitLaneTimeout(20000,{factor:unitLaneHeavyContentionFactor({forksFn:()=>9,loadavg1mFn:()=>1.8})}).effectiveMs, resolveUnitLaneTimeout(20000,{factor:unitLaneHeavyContentionFactor({forksFn:()=>1,loadavg1mFn:()=>1.8})}).effectiveMs)"`
     -> `45000 20000`.
  4. Acceptance resolving all four scenarios
     (`specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1607-*.feature`)
     and BL-1600's feature still resolving
     (`specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1600-*.feature`).
  5. `grep -n SWARMFORGE_UNIT_LANE_FORKS vitest.config.mjs` -> one
     assignment before `defineConfig`.
  6. After landing, `bb swarmforge/scripts/standing_red_register_cli.bb .`
     reports no row for the file and `"unowned":[]`.

