id: BL-1537
title: "Every production sender of swarm_handoff.sh builds its draft under the project root it sends from: promote_and_route_next.sh (freshness-hold note), route_backlog_to_coder.sh, mailbox_note_to_role.sh and inject_note_to_role.sh mktemp their draft under ${TMPDIR:-/tmp}, and closing-ceremony-run.ts, night-closing-ceremony-run.ts and tracer-bullet-launcher.ts write theirs under os.tmpdir(), so BL-1518-a's fail-closed root guard (landed 2026-09-11) refuses all seven - every coordinator promotion route, the freshness-hold note, both ceremony notes and the tracer seed - and BL-1518's premise 'every production draft is under the root by construction' was false for seven senders; the seven draft under <root>/tmp/ as the Babashka senders already do"
milestone: M8
type: defect
severity: high
