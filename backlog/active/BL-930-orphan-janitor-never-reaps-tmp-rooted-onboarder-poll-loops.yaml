id: BL-930
title: "The orphan janitor's ancillary catalog has no onboarder class, so a tmp-rooted onboarder supervisor and its reconcile poll-loop left by a killed fixture run are never candidates for any sweep"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarm-reliability
human_approval: approved
priority: 5
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-930-orphan-janitor-reaps-tmp-rooted-onboarder-leftovers.feature

invariants:
  - "A process whose command line carries no extractable disposable root is never a candidate for this class, however orphaned or however old. The host-repo onboarder is BL-928's territory and this ticket must not be able to touch it even by accident."
  - "Parent-orphaned status is not a reap licence for this class. A tmp-rooted onboarder is reaped on the ordinary ancillary age gate and on nothing else, because a --check-once supervisor exits by design and orphans a LIVE fixture's poll-loop within milliseconds."

approval_context: >
  One decision was explicitly delegated to me by the intake ("Front-desk fast
  path vs ordinary age gate is the specifier's call"), and I made it on
  evidence rather than on the CPU-cost argument the intake leaned toward.

  No fast path. The tmp onboarder gets the ordinary 2h ancillary age gate,
  the same as babysitter and tmux. The intake's case for the BL-879 front-desk
  fast path was that tonight's leftover burned ~15% CPU on a 2-core box, and
  that is real - but I read onboarder_supervisor.bb and the --check-once
  branch spawns the reconcile poll-loop through tick! and then exits
  immediately, so the poll-loop of a test that is still running is
  parent-orphaned within milliseconds. PPID 1 therefore carries no signal
  whatsoever for this class; a fast path would reap live fixtures mid-test.
  This is BL-885's invariant 3 reasoning (PPID 1 is normal for detached
  caffeinate, so staleness is never skipped), not BL-879's.

  What that costs, stated plainly rather than hidden: a leaked poll-loop can
  burn ~15% of a core for up to 2 hours before the gate opens, and an
  acceptance or mutation run that legitimately exceeds 2 hours would have its
  own fixture reaped underneath it. The second risk is the same one the
  existing tmux and babysitter classes already accept, and the hardener's
  BL-928 teardown fix (3d2894696, bounded SIGTERM-then-SIGKILL plus the
  supervisor added to cleanup_children) cuts the leak rate at the source. Say
  the word if you want the fast path anyway and I will amend - it is two rows
  in the acceptance table, not a redesign.

  Severity medium, not high. It is a catalog gap in a hygiene mechanism, not a
  broken health signal: the leftover is fixture-scoped, does not contend for
  the bridge port, does not trigger give-up emails, and does not corrupt the
  onboarder heartbeat the way BL-928's host-repo siblings do. It is also
  bounded by how often that one shell test runs.

source: |
  backlog/INTAKE-orphan-janitor-tmp-onboarder-poll-loop.md (human via Cursor
  2026-08-18 ~22:06 CEST), minted 1:1 - this ticket is the whole intake,
  nothing split off and nothing merged in.

  Human ask, verbatim:

  - "Is there a ticket to take care of the other poll loop?"
  - "Add an intake for that, and kill it by hand"

  Locked human decisions, verbatim from the intake:

  1. "File this as raw intake for the specifier; do not mint the ticket from
     Cursor."
  2. "Kill the tmp leftover by hand tonight rather than waiting for a janitor
     class. (Attempted 2026-08-18 ~22:06 CEST: those pids were already gone.
     Scoped pkill for tmp-rooted onboarder only; host-repo processes left
     untouched.)"
  3. "Do **not** fold this into BL-928. That ticket's invariant 2 and
     host-repo janitor ban stay."

description: |
  ## What happens

  `orphan_janitor_lib.bb`'s `tmp-ancillary-cmdline?` is the admission gate for
  the whole disposable-root ancillary class. It requires an extractable
  disposable root AND one of: a babysitter tmux socket, a babysitter launch
  script, `babysitterd.sh`, any `tmux`, the front-desk bridge/bot, or
  `claude -n Babysitter`. The onboarder is in none of those, and the string
  "onboarder" does not appear anywhere in `orphan_janitor_lib.bb` or
  `orphan_janitor_sweep_lib.bb` (verified at mint, both files: 0 occurrences).

  So a tmp-rooted onboarder never even reaches `scan-candidate-pids!`'s filter,
  let alone `reapable-tmp-ancillary?`. It is not "not stale enough" or "not
  orphaned enough" - it is invisible, permanently, at any age.

  ## Measured, this host, 2026-08-18 ~21:44 CEST, live swarm up, load ~47

  | PID | PPID | Age then | Role |
  |---|---|---|---|
  | 1415 | leftover | ~24 min | `bb .../tmp.KTEWg2bJ/swarm/onboarder_supervisor.bb .../tmp.KTEWg2bJ/swarm` |
  | 10948 / 8982 / 7566 | supervisor or PID 1 | seconds-minutes | `node .../tmp.KTEWg2bJ/swarm/extension/out/tools/onboarder-reconcile.js .../tmp.KTEWg2bJ/swarm poll-loop`, ~15% CPU |

  Root was Darwin `$TMPDIR`:
  `/var/folders/ks/zpyf9vpn15s2vjwzq52p958c0000gn/T/tmp.KTEWg2bJ/swarm`, which
  `disposable-root-re` already matches - the root pattern is not the gap, the
  cmdline catalog is.

  By ~22:06 CEST that directory and those pids were gone on their own. The
  class is still real: nothing in the janitor would have reaped them had they
  stayed, and the same producer ran again minutes later under a different tmp
  name.

  ## Producer, and what has already changed underneath the intake

  `swarmforge/scripts/test/test_onboarder_supervisor_tick.sh` `mktemp -d`s a
  fixture, copies a fake `onboarder-reconcile.js` that `setInterval`s forever,
  and starts it. `lib/tmp_cleanup.sh`'s EXIT trap removes DIRECTORIES and
  deliberately does not signal processes, so a killed or interrupted run
  deletes the fixture and leaves the processes running against a deleted cwd.

  Since the intake was written the hardener landed `3d2894696` on that same
  test: `stop_background_supervisor` now escalates SIGTERM to SIGKILL with a
  bounded `kill -0` confirmation loop at each stage, and `cleanup_children`
  reaps the supervisor's own bb process, not only its reconcile.js child. That
  narrows the producer on its normal and graceful-stop paths. It does NOT
  close this ticket: a SIGKILLed run still skips both, and the janitor gap is
  what makes the residue permanent rather than transient. The intake's
  optional "narrow prevention slice" is therefore already largely delivered
  out of band, which is the reason this ticket stays janitor-only.

  ## Shape of the fix (direction, not mandate)

  Add the two onboarder entry points to the existing ancillary catalog rather
  than starting a parallel path:

  - `node .../extension/out/tools/onboarder-reconcile.js <disposable-root> poll-loop`
  - `bb .../onboarder_supervisor.bb <disposable-root>`

  Putting them inside `tmp-ancillary-cmdline?`'s existing `or` is what makes
  invariant 1 structural rather than a promise: that function already requires
  `extract-disposable-root` before any cmdline branch is consulted, and the
  host repo path (`/Users/ldecorps/projects/swarmforgevc`) cannot match
  `disposable-root-re`. A separate predicate that forgets the root gate is the
  one way to get this wrong, and is exactly what BL-928's out-of-scope list
  forbids.

  `reapable-tmp-ancillary?` should then need no change at all: the new class
  is not front-desk, so it falls through to the `(not stale?) false` line and
  gets the ordinary age gate. If a change there IS needed, that is a signal
  the predicate was added in the wrong place.

  ## Why not the front-desk fast path

  See `approval_context`. Short form: `--check-once` exits after `tick!`, so a
  live fixture's poll-loop is PPID 1 almost immediately, and `parent-orphaned?`
  cannot distinguish a leak from a healthy test in progress for this class.

qa_e2e_procedure: |
  1. Fake-table sweep, the reap: drive the sweep with a fake process table
     (the BL-879 / BL-885 harness shape, no real processes) carrying a
     `node .../T/tmp.XXXX/swarm/extension/out/tools/onboarder-reconcile.js
     .../T/tmp.XXXX/swarm poll-loop` entry older than the ancillary gate.
     Confirm it is reaped and the audit line is a `reaped-tmp-ancillary` entry
     naming that disposable root. Repeat with the `bb onboarder_supervisor.bb`
     cmdline.
  2. Host-repo negative, the invariant-1 check and the most important one:
     same table, cmdline naming `/Users/ldecorps/projects/swarmforgevc`,
     parent gone, age 19 hours. Confirm not reaped AND that it never appears
     in the candidate list at all - assert on the candidate scan, not only on
     the reap count, or a predicate that admits it and then declines it will
     pass this step.
  3. No fast path, the invariant-2 check: tmp-rooted onboarder younger than
     the gate, once with parent gone and once with parent alive. Both survive.
     Confirm the audit log carries no `parent-orphaned` reason line for
     either.
  4. No regression in the classes already in the catalog: re-run the BL-879
     and BL-885 acceptance features unchanged and confirm both still pass -
     the front-desk fast path must still fire and the caffeinate class must
     still refuse one.
  5. Break-then-fix: revert the catalog addition and confirm step 1 fails. A
     green suite after that revert means the acceptance is not gating the
     behaviour.
  6. Live host, last: do not manufacture a leak by hand. If a real tmp-rooted
     onboarder leftover is present at QA time (any `test_onboarder_supervisor_tick.sh`
     run under load can produce one), confirm the periodic sweep reaps it once
     past the gate and records it in
     `.swarmforge/daemon/orphan-janitor-audit.log`. If none is present, say so
     in the evidence rather than claiming a live confirmation you did not get.

required_wiring:
  - "swarmforge/scripts/orphan_janitor_lib.bb::onboarder-reconcile::the reconcile poll-loop entrypoint must be named inside the janitor catalog file itself - the string is absent there today, so this entry is what proves the class was added to the sweep's admission gate rather than only to a test"
  - "swarmforge/scripts/orphan_janitor_lib.bb::onboarder_supervisor::same, for the supervisor half of the class - the intake's leftover included the bb supervisor as well as its node child, and reaping only the child leaves the parent to respawn it"

out_of_scope: |
  - Host-repo `onboarder-reconcile.js` leftovers and any janitor class that
    could match them. BL-928's locked prohibition, restated by the human in
    this intake's decision 3, and enforced here by invariant 1.
  - Replacing or duplicating BL-928's supervisor startup sweep.
  - Ad-hoc killing live pids. Decision 2 already covered tonight's by hand and
    found them gone.
  - Rewriting `test_onboarder_supervisor_tick.sh` teardown. The intake left
    this optional and the hardener has since landed 3d2894696 on exactly that
    code path; a second pass over it here would collide with landed work for
    no gain.
  - Signalling processes from `lib/tmp_cleanup.sh`'s EXIT trap. Its own
    BOUNDARY note assigns SIGKILL residue to a periodic sweeper, and this
    ticket IS that sweeper's missing class.

notes: |
  IR-DRY reviewed at mint: 4 medium-confidence `possible-synonym` findings,
  all reviewed and none normalized. Two are deliberate opposites
  (older/younger than the age gate; reaped/not reaped) and two are a
  placeholder paired with a literal that the same handler regex serves
  (`<ancillary>` vs the onboarder reconcile loop; `<parent state>` vs gone).
  The checker's own suggested action is to normalize only accidental drift;
  none of these is drift.

  The feature file deliberately reuses BL-879's step vocabulary verbatim so
  the coder can clone `specs/pipeline/steps/bl879ParentOrphanedFrontDeskSteps.js`
  rather than invent a third dialect. Keep its `KNOWN_ANCILLARIES` /
  `KNOWN_PARENT_STATES` keyed-map shape when extending it: a keyed lookup on
  the Examples value is mutation-tight, a shape lookup is not (hardender rule
  2026-08-17).

