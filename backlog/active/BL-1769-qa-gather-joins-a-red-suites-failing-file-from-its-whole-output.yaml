id: BL-1769
title: "qa-gather builds its register join from the 4000-char display excerpt of a red unit or property run, so when the tail is stderr noise (BL-871 onTaskUpdate timeouts) the FAIL line is cut off and the join comes back empty - read as no failing file - which left the red UNIDENTIFIED and its parcel held twice (BL-1726 QA 2026-09-25, BL-1766 QA 2026-09-26): the join reads the whole output, and a red suite it still cannot attribute is listed unidentified, never omitted"
milestone: M8
type: defect
severity: high
# high: a broken safety signal. The register join is the input Article
# 4.2's approve-or-hold decision reads; an empty join on a red lane leaves
# a red nobody can own, so the parcel waits on a re-run that the one-run
# rule forbids in the same pass. Twice in two days. Not critical: the lane
# exit code still shows red, so no parcel is approved over it.
status: todo
