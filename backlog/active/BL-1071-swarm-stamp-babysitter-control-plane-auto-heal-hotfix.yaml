required_wiring:
  - "specs/pipeline/steps/index.js::bl1071BabysitterSweepSurvivalSteps::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them. Verified absent from index.js at spec time, so the anchor cannot pass before the work is done"

invariants:
  - "A sweep never dies on one gather: any single probe that fails - a missing binary, an unreadable file, a library call that throws - degrades that one check and leaves every other check, and every repair already due, still running."
  - "A recovery the babysitter owns is bounded in wall-clock as well as in attempts: no repair can hold a sweep open indefinitely."
  - "A probe that cannot be read is reported unavailable, which is its own answer - never reported as a healthy reading and never as an absence."

description: |
  ## What

  An operator hotfix is live on main and has never been through a gate. This
  ticket is that gate. It is a REVIEW ticket, not a rewrite ticket - confirm
  or refute the landed diff, and open narrow follow-ups for anything found.

  ## The failure it fixed

  Three faults compounded into a permanent blackout:

  1. Babashka's `slurp` (a seeking reader) fails on WSL `/proc/meminfo` with
     `Invalid argument`, though `FileInputStream` and `cat` read it fine.
  2. The fallback shelled macOS-only `vm_stat`. `{:continue true}` softens a
     non-zero EXIT; a binary that cannot be spawned at all throws IOException
     out of ProcessBuilder before any exit code exists. So the sweep threw.
  3. It threw before `-main` reached `assemble-findings`, so no BL-1017
     session repair and no control-plane recovery could ever run.

  The live shape, from the intake: the pack ran ~90 minutes, the tmux control
  plane went at ~16:23 BST, the daemons stayed UP, the dashboard showed "Live
  panes unavailable", `.swarmforge/incidents/control-plane.json` sat open with
  `owner: babysitterd` and `command: ./swarm ensure` - and no ensure ran.
  babysitterd.log carried ~192 `Cannot run program "vm_stat"` traces, zero
  `OK all checks green`, zero `REPAIR`.

  ## What landed (files to review, all in commit f6b6aef25)

  - `swarmforge/scripts/babysitter_check.bb` - `read-meminfo-text` reads via a
    non-seeking `FileInputStream`; `sh!` wraps `process/sh` in a try/catch
    returning `{:exit 127}`; the gatherer observes the plane through
    `control_plane_lib/observe!`; `run-control-plane-ensure!` shells
    `bash ./swarm ensure` in `project-root`; a new
    `control-plane-ensure.json` holds attempts + last-ms.
  - `swarmforge/scripts/babysitterd_sweep_lib.bb` - `check-control-plane`
    emits the CRIT and, when launch scripts exist and the bound allows,
    the `:ensure-control-plane` repair; `assemble-findings` strips the
    per-role `:repair` while a plane ensure is queued.
  - Tests: `test_babysitter_check.sh`, `babysitterd_sweep_lib_test_runner.bb`.

  ## Review goals

  1. **`BABYSITTER_FAKE_ENSURE_RESULT` is the named anti-pattern, in
     production code.** `run-control-plane-ensure!` checks that env var
     FIRST and, when set, returns a fabricated result and writes a counter
     file instead of recovering. engineering.prompt is explicit: "inject side
     effects (`postFn` seams), not `*_FORCE_RESULT` env bypasses". As landed,
     anything that sets that variable in a real environment silently disables
     the recovery this whole ticket exists to deliver - the same class of
     silent blackout the incident was. Weigh replacing it with an injected
     seam; the ticket does not mandate the shape.
  2. **"Bounded" is bounded in attempts, not in time.** The bound is
     `session-repair-allowed?` over attempts and last-ms. The subprocess
     itself - `bash ./swarm ensure` - is shelled with no wall-clock deadline,
     so an ensure that hangs holds the sweep open indefinitely and the next
     tick never happens. That is invariant 2, and it is the failure mode
     closest in shape to the incident: a babysitter that is not running is
     indistinguishable from one that is stuck.
  3. **`sh!` now catches every Exception and synthesises `:exit 127`.** 127
     is a real exit code, so a genuine "command not found" from a real
     process is now indistinguishable from a spawn that never happened.
     Confirm no caller branches on 127 meaningfully, and weigh whether the
     catch should be narrowed to spawn failure.
  4. **`observe!` is wrapped in a catch that returns `:classification
     :unknown`.** An observer that throws therefore produces no control-plane
     finding at all - it fails silent, in the exact mechanism whose silent
     failure caused this incident. Confirm that is deliberate and that a
     throwing observer is visible somewhere, or make it so.
  5. **Confirm, do not assume, that BL-802's UNAVAILABLE path survives.**
     `ps-snapshot` returns nil unless the exit is zero, so a spawn failure
     should still read as gather-failed rather than as absence. It looks
     preserved; it is the highest-risk interaction in the diff and scenario
     05 gates it, so confirm it by running it rather than by reading it.
  6. **Confirm the per-role suppression is the right shape.** Stripping
     `:repair` while a plane ensure is queued leaves the per-role CRIT
     standing, deliberately. Confirm the alert is preserved and that only
     the racing repair is suppressed.
  7. Open narrow follow-up tickets for anything found; do not widen here.

  ## Live verification the human already performed

  Recorded as context, NOT as a substitute for the swarm's own pass: after
  the fix the control plane was recovered and the pack came back up; the
  sweep now reaches its checks on this host. The specifier separately
  confirmed the sweep is alive again - babysitterd.log carries findings and
  NUDGED lines at 16:19:33Z and 16:24:46Z where it previously carried only
  stack traces.

out_of_scope: |
  Carried from the intake, which states them as human decisions:
  - "Why `tmux: server` segfaults on this host (dmesg earlier today)." That
    is BL-1069, a separate stamp-off of a separate hotfix.
  - "Replacing babysitterd's memory floor with something other than
    meminfo/`vm_stat`."
  - "Restarting or redesigning handoffd chase-respawn."
  - Re-implementing the fix; this stamps the landed diff.
  - The pane-liveness depth defect - that is BL-1070. It is NOT a regression
    from this hotfix; see notes.

qa_e2e_procedure: >
  1. **Reproduce the blackout at the parent commit.** With `/proc/meminfo`
  unreadable through a seeking reader and no `vm_stat` on PATH, run one sweep
  and confirm it throws before emitting any finding - no `OK`, no `REPAIR`.
  2. At the parcel commit, repeat and confirm the sweep completes, emits its
  findings, and still performs a repair that was due. 3. **Each probe
  independently.** Fail the memory reading, the process table, and the
  control-plane observation one at a time and then all together, confirming
  each time that the other checks still report and that a due repair still
  runs. 4. **Whole-plane recovery, both branches.** With the plane missing
  and launch scripts present, confirm exactly one `./swarm ensure` runs and
  that no per-role session creates race it; with launch scripts absent,
  confirm it escalates for a human relaunch and starts no ensure.
  5. **Bounded in time.** Make the recovery hang and confirm the sweep still
  ends and reports the recovery unfinished rather than repaired - if it does
  not, that is review goal 2 confirmed and is a finding, not a test failure.
  6. **Bounded in attempts.** Run a second sweep inside the cooldown and
  confirm no second recovery starts. 7. **BL-802 intact.** Force the process
  gather to fail and confirm UNAVAILABLE, never a half-launch alert.
  8. **The seam is not reachable in production.** Confirm what happens with
  `BABYSITTER_FAKE_ENSURE_RESULT` set in a real environment, and record the
  answer explicitly in the QA evidence whichever way review goal 1 is
  resolved. 9. Record the degraded gate: Babashka and shell only, so no
  mutation, CRAP or DRY applies - the gate is `test_babysitter_check.sh`,
  `babysitterd_sweep_lib_test_runner.bb` and these acceptance scenarios.

notes: |
  ## Locked human decisions, carried verbatim from the intake

  1. "Specifier mints a **high** defect / swarm-review ticket (BL-849 shape):
     verify the human-landed babysitter auto-heal path is correct, guarded,
     and wired; stamp it off through the normal chain."
  2. "Acceptance must prove the live failure mode that motivated the fix:
     on WSL/Linux, every babysitter tick threw on missing `vm_stat` after
     `slurp` failed on `/proc/meminfo` (`Invalid argument`), so
     `babysitterd.log` showed heartbeats with **zero** `OK`/`REPAIR` lines
     and an open `control-plane-missing` incident never triggered
     `./swarm ensure`."
  3. "Do **not** widen into tmux segfault root-cause (separate; observed
     `segfault at 208` thrice earlier the same day) unless review opens a
     follow-up."

  Also carried verbatim, on the posture: "**Operator/Cursor hotfix already in
  the tree** - same posture as BL-811 / BL-849 / BL-879: commit makes it
  reviewable; this intake asks the swarm to stamp it off through a
  high-severity review ticket, not to re-implement from scratch."

  ## Related, do not conflate (the intake's own list, carried verbatim)

  - "**BL-958** (done) - control-plane-missing classification + `./swarm
    ensure` recovery path; response-policy names `babysitterd` as owner, but
    the live owner never ran ensure until this hotfix."
  - "**BL-802** (done) - meminfo / `vm_stat` fallback for the memory floor;
    the WSL `slurp(/proc/meminfo)` failure mode was not covered and aborted
    the whole sweep."
  - "**BL-1017 / BL-1018** (done) - per-role session repair; unreachable
    while the sweep died before `assemble-findings`."

  ## BL-1070 is unmasked by this hotfix, not caused by it

  Recorded so no reviewer charges it here. BL-1070 (the liveness predicate
  seeing only one generation under the pane) has been wrong for as long as
  the wrapper launch shape has existed. While this sweep was dying on
  `vm_stat` the predicate never spoke; reviving the sweep is what made it
  audible, which is why eight half-launch CRITs appear in the log shortly
  after this hotfix landed. It is a separate ticket and a separate cause.

  ## Concurrent-work orthogonality (for the coordinator)

  This ticket and **BL-1070** both touch `babysitter_check.bb` and
  `babysitterd_sweep_lib.bb`. They are causally independent and neither
  blocks the other, but they are NOT orthogonal in the Article 3.2 rule-3
  sense. Do not promote them concurrently; the second to run should merge
  `main` first.

  ## Hotfix ledger

  Commit under review: f6b6aef25 on main, "Land Cursor hotfix: babysitter
  auto-heal for control-plane-missing on WSL", carrying
  `Hotfix-Certification: pending`. Its ledger entry in
  `backlog/hotfix-ledger.yaml` takes `stamp_ticket: BL-1071`; per that file's
  own header the durable fields are set by a human/operator via
  `hotfix_ledger_update.bb`, never by the sweep and not by me. At mint that
  entry was present in the working tree but uncommitted, written by the
  recurrent sweep and not by the specifier.

  ## Degraded gate, recorded up front

  Babashka and shell only: no mutation/CRAP/DRY is wired for either layer
  (engineering.prompt, Startup Tools). The gate is `test_babysitter_check.sh`,
  `babysitterd_sweep_lib_test_runner.bb` and the acceptance scenarios. A
  hardening pass must record that fallback and must never imply mutation ran.

  ## IR-DRY judgment recorded: 1 finding -> 0 resolved

  A medium-confidence possible-synonym (score 0.5) between the Given "the
  control plane is missing" and the Then "the control plane is still reported
  as missing". Deliberate contrast, not drift: one is the state of the world
  and the other is what the babysitter says about it, and holding those apart
  is what a check is for. Left as written.

