approval_context: >
  New feature draft needs review, and one decision is genuinely yours: WHO
  advances the local `main` ref. QA cannot — git refuses to update a branch
  checked out in another worktree, and `main` lives in the master checkout —
  and Article 1.1/3.3 forbids the coordinator any git merge or push (BL-247).
  So closing this either (a) adds a deterministic post-land step outside both
  roles (the shape BL-668 already uses for role branches, extended to the
  master checkout), or (b) amends BL-247 to give the coordinator this one
  narrow merge. This ticket is written for (a) because it needs no
  constitutional change; say so if you want (b) instead. Also confirm
  severity `high` — nothing is broken at runtime, but every read the
  specifier and coordinator make is silently stale, which has already
  produced one wrong scope claim (see `notes:`).

source: |
  Found by the specifier while probing the coordinator's 2026-08-14 note
  about a BL-222 acceptance red (that report became BL-890). The divergence
  was not what the note was about; it surfaced because a scope check for
  BL-889 read the local `main` ref and got an answer two tickets out of
  date.

notes: |
  Specifier probe, 2026-08-14 02:0x — measured, not inferred:

  1. `git rev-list --left-right --count main...origin/main` reported
     **8 / 22**: the local `main` ref carries 8 commits `origin/main` does
     not have, and is missing 22 that it does. The two refs have genuinely
     DIVERGED — reconciling them is a merge, not a fast-forward, and the
     merge gets larger every shift.
  2. The 22 missing commits are the complete landed parcels for **BL-788**
     and **BL-719** — real production code (`chase_sweep_lib.bb`'s
     dropped-parcel sweep, `handoffd.bb`'s wiring, the BL-719 step handlers
     and harness). None of it exists in the master checkout's tree.
  3. The 8 local-only commits are all backlog bookkeeping and spec work
     written in the master checkout by the coordinator and specifier —
     legitimate commits, but they are why this is a divergence rather than
     a simple lag.
  4. Mechanism: QA works in `.worktrees/QA` on branch `swarmforge-QA`
     (`git worktree list` confirms `main` is checked out in the master
     worktree at `/Users/ldecorps/projects/swarmforgevc`). Git refuses to
     update a branch that is checked out in another worktree, so the only
     executable form of qa.prompt's "merge/fast-forward `main` to it and
     push `main` to origin" is `git push origin HEAD:main` — which advances
     `origin/main` and leaves the local ref exactly where it was.
     Meanwhile Article 1.1/3.3 (BL-247) forbids the coordinator any git
     merge or push. No role owns the step, so it never happens.
  5. Concrete harm already incurred: while writing BL-889 THIS SAME TURN,
     the specifier checked whether `dropped_parcel_sweep_harness.bb` was on
     `main`, got "no", and wrote a scope paragraph and a `required_wiring`
     decision around that answer. The file had landed on `origin/main` some
     twenty minutes earlier. It was caught only because an unrelated check
     happened to look at `origin/main` too; the ticket is now corrected
     (`d1ed39574`).
  6. Second-order effect on constitutional guidance: the workflow article's
     BL-340 rule instructs every role to read bounce history from the
     `main` REF and "never `origin/main` (lags)". Under this topology that
     parenthetical is inverted — the LOCAL ref is the one that lags, by two
     whole tickets. The factually-wrong prose in `workflow.prompt` and
     `qa.prompt` is corrected on `main` by the specifier independently of
     this ticket (see `notes:` in the commit); this ticket owns the
     MECHANISM only and carries no prose deliverable.
  7. Related, not duplicate: **BL-668** automates fast-forwarding the
     pipeline ROLE branches after QA lands. It says nothing about the
     master checkout's `main` ref, which is the one every specifier and
     coordinator read actually resolves against. Same epic, adjacent
     mechanism; whoever implements this should read BL-668 first and reuse
     its skip/surface posture rather than inventing a second one.

invariants:
  - "Reconciliation only ever moves the master checkout FORWARD: local-only commits stay reachable, and no reset, rebase, stash, or force-update is ever performed on it."
  - "A master checkout that cannot be reconciled cleanly is surfaced with its reason and left byte-identical, never partially updated."

description: |
  ## What

  After QA lands an approved commit, the landed work reaches `origin/main`
  but never reaches the local `main` ref. The master checkout — where the
  coordinator does bookkeeping and the specifier reads code to write specs
  — therefore serves a tree that falls further behind every shift, while
  simultaneously accumulating its own bookkeeping commits, so the two refs
  diverge rather than merely lag.

  Close the loop: after a landing, the master checkout's `main` ends up
  containing the landed commit, with its local-only bookkeeping commits
  preserved. When that cannot be done cleanly — a dirty working tree, a
  conflict — the checkout is left untouched and the condition is surfaced
  to the coordinator with its reason.

  Add an observable drift check (scenario 04) so the gap is visible while
  it is one commit wide instead of twenty-two.

  ## Why

  Every judgement the specifier and coordinator make is a read against this
  tree: what code exists, which file is the live integration point, whether
  a ticket's fix already landed, what a prior bounce said. A stale tree
  makes those reads confidently wrong rather than obviously broken, which
  is the expensive failure mode — `notes:` item 5 is one instance caught by
  luck in the same turn that found the divergence.

  ## Scope

  The post-land step and the drift check. Reuse BL-668's skip/surface
  posture if it has landed by implementation time; if it has not, do not
  block on it — build this one so BL-668 can adopt the same helper rather
  than duplicating it.

  ## Constraints

  - Fast-forward or merge forward only. Never `reset --hard`, never
    `rebase`, never `stash` — `git stash` is repo-wide across every
    worktree and would reach into other roles' checkouts.
  - Never force-update the ref, and never touch the master checkout while
    its working tree is dirty. The master checkout routinely holds
    in-progress backlog edits; a reconciliation that discards them is
    strictly worse than the staleness it fixes.
  - Do not resolve this by moving `main` out of the master checkout or by
    changing which branch the coordinator and specifier sit on. That is a
    topology change well beyond this defect.
  - Re-running the step must be a no-op.

  ## QA end-to-end procedure

  On a fixture repo with a master checkout on `main` and a role worktree on
  its own branch: (a) commit bookkeeping in the master checkout, land a
  different commit by pushing the role branch to the remote `main`, run the
  step, and confirm the master checkout's `main` contains BOTH the landed
  commit and the bookkeeping commit; (b) repeat with an uncommitted change
  in the master checkout and confirm the ref is untouched, the tree is
  unchanged, and the coordinator receives a surfaced reason; (c) run the
  step twice and confirm the second run changes nothing; (d) run the drift
  check on a deliberately diverged pair and confirm it reports both the
  behind and ahead counts.

