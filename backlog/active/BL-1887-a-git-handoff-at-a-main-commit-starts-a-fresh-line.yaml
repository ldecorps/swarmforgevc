approval_context: >
  Defect in BL-1871 (landed), found by the coder in live use. No choice is
  posed. FIRM: a git_handoff at a commit not on origin/main is taken up
  exactly as BL-1871 does today; only one already on origin/main changes,
  to the Work-note start.

invariants:
