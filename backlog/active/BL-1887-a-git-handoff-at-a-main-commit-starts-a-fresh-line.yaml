source: |
  Coder note 002323 (2026-10-02 09:40Z), verbatim: "BL-1871 gap:
  git_handoff route at main commit never starts a fresh line". The
  specifier confirmed it: coordinator parcel 014966 routed BL-1872 to the
  coder as a git_handoff at 095f2827a7 (main's head), and
  `parcel_line_lib.bb`'s take-up stays whenever HEAD descends from the
  target.

description: |
  ## What is wrong

  `parcel-intent` makes every forwarding git_handoff a `:take-up` of its
  commit. `resolve-target` for `:take-up` sets `at-or-past-target?` when
  the commit is an ancestor of HEAD, and `move-decision` then stays. A
  role's line always descends from origin/main, so a git_handoff at a main
  commit (a route, not a build) never moves it, and the role works the new
  ticket on top of the previous ticket's unlanded commits. The `:start`
  path (a coordinator Work note to the coder) already avoids this, with the
  comment "A fresh start is never past origin/main: a long-lived branch
  descends from it and would wrongly stay."

  ## What is wanted

  - A git_handoff whose commit is already on origin/main starts its task's
    ticket the way `:start` does: onto the ticket's newest handed-off
    commit, or else origin/main, unless the line already carries the
    ticket's own unlanded work (scenarios 01, 03).
  - A git_handoff at a commit not on origin/main is taken up as today
    (scenario 02).
  - It applies to every role that takes up parcels, not only the coder.
  - A Work note for a ticket the coder already sent on from its line
    leaves the line in place (scenario 04). Coder note 002330 (10:20Z):
    the coordinator dispatched BL-1872 twice, as git_handoff 014966 and
    Work note 014965; the coder took up the first (staying on BL-1877's
    line, the gap above), sent BL-1872 from there, and the stale Work note
    then moved it off that line - the `:start` path saw a line carrying
    another ticket's commits as not BL-1872's own. With the take-up fixed
    the line is BL-1872's own and stays; scenario 04 pins it.

  ## How (direction, not mandate)

  - In `parcel_line_lib.bb`, decide from facts: whether the commit is an
    ancestor of origin/main, then reuse `:start`'s target and `own-line?`.
    The ticket comes from the parcel's task name (`extract-ticket-id`).
  - Step handler `specs/pipeline/steps/bl1887MainCommitHandoffStartsFreshSteps.js`,
    fixture with a bare origin under mkdtemp (BL-1390), driving
    `take-up!` the way BL-1871's handler does.

  ## Scope

  `parcel_line_lib.bb`, its test runner, the step handler, evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1887-a-git-handoff-at-a-main-commit-starts-a-fresh-line.feature`:
     4 of 4 ok. Measured 0 at mint: no handler exists.
  2. `node specs/pipeline/cli.js specs/features/BL-1871-a-role-takes-up-a-ticket-on-its-own-line.feature`:
     every scenario still ok; `parcel_line_lib_test_runner.bb` ALL PASS.
  After the land (the specifier's or coordinator's check): the next
  ticket routed to the coder as a git_handoff at main's head prints
  PARCEL_LINE moved onto origin/main.

