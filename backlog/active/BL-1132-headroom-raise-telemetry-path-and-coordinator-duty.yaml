description: |
  WHAT. BL-1128 closed but raise never succeeds live. `telemetry-path`
  uses broken YearMonth/DateTimeFormatter interop, so reading chaser
  telemetry always fails closed to empty ratios → `pressure`. Coordinator
  prompt has zero mention of `headroom_cap_raise_cli`, so the owner CLI
  is never weighed when the board is full.

  Measured 2026-08-25: `raise` → `{"action":"noop","reason":"pressure"}`
  while chaser-2026-08.jsonl shows ratio≈0.16 and MemAvailable≫2Gi;
  `headroom-signals` → `:cpu-headroom? false`. No
  `.swarmforge/coordinator/headroom-cap-changes.jsonl` / last-raise.

  WHY. Pack cap stays at 5; qjumps over-cap with no standing raise. Human
  asked to qjump 1128; ticket already done — this residual restores the
  intended behaviour.

  HOW (direction): fix `telemetry-path` (call `DateTimeFormatter/ofPattern`
  correctly, or equivalent); APS/property that path resolves and samples
  drive headroom; add coordinator prompt (and optional handoffd/sweep
  nudge) to invoke `raise` at-cap with headroom. Ceiling/cooldown/throttle
  unchanged.

qa_e2e_procedure: |
  (1) Fixture or live telemetry with sustained under-max ratios → raise
  returns :raise (or ceiling/cooldown), not false pressure.
  (2) Broken-path regression: telemetry-path does not throw; resolves
  chaser-YYYY-MM.jsonl under project identity root.
  (3) Coordinator role/prompt (or sweep) documents/calls the CLI at cap.
  (4) Record degraded Babashka gate where applicable.

