description: |
  ## Human, verbatim (Article 5.3)

  "actually, it might be a good thing for the recruiter to periodically
  scout for new models to replace the favoured ones. have it publish its
  score table via the documenter / art director in the daily breifing."

  ## What is wanted

  1. `bb swarmforge/scripts/recruiter_score_table_cli.bb <project-root>
     --briefing` prints the Model scout section:
     - when the table's `updated_at` is after the previous briefing
       (`docs/briefings/<date>.md`, the latest before today): the rows,
       highest passed count first, each naming the model, passed out of
       total, and "incumbent" when flagged, then the recommend line;
     - when it is not: "Model scout: no new scout since the previous
       briefing.";
     - when no table exists: "Model scout: no scout has run yet."
  2. The documenter's morning-briefing duty already carries the paste
     instruction (`swarmforge/roles/documenter.prompt`, "Model scout
     section (BL-1822)", landed by the specifier at mint and marked "Until
     BL-1822 lands"). QA's retire check sees the marker once this lands.
  3. How the section reads on a phone and in the email (list vs table,
     line length) follows `docs/design/system.md`'s daily briefing rules;
     the Art Director answers QA's sign-off note on this parcel with LGTM
     or a defect list. The numbers are never the Art Director's.

  ## Scenario notes
  - Fixture roots are mkdtemp with a fixture score table and fixture
    briefings (BL-1390).
  - The handler is `specs/pipeline/steps/bl1822ModelScoutSectionSteps.js`,
    landing in the same commit as the runnable feature (BL-233).

  ## Scope
  - The CLI (and a lib beside it), its unit test, the step handler,
    evidence. The documenter.prompt line is the specifier's and already
    landed.

