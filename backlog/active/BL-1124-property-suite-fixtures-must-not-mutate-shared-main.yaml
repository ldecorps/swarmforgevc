id: BL-1124
title: "Property-suite fixtures must never mutate shared main refs or core.bare"
milestone: M8
type: defect
severity: high
# high: live fixtures renamed swarmforge-coder→main, advanced shared main with
# synthetic BL-9999 commits, and left core.bare=true — discarding ~194 local
# commits until reflog recovery. Recurred across BL-570 land and BL-579 QA.
# Not critical only because coordinator recovered from reflog; class is
# pipeline-integrity / near swarm-down.
status: active
epic: swarm-reliability
priority: 8
direction: human-requested
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
human_approval: approved
approval_context: >
  Fixtures invoked by npm run test:properties / check_property_suite_drift.sh
  must use isolated git dirs only — never rename or advance shared main /
  role branch refs on the live repo, and must leave core.bare=false.
  Recovery that resets main to origin/main when local is ahead is also out
  of policy. Companion to BL-1123 (post-damage bare/tip guard).
acceptance: specs/features/BL-1124-property-suite-fixtures-must-not-mutate-shared-main.feature
required_wiring:
  - "specs/pipeline/steps/index.js::bl1124PropertySuiteFixturesMustNotMutateSharedMainSteps::acceptance handler registered"
invariants:
  - "A property-suite fixture never renames or advances refs/heads/main or a live role branch on the shared repo under test."
  - "After any property-suite run against a fixture, the shared repo's core.bare remains false."
description: >
  WHAT. While landing BL-570 (and again during BL-579 QA), property-suite
  fixtures ran against the live tree and: (1) renamed
  refs/heads/swarmforge-coder → refs/heads/main; (2) advanced shared main
  through dozens of synthetic BL-9999 promote/close commits; (3) nested
  tmp worktrees under the role tree; (4) left the master checkout with
  core.bare=true. Coder recovery reset main to origin/main, discarding
  ~194 legitimate local coordinator commits; coordinator restored from
  reflog. Recurred when QA/cleaner property lanes used cwd=master.

  Human asks (verbatim intent from intake):
  1. Fixtures must never rename or advance shared main / role branch refs
     on the live repo; use isolated git dirs / throwaway remotes only.
  2. Any recovery that "restores main to origin" must refuse when local
     main is ahead, or must restore the pre-incident tip from reflog —
     not discard swarm bookkeeping.
  3. Consider a post-property-lane assert: core.bare=false and master
     checkout is a non-bare work tree.

  WHY. Pipeline integrity. Same morning's bare/tip disasters (BL-1123)
  share this failure class; this ticket stops the fixture writers.

  HOW (direction, not mandate). Isolate every property fixture's git
  operations in mkdtemp bare/clone repos; forbid GIT_DIR pointing at the
  live checkout; add a post-lane assert (or gate in
  check_property_suite_drift.sh) that shared main tip and core.bare are
  unchanged; document the recovery refusal when ahead of origin.

qa_e2e_procedure: >
  (1) Grep/property tests prove fixtures use temp git dirs, not the live
  repo path. (2) Run a representative fixture suite with a canary ref on
  the live repo — canary unchanged after. (3) Post-lane assert fails the
  run if core.bare became true. (4) Documented recovery path refuses
  reset --hard origin/main when local is ahead. (5) Record degraded gate.

out_of_scope: |
  - The BL-1123 heal/detector for bare/tip after damage (sibling).
  - Rewriting history of abandoned spam tips.
  - Disabling the property suite entirely.

notes: >
  Source: .swarmforge/operator/INTAKE-BL-570-property-suite-fixture-mutated-shared-main.md
  Evidence: backlog/evidence/BL-570-coder-land-20260824.md. Related done
  BL-570 (drift guard) — this is the isolation follow-up the land exposed.
  Companion critical guard: BL-1123.

