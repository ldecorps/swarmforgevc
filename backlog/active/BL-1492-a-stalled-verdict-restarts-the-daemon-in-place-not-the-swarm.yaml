  - 'specs/pipeline/steps/bl1492RestartInPlaceSteps.js::registerSteps::the handler lands in the same parcel as the feature (BL-233)'

human_approval: approved
approval_context: >
  Your approval here IS the decision, so this is deliberately a yes/no and
  carries no ruling_options. Approving reverses part of your July BL-144
  directive - "a loud alarm and a full stop, not a papered-over restart loop"
  - and you should reject it if that posture still stands. What changed
  since: babysitterd now repairs every halt unattended (./swarm ensure,
  ~3-8 min later), so the "full stop until a human looks" lasts minutes and
  nobody looks; the halt's only lasting effect is nine agents losing their
  in-flight work, 150 times so far. What is kept: every restart still sends
  the alarm email and writes the failure log; every restart is audited
  (BL-1491's records plus daemon-start-audit.log); the restart budget is
  bounded (direction: two restarts per ten-minute window, re-armed only by
  a healthy-uptime window); budget exhaustion is the unchanged BL-144 halt.
  Rejecting keeps BL-144 as is - BL-1491 alone then makes each halt visible.
  FIRM either way: the daemon is restarted only through start_handoff_daemon.sh
  (BL-690's one start owner), never a second start path.

invariants:
  - "A :stalled or :dead verdict never kills a role session while the restart budget has headroom: the daemon is restarted through the one start owner (start_handoff_daemon.sh, BL-690), and every restart, successful or failed, is alarmed and recorded in the status file."
  - "Budget exhaustion is BL-144's halt unchanged - same failure log, same email, same halt-swarm!, same halted status - and the budget re-arms only after a healthy-uptime window, never by the passage of time while the daemon keeps dying."

description: |
  ## What is wrong

  `check!` (`handoffd_supervisor.bb:571-608`) routes both `:dead` and
  `:stalled` to `alarm-and-halt!`, whose `halt-swarm!` runs `swarm-cleanup.sh`
  and kills every role session and the tmux server. BL-144 chose that over a
  restart so a human would look before anything continued. Today
  `babysitterd` (`babysitterd.log`, 2026-09-08 03:47:33Z: `REPAIR [repaired]
  control-plane - ./swarm ensure`; 03:52:38Z `OK all checks green`) rebuilds
  the whole swarm a few minutes after every halt, unattended. The human gate
  is fiction; what remains is the blast radius: nine agents killed mid-parcel
  (the specifier at 03:21:16Z mid-mint, `acceptance-lane-sweep-unowned-reds-
  adjudication-specifier-20260908.md`), inboxes and in_process untouched but
  every pane's context gone. 150 failure reports since 2026-07-15, 26 on
  2026-09-07 alone. `swarm_ensure.bb:102` already states the tension: "on a
  :dead/:stalled verdict it calls alarm-and-halt!, which kills every agent".

  ## What is wanted (if approved)

  - First verdict within a window: restart the daemon in place via
    `start_handoff_daemon.sh` (idempotent, stops any pid-file process first,
    BL-690); no role session is touched; the alarm email still goes out,
    naming a restart rather than a halt; the failure log is still written;
    `restart_history` in the status file records it (scenarios 01, 02, 05).
  - Budget exhausted: the unchanged BL-144 halt (scenario 03).
  - A healthy-uptime window re-arms the budget (scenario 04; BL-303's shape
    for the front-desk supervisor: healthy-uptime reset + cooldown re-arm).
  - A start owner that fails counts against the budget and is not retried
    within the same check (scenario 05) - bounded retries (engineering
    guardrails).
  - Documenter: `docs/how-to/BL-144-daemon-death-alarm.md` "What Happened"
    and the email's wording (`build-alarm-email`, `daemon_alarm_lib.bb`)
    describe the restart-then-halt ladder; `swarm_ensure.bb:102`'s comment
    is re-tensed.

  ## How (direction, not mandate)

  - Keep `evaluate-health` pure and untouched; add a pure `decide-response`
    over (verdict, restart-history, now, budget, window) returning
    `:restart` or `:halt`, tested in a runner like
    `handoffd_supervisor_startup_grace_test_runner.bb`.
  - The restart path reuses `daemon-alarm-lib/alarm-and-halt!`'s adapters
    with `halt-swarm!` swapped for a `restart-daemon!` adapter, so the
    failure log, email and BL-1491 records are one code path.
  - Budget direction: 2 restarts per 600 s, re-armed after 600 s of
    `:healthy`; record the numbers chosen and why in the parcel.

constraints: >
  Babashka only. handoffd_supervisor.bb and daemon_alarm_lib.bb are shared with
  BL-1491 - land BL-1491 first; this ticket's restart path must call BL-1491's
  record writer for the halt leg and write its own daemon-start audit for the
  restart leg. Never exercise the real halt or restart against the live swarm.
  Not to be promoted before human_approval reads approved: a pending tap here
  is a pending decision, not a review formality.

out_of_scope: |
  - The false verdicts themselves (BL-1490) and the halt's audit rows
    (BL-1491).
  - babysitterd's own repair ladder and cadence.
  - Restarting anything other than handoffd + its supervisor.

qa_e2e_procedure: |
  1. Acceptance resolving all five scenarios; the parcel's bb runner green;
     `test_handoffd_supervisor.sh` updated for the ladder and green (note its
     header: it fires REAL alarm emails per killed daemon unless the
     conf/env is fixtured - keep that guard).
  2. Fixture-only live check: a fixture root with a fake start owner
     (`SWARM_ENSURE_SUPERVISOR_CMD`-style env seam or the parcel's own), a
     dead pid in the pid file, no tmux socket file: `--check-once` invokes the
     start owner once, writes `restart_history` with one entry, kills no
     session; run it twice more within the window and the third check halts
     (status `halted`, BL-1491's two records present).
  3. Human-visible: the alarm email received in the fixture mailbox names a
     restart, not a halt, for the first two checks.

