id: BL-1492
title: "The supervisor's response to a :stalled or :dead verdict is BL-144's full halt - kill every role session and the tmux server, then await a human - but babysitterd runs ./swarm ensure three to eight minutes later regardless, so the human gate never fires and the only lasting effect of each halt is nine agents losing their in-flight context (150 times since 2026-07-15, 26 on 2026-09-07); the supervisor restarts the daemon in place under a bounded budget, alarms and audits each restart, and keeps BL-144's full halt as the escalation once the budget is spent"
milestone: M8
type: defect
severity: high
# high: a live fault degrading behaviour - every verdict, true or false,
# costs the full swarm and nine agents' context, and the design's own safety
# rationale (a human looks before anything restarts) no longer holds because
# babysitterd auto-repairs. Not critical: BL-1490 removes the false verdicts
# that make it frequent; this is what a TRUE wedge should cost afterwards.
status: todo
epic: swarm-reliability
priority: 4
direction: swarm-reported
depends_on: []
mutation_cost: low
# low: Babashka only (no mutation/CRAP/DRY wired, BL-472); the hardener gates
# on the bb runners and records the fallback.
slice_size_envelope: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]

acceptance: specs/features/BL-1492-a-stalled-verdict-restarts-the-daemon-in-place-not-the-swarm.feature

