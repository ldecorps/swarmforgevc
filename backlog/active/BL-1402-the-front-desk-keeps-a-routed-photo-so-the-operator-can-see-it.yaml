approval_context: >
  A new feature file is authored here, so it needs a tap. One choice is posed
  and it does NOT change this ticket's scenarios either way: this slice keeps
  the photo of a CAPTIONED message (your "Ces thresholds sont trop bas?"
  screenshot had a caption). A photo sent with no caption is dropped today as
  media-no-caption (BL-620) and stays dropped under option 1; option 2 mints
