description: |
  ## What

  After the Linux (`carillon`) -> Mac host switch, overnight operations showed
  three false or misleading failure modes while the mono-router pack was
  otherwise advancing tickets. The operator fixed all three by hand on
  2026-08-02. The fixes work and are live; they are ticket-less and unreviewed.

  The three faults, as diagnosed in the hotfix how-to:

  1. **handoffd reported DOWN forever.** The freshness cron tried to restart it
     every cool-off window, but cron's PATH is `/usr/bin:/bin`, so the start
     script's `nohup bb ...` failed with `bb: No such file or directory` and
     never claimed the pidfile.
  2. **babysitterd restart spam.** `.swarmforge/swarm.env` sets
     `SWARMFORGE_SKIP_BABYSITTERD=1`, which `start_ancillary_services.sh`
     honours but the freshness checker did not. Cron restarted a deliberately
     disabled daemon on every pass and warned each time.
  3. **Bridge EADDRINUSE crash loop.** An orphan `start-bridge-headless` held
     `127.0.0.1:8765` while the supervisor's tracked pid was dead, producing a
     spawn -> EADDRINUSE -> give-up -> re-arm cycle. The bridge usually stayed up
     via the orphan, so the log looked catastrophic while the system was fine.

  Telegram announces from the checker also reported `TELEGRAM_* unset`, because
  cron never loaded `swarm.env` or the fleet credentials.

  ## In the master working tree (2026-08-02, all modified, none ticketed)

  - `swarmforge/scripts/install_freshness_cron.sh` — bake a PATH (including
    the interpreter's directory) into the crontab line.
  - `swarmforge/scripts/daemon_log_freshness_check.sh` — prepend that PATH,
    source `.swarmforge/swarm.env`, honour `SWARMFORGE_SKIP_BABYSITTERD`, and
    fall back to fleet `telegram.json` for announces.
  - `swarmforge/scripts/front_desk_supervisor.bb` — on bridge spawn, adopt a
    healthy `start-bridge-headless` listener already on our port; otherwise
    free non-bridge listeners, then spawn.
  - `swarmforge/scripts/handoffd.bb` — emit the BL-675 heartbeat at cycle
    START as well as end, so slow Mac cycles (>120s) stop looking wedged.
  - `swarmforge/scripts/remote_control_health_lib.bb` — related health
    reporting.
  - `swarmforge/scripts/test/test_daemon_log_freshness.sh` — extended.
  - `docs/how-to/BL-675-daemon-log-freshness-watchdog.md` — updated.
  - `docs/how-to/hotfix-2026-08-02-mac-host-switch-freshness-bridge.md`
    (untracked) — the hotfix record.
  - `extension/stryker*.config.json` — concurrency lowered for this host; see
    approval_context.

  ## Why now

  BL-787's notes named this body as needing its own BL-506 disposition and
  deliberately did not fold it in. This is that pass. It matters more than most
  adopt tickets because the code IS the swarm's health-reporting path: while it
  was wrong, the swarm's own liveness signals were lying in both directions —
  reporting a healthy daemon as down, and spamming restarts at a daemon nobody
  wanted running.

  ## Scope

  Adopt the files above. Corrections the review must not wave through:

  1. **The skip must be honoured wherever the decision is made, not patched at
     one call site.** `start_ancillary_services.sh` already honoured
     `SWARMFORGE_SKIP_BABYSITTERD`; the checker learned it separately. Confirm
     there is now one predicate both consult, or state plainly why two are
     correct.
  2. **Adoption must verify health, not just a listening socket.** Adopting
     whatever holds the port is how an unrelated process becomes "the bridge".
     The scenarios pin adopt-when-healthy and free-when-not as distinct paths.
  3. **Decide the Stryker concurrency question** (see approval_context).
  4. **Link the hotfix how-to from `docs/index.md`** (BL-756 orphan lesson).

  ## Out of scope

  - The named-tunnel launcher body, including
    `stop_ancillary_services.sh`'s keepalive pidfile line — BL-787 owns that
    file and names it in its own required_wiring. Do not touch it here.
  - The Bubble pairing / client-logs body — BL-788.
  - The Bubble 401 dual-use bearer fix for older APKs — named as out of scope
    by the hotfix how-to itself, still unticketed, and deliberately not folded
    in here (it is a bridge auth change, not a freshness one).
  - A shared release keystore — BL-788's out-of-scope note.

  ## STEERING note

  Adopt-and-review of live operator work, same posture as BL-787 and BL-788.
  Queue-jump so it does not rot, but do not displace BL-769.

