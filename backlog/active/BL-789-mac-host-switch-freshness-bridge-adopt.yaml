notes: |
  ## Severity rationale

  `medium`. Nothing is swarm-down or losing data — the swarm kept advancing
  tickets throughout. But this is the health-signalling path itself, and while
  it was wrong it produced false alarms in both directions, which is how a real
  outage gets missed. Unreviewed, it also risks becoming an ancestor of an
  unrelated QA approval (BL-506).

  ## Acceptance contract is runnable (BL-761)

  Every scenario drives the real shell and Babashka scripts with stubbed
  binaries on PATH, in the shape BL-787's contract already uses — no cron
  installation, no live daemons, no network, no sudo. The shell test
  `swarmforge/scripts/test/test_daemon_log_freshness.sh` already exists and was
  extended by this hotfix; it is the natural home for the checker-side
  assertions, with the acceptance runner driving the observable behaviour.

  Per engineering.prompt's tool table, `.bb` scripts have no mutation/CRAP/DRY
  gate in this project — `swarmforge/scripts/test/` is the real gate for
  `front_desk_supervisor.bb` and `handoffd.bb`. The hardener should not be
  asked for mutation numbers on those two files (BL-472 tracks wiring that up).

  ## IR-DRY findings — reviewed, deliberately kept

  Three medium-confidence `possible-synonym` findings, each a real difference
  in assertion rather than accidental drift:

  - "a healthy bridge process is listening" versus "an unrelated process is
    listening" — opposite preconditions, and the whole point of the adopt
    change.
  - "a bridge process is spawned" versus "no second bridge process is spawned"
    — opposite assertions; folding them would erase the distinction the
    EADDRINUSE loop was caused by.
  - "the freshness check runs" versus "runs mid-cycle" — the heartbeat
    scenario specifically needs the check to land while a cycle is in flight.

  ## e2e procedure for QA

  1. `bash swarmforge/scripts/test/test_daemon_log_freshness.sh` — green.
  2. Install the freshness cron into a fixture root; inspect the written
     crontab line for a `PATH=` containing the interpreter's directory and for
     the project root. Do not install into the live crontab.
  3. Run the checker with `PATH=/usr/bin:/bin` and a stub interpreter reachable
     only outside it: expect the interpreter resolved and no spurious
     down-report.
  4. With `SWARMFORGE_SKIP_BABYSITTERD=1`, run the checker: expect no restart
     attempt and no warning. Flip to `0`: expect the attempt.
  5. With a stub healthy listener on the bridge port and a dead tracked pid,
     take one supervisor turn: expect adoption and exactly one bridge process.
     Repeat with an unrelated listener: expect the port freed and a spawn.
  6. Confirm `docs/index.md` links the hotfix how-to.
  7. Confirm `stop_ancillary_services.sh` is untouched by this parcel (BL-787
     owns it).

  ## 2026-08-10 JumpQ (human)

  Human asked to queue-jump this ticket (and BL-796 behind it) so the
  untracked `operator_path_lib.sh` adopt chain stops rotting as agent
  worktree noise. Retagged `priority: 0` (was 46); `direction: queue-jump`
  already set. Promote BL-789 next when an active slot frees — do not
  displace in-flight high-severity actives. BL-796 stays paused at
  priority 1 until this lands (`depends_on: [BL-789]`).
