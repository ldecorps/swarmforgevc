  - 'swarmforge/scripts/run_commit_guards.sh::check_handler_module_graph.sh::the second consumer - the commit-time guard set that a93aa4a18f passed. A hand-land on main bypasses the land replay entirely, so the guard must sit here too or the exact incident recurs'
