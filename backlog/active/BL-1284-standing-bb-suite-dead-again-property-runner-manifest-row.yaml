id: BL-1284
title: "The standing Babashka suite refuses to run again: BL-1276 left a property-runner row in suite-manifest.tsv, so the only gate wired for the bb/shell lane exits 1 and every red in that lane is invisible"
milestone: M8
type: defect
severity: high
# high: the ONLY standing gate for the Babashka and shell lane (no mutation,
# CRAP or DRY tooling is wired there) runs nothing at all, so every red in that
# lane is invisible for as long as this stands - a broken safety signal, and
# two acceptance features are red on main because of it. Not critical: nothing
# is lost or corrupted, the fix is the deletion of one row, and the gate is
# right about every other row.
status: todo
