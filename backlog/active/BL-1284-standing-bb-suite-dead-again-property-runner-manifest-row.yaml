notes: |
  - [2026-08-30] specifier: `acceptance:` points at BL-1239's feature file
    rather than a new one of this ticket's own, and that is deliberate. The
    contract this ticket must satisfy already exists and is already executable:
    BL-1239 scenario 01 is literally "The suite runs", it drives the real CLI
    and the real `run_bb_suite.sh` against the real tree, and it is red today
    for exactly this reason. Writing a third feature file asserting the same
    thing would be duplication, and a ticket whose deliverable is a deletion
    has no scenarios of its own to declare. **This pointer is not a claim of
    ownership over BL-1239's contract** - BL-1239 keeps it; this ticket is
    measured against it. It also earns BL-1276's own declared-path exemption
    for that path should the parcel ever need to touch it, though it should
    not need to.
  - [2026-08-30] specifier: `invariants:` is deliberately empty. The wrong-fix
    risk here (widening `test-file?` instead of deleting the row) is real, but
    it is a scope constraint, not a property quantified over the slice, and it
    is stated under Constraints where the coder will act on it. Manufacturing
    an invariant would oblige the coder to write a property test for the
    deletion of one data row - worse than no field (BL-633).
  - [2026-08-30] specifier: `required_stages: [coder, qa]` with
    `required_stages_routing_enabled true` in `swarmforge.conf`, so four stages
    really are skipped. That is the point: the gate is dead NOW, and every hour
    it stays dead is an hour of bb/shell reds nobody can see. The four skip
    reasons above are each stated; QA remains the gate and runs both acceptance
    features plus the mapped unit test for the changed path.
  - [2026-08-30] specifier: this is the second time in eight days that the
    standing bb suite has been dead on main - BL-1239 cleared 39 unaccounted
    files and three malformed rows on 2026-08-29, and one row landed the same
    evening put it straight back. The recurrence is the argument for BL-1240,
    not for widening this ticket; the coordinator has the promotion decision.
  - [2026-08-30] specifier: no `human_approval` field, because this ticket
    creates and changes no feature file - it declares an existing, already
    approved one. Nothing here is awaiting a human tap.

