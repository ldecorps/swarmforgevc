required_wiring:
  - "specs/pipeline/steps/index.js::bl998::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "No test run alters live swarm state. A test executing a receive or completion helper reads and writes only its own fixture; the real mailboxes, backlog and worktrees are byte-identical before and after the suite."
  - "The guard decides membership by inspecting what each test executes, never from a checked-in roster of file names, so a newly added offender is caught without anyone remembering to edit a list."

description: >
  The receive and completion helpers resolve their own root, and that is
  correct for production and fatal for a test that points them at a fixture.

  The mechanism, traced rather than assumed. `ready_for_next.sh` opens with
  `SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"` then `cd "$SCRIPT_DIR"`. The
  Babashka dispatcher is worse, because it looks harmless: `ready_for_next.bb`
  ends with
  `(dispatch-lib/run-dispatch! {"batch" "ready_for_next_batch.sh" "task" "ready_for_next_task.sh"})`
  and takes its root from `(dispatch-lib/git-root)` at `:66`. So invoking the
  `.bb` DISPATCHER from the real scripts directory reaches the real `.sh`
  wrappers and the real repo root - whatever fixture the test had `cd`'d into.

  Two consequences, and the second is the reason this is `high`:

  - The test proves nothing about its fixture. It exercises live swarm state,
    so a standing regression guard silently protects nothing. The hardender
    found exactly this while verifying BL-983: the guard for the very file
    BL-983 modified "until this fix provided no real protection".
  - The helper does what it always does - it CLAIMS. A suite run can dequeue
    a live parcel out of a real role's `inbox/new/` into some in_process it
    will never be worked from. The hardender had to confirm by hand that "the
    real in-process batch this session was holding was confirmed untouched by
    the run". A test suite that must be audited for theft afterwards is not a
    test suite.

  THE FIVE, derived by inspecting what each test EXECUTES rather than what it
  mentions, and each verified to run the dispatcher from the real tree with no
  scripts installed into its fixture:

  - `test_compliance_battery_cli.sh:101,108` - `bb "$READY_FOR_NEXT"` and
    `bb "$DONE_WITH_CURRENT"`, both dispatchers.
  - `test_dispatch_lib_receive_mode.sh:48,53,60` - `bb "$READY_DISPATCH"` /
    `bb "$DONE_DISPATCH"`.
  - `test_handoff_state_dir_worktree_root.sh:79` - `bb "$READY_DISPATCH"`.
    MIXED CASE: its lines 86 and 94 call the leaf `.bb` files directly, which
    is the SAFE shape. Only line 79 needs changing; converting the whole file
    would be churn.
  - `test_reference_freshness_guard.sh:82,202` - `bb "$READY"`.
  - `test_idle_clear_respawn.sh:95` - `"$READY_TASK"` where that is
    `ready_for_next_task.sh`, the wrapper itself. The most direct form.

  How (direction, not mandate): the fix already exists twice in the tree and
  should be ported, not reinvented - `install_scripts` in
  `test_ready_for_next_no_promotion.sh` (the hardender's fix, `16c5cf72a`),
  ported there verbatim from `test_ready_for_next_rotate_home.sh`, which had
  documented and worked around this trap for longer. Copy the real scripts
  tree into each fixture worktree and dispatch through the fixture's own copy
  so `cd "$(dirname "$0")"` stays inside it. Then add the guard invariant 2
  describes, so the sixth offender is caught by a check rather than by
  another hardening pass noticing by accident.

constraints: >
  Firm lines:

  - The guard must be DERIVED, not a list. This defect is the third instance
    of the same shape in recent memory - BL-948's gate was itself a hand list
    of spellings and caught 1 of 6; BL-964 gated 3 of 11 seams. A guard that
    names these five files reproduces the bug it is fixing. Decide membership
    by inspecting what a test executes.
  - Do NOT convert the safe shape. Calling a leaf helper
    (`ready_for_next_task.bb`, `done_with_current_task.bb`) directly with an
    explicit root is correct and is how BL-983's own property runner avoided
    this trap. The guard must not flag it, and
    `test_handoff_state_dir_worktree_root.sh` must keep its lines 86 and 94.
  - Do NOT "fix" a test by pointing it at a different real path or by
    exporting a root env var over the top. The wrapper computes its root from
    `$0`; only relocating the executed copy changes the answer.
  - `test_backlog_depth_conf.sh` defines a dispatcher path but never executes
    it. It is not an offender and must not be swept in.
  - Do not widen into BL-974. That ticket fixes a different fixture-isolation
    fault (the 100-char socket path guard) and already declares an
    inspection-time gate for the shell surface. These two guards plausibly
    share a home, and whoever lands the second should look at the first - but
    merging the tickets would oversize both.

qa_e2e_procedure: >
  From the repo root. Every step that runs a suite must be preceded by
  capturing live mailbox state, because the defect's whole point is that a
  run can mutate it.

  1. Snapshot first: record the contents of every role's
     `.swarmforge/handoffs/*/inbox/new/` and `in_process/` before running
     anything. Do this at the parent commit AND at the parcel commit.
  2. Reproduce the theft, carefully, at the parent commit. Seed a parcel into
     a real role's `inbox/new/` (a synthetic one you create, never a real
     parcel), run `test_idle_clear_respawn.sh`, and confirm from the snapshot
     that the helper touched the REAL mailbox rather than the fixture. This is
     the step that demonstrates severity; if you are unwilling to run it
     against the live tree, run it against a full clone and say so.
  3. At the parcel commit, repeat step 2 for all five files and confirm the
     real mailboxes are byte-identical before and after each.
  4. Confirm the tests still pass and still MEAN something: for at least one
     of the five, break the behaviour it guards inside the fixture and confirm
     the test now fails. A test that passed while testing live state will also
     pass after the fix without proving anything, so a green run is not
     evidence on its own.
  5. Confirm invariant 2 by construction: add a throwaway shell test that
     executes the dispatcher without installing scripts, confirm the guard
     fails and NAMES it, then delete it. Then confirm the guard passes for a
     test that installs scripts, and for one that calls a leaf helper with an
     explicit root - the two safe shapes.
  6. Confirm `test_handoff_state_dir_worktree_root.sh` lines 86 and 94 still
     call the leaf helpers directly and were not converted.
  7. Run the acceptance feature, all scenarios green, handler registered in
     `specs/pipeline/steps/index.js`.
  8. Prove non-vacuity: revert one file's `install_scripts` call and confirm
     the guard goes red naming exactly that file, then restore.

notes: >
  Source: hardender note 20260820T160724Z_000286, "5 more tests may share
  BL-983 cd-into-real-repo trap I fixed, unverified".

  The count was RIGHT, and it is worth recording that it was verified rather
  than taken on trust, because two cruder sweeps gave badly wrong answers. A
  tight co-occurrence filter (real-scripts path AND cd-into-fixture AND no
  farming) returned 1. A loose one (any mention of a self-resolving script,
  no farming) returned 55, most of them tests that merely name `swarmforge.sh`
  or grep a script for a symbol without executing it - the
  counting-mentions-not-call-sites trap. The number only settled once the
  discriminator was right: does the test EXECUTE the DISPATCHER (or a `.sh`
  wrapper) from the real tree, as opposed to a leaf `.bb` with an explicit
  root. That distinction is the hardender's own, from BL-983's property
  runner, and it is what makes 5 the answer.

  Related, deliberately separate: BL-974 (paused, approved) fixes the other
  shell-fixture isolation fault - fixtures overrunning the 100-character
  socket path guard - and its invariant 1 already calls for a gate that
  "decides membership by inspection at gate time, never a checked-in roster of
  file names". Same discipline, different fault. Whoever lands the second of
  these should put both guards in one place rather than growing two parallel
  inspectors.

  IR-DRY: 1 medium-confidence finding, reviewed and kept - it pairs "the
  receive helper" against "the completion helper", which are two different
  helpers on two different code paths, and scenarios 01 and 02 assert
  different things about them.

approval_context: >
  One thing needs your judgement, and it is about how to verify rather than
  what to build.

  Step 2 of the QA procedure asks someone to demonstrate the theft - to show
  that the unfixed test really does reach into a live mailbox. That is the
  evidence that makes `high` honest rather than asserted, but it means
  running a known-unsafe test against the live tree with a synthetic parcel
  planted in it. I have written it to allow a full clone instead, at the cost
  of weaker evidence. Tell me if you would rather that step be clone-only, or
  dropped in favour of trusting the hardender's own observation that they had
  to check their in-process batch was untouched.

  Severity `high` rests on that second consequence, not the first. Five
  vacuous regression guards would be `medium` - annoying, contained, and
  invisible until something regresses. A test suite that can silently dequeue
  a live parcel out of a working role's mailbox is a different category, and
  it is the one the hardender stumbled into.

