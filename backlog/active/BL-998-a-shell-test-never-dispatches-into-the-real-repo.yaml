id: BL-998
title: "five shell tests execute the receive/completion dispatcher from the REAL scripts dir while cd'd into a fixture, so ready_for_next resolves the real repo root - the tests prove nothing about their fixtures AND a suite run can claim a live parcel out of a real role's mailbox"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
human_approval: approved
priority: 20
direction: pipeline-note
depends_on: []
mutation_cost: low
