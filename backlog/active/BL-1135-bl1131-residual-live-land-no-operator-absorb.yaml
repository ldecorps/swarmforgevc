description: |
  ## What is wrong

  BL-1131's rematch-then-FF **policy** is in tree, but the **live** QA land
  → origin/main → master absorb path still leaves behind>0 with reconcile
  conflict escalation that pages a human. `:replay-bookkeeping` /
  `:refuse-rematch` are not enough if the land tip was never rematched
  pre-publish and bookkeeping replay is not executed (or rematch not
  surfaced to the owner) — ops still finish the join.

  ## What to do

  Close the residual end-to-end on the live path:
  1. Pre-publish rematch so landed tips contain origin/main (or refuse to
     lander) before push to origin/main.
  2. Post-land absorb: FF-only or automated bookkeeping replay; on
     conflict, rematch lander/bookkeeping owner — never escalate
     "needs a human" absorb as designed recovery.
  3. Acceptance must fail if a fixture land still requires
     Complete-origin/main-merge to reach behind=0 / proceed.

  ## Out of scope

  - Heuristic auto-merge of conflicted file contents.
  - Reverting BL-1130 / BL-1120.
  - Unrelated overnight dirty WIP / Cursor batch Process B (BL-1118).

qa_e2e_procedure: >
  (1) Fixture: ahead local main + overlapping land tip through live land
  path → behind=0 / proceed, no absorb-merge commit. (2) Would-conflict
  absorb → rematch recovery wording, no MERGE_HEAD, no needs-a-human
  absorb page as designed recovery. (3) replay-bookkeeping plan is
  handled live (replay or owner rematch), not wait-dirty-clear forever.
  (4) BL-1130/1120 preserved.

