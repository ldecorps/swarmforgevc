description: |
  ## What is wrong

  `swarmforge/scripts/check_art_director_tip.sh` line 49:
  `ART_DIRECTOR_REF="primary/art-director"`, used at lines 138 and 166
  (`git merge-base --is-ancestor <tip> "$ART_DIRECTOR_REF"`). No such ref
  exists on this host: the `primary/*` branches (`primary/QA`,
  `primary/architect`, `primary/cleaner`, `primary/coder`,
  `primary/documenter`, `primary/hardender`, `primary/coder-cursor2`) are
  the nested pack's, frozen at 2e519c4a8f (2026-08-30) under
  `.worktrees/coder/.worktrees/<role>`, and never included an
  art-director. The live seat's roster row
  (`.swarmforge/roles.tsv`: `art-director  art-director
  .../.worktrees/art-director  swarmforge-art-director ...`) is checked
  out on `swarmforge-art-director`, which does contain every tip the art
  director sends. So `--tip <sha>` and hook mode both refuse every live
  tip with `ART_DIRECTOR_TIP_REFUSED: <sha> is not on primary/art-director.`
  QA's evidence (QA branch 6ab9160dfe,
  `backlog/evidence/check-art-director-tip-branch-name-bug-20260920.md`):
  QA verified the lane by hand (`git diff --name-only $(git merge-base
  HEAD <sha>) <sha>` = `docs/design/artifact-inventory.md`) and landed
  d40a6fb21f as b4cce6448c. BL-1444's handler
  (`specs/pipeline/steps/bl1444ArtDirectorTipLandsSteps.js` lines 151,
  196-239) creates `primary/art-director` in its fixture, so the guard's
  own acceptance has been green against a literal production never has -
  the BL-1445 shape: a fixture that satisfies the anchor by construction
  gates nothing.

  ## What is wanted

  - The guard resolves the art director's branch, in this order: an
    explicit `--branch <name>` argument; else the roster row whose seat
    is `art-director` in `<root>/.swarmforge/roles.tsv` - the branch its
    worktree path (column 3) has checked out; else the
    `swarmforge-art-director` convention. Every refusal names the ref it
    compared against and which of the three sources gave it.
  - A row whose worktree cannot be read, or a resolved ref that does not
    exist, refuses (fail-closed) saying so - never a pass, never a fall
    through to a different branch silently.
  - BL-1444's handler fixture builds the roster shape (a roles.tsv row
    and a worktree checked out on `swarmforge-art-director` - the idiom
    this host actually uses, BL-1445) and every BL-1444 scenario stays
    green; the shell test `test_bl1444_art_director_tip_guard.sh` covers
    the three sources.
  - The draft feature above is renamed, its handler registered, and
    `acceptance:` repointed, in one commit.

  ## How (direction, not mandate)

  - Read the row with the same `awk -F'\t'` idiom
    `sweep_all_inbox.sh` uses on `.swarmforge/roles.tsv`; resolve the
    branch with `git -C <worktree> symbolic-ref --short HEAD` (a detached
    worktree refuses). Keep the BL-1303 GIT_DIR posture the script
    already has. Mirror `bl1444ArtDirectorTipLandsSteps.js` for the new
    handler: same mkdtemp repository, hook chain installed, a `roles.tsv`
    written per scenario. Scenario 03 drives `--tip <sha> --branch <name>`
    directly; 01 and 02 drive the hook through a real merge.

constraints: >
  No change to the lane rule, the provenance exemption, or the hook
  chain line (`swarmforge/git-hooks/pre-merge-commit:62`). No change to
  check_documenter_briefing_tip.sh (BL-1459's). The fixture is its own
  repository under mkdtemp registered for reaping (BL-1390, BL-1636),
  never the live one.

out_of_scope: |
  - Removing or refreshing the nested pack's frozen `primary/*` branches
    and the `.worktrees/coder/.worktrees/*` checkouts: a separate
    observation for the operator (never remove worktrees by substring).
  - Generalising the two lane guards into one parameterised script
    (BL-1459 explicitly defers it).

qa_e2e_procedure: >
  (1) `node specs/pipeline/cli.js specs/features/BL-1657-the-art-director-tip-guard-resolves-its-branch-from-the-roster.feature`
  ONCE on the parcel commit: 4 rows ok (outline 2 plus 2); then
  `node specs/pipeline/cli.js specs/features/BL-1444-the-art-directors-tip-lands-on-main-by-qa.feature`
  once: every scenario ok. (2)
  `bash swarmforge/scripts/test/test_bl1444_art_director_tip_guard.sh`
  once: green. (3) On the live repository from the QA checkout:
  `swarmforge/scripts/check_art_director_tip.sh --tip d40a6fb21f` exits 0
  (the docs-only tip QA hand-verified on 2026-09-20), and
  `... --tip d40a6fb21f --branch no/such-branch` refuses naming
  `no/such-branch` and the command line as its source. Never "run it N
  times".

