  Background without changing what a scenario asserts.

qa_e2e_procedure: >
  On a scratch clone, cut a branch from main and add a commit that deletes
  most of the tree (simulating the fixture collapse). Write a git_handoff
  draft citing that commit, addressed to a role whose branch is intact, and
  run swarm_handoff.sh: it must refuse and name the path count. Confirm
  nothing was delivered to the recipient's inbox/new/. Then repeat with a
  commit deleting a single directory: it must send. Finally, re-run the first
  case addressed to QA and to the hardener in turn - both must refuse,
  proving the guard is not the QA-edge gate.
