id: BL-1205
title: "A git_handoff whose merge would mass-delete the recipient's tracked files is sent without complaint: no hop but the QA edge is gated, and that gate needs a ticket id"
milestone: M8
type: defect
severity: critical
# critical: data-loss / swarm-down class, and live right now. On 2026-08-27
# refs/heads/swarmforge-architect stood at 79 tracked paths against main's
# 9,777. Simulating the very next hop the branch was queued to make
# (`git merge-tree --write-tree swarmforge-hardender swarmforge-architect`)
# produced a 93-path tree against the hardener's 9,773: one ordinary forward
# deletes 9,680 tracked files with no conflict and no marker, and is then four
# ordinary hops from landing that deletion on main. Not "critical" for the
# corruption itself (that is BL-1196/BL-1200's lane) but for the total absence
# of anything that stops it spreading once it exists.
