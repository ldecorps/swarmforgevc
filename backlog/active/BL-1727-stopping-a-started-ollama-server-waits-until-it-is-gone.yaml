id: BL-1727
title: "extension/test/bl1703OllamaLaunchProbe.property.test.js failed at load ~11 (QA, BL-1720's parcel d24e8d4b0c): 'expected pid 7123 to be stopped' after a refused launch - ollama_ancillary_lib.sh's ollama_ancillary_stop_pid sends one TERM and returns at once, so the refused launch (BL-1703) and the swarm's stop paths (BL-1704) report a started ollama server stopped while it may still be running; the helper waits, bounded, for the pid to exit, escalates to KILL, and fails naming the pid if even that does not end it"
milestone: M8
type: defect
severity: high
# high: a standing red at first registered sighting is high (2026-09-05
# register amendment); it holds BL-1720 at QA (Article 4.2). The product
# fault behind it is live: a real ollama serve that is slow to exit or
# ignores TERM stays running (holding its model's memory) after the swarm
# says it stopped it. Not critical: nothing is lost; the process is the
# swarm's own and the next stop path or reboot ends it.
