type: defect
severity: high
# high: a broken safety signal. The sweep's only reading of an open merge is
# "a human is mid-merge, hold", asserted from MERGE_HEAD presence alone. On
# 2026-09-04 that reading held two roles and the daemon for 15 minutes on a
# merge with no owning process and a poisoned index, and told the human
