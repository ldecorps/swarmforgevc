description: |
  ## Status

  A Cursor agent landed this on main as 1e64496d93 ("Intake: shared
  local-model prepare lib for recruiter and steward") with a raw intake and
  a brief, asking the specifier to mint the acceptance. The coder reviews
  the landed code, builds the step handler, and fixes what review finds;
  the parcel never re-applies the code.

  ## Why it exists

  On 2026-10-09 two candidate coder models probed on their bare Hugging
  Face tags handed off 0 of 5 BL-1700 scenarios, every coder fixture
  ending "no model commit" in 10-16 s (backlog/evidence/
  local-coder-probe-hf.co-*-2026-10-09T17-4*.md). The live iq3 seats run
  behind a Modelfile (num_ctx, num_predict) with thinking off; the bare
  tags had neither, so the probe ranked the harness, not the model.

  ## What is gated

  - `local_model_prepare_lib.bb` `prepare!` renders
    swarmforge/packs/local-coder-prepare.Modelfile.tmpl (FROM the base
    tag, num_ctx 32768 and num_predict 4096 unless overridden), writes it
    and a think-off aider settings file under
    .swarmforge/model-steward/prepared/, and runs `ollama create <alias>
    -f <Modelfile>`; `--dry-run` skips the create (scenarios 01, 02).
  - `model_steward_cli.bb probe <tag> --prepare` probes the prepared
    alias with `--model-settings-file`; a probe without `--prepare` whose
    summary matches `empty-response-fail-shape?` (0 handed off, every
    coder fixture "no model commit" under 60 s) is prepared and re-probed
    once (scenario 03, invariant 2).
  - Nothing outside the prepared directory is written (scenario 04).
  - Living docs: docs/how-to/BL-547-model-steward-overview.md and
    docs/how-to/BL-1700-model-steward-coder-probe.md (updated in the same
    commit) match what the code does.

  ## How (direction, not mandate)

  - The handler drives `model_steward_cli.bb prepare` (and the lib's
    `empty-response-fail-shape?` for scenario 03) with a temp state dir
    and a fake `ollama` script first on PATH that records its argv. A
    small seam for the state dir is fine if the CLI lacks one.

constraints: >
  Temp state directories and a fake ollama only; never the live Ollama,
  the live .swarmforge/model-steward/, or a real model pull. The step
  handler lands with the feature (BL-233).

out_of_scope: |
  - The recruiter's use of prepare after pull: BL-2108.
  - Pack conf generation, shim or qwen seat-stack as the bar, host VRAM or
    KV tuning, cold-swap or day_shift automation (the intake's own list).
  - Naming prepare in the onboarding runbook: BL-1956 (paused) carries the
    cross-link note; its doc-only scope is unchanged.
  - Observed, not in scope: `model_steward_cli.bb probe --help` takes
    `--help` as the model and starts a real probe (a probe tmux for model
    `--help` was still alive at 18:58Z-19:55Z on 2026-10-09); the first-
    argument parse predates this commit.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2106-the-steward-probes-a-local-coder-through-a-prepared-alias.feature`:
     7 of 7 ok (01 x2, 02, 03 x3, 04).
  2. `bb swarmforge/scripts/test/local_model_prepare_lib_test_runner.bb`:
     ALL CHECKS PASSED; `bb swarmforge/scripts/test/model_steward_coder_probe_lib_test_runner.bb`:
     ALL PASS (both measured on main at mint).
  3. `node specs/pipeline/cli.js` on the BL-547, BL-1700 and BL-1701
     features: 15/15, 7/7 and 5/5 ok (BL-1700 7/7 with hotfix 597801eadd;
     measured on main at mint).
  4. Read the steward's two prepared re-probes in backlog/evidence (steward
     task backlog/evidence/steward-probe-prepared-20261009.md): each names
     the prepared alias, not the bare tag.

