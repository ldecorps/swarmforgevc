approval_context: >
  BL-848 hotfix stamp-off for already-landed commit 2ec06b6ef1. Review-only:
  it confirms or refutes the land and never reimplements it. What needs your
  decision is the ledger row - certify or waive - which green tests must never
  write on their own. One thing to know before you decide: the commit landed
  under SWARMFORGE_SKIP_PROPERTY_SUITE_GUARD=1 (its own intake records this),
  with the reason given as standing property reds unrelated to the change and
  telegramCursorBridgeCore.property.test.js green. I have NOT verified that
  claim; scenario coverage here is the landed behaviour, not the override.

  CARRIED VERBATIM from retired BL-1260 (superseded by this ticket on
  2026-08-30). That decision was never individually answered: BL-1260's
  human_approval came from the bulk sweep f4ae431a9 ("Approve BL-1252..BL-1266
  (15 paused)"), not a tap on this question. It is outstanding, and it belongs
  to the ledger decision for 2ec06b6ef1, not to a separate ticket:

  "What specifically needs sign-off: THE STALL WINDOW, 90 seconds, and the
  direction it fails in. When the bridge decides the front desk is dead it
  starts calling getUpdates on the SAME bot token. If that judgement is ever
  wrong - the front desk still polling but slow or blocked in stamping its
  heartbeat - the result is two pollers on one token, which is the Telegram 409
  class the bridge has been repeatedly stabilised against. So 90s is not a
  tuning constant; it is the margin between 'operator gets an answer' and 'both
  readers break'. It was picked during a live outage. Confirm 90s, or say what
  margin you want."

  The constant is live at telegramCursorBridgeCore.ts:371
  (DEFAULT_FRONT_DESK_FEEDER_STALL_MS = 90_000).

invariants:
  - "This stamp-off never reimplements the hotfix - review confirms or refutes landed commit 2ec06b6ef1 only."
  - "Green tests alone never write certified or waived into the hotfix ledger; only a recorded human decision does."
  - "At most one process calls getUpdates on a given bot token at any moment: the bridge takes the token only while the front desk is judged not to be polling, never alongside it, and returns it when the front desk recovers. (Carried from retired BL-1260.)"

required_wiring:
  - "specs/pipeline/steps/index.js::bl1253DeadFeederOwnsGetUpdatesStampSteps::acceptance handler registered so the runner executes every review scenario"

description: >
  WHAT. Operator/Cursor hotfix 2ec06b6ef1 is live on main with the trailer
  Hotfix-Certification: pending. Subject: "Own getUpdates when the front-desk
  inbound feeder is dead."

  Landed behaviour under review (do not redesign): shared-token inbound queue
  mode is gated on front-desk poll heartbeat liveness rather than assumed.
  extension/src/tools/cursorBridgeInboundQueue.ts gains
  frontDeskPollHeartbeatPath / readFrontDeskPollHeartbeatMs over
  front-desk-poll-heartbeat.json; the bridge re-evaluates liveness each poll
  and owns getUpdates itself when the feeder is stale, absent or unparseable;
  start_cursor_bridge.sh defaults CURSOR_BRIDGE_INBOUND_QUEUE=0 when the
  feeder is not live.

  WHY. Queue mode drained an empty file while the bridge's own heartbeat still
  looked healthy, so the host stayed silent and /pilot piled up unanswered in
  Telegram. Separately: an unticketed hotfix never becomes an official swarm
  deal on green tests alone (BL-848).

  HOW (direction, not mandate). Walk the acceptance feature against the landed
  sources at 2ec06b6ef1. Open a narrow follow-up only if review finds a
  defect; do not rewrite the bridge in this parcel.

constraints: >
  Out of scope / firm lines:

  - Do NOT reimplement, rewrite or revert the hotfix. This parcel confirms or
    refutes what landed.
  - Do NOT write certified or waived into backlog/hotfix-ledger.yaml. Only a
    recorded human decision does that, however green the suite is (BL-848).
  - Do NOT redesign the feeder/queue split, the heartbeat file format, or the
    front-desk bot itself. If review finds a design defect, that is a narrow
    follow-up ticket, not this parcel.

qa_e2e_procedure: >
  (1) At commit 2ec06b6ef1, confirm cursorBridgeInboundQueue.ts defines
  frontDeskPollHeartbeatPath and readFrontDeskPollHeartbeatMs, and that the
  latter returns null for a missing or unparseable file.
  (2) Confirm the queue-vs-getUpdates decision consults feeder liveness on
  each poll, not once at start.
  (3) Confirm start_cursor_bridge.sh defaults CURSOR_BRIDGE_INBOUND_QUEUE=0
  when the feeder is not live.
  (4) Run the extension unit tests covering the three touched test files.
  (5) Leave Hotfix-Certification pending until the human ledger decision.

out_of_scope: |
  - Reverting or rewriting the hotfix.
  - Any change to the front-desk bot or the heartbeat writer.
  - Certifying the ledger row without a human decision.
  - The standing property-suite reds referenced by the commit's override.
  - Pushing main to origin (QA lands and pushes).

