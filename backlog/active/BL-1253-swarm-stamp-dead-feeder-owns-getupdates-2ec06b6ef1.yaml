notes: |

  ## AMENDMENT 2026-08-30 - absorbed retired BL-1260 (Article 5.3)
  
  BL-1260 was a duplicate stamp-off for this same hotfix `2ec06b6ef1`; the ledger
  cited it while this ticket was the one promoted and routed. Reported by the
  coder as a stamp collision. BL-1260 is retired
  (`closed_as: superseded-by-BL-1253`) and the ledger row now cites BL-1253.
  
  Article 5.3 forbids a consolidation that drops a human sentence, so BL-1260's
  content was assessed piece by piece rather than discarded.
  
  CARRIED HERE:
  - Its 90-second stall-window decision, quoted verbatim into `approval_context`.
    **This question is OUTSTANDING.** `human_approval` is deliberately left
    `approved` so this in-flight ticket is not stalled, but the question must be
    answered as part of the ledger decision for `2ec06b6ef1` - it must not be
    closed as certified or waived without it.
  - Its invariant 1 (at most one getUpdates poller per token, and the token comes
    back) - the safety property the hotfix exists to protect, which this stamp-off
    did not state.
  - Its scenario 03, as new scenario 06: a recovered feeder gets the token back.
  
  ASSESSED AS ALREADY COVERED, so retired rather than duplicated:
  - BL-1260 scenarios 01 and 04 -> this ticket's scenario 01 outline
    (fresh/stale/absent) and scenario 03 (malformed heartbeat).
  - BL-1260 scenario 02 (mid-run takeover) -> this ticket's scenario 02.
  - BL-1260 invariant 2 (decision re-read every poll) -> this ticket's scenario 02.
  - BL-1260's `telegram-front-desk-bot.ts::front-desk-poll-heartbeat.json` writer
    anchor: that writer EXISTS on main (verified 2026-08-30), so it is not the
    dark-path risk the entry guarded against.
  
  WHAT CHANGES FOR WHOEVER HOLDS THIS: one new scenario (06) needs a step handler
  in the same parcel as the other five - none are registered yet, so it is one
  more handler in a set you were writing anyway. One new invariant means one more
  architect review pass. Nothing already built changes.
    - [2026-08-29] specifier: the second intake is refuted, not minted. It
    describes 2ec06b6ef1's content verbatim but names SHA 5045fae371, whose
    actual subject is "Register bounce-reason hotfix 5de352ed1d in the
    ledger." - a ledger-bookkeeping commit with no functional change, and the
    PARENT of 2ec06b6ef1. Its intake also claims the ledger registered
    5045fae371 state pending; the ledger contains no such row (grep -c
    returns 0). The same mistake shape is visible one commit chain over:
    94496c1d07 "Register expedite no-verdict recovery hotfix 3f4f69ec1b in the
    ledger" is the same kind of bookkeeping commit. Minting a stamp-off
    against a ledger-registration commit would certify nothing. There is ONE
    dead-feeder hotfix, and it is 2ec06b6ef1.
  - [2026-08-29] specifier: ledger link is the coordinator/operator step at
    promotion - `bb swarmforge/scripts/hotfix_ledger_update.bb . --link
    2ec06b6ef1 BL-1253`. Recorded here so it is not lost; the ledger row is
    still stamp_ticket null at mint.
  - [2026-08-29] specifier: shape follows BL-1136 / BL-1113 stamp-offs.

