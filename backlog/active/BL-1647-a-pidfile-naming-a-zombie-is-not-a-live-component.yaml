invariants:
  - "A pidfile owner counts as running only while its process exists and has not exited: a zombie (exited, unreaped) is not running, for every component the pidfile idiom checks (onboarder, front-desk, tunnels)."
  - "The fixture never depends on the parent shell's reaping latency: a kept component's death is made observable deterministically before the verify runs."

description: |
  ## What is wrong

  `swarmforge/scripts/finish_shift_lib.sh` `_finish_shift_pidfile_alive`
  answers `kill -0 "$pid"`, which succeeds on a zombie (exited, not yet
  reaped by its parent). `test_finish_shift_lib.sh` case 08 kills the
  fixture's front-desk `sleep` INSIDE a command substitution and calls
  `wait "$FD_PID"` there - but that pid is the parent script's child, not
  the subshell's, so `wait` returns at once and the process stays a zombie
  until the parent handles SIGCHLD. The parent is blocked reading the
  substitution's output; it reaps only when it gets scheduled for the
  signal. Usually that is long before the verify runs (the stop step
  takes a second); under host load it is not, `kill -0` says alive,
  front-desk is not flagged as unexpectedly stopped, and the case prints
  `expected front-desk flagged as unexpectedly stopped, got: CLEAN`.

  Reproduced 2026-09-19 (specifier, standalone, load 12-14): a `sleep 300 &`
  killed with `-9` inside `$( ... )` then probed with `kill -0` read ALIVE
  five times out of five; the same probe after the parent's own `wait`
  read dead. The real test passed 3 of 3 on main 4617c74bbc (18 s each,
  load 9.6-14.5); the hardender's BL-1639 pass saw case 08 red once in
  its worktree (its note 001414, "flaky, unrelated"; BL-1639 touches the
  babysitterd branch of the lib, not this helper).

  ## What is wanted

  1. `_finish_shift_pidfile_alive` (and any sibling that trusts `kill -0`
     for a pidfile owner) treats an exited-but-unreaped process as not
     alive: `kill -0` AND `ps -o stat= -p <pid>` not beginning with `Z`
     (stock macOS `ps` and procps both print it).
  2. Case 08 no longer depends on reaping latency: kill and `wait` the
     front-desk pid in the PARENT shell (take the keep snapshot in the
     parent too, or pass the pre-kill snapshot in), so the pid is gone
     before the subshell verifies; keep the case's assertion.
  3. A new case (09) pins the mechanism: a pidfile naming a zombie
     (killed inside a substitution, unreaped) reads as NOT running for
     front-desk, onboarder and tunnels.

  ## How (direction, not mandate)

  - Stock bash 3.2 throughout (BL-801/BL-1627); `ps -o stat=` only, never
    `/proc` (macOS). The test's own belt-and-braces kill block at the end
    stays.
  - The BL-762 acceptance handler (`bl762FinishShiftPhonePathSteps.js`)
    builds the same "services up" fixture shape; if it kills a fixture pid
    inside a spawned script, apply the same parent-shell wait there.
  - Docs: one line in `docs/how-to/BL-762-finish-shift-bedtime-vs-lights-out.md`
    under verify: a zombie owner is not alive. No diagram.

constraints: >
  No change to the keep/stop sets, the matrix, or the survivor ps-snapshot
  seam. The feature's fixture spawns its own children under mkdtemp roots
  and reaps them in a finally (BL-971), never touching the live
  `.swarmforge/`; runtime stays seconds (BL-1541). The step handler lands
  in the same commit as the feature (BL-233).

out_of_scope: |
  - The host contention that widens the window (BL-1633, BL-1636).
  - BL-1639's babysitterd census (it lands independently).
  - Any other case of test_finish_shift_lib.sh (01-07 were green in every
    run observed).

qa_e2e_procedure: >
  (1) `bash swarmforge/scripts/test/test_finish_shift_lib.sh` ONCE:
  `PASS=12 FAIL=0` (case 09 present in the PASS lines - the census pin).
  (2) Acceptance: the BL-1647 and BL-762 features green through the
  runner, once. (3) Mechanism, once: `sleep 300 & P=$!; echo $P >
  <fixture>/.swarmforge/operator/front-desk-supervisor.pid; r=$( kill -9
  $P; source swarmforge/scripts/finish_shift_lib.sh;
  finish_shift_component_running <fixture> front-desk && echo running ||
  echo stopped ); echo $r; wait $P` prints `stopped`. Never "run it N
  times".

