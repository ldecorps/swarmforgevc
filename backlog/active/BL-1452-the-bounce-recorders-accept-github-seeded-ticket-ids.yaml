id: BL-1452
title: "record-bounce.js, record-qa-bounce.js and qa-sibling-check.js refuse GH-<n> ticket ids (bounceArgsCore.ts TICKET_PATTERN ^BL-\\d+$ and a copy): QA's bounce of GH-24 on 2026-09-06 wrote no JSONL record and no bounce_history entry, so the bounced commit reads as QA-approved to is_qa_ancestor.sh and the bounce is invisible to the bounce-rate metrics; one shared ticket-id predicate accepts BL-<n> and GH-<n> and the three CLIs use it"
milestone: M8
type: defect
severity: high
# high: a broken safety signal. is_qa_ancestor.sh (BL-925/BL-952) vetoes
# approval only from the two bounce stores; a GH ticket's bounce reaches
# neither, so its bounced commit - reachable from swarmforge-QA because QA
# merged it to review - reads as approved to the push-sweep gate, the
# babysitter's Article 4.2 sweep and the commit-time guard. The exact
# path BL-945's twice-bounced code took onto origin/main. Two GH tickets
# are live today (GH-24 at the documenter after this bounce, GH-29).
status: todo
