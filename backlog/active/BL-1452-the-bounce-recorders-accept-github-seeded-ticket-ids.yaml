  must NOT re-run record-bounce for 718bd15071 once this lands (that would
  double the YAML entry) - the missing JSONL line is accepted as the cost
  of the incident and noted in this ticket's evidence.

  INVEST at mint: Independent (no unbuilt sibling; BL-1453 waits on this),
  Negotiable (module name and file are direction; the predicate's
