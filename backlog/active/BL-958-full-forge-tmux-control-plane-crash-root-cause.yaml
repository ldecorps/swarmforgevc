id: BL-958
title: "Full-forge crash: tmux control plane disappears while daemons stay up; investigate why operator/babysitterd did not remediate"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 12
direction: human-directed
depends_on: []
mutation_cost: medium
required_stages: [specifier, coder, cleaner, architect, hardender, documenter, qa]
assigned_to: specifier
acceptance: specs/features/BL-958-full-forge-tmux-control-plane-crash-root-cause.feature

description: >
  Investigate and fix the crash class where the swarm's tmux control plane
  disappears while support daemons remain healthy, causing every role to read
  DOWN even though handoffd, handoffd-supervisor, front desk, and babysitterd
  continue running. This happened live on 2026-08-19: status showed all role
  agents DOWN, handoffd UP, and repeated handoffd chase failures
  (`tmux send-literal failed`) against coder/hardender/QA/coordinator.
  The tmux socket path still existed, but `tmux -S <socket> ls` returned
  "no server running". This is not a policy pause (`control-pause.json` had
  `"active":false`) and not a full daemon stop (`handoffd.status.json` was
  healthy). Root cause is currently unknown from logs and must be made
  diagnosable and recoverable. The investigation explicitly includes detection
  and response responsibility boundaries for `operator-runtime` and
  `babysitterd`: why they did not trigger remediation/escalation for this
  control-plane-loss shape, and what contract change is required so this class
  cannot remain silently degraded.

invariants:
  - "If the tmux server is gone, swarm state must report a control-plane failure explicitly (never just per-role DOWN with stale session metadata)."
  - "A missing tmux server cannot leave the system in a half-alive state indefinitely; either controlled auto-recovery occurs or a single actionable incident is emitted with root-cause evidence."
  - "Role health reporting must derive from live control-plane truth, not stale `sessions.tsv`/`windows.tsv` artifacts."
  - "When role control-plane loss is detected, either `operator-runtime` or `babysitterd` must own a deterministic response path (recover, or escalate once with concrete reason and next action)."

required_wiring:
  - "swarmforge/scripts/swarm_status.bb::control_plane_lib::status must classify tmux-server-missing through the shared control-plane lib, never from stale sessions.tsv metadata"
  - "swarmforge/scripts/handoffd.bb::control_plane_lib::a failed chase tmux send must persist the structured control-plane incident through the same shared lib"
  - "swarmforge/scripts/swarm_ensure.bb::control_plane_lib::the recovery path must decide control-plane-loss recovery through the same shared lib"

verification: >
  1) Reproduce/fixture the control-plane-loss shape: stale socket file exists,
  no tmux server responds, role metadata files still present.
  2) `./swarm status .` must emit a clear control-plane failure classification.
  3) `./swarm ensure .` (or agreed recovery path) must restore full-forge role
  sessions without requiring manual archaeology.
  4) Prove `operator-runtime`/`babysitterd` behavior in this shape:
  deterministic recovery or deterministic escalation artifact with one clear
  owner.
  5) Run acceptance for this ticket plus relevant unit suites for status,
  handoff recovery, and operator/babysitter detection logic.

qa_e2e_procedure: >
  1. Start full forge and verify all roles UP.
  2. Simulate/force tmux control-plane disappearance while leaving daemons up.
  3. Confirm status reports control-plane failure (not just generic role DOWN).
  4. Confirm recovery command restores all expected sessions.
  5. Confirm operator/babysitter path reacts per policy (auto-recover or one
     escalation) rather than silent repeated degraded operation.
  6. Confirm one actionable incident artifact is written with enough data to
     explain what failed (socket path, tmux probe output, session expectations,
     recovery attempt outcome).

notes: >
  SPECIFIER AMENDMENT (2026-08-19, at spec stage, pre-coder — no downstream
  worktree held a copy yet): the minted required_wiring entries were not
  gate-compatible. pre_qa_gate_lib.bb parses each entry as
  path::pattern::why with a plain-substring pattern match against the single
  named path at the sent commit (BL-531/BL-874): an "and/or" composite path
  can never resolve, and section-name placeholders ("agent-health",
  "recovery-policy", "control-plane-loss-policy") are identifiers nobody has
  committed to writing — the exact BL-874 trap that hard-blocked a
  documenter forward on six entries at once. Rewritten to three entries
  anchored on a spec-fixed contract: ONE new shared lib,
  swarmforge/scripts/control_plane_lib.bb, is the single home for the
  control-plane-loss classify / persist-incident / response-policy logic
  (one chokepoint, same anti-drift shape as BL-663), and each integration
  point must source it — the literal a load-file line necessarily carries
  (the BL-531 pre_qa_gate_lib precedent). The fourth minted entry (who owns
  detection: operator_runtime vs babysitterd) is deliberately NOT a hard
  wiring gate: naming either file would pre-judge the investigation this
  ticket exists to run. It is gated instead by acceptance scenario
  control-plane-loss-03 (the policy resolves to exactly ONE deterministic
  owner action; reference corrected 2026-08-19 — it said -04, a stale
  pre-renumbering index) and verification step 4. Classification token
  fixed by the acceptance contract: control-plane-missing.

  Original required_wiring as minted, preserved verbatim:
    - "swarmforge/scripts/swarm_status.bb::agent-health::detect and surface
      tmux-server-missing as first-class status"
    - "swarmforge/scripts/handoffd.bb::chase-resume-path::when tmux send
      fails persist a structured incident with socket/session/window
      diagnostics"
    - "swarmforge/scripts/start-swarm.sh and/or
      swarm_ensure.bb::recovery-policy::define and test safe recovery
      behavior for control-plane loss"
    - "swarmforge/scripts/operator_runtime.bb and/or
      swarmforge/scripts/babysitterd*.bb::control-plane-loss-policy::codify
      who detects tmux-server-missing, recovery threshold, and human
      escalation output"

  Also at spec stage: this YAML was found UNTRACKED in the shared master
  checkout (the BL-314 shape); the specifier committed it alongside the
  feature file so downstream worktrees can see it. IR-DRY on the feature
  file: one remaining near-duplicate finding (the outline's
  "<prior> control-plane incident is already recorded" vs scenario 03's
  literal "one control-plane incident is already recorded", score 0.889)
  reviewed and kept — deliberate shared setup across two different
  behaviors, maximally aligned wording; the pinned checker does not
  normalize a literal against a placeholder (known limitation, and exactly
  the case the BL-959-evaluated upstream parser-inference commit addresses).

  Evidence captured from live run at ~2026-08-19 18:00Z:
  - `.swarmforge/daemon/handoffd.log` repeated `chase-in-process-resume-error`
    and `chase-wake-error` with `tmux send-literal failed`, while heartbeat
    cycles continued.
  - `tmux -S /Users/ldecorps/projects/swarmforgevc/.swarmforge/tmux/3752320954.sock ls`
    returned "no server running".
  - `.swarmforge/operator/control-pause.json` was `{"active":false}`.
  - `.swarmforge/daemon/handoffd.status.json` was healthy.
  - `.swarmforge/sessions.tsv` and `.swarmforge/windows.tsv` still listed role
    sessions/windows, indicating stale metadata after control-plane loss.
  - `operator-runtime` was down/stale at observation time while other daemons
    remained up; this ticket must clarify whether that was causal, parallel,
    or irrelevant and ensure the control-plane-loss path is still handled.
  - No decisive artifact explained why babysitterd/operator did not remediate
    despite sustained `tmux send-literal failed` errors; this is now explicit
    in-scope rather than implied.
  - Full forge was relaunched successfully with `./start-swarm.sh` and health
    verified, so this ticket focuses on diagnosis and prevention of recurrence.

