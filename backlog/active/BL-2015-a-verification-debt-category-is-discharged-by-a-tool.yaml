approval_context: >
  Inherited from BL-1783 (approved), split 2026-10-05 with no new scope.
  FIRM (from the intake): discharge tracking in the hardening-debt ledger's
  pattern. Chosen at BL-1783's mint, open to amendment: a settle applies to
  the whole category, not one row; anyone may run the verb, and the row
  records who did.

description: |
  ## Why

  BL-1782's reader reports a category unowned at its threshold. Once the
  tool that makes the check mechanical ships and its ticket closes, the
  category would read unowned again forever unless the ledger can record
  that the debt was paid. This slice adds that record: a discharge. (The
  waiver is BL-2016's scenario, the refusals BL-2017's; the code for both
  verbs arrives here because the salvage already holds it.)

  ## Start from the salvage - most of the work is done

  The iq3 seat's uncommitted work is pinned at
  `refs/swarmforge/salvage/BL-1783` (e679139bad). Everything you need,
  including the exact diffs, is in
  `backlog/evidence/BL-2015-salvage-and-fixes-20261005.md`. Read that file
  first.

  1. Restore the three salvage files (the command is in the evidence file):
     the lib (complete), its test runner (ALL PASS), and the recorder CLI.
  2. Apply the five fixes, exactly as the evidence file's diffs show:
     - `verification_debt_ledger_update.bb`, `commit-ledger!`: `nil)))`
       becomes `nil))))` (without it `-main` is never defined).
     - same file, end of the `--discharge` branch: `(System/exit 1))))))`
       becomes `(System/exit 1)))))`.
     - same file: `fs/file?` becomes `fs/regular-file?`, and that refusal
       reads `evidence file "<path>" is not a file under the project root`.
     - same file, `parse-opts`: add `"--by"` -> `:by` and `"--reason"` ->
       `:reason`, next to the `"--on"` line.
     - `verification_debt_ledger_read.bb`: the per-category `count` is
       `(vdl/outstanding-count rows category)`, and `->json-row` emits
       `discharged_at`, `discharged_by`, `discharged_evidence`, `waived_at`,
       `waived_by`, `waive_reason` when present.
     After step 2, `bb swarmforge/scripts/verification_debt_ledger_update.bb`
     with no arguments must print the usage line, not an error.
  3. Add the step handler `specs/pipeline/steps/bl2015VerificationDebtDischargeSteps.js`
     for the feature's Background and scenario 01. Copy the helpers from
     `specs/pipeline/steps/bl1782VerificationDebtLedgerSteps.js` lines 1-107
     (mkFixtureRepo, record, readLedger); register every step with
     `registry.defineScoped(re, fn, FEATURE)` where FEATURE is this
     feature's exact `Feature:` line text after `Feature: `. The ledger
     "committed at HEAD" is read with `git show HEAD:backlog/verification-debt-ledger.yaml`.

  ## Scope
  - `swarmforge/scripts/verification_debt_ledger_lib.bb`, `_update.bb`,
    `_read.bb`, `test/verification_debt_ledger_lib_test_runner.bb`.
  - The feature file and its step handler.

  ## Not in scope
  - Scenarios 02-04 of BL-1783 (BL-2016, BL-2017). The intake throttle
    (BL-1784).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2015-a-verification-debt-category-is-discharged-by-a-tool.feature`:
     1 ok, 0 fail.
  2. `bb swarmforge/scripts/test/verification_debt_ledger_lib_test_runner.bb`:
     ALL PASS (measured on the salvage tree at mint).
  3. `node specs/pipeline/cli.js specs/features/BL-1782-hand-verifications-are-recorded-in-a-verification-debt-ledger.feature`:
     `# pass 13`, `# fail 0` (measured at mint with the five fixes applied,
     in a scratch copy with the repository's ledger).
  4. In a mkdtemp `git init` scratch repo (never the live checkout), record
     three rows in one category and two in another, discharge the first
     with a committed evidence file, and diff the ledger before and after:
     only the three rows gained the discharge fields and nothing else
     changed (invariants 1 and 2).
  5. `git diff origin/main -- backlog/verification-debt-ledger.yaml` on the
     parcel commit is empty.

