  Deferred deliberately once before: BL-613's architect pass
  (`backlog/evidence/BL-613-architect-pass-20260724.md`, 2026-07-24) found the
  same defect, ruled it out of that ticket's scope, and wrote "If worth
  closing, it is its own portability ticket." This is that ticket.

invariants:
  - "Any test that backdates a file's mtime does so through one shared portable helper; no test re-implements the BSD/GNU split inline."
  - "A newly added GNU-only relative-time invocation under swarmforge/scripts turns a gate red inside the parcel that introduces it, not a later one."
  - "The same relative input yields the same resulting mtime on BSD and on GNU userlands — making macOS green at GNU/Linux's expense is a failure, not a trade."

