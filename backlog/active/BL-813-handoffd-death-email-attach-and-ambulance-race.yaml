description: |
  ## What happened

  handoffd exited with FileNotFoundException in ambulance_lib.bb
  ticket-has-file? while slurping a globbed path under backlog/active/ for
  BL-812 — the ticket had just been moved to done/M8. Supervisor BL-144
  wrote the failure log, emailed a path-only alarm, and halted the swarm.

  ## Operator need

  Off-box: cannot read the box path. Death email must attach the failure
  log (Resend attachments already used for briefing diagrams via BL-286;
  death path does not thread them today).

  ## Host-suggested code touchpoints (not binding)

  - swarmforge/scripts/daemon_alarm_lib.bb — alarm-and-halt!
  - swarmforge/scripts/handoffd_supervisor.bb — send-configured-alarm-email!
  - swarmforge/scripts/ambulance_lib.bb — ticket-has-file? try/catch per slurp
  - swarmforge/scripts/test/test_daemon_alarm_lib.sh
  - swarmforge/scripts/test/ambulance_lib_test_runner.bb

  Specifier: accept, reshape, or split; write/amend Gherkin; then route.

