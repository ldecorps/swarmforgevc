id: BL-1120
title: "handoffd must not abort a master-main merge it did not start"
milestone: M8
type: defect
severity: high
# high: live fault — human mid-merge on master is aborted by handoffd's
# reconcile tick (~20s), stranding conflict resolution and forcing daemon
# pause as the only recovery. Not critical: swarm stays up; data not lost
# if the human notices, but the join is repeatedly stomped.
status: todo
epic: swarm-reliability
priority: 6
direction: human-requested
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
human_approval: approved
approval_context: >
  Defect: master-main-reconcile-merge! always runs git merge --abort on any
  non-zero merge exit, including when MERGE_HEAD already existed (human
  mid-merge). Confirm the skip/surface behaviour and that ticks that did
  not start the merge never abort it.
acceptance: specs/features/BL-1120-handoffd-must-not-abort-foreign-merge.feature
required_wiring:
  - "specs/pipeline/steps/index.js::bl1120HandoffdMustNotAbortForeignMergeSteps::acceptance handler registered"

# Prior stacked tips superseded by this origin/main-only rematch (BL-531).
abandoned_commits: ["7743cfd0b5", "84f3b64f4c", "5c24f8146a", "561c2b1b14", "d6cf0c3fa7", "53c8d50110", "bfe3e7a53a", "50e12eab7c", "0addcfeb94", "6226a02b86", "4d15832113", "658f62556d", "f413784762"]

invariants:
  - "A reconcile tick that observes a pre-existing MERGE_HEAD never runs git merge --abort."
  - "Only a merge attempt started by that same tick may be aborted on failure."
description: >
  WHAT. handoffd's master-main-reconcile-merge! always does
  `git merge --no-edit origin/main` and on any non-zero exit
  `git merge --abort`. If a human is already mid-merge (MERGE_HEAD set,
  conflicts resolved or about to commit), the tick's merge fails with
  "already merging" / unmerged paths and the abort **stomps the human
  merge**. Observed twice while resolving BL-1074 rename/rename
  (2026-08-24).

  Human directive (verbatim): "Do not abort a merge this tick did not
  start. If MERGE_HEAD already exists when merge! runs, skip / leave the
  checkout / surface \"human merge in progress\" — never git merge --abort."

  WHY. A human cannot finish a conflicted join while handoffd runs; the
  pre-commit property suite (~150s) makes it unwinnable before the next
  abort. Ops freeze (pause daemon) is recovery-only, not the standing fix.

  HOW (direction, not mandate). Before starting merge, detect MERGE_HEAD
  (or equivalent mid-merge marker). If present: do not merge, do not
  abort; return a distinct outcome and surface "human merge in progress"
  on the existing BL-891/920 surface path. If this tick started the merge
  and it conflicts, abort remains allowed (leave checkout as found for
  daemon-started attempts). Prefer a pure helper in
  master_main_reconcile_lib.bb tested without a live daemon.

qa_e2e_procedure: >
  (1) Fixture repo with MERGE_HEAD already set; invoke merge! → no
  merge --abort in the command log; checkout still mid-merge; outcome
  names human-merge-in-progress. (2) Fixture behind>0, clean, no
  MERGE_HEAD; merge conflicts → abort still runs and leaves non-merging.
  (3) Unit/property on the pure predicate. (4) Record degraded Babashka
  gate.

out_of_scope: |
  - Auto-resolving rename/rename contents.
  - Killing or SIGSTOP of handoffd as the standing fix.
  - Changing who may push origin/main.
  - Property-suite skip on import merges (BL-1121).
  - Post-Cursor-batch merge helper (BL-1118).

