description: |
  ## Status: hotfix 2242cd327c landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `extension/test/bl2055RestartOnlyOnHeldParcelInvariants.property.test.js`
  declared reach floors it only sampled, the shape BL-1062 says to
  construct:
  - invariant 1 drew `hasHeld` with `fc.boolean()` over `numRuns: 30` and
    asserted 10 runs per shape. Either shape lands under 10 when
    Binomial(30, 1/2) is 9 or less, or 21 or more: about 4% of runs. QA's
    gather of BL-2065 at 04720240fa drew held 8 (evidence 3d4e0453f5) and
    held that parcel on it (note 003926).
  - invariant 2 drew its 8 suffix x restart-state cells uniformly over
    `numRuns: 64` and asserted 2 per cell: about 1.6% of runs.
  No register row named the file.

  ## What the hotfix changed

  2242cd327c, test only: invariant 1 loops over `hasHeld` in [true, false]
  with `runsPerCell(30, 2)` runs each (15); invariant 2 loops over the 4
  suffixes x [false, true] with `runsPerCell(64, 8)` runs each (8), the
  cell held as `fc.constant`. The property bodies, the floors and the total
  run budgets are unchanged. `runsPerCell` is the existing helper in
  `extension/test/helpers/reachFloors.js`.

  ## What the coder does (all of it)

  1. Read `git show 2242cd327c` and confirm each test's body and floor
     are unchanged apart from indentation, and that each cell's runs
     meet its floor by construction.
  2. Run the property file and the feature in qa_e2e_procedure once each,
     output under tmp/.
  3. Write backlog/evidence/BL-2083-coder-<date>.md with the result and
     commit it.

