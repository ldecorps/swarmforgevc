id: BL-892
title: "Approval flips must durably commit — plain Approve/Reject/Amend leave human_approval stranded in the working tree"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarmforge-console
priority: 40
direction: human-requested
depends_on: []
mutation_cost: low
human_approval: approved
required_stages: [coder, cleaner, hardender, documenter, qa]
stage_skip_reasons: { architect: "reuses the existing commit_integrity_cli / runCommitIntegrity seam already proven by Expedite (BL-490); no new module boundary or data-flow design — wiring the same helper into the remaining approval writers" }
acceptance: specs/features/BL-892-approval-flip-must-commit.feature.draft

approval_context: >
  Human-requested 2026-08-14 via the daily briefing Ask #2 (third/fourth
  recurrence of stranded human_approval edits this week). The judgement
  call: should EVERY automated approval verdict (Approve / Reject / Amend)
  commit through commit_integrity_cli the same way Expedite already does,
  or only Approve? This ticket proposes all three — a reject/amend that
  stays uncommitted is the same promotion/visibility lie as an approve.
  Cursor free-form YAML edits (no Approve tap) stay out of scope: there is
  no "action" to hook; the fix is making the product approval action itself
  durable. Confirm severity medium (promotion is delayed until someone
  notices and lands the flip, not silent data loss of the decision on disk).

source: |
  Coordinator daily briefing 2026-08-14, Flagged #2 / Ask #2:

    "Stranded-in-tree human approvals recurred a third time
     (BL-875/BL-882/BL-888 this shift; prior instances 2026-08-09/-10).
     The human flips human_approval in the working tree but doesn't
     always commit it, so promotion eligibility can't see the change
     until a specifier or coordinator notices and lands it separately.
     Consider whether the approval action itself should commit
     automatically rather than leaving it to be caught downstream."

  Human (Cursor, 2026-08-14): agreed — "Fill in a ticket: approvals flip
  should commit." Same shift also needed
  `221995ccc` ("Land stranded human approvals: BL-746, BL-889, BL-890")
  and earlier `e7fab69a7` (BL-875/882/888) — the catch-downstream pattern
  repeating in real time.

  Code probe same day confirms the product gap, not only human forgetfulness:
  - Expedite already commits via `commitExpediteWrites` →
    `runCommitIntegrity` / `commit_integrity_cli.bb` (BL-490 / BL-419).
  - Plain Approve on paused-pager (`handlePausedPagerApproveRoute`) and
    Telegram Approve/Reject/Amend (`recordApprovalDecisionAndClose` /
    `recordAmendDecisionAndClose`) only call `recordApprovalReply` (disk
    write) and never the commit helper — so the UI can report success
    while `main` still reads `pending`.

description: |
  ## What

  After any automated approval verdict that changes a live ticket's
  `human_approval` field (Approve → approved, Reject → rejected,
  Amend → amending), the writer must durably commit that ticket file
  through the existing locked pathspec helper (`runCommitIntegrity` /
  `commit_integrity_cli.bb`) before reporting success to the human.
  Promotion gates, the Approvals topic, and the daily briefing all read
  committed YAML — an uncommitted flip is invisible to them.

  ## How (direction, not mandate)

  Reuse the Expedite precedent; do not invent a second commit path:

  1. Extract or generalize `commitExpediteWrites` into a shared
     `commitApprovalWrites(targetPath, backlogId, message)` (or rename)
     that pathspec-commits the single ticket file via `runCommitIntegrity`.
  2. Call it from every real transition in
     `recordApprovalDecisionAndClose` and `recordAmendDecisionAndClose`
     (Telegram Approvals topic + per-ticket topic), and from
     `handlePausedPagerApproveRoute` (and Reject/Amend on that surface
     if/when they exist).
  3. Keep Expedite's existing call; it may share the helper.
  4. Commit failure degrades loud to the human (non-success response /
     observable failure), never a silent "approved" toast with an
     uncommitted tree — same durability posture BL-582 asks for on taps.

invariants:
  - "A successful automated approval verdict leaves the ticket file's new human_approval value readable from HEAD via git show; the working tree is not the source of truth."
  - "Every automated human_approval writer routes through commit_integrity_cli (pathspec-scoped, locked) — never a bare git commit and never a disk-only success."

qa_e2e_procedure: |
  1. On a live or fixture paused ticket with `human_approval: pending`, tap
     Approve in the paused-pager (or send `approve BL-###` in the Approvals
     topic). Confirm the HTTP/Telegram path reports success AND
     `git show HEAD:backlog/.../BL-###-....yaml` contains
     `human_approval: approved` (not only the working tree).
  2. Repeat for Reject (with reason) and Amend (with note) on the Telegram
     Approvals path; HEAD must carry the new verdict.
  3. Force the commit helper to fail (e.g. inject a failing
     commit_integrity_cli in a unit/acceptance fixture). The Approve
     action must NOT report unqualified success; disk may hold the flip
     but the human-visible result must surface the durability failure.
  4. Regression: Expedite still commits approval+promotion as today.

out_of_scope: |
  - Free-form Cursor/editor edits of ticket YAML with no Approve/Reject/
    Amend action — there is no product hook; humans who edit by hand still
    commit (or use the Approve button). A file-watcher auto-commit is a
    different, larger ticket.
  - Redesigning commit_integrity_cli or the shared-checkout lock (BL-419) —
    reuse it.
  - Changing promotion-gate semantics beyond reading committed
    `human_approval` (already the contract).
  - Auto-promoting on Approve (Expedite's job); this ticket only makes the
    flip durable.

notes: |
  Related: BL-490 (Expedite already commits), BL-419 (commit integrity
  helper), BL-582 (approval tap must be observable and durable), BL-538
  (paused-pager Approve currently disk-only). Evidence of the recurring
  stranded pattern: briefing 2026-08-14 Flagged #2; commits e7fab69a7 and
  221995ccc landing catches downstream.
