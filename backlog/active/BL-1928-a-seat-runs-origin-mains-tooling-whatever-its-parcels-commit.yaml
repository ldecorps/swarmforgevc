id: BL-1928
title: "A worktree seat runs origin main's swarm tooling whatever its parcel's commit, so a tooling hotfix reaches a seat holding an older parcel"
milestone: M8
type: defect
severity: high
# high: a live fault degrading behaviour - since BL-1871 every tooling
# hotfix misses each seat holding a parcel cut before it. On 2026-10-03 the
# coder ran pre-hotfix tooling on BL-1858's bounce line and the human had to
# rule the parcel requeued (SUP-17, 12:44Z).
status: todo
