id: BL-1230
title: "a fixture left a git repository at backlog/.git, so every git command run from the backlog directory silently resolves to an empty repo, and no hygiene check can see it"
milestone: M8
type: defect
severity: high
# high: a broken safety signal that is already live. `cd backlog && git
# rev-parse --show-toplevel` answers `.../backlog`, in the directory where the
# coordinator runs its git mv bookkeeping. Not critical: verified 2026-08-28
# that the parent repo still tracks all 4845 backlog paths and `git status
# --short backlog/` is clean, so nothing has been lost or shadowed yet.
