notes: |
  - "[2026-08-28] specifier: confirmed no data loss at mint — `git ls-files
    backlog/` returns 4845 paths and `git status --short backlog/` is empty,
    so the parent repo's tracking is intact. Recorded because the obvious
    worry on reading this ticket is that backlog content had been swallowed,
    and it has not been. The exposure is future git commands, not past ones."
  - "[2026-08-28] specifier: deliberately NOT folded into BL-1226 (temp-dir
    cleanup for step handlers) or BL-1039's repoCreationGuard. BL-1226 is
    about roots left in /tmp; BL-1039 scans test source text for `git init`
    call shapes. Neither looks at the working tree for a repository that is
    already there, which is why a leak dated 2026-08-27 was still undetected
    the next day and was found by eye rather than by a gate."
  - "[2026-08-28] specifier: I did not remove backlog/.git. The swarm's rule
    is never to delete what you did not create, and an unexplained repository
    with 3338 staged paths is exactly the artifact worth a human's look before
    it disappears — its index is the only remaining evidence of what created
    it."
  - [2026-08-28] specifier: coordinator reports the live `backlog/.git` is now
    absent and evidence is filed
    (`backlog/evidence/BL-1230-leaked-git-removed-verified-20260828.md`). This
    does NOT stale the ticket: the deliverable is the detection check, which
    reports only and removes nothing, so its value is entirely in making a
    recurrence visible. Premise confirmed still live - freshness gate should
    pass this one.
  - [2026-08-28] specifier: hazard for the implementer, caught at spec time.
    Every scenario opens `Given a git repository exists at "backlog/.git"` -
    that is a FIXTURE precondition, not an assertion about this checkout. The
    step handler must create it under a temp fixture root, never at the live
    repo's own `backlog/.git`, or the acceptance run re-creates the exact
    artifact this ticket exists to catch and leaves it behind. The Given names
    a repo-relative path because that is what the check reports; it is not an
    instruction to write there.
  - "[2026-08-28] coder: architect bounce D1
    (backlog/evidence/BL-1230-architect-bounce-20260828.md) - both declared
    invariants had no property test. Re-added the injectable `readdir` seam
    to findNestedGitRepositories (the cleaner's own design, reverted by
    fcaf21c7c4 pending this rework so first authorship of the property test
    stays with the coder per BL-654) and added
    extension/test/nestedGitRepoGuard.property.test.js: P1 encodes invariant
    1 (reported set equals exactly the .git DIRECTORY paths outside
    node_modules/.worktrees, never root's own) against generated tree
    layouts; P2 encodes invariant 2 (the call never mutates its input) by
    handing the walk live node references and diffing a JSON snapshot
    before/after. Non-vacuity proven by hand: broke the root-.git exemption
    and separately mutated an entry mid-walk, confirmed both properties fail
    on each break, then restored and re-confirmed green. Verified:
    nestedGitRepoGuard.test.js 12/12 unchanged; property file 3/3."

