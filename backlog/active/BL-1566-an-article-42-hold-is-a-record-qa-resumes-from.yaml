id: BL-1566
title: "An Article 4.2 hold is a durable record QA resumes from: QA withheld BL-1555's approval on an unowned red and completed the parcel; when the owner BL-1564 was minted and the resume note reached QA (001539, 12:16Z) it was completed in ten seconds with nothing to resume, and the swarm starved at cap 1 until the operator re-sent it - a hold record names the parcel and its reds, the register releases it, every QA turn prints a released hold first, and a note cannot be completed while a released hold is open"
type: defect
severity: high
# high: a live fault degrading behaviour - the Article 4.2 withhold has a
# start (QA's unowned-red note) and no built-in resume, so every hold at
# cap 1 is a starvation waiting for an operator. BL-1555 lost 12:16Z to
# 12:36Z on 09-14 with the owner already minted, approved and on main.
status: todo
epic: swarm-reliability
priority: 9
