description: >
  Severity rationale: high - a broken safety signal, not a broken feature.
  The gate is green, has always been green, and would stay green through
  the exact change it was written to refuse; the switch it guards protects
  against thirteen realised commit losses.

  What is wrong. BL-1248 ships a kill switch for the master-main-reconcile
  sweep with a firm constraint that switching it OFF declines to ACT on
  divergence without going QUIET about it - the drift log, the
  dirty-blocked surfacing and the operator escalation keep running while
  the switch is off. Because handoffd.bb injects :surface! and :escalate!
  INTO master-main-reconcile-lib/sweep!, that constraint is entirely a
  statement about WHERE the guard sits: inside sweep! at the
  :should-reconcile branch (correct, skips only the destructive merge!) or
  in front of sweep! at handoffd's call site (wrong, silences the
  notification paths along with the reconcile). BL-1248 scenario 05 was
  written to fail in the second case.

  It cannot. Its handler, runDivergenceStillSurfaced in
  specs/pipeline/steps/bl1248MasterMainReconcileKillSwitchSteps.js, calls
  the library's 4-arg sweep! directly with a hand-passed disabled flag over
  injected fake adapters. It never reaches handoffd.bb at all, so it
  observes the decision layer and not the wiring, and it is green for every
  guard placement in the daemon. The handler's own header records the
  reasoning - "Scenarios 01 and 05 are pure-decision-layer proofs (no real
  git needed for what they assert)" - which is right for 01 and precisely
  wrong for 05.

  Demonstrated against a real change, not hypothesised. Commit 0a754dad5
  ("BL-1247: kill switch for the master-main reconcile sweep") moves the
  guard to handoffd's call site, leaving the off path with a drift log
  line and neither :surface! nor :escalate!. That change LANDED - it is an
  ancestor of main and of every role branch - and was undone only by a
  hand-written revert, a6f3717b5 ("Revert BL-1247-reconcile-sweep-kill-
  switch call site to shipped BL-1248 shape"). Scenario 05 was green
  before it landed, green while it was on main, and green after the
  revert: the wrong guard placement reached main and the gate never
  moved. It also leaves the lib's 4-arg arity in place "exercised by
  this lib's own tests", so scenario 05 would have stayed green over an
  arity production no longer calls. BL-1248's own qa_e2e_procedure step 5
  warns against exactly this - "do not accept a green here that was
  obtained by asserting only the absence of a reset" - and the handler
  shipped blind anyway.

  How (direction, not mandate). The infrastructure already exists and is
  already driven by scenarios 02 and 03 of the same handler file:
  swarmforge/scripts/test/test_handoffd_master_main_reconcile_wiring.sh, a
  real git repo with a real bare origin and a real handoffd process,
  memoized once per ctx. The natural shape is to re-point scenario 05's
  off-path assertions at that fixture and add the surfacing and escalation
  checks to it. One affordance is missing and 0a754dad5 supplies it as
  prior art: a --reconcile-sweep-once one-shot flag on handoffd.bb, the
  same posture as the existing --sweep-once and --chase-sweep-once, so a
  single reconcile tick fires deterministically without a background
  process or a wall-clock wait. That flag is the ONLY reusable idea in that
  commit; take it or better it, and take nothing else from there.

constraints: >
  Out of scope / firm lines:

  - Do NOT change the guard placement, the parser, or any production
    behaviour of the kill switch. BL-1248 shipped correctly and is closed.
    This ticket changes the GATE, not the thing gated. A diff touching
    master_main_reconcile_lib.bb's reconcile decision or handoffd.bb's
    guard is out of scope, not a scope widening.
  - Do NOT change master_main_reconcile_enabled in the shipped conf or in
    any non-fixture path, in EITHER direction. As of 2026-08-29 it already
    reads true (swarmforge.conf:345) - it was flipped out of band while
    this ticket sat paused, so the ticket's original "do not flip it to
    true" no longer describes the tree. The value is still not this
    ticket's to set; BL-1251 (blocked) owns that decision. Set the switch
    explicitly inside the fixture, never by inheriting the shipped conf.
  - Do NOT re-apply 0a754dad5's handoffd.bb change, and do not revert its
    revert. It is retired work built against a ticket superseded by
    BL-1248; it already landed on main once and a6f3717b5 correctly put
    the guard back. Only the --reconcile-sweep-once idea is reusable, and
    since a6f3717b5 removed that flag along with the guard move, it is not
    in the tree today - read it at 0a754dad5 and write it fresh rather
    than untangling that commit.
  - Do NOT weaken BL-1248's scenario 05 Gherkin. Its Given/When/Then text
    is right; only the handler behind it is blind. Retire nothing, reword
    nothing in that feature file beyond what a re-pointed handler requires.
  - Do NOT reimplement the fixture's git plumbing in a second script. Add
    to test_handoffd_master_main_reconcile_wiring.sh, per the same rule the
    existing handler header already states.
  - Do NOT verify any part of this against the live repo checkout. The
    behaviour under test is the one that destroys commits.

qa_e2e_procedure: >
  1. Scenario 01: in the fixture repo (real bare origin), diverge local main
     from origin with local changes blocking the merge, set the config OFF,
     fire exactly ONE real reconcile tick through handoffd, and assert three
     things from durable artifacts - the drift log line is present, the
     surfaced divergence note exists, and every commit reachable from local
     main before the tick is still reachable after it (by rev-list, not by
     the absence of a log line).
  2. Non-vacuity for 01: confirm the same fixture, with the switch ON,
     produces the surfaced note through sweep! - so the off-case green is
     not obtained from a fixture that never surfaces anything.
  3. Scenario 02: hold the block past the escalation threshold with the
     switch OFF and assert the operator escalation is still raised. This is
     a SECOND channel and a green on 01 is not a green on it.
  4. Scenario 03: inspect the off-path step handlers and assert none drives
     sweep! with a hand-passed disabled flag. Assert on the invocation shape
     (a bb -e script passing a literal disabled argument), never on the bare
     symbol name - the prose in the feature file and in the handler's own
     header both contain that name and would trip a naive grep.
  5. The regression proof that this ticket is worth its parcel - do this one
     by hand, do not automate it into the suite - take a scratch copy of
     handoffd.bb, move the guard to the call site as 0a754dad5 does, and
     confirm scenarios 01 and 02 go RED. If they stay green the gate is
     still blind and the ticket is not done. Discard the scratch copy.
  6. The declared invariant carries a coder-authored property test per
     BL-654 only if a property shape is genuinely natural here; scenario 03
     is the structural check and may be sufficient on its own. Do not
     manufacture a property test to fill the field.

