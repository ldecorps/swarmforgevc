  - 'specs/pipeline/steps/bl1248MasterMainReconcileKillSwitchSteps.js::BL-1256::scenario 05 off-path handler must be re-pointed at the real daemon fixture and marked with this ticket id, so the change is greppable at the exact site it fixes'
  - 'swarmforge/scripts/test/test_handoffd_master_main_reconcile_wiring.sh::BL-1256::the daemon-driven surfacing and escalation assertions live in the existing real-git fixture, never a parallel reimplementation of its plumbing'

invariants:
