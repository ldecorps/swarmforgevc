description: >
  WHAT. Operator/Cursor hotfix db7e3f2bda is live on main with the trailer
  Hotfix-Certification: pending. Subject: "Restaff bob BoB starting cast:
  Anthropic seats, coder on qwen3.8-max."

  Landed behaviour under review (do not redesign). Only
  swarmforge/packs/bob-multi-provider-mono-router.conf changes (52 lines);
  no launcher code moves. The window block's specifier/cleaner/architect/
  hardender/documenter/QA lines switch from `--model qwen3.8-max` to
