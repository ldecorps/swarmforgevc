  (`--model qwen3.8-max --effort high`, HOME). The coordinator was never a
  window line and remains claude-sonnet-5 via `coordinator_agent`/
  `coordinator_model` config, auto-provisioned. The header comment is
  rewritten from documenting an all-qwen "quality trial" to documenting a
  Best-of-Breed *starting cast* (Anthropic everywhere except the resident
  coder), with an explicit warning not to read the file as an
  already-diversified multi-vendor mix. The PREREQ block flips from "Token
  Plan key for every pipeline seat" to "Anthropic subscription for every
  non-coder seat, Token Plan key for the coder seat only." The
  "Context:"/1M-window comment narrows from "every Qwen Claude seat" to "the
  Qwen Claude coder seat" — prose only; the launcher's
  extra_cli_targets_qwen_cloud predicate and launch_role's qwen elif branch
  (reviewed in full by BL-1322) are untouched code, so any seat whose
  --model still matches qwen* still gets the remap and the 1M declaration —
  it is simply that only the coder seat now matches.

  WHY. Human directive, quoted in the commit body: "BoB starts as Anthropic
  everywhere except the resident coder on Token Plan qwen3.8-max (Claude
  agent); keep the 1M context env on that seat only." Separately: an
  unticketed hotfix never becomes an official swarm deal on green tests alone
  (BL-848).

  HOW (direction, not mandate). Walk the acceptance feature against the
  landed sources at db7e3f2bda. Open a narrow follow-up only if review finds
  a defect; do not rewrite the launcher's remap path or re-restaff the pack
  in this parcel.

