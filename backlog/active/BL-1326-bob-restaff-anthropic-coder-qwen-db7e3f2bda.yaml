approval_context: >
  BL-848 hotfix stamp-off for already-landed commit db7e3f2bda. Review-only:
  it confirms or refutes the land and never reimplements it. No choice is
  posed here — approving authorizes the review parcel; the certify/waive
  decision on the ledger row stays human-only and comes after the review
  (BL-848).

  Two things to know before you approve. First, this is the SECOND restaff of
  the bob-multi-provider-mono-router pack today: 4ed88430b2 (reviewed by
  BL-1322, still awaiting its own ledger decision) put every pipeline seat on
  Token Plan qwen3.8-max except the coordinator; db7e3f2bda now reverses that
  — every seat goes back to first-party claude-sonnet-5 EXCEPT the resident
  coder, which stays on qwen3.8-max with the 1M context declaration. The
  commit's own header frames this as the Best-of-Breed *starting point*, to be
  diversified deliberately later, not a return to the old multi-vendor mix.

  Second, an observation for the record, not a defect: db7e3f2bda's own diff
  also carries the two files that mint BL-1322 (its paused YAML and feature
  file) — confirmed by diffing against its parent, which has neither file.
  Those files' content is correct and already covered by BL-1322 itself; this
  ticket does not re-review them. Flagging only because a Cursor-attributed
  hotfix commit swallowing a specifier-authored ticket mint is the shape of
  hazard the "never git add -A on a shared checkout" guidance exists to catch,
  and it is worth a human eye even though nothing here is factually wrong.

