approval_context: >
  One decision worth a tap before the coder builds: enforcement strength.
  This spec makes the gate BLOCKING — the pilot's only landing path runs the
  ticket's acceptance contract and refuses the move to done/ when it is not
  green. The weaker alternative is an advisory audit that reports violations
  after the fact without blocking. Blocking was chosen because the defect
  being fixed IS an invisible landing: an advisory gate is skippable in
  exactly the way run_acceptance.sh already was. Everything else here is
  firm.

