invariants:
  - "The new ceiling can only LOWER the fork count, never raise it. The memory-derived budget (BL-422/BL-792) stays an absolute upper bound for every combination of pack, platform and override - this ticket adds a constraint, it does not relax one."
  - "The resolved fork count is at least 1 for every combination of inputs, including absent, malformed, zero and negative overrides. A pool with no worker is never a legal outcome."
  - "Both vitest lanes (unit and properties) resolve their pool through the same code path. Neither lane may size its pool by a route the other does not share."

description: >
  extension/vitest.config.mjs caps its forked-process pool through
  resolveWorkerPoolSize (BL-422, refined by BL-792), but that number is
  derived from os.totalmem() alone. It is a MEMORY budget, built to stop an
  OOM-killer death-spiral. Nothing in this repo governs the CPU axis.

  On the swarm host that gap is measurable. The box has 2 physical cores
  (hw.physicalcpu; hw.ncpu reports 4 logical). A full-forge pack runs 8
  concurrent Claude sessions plus handoffd and the front-desk bridge before
  any test tooling starts. resolveWorkerPoolSize returns 3 on this host's
  8192MB, and the coordinator observed two `vitest run` invocations
  overlapping - so ~6 test forks layered on an already-saturated box.
  Measured load average was 16.62/14.91/19.85 when the intake was filed and
  39.27/24.66/17.16 when it was specced: roughly 8x to 20x the physical core
  count, sustained rather than spiky.

  Why it matters beyond "tests run slower": the standing lesson on Stryker
  dry-run timeouts says to skip mutation whenever load is much greater than
  2x cores, so at this level a hardener reaching a mutation-heavy ticket
  while a vitest run is in flight is liable to time out rather than merely
  crawl. The same evening's dwell comparison showed QA average processing
  going from ~848s under mono-router to ~2124s under full-forge, which
  competes for exactly these cores.

  Add a SECOND, independent ceiling on the same resolved number, layered
  alongside the memory budget rather than replacing it.

  How (direction, not mandate): the pack needs no new wiring - SWARMFORGE_PACK
  is already exported into every agent's environment (verified live
  2026-08-19: a role shell reports SWARMFORGE_PACK=full-forge). A human
  running the suite solo has no such variable, so they keep the full budget
  and the intake's "would also throttle a human on a quiet laptop" worry does
  not arise. resolveWorkerPoolSize already accepts a `ceiling` parameter,
  which is the natural seam; a separate CPU-aware function is also fine if it
  reads better. What matters is the resolved precedence, which the acceptance
  table pins:

    1. An explicit positive-integer SWARMFORGE_VITEST_MAX_FORKS override
       replaces the pack rule (an override that cannot override is not an
       override). A non-positive or non-numeric value is IGNORED, not floored.
    2. Otherwise, a full-forge pack on macOS resolves to 1 fork.
    3. Otherwise, the existing memory-derived count, unchanged.
    4. The result is then clamped to the memory-derived count and floored at
       1 - so even an explicit override can only ever lower it.

  Prefer keeping the decision pure and driving it in-process with stubbed env
  and platform. It needs no fixture directory; do not introduce one.

  Human directives, verbatim (2026-08-19, ldecorps to coordinator):
  "should we allocate only 1 core to vitest?" and, confirming the intake,
  "ok for an intake to limit vtest to 1 core on full forge on mac".

constraints: >
  Out of scope, carried verbatim from the source intake:

  - Changing WORKER_POOL_SIZE's existing memory-based sizing logic or its
    OOM-prevention purpose (BL-422). This ticket adds a second, independent
    constraint - it does not touch that one.
  - Stryker's own pool (pool:'threads' + maxThreads:1, already fixed per
    engineering.prompt's worker-thread rule) - already covered, unrelated to
    this intake's `vitest run` (unit suite) scope.
  - Host-capacity questions beyond vitest specifically (e.g. BL-101 headless
    secondary swarm, staffing model/effort choices) - those are separate,
    already-tracked concerns; this intake is scoped to vitest's own
    worker-pool CPU footprint only.

qa_e2e_procedure: >
  On the live swarm host, from extension/:

  1. Confirm the pack signal the change keys off is really present in an
     agent shell: `echo "$SWARMFORGE_PACK"` reports full-forge.
  2. Baseline, bypassing the new rule:
     `SWARMFORGE_PACK= node -e "import('./vitest.config.mjs').then(m =>
     console.log(m.default.test.poolOptions.forks.maxForks))"` - expect 3 on
     an 8192MB host.
  3. The ticket's actual claim:
     `SWARMFORGE_PACK=full-forge node -e "..."` (same one-liner) - expect 1
     on macOS.
  4. Same one-liner against vitest.properties.config.mjs - expect the same
     number both times, per invariant 3.
  5. Confirm the memory ceiling still binds:
     `SWARMFORGE_VITEST_MAX_FORKS=99 SWARMFORGE_PACK= node -e "..."` - expect
     3, not 99.
  6. Confirm a solo human is unaffected: with SWARMFORGE_PACK unset, `npm
     test` runs its normal fork count and the suite is green.

notes: >
  Source intake: backlog/INTAKE-cap-vitest-to-1-core-on-full-forge-macos.md
  (drained 2026-08-19, archived on mint per the backlog-root drain rule).
  1:1 - the intake produced this ticket and no other.

  The intake left three questions explicitly unlocked for the specifier.
  All three were settled by probing rather than by asking, and the evidence
  is recorded here so a reviewer can check the reasoning rather than retrace
  it:

  - Scope (static macOS vs conditional): conditional, on pack AND platform.
    That is what the human's own wording asks for ("on full forge on mac"),
    and both halves are cheap, deterministic reads. Load-average detection
    was rejected: it makes the fork count nondeterministic run to run, and
    the threshold would itself be an ungated tuning knob.
  - Mechanism: an additional ceiling composed with the memory budget, not a
    replacement, honouring the intake's out-of-scope line.
  - Where it is set from: nowhere new. SWARMFORGE_PACK already reaches every
    agent shell, so the launch-time flag the intake contemplated is not
    needed.

  Two corrections to the intake's own figures, found while probing:

  - The intake reports "4 physical cores (sysctl -n hw.ncpu = 4)". hw.ncpu is
    the LOGICAL count; hw.physicalcpu is 2 on this host. The oversubscription
    is roughly twice as bad as filed.
  - The intake describes the cap as living in vitest.config.mjs. There are
    TWO call sites: vitest.properties.config.mjs computes WORKER_POOL_SIZE
    with the identical expression. A change landing in only the unit config
    leaves the property lane uncapped - hence invariant 3 and the second
    required_wiring entry.

approval_context: >
  Two things want your sign-off; the rest is settled.

  The override semantics. You asked for 1 core on full forge on mac, and that
  is scenario row 1. I additionally specced an explicit
  SWARMFORGE_VITEST_MAX_FORKS escape hatch, and had to choose what it means
  when it disagrees with the pack rule. I made it REPLACE the pack rule
  (so you can ask for 2 forks on the swarm box) but still be clamped by the
  memory budget (so it can never raise the count above what RAM allows). The
  alternative - making it only ever lower, so the pack rule always wins - is
  safer but leaves you no way to run the suite at full speed on the swarm box
  without unsetting SWARMFORGE_PACK. Say the word and I will flip it; only the
  last two Examples rows change.

  Whether the escape hatch should exist at all. It is one extra branch and it
  keeps a human from being stuck at 1 fork on their own machine merely because
  the variable was inherited from a shell that once launched a swarm. But it
  is beyond your literal ask, and dropping it makes the ticket smaller. Happy
  to cut it.

  Not asking about: pack+platform conditioning (your own words), and leaving
  BL-422's memory budget untouched (the intake's own out-of-scope line).

