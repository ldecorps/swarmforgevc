  Repair extends BL-1017 missing-session path to half-launch (pane up, agent gone).

description: |
  ## What

  When `proc-<role>` CRIT fires (pane exists, agent absent) and
  `session-repair-allowed?`, queue the same bounded `:ensure-session` repair
  BL-1017 uses for missing panes. When `swarm-starved` streak crosses threshold
  (default ≥3 sweeps), queue `./swarm ensure` before relying on operator
  escalation alone — especially when multiple proc-* findings co-occur.

  ## How (direction, not mandate)

  Extend `babysitterd_sweep_lib.bb` `check-live-session` half-launch branch and
  `check-swarm-starved`; reuse `single-role-repair-lib` / control-plane ensure
  paths. Do not default to full `./start-swarm.sh`.

qa_e2e_procedure: >
  (1) Fixture half-launch → CRIT + repair decision. (2) Starved streak ≥ threshold
  → ensure queued. (3) Cooldown suppresses repeat repair. (4) cursor-forge standing
  pack ensure succeeds with healthy launch-contract.

