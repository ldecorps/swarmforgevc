  launcher's audit line under SWARMFORGE_SKIP_DAEMON=1, never by letting a
  second daemon start.
  (Specifier amendment 2026-09-12, after approval: the audit-line half of
  that last FIRM sentence was a false premise of the mint - the launcher
  writes no audit line under the skip flag - and moves to BL-1548 unchanged
