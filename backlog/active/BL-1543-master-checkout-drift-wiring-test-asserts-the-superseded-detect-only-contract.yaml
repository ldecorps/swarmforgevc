invariants:
  - "After the test exits, no process whose command line names its fixture root exists - the daemon it spawned, the launcher its repair bounced, and anything they started are all gone (pgrep -af <root> empty)."

description: |
  ## What is wrong

  `swarmforge/scripts/test/test_handoffd_master_checkout_drift_wiring.sh`
  (BL-839) fails on `main` (verified 2026-09-11 at `41bacc37a1`):

  ```
  AssertionError: alarm text missing the stakes statement: 'MASTER CHECKOUT DRIFT RESTORED: swarmforge/scripts/handoffd_supervisor.bb'
  exit 1
  ```

  The test boots the real `handoffd.bb` against a disposable repository with
  an uncommitted edit to `swarmforge/scripts/handoffd_supervisor.bb` and
  asserts BL-839's detect-only contract: the first OPERATOR-topic outbox line
  containing `MASTER CHECKOUT DRIFT` carries `not the code` (case 01), and
  the drifted file is still modified afterwards (case 02). BL-1139
  (`849e9fc4e6`, 2026-08-25, human: "the swarm must deal with durable
  daemon-script drift without human intervention") made the daemon's
  `master-checkout-drift-sweep!` call `repair-master-checkout-drift!`: on
  durable drift with no commit in flight the check runs silently (no WARN is
  written for the episode), every drifted path in the daemon-executed closure
  is restored with `git checkout main -- <path>`, ONE `MASTER CHECKOUT DRIFT
  RESTORED: <paths>` line goes to the same outbox, and a bounce of
  `start_handoff_daemon.sh <root>` is deferred by 2 s. Both of the test's
  cases therefore assert the old world. BL-1139's own acceptance drives the
  lib with fakes; nothing re-tensed the one test that boots the real daemon
  (BL-1006's shape: the successor never retired the boundary its predecessor
  froze). BL-1273's QA saw it red on 2026-08-29 and ruled it pre-existing;
  it was never minted.

  The coder's note reads it as a race ("the DRIFT alarm never landed before
  the repair fired"). It is not: on a successful repair no WARN is emitted by
  design (`run-repair-attempt!` -> `finish-successful-restore!` emits only
  the RESTORED note). The daemon is right; the test is stale.

  Evidence: `backlog/evidence/BL-1543-specifier-unowned-red-repro-20260911.md`.

  ## What is wanted

  The test is re-tensed to the live contract and proves it THROUGH THE REAL
  DAEMON, printing one `PASS: NN: ...` line per case (scenario 01):

  - case 01: on durable drift (uncommitted edit, no lock, no live git) the
    OPERATOR outbox carries exactly one `MASTER CHECKOUT DRIFT RESTORED:`
    line naming `swarmforge/scripts/handoffd_supervisor.bb`;
  - case 02: that file matches `main` again after the sweep (`git status`
    no longer lists it; content is main's);
  - case 03: no `MASTER CHECKOUT DRIFT:` WARN line was written for that
    episode (the RESTORED line is the only `MASTER CHECKOUT DRIFT` line);
  - case 04: in a SECOND fixture where `.git/index.lock` exists (commit in
    flight) and the same edit is present, the outbox carries a `MASTER
    CHECKOUT DRIFT:` line naming the path and stating the running code is
    not the landed code (`not the code`), and the file is STILL modified -
    BL-839's stakes assertion survives here, where it is still true.
  - (Amended 2026-09-12, coder spec-gap note.) There is NO case 05 in this
    parcel. The mint's case 05 asserted a launcher audit line under
    `SWARMFORGE_SKIP_DAEMON=1`; that line does not exist - the launcher's
    skip branch (`start_handoff_daemon.sh` lines 32-35) exits before
    `AUDIT_LOG` is defined (line 42) or written (line 48), and the daemon's
    bounce thread captures the launcher's stdout (`daemon-cycle-guard-lib/sh!`
    is `:out :string`) and logs nothing on success. Under the skip flag the
    bounce leaves no trace anywhere a test can read. Proving "the bounce
    reached the launcher" is BL-1548's deliverable (launcher audits the
    invocation BEFORE honouring the skip flag, then adds case 05 to this
    test). This parcel proves only that the bounce started NOTHING - the
    leak invariant below and scenario 02 - which is the real hazard.
  - The test prints its fixture root(s) on stdout (`fixture root: <path>`)
    so the acceptance handler can check the leak invariant (scenario 02).
  - Documenter: no registered diagram depicts this test; `docs/` change, if
    any, is the note on the standing shell suite. If a how-to for BL-839 /
    BL-1139 describes the wiring test's cases, it names the new ones.
  - Register: after QA lands, `backlog/standing-reds.tsv` carries no row for
    the test and `bb swarmforge/scripts/standing_red_register_cli.bb .`
    reports it gone (a row leaves in the land that turns the test green).

  ## How (direction, not mandate)

  Keep the file's shape (BL-577 pattern: real `bb $HANDOFFD $ROOT &`,
  `SWARMFORGE_ALLOW_TMP_DAEMON=1`, poll the outbox, touch
  `.swarmforge/daemon/stop`, wait). Export `SWARMFORGE_SKIP_DAEMON=1` for the
  whole test: `handoffd.bb` never reads it (so the test's own daemon is
  unaffected) while `start_handoff_daemon.sh` prints "Skipping handoff
  daemon" and exits 0 WITHOUT starting anything and WITHOUT writing any
  audit line (lines 32-35 run before the audit machinery at 42-48; corrected
  2026-09-12). The export is not optional: without it the deferred bounce
  starts a real handoffd + supervisor rooted in the fixture, which is the
  leaked-fixture-daemon shape babysitterd has mistaken for the live daemon.
  The bounce thread sleeps 2 s before running the launcher; give the first
  fixture's daemon at least ~3 s after the RESTORED line appears BEFORE
  touching the stop marker, so the thread runs to completion inside the
  test's lifetime rather than after `rm -rf $ROOT` (the launcher would then
  be invoked against a deleted root - harmless under the skip flag, but the
  leak check must observe the settled state, not a thread still sleeping).
  The RESTORED note rides `flow-watchdog-emit-alarm!` into the same
  `telegram-reply-outbox.jsonl` the test already parses (`threadId`
  `OPERATOR`). For case 04, `touch "$ROOT2/.git/index.lock"` before starting
  the daemon is enough for `commit-in-flight?` (`index-lock-present?`); an
  `:uncommitted-edit` still WARNs in flight (`should-alarm-on-result?`, only
  a lone staged reversion is muted). Two daemon boots are expected; keep
  each bounded by the existing 60x0.25 s poll. The acceptance handler can
  follow `bl1480PromoteRouteFixtureClosureSteps.js` (`the standing suite
  runs "<file>"` / `the run exits zero and reports no failed check`) and
  parse the PASS lines and the printed fixture roots.

constraints: >
  Test-only parcel: `handoffd.bb`, `master_checkout_drift_lib.bb` and
  `start_handoff_daemon.sh` are not edited (BL-1526, active, edits the lib's
  resolver; this parcel and it share no path). The test keeps executing the
  REAL handoffd.bb - it is a wiring test, not a lib test. Every case asserts
  an observable of the daemon process (outbox line, file content, audit
  line), never a lib return value. The BL-839 feature file is not edited by
  the coder; its scenario 05 binds the write-free CHECK verb (BL-1139
  invariant 1) and stays green.

out_of_scope: |
  - Any change to what the daemon does on drift (BL-1139 is done and
    human-approved).
  - Retiring BL-839 scenario 05: its steps assert the check verb, which is
    still write-free; the specifier re-tensed the feature narrative at mint
    so it no longer reads as a system-level "never repaired".
  - Putting the standing shell suite into a gated lane so the next stale
    wiring test is seen the day its mechanism changes (the same gap
    BL-1524/BL-1526 record for the bb suite).

qa_e2e_procedure: |
  1. Acceptance resolving both scenarios of the feature file.
  2. `bash swarmforge/scripts/test/test_handoffd_master_checkout_drift_wiring.sh`
     exits 0 and prints four `PASS: 0N:` lines and the ALL TESTS PASSED
     line; total wall time under two minutes.
  3. Read the fixture outbox for the first fixture (print it in the test or
     rerun with `set -x`): exactly one line with `MASTER CHECKOUT DRIFT`,
     and it is the RESTORED line naming the supervisor script.
  4. After step 2, `pgrep -af "$(the printed fixture root)"` is empty and
     the root no longer exists. This is the ONLY control on the
     `SWARMFORGE_SKIP_DAEMON=1` export: do NOT run a copy of the test with
     the export dropped - that starts a real second daemon + supervisor
     rooted in a mktemp directory (the mint's step 4 negative control was
     wrong and is withdrawn 2026-09-12). Instead read the test source and
     confirm the export is set before the first `bb $HANDOFFD` line.
  5. `bb swarmforge/scripts/standing_red_register_cli.bb .` reports no row
     for the test and `"unowned":[]`.

