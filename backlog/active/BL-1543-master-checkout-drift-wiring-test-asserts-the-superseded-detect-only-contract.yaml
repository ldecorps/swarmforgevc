approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is posed
  and there are no ruling_options. FIRM: no production code changes - the
  daemon already does what BL-1139 (human-approved 2026-08-25) specified;
  only the BL-839 wiring test is re-tensed to assert it. FIRM: the test keeps
  booting the REAL handoffd.bb (the BL-577 wiring pattern) - a version that
  drives the lib with fakes would duplicate BL-1139's acceptance and prove
  nothing about the daemon. FIRM: the test must leave no process rooted in
