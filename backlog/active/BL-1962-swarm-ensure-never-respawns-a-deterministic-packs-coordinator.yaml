description: |
  ## What is wanted

  `swarm ensure` reads the pack's mode once per run
  (coordinator_config_lib.bb `deterministic-coordinator?` on the conf text
  it already reads) and, on a deterministic pack, never creates the
  coordinator's session: on a router pack it passes the flag to BL-1961's
  `topology-action`; on any other pack it skips `ensure-role!` for the
  coordinator. Ensure exits zero and its report has no FAILED or FIXED
  coordinator line. A pack without the declaration still gets a missing
  coordinator back.

  ## What each stage checks

  - Coder: the two scenarios; test_swarm_ensure.sh passes; that
    ensure-rc-role! creates nothing for the coordinator either.
  - Architect: the two invariants; ensure's launch-contract gate
    (launch_contract_lib) still behaves on a deterministic pack.

