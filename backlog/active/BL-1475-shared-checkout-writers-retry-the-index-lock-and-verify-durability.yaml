id: BL-1475
title: "The front desk's human-decision commit and the daemon's topic-record commit give up on a transient git index lock almost at once (one CLI attempt; three tries over 150 ms with stderr discarded) on a checkout whose other commits hold that lock for seconds, then alarm 'FAILED TO COMMIT - a human must land the change manually' / 'NOT yet durable' without checking whether another writer's commit already landed the change: on 2026-09-07 the BL-1472/BL-1473 approvals were swept into the specifier's mints eight seconds after the alarm, and 38 topic records sat dirty all day; both writers retry within a bound sized to the guard chain and verify durability against HEAD before alarming"
milestone: M8
type: defect
severity: high
# high: two live faults on the shared checkout every busy hour - human
# decisions reported as needing manual landing when they are durable
# (a false alarm to the one human), and durable-by-design topic records
# left uncommitted (38 today, lost on a fresh clone, dirty overlap for
# the reconcile). Not critical: no decision was lost today.
status: todo
epic: swarm-reliability
priority: 8
direction: human-requested
depends_on: []
