id: BL-1871
title: "A role takes up a ticket on that ticket's own line: ready_for_next moves a role's worktree onto the parcel's commit instead of the role merging it into its long-lived branch, the coder starts a new ticket from origin/main, and the live pack runs the cleaner and hardender in task mode, so every commit between origin/main and a parcel belongs to that parcel's ticket"
milestone: M8
type: feature
status: todo
epic: landing-is-a-merge
priority: 3
direction: queue-jump
depends_on: []
