qa_e2e_procedure: |
  Recorded manual device procedure, with Bubble paired to a live bridge and
  BL-907 landed:

  1. From the floating bubble, reach the knowledge screen — expect it reachable
     without re-pairing and without leaving Bubble.
  2. Fresh install, before any sync — expect the panel to say nothing is held and
     offer to sync, not an empty ticket list.
  3. Sync, open the backlog panel — expect each folder to list the tickets the
     host actually holds under it (spot-check a count against
     `ls backlog/active/` on the host).
  4. Open one ticket — expect the title and description the host's YAML carries.
  5. Open the docs panel — expect the five vision documents; open a markdown one
     and expect its text; open a diagram one and expect its source, labelled as a
     diagram.
  6. Read the generation stated on each panel — expect it to match the generation
     `GET /companion-manifest` advertises for that package on the host.
  7. Put the phone in airplane mode and repeat steps 3-6 — expect identical
     content and no failure anywhere in the browse.
  8. Change the backlog on the host, sync, reopen the backlog panel — expect the
     new content and the stated generation moved with it.

notes: |
  No `required_wiring` is declared, deliberately. The reachability this slice
  needs is "the human can get to the screen from the bubble", and the identifier
  for that entry point is the coder's to choose — BL-874's lesson is that a
  `required_wiring` pattern is a plain substring check, so a placeholder for a
  name nobody has written yet fails the gate on every send rather than checking
  anything. Reachability is gated by step 1 of the QA procedure instead.

  Depends on BL-907 for the store it reads: do not start this slice before BL-907
  lands, or the panels have nothing to read and the whole screen stays dark
  (BL-298's consumer-over-an-unwritten-store failure, which this sequencing
  exists to avoid).

  Fast-tracked at the human's request: the coordinator engages ambulance mode for
  BL-907 first, then for this ticket
  (`docs/how-to/BL-655-ambulance-mode-the-hold.md`), rather than letting either
  take the normal promote queue.
