description: |
  ## What this slice adds

  The knowledge screen the human asked for: Bubble becomes something you can
  read the swarm from, on the tube, with no bridge in reach.

  - **A backlog panel.** The tickets the held package carries, grouped by the
    folder they sit in (active / paused / hold / done); opening one shows the
    detail the package carries for it.
  - **A docs panel.** The documents the held package carries, listed and
    openable. A markdown document shows its text; a diagram document shows its
    source, labelled as a diagram — rendering diagrams is not in this slice.
  - **Offline by construction.** Both panels read only what BL-907 holds on the
    device. Browsing issues no request, which is why airplane mode changes
    nothing about it.
  - **Provenance on every view.** Each panel states the generation of the package
    it is reading. The human's honesty rule applies to the screen, not just the
    sync: cached content never passes for live.
  - **Nothing held reads as nothing held.** Before a first sync, a panel says so
    and offers to sync, rather than showing an empty list that looks like an
    empty backlog.

  ## Scope boundary — this is the retarget, not the whole of BL-659

  The human confirmed BL-659's corpus goals move here as native Kotlin, and that
  BL-659 is retargeted rather than retired. This slice delivers the roots the
  bridge can already serve — backlog and docs. BL-659's other roots
  (constitution, briefings, evidence, Gherkin scenarios, FLOW analytics, COST),
  its search palette, its facet chips, and its completion/ETA cues each need a
  new bridge package or new derivation first, and remain BL-659's own unminted
  slices. Nothing of BL-659 is dropped by this slice; it is sequenced behind it.

  ## How (direction, not mandate)

  Views + viewBinding, matching the rest of Bubble; the panels are readers over
  BL-907's store. The coder chooses the screen structure and how it is reached
  from the bubble.

  ## Testability (Bubble boundary)

  - The panel DECISIONS — what a folder lists, what a ticket's detail shows, what
    a document opens to, what generation a view states, what a panel says when
    nothing is held — belong in pure Kotlin with no `android.*` type in the
    signature, covered by the JVM unit suite (`./gradlew :app:testDebugUnitTest`).
    Every scenario in the feature file is expressible there.
  - Only the screen and list wiring is device-surface, verified by the recorded
    manual procedure below.
  - No mutation/CRAP/DRY gate exists for `.kt`: the hardener applies the
    documented unit-test-gap fallback and must record that it did.

  ## Not in scope

  - Fetching or caching anything — BL-907 owns the sync; this slice only reads.
  - Search, facet chips with counts, completion rings, ETAs, cross-links, the
    Miller-column interaction of BL-659's mockup — later BL-659 slices.
  - Corpus roots the bridge does not serve yet (constitution, briefings,
    evidence, features, FLOW, COST) — each needs a bridge package first.
  - Rendering mermaid diagrams. The source is shown as source.
  - Editing anything from the screen. Read-only, as BL-659 ruled.

