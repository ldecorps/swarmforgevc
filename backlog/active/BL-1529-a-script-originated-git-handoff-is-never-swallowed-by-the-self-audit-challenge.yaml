qa_e2e_procedure: |
  On the parcel commit, from the repo root. Fixture roots per BL-1390
  (`git init` under mkdtemp, `rev-parse --git-common-dir` proven first).
  1. `bash swarmforge/scripts/test/test_redo_from.sh` and
     `bash swarmforge/scripts/test/test_reroute.sh`: both print ALL PASS,
     exit 0.
  2. In a fixture root with a coder worktree and roles.tsv (copy the
     shape test_reroute.sh builds), run
     `bb swarmforge/scripts/redo_from.bb <item> cleaner` once: exactly one
     `*.handoff` appears in the coder outbox, `to: cleaner`, and stdout's
     last line names that path. `find <root>/.swarmforge/handoffs/audit_pending -type f`
     is empty afterwards (the challenge was consumed, not left standing).
  3. Same fixture: point `swarm_handoff.sh` at a stub that always prints
     `AUDIT_REQUIRED` / `HANDOFF_NOT_QUEUED` (PATH or a copied scripts
     dir); `redo_from.bb` exits non-zero with `Failed to queue handoff`
     and no CHECKPOINT-only success line stands alone.
  4. Under ruling A: `bb swarmforge/scripts/swarm_handoff.bb <fresh
     git_handoff draft>` as coder in the fixture exits non-zero and prints
     HANDOFF_NOT_QUEUED; the identical second call exits 0 and queues.
     `bb swarmforge/scripts/test/bl1306_audit_reroute_test_runner.bb`
     still ALL PASS.
  5. `bash swarmforge/scripts/test/test_handoffd_*.sh` that cover the
     dispatch-gap sweep still pass; a fixture active ticket with an
     assignee and no dispatch trail gets one real outbox file after one
     sweep, and the daemon log line for it says `git_handoff`, not the
     error form.
  6. `git diff main...HEAD -- backlog/standing-reds.tsv` shows the two
     rows removed and nothing else in that file.

