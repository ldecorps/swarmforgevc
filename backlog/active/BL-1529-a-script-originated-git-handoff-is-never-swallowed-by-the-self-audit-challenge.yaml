  absence of an error. FIRM: the two register rows this mint adds
  (test_redo_from.sh, test_reroute.sh) are removed in the land that turns
  them green. Minted by the specifier on 2026-09-11 from the census run for
  the coder's unowned-red notes on test_rule_proposal.sh and
