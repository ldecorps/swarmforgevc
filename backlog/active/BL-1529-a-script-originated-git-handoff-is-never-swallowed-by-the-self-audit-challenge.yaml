id: BL-1529
title: "A script-originated git_handoff is never swallowed by the self-audit challenge: salvage_lib's queue-handoff! (redo_from.bb, reroute.bb, reroute_resume.bb) and handoffd.bb's dispatch-gap auto-route! call swarm_handoff.sh ONCE, and since the two-call AUDIT_REQUIRED landed (44d2d42591, 2026-08-30) that first call prints HANDOFF_NOT_QUEUED and exits 0 - every one of them reports success, logs a checkpoint or 'git_handoff', and queues nothing"
