description: |
  ## What is wrong

  `swarm_handoff.bb` (~line 1176) routes every `type: git_handoff` through
  `submit-after-audit!` (~line 979): the first invocation for a draft
  fingerprint writes a challenge under `.swarmforge/handoffs/audit_pending/`,
  prints `AUDIT_REQUIRED` / `HANDOFF_NOT_QUEUED`, returns nil, and `-main`
  falls off the end - exit 0 (44d2d42591, 2026-08-30, "two-call
  AUDIT_REQUIRED"; Article 2.3). An agent reads the text and calls again.
  Two production callers never learned to:

  - `salvage_lib.bb` `queue-handoff!` (~line 142-168): drafts a
    `git_handoff`, runs `swarm_handoff.sh` once through the chokepoint,
    treats any zero exit as queued, and returns the trimmed stdout - the
    challenge text - which `redo_from.bb` (~line 50-64), `reroute.bb`
    (~line 106-125) and `reroute_resume.bb` (~line 39) print after their
    own `REDO:`/`REROUTE:` + `CHECKPOINT:` lines. The checkpoint tag is
    made, the stale parcels are abandoned, the run-log gets its event,
    and NO fresh handoff exists. Last live use was 2026-08-29
    (`run-log.jsonl`, three manual redos), the day before the audit
    landed; the verbs have not been exercised live since, so this is
    latent, not observed - the tests below observed it.
  - `handoffd.bb` `auto-route!` (~line 2035-2050): drafts the BL-222
    dispatch-gap `git_handoff` via `chase_sweep_lib/dispatch-gap-draft-lines`,
    runs `swarm_handoff.bb` once as `coordinator`, and logs
    `dispatch-gap-autoroute <id> <role> git_handoff` on exit 0. The daemon
    log would show a successful repair for a ticket that received
    nothing. No `dispatch-gap-autoroute` line since 2026-08-30 in the logs
    on disk, so no live instance is known; the shape is the same.

  Tests that caught it, both `standing` in `suite-manifest.tsv` and both
  red on `main` at 4d019c0f91 with no register row:
  - `swarmforge/scripts/test/test_redo_from.sh` exits 2 after case 02:
    `ls "$OUTBOX"/*.handoff` finds nothing (its case 01 "no fresh handoff
    queued").
  - `swarmforge/scripts/test/test_reroute.sh` exits 2 after case 00:
    `ls -t outbox/*.handoff` finds nothing after `REROUTE: BL-900 from
    coder to cleaner (commit ..., detour 1/3)` was printed.
  Both were last touched 2026-07-23 (BL-606) and passed until 08-30.

  Census (BL-1445): every non-test script that drafts a `type: git_handoff`
  and runs it through `swarm_handoff` - counted with
  `grep -l 'type: git_handoff' swarmforge/scripts/*.bb swarmforge/scripts/*.sh`
  (6 files), then reading each: `salvage_lib.bb` (the one sender, three
  verbs) and `chase_sweep_lib.bb` (draft only; the send is `handoffd.bb`
  `auto-route!`). `handoff_lib.bb` and `task_scope_gate_lib.bb` match in
  comments only, `swarm_handoff.bb` is the callee, and
  `local_coder_battery.sh` writes a draft it never sends. Population: 2
  senders, 4 call sites.

  ## What is wanted

  Every script-originated `git_handoff` either lands in the sender's
  outbox or fails loud. `redo_from`, `reroute`, `reroute_resume` and the
  dispatch-gap auto-route queue a real handoff again under the audit as it
  stands (no bypass), and none of them can report success on a challenge.
  `test_redo_from.sh` and `test_reroute.sh` are green on `main`; the two
  register rows go in the same land.

  ## How (direction, not mandate)

  - `queue-handoff!`: after the first call, if the output carries
    `HANDOFF_NOT_QUEUED` (or the exit is non-zero under ruling A), run the
    identical draft once more - the protocol's own second call - and then
    require a `HANDOFF QUEUED`/`DELIVERED`/`HELD` line naming an outbox
    path; anything else is `exit! 1` with the output, as the existing
    non-zero branch already does. Return the outbox path, not raw stdout.
  - `auto-route!`: same two-call shape; log `dispatch-gap-autoroute` only
    on a queued path and `dispatch-gap-autoroute-error` otherwise.
  - Under ruling A, `print-audit-required!`'s caller exits 1 (or a
    distinct code) after printing; `bl1306_audit_reroute_test_runner.bb`
    asserts on text and keeps passing; check `swarm_handoff.sh` propagates
    the code. Article 2.3 / `handoff-protocol.md` gain one sentence naming
    the exit (documenter).
  - Prefer a single helper in `salvage_lib.bb` (or `handoff_lib.bb`) that
    both callers use, so the two-call rule is stated once.

  ## Not in scope

  - The three test-lane reds from the same landing
    (`test_rule_proposal.sh`, `test_handoff_state_dir_worktree_root.sh`,
    `test_required_stages_ticket_lookup_collision.sh`): BL-1530. They
    drive `swarm_handoff` directly and need no production change.
  - `sendNoteViaHandoff` and every `note` sender: notes are single-call
    and unaffected.
  - Any change to what the audit challenges or how it fingerprints
    (BL-1306's contract stands).

