approval_context: >
  A new feature file is authored here, so it needs a tap, and one choice
  is posed as ruling_options below: whether the self-audit challenge keeps
  exiting 0. FIRM either way: no env-var bypass of the audit is added
  (engineering.prompt forbids FORCE_RESULT-style seams; the audit is an
  agent-discipline gate and a script that has no agent to self-audit
  submits the identical draft twice, which is the protocol as written).
  FIRM: queue-handoff! and auto-route! treat "nothing queued" as failure -
