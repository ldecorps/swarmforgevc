required_wiring:
  - "specs/pipeline/steps/index.js::bl994::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"
  - "specs/pipeline/steps/bl929LiveScreenPackLayoutSteps.js::shows that ticket in its Expand view::AMENDED 2026-08-20 - this patch moves a held ticket off the grid tile head, which retires BL-929 scenario 03's old assertion. Its replacement step must be handled in BL-929's own step file, in THIS parcel, or the acceptance runner throws on an unhandled step and BL-929 goes red"

invariants:
  - "What lands is the layout the human verified. The captured patch is the reference for the behaviour; a reinterpretation that renders differently on their phone is a defect even if every scenario passes."
