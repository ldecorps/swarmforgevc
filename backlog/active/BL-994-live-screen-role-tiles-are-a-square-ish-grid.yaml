  Source: `backlog/INTAKE-live-screen-role-tile-grid-hotfix.md` (human via
  Cursor, 2026-08-20 afternoon), drained from the backlog ROOT and removed in
  the same pass that minted this ticket. One intake, one ticket - no
  consolidation.

  Human directive, verbatim: "Let the coordinator know about this webpage
  hotfix." Done as a priority-00 note when this ticket was committed, not
  deferred to promotion.

  Severity: the intake offered "medium/high" and left the call to me. I chose
  `high`. The surface is currently BROKEN on `main` - anyone compiling from
  `main` gets the thin-strip layout - and it is the human's phone-viewable
  live monitoring channel, which puts it in "a live fault degrading
  behaviour" rather than cosmetic. The counterweight is that the fix is fully
  captured in a tracked patch, so nothing can be lost and the human's own
  machine already renders correctly; that is why this is not `critical`.

  Related tickets, kept separate deliberately (the intake's own list, all
  confirmed): BL-609 (paused) is a font-size control on the SAME file but a
  different ask; BL-526/BL-522 are the done console-menu and original
  resident-spy Mini App lineage this is a follow-on defect to; BL-881 (done)
  is the live-capture TTL cache, a feed-data path rather than the HTML grid;
  BL-956 (done) is the prior instance of this exact landing posture and is
  the shape to copy.

  IR-DRY: 3 medium-confidence findings, all reviewed and kept. Two are the
  inherent pairing of scenario 01's parameterized steps with the same steps
  carrying literals in scenarios 02-04 (`<panes> worker panes` vs `4 worker
  panes`); one step handler regex serves each pair. The third pairs "shows
  its role name and an Expand control" against "shows its role name as
  unbroken text" - different assertions about the same element, and merging
  them would hide which one a regression broke. No Background hoisting beyond
  the shared render: scenarios 02-04 share the 4-pane phone-portrait setup
  but scenario 01 varies both, so hoisting would contradict it.

approval_context: >
  Two things for your eye.

  First, severity. I called it `high` within the range your intake offered -
  reasoning in `notes:`. Push back to `medium` if you read a broken layout on
  a surface you can already see fixed locally as contained.

  Second, and more useful: I have written the acceptance to assert the
  RESOLVED column count for five pane-count/viewport combinations rather than
  the presence of the CSS rules the patch adds. That is deliberate - a rule
  that exists but is overridden would pass a string check - but it does mean
  the contract pins the 1/2/3/4-column breakpoints as behaviour. If you want
  the freedom to retune those breakpoints later without touching an
  acceptance contract, say so and I will loosen scenario 01 to assert only
  that no tile is crushed.

  Everything else follows your three locked decisions as written, and the
  coordinator has been notified as you asked.

