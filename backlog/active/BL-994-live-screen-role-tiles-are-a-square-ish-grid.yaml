  - "A pane's transcript lives in exactly one place - hidden in the grid tile, shown in the fullscreen Expand. Never both, never neither."

description: >
  The Live Screen is the phone-viewable window onto the running pack. With
  four workers visible, `.split` was `display: flex` with wrap and a
  percentage `flex-basis`, which let the panes shrink horizontally without a
  floor - four panes collapsed into a single thin vertical strip. The tile
  headers used `word-break: break-word`, so each role name stacked one letter
  per line inside the strip. The surface was unreadable on a phone.

  The human hit this live, iterated on it the same afternoon (first asking for
  role-name-only tiles, then reporting the thin-strip failure), and a Cursor
  agent produced the layout fix. That fix is what this ticket lands.

  THE POSTURE, and it is the whole point of the ticket: this is the pipeline
  LANDING of a captured human hotfix - the BL-956 shape - not a greenfield
  redesign and not a BL-848-style stamp-off of a commit already sitting on
  `main`. `extension/src/` cannot reach `main` outside QA
  (`check_pipeline_code_on_main.sh`, Article 1.8/4.2, BL-247 / BL-632), so
  the change exists today only as a tracked patch plus a dirty master working
  tree. Running the chain is how it becomes real.

  Verified by the specifier at spec time, because the whole ticket rests on
  the capture being faithful:

  - `backlog/evidence/INTAKE-live-screen-role-tile-grid-hotfix.patch` exists
    and is TRACKED on `main` (169 lines). At spec time it was verified
    BYTE-IDENTICAL to `git diff -- extension/src/bridge/residentSpyUiHtml.ts`
    in the master checkout (`diff -q` clean), so it is a complete record of
    the hotfix.

    AMENDED 2026-08-20 - READ THIS BEFORE VERIFYING: that `git diff` is now
    EMPTY and the live file no longer carries the fix. Nothing was discarded -
    QA deliberately set the master checkout's uncommitted work aside before a
    main<->origin reconcile, as `stash@{0}`
    ("QA-BL983-board-seat-leak-fix-set-aside-20260820 ... real work, wrong
    worktree - needs rescue to coder's worktree, not discard"), and the phone
    grid UI hotfix went with it.

    So: do NOT read the empty diff as "the patch is wrong" or "the work is
    already done", and do NOT try to reconstruct the hotfix from the live file.
    The tracked 169-line patch file is the authoritative record and is
    unaffected - apply it in your worktree and drive it through the chain
    exactly as written. You do not need the stash for THIS ticket; it is
    mentioned only so the empty diff is not mistaken for a lost fix.
  - `getResidentSpyUiHtml()` is a pure function returning an HTML string, and
    `extension/test/residentSpyUiHtml.test.js` already exercises it - so the
    layout is testable at the module boundary without booting a webview.

  What the patch changes, from reading it rather than the prose:

  - `.split` becomes `display: grid` with `grid-auto-rows: 1fr` and a phone
    default of `repeat(2, minmax(0, 1fr))` - so four workers read as a 2x2.
    `minmax(0, 1fr)` is what removes the shrink-to-strip floor.
  - `.split.pane-count-1` is a single column. `.pane-count-5` through `-8`
    stay 2-column on narrow. From `@media (min-width: 700px)`, `-5`/`-6`
    become 3 columns and `-7`/`-8` become 4.
  - `.pane-kind` gets `word-break: normal` and `overflow-wrap: normal`, and
    is centered at `clamp(13px, 4.5vw, 20px)`.
  - `.split .pane-col > pre { display: none }` hides the transcript in the
    grid, and `renderPane`'s tile header becomes role name plus an absolutely
    positioned Expand hint.
  - Fullscreen Expand with a ticket: drop the bold role `pane-kind` line
    under the ticket strip (role already appears in `ticket-strip-meta`) —
    human follow-on, saves one header line on the zoomed view.

  How (direction, not mandate): apply the captured patch in the coder
  worktree and drive it through the chain. The layout decisions are the
  human's and are already made - what the pipeline adds is the acceptance
  contract, the review passes and a legal landing, not a redesign.

  AMENDED 2026-08-20 - THE BL-929 COLLISION, and it is in scope for this
  parcel. The coder reported that this patch breaks BL-929's acceptance
  scenario 03. Verified by reading the code, not taken on report: patched
  `renderPane` writes the tile head unconditionally as role name plus an
  Expand hint and never calls the ticket block, while BL-929's step handler
  reads `.pane-col[data-pane-id="documenter"] .pane-head` innerHTML and
  requires it to contain the held ticket id. That is a deterministic red, and
  it is caused by locked decision 2, which is already the human's - so it is
  a contract relocation, not a new design decision, and it does not reopen
  this ticket's approval.

  BL-929's own locked decision 1 reads "Ticket id / title / role / model /
  age, if shown, live on the tile that actually holds the claim (already
  rendered as `.pane-ticket` / fullscreen head)" - the fullscreen head is
  named there as a valid home. So the contract moves rather than retires:
  BL-929 scenario 03 now expands the documenter tile and asserts the ticket
  in its Expand view. The amended feature file is committed on `main`; it
  lints clean and adds no IR-DRY finding.

  What this parcel must add (the step handler half - BL-233: it lands here or
  the runner throws):

  - A handler for `the documenter tile is expanded` and for `the documenter
    tile shows that ticket in its Expand view` in
    `specs/pipeline/steps/bl929LiveScreenPackLayoutSteps.js`.
  - Direction, not mandate: the pattern is already established in this
    parcel's own `bl994LiveScreenGridSteps.js` - dispatch a bubbling click on
    the `.pane-col`, flush, then read `#fs-head`. BL-929's existing
    `renderLiveScreen` closes its jsdom window before returning and its When
    step deletes the fixture root in a `finally`, so the expand step
    re-renders from the in-memory `ctx.snapshot` rather than reopening either.
    `requestBrowserFullscreen` is fully guarded (`if (!req) return`, plus
    try/catch), so jsdom's missing `requestFullscreen` is not a problem.
  - The assertion must be positive - the documenter tile's Expand shows
    `BL-929`. Do not settle for the negative half alone.

  A COVERAGE HOLE THIS PARCEL CURRENTLY HAS, found while verifying the above.
  `extension/test/residentSpyUiHtml.test.js` was already adapted here by
  flipping `assert.match(documenterHead.innerHTML, /BL-640/)` to
  `assert.doesNotMatch`, with a comment pointing at
  `bl994LiveScreenGrid.test.js`'s Expand test as the new home for that
  assertion. It is not: that test's `panesOf(n)` fixtures carry no
  `ticketId`, so `buildFullscreenHeadHtml` takes its non-ticket branch and
  the ticket block is never rendered there. Scenario 04 asserts only the
  pane LABEL and the transcript. As the parcel stands, the relocated ticket
  line is asserted NOWHERE - the negative was kept and the positive was
  dropped. The BL-929 amendment above is what closes it; either restore a
  positive assertion in the unit test too, or leave the comment pointing at
  BL-929 scenario 03 instead of at a test that does not cover it.

  Also verified while amending, because the ticket rests on it: the capture is
  faithful again. `git diff -- extension/src/bridge/residentSpyUiHtml.ts` in
  the master checkout is once more byte-identical to the tracked patch
  (`diff -q` clean, 66 insertions / 41 deletions). The empty-diff warning
  earlier in this description described a transient stash window and no longer
  applies; `qa_e2e_procedure` step 1 passes as written.


constraints: >
  Locked human decisions, verbatim from the intake:

    "1. Treat this as **pipeline landing of a captured human hotfix**, not a
        greenfield redesign (same posture as BL-956).
     2. Grid tiles show **role name + Expand only**; transcript stays in
        Expand fullscreen.
     3. Phone portrait stays **2-column** so four workers read as a 2x2 of
        square-ish tiles - do not restore the flex shrink layout that
        crushed them into thin strips."

  Out of scope, verbatim from the intake:

    "- BL-609 font-size +/- control.
     - Changing which roles appear in the live feed / pack layout.
     - Pipeline-grid / console menu surfaces.
     - Attempting to bypass BL-632 by committing `extension/src/` to `main`
       with a hotfix trailer - that path is refused; this ticket *is* the
       landing path."

  Also firm:

  - Take the change from the PATCH, not from the master working tree. The
    tree copy is uncommitted and a concurrent writer or a stray `git restore`
    can sweep it at any time; the patch is tracked and cannot be lost. They
    are byte-identical today, so nothing is given up by preferring the patch.
  - Do NOT `git restore` or otherwise tidy
    `extension/src/bridge/residentSpyUiHtml.ts` in the master checkout. It is
    the human's live copy of a surface they are actively watching, and it is
    not yours to revert. It stops being dirty when this parcel lands and the
    master checkout merges.
  - BL-609 (paused, `swarmforge-console`, resident-spy font-size control)
    touches the SAME file. Do not fold it in and do not "while I am here"
    it - the intake names it explicitly as a separate ask.

qa_e2e_procedure: >
  From the repo root:

  1. Confirm the capture is still faithful before building anything:
     `git diff -- extension/src/bridge/residentSpyUiHtml.ts` in the master
     checkout must remain byte-identical to
     `backlog/evidence/INTAKE-live-screen-role-tile-grid-hotfix.patch`. If
     they have diverged, the human has iterated again - stop and ask rather
     than landing a stale layout.
  2. Reproduce the failure at the parent commit: render the Live Screen HTML
     with 4 panes and confirm the old `.split` flex rule with a percentage
     flex-basis is what produces the crush, and that `.pane-kind` still
     carries `word-break: break-word`.
  3. At the parcel commit, drive `getResidentSpyUiHtml()` and assert the five
     pane-count/viewport combinations from scenario 01 resolve to 2, 1, 2, 3
     and 4 columns respectively. Assert the resolved column count, not the
     presence of a CSS string - a rule that exists but is overridden passes
     the weaker check.
  4. Confirm invariant 3 in both directions: the grid tile does NOT render
     the pane transcript, and the fullscreen Expand DOES render full metadata
     and transcript. A change that hides the transcript everywhere passes
     scenario 03 and fails the human.
  5. Run the acceptance feature and confirm all scenarios pass, and that the
     handler is registered in `specs/pipeline/steps/index.js`.
  6. Run the existing `extension/test/residentSpyUiHtml.test.js` and confirm
     no regression - it predates this change and covers the same module.
  6b. AMENDED 2026-08-20 - run BL-929's acceptance feature
     (`specs/features/BL-929-live-screen-follows-the-running-pack-not-the-resident-marker.feature`)
     and confirm all four scenarios pass, scenario 03 included. That feature
     was amended on `main` for this patch and its two new step handlers must
     be present in this parcel. Then prove the new assertion is not vacuous:
     make the Expand head drop the ticket block and confirm scenario 03's
     last Then fails, then revert.
  7. RECORDED MANUAL PROCEDURE (device surface, cannot be automated): open
     the Live Screen on a phone in portrait with the full pack running.
     Confirm four workers read as a 2x2 of square-ish tiles, each showing
     only its role name (COORDINATOR, SPECIFIER, ...) as unbroken text plus
     an Expand control; then open one tile's Expand and confirm the full
     metadata and transcript appear. Record the observation in the ticket -
     this is the only step that verifies what the human actually reported.
  8. Prove non-vacuity: restore the flex `.split` rule and confirm scenario
     01's 4-pane row and scenario 02 both fail, then revert.

notes: >
  AMENDED 2026-08-20 by the specifier, on the coder's priority-00 note
  "BL-994 patch breaks BL-929 accept 03 tile-ticket line - spec amendment
  needed". The coder was right to bounce it here rather than edit another
