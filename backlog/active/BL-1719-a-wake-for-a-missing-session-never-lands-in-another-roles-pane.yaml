description: |
  ## What is wrong

  The human, 2026-09-24 (verbatim, after the specifier reported repeated
  empty wakes): "You are not the only one getting those, it's worth
  investigating where they originate from and stop the noise."

  Traced by the specifier the same day:
  - The specifier's session transcript has 9 wake lines; 4 found an empty
    mailbox: 09:49:41.838Z, 11:16:38Z, 11:18:31Z, 11:26:53Z. Each is within
    one second of a parcel addressed to coder@2: 011167 (coordinator,
    09:49:41), 001014 (cleaner, 11:16:37), 002563 (architect, 11:18:30),
    002567 (architect, 11:26:52).
  - `.swarmforge/handoffs/inject-traffic.log`, 09:49:41.844Z:
    `source=sync-deliver outcome=ok role=coder@2 session=swarmforge-specifier`.
    The other three went through handoffd, which does not write that log.
  - fe664164b0 (09:49:26Z, operator): "Drop coder@2 second-Claude seat".
    The live tmux server has no swarmforge-coder@2 session.
  - `handoff-lib/wake-session` -> `resolve-wake-session`: configured
    session missing and resident present -> the resident's session.
    `mono-router-resident-session` is "first non-coordinator roles.tsv
    session", in this standing pack `swarmforge-specifier`. The docstring
    scopes the remap to mono-router / sequential rotation; the code
    applies it in every pack.
  - The same class, historically: inject-traffic.log has 30 wakes typed
    into a session other than the recipient's since 2026-09-13 (QA,
    hardender, documenter, specifier, architect, cleaner -> swarmforge-coder,
    and today coder@2 -> swarmforge-specifier). Which of those days ran a
    rotation-router pack, where the remap is correct, is not reconstructed
    here. The count covers the sync-delivery path only.

  ## What is wanted
  - Scenario 01 (outline, both delivery paths): standing pack, a note to
    coder@2 with no session - no pane receives anything, the skip is
    logged naming the missing session, the note is in coder@2's inbox.
  - Scenario 02: rotation-router pack - a dormant role's wake still goes
    to the resident, unchanged.

  ## How (direction, not mandate)
  - Gate the remap in `wake-session` (or `resolve-wake-session`'s caller)
    on `rotation-router-pack?`; the pure resolver gains the pack fact as
    an input so it stays testable without tmux.
  - The fixture writes its own `.swarmforge/tmux-socket` pointing at a
    private tmux server started by the test, unsets TMUX for every
    subprocess, and asserts the live socket path appears nowhere in the
    fixture (BL-1390's proof posture).

  ## Scope
  - `swarmforge/scripts/handoff_lib.bb` (wake-session / resolve-wake-session).
  - A bb runner case beside the existing wake-session tests.
  - `specs/features/BL-1719-...feature` + the pinned handler.
  - Docs: the handoff-flow reference's wake paragraph (handoff-flow.mmd
    only if its wake edge names the remap).

  ## Not in scope
  - Why worktree senders still address a removed seat (BL-1720).
  - The three stranded coder@2 parcels (coordinator/operator bookkeeping).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1719-a-wake-for-a-missing-session-never-lands-in-another-roles-pane.feature`:
     all ok (3 of 3).
  2. The existing wake-session / mono-router bb runners and
     `swarmforge/scripts/test/test_handoffd_notify_verified.sh`: green.
  3. After the land, with a standing pack running: rows written after the
     land time whose session is not the recipient's own read zero -
     `awk '{r="";s="";for(i=1;i<=NF;i++){if($i~/^role=/)r=substr($i,6);if($i~/^session=/)s=substr($i,9)} if(r!=""&&s!="swarmforge-"r)print}' .swarmforge/handoffs/inject-traffic.log`
     (the census this ticket counted 30 with), filtered to lines after the
     land's timestamp.
  4. `git diff main...HEAD --name-only` names only the Scope files, the
     feature, the handler, docs and evidence.

