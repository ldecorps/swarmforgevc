id: BL-973
title: "5 bb fixture copy-lists hand-maintained against a moving closure (2 acceptance features + 1 shell test red on main, ungated): derive/gate each list from its own entry point's load-file closure and close the unrun-test gap"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
human_approval: approved
priority: 30
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-973-copy-lists-closure-derived-and-suite-completeness.feature

invariants:
  - "A fixture copy-list of a bb script's dependencies is derived from, or gate-checked against, the real transitive load-file closure OF THE ENTRY POINT THAT FIXTURE ACTUALLY DRIVES - never hand-maintained without a closure guard (a new load-file upstream must fail loudly here, not silently strand the fixture)."
  - "Every test file under swarmforge/scripts/test/ is run by a standing gate or carries an explicit dated exclusion with a reason - a red test cannot sit unrun and unnoticed."

description: >
  SEVERITY RAISED medium -> high on 2026-08-22 (was medium at mint
  2026-08-20). The original medium rationale - "test-infrastructure rot,
  loud once run, no live swarm behavior degraded" - still describes the
  mechanism correctly, but two things changed that the mint-time call
  could not weigh. FIRST, the red is now normalized on main: two
  acceptance features (BL-487 0/2, BL-814 3/6) and one shell test sit
  permanently red, which is precisely the condition under which a REAL
  regression hides in the noise - a broken health signal, which is the
  Article 3.2.4 `high` predicate. SECOND, the per-parcel tax is now
  measured rather than predicted: three separate roles have independently
  rediscovered and hand-verified this same staleness (architect during
  BL-967 review, specifier at mint, coder during BL-1029), each spending
  a pass proving "pre-existing, identical at the parent commit" before
  being allowed to proceed. Filed knowing the expedite lane is congested;
  severity reflects impact, and sequencing is the coordinator's call.

  The defect, from the architect's verified sweep during BL-967 review
  pass 2 (evidence backlog/evidence/BL-967-architect-review-pass2-
  20260820.md, commit 2fc12e00a; specifier re-reproduced the red test
  at mint, exit 1 failing to load prompt_engine_lib.bb from
  handoff_lib.bb line 37): hand-maintained copy-lists of a bb script's
  dependencies drift the moment anything upstream gains a load-file edge,
  because nothing gates them.

  THE FIVE LISTS, state measured at HEAD 2026-08-22 (specifier, by
  computing each entry point's real closure via
  specs/pipeline/steps/lib/operatorRuntimeBbClosure.js):

    | list | entry point it drives | missing today |
    |---|---|---|
    | specs/pipeline/steps/bl814LiveRoleHeldLoudDegradeSteps.js | pipeline_stage_cli.bb | prompt_engine_lib.bb, daemon_cycle_guard_lib.bb |
    | specs/pipeline/steps/bl487BoardFreshnessWithoutCoordinatorSyncSteps.js | pipeline_stage_cli.bb | prompt_engine_lib.bb, daemon_cycle_guard_lib.bb |
    | swarmforge/scripts/test/test_lean_ledger_bb_wiring.sh | done_with_current_task.bb | prompt_engine_lib.bb, daemon_cycle_guard_lib.bb |
    | swarmforge/scripts/test/lib/operator_runtime_sandbox.sh | operator_runtime.bb | daemon_cycle_guard_lib.bb |
    | extension/test/readLiveRoleHeldTicketsCli.test.js | pipeline_stage_cli.bb | nothing today - hand-patched, still UNGATED |

  THE FIFTH LIST IS THE POINT, not an afterthought. It carries all seven
  files today because BL-967's cleaner hand-patched it, so a check that
  only looks for missing names finds it clean and leaves it
  hand-maintained - and it is then first in line to rot on the next
  load-file edge. It is in scope BECAUSE it currently passes: the
  deliverable is the guard, not the names.

  THE ENTRY POINT IS PER-LIST, and the mint-time spec got this wrong.
  Scenario 02 originally checked every list against handoff_lib.bb's
  closure. That is a necessary but NOT sufficient condition: each fixture
  drives its own CLI, and pipeline_stage_cli.bb and
  done_with_current_task.bb each pull pipeline_stage_lib.bb on top of
  handoff_lib.bb's set, while operator_runtime.bb pulls twenty-four more.
  A guard pinned to handoff_lib.bb would green a fixture missing its own
  CLI's direct dependency. Scenario 02 now carries the entry point as an
  Examples column, and invariant 1 names it.

  THE RE-ROT THIS TICKET PREDICTED HAS NOW HAPPENED TWICE. Mint warned
  that a hand-patch naming "today's two missing files" goes stale when
  BL-967 merges. It did, and then BL-1029 (in flight 2026-08-22) added a
  SECOND new closure member: handoff_lib.bb now load-files
  shell_quote_lib.bb, so every one of the five lists needs a sixth name
  the day that parcel lands. That is the second confirmed instance of the
  exact failure the constraint below forbids, and it is the argument for
  deriving rather than patching, made by the defect itself.

  Fix wanted, two halves of one incident:

  (1) Each list follows the closure of the entry point it drives. Use the
  pattern BL-944 already built: computeClosure(scriptsDir, entryFile) in
  specs/pipeline/steps/lib/operatorRuntimeBbClosure.js is ALREADY
  parameterized by entry point and already returns the right answer for
  all four entry points here - verified by the specifier at mint-amend
  time. Either derive each fixture's copy set from it or assert the
  hand-list matches it. test_lean_ledger_bb_wiring.sh runs green, and
  BL-487 and BL-814 go green with it.

  (2) No test sits unrun. Today no standing entry point runs
  swarmforge/scripts/test/'s shell tests as a suite, which is exactly
  why three red days went unnoticed. Deliver a standing
  suite-completeness check: every test_*.sh and *_test_runner.bb under
  swarmforge/scripts/test/ is either invoked by the standing suite
  entry point or listed in an exclusion manifest with a dated reason
  (slow/manual/live-only are legitimate reasons - the point is an
  explicit, visible decision, not forcing every test into every run).

  How (direction, not mandate): half 2 can be an inventory gate (a
  fast check comparing the tree against the runner's list plus the
  manifest) rather than a run-everything suite - some tests here are
  legitimately slow (one exceeded 2 minutes under live load at mint
  time) and belong in an exclusion-with-reason lane, not on every
  parcel's critical path. For half 1, the shell-side lists
  (operator_runtime_sandbox.sh, test_lean_ledger_bb_wiring.sh) cannot
  require the JS helper; a small bb or shell closure walk reading the
  same load-file idiom is the expected shape there, and the two
  implementations agreeing is itself worth a check (BL-897: a constant
  mirrored across a language boundary needs a test asserting both agree).

constraints: >
  Out of scope / firm lines:

  - Do not hand-patch the five lists with today's missing filenames
    and stop there - the compute-the-closure discipline is the
    deliverable. This is now twice-demonstrated, not hypothetical: a
    bare hand-patch re-rotted on BL-967's merge and will re-rot again
    on BL-1029's. The invariant fails a list with no closure guard.
  - extension/test/readLiveRoleHeldTicketsCli.test.js is IN scope even
    though it is currently complete. Skipping it because it passes is
    the same mistake in miniature.
  - BL-1029's parcel content is not this ticket's to touch or revert.
    It legitimately adds shell_quote_lib.bb to the lists it broke; if
    it has landed by the time this is built, that name is simply part
    of the computed closure and needs no hand-edit - which is the
    outcome this ticket exists to produce.
  - Do not convert slow/live tests into always-run suite members to
    satisfy half 2 - an explicit exclusion with reason is the
    designed outcome for those.
  - handoff_lib.bb's own load-file list is not restructured here.

qa_e2e_procedure: >
  1. Acceptance scenario 01: test_lean_ledger_bb_wiring.sh exits 0 on
     the parcel (run unpiped or with the exit code captured from the
     test itself - a piped invocation reports the tail's exit).
  2. Scenario 02 rows: each of the five lists checked against the
     closure computed from the PARCEL's tree for THAT ROW'S entry
     point - not handoff_lib.bb's for every row. Confirm the row for
     extension/test/readLiveRoleHeldTicketsCli.test.js is genuinely
     gated and not merely passing on its current hand-patched contents:
     delete one name from it in a scratch copy and watch that row go
     red.
  3. Scenario 03: run the suite-completeness check; then delete one
     test file's entry from the runner/manifest in a scratch copy and
     confirm the check goes red (non-vacuity).
  4. Negative regression, the one that matters: add a scratch
     load-file edge to a copy of handoff_lib.bb and confirm EVERY one
     of the five lists' guards fails loudly - this is the exact event
     (BL-911, BL-967, BL-1029) that produced the defect three times,
     so a guard that does not fire here has not fixed anything.
  5. Confirm the two features this defect reddens are green on the
     parcel: BL-487-board-freshness-without-coordinator-sync 2/2 and
     BL-814-live-role-held-fixture-loud-degrade 6/6. They are the
     user-visible outcome; scenario 01 alone does not prove it.
  6. bb unit suite green; record the Babashka degraded-fallback note
     (no mutation/CRAP/DRY wired, BL-472) in the hardening evidence.

notes: >
