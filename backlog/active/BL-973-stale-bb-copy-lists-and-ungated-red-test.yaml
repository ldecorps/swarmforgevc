  copy-lists stale since BL-911; test_lean_ledger_bb_wiring.sh red,
  ungated"), sent to specifier + coordinator per Article 4.4 during
  BL-967 review pass 2. Full enumeration and the pre-BL-967
  reproduction are in the architect's evidence (commit 2fc12e00a);
  the architect's own words: "The durable fix is the one BL-944
  already built for the guarded list: derive the copy list from the
  real closure instead of hand-maintaining it. Two lists now have
  that guard; four do not."

  Second source, consolidated N:1 (Consolidation Authority): the
  coordinator independently verified the same finding and requested a
  mint (note 00_20260820T044456Z_000658, crossing this ticket's
  ready-note in flight; its verification evidence is
  backlog/evidence/bb-fixture-copy-lists-stale-since-bl911-20260820.md,
  commit 4a6c1e6f1) - one ticket, two corroborating evidence files.

  THIRD source, consolidated N:1 on 2026-08-22: the coder hit the same
  two features red while building BL-1029 and surfaced them by
  priority-00 note rather than widening scope - correctly, per Article
  4.4. Their evidence (backlog/evidence/BL-1029-coder-20260822.md,
  commit a55b5156b) measured BL-487 (0/2) and BL-814 (3/6) failing
  IDENTICALLY at the parent commit, by reverting their own
  handoff_lib.bb change and re-running - which is what rules this out
  as BL-1029 collateral and confirms it as this ticket's defect. Their
