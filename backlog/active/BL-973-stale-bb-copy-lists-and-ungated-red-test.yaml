  shell_quote_lib.bb to the closure, i.e. the next rot.

  Specifier probe at mint: red test reproduced (exit 1, dies loading
  prompt_engine_lib.bb at handoff_lib.bb:37); no standing entry point
  found that runs the swarmforge/scripts/test/ shell tests as a
  suite; the lesson ledger already carries both failure classes
  (hand-maintained mirror lists patched one name at a time; a test
  dir run by no standing gate).

  Specifier re-probe at amend (2026-08-22): recomputed all four entry
  point closures from the live tree rather than trusting the mint-time
  enumeration. pipeline_stage_cli.bb -> 7 files; done_with_current_task.bb
  -> 7; handoff_lib.bb -> 5; operator_runtime.bb -> 29. This is what
  surfaced the per-list entry point error in scenario 02 and the fifth,
  ungated list. No new ticket was minted for the coder's report: this
  one already owned it, and duplicating an existing active/paused
  ticket from a symptom report is a known trap (BL-1065 duplicated
  BL-1033 exactly that way).

  Gherkin lint gate: clean at amend. IR-DRY: 0 findings.

