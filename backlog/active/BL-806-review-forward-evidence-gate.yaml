  Reviewed commit 9cb1d7c1a0 ("BL-806: refuse a review role's forward
  naming exactly the received commit", by coder — single implementation
  commit, forwarded unchanged by cleaner).

  - Architecture: `review_forward_evidence_gate_lib.bb` splits the pure
    decision (`blocked?`) from its one fs read (`received-commit-for-task`),
    same shape as the codebase's other gate libs. Direction reuses
    `required_stages_lib/routes-forward?` — no second predicate. Wired live
    into `swarm_handoff.bb`'s validate path alongside the existing
    ticket-close, duplicate-chain (BL-760), and pre-QA (BL-531) gates —
    `required_wiring`'s only entry confirmed present by reading the diff
    directly (the check runs in the `cond->` errors chain, not only in the
    lib). All changed files are `swarmforge/scripts/*.bb` and
    `specs/pipeline/steps/*.js` — none under `extension/src/`, so the
    dependency-cruiser ruleset's scope (confirmed via its own header
    comment) does not apply; no two-layer/webview/secrets rules apply
    either (fork/operator-substrate tooling).
  - Co-change: `swarm_handoff.bb` shows the expected pre-existing hub
    coupling (handoffd.bb, required_stages_lib.bb, handoff_lib.bb — all
    genuine `load-file` collaborators already visible in the diff), nothing
    new or suspicious.
  - Invariants (both declared, BL-654): `review_forward_evidence_gate_lib_property_runner.bb`
    encodes both jointly against `blocked?` via an independently-stated
    oracle (`expected-blocked?`, a fresh restatement of the invariant text,
    not a copy of the implementation) over a combinatorial input space
    (review/non-review senders, all 4 handoff types, 0/1/2 recipients,
    same/different/absent received-commit, reroute present/absent,
    task present/absent) — 1000 runs, plus a non-vacuity companion proving
