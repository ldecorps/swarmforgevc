  - Re-ran the full BL-806 acceptance feature after a fresh compile: 9/9
    scenarios green (the Scenario Outline's 4 role examples + 5 singles).
  - Minor, not a send-back: the commit message has a stray trailing
    `EOF` / `)` (heredoc-closing artifact leaked into the message body,
    after the "By coder." byline) — cosmetic only, byline itself is
    present and correct, no effect on the shipped code or on Article 4.4
