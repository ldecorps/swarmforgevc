description: |
  ## What is wrong
  `node specs/pipeline/cli.js specs/features/BL-538-console-paused-ticket-pager.feature`
  on main (2026-09-22, both the hardener and the specifier):

      not ok 6 - confirmed Expedite sets priority 0, jumps the queue, and advances
          409 !== 200
      not ok 7 - Approve is shown only for paused tickets awaiting human approval
          no step handler matched "Given a paused ticket with human_approval pending is shown on the pager"
      not ok 8 - confirmed Approve records human_approval without promoting
          no step handler matched "Given a paused ticket with human_approval pending is shown on the pager"
      # pass 5
      # fail 3

  Two causes:

  1. **07/08 - a handler that never existed.** b5c1b97a12 (2026-07-22,
     "Add Approve action to the paused-ticket pager Mini App", co-authored
     by Cursor, no ticket id) added `POST /paused-pager/approve` to
     `extension/src/bridge/bridgeServer.ts`, the button to
     `pausedPagerUiHtml.ts`, 101 lines of `extension/test/pausedPagerBridge.test.js`,
     and 14 lines to the feature file - scenarios 07 and 08 - and no step
     handler. `specs/pipeline/steps/bl538ConsolePausedTicketPagerSteps.js`
     last changed on 2026-07-19 (e3b809177c). The acceptance runner has
     thrown on those two scenarios on every run since, and no lane runs
     a landed feature until its handler changes (the BL-1626/BL-1628
     finding of 2026-09-17), so nobody ran it until the hardener
     spot-checked BL-1685's handler list today
     (`backlog/evidence/unowned-red-bl538-approve-scenarios-hardener-20260922.md`,
     hardender branch).
  2. **06 - a fixture the promotion gates cannot see.** BL-1083
     (f36b77ddec, 2026-08-23) made `promoteToActive` consult
     `<target>/swarmforge/scripts/promotion_gates_cli.bb`
     (`extension/src/panel/backlogWriter.ts` `promotionGatesCliPath`,
     `consultPromotionGates`: "the promotion gates could not be consulted
     (<cli> is missing); refusing rather than promoting ungated") and the
     pager's Expedite route answers a refusal with 409 (`bridgeServer.ts`
     ~879, "the pager shows the gate's own words"). The bl538 handler's
     `mkFixture` is a bare mkdtemp with `backlog/paused` and
     `backlog/active`, and `writeTicket` writes `id`, `title`, `status`
     and `priority` only - no `swarmforge/scripts/`, no
     `human_approval`. BL-1425's handler (`bl1425QueueJumpPastCapSteps.js`,
     lines ~177-180) stages the real scripts into its fixture for exactly
     this consult; the bl538 fixture predates the gate and was never
     brought along.

  ## Why
  The pager is a human-facing surface (Telegram Mini App) and its
  acceptance file is the only executable record of what its Approve and
  Expedite buttons do; three of its eight scenarios have been dark for
  one to two months. BL-1425's register rule: a red is owned or it
  throttles intake.

  ## How (direction, not mandate)
  - Handler: add the `Given a paused ticket with human_approval pending
    is shown on the pager` step (writeTicket gains an optional
    `human_approval` line; the step opens the pager on that ticket the
    way the existing `Given a paused ticket is shown on the pager` does),
    `Then I see an Approve control` / `And I do not see Approve on paused
    tickets that are not pending approval` (read `canApprove` in the
    pager payload or the rendered button, whichever scenarios 01-05
    already read), `When I confirm Approve` (POST /paused-pager/approve
    with the console token, as the Expedite confirm step does),
    `Then that ticket's human_approval becomes approved`, `And the ticket
    remains under backlog/paused/`, `And the pager refreshes to show the
    updated YAML`.
  - Fixture for 06: stage `swarmforge/scripts/promotion_gates_cli.bb` and
    the libs it loads into the fixture root (copy the list
    bl1425QueueJumpPastCapSteps.js stages, or the subset the CLI actually
    sources - the coder measures which), and give the expedited ticket
    what the gates allow (`human_approval: approved`, no `depends_on`);
    then the confirm returns 200 and the existing assertions (priority
    0, promoted, pager advances) run as written.
  - Evidence: the 8/8 run and, per scenario 06, which gate the 409 named
    at mint and why the staged fixture passes it.
  - Documenter: `docs/how-to/BL-538-console-paused-ticket-pager.md`
    already describes Approve (BL-1425's documenter updated Expedite);
    verify, no diagram trigger.

  ## Scope
  - `specs/pipeline/steps/bl538ConsolePausedTicketPagerSteps.js` only
    (after BL-1685's require move lands - merge main first).
  - Out of scope: any `extension/src` change; any scenario text change;
    the other BL-1685 handlers; a lane that runs landed features
    (BL-1626/BL-1628 own that).

qa_e2e_procedure: |
  On the parcel commit, from the repo root, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-538-console-paused-ticket-pager.feature`:
     `# pass 8`, `# fail 0` - at mint 5/3.
  2. `grep -c 'human_approval pending is shown on the pager' specs/pipeline/steps/bl538ConsolePausedTicketPagerSteps.js`
     >= 1 and `grep -c 'promotion_gates_cli.bb'` on the same file >= 1
     (the two required_wiring pins, read by hand).
  3. `git diff main...HEAD --name-only` names only the handler file and
     evidence; `extension/src` and the feature file are unchanged.
  4. After landing: `bb swarmforge/scripts/standing_red_register_cli.bb .`
     reports `"unowned":[]` and no row names the BL-538 feature (the land
     step's REGISTER_ROW_RETIRED line, BL-1631).

