human_approval: approved
approval_context: >
  Discovered while minting BL-1193 (2026-08-27): running
  `swarmforge/scripts/specifier_backlog_hygiene_gate.sh
  backlog/paused/BL-1193-...yaml` (the exact invocation the specifier's own
  role prompt and Article 4.5-style gates document, run from the repo root)
  reported `DUPLICATE-ID BL-1193 ... also: <the identical absolute path>` —
  the file flagged as a duplicate of itself. Re-running with the absolute
  path form of the same, single, uncommitted file made the false positive
  disappear, isolating bug #1 to path-string comparison, not corpus logic.
  Immediately after committing BL-1190's own amendment, re-gating BL-1190
  (an EXISTING, already-published ticket) with the correct absolute path
  still false-flagged: `DUPLICATE-ID BL-1190 ... also:
  backlog/paused/BL-1190-....yaml` (origin/main's own prior copy of the same
  file/ticket) — bug #2, a second self-identity gap in the same function.
  Needs the standard human sign-off gate before promotion.

description: |
  ## What

  `specifier_backlog_hygiene_gate.bb`'s duplicate-id check (BL-1105) has two
  independent self-identity gaps in `other-holders`, both causing a ticket to
  be reported as a duplicate of ITSELF:

  **Bug #1 — local relative-vs-absolute mismatch.** `backlog-root` always
  resolves to an ABSOLUTE path (`repo-root/backlog`, via
  `fs/canonicalize *file*`), so every local-corpus entry
  (`list-backlog-ticket-files`) is absolute. `other-holders` excludes the
  subject's own entry by a bare string equality:
  `(remove #(= (:path %) (str subject-path)) local)`. When the CLI is
  invoked with a path RELATIVE to the working directory — the natural,
  documented form (`backlog/paused/<file>.yaml`, run from the repo root) —
  `subject-path` stays relative while every corpus entry is absolute; the
  strings never match, self is never excluded.

  **Bug #2 — stale/self published entry never recognized as "already this
  ticket".** Even with an absolute subject path (bug #1 worked around),
  `other-holders`' "same checkout" dedup computes `local-names` from `local`
  AFTER removing the subject — so for the ordinary case of one local holder
  of an id, `local-names` is empty, and a published-corpus entry
  (`origin/main`, always git-relative paths) for that SAME id is never
  filtered out even when it is literally origin/main's own prior copy of the
  ticket being re-gated. Reproduced live: re-gating BL-1190 immediately after
  committing an amendment to it (origin/main not yet pushed to) false-flagged
  BL-1190's own already-published copy as an "other holder".

  Both gaps share one root shape: the check counts a reference as "another
  holder of this id" without ever confirming it isn't simply a different
  spelling/source of the SUBJECT ITSELF. This is exactly the kind of
  self-inflicted false positive Article 3.6's sibling gates exist to prevent
  triggering on real work — a specifier doing ordinary, correct work (minting
  a routine ticket the documented way, or amending an existing one) gets an
  incorrect hard FAIL.

  ## How (direction, not mandate)

  Normalize both sides to a common, comparable form before any equality/
  membership check in `other-holders` — e.g. canonicalize every subject path
  and every corpus path (local AND published) the same way, and derive the
  published-side exclusion from whether an entry represents the SUBJECT's own
  id+file, not from what happens to remain in `local` after subject removal.
  `subject-from-path`, `list-backlog-ticket-files`, and
  `read-published-id-index-from-git` are the producers to reconcile.

  ## Constraints

  - Must not weaken the genuine cross-file duplicate-id detection (BL-1105):
    two DIFFERENT files/tickets sharing an id must still fail, from any path
    form, local or published.
  - Must not require callers to change how they invoke the gate — the fix is
    internal to the comparison, not a new required flag.

qa_e2e_procedure: >
  (1) From the repo root, create a fresh single-id paused ticket and run
  `swarmforge/scripts/specifier_backlog_hygiene_gate.sh
  backlog/paused/<that-file>.yaml` (relative path, matching normal usage).
  Confirm no DUPLICATE-ID is reported for that id. (2) Amend an EXISTING,
  already-committed-and-pushed ticket's YAML and re-run the gate on it
  (absolute or relative path). Confirm no DUPLICATE-ID is reported against
  its own origin/main copy. (3) Add a second, genuinely different file under
  another pool with the same id and confirm the gate still fails and names
  both files.

out_of_scope: |
  - The unrelated BL-1193 false-positive-token defect that was being
    adjudicated when this was found — separate ticket, separate root cause.

invariants:
  - "The duplicate-id check's verdict for a single ticket file is identical whether the gate is invoked with a path relative to the working directory or an absolute path."
  - "A ticket already published under its own id at the invoked path is never counted as an 'other holder' of that id — only a genuinely different file is."

