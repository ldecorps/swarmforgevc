notes: |
  - [2026-08-27] specifier: worked around both bugs for this turn's own
    mints by invoking the gate with an absolute path and by eyeballing the
    remaining published-side self-match instead of trusting the gate's
    verdict; neither is a fix. Scope widened same-day from "relative path"
    to both self-identity gaps in `other-holders` — same function, same
    fix pass, no waste in one coder parcel covering both.
