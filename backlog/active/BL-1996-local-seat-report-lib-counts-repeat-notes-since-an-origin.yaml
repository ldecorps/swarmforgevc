description: |
  ## What is wanted

  Three functions in `swarmforge/scripts/local_seat_report_lib.bb`, which
  BL-1997 will call from check 5b:

  1. `repeat-notes-since [chat-jsonl origin-ms]`: the number of records in
     a qwen session's jsonl text that are tool results (`"type":
     "tool_result"`), stamped (`timestamp`) at or after `origin-ms`, and
     whose output has a LINE that starts `REPEAT: you have now made this
     exact <tool> call <N> times` (regex
     `(?m)^REPEAT: you have now made this exact [a-z_]+ call [0-9]+ times`).
     0 for nil or blank text; a line that does not parse is skipped.
     Scenarios 01 and 02.
  2. `qwen-projects-dir []`: the env var `SWARMFORGE_QWEN_PROJECTS_DIR`
     when set, else `~/.qwen/projects`.
  3. `current-session-repeat-notes [projects-dir worktree origin-ms]`: the
     newest `*.jsonl` by modification time in
     `<projects-dir>/<(qwen-cwd-key worktree)>/chats/`, counted with (1).
     0 when that directory does not exist. Scenario 03.

  ## Where to read (only these lines)

  - `swarmforge/scripts/local_seat_report_lib.bb`: `qwen-cwd-key` (~296)
    is the directory key; put the three functions right after it. The
    lib's `:require` block at the top already has `babashka.fs`,
    `cheshire.core` and `clojure.string`; check with `grep -n require`.
  - Where a note sits in a real record (measured on session de07ec69): in
    `message.parts[0].functionResponse.response.output`, after a blank
    line at the end of the tool's output. The same output can contain the
    phrase elsewhere when the seat read a file that quotes it, which is
    why the match is a line START with the call count.
  - `specs/pipeline/steps/bl970BusyGateSteps.js` (77 lines) is the handler
    shape to copy: `load-file` the lib with `bb -e`, call one function,
    assert on what it prints. Write each scenario's session text into a
    temp directory in the handler. Do not keep fixture files in the repo.
  - The steps put their numbers in the step text: parse them in the
    handler (`the count is (\d+)`), never hardcode them.

  ## How (direction, not mandate)

  - Read the records with `cheshire.core/parse-string` one line at a time,
    the way `parse-session-events` (~91) does, and parse the timestamp with
    `java.time.Instant/parse`.

  ## What each stage checks

  - Coder: scenarios 01-03 ok; the replay in qa_e2e_procedure step 2 gives
    46 and 13.

notes: |
  Split from BL-1987 on 2026-10-05 after coder (iq3) held it 37m (claim
  13:00:16Z) with no commit: a cycle of four empty greps 13:06-13:08Z,
  then toggling one closing paren in babysitter_check.bb 13:12-13:22Z and,
  after a respawn, again from 13:35Z (36 edits). Minted 2026-10-05 by the
  specifier. BL-1997 depends on this slice.
  Not salvage: the uncommitted BL-1987 diff in iq3's worktree. Its counter
  parses the whole file as one JSON value, reads `:message :content`, and
  matches the phrase at the start of the text, so it counts nothing real;
  its wiring calls `stuck-in-process-path`, which does not exist, and the
  file does not read.
  Dynamic routing: Babashka production code with no durable write, so
  [coder, qa].
  IR-DRY: the three "the count is N" steps are one step pattern with the
  number in the text (no step tables, BL-1851); the checker's
  near-duplicate findings on them are intended.

