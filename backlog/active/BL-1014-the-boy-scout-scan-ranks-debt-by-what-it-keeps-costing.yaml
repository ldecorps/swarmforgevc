invariants:
  - "Deterministic: the same repository state produces the same ranking. No clock, no randomness and no fresh judgement call enters the rank key, so a run is reproducible from git state plus the named runtime stores alone."
  - "Evidence-bearing: every ranked item names the concrete artifact its rank was derived from - a ledger row, a bounce record, a CRAP entry, a duplication report line, or a counted path - so a human can check any rank without re-running the scan."
  - "Read-only: the scan mutates no source, config or runtime state, and writes nothing but its own report output."

description: >
  WHAT. An on-demand CLI that reads the debt signals this repo already keeps,
  ranks them by RECURRENCE, and prints a ranked inventory with an evidence
  pointer per item. Read-only. This is slice 1 of the Boy Scout epic; slice 2
  (BL-1015) is what acts on the ranking.

  WHY RECURRENCE IS THE RANK KEY. Debt that costs once is just debt. Debt that
  costs again and again is what the operator experiences as annoying, and it
  is the only definition of "most annoying" that is measurable rather than
  re-argued every run. So an item attested by three independent sources
  outranks a nastier-looking one attested by one. This is what makes the scan
  deterministic and its output checkable; a scan that re-judged severity each
  run would be neither.

  THE FIVE SOURCES (all verified live at spec time - none is a store with no
  writer):
  1. Deferred hardening gates - backlog/hardening-debt-ledger.yaml, 5 rows
     today, read via swarmforge/scripts/hardening_debt_ledger_read.bb. A gate
     that did NOT run is debt by construction, and the ledger already shows
     recurrence (telegramFrontDeskBotCore.ts appears in two rows).
  2. Bounce recurrence - .swarmforge/bounces/<month>.jsonl and bounce_history
     on 80 done tickets. HONEST LIMIT: those records carry ticket,
     producingRole, ticketType, failureClass, commit and at, but NOT the files
     touched, so this slice ranks bounce recurrence by CLASS and ROLE only.
     Per-file attribution needs a join through each commit and is deferred on
     the epic - do not spec it into this slice.
  3. CRAP over threshold - `npm run crap` from extension/
     (extension/scripts/crapReport.js). Note the constitution names
     `scripts/quality/`; the live path is extension/scripts/.
  4. Duplication - `npm run dry` from extension/ (jscpd, pinned).
  5. Runtime/ops bloat - counted paths. The operator's own recent example: 694
     rotated handoffd.log.* archives and a 797-entry .swarmforge/daemon/ on
     2026-08-21, plus an untracked hot-sync orphan in all seven worktrees.

  HOW (direction, not mandate). TypeScript under extension/src/tools/, matching
  its closest sibling - BL-820's closing-ceremony CLI and record-bounce both
  live there. The CLI IS the on-demand trigger for this slice; a phone/console
  trigger is a later slice on the epic.

  SCOPE BOUNDARY. This slice RANKS and REPORTS. It never edits, never mints a
  ticket, and never cleans - scenario 05 pins that. Anything that changes the
  repository belongs to BL-1015.

  NOT A DUPLICATE of BL-428 (standing on-touch CRAP tracker: one metric, no
  trigger, no ranking - CRAP becomes one of five sources here and BL-428 stays
  its standing home) nor of BL-820 (closing-ceremony lean pass: forge PROCESS
  only, explicitly not the code under build, and fires at shift close).

qa_e2e_procedure: >
  1. Run the scan against this repository with no arguments and confirm it
     prints a ranked inventory and exits 0 without modifying anything - check
     `git status` is byte-identical before and after, and that no file under
     .swarmforge/ changed mtime except the report output.
  2. Confirm the top items are plausible against known state: the deferred-gate
     ledger's repeated file, a CRAP >6 function, and the rotated-log bloat
     should all appear, each with a readable evidence pointer.
  3. Open one evidence pointer by hand and confirm it resolves without
     re-running the scan.
  4. Run the scan twice in succession with no intervening commit and confirm
     the two rankings are identical.
  5. Point the scan at a fixture repository with every source empty and confirm
     it names all five sources and reports each clean, rather than printing an
     empty list.

