required_wiring:
  - "extension/src/tools/boyScoutScan/readers.ts::hardening_debt_ledger_read::the scan must reach the deferred-gate ledger through its EXISTING read CLI, never by re-parsing the YAML - that ledger's own header states it is read back with hardening_debt_ledger_read.bb and not by parsing files directly. Path amended 2026-08-22: the cleaner legitimately split boyScoutScan.ts along its policy/IO seam (8274108c3d, BL-485 mutation-site size), and readers.ts is now the module that shells the CLI - the requirement is unchanged, only its address"
