notes: |
  2026-08-21 specifier: slice 1 of epic boy-scout (BL-1013), filed with slice 2
  (BL-1015) in the same pass. BL-1015 declares `depends_on: [BL-1014]`, which
  the BL-957 promotion gate enforces, so ordering is machine-held and not a
  matter of the coordinator remembering. This mirrors the BL-676/BL-677 pair
  (read-only proposal report, then apply) already sitting paused in this
  backlog - checked at spec time to confirm the house pattern.

  The "annoying = recurrence" framing is the whole reason this slice is
  gateable. It was chosen over ranking by severity precisely because severity
  is a judgement that would differ run to run, which invariant 1 forbids.

  ## Spec amendment 2026-08-22 - required_wiring entry 1 re-pointed after the split

  BOOKKEEPING ONLY. Nothing anyone builds changes; the requirement is
  unchanged and was already satisfied. Only the ticket's pinned path moved.

  The cleaner legitimately split `extension/src/tools/boyScoutScan.ts` along
  its policy/IO seam into `boyScoutScan/` (7 modules, commit 8274108c3d, per
  BL-485 mutation-site size). `required_wiring` entry 1 still cited the
  pre-split single-file path, which `pre_qa_gate_lib.bb` resolves literally
  against the cited commit - so the documenter's handoff to QA would have
  hard-failed with a wiring-not-found refusal on work that is correct. The
  architect found it during its pass and routed it as a spec-gap note rather
  than a bounce, which is the right call: editing `required_wiring` is
  specifier territory.

  The entry now cites `extension/src/tools/boyScoutScan/readers.ts` - the
  module that actually shells the CLI (readers.ts:23), and per the
  architect's pass the module's only IO. Verified through the gate's own
  `parse-wiring-entry`: the path resolves, the pattern extracts as the bare
  literal `hardening_debt_ledger_read`, and `str/includes?` matches the real
  file.

  **Whoever sends this parcel to QA must merge `main` first.** The gate reads
  `required_wiring:` from the SENDER's checkout, so this fix landing on
  `main` does not by itself clear it (BL-874 learned that the expensive way).

  ## A structural tension worth knowing about, not fixed here

  `required_wiring` pins a FILE path, and splitting files is exactly what the
  cleaner exists to do. The gate has no glob or directory support - it looks
  the literal path up in a map of file contents - so any legitimate refactor
  of a cited file breaks a wiring entry that was correct when written. The
  existing spec-gap route handled it correctly and cheaply here (one note,
  one amendment, no bounce, no rebuild), which is why this is recorded rather
  than ticketed.

