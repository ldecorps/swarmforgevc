id: BL-1610
title: "BL-1576's merge-drop send gate scans the sender's entire off-main history whenever the received parcel is the coordinator's route git_handoff, whose commit is main's tip at promotion: the coder's BL-1606 send was refused on 2026-09-16 over six cross-role merges from hours earlier whose one-sided resolutions later merges had already superseded, on three paths the forward leaves byte-identical to the received commit; the scan is bounded to merges the sender made since it received the parcel, and a finding on a path the forward leaves identical to the received commit is excused"
