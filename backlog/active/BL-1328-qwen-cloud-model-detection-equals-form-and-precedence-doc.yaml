  BL-1324 `ruling` (human ldecorps, 2026-09-02, option 2 of that ticket's
  `ruling_options`): "Certify as landed; also mint a narrow follow-up to
  match the --model=<value> single-token form and/or document the
  OpenRouter-precedence caveat... The follow-up ticket itself is routed to
