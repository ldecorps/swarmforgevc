notes: |
  2026-09-03 spec gap, raised by the coder as a priority-00 `note`
  ("spec-gap BL-1328: BL-1324 byte-pin blocks its own authorized follow-up") and
  adjudicated the same pass. The coder was correct and was right not to guess:
  BL-1324's invariant-1 byte-pin covers the exact function this ticket is
  chartered to change, so there was no correct implementation available under the
  spec as written.

  **This is a specifier defect at mint, not a coder or reviewer miss.** BL-1006
  puts the obligation on whoever mints the successor: grep the sibling feature
  files for boundary assertions the new slice falsifies and scope their
  retirement into it. That was not done here, and the ticket shipped with a
  contradiction inside it. Verified this pass rather than assumed - the pinned
  `matcher` region is `extra_cli_targets_qwen_cloud()` verbatim, and BL-1324's
  Examples table really does assert the `=` form returns false.

  Two blockers, not one, and only the first was named in the coder's note: the
  property-test byte-pin AND the feature Examples row. A third, the decoy
  generator, is data rather than an assertion and would likely have been found
  only by a red run. All three are now scoped above.

  `retires:` was also absent, which is an independent blocker: without it the
  pre-handoff task-scope gate refuses the send the moment the parcel touches a
  BL-1324-owned path. Per BL-1276 that declaration is read from the ticket as
  LANDED, so it takes effect for the gate as soon as this amendment is on main -
  the holder does not need to merge for the exemption, only to read the scope.

  Investigated both call sites directly against `swarmforge/scripts/swarmforge.sh`
  at mint time (grep for `extra_cli_targets_qwen_cloud` and
  `role_uses_openrouter`) rather than relying on BL-1324's prose summary
  alone — confirmed the billing_guard site's precedence is the OPPOSITE of
  the pane-env site's, which BL-1324's own approval_context did not state
  explicitly (it only described the pane-env site as "reached only when...
  NOT already routed through role_uses_openrouter"). Recorded the sharper
  finding here since it changes what "document the caveat" needs to say —
  not just "this site is skipped" but "the two sites would disagree if this
  combination ever occurred."

  IR-DRY adjudication at mint (do not re-litigate): one medium-confidence
  possible-synonym finding remains after converting the three detection
  scenarios into a Scenario Outline — it pairs the Given step "billing_guard
  construction site prefers qwen-cloud over OpenRouter" against "launch_role
  pane-env construction site prefers OpenRouter over qwen-cloud" within the
  same scenario. Kept: these are the scenario's whole point — two
  complementary, genuinely opposite facts about two different call sites,
  not accidental restatement of one fact.

