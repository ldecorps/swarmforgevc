invariants:
  - "extra_cli_targets_qwen_cloud detects a qwen* model whether the CLI's --model value arrives as a separate token pair (--model qwen3.8-max) or a single --model=qwen3.8-max token — both forms are treated identically everywhere the function is called."
  - "The fix never changes matching for a non-qwen --model value, in either token form — a sibling Anthropic seat's own --model stays undetected exactly as before."
  - "The precedence asymmetry between the billing_guard call site (qwen-cloud-first) and the launch_role pane-env call site (OpenRouter-first) is documented at both sites, not silently reconciled — this ticket changes no precedence, only detection and documentation."

description: |
  ## What

  BL-1324 certified hotfix `4ed88430b2` as landed and its own
  `approval_context` named two confirmed-dormant gaps in
  `swarmforge/scripts/swarmforge.sh`. This ticket closes one and documents
  the other, per the human's ruling on BL-1324 (see `approval_context`).

  **Gap 1 — detection form.** `extra_cli_targets_qwen_cloud` (line ~1479)
  splits `extra_cli` on whitespace and only matches when `--model` and a
  `qwen*` value are two SEPARATE tokens:
  ```
  if [[ "${parts[i]}" == "--model" && "${parts[i+1]:-}" == qwen* ]]; then
  ```
  A `--model=qwen3.8-max` single-token form never matches — `parts[i]` would
  be the whole `--model=qwen3.8-max` string, which fails the exact
  `"--model"` equality check. Every current pack window line
  (`swarmforge/packs/bob-multi-provider-mono-router.conf`) uses the space
  form, so this is dormant today: a future pack author using the equals
  form would silently get NO Token Plan remap and NO
  `CLAUDE_CODE_MAX_CONTEXT_TOKENS` declaration, reproducing the exact
  auto-compaction bug BL-1324's hotfix fixed for the space form.

  **Gap 2 — precedence asymmetry.** The fix has two call sites and they
  disagree on precedence between OpenRouter routing and qwen-cloud
  targeting:
  - The billing_guard construction site (~line 1957) checks qwen-cloud
    FIRST: `if [[ ... ]] || extra_cli_targets_qwen_cloud "$extra_cli"; then
    ... elif role_uses_openrouter "$role"; then`.
  - `launch_role`'s pane-env construction site (~line 2206) checks
    OpenRouter FIRST: `elif role_uses_openrouter "$role"; then ... elif
    [[ "$agent" == "claude" ]] && extra_cli_targets_qwen_cloud ...; then`.

  So a role combining OpenRouter routing with a qwen* `--model` would take
  the qwen-cloud branch at the billing_guard site (remapping
  `ANTHROPIC_BASE_URL` to the Token Plan endpoint) but the OpenRouter
  branch at the pane-env site (forwarding `OPENROUTER_API_KEY`, never
  `QWEN_API_KEY`, and never declaring `CLAUDE_CODE_MAX_CONTEXT_TOKENS`) —
  a credential/endpoint mismatch, not merely a missing context
  declaration. No current pack combines the two, so this is dormant, not
  live; BL-1324's own review named only the pane-env half of this, this
  ticket's investigation found the billing_guard site takes the opposite
  order.

  ## How (direction, not mandate)

  Gap 1: extend `extra_cli_targets_qwen_cloud`'s matching to also
  recognize a single `--model=<value>` token (e.g. split on `=` when the
  token starts with `--model=`), without changing its behavior for the
  existing space-separated form or for any non-qwen model.

  Gap 2: add an explicit comment at BOTH call sites naming the other
  site's precedence, stating plainly that combining OpenRouter routing
  with a qwen* `--model` is unsupported/dormant today and would produce a
  credential mismatch if it ever occurred — so a future pack author (or
  reviewer) sees the trap before shipping that combination, rather than
  discovering it live.

  ## Not this slice

  - Reconciling the two call sites' precedence so they agree — the human's
    ruling asked to DOCUMENT the asymmetry, not resolve it; no live pack
    needs the combination today, and choosing which precedence should win
    is a design decision for whoever eventually wants that combination.
  - Any other change to `extra_cli_targets_qwen_cloud`, `role_uses_openrouter`,
    or the billing_guard/pane-env branches beyond the two items above.
  - Re-litigating BL-1324's own certification/ledger decision.

  ## Sibling assertions this ticket must retire (added 2026-09-03, spec gap)

  This section was missing at mint and the coder was right to stop rather than
  guess. BL-1324's parcel froze the CURRENT behaviour into executable assertions,
  so a correct fix here reds them. Retiring them is part of THIS parcel — not a
  follow-up ticket, and not something to leave for a reviewer to discover.

  **Three concrete sites, all in BL-1324's parcel:**

  1. `specs/features/BL-1324-claude-seat-qwen-cloud-context-window.feature`,
     scenario `BL-1324 extra-cli-detects-qwen-model-flag-01`, the Examples row

         | --model=qwen3.8-max --effort high        | false  |

     **Retire the row — do not flip `false` to `true`.** BL-1006 is explicit
     that a superseded boundary assertion is retired rather than reworded,
     because the successor's own scenarios are the coverage. They are: this
     ticket's own Outline already asserts `--model=qwen3.8-max -> reports` and
     `--model=claude-sonnet-5 -> does not report`, so nothing is lost. Flipping
     it instead would leave BL-1324's contract asserting behaviour BL-1324 never
     shipped.

     **The ROW, not the Scenario Outline.** Retire one Examples row. The Outline
     `extra_cli_targets_qwen_cloud detects a qwen* --model token` stays, and so do
     its other three rows, every one of which is still true after this fix:

         | --model qwen3.8-max --effort high        | true   |
         | --model claude-sonnet-5 --effort high    | false  |
         | --effort high                            | false  |

     Deleting the whole Outline would drop live coverage this ticket does not
     replace: its own Outline uses the `=` spelling for the negative case
     (`--model=claude-sonnet-5`), so BL-1324's SPACE-form negative and its
     no-model-at-all case exist nowhere else. That would be exactly the
     assert-less "fix" the non-weakening constraint below forbids.

  2. `extension/test/bl1324ClaudeSeatQwenCloudContextWindowInvariants.property.test.js`,
     invariant 1's `content` and `worktree` faces. They assert `hotfixRegions()`
     of `swarmforge/scripts/swarmforge.sh` is **byte-identical to 4ed88430b2** at
     HEAD, in the working tree, and at every revision touching the path since.
     One of those regions is `matcher` — the whole `extra_cli_targets_qwen_cloud()`
     body, which is exactly what this ticket changes. This is the blocking one,
     and it cannot be fixed forward: the walk covers every future revision too.

     The invariant BL-1324 actually declared is *"this stamp-off never
     reimplements, rewrites or reverts the hotfix"* — a statement about the
     STAMP-OFF PARCEL, not a freeze on the file for all time. The `attribution`
     face already says exactly that, and the same file already reached this
     conclusion once, for the pack conf, in its own comment: *"content equality
     is the wrong test for it; who changed it is the right one."* Apply that
     reasoning to `swarmforge.sh`. Do NOT re-baseline the pin onto the new bytes
     — that is rewording, and it rebuilds the identical wall in front of the next
     follow-up.

  3. The same file's `decoy` generator, which lists
     `` `--model=${qwen}` // the single-token form the matcher does not read ``
     among inputs a qwen seat must NOT be detected by. After this fix it IS
     detected, so that decoy is false and the generator must stop producing it.
     Easy to miss because it is generator data rather than an assertion.

  **Non-weakening is the constraint on all three.** Retire what this fix
  falsifies and nothing else. BL-1324's invariants 2 and 3, the `attribution`
  face, and every scenario about billing-guard remapping and context-window
  export are untouched by this ticket and must still fail if violated. A change
  that makes BL-1324's suite green by asserting less is the failure mode here,
  and the architect should review the retirement against that specifically.

  **One consequence worth knowing before the hardener's pass:** BL-1324's feature
  file carries an `acceptance-mutation-manifest` header whose `scenario_hash`
  covers that Outline. Retiring a row invalidates it. Per the engineering rules
  the manifest is never hand-edited — the Gherkin mutation run is redone for that
  file so the stamp is regenerated.

