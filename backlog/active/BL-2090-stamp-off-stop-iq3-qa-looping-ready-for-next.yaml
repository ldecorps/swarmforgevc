human_approval: approved
approval_context: >
  Review-only stamp-off of an operator hotfix already on main. No choice
  is posed: the coder reviews aa7d603d66 and never re-applies it.

description: |
  ## Status

  Hotfix aa7d603d66 (operator, 2026-10-09 06:39Z) landed the fix. This
  ticket is the review of it (the BL-1858 and BL-1868 shape): the coder
  reviews it and never re-applies it.

  ## What the hotfix did

  - local_model_repeat_guard.bb: `ready_for_next.sh` is no longer one of
    the state-changing commands that start a fresh repeat window. When a
    seat already holds in_process work the script only reprints STOP and
    the TASK, so counting it as a reset let the iq3 QA seat re-run it
    forever without a REPEAT note. A third run with no edit between is now
    warned about.
  - The same guard adds a hint when ready_for_next.sh reprints the STOP
    banner, naming the next tool: Read the in_process parcel.
  - swarmforge/roles/local-model/QA.note says the same.
  - swarmforge/packs/ollama-ista-local-model-qwen-coord-mono-router.conf,
    the IQ3 pipeline seats' pack, was restored so the swarm could launch.
  - test_bl1971_local_model_repeat_guard.sh gained the two cases above.

  ## What is wanted

  The coder's review records whether each change is right and complete,
  and names any defect as its own ticket rather than fixing it here. The
  documenter keeps the local-model seat how-to in step with the guard.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2064-a-local-seat-that-reads-without-writing-is-told-then-restarted.feature`:
     9 of 9 ok (measured on main 2026-10-09).
  2. `bash swarmforge/scripts/test/test_bl1971_local_model_repeat_guard.sh`:
     exit 0, 22 PASS lines, among them "a third ready_for_next.sh since the
     last edit is warned about" and "ready_for_next that reprints the STOP
     banner is told to Read in_process next".
  3. Read the coder's review evidence (7df48e6b67) and the documenter's
     how-to change (b5a3899ef9): each hotfix change above is accounted for.

