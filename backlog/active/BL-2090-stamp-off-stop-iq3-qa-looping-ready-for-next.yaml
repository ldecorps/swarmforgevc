# high: stamp-off of a production hotfix for a live fault - the iq3 QA seat
# re-ran ready_for_next.sh in a loop after it reprinted the in-process STOP
# banner. Hotfix aa7d603d66 (operator, 2026-10-09) did not touch
# ready_for_next.sh: it took ready_for_next.sh out of
# local_model_repeat_guard.bb's state-changing commands (so the loop now
# draws a REPEAT note), added a STOP-reprint hint naming the next tool,
# said the same in swarmforge/roles/local-model/QA.note, restored the
# qwen-coord mono-router pack conf, and added two cases to
# test_bl1971_local_model_repeat_guard.sh.
