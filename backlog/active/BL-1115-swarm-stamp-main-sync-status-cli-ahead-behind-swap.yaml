description: >
  WHAT. Operator/Cursor hotfix a3bf11b533 is live on local main with trailer
  Hotfix-Certification: pending. Subject: Fix main_sync_status_cli
  ahead/behind swap (match handoffd rev-list).

  Landed behaviour under review (do not redesign):
  main_sync_status_cli.bb counts with `git rev-list --left-right --count
  origin/main...main` and binds `[behind ahead]` — the same range+binding
  as handoffd.bb. After local main has absorbed origin/main (behind=0),
  the CLI reports behind:0 and action proceed (or clears a tripped
  deadlock when behind=0), never inverted ahead:0 behind:N / ff-only.

  WHY. Unticketed hotfixes never become official swarm deals on green
  tests alone (BL-848). Follow-on to BL-1113's main-sync surface: that
  stamp covered the deadlock breaker; this stamp covers the CLI binding
  bug that kept step-0 gated after a successful BL-891 merge.

  HOW (direction, not mandate). Walk the acceptance feature against the
  landed CLI; open a narrow follow-up only if review finds a defect.

qa_e2e_procedure: >
  (1) With a fixture ahead/behind matrix matching git rev-list
  origin/main...main, run main_sync_status_cli and assert behind/ahead
  labels and action. (2) When behind=0 after absorb, assert action
  proceed and deadlock clear path. (3) Confirm the CLI source uses
  origin/main...main (not main...origin/main) with [behind ahead].
  (4) Record degraded Babashka gate (no mutation/CRAP/DRY). Leave
  Hotfix-Certification pending until human ledger decision.

