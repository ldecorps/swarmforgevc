description: |
  ## What is wanted

  The human reads the Art Director's LinkedIn episode drafts on the
  phone, in the Telegram Mini App. A Cursor agent built that page on
  2026-10-09 in the master checkout and never committed it, so it is in
  no build. This ticket lands it through the pipeline unchanged in
  behaviour: an "Article drafts" button on the console menu, a page
  listing every `.swarmforge/operator/DRAFT-linkedin-*.md`, newest first,
  and a page per draft that renders the post below the first `---` line
  (the meta block above it is never shown), with the existing Listen
  (speech) control. The Art Director owns the drafts and reviews this
  page as one of its artifacts (art-director.prompt).

  ## Where the code is

  `backlog/evidence/BL-2101-article-drafts-mini-app-snapshot-20261009.patch`,
  committed by the specifier, applies cleanly to main at mint (`git apply`
  from your worktree root). It holds all eight paths:
  articleDraftsCore.ts, articleDraftsHtml.ts and their two unit tests
  (new), and the edits to bridgeServer.ts, consoleMenuUiHtml.ts,
  letsTalkRoutes.ts and bl1634RejectedManifestBuiltInsInvariant.property.test.js.
  Take the code from the patch, never from the master checkout's working
  copy.

  Two changes to the snapshot are part of this ticket:
  - The snapshot drops two unit tests from articleDraftsCore.test.js,
    "buildArticleDraftsIndexState lists live repo drafts" and
    "buildArticleDraftPageState serves a real Ep7 draft body". Both read
    the real, gitignored drafts, so they fail in any checkout that lacks
    them (every seat worktree) and quote unpublished draft text. Cover
    `buildArticleDraftsIndexState` and `buildArticleDraftPageState` with
    temp-directory fixtures instead (scenarios 01 to 03 do the same).
  - The remaining fixtures quote Ep7's working title and one of its
    subheadings. Replace them with neutral strings.

  ## How (direction, not mandate)

  - The step handler drives `buildArticleDraftsIndexState` and
    `buildArticleDraftPageState` over a mkdtemp project with an operator
    directory (file mtimes set to order the drafts), and starts the bridge
    in process for scenario 04 the way articleDraftsBridge.test.js does.

constraints: >
  Temp project roots only; never the live .swarmforge/operator/ or the
  live bridge token. The step handler lands with the feature (BL-233).

out_of_scope: |
  - Posting to LinkedIn or reading readers' feedback: the human ruled it
    manual on 2026-10-09 (art-director.prompt).
  - Any change to how drafts look on the page: Art Director briefs, new
    tickets.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2101-the-article-drafts-page-shows-the-art-directors-episode-drafts.feature`:
     6 of 6 ok (01, 02, 03 x3, 04).
  2. Read from the gather's rows: articleDraftsCore.test.js and
     articleDraftsBridge.test.js green in the unit row,
     bl1634RejectedManifestBuiltInsInvariant green in the property row.
  3. `grep -rn "operator/DRAFT-linkedin-ep" extension/test`: no match (no
     test reads a live draft).
  4. Art-direction sign-off (epic art-direction): send the Art Director
     the note with where the page renders; its LGTM or defect list is
     evidence.

