source: |
  Human Cursor session 2026-08-25. Follow-on to done BL-839 (detector).
  Observed: handoffd's master-checkout-drift sweep WARNs :staged-for-reversion
  on handoffd.bb / push_sweep_lib.bb while agents are landing commits on main;
  seconds later `master_checkout_drift_cli` reports no-drift and nothing is
  staged. False positives flood the Operator topic and train humans to ignore
  the alarm that exists to catch silent production reversions.

description: |
  ## What is wrong

  BL-839 correctly alarms when the master checkout's index or worktree
  disagrees with `main` for daemon-executed scripts. On a busy main branch,
  every agent `git add` + `git commit` creates a brief window where
  `git show :path` ≠ `git show main:path`. The sweep treats that as
  `:staged-for-reversion` ("one git commit away from landing the reversion")
  even when the staged bytes are the *forward* fix about to land — the
  opposite of the 2026-08-06 incident.

  ## What to do

  When a commit (or index write) is observably in flight on the master
  checkout, the drift check must not emit the MASTER CHECKOUT DRIFT WARN
  for `:staged-for-reversion` that is explained by that in-flight write.
  After the in-flight signal clears, the next sweep behaves exactly as
  BL-839 today.

  ## Out of scope

  - Auto-restoring / unstaging the master checkout (BL-839 deliberately
    deferred that; still deferred).
  - Moving daemons onto a committed ref.
  - Muting `:uncommitted-edit` or `:unknown` (different shapes).

notes: |
  2026-08-25 human: mint this; severity medium (noisy false alarm, not
  swarm-down). Prefer a tight in-flight detector (e.g. `.git/index.lock`
  and/or an observable `git commit`/`git add` against this repo) over
  heuristics that guess "forward vs reversion" from blob ancestry.

qa_e2e_procedure: >
  (1) Fixture: main tip and index agree → check reports no-drift, no alarm.
  (2) Fixture: durable staged reversion of a daemon script, no index.lock,
  no in-flight git → still :staged-for-reversion + alarm (BL-839 preserved).
  (3) Fixture: same staged-vs-main disagreement WHILE an in-flight commit
  signal is present → no MASTER CHECKOUT DRIFT WARN this sweep.
  (4) Clear the in-flight signal without resolving the staged reversion →
  next sweep alarms again.

