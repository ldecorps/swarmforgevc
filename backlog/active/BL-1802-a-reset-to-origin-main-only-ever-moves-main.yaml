id: BL-1802
title: "The reset to origin/main moves whatever branch its checkout is on: refuse-reset-if-local-ahead! authorises it from main's ahead count, so in a linked worktree on another branch it resets that branch and discards its unlanded commits (swarmforge-QA lost d861769a5b at 12:05:28Z on 2026-09-29, inside QA's pre-commit property run); the gate now also refuses unless the checkout is on main, refuses a caller that gives it no branch reading, and the property fixture that reached the live QA worktree is found and fixed"
milestone: M8
type: defect
severity: high
# high: silent loss of an integration branch's unlanded work (QA's merges and
# bounce records), recoverable only from the reflog. The BL-1124 guard caught
# it this time; any role running the property lane in its own worktree is
# exposed the same way.
status: todo
