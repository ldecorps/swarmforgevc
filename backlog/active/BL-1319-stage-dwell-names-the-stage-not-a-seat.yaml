qa_e2e_procedure: >
  CORRECTED 2026-09-02 — the original procedure asked for a fixture that cannot
  exist (see the amendment note). Build a fixture roles table with two coder
  seats (`coder` and `coder@sonnet2`, each with its own worktree path) plus one
  bare seat for every other stage. Plant completed handoff audit headers so
  that: the BARE `coder` seat's median processing is FASTER than the slowest
  single-seat stage; the `coder@sonnet2` seat's parcels are slow enough that
  the median over BOTH seats' parcels together is slower than every single-seat
  stage. (Both conditions are satisfiable together — e.g. bare seat 1s,1s;
  second seat 10s,10s; slowest single-seat stage 5s — whereas requiring each
  seat alone to be faster than that stage is not, since a median over the union
  of two sets each with median <= X is itself <= X.) At the parent commit run
  `node extension/out/tools/stage-dwell-report.js` against that fixture and
  confirm the defect is visible first: exactly ONE `coder` row, carrying the
  bare seat's parcels only and none of `coder@sonnet2`'s, and a bottleneck
  naming some stage other than `coder`. Repeat at the parcel commit and confirm
  one `coder` row carrying both seats' parcels and a bottleneck of `coder`.
  Then re-run against a single-seat fixture and diff the output against the
  parent commit's for the same parcels — it must be identical. Finally hit the
  bridge `/stage-dwell` endpoint on the fixture and confirm the served payload
  carries no `@`.

notes: |
  ## No `required_wiring:`, deliberately

  The fold lands inside `extension/src/metrics/stageDwell.ts`, and both live
  consumers — `bridge/bridgeState.ts` and `tools/stage-dwell-report.ts` —
  already call into that module today. There is therefore no call site that
  could be missing, which is the only thing `required_wiring` proves. Any
  anchor available here would name a symbol this parcel itself adds, inside the
  module that declares it, and would go green on its own diff (BL-1235). Stating
  that rather than banking a meaningless green.

  ## Findings recorded at mint

  - Grepped `extension/src` for seat folding: only `swarm/respawnPickup.ts:21`
    and `swarm/messageBus.ts:100` split on `@`. Nothing under
    `extension/src/metrics/` does.
  - `nameBottleneck` (`stageDwell.ts:217`) ranks `withProcessing` rows by
    median processing and returns `role: top.role` — the ranking-not-just-
    labelling consequence above follows from that, and is the reason this is
    not a cosmetic ticket.
  - IR-DRY on the feature file: 0 findings.

  ## Epic bookkeeping

  BL-981's `decomposes_into` and `remaining_slices` are updated in the same
  commit as this mint. The supervisor/chase/ensure framing in that slice's
  prose is corrected, not silently dropped.

  ## AMENDED 2026-09-02 — specifier, answering the coder's spec-gap note

  The coder raised a priority-00 `note` ("seats are DROPPED not split; sc-03
  clause unsatisfiable") before writing code. Both findings are correct; both
  were mint-time specifier defects, not coder error. Verified independently
  against the live source rather than accepted on report:

  1. DROPPED, not split. `stageDwell.ts:276` filters roles with
     `PIPELINE_ORDER.includes(r.role)`, and `swarmMetrics.ts:60` defines
     PIPELINE_ORDER as bare stage names only. `coder@sonnet2` fails the
     membership test and is dropped before `readRoleStageDwellRecords` runs on
     it, so its mailbox is never opened. Title, description consequences,
     "How", the feature narrative and the QA procedure all amended. The mint
     claim that a seat is named as the bottleneck is withdrawn as false; the
     wrong-answer consequence survives, by omission instead of division.

  2. sc-03 was unsatisfiable, and provably so. `nameBottleneck`
     (`stageDwell.ts:217`) ranks on `s.processing.medianMs`. The scenario asked
     for a fixture where the coder seats TOGETHER are slower than every
     single-seat stage while NEITHER seat alone is slower than the slowest one.
     If median(A) <= X and median(B) <= X then at least half of A and half of B
     lie at or below X, so median(A union B) <= X. The two clauses cannot both
     hold. Scenario 03 is replaced with the satisfiable form the real defect
     produces — bare seat fast, dropped seat slow, only reading both moves the
     stage to the top — and the QA procedure carries a worked fixture
     (1s,1s / 10s,10s / 5s).

  Invariant 3 was amended too, though the coder did not raise it: its clause
  "folding happens where the report is assembled, not where records are read"
  encoded the same wrong model and would have forbidden the only fix that
  works. The property it was protecting — per-record seat attribution survives
  — is kept; the mechanism clause is dropped. Invariants 1 and 2 stand
  unchanged.

  Scenario 02 is deliberately KEPT despite passing before the fix. It is a
  regression guard on the fix, not a demonstration of the defect, and the
  feature file says so in a comment above it so nobody later reads it as a
  vacuous gate.

  No `record-bounce.js` entry: this arrived as a spec-gap `note`, the correct
  route per Article 4.4, and never became a parcel bounce, so there is no
  bounce commit to cite. Evidence:
  `backlog/evidence/BL-1319-specifier-spec-amendment-20260902.md`.

  Gates re-run after the amendment: `gherkin_lint_gate.sh` clean, IR-DRY 0
  findings over 20 step occurrences / 15 unique steps.
