invariants:
  - "No stage name, bottleneck name or trend key emitted by the dwell instrument ever contains a seat id — the fold holds for every stage, not only the one with two seats."
  - "The fold is lossless for a single-seat swarm: with only bare seats the report is byte-identical to the pre-fold output for the same parcels."
  - "Per-seat attribution is preserved in the underlying dwell records, never discarded — folding happens where the report is assembled, not where records are read."

description: |
  ## What happens

  `extension/src/metrics/stageDwell.ts` is the coordinator's optimizer
  instrument (its own header says so, BL-102). `readRoleStageDwellRecords` and
  `computeStageDwellReportForRoles` take a role entry straight from the roles
  table and carry `entry.role` through as the report row's key. For a non-bare
  seat that string IS the seat id — `coder@sonnet2`. Nothing in
  `extension/src/metrics/` folds an `@`: the only two `split('@')` sites in
  `extension/src` are `swarm/respawnPickup.ts` and `swarm/messageBus.ts`.

  Two consequences, and the second is the one that matters:

  1. `nameBottleneck` returns `role: top.role`, so the coordinator is told a
     SEAT is the bottleneck. Cosmetic on its own.
  2. `nameBottleneck` ranks on median processing per ROW. A two-seat stage
     contributes two rows, each holding only its own seat's parcels, so the
     stage's work is split before it is ranked. A stage that is genuinely the
     bottleneck can therefore be ranked BELOW a single-seat stage that is
     actually faster. The instrument does not merely mislabel the answer, it
     can give the wrong one.

  ## Why medium and not high

  Latent, for the same reason BL-1040 is: no non-bare seat is configured today.
  It becomes a live wrong answer the moment a second seat boots, which is what
  BL-1001 (landed) and BL-982 (landed) exist to allow. Not `low` — a wrong
  bottleneck is a wrong optimizer decision, not a cosmetic label.

  ## How (direction, not mandate)

  Fold the seat key onto its stage where the report is assembled, so rows for
  the same stage merge before ranking. The Babashka side already has one
  chokepoint for this — `handoff_lib.bb`'s `seat-stage` — and the TypeScript
  side has none; whether to add a shared TS helper or fold at the single
  assembly point is the implementer's and architect's call. Note only that the
  merge has to happen before `nameBottleneck` ranks, not after it picks, or
  consequence 2 survives the fix.

  Live consumers already reach this module and need no new wiring:
  `extension/src/bridge/bridgeState.ts` (`buildStageDwellState`, served on the
  `/stage-dwell` request) and the `extension/src/tools/stage-dwell-report.ts`
  CLI both call `computeStageDwellReportForRoles` today.

  ## Not this slice

  - Supervisor, chase, ensure and the babysitter. Checked, and correct as they
    stand — see `approval_context`. The epic's remaining-slice prose that
    lumps them in with dwell is being corrected in the same pass as this mint.
  - The ops surface that renders each seat and its model (see `ruling_options`).
  - BL-1040's board and stage-map path. Same family, different files, already
    minted and approved; no overlap.

