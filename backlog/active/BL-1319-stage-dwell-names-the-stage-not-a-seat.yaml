invariants:
  - "No stage name, bottleneck name or trend key emitted by the dwell instrument ever contains a seat id — the fold holds for every stage, not only the one with two seats."
  - "The fold is lossless for a single-seat swarm: with only bare seats the report is byte-identical to the pre-fold output for the same parcels."
  - "Per-seat attribution is preserved in the underlying dwell records, never discarded: every record still names the seat that worked it, even though report rows are keyed by stage."

description: |
  ## What happens

  `extension/src/metrics/stageDwell.ts` is the coordinator's optimizer
  instrument (its own header says so, BL-102). `readRoleStageDwellRecords` and
  `computeStageDwellReportForRoles` take a role entry straight from the roles
  table and carry `entry.role` through as the report row's key. For a non-bare
  seat that string IS the seat id — `coder@sonnet2`. Nothing in
  `extension/src/metrics/` folds an `@`: the only two `split('@')` sites in
  `extension/src` are `swarm/respawnPickup.ts` and `swarm/messageBus.ts`.

  ## CORRECTED 2026-09-02 — the seat is DROPPED, not split

  The paragraph above is the mint-time reading and it is WRONG about what
  happens next, as the coder found before writing a line of code. The
  correction is load-bearing, because it changes where the fix has to go.

  `computeStageDwellReportForRoles` opens with, at `stageDwell.ts:276`:

      const pipelineRoles = roles.filter((r) => (PIPELINE_ORDER as string[]).includes(r.role));

  `PIPELINE_ORDER` (`swarmMetrics.ts:60`) holds BARE stage names only:
  `['specifier','coder','cleaner','architect','hardender','documenter','QA']`.
  A seat id such as `coder@sonnet2` is not a member, so the entry is filtered
  out BEFORE `readRoleStageDwellRecords` is ever called on it. Its mailbox is
  never opened and its parcels never become records.

  So the real consequences are:

  1. A seat is never named as the bottleneck, because no seat-keyed row can
     exist. The mint-time claim that the coordinator "is told a SEAT is the
     bottleneck" is false. Invariant 1 and scenario 02 are kept anyway, as a
     regression guard on the FIX: an implementation that starts reading seat
     mailboxes could easily key the new row on the seat id.
  2. A two-seat stage is reported on its BARE seat alone. The second seat's
     parcels are omitted from the report entirely, so the stage is understated
     by OMISSION, not by splitting. A stage that is genuinely the bottleneck
     can still be ranked below a single-seat stage that is actually faster —
     the wrong-answer consequence survives the correction, which is why this
     ticket does — but it arrives by dropped data, not divided data.

  The distinction matters: merging rows at the reporting layer would fix
  nothing, because the second seat's row does not exist to be merged.

  ## Why medium and not high

  Latent, for the same reason BL-1040 is: no non-bare seat is configured today.
  It becomes a live wrong answer the moment a second seat boots, which is what
  BL-1001 (landed) and BL-982 (landed) exist to allow. Not `low` — a wrong
  bottleneck is a wrong optimizer decision, not a cosmetic label.

  ## How (direction, not mandate)

  CORRECTED 2026-09-02, following the drop-not-split finding above. The fold
  has to happen at or before the `PIPELINE_ORDER` membership test at
  `stageDwell.ts:276`, so that a seat entry survives selection, its mailbox is
  read, and its records are attributed to its stage. Folding only at report
  assembly is too late — by then the seat's records were never read.

  Concretely, the shape (not a mandate): decide membership on the entry's
  STAGE rather than its raw role, then group the surviving entries by stage so
  one report row is built from all of that stage's seats' records. The Babashka
  side already has the chokepoint — `handoff_lib.bb:403`'s `seat-stage`, which
  takes the part before the optional `@` and treats a bare id as its own stage
  — and the TypeScript side has none. Whether to add a shared TS helper or fold
  inline is the implementer's and architect's call.

  Two things the fix must not do: read a seat's mailbox and then key its row on
  the seat id (invariant 1), and discard the per-record seat attribution
  (invariant 3) — `deriveDwellRecords` is passed `entry.role` today, which is
  exactly what preserves it.

  Live consumers already reach this module and need no new wiring:
  `extension/src/bridge/bridgeState.ts` (`buildStageDwellState`, served on the
  `/stage-dwell` request) and the `extension/src/tools/stage-dwell-report.ts`
  CLI both call `computeStageDwellReportForRoles` today.

  ## Not this slice

  - Supervisor, chase, ensure and the babysitter. Checked, and correct as they
    stand — see `approval_context`. The epic's remaining-slice prose that
    lumps them in with dwell is being corrected in the same pass as this mint.
  - The ops surface that renders each seat and its model (see `ruling_options`).
  - BL-1040's board and stage-map path. Same family, different files, already
    minted and approved; no overlap.

