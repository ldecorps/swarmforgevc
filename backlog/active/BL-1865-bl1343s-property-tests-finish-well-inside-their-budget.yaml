description: |
  ## What is wrong

  The file drives the real `swarmforge/scripts/land_step_lib.bb` against
  a git fixture per draw. It already carries the class remedies:
  BL-1579's shared seeded repo (no per-draw git init), BL-1343's
  `propertyLaneTimeoutMs(20000)` budget, and BL-1587's
  `runsPerCell(27, SHAPES.length)` draws. It is still slow. Measured by
  the specifier on 2026-10-01, from `extension/`, one run alone on a
  checkout identical to origin/main for the file, its helpers and the lib:
  `npx vitest run --config vitest.properties.config.mjs
  test/bl1343ReplayNeverDropsOwnPathInvariants.property.test.js
  --reporter=verbose` gave invariant 1 18424 ms and invariant 2 15558 ms,
  34.36 s in all, at a 1-minute load of 4.00 (the lane's
  QUIET_LOAD_CEILING is 4). Most of that time is the lib load:
  `bb -e '(load-file "swarmforge/scripts/land_step_lib.bb")'` took 1.06,
  1.01 and 1.14 s, against 0.03 s for a bare `bb -e`. `ask` spawns one
  `bb -e` per question, so every draw reloads the lib. A file that uses
  80-90% of its base alone goes red as soon as the lane is busy, whatever
  the scaling. BL-1853 did not cause it: QA's solo times at BL-1853's
  parcel were lower than main's.

  ## What is wanted

  - Each of the two tests finishes alone in under 8000 ms in the fastest
    of three runs (scenario 01). The bound is 40% of the 20000 ms base,
    and it leaves headroom over a quiet-host measurement the parcel
    records with its load. The coder's evidence records the before and
    after per-test ms and the 1-minute load of each run.
  - The draws and assertions are unchanged (scenario 02, invariants 1 and
    2).
  - The register row added by this mint is present and owned while this
    ticket is open, and the land retires it (BL-1631) (scenario 03, holds
    in both states).
  - One full property-lane run on the parcel. If bl1343 is red in it, the
    evidence carries its own failure line verbatim (use a reporter that
    keeps it, e.g. `--reporter=json --outputFile`), so the class of the
    2026-10-01 red (timeout or assertion) is on record. An assertion
    failure is a real land defect, not this ticket's remedy: raise it as
    a note to the specifier.

  ## How (direction, not mandate)

  - Load the lib once per test, not once per draw. For example, one
    long-lived `bb` per test that loads `land_step_lib.bb` once and
    answers each draw's expression over stdin, one JSON line per answer,
    closed in a `finally`. Each draw still sends its own expression for
    its own fixture root (invariant 2).
  - Leave the fixture side alone unless measurement shows it matters:
    `buildRepo` costs one checkout copy plus a few git spawns per draw.
  - Scenario 01's handler runs the file three times alone with a JSON
    reporter and takes each test's fastest duration (the BL-1658 D2
    rule). About 3 x 10 s after the fix fits the per-mutant ceiling
    (BL-1541). Scenario 02 is a source-level read in seconds; pin its
    census with the "exactly 2 tests" step, so a matcher that finds
    nothing is red, not vacuous (BL-1445).
  - Step handler `specs/pipeline/steps/bl1865Bl1343PropertyBudgetSteps.js`,
    discovered from its own file (BL-1371).

constraints: >
  The bl1343 test file, at most a new test helper under extension/test/,
  the step handler and evidence; extension/src and swarmforge/scripts
  unchanged. Never edit backlog/standing-reds.tsv in the parcel: the land
  retires the row (coder.prompt, BL-1663).

out_of_scope: |
  - Other fixture-spawning property files (BL-1588 and BL-1592 own their
    named populations; a new red is a new unowned-red note, BL-1445).
  - Making land_step_lib.bb itself load faster (a production change with
    its own risk); this ticket changes how the test calls it.
  - The QA gather report's 4000-character tail that dropped this file's
    failure line.

