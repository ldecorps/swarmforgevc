  3. `npm run test:properties` once: bl1343 not red. Record any other red
     with its text and raise it as an unowned-red note; never fold it in.
  After the land: `bb swarmforge/scripts/standing_red_register_cli.bb .`
  reports no row for the bl1343 file.

