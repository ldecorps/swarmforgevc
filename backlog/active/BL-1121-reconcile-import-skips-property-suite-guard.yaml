human_approval: approved
approval_context: >
  Standing recipe so a master-main reconcile merge commit of already-QA'd
  origin/main does not run the full property suite (~150s) that makes human
  joins unwinnable under handoffd's tick. SWARMFORGE_SKIP_PROPERTY_SUITE_GUARD=1
  stays recovery-only. Prefer byte-identical / provenance skip (BL-925/1096
  lineage) over a blanket disable.
acceptance: specs/features/BL-1121-reconcile-import-skips-property-suite-guard.feature
required_wiring:
  - "specs/pipeline/steps/index.js::bl1121ReconcileImportSkipsPropertySuiteGuardSteps::acceptance handler registered"
invariants:
  - "SWARMFORGE_SKIP_PROPERTY_SUITE_GUARD=1 remains recovery-only — this ticket never makes it the standing recipe."
  - "A non-reconcile commit that stages extension/src still runs the property-suite guard."
description: >
  WHAT. Import merges of already-QA'd origin/main onto local main should
  not run the full property suite (or should skip when every staged
  pipeline path is byte-identical to the incoming parent — same
  provenance idea as BL-925/1096). Override
  SWARMFORGE_SKIP_PROPERTY_SUITE_GUARD=1 is recovery-only, not the
  standing recipe.

  WHY. Human directive from INTAKE-handoffd-abort-stomps-human-merge
  (ask 2). Pre-commit property-suite-guard on extension/src* (~150s,
  sometimes red) plus handoffd's ~20s tick made conflicted joins
  unwinnable even after BL-1120 stops the abort stomp.

  HOW (direction, not mandate). Extend the property-suite-guard / pre-commit
  seam to detect a reconcile import commit (merge of origin/main with
  QA provenance, or staged paths byte-identical to the incoming parent)
  and skip the full suite while still logging the skip reason. Do not
  weaken the guard for ordinary feature commits.

qa_e2e_procedure: >
  (1) Simulate a merge commit whose staged extension paths match
  origin/main parent bytes → guard skips and prints a clear skip reason;
  exit 0. (2) Ordinary commit staging a real extension/src change → guard
  still runs. (3) Confirm env override remains documented as recovery-only.
  (4) Unit tests without a 150s suite run.

out_of_scope: |
  - Disabling the property suite globally.
  - The MERGE_HEAD abort fix (BL-1120).
  - Auto-resolving conflicts.

notes: >
  Source: same intake as BL-1120, ask item 2. depends_on BL-1120 so the
  abort stomp is fixed before tuning the guard (human can finish joins).

source: |
