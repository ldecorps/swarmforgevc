id: BL-1779
title: "A project root whose own swarm-identity declares no swarm name (every test fixture root) never reads a fleet creds file and never writes the primary-root record - under the host's real HOME it used to resolve the primary's bot token and bridge port, so a fixture front desk polled the human's bot and freed the live bridge's port - and the five step handlers that start a fixture front desk give it a fleet home of its own"
milestone: M8
type: defect
severity: high
# high: a live fault. Every run of the five handlers below on this host can
# start a second getUpdates poller on the human's bot (BL-622's
# message-stealing incident class) and kill the live front-desk bridge.
# The host's own record proves a fixture has already impersonated the
# primary here: ~/.swarmforge/fleet/primary/root names /tmp/tmp.yRA6sJ6QgV
# (written 2026-07-28 23:45).
epic: swarm-reliability
priority: 5
depends_on: []
