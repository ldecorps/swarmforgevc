slice_size_envelope: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]

acceptance: specs/features/BL-1779-an-undeclared-root-never-takes-a-fleet-swarms-telegram-identity.feature

# Handler pin only (BL-233, BL-1371). The consumers (front_desk_supervisor.bb
# and fleet_telegram_creds_cli.bb calling resolve-telegram-creds) exist
