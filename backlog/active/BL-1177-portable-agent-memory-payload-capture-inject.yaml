human_approval: approved
approval_context: >
  First slice of INTAKE-agent-memory-transfer.md. Prefer portable artifacts
  (summary, handoff pack, open parcel context) over raw vendor session blobs.

invariants:
  - "Capture produces a schema-versioned portable payload — never a vendor-opaque blob as the only artifact."
  - "Inject fails closed when the payload is missing or malformed — never a silent empty resume."
  - "Aggregation of what to capture is pure over named inputs — unit-testable without a live agent."

required_wiring:
  - "extension/src/ or swarmforge/scripts/ agentMemoryTransfer::capture + inject::portable payload API"
  - "specs/pipeline/steps/index.js::bl1177PortableAgentMemoryPayloadSteps::acceptance handler registered"

description: |
  Define the portable memory payload for a role (transcript summary, structured
  handoff pack, tool-state pointers, open parcel context — specifier locks the
  schema in the feature) and a capture/inject API used by same-role model
  swaps. Prefer portable artifacts when vendors differ.

qa_e2e_procedure: >
  (1) Capture fixture role state → versioned payload. (2) Inject into empty
  incoming seat → named continuity fields present. (3) Missing/malformed
  payload → inject refuses loudly. (4) Pure unit tests without live agent.

out_of_scope: |
  - Wiring into hot-swap/trial (BL-1178).
  - Cross-vendor adapters (BL-1179).
  - Cross-role memory merge.

