description: |
  ## What / why

  Epic BL-1125 remaining slice for model-class choice on this WSL/CPU host.
  Human has **no strong opinion** which concrete local model to use;
  **Model Steward should decide from evidence** (battery / scorecards), not
  from a hand-written STEERING ranking. Tag
  `human-operator-priority:ollama-local-qwen-20260825` is **revoked as a
  standing human model pick**. Local Ollama path stays high priority; this
  slice is *which* local model, not *whether* local.

  ## What to do

  1. Repeatable bake-off over certified local candidates (at least those
     falsely priority-ranked, plus other local/* certified entries), using
     BL-1127 coder battery and/or BL-556 capture→evaluate.
  2. Ingest into Model Steward so role-matrix / Factory assign for local
     forge roles are led by that evidence.
  3. Remove or supersede revoked human-operator-priority rankings so they
     cannot outrank real battery/scorecard evidence.
  4. Align local pack window lines (`ollama-qwen3-mono-router.conf` and/or
     `local-model-mono-router.conf`) to the steward winner — generate /
     Factory apply / documented one-shot — with a clear no-winner-yet path.

  ## Out of scope

  - Instant local replies; OpenRouter as substitute for entirely local.
  - Reminting BL-1127; promoting epic BL-1125.
  - Cold-swap day-shift off cursor-forge without a separate explicit ask.
  - Mono-router vs full-forge depth (other remaining_slices on the epic).

qa_e2e_procedure: >
  (1) Bake-off ≥2 local candidates → evidence artifacts; role-matrix coder
  top cites battery/scorecard. (2) Revoked human-priority cannot outrank
  battery pass. (3) Local pack for start-swarm-ollama-qwen matches winner
  or refuses no-winner-yet; cursor-forge untouched.

