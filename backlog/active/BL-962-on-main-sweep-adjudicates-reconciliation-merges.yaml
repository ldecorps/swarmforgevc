id: BL-962
title: "The babysitter on-main sweep charges reconciliation merges with QA's own landed content - false CRIT on every operator git merge of QA-published work; adjudicate merge commits against their QA-approved parents in the gatherer"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 20
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-962-on-main-sweep-adjudicates-reconciliation-merges.feature

invariants:
  - "A merge commit is never reported for a path whose merge-result content is byte-identical to a QA-approved parent's version of that path; a QA-exclusive path differing from every QA-approved parent remains reported even on such a merge (the coat-tails case)."
  - "Whether a parent is QA-approved is decided only by is_qa_ancestor.sh, the one shared predicate (BL-925 invariant 2) - never a second, independently maintained ancestry check."
  - "Any failure in the added per-parent adjudication (ancestry call or content diff) fails the WHOLE sweep closed to ancestry-unavailable, never to a partial result that reads as clean."

description: >
  Severity rationale: high - a broken health/safety signal. The babysitter's
  pipeline-code-on-main check (BL-631, the one detector for Article 4.2/BL-247
  breaches) raises a false CRIT on every operator reconciliation merge of
  QA-landed work, and main/origin-main divergence is routine (BL-891), so the
  guard that must stay trustworthy trains everyone to ignore CRITs instead.

  Observed 2026-08-20: the sweep flagged da6031c60 and b3ba48bfc (both
  "Merge remote-tracking branch 'origin/main'") as landing pipeline code on
  main outside QA. Coordinator adjudication (evidence
  backlog/evidence/babysitter-on-main-false-positive-20260820.md, commit
  0b968315c): for every flagged file the merge result is byte-identical to
  parent2, and each parent2 is contained in swarmforge-QA - the content
  entered main through QA's own BL-247 landing; the merges authored none of
  it. No violation occurred.

  SCOPE CORRECTION (specifier probe, supersedes the evidence file's "real
  process defect" paragraph on this one point): the defective live path is
  NOT swarmforge/scripts/check_pipeline_code_on_main.sh - that is BL-632's
  commit-time hook and it ALREADY adjudicates merges (the BL-925 block:
  MERGE_HEAD/GITHEAD parent discovery, is_qa_ancestor.sh, per-path diff
  against the incoming parent). The gap is in the history sweep:
  gather-pipeline-code-on-main in swarmforge/scripts/babysitter_check.bb.
  Its commit-touched-paths diffs a merge with `git diff-tree -m
  --first-parent` only - correct for catching a merge's own content
  (BL-590's f8dc07963 lesson), but it attributes everything the QA-side
  parent brought in to the merge itself, and no per-parent exemption ever
  runs. babysitterd_sweep_lib.bb's check-pipeline-code-on-main is a pure
  classifier of what the gatherer hands it and is OUT of scope.

  Fix wanted: in the gatherer, before a merge commit's offending path is
  reported, exempt it when some non-first parent is QA-approved
  (is_qa_ancestor.sh, same exit-code semantics the file's qa-ancestor?
  already uses) AND the merge result for that path is byte-identical to that
  parent's version. Paths differing from every QA-approved parent stay
  reported (a writer must not ride fresh pipeline edits through on a
  legitimate merge's coat-tails - the same posture BL-925 took at commit
  time). Non-merge commits are untouched. The existing fail-closed posture
  extends to the new calls: any git/ancestry failure in the adjudication
  yields ancestry-unavailable for the whole sweep.

  How (direction, not mandate): the per-path content check can be
  `git diff <qa-parent> <sha> -- <path>` emptiness, mirroring
  check_pipeline_code_on_main.sh's BL-925 loop; parent enumeration via
  `git rev-parse <sha>^2` (and ^3+ only if octopus merges ever appear -
  two-parent coverage is sufficient today). Test through the established
  scratch-repo harness shape in
  swarmforge/scripts/test/test_babysitter_check.sh (git init fixture with
  main + swarmforge-QA branches, BABYSITTER_QA_EXCLUSIVE_PATHS_SCRIPT stub
  for the path set) - no live tmux, no live repo.

constraints: >
  Out of scope:

  - babysitterd_sweep_lib.bb's check-pipeline-code-on-main classifier - it
    labels what the gatherer hands it and needs no change. Its comment block
    describing the gatherer's diff method should be refreshed by the
    documenter in this parcel, not restructured.
  - check_pipeline_code_on_main.sh (BL-632/BL-925) - already correct at
    commit time; it stays the single --list-paths source.
  - Retro-clearing the two adjudicated commits from any alert history - the
    evidence file already records the verdict; the fix only stops
    recurrence.
  - Subject-string exemptions ("Merge remote-tracking branch ...") - commit
    subjects are spoofable; only ancestry + content identity may clear a
    path.

qa_e2e_procedure: >
  1. Fixture scenarios (no live state): run the BL-962 acceptance scenarios /
     the amended test_babysitter_check.sh cases - reconciliation merge not
     reported; coat-tails edit still reported naming only the differing
     path; equals-parent2-but-parent2-not-QA still reported; plain non-merge
     offender still reported; induced ancestry failure yields
     ancestry-unavailable.
  2. Live regression check (read-only): run the babysitter sweep's gather
     against this repo and confirm da6031c60 and b3ba48bfc are absent from
     offending-commits while ancestry-unavailable is false and the sweep
     still completes.
  3. True-positive spot check in a scratch CLONE (never live main): commit a
     file under extension/src/ directly to the clone's main and confirm the
     gather reports it CRIT-shaped as before.

