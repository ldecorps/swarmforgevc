  non-merge (04) - whose behaviors cannot be folded into one Outline.
  Background holds only the two lines all five scenarios truly share;
  hoisting the merge setup would change 03/04's fixtures.

approval_context: >
  One decision to confirm, the rest mirrors an already-approved design. The
  exemption rule proposed for the sweep is exactly the one you approved for
  the commit-time hook in BL-925: a merge's path clears only when a
  QA-approved parent (is_qa_ancestor.sh) holds byte-identical content;
  anything differing from every QA-approved parent stays CRIT, and any
  adjudication failure fails the sweep closed. Alternatives considered and
  rejected: skipping merges by commit subject (spoofable), or having the
  operator stop making reconciliation merges (BL-891 divergence is routine
  and the merge is the sanctioned reconcile mechanism). Say the word if you
  want a different exemption shape; otherwise approving adopts the BL-925
  rule for the history sweep too.

