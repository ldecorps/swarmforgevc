human_approval: approved
approval_context: >
  Residual of the approval-tap hotfix c416adc5fb, which QA landed at the
  human's word ("Fix approval taps (Hotfix)") and which names this gap
  itself. No choice is posed: the behaviour is fixed (nothing the bridge
  reads is dropped) and the mechanism is the architect's. FIRM: the
  bridge keeps the token while the front desk is dead (BL-1253, certified
  by the human on 2026-10-05) - this ticket changes what it does with
  updates that are not its own, never whether it holds the token.

invariants:
  - "Every update the bridge reads while it holds getUpdates is either handled by the bridge or handed to the front desk; none is consumed and dropped."
  - "A handed-over update is applied by the front desk at most once, however many times it is handed over or read."

description: |
  ## What is wrong

  When the front desk's poll heartbeat is more than 90 s old, the cursor
  bridge's dead-feeder fallback (BL-1253, 2ec06b6ef1) calls getUpdates on
  the shared bot token itself. Every update it reads is then confirmed
  and gone from Telegram. In telegramCursorBridgeLive.ts's per-update
  loop the bridge answers every callback query
  (`answerCallbackQuery(deps.botToken, inbound.callbackQueryId)`), routes
  what is its own (the cursor topic, Bubble, the local seat), and drops
  the rest. So an Approve or Reject tap, an approve verb typed in the
  Approvals topic, or any other front-desk update in that window is lost,
  and a tap looks taken while nothing is recorded.

  On 2026-10-07 the bridge had held getUpdates beside a live front desk
  for 14 hours (its start-time inbound-queue flag was baked to 0 during the
  2026-10-06 swarm death), and the human's taps on BL-2058 and BL-2059
  recorded nothing. QA's hotfixes, both stamped by BL-2060: c416adc5fb
  caps a front-desk 409's backoff at 5 s; 4453766c28 makes the start
  script's own decision yield to the per-poll feeder liveness. Now the
  bridge holds the token only while the front desk is really dead. In that
  window every front-desk update it reads is still answered and dropped,
  where without the bridge Telegram would have kept it for the front desk
  to read on recovery. c416adc5fb's message names it: "a tap that reaches
  the bridge in the few seconds it holds the token is still answered and
  dropped."

  ## What is wanted

  - An update the bridge reads while holding getUpdates that is not its
    own reaches the front desk, which applies it as if it had read it
    itself once it polls again (scenario 01: an Approve tap, a Reject
    tap, and the typed verb `approve BL-9061` in the Approvals topic each
    land in the ticket's human_approval).
  - The bridge's own updates are unchanged: a message in the cursor topic
    is still answered by the bridge and nothing is handed over for it
    (scenario 02).
  - A hand-over survives redelivery: the same update handed over twice is
    applied once (scenario 03, invariant 2), keyed by Telegram's
    update_id.
  - Living docs: docs/how-to/BL-1253-swarm-stamp-dead-feeder-owns-getupdates.md
    and docs/how-to/BL-764-front-desk-shared-token-bridge-fanout.md describe
    who reads which update on the shared token; both say what happens to
    a front-desk update in fallback mode. If front-desk-flow.mmd draws
    the shared-token fan-out, it gains the reverse arrow (its
    change-trigger: the front-desk routing changes).

  ## How (direction, not mandate)

  - The front desk already feeds the bridge through a durable append
    file in queue mode (cursorBridgeInboundQueue.ts,
    `appendCursorBridgeInboundUpdate`). The reverse direction - the
    bridge appends a not-its-own raw update to a file the front desk
    drains at the top of its next poll cycle, deduplicated on update_id -
    is one shape. The architect decides the shape, whether the bridge
    still answers a handed-over callback query, and where "not its own"
    is decided (the bridge's existing `decideInboundAction` already
    returns no route for these).
  - Fixtures only: fake Telegram, fake clock, a temp operator directory,
    never the live token or the live operator directory.

constraints: >
  The bridge's token-ownership rule (BL-1253) and the front desk's poll
  backoff (c416adc5fb) are unchanged. No live Telegram call in any test.
  Webview and VS Code API untouched. The step handler lands with the
  feature (BL-233).

out_of_scope: |
  - Whether the bridge should take the token at all while the front desk
    restarts (BL-1253, certified).
  - The front desk's 409 backoff and the start-time flag (BL-2060 stamps
    both).
  - The live supervisor's explicit CURSOR_BRIDGE_INBOUND_QUEUE=1 (set by QA
    at 2026-10-07T09:47:46Z): while it stands, the bridge never takes the
    token; the fixture scenarios do not depend on it.
  - Updates read while the front desk itself holds the token: those are
    already the front desk's.

