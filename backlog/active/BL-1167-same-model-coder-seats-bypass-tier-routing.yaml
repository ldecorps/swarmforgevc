priority: 5
direction: human-requested
depends_on: [BL-983]
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1167-same-model-coder-seats-bypass-tier-routing.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl1167SameModelSeatRoutingSteps::acceptance handler registered"
  - "swarmforge/scripts/seat_difficulty_lib.bb::parse-seat-models::pack window --model values parsed for same-model detection"

invariants:
