human_approval: approved
approval_context: >
  Operator ruling verbatim (INTAKE-cursor2-same-model-no-tier-routing.md,
  2026-08-26): when both coder seats run the same model (`auto` on `coder` and
  `coder@cursor2`), the coordinator may pass coder work to either seat
  regardless of `mutation_cost` or `--seat-tier`. BL-1001 tier rules apply only
  when seats are model-differentiated. Human priority 00.

description: |
  ## What

  `cursor-forge` runs both coder seats on `--model auto` with
  `--seat-tier hard` / `--seat-tier easy`. BL-1001 tier filtering then blocks
  medium/high tickets from `coder@cursor2` even when both seats are
  model-equivalent — starving the second seat without reducing bounce risk.

  When every seat of a stage shares the same effective `--model`, tier rules
  must not apply. Claim selection reverts to BL-983 idle-first among seats.
  When models diverge again, BL-1001 tier discipline returns unchanged.

  ## How (direction, not mandate)

  Extend `seat_difficulty_lib.bb` (and `ready_for_next_task.bb` if needed) to
  parse `--model` from pack window lines, detect model-equivalent stages, and
  bypass `difficulty-claim-decision` tier filtering for those stages. Prefer
  load-balance / idle-first among eligible seats — do not invent a new
  coordinator router; `route_backlog_to_coder.sh` stays stage-addressed.

  ## Verification

  - Property/unit tests on `seat_difficulty_lib` for same-model vs
    differentiated-model decisions.
  - Acceptance scenarios drive real `ready_for_next_task.bb` over a two-seat
    fixture mirroring `cursor-forge` (both `auto`) and a differentiated control.

qa_e2e_procedure: >
  (1) Unit/property tests for seat_difficulty_lib same-model bypass green.
  (2) Acceptance feature green after compile.
  (3) On a live cursor-forge swarm with both coder seats on auto, promote a
  medium mutation_cost ticket and confirm either seat may claim it when idle.

out_of_scope: |
  - Changing BL-1001 tier semantics when models differ.
  - Coordinator promote/order logic beyond existing stage-addressed routing.
  - Auto-detecting model equivalence from runtime agent state (pack conf only).

