description: |
  ## Status: hotfix 380481d3be landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  Between 23:45Z on 2026-10-03 and 06:01Z on 2026-10-04 the iq3 coder's
  qwen sessions compacted 76 times, about every 4 minutes. qwen compacts at
  27852 tokens of a 32768 window, and the seat's prompt floor is about
  12.5k, so about 10k of room was left. Every compaction call hit the
  shim's 4096-token cap (e44f9cdfc7) and ran about 180 s: 32 such calls
  took 5773 of 7223 model seconds in one session (80%).

  Worse, none of the 24 snapshots in session ebb63560 closed
  `</state_snapshot>`. qwen's compaction prompt asks for an `<analysis>`
  block first, then nine sections with `<pending_tasks>`, `<current_work>`
  and `<next_step>` last, after `<files_and_code_sections>` with "full
  code snippets". Every summary was cut off before the three sections the
  agent resumes from. The seat re-read the same files (residentSpyUiHtml.ts
  39 times, swarmforge.sh 25, QA's evidence 23) and never ran
  swarm_handoff.sh.

  ## What the hotfix changed

  - `swarmforge/scripts/local_model_precompact_hook.sh` prints a qwen
    PreCompact `additionalContext`: no `<analysis>` block, `<next_step>`,
    `<current_work>` and `<pending_tasks>` first, the snapshot under 900
    words, files as path plus one line, and close `</state_snapshot>`.
    qwen appends it to the compaction prompt as "Additional Instructions"
    (`buildCompressionSystemPrompt`).
  - `write_local_model_qwen_settings` (swarmforge.sh) registers the hook,
    the master checkout's own copy, for every trigger.
  - `swarmforge/scripts/test/test_bl1949_local_model_precompact_hook.sh`,
    registered standing.

  ## What the review checks

  - The hook text is accurate and bounded (under qwen's 4000-character
    limit), and the writer leaves no placeholder in the settings.
  - The docs: `docs/how-to/BL-1052-local-model-seat-launch.md` (around
    line 265) lists what a seat's `.qwen/settings.json` carries; the
    PreCompact hook joins that list, with why.
