approval_context: >
  A decision for you, not a build request. BL-1248 is about to ship a config
  switch that disables the master-main-reconcile sweep, with a comment
  saying "turn this back on once BL-1236 lands". BL-1236 landed this
  afternoon, before BL-1248 did - so the switch arrives with its stated
  re-enable condition already met, and someone reading the conf would be
  invited to flip it on immediately.

  The question: re-arm the sweep now, or leave it off for a while?

  What is firm either way: the switch itself ships, it ships OFF in BL-1248,
  and it fails closed. Nothing here re-opens that.

  Context for the call. Arguments for ON: BL-1236 replaced the broken
  text-search conflict predicate with git's own merge-tree exit code at both
  call sites, which is the cause pinned to ten of the thirteen resets; the
  sweep does useful work when it is not misfiring. Arguments for OFF: the
  fix has never run in production (the swarm is down under the BL-1191
  hold), thirteen realised losses include six human approval taps and two
  closures, and the cost of waiting is only that main and origin drift while
  a human is told about it - the surfacing and escalation paths stay live
  while the switch is off, by BL-1248's own design.

  If you say OFF, please also say what the new condition should be (a number
  of clean live ticks, a date, or "ask me again") - "until BL-1236 lands"
  has expired and the conf should not carry a condition that is already met.

