# BL-761 acceptance-contract gate (added 2026-08-29, after the documenter hit it):
# this points at the feature file BL-1251 RETIRES FROM, not at a contract of its
# own. A retirement chore has no scenarios of its own, and the gate fails CLOSED
# on an absent declaration at the documenter->QA hop - so with no pointer this
# parcel could not reach QA after all six stages were already spent. The contract
# BL-1251 must satisfy IS this file post-retirement: scenario 04 gone, every
# remaining scenario still resolving against the step registry. Verified against
# the documenter's own commit: with this line the gate returns 0 findings,
# without it exactly 1. It is NOT a claim that BL-1251 owns BL-1248's contract.
acceptance: specs/features/BL-1248-master-main-reconcile-kill-switch.feature
