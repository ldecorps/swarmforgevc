id: BL-1343
title: "The land step subtracts the landing ticket's own path from its own replay when attribution credits it to a sibling, so an approved parcel lands nothing while reading as complete"
milestone: M8
type: defect
severity: critical
# Raised high -> critical 2026-09-02, same day, on evidence rather than alarm.
# Minted at high because BL-1338 alone failed CLOSED and no silent loss was
# observed. Within the hour QA escalated BL-1056-a and then BL-1271 with the
# same refusal and overlapping entangled sets. Three QA-approved parcels are
# now held off main, each naming the others as its blocker, so the set cannot
# clear itself and grows by one every time a further parcel reaches QA on the
# same branch. Landing is effectively down. The open question from the mint
# still stands and still matters: if an empty replay set on a differing tip
# can report success anywhere, silent loss is reachable too.
