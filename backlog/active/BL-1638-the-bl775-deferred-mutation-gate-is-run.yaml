id: BL-1638
title: "BL-775 (2026-09-18) and BL-831 (2026-09-19) landed with their Stryker mutation gates deferred - the perTest dry runs over out/bridge/bubbleLiveUiHtml.js, out/bridge/residentPaneLive.js and out/bridge/bubblePipelinePage.js timed out at the five-minute ceiling under load 11.5-25.2 with swap in use and eight or more concurrent workers, and a plain coverage run in the same window died with ERR_IPC_CHANNEL_CLOSED after a WSL-captured node abort - so the ledger row names a closed parcel, the register reads it as the only unowned row, and BL-1429's throttle holds the cap at one; this ticket owns the row through the three-day cooldown (not before 2026-09-21), recreates the scoped Stryker config the parcel did not land, runs the gate on a quiet host, and discharges the row with a completed result"
milestone: M8
type: defect
severity: high
# high (standing-red rule 2026-09-05, BL-1488's precedent): an unowned
# hardening-lane row is a broken safety signal that throttles intake for
# every ticket until owned; production is unaffected (the gate never ran,
# nothing is known to survive).
status: todo
