  exist), Negotiable (concurrency and the quiet-host reading are
  direction), Valuable (the throttle lifts now and the gate BL-775 owed is
  run), Estimable (one config, one run, one discharge - one sitting once
  the host is quiet), Small (two scenarios, two invariants), Testable (the
  parcel's own committed ledger, evidence and register, read in
  milliseconds).
  IR-DRY after the merge: scenarios 03/04 mirror 01/02 for the second row
  by design (two ledger rows, one discharge shape); reviewed and kept.

