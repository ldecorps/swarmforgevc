description: |
  ## What

  First slice of BL-1165: a Bubble pager page **Operator docs** that lets the
  human browse the documenter corpus on a phone:

  1. Open Operator docs from the expanded Bubble pager.
  2. See the four Divio sections from `docs/index.md` (tutorials, how-to,
     reference, explanation) and drill into each section list.
  3. Open at least one how-to and one reference page; rendered markdown is
     readable on a phone viewport (headings, lists, code blocks scaled — not
     raw markdown source).

  ## How (direction, not mandate)

  - Register a remote HTML page in the BL-829 bundle — same family as Pipeline
    and Health pages.
  - Bridge serves markdown from git `docs/` as HTML on demand; parse
    `docs/index.md` for section structure and links.
  - Phone viewport layout: single-column, scrollable, legible body text —
    follow house remote-HTML patterns from BL-831.
  - Auth: bridge token required (Live Screen class) — not a public static page.
  - Offline v1: when bridge unreachable, show an honest unavailable state naming
    bridge reachability — do not show stale or empty content as if current.

  ## Pager placement (direction)

  Operator docs sits in the expanded Bubble pager as a dedicated page —
  separate from the Gherkin/spec explorer. Exact pager index follows BL-829
  manifest order; document the chosen slot in the how-to.

qa_e2e_procedure: >
  (1) Node acceptance: index lists four Divio sections from docs/index.md;
  drill to section lists; open named how-to and reference fixtures; HTML body
  readable without raw markdown leakage.
  (2) Bridge route returns 401/403 without token and 200 with token.
  (3) Unavailable state when bridge feed cannot be reached.
  (4) Manual once on device: expanded Bubble → Operator docs → section → page
  readable on phone viewport.
  (5) Confirm no write endpoints exposed from this page.

out_of_scope: |
  - BL-### search deep links (BL-1165 remaining slice).
  - Every doc in every section — only one how-to + one reference required here.
  - Orphan index fixes (BL-756).
  - Unified Specs/Authored tabs (deferred).
  - Offline corpus packaging.

