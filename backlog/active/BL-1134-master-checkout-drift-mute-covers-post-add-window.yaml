source: |
  Human Cursor session 2026-08-25. Follow-on to done BL-1122 / BL-839.
  Telegram Alerts screenshot 14:12 (prior 14:07): MASTER CHECKOUT DRIFT
  naming handoffd.bb and push_sweep_lib.bb as STAGED. Immediate live
  check: overall no-drift, no index.lock, nothing staged. BL-1122 mute
  only watches `.git/index.lock`; after `git add` the lock clears while
  index≠main until commit completes — that gap still WARNs.

description: |
  ## What is wrong

  BL-1122 correctly mutes while `index.lock` is held. Agent commits on a
  busy `main` spend most of the add→commit window *without* that lock.
  The sweep still classifies index≠main as `:staged-for-reversion` and
  floods Operator Alerts with the same handoffd.bb / push_sweep_lib.bb
  text humans are trained to dismiss.

  ## What to do

  Widen read-only in-flight detection so the mute covers the whole
  observable add→commit window (e.g. live `git add` / `git commit`
  against this project root, and keep index.lock). Acceptance must prove:
  durable staged reversion with no signal still alarms; staged-vs-main
  while git is observably in flight does not WARN; mute is not sticky.

  ## Out of scope

  - Auto-restoring / unstaging the master checkout.
  - Moving daemons onto a committed ref.
  - Muting `:uncommitted-edit` or `:unknown`.
  - Ancestry heuristics that guess "forward land" vs "reversion" as the
    sole mute (optional secondary only if process observation is
    insufficient — specifier/architect call).

qa_e2e_procedure: >
  (1) no-drift silent. (2) durable staged reversion, no lock, no git
  process → alarm. (3) same disagreement with live git commit → no WARN.
  (4) staged after add, no index.lock, observable git in flight → no WARN.
  (5) signal cleared, still staged reversion → alarm again. (6) check
  never writes.

