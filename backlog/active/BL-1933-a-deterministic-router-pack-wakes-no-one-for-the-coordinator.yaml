description: |
  ## What is wrong

  On a rotation-router pack `handoff_lib.bb`'s `resolve-wake-session` sends
  any recipient with no session to the resident's pane (census group C).
  With no coordinator seat: `closing-context-clear-sweep!` reads the
  resident's fullness and, because BL-1847's relay keeps the coordinator's
  mailbox empty (always "idle"), sends `/clear` and a re-read into the
  resident for each newly done ticket; `babysitter_check.bb`'s
  `nudge-resident! ... "coordinator"` types findings into the resident (only
  aider seats are skipped) and, the dedup stamp being written only on
  success, retries every sweep; `maybe-notify!` wakes the resident for a
  git_handoff delivered to the coordinator.

  ## What is wanted

  On such a pack the coordinator resolves to no wake session (mirroring
  BL-614, which already keeps it out of rotation), so all three inject
  nothing; a nudge that has nowhere to go is recorded so it is not retried
  each sweep. Dormant roles still wake the resident.

  ## How (direction, not mandate)

  - One check in `resolve-wake-session` covers the wakes and the clear; the
    babysitter nudge path calls its own resolver (`babysitter_nudge_lib`).
  - Step handler: specs/pipeline/steps/bl1933DeterministicRouterWakesNoOneForTheCoordinatorSteps.js.

  ## What each stage checks

  - Coder: the four scenarios; handoff_wake_session_test_runner.bb,
    closing_context_clear_test_runner.bb and babysitter_nudge_lib_test_runner.bb pass.
  - Architect: the two invariants.
  - Hardender: hand-mutant pass on the resolver check (BL-472 fallback recorded).
  - Documenter: any doc describing the router wake redirect.

qa_e2e_procedure: |
  1. `node specs/pipeline/cli.js specs/features/BL-1933-a-deterministic-router-pack-wakes-no-one-for-the-coordinator.feature` passes 4 of 4.
  2. `bb swarmforge/scripts/test/handoff_wake_session_test_runner.bb`, `bb swarmforge/scripts/test/closing_context_clear_test_runner.bb` and `bb swarmforge/scripts/test/babysitter_nudge_lib_test_runner.bb` pass.

