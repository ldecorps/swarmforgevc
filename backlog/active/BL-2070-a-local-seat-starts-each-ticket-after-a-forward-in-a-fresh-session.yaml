id: BL-2070
title: "A local seat starts the next ticket in a fresh session after it forwards one: the iq3 launcher starts qwen once and keeps that session from parcel to parcel, carrying every earlier ticket's reads; after a queued git_handoff and a completed parcel the repeat guard ends qwen and the launcher starts a fresh session with the seat's normal launch message"
