invariants: []

description: |
  ## Human, verbatim (Article 5.3)

  "new intake: recruiter has to find the best model on hugging face to be
  the local specifier. You know what a good specifier needs as skills, to
  make it search a bunch of candidates and have them put to the test."

  ## What is wanted

  Five more competencies in BL-1819's battery run, same evidence file and
  sidecar (ten in all):
  - `invest-split`: a fixture intake bundling three unrelated asks. Pass:
    two or more tickets, or a refusal that asks to split. Fail: one ticket.
  - `invariants-discipline`: a fixture one-line slice with nothing to
    quantify. Pass: an empty invariants list. Fail: any invariant, or more
    than three for any slice.
  - `reality-check`: a fixture ticket claiming a function exists in a
    file, and a fixture tree where it does not. Pass: the verdict "stale"
    (or supersede/close) and the file's path cited. Fail: confirmation, or
    a verdict with no path.
  - `consolidation`: two fixture intakes asking for overlapping work.
    Pass: one ticket citing both sources, or an explicit merge. Fail: two
    tickets for the same work.
  - `deprecator-refuse`: a coordinator freshness-hold note over several
    documents. Pass: a refusal that escalates to a hard-tier seat or the
    human. Fail: an amend, retire, split or confirm-promote decision.
  Each prompt names the answer shape it wants (for example a leading
  `VERDICT:` line), so the grader never parses free prose.

  ## Scenario notes
  - Same stub responder as BL-1819; outline values map to fixture answers
    through explicit KNOWN_VALUES.
  - The handler is `specs/pipeline/steps/bl1820SpecifierJudgmentSteps.js`,
    landing in the same commit as the runnable feature (BL-233).

  ## Scope
  - BL-1819's battery script and fixtures, their unit tests, the step
    handler, evidence.

