id: BL-1082
title: "The swarm can pull and serve a named model on this host: there is no path that downloads an operator-named model and serves it locally, so no seat can ever run its completions on this machine"
milestone: M8
type: feature
status: todo
epic: swarm-intelligence-layer
priority: 4
direction: queue-jump
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1082-the-swarm-can-pull-and-serve-a-named-model-on-this-host.feature
human_approval: approved
approval_context: >
  Sliced out of the 2026-08-22 operator intake
  INTAKE-download-any-local-model-as-swarm-member.md, which asked for three
  things: download any named model, run it on this host, and staff a swarm seat
  with it. BL-1052 already held the seat half and BL-1053 the routing half;
  nothing held the download-and-serve half, which is the headline of the ask.
  Two specifier decisions need your sign-off before coding: (1) Ollama as the
  v1 local runtime, chosen because `ollama pull <id>` is parameterized by model
  id across families and it exposes an OpenAI-compatible endpoint, so the next
  model is an id and not a new adapter; (2) v1 supported on this Linux/WSL2
  host only, with macOS explicitly deferred rather than assumed. Say so if you
  want a different runtime (llama.cpp server, LM Studio, vLLM) or want macOS in
  v1 - both change this slice's shape, neither changes the operator outcome.

required_wiring:
  - "specs/pipeline/steps/index.js::bl1082::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "Model identity is a parameter end to end. Pulling or serving a second model is a different id passed in - never a second copy of the pull or serve path, and never an edit to the runtime adapter."
  - "Nothing the pull writes can reach a commit. Weights, caches and manifests live outside the tracked worktree or are gitignored, and this holds for a model id nobody has pulled yet."
  - "Serving is idempotent. A serve requested against an already-healthy endpoint reuses it rather than starting a competing server on the same port."

description: |
  ## What is wrong

  The swarm can staff seats with cloud agent CLIs only. There is no path -
  script, subcommand or documented tooling the swarm owns - that takes a model
  name from the operator, puts that model on this host, and serves it behind a
  local endpoint. Without that, no seat can ever run its completions on this
  machine, and every "local model" conversation stalls at the same missing
  first step.

  ## Why this is its own slice

  The operator's ask is three things: download any named model, run it locally,
  and staff a swarm seat with it. BL-1052 holds the seat and BL-1053 holds the
  routing. This slice holds the first one - the part with no owner until now.
  A seat cannot be proven live against an endpoint that does not exist, so this
  lands first.

  ## First quest (not the whole product)

  Prove the path with one Qwen coding model on this host. The second model in
  the acceptance feature is there to prove the path is generic, and a fixture
  or stub stands in for its weights - the point is that model identity is an
  argument, not a code change.

  ## How (direction, not mandate)

  Specifier decisions, open to challenge at approval but not to be re-litigated
  in a coder ticket:

  - **Runtime: Ollama.** `ollama pull <model-id>` is parameterized by id across
    model families, it serves an OpenAI-compatible API on the loopback
    interface, and it runs on both Linux and macOS. That satisfies the intake's
    "must be able to pull more than one model family without a new adapter each
    time" at the lowest cost. llama.cpp server, LM Studio and vLLM would all
    work; none is cheaper for v1.
  - **First model: a 7B-class Qwen coder build**, e.g.
    `qwen2.5-coder:7b-instruct` at a 4-bit quantization. This host has 20 vCPU,
    ~19 GB RAM and no GPU, so inference is CPU-only; a 14B-class build fits in
    RAM but is too slow to be a usable seat. Pick the exact tag at build time
    against what the runtime actually publishes.
  - **Support matrix: this Linux/WSL2 host for v1.** macOS is deferred, not
    assumed working. Say which host was proven in the how-to.
  - **Shape: operator-facing tooling the pack consumes**, not a new `./swarm`
    subcommand. A pull is a slow, interactive, human-initiated act; wiring it
    into swarm launch would make every launch a possible multi-gigabyte
    download.

  Deliberately NOT in this slice: the seat itself and its pack (BL-1052);
  the provider key and Steward registration (BL-1053); serving more than one
  model at once; GPU offload tuning; any second runtime backend.

notes: |
  Human Q-jump 2026-08-23 (Cursor): Cursor seat chain ahead of local-LLM chain.
  Drained from the operator intake
  `.swarmforge/operator/INTAKE-download-any-local-model-as-swarm-member.md`
  (2026-08-22, Let's Talk / Cursor), 1:N split with BL-1052 (seat and pack)
  and BL-1053 (intelligence-layer routing). This ticket carries the intake's
  suggested slice 1; BL-1052 carries slice 2; BL-1053 carries slice 3.

  Operator directives, verbatim:

    "Ce que je veux, c'est de le faire tourner en local."

    "Est-ce que tu peux generaliser cette intake de maniere a ce qu'on puisse,
    en fait, demander a la swarm de telecharger n'importe quel modele et de
    l'installer en local ? Pas uniquement Qwen."

    "... capable de telecharger un QN et de le faire tourner en local, en tant
    que membre de la somme."

  Locked reading from the intake, carried here unchanged: Qwen is the FIRST
  PROOF, not the product ceiling. A second model must not need a second
  bespoke intake of the same size.

  Host survey run at spec time (2026-08-22, this WSL2 host): 20 vCPU, 19 GiB
  RAM, no NVIDIA GPU, 918 GB free on /. No local inference runtime is
  installed - ollama, llama-server, vllm and lms are all absent from PATH, so
  this slice installs the runtime as well as pulling the model.

qa_e2e_procedure: |
  On the live host:

  1. Ask the tooling for a named Qwen coder model and confirm it downloads and
     reports ready. Re-run the same request and confirm it downloads nothing
     the second time.
  2. Start the local server and confirm the health check reports ready and
     names a loopback OpenAI-compatible base URL. Curl that URL and confirm a
     real completion comes back from the local process, with no network egress
     to a model vendor.
  3. Stop the server and confirm the health check reports NOT ready and names
     the endpoint it could not reach - never a bare failure.
  4. Ask for a model id that does not exist and confirm the failure names the
     id.
  5. Run `git status` and confirm no weight, cache or manifest path appears as
     untracked or modified in the forge repo.
