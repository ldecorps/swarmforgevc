id: BL-1008
title: "BL-933's bounded fs.watch deadline is itself a bare 10000ms constant, so the helper written to convert a load-induced lane timeout into a clear diagnostic has now become a load-induced failure of its own"
milestone: M8
type: defect
severity: medium
status: todo
epic: code-quality-gates
priority: 35
direction: pipeline-note
depends_on: [BL-1007]
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1008-the-bounded-watch-deadline-is-itself-an-absolute-constant.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl1008::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"
  - "extension/test/helpers/boundedWatchWait.js::contentionBudget::the helper must actually READ the contention factor BL-1007 records. Without this the deadline stays a bare constant and the ticket has changed nothing. Anchored to BL-1007's helper module name, which exists once its depends_on has landed"

invariants:
  - "BL-933's diagnostic property survives: a missing OS event still fails with a message naming the event and the watched path, never as a bare lane timeout naming only the test."
  - "The inner deadline stays strictly below the test's own effective budget. If it ever met or exceeded it, Vitest's bare timeout would win the race and the helper's entire reason to exist would evaporate silently."

description: >
  extension/test/helpers/boundedWatchWait.js exists because BL-131 left the
  await on a real fs.watch event unbounded, so a late or dropped OS event
  consumed the whole 20000ms lane budget and reported a bare Vitest timeout
  naming only the test. BL-933 fixed that by racing the real-event promise
  against an explicit, much shorter deadline, so a missing event fails fast
  with a message naming the event and the path being watched. That
  reasoning was right and the diagnostic is worth keeping.

  The defect is that the deadline it introduced is
  `DEFAULT_TIMEOUT_MS = 10000` - another bare wall-clock constant, measured
  on a quieter host, with exactly the decay BL-1007 describes one layer up.
  On 2026-08-21 at load 129-158 on a 4-core box, the real fs.watch event
  for `startBounceWatcher wires real fs.watch into the debounce` did not
  arrive inside 10s, and the helper built to make load failures legible
  became a load failure itself. The test passes 35/35 in 2.9s in clean
  isolation, so nothing is wrong with the code under test.

  This is deliberately NOT a budget-timeout defect and was split out of
  BL-1007 for that reason: it never reaches Vitest's testTimeout at all. It
  fails on its own inner race deadline, with its own message, which is why
  bucketing it with the five timeout reds would have produced a fix that
  did not apply to it.

  HOW (direction, not mandate). Raising 10000 to some larger constant
  reintroduces the same decay a third time and should not be the fix.
  BL-1007 records a contention factor for exactly this purpose - derive the
  deadline from it, so the helper widens only when the host is genuinely
  contended and stays at today's value on a quiet box. Invariant 2 is the
  constraint that keeps the derived value useful rather than merely larger:
  a deadline that grows past the test's own effective budget silently
  restores the BL-131 behaviour BL-933 was written to remove.

qa_e2e_procedure: >
  1. From extension/, run test/bounceWatcher.test.js in clean isolation on
  a quiet host and confirm it passes and the deadline is unchanged from
  today's value - the fix must be inert on an idle box. 2. Re-run it while
  the swarm is live (load >= 4x cores) and confirm it passes. 3. Point the
  helper at a path that will never emit the awaited event and confirm the
  failure message still names both the event label and the watched path
  (invariant 1) - a bare Vitest timeout naming only the test is the
  regression this check exists to catch. 4. Confirm the derived deadline is
  strictly less than the test's effective budget at the same contention
  factor (invariant 2), including at the factor that clamps BL-1007's
  ceiling. NOTE for the hardener: this parcel touches extension/test/ and
  specs/pipeline/steps/, so the standing whole-tree guards apply.

notes: >
  Split from the BL-999-class intake as shape C of three - see
  backlog/evidence/specifier-disposition-bl999-class-unit-lane-load-budgets-20260821.md
  at 9ad150e0c, which recorded that this red "is out of all four options and
  needs its own line in whatever ticket results - it is not a budget at
  all". Shapes A and B are BL-1007. Per the specifier's Consolidation
  Authority a 1:N split records the source in every resulting ticket, which
  is what this note is.
  depends_on BL-1007 is real, not bookkeeping: the intended fix consumes
  the contention factor BL-1007 records, and doing it the other way round
  would mean minting a second contention sampler. Same convention as
  BL-999's own depends_on BL-969, which was likewise still in flight when
  it was written.
  No human_approval field: the operator's 2026-08-21 ruling settled the
  shape for this whole intake, so nothing here awaits a decision.
