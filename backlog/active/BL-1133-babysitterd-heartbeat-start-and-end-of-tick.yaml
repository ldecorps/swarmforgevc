source: |
  Human Cursor session 2026-08-25. Follow-on pressure after BL-1086 (cache)
  and BL-675 (freshness watchdog). Observed: babysitterd pid alive + often
  in `sleep 300`, yet Operator Alerts gets cool-off escalate with large
  age_secs when a tick overruns or the host sleeps across the interval.
  Heartbeat is written only after `babysitter_check.sh` returns
  (`babysitterd.sh`). handoffd already pulses start+end (BL-789).

description: |
  ## What is wrong

  Freshness cron treats babysitterd log heartbeat age > 600s as dead.
  babysitterd only appends `heartbeat` after each tick's check. Mid-tick
  work (especially pipeline-code-on-main when tips move) or wall-clock
  jumps during `sleep` make a live daemon look stale → restart →
  escalate spam for the cool-off window.

  ## What to do

  Pulse a content-free heartbeat (1) on daemon start before the first
  check, (2) at the start of every tick, (3) at the end of every tick —
  same shape as handoffd BL-789. Keep BL-675 stale detection for a truly
  mute log. Cursor already has a draft diff on the master checkout; land
  it (or equivalent) through the normal stages.

  ## Out of scope

  - Raising the babysitterd freshness threshold as the primary fix.
  - Changing BL-1086 gather/cache behaviour.
  - Muting freshness escalate without fixing the pulse.

qa_e2e_procedure: >
  (1) Start babysitterd; log shows heartbeat before first check completes.
  (2) One tick → heartbeat before and after check. (3) Fixture / property:
  mid-check sample with start pulse stays under 600s age. (4) Stale log
  with no new pulses still records stale-heartbeat.

