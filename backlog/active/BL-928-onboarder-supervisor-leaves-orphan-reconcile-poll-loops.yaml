invariants:
  - "A process whose parent is alive is never reaped. The running supervisor's own child, and any other live supervisor's child, survive every sweep - the sweep's only licence is over processes whose parent is gone."
  - "Only a process whose command line names THIS swarm repo root is ever a candidate. A poll-loop for any other root, including a tmp fixture root, is never reaped no matter how orphaned it is."
  - "An unreadable process table reaps nothing and is never conflated with an empty candidate set. The two outcomes are distinguishable from the supervisor's own log."

approval_context: >
  Two decisions I made on your behalf, both reversible if you disagree.

  The reap runs at supervisor STARTUP only, not on every tick. A sibling can
  only come into existence when a supervisor dies, so a per-tick host-wide
  process scan every 2s would buy nothing and would put live-process hunting on
  the hot path - the BL-367 failure class your intake told me to stay out of.
  Say the word if you want it on the tick as well.

  I did NOT touch stop_onboarder(). Your goal sentence names both a start and a
  stop-without-finally, but both clauses land on the same moment - "must not
  leave PID-1 leftovers ALONGSIDE a freshly spawned child" - and your own
  acceptance shape #1 is worded as a restart. A stop-path sweep would add a bash
  entry point for a window in which no supervisor is running anyway. If you want
  the leftovers gone at stop time rather than at next start, that is a second
  ticket and I will mint it.

  Severity high. Nothing is down, but the stall detector reads a heartbeat file
  that any of N writers may have last touched, which is a corrupted health
  signal, and the leak is unbounded - one more orphan per supervisor death,
  forever. High also puts it in the Article 3.2.4 expedite lane, which matches
  your queue-jump direction.

