description: |
  ## What is wrong

  `specs/pipeline/test/` holds 41 `node:test` files: the acceptance
  runner's own tests, guards such as BL-989's portable-grep sweep, and
  step handlers' failure-branch tests. QA's gather runs `npm test` and
  `npm run test:properties` from `extension/`. Neither includes this
  directory, and nothing else runs it. On 2026-10-06 it held four red
  files nobody had seen (BL-1720 and BL-1861 had put `grep -qP` back into
  two shell tests; BL-1277 had scoped burndown steps a test still resolved
  unscoped; the swarm-intake workflow had used `${NUM}` since 2026-07-22;
  BL-267 deleted a handler on 2026-07-11 that a test still required).

  Separately, `bl1358MutantTimeCeiling.test.js`'s `mkFixture` sweeps every
  `bl1358-ceiling-*` root in the temp dir before each fixture, so a
  second run started at the same time deletes the first run's fixture
  (ENOENT on `c.test.js`, seen 2026-10-06 while coder@2 ran the same
  directory). Once the directory runs on every role's lane, that race is
  routine.

  ## What is wanted

  - The directory runs in a lane QA's gather runs, and a failure in any of
    its files fails that lane and names the file.
  - BL-1358's ceiling test reaps only roots no live run owns (an owner pid
    that is dead, or an age bound), per the Test Speed And Isolation rule.

  ## How (direction, not mandate)

  - The cheapest seam is the script `npm test` already runs
    (`extension/scripts/recordTestDuration.js`): one `node --test` run of
    the directory after vitest, its exit status folded into the script's.
    That adds about 21 s. If the coder finds a better seam inside QA's
    gather (`extension/src/...`), that is production TypeScript and needs
    the hardener; send the specifier a note first.
  - `specs/pipeline/steps/lib/fixtureReaper` and the BL-1385/BL-1390 fixes
    are the precedent for owner-aware reaping.
  - The step handler builds its fixture lane under mkdtemp for scenario 02;
    scenario 01 reads the real lane definition on the parcel commit.

