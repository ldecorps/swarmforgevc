description: |
  ## What

  Outside/IDE work landed in the dirty master tree to soften Bubble tunnel
  revive pain (bridge bounce → auto new-session; keep Cursor Remote up across
  ancillary stop). It has no ticket, no acceptance contract, and no pipeline
  review. Tonight the phone still died on a **stale quick-tunnel hostname**
  until a human pasted the live base URL — proving bounce-meta does not
  substitute for BL-716 discovery.

  ## Why stamp this now

  Per BL-506, ticket-less functional work must be retroactively ticketed or
  reverted. Per BL-709's adopt fork, the cheap honest path is adopt + review,
  not a silent commit past QA.

  ## Scope (this ticket)

  - Adopt the uncommitted Android meta/bounce-session path and finish the
    missing bridge `GET /lets-talk/meta` so the client is not calling a ghost.
  - Adopt / verify the Cursor Remote always-on start/stop contract in the
    ancillary scripts (compose with BL-762's bedtime matrix; do not fork a
    second teardown).
  - Record the 2026-07-31 hostname pair in evidence/notes.

  ## Out of scope

  - App discovery of new trycloudflare hostnames, deep links, named tunnels
    (BL-716)
  - Full finish-shift bedtime verb (BL-762) beyond the always-on pieces already
    in this dirty tree
  - Claiming operational paste fixed the product

  ## STEERING note

  Human-requested stamp/adopt. Queue-jump so it does not rot under pilot-process
  volume, but do not displace priority-0 BL-727…BL-757 evidence-gate work unless
  the human says so.

acceptance: specs/features/BL-763-bubble-tunnel-hand-fixes-swarm-stamp.feature

