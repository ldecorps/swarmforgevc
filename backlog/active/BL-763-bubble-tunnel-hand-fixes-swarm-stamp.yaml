notes: |
  ## 2026-07-31 master-diff review — adopt scope confirmed, two more files land here

  The full 83-entry dirty tree was reviewed and split across tickets. This
  ticket's adopt scope is judged right as written, not too wide, and it gains
  two files no other ticket owns:

  - `swarmforge/scripts/swarm_ensure.bb` — `ensure-cursor-bridge!`, the
    supervisor pid file and health predicate, so `./swarm ensure` repairs
    Cursor Remote the same way it repairs the front desk.
  - `swarmforge/scripts/operator_runtime.bb` — the Cursor Remote supervisor
    liveness and heartbeat-freshness checks (120s stall window, matching
    `cursor_bridge_supervisor.bb`).

  Both are "keep Cursor Remote up", which is this ticket. Siblings from the
  same review, deliberately NOT folded in here: BL-764 (shared-token inbound
  fan-out and bridge liveness cue), BL-765 (Bubble remote config and hold-music
  catalog), BL-766 (half-retired Mini App Let's Talk).

  e2e on phone (manual until Android-seam policy from BL-761): with Bubble
  paired to a LIVE base URL, bounce the headless bridge; confirm one
  new-session after instanceId changes and turns still work. Separately,
  with a DEAD hostname in prefs, confirm DNS error still surfaces (BL-716) —
  this ticket must not paper over that.

  Specifier: if adopt scope is judged too wide, split script always-on into
  BL-762 and keep this ticket meta-only — say so in an amend, do not silently
  widen BL-716.

  ## 2026-07-31 evening — STT "not configured" (ops, no product code land)

  After hostname re-pair, Bubble still got `speech-to-text is not configured`
  while recording. Diagnosis: port 8765 is owned by **front-desk-supervisor**
  (not bridge-headless-supervisor). `bounce_bridge_headless.sh` only re-arms
  the front-desk bridge child; that child inherits the supervisor's env.
  Front-desk supervisor pid had **no** `LETS_TALK_*` / `WHISPER_*` —
  `launch_front_desk.sh` does not source `.swarmforge/swarm.env`, and
  `spawn-bridge!` only injects `BRIDGE_TOKEN`.

  Recovery tonight: stop front desk, relaunch `launch_front_desk.sh` with
  `swarm.env` sourced (+ Telegram creds). Whisper paths present; adapters
  resolve; voice works. **No extension/android/script source was edited for
  this recovery.** Durable fix belongs in this parcel or a sibling: make
  `launch_front_desk.sh` (or `spawn-bridge!`) forward Let's Talk audio env
  the same way `start_bridge_headless.sh` / `bridge_headless_supervisor.bb`
  already do.

  ## 2026-08-13 spec amendment (coder note: required_wiring malformed, BL-874 class)

  All four original required_wiring entries failed to resolve at the
  pre-QA gate (BL-874 discipline: a `path::pattern` entry's path must be a
  single real file the gate can `git show <commit>:<path>`, checked at the
  cited commit). #1's path "extension bridge lets-talk routes" and #2's
  "android BridgeClient.fetchBridgeMeta + TalkEngine.syncBridgeInstanceAndSession"
  and #3's "swarmforge/scripts start_ancillary / start_cursor_bridge /
  stop_ancillary" are prose area descriptions, not literal files — none
  exist on disk. #4's path was real (the feature file) but its pattern
  "acceptance" appears nowhere in the file's text. Re-anchored to six
  entries, each a real single file this parcel writes/touches with a
  pattern guaranteed present in it (mirrors BL-721/dc8fa3296's fix). No
  scope change — same six integration points the original prose named,
  just literal now. operator_runtime.bb's Cursor Remote liveness sweep
  (also requested in the 2026-07-31 review notes above) stays in scope for
  this parcel but is not separately wiring-gated, same posture BL-721 took
  toward files touched beyond its 3 wiring entries.

  By specifier.
