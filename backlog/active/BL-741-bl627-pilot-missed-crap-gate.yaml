description: |
  ## What

  Three of BL-723's own seats (coder, cleaner, architect) reviewed
  BL-627's landing in real depth — structure, invariant-encoding,
  dependency direction — and all three judged it on-par. None checked
  test coverage completeness or ran the project's CRAP tool
  (`scripts/crapReport.js`) against the new `collectReferencedClaudeModels`
  function, which lands at CRAP=10.89 (see BL-740).

  This is the same gap class BL-723's own required_stages exists to close:
  `mutation_cost: low` on BL-627 likely meant the original pilot skipped
  or lightly weighted the hardender-equivalent step for this ticket. But
  "low mutation cost" is about the CHANGE's size, not about whether the
  new code's coverage should go unchecked entirely.

  ## Question to answer

  Should a pilot (or a live pipeline pass) treat `mutation_cost: low` as
  license to skip the CRAP gate outright, or should CRAP still run — just
  scoped to the actual changed files, which is cheap regardless of
  mutation cost? The pilot missed running that gate here; harden `/pilot`
  (and this project's own hardender-role guidance) to make explicit that
  CRAP is a separate, always-run gate from mutation testing, never bundled
  under the same low-cost exemption that let this landing's coverage gap
  through uncaught.

qa_e2e_procedure: >
  (1) Pilot fixture ticket mutation_cost low with touched TS file — land gate
  runs scoped CRAP. (2) Fixture with CRAP>6 on touched function — land refused,
  yaml unmoved. (3) hardender.prompt contains CRAP/mutation_cost separation.
  (4) CRAP pass alone does not force land if other gates fail. Live: /pilot on
  low-cost ticket runs crapReport on touched paths before backlog/done.

source: |
  Found during BL-723 (pilot-tonight quality review), hardender viewpoint
  pass, 2026-07-30. Companion remaining-work ticket: BL-740.

specifier_decisions: |
  Minted 2026-08-26 per coordinator route. Five scenarios: low mutation_cost still
  runs scoped CRAP; CRAP violation refuses land; hardener prompt separation;
  CRAP pass non-blocking alone; refused land writes nothing durable. Answer to
  ticket question: CRAP always runs scoped to touched files — never skipped for
  mutation_cost low. Code fix for collectReferencedClaudeModels remains BL-740.

