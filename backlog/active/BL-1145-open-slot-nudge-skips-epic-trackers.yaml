description: |
  ## What is wrong

  Open-slot nudge/escalation (BL-798 / BL-963) names top candidates via
  promotion_gates_lib/evaluate, which has no type: epic refusal. Meanwhile
  promote_and_route_next.sh correctly refuses epics (is_epic_type). After
  BL-1100 removed prose do-not-promote greps, epic trackers like BL-545
  (priority 30) win the nudge forever; the slot stays open; escalation fires
  once then goes quiet on the same epic candidate.

  ## Locked mechanism (specifier)

  Add a structured `type: epic` (and `status: blocked` if promote already
  skips it) refusal to `promotion_gates_lib/evaluate` so every consumer of
  the chain inherits it (BL-663: one chain). Prefer this over a
  nudge-only filter that can drift from promote.

  ## Out of scope

  - Promoting BL-545 or minting its children
  - Changing Article-3.2.4 / BL-900 ranking among real tickets
  - Silencing escalation without fixing candidacy
  - QA push-race intake (BL-1144)
