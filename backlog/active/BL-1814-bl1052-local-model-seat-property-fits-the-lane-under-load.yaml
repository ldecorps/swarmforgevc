description: |
  ## What is wrong

  QA note 003419, evidence b882b377c6 (BL-1795's pass, full property
  lane on f3f4f29b70):
  `test/bl1052LocalModelSeat.property.test.js > BL-1052/BL-654:
  local-model seat invariants hold (bb property runner)`:
  `Error: Test timed out in 20000ms.` No register row and no open ticket
  (only closed BL-1052, BL-1081 and BL-1486 name the file), so it is
  unowned and holds BL-1795.

  The test spawns `bb swarmforge/scripts/test/bl1052_local_model_seat_property_runner.bb`
  once, with `PROPERTY_RUNS=80` and `PROPERTY_LAUNCH_RUNS=16`. The child
  spawn carries `timeout: 180000`, but the vitest test declares none, so
  it runs under `vitest.properties.config.mjs`'s `testTimeout: 20000` and
  vitest kills it first.

  Measured at mint (2026-09-29, main 7d124ad08d, alone, load ~16): green,
  9611 ms. Under full-lane contention 2-3x that crosses 20 s.

  ## What is wanted
  - The test completes inside the full property lane under contention.
    How (direction, not mandate): BL-1808's shape (landed 453077f16d), a
    per-test budget through `propertyLaneTimeoutMs(<base>)` with the base
    taken from a quiet-host measurement plus stated headroom, never below
    today's 20 s. Say in the evidence which base and why.

  ## Scope
  - `extension/test/bl1052LocalModelSeat.property.test.js`, plus evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `cd extension && npx vitest run --config vitest.properties.config.mjs test/bl1052LocalModelSeat.property.test.js --reporter=verbose`:
     green; record the duration and the 1-minute load. At mint: 9611 ms
     at load ~16.
  2. QA's ordinary full property run on this parcel: the file does not
     appear among the failures.
  3. `node specs/pipeline/cli.js specs/features/BL-1052-a-role-seat-can-be-staffed-by-a-downloaded-local-model.feature`:
     9 of 9 ok (as measured on main at mint, 18.2 s).
  4. `git diff main...HEAD --name-only` names only the test file and
     evidence.
  5. After landing: REGISTER_ROW_RETIRED for this ticket's property row.

