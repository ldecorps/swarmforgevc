id: BL-1795
title: "The land step treats a closed owner's pre-land draft as a stray even when its owner's own tip-pure land already accounted for it (the draft is an ancestor of an approved tip the owner's abandoned_commits names): a rewritten draft conflicts and escalates the whole land (closed BL-1779's 368d1569e5 forced BL-1655's hand build on 2026-09-29, on a Specification.MD path BL-1655 also edits, outside BL-1787 and BL-1794), and a removed draft would re-add dropped lines; the step records such a stray LAND_STRAY_SUPERSEDED with the reason ancestor-of-owner-abandoned and never cherry-picks it"
