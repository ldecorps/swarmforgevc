id: BL-982
title: "A pipeline stage can host a second seat: split SEAT identity (session, worktree, launch script, model) from STAGE identity (parcels, metrics, prompt file), so one swarm can run a Sonnet coder and a Fable coder"
milestone: M8
type: feature
status: todo
epic: multi-seat-stages
human_approval: approved
priority: 25
direction: human-requested
depends_on: []
mutation_cost: high
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-982-second-seat-of-a-stage-boots-with-its-own-model.feature

invariants:
  - "STAGE and SEAT never leak into each other's keyspace: nothing derived from a seat id ever reaches a parcel address, a stage-dwell/metrics key, or a prompt-file lookup, and nothing derived from a stage name is used to name a session, worktree, branch, launch script or claim."
  - "A pack declaring exactly one seat per stage provisions byte-identically to before this slice - the live pack must not change shape as a side effect of the capability existing."
  - "A seat beyond the first is INERT in this slice: it is never delivered a parcel and never claims one, so a half-built multi-seat pack cannot silently drop or double work."

description: >
  What: let a pack declare more than one SEAT for the same pipeline STAGE, and
  give each seat its own session, worktree/branch family, launch script,
  remote-control name and model - while parcels, metrics and prompt files keep
  keying on the stage. The motivating shape is a Sonnet coder and a Fable coder
  in one swarm.

  Why: stage-dwell already names bottleneck stages and the coordinator's Swarm
  Optimizer already recommends "add a role instance", but no machinery makes
  that real. The only horizontal-scale path today is a full secondary swarm
  (BL-090/091) - a whole pipeline clone when the constraint is one stage.

  Why this is one slice and not two: per-seat model needs NO new machinery.
  Each `window` line already carries its own --model/--effort through
  extra_args -> extra_cli (swarmforge.sh:505-525; the live conf's seven window
  lines each declare a model at :291-297). Once two window lines for one stage
  are allowed, heterogeneous models follow for free. What blocks it is identity,
  all keyed on the role NAME: the ROLE_INDEX duplicate guard (:550-553), the
  WORKTREE_INDEX guard (:555-558), the `$ROLES_DIR/$role.prompt` lookup (:575),
  the underscore ban on role names (:534), and the session / launch-script /
  remote-control / worktree derivations.

  Deliberately vertical but narrow: the second seat BOOTS and sits idle.
  Delivering work to it is the next slice, so the guard relaxation and the
  provisioning land together and there is never a state where a pack parses two
  seats that provisioning would collide on.

  How (direction, not mandate): give every seat an explicit seat id that today
  equals its stage name, derive the identity set from the seat id and the prompt
  lookup from the stage, and relax the duplicate guard from "one row per stage"
  to "one row per seat id" while keeping the duplicate-worktree guard as-is.
  Seat-id syntax is the implementer's call within one constraint: role names may
  not contain underscores today (:534), so a separator must be chosen that
  survives a tmux session name, a directory name and a git branch name alike.

constraints: >
  Firm lines:

  - Generic, never coder-specific. No stage name may be hard-coded as the
    multi-seat one; coder is only the first exercised instance (intake human
    decision 4).
  - No auto-scaling. A seat is added because a human edited the pack or ran an
    explicit command - stage-dwell does not spawn anything here (decision 1).
  - Downstream vocabulary is untouched: `to: coder` still addresses the stage,
    PIPELINE_ORDER, promotion route-target, bounce/QA enums and the board keep
    their closed stage set. A seat id must never appear in a parcel.
  - The live swarmforge.conf keeps one seat per stage in this slice. Standing up
    a second live coder is an operator act, not part of the deliverable.
  - Mailbox, claim, routing and difficulty awareness are all OUT - next slices.
  - Mono-router interaction is explicitly deferred: this targets standing packs.
  - coordinator stays reserved infrastructure (BL-243) and is not seatable here.

qa_e2e_procedure: >
  1. Scenarios 01 and 05: run the pack parser over fixture confs - a two-seat
     stage parses; a repeated seat id and a shared worktree each still fail with
     a message naming the collision.
  2. Scenarios 02-03: provision from a fixture pack declaring two seats of one
     stage on two different models; assert two distinct sessions, worktrees and
     launch scripts, that both launch scripts resolve the SAME stage prompt file,
     and that each launch command carries the model from its own window line.
  3. Scenario 04: provision from the live single-seat pack shape and diff the
     generated identity set against the pre-change output - it must be identical.
  4. Scenario 06: deliver a parcel addressed to the stage and confirm the second
     seat's mailbox stays empty and it claims nothing.
  5. Live confirmation: none in this slice - do NOT stand a second seat up in the
     live pack to verify. Fixture packs only.

notes: >
  Source: operator intake .swarmforge/operator/INTAKE-duplicate-bottleneck-seat.md
  and its Addendum, SPLIT 1:N under Consolidation Authority into the BL-981 epic,
  this slice, and BL-983. The intake's own suggested split of "identity/roster"
  from "per-seat model/launch profile" is deliberately NOT followed - the probe
  above shows per-seat model is already carried by the window line, so keeping
  them apart would have minted a second ticket with nothing in it. The epic
  records that correction.

  The human's verbatim words are preserved on the epic (BL-981), which is the
  ticket that carries the whole directive; this slice carries the half it builds.

  Size risk, stated honestly: this is the largest slice of the epic
  (mutation_cost: high) because the identity derivation is spread across the
  parse loop, provisioning and the launch-script writer. It is ONE concern -
  seat-vs-stage identity - which is why it is one ticket. If it proves larger
  than one sitting once the call sites are counted, bounce it back for a split
  along the parse / provision line rather than growing the parcel.

approval_context: >
  Two things to confirm. FIRST, the slice boundary: the second seat boots but is
  inert - it receives nothing until BL-983. The alternative was to relax the
  parse guard first and provision later, which was rejected because it leaves a
  window where a pack parses two seats whose sessions and worktrees would
  collide. SECOND, that per-seat model is in scope HERE rather than as its own
  ticket: your addendum said model choice is "part of the same epic, not a
  follow-up", and the probe found it needs no new machinery, so it rides this
  slice at no extra cost. Difficulty-aware load balancing - the other half of
  your addendum - is a later slice and needs one decision from you: when the
  seat whose model tier matches the ticket is busy and a different-tier seat is
  idle, should the ticket WAIT for the right seat or SPILL to the idle one?
