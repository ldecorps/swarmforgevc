description: |
  ## Amended 2026-10-01 (specifier): the first premise was wrong

  As minted, this ticket wrote `context.autoCompactThreshold: 0.8` into the
  seat's qwen settings. The hardener proved with qwen's own `--debug` log
  that the key changes nothing at 49152, and the coder confirmed it from
  qwen's source (evidence on the coder branch:
  `backlog/evidence/BL-1840-hardener-bounce-20261001.md`,
  `backlog/evidence/BL-1840-coder-20261001-bounce-response.md`). At 32768
  qwen's default share (85%, 27,852 tokens) already compacts later than
  0.8 would, so the key would only make it compact sooner. Remove it.
  Specifier's adjudication: `backlog/evidence/BL-1840-bounce-20261001.md`.

  ## What happens

  - qwen 0.24.7 `computeThresholds(window, pct)` (installed
    `chunks/chunk-TGWAQ5RB.js`): `auto = min(pct * window, window - 20000
    - 13000)` when `window - 33000 > 0`, else `pct * window`; `pct`
    defaults to 0.85. `COMPACT_MAX_OUTPUT_TOKENS = 2e4` and
    `AUTOCOMPACT_BUFFER = 13e3` are fixed: no settings key, no env var.
  - So the trigger falls from 27,852 at 32768 to 0 at 33,001, then climbs,
    and does not reach 27,852 again until 60,852. coder@iq3 at 49152 got
    16,152, which matches the ~17,500 it compacted at on 2026-09-30, with
    a first turn of about 12,500 tokens of fixed overhead.

  ## What is wanted

  1. `local_model_window_gate_lib.bb` computes qwen's trigger for the
     served window it already learns, and flags a window whose trigger is
     below the trigger at 32768 (scenario 01). A window it cannot learn is
     never flagged, as today.
  2. A flagged window is refused, naming the window, its trigger, 32768
     and 60852 (scenario 02), with the existing
     `SWARMFORGE_LOCAL_WINDOW_OVERRIDE` letting it start. If the human
     rules B (warn), scenario 02 instead asserts the launch goes ahead
     with that warning; the specifier amends it on the ruling.
  3. The gate's formula is proven against the pinned qwen: its `--debug`
     compaction line reports the same trigger (scenario 03). That run is
     also what turns red if a qwen update changes the constants.
  4. The settings writer no longer writes `context.autoCompactThreshold`.

  ## How (direction, not mandate)

  - The constants (0.85, 20000, 13000, the 32768 reference) live once in
    the gate lib, each with a comment naming qwen's own variable.
  - Scenario 03 reuses the hardener's method: a throwaway HOME, a loopback
    fake endpoint whose `/api/show` reports `num_ctx`, and qwen's
    `[compaction] cheap-gate ... auto=<n>` debug line. Measure its runtime
    and state it in the evidence; it must fit the per-mutant ceiling
    (300 s, BL-1541). Never the live Ollama, never the operator's ~/.qwen.
  - Step handler `specs/pipeline/steps/bl1840QwenCompressionThresholdSteps.js`
    (the name the wiring pin already carries), registered in the same
    commit as the feature's first green run (BL-233).

  ## Scope

  `local_model_window_gate_lib.bb` and its runner, the settings writer in
  `swarmforge/scripts/swarmforge.sh` (removing the key), the step handler,
  evidence, and the documenter's page on how a local-model seat's window
  is chosen (`docs/how-to/BL-1052-local-model-seat-launch.md`).

out_of_scope: |
  - Comparing the seat's estimated first turn against qwen's trigger
    rather than the window (a first turn of 12,500 tokens under a 16,152
    trigger compacts every turn even outside the dead zone). Worth its
    own ticket once this gate reports the trigger.
  - Choosing coder@2's window. It is 32768 today, outside the zone.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1840-a-local-model-seats-qwen-compresses-only-when-the-history-nears-the-served-window.feature`:
     7 of 7 ok (four rows of 01, then 02, then two rows of 03). Measured 0
     on main at amendment: no handler on main.
  2. `bb swarmforge/scripts/test/local_model_window_gate_lib_test_runner.bb`
     and `bash swarmforge/scripts/test/test_local_model_window_gate_cli.sh`:
     ALL PASS.
  3. `bash swarmforge/scripts/test/test_bl1829_local_model_qwen_settings.sh`:
     ALL PASS, with no `autoCompactThreshold` in the written settings.

