  - 'specs/pipeline/steps/bl1840QwenCompressionThresholdSteps.js::registerSteps::the handler lands in the same parcel as the feature (BL-233, BL-1371)'

human_approval: pending
ruling_options:
  - A - refuse the launch, with SWARMFORGE_LOCAL_WINDOW_OVERRIDE=1 to start anyway (recommended)
  - B - warn in the launch log and start the seat anyway
ruling_tradeoffs:
  - Pros - a seat never starts in a window that compacts every turn, as coder@iq3 did for a day, and the gate already refuses a window the first turn cannot fit, with the same override. Cons - a window picked for another reason needs the override. Recommended because the dead zone has no upside, a 32768 window gives more history before compaction for less memory.
  - Pros - never blocks a launch. Cons - the warning sits in a launch log nobody reads while the seat compacts every turn, exactly how coder@iq3 ran on 2026-09-30.
approval_context: >
  Re-pended on 2026-10-01: the auto-approved mint (15d1cd9cc6) promised a
  fix that cannot work. Its FIRM line, that qwen never compresses below 80%
  of the served window, is impossible at any window from 33,001 to 165,000
  tokens: qwen 0.24.7 compacts at the smaller of the 85% share and the
  window less 33,000, and no setting moves the 33,000 (coder and hardener
  evidence, confirmed in qwen's source by the specifier). FIRM now: the
  launch's window gate computes that trigger for every local-model seat
  and flags each window from 33,001 to 60,852 tokens, where it is below
  what a 32768 window gives; the proof still runs the pinned qwen. The one
  question is what a flagged window does at launch.

invariants:
  - "The window gate flags exactly the served windows whose qwen compaction trigger is below the trigger a 32768-token window gives."
  - "The trigger the gate reports for a window equals the one the pinned qwen computes for it."

source: |
  The human, 2026-09-30, specifier pane, verbatim:

  > Get the swarm to process your iq3 hot fix. It's ptobably not fi ished yet and I want the swarm to fully master the utilisation of local models.

  Measured by the specifier the same afternoon; see
  `backlog/evidence/coder-iq3-reliability-20260930-specifier.md`
