id: BL-1840
title: "A local-model seat's qwen compacted its chat on nearly every turn because the seat was served a window in qwen's compaction dead zone - qwen compacts at the smaller of 85% of the window and the window less 33,000 tokens (fixed inside qwen), so coder@iq3's 49152 compacted at 16,152 tokens, sooner than the 27,852 a 32768 window gives, and no qwen setting moves it; the launch's window gate computes qwen's trigger for each local-model seat's served window and flags every window from 33,001 to 60,852 tokens"
milestone: M8
type: defect
severity: medium
# medium (was high at mint): the live fault ended when coder@iq3 was retired
# on 2026-10-01; the local seat now, coder@2, is served 32768, outside the
# dead zone. This guards against serving a seat that window again.
status: todo
epic: local-llm-swarm
priority: 2
direction: queue-jump
depends_on: [BL-1838]
# BL-1838 built the served-window read this gate reuses.
mutation_cost: low
# low: one rule in local_model_window_gate_lib.bb (bb, no mutation lane)
