description: >
  BL-967 landed (QA pass a5ecfc281, main 2026-08-20T05:44:55Z; closed
  999b9fe72) with its qa_e2e step 3 explicitly recorded by QA as
  "owed, not passed" - by its own wording it is only runnable AFTER
  the parcel lands and the daemon restarts on it (QA evidence
  backlog/evidence/BL-967-qa-pass-20260820.md: "Whoever observes the
  daemon after this lands should check those two files"). The
  documenter flagged that no ticket tracked the owed observation
  (note 20_20260820T054749Z_000227); this chore is that tracking
  artifact. Step 4 (BL-789's slow-but-healthy posture preserved) is
  the same observation's other half and rides along.

  The work (verification only - no code): observe a 30-minute window
  of post-fix daemons and record the verdict in an evidence file
  this ticket's acceptance scenarios gate. PASS: zero new handoffd
  entries in .swarmforge/daemon/freshness-incidents.log in the
  window, handoffd.log showing completed heartbeat cycles (boundary
  lines appear on heavy cycles only), and no kill of a
  legitimately-slow 120-232s cycle. FAIL: any handoffd freshness
  restart or attributed in-cycle timeout in the window - then
  BL-967's own step-3 branch applies: the G6 timeout line names the
  guilty sweep and call; record that as the identified cause and
  mint the follow-on defect naming it.

  Window facts (CORRECTED at mint+6min by the coordinator's
  independent precondition check, evidence commit 9fe9d3a74, and
  re-verified by the specifier): the daemon runs from the MASTER
  checkout's local main, which at 05:50Z was 27 commits BEHIND
  origin/main and did NOT contain the fix - the 05:50:19Z daemon
  (pid 96980) loaded PRE-fix code (running sha 22544178a), despite
  the fix being on origin/main since 05:44:55Z. The specifier's
  original pin of that daemon as post-fix was WRONG (the
  local-main-lags-origin lesson, live). Local main took origin/main
  by ~05:56Z (a5ecfc281 now an ancestor; cycle-guard code present
  in the checkout). The soak window therefore opens at the FIRST
  handoffd start in daemon-start-audit.log AFTER the local-main
  merge that brought in a5ecfc281 - QA must pin that start (and,
  where determinable, verify the running daemon's loaded sha
  post-dates the fix) rather than trusting any earlier pin. Every
  restart before that point - including 05:26:40 / 05:38:01 /
  05:44:02Z and the 05:50 flap - killed or started PRE-fix daemons
  and must NOT count against the soak. The observation is log-based
  and retro-evaluable: freshness-incidents.log and
  daemon-start-audit.log persist across restarts; handoffd.log
  truncates per restart, but a truncation implies a restart, which
  the persistent logs already witness.

  Also observed at mint, NOT this chore's scope: the fresh daemon's
  first cycle opened with a 12-line chase-wake-skip-busy burst
  across four roles in ~6 seconds - that is BL-970's classifier
  surface (pending approval), recorded here only so the soak
  reviewer does not mistake skip-busy noise for a stall by itself.

constraints: >
  - Verification only: this chore changes no code, no config, no
    daemon state. It reads logs and writes one evidence file (plus
    the follow-on mint request if the verdict demands one).
  - Routing (coordinator): required_stages is [qa] - route this
    directly to QA; there is nothing for coder/cleaner/architect/
    hardender/documenter to do, and the verdict authority is QA's
    (it recorded the debt). If direct-to-QA routing is unsupported
    on this pack, route to QA via a Work note rather than walking
    the full chain.
  - Do not re-litigate BL-967's gates: they all ran and passed; only
    steps 3-4 were owed.
  - Pre-fix incidents (the 05:26/05:38/05:44Z restarts) are context,
    never counted in the window.

qa_e2e_procedure: >
  AMENDED 2026-08-22 (specifier), after QA's BLOCKED verdict
  (evidence f8e61157b). The 2026-08-20 window this procedure used
  to name is UNRECOVERABLE - both daemon-start-audit.log and
  freshness-incidents.log have rotated past it, .swarmforge/ is
  gitignored, and no backup exists. Do NOT reconstruct it, and do
  NOT round the coordinator's surviving secondary observation
  (a ps-derived uptime approximation, plus one incident its own
  author flagged as undated and ambiguous) into a primary-source
  PASS. The debt BL-967 recorded was never "that particular
  half-hour"; it was "observe the landed fix on a live daemon".
  That is still observable, and on a BETTER primary source than
  the one the original steps assumed.

  1. Pin the window from .swarmforge/daemon/handoffd-build.json:
     it carries the RUNNING daemon's own build_sha and started_at,
     which is a direct answer to "is this daemon post-fix?" that
     daemon-start-audit.log cannot give (the audit log records
     starts, never the loaded sha - the exact gap that let the
     05:50Z PRE-fix daemon be mispinned as post-fix at mint).
     Confirm post-fix with:
       git merge-base --is-ancestor a5ecfc281b <build_sha>
     A daemon whose build_sha fails that check is NOT eligible;
     wait for the next start and re-read the file.
  2. Confirm the swarm was ACTIVE across the window (roles working,
     parcels moving). An idle window proves little - if the swarm
     was quiet, extend or pick a later 30-minute active stretch
     inside the same daemon's uptime.
  3. Read freshness-incidents.log for entries whose epoch falls in
     the window AND whose field is daemon=handoffd. The file is
     SHARED: babysitterd writes its own entries (daemon=babysitterd,
     with swarm= and reason= fields). Only daemon=handoffd lines
     count toward this soak; babysitterd lines are noise here.
     Zero handoffd entries -> PASS half 1. Any entry -> FAIL path.
  4. Read handoffd.log (current daemon) for completed heartbeat
     cycles; on heavy cycles, per-sweep boundary lines. An
     attributed timeout line names sweep+call -> record as the
     identified cause and request the follow-on mint.
  5. Step-4 half: confirm no kill of a slow-but-healthy cycle
     (120-232s legit range, BL-789) occurred in the window.
  6. Write backlog/evidence/BL-975-soak-<date>.md with: the
     daemon's build_sha and the ancestry check's output, window
     start/end epochs, pid observed, handoffd-only incident count,
     cycle evidence, and verdict PASS or the attributed cause plus
     the follow-on ticket id requested from the specifier.
     This file, judged by you, IS the contract - there is no
     executable acceptance gate (see the acceptance draft's header
     and finding-2 disposition in notes).

  Classification hint, not a verdict: the log's handoffd entries
  come in two shapes - age_secs=999999999 (a sentinel meaning no
  heartbeat file was found at all) and a real elapsed age such as
  age_secs=4080. They are plausibly different failures, and
  BL-967's cycle guard speaks to the second. If the window is not
  clean, say which shape you saw rather than pooling them.

  Live facts at amendment time (2026-08-22T20:10Z), given so you
  can start immediately - re-derive them yourself, do not trust
  this paragraph as the evidence: handoffd pid 1858730 running
  since 2026-08-22T19:18:07Z (epoch 1787426287) on build_sha
  fb1acf132a71596b4706c0b2c5530e4b0185943f, which the ancestry
  check above confirms is post-fix; zero daemon=handoffd entries
  at or after that epoch (the most recent is 2026-08-22T11:34:01Z,
  on an earlier daemon whose loaded sha is no longer determinable).
  A full 30-minute window inside that uptime is therefore already
  available and already looks clean - steps 2, 4 and 5 are what
  remain to actually judge it.

notes: >
  AMENDMENT 2026-08-22 (specifier), disposing QA's BLOCKED verdict
  (note 00_20260822T200644Z_000899, evidence f8e61157b). QA was
  right to refuse both PASS and FAIL, and right to route this as a
  spec gap rather than a parcel. Two findings, two dispositions:

  FINDING 1 (the 2026-08-20 window is gone) - RE-TARGETED, not
  closed. Neither of the two options QA offered is taken. Accepting
  the secondary evidence as a PASS would launder a ps-derived
  approximation and an admittedly-undated incident into a
  primary-source claim, which is the failure mode "a green suite is
  not evidence" names; QA declining to do that was correct. But
  closing this "undeterminable" is worse than it looks: it would
  leave BL-967's cycle-guard fix with NO live observation at all,
  which is precisely the debt the documenter flagged and this chore
  exists to discharge. The debt's value was never tied to that
  date. So the window is re-pinned to any 30-minute active stretch
  on a daemon whose OWN build_sha is confirmed post-fix - see the
  amended qa_e2e_procedure. This is not a lower bar than the
  original: handoffd-build.json answers "did this process load the
  fix?" directly, where daemon-start-audit.log only ever recorded
  that a start happened - the gap that produced the mispin the
  coordinator had to correct at mint+6min.

  FINDING 2 (no step handler under required_stages [qa]) - the
  ticket carries NO executable acceptance gate, by decision. Not
  "a handler is owed to someone": there is no honest one to write.
  The scenarios gate an evidence markdown's prose, so a handler
  could only assert that certain words were written - fake
  acceptance, green while the observation may never have happened.
  A handler reading the real logs instead would have to touch
  .swarmforge/daemon/*.log, a live runtime path acceptance handlers
  are forbidden to read, and would rot at the next rotation - the
  very failure that blocked this ticket. Adding a coder stage would
  buy only the first of those. The feature file is therefore parked
  as specs/features/BL-975-...feature.draft (retired, never to be
  wired; its header says so), acceptance: points at the draft, and
  the qa_e2e_procedure is the operative contract. required_stages
  stays [qa] - the human already said the word on qa-only routing
  in approval_context, and finding 2 does not change that call.

  human_approval left at approved deliberately: the approved
  substance ("run BL-967's owed observation and record the
  verdict") is unchanged. What changed is which daemon is observed
  and the removal of a gate that could never have been honest.
  Flagged to the human in the coordinator note rather than by
  flipping the field, which would strand an active ticket.

  Not recorded via record-bounce.js: no producing role was blamed
  and none exists to blame under required_stages [qa]; QA's
  evidence file is the durable record.

  Source: documenter note handoff 20_20260820T054749Z_000227
  ("BL-967 qa_e2e step 3 (30min live soak) recorded OWED by QA; no
  ticket tracks it"), sent to specifier + coordinator. QA's own
