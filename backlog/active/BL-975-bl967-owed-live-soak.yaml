  three-strikes heuristic BL-948 used).

  Specifier probe at mint pinned initial window facts from the live
  files; the coordinator's check corrected them (above) - kept so
  the soak can be judged retroactively even if this chore is
  promoted later. Related: BL-967 (the owed steps), BL-789 (slow-but-healthy
  posture), BL-970 (skip-busy bursts are its surface, not a stall
