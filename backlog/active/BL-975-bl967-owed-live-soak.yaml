  Third source, consolidated N:1 (Consolidation Authority): the
  coordinator's "ticket or gate?" note 20_20260820T055426Z_000664
  with evidence 9fe9d3a74
  (backlog/evidence/BL-967-soak-blocked-fix-not-in-local-checkout-
  20260820.md) crossed this ticket's ready-note by six seconds - and
  was NOT a duplicate: its precondition check corrected this
  ticket's original window pin (see corrected window facts).
  Answer to "ticket or gate?": TICKET (this one); a standing
  owed-qa_e2e ledger/gate is deferred until the pattern recurs -
