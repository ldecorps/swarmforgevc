     times -> `ALL PASS`, exit 0.
  2. `git diff main...HEAD -- swarmforge/scripts/chase_sweep_lib.bb` is
     empty; `git diff main...HEAD --name-only` names the shell test, the
     handler, `specs/pipeline/steps/index.js`, the feature, evidence, and
     the register-row removal.
  3. `bb swarmforge/scripts/test/dispatch_gap_test_runner.bb` still exits 0.
  4. Break-then-restore: change the fixture's `assigned_to: coder` to
     `assigned_to: cleaner`; case 01 fails naming the assignee; restore.
  5. The row for this file is gone from `backlog/standing-reds.tsv`.

