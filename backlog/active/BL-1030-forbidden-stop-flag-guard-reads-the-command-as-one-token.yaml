id: BL-1030
title: "The expeditor's forbidden-stop-flag guard is vacuous in production: `stop-stack!` passes the whole configured command as ONE token, so `EXPEDITE_STOP_CMD=./stop-swarm.sh --sweep-inbox` sails through the set-membership check and archives exactly the parcels a parked ticket needs to resume"
milestone: M8
type: defect
severity: high
# high, not critical: the default (./stop-swarm.sh, no flags) is safe, so
# nothing is down and it needs an operator to configure a flag on a documented
# knob. But when it does fire it silently defeats a guard that exists for one
# purpose and that the manual presents as in force - a broken safety signal,
# which is the high bar. Not medium: --sweep-inbox archives every role's
# pending handoffs, which is unrecoverable parcel loss, and it happens during
# a run whose whole premise is that parked work resumes afterwards.
status: todo
epic: swarm-reliability
priority: 55
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1030-forbidden-stop-flag-guard-reads-the-command-as-one-token.feature

human_approval: approved
approval_context: >
  Needs sign-off on ONE decision: what the guard does with a command line it
  cannot read confidently - a compound command, a pipeline, an unbalanced
  quote. The direction below is to fail CLOSED (refuse and name the command),
  on the grounds that a guard whose whole job is to prevent an unrecoverable
  sweep should not admit input it does not understand. The alternative is to
  fail open for unreadable commands and guard only the simple case, which
  keeps a documented escape hatch for an operator with an exotic stop command.
  What is firm either way: a plain `./stop-swarm.sh --sweep-inbox` must be
  refused, a target path that merely spells a flag as a substring must not be,
  and the decision must happen before anything is parked.

invariants:
  - "Every forbidden flag that would reach the shell as its own token is refused, and no token that merely contains one as a substring is refused."
  - "A configured stop command the guard cannot tokenize is refused, never admitted - the guard fails closed."
  - "A refusal changes nothing: no ticket has been parked and the stop command has not run."

source: |
  Surfaced by the architect 2026-08-22 while reviewing BL-1024's re-fix
  (`0eaa4c3d57`), and independently by the coder during the same ticket
  ("an unticketed stop-flag gate that never matches a real command"). It is
  NOT part of BL-1024 - that ticket is about naming an expedite run's
  leavings, this is a guard that never fires.

  Reproduced through the real interpreter rather than read:

      $ bb -e '(load-file "swarmforge/scripts/expedite_lib.bb") ...'
      ./stop-swarm.sh                     caller-shape=[cmd] -> true
      ./stop-swarm.sh --full              caller-shape=[cmd] -> true
      ./stop-swarm.sh --sweep-inbox       caller-shape=[cmd] -> true
      ./stop-swarm.sh --reset-worktrees   caller-shape=[cmd] -> true
      --full                              caller-shape=[cmd] -> false

  The guard refuses exactly one input: the bare string `--full`, which is not
  a runnable command at all. Every real invocation is admitted.

  The mechanism, in two lines that never met:

    expedite_lib.bb:229  (empty? (filter forbidden-stop-flags (map str args)))
    expedite_cli.bb:234  (when-not (expedite-lib/stop-invocation-ok? [cmd])

  `forbidden-stop-flags` is a SET, so filtering tests each element for exact
  membership. The caller wraps the whole configured command string in a
  one-element vector, so the only element ever tested is the entire command
  line. `cmd` comes from `EXPEDITE_STOP_CMD`, which the manual documents as a
  free-form "stop command, default ./stop-swarm.sh"
  (docs/reference/BL-567-expeditor-manual.md:193) - i.e. a knob whose natural
  value carries flags. It is then run via `bash -lc`, which does tokenize it.

  The three flags are real and destructive - `stop-swarm.sh` accepts
  `--sweep-inbox`, `--reset-worktrees` and `--full` (`--full` being both), and
  its own usage line documents an optional trailing target path, so a
  legitimate configured command may carry arguments.

  Why it was green: `expedite_lib_test_runner.bb:176-182` exercises the
  predicate with PRE-SPLIT vectors (`["./stop-swarm.sh" "--sweep-inbox"]`) -
  a shape the only call site cannot produce. Four assertions pass, the flag
  they assert is refused is admitted in production. Same family as the
  hardender rule accepted 2026-08-22 (a coverage counter is not an assertion)
  and BL-1029: the input has to round-trip through the real caller's shape.

  Second, smaller fault in the same path, currently unreachable because the
  guard never fires: `initiate!` calls `park-others!` BEFORE `stop-stack!`
  (expedite_cli.bb:264-265), so a refusal exits with every other active ticket
  already moved to `backlog/hold/`. BL-1024's re-fix routes that exit through
  `exit!` so the leavings are at least REPORTED, but a guard that only has to
  read an env var has no reason to have parked anything first. Fixing the
  guard without moving the check would make this residue reachable for the
  first time.

description: |
  ## What

  Make the expeditor's forbidden-stop-flag guard decide on the command line
  the expeditor would actually run, and decide it before anything is parked.

  ## Why

  The guard exists to stop one specific unrecoverable act: running the stack's
  teardown with `--sweep-inbox`, which archives the pending handoffs the
  tickets this very run just parked will need in order to resume. Today it
  admits that exact invocation, and the manual documents the knob that
  produces it. The three-line comment above `forbidden-stop-flags` explains
  the danger accurately; the code below it does not check for it.

  ## How (direction, not mandate)

  Tokenize the configured command the way the shell that runs it will, and
  test each token against the forbidden set - matching whole tokens, never
  substrings, so a target path spelling a flag is unaffected. Refuse anything
  that cannot be tokenized confidently rather than admitting it. Move the
  check ahead of `park-others!` so a refusal costs nothing.

  Whether the predicate keeps taking a seq and the caller tokenizes, or takes
  the raw command string and tokenizes internally, is the implementer's call -
  but the shape the caller passes and the shape the tests assert must be the
  same shape, which is the defect that hid this one.

  ## Scope

  - `swarmforge/scripts/expedite_lib.bb` - `stop-invocation-ok?` (and any
    tokenizer it grows).
  - `swarmforge/scripts/expedite_cli.bb` - `stop-stack!`'s call, and the
    ordering of the check relative to `park-others!` in `initiate!`.
  - `swarmforge/scripts/test/expedite_lib_test_runner.bb` - the four
    scenario-13 assertions, re-expressed in the caller's shape.
  - Step handlers for the new feature file, and the fixture seam they drive.
  - OUT of scope: `stop-swarm.sh` itself, and BL-1024's leavings register -
    this ticket does not change what `exit!` reports.

qa_e2e_procedure: |
  In the expedite fixture repo (`swarmforge/scripts/test/expedite_fixture.sh`),
  never against the live checkout:

  1. Seed the fixture with two active tickets and confirm `backlog/hold/` is
     empty.
  2. Run initiation with `EXPEDITE_STOP_CMD="./stop-swarm.sh --sweep-inbox"`.
     Assert: exits non-zero naming `--sweep-inbox`; the fixture's stop stub
     recorded no invocation; the second ticket is still in `backlog/active/`;
     `backlog/hold/` is still empty; the seeded parcels in
     `.swarmforge/handoffs/*/inbox/new/` are all still there.
  3. Repeat with `--reset-worktrees`, with `--full /repos/fixture-target`, and
     with `./stop-swarm.sh && ./stop-swarm.sh --full`. Same assertions.
  4. Run with `EXPEDITE_STOP_CMD="./stop-swarm.sh"` and again with
     `"./stop-swarm.sh /repos/full-sweep-inbox-fix"`. Assert both times: the
     stop stub ran, initiation continued past the teardown probe, and the run
     was not refused - the second is the substring look-alike and must not be
     mistaken for a flag.
  5. Run with `EXPEDITE_STOP_CMD="./stop-swarm.sh '--sweep-inbox"` (unbalanced
     quote). Assert: refused, naming the command it could not read; stop stub
     not invoked; nothing parked.
  6. Re-run the predicate directly through `bb` with the caller's shape and
     confirm the reproduction table in `source:` now reads `false` for all
     three flagged commands and `true` for the bare command.

