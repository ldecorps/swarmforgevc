description: |
  ## What
  Two scenarios in BL-696's landed features assert behaviour that the
  2026-07-29 16:15 batch land replaced the same minute they were written:

  1. `specs/features/BL-696-miniapp-lets-talk-cursor-audio.feature`
     scenario 06 "a transient speech-to-text failure is recoverable and
     does not wedge the session": step "the page shows conversation state
     'error' only while retrying" asserts `/setPhase\('error'\)/` against
     the served `/lets-talk` page. BL-696's own post-ship UX (c0f7d4b57a)
     removed that call from `extension/src/bridge/letsTalkUiHtml.ts`: a
     failed turn now calls `showError(...)`, `setBridgeHealthState('degraded',
     'agent: error')` and `setPhase('ready')`. The step's other assertion
     (`ctx.phaseTrace` = `['error','thinking',...]`) is pushed by the
     handler's own client-retry loop (`submitTurnWithClientRetry`), not
     read from the page - the regex was the only real check of the
     surface. Red: `The input did not match the regular expression
     /setPhase\('error'\)/`. 7/8 pass.
  2. `specs/features/BL-696-telegram-cursor-bridge-operator-commands.feature`
     scenario tg-op-04 "/redeploy compiles and restarts the supervised
     bridge": step "the bridge decision is to redeploy" asserts
     `{ action: 'redeploy' }`. BL-702 (done) gates bare `/redeploy` behind
     a soft operator confirm: `decideInboundAction` returns
     `{ action: 'prompt-operator-confirm', tier: 'soft', verb: '/redeploy' }`
     (`telegramCursorBridgeCore.ts` line ~454 comment names BL-702; the
     help text says "/redeploy - soft confirm, then compile and restart").
     19/20 pass.

  Both handlers predate that land (c98e1c8d84 07-28, 4c5c4bb2a2 07-29);
  the reds sat unrun for eight weeks until BL-1658 touched both handlers'
  require lines and the coder ran the features (note 000047).

  ## Why
  BL-1006: a superseded scenario is retired, never reworded - the
  successor's scenarios are the coverage (BL-702/BL-710/BL-1204 for the
  confirm-gated /redeploy; the page's inline-error UX has no scenario of
  its own and needs none: lets-talk-07 "structurally bad audio surfaces a
  recoverable error" still covers the surfaced error). The one half of
  lets-talk-06 still true and still valuable - the turn route reports a
  transient STT failure as recoverable and the retried turn completes -
  is a server contract (`letsTalkCore.ts` `sttRetryFailure`: `recoverable:
  true, state: 'error'`) and is restated here over the route, with no
  page literal to go stale. Adjudication:
  backlog/evidence/unowned-red-bl696-two-successor-left-reds-adjudication-specifier-20260921.md.

  ## How (direction, not mandate)
  - Delete scenario 06 (and its `# BL-696 lets-talk-06` comment) from the
    lets-talk feature and scenario tg-op-04 (and `# BL-696 tg-op-04`)
    from the operator-commands feature. Re-tense any `Feature:` narrative
    sentence that now states a false present (the operator-commands
    narrative lists /redeploy among immediate skills).
  - `grep -rn` every `.feature` for the three step patterns before
    removing their definitions from the two handlers: "the bridge
    decision is to redeploy", "the bridge posts a redeploy started
    confirmation", "the page shows conversation state \"error\" only while
    retrying". Remove `submitTurnWithClientRetry` only if nothing else
    uses it.
  - Scenario 01 here drives the turn route through the same
    `startBridge` fixture `bl696LetsTalkSteps.js` uses (STT failing
    transiently once then succeeding) and asserts the first response's
    `recoverable`/`state` and the resubmission's success - the server
    half, no page text.
  - Scenario 02 spawns `node specs/pipeline/cli.js <feature>` for each
    BL-696 feature and reads the TAP: all ok, the retired names absent,
    the scenario counts pinned (7 and 19).

  ## Scope
  - The two BL-696 features and their two handlers (retirement only;
    `retires:` above). BL-1658 edits the same handlers' require lines -
    promote after it lands and merge, do not fork.
  - `specs/features/BL-1681-bl696s-two-successor-left-scenarios-retire.feature`
    and `specs/pipeline/steps/bl1681Bl696SuccessorLeftRedsSteps.js`
    (same parcel, BL-233, registered in `specs/pipeline/steps/index.js`).
  - The two register rows for the BL-696 features leave in this parcel's
    land (BL-1631); the parcel never edits the register.
  - Documenter: the Let's Talk how-to and the Cursor Remote commands
    reference - any sentence stating an `error` conversation state or an
    immediate /redeploy is re-tensed; no diagram trigger.

