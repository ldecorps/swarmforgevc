notes: |
  Minted 2026-10-09 by the specifier, the fix BL-2072's diagnosis named.
  AUTO-APPROVED under the 2026-09-17 operator hotfix (severity defect, no ruling_options) - see auto-approve-high-severity-defects-amendment-20260917.md.
  The phase is getUpdates, which BL-2072's notes did not foresee
  (they named a startup heartbeat, a startup grace or a batch split).
  A deadline fixes the kill whatever makes the answer late; the
  abandonment line is the evidence for the cause.
  While minting, the front desk itself was found down: no front-desk
  supervisor or bot process after 13:53:56Z (the supervisor's last line
  is "stale-build-detected recompiling before respawn"). The coordinator
  was sent a note (priority 00). That outage is not this ticket.
  Sibling BL-2096 also changes pollAndForward; the coordinator promotes
  them one at a time (Concurrent Work Orthogonality). This one first.
  INVEST: Independent, Negotiable (deadline value and site), Valuable
  (no kill on a poll that never answers), Estimable (one deadline, one
  handler), Small (two scenarios), Testable (fake Telegram, clock and
  timer).

