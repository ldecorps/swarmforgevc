approval_context: >
  No new feature file. Minted approved under the 2026-09-17 operator
  hotfix (severity defect, no ruling_options). FIRM: peer_question.bb is
  not changed; bb already honours -Djava.io.tmpdir (verified at mint).
  FIRM: the leak check still requires zero run-dirs left after every
  outcome (answered, refused, timed-out, failed); only WHERE it looks
