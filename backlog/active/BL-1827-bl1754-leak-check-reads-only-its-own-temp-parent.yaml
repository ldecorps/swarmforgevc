invariants: []

description: |
  ## What is wrong

  QA note 003474, evidence 99f021afdd (BL-1817's pass, holding it):
  `extension/test/bl1754PeerQuestionInvariants.property.test.js` failed in
  the full property lane; the failure line was not captured, and the file
  passes alone (8 of 8, 25.7 s).

  Reproduced at mint (main 0a2104f8a0, load 12-13) with three concurrent
  runs of the file: two of the three failed, at invariant 1 (timed-out,
  and failed), with `expected no leaked run-dir under os.tmpdir(), got:
  ["bl1754-peer-question-..."]`. The check (lines ~118-130) snapshots
  every `bl1754-peer-question-*` entry in `os.tmpdir()` before its CLI
  call and asserts none is new after it. `peer_question.bb:88` creates its
  run-dir in `java.io.tmpdir` (`/tmp`; babashka ignores TMPDIR, verified),
  so a run-dir made by ANY concurrent peer_question call lands in the diff:
  a sibling run of this file, or a live role's question since BL-1754
  landed (d9285a11ca, 2026-09-29).

  ## What is wanted
  - Each CLI call in invariant 1 runs with its own temp parent: a mkdtemp
    directory passed as `-Djava.io.tmpdir=<dir>` ahead of the script on
    the `bb` command line (verified at mint: `bb -Djava.io.tmpdir=<dir>`
    makes `fs/create-temp-dir` create under `<dir>`). After the call, the
    leak check asserts that directory holds no `bl1754-peer-question-*`
    entry, then removes it in a finally (BL-971).
  - The four outcomes, the git-status diff and invariant 2 stay as they
    are. Invariant 1's failed case took 21.9 s under that contention; the
    property lane's scaled default (BL-1817) covers its budget, so no
    per-test timeout is added here.

  ## Scope
  - `extension/test/bl1754PeerQuestionInvariants.property.test.js`,
    evidence.

