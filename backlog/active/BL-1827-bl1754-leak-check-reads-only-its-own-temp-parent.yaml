     8 of 8.
  2. The parcel's evidence records three concurrent runs of the file (the
     mint's reproduction, 2 of 3 red before the fix): all green after it.
  3. `node specs/pipeline/cli.js specs/features/BL-1754-a-role-asks-another-role-a-question-through-a-one-shot-read-only-helper.feature`:
     6 of 6 ok (as measured on main at mint).
  4. `git diff main...HEAD --name-only` names only the test file and
     evidence.
  5. After landing: REGISTER_ROW_RETIRED for this ticket's property row.

