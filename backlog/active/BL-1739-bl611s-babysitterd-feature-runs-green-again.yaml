  1. `node specs/pipeline/cli.js specs/features/BL-611-deterministic-babysitterd-managed-by-swarm-lifecycle.feature`:
     27 of 27.
  2. The BL-1129 feature stays green.
  3. `git diff main...HEAD --name-only` names only the Scope files, docs
     and evidence; no `specs/features/` path.
  4. `node specs/pipeline/cli.js specs/features/BL-781-retire-dead-babysitter-files-keep-list-preserved.feature`:
     every scenario passes (scenario 03 is gone).
  5. `extension/test/bl781LiveGrepOffender.property.test.js` alone under
     the property config: 5 of 5.
  6. After the land: REGISTER_ROW_RETIRED for the BL-611 feature row.

