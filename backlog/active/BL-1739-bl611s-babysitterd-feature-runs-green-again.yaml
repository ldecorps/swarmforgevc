description: |
  ## What is wrong

  Specifier run on main, 2026-09-25:
  `node specs/pipeline/cli.js specs/features/BL-611-deterministic-babysitterd-managed-by-swarm-lifecycle.feature`
  gives 24 pass and 3 fail in 83 s. None of the failures is BL-1517's
  refusal (BL-1738 owns those).
  1. `rotate-not-honored-check-9-07` ("an honored-vs-unhonored rotate note
     is distinguished correctly") fails at "Then a CRIT finding names the
     parcel, expected persona, and actual persona": `expected a CRIT
     rotate-unhonored finding, got nil`. BL-1129 (done) makes the babysitter
     skip this check on standing packs. The likely cause: the fixture never
     declares a rotation (router) pack, the one topology where the check
     still applies.
  2. "an aged in_process claim under active work does not read as
     starvation" fails at "Then this claim does contribute to a starved
     finding": `expected the idle-owner aged claim to contribute to a
     starved finding`. The cause has not been traced. It may be the same
     topology or a later starvation rule.
  3. Scenario 15 ("the agent-based babysitter is gone and the daemon owns
     the name") fails at its repo-wide scan: `unexpected "babysitter"
     matches outside the allowlist:
     extension/test/bl1071SweepSurvivesAnyProbeFailure.property.test.js`.
     That file is BL-1071's own property test of the babysitter sweep
     (e80ceab3e3, 2026-08-23). It legitimately names the babysitter, and
     the handler's allowlist
     (`specs/pipeline/steps/bl611BabysitterdLifecycleSteps.js`, around
     line 261) was never extended for it.

  ## What is wanted

  - The feature runs 27 of 27 on the parcel commit, with no scenario text
    changed.
  - For each of the three items, the ticket's evidence records the cause
    as found and the change made: fixture topology, allowlist entry, or a
    code fix if the babysitter really regressed.
  - ~~The allowlist entry is added for that file by name~~ SUPERSEDED
    2026-09-25 by the specifier's ruling on the coder's note 002139. The
    coder found the per-file allowlist missing ~200 files, not 1:
    "babysitter" is now the daemon's everyday name (1068 tracked files).
    The scenario-15 step "Then the only matches are the deterministic
    daemon, its salvaged pure libraries, docs, and history" is RETIRED in
    BL-611's feature on main, with a comment in the feature. The handler
    now:
    - deletes that step's definition, `isAllowedBabysitterMatch` and the
      `offenders` scan, including the allowlist lines this parcel added;
    - makes the remaining step ("no babysitter.prompt role, LLM launch
      path, or wake runtime remains") assert two things: no
      `RETIRED_FILE_PATHS` entry is tracked (as today), AND no live-code
      file matches `FORBIDDEN_RETIRED_PATTERNS`. Live code means tracked
      files under swarmforge/scripts (not test/), swarmforge/roles,
      swarmforge/packs, extension/src, and the root launch scripts. Test
      files, specs/, docs/ and backlog/ may name retired files as history.
      Zero hits on main at the ruling.
  - BL-781's two readers of the deleted allowlist run green too (added
    2026-09-25 on QA note 003191). The ruling above missed them, and the
    rebuild c4c81e8f57 left both red. They are the only consumers
    (`git grep -e isAllowedBabysitterMatch -e "explicitly KEEPs" -e
    scanRepoForBabysitter` at 276c48aa92, backlog/ excluded):
    - `extension/test/bl781LiveGrepOffender.property.test.js`, test
      "BL-611 allowlist does not exempt deleted wake-runtime paths". It
      asserts `isAllowedBabysitterMatch` exists and is red. Rebuild it to
      state BL-781's invariant 1 ("by absence, not allowlist exemption")
      in the new shape. Suggested checks: the BL-611 handler defines no
      babysitter allowlist function, and `RETIRED_FILE_PATHS` names every
      `DELETED_WAKE` path. Check non-vacuity by hand: a planted allowlist
      function, or a dropped `RETIRED_FILE_PATHS` entry, fails it.
    - `specs/pipeline/steps/bl781RetireDeadBabysitterFilesKeepListPreservedSteps.js`:
      - BL-781 scenario 04 ("BL-611 scenario 15 still passes without
        allowlisting wake runtime") is kept. Its handler slices the BL-611
        source from `function isAllowedBabysitterMatch` and reads
        `scan.offenders`, and both are gone. Rebuild it on today's scan
        (`forbidden` plus `liveCodeMatches`). Exporting
        `scanRepoForBabysitter` from the BL-611 handler is one way, not
        a mandate.
      - BL-781 scenario 03 is RETIRED on main by the specifier (its
        feature carries the comment). Delete its three now-unused step
        definitions ("the BL-611 scenario 15 step handler allowlist at
        the parcel commit", "the allowlist paths are read", "the allowlist
        does not name any deleted wake-runtime babysitter file").

  ## Scope

  - `specs/pipeline/steps/bl611BabysitterdLifecycleSteps.js` (fixtures,
    allowlist).
  - `extension/test/bl781LiveGrepOffender.property.test.js` and
    `specs/pipeline/steps/bl781RetireDeadBabysitterFilesKeepListPreservedSteps.js`
    (BL-781's allowlist readers, above).
  - The babysitter sweep library, only if item 2 is a real regression.

