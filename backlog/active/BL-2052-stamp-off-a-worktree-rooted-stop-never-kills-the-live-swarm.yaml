description: |
  ## Status: hotfixes a9cadb6484 (shell) and 49fe963c76 (extension) landed the fix

  This parcel is their stamp-off: review them, do not re-apply them.

  ## What was wrong

  swarmforge.sh copies the main checkout's .swarmforge/tmux-socket into each
  role's state dir, so every worktree's copy names the live server's socket.
  kill_pipeline_swarm.sh (behind kill_all_swarm.sh) and the extension's
  swarmStopper (stopSwarm, stopSwarmCompletely, drainAgentSessions,
  clearStaleSwarmState) read that file from the root they were asked to
  stop and ran tmux kill-session and kill-server on whatever it named. A
  stop rooted at a worktree therefore tore down every seat.

  ## What the hotfixes changed

  a9cadb6484: socket_owned_by_root in kill_pipeline_swarm.sh admits a socket
  only when its directory, resolved with pwd -P, is under the root's own
  .swarmforge/ (also pwd -P). When the directory is gone it falls back to a
  lexical check that refuses any ../ segment. A refusal logs "REFUSED tmux
  kill-server <sock>" in the kill-all audit. Two regression cases in
  test_swarm_socket_not_in_tmp.sh: a foreign pointer, and the same socket
  reached through ../ from the worktree's own .swarmforge/.

  49fe963c76: socketOwnedByTarget in swarmStopper.ts makes the same check with
  realpathSync, resolving the nearest existing ancestor when the socket's
  directory is gone. Every stop entry point refuses a foreign socket, kills
  nothing, and still clears the target's own stale state. Two unit tests: a
  foreign pointer, and an in-root pointer whose tmux directory is a symlink
  to another root's.

  ## What the coder does (all of it)

  1. Read `git show a9cadb6484` and `git show 49fe963c76` against the section
     above. Confirm a stop of the main checkout still reaches kill-server on
     its own socket in both stoppers.
  2. Run qa_e2e_procedure step 1 and `npx vitest run test/stop.test.js`
     once, with TMUX unset, output under tmp/.
  3. Write backlog/evidence/BL-2052-coder-<date>.md with the review result
     and the run results, and commit it.

