description: |
  ## Status: hotfix 52a004ed93 landed the fix

  The coder reviews it and never re-applies it (the BL-1858 and BL-1868
  shape): read the commit, run its test, and write the step handler for
  this ticket's four scenarios, which the hotfix did not add. A review
  that finds the change wrong says so in a note to the specifier rather
  than rewriting it.

  ## What is wanted

  After a local-model seat's edit or write_file, if the file is Clojure
  source (.bb, .clj, .cljc, .edn) and no longer reads, the seat is told
  in the same turn: the hook's additional context names the file and the
  reader's message with the open form's line and column. A file that
  reads, or a file of any other kind, adds nothing. Every local-model
  seat's qwen settings register the hook, the way they register the
  PreCompact hook.

  ## How (direction, not mandate)

  - A hook script beside local_model_precompact_hook.sh that reads the
    PostToolUse event from stdin, picks the edited path, and runs bb's
    reader on it (the edamame parse bb already uses names the open
    delimiter's row and column).
  - One more entry in write_local_model_qwen_settings' hooks block,
    pointed at the master checkout's script the way PreCompact is.

  ## What each stage checks

  - Coder: review 52a004ed93; the step handler and the four scenarios;
    test_bl1970_local_model_edit_hook.sh and the BL-1949 shell test pass.
  - Documenter: the local-model seat launch how-to names the edit hook
    beside the PreCompact one.

assigned_to: coder
