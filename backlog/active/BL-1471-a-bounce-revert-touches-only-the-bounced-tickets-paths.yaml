id: BL-1471
title: "A bounce revert reverses the whole review merge and is run even for an omission bounce that has nothing to revert: QA's BL-1348 spec-gap revert (108d9a46e7, 2026-09-07) removed ruling B's implementation, its tests, both vitest configs and BL-940's and BL-1468's evidence from the QA branch, and only the coder restoring them on merge stopped a silent regression; a commit-time guard refuses a revert that touches another ticket's paths and refuses any revert for an omission-class bounce"
milestone: M8
type: defect
