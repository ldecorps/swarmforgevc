id: BL-1196
title: "Test-suite git() fixtures must not inherit an ambient GIT_DIR/GIT_WORK_TREE redirect onto a live repo"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
priority: 15
direction: swarm-reported
depends_on: []
mutation_cost: low
