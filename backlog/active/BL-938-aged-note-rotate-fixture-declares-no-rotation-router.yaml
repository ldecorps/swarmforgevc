approval_context: >
  Straightforward one-line fixture amendment, same shape as BL-936 and as
  the sibling test_rotate_to_role_stuck_parcel_gate.sh took when BL-931
  landed. Two things worth your eye. FIRST, severity is medium, not high:
  the defect is in a TEST FIXTURE, not production - BL-931's gate is
  behaving correctly, and the live pack is a full 7-role pack that does not
  rotate at all today, so no operator-visible behaviour is degraded. SECOND,
  and larger than this ticket: nothing runs swarmforge/scripts/test/*.sh in
  any standing gate, so this test could sit red indefinitely and only
  surfaced because BL-937 happened to make it executable. That missing
  runner is a separate defect this ticket deliberately does not try to fix -
  say the word and I will spec it.

source: |
  Coder priority-00 note 2026-08-19 alongside BL-937's git_handoff, defect D1
  of backlog/evidence/BL-937-surfaced-defects-not-fixed-20260819.md (in
  commit d3e98df25). BL-937's own constraints reserved any real assertion
  failure its port surfaced for a follow-up ticket: "If a ported test turns
  out to FAIL on a real assertion once it can finally execute, that is a
  SEPARATE defect that this port has surfaced, not part of this parcel.
  Record it with evidence and raise it; do not fix it here and do not weaken
  the assertion to make the port look clean." This is that ticket for D1.

description: |
  ## The defect

  `swarmforge/scripts/test/test_handoffd_aged_note_rotate_wiring.sh` drives
  the real handoffd chase sweep against a disposable fixture and asserts
  BL-576's aged-note behaviour: a note aged past `note_actionable_after_ms`
  rotates the resident to the dormant recipient role. Its
  `setup_common_fixture` never writes a pack-topology declaration into the
  fixture conf.

  BL-931 (landed 2026-08-19) then added an earlier gate in the same call
  path: `rotate-resident-to!` is refused outright on a pack that is not a
  rotation router. The fixture therefore reads as non-router and every
  rotation is refused before reaching the behaviour under test. Scenario A
  fails with "the resident was never rotated to specifier for its aged
  note", after its 40-second poll for `chase-rotate specifier` times out,
  and the daemon log carries `chase-rotate-error cleaner
  not-a-rotation-router` twice.

  ## Why this one file and not its siblings

  Verified 2026-08-19 on the working tree and on `origin/main` alike:

  | fixture | declares `rotation router` |
  |---|---|
  | `test_handoffd_aged_note_rotate_wiring.sh` | 0 — this defect |
  | `test_handoffd_priority_rotate_wiring.sh` | 2 |
  | `test_handoffd_starve_rotate_wiring.sh` | 1 |
  | `test_rotate_to_role_stuck_parcel_gate.sh` | 1 |

  The two sibling wiring tests pass. `test_rotate_to_role_stuck_parcel_gate.sh`
  was amended for exactly this when BL-931 landed. This file was missed
  because it could not run at all: it died on `mapfile: command not found`
  at line 132 on this stock-bash-3.2 host, long before reaching the pack
  gate. BL-937's port made it executable, which is what surfaced this.

  ## How (direction, not mandate)

  The sibling fixtures' own declaration is the obvious precedent, and
  BL-936 made the same amendment for BL-805's JS property fixture on the
  same day. Where in `setup_common_fixture` it belongs, and whether the
  three wiring fixtures should share one helper rather than each writing
  their own conf line, is the implementer's call.

invariants:
  - "The fixture is corrected, never the gate. BL-931's refusal stays exactly as strong as it is today - no env bypass, no force flag, no *_FORCE_RESULT seam, and no edit to handoff_lib.bb, mono_router_lib.bb or rotate_to_role.bb/.sh in this parcel."
  - "The test keeps asserting what it asserts today: the same aged-note actionability semantics, the same daemon entry, the same expected rotation. This turns a red lane green by fixing the fixture's premise; it does not renegotiate the behaviour under test."
  - "The restored test stays non-vacuous: with aged-note actionability neutralised so no note ever ages in, it must still fail. A fixture that makes every rotation succeed is a broken test, not a fixed one."

required_wiring:
  - "swarmforge/scripts/test/test_handoffd_aged_note_rotate_wiring.sh::rotation router::the fixture builder must actually write the pack declaration; adjusting assertions or comments alone leaves the lane red, which is the BL-419 shape this field exists to catch"

acceptance: specs/features/BL-938-aged-note-rotate-fixture-declares-a-rotation-router.feature

qa_e2e_procedure: |
  On the live swarm host, from the repo root, with stock /bin/bash:

  1. Reproduce the red state at the commit before the fix:
     `/bin/bash swarmforge/scripts/test/test_handoffd_aged_note_rotate_wiring.sh`
     Confirm Scenario A fails with "the resident was never rotated to
     specifier for its aged note", and that the daemon log it prints carries
     `chase-rotate-error cleaner not-a-rotation-router`.
  2. At the fix commit, run the same command. Confirm every scenario passes
     and no `not-a-rotation-router` line appears in the daemon log.
  3. Confirm the siblings are untouched and still green:
     `/bin/bash swarmforge/scripts/test/test_handoffd_priority_rotate_wiring.sh`
     and `/bin/bash swarmforge/scripts/test/test_handoffd_starve_rotate_wiring.sh`.
  4. Non-vacuity: neutralise aged-note actionability in a scratch copy of the
     fixture (e.g. set `note_actionable_after_ms` far beyond the poll window)
     and confirm the test FAILS. A pass here means the fixture no longer
     tests anything.
  5. Confirm no file under swarmforge/scripts/ other than this one test
     changed in the parcel: `git show --stat <commit>`.

notes: |
  SIBLING: BL-939 is defect D2 from the same evidence file and the same
  coder note. Independent fix in a different file; deliberately not bundled.

  WIDER GAP, NOT FIXED HERE: no standing gate runs swarmforge/scripts/test/*.sh
  at all (verified 2026-08-19 - no runner in extension/package.json, .github/,
  or any swarmforge/scripts/*.sh). That is why this test could be red
  indefinitely without anyone noticing, and it is the same class as the known
  "specs/pipeline/test/ is run by no standing gate" gap. Raised for triage
  rather than folded in here.
