  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1804-a-note-to-the-coordinator-is-never-a-dispatch.feature`:
     5 cases ok (01 x3, 02, 03).
  2. Regression, one run each:
     - `node specs/pipeline/cli.js specs/features/BL-1223-only-a-dispatch-counts-as-a-dispatch-trail.feature`:
       6 ok (6 of 6 in 12 s at mint).
     - `bb swarmforge/scripts/test/bl1097_router_dispatch_trail_test_runner.bb`
       and `bb swarmforge/scripts/test/dispatch_gap_test_runner.bb`: ALL PASS.
     - `bash swarmforge/scripts/test/test_chase_sweep.sh`: ALL PASS.
  3. Read the parcel's change to `dispatch_gap_test_runner.bb`. The
     re-nudge assertion still asserts no second nudge while one is
     pending.
  4. `git diff main...HEAD --name-only` names only `chase_sweep_lib.bb`,
     the two runners it tests through, `handoffd.bb` if the pending-dirs
     argument is threaded there, the feature, its handler (plus lib/) and
     evidence.

