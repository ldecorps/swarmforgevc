id: BL-1804
title: "The sweep's own 'Work <id> active unassigned - assign_to and route it.' nudge to the coordinator counts as a dispatch trail, so dispatch_trail_cli answers DISPATCHED for a ticket nobody routed, route_backlog_to_coder.sh refuses to route it without --force, and the dispatch-gap sweep goes quiet about it (BL-1803, 2026-09-29): a note addressed to the coordinator is never a dispatch, and the nudge is deduplicated against its own unread copy"
milestone: M8
type: defect
severity: high
# high: a broken health signal. The nudge that reports an unrouted ticket
# marks it as dispatched, so if the coordinator misses the nudge, the
# dispatch-gap sweep never flags the starved ticket - BL-1223's own failure
# through a different door.
status: todo
epic: swarm-reliability
