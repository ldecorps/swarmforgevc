human_approval: approved
approval_context: >
  Auto-approved high-severity defect (2026-09-17 carve-out); no choice is
  posed. FIRM - the rule keys on the handoff's to: header, never on which
  mailbox the file sits in (BL-1223's own fixture keeps a to: coder note in
  the coordinator's sent/); git_handoff task: trails and Work/Spec notes to
  working roles count exactly as today; the router and the sweep keep one
  shared predicate (BL-1097 invariant 2).

invariants:
  - "A handoff whose to: is the coordinator never counts as a dispatch of the ticket it names, whatever its message says; every other trail counts exactly as before."
  - "At most one unassigned-active nudge per ticket is pending (new or in_process) in the coordinator's inbox at any time."

description: |
  ## What happened

  Coordinator note 012997 (2026-09-29 12:43Z), verbatim: "dispatch_trail
  false-DISPATCHED: my Work-BL nudge text hit BL-1223 pattern". The
  mailboxes show:
  - 12:41:32Z: `from: coordinator to: coordinator message: Work BL-1803
    active unassigned - assign_to and route it.` This is the
    unassigned-active sweep's nudge (`chase_sweep_lib.bb`
    `unassigned-active-note-message`, drafted `to: coordinator`).
  - 12:43:29Z: `from: coordinator to: coder message: Work BL-1803: merge
    main first, then read backlog/active`, the route.
  Between the two, `dispatch_trail_cli.bb <root> dispatched BL-1803`
  answers DISPATCHED. `route_backlog_to_coder.sh` exits 3 on DISPATCHED
  ("already has a dispatch trail - NOT routing") unless it gets `--force`.

  ## Why

  `dispatch-trail-ticket-id` counts a note's `message:` when it matches
  `spec-work-ticket-id-pattern` (verb-first `Work|Spec <id>`), and reads
  nothing else of the handoff. The unassigned-active nudge was written in
  that form on purpose (BL-1223, its docstring: "so the next sweep still
  treats the nudge itself as a trail (no spam)"), so the anti-spam marker
  IS a dispatch. `dispatch-trail-dirs` scans every role's mailbox, the
  coordinator's included.

  Measured at mint: a fixture mailbox holding only that nudge gives
  `collect-dispatched-ticket-ids` = `#{BL-9999}` and
  `ticket-dispatched-in?` = true. The dispatch-gap auto-route note
  (`dispatch-gap-draft-lines`) is addressed to the ticket's assignee, so it
  is a real dispatch and unaffected.

  ## What is wanted

  1. `dispatch-trail-ticket-id` returns nil for a handoff whose `to:` is
     `coordinator`, before any message match. A missing `to:` keeps
     today's reading. The router (`dispatch_trail_cli.bb`) and the sweep
     share the predicate, so both change together (BL-1097 invariant 2).
  2. The unassigned-active sweep stops using the dispatch trail to avoid
     repeating itself. It suppresses a nudge while its own nudge for that
     id sits pending (`new` or `in_process`) in the coordinator's mailbox,
     the way `open-slot-nudge-pending?` already works for the open-slot
     nudge. The production caller passes the pending dirs
     (`live-mail-trail-dirs` covers `new`/`in_process`), never
     `completed`. A nudge the coordinator read without routing is
     therefore sent again on a later sweep while the ticket stays
     unassigned: loud, not silent. Rate-limit that repeat with the
     open-slot nudge's existing cooldown mechanism.
  3. `dispatch_gap_test_runner.bb`'s assertion "unassigned-active-items
     does not re-nudge once a trail exists" pins behaviour this ticket
     keeps (no second nudge while one is pending). Its premise changes
     from "trail" to "pending nudge". Update that assertion in the parcel
     and keep what it guards.

  ## Existing contracts that stay green (measured at mint, main 8e2ca464bb)

  - `specs/features/BL-1223-only-a-dispatch-counts-as-a-dispatch-trail.feature`:
    6 of 6 in 12 s. Its scenario 01 row 2 note sits in the coordinator's
    `sent/` with `to: coder`, so a `to:`-keyed rule leaves it DISPATCHED.
  - `bl1097_router_dispatch_trail_test_runner.bb`: ALL PASS.
  - `dispatch_gap_test_runner.bb`: ALL PASS (see item 3).
  - `test_chase_sweep.sh`: ALL PASS in 4 s.

  ## How (direction, not mandate)

  - Read `to:` with the same `read-header-field` the trail already uses
    for `task`/`message` (`dispatch-trail-headers`).
  - Handler `bl1804CoordinatorNoteIsNotADispatchSteps.js`, landing in the
    SAME commit as the feature (BL-233), reusing BL-1223's fixture root and
    real `route_backlog_to_coder.sh` run (its scenario 03 shape).

constraints: >
  Fixture roots under mkdtemp (BL-1390). No change to what a git_handoff or
  a Work/Spec note addressed to a working role proves.

