human_approval: approved
approval_context: >
  A defect against BL-2073's own spec, which already chose the ref (the
  parcel's merge-base with main) and the blocked shape. No choice is posed.

invariants:
  - "The property_runners row diffs the parcel's own change, from its merge-base with main to the gathered commit, and never an empty or a wider range."

description: |
  ## What is wrong

  extension/src/quality/qaGather.ts's property_runners row (BL-2073)
  runs `run_property_runners.sh --changed-from <ctx.commit>`. The
  front-end diffs `git diff --name-only <ref>...HEAD`
  (run_property_runners.sh, BL-2049). QA gathers in its own worktree with
  the parcel commit checked out, so ctx.commit is HEAD and the range is
  empty. Every gather since BL-2073 landed (3a65a6e5ab, 2026-10-08) read
  "no property runner reached since <its own tip>": 15 of 15 in
  .worktrees/QA/tmp/*-gather.json, among them BL-2064's, which changed
  local_model_repeat_guard.bb. BL-2073's description said the ref is
  "`git merge-base main <commit>`", and the blocked reason still names
  the merge-base. The code never computes one.

  BL-2073's step handler drove a fake runner rooted at `/r` that never ran
  git, and asserted the front-end's args equal
  `['--changed-from', <commit>]`, which is the defect. Its scenarios
  passed, its mutation stamp passed, and no lane could see it.

  ## What is wanted

  - The row passes the parcel's merge-base with main (`git merge-base
    main <commit>` in the gather's root), so the front-end runs exactly
    the runners the parcel's own change reaches (scenario 01). A change
    main gained after the parcel branched does not count (scenario 02).
  - When the merge-base cannot be resolved, the row is blocked with a
    reason naming the failed merge-base, and the front-end is never
    started. It never falls back to a wider ref (scenario 03, BL-2073's
    rule).
  - The scenarios run the REAL CHECKLIST row with a runFn that really
    spawns, in a real `git init` fixture under mkdtemp whose checked-out
    HEAD is the parcel commit. The fixture holds copies of
    run_property_runners.sh and property_runner_reach.bb and two fixture
    runners. BL-2049's handler (bl2049PropertyRunnerReachSteps.js) already
    builds that shape.
  - Retire BL-2073's feature: `git rm`
    specs/features/BL-2073-qa-gather-runs-the-property-runners-its-change-reaches.feature
    and its handler specs/pipeline/steps/bl2073QaGatherPropertyRunnerReachSteps.js
    in the same commit as BL-2094's handler. Its scenarios assert the
    defect and go red on the fix. Retire, never reword: this feature's
    scenarios are the coverage. Warning: removing the old handler without
    the new one landing in the same commit, or the reverse, turns the
    acceptance suite red for every other parcel (BL-233).

  ## How (direction, not mandate)

  - CheckSpec.build is synchronous and takes only ctx. Resolve the ref
    before the checklist runs (for example in qa-gather.ts beside
    resolveHeadCommit, carried on ctx), or teach the row to resolve it
    through runFn. Either way, the row keeps its place in CHECKLIST's
    order (BL-1554's fixed-order step, stamped by BL-2079).

constraints: >
  Fixture repositories are `git init` under mkdtemp, proven by `rev-parse
  --git-common-dir` before any mutating git command, and never the live
  checkout (engineering Guardrails, BL-1390). The handler runs the real
  front-end and reach selector from the fixture, never a fake runFn for
  the property_runners row.

out_of_scope: |
  - BL-2080's re-gather narrowing of the properties lane and BL-2024's
    lane skip for backlog-only parcels; both touch qaGather.ts, so the
    coordinator keeps them out of flight together (orthogonality).
  - Which runners fail once they finally run. Those are reds in their own
    right, owned when they first show.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2094-qa-gathers-property-runner-row-diffs-the-parcel-against-its-merge-base.feature`:
     4 of 4 ok (01 x2, 02, 03).
  2. `ls specs/features/BL-2073-* specs/pipeline/steps/bl2073*` finds
     nothing at the parcel commit.
  3. Read this parcel's own gather: the property_runners row's command
     ends `--changed-from <sha>` where `<sha>` equals `git merge-base main
     <gathered commit>`, never the gathered commit itself.
  4. After the land: the next gather on a parcel that changes a file under
     swarmforge/scripts/ names at least one runner, or prints the no-reach
     line with the merge-base sha, not the parcel's own tip. Record which
     in the QA evidence.

