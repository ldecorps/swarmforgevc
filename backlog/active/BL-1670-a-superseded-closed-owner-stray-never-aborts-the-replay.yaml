approval_context: >
  One scenario is added to a landed feature file, so it would ordinarily
  need a tap; it is minted approved under the 2026-09-17 operator hotfix
  (severity defect, no choice posed, no ruling_options). FIRM:
  superseded applies to pure-evidence and doc strays only
  (backlog/evidence/, docs/), and only when the stray adds no line
  origin/main lacks OR every conflicting line on origin/main was last
