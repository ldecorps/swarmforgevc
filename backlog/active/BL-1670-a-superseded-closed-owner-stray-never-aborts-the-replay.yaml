description: |
  ## What is wrong

  `swarmforge/scripts/land_step_lib.bb` (landed BL-1650, 90c7b53cca), the
  stray loop around line 2184: for each closed-owner pure-evidence stray
  it runs `git cherry-pick -x <sha>` on the scratch branch; an "already
  applied" empty result is skipped (D1), a tip whose path already equals
  origin/main is never cherry-picked (scenario 06), and ANY other
  non-zero exit runs `cherry-pick --abort` and fails the whole replay
  with `land-step replay: could not cherry-pick stray evidence commit
  <sha>`. On 2026-09-20 QA's land of BL-1657 (approved a8f0779522, QA
  evidence `backlog/evidence/BL-1657-land-escalate-20260920.md`) hit
  5dbfd9b6a6, BL-1459's bounced first-round doc commit (one path,
  `docs/how-to/BL-658-briefing-trigger-derived-from-closure-schedule.md`):
  BL-1459's rebuilt land 8fad11b0dc rewrote the same section, so the
  cherry-pick conflicts and, resolved to main's side, is empty - nothing
  to land. The loop aborted, and BL-1663 (landed cedb993ae3) printed as
  ENTANGLED_SIBLING only because the walk never reached its verdict.
  Specifier census at 06:5x Z: coder, cleaner, architect, hardender,
  documenter and QA all carry 5dbfd9b6a6 with the doc differing from
  main (a 3-way sync merge keeps the old hunks), so every land from those
  branches escalates the same way until this lands; QA hand-builds
  tip-pure commits meanwhile (BL-1537 log, condition (g)).

  ## What is wanted

  - When a pure-evidence or doc stray's cherry-pick conflicts, the loop
    decides superseded on either ground: (a) `git diff origin/main <sha>
    -- <paths>` adds no line (the stray is a content subset of main:
    be826a2060, added 0 / removed 109); or (b) every conflicting line on
    origin/main was last written by a landed commit (`git blame` over
    main's side of each hunk: 5dbfd9b6a6, whose 12 older lines BL-1459's
    landed rebuild rewrote). It aborts only THAT cherry-pick, prints
    `LAND_STRAY_SUPERSEDED <sha> <path> <reason>`, and continues; the
    replay and the sibling verdicts complete as if the stray were landed.
  - A conflict on a code path, or a stray that would drop a line main
    lacks from an unlanded writer, still escalates by name (unchanged).
  - BL-1650's feature gains scenario 07, step in the same commit:

    ```
      # BL-1650 a-superseded-closed-owner-stray-is-skipped-and-the-walk-continues-07
      # BL-1670 (2026-09-20): BL-1459's bounced first-round doc commit
      # conflicted against BL-1459's own rebuilt land on every branch.
      Scenario Outline: a pure-evidence stray that conflicts against main's later text is reported superseded and the replay completes
        Given a stray commit off the lineage whose path <shape> on origin/main
        And a replay tip that carries the stray and a landed sibling behind it
        When the land step replays the cited ticket
        Then it reports the stray as superseded naming the reason
        And it reports the sibling landed
        And it lands the ticket's own paths

        Examples:
          | shape                                               |
          | is a strict content subset of a later append        |
          | was rewritten by a later landed commit of its owner |
    ```

  ## How (direction, not mandate)

  - On cherry-pick failure, `git diff --name-only --diff-filter=U` gives
    the conflicting paths; `git blame -L` over main's side of each
    conflict hunk gives the last-writer shas; `subject-attribution` over
    those subjects gives the owners. Superseded iff the set is exactly
    {the stray's owner} and every sha is on origin/main.

constraints: >
  No change to which strays are candidates, to scenario 06's tip-content
  rule, or to the D1 already-applied skip. The step handler lands with the
  scenario (BL-233). Fixture repositories are mkdtemp git init roots.

out_of_scope: |
  - Cleaning 5dbfd9b6a6's hunks off the six branches by hand: a restore
    on one branch re-diverges at the next 3-way sync merge and cannot
    converge; the tool tolerating the shape is the fix.
  - Why QA cited the pre-sync approved commit rather than the synced tip
    (QA.prompt already says which); the doc differs either way.

qa_e2e_procedure: >
  (1) `node specs/pipeline/cli.js specs/features/BL-1650-the-land-step-lands-a-pure-evidence-closed-owner-stray-itself.feature`
  ONCE on the parcel commit: 7 scenarios ok. (2)
  `bb swarmforge/scripts/test/land_step_lib_test_runner.bb` once: ALL
  PASS. (3) On the live repository from the QA checkout, the land step
  over any approved tip carrying 5dbfd9b6a6 prints
  `LAND_STRAY_SUPERSEDED 5dbfd9b6a6 ... 8fad11b0dc` and no LAND_ESCALATE
  for it. Never "run it N times".

