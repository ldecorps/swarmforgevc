description: |
  ## What is wanted

  With the coordinator resolving to no wake session (BL-1964), the closing
  context clear sweep injects nothing into the resident on the
  coordinator's behalf: no `/clear`, no re-read, and no fullness read of
  the resident's pane taken as the coordinator's.

  ## What the coder checks

  The scenario; closing_context_clear_test_runner.bb passes, including a
  case where the coordinator's wake session is nil.

