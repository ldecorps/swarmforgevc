description: |
  ## What

  Wire `computeDocsStructure` into something that actually runs against
  this repo, not just its own fixture tests.

  Specifier ruling: **option 1 — gate-blocking**, matching the project's
  stated "index stays exhaustive and orphan-free" rule. Shape:

  1. A repo-scoped test that calls `computeDocsStructure(REPO_ROOT)` and
     asserts every orphan is either absent or on an explicit dated allowlist
     for pre-existing debt (not a silent gut, not permanently red).
  2. A /pilot land check when authored Divio-mode docs were touched: a new
     non-allowlisted orphan refuses land.

  Checklist-only (option 2) is out — too weak for a rule already treated as hard.

  ## depends_on

  BL-756 must land first so tonight's ten named paths are indexed before this
  gate is required green against the real tree.
