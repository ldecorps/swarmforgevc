description: |
  ## Status: hotfix 3771562541 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What the hotfix changed

  The first test in `extension/test/bl1871ParcelLineTakeUp.property.test.js`
  asserts that ten random op sequences reach a stay on the role's work on
  top (a take-up, role work on top of it, then the same take-up again) at
  least once. Nothing guaranteed it. The specifier measured the miss rate
  at mint by replaying the generator 2000 times through a model of the
  take-up decision: 105 of 2000 runs (about 5%) reached it zero times. The
  move and blocked floors never missed. The run on main passed, so QA's
  red was a draw.
  The hotfix adds `REACH_EXAMPLE`, passed as `fc.assert`'s `examples`, so
  it runs before the random draws. Through the real bb fixture it reaches
  move 6, stay-on-top 1, blocked 1 by itself.

  ## What is wanted in this parcel

  - Review the example against the three invariants and the reach floors,
    and say in the evidence whether the other two floors want the same pin.
  - Evidence: the review and one run of the file.

  ## Scope

  The property file (review only) and evidence.

qa_e2e_procedure: |
  On the parcel commit:
  1. From `extension/`, ONE run: `npx vitest run --config vitest.properties.config.mjs test/bl1871ParcelLineTakeUp.property.test.js`:
     2 of 2 pass (measured at the hotfix, about 12 s).
  2. `node specs/pipeline/cli.js specs/features/BL-1871-a-role-takes-up-a-ticket-on-its-own-line.feature`:
     all ok, as on main.

