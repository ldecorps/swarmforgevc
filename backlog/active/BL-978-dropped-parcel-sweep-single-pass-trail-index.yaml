id: BL-978
title: "dropped-parcel-sweep re-walks every mailbox once per active ticket (~5900 handoff files x 8 items = ~47000 reads, worst boundary 143269 ms, zero nudges emitted): build the trail index once per sweep"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 15
direction: human-requested
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-978-dropped-parcel-sweep-single-pass-trail-index.feature

invariants:
  - "One sweep reads each handoff file at most once: trail evidence is gathered in a single pass over the scan dirs and indexed by ticket id, so adding an active ticket adds no additional filesystem pass."
  - "The speed-up changes no decision: for any given tree the set of ticket ids nudged after the change is identical to the set the per-item scan produced - including the self-nudge exclusion and the never-a-false-freshness-signal rule for files with no parseable timestamp."

description: >
  Severity rationale: high - not cosmetic slowness. The sweep runs inside
  handoffd's single poll thread, so its 30-143s of scanning BLOCKS mail
  delivery for every role for that whole window, and it is the direct
  trigger of the 2026-08-20T07:55:35Z control-plane halt (BL-977): a
  cycle that cannot finish inside the supervisor's 30s window is what
  made a healthy daemon look wedged.

  Measured at mint, on this host:

  - chase_sweep_lib/dropped-parcel-items (chase_sweep_lib.bb:1243) calls
    newest-trail-event-ms ONCE PER ACTIVE ITEM, and each call re-lists and
    re-slurps every handoff file in all the scan dirs
    (list-handoff-files-with-batches -> dispatch-ticket-ref, which reads
    each file's headers).
  - dispatch-gap-scan-dirs builds 40 dirs (8 roles x
    new/in_process/completed/sent/outbox). The completed/ and sent/ dirs
    hold ~5900 files today and grow monotonically - e.g. coder
    inbox/completed 502, architect 432, documenter 396, QA 405,
    coordinator inbox/completed 743, coordinator sent 670.
  - With 8 active tickets that is on the order of 47000 file reads per
    sweep, on top of collect-dispatched-ticket-ids' own two full passes.
  - Rotated log handoffd.log.20260820T080001Z: 41 dropped-parcel-sweep
    boundary lines, routinely 30-106s, worst 143269 ms - and ZERO
    dropped-parcel-nudge and zero dropped-parcel-nudge-error lines in the
    whole file. Every second of it is the scan; none of it is the work.

  Fix wanted (direction, not mandate): walk the scan dirs ONCE per sweep,
  building a ticket-id -> trail-evidence index (has-trail, live-mail,
  newest event ms) in that single pass, and have dropped-parcel-items
  decide from the index instead of rescanning per item. The pure decision
  (decide-dropped-parcel?) and the definitions of trail, live mail,
  self-nudge exclusion and unparseable-timestamp handling are all correct
  and stay exactly as they are - this is a data-access change, not a
  policy change.

constraints: >
  Firm lines:

  - No behaviour change. The candidate set is the contract (invariant 2);
    a faster sweep that nudges a different set of tickets is a failed
    fix, not a fix.
  - BL-719 invariant 3 (a sweep's own prior nudges are excluded from
    freshness, so a still-dropped ticket stays detectably stale across
    repeated nudge cycles) survives verbatim - scenario 03 pins it.
  - Files with no parseable timestamp header are still SKIPPED, never
    treated as fresh (scenario 04).
  - Sharing one index across dispatch-gap-sweep and
    unassigned-active-nudge-sweep in the same cycle is OUT of scope here,
    even though they each pay their own full pass (measured 18-21s and
    9-17s the same morning). Named follow-on, not this slice - keep the
    change inside the dropped-parcel path.
  - Retention/compaction of completed/ and sent/ is NOT in scope and must
    not be attempted as the fix: deleting mailbox history is a human
    call, and the sweep must be cheap over a large tree regardless.
  - Do not touch handoffd_supervisor.bb or its thresholds - the guard
    half is BL-977, deliberately a sibling.

qa_e2e_procedure: >
  1. Scenario 01: build fixture trees at (files, items) = (40,1),
     (40,8), (400,8), instrument the file-read path, and assert no
     handoff file is read more than once per sweep - and that the read
     count is flat in the item count.
  2. Scenario 02: over one fixture tree covering all four cases (stale
     trail / live mail / no trail / unparseable timestamp), assert the
     nudged id set equals the set the pre-change per-item scan produces
     for the same tree (capture the pre-change set first, from the
     parent commit).
  3. Scenarios 03-04: the two preserved-rule cases, each asserting the
     ticket is STILL a candidate.
  4. Scenario 05: run one sweep against the live mailbox tree of this
     host and record the wall clock, before and after - the after must
     be below SUPERVISOR_STALL_MS (30000 ms). Record both numbers; the
     pre-change baseline on 2026-08-20 was 30000-143269 ms.
  5. Live confirmation: after landing, read a full morning of
     `sweep-boundary sweep=dropped-parcel-sweep` lines and record the new
     worst - it feeds BL-977's in-sweep budget.

notes: >
  Source: operator intake
  .swarmforge/operator/INTAKE-handoffd-stalled-false-positive-alarm-halt.md
  (human via Cursor 2026-08-20 ~09:23 CEST), archived to
  .swarmforge/operator/archive/ in the same pass. That intake was SPLIT
  1:N (Consolidation Authority): its direction 1 (false-stall guard)
  became BL-977, its direction 2 ("bound / fix the real cost of
  dropped-parcel-sweep") became this ticket. The human's own words on
  this half, preserved: "A healthy sweep must not be able to outrun the
  supervisor's stall window, or the stall window must not be able to
  false-positive on attributed progress." Also carried by the
  coordinator's priority-00 note 00_20260820T083313Z_000675 ("New root
  intake, human directed: handoffd dropped-parcel-sweep defect").

  Specifier probe at mint located the cost precisely, correcting the
  natural reading that the sweep is slow because it nudges: it emits no
  nudges at all in the whole rotated log. The cost is
  newest-trail-event-ms being called per item over an ever-growing
  mailbox history.

  Follow-on candidates deliberately NOT minted here, both needing a human
  call the specifier could not raise this turn (one clarifying question
  already pending): (a) share one per-cycle scan index across
  dispatch-gap-sweep / unassigned-active-nudge-sweep / dropped-parcel-sweep,
  which today pay three separate full passes; (b) a retention or
  compaction policy for completed/ and sent/, which grow without bound
  and set the floor for every one of those passes.

  Related: BL-977 (sibling guard - the halt this cost triggered);
  BL-967 (done/M8 - its sweep-boundary lines are the measurement this
  ticket is built on); BL-719 (the self-nudge exclusion preserved here);
  BL-222 (dispatch-gap scan dirs, shared definition).

  Orthogonality for the coordinator: touches
  swarmforge/scripts/chase_sweep_lib.bb and handoffd.bb's
  dropped-parcel-sweep! wiring. Overlaps BL-977 only on handoffd.bb -
  prefer sequencing the two rather than running them co-active.

approval_context: >
  One call to say the word on: this is minted as a SIBLING of BL-977
  rather than one combined daemon ticket. Either alone reduces the risk
  (the guard stops the false halt; this stops the condition that opens
  the window) and neither blocks the other. Severity high because the
  sweep blocks mail delivery for the whole swarm for up to ~2.5 minutes,
  not merely because it is slow. Two follow-ons are recorded in notes
  rather than minted - a shared per-cycle scan index, and a retention
  policy for the ever-growing completed/ and sent/ dirs - both wanting
  your word before they become tickets.
