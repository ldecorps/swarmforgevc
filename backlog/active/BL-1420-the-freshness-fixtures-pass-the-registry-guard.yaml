description: |
  ## What is wrong

  The coder's BL-1413 evidence (2026-09-05): BL-1011's property runner and
  the BL-1011 and BL-1012 acceptance features "are both silently broken on
  this branch by BL-784's registry guard, which landed after both were
  written." Reproduced by the specifier on `main` the same day:

      run_acceptance.sh specs/features/BL-1011-...feature   -> pass 0, 8 x "FRESHNESS_REGISTRY_GUARD: daemon 'babysitterd' has no row in freshness.conf"
      run_acceptance.sh specs/features/BL-1012-...feature   -> pass 0, fail 9, same line

  `daemon_log_freshness_check.sh` runs
  `daemon_log_freshness_registry_guard.sh` first (BL-784, closed 2026-08-27).
  The guard reads `FRESHNESS_CONF` and `FRESHNESS_REQUIRED` (defaulting to
  the live files) and refuses when (a) a daemon in the required registry
  has no conf row, or (b) any `$SCRIPT_DIR/*_supervisor.bb` on disk has no
  conf row - the second arm walks the live scripts directory whatever the
  conf. Three fixtures predate it and set only `FRESHNESS_CONF` to a
  one-row conf:

  - `specs/pipeline/steps/bl1011FreshnessAlarmNamesSwarmAndReasonSteps.js:70`
  - `specs/pipeline/steps/bl1012FreshnessSelfInflictedIncidentsSteps.js:108`
  - `swarmforge/scripts/test/bl1011_freshness_attribution_property_runner.bb:114`

  The two handlers fail every step that invokes the checker. The property
  runner spawns it with `:continue true` (line 126), so the refusal exits
  before any measurement, the announce is empty, and properties such as
  "every violation names its reason" hold over zero violations; only its
  coverage floors trip, and only at high run counts.

  BL-1399 (closed 2026-09-04) fixed the SAME class for
  `extension/test/bl1012FreshnessSelfInflictedIncidents.property.test.js`:
  a fixture `FRESHNESS_REQUIRED` registry plus one conf row per supervisor
  script derived from the guard's own glob (`supervisorNames()` there), the
  guard untouched. Its scope was that one fixture; these three were not in
  it.

  ## What is wanted

  - Each of the three fixtures passes the guard on its own terms: a fixture
    registry naming exactly the daemons its conf carries, and one conf row
    per live `*_supervisor.bb` (derived from the glob, fresh heartbeat, so
    the watchdog takes no action on it); only the row under test varies.
  - BL-1011's feature 8/8 and BL-1012's 9/9 on `main`; the bl1011 property
    runner's properties evaluate over real violations again.
  - The property runner treats an unexpected checker exit as a failed run
    naming the stderr line, never as an empty observation.
  - No change to the guard, the checker, or the live conf files.

  ## How (direction, not mandate)

  - Extract BL-1399's `supervisorNames()` and its conf/registry writer into
    one shared helper the vitest test and both step handlers require (e.g.
    `extension/test/helpers/freshnessFixture.js` or a sibling under
    `specs/pipeline/steps/helpers/`), so the JS derivation exists once; the
    bb runner derives from the same glob in Clojure (`fs/glob` on the
    scripts dir for `*_supervisor.bb`).
  - Scenario 04's scratch directory holds copies of the guard and checker
    beside N fake supervisor scripts, so the glob is exercised at a known
    count, never against the live directory's changing count.
  - In the runner, replace `:continue true` with a check of `:exit`: non-zero
    fails the run with the stderr; keep `:continue true` only if the exit
    is asserted immediately after.
  - Nothing here edits BL-1011's or BL-1012's feature files: their
    scenarios were right; their fixtures were stale.

  ## Out of scope

  - Any change to the guard's second arm (a seam for the scripts
    directory): BL-1399 chose to keep the guard fail-closed and untouched,
    and this ticket follows it.
  - BL-1413's own fixtures, which use the shipped conf and never meet the
    guard.

qa_e2e_procedure: |
  1. On the parcel and after landing on main:
     `bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1011-a-freshness-alarm-names-its-swarm-and-its-reason.feature`
     -> pass 8 / fail 0; the same for BL-1012's feature -> pass 9 / fail 0;
     `grep -c FRESHNESS_REGISTRY_GUARD` on both runs' output -> 0.
  2. `PROPERTY_RUNS=40 bb swarmforge/scripts/test/bl1011_freshness_attribution_property_runner.bb`
     passes with every coverage floor met; then edit the fixture registry in
     a scratch copy to name a daemon the conf lacks: the run FAILS naming
     the guard line (invariant 2), rather than reporting vacuous passes.
  3. `grep -n FRESHNESS_REQUIRED` in the three files returns the seam
     (required_wiring); `git diff main -- swarmforge/scripts/daemon_log_freshness_registry_guard.sh
     swarmforge/scripts/daemon_log_freshness_check.sh swarmforge/scripts/daemon_log_freshness*.conf`
     is empty (invariant 3).
  4. The BL-1420 feature passes all six scenario runs; BL-1399's and
     BL-784's features still pass.
  5. Scratch directories are removed on exit; nothing sweeps by prefix.

