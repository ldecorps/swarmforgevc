source: |
  Specifier census, 2026-10-03:
  backlog/evidence/BL-1870-merge-path-decline-census-20261003.md, cause 2.
  Lander logs .swarmforge/lander/BL-1901-cd74fb9ca0.log (02:09) and
  BL-1893-593e79cc91.log (05:41), both reading:
  "land-step replay: commit refused for <id> - daemon-cycle-guard:
  bounded-wait timeout after 60000ms" then "entangled tip - every ancestor
  sibling ticket has already landed, but the tip-pure replay could not
  complete cleanly; specifier adjudication needed."

description: |
  ## What is wrong

  land_step_lib.bb's tip-pure replay commits through `git!`, which runs
  every git command under `daemon-cycle-guard-lib/sh!` with the generic
  `SWARMFORGE_SUBPROCESS_WAIT_BOUND_MS` default of 60 s (the call is near
  line 3259, `"commit" "-q" "-m" (str task-ticket-id ": tip-pure replay
  ...")`). `git commit` runs the repository's pre-commit and commit-msg
  hook chains. Measured on 2026-10-03: the replay commit of BL-1893's two
  evidence files took 69 s at load average 14.3, with the property guard
  skipping. So on a busy host the hooks alone can outlast the wait,
  whatever the commit carries.

  The timeout is then reported as a commit refusal and classified as an
  entangled tip that needs specifier adjudication. The land stops with
  exit 3 and waits for QA. Nothing is entangled, and there is nothing to
  adjudicate.

  ## What is wanted

  - A replay whose commit hooks take longer than the generic subprocess
    wait completes and lands.
  - A commit hook's refusal still stops the land, with the hook's own words
    in the log (unchanged).
  - A replay commit that outlasts the land's own bound is reported as a
    timeout that names the bound. It is never reported as an entangled tip
    or a request for specifier adjudication.

  ## How (direction, not mandate)

  Give the replay commit a land-scale bound of its own, well above the
  hooks' measured time (the lander already lets a whole land run an hour
  before it reports it overdue, lander_lib.bb `overdue-ms`), with an env
  seam the acceptance can shorten. Read a daemon-cycle-guard timeout as a
  timeout in `replay-commit-refusal-reason` and in the escalation's
  classification, so it never reaches the entangled-tip text. Leave every
  other git call on the generic wait. The merge path's own `git merge`
  (land_merge_path.bb `build!`) runs without the wrapper and is not in
  scope.

  ## Scope

  swarmforge/scripts/land_step_lib.bb (the replay commit call, its refusal
  reason, the escalation's classification), its bb test runner, the new
  feature and its step handler bl1912LandReplayCommitBoundSteps.js.

qa_e2e_procedure: |
  On the parcel commit, ONE run each:
  1. `node specs/pipeline/cli.js specs/features/BL-1912-a-land-replay-commit-is-not-cut-short-by-the-subprocess-wait.feature`:
     01, 02, 03 ok.
  2. `node specs/pipeline/cli.js specs/features/BL-1631-a-land-retires-the-landing-tickets-own-register-rows.feature`
     and the BL-1901 feature: every scenario ok, as on main today.
  3. The land step's bb test runner(s) the coder names in the evidence:
     ALL PASS.
  4. Read the evidence: the coder states the new bound's value and why it
     sits above the measured 69 s with headroom.

