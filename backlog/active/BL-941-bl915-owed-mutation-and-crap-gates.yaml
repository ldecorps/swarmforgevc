description: |
  ## Why this ticket exists

  BL-915 is a hotfix stamp-off whose entire stated value is running the gates a
  hotfix bypasses. Its own `approval_context` names the mutation pass as the half
  that matters:

  > Scenarios 04 and 05 pin the over-matching half; the hardener's mutation pass
  > is what will probe the under-matching half.

  That pass did not run, and neither did CRAP. Both deferrals were correct by the
  standing rules — mutation was blocked unconditionally by the BL-149 file-change
  cooldown gate (`telegramCursorBridgeCore.ts` was 1.62 days old against a 3-day
  window), and CRAP needs a full `npm run coverage` sweep that the office-hours
  load rule forbids on a busy host. Neither is a defect in BL-915's work. But the
  debt only survives if someone holds it, and prose in an evidence file is not a
  holder. This ticket is the holder.

  ## What to do

  Run the two gates BL-915 could not, against the hotfix's production code in
  `extension/src/tools/telegramCursorBridgeCore.ts`:

  1. **Stryker mutation** scoped to the classifier — `isCursorAgentGone` and
     `shouldResetCursorAgentSession`. Check `mutation_cooldown_gate.bb` first: the
     file clears its 3-day cooldown on or after 2026-08-20, and if the gate still
     answers `skip-cooldown` this ticket waits rather than overriding it.
  2. **The CRAP gate** for the touched functions, threshold <= 6.

  Close whatever the gates surface by ADDING tests. The predicate is a regex over
  vendor error prose, so expect survivors around the loosened boundary, the
  dropped anchor, and the case-insensitivity flag — the scenarios below exist to
  pre-kill exactly those three.

  ## Step handlers are NOT inherited from BL-915

  BL-915's handlers are registered with `registry.defineScoped(..., FEATURE)`,
  scoped to its own feature name. This ticket's feature has a different name, so
  its scenarios resolve against nothing until this parcel lands its own handler
  file. Name it `specs/pipeline/steps/bl941CursorGoneAgentClassifierBoundariesSteps.js`
  and add it to the `DOMAINS` array in `specs/pipeline/steps/index.js` — the
  `required_wiring:` entry above gates precisely that, because a handler file
  nothing requires is a file the runner never sees.

  Follow BL-915's handler shape rather than inventing one: explicit `KNOWN_VALUES`
  lookup for every `Examples:` token, throwing on anything unknown, and cleanup via
  `node:test`'s own `afterEach`.

out_of_scope: |
  - Widening `isCursorAgentGone` to match messages it currently misses. The regex
    requires `agent` adjacent to `agent-<id>`, so a vendor rewording such as
    "Agent ID agent-x not found" or "Agent agent-x was not found" would slip
    through. That is a real question and BL-915 already prescribes the route for
    it: "If the gates show the pattern approach is untenable, raise it as its own
    ticket rather than widening this one." Raise it; do not fix it here. The
    scenarios below deliberately do not rule on those variants either way.
  - Replacing message-pattern matching with a structured error-code check.
  - The other three session-reset faults and the quota fail-fast path. BL-915's
    feature already gates those and re-asserting them here is duplication the
    IR-DRY pass will flag.
  - The systemic question of why full-suite gates keep deferring. That is BL-942.

qa_e2e_procedure: |
  1. Run `bb swarmforge/scripts/mutation_cooldown_gate.bb <repo-root>
     extension/src/tools/telegramCursorBridgeCore.ts` and confirm the decision is
     `run`, not `skip-cooldown`. If it still says `skip-cooldown`, this ticket is
     not ready and must go back rather than be waived.
  2. Confirm the evidence file records a real Stryker run — mutation score and a
     survivor list — scoped to the compiled classifier in `out/`, never `src/**/*.ts`.
     Zero survivors on `isCursorAgentGone` and `shouldResetCursorAgentSession`.
  3. Confirm the evidence file records a real CRAP number for both functions, <= 6,
     from an actual coverage run rather than a carried-forward figure.
  4. Confirm BL-915's own feature still passes unchanged — this parcel adds
     scenarios, it does not edit BL-915's.
  5. Confirm `specs/pipeline/steps/index.js` requires the new handler file, and
     that removing that one line makes the acceptance run fail rather than quietly
     skip. A registry entry nobody verified is the BL-419 failure shape.

notes: |
  2026-08-19 specifier, on minting: the hardener discharged its duty correctly
  here — it recorded the degraded fallback, refused to imply the gates had run,
  and handed the debt on by `note` exactly as engineering.prompt requires. This
  ticket is the receipt for that note, not a criticism of the pass.

  Timing: mutation cannot run before ≈2026-08-20 afternoon. The coordinator should
  not promote this ahead of that clock, and per Article 3.4 it is mutation-heavy
  work that belongs in an overnight slot — see BL-942 for why that slot may not
  currently exist on this host.

  The `depends_on: [BL-915]` is real: this ticket certifies BL-915's own subject
  matter, and running it against an unlanded parcel would mutate code whose tests
  are still in flight.

  IR-DRY disposition: the checker reports one medium near-duplicate pairing
  "a new agent is created" with "no new agent is created". Those are opposite
  assertions, not duplicates, and collapsing them would delete the boundary the
  scenarios exist to pin. Left as-is deliberately; do not "resolve" it.

