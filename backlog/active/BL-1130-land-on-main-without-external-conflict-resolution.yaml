description: |
  WHAT. Stop the standing failure mode where absorbing `origin/main` into
  local `main` (BL-891 / post-batch merge) while a ticket is landing
  produces git conflicts and parks the master checkout mid-merge until an
  external human resolves them.

  Measured 2026-08-25: dirty-blocked reconcile with `MERGE_HEAD` and
  `AA`/`UU` on the landing ticket (BL-1081, then again BL-1120 while that
  high defect was landing). BL-1120 correctly forbids aborting a foreign
  merge; it does not remove the need for a human to *finish* conflicted
  joins. BL-1118 still documents abort-on-conflict for the helper — that
  refuse path must become the only automated outcome, paired with a land
  preparation rule so normal lands do not hit it.

  WHY. Coordinator step-0 / wakes stay held on wait-dirty-clear while
  behind>0 and the tree is mid-merge. That is an ops page every land, not
  an exceptional hitchhike.

  HOW (direction, not mandate — specifier locks one shape):
  (a) Strengthen origin/main-only rematch so QA lands are absorbable as
  FF / non-conflicting joins into local main; and/or
  (b) Serialize land vs absorb on the master checkout (no concurrent
  conflicted merge); and/or
  (c) Absorb only from a worktree tip that already contains origin/main,
  never starting a content-conflict merge on master.
  Auto-resolving conflict file contents stays out of scope.

qa_e2e_procedure: |
  (1) Fixture: local main ahead, origin behind with overlapping ticket
  paths as today's land race — assert automated absorb either completes
  with behind=0 and no MERGE_HEAD, or aborts clean with rematch/refuse
  and a clean worktree (no unmerged paths).
  (2) Successful land under the new rule reaches behind=0 without a
  human conflict-edit step.
  (3) Alert/surface text never instructs "finish this merge in an editor"
  as the designed recovery for that path.
  (4) Record degraded Babashka gate where applicable (no mutation/CRAP).

out_of_scope: |
  - Auto-merging conflicted file contents with heuristics.
  - Changing who may push origin/main.
  - Reverting BL-1120 (foreign merge abort skip stays).
  - Unrelated overnight dirty WIP hygiene outside land/absorb.

