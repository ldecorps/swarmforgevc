description: |
  ## The whole change

  One clause added to the constitution's amendments article, plus a citation
  from `specifier.prompt` back to it so the role that exercises the authority
  points at the law rather than restating it.

  Draft wording:

  > **A consolidation never drops a human sentence.** When intakes or tickets
  > are merged, split, or otherwise reshaped before entering the pipeline,
  > every directive quoted from a human survives verbatim into the resulting
  > ticket or tickets. A consolidation that cannot preserve one is refused,
  > not trimmed.

  ## Why law and not prompt

  BL-680 grants the specifier the power to rewrite the shape of its own
  inputs. The guarantee that the human's words survive that rewrite should not
  live in the same document as the power — and should not evaporate the day
  the authority moves to another role. A rule in `specifier.prompt` reaches
  the specifier; a rule in the constitution reaches whoever consolidates next.

  ## Where it lands — ruled, not chosen by the coder

  **Article 5** (`swarmforge/constitution/articles/05_amendments.md`), by the
  human's ratification of 2026-07-26. Article 3 was the considered alternative
  and was NOT chosen; do not relocate the clause on your own judgement.

  ## Why it was human-gated

  Article 5.1: a constitutional change is ratified by an explicit human
  decision, never by a pipeline merge. That ratification has now been given —
  the clause and its home are settled, and this ticket is ordinary pipeline
  work from here.

