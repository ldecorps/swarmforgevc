    generation; `304` with the `etag` and no body when the held generation still
    matches; `404 unknown_package`; `503 unreadable_package` with a reason.
  - Two packages exist today: `backlog` (the active/paused/hold/done folders) and
    `docs` (the vision documents). Both sit behind the bridge's existing client
