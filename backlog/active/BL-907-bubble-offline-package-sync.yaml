  - `GET /companion-manifest` answers `{ packages: [{ name, generation, format,
    formatVersion }] }` (`extension/src/bridge/companionManifest.ts`, dispatched
    by `bridgeServer.ts:tryServeCompanionRoutes`).
  - `GET /companion-package/<name>[?generation=<held>]` answers `200` with
