qa_e2e_procedure: |
  Recorded manual device procedure, with Bubble paired to a live bridge:

  1. Fresh install, before any sync — expect a read to report that nothing is
     held, not an empty package.
  2. Sync — expect both `backlog` and `docs` held, each labelled with the
     generation the manifest advertised (compare against
     `GET /companion-manifest` on the host).
  3. Sync again with nothing changed on the host — expect the same generations
     and no body on the wire (check the response size / a `304`, not just that
     it succeeded).
  4. Change the backlog on the host so the generation moves, sync — expect the
     new body and the label moved with it.
  5. Put the phone in airplane mode and read both packages — expect the cached
     bodies, each still labelled at its own generation.
  6. Stop the bridge, sync — expect the refresh failure reported and both
     packages still readable at their previous generations.
  7. Make a package source unreadable on the host (BL-866 answers `503`), sync —
     expect the failure reported for that package, the previously held copy
     intact, and the other package refreshed normally.

notes: |
  BL-908 reads the store this slice writes, and is the reason it is worth
  building: shipped alone, this slice's only visible surface is its own sync
  state. The two are sequenced deliberately (BL-298's lesson — a consumer built
  over a store nothing writes stays dark), and the human commissioned both in
  one breath.

  The generation is the whole cache key: BL-866's own note flags that whatever
  identifies a generation must change whenever content changes. The phone half
  must not weaken that — it caches BY the generation and must never invent,
  truncate or normalize one.

  Fast-tracked at the human's request: the coordinator engages ambulance mode for
  this ticket, then for BL-908 (`docs/how-to/BL-655-ambulance-mode-the-hold.md`),
  rather than letting either take the normal promote queue.
