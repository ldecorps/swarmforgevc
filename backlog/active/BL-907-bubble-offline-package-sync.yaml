    first phone-side reader.

description: |
  ## What this slice adds

  Bubble stops being online-only. It holds the bridge's packages on the device
  and reads from what it holds:

  - **Network-first, cache-backed.** A sync asks the bridge for the manifest and
    refreshes each package it advertises. What comes back is kept on the device.
  - **Cheap refresh.** A package already held is asked for by the generation
    the device holds, so an unchanged package costs no body on the wire. This is
    what makes keeping current affordable on a phone.
  - **Reads survive the bridge.** Once a package has been synced once, reading it
    works with the bridge unreachable — a tube, a plane, a dead tunnel.
  - **Honest age, always.** Every read carries the generation it was cached at,
    so nothing cached is ever presented as live. This is the human's "as of
    <generation>" requirement, and it is an invariant, not a label on one screen.
  - **A bad sync costs nothing.** Unreachable bridge, refused package, unknown
    package, interrupted transfer — each is reported, and each leaves the copy
    already held intact and readable. Losing offline data to a failed refresh is
    the one outcome this slice exists to prevent.
  - **Nothing held reads as nothing held.** Before a first successful sync a read
    says so, rather than answering with an empty package.

  Phone-side only. No bridge change: BL-866's contract is used exactly as it
  landed.

  ## How (direction, not mandate)

  `BridgeClient` already owns the phone's authorized HTTP against the bridge and
  `CompanionPrefs` already owns small durable state; package bodies are too big
  for `SharedPreferences`, so a file-backed store in app storage is the obvious
  home. The coder chooses the shapes.

  ## Testability (Bubble boundary)

  Per the Bubble testability boundary, the decisions in this slice must not sit
  on the device side of the line:

  - The sync and cache DECISIONS — which packages to refresh, which generation to
    send, what to keep when an answer fails, what generation a read is labelled
    with, what a read answers when nothing is held — belong in pure Kotlin with
    no `android.*` type in the signature, covered by the JVM unit suite
    (`./gradlew :app:testDebugUnitTest`). Every scenario in the feature file is
    expressible there.
  - Only the storage and lifecycle wiring is device-surface, verified by the
    recorded manual procedure below.
  - No mutation/CRAP/DRY gate exists for `.kt`: the hardener applies the
    documented unit-test-gap fallback and must record that it did.

  ## Not in scope

  - Any browse UI over the cached packages — BL-908, the slice that reads this.
  - The offline groom mutation outbox (write path) — a later slice of BL-865.
  - New packages beyond the `backlog` and `docs` that BL-866 serves — each new
    corpus root is bridge-side work of its own.
  - Protobuf. Deferred by the human; this is the REST + JSON contract.

