description: |
  ## What

  Restore a commitable property lane: either make `npm run test:properties`
  green on the coder worktree tip, or replace silent standing reds with an
  explicit allowlist so an unrelated green parcel (BL-605) can commit without
  `SWARMFORGE_SKIP_PROPERTY_SUITE_GUARD=1`.

  ## Evidence (2026-08-27)

  - BL-605 acceptance 4/4 + its property tests green after vitest-globals fix
  - Full suite: 604 tests, 594 pass, 10 fail, ~22 files failed
  - Pre-commit: `Commit rejected: property suite failed...`
  - Intermittent BL-1124 canary when suite mutates HEAD during hook

  ## How (direction, not mandate)

  Inventory the failing files; fix or allowlist each. Do not weaken the guard
  for ordinary extension/src commits. Ops expedite with stack stopped is out
  of band — this ticket restores the standing path.

qa_e2e_procedure: >
  (1) Inventory standing reds with disposition. (2) Commit fixture staging only
  green BL-605-shaped paths without SKIP — guard allows. (3) SKIP still
  recovery-only. (4) Stock suite does not trip BL-1124 canary / bare flip.

out_of_scope: |
  - Implementing BL-605 product behaviour (already staged; this unblocks commit).
  - Making SKIP the standing recipe (forbidden by BL-1121).
  - One-off ops bounce with stack stopped (temporary unblock only).

