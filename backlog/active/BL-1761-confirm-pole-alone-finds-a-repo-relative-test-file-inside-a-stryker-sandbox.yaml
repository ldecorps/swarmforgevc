id: BL-1761
title: "confirmPoleAlone finds a repo-relative test file inside a Stryker sandbox - recordTestDuration.js resolves 'extension/test/x.test.js' against REPO_ROOT_DIR (one directory above the extension root), which in a sandbox is .stryker-tmp/ with no extension/ child, so confirmPoleAloneOutcomeShapes.test.js fails in every sandbox's initial test run and Stryker refuses to mutate ANY target on this host since BL-1721 landed (2026-09-24)"
