id: BL-1024
title: "an expedited run ends without naming what it left behind - parked tickets stranded in hold/ and backlog moves staged but uncommitted - so the pipeline can sit idle with an empty active/ until a human happens to notice"
milestone: M8
type: defect
severity: high
# high, not critical: the swarm was idle rather than down, and no work was
# lost - but it is a live fault that stalled the pipeline until a human was
# told, and it leaves staged moves in a shared checkout where an unrelated
# commit would sweep them.
status: todo
epic: swarm-reliability
priority: 70
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1024-an-expedite-run-names-what-it-leaves-behind.feature

invariants:
  - "An expedited run never ends reporting success while leaving backlog or index state that its own closing summary does not name."

source: |
  Observed live by the specifier, 2026-08-21 20:36, after the BL-1021
  expedited run (run 2) completed and passed all seven stages.

  State found: backlog/active/ empty, every role mailbox empty, the whole
  pipeline idle. BL-586, BL-1012 and BL-1017 sat in backlog/hold/ where the
  run had parked them. Four backlog moves - those three parks plus
  BL-1021 paused/ -> done/ - sat STAGED and uncommitted in the shared master
  checkout, so committed main still showed the pre-run backlog while the
  working tree showed the post-run one.

  The run's own terminal output was "ticket=done restart=failed" plus a
  progress JSON blob. It named none of the above.

description: |
  ## What happens

  Both deferrals are deliberate and documented, and neither is the defect:

  - `move-ticket!` (expedite_cli.bb) moves tickets with `git mv`, which
    stages. The manual's "What it deliberately does not do" says
    "**No commit on `main`** outside the QA stage's own merge."
  - `parked-report` (expedite_lib.bb) returns `:promoted []` with the note
    "left in hold/ deliberately; promotion is not the expeditor's call",
    because a parked ticket may be stale against what the run changed.

  The defect is that neither deferral has an owner, a trigger, or a mention
  in the closing summary. Both are handed to nobody:

  - Article 3.1 makes `backlog/hold/` human-held and forbids auto-promotion
    from it, so the coordinator may not restore the parked tickets on its
    own even after it notices active/ is empty.
  - The staged moves sit in the master checkout, which every role shares.
    Nothing tells anyone to commit them, and until someone does, main and
    the working tree disagree about where four tickets live. Worse, a role
    committing anything else in that checkout sweeps them into an unrelated
    commit - the failure mode the master-checkout discipline rules exist for.

  A run can therefore report success and leave the swarm stalled. That is
  what happened on 2026-08-21: the pipeline idled with an empty active/ and
  empty mailboxes until a human was told.

  ## Why the closing summary is the right place

  The expeditor may not use `handoffd`, `swarm_handoff.bb`, the mailboxes,
  tmux, or the coordinator - the manual lists them under "Machinery it may
  never use". It cannot notify anyone through the swarm. Its only channel to
  the next actor is what it prints and what it writes to `run.json`. The
  data is already in `run.json` (`park`, `restart.still-held`); it simply
  never reaches the human reading the terminal.

  Note the precedent: the run already reports a `deferred` list
  (`bl-topic-record`, `briefing-hooks`, `pipeline-stage-sync`). These two
  deferrals belong in the same class and are missing from it.

  ## How (direction, not mandate)

  - Give the run a closing summary that enumerates what is OUTSTANDING, and
    name an owner for each item - not just what it did.
  - Prefer deriving it from state the run already records rather than
    tracking it a second time; `park-record.json` and the ticket move both
    already exist as facts.
  - It must survive an unhappy ending. A run that bounced past its bound,
    overran a stage timeout, or failed its restart is exactly when the
    leavings matter most, and is the case that actually bit.
  - Keep it honest in both directions: a run that parked nothing must not
    manufacture a handover, and a dry run has nothing outstanding at all.
  - The manual's "What it deliberately does not do" entries should say who
    picks each one up, so the deferral is a handover rather than a drop.

  ## Scope

  - swarmforge/scripts/expedite_lib.bb - the outstanding-work summary as a
    pure function over facts the run already holds
  - swarmforge/scripts/expedite_cli.bb - the call site that prints it at the
    end of every run, including the failure paths
  - docs/reference/BL-567-expeditor-manual.md and
    docs/how-to/BL-567-expedite-one-ticket-with-the-swarm-stopped.md - the
    owner for each deferral
  - specs/features/BL-1024-an-expedite-run-names-what-it-leaves-behind.feature
    and its step handlers

  Out of scope: changing either deferral itself. This slice does not make
  the expeditor commit on main and does not make it re-promote parked
  tickets - both are deliberate decisions with recorded rationale, and
  reversing either is a separate question. The run-ticket move BL-1023
  fixes is also out of scope; that ticket is about the move happening at
  all, this one about the run saying what it left.

qa_e2e_procedure: >
  1. At the parent commit, drive an expedited run (stage-runner seam, all
     stages seeded to pass) for a ticket in backlog/active/ with at least
     one OTHER ticket also active. Capture the run's full terminal output.
     Confirm it names neither the parked ticket nor the staged backlog
     moves, and confirm `git status` shows those moves staged and
     uncommitted. Confirm the absence before confirming the presence.

  2. At the parcel commit, repeat with the same fixture. Confirm the closing
     summary names the parked ticket, the folder holding it, who decides
     whether it returns, the uncommitted backlog moves, and who must commit
     them.

  3. Repeat once with the restart phase forced to fail. Confirm the closing
     summary still names both - this is the case observed on 2026-08-21.

  4. Confirm the two honesty cases: a run with no other active ticket
     reports that no tickets are held, and a `--dry-run` reports nothing
     outstanding and leaves `git status` clean.

notes: |
  IR-DRY reviewed, not merely run. The first draft scored one genuine
  near-duplicate at 0.75 - "reports no uncommitted backlog moves" against
  "reports that the backlog moves are uncommitted", the positive and
  negative of one predicate phrased two different ways. That was accidental
  drift and is fixed.

  Four medium-confidence `possible-synonym` findings remain and should NOT
  be "fixed":
  - `lists "the parked tickets" as outstanding` and
    `lists "the uncommitted backlog moves" as outstanding` are ONE
    parameterized step over a quoted subject and must bind to ONE handler.
    The quoting is deliberate and marks the parameter; the checker does not
    normalize quoted literals, so it scores them as distinct texts anyway.
  - `lists nothing as outstanding` scores against both, but asserts an empty
    list rather than a subject, which is a genuinely different check.
  - `names who must commit them` and `names who must decide whether they
    return` name owners for two different subjects. Collapsing them would
    hide that there are two owners, which is the point of the ticket.

  No `required_wiring:` is declared, deliberately. The mechanism here IS the
  closing summary, so a summary that is never printed fails every scenario
  in the feature file - the acceptance contract already gates the call site
  end to end. Adding a wiring entry would mean guessing a function name that
  does not exist yet, which is the BL-874 failure mode.

  Sibling of BL-1023 by mechanism (both are the expeditor's teardown
  bookkeeping) but independent of it: neither blocks the other, and they
  touch different functions. BL-1023 is about the run ticket's move
  happening; this is about the run declaring what it left for someone else.

