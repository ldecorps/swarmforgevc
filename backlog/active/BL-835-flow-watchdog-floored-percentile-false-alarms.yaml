  - "A calibrated specs entry is emitted only when the raw warn percentile is >= min-warn-ms; the floor never invents a warn threshold."
  - "decide-tier still never sees from/to/type/dormancy; resolution stays outside it."
  - "Absent or rejected calibration still resolves to a usable warn/escalate pair (global fallback); the watchdog never disables itself."

required_wiring:
  - "swarmforge/scripts/flow_watchdog_lib.bb::thresholds-from-samples::reject-below-gate not floor-clamp"
  - "swarmforge/scripts/test/flow_watchdog_test_runner.bb::sub-floor samples do not WARN a 90s parcel under global 15m"

verification: |
  ## Gate

  Extend `bb swarmforge/scripts/test/flow_watchdog_test_runner.bb` (already
  green). No mutation tooling for Babashka.

  ## e2e QA procedure

  1. Seed >=8 completed hops on a route with residence well under 60s. Run
     calibrate. Confirm no exact (and no to-type, if all samples are that
     route) entry is written for that key.
  2. Place a ~90s live parcel on that route. Sweep with global 15m/1h.
     Confirm zero alarms.
  3. Seed a route whose p67 is ~12 minutes. Confirm it still calibrates and
     still WARNs a parcel past that warn (regression of the good path).
  4. Confirm the percentile-section comment no longer claims `*->*|type`
     fallthrough.

out_of_scope: |
  - BL-650 active-time clock.
  - Re-adding `*->*|type` into resolve-thresholds.
  - BL-827's adaptation-hazard ceiling options (a)/(b)/(c).
  - Changing the unsuppressable posture or snooze semantics.
  - Raising the global 15m/1h defaults.

