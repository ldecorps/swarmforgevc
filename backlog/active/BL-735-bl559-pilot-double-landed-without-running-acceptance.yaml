description: |
  ## What

  BL-559 moved paused -> done on 2026-07-29, was reverted, then re-landed
  done on 2026-07-30 — a double-landing that is itself a landing-hygiene red
  flag — and at no point did the pilot run the ticket's own named acceptance
  feature. On a live QA pass this is the final gate before merge (Article
  4.1/4.2); its absence here is exactly the kind of gap BL-723 exists to
  surface.

  ## Question to answer

  What caused the first done-landing to get reverted, and did the pilot's
  QA-equivalent step ever actually execute
  specs/pipeline/scripts/run_acceptance.sh (or the CLI directly) for this
  ticket at either landing? Harden `/pilot` so a ticket cannot reach done/
  without its own acceptance feature having actually run (not merely being
  present), and so a revert-then-relanded ticket carries a visible note
  explaining why.
qa_e2e_procedure: >
  (1) Declared acceptance never executed → land refused. (2) Green pipeline run
  before done move with receipt. (3) Revert-reland requires visible yaml notes.
  (4) Double-land without receipt at either attempt blocked. (5) Failed run inert.
out_of_scope: |
