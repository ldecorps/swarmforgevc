notes: |
  Minted 2026-09-24 by the specifier (claude-opus-5-5 seat). Approved at
  mint under the human's explicit queue-jump request (STEERING.md
  2026-09-23; 2026-09-15 ruling); no choice posed.

  Deviations from the intake, stated: (1) in-process resume moved to
  BL-1698 because re-serving a parcel is the driver's job; (2) depends on
  BL-1697 as well as BL-1696, because `seat test` reads the driver's
  record when aider's own test loop runs it without a ticket in the
  environment; (3) the role note is `.note`, not the card's `.prompt`,
  and the coordinator card stays inert pending BL-1702.

  INVEST: Independent (BL-1696/BL-1697 by depends_on), Negotiable (note
  wording, golden shape, where the checks live are direction), Valuable
  (removes the live hazard of an editable pipeline script in every aider
  seat and ~18k tokens per request), Estimable (generated-text changes in
  three known functions, one sitting), Small (six scenarios, two
  invariants), Testable (generated launch lines and texts, no model).

