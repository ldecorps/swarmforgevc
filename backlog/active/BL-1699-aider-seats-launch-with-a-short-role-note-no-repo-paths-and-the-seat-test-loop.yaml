title: "Aider seats launch with a short read-only role note instead of the constitution, pipeline and role prompt, a bootstrap text that names no repo path, no pipeline script and no bang command, aider's own test loop running `seat test` on coder seats, and the pack's aider timeout on the launch line - so no pipeline script ever enters an aider seat's chat; Claude seats unchanged"
