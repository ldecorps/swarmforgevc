human_approval: approved
approval_context: >
  Queue-jump slice L3 of INTAKE-local-aider-seats-20260924, minted approved
  under the human's own jump request (STEERING.md 2026-09-23; 2026-09-15
  ruling). No choice is posed. FIRM: no pipeline script is ever in an
  aider seat's chat, editable or read-only; Claude seats' launch lines and
  bootstrap texts are byte-identical to before.

invariants:
  - "No text an aider seat is given at launch or bootstrap (launch arguments excepted) contains a path that exists in the repository or the basename of any file under swarmforge/scripts."
  - "For every non-aider provider in every pack conf, the generated launch line and bootstrap text are byte-identical to the output of main before this ticket."

description: |
  ## What is wrong
  Measured 2026-09-23 (`backlog/evidence/aider-seat-context-budget-20260923.md`,
  `backlog/evidence/aider-seat-lab-20260924.md`):
  - The aider bootstrap text (`prompt_engine_lib.bb` `aider-bootstrap-text`)
    names `ready_for_next.sh` and the handoff draft path. aider auto-adds
    every mentioned path, so under `--yes-always` each aider seat had a
    pipeline script in its chat as an EDITABLE file with auto-commit on;
    lab S1 watched the 7B model rewrite one twice.
  - `bootstrap-steps` (`agent_runtime_lib.bb`, `:add-files-then-paste`)
    `/add`s `constitution.prompt`, `PIPELINE.md` and the role prompt. The
    coordinator's first request was 20,381 tokens against an 8,192 window;
    Ollama silently dropped the oldest messages, which were exactly those
    files. The constitution an aider seat gets is a 390-token index that
    claims the articles are "inlined right after", which is false there.
  - The bootstrap tells the model to reply with `!` lines. aider never
    runs a model's `!` line (BL-1696), so the instruction is inert.
  - The OpenAI client's 600 s default timeout is shorter than a cold CPU
    turn; the SDK retried three times inside one aider attempt.

  ## What is wanted
  1. **Role note, read-only.** An aider seat's launch line loads
     `swarmforge/roles/aider/<role>.note` with `--read` when that file
     exists, else a generic note. This slice writes the coder's note (a
     few lines: it edits code to satisfy a read-only ticket and its
     acceptance feature, it never edits a read-only file, instructions
     arrive one at a time in the chat) and the generic one. No bootstrap
     step `/add`s the constitution, the pipeline or a role prompt for an
     aider seat.
  2. **Bootstrap text** for every aider role: no path that exists in the
     repository, no basename of a file under `swarmforge/scripts`, no
     "reply with `!`" instruction.
  3. **Coder seats** get `--test-cmd` running `swarmforge/scripts/seat
     test` and `--auto-test`; other roles get neither.
  4. **`seat test` scope from the driver.** When `SEAT_TICKET` /
     `SEAT_ACCEPTANCE` are unset (aider's own test loop does not set
     them), `seat test` reads them from the running role's BL-1697 driver
     record; with no record it runs the command unscoped, as BL-1696 does.
  5. **Timeout.** A pack `config aider_timeout_seconds <n>` becomes
     `--timeout <n>` on every aider launch line; absent, no flag (aider's
     default).

  ## How (direction, not mandate)
  - The existing inert card `swarmforge/roles/aider/coordinator.prompt`
    (2945f2d07f) is NOT loaded by this slice: whether an LLM coordinator
    exists at all is the BL-1702 ruling. The coordinator seat gets the
    generic note until then.
  - Keep the role notes out of `standing_rule_violations_files.bb`'s scan
    unless that file scans `roles/` recursively; they are not rule
    sources.
  - Edit format and context size per model come from the probe (BL-1700)
    and from the pack's own window line (`--edit-format`, already passed
    through `extra_cli`); nothing to build here.
  - The byte-identity check for non-aider providers: capture the generated
    launch scripts and bootstrap texts of every pack from main before the
    change as a committed golden fixture, and compare.
  - `test_aider_seat_launch_config.sh` (ab1d4cb2bd) is the natural home
    for the launch-line checks; extend it rather than add a sibling.
  - Documenter: the aider seat section of the local-model how-to (what an
    aider seat receives at launch, the role notes, the timeout key);
    `architecture.mmd` is not triggered (no host/webview/tmux/state-layout
    change).

  ## Scope
  - `swarmforge/scripts/swarmforge.sh` (aider launch line),
    `swarmforge/scripts/prompt_engine_lib.bb` (aider bootstrap text),
    `swarmforge/scripts/agent_runtime_lib.bb` (aider bootstrap steps),
    `swarmforge/scripts/seat` (test scope fallback).
  - New: `swarmforge/roles/aider/coder.note` and a generic note.
  - `swarmforge/scripts/test/test_aider_seat_launch_config.sh` and a golden
    fixture; new `specs/pipeline/steps/bl1699AiderSeatLaunchAndBootstrapSteps.js`
    (BL-233).
  - Docs as above.
  - Out of scope: the driver (BL-1697, BL-1698); the coordinator card and
    any relay (the BL-1702 ruling); edit-format choice per model (BL-1700);
    Claude seats and packs.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule). The live router is
  NOT started (T1 slice).
  1. `node specs/pipeline/cli.js specs/features/BL-1699-aider-seats-launch-with-a-short-role-note-no-repo-paths-and-the-seat-test-loop.feature`:
     all scenarios ok.
  2. `bash swarmforge/scripts/test/test_aider_seat_launch_config.sh`: PASS.
  3. Generate the ollama-qwen2.5-coder-mono-router coder seat's launch
     script and bootstrap text the way the test does and read them: the
     bootstrap text names no `ready_for_next`, no `handoff-draft`, no
     `swarmforge/`; the launch line has `--read` on the coder note,
     `--test-cmd` and `--auto-test`.
  4. `git diff main...HEAD --name-only` names only the Scope files, the
     golden fixture, docs and evidence.

