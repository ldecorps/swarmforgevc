  3. `node specs/pipeline/cli.js specs/features/BL-1052-a-role-seat-can-be-staffed-by-a-downloaded-local-model.feature`
     passes (measured at mint on HEAD 5a89725e03: 9 of 9 ok).
  4. shim.log after 2026-10-03 12:53 BST (the live restart onto this code)
     has no rewritten= value above 1.

