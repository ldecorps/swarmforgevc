description: |
  ## Status: hotfix 5a89725e03 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  The seat's ten blind calls: ollama show, a grep, the acceptance feature,
  write_file to backlog/evidence/BL-1916-coder-$(date +%Y%m%d).md (a literal
  path, since write_file runs no shell), git add of the expanded name
  (pathspec error), git commit (refused), a tmp/handoff.txt reading "NONE"
  (HANDOFF INVALID), swarm_handoff.sh, done_with_current.sh
  (FORWARD_NOT_SENT) and ready_for_next.sh. Its card described the draft as
  "plain field: value lines" with no example, and named cleaner as the next
  stage although BL-1916's required_stages is [coder, qa].

  ## What the hotfix changed

  - local_model_tool_call_shim.py: rewrite_completion turns only the FIRST
    text tool call into a tool_call and drops the rest from the reply's
    text. A reply with native tool_calls is untouched.
  - swarmforge/roles/local-model/loop.note (every local seat's card): run one
    command at a time and read its output; write_file and edit paths are
    literal (`$(date +%Y%m%d)`, `~`).
  - swarmforge/roles/local-model/coder.note: the git_handoff goes to the
    stage after coder in required_stages (cleaner when present), and the
    card shows the five draft lines with a 10-character commit.

  ## What each stage checks

  - Coder: the change against the description and the invariant, the new
    unit case test_a_reply_of_many_calls_runs_only_the_first, and whether
    the other local role notes (cleaner, architect, hardender, documenter)
    need the same required_stages wording - say so in evidence; do not
    change them here. Evidence: backlog/evidence/BL-1926-coder-<date>.md.

