human_approval: approved
approval_context: >
  First of three slices from the human's 2026-10-07 intake (full forge on
  16 GB, one iq3 decode slot). A new feature file needs the human's look.
  No choice is posed. What needs sign-off: the seat rides in the URL each
  seat is launched with, and the shim only logs it in this slice. FIRM:
  every request reaches Ollama with the same body and /v1 path as today; a
  client at the plain /v1 path (no seat) is still served.

invariants:
  - "Every request the shim forwards reaches Ollama with the same method, body and /v1 path as before this slice; the seat changes only what the shim logs and reports."

description: |
  ## What is wrong

  swarmforge.sh gives every local-model seat the same URL,
  `http://127.0.0.1:11439/v1` (`local_model_seat_url`), so the one
  host-wide shim (local_model_tool_call_shim.py) sees anonymous requests.
  On iq3 a completion that follows another seat's is a full re-prefill:
  serve.log on 2026-10-08 shows 23-38 s for 20-30k-token prompts and 66 s
  at 50k, against 0.5-2 s for a cached continuation, because qwen35's
  cache cannot rewind to a shared prefix (BL-1978). Nothing can count
  those switches today, and BL-2077's decode slot needs to know which seat
  holds it.

  ## What is wanted

  - A local-model seat's URL names its seat (the role, `coder@2`
    included), and the shim reads the seat from it and forwards the
    request to Ollama's /v1 path unchanged (scenario 01, invariant).
  - One shim log line per chat completion: seat, duration ms, prompt
    tokens (the reply's usage), and `switch=1` when the previous chat
    completion the shim forwarded came from another seat, `switch=0`
    otherwise (scenarios 01, 02).
  - A request at the plain /v1 path is served as today and logged with
    seat `-` (scenario 03): older launch scripts and any other local
    client keep working.
  - `GET /shim/health` adds the last seat served.
  - Living doc: docs/how-to/BL-1052-local-model-seat-launch.md, section
    "A local-model seat's requests go through a tool-call shim (BL-1917)",
    gains the seat in the URL and the log line's fields.

  ## How (direction, not mandate)

  - A path prefix such as `/seat/<seat>/v1`, stripped by the shim before it
    builds the upstream URL; `@` is legal in a path segment.
  - `local_model_seat_url` takes the role as a second argument; the launch
    writer already has `$role` in scope beside `$lm_url`.
  - The handler starts the real shim (`serve --port <free>`) against a fake
    Ollama (a local HTTP server recording paths and bodies) and builds the
    seat URL with the real `local_model_seat_url`, extracted from
    swarmforge.sh the way test_bl1917_local_model_seat_url.sh does.

constraints: >
  A fake Ollama and a free port only: never the live shim on 11439, never
  the live Ollama on 11434, never the live shim log. bash 3.2 rules in any
  shell. The step handler lands with the feature (BL-233). A running shim
  is not restarted by a land: QA's live step restarts it.

out_of_scope: |
  - The decode slot itself (BL-2077).
  - Any change to what Ollama receives.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2076-the-tool-call-shim-names-the-seat-behind-every-chat-completion.feature`:
     4 of 4 ok (01 x2, 02, 03).
  2. `bash swarmforge/scripts/test/test_bl1917_local_model_seat_url.sh`
     (no lane runs it; it also runs the shim's unittest file): all PASS.
  3. After the land, at the next swarm relaunch (the shim is host-wide and
     `ensure` reuses a running one, so stop the old shim process first):
     `.swarmforge/local-model-shim/shim.log` carries lines naming the live
     seat; record one in the QA evidence.

