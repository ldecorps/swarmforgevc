id: BL-1853
title: "A land reads each commit's diff once - the land plan runs git log -p for every ticket-tagged non-merge commit between origin/main and the cited tip on every land (3696 of 8069 commits on 2026-09-30); a commit's diff never changes, so it is kept by commit id and a land reads only the commits no land has read before, with the same verdict"
milestone: M8
type: defect
severity: high
# high: a live fault degrading behaviour. A land took 13 min by the
# afternoon of 2026-09-30, against 2 to 6 min the evening before. The walk
# grows with every role-branch merge, so the time keeps rising.
status: todo
epic: swarm-reliability
priority: 1
direction: queue-jump
depends_on: [BL-1852]
# Same file as BL-1852 and BL-1830 (land_step_lib.bb). BL-1852 also stops
# the re-point from giving thousands of commits new ids on every land,
# which a cache by id cannot hit.
mutation_cost: medium
# medium: a content-addressed cache threaded through the land plan's
