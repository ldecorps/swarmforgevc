source: |
  Architect round-4 review of BL-530/BL-560 (2026-07-23,
  backlog/evidence/BL-530-architect-approval.md), recorded there as an explicit
  "Finding (separate ticket, NOT a send-back)" with the shape left as the
  specifier's call. It is pre-existing at `main` AND at the pre-clobber
  original, so it was correctly not folded into BL-530's parcel — the architect
  reproduced it at four separate commits (`tmp/repro_sequential_respawn.sh` in
  the architect worktree) and confirmed BL-530 neither introduces nor worsens it.

  Specifier verified the mismatch directly on `main` before speccing:
    - swarmforge/scripts/swarmforge.sh:709 (is_sequential_dormant) —
      `[[ "$ROTATION_MODE" == "sequential" || "$ROTATION_MODE" == "router" ]]`
    - swarmforge/scripts/mono_router_lib.bb:18 (conf-rotation-router?) —
      regex `(?m)^(?:config\s+)?rotation\s+router\b`, router only
    - swarmforge/scripts/swarm_ensure.bb:159 (rotation-router-mode?) — ORs the
      two router-only predicates
    - swarmforge/packs/mono-rotate.conf is the one shipped pack declaring
      `config rotation sequential`
  No existing backlog item covers it (grepped paused/active/hold).

description: |
  ## The defect

  The launcher and ensure disagree about what `rotation sequential` means.

  `swarmforge.sh`'s `is_sequential_dormant` treats **both** rotation values as
  the same single-resident topology (its BL-518 comment says so explicitly):
  only the resident agent and the coordinator get a real session/process, and
  every middle pipeline role stays dormant — worktree + roles.tsv + a
  pre-generated launch script only — until the resident respawns its own pane
  as that role.

  Ensure's declared signal matches the literal `router` alone. So on a
  `mono-rotate` pack the launcher deliberately creates no middle-role sessions,
  and then `./swarm ensure` classifies those same roles as broken panes and
  drives them into repair.

  ## Why it matters

  A single `./swarm ensure` on a mono-rotate swarm starts five extra agent
  processes — on precisely the memory-constrained host mono-rotate exists to
  serve (its own conf names the FES 15GB box, which has already OOM-crashed
  under a full swarm). It is silent: the ensure report shows repairs, not a
  warning, so the operator sees "healed" rather than "over-provisioned".

  No effect on the swarm running today, which declares `rotation router`.

  ## Wanted

  Give ensure a predicate that recognises the single-resident topology by ALL
  the values the launcher already accepts, so the two agree.

  ## Constraints

  - **Do not widen `conf-rotation-router?` in place.** `ready_for_next_task.bb`
    and `ready_for_next_batch.bb` consume that exact predicate for the
    ROTATE_HOME backstop. Widening it there changes when a non-home role gets
    sent home — a behavior change that needs its own spec and tests, and is NOT
    in this ticket. Scenario 03 pins that path unchanged.
  - **Add the new predicate to the pure module.** `mono_router_lib.bb` is pure
    (text/data in, decisions out) and is where the architect's review says this
    belongs; all tmux/conf IO stays at the edge in `swarm_ensure.bb`. Suggested
    name from the review: `single-resident-rotation?` matching `router|sequential`.
  - **Do not re-widen dormant to classic packs.** BL-530 round 3 was bounced for
    exactly that: a shape heuristic classified classic-pack roles as DORMANT and
    tore down healthy standing sessions. Scenario 02 is that regression guard and
    must stay green.
  - Fixture-driven regression test with an empty respawn log, per the two tests
    BL-530 landed in `swarmforge/scripts/test/test_swarm_ensure.sh`.
    `tmp/repro_sequential_respawn.sh` in the architect worktree is a working
    starting point.

  ## Sequencing — must NOT run concurrently with BL-537

  BL-537 (active) edits the same dormant-classification decision in
  `swarm_ensure.bb`, from the opposite direction: it asks when a dormant
  classification should instead be a *heal*. Two tickets rewriting the same
  branch concurrently is the overlap the coordinator's orthogonality rule
  forbids. `depends_on: [BL-537]` — promote this only after BL-537 lands, and
  re-read this ticket against the code BL-537 leaves behind, since the shape of
  `ensure-role!` may have moved.

  ## Out of scope (noted, deliberately not scoped here)

  The identity-or-conf predicate pair is duplicated in four places —
  `swarm_ensure.bb:119`, `swarm_status.bb:122`, `handoffd.bb:1124`, plus direct
  `conf-rotation-router?` use in both `ready_for_next_*.bb`. That duplication is
  what makes this gap systemic rather than local, and one shared predicate would
  fix status, chase and rotate-home together. It is not folded in here because
  the rotate-home half is a behavior change (above) and because a four-call-site
  refactor riding a defect fix is the scope-creep the constitution's
  "An Approval Authorizes Only Its Ticket's Work" forbids. Worth its own ticket
  once this lands and BL-537 has settled the area.

acceptance: specs/features/BL-571-sequential-rotation-dormant-parity.feature

qa_e2e_procedure: |
  No live mono-rotate swarm is required — this is fixture-driven.
  1. `bash swarmforge/scripts/test/test_swarm_ensure.sh` → ALL PASS, including
     the new sequential-dormant case and the existing classic half-launch case.
  2. `bb swarmforge/scripts/test/mono_router_lib_test_runner.bb` → ok.
  3. `bb swarmforge/scripts/test/bl571_single_resident_rotation_property_runner.bb`
     → exit 0. This is the declared invariant's property runner — a separate
     lane per the property-test isolation rule; steps 1-2 do NOT run it
     (spec-gap amendment 2026-08-19, architect pass-1 S1).
  4. Non-vacuity: revert the predicate in `swarm_ensure.bb` to router-only and
     re-run (1) — the new sequential case must FAIL, naming the respawned middle
     roles. Restore.
  5. Non-vacuity the other way: widen the predicate to match any rotation value
     and re-run (1) — the classic-pack case must FAIL. Restore.
  6. Confirm `grep -rn 'conf-rotation-router?' swarmforge/scripts/ready_for_next_*.bb`
     is unchanged from `main` — the ROTATE_HOME path must not have moved.

notes: |
  IR-DRY adjudication (specifier, 2026-07-23): 5 findings, all reviewed and
  deliberately left. `a pack declaring rotation "<rotation>"` vs
  `... "sequential"` is one handler pattern with a captured argument (the
  checker normalizes <placeholders> but not quoted literals). `a pack declaring
  no rotation mode` is NOT the same step reworded — a classic pack has no
  rotation line at all, so folding it into a `"none"` value would misdescribe
  the fixture. The DORMANT positive/negative pair across scenarios 01 and 02 is
  the regression guard itself and must stay two distinct assertions.

  Because scenario 01's Given is one pattern with a captured value, its handler
  must assert on the captured rotation rather than hard-coding the common case —
  a handler that ignores the argument passes both rows while testing neither,
  which is the shared-cell mutation survivor this repo has hit five times.

  The architect's reproduction across four commits, worth keeping because it is
  what proves this is pre-existing rather than parcel-introduced:

    at 7524bd3ada (BL-530 parcel):  cleaner/architect/QA -> respawned (3 calls)
    at 4353ec1344 (main):           cleaner/architect/QA -> respawned (3 calls)
    at 7e2498634^ (pre-clobber):    rotation-router-mode? identical, router-only
    at c7a7491f30 (round-3 code):   DORMANT, 0 respawns — but only via the
                                    shape heuristic that was rightly deleted

  The deleted round-3 heuristic covered `sequential` only incidentally, and it
  could not be kept: it was also tearing down healthy classic-pack sessions.
  The fix must come from the DECLARED signal, never from inferring topology by
  observing which sessions happen to exist.

  ## Re-read after BL-537 landed (specifier, 2026-08-19)

  BL-537 is in `backlog/done/`, so this ticket's `depends_on` is satisfied and
  it is cleared to run. Re-verified on `main` that the defect is still live and
  unchanged in substance: `is_sequential_dormant` still accepts
  `sequential|router` (swarmforge.sh:709) while BOTH library predicates remain
  router-only - `conf-rotation-router?` regex `rotation\s+router\b`
  (mono_router_lib.bb:18) and `rotation-router-from-identity?` `(= "router" ...)`
  (mono_router_lib.bb:36). The fix and all three scenarios stand as written.

  Four things MOVED under this ticket's feet. Read these before starting.

  1. `ensure-role!` moved, exactly as this ticket warned it might. The
     `router?` branch in `run-ensure` (swarm_ensure.bb:726) no longer calls
     `ensure-role!`; BL-537 introduced `ensure-mono-router-role!`
     (swarm_ensure.bb:457) and dispatches there instead. Widening the predicate
     therefore routes `sequential` packs into that NEW function, not the old
     one. That is the correct destination - it is the same topology - but the
     branch now does strictly more than it did when this ticket was written.

  2. Scenario 01's fixture now needs a live resident, or it fails for the wrong
     reason. `ensure-mono-router-role!`'s `:dormant-ok` branch is gated by
     BL-537's `dormant-rotate-viable?`, which demands BOTH a live resident pane
     AND the rotate-target launch script on disk. A dormant role failing either
     is reported `:failed`, NOT `:dormant`. So the fixture backing "the five
     middle pipeline roles are reported DORMANT" must stand up a live resident
     pane and a launch script per middle role. A fixture that omits either will
     show scenario 01 red even with a correct predicate - do not chase the
     predicate when that happens.

  3. There is now a FIFTH hand-copy of the identity-or-conf pair, in
     `babysitter_check.bb:106-107`. It postdates this ticket and was not in the
     out-of-scope list below. Same router-only gap; still out of scope here.

  4. BL-931 added `resolve-rotation-router-mode?` (mono_router_lib.bb:41) and it
     is NOT the consolidation its docstring reads like. It did not replace the
     hand-copies - `swarm_ensure.bb`, `swarm_status.bb`, `handoffd.bb` and
     `babysitter_check.bb` each still carry their own - it added one more
     resolution, whose only production caller is `handoff_lib.bb:814`
     (`rotate-resident-to!`). Do NOT widen it in this parcel: its caller is the
     rotate path, which is the same behavior-change hazard the ROTATE_HOME
     constraint above fences off, and it needs its own spec and tests.

  Scope is unchanged by all of the above: add `single-resident-rotation?` to
  `mono_router_lib.bb`, consume it in `swarm_ensure.bb`'s `rotation-router-mode?`
  ONLY, and leave `conf-rotation-router?`, `resolve-rotation-router-mode?` and
  every other call site untouched. The out-of-scope refactor below is now a
  six-site closure rather than four - more reason to keep it in its own ticket.

  ## Spec-gap amendment (specifier, 2026-08-19, architect pass-1 S1)

  qa_e2e_procedure amended: the declared invariant's property runner
  (swarmforge/scripts/test/bl571_single_resident_rotation_property_runner.bb,
  added by the coder's parcel commit 15baafa579) was omitted from the
  procedure, so a QA pass following it literally never executed the
  invariant's own gate. Added as step 3; former steps 3-5 renumbered 4-6
  (their internal "re-run (1)" references are unaffected). No scenario
  changed; no step handler is affected (BL-233 does not apply).

  One obligation on the D1 re-fix (architect bounce, same pass): the new
  bash<->Babashka parity test must be reachable from a step this procedure
  names. If it lands inside test_swarm_ensure.sh, step 1 already covers it;
  if it lands as a standalone runner, the coder adds its exact command to
  this procedure in the re-fix parcel — a lane QA never runs is this same
  S1 gap repeating.

  ## Abandoned commit 17ae8a4822 — rationale (coder, 2026-08-20, QA bounce D1)

  `17ae8a4822` ("BL-571: correct fake-injection seam names in the ensure
  tests and steps file") is deliberately dropped, not merged. It postdates
  the parcel — committed on the coder branch 6 minutes AFTER the documenter
  forwarded `87cfd2cbf8` — and ALL of its BL-571 content is already present
  in the parcel by content, not ancestry: the steps file is a superset (same
  corrected `SWARM_ENSURE_*_CMD` names plus the hardener's
  `fake_daemon_start.sh` stub and skip fences), and `test_swarm_ensure.sh`
  carries the same corrected names (49 new-prefix uses, 0 live old-prefix
  uses). Merging the commit itself would fold in BL-958's still-bounced
  control-plane work riding the same coder-branch lineage, which an approval
  on BL-571 does not authorise (BL-506). Same disposition BL-935 recorded
  for `e63d364863`. Full analysis: backlog/evidence/BL-571-qa-bounce-20260820.md.

  `b7a6e580d7` (also declared, coder, 2026-08-20): QA's merge of the BL-957
  parcel into the QA branch, made AFTER this bounce was sent. Its subject
  names BL-571 only descriptively ("BL-571 content kept reverted per its
  open QA bounce") — it carries ZERO BL-571 content, so nothing of this
  ticket is dropped by declaring it. It cannot be merged into the re-fix
  parcel without folding in BL-957's own unapproved in-flight work (the
  same BL-506 rider problem as above). It is already an ancestor of the QA
  branch, so QA's verification merge reaches it natively.
