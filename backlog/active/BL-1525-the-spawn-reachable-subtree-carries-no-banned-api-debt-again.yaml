qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `bb swarmforge/scripts/test/daemon_cycle_guard_lib_test_runner.bb 2>&1 | grep '^FAIL'`
     -> no line containing "bl1031: spawn-reachable subtree"; the
     `BL-1031 spawn-only banned-API debt:` census line prints `[]`. The
     other two FAIL lines may still print until BL-1524/BL-1526 land.
  2. `grep -nE 'babashka\.process|clojure\.java\.shell' swarmforge/scripts/{ticket_close_guard_lib,unregistered_test_gate_lib,expedite_cli}.bb`
     -> no output. Under ruling A the same grep over bounded_run_lib.bb
     is also empty; under B it still hits and
     `grep -n 'bounded_run_lib.bb' swarmforge/scripts/test/daemon_api_ban_lib.bb`
     shows the exempt entry.
  3. `node specs/pipeline/cli.js specs/features/BL-1525-*.feature` -> all
     scenarios pass.
  4. `bash swarmforge/scripts/test/test_expedite_cli.sh`,
     `bash swarmforge/scripts/test/test_bl1376_expedite_branch_handover.sh`,
     the ticket_close_guard and unregistered_test_gate runners under
     swarmforge/scripts/test/, and the babysitter's bounded-run cases all
     still green.
  5. `git diff main...HEAD --stat` touches only the three libs, the
     ruling's file(s), the step handler + index.js registration, the
     feature file and evidence.

