  - 'swarmforge/scripts/unregistered_test_gate_lib.bb::daemon-cycle-guard-lib/sh!::the git helper runs under the bounded chokepoint'
  - 'swarmforge/scripts/expedite_cli.bb::daemon-cycle-guard-lib/sh!::the driver sh helper runs under the bounded chokepoint'
