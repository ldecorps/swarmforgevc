  ## Rescope 2026-08-19 — the human's ruling, and where each addendum went

  Human ruling, verbatim: "BL-670 = semantics + health dots only; ALL layout
  incl. slug stays with BL-585, no slug per ruling #4."

  This settled a genuine contradiction between two approved tickets. Both
  sentences below are the human's own, three days apart; recorded here in
  full so the history stays walkable and neither is lost:

    - BL-670, operator session 2026-07-26: "Mini-slug row under the id row
      inside the code block, truncated to column width."
    - BL-585, intake 2026-07-23, approval_context ruling #4: "THE CAPTION IS
      EPIC-ONLY ('537 swarm-reliability'), one line per visible column, no
      slug. The grid never showed a slug and lines are scarce on a phone."

  The 2026-08-19 ruling resolves it in favour of BL-585: the mini-slug row is
  DROPPED. That is the human's own explicit override, not a consolidation
  trimming a directive.

  Disposition of every other layout addendum from the 2026-07-26 filing:

    - "ONE grid, stage axis rendered once as rows, active tickets as
      side-by-side columns — epic grouping is a column-header annotation,
      never a second copy of the stage axis" → BL-585, which already
      specifies exactly this. Removed from here (was scenario 05).
    - Cell padding / grid alignment → BL-585's `W = max(3, longest display
      id)` and its `PIPELINE_BOARD_GRID_MAX_WIDTH` budget. Removed from here
      (was scenario 04 and the second invariant).
    - "a per-ticket legend line follows OUTSIDE it: detail deep-link to the
      ticket's own BL topic (BL-295/BL-329 — no new surface), gherkin
      deep-link into the BL-659 Knowledge Explorer, degrading gracefully
      (raw feature file on GitHub, or omitted) until that epic ships — the
      board never waits on it" → BL-940, its own paused ticket. BL-585's
      out_of_scope explicitly excludes the LINKS list, so it could not
      simply move there.
    - "Time-with-current-agent beside the stage mark ('AR X(34m)'), BL-650
      active time once available, wall time labelled until then" and
      "two-significant-unit durations" → BL-940. These render a value beside
      the grid mark, which is layout under this ruling; the as-of time they
      display is derived here.
    - "Compactness: readable in a phone-width Telegram code block; ids
      without the BL- prefix" → BL-585, already covered by its width budget
      and bare display ids.

  Scenario 08 of the original filing ("BL-573 is retired to backlog/done/ as
  superseded") is removed: BL-573 is already at
  backlog/done/BL-573-stage-sync-scans-inbox-new.yaml, so it asserted a
  state that already holds and was not buildable behaviour.

  DEPENDENCY: depends_on: [BL-585] is load-bearing, not decorative. Both
  tickets edit extension/src/concierge/pipelineBoard.ts and
  extension/test/pipelineBoard.test.js. Running them concurrently is the
  orthogonality breach that caused this rescope; BL-585 uses the same
  sequencing against BL-559 for the same reason.

  ## Freshness adjudication 2026-08-30 (Article 3.6) — AMEND

  Ran the deprecator freshness check before handing this to the coder, on a
  ticket filed 2026-07-26 and last verified 2026-08-19. One premise had gone
  stale and one had not:

    - STALE: "the `new/` inbox ... invisible to it". Falsified by BL-1048
      (`f9408d8ae`, 2026-08-22). Corrected in the description above; the coder
      must NOT rebuild the `new/` scan.
    - STILL TRUE: the durable `sent/` trail is unread (`:sent` absent from
      `scanned-mailbox-states`), the value shape is still a bare
      `{ticket -> role}` string map (live `ticket-stage-map.json` reads
      `{"BL-670":"specifier","BL-1235":"coder",...}`; `swarmState.ts:163`
      `readTicketStageMap` is still typed `Record<string, string>`), there is
      no as-of time, and there is no health dot.

  Outcome AMEND, not retire and not split. The valuable core — the qualified
  `{stage, status, asOf}` shape across the language boundary, `last-known`
  from the durable trail, one-derivation-two-consumers, and the health dot —
  is entirely unbuilt and is now the NAMED successor to the distinction
  BL-1048 explicitly deferred. Only the framing was wrong, and the framing is
  what would have sent the coder to rebuild a shipped scan.

  `human_approval: approved` is retained deliberately. The deliverable, the
  human's 2026-08-19 scope ruling, and the verbatim requirement are all
  unchanged; what changed is a false statement about the code as it stands.
  Re-approval would be asking the human to re-affirm a decision this
  amendment does not touch.

  Other premises re-verified as still holding on 2026-08-30, so the next gate
  pass is cheap: `depends_on: [BL-585]` is satisfied (BL-585 is in
  `backlog/done/M8/`); BL-487's `syncBoardIfWired` is still live
  (`conciergeTick.ts:641`), so "do not re-litigate sync triggers" stands;
  `invertTicketStageToRoleHeldTickets` is still the TS consumer
  (`pipelineGridLive.ts:18,39,49`); `reconcile-stage-map` and `filter-active`
  are still the bb producers (`pipeline_stage_lib.bb:118,131`); BL-573 is in
  `backlog/done/` and BL-940 is in `backlog/paused/`.

  `required_wiring:` added in this amendment — the ticket had none, and its
  value depends on the richer shape actually reaching the TS consumers rather
  than being emitted and ignored (BL-531). All four patterns were parsed and
  grepped before committing: each is a plain literal, none is a placeholder,
  none contains a double quote, and the three code anchors return 0 matches
  today so none is vacuous (BL-874/BL-960).
