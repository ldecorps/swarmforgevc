id: BL-723
title: "Queue-jump — live swarm reviews tonight's pilot-landed defect quality"
milestone: M8
type: chore
status: todo
epic: swarm-reliability
human_approval: approved
priority: 0
direction: queue-jump
depends_on: []
mutation_cost: low
required_stages: [specifier, coder, cleaner, architect, hardender, documenter, qa]
assigned_to: specifier

invariants:
  - "Every reviewed ticket stays in backlog/done and no reviewed ticket's description or acceptance is rewritten unless a true revert is warranted — this parcel reviews landings, it does not reopen them."
  - "Every shortfall found yields BOTH a remaining-work defect AND a pilot-process defect (never either/or), each with type defect and an explicit severity."
  - "Every one of the 13 primary tickets carries its own on-par / not-on-par verdict in all three durable places: that ticket's notes, the review body, and the emailed body."

required_wiring:
  - "docs/how-to/BL-723-pilot-tonight-quality-review.md::QA viewpoint::multi-hat review body; QA section must be the fullest"
  - "docs/briefings/2026-07-30-bl723-pilot-review.md::BL-723::email body handoffd's briefing sweep mails to notify_email_to"

description: |
  ## What

  Human via Let's Talk 2026-07-30 evening: for the **next morning swarm shift**,
  queue-jump so the **live swarm** code-reviews the defects the offline pilot
  just closed tonight, and confirms quality is on par with a normal live
  pipeline walk.

  ## Primary review set (tonight / 2026-07-30 QA land)

  BL-718, BL-627, BL-636, BL-637, BL-641, BL-642, BL-646, BL-623, BL-671,
  BL-694, BL-559, BL-661, BL-662.

  Optional same-day if bandwidth: BL-630, BL-714, BL-686.

  ## Pass criteria

  - Diff + acceptance would survive coder→cleaner→architect→hardender→documenter→qa
    scrutiny at live-swarm bar. Route through those seats (required_stages) so
    each hat actually looks; do not synthesize fake POVs without the seat.
  - Explicit verdict: on par or not, with reasons.
  - Shortfalls → **both** kinds of new defects (do both, not either/or):
    1. **Remaining work** — detailed defects for what is still wrong or unfinished
       in the landed code / acceptance.
    2. **Pilot process** — defects that raise what the pilot missed, which gate
       or hat should have caught it, and how to harden `/pilot` next time.
  - **Update them back:** each reviewed done ticket gets its verdict written back
    (on-par or not, short reason, links to any new defects). Do not leave verdicts
    only in the BL-723 parcel.
  - Do not silently rewrite done history unless a true revert is warranted.
  - **Email the human (mandatory, human 2026-07-30 Let's Talk):** one fairly
    detailed email to `notify_email_to`, with separate sections for each seat's
    point of view — coder, cleaner, architect, hardender, documenter, and
    **especially QA** (the QA section must be the fullest). Include the overall
    on-par / not-on-par verdict, per-ticket notes, and any filed
    remaining-work / pilot-process defects. Closing without that email is not
    done.

  ## Delivery mechanism for the email (do not invent a new one)

  There is no ad-hoc "send an email" CLI a role can call. The live, already-wired
  path is handoffd's briefing sweep, so use it:

  1. The **documenter** writes the full review body to
     `docs/how-to/BL-723-pilot-tonight-quality-review.md` (per-seat viewpoints,
     per-ticket verdicts, overall verdict, filed defects).
  2. The **documenter** also commits the email body as
     `docs/briefings/2026-07-30-bl723-pilot-review.md`. Its first non-empty line
     becomes the email subject (`briefing_email_lib/build-briefing-subject`,
     bounded at 80 chars) — make that line a real headline carrying the verdict.
  3. Do **not** add that file to `docs/briefings/.sent.json`. handoffd's
     `briefing-email-sweep!` runs unconditionally each tick, mails every unsent
     `.md` in `docs/briefings/` via `send-configured-email!` to `notify_email_to`
     (`ldecorps@gmail.com`), and records it as sent exactly once on success.
  4. **QA** verifies delivery before approving: the file is committed, and the
     sweep has either recorded it in `.sent.json` or logged a
     `briefing-skip-missing-key` / `briefing-send-failed` reason. A missing
     `RESEND_API_KEY` is an environment fault to report to the human, not a
     silent pass.

  ## Acceptance scaffolding (coder owns; BL-233)

  This ticket has a feature file but **no step handlers yet**, and
  `specs/pipeline/runtime.js` THROWS on any step with no handler. The coder
  writes `specs/pipeline/steps/bl723PilotReviewSteps.js` in this same parcel.
  The scenarios are deliberately artifact-anchored so the handlers assert against
  real committed files rather than prose: read the review body, the briefing
  body, `.sent.json`, and each reviewed ticket's YAML from disk. No handler may
  assert over prompt text (that is fake acceptance).

  Ordering note: the review body must exist before the handlers can pass, so the
  coder may land handlers plus a first-draft body, with the documenter filling in
  the final per-seat content. The gate is green only once both exist.

  ## Process

  **queue-jump now** (live pack already up). Not expeditor. Not pilot.
  Human amendment 2026-07-30 evening Let's Talk: do not wait for morning;
  finish with the multi-hat email.

  ## e2e QA procedure

  1. `swarmforge/scripts/gherkin_lint_gate.sh specs/features/BL-723-pilot-tonight-quality-swarm-review.feature`
  2. `node specs/pipeline/cli.js specs/features/BL-723-pilot-tonight-quality-swarm-review.feature`
     — every scenario passes, none throws "no step handler matched".
  3. Confirm all 13 primary tickets are still in `backlog/done/` and each one's
     `notes:` carries its verdict plus links to any defect filed against it.
  4. Confirm any filed defect YAML has `type: defect` and an explicit
     `severity:` (the Article 3.2.4 lane fails closed without it).
  5. Confirm `docs/briefings/2026-07-30-bl723-pilot-review.md` is committed, and
     check the handoffd log for `briefing-sent` for that file — or report the
     skip reason to the human.

  ## Out of scope

  - Re-piloting the remaining safe pool
  - New product work
  - Punitive process changes (calibration to improve pilot, not blame)

acceptance: specs/features/BL-723-pilot-tonight-quality-swarm-review.feature

