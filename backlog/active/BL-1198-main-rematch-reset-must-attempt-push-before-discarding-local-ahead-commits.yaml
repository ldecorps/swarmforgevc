human_approval: approved
approval_context: >
  Discovered 2026-08-27: coder sent a priority-00 note ("BL-428: specifier
  SG1 fix 18a0dad4e never landed on main; see evidence") pointing at
  backlog/evidence/BL-428-sg1-fix-dropped-by-origin-reset-20260827.md.

  Confirmed via `git reflog show refs/heads/main`: commit `18a0dad4e`
  ("spec(BL-428): materialize paneHistory slice acceptance feature (SG1)")
  landed on local main at 13:00:47, was never pushed to origin, and was
  silently dropped at 13:54:47 by a plain ref reset ("branch: Reset to
  origin/main") — confirmed `git merge-base --is-ancestor 18a0dad4e HEAD` =
  false before recovery, i.e. genuinely off the branch, reachable only via
  reflog/dangling object. Recovered in this same session by cherry-picking
  18a0dad4e back onto main (backlog/active/
  BL-428-decrap-preexisting-high-crap-on-touch.yaml now carries the restored
  acceptance pointer + a specifier_decisions recovery note); no other content
  differed, so the cherry-pick was clean once resolved.

  Traced the mechanism (verified by reading the actual code, not guessed):
  three independent call sites each shell `git reset --hard origin/main`
  directly — `handoffd.bb`'s `master-main-rematch-onto-origin!`,
  `swarm_heal.bb`'s inline rematch lambda, and `post_hotfix_merge_origin.bb`'s
  `rematch-onto-origin!` (wired through `post_hotfix_merge_origin_lib.bb`'s
  `finish-rematch-recovery`/`finish-refuse-rematch`/`finish-replay-bookkeeping`,
  fired specifically on the "colliding local-ahead" branch — see that file's
  BL-1131/1138/1141 comments). This path is a deliberate, load-bearing design
  for ONE real case: local main ahead with synthetic/disposable coordinator
  bookkeeping commits that collided with origin. It was never built to
  distinguish that case from a genuine, not-yet-pushed authored commit
  sitting on the SAME branch at the SAME moment, and none of the three call
  sites ever attempts the cheap, safe alternative first: push local main to
  origin. When origin has not diverged, that push is a plain fast-forward
  and nothing needs discarding at all.

  Same "content lost with no reverting commit to blame" family as
  [[detect-content-no-commit-authored]] / BL-1098 and the same-day
  swarmforge-hardender GIT_DIR corruption (BL-1196) — different mechanism
  (a designed reset, not an env leak), same failure shape, same day.
description: |
  ## What

  Before any of the three `git reset --hard origin/main` call sites fires,
  attempt `git push origin main` (or `git push origin main:main` — whatever
  this repo's existing push-sweep convention already uses; reuse it, do not
  invent a second push path) exactly once. Only when that push is rejected
  (non-fast-forward — i.e. origin has genuinely diverged from local main, the
  real "colliding" case the reset path exists for) does today's reset
  proceed unchanged. When the push succeeds, ahead becomes 0 by construction
  and no reset is needed — the commit is simply now on origin too.

  Centralize this as ONE shared "push-before-reset" primitive (a natural home
  is `master_main_reconcile_lib.bb`, since all three call sites already
  `load-file` it) rather than patching three independent `git reset --hard`
  call sites separately — matching this project's own "a constant/behavior
  mirrored by hand across sites needs one shared implementation" guardrail;
  three copies of the raw reset already drifted into existing wording
  inconsistency (`post_hotfix_merge_origin_lib.bb`'s own top comment claims
  "no reset/stash" while the same file's rematch path does reset — a
  documentation-drift smell worth fixing in the same pass since it is right
  there, but not the ticket's core deliverable).

  ## Why

  A reset is only ever safe to the extent that nothing on the branch it
  discards was worth keeping. This path currently assumes that of EVERY
  local-ahead commit, unconditionally, the moment origin/main and local main
  collide — but "local main is ahead and collides with origin" and "these
  ahead commits are disposable bookkeeping" are two different facts, and
  nothing here has ever checked the second before acting on it. Pushing
  first converts the common case (no real divergence, just a race with
  whatever normally keeps origin caught up) from a silent, only-reflog-
  recoverable loss into a plain, loss-free fast-forward — and preserves the
  designed recovery behavior unchanged for the genuine-divergence case it was
  actually built for.

  ## Constraints

  - Do not weaken or remove the existing reset-based recovery for genuine
    divergence — scenario 02 is a regression guard that it still works
    exactly as today once a push has actually been rejected.
  - Do not introduce a new push mechanism if one is already wired
    (`push_sweep_lib.bb` per this project's own convention that pushing
    origin/main is that library's job, never the coordinator's or an ad hoc
    call site's) — reuse it.
  - Single push attempt only, no retry loop — bounded, consistent with this
    project's "bounded retries with backoff" guardrail; a rejected push is
    the genuine-divergence signal, not a transient failure to retry past.

qa_e2e_procedure: >
  (1) Fixture: seed a bare "origin" and a local clone of main with one
  commit ahead that origin has NOT diverged from; run each of the three
  rematch call sites (or the shared primitive once centralized); confirm the
  commit lands on origin and no reset --hard runs (assert via a spy/counter
  on the reset invocation, not by absence of side effects alone). (2)
  Fixture: seed origin diverged from local main (a real collision); run the
  same path; confirm a push is still attempted, is rejected, and the
  existing reset-to-origin recovery completes exactly as it does today. (3)
  Replay this incident's exact shape (a real content commit sitting ahead
  when a rematch fires) against the fixed path and confirm it survives on
  origin instead of requiring reflog recovery.

