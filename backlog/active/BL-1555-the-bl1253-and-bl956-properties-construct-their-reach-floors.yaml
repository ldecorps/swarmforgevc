  is met BY CONSTRUCTION, and a floor that is merely usually met is still a
  flake. FIRM: neither file is added to
  property_suite_standing_allowlist.tsv. Direction, not mandate: splice a
  dead state into every flapping sequence by shape; iterate bl956
  invariant 3 over an overflow cell (activeCount 13..15) and a fitting cell
