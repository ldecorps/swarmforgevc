qa_e2e_procedure: |
  On the parcel commit, from `extension/`:
  1. `for f in bl1253TokenOwnershipInvariants bl956PipelineBoardCaptionCapInvariants; do
     for i in $(seq 1 15); do npx vitest run --config vitest.properties.config.mjs
     test/$f.property.test.js || echo FAIL $f; done; done` -> every run
     green, no FAIL line (the unfixed bl1253 fails about 1 in 21).
  2. In each bl1253 run's stdout the printed flapping reach map shows
     `withHandover` equal to `sequences` and `sequences` >= 24; in each
     bl956 run the invariant 3 reach map shows `gridOverflow` >= 50 (a
     uniform 1..15 draw averages 30 and cannot reach 50), `parkedOverflow`
     and `epicsOverflow` >= 20.
  3. Deterministic seed check: `fc.check` (or a temporary `seed:
     -1747880424` on the flapping assert) no longer fails at run 20 - the
     constructed arbitrary yields a dead state in every sequence.
  4. `git diff main...HEAD --name-only` names the two property tests, the
     step handler, the feature, evidence, and the register row removals;
     `extension/src/`, `property_suite_standing_allowlist.tsv`, the
     BL-1253/BL-956 features and handlers are unchanged. The four floor
     literals of scenario 03 are still present in the sources.
  5. Break-then-restore: make the flapping arbitrary omit its dead state
     again; the `handovers >= 1` assertion fails under the QA seed on the
     first run; restore. Narrow bl956's overflow cell to 1..12; the
     `gridOverflowSeen >= 20` floor fails on the first run; restore.

