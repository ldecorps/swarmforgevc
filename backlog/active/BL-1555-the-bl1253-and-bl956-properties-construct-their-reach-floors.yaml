description: |
  ## What is wrong

  Two files under `extension/test`, same defect class as BL-1553 and
  BL-1533: a reach floor asserted after a sampled draw.

  **`bl1253TokenOwnershipInvariants.property.test.js`**, test "the token
  can change hands repeatedly in one process": `flappingArb` (lines
  199-201) is `fc.array(fc.constantFrom('fresh', ...DEAD_STATES), {
  minLength: 4, maxLength: 6 })` wrapped in `fresh` at both ends, and the
  test asserts `handovers >= 1`. A draw of four `fresh` yields a six-`fresh`
  sequence in which the bridge never takes the token, so no handover
  exists and the floor fails while `checkSequence` passes. The same file's
  `recoveryArb` and `takeoverArb` construct their transition by shape;
  this arm hopes.

  | who | where | result |
  |---|---|---|
  | BL-1485 QA, 2026-09-13 | full lane, run 2 of 3 | `seed: -1747880424`, counterexample `["fresh" x6]` |
  | BL-1485 QA, 2026-09-13 | alone, and a 3-file batch | green |
  | specifier, 2026-09-13 | `fc.check` on `flappingArb`, that seed, 24 runs | fails at run 20, same counterexample |
  | specifier, 2026-09-13 | 2000 fresh seeds, 24 runs each | 93 fail (about 1 in 21) |

  **`bl956PipelineBoardCaptionCapInvariants.property.test.js`**, invariant
  3: `boardArb.activeCount` is `fc.integer({ min: 1, max: 15 })` and the
  test asserts `gridOverflowSeen >= 20` over 150 boards, where a board
  overflows only when `activeCount > PIPELINE_BOARD_GRID_MAX_ROWS` (12).
  Three values of fifteen overflow; 150 uniform draws give about 30
  overflow boards and about one seed in 370 gives fewer than 20 (1500
  simulated seeds: 4 misses, minimum 18). The other five floors in the
  file sit far from their line (0 misses in 1500). QA saw the file fail
  once in three full-lane runs and did not record the text; the file is
  pure (no clock, no fs, no subprocess) and 12 of 12 specifier runs alone
  were green, so the cause is read off the source and this is the only
  way the file can fail.

  Both latent since landing (bl1253: `026ae2aa3e`, 2026-08-30; bl956:
  `294d46406a`, 2026-08-19). Evidence:
  `backlog/evidence/BL-1555-specifier-unowned-red-repro-20260913.md`.

  ## What is wanted

  Both floors are met by construction on every run and stay asserted at
  their values. Each fixed test prints its reach map (the BL-1371 /
  BL-1534 `reach map` shape) so a reader, and scenario 02, can see
  the counts from the run. The property lane is green on `main`; the two
  register rows this ticket adds are removed in the same land.

  ## How (direction, not mandate)

  - bl1253: build every flapping sequence to contain at least one dead
    state by shape - e.g. `fc.tuple(prefix, deadArb, suffix)` spliced, or
    draw the inner array and a dead state plus an index and insert it.
    Keep `numRuns: RUNS` (24), keep the `handovers >= 1` assertion, and
    print `BL-1555 reach map (flapping): {"sequences":N,"withHandover":M}`
    after the assert.
  - bl956 invariant 3: iterate an overflow cell (`activeCount` 13..15)
    and a fitting cell (1..12), `runsPerCell(150, 2)` each from
    `test/helpers/reachFloors.js`, so the total number of boards is not
    reduced; keep the three `>= 20` floors as they stand (or route them
    through `assertReachFloor`), and print
    `BL-1555 reach map (invariant 3): {"gridOverflow":a,"parkedOverflow":b,"epicsOverflow":c}`.
    Invariants 1 and 2 are sampled too but their floors are unreachable
    by a miss; constructing them in the same pass is welcome if it is one
    edit, leaving them is not a defect.
  - Step handler `specs/pipeline/steps/bl1555ReachFloorsConstructedSteps.js`
    runs each file alone under the properties config as a real subprocess
    (the bl1534BoundedSweepReachSteps.js shape), parses the two reach maps,
    and reads the source for scenario 03's literals. Land it in the same
    commit as the feature (BL-233).

  ## Not in scope

  - `extension/src/tools/telegramCursorBridgeLive.ts`,
    `extension/src/concierge/pipelineBoard.ts`, and both tickets' own
    acceptance features and handlers are not touched.
  - The BL-1253 and BL-956 parcels shipped sampled floors and no stage
    caught either; the same fail-open shape BL-1445 names. No process
    change is minted here.

