description: |
  ## What happens today

  `extension/src/tools/qa-bounce-line.ts` (BL-454, BL-635, BL-689) reads
  the durable bounce log (`.swarmforge/bounces/<month>.jsonl`, plus the
  legacy store) from its first record, with no date filter, and handoffd
  puts its line in the briefing. A record names the producing role and the
  bouncing role, never the model. So the line cannot answer the question
  the human is asking it: did a role's work bounce more, or less, since its
  model changed?

  ## What is wanted

  - The line leads with the bounces since the previous briefing was sent
    (scenario 01), and names that start. With no send on record, the window
    is the last 24 hours and the line says so (scenario 02).
  - A seven-day trend per producing role, one count per day, oldest first
    (scenario 03).
  - Each producing role in the window is named with the model it runs now,
    as the swarm tiles show it (scenario 04).
  - The all-time total stays, last, labelled all-time (scenario 05).
  - A JSON mode prints the same figures: window start, window counts by
    producing and bouncing role, the trend, and each role's model
    (scenario 06). The coordinator cites these in its model advice.
  - The existing breakdowns (bouncing role, ticket type, defects per
    bounce) stay available; their place on the line is the coder's call.
    Keep the line readable in an email, not a table dump.

  ## How (direction, not mandate)

  - Window start: when the previous briefing was sent, taken from the
    sender (QA bounce D1, 64f033e529): the briefing sweep's own previous
    send time passed in, or a sent-at the sweep records with each send.
    Never the commit that added the day to `docs/briefings/.sent.json`:
    that commit failed on every send from 2026-10-02 to 2026-10-07 and
    reached git days late by hand (BL-2069 owns it). Amended 2026-10-07,
    QA note 003912.
  - Model: `readRoleModelId` (`extension/src/swarm/backendSwitch.ts`) with
    `formatModelDisplayName`, the source the Bubble tiles use (BL-1858).
    Never re-derive it (BL-1811).
  - Read bounces through the reader the all-time tally uses today, so
    corrections apply to every figure (invariant 1).
  - Step handler `specs/pipeline/steps/bl1880BriefingBounceWindowSteps.js`,
    fixture under mkdtemp (BL-1390), render time injected, never the wall
    clock.

  ## Scope

  `qa-bounce-line.ts`, its call site in the briefing path if it must pass
  the window start, unit tests, the step handler, evidence. BL-454, BL-635,
  BL-688 and BL-689's features call `formatBounceLine` and must stay green.

out_of_scope: |
  - Recording the model on each bounce, so past bounces split by the model
    that produced them. This slice pairs each role with its model now; a
    record of which model did the work is a later slice if the trend
    proves too coarse.
  - The coordinator applying a model swap itself (epic notes, later slice).
  - BL-1327's descent ladder, which has no state writer and has never run.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1880-the-briefing-bounce-line-counts-since-the-previous-briefing.feature`:
     6 of 6 ok. Measured 0 at mint: no handler exists yet.
  2. BL-454 8 of 8, BL-635 15 of 15, BL-688 15 of 15, BL-689 10 of 10, as
     measured on main at mint.
  3. On the live checkout, `node extension/out/tools/qa-bounce-line.js`
     leads with the bounces since the 2026-10-02 briefing (or the latest
     one sent) and ends with the all-time total; its JSON mode prints the
     same counts.
  After the land (the specifier's or coordinator's check): the next
  morning briefing's bounce line leads with the window.

notes: |
  Amended 2026-10-07 (active, bounced to the coder on D1): the How's
  window-start bullet no longer says each send commits the sent marker;
  it points at the sender's send time, as QA's D1 does (QA note 003912,
  BL-2069). Nothing the coder builds changes beyond D1's remediation.
  Minted 2026-10-02 by the specifier from the documenter's relay of the
  human's two messages (source). Not queue-jump: the standing directive
  admits only local-LLM work and high/critical defects, and this is a
  feature; the human can Q-jump it from the Approvals topic.
  The coordinator's model advice channel is prompt prose, landed with this
  mint in coordinator.prompt and documenter.prompt (BL-798): the
  coordinator sends the documenter its advice at the ceremony, citing
  counted figures, advice only. Until BL-1880 lands, the coordinator
  counts with jq over the bounce log; that prose carries the literal
  "Until BL-1880 lands" marker, so QA removes it at the land.
  The human's "even make the model swap by itself" is recorded on BL-818
  as a later slice. It reverses BL-1327's 2026-09-02 proposal-only ruling,
  so it needs its own ask.
  INVEST: one CLI's output, six scenarios, two invariants; the per-model
  record of past bounces was cut to out_of_scope to keep it one sitting.

