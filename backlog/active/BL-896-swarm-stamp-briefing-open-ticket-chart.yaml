approval_context: >
  Two decisions, both cheap to answer, neither reopening the product ask (you
  want this chart on the morning briefing — that is locked and is not on this
  list).

  (1) CERTIFY BY REVIEW, or WAIVE. The chart is live on your daily email and
  has passed no gate. Certifying runs the landed diff through the pipeline and
  fixes what it finds; waiving records `waived` in the hotfix ledger and drops
  this ticket. Recommendation: CERTIFY — three findings below are already
  verified, one of them visible in the chart you receive every morning.

  (2) THE TITLE. The chart's heading currently reads "Backlog burndown — last
  30 days (not-done tickets)". Rendered against today's real data it is a line
  going UP: open 11 -> 182, net +171. That is not a defect in the maths; the
  backlog genuinely grew. It is the exact failure your own 2026-07-26 ruling
  banned burndowns for ("sur l'état de milestones cela ne sert à rien" — a
  burndown on a growing scope burns up and lies). The specifier's reconciliation
  (below, and already applied to BL-659) is that your ban stands untouched and
  this chart is not an exception to it — it is the Kanban open-count trend the
  ban named as the REPLACEMENT, wearing the wrong word. So: rename the heading
  to what it plots (open tickets remaining, with filed/closed rates), keep the
  chart exactly as it is otherwise. Say so if you would rather keep the word
  "burndown" on the heading despite it; that is your call to make and this
  ticket will carry whichever you choose.

  Either answer resolves ledger entry `14724edae7`; leaving it open means the
  BL-848 sweep keeps resurfacing it every 6h.

source: |
