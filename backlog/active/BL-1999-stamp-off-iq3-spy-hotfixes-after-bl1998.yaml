source: |
  The human, specifier pane, 2026-10-05, verbatim (Article 5.3):

  > We have to fix iq3. Spy on it every 10 minutes. If its gone wrong, hotfix it, and respawn. Repeat until iq3 is functioning normally.

  The fault (iq3 session 45d73777, 13:56-14:03Z, BL-1990): the BL-632
  feature run four times (`| tail -3`, `| grep -E '^# (passed|failed)'`,
  `| grep -E 'passed|failed'`, `| tail -12`) and
  test_pipeline_code_on_main_guard.sh twice, each only to view the same
  output another way.

description: |
  ## Status: hotfix 9db627f908 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What the hotfix changed

  - `swarmforge/scripts/local_model_repeat_guard.bb`: `command-base` (the
    command before the first `|` that is not `||`) and `rerun-hint` (a
    shell command whose base was already run in the window with a
    different full command is told to run it once into tmp/out.txt).
  - `swarmforge/scripts/test/test_bl1971_local_model_repeat_guard.sh`: a
    re-run under another filter gets the hint; a first run, a re-run after
    an edit, and two different commands get none.
  - `swarmforge/roles/local-model/loop.note`: run a test or feature once
    with its output saved to tmp/out.txt; read the file instead of re-running.
  - Live at once for the hook; the card line reaches the seat at its next
    session.

  ## Hotfix e36702e90d: the empty-grep hint reads a piped grep right

  14:12:57Z the iq3 coder's `node specs/pipeline/cli.js <BL-925 feature> |
  grep '^# (tests|pass|fail)'` printed nothing because the run ended at the
  runner's 300 s ceiling with no summary (a red, fixed by 3024ccb56c /
  BL-2000). 4949a2d37e's hint said "not in those files", which reads as if
  the feature had no tests.

  - `swarmforge/scripts/local_model_repeat_guard.bb` `empty-grep-hint`: a
    grep after a pipe from anything but `git ls-files`, `ls`, `find` or
    `cat` says the command may not have printed what was expected and to
    run it once into tmp/out.txt; a grep over files keeps the old wording.
  - test_bl1971: an empty grep over a feature run's output gets the new
    wording and not the old one.

  ## Hotfix 0a506c792b: a name the ticket says to add does not exist yet

  14:57-15:04Z the iq3 coder on BL-1996 never wrote: it searched four ways
  for SWARMFORGE_QWEN_PROJECTS_DIR, the variable that ticket asks it to
  ADD, then read another ticket's files for where it was used, and repeated
  one grep until qwen's loop dialog halted it.

  - `swarmforge/roles/local-model/loop.note`: a function, key or env var
    the ticket says to add does not exist yet; one empty grep confirms it,
    then write it, never search other files for it.

  ## Hotfix f87e90ddf5: a pull finds Work notes by message; a seat never runs redo_from

  The 15:52Z pull of BL-1968 abandoned its git_handoff (task: BL-1968) but
  left the Work BL-1968 note (no task: header) in iq3's inbox/new; iq3 took
  it at 15:54Z, worked the ticket beside coder@2 for 55 minutes, and when
  its forward was refused because coder@2's parcel was live at the
  hardener, ran `redo_from.sh BL-1968 hardender`, which abandoned that
  parcel and re-queued the same commit.

  - `swarmforge/roles/coordinator.prompt` (the BAU pull): find a ticket's
    handoffs by `task:` OR `message:`. Follow-up 8eac9d2543 (coordinator
    note 016662, "Work-note regex unanchored, matches mention not
    dispatch"): the pattern is `^(task: <id>$|message: Work <id>[-:])`,
    so a note that only mentions the ticket is not abandoned.
  - `swarmforge/roles/local-model/loop.note` step 3: a refused forward on a
    live parcel means another seat forwarded it - done_with_current.sh and
    stop; never redo_from.sh or reroute.sh.

  ## What the coder does (all of it)

  1. Run qa_e2e_procedure steps 1 and 2 once each, in your worktree.
  2. Read `git show 9db627f908`, `git show e36702e90d`,
     `git show 0a506c792b`, `git show f87e90ddf5` and `git show 8eac9d2543`
     against the four sections above and the invariant.
  3. Write backlog/evidence/BL-1999-coder-<date>.md: the two results and
     one line per hotfix saying whether it matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

