description: |
  ## What is wrong

  BL-1135 closed with policy that rematch-bookkeeping / refuse-rematch must
  drive live recovery — not a human absorb page. Same evening, master
  checkout still trips **deadlock-tripped** with reason **rematch-bookkeeping**:
  local main ahead ~249 (bookkeeping), behind origin climbing (QA lands
  including BL-568 tip `db574e4a40`). Coordinator holds parcels in_process
  and will not `ready_for_next` / close until a human rematches.

  ## What to do

  1. Make rematch-bookkeeping recovery **execute** (or reliably hand to the
     bookkeeping owner with an automatic rematch path) so behind returns to 0.
  2. Clear `main-sync-deadlock` when recovery succeeds; never leave standing
     deadlock-tripped as the designed end state for rematch-bookkeeping.
  3. Acceptance: fixture land + diverged bookkeeping tip → proceed without
     Cursor merge; deadlock must not stick across ticks after recovery.

  ## Out of scope

  - Heuristic auto-merge of conflicted file contents.
  - One-shot ops clear of the 2026-08-25 249/38 tip (ops; separate from
    durable fix).
  - Reverting BL-1130 / BL-1120 / BL-1135 product policy text.
qa_e2e_procedure: >
  (1) Fixture: ahead local bookkeeping + overlapping land → rematch/replay
  → behind=0 / proceed; no Complete-origin/main-merge. (2) rematch-bookkeeping
  surface does not end in durable deadlock-tripped waiting for human.
  (3) BL-1130/1120 preserved. (4) main_sync_status_cli ready after recovery.
