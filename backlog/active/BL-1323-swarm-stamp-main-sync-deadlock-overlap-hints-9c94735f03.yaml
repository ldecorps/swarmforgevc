approval_context: >
  BL-848 hotfix stamp-off for already-landed commit 9c94735f03. Review-only:
  it confirms or refutes the land and never reimplements it. What needs your
  decision is the ledger row — certify or waive — which green tests must
  never write on their own.

  One thing to know before you decide. `babysitter_check.bb`'s CRIT gather
  now prefers the deadlock marker's `overlapping_paths`, captured ONCE by
  handoffd at trip time, over a fresh git recompute. Per BL-891's own
  "at most one alert per trip" contract that is deliberate — but it also
  means every recurring CRIT between trip and `behind=0` shows the
  trip-time snapshot, not live git state: a path the operator has already
  cleared can still be named as "overlapping" in a later CRIT, and a newly
  dirty path added after the trip will not be. The review should confirm
  this is accepted as a known snapshot-not-live limitation (worth surfacing
  to the operator in the hint text) or is a real gap worth a follow-up.

