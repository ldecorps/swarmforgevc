approval_context: >
  A new feature file is authored here, so it would ordinarily need a tap;
  it is minted approved under the 2026-09-17 operator hotfix (severity
  defect, no choice posed, no ruling_options). FIRM: the population is
  the CENSUS - all fourteen move in one parcel, because the guard's
  sequential census charges the shared graph to the alphabetically first
  eager requirer and fixing one re-arms it on the next (BL-1658's own
  bl1050 -> bl1146 lesson). FIRM: every handler's feature still resolves
  and each still starts the same real bridge inside its steps - only
  WHERE bridgeServer is required changes. FIRM: no allowlist entry is
