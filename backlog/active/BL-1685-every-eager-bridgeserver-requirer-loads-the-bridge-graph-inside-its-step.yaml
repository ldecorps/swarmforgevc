description: |
  ## What
  `stepHandlerModuleLoadBudget.test.js` (400 ms per handler, best-of-three
  confirm-alone) names `bl1412SpecTreeTextFilterSteps.js` over budget on
  five of six readings today (414-768 ms; 290-300 ms once at load 13).
  Its only heavy line is line 18,
  `const { startBridge } = require('../../../extension/out/bridge/bridgeServer')`
  at module scope (its jsdom is already lazy, BL-1630). `bridgeServer` IS
  the bridge graph: requiring it alone loads 286 modules (bridge 70,
  metrics 33, swarm 18 under extension/out, plus @connectrpc 52,
  @bufbuild 49, @cursor 11) in 664-782 ms at load 15-19; the handler
  alone, 287 modules in 823-1089 ms.

  The guard's census is sequential and charges a shared graph to the
  alphabetically first eager requirer. Today bl1412 sits behind
  BL-1658's eager bl1050/bl1146/bl1253/bl1322/bl1384 and pays only the
  remainder - "borderline". When BL-1658 lands and those go lazy, bl1412
  is the first eager requirer of the bridge graph and pays all of it,
  every run; fixing bl1412 alone then re-arms the guard on bl538, and so
  on through fourteen files. Census (BL-1445), byte-safe:
  `git grep -l 'bridge/bridgeServer' -- 'specs/pipeline/steps/*Steps.js'`
  names 32 handlers; `/usr/bin/grep -c '^const .*require(.*bridge/bridgeServer' <file>`
  is 1 for 17 of them. Three of the 17 are BL-1658's (bl545, bl696,
  bl697). The fourteen here, in census order: bl1412SpecTreeTextFilterSteps,
  bl538ConsolePausedTicketPagerSteps, bl572EpicReorderConsoleSteps,
  bl591EpicEtaSteps, bl592SpecTreeOnLiveConsoleWithEpicTierSteps,
  bl665ContextTelemetryProducerWiringSteps, bl672EpicMakeTopPrioritySteps,
  bl673TopicMakeTopPrioritySteps, bl674EpicDrilldownUiSteps,
  bl686EpicDrilldownSlugMatchSteps, bl687EpicReorderIncludesActiveChildrenSteps,
  bl766MiniAppLetsTalkRetiredSteps, bl905HideChildlessEpicsReorderSteps,
  gh23ContextBudgetDashboardSteps. Adjudication:
  backlog/evidence/unowned-red-bl1412-bridge-graph-eager-requirers-adjudication-specifier-20260921.md.

  ## Why
  A standing red on the guard file bounces every unrelated parcel that
  runs the unit suite, and the register throttles intake while it stands
  (BL-1429). The guard exists so that requiring a handler costs nothing
  until its steps run (BL-1630); fourteen handlers still pay the whole
  bridge for a require they use only inside a step.

  ## How (direction, not mandate)
  - In each of the fourteen, move the `bridgeServer` require inside the
    step (or a small `getStartBridge()` helper called from the step) that
    starts the bridge - the exact shape BL-1658 used for the fifteen and
    BL-1630 for the twelve. Nothing else in the handler changes.
  - The feature's handler reuses BL-1658's fresh-child-process require
    with the loader intercept (`bl1658SevenJsdomHandlersLoadLazilySteps.js`),
    parameterised on the module path `extension/out/bridge/bridgeServer`.
  - Scenario 02 pins the census: the byte-safe grep names 32 handlers,
    and after the parcel the column-0 require count over them is 0 (the
    three BL-1658 files included - if any is still eager when this parcel
    starts, it joins the fourteen; say so in the coder evidence).

  ## Scope
  - The fourteen handlers under `specs/pipeline/steps/` named above
    (require placement only).
  - `specs/features/BL-1685-every-eager-bridgeserver-requirer-loads-the-bridge-graph-inside-its-step.feature`
    and `specs/pipeline/steps/bl1685BridgeServerRequirersLoadLazilySteps.js`
    (same parcel, BL-233, registered in `specs/pipeline/steps/index.js`).
  - The register row for `extension/test/stepHandlerModuleLoadBudget.test.js`
    (re-pointed to this ticket in the mint commit) leaves in this parcel's
    land (BL-1631); the parcel never edits the register. No allowlist
    entry. Documenter: the BL-1630 how-to's list of lazy-require handlers
    gains the fourteen; no diagram trigger.

qa_e2e_procedure: |
  On the parcel commit, ONE run each.
  1. `cd extension && npx vitest run test/stepHandlerModuleLoadBudget.test.js`:
     green, no handler named over budget, allowlist unchanged by this parcel.
  2. `node specs/pipeline/cli.js specs/features/BL-1685-every-eager-bridgeserver-requirer-loads-the-bridge-graph-inside-its-step.feature`
     (repo root): all ok.
  3. `for f in $(git grep -l 'bridge/bridgeServer' -- 'specs/pipeline/steps/*Steps.js'); do /usr/bin/grep -c '^const .*require(.*bridge/bridgeServer' $f; done | grep -vc '^0$'`
     prints 0 (byte-safe grep: this shell's `grep` is ugrep and skips
     NUL-bearing files, BL-1658 amendment 4).
  4. The fourteen features each run green through the runner once
     (about 20 s of registry load per feature - minutes, once).
  5. Register: the land retires the stepHandlerModuleLoadBudget row; the
     report after landing shows no unowned row and no BL-1685 row.

