notes: |
  - [2026-08-28] specifier: minted from the operator intake. Premise verified
    rather than assumed before scoping: BL-1160 is in backlog/done/M8,
    resolvePaneStatusKind reads activitySignal at residentSpyUiHtml.ts:798-800,
    PaneLiveSnapshot holds paneText at residentPaneLive.ts:31/111/131, and
    isPaneActivelyProcessing is exported from panel/agentPaneState.ts:81. The
    grep for writers of activitySignal returned only the reading file, which is
    what makes required_wiring entry 1 non-vacuous.
  - [2026-08-30] specifier, amendment (parcel already at architect; coder and
    cleaner stages are done). Two changes, one bookkeeping and one real:
    (a) BOOKKEEPING - the mapping is ruled, see approval_context. It confirms
    what the coder already built at 1a3917b40, so nothing in that commit is
    invalidated and the open-question note that came back to me is discharged.
    The coder was right that the mapping was forced rather than chosen; the
    reason it was forced is that the operator had chosen it in the intake.
    (b) REAL, a rebuild item - invariant 3 and scenario 06 are NEW. Verified in
    the code, not supposed: residentSpyUiHtml.ts sets lastPanes only on a
    successful poll (line 1056), while all three failure paths (1052, 1061,
    1067) call setStatus('err') and then repaint the SAME stale lastPanes.
    Because resolvePaneStatusKind returns pane.activitySignal before it looks
    at anything else, a tile whose last capture was busy keeps painting green
    for the whole outage and the err verdict never reaches it. Before this
    ticket those tiles fell through to the aggregate and went red, so the
    parcel introduces the regression - and it lands exactly on the intake's
    requested outcome 3, "never misleading green", during the one event the
    operator most needs to see on the phone. Scenario 06 reuses scenario 02's
    existing Then step, so only the new When needs a handler.

