description: |
  ## What / why

  Epic BL-1125 remaining slice A. Once the coder bar has passed (BL-1126/
  BL-1127/BL-1140 landed), decide and ship the durable local pack shape for
  this WSL/CPU host: stay on mono-router depth, or graduate to a fuller
  forge with an explicit depth cap / rotation discipline that does not
  wedge Ollama.

  ## What to do

  1. Gather evidence: BL-1127 battery + live host headroom (CPU/RAM/Ollama
     concurrency), not cloud forge defaults.
  2. Record the decision (mono stay vs capped fuller forge) in pack and/or
     how-to under the local Ollama launch path.
  3. If fuller forge: encode depth cap / rotation so concurrent local seats
     cannot unbounded-wedge Ollama; refuse or degrade clearly when over cap.
  4. Keep `./start-swarm-ollama-qwen.sh` / `ollama-qwen3-mono-router` (or
     successor local pack) honest to that decision.

  ## Out of scope

  - Cold-swap day-shift off cursor-forge (BL-1143).
  - Reminting BL-1126 / BL-1127 / BL-1140; promoting epic BL-1125.
  - Instant local replies; OpenRouter as entirely-local substitute.
  - Launching qwen-forge / Token Plan full forge as the local path.
