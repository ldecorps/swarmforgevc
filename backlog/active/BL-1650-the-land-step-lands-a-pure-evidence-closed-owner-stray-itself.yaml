id: BL-1650
title: "The land step's landed-sibling verdict walks the same ancestry its entangled detector walks and honours a sibling's own abandoned_commits record, so a closed sibling whose commit rode in on a merge (the everyday pipeline shape) reads LANDED_SIBLING once its content is on main; and it lands a closed-owner stray whose every path is pure evidence itself - on 2026-09-19 BL-1636's replay kept printing ENTANGLED_SIBLING for BL-831 and BL-1634 after the ruled cherry-pick because the verdict walks first-parent commits only"
milestone: M8
type: defect
severity: high
# high (raised from medium 2026-09-19 04:5x on QA's follow-up trace): the
# landed verdict can NEVER clear a sibling whose identifying commit rode
# in on a non-first-parent merge, which is how every sibling reaches a
# role's branch through the pipeline's own merge chain - so ENTANGLED_SIBLING
# prints on the everyday shape, QA holds, and a specifier round trip
# follows per land. Nothing lands wrong (BL-1546's posture is correct and
# stays), but the signal is broken on the common case.
status: todo
