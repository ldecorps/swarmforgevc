description: |
  ## What is wrong

  Human, verbatim (2026-09-05): "first job: reflow text in daily breigin
  email. also make it better looking overall."

  `docs/briefings/<date>.md` is written hard-wrapped at ~74 columns (the
  documenter writes it at the coordinator's instruction). BL-393 sends it
  as a plain-text part plus an HTML part rendered by
  `markdown_to_html_lib.bb` `render-markdown-to-html`, whose contract reads
  "Every other non-blank line becomes its own <p>". Rendering
  `docs/briefings/2026-09-05.md` through it today gives:

      <p>&gt; Written by documenter at the coordinator's explicit `note` instruction</p>
      <p>&gt; (2026-09-05), covering the period since `2026-09-03.md`'s cutoff — no</p>
      ...
      <p>**The QA land/replay/reconcile machinery kept absorbing structural</p>
      <p>gaps** — the same theme as 2026-09-03, continuing deeper into the same</p>
      <p>- BL-1309: the one landing step QA cannot skip never asked what the tip</p>
      <p>  actually carried, so a plain push of the QA branch shipped every ticket</p>

  Eight one-line paragraphs for one blockquote, a bold span that never
  closes, 24 list items and their 75 continuation lines as 99 paragraphs
  starting with "-" or two spaces, backticks left as literal backticks. On
  a phone the mail reads as ragged fragments. The constructs the briefings
  actually use (measured on 09-03 and 09-05): paragraphs, "- " lists with
  indented continuation, "> " quotes, ## headings, **bold**, backtick code;
  no tables, no rules.

  ## What is wanted

  - Reflow: consecutive non-blank lines of one block join with single spaces
    into one element: paragraph -> <p>, "- " items -> <ul><li> (continuation
    lines joined into their item), "> " lines -> <blockquote>, bold spanning
    a wrap -> one <strong>, backticks -> <code>, headings and GFM tables as
    BL-393 has them.
  - Layout for a phone mail client: a single column with a declared maximum
    width (~640 px) and a system font stack; spacing, heading and list styles
    carried INLINE on the elements (mail clients drop <style>); a header
    naming the briefing and its date before the first section; the diagrams
    section under its own heading after the body; readable at 390 px with no
    horizontal scroll.
  - The plain-text part stays the markdown, byte-identical (BL-393
    scenario 01; invariant 3).

  ## How (direction, not mandate)

  - `markdown_to_html_lib.bb`: make the renderer block-aware (paragraph,
    list, blockquote, heading, table), joining a block's lines before inline
    rendering; add code spans to `render-inline-markdown`. Amend the unit
    test that pins the old per-line behaviour
    (`markdown_to_html_test_runner.bb`, the `"One\nTwo"` -> `<p>One</p><p>Two</p>`
    case): it was right for BL-393's contract and is wrong for this one;
    replace it, do not delete the file's other cases. BL-393's feature
    stays green (its scenario 02 asserts headings/tables/bold render as
    elements, which still holds).
  - `briefing_email_lib.bb`: a `render-briefing-html` that wraps the
    converted body in the layout (header with date-label, body, diagrams
    section) and applies inline styles per element; `compose-and-send-one!`
    calls it. Keep the converter generic (BL-393's cleaner extraction) and
    the email layout in the email lib.
  - Fixture: a copy of `docs/briefings/2026-09-05.md` in the test dir for
    scenario 06 (counts: 24 list items, 1 quote, 3 h2 - measured at mint).
  - The documenter updates the briefing how-to; no diagram trigger fires.

  ## Out of scope

  - Changing what the briefing SAYS or how the documenter wraps the source.
  - Telegram or PWA presentation (later briefs from the Art Director).
  - Images, colour schemes or a logo: text first (art-director.prompt);
    the human can ask for more in Amend.

qa_e2e_procedure: |
  1. `bb swarmforge/scripts/test/markdown_to_html_test_runner.bb` and
     `bb swarmforge/scripts/test/briefing_email_test_runner.bb` pass; the
     BL-1419 feature passes all eight scenario runs; BL-393's feature passes.
  2. Render the real briefing:
     `bb -e '(load-file "swarmforge/scripts/briefing_email_lib.bb") ...'`
     (or the harness `briefing_email_harness.bb`) over
     `docs/briefings/2026-09-05.md` to `tmp/briefing.html`; open it in a
     browser at 390 px width: no sentence broken across lines mid-way, one
     bullet per list item, the quote as one indented block, the date in the
     header, no horizontal scroll.
  3. Strip every `<style>` block from `tmp/briefing.html` and reload: the
     layout is unchanged (invariant 2).
  4. The plain-text part written by the harness is byte-identical to the
     composed markdown (`cmp`).
  5. Once the Art Director is seated (BL-1418): it reviews the next sent
     briefing on a phone mail client and records LGTM or a defect list on
     this ticket's notes; QA does not wait for it.

