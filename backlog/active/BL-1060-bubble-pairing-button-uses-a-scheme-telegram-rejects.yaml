id: BL-1060
title: "The Bubble re-pair button is rejected by Telegram on every tunnel rotation: both builders pass the bare swarmforge-bubble:// URI as an inline-button url, and both tests asserted that broken value"
milestone: M8
type: defect
severity: high
status: todo
epic: swarmforge-console
priority: 8
direction: human-intake
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, hardender, qa]
stage_skip_reasons:
  architect: "No design change. BL-788 already built the HTTPS pairing surface and its /pair page; this swaps which of two existing fields two existing builders read. No new module, seam, or boundary."
  documenter: "No documentation surface changes. The hazard is already documented in place, in buildBubblePairingHttpsUrl's own doc comment; nothing a reader is pointed at becomes stale."
acceptance: specs/features/BL-1060-bubble-pairing-button-uses-a-scheme-telegram-rejects.feature

invariants:
  - "No inline-keyboard button this extension emits carries a url: whose scheme Telegram rejects. A button url is http(s); a custom-scheme URI reaches the user only through a page Telegram will open, never as the button url itself."
  - "A test pinning a Telegram-facing button asserts the property the API enforces - the scheme - not merely the identifier the code happens to pass. A test that stays green while the live API rejects the button is not coverage of that button."

human_approval: approved
approval_context: >
  Nothing to decide about the fix - it is written, tested and confirmed live
  against the real bot. Two judgement calls to confirm or amend.

  Severity high. The button is broken in every committed artifact: main's HEAD
  still passes the custom-scheme URI, so anyone building from HEAD ships it.
  It fired on every tunnel rotation and left users with no working re-pair
  path, which is a live fault degrading behaviour. It is not critical - the
  swarm is up and nothing is lost. The working fix currently exists ONLY as
  uncommitted working-tree state on main, which is a known-fragile place to
  leave it.

  Stages. The intake proposed coder, cleaner, QA. Kept the hardener as well,
  because invariant 1 wants a repo-wide executable check rather than two more
  point assertions, and this module is TypeScript with the full toolchain
  available. Architect and documenter skipped with reasons recorded in
  stage_skip_reasons. Amend if that reads as over- or under-gated.

source: >
  .swarmforge/operator/INTAKE-bubble-pairing-button-unsupported-url-protocol.md,
  filed 2026-08-22 ~14:35 by the operator session while restoring the
  bubble.musicalsifu.com named tunnel after the Mac->WSL operator handoff.
  Archived to .swarmforge/operator/archive/ on disposition. Every technical
  claim below was re-verified against HEAD and the working tree by the
  specifier before minting.

description: |
  ## What is wrong

  Every `resident-spy-cloudflared` tunnel (re)launch calls
  `notify-resident-spy-tunnel.js` to push the new URL into the Telegram topic
  and a private DM. Both calls fail identically:

      Telegram API responded with status 400: Bad Request: inline keyboard
      button URL 'swarmforge-bubble://pair?url=...&token=...' is invalid:
      Unsupported URL protocol

  The topic edit returns `{"notified":false,"outcome":"failed-edit"}` and no DM
  is sent at all. Users get no working "tap to re-pair" prompt whenever the
  tunnel URL rotates — which is every quick-tunnel restart.

  ## Where

  `extension/src/concierge/residentSpyTunnelNotify.ts`, at HEAD:

      81  export function buildResidentSpyTunnelTopicButtons(...)
      84    [{ text: 'Update Bubble pairing', url: urls.pairingDeepLink }],
      89  export function buildResidentSpyTunnelPrivateWebAppButtons(...)
      93    [{ text: 'Update Bubble pairing', url: urls.pairingDeepLink }],

  Telegram's Bot API rejects `url`-type inline buttons on any scheme other
  than http(s) and tg:. `pairingDeepLink` is `swarmforge-bubble://pair?...`.

  ## Why it is worth more than a two-token diff

  The correct value was already sitting in the same struct. `ResidentSpyTunnelUrls`
  carries BOTH `pairingDeepLink` and `pairingHttpsUrl` (lines 52-53), both
  populated at every construction site (61-62, 148-149). BL-788 built
  `buildBubblePairingHttpsUrl` and the bridge's own pre-auth `/pair` page for
  exactly this failure mode, and wrote the hazard into the doc comment eleven
  lines above the first broken call:

      BL-788: the bridge's own pre-auth /pair page, reachable in any browser
      (unlike pairingDeepLink's bare custom-scheme URI, which fails silently
      with no fallback when Bubble is not yet installed).

  So the fix existed, the reason was written down next to the defect, and the
  wiring was never done — the BL-419 shape, one file wide.

  What kept it invisible is the second half. Both tests
  (`extension/test/residentSpyTunnelNotify.test.js`,
  `extension/test/notifyResidentSpyTunnelCli.test.js`) asserted the button
  equalled `pairingDeepLink`. They passed. They would have gone on passing
  forever while every live call 400'd, because they pinned the identifier the
  code happened to pass instead of the property Telegram actually enforces.
  That is invariant 2, and it is why this ticket is not simply "apply the
  diff".

  ## The fix, already written and verified live

  The operator applied and verified it, and deliberately left it uncommitted
  in main's working tree rather than forcing it past the pipeline (Article
  1.8/4.2, BL-247; the convention is
  `docs/how-to/hotfix-2026-08-02-mac-host-switch-freshness-bridge.md`):

  - `extension/src/concierge/residentSpyTunnelNotify.ts` — both builders read
    `urls.pairingHttpsUrl`.
  - `extension/test/residentSpyTunnelNotify.test.js` — both button-shape tests
    assert the HTTPS URL.
  - `extension/test/notifyResidentSpyTunnelCli.test.js` — same for the DM button.

  Verified by the operator: `npm run compile` clean; the two suites 58/58 pass;
  a live named-tunnel relaunch produced
  `{"notified":true,"outcome":"edited","privateOutcome":"private-dm-sent"}`
  against the real bot and chat.

  The coder adopts that diff and adds what it does not yet carry: the
  invariant-1 check, which must be a property over what the builders emit
  rather than two more equality assertions.

  ## How (direction, not mandate)

  The swap itself is settled. The open piece is where invariant 1 is enforced
  so it holds for buttons nobody has written yet. A check over every inline
  keyboard the concierge builders emit is worth more than a per-call-site
  assertion; the specifier has confirmed the surface is currently small —
  `buildBubblePairingDeepLink` is the only custom-scheme builder in
  `extension/src`, and the PWA deep links in `metrics/pwaDeepLinks.ts` are
  built off an https base — so the check should be cheap to make exhaustive
  today and is worth writing to stay exhaustive.

qa_e2e_procedure: |
  1. Confirm the defect is gone at the unit level: from `extension/`, run
     `npx vitest run test/residentSpyTunnelNotify.test.js test/notifyResidentSpyTunnelCli.test.js`.
     All must pass, and the button assertions must assert an https scheme
     rather than an equality against `pairingDeepLink`.
  2. Confirm the invariant check actually fails on a violation: temporarily
     point one builder back at `urls.pairingDeepLink`, re-run the suite, and
     confirm the invariant check goes red naming the scheme. Revert the edit.
     A check that stays green here is invariant-unencoded, not coverage.
  3. End to end against the live bot: relaunch the resident-spy tunnel so
     `notify-resident-spy-tunnel.js` runs, and confirm it reports
     `"outcome":"edited"` and `"privateOutcome":"private-dm-sent"` — not
     `failed-edit`, and not a silent absence of the DM.
  4. Tap the "Update Bubble pairing" button in both the topic message and the
     private DM. Each must open the bridge's `/pair` page in a browser rather
     than producing Telegram's "Unsupported URL protocol" error.
  5. Confirm nothing else regressed on the notify path: the Resident Spy and
     Console mini-app buttons in the same keyboards must still open normally.

notes: |
  SEVERITY RATIONALE: `high`, not `critical` and not `medium`. Not critical —
  the swarm is up, the pipeline is moving, and no work or data is lost. Not
  medium — this is not a contained cosmetic fault: the re-pair path was
  broken on 100% of tunnel rotations, and the defect is still live in every
  committed artifact, since main's HEAD carries the broken call. Article
  3.2.4's `high` band (a live fault degrading behaviour), so this ticket is
  expedited ahead of non-expedited work.

  THE FIX IS UNCOMMITTED ON MAIN AND THAT IS FRAGILE. The three-file diff
  exists only as working-tree state in the master checkout, which is a shared
  tree with more than one writer. If the coder finds those files already
  clean at HEAD, or finds the working tree reverted, the diff is fully
  specified above and in the archived intake — rebuild it from there rather
  than assuming the ticket is already done. Do not `git stash` the master
  tree to tidy around it: the stash is repo-wide.

  SCOPE BOUNDARY — do not delete `pairingDeepLink`. After the fix it has no
  remaining production consumer as a button url, and the cleaner will notice.
  Leave it: BL-788's `/pair` page is the surface that owns the custom-scheme
  hand-off to the installed app, and retiring the field is a separate decision
  with its own reasoning. Removing it here is out of scope for this approval.

  ALSO NOTICED, DELIBERATELY NOT SCOPED HERE: the intake flags
  `.swarmforge/operator/babysitterd.pid` as stale — a dead PID with an
  hours-old log, so nothing is restarting daemons like this tunnel when they
  die. That is how the outage this intake describes began: a plain SIGTERM
  with no supervisor to catch it. It is already tracked against BL-611/653/685
  and is a different defect from this one; folding it in would fail INVEST's
  I and V. Recorded here only so the trail from the intake is not lost.

  APPROVED AS WRITTEN at 89ff4ee38 (2026-08-22), with no amendment. Both
  judgement calls put to the human therefore stand: severity `high` (so this
  ticket takes the Article 3.2.4 expedite lane), and the stage set
  `[coder, cleaner, hardender, qa]` with architect and documenter skipped for
  the reasons recorded above.

