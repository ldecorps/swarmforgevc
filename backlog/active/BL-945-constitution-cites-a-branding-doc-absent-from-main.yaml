id: BL-945
title: "Architecture Rule 6 and two production source files cite docs/branding/icon-system.md as normative authority, but the file exists only on an unmerged branch and is unreadable from every agent worktree"
milestone: M8
type: defect
severity: medium
status: todo
epic: spec-drift-realignment
human_approval: approved
priority: 45
direction: agent-proposed
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-945-constitution-doc-citations-resolve-on-main.feature

required_wiring:
  - "extension/test/constitutionDocCitations.test.js::constitution/articles::the citation check must live in extension/test/, the only suite a standing per-parcel gate runs; parked in specs/pipeline/test/ it would rot unrun"

invariants:
  - "The check reports only what an agent could not read. A citation is a defect solely because the path does not resolve on main - never because of how it is spelled, cased, or punctuated. A check that flags a resolvable path is worse than no check, because the noise is what gets it switched off."

description: >
  `swarmforge/constitution/articles/local-engineering.prompt` Architecture
  Rule 6 cites `docs/branding/icon-system.md` §4d as the authority for which
  icons epics may carry. `extension/src/concierge/epicIcon.ts` cites §5a as
  the authority for `EPIC_ICON_POOL`'s membership and order, and
  `extension/src/concierge/topicIcon.ts` cites it too.

  The file does not exist on `main`. Measured 2026-08-19: `docs/branding/`
  is absent from the working tree, and `git log --all --diff-filter=A` finds
  the file added only in `3ec9d6356` ("Grow the orchestra icon collection with
  an epic-forms family", 2026-07-16), which `git merge-base --is-ancestor`
  confirms is NOT an ancestor of main. It lives solely on
  `origin/branding/epic-marks`.

  Every agent reads its own worktree, which is a checkout of main. So the
  authority behind a constitutional rule is unreadable to every role bound by
  it, and the rule survives only as whatever the article's one-line summary
  happens to say.

  This is not theoretical - it cost real spec quality the day it was found.
  An operator intake asked to expand `EPIC_ICON_POOL` because it holds 10
  icons against ~30 epics, and proposed either adding more emoji or hashing to
  avoid exhaustion. Both proposals are unbuildable, and §5a is the only place
  that says why: Telegram bots may use only the stock
  `getForumTopicIconStickers` set, of which just 14 glyphs are
  musical/performance, the pool already holds 10, one more is reserved for
  ticket-state and one excluded for a badge-size collision. The real ceiling
  is 12 against 20+ epics with live topics, so distinct-icon-per-epic is
  unreachable and hashing creates no icons. That analysis was only possible by
  reading a doc off an unmerged branch. Nothing on main would have stopped a
  ticket being written for the impossible version.

  How (direction, not mandate): the citations are correct and the doc is
  genuinely authoritative - the constitution already treats it that way - so
  the fix is to make main consistent with the constitution by landing
  `docs/branding/icon-system.md` on main. The standing half is a check that
  scans constitution articles for cited repo document paths and fails when one
  does not resolve, so the next dangling citation is caught at the commit that
  writes it rather than by someone digging through branches months later.

constraints: >
  Out of scope:

  - The rendered marks, generator scripts, and image assets on
    `origin/branding/epic-marks` (`gen7.py`, `gen8.py`, the SVG/PNG families).
    This ticket lands the DOCUMENT that the constitution cites, not the design
    branch. Whether those assets belong on main is a separate question and a
    separate ticket.
  - Any change to `EPIC_ICON_POOL`, `ICON_EMOJI`, Architecture Rule 6, or the
    epic-icon behaviour. This ticket makes the existing authority readable and
    changes no rule. The icon-pool decision is live with the human under its
    own intake and must not be pre-empted here.
  - Extending the citation check to source-comment citations. `epicIcon.ts`
    and `topicIcon.ts` cite the same doc in comments, and they are what made
    the drift visible, but scanning arbitrary code comments for prose
    references is a much noisier problem. Constitution articles are the
    bounded, high-value surface; widening is a follow-up.
  - Rewriting or updating the doc's contents. It lands as it stands. Its
    §5a sticker census is stamped 2026-07-15 and the set can change over
    time; re-verifying it against the live Telegram set is separate work.

qa_e2e_procedure: >
  From the repo root:

  1. Reproduce before the fix: confirm `docs/branding/icon-system.md` is
     absent on main (`git cat-file -e main:docs/branding/icon-system.md`
     fails) while `git cat-file -e origin/branding/epic-marks:docs/branding/icon-system.md`
     succeeds, and confirm `swarmforge/constitution/articles/local-engineering.prompt`
     cites it.
  2. At the parcel commit, confirm the file exists on main and that its §4d
     and §5a sections - the two sections actually cited - are present.
  3. Run the acceptance feature and confirm all scenarios pass (4 cases:
     01, 02, and 03's two outline rows).
  4. Confirm the guard runs where it counts: the citation check must be under
     `extension/test/` and execute as part of the standing extension suite
     (`npm test` from `extension/`, never from the repo root), not only when
     invoked by name.
  5. Prove the guard bites, then revert: add a citation to a nonexistent
     `docs/does-not-exist.md` in a constitution article, run the suite,
     confirm exactly one test fails naming the article and the path, then
     `git restore` the article and confirm green.
  6. Confirm invariant 1: add a citation to a path that DOES resolve and
     confirm the check stays silent; confirm it also stays silent on a URL and
     on an article-name reference (scenario 03).
  7. `git show --stat`: expect the doc, the guard test, this ticket's feature
     file and step handler. No image assets, no generator scripts, no change
     to any icon constant or to Architecture Rule 6.

notes: >
  Source: found by the specifier on 2026-08-19 while draining the operator
  intake `backlog/INTAKE-epic-icon-pool-scale-up.md`. Surfaced as its own
  ticket rather than folded into the icon work, because it is independent of
  whatever the human decides about the pool: the citation is dangling either
  way.

  The two defects are related but must not be merged. This one is a
  spec-drift defect with a decided fix. The icon-pool question is a live
  design decision with the human (raised 2026-08-19 via role_ask) whose answer
  could amend Architecture Rule 6 itself. Bundling them would block a settled
  fix behind an open question.

approval_context: >
  One thing wants your judgement, and it is about the branch, not the check.

  I have specced the fix as "land `docs/branding/icon-system.md` on main,
  document only, assets stay on the branch". That treats the constitution's
  existing citation as settling the question - the article already calls the
  doc authoritative, so main should have it. But `branding/epic-marks` was
  never merged, and I do not know whether that was deliberate (a design
  exploration you were not ready to adopt) or simply unfinished. If the branch
  was parked on purpose, the right fix is the opposite one - excise the
  citations from Rule 6 and the two source comments and let the doc stay on
  its branch - and I will rewrite this ticket that way on a word from you.

  The standing citation check is worth having under either disposition; only
  the remedy for this one instance changes.

assigned_to: coder
