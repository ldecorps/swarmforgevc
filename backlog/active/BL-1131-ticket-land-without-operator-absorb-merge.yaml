description: |
  WHAT. Close the residual after BL-1130: landing a ticket on origin/main
  still requires an external human to absorb `origin/main` into diverged
  local `main` when paths collide — resolving AA/UU and committing
  `Complete origin/main merge…`. BL-1130 only made the daemon refuse
  clean (no mid-merge leftover); reconcile still surfaces conflict →
  wait-dirty-clear → coordinator stops (`Still wait-dirty-clear
  (behind=N). QA tip not on HEAD`).

  Measured 2026-08-25 after BL-1130 closed: BL-833 coordinator pane held
  in_process on wait-dirty-clear; same-day operator absorbs for BL-833 /
  BL-1117 and earlier lands. Refuse renamed the freeze; it did not remove
  external conflict resolution from the land path.

  WHY. Every land that touches paths also edited in local bookkeeping
  pages Cursor. That is the happy path today, not an exception.

  HOW (specifier lock 2026-08-25 — primary (b) + rematch (a); soft (c)):
  1. Before publish: rematch the land tip so it already contains
     origin/main (FF or clean join). Conflict → rematch to lander; never
     leave MERGE_HEAD for an operator.
  2. After publish: local master absorb is FF-only from origin/main (or
     the landed tip). Local-ahead bookkeeping that would collide is
     replayed onto the new tip without opening a human absorb merge;
     replay conflict → rematch that bookkeeping owner, not "Complete
     origin/main merge".
  3. Soft (c): during the land window, coordinator bookkeeping must not
     rewrite paths in the land tip's change set (or must land after
     absorb).
  Keep BL-1130 refuse for true tip failures. Auto-merging conflict file
  contents stays out of scope.

qa_e2e_procedure: |
  (1) Fixture: local main ahead with overlapping ticket paths vs an
  incoming land tip — under the new rule, land+absorb reaches behind=0
  with no human merge conflict resolution step.
  (2) Coordinator main_sync_status is proceed (or ff-only→proceed) after
  that land without an operator Complete-origin/main-merge commit.
  (3) When absorb would still conflict under refuse-only (BL-1130),
  surface names rematch for the lander — never “operator finish absorb”
  as designed recovery — and worktree stays clean (no MERGE_HEAD).
  (4) Record degraded Babashka gate where applicable (no mutation/CRAP).

out_of_scope: |
  - Auto-merging conflicted file contents with heuristics.
  - Changing who may push origin/main.
  - Reverting BL-1120 or BL-1130.
  - Unrelated overnight dirty WIP hygiene.
  - BL-1121 property-suite skip on import (separate paused ticket).

