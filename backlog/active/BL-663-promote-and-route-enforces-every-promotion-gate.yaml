description: |
  ## Why now

  Each bypass so far was cheap because a human was watching. The swarm now
  runs unattended shifts (cron night window; les 3x8 in BL-660): an
  unattended lane violation that ROUTES is a night lost to the wrong work;
  an unattended spec-skip is a guaranteed architect bounce round. A gate
  that exists and is skipped is broken, not missing (BL-635's taxonomy).

  ## Shape

  One enforcement layer on the promotion path (promote_and_route_next.sh /
  route_backlog_to_coder.sh / whatever single chokepoint the coder
  identifies), refusing with a named reason per gate:
  - human_approval: pending/amending never promotes.
  - assignee/spec-stage: a ticket whose assigned_to is specifier (or whose
    acceptance delegates scenarios to the spec stage) routes to the
    SPECIFIER, never to coder; no silent assigned_to rewrite.
  - expedite lane: among eligible candidates, defect severity critical/high
    beats every non-expedited ticket regardless of priority number
    (Article 3.2.4, fails closed on missing severity).
  - existing gates (depth cap, orthogonality, hold/park markers) run
    through the same chokepoint so no future auto-picker can skip them.

  ## Live chokepoint — verified by the specifier 2026-08-01, read before building

  The chokepoint is NOT open-ended: it is these two scripts, and the survey
  below is what the gate must change. Verified against the working tree at
  spec time — re-confirm at your commit, do not trust these line numbers
  blindly.

  - `swarmforge/scripts/promote_and_route_next.sh`
    - `pick_candidate()` filters on do-not-promote / epic / blocked ONLY.
      `human_approval` and `severity` appear NOWHERE in either script
      (grepped, zero hits) — the approval gate and the Article 3.2.4
      expedite lane are absent, not merely buggy.
    - `candidate_sort_line()` sorts by numeric `priority` then id. No
      expedited bucket, so a feature with a better priority number always
      beats an approved defect/high. This is instances 2 and 4 exactly.
    - ~L200: `sed -i 's/^assigned_to:.*/assigned_to: coder/'` — the silent
      rewrite of instance 3, mechanized. Fires on every promotion.
    - TWO invocation modes, and the by-name mode is the WEAKER one: with an
      explicit `BL-id` argument `pick_candidate` skips even the
      `is_buildable` check the auto-pick path applies. Both modes are in
      scope (invariant 1); gating only auto-pick leaves the wider hole open.
    - Already enforced, keep working: the depth cap (`ACTIVE_COUNT >= CAP`)
      and hold/ exclusion (hold/ is a sibling dir, never scanned).
      Orthogonality is absent — nothing compares scope against active items.
  - `swarmforge/scripts/route_backlog_to_coder.sh`
    - ~L59: `perl -pi -e 's/^assigned_to:.*/assigned_to: coder/'` — a SECOND,
      independent rewrite site. Fixing only promote_and_route_next.sh leaves
      instance 3 reproducible whenever routing is invoked on its own.

  ## Gate entry point must be greppable

  Name the gate's entry point so that the literal string `promotion_gates`
  appears at BOTH call sites (e.g. a `promotion_gates_cli.bb` / a
  `promotion_gates.sh` invoked from each script). `required_wiring` on this
  ticket is a fixed-string check for `promotion_gates` in those two files at
  the commit you send to QA — a gate library that is built but not called
  refuses the handoff, by design. Shape of the layer is otherwise yours.

  Acceptance: one fixture PER GATE — instances 2 and 3 above are ready-made
  fixtures with commit shas. Non-vacuity: a compliant promotion (approved,
  correctly-laned, specifier-first) passes unchanged.

  Refusals must name the failing gate (the scenarios assert the reason, not
  just the refusal): a silent skip is indistinguishable from "no candidate"
  and is what made instances 1-4 invisible to machinery.

  On landing, retire the standing operator watch memo
  (promote-and-route-next-skips-approval-and-assignee-gates).

