required_wiring:
  - "specs/pipeline/steps/index.js::bl956::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "The composed board message stays within PIPELINE_BOARD_MESSAGE_MAX_LENGTH for any ticket title length. Only the LINK list is budgeted - composePipelineBoardHtml drops link anchors and stops; the grid/caption/parked body is never trimmed. An oversized body is rejected whole by Telegram and retrying the same payload never succeeds (live outage 2026-07-17), so a caption that grows with the title is a new, unbudgeted path into that failure."
  - "Every caption line carries identifying context for its ticket - never a bare id with nothing after it. The hotfix routes the caption through `row.title ?? row.slug` and drops the NO_EPIC_LABEL fallback, so a grid row whose backlog meta is missing (a role-held ticket with no backlog entry - the case NO_EPIC_LABEL existed for) renders as `2 ` and identifies nothing."
  - "Every cap on this board is visible, never silent: an overflowed list names how many entries it dropped. The grid has `+N more active`, plain parked has `+N more parked`; the new PIPELINE_BOARD_COLLAPSED_EPICS_MAX slice has no indicator at all, which is the one shape this file's own comments (`never a silent cap`) forbid."

description: >
  On 2026-08-19 the human edited `extension/src/concierge/pipelineBoard.ts`
  directly in the master checkout and the change is already live in the
  running concierge: grid captions carry the full ticket title instead of
  the epic slug, plain parked entries are capped at 3
  (`PIPELINE_BOARD_PAUSED_MAX` 10 -> 3), collapsed-epic entries are capped
  at 3 (new `PIPELINE_BOARD_COLLAPSED_EPICS_MAX`), and caption lines are
  grouped with a blank line where the epic changes. The coordinator
  relayed it as `pipeline board hotfixed: captions show title, paused
  cap=3, epic cap=3`.

  It is in git nowhere. The specifier tried to land it on `main` under a
  `Hotfix-Certification: pending` trailer per
  `docs/how-to/BL-848-certify-an-operator-hotfix.md`, and
  `check_pipeline_code_on_main.sh` correctly refused: `extension/src/` may
  only reach `main` via QA (Article 1.8/4.2, BL-247). So the how-to's
  "or the specifier commits one on the human's behalf" cannot apply to a
  hotfix in pipeline code - that class has to ride the chain, which is
  what this ticket is for. The diff is captured verbatim at
  `backlog/evidence/BL-956-pipeline-board-hotfix.patch` (79 lines,
  committed f2b1a0424); the working tree it came from is the shared master
  checkout, which is chronically dirty and where a bare `git add -A` would
  sweep it away. Until this parcel lands, the board behaviour the human is
  looking at exists only in that patch file and in a compiled `out/`.

  Landing it as-is turns 3 assertions red in
  `extension/test/pipelineBoard.test.js`, verified statically against the
  patch: both caption tests pass `slug: ''` and no `title`, so
  `row.title ?? row.slug` yields `''` and the captions render `1 ` / `2 `.
  `lines.includes('1 Alpha')` fails in the shared-epic test, and both
  `lines.includes('1 Alpha')` and `lines.includes('2 (no epic)')` fail in
  the epic-less test. That is on top of the 2 failures BL-949 is already
  open against, and a red baseline is precisely the harm BL-949 was minted
  to end - QA cannot tell a regression from known noise.

  Two things in the patch are not what the human asked for and are in
  scope to correct (invariants 2 and 3): the `(no epic)` caption fallback
  is gone, so a row with no backlog meta identifies nothing; and the new
  collapsed-epic cap slices silently, with no `+N more` line, in a file
  whose own comments call a silent cap out as the shape to avoid.

  How (direction, not mandate): apply the captured patch in the coder
  worktree as the starting point, re-express the two caption tests against
  a title-derived caption asserting that the caption carries
  backlog-derived context rather than pinning one field, restore a
  non-empty fallback for a title-less row, give the collapsed-epic cap the
  same `+N more` treatment its two sibling caps already have, and make the
  body fit the send budget when titles are long.

constraints: >
  Out of scope:

  - Reopening what the human decided. Title-in-caption, parked cap 3, epic
    cap 3 and the blank line between epic groups are the requested
    behaviour; this ticket gates them, it does not relitigate them.

  - `extension/test/conciergeTick.test.js`. Its two stale assertions are
    BL-949's, and BL-949 was specced caption-agnostic on purpose so it
    survives this change - do not fix them here and do not wait for it.

  - `extension/src/concierge/conciergeTick.ts` and
    `extension/src/concierge/topicRouter.ts`. Both also carry uncommitted
    ticket-less edits in the master checkout (an aggregated epic-icon-pool
    warning; a 72-column reflow of `notes` in the summary body). They are
    surfaced to the coordinator, not folded in here.

  - The hotfix ledger's own state machine. Nothing was landed, so no
    ledger entry is owed for this one.

qa_e2e_procedure: >
  From `extension/` (never the repo root):

  1. Reproduce the breakage the parcel must have fixed: on a checkout of
  `main` before this parcel, `git apply
  backlog/evidence/BL-956-pipeline-board-hotfix.patch` then
  `npx vitest run test/pipelineBoard.test.js` - expect the two caption
  tests failing on `1 Alpha` / `2 (no epic)`. Revert the apply.

  2. At the parcel commit, `npx vitest run test/pipelineBoard.test.js`
  reports all passing, and the parcel's own diff of `pipelineBoard.ts`
  contains the patch's four changes (the `title` field on
  PipelineBoardRow, PAUSED_MAX 3, COLLAPSED_EPICS_MAX, the title-derived
  `gridCaptionLine`).

  3. Confirm invariant 2 is non-vacuous: render a board row whose id has
  no entry in `ticketMeta` and no epic, and confirm its caption line is
  not `<id>` followed by nothing. Then delete the fallback and confirm the
  scenario-02 case fails.

  4. Confirm invariant 3: render 5 collapsed-epic trackers, confirm 3
  render and a line names the 2 dropped. Remove that line and confirm the
  outline's epic row fails while its parked row still passes.

  5. Confirm invariant 1: build a board whose visible rows all carry
  ~180-character titles (BL-949's own title is that long) and confirm
  `composePipelineBoardHtml(...).html.length <=
  PIPELINE_BOARD_MESSAGE_MAX_LENGTH`. This is the one that would fail
  silently in production - a rejected send, not a wrong render - so run it
  before passing.

  6. Run the acceptance feature
  (`./specs/pipeline/scripts/run_acceptance.sh
  specs/features/BL-956-pipeline-board-caption-and-cap-hotfix.feature`)
  and confirm the step handler is registered in
  `specs/pipeline/steps/index.js`.

  7. `git show --stat`: expect `pipelineBoard.ts`, `pipelineBoard.test.js`,
  this ticket's feature file, its step handler and the registry line. No
  `conciergeTick.*`, no `topicRouter.ts`.

notes: >
  Source: coordinator note 20260819T140739Z_000584 (`pipeline board
  hotfixed: captions show title, paused cap=3, epic cap=3`), plus the
  human's own evidence note
  `backlog/evidence/pipeline-board-parked-and-caption-refinement-20260819.md`.

  BL-949's `approval_context` asked the human whether BL-949 should absorb
  the caption test fixes or whether the hotfix should carry its own. The
  human approved BL-949 without answering that question, and BL-949 was
  written to survive either answer. This ticket takes the option that
  needs no answer - the hotfix carries its own test updates - rather than
  amending an already-active ticket (Consolidation Authority: an active
  ticket is never consolidated).

  IR-DRY: the checker reports one medium-confidence `possible-synonym`
  finding, pairing scenario 03's two assertions ("are adjacent" and "a
  blank line separates"). Reviewed and kept - they are the deliberate
  positive/negative pair that proves the grouping keys on the EPIC
  CHANGING rather than on position, and collapsing them would delete the
  contrast the scenario exists to draw.

  The human's evidence note says "no acceptance scenario encodes the old
  caption format or the old PAUSED_MAX = 10 value - no scenario breaks".
  That is true of the acceptance suite and false of the unit suite: two
  UNIT tests pin the old caption. Verified statically against the patch on
  2026-08-19, not assumed.

approval_context: >
  Two lines this adds back to a board you had just decluttered, so you
  should see them before they appear:

  1. A caption fallback. Your change routes the caption through the ticket
  title; a grid row whose backlog entry is missing now renders its id and
  nothing else. I want to restore a short placeholder there (the
  `(no epic)` slot your change freed up). Say if you would rather see the
  bare id.

  2. A `+N more` line under the collapsed epics. Your cap of 3 drops the
  rest silently; the parked list and the grid both announce what they
  dropped. One extra line per board.

  Everything else here is your change, gated and test-corrected, not
  changed.

