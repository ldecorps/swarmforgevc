description: |
  ## What is wrong

  `specs/features/BL-829-bubble-remote-page-pager.feature`, scenario
  `bundle-pages-rejected-whole-02`, fails on main 858f8fca6c (specifier,
  one run, 2026-09-18 13:5xZ, load 4.4, no lane alive):

  ```
  not ok 2 - a malformed page list rejects the whole manifest
    error: 'Scenario "a malformed page list rejects the whole manifest" failed at step "And no page from it is offered to the shell": expected no pages offered, got: [{"id"...
  ```

  The handler (`bl829BubbleRemotePagePagerSteps.js:157-164`) throws
  unless `ctx.manifestBody.pages` is an EMPTY array. The scenario says
  something narrower: no page FROM the malformed manifest is offered.
  Since BL-1166 landed on 2026-08-27 (06284be69e, the Operator docs
  page; `extension/src/bridge/letsTalkRoutes.ts:34` `id: 'operator-docs'`)
  the bridge merges its own built-in pages - health, host, operator-docs -
  into the served list after the operator manifest resolves, including
  when that resolution fell back to `pages: []` on a malformed operator
  list (the coder's BL-775 evidence, 2026-09-18, confirmed pre-existing
  by stashing every BL-775 change). So the offered list is never empty,
  the assertion has been false for three weeks, and nobody saw it because
  no lane runs landed features (BL-1625). BL-775, in flight, adds a fourth
  built-in with id `live` - the id the fixture's malformed entry uses
  (`pages: [{ id: 'live', entryPath: 'live' }]`), so even an assert-by-id
  fix would collide the moment BL-775 lands unless the fixture's id is
  one no built-in carries.

  Not a BL-829 regression, not a BL-1166 defect: both behaviours are as
  designed; the handler over-asserted from the day built-ins existed.
  BL-829's scenarios 03 [1-4] are ALSO red, by a different root (the JVM
  suite, BL-1635); this ticket owns scenario 02 and the feature's row.

  ## What is wanted

  - A malformed operator manifest whose entry id is no built-in's id is
    rejected whole, no offered page carries that id, and every built-in
    page is still offered (scenario 01).
  - A malformed operator manifest whose entry id equals a built-in's id
    is rejected whole, and the offered page with that id is the bridge's
    built-in entry, not the manifest's (scenario 02 - the BL-775 `live`
    collision, pinned before it can happen).
  - BL-829's scenario 02 green on the parcel (QA e2e), its handler
    asserting by id against the manifest's entries and its fixture using
    the id `malformed-operator-page`.
  - The register row leaves in the same land.

  ## How (direction, not mandate)

  - In `bl829BubbleRemotePagePagerSteps.js`: the fixture step writes
    `pages: [{ id: 'malformed-operator-page', entryPath: 'malformed-operator-page' }]`
    (still missing `title` and `order`, so still malformed) and records
    the ids it wrote on `ctx`; the "no page from it" step asserts that
    none of the recorded ids appears in `ctx.manifestBody.pages` -
    nothing about the list's length. Two hunks, one file.
  - The BL-1634 handler drives the real bridge the way BL-829's does
    (its exported helpers, or its own scoped copies of the start/write/
    fetch steps - BL-1277's collision guard forbids an unscoped duplicate);
    scenario 02 writes the built-in id and asserts the offered entry's
    `entryPath`/`title` are the built-in's. Read the built-in ids from
    `letsTalkRoutes.ts`'s registry at run time, never a hand list.
  - Documenter: BL-829's how-to (if any) gains one line on built-ins
    being offered regardless of the operator manifest.

constraints: >
  BL-829's step handler (two hunks), the feature and handler, evidence,
  one register row. No change to BL-829's feature text, to
  bridgeServer.ts, letsTalkRoutes.ts or letsTalkUiBundle.ts, or to any
  other feature. The step handler lands with the feature (BL-233).
  Evidence named BL-1634-*.

out_of_scope: |
  - BL-829's scenarios 03 [1-4] and the JVM suite: BL-1635.
  - Whether built-ins SHOULD be offered when the operator manifest is
    malformed: they are today by BL-1166's design; a change is a Bubble
    product decision for its own ticket.
  - A lane that runs landed features (BL-1625).

qa_e2e_procedure: |
  On the parcel commit, from the repo root with extension/out compiled:
  1. Acceptance resolving both scenarios
     (`bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1634-*.feature`).
  2. `bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-829-*.feature`
     ONCE: scenario 02 passes; scenarios 03 [1-4] stay red while BL-1635
     is unlanded (their row names it) and pass once it has landed. Never
     "run it N times".
  3. `git diff main...HEAD --name-only` names BL-829's handler, this
     feature and handler, evidence and the register only.

