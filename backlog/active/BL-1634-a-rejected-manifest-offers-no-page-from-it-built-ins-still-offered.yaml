approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: BL-829's feature text is
  not changed - "no page from it is offered to the shell" is the right
  sentence; only its handler's assertion and its fixture's page id change.
  FIRM: the bridge's behaviour is not changed - a malformed operator
