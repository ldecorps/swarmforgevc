source: |
  Found during BL-723 (pilot-tonight quality review), coder viewpoint pass,
  2026-07-30. BL-718's own implementation (Bubble talk mirror chunking) is
  solid and has real unit tests in extension/test/letsTalkBridge.test.js, but
  its acceptance field points at specs/features/BL-718-*.feature and no
  matching handler file exists anywhere under specs/pipeline/steps/ (grepped
  both the steps directory and index.js). specs/pipeline/runtime.js throws
  "no step handler matched" for any unhandled step, so this feature file has
  never actually executed to completion.

notes: |
  BL-723 coder verdict on BL-718: not-on-par, specifically for this gap (the
  implementation itself was rated on-par). Linked pilot-process defect: BL-727.

  [2026-08-27] specifier: feature minted from coordinator Work note. Reconfirmed
  at HEAD: all 6 BL-718 scenarios still fail "no step handler matched" on
  Background Given. Product code stays; this ticket only wires the gate.

description: |
  ## What

  Wire specs/pipeline/steps/bl718BubbleTalkMirrorSteps.js (or equivalent) so
  the BL-718 acceptance feature's Given/When/Then steps resolve to real
  handlers driving the actual mirror/chunking code, matching the pattern
  already used by sibling tickets (e.g. bl627PricingTableCorrectnessSteps.js,
  bl642GateSnippetTerminalChromeSteps.js) — assert against real committed
  behavior (chunk boundaries, operator event JSON, topic routing), never
  prompt text.

qa_e2e_procedure: >
  (1) node specs/pipeline/cli.js specs/features/BL-718-bubble-talk-mirror-chunks-and-fails-loudly.feature
  — zero "no step handler matched", all scenarios green. (2) Handler module
  registered in steps/index.js and calls real mirror/chunker. (3) Existing
  extension/test/letsTalkBridge.test.js stays green.

