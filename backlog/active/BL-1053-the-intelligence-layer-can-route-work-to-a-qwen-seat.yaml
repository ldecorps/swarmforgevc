id: BL-1053
title: "The intelligence layer cannot route work to a Qwen seat: provider->agent knows three providers and none of them is qwen, so a qwen model registered under provider openai would be launched through the codex CLI"
milestone: M8
type: feature
status: todo
epic: swarm-intelligence-layer
priority: 0
direction: queue-jump
depends_on: [BL-1052]
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1053-the-intelligence-layer-can-route-work-to-a-qwen-seat.feature
human_approval: approved
approval_context: >
  Nothing needs deciding - this is the bookkeeping half of the ordering you
  already accepted, and it is here as its own ticket only because it is inert
  until BL-1052 lands something to launch. Flagged pending because the feature
  file is new.

  The one thing worth knowing: `qwen` gets its OWN provider key rather than
  reusing `openai`, even though the wire protocol is OpenAI-compatible. Under
  `openai` the existing map resolves to the codex CLI and would launch qwen
  models through the wrong binary - failing confusingly rather than loudly.

required_wiring:
  - 'swarmforge/scripts/model_factory_lib.bb::"qwen"::the provider key must land in the live provider->agent map - resolution reads that map, and a key registered anywhere else leaves ModelFactory resolving qwen models through another provider binary'
  - "specs/pipeline/steps/index.js::bl1053::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "Every provider key in the registry resolves to exactly one launch agent, and no two provider keys resolve to an agent that cannot serve them. A provider added without its own provider->agent entry falls through to another provider's binary rather than failing, which is the confusing failure this ticket exists to prevent."

description: |
  ## What is wrong

  `model_factory_lib.bb`'s `provider->agent` map knows three providers:

      (def provider->agent
        {"anthropic" "claude"
         "openai" "codex"
         "cerebras" "aider"})

  `qwen` appears nowhere in that file. So once BL-1052 makes a qwen-code seat
  launchable, the intelligence layer still cannot select it: ModelFactory's
  cheap/quality routing and cold-apply resolve a model's provider through
  this map, and a qwen model has no provider key that reaches the right CLI.

  The trap is that a plausible shortcut makes it worse. qwen-code
  authenticates with `--auth-type openai` because the wire protocol is
  OpenAI-compatible, so registering qwen models under `provider: "openai"`
  looks right - and resolves to `"codex"`, launching qwen models through the
  Codex CLI. That fails confusingly rather than loudly.

  ## How (direction, not mandate)

  Give qwen its own provider key with its own entry pointing at the launch
  agent BL-1052 registers, and register the Token Plan models as candidates
  with an honest cost class so cost-sensitive routing can select them:

      model_steward_cli.bb register qwen/qwen3.7-plus --status candidate --cost-class low

  and its siblings on the same plan. Cost class is a deliberate judgement,
  not a default - these are the cost-reduction option the whole intake exists
  to create.

  Not in this slice: the launch adapter, pack and agent shape (BL-1052, which
  this depends on); any autonomous seat mutation - registration makes a model
  SELECTABLE, it never changes a live seat on its own.

notes: |
  Source intake: `.swarmforge/operator/INTAKE-onboard-qwen-code-provider.md`
  (operator, filed 2026-07-26; archived to `.swarmforge/operator/archive/` on
  drain). This is slice (b) of the 1:N split with BL-1052 - it carries the
  intake's Scope item 4 and the `provider->agent` half of its UPDATE section.

  The operator's own words on why this half waits, verbatim: "the ordering is:
  (a) prompt_engine_lib.bb agent shape + base pack/launch seam [Scope items
  1-3 below] must land BEFORE (b) the `provider->agent` map extension + Model
  Steward registration under the correct `"qwen"` key are USEFUL — registering
  early with nothing to launch is inert bookkeeping."

  And on the collision, verbatim: "Needs its own distinct provider key (e.g.
  `"qwen"`) with its own `provider->agent` entry (`"qwen" "qwen-code"`), NOT
  reuse of the `"openai"` key just because the wire protocol happens to match."

  IR-DRY: four findings reviewed and all deliberately kept - three are the
  same provider-resolution step with different literal providers (which is
  what this feature is about), and one is scenario 05 asserting the same
  state before and after registration, which is the before/after pair that
  scenario exists to draw. No `duplicate` findings.

  Verified at spec time: `qwen` appears zero times in `model_factory_lib.bb`.

qa_e2e_procedure: |
  On the live host, after BL-1052 has landed:

  1. Register one Token Plan model through the CLI and confirm it is stored
     under the qwen provider key, not openai.
  2. Ask ModelFactory to resolve that model's launch agent and confirm it
     names the qwen-code agent - not `codex`.
  3. Confirm the negative: resolve an `openai`-provider model and confirm it
     still resolves to `codex`, unchanged.
  4. Confirm registration alone changed no live seat - every running pane is
     on the model it was launched with.
