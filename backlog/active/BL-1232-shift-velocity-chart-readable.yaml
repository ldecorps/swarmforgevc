notes: |
  - [2026-08-28] specifier: minted from the intake. The intake listed three
    failures; failures 2 and 3 are one root cause (unnormalized log-of-raw-ms
    warp), verified by arithmetic against nonLinearTimeX: for a 30-day series
    the age-1-day point maps to x = padL + 0.157 * plotW while age-0 maps to the
    right edge. That is why this is one ticket and not three - a label-spacing
    fix alone would still leave the warp packing the labels, and shipping half a
    readable chart is not a valuable increment.
  - [2026-08-28] specifier: Y-axis shape is the specifier's call per the intake's
    locked decision 3. Chose soft-cap plus clipped callout over a broken axis
    (a break glyph in SVG is fiddly and reads badly at email PNG scale) and over
    a log Y (it would make ordinary days readable but misrepresent ratios in a
    chart whose whole point is comparing shift sizes).
  - [2026-08-28] specifier: `pickLabelIndicesByPixelGap` is named in the spec
    only so `required_wiring` can anchor on a literal that will exist - BL-874
    shape. The algorithm behind the name is the implementer's.
  - [2026-08-28] specifier: BL-1006 sweep done - only BL-1184's feature file
    touches this chart, and it carries no boundary assertion this ticket
    falsifies. Its scenario 04 is guarded here instead, by scenario 05.

