description: |
  ## What is wrong

  The shift-velocity chart shipped by BL-1184 lands in every morning briefing as
  "Shift velocity — max tickets landed per 8h" and is effectively unreadable for
  the activity that matters. Evidence:
  `backlog/evidence/INTAKE-shift-velocity-chart-unreadable-20260828.jpg`.

  Three visible failures, two of which share one root cause:

  1. **Y scale crushed by one outlier.** A single ~415 peak forces the axis to
     ~0-500, so ordinary days (roughly under 30) sit as a flat line on the floor.
     The subtitle promises "recent detail"; the plot delivers none.
  2. **X-axis date labels collide.** Labels are picked by series index (`0`, mid,
     last) with no minimum pixel gap, so the early dates stack on the same strip
     of pixels and cannot be read.
  3. **One gap swallows the right half.** After the dense early cluster a
     near-zero line stretches across most of the plot width.

  **Root cause of 2 and 3 is the same:** `nonLinearTimeX` takes the log of RAW
  AGE IN MILLISECONDS — `log(1 + age) / log(1 + maxAge)`. Over a 30-day series
  the day-old point lands at ~16% of the plot width and today at 100%, so the
  single most recent hop consumes ~84% of the plot and every other day is packed
  into the leftmost sixth. Index-picked labels then land on top of each other
  because the first two are only ~3% of the width apart. The warp is not merely
  aggressive, it is unnormalized.

  ## Why it matters

  This is a shipped observability signal that conveys no usable information. It
  goes out daily. Contained to one chart in one email — hence `severity: medium`,
  not `high`.

  ## What must be true when this is done

  Ordinary days are visually resolvable, the peak is still findable on the chart
  (not only named in the subtitle), date labels are readable, and the day-to-day
  shape occupies the plot instead of one hop consuming it. See the feature file.

  ## How (direction, not mandate)

  - **Y axis — soft cap with clipped-peak callout.** Derive a robust body bound
    from the series (a high percentile, or a multiple of the median). When the
    peak materially exceeds that bound, set the axis maximum from the bound and
    clip: an over-cap day is drawn at the cap line with a marker distinct from
    the ordinary dot, carrying its true value as text. When the peak does NOT
    materially exceed the body, behave exactly as today — axis covers the true
    peak, nothing clipped, no markers. The subtitle keeps naming the peak.
  - **X labels — pixel spacing.** Add `pickLabelIndicesByPixelGap` to
    `briefingChartSvgCommon.ts` (named here so the wiring gate can anchor on a
    literal; the burndown chart is a later candidate caller, not this ticket's
    job) and call it from the chart. Direction: always keep the most recent day,
    then greedily accept candidates that clear the gap from an already-picked
    neighbour. The gap should be at least the rendered width of a `YYYY-MM-DD`
    label at font-size 11 monospace (~72px), not a magic smaller number.
  - **Warp — normalize before the log.** Warp on age RELATIVE to the span, e.g.
    `log(1 + k * age / maxAge) / log(1 + k)`, so recent days still get more room
    without one hop owning the plot. Oldest stays leftmost, newest rightmost,
    mapping stays monotonic.

  ## Contracts this ticket must not move

  - The metric is locked: max tickets landed per rolling 8h window per calendar
    day. The renderer plots `landedMax` as received and computes no aggregation.
  - The non-linear time axis stays non-linear. `hasNonLinearTimeSpacing` must
    still report true for long history, so BL-1184's own scenario
    `non-linear-time-axis-04` stays green. Do not flatten the warp to linear
    while fixing failure 3.

qa_e2e_procedure: >
  (1) From `extension/`, `npm run compile`, then run
  `node out/tools/render-briefing-shift-velocity.js <repo-root>` against the live
  repo and open the PNG. (2) Ordinary days are visually resolvable — the line is
  not flat on the floor. (3) The 415-class peak is still findable: the subtitle
  names it AND a clipped marker on the plot carries its value. (4) No two date
  labels overlap. (5) Oldest date leftmost, newest rightmost, and no single
  day-to-day gap eats more than half the plot width. (6) Send or dry-run the
  briefing and confirm the chart section still ships unchanged alongside the
  burndown and architecture diagrams. (7) Re-run BL-1184's acceptance scenarios
  and confirm `non-linear-time-axis-04` is still green.

out_of_scope: |
  - Changing the 8h window, the aggregation, or the lifecycle adapter (BL-1184).
  - Removing the non-linear time axis.
  - Reworking the burndown or architecture briefing charts. Only the shared
    label picker lands in `briefingChartSvgCommon.ts`; wiring the burndown chart
    to it is a separate ticket if anyone wants it.
  - The `/tmp` fixture leak in `bl1184BriefingShiftVelocitySteps.js` (owned as
    BL-1226).

