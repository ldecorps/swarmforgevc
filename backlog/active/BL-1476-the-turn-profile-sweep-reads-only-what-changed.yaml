human_approval: approved
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. Two things are FIRM: (1) what gets
  RECORDED does not change - turn-profile-series.jsonl keeps one row per
  UTC day, upserted, and a completed tick's row is identical to what a full
  walk of the same transcripts would have written; only what gets READ
  changes. (2) A tick that reaches its deadline before finishing the walk
  writes NO row that tick (a partial window is not a measurement - the
  same fail-closed posture BL-1364 chose for an unreadable transcript); it
  keeps the summaries it completed and the next tick finishes. On this
  host the first tick after landing will rebuild summaries for ~2000
  transcripts over two or three ticks before the store updates again.
  Minted by the specifier from the human's root intake of 2026-09-07,
  backlog/INTAKE-turn-profile-producer-unbounded-transcript-walk.md
  (archived under backlog/archive/).

invariants:
  - "A completed tick's window row is identical to the row a full walk of the same transcripts would write at that moment - same window_day, window_start, window_end, complete, unreadable and truncated-tail lists, stages and shares. The persisted per-transcript summaries change what is READ, never what is RECORDED."
  - "A tick opens for content only transcripts whose size or mtime differs from their persisted summary, or that have none; an unchanged transcript costs one stat and no read. A tick's bytes read scale with what changed since the last completed tick, never with lifetime transcript volume."
  - "No tick runs past its own deadline, and that deadline is at most one quarter of SUPERVISOR_IN_SWEEP_BUDGET_MS (225000 ms default, so 56 s or less); a tick that stops early has persisted the summaries it completed and has written no window row."

description: |
  ## What is wrong

  `swarmforge/scripts/handoffd.bb` `turn-profile-producer-sweep!` (~2827)
  shells to `run-turn-profile-producer.js` every daemon cycle; its own
  comment says "firing every cycle is safe" - true of its OUTPUT dedupe,
  not its INPUT cost. `runTurnProfileProducer`
  (`extension/src/metrics/turnProfileProducer.ts`), for every role group:

  1. `listTranscriptJsonlPaths` (`transcriptUsage.ts`) lists EVERY `.jsonl`
     ever written under `~/.claude/projects/<slug>/` - no time bound, no
     cursor.
  2. `assessTranscriptReadability` reads and JSON-parses every line of every
     file; `walkTranscriptFiles` (`transcriptWalker.ts`) then reads and
     parses every file AGAIN. Two full reads and two full parses per file
     per tick.
  3. `filterNewTurnProfileWindows` only decides whether the day's row is
     new; nothing recorded feeds back into what is read. The record's own
     comment names the shape: "the walk's window widens on every daemon
     tick".

  Measured by the specifier on 2026-09-07 (evidence file in `source:`):
  the coder role alone is 272 transcripts / 414 MB, readability pass 2.8 s
  plus walk 3.4 s with a warm page cache; 8 role groups, 2.2 GB in all.
  The live daemon log shows the sweep at 27.4-32.5 s on every cycle
  between 19:45Z and 19:53Z, and 38.9 s inside the 18:03Z `stalled`
  failure (`.swarmforge/daemon/handoffd-failure-20260907T180330Z.log`)
  where the next-slowest sweep was 15.8 s. Host telemetry in that window
  showed no CPU or memory contention. Two ceilings sit above it: the 60 s
  `SWARMFORGE_SUBPROCESS_WAIT_BOUND_MS` default in
  `daemon_cycle_guard_lib.bb`, past which `sh!` kills the CLI (exit 124)
  and the sweep logs nothing but its boundary line (BL-1478), and
  `SUPERVISOR_IN_SWEEP_BUDGET_MS` (225 s), past which the supervisor rules
  the daemon stalled and BL-144 halts every role session - the mechanism
  BL-1454 already exists for.

  ## What is wanted (the human's intake, verbatim)

  - Bound the walk: persist a cursor (last-processed file + byte offset, or at
    minimum last-processed mtime/window boundary) per role, so a tick's cost
    scales with *new* transcript content since the last successful run, not
    with the total lifetime volume.
  - Keep `buildTurnProfileSeries`'s existing one-row-per-day upsert semantics
    (`TurnProfileWindowRecord.window_day`) - this is about bounding what gets
    *read*, not changing what gets *recorded*.
  - A tick's own deadline/cap, same posture BL-1454 added to
    `coordinator-activity-feed-sweep!` - do not assume dedup-on-write is
    sufficient cost control for an unbounded-on-read walk.
  - Audit whether `context-telemetry-producer-sweep!` (the sibling sweep
    immediately above this one in `handoffd.bb`, walking "the same
    transcripts") shares the identical unbounded-read shape - out of scope to
    fix here, but worth naming rather than leaving for someone else to
    rediscover independently.

  The audit is done (specifier, this mint): the sibling DOES share the
  shape - `deriveEventsForRoleGroup` calls `walkTranscriptFiles` over every
  transcript and discards the result, then `readTranscriptUsage` reads every
  file again - but it has not been paying that cost because it has been
  throwing on a corrupt store line on every cycle since 2026-08-30
  (BL-1477). Once BL-1477 un-darkens it, adopting this ticket's change
  detection is the follow-up recorded on the swarm-reliability epic's
  remaining_slices.

  ## What is wanted (specifier's reading: scenarios and invariants)

  - A persisted per-transcript summary (direction: one JSON file under
    `.swarmforge/telemetry/`, keyed by path, carrying size, mtime, the
    readability verdict, coverage start/end and the per-category duration
    sums the series builder needs). A tick stats every listed transcript,
    reads only those whose size or mtime differs from the summary or that
    have none, drops summaries of files no longer listed, and assembles the
    window from the summaries (invariants 1, 2; scenarios 01, 02).
    Per-file aggregation is exact: `buildTurnProfileSeries` is integer
    duration sums per category per stage over intervals the walker already
    computes per file (`overheadIntervals` runs inside the per-file loop),
    and with no handoff trail `attributeTrail` is the identity.
  - One read per changed file, not two: readability and the walk consume
    the same text.
  - The CLI's output line reports how many transcripts it read of how many
    it listed (scenarios 01, 02) - the live evidence for invariant 2 that
    QA and the daemon log can see without a seam.
  - A tick deadline (direction: 30 s default, clamped to a quarter of
    `SUPERVISOR_IN_SWEEP_BUDGET_MS`, both read from the OS env in the CLI
    exactly as BL-1454's `activity-feed-tick-deadline-ms` does in handoffd
    - or handed down by handoffd as an argument, coder's call) checked
    between files against an injected clock. On reaching it the tick
    persists the summaries it completed, writes no row, and prints a
    `PARTIAL` line the sweep logs on exit 0 (scenario 03; invariant 3).
  - The handoffd.bb comment "firing every cycle is safe" is corrected to
    say why it is now true of the input too.
  - Documenter: `docs/how-to/BL-1364-turn-profile-producer-wiring.md` gains
    the summary store, the deadline, the partial-tick rule and the
    read-of-listed report; no registered diagram depicts this sweep.

  ## How (direction, not mandate)

  - A byte-offset resume within a still-growing transcript is a permitted
    refinement, not required: the walker's turn-boundary logic
    (`overheadIntervals`) needs the preceding event, so a plain per-file
    re-read on change satisfies invariant 2 and is the minimum.
  - Persist the summary store at deadline stop and at tick end, not after
    every file - the first tick on this host summarises ~2000 files.
  - Inject `nowFn`, the content-read seam and the store path so every
    scenario runs on fixture transcripts under mkdtemp, never on
    `~/.claude/projects/`.
  - Do NOT fix this by raising `SUPERVISOR_IN_SWEEP_BUDGET_MS` or the
    subprocess wait bound, by deleting transcripts, or by running the
    sweep less often - each masks the unbounded read.

  ## Live check the coder can run before forwarding

  `node extension/out/tools/run-turn-profile-producer.js` on this
  repository, three times in a row with the daemon stopped: the first one
  or two runs print `PARTIAL ... no window recorded` inside the deadline;
  the first complete run prints `UPDATED turn profile for 8 stage(s)` with
  a read-of-listed count, and the day's row in
  `.swarmforge/telemetry/turn-profile-series.jsonl` is identical to the
  row the pre-fix build writes (diff the JSON; only
  `truncated_tail_transcripts` may differ if an agent finished a line in
  between); the next run reports reading only the transcripts agents wrote
  to meanwhile and completes in single-digit seconds versus 27-39 s today.

constraints: >
  Fixture transcripts under mkdtemp. No change to the walker's
  classification or category set (BL-664) or to the record shape and its
  one-row-per-day upsert (BL-1364). The context-telemetry producer is
  untouched here (BL-1477 owns un-darkening it; adopting this change
  detection is the epic's recorded follow-up). handoffd.bb is shared with
  BL-1478 (paused) - the coordinator serialises if both are live. The step
  handler lands with the feature (BL-233). No hand-edited mutation
  manifests. Mutation on turnProfileProducer.ts and transcriptWalker.ts is
  inside the 3-day cooldown until 2026-09-08 (not_before).

