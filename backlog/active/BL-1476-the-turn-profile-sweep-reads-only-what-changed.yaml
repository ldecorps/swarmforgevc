qa_e2e_procedure: |
  1. `cd extension && npm test -- turnProfileProducer run-turn-profile-producer`
     green, including the invariant-1 property test (bounded producer versus
     full walk over generated transcript sets and tick sequences), and
     `bash specs/pipeline/scripts/run_acceptance.sh
     specs/features/BL-1476-the-turn-profile-sweep-reads-only-what-changed.feature`
     resolving all three scenarios; BL-1364's feature still resolving
     (run_acceptance.sh takes one feature per call, run both).
  2. Live, on this host, daemon stopped: delete the summary store if
     present, run the CLI until it prints a complete run; keep the row it
     wrote, then run the pre-fix build from a scratch worktree against the
     same transcripts and diff the two rows - identical apart from
     truncated_tail_transcripts when an agent wrote in between.
  3. Start handoffd and read `.swarmforge/daemon/handoffd.log` over three
     cycles: `sweep=turn-profile-producer-sweep ms=` is under 10000 on every
     warm cycle (27000-39000 today), no `PARTIAL` after the first complete
     run, the `turn-profile-producer` line reports a read count no larger
     than the number of agents that wrote since the previous cycle, and the
     day's row still updates each cycle.
  4. Set `SUPERVISOR_IN_SWEEP_BUDGET_MS=40000` in the daemon env for one
     cold run (summary store deleted): the effective deadline is 10 s and
     the CLI prints `PARTIAL`; unset it again.

