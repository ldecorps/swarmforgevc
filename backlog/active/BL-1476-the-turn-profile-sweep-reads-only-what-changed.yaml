id: BL-1476
title: "handoffd's turn-profile-producer-sweep re-reads and re-parses every role transcript ever written on every daemon cycle - 2.2 GB across 8 role groups on 2026-09-07, 27-39 s of every ~60 s cycle, growing with every session ever started and never fed back by what it recorded; a tick reads only transcripts changed since the last completed tick, records exactly what a full walk would, reports read-of-listed counts, and stops at its own deadline"
milestone: M8
type: defect
severity: high
# high (not critical): a live fault degrading behaviour on a measured
# trajectory - the sweep alone is 27-39 s of a ~60 s daemon cycle today and
# grows with lifetime transcript volume; at the 60 s subprocess wait bound
# (daemon_cycle_guard_lib.bb) sh! kills the CLI and the store silently stops
# updating, and it counts against the same SUPERVISOR_IN_SWEEP_BUDGET_MS
