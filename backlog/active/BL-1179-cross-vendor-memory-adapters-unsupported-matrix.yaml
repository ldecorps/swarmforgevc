approval_context: >
  Third slice of agent-memory-transfer. BoB premise is mixed vendors; document
  hard limits per runtime rather than silent no-ops.

invariants:
  - "Unsupported vendor pairs refuse transfer with a named matrix reason — never silent success."
  - "Supported pairs use the portable payload from BL-1177 — not a second ad-hoc format."

required_wiring:
  - 'extension/src/tools/agentMemoryHotSwap.ts::AgentMemoryTransferApi::anti-drift anchor on the LIVE seam, not a wiring check. BL-1178 already routes the hot swap through this typed seam into agentMemoryTransfer, so adapters and the unsupported matrix must be reachable from here rather than built as an island beside it. Corrected 2026-08-28: the original entry named the prose phrase "agent memory transfer adapters" as a path, which the gate matches as a literal file and can therefore never satisfy (BL-874 shape)'
  - "specs/pipeline/steps/index.js::bl1179CrossVendorMemoryAdapterSteps::acceptance handler registered"

description: |
  Adapters that map runtime-specific state into/out of the BL-1177 portable
  payload where possible, plus an explicit unsupported matrix for vendor pairs
  that cannot transfer — fail closed with a clear signal.

qa_e2e_procedure: >
  (1) Supported pair fixture → transfer succeeds via portable payload.
  (2) Unsupported pair → refuse with matrix reason. (3) Matrix is readable
  without running a live swap.

out_of_scope: |
  - Changing steward ranking (BoB / BL-547).
  - Cross-role memory merge.

