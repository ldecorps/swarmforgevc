qa_e2e_procedure: |
  On the live host:

  1. Cost a known token count against `claude-sonnet-5` at an instant INSIDE
     the intro window and confirm the intro rate is used, not list.
  2. Cost the same token count at an instant on or after 2026-09-01 and
     confirm the list rate is used. The two answers must differ by the
     expected 50%.
  3. Cost the same against a windowless model (`claude-opus-5`) at both
     instants and confirm the answer is identical - windowless rows are
     unchanged.
  4. Run the staleness query and confirm it names the Sonnet window, with its
     date, without anyone having to know the date in advance.
  5. Confirm the fail-loud property survives: a model whose windows leave an
     instant uncovered raises rather than costing at zero, the same way an
     unpriced model does today.
  6. Confirm nothing moved on its own: every running seat is on the model and
     effort it was launched with.

