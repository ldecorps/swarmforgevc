approval_context: >
  This ticket knowingly revisits a decision BL-627 made on purpose, so it
  needs your ruling before it is built.

  `pricingTable.ts` says, in its own comment: "claude-sonnet-5 keeps published
  list $3/$15 deliberately — introductory $2/$10 through 2026-08-31 is NOT
  modeled (time-bounded rates stay out of this table; list price during the
  intro window overstates that seat)." That was a defensible call - it keeps
  the table a flat one-line-PR data file.

  It also has two consequences worth stating plainly. Today the swarm
  OVERSTATES every Sonnet seat's cost by 50%, so every economic comparison
  made in the intro window is wrong in Sonnet's disfavour. And on 2026-09-01
  the real spend rises 50% with no signal at all - the table simply becomes
  correct, silently.

  Spec'd as: the table gains OPTIONAL validity metadata (this rate until this
  date, then that rate), unset for every model that has no window, so the
  common row stays a one-liner. The alternative that keeps BL-627 intact is a
  separate windows file the cost path consults - one more sibling table, which
  your own intake rules out ("ONE source of truth shared with the
  (BL-627-repaired) cost table, never a third sibling").

  TIMING: the window closes in nine days. If this matters for 09-01, it needs
  promoting well before then; if you would rather just hand-edit the rate on
  the day, say so and this ticket becomes the query verb only.

  FIRM: no autonomous seat mutation of any kind. This ticket makes the cliff
  QUERYABLE; it changes no seat and proposes no tier-down.

required_wiring:
  - "specs/pipeline/steps/index.js::bl1056::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "A priced model is never costed at a rate outside its own validity window. For any model and any instant, the rate used is the one whose window contains that instant; a model with no window uses its single rate at every instant, exactly as today."
  - "Costing never silently degrades. A model whose windows leave an instant uncovered fails loud in the same way BL-627 made an unpriced model fail loud - never a fallback rate, never a zero."

description: |
  ## What is wrong

  `extension/src/metrics/pricingTable.ts` is a flat map of model to four
  rates, with no notion of time anywhere in it. Its own comment records the
  exclusion as deliberate:

      // claude-sonnet-5 keeps published list $3/$15 deliberately —
      // introductory $2/$10 through 2026-08-31 is NOT modeled (time-bounded
      // rates stay out of this table; list price during the intro window
      // overstates that seat).

  So the most consequential dated price fact in this repo exists nowhere the
  swarm can read it. The operator's own framing: "The single most
  consequential price fact in this repo — **Sonnet 5 intro pricing ends
  2026-08-31** — exists only in the operator's private memory notes. Nothing
  in the swarm will notice that day."

  ## Why it cuts both ways

  Inside the window (now), list price overstates every Sonnet seat by 50%, so
  every economic comparison the swarm makes is biased against Sonnet - the
  exact seats the operator upgraded to Sonnet on 2026-07-25 partly BECAUSE of
  the intro rate. After the window, the real bill rises 50% and the table just
  becomes correct, with no event, no alert, and nothing to re-run the
  decision that the intro price justified.

  Six of the seven pipeline windows in `swarmforge.conf` run
  `claude-sonnet-5` today.

  ## How (direction, not mandate)

  Give a pricing entry optional validity metadata - the rate that applies
  until a date, and what it becomes after - leaving every windowless model's
  row exactly the one-line shape BL-627 chose. Cost computation resolves the
  rate for the instant it is costing rather than reading one fixed rate. Then
  make the cliff answerable: a query that lists entries whose window has
  passed or is about to, so `08-31` is something the swarm can be ASKED about
  instead of something a human has to remember.

  Not in this slice, and deliberately: the scheduled economic review and its
  effort-then-model descent ladder (recorded on the epic; its evaluation arm
  depends on unparking BL-548), any seat proposal, and any autonomous
  application. This ticket only makes prices honest about time.

