id: BL-1752
title: "On a mono-router pack the chase never starts a second session to serve a role's mail - a :departing-mid-parcel refusal leaves the target role's mail for the resident, which the chase rotates once its turn ends; the chase's consult spawn (spawn-consult-session!, consult-eligible?) and the single_inference_slot knob only it read are removed"
milestone: M8
type: defect
severity: medium
# medium: a defect against the pack's own definition (mono-router.conf
# line 1, "ONE resident pipeline agent"), live on any router pack without
# the interim knob; no live exposure in this repo today (the day shift runs
# full-forge, which has no resident, and the only live router pack,
# gpu-bargain-hunter, refuses every consult through the interim knob).
# Not high: nothing is degraded while the knob holds.
status: todo
epic: local-llm-swarm
priority: 10
direction: human-directive
depends_on: []
