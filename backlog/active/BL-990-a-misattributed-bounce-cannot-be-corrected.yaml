id: BL-990
title: "a misattributed bounce is permanent: record-bounce.js has no correction verb and its --role enum cannot name the specifier, so an amendment-caused bounce is charged to a pipeline role forever"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
human_approval: approved
priority: 20
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-990-bounce-attribution-correctable.feature

invariants:
  - "A bounce record's attribution can be corrected after the fact, and every consumer of the store reports the corrected attribution rather than the original."
  - "The store stays append-only: a correction is a new record that supersedes an earlier one, never an edit or deletion of it."

description: >
  Severity rationale: high - a broken measurement, and one that is being read
  right now. A live experiment is measuring the coder's bounce rate and
  reporting it in the daily briefing, so a wrongly-attributed bounce does not
  merely make an untidy record; it silently biases an active decision input.

  Demonstrated end-to-end on 2026-08-20, not hypothesised:

  - The specifier amended an ACTIVE ticket (BL-971, commit 3a15ebffe, 13:23)
    to add a third file to its acceptance contract.
  - A parcel built at 12:22 against the pre-amendment contract was sitting at
    QA. QA judged it against the amended contract, correctly found the third
    file unfixed, and bounced at 13:45.
  - The store recorded:
    {"ticket":"BL-971","producingRole":"coder","ticketType":"defect",
     "failureClass":"acceptance","commit":"8956d30eee","by":"QA",...}
  - The coder had merged, re-read and shipped the amended fix at 342e63fc58
    SIX MINUTES BEFORE the bounce. It did nothing wrong. The cause was the
    amendment's timing - the specifier's.
  - QA accepted the correction and broadcast it as a note
    (20260820T140003Z_000425, "misattributed - not your fault"). The JSONL
    record is unchanged. Verified after the broadcast: still
    producingRole "coder".

  Two structural gaps make this permanent, and they compound:

  1. NO CORRECTION VERB. `record-bounce.js --help` offers only
     --ticket/--role/--type/--class/--commit/--by/--evidence/--items/--blocked.
     There is no retract, supersede, correct or void. `bounceStore.ts` exposes
     `readBounceRecords` and `appendBounceRecordIfNew` - append and read, no
     amend path.
  2. --role CANNOT NAME THE SPECIFIER. The enum is
     coder|cleaner|architect|hardender|documenter. Even a human willing to
     re-record by hand cannot express "the specifier's amendment caused this".
     (--by DOES include specifier; producingRole does not.)

  Together: a bounce caused by a mid-flight spec amendment is STRUCTURALLY
  GUARANTEED to be charged to a pipeline role, permanently. A human-readable
  note is the only correction available today, and no consumer reads notes.

  Consumers that will keep reporting the wrong number until this is fixed:
  qaBounceStore.ts (filters on isKnownProducingRole), failureModeInventory.ts
  (keys signatures as `qa_bounce:<class>:<role>`), reworkRounds.ts,
  leanLedgerComposeBounce.ts.

  How (direction, not mandate): a correction is a NEW record that supersedes
  an earlier one by commit+ticket, carrying a reason and an evidence pointer,
  with readers resolving supersession before counting. Whether the corrected
  attribution names the specifier or simply marks the record
  excluded-from-attribution is the implementer's call - the second is smaller
  and sidesteps the enum entirely.

constraints: >
  Firm lines:

  - Do NOT edit or delete existing JSONL lines. The store is append-only and
    is an audit trail; a correction that rewrites history destroys the ability
    to see that a misattribution ever happened, which is itself the evidence
    that this class of defect exists.
  - Every consumer resolves supersession, not just the one you are looking at.
    A correction honoured by qaBounceStore but ignored by
    failureModeInventory produces two different bounce rates from one store,
    which is worse than the single wrong number today.
  - A correction requires a reason and SHOULD carry an evidence pointer. An
    unexplained retraction is indistinguishable from metric-gaming, and this
    store feeds a live experiment.
  - Do NOT widen --role into a free-text field. If the specifier becomes
    expressible, it is an enum member like the others; the value is a closed
    set precisely so consumers can group on it.
  - Correcting a bounce never un-bounces the parcel. This is a telemetry
    record, not the routing decision - the parcel's disposition is untouched.

notes: >
  Source: the BL-971 amendment-supersession incident, evidence committed at
  backlog/evidence/BL-971-amendment-supersession-20260820.md (f98d902c7).
  QA's own correction broadcast is 20260820T140003Z_000425.

  The specifier caused the incident and is filing the ticket; that is
  deliberate rather than awkward. The gap is only visible from the side that
  trips it, and the two prior mitigations both proved insufficient:
  swarmforge/roles/specifier.prompt now says to sweep mailboxes for the real
  holder rather than trusting `assigned_to:` (0754234f9), but that only helps
  BEFORE the amendment lands; and a priority-00 note does not reach a reviewer
  already working, because ready_for_next.sh checks in_process first. Once a
  parcel is with a reviewer the bounce is coming, so the remaining remedy has
  to be correcting the record afterwards - which is exactly what is missing.

  BL-233: unlike its four sibling tickets from today, this one introduces a NEW
  feature file, so all five scenarios need step handlers landing in the SAME
  parcel - the acceptance runner throws on any scenario lacking one.

  Related and deliberately NOT bundled: BL-816 (paused) requires a role that
  observes a red suite to record a decision. Same family - the durability of
  review judgements - but that is about recording a decision at all, this is
  about correcting one already recorded.

  PROMPT HALF LANDED OUT OF BAND (BL-798), 2026-08-21, commit 91b1fb0a46 on main:
  swarmforge/roles/QA.prompt gains a "Correcting A Misattributed Bounce"
  section and swarmforge/roles/specifier.prompt gains the same duty at its
  cause. The documenter filed this as a spec gap by note - correctly, since
  role prompts are the specifier's exclusive domain and no gate would have
  caught the mechanism landing wired into zero call sites. BOOKKEEPING ONLY:
  nothing in the parcel changes, no rebuild, no new scenario, no step
  handler. The prose was written against the CLI interface at the
  documenter's tip 411ffb2f1 (--ticket/--commit/--reason/--by required,
  --evidence optional); if QA bounces and those flags change, the prompts
  need a follow-up commit.

qa_e2e_procedure: >
  1. Record a bounce with a deliberately wrong producingRole, then record a
     correction for the same ticket+commit. Assert the original line is still
     present in the JSONL byte-for-byte (append-only) and that a new
     superseding line follows it.
  2. Read back through every consumer listed in the description
     (qaBounceStore, failureModeInventory, reworkRounds,
     leanLedgerComposeBounce) and assert each reports the CORRECTED
     attribution. Any consumer still reporting the original fails this
     ticket - that is invariant 1.
  3. Reason/evidence required: attempt a correction with no reason and assert
     it is refused.
  4. Replay the real case: apply a correction to the BL-971 8956d30eee record
     and assert the coder's bounce count for 2026-08-20 drops by exactly one
     while the total record count RISES by one.
  5. Idempotence: apply the same correction twice and assert the second is a
     no-op, matching appendBounceRecordIfNew's existing posture.

approval_context: >
  One choice left open deliberately: whether a correction RE-ATTRIBUTES the
  bounce (which needs `specifier` added to the --role enum) or simply marks
  the record excluded from attribution with a reason. The second is smaller,
  needs no enum change, and fixes the live contamination; the first is more
  truthful and would let us see how often amendments cause bounces. I did not
  pick because the answer depends on whether you want that second number.

  Flag if you would rather this wait: it is filed as high because a live
  experiment is reading the contaminated metric now, but the underlying gap
  has presumably existed since the store was introduced.

assigned_to: coder
