description: |
  ## Status: hotfix e022e33baf landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  The bare qwen2.5-coder-14b-q5km:latest tag carried no num_ctx, the
  hand-started `ollama serve` sets no OLLAMA_CONTEXT_LENGTH, and qwen talks
  to /v1, which takes no per-request num_ctx. So every seat request ran at
  Ollama's 4096 default and Ollama kept only the last 2050 tokens of the
  seat's 8310-token first request: most of qwen's own system prompt never
  reached the model. The launch's window gate (BL-1801/BL-1840) read no
  num_ctx, so it only warned, and BL-1838's provider entry was skipped for
  the same reason.

  ## What the hotfix changed

  - swarmforge/packs/qwen2.5-coder-14b-q5km.Modelfile: FROM the bartowski
    Q5_K_M tag, PARAMETER num_ctx 32768 (the model's native window), chat
    template unchanged. Same shape as ista-iq3s-coder.Modelfile.
  - Applied live with the file's own Apply line.

  ## What the coder checks

  - The Modelfile's FROM names the tag the seat ran before (`ollama show
    qwen2.5-coder-14b-q5km:latest --modelfile`) and the template matches
    the bartowski tag's.
  - The served window now reads 32768 through the same function the launch
    uses (local_model_window_gate_lib.bb's served-window), and BL-1838's
    feature passes.
  - Write the result to backlog/evidence/BL-1916-coder-<date>.md: NONE, or
    one item per defect found.

qa_e2e_procedure: |
  1. `ollama show qwen2.5-coder-14b-q5km:latest --parameters` prints num_ctx 32768.
  2. `grep 'truncating input prompt' .swarmforge/ollama/serve.log | tail -3`:
     no line timed after the hotfix's apply (2026-10-03 10:38 local) names a
     prompt of 8000 tokens or more from the coder seat.
  3. `node specs/pipeline/cli.js specs/features/BL-1838-a-local-model-seats-qwen-budgets-the-window-its-model-is-served-with.feature`
     passes (measured at mint: all ok).
  4. The coder's evidence file exists and names this commit range.

