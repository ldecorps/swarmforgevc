description: |
  ## Status: hotfix cbca1b5edb landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `specs/pipeline/steps/bl1221PilotGateDepsStubsSteps.js`'s step "the stub
  supplies <member>" required each of 15 caller test files to contain the
  literal member name. BL-1229 (2026-09-05) moved seven of them onto the
  shared `makeAcceptanceGateDeps` helper
  (extension/test/helpers/pilotAcceptanceGateDeps.js), which supplies every
  required member, so the step reported seven correct callers missing.

  ## What the hotfix changed

  - A caller counts as supplying a member when its text names it, or when
    it calls `makeAcceptanceGateDeps` and the helper's text names it
    (`DEPS_HELPER`, read once per step).

  ## What the coder does (all of it)

  1. Run qa_e2e_procedure step 1 once, in your worktree, its output saved
     to tmp/out.txt.
  2. Read `git show cbca1b5edb` against the sections above and the
     invariant.
  3. Write backlog/evidence/BL-2001-coder-<date>.md: the result and one
     line saying whether the hotfix matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

