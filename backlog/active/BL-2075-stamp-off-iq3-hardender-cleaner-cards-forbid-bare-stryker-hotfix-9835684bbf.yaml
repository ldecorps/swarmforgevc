description: |
  ## Status: hotfix 9835684bbf landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  The iq3 hardender on BL-2073 ran the default stryker.config.json (mutate
  out/**/*.js, concurrency 1) and saw ~70k mutants / hundreds of hours of
  ETA. Local seats load only the compact role card, not hardender.prompt's
  scoped-run rules, so the trap repeats on every TypeScript parcel. The
  same mutation wording was on the cleaner card; the architect could still
  burn the property lane checking invariants; QA still listed checks by
  hand instead of qa-gather.

  ## What the hotfix changed

  9835684bbf, four local-model role cards only:
  - swarmforge/roles/local-model/hardender.note: forbids bare `npm run
    mutation` / default stryker.config.json; names the scoped shape
    (stryker.blXXXX.config.json mutating only the parcel's changed out/...js,
    concurrency 8+, coverageAnalysis perTest; vitest.blXXXX.stryker.config.mjs
    include: only the covering unit test(s), shape vitest.bl1911.stryker.config.mjs;
    never edit vitest.config.mjs excludes; from extension/ `npx stryker run
    stryker.blXXXX.config.json`; thousands of tests or hours of ETA: stop,
    fix scope; kill survivors).
  - swarmforge/roles/local-model/cleaner.note: the same scoped-Stryker
    wording plus before-forward `npm run compile` then
    `node extension/out/tools/mutation-site-count.js <changed-file>...`
    (count-only; over 100 is a soft split candidate, not a block).
  - swarmforge/roles/local-model/architect.note: never run
    `npm run test:properties` (lane is ~15 min; runs at coder and QA); never
    Stryker; `npm test` only when own commits touch extension/src or
    extension/test.
  - swarmforge/roles/local-model/QA.note: run the mechanical checklist
    through `node extension/out/tools/qa-gather.js --ticket <BL-id> --task
    <task-name>` from the worktree root (BL-1554); it gathers and reports
    ONLY - a green report is not an approval.

  ## What the coder does (all of it)

  1. Read `git show 9835684bbf` against the section above. Confirm each of
     the four cards carries the hotfix's wording verbatim (grep each phrase
     against the card) and that no card still names bare `npm run mutation`
     / default stryker.config.json as the run shape.
  2. Run the feature in qa_e2e_procedure step 1 once, output under tmp/.
     Record the pre-existing BL-1554 property_runners failure (see the
     NOTE there) in the evidence.
  3. Write backlog/evidence/BL-2075-coder-<date>.md with the review result
     and the run results, and commit it.

assigned_to: coder
