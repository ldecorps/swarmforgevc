id: BL-1436
title: "PRICING_TABLE has no entry for claude-fable-5-1, the model the full-forge specifier seat has run since 2026-09-04, so BL-627's coverage test is red and every turn of that seat is costed at nothing in the ledger and the briefing; the register row for the red named BL-1212 (which only cites the file as an example) and reads unowned now that BL-1212 landed; the table prices the model at its published rates with the source recorded, the display-name map names it, and the row leaves with the green"
