id: BL-1636
title: "A step handler never leaks its temp root: 583 of the 1191 acceptance handlers call mkdtempSync and 455 of them never register the root for reaping (295 have no removal at all, 160 remove only on the happy path), so the host's temp directory holds 695,941 entries of which 686,946 are leaked bl-prefixed handler roots, about 48,000 new ones a day, and every one of the 35 code paths that list os.tmpdir() pays 2.6 s per listing - six of them at every step-registry load; the cleaner fixed the fifth such leak by hand this session (BL-831) and asked for a census gate; a standing unit-lane guard refuses any handler that creates a root without registering it (a committed census of today's offenders that may only shrink), the fixture reaper gains a one-line tracked-root helper, and an age-floored reap removes dead roots"
