description: |
  ## Status: hotfix eb5fc34a08 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  /gpu was live in the Control topic and absent from /help, so the command
  list did not say it existed, how long it lasts, or that it is not the
  intake pause.

  ## What landed

  Host /help now has one line under /pause and /resume: /gpu is
  Control-topic only, offers 30 min, 1 hr, or 2 hr, clears with /gpu off,
  does not freeze intake, and babysitter does not treat the stop as a
  stall. The Host operator how-to says the same.
