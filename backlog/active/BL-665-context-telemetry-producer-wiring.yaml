description: |
  ## The class

  This is the recorded SYSTEMIC class (epic runtime-wiring-slice rule,
  BL-298/BL-419 shape): the capture epic shipped every layer except the one
  that PRODUCES. The dashboard has honestly displayed an empty store for
  four days.

  ## The fix

  Wire the producer as a deterministic transcript walker pass — the BL-664
  lib, not a new parser: role transcripts already carry per-invocation
  token counts, model, and timestamps. The producer walks the transcripts
  on a schedule (handoffd tick or an ancillary timer — coder's call, but it
  must run unattended), derives context-usage events per agent, and calls
  the existing `context_telemetry_cli.bb record` path (or its lib function
  directly) so the GH-22 store fills through its own shipped write path.

  Backfill on first run is in scope (the walker is retroactive); the
  idempotence invariant above is what makes backfill + steady-state safe to
  run from any point. Dashboard (GH-23) needs no change — it starts showing
  data the moment the store fills.

  Acceptance signal: after one producer run on this host, `summary`/`agents`
  return non-empty output naming real roles, and the dashboard's "No
  telemetry recorded yet" state is gone; running the producer twice over
  the same window leaves the record count unchanged.

