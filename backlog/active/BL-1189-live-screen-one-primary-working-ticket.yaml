description: |
  ## What

  Live Screen (`/resident-spy`) can paint the same BL as primary working on
  several role tiles at once — not trustworthy "who is doing what."

  Evidence (2026-08-27): BL-600 on Coordinator, Cleaner, Architect, and
  Documenter simultaneously while bookkeep-closed on main.

  ## How (direction, not mandate)

  1. One working seat (default): at most one tile shows a BL as primary working.
  2. No post-close ghosts within one capture TTL.
  3. Stale residue is queued/residual, not equal "working now."
  4. Prefer pane truth when claims disagree.

qa_e2e_procedure: >
  (1) Active ticket at one role — exactly one tile shows it as primary working.
  (2) Bookkeep-close — no tile shows it within one TTL. (3) BL-600-style cascade
  — no persistent multi-seat ghosts. (4) Batch cleaner — oldest + count on
  cleaner only.

