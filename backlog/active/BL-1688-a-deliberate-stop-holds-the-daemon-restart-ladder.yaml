id: BL-1688
title: "start_handoff_daemon.sh (the one start owner, BL-690/BL-1492) erases every deliberate-stop signal on every invocation - freshness_clear_stopped handoffd (line 54), rm -f daemon/stop (line 91) and a rewrite of handoffd.status.json without its restart_history (lines 93-95) - whoever calls it: after the 2026-09-21 closing ceremony stopped the swarm at 16:35:28Z (kill_all_swarm cleared .swarmforge/tmux-socket at 16:35:34Z, marker written) the restart-in-place ladder invoked it 334 times in 44 minutes (16:35:35Z-17:19:36Z, caller=build_freshness_cli, two invocations per ~15 s), every attempt crashing handoffd's -main on the missing socket (java.io.FileNotFoundException, handoffd.bb:5439) and leaving a failure report, a rotated log and a restart alarm, while BL-1492's two-per-600 s budget never tripped because no report ever carried more than one restart_history entry; a heal-path start refuses while the marker stands, only a launch that names itself deliberate clears the signals, the budget's ledger survives every writer of the status file, and a missing tmux socket is a supervisor skip and a daemon refusal, never a dead verdict retried"
