description: |
  ## What is wrong

  `extension/test/bl1474ReplayCommitRefusalReasonInvariants.property.test.js`
  line 30: `replayCommitRefusalReason()` runs `spawnSync('bb', ['-e',
  ...(load-file land_step_lib.bb)...])` for EVERY property draw - `fc.assert(...,
  { numRuns: 40 })` at line 109 - so each draw pays a bb start plus the
  full load of `land_step_lib.bb` and the libs it loads. Alone the file
  passes in 6.6-8.2 s (specifier on main, 2026-09-20: 8.2 s, one test);
  in a full `npm run test:properties` under the lane's fork pool it
  crossed the config's 20 000 ms `testTimeout`: `Test timed out in 20000ms
  on property (invariant 1): nothing to commit is reported only when the
  index is empty, whatever stderr says` (coder@2 evidence
  `backlog/evidence/unowned-red-bl1459-bl1474-property-lane-20260920.md`,
  green in isolation). The function under test is pure (no git calls, as
  the file's own header says); forty process starts are the whole cost.

  ## What is wanted

  - The draws are evaluated by ONE bb invocation per test: sample the
    arbitraries (`fc.sample`, the same count and shapes), pass the array
    as JSON on stdin, have bb map
    `land-step-lib/replay-commit-refusal-reason` over it and print the
    reasons, then assert per draw in JS exactly as today; the
    reachability floor asserts over the sampled draws.
  - The file runs in under one second alone; in-suite it stays far
    inside the 20 s timeout.
  - Register row for the file (lane property, owner BL-1663, added at
    mint) leaves in this parcel's land (BL-1631).

  ## How (direction, not mandate)

  - `const draws = fc.sample(inputArb, 40)`; one `spawnSync('bb', ...)`
    with `(mapv (fn [i] (replay-commit-refusal-reason ...)) inputs)`; keep
    a fixed seed out of it - the sample varies per run as today. If
    shrinking matters more than the process count, a long-lived bb child
    fed one JSON line per draw is the alternative; either keeps the real
    function under test.

constraints: >
  No change to land_step_lib.bb or to BL-1474's feature. The file stays
  in the property lane's allowlist as it is. The bb invocation loads the
  real library, never a copied function.

out_of_scope: |
  - Other property files that spawn bb per draw: none sighted red; the
    census `grep -l "spawnSync('bb'" extension/test/*.property.test.js`
    is the follow-up's starting point when one is.

qa_e2e_procedure: >
  (1) `cd extension && npx vitest run --config vitest.properties.config.mjs
  test/bl1474ReplayCommitRefusalReasonInvariants.property.test.js` ONCE on
  the parcel commit: passed, duration row under 1 s recorded. (2)
  `grep -c "spawnSync('bb'" extension/test/bl1474ReplayCommitRefusalReasonInvariants.property.test.js`
  is 1 and it sits outside the property callback. Never "run it N
  times".

