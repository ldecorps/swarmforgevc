source: |
  BL-590 post-mortem, 2026-07-25.

  ## CORRECTED PREMISE — read this before designing anything

  This ticket was originally filed claiming "no rework signal has ever been
  persisted." **That is wrong.** A closer look found a durable bounce log that
  already exists, is already backfilled, and is already reported:

  - **`.swarmforge/qa_bounces/2026-07.jsonl`** (BL-454) — **53 records**,
    **2026-07-10 to 2026-07-25**, fields `at`, `ticket`, `commit`,
    `producingRole`, `ticketType`, `failureClass`. Fed by
    `record-qa-bounce.js` go-forward writes plus `backfill-qa-bounces.js`'s
    one-time seed from the evidence corpus — so history was already recovered.
  - **`:qa-bounce-line`** is already an optional section in the briefing EMAIL
    (`swarmforge/scripts/briefing_email_lib.bb:130`, key listed at `:139`):
    which role's work bounces most from QA, plus a per-ticket-type breakdown.

  So the swarm does measure rework. What it measures is the wrong half.

  ## The real gap: only QA bounces are recorded

  `record-qa-bounce.js` is invoked from exactly one place — `QA.prompt:168`.
  **The architect never calls it.** And the architect is where the repeated-bounce
  pattern actually lives:

  ```
  BL-590   4 architect SEND BACKs (#1-#4)   -> bounce_count: ABSENT
  BL-606   3 architect SEND BACKs           -> bounce_count: ABSENT
  ```

  `bounce_count` (BL-608) is present on **exactly one** ticket in the whole
  backlog — BL-608's own. Its writer is QA-only, so the field is effectively dark
  on live tickets. Classic [[epic-runtime-wiring-slice-rule]] shape.

  And what the QA log DOES show makes the point sharply. Over 53 records:

  ```
  producingRole  coder 44, documenter 7, hardender 1, architect 1
  failureClass   behavior 37, unit 6, acceptance 6, integration 4
  tickets with >1 QA bounce:  BL-441 only (2)
  ```

  **One ticket out of ~52 was QA-bounced more than once in 15 days.** Repeated
  bouncing is essentially absent from the measured class and concentrated in the
  unmeasured one. Any conclusion drawn from the QA log alone would have said
  "repeat bouncing does not happen here" — the exact opposite of BL-590.

  ## Discredited source — do not fall back to it

  Commit subjects. The `SEND BACK #N` convention only starts **2026-07-23**, and
  a naive `BL-\d+.*bounce` count is contaminated two independent ways:

  1. **Title contamination.** `BL-115-bounce-watcher-resilience` and
     BL-025/026/027 (the bounce *commands*) rank top. A first pass put BL-115
     first with 26 "bounces"; it was never bounced once.
  2. **Propagation contamination.** One bounce produces five to six commits as
     its fix travels coder -> cleaner -> architect -> hardener, each merge subject
     repeating "bounce fix". BL-509 scored 6 by this method; its real count is
     **one**, and that one was merge damage, not a spec defect.

  Both modes inflate. Neither is fixable by a better regex. The log is the source.

  Briefing markdown discusses bounces at length and well, but it is prose written
  from live state at briefing time — human-readable, not aggregatable.

description: |
  ## Shape: `record-qa-bounce` becomes `record-bounce --by <role>`

  Operator ruling 2026-07-25 (a restatement of an earlier conversation): the tool
  should not be QA's. It should take the BOUNCING role as a parameter, so any
  reviewing stage records its own send-backs the way QA already does.

  This is far cheaper than it looks, because the design already anticipated it:

  - **The schema already has the field.** `backlog-schema.md:33` defines
    `bounce_history` entries with **`by` (bouncing role)** distinct from
    **`blamed` (role held responsible)**. No schema change needed.
  - **The CLI already accepts the flag.** `record-qa-bounce.ts:26` documents
    `[--by <bouncingRole>]`, written through at `:57 by: args.by` next to
    `:58 blamed: args.producingRole`.

  So the plumbing is complete and unused. What is actually wrong:

  1. **`--by` is OPTIONAL.** All 53 records in the live log lack it — their keys
     are `at, commit, failureClass, producingRole, ticket, ticketType`, no `by`.
     So even QA's own bounces do not record who bounced them. Make it required.
  2. **Only `QA.prompt:168` invokes it.** Every reviewing stage that can send
     work back must call it — architect above all, but cleaner, hardener,
     documenter and the specifier (on a spec-defect bounce) all can.
  3. **The name and the log path say QA.** `.swarmforge/qa_bounces/<YYYY-MM>.jsonl`.
     Generalise both, and **keep reading the old path** so the 53 existing records
     and `backfill-qa-bounces.js`'s evidence-corpus seed are not orphaned — that
     backfill is the only pre-2026-07-10 history that exists.

  Consumers to update once `by` is populated: `:qa-bounce-line` in
  `briefing_email_lib.bb:130` currently answers "whose work bounces most from
  QA"; with `by` it can answer "who bounces, and whose work" — and the
  QA-only framing in its name and copy becomes wrong.

  ## Then, and only then, the trend series

  `flowBalance` is the natural home for the aggregate:
  `extension/src/notify/costHealthSidecar.ts:96` (type), `:325-327` (daily
  series), `:461 renderFlowBalanceLine` (markdown). It already renders
  `specced N/day, closed N/day` with trend arrows.

  Specifier picks the metric. Two candidates answering different questions:

  - **bounces/day** — cheap, matches the existing per-day shape, but rises with
    throughput and cannot distinguish "busier" from "worse".
  - **mean rounds per closed ticket** — normalised, and the one that answers the
    operator's actual question.

  Recommend the second as headline with the first supporting, **split by `by`**
  so architect send-backs and QA bounces are never pooled into one number. The
  53-record analysis is the proof this matters: pooled, the QA data says
  "repeat bouncing does not happen here" (1 ticket of ~52 in 15 days), which is
  the opposite of the truth for architect send-backs.

  A 4-send-back ticket like BL-590 must stay distinguishable from four separate
  once-bounced tickets. An average alone hides exactly the shape being hunted —
  carry a max or a count-above-threshold beside it.

  ## Data honesty

  The QA half has real history: 53 records from 2026-07-10, including
  `backfill-qa-bounces.js`'s one-time seed from the evidence corpus. **Preserve
  it** — a rename that orphans the old log path throws away the only history
  there is.

  The architect half **starts empty and fills forward.** No architect send-back
  has ever been recorded, so there is nothing to recover, and the series must show
  that honestly: a `by`-split metric will read "architect: 0" for every day before
  this ships, which is ABSENCE OF DATA, not absence of bounces. It must not be
  renderable as a flat healthy line — BL-590 alone contributed four on
  2026-07-25 and none of them are in any log.

  The 31 briefing markdown files DO discuss past bounces in prose, and it will be
  tempting to mine them for a retro architect series. **Do not.** A number
  reconstructed from narrative is a fabricated measurement, indistinguishable
  from a measured one once it is in the JSON. A gap is honest; an invented point
  is not.

  ## Why this is priced above BL-633 and BL-634

  It is the cheapest of the three (`mutation_cost: low` — one metric into an
  existing pipeline) AND it is what makes the other two falsifiable. Land the
  process changes first and there will be no before-picture to compare against.

  ## RETYPED feature -> defect, high (operator directive 2026-07-25: "il faut expediter")

  Not a reclassification of convenience. `record-qa-bounce.js` is invoked from exactly
  one place, `QA.prompt`, so ARCHITECT send-backs — where repeated bouncing actually
  happens — are recorded nowhere, and `bounce_count` is present on exactly ONE ticket
  in the whole backlog: BL-608's own.

  A measurement mechanism that silently covers half its domain while reporting the
  other half as complete is BROKEN, not missing. Reading the QA log alone concludes
  "repeat bouncing does not happen here" (1 ticket of ~52 in 15 days) — the exact
  opposite of the truth for architect send-backs, which reached six on one ticket the
  day this was filed.

  `severity: high` because this is the INSTRUMENT. Without it there is no way to tell
  whether BL-633 and BL-634 reduced the 21.8% rework rate, so the whole spec-quality
  initiative ships on faith. Fixing the ruler comes before trusting the measurements.

acceptance: specs/features/BL-635-record-bounce-by-role-and-rework-metric.feature

spec_notes: |
  Specced 2026-07-25 by specifier. The feature file translates the approved
  minimum-behaviour list 1:1; `human_approval` stays `approved` because the
  operator approved that list verbatim and directed expedition ("il faut
  expediter") — a second review round on a faithful translation would block
  the expedite lane. Criterion -> scenario map (record-bounce-by-role-NN):
  1 -> 01, 2 -> 04+05, 3 -> 02 (+03 unknown-role, same fail-closed intent),
  4 -> 06, 5 -> 08, 6 -> 09, 7 -> 10, 8 -> 11, 9 -> 12, 10 -> 13;
  generalised write path -> 07; bounce-line consumer copy -> 14.

  Decisions delegated to the specifier, resolved:
  - Headline metric: mean rework rounds per closed ticket, defined as
    by-attributed bounce records in the window / tickets closed in the same
    window; bounces/day supporting; both split by `by`; a max-rounds
    indicator { ticket, rounds, by } beside the mean (acceptance 8).
  - Generalised CLI name `record-bounce`; new records write to
    `.swarmforge/bounces/<YYYY-MM>.jsonl`; readers merge the legacy
    `.swarmforge/qa_bounces/` path read-only forever (53 records + the
    backfill seed stay live).
  - The JSONL record itself gains the `by` field — today QA passes `--by`
    but only the ticket-YAML merge receives it; the log record must too.
  - Sidecar contract: `flowBalance.rework.roundsPerClose` (field name is
    load-bearing — required_wiring greps it), plus `bouncesPerDay` and
    `maxRounds`.
  - Valid `by` set: specifier|coder|cleaner|architect|hardender|documenter|QA
    (canonical repo spelling `hardender`); an unknown value fails loudly —
    a typo'd bouncer would silently fragment the split.
  - Recording epoch for the by-attributed series: a declared constant date
    set at implementation time; pre-epoch renders unavailable, never 0.
  - `--evidence` stays optional at the CLI (BL-608's best-effort ticket
    merge is unchanged and out of scope); every prompt invocation passes it.

  e2e QA procedure (live verification, no pollution of the real log):
  1. In a scratch dir with a `.swarmforge/` skeleton and one active-ticket
     fixture, run the real compiled CLI: `node extension/out/tools/
     record-bounce.js --ticket <id> --role coder --type defect --class
     behavior --commit <10-hex> --by architect --evidence <path>`; confirm
     the record (with `by`) lands in `.swarmforge/bounces/<month>.jsonl` and
     the fixture YAML gains `bounce_history` + `bounce_count: 1`.
  2. Re-run without `--by`: usage error, nothing written anywhere.
  3. Point the reader at a COPY of the real `.swarmforge/qa_bounces/
     2026-07.jsonl`: all 53 legacy records read and tally as unattributed.
  4. Generate the sidecar + markdown briefing over that data: flow-balance
     line shows the rework figure with a trend arrow, split by role, and the
     pre-epoch architect period renders unavailable, not zero.
  5. `grep -- '--by architect' swarmforge/roles/architect.prompt` and
     `grep record-bounce.js swarmforge/roles/QA.prompt` both hit.

out_of_scope: |
  - Reconstructing history from briefing markdown. See the data-honesty section;
    this is a hard no, not a scope trim.
  - Attributing a bounce to a cause (missing invariant vs. merge damage vs.
    pipeline mechanics). The 2026-07-25 post-mortem showed these are genuinely
    distinct classes, and classifying them is LLM judgement, not a metric. Worth
    its own ticket later, once there is a series to classify.
  - Changing how bounces are recorded. BL-608 shipped that and it works.
  - Alerting or thresholds on the new metric. Report first; act once there is
    enough series to know what normal looks like.

notes: |
  Part three of a three-ticket initiative from the 2026-07-25 BL-590
  post-mortem — BL-633 (state the invariant), BL-634 (cap the slice size), this
  one (measure whether either helped). It is the measurement arm: without it the
  other two ship on faith.

  Once ~2 weeks of series exist, the operator's original question — "has that
  happened often?" — becomes a query instead of an investigation. Note the
  answer may well be that BL-590 was an outlier and BL-633/BL-634 were solving a
  rare problem; that is a legitimate finding and the metric must be able to
  deliver it.
