approval_context: >
  Feature file written 2026-08-23 and awaiting the review the original
  approval_context reserved. It carries one material change you should decide
  on with the same tap. The ticket was minted on the premise that a Cursor
  seat needs an ACP or SDK host process behind ensure and poke/wake, and so
  must wait for the BL-713 spike. That premise does not hold: cursor-agent is
  a terminal-native agent CLI already on PATH here, taking --workspace,
  --force/--yolo, --trust, --add-dir, --model and an initial prompt argument
  - the same shape the launcher already drives for vibe, gemini and grok. A
  Cursor seat is an ordinary tmux-resident pane agent, and architecture rule 1
  says the substrate stays tmux rather than a host-spawned process, so the ACP
  route would be the wrong one for the ordinary launch path even if it existed.
  Accordingly depends_on is proposed as empty and the slice is buildable now.
  Approve to build the launcher path on the terminal-agent CLI; Amend or
  Reject if you want BL-713 to land first and the ACP framing kept, in which
  case BL-1078 returns to paused until BL-713 is in done.

required_wiring:
  - 'swarmforge/scripts/swarmforge.sh::check_dependency cursor-agent::the launcher must check the real cursor binary for a cursor window line - a token accepted with no dependency check leaves a half-launched pack with an empty window instead of a loud refusal'
  - 'swarmforge/scripts/prompt_engine_lib.bb::"cursor"::the provider table must carry an entry keyed on cursor - without it normalize-agent falls back to claude and a cursor seat is woken with the wrong wake style while every check still reads green'
  - 'specs/pipeline/steps/index.js::bl1078::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler'

invariants:
  - "A Cursor seat reaches the swarm only through the same handoff helpers, mailbox and poke/wake path every other agent uses — never a private side channel."
  - "An uncertified Cursor identity remains refused on production packs unless an explicit spike-only escape is set; this slice does not silently certify."

description: |
  ## What is wrong

  Ordinary packs cannot staff a window with `cursor`. The launcher's agent
  allow-list in `swarmforge.sh` is `claude|codex|copilot|grok|aider|vibe|
  gemini`, so a window line naming `cursor` is refused at launch. Three more
  places would still not know the token even once the allow-list did: the
  backend-dependency check, the per-agent launch-command builder, and
  `prompt_engine_lib.bb`'s provider table, whose `normalize-agent` silently
  falls back to `claude` for any unknown agent — so a Cursor seat would be
  woken with the wrong wake style while every check reads green.

  ## How (direction, not mandate)

  Make `cursor` a first-class agent token in those four places. `cursor-agent`
  is a terminal-native agent CLI in the same family as `vibe`, `gemini` and
  `grok`: `--workspace <dir>`, `--force`/`--yolo`, `--trust`, `--add-dir`,
  `--model`, and an initial prompt argument. The launch body therefore takes
  the shape the existing `vibe` case already has, and the seat lives in a tmux
  pane like every other agent — no host process spawned outside the substrate.

  Admitting a Cursor identity onto a pack needs a deliberate escape until
  BL-1079 lands steward certification: an uncertified identity is refused, and
  the refusal names the escape that would admit it (the existing
  `SWARMFORGE_ALLOW_FULL_PACK` / `swarm_launch_pack_guard.bb` shape is the
  precedent, not a mandate).

  ## Premise correction (2026-08-23, specifier)

  The ticket as minted said ensure and poke/wake need "the ACP or SDK host
  process that backs a Cursor seat, reusing the seat driver BL-713 landed".
  Verified against the live integration layer: `cursor-agent` is on PATH and
  is a terminal agent, and no ACP/SDK host is needed for a pane seat. Wake
  already goes through the shared `agent_runtime_inject.bb` notify path for
  every agent; what is missing is the provider-table entry, not a host
  process. `depends_on: [BL-713]` is dropped on that basis — the human
  answered the question `approval_context` poses on 2026-08-23 (see `notes`).

  Not in this slice: steward certify (BL-1079); pack lines and how-tos
  (BL-1080); changing /pilot.

qa_e2e_procedure: >
  1. On a host with cursor-agent on PATH, write a two-window pack conf naming
     documenter with agent cursor, launch it, and confirm the window opens
     with cursor-agent running in the documenter worktree and the role prompt
     bundle loaded - not an empty pane and not a refusal.
  2. Send that seat a real parcel with swarm_handoff.sh from another role and
     confirm the wake lands, the seat runs ready_for_next.sh, and its handoff
     leaves through swarm_handoff.sh into the next role mailbox. Nothing may
     reach the swarm outside the mailbox (invariant 1) - check the receiving
     role got it by the ordinary queue, not by a side channel.
  3. Temporarily rename cursor-agent off PATH and relaunch: the pack must be
     refused before any window opens, naming the missing binary.
  4. Unset the uncertified-cursor escape and launch the same pack: refused,
     with the refusal naming the escape (invariant 2). Set the escape and
     relaunch: admitted, and the run records that the identity was uncertified.
  5. Confirm a bogus agent token is still refused with the unchanged
     allow-list message, so the token was widened and not the check loosened.

