description: |
  ## What
  The local qwen seat (BL-1235, `extension/src/tools/localQwenSeatLive.ts`)
  answers Telegram questions through ollama's `/api/generate` with the
  inbound text as `prompt` and no system prompt, so it answers as a
  generic assistant with no idea what SwarmForge is. This ticket gives it
  a project briefing: `docs/reference/local-model-briefing.md` under the
  target path, read once per turn and sent as ollama's own per-call
  `system` field, kept separate from `prompt` so the operator's text is
  never prefixed.

  The operator drafted this on the shared master checkout on 2026-09-21
  (14:42-15:19 local, uncommitted): `readLocalSeatSystemPrompt(targetPath)`
  (returns the trimmed file text or undefined - a missing briefing is a
  working state, matching `readQwenLocalTopicId`), `completeWithLocalModel`
  gaining an optional `system` parameter that `JSON.stringify` drops when
  undefined, `runLocalSeatTurn` threading it through the `complete` seam,
  five unit tests in `extension/test/bl1235LocalQwenSeatLive.test.js`,
  and the 45-line briefing itself. Captured verbatim:
  `backlog/evidence/BL-1682-operator-draft-local-seat-briefing-20260921.patch`
  (`git apply` it in the coder worktree as the starting point).

  ## Why
  Human ruling 2026-09-21 in the specifier's question channel: "Mint a
  ticket for it". The seat is the operator's side channel for questions
  about this project; without context it is useless for that. The draft
  is real feature code that no worktree or ticket claimed, and the shared
  checkout is not a place code lands from (Article 1.2/4.2) - the chain
  reviews it as a parcel.

  ## How (direction, not mandate)
  - Apply the patch in the coder worktree; keep the seam shape (a fifth
    positional `system` argument on `complete`) unless the cleaner prefers
    an options object - the unit tests in the patch assert the observable
    body, not the signature.
  - The feature's handler drives `runLocalSeatTurn` with a fake `complete`
    (and a fake `readEndpoint` holding the seat's model - pin `modelId`,
    BL-1680) against a mkdtemp target: briefing present -> `system` equals
    the file text and `prompt` is exactly the inbound text; absent or
    whitespace-only -> the completion call carries no system value.
  - `docs/reference/local-model-briefing.md` lands with the parcel as the
    operator wrote it; the documenter checks its facts against
    `local-engineering.prompt` and the roles list and adds a short
    "briefing file" section to the local-seat how-to (BL-1235's page).

  ## Scope
  - `extension/src/tools/localQwenSeatLive.ts`,
    `extension/test/bl1235LocalQwenSeatLive.test.js` (from the patch).
  - `docs/reference/local-model-briefing.md` (new, from the patch);
    the local-seat how-to (documenter).
  - `specs/features/BL-1682-the-local-seat-sends-the-project-briefing-as-its-system-prompt.feature`
    and `specs/pipeline/steps/bl1682LocalSeatBriefingSystemPromptSteps.js`
    (same parcel, BL-233, registered in `specs/pipeline/steps/index.js`).
  - Nothing else: no change to the resolver, the endpoint probe, the
    topic map or the front desk.

qa_e2e_procedure: |
  On the parcel commit, ONE run each.
  1. `cd extension && npx vitest run test/bl1235LocalQwenSeatLive.test.js`:
     green, including the five briefing tests from the patch.
  2. `node specs/pipeline/cli.js specs/features/BL-1682-the-local-seat-sends-the-project-briefing-as-its-system-prompt.feature`:
     all ok.
  3. `git show <parcel>:docs/reference/local-model-briefing.md | head -3`
     prints the operator's heading; the how-to names the file.
  4. Live (optional, operator): with the briefing on disk, one message in
     the local seat topic answers about SwarmForge rather than generically.

