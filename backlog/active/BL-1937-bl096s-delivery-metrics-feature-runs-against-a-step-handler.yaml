description: |
  ## What is wrong

  `specs/features/BL-096-velocity-burndown-metrics.feature` has eight
  scenarios and no step handler. BL-111 wrote it as a living feature file
  on 2026-07-09, BL-096 closed without a binding, and no handler for any of
  its 31 step lines has ever existed (`git log -S` over specs/pipeline/ finds
  none). Run, it fails 8/8 with "no step handler matched", deterministically.
  QA ran it on 2026-10-03 while re-checking diagram-reading features for
  BL-1861 and held that parcel on it.

  The behaviour it describes is live:
  - `extension/src/metrics/deliveryMetrics.ts` exports `computeVelocity`,
    `computeBurndown`, `computeCycleTime`, `computeForecasts`,
    `computeSuiteDurationTrend` and `computeDeliveryMetrics`;
  - the bridge serves it on `/metrics` (`bridgeServer.ts`, the route near
    line 2149);
  - `extension/src/tools/swarm-metrics.ts` is the CLI over the same
    `computeDeliveryMetrics`.

  ## What is wanted

  A step handler, `specs/pipeline/steps/bl096VelocityBurndownMetricsSteps.js`,
  that binds every step of the feature as written, so the feature passes
  8/8 against the shipped code.

  ## How (direction, not mandate)

  - Drive the compiled modules in-process (`extension/out/...`), the way
    sibling handlers do. Feed the pure functions a fake history where the
    module accepts one. Where a scenario needs real git (metrics-01's "git
    records", metrics-05's "no file created or modified"), build the repo
    under mkdtemp and prove it with `rev-parse --git-common-dir` before any
    mutating git command.
  - metrics-09's endpoint: reuse the bridge-server test seam an existing
    bearer-token handler uses (e.g. `deviceRegistrySteps.js`) rather than
    binding a port by hand.
  - BL-096's step texts are generic ("When the metrics surface is
    queried"). Register them with `defineScoped` under BL-096's `Feature:`
    name, so they never answer another feature's steps (BL-1277). The
    collision guard in the unit lane must stay green.
  - If a scenario fails on its merits once bound, that is a real defect in
    shipped behaviour. Send the specifier a note naming the scenario and
    the observed value. Never edit the scenario to pass.

