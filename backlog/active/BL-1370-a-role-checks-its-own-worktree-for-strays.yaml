invariants:
  - "Scope comes from the ONE shared classifier (process_table_lib's project-scoped-process?, BL-887), and that classifier matches only at a path-component boundary (AMENDED 2026-09-05): a prefix-sibling root (.worktrees/coder-cursor2 beside .worktrees/coder, /repo-2 beside /repo) is never mine, another worktree's legitimate run is never reported and never killed, and this tool never grows a second notion of what is mine."
  - "Reaping is by process group, never by pid - an orphaned run reparents to the OS and its children outlive a bare pid kill."
  - "A stray found is a refusal, not a warning: the check exits non-zero, so a pass cannot be approved with test or mutation processes still alive."

