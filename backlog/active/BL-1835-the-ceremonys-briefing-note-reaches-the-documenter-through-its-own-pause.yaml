source: |
  Root intake `backlog/INTAKE-pretty-documenter-shift-briefings-20260930.md`
  (also `.swarmforge/operator/INTAKE-pretty-documenter-shift-briefings-20260930.md`),
  the human via Let's Talk, 2026-09-30 ~10:47 BST; drained by the
