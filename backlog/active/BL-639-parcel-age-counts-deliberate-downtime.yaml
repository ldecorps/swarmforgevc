source: |
  Measured, 2026-07-25. The swarm was stopped deliberately at **12:06:02Z** and
  restarted at **14:09:25Z** (a 2h03m planned outage, for offline work). `handoffd`
  came back, swept, and fired three ESCALATE flow-stalls in the same second:

  ```
                                   reported age   actually stalled while LIVE
  architect -> specifier (rule_proposal)  2h43m            40 min
  coder -> cleaner (git_handoff)          2h07m             4 min
  coordinator -> self (note)              2h04m             1 min
  ```

  Two of the three were **created minutes before the stop** and had never stalled.
  All three reported ages that are essentially the outage length.

  Only the first is a genuine stall — and it is already ticketed as BL-636
  (rotation preference ignores parcel priority), so the alarm that mattered arrived
  buried between two that did not.

description: |
  ## Cause, and it is one line

  `flow_watchdog_lib.bb:89 parcel-age-ms`:

  ```clojure
  (- now-ms age-source)     ; age-source = enqueued_at, else created_at
  ```

  Pure wall-clock. The watchdog has no notion of whether anything was *running*
  during that span, so a planned outage counts fully against every parcel in flight.

  `decide-tier` then behaves exactly as designed: past `escalate-ms`, escalate. The
  defect is in the age, not the decision — worth stating because `decide-tier` is
  deliberately structurally suppression-free (its own `tier-decision-input-keys` set
  documents that guarantee) and **must not** grow a branch for this.

  ## Why it matters more than the noise

  The escalation channel is the operator's phone. After any planned stop, every
  in-flight parcel alarms at once, and the alarms are indistinguishable from real
  ones. This session's storm buried the one genuine finding between two parcels
  aged one and four minutes.

  That trains the operator to ignore the channel — which is the actual damage. A
  watchdog whose alarms are usually noise is worse than no watchdog, because the
  absent one does not consume attention or teach dismissal.

  ## Shape — and there is a trap in the obvious fix

  **Obvious fix:** clamp the age to daemon uptime, `min(wall-clock age, now - daemon-start)`.

  **Why that is wrong on its own:** it credits *every* restart, including a crash.
  A handoffd that crash-loops would reset every parcel's age on each restart and
  **mask a genuine stall indefinitely** — turning a noise defect into a silence
  defect, which is strictly worse. That trade must not be made accidentally.

  **Recommended shape: credit only RECORDED CLEAN downtime.** A clean stop already
  leaves a durable, timestamped record:

  ```
  .swarmforge/daemon/kill-all-audit.log
    2026-07-25T12:06:08Z kill_all_swarm SUCCESS — clean slate
  .swarmforge/daemon/postmortem-20260725T120608Z.log
  ```

  A crash writes neither. So on boot, `handoffd` can read the last
  `kill_all_swarm SUCCESS` timestamp and, when it postdates the last recorded tick,
  treat `[stop, boot]` as credited downtime subtracted from every parcel's age.
  A crash gets **no** credit and still alarms — which is correct, because a crash IS
  an outage worth alarming about.

  Note `handoffd.status.json` currently carries only `{state, updated_at}` and is
  rewritten each tick, so there is no start time to read. The specifier will need
  either a `started_at` there or the audit-log read above; the audit log is
  preferable because it distinguishes clean from crashed, which uptime alone cannot.

  ## Explicitly not the answer

  - **`snoozed?`** already exists as the one visible mute in the durable state file.
    It is per-parcel and requires an action per parcel; it does not address a
    restart-wide storm, and reaching for it here would make snoozing routine.
  - **Raising `escalate-ms`.** Hides real stalls to quiet a bookkeeping artefact.
  - **Suppressing alarms for N minutes after boot.** A blanket post-boot mute would
    hide a parcel that genuinely stalled for hours before the stop — exactly the one
    case in this incident that deserved the alarm.

acceptance: specs/features/BL-639-parcel-age-counts-deliberate-downtime.feature
out_of_scope: |
  - The genuine stall this storm buried. That is BL-636 (rotation preference ignores
    parcel priority).
  - Changing `warn-ms` / `escalate-ms` defaults.
  - The `snoozed?` mechanism.
  - Making the teardown's own reporting honest — BL-637.

notes: |
  ## SUPERSEDED — do not build. Specifier verification, 2026-08-19.

  This ticket's invariant is already satisfied on main by landed work, and
  building it now would add a second, competing age path. Recommending closure
  as superseded rather than routing it to the coder; the coordinator owns the
  bookkeeping.

  What was verified, in the live call order:

  1. `handoffd.bb:2019 flow-watchdog-sweep!` is the only live entry, and it
     calls `flow-watchdog-lib/run-sweep!`.
  2. `run-sweep!` computes each parcel's age via `evaluate-effective-age`
     (`flow_watchdog_lib.bb:409`) — wall age minus BL-823 availability-ledger
     intervals and provider-outage intervals, merged into one union so nothing
     is double-subtracted, clamped to [0, wall age], failing closed on an
     unparseable age source. `decide-tier` is handed that effective age, and
     is itself untouched — the structural no-suppression guarantee this ticket
     insisted on is preserved exactly as demanded.
  3. `availability_ledger_lib.bb/fold-intervals` emits `:class "swarm-stop"`,
     pairing a recorded stop with the NEXT recorded start — so a deliberate
     stop is credited.
  4. The crash case this ticket warned about is handled by construction, not by
     policy: credit comes only from a recorded interval, and a crash writes no
     stop event, so it yields no interval and no credit. An unpaired open stop
     is flagged `:unreconstructable?` rather than silently credited.
  5. The "cheapest honest partial" this ticket offered as a fallback slice also
     shipped: `format-alarm-text` appends `(active 40m of 2h43m wall)` and names
     each subtracted interval.
  6. BL-650 and BL-823 are both in `backlog/done/`.

  The delivered design is better-sourced than this ticket's own recommendation.
  This ticket proposed reading `kill-all-audit.log` for the last
  `kill_all_swarm SUCCESS`; BL-650 instead uses BL-823's durable availability
  ledger, which distinguishes clean from crashed the same way but is a
  purpose-built record rather than a log scrape.

  One loose end, noted not ticketed: `parcel-age-ms`
  (`flow_watchdog_lib.bb:301`) — the exact function this ticket names as "the
  cause, and it is one line" — now has ZERO call sites. It survives only in
  docstrings. That is dead code for the cleaner to remove in passing, not work
  worth its own parcel.

  ## Original notes

  Priced `severity: medium`: nothing is broken and no work is lost. The harm is
  attention, and it compounds — the operator who learns to swipe past ESCALATE will
  swipe past a real one. Filed the same day as BL-637 and BL-638, which are the same
  family: a signal that is technically correct and practically misleading.

  Cheapest honest partial, if the specifier wants to slice: report the credited
  downtime in the alarm text itself ("aged 2h43m, of which 2h03m planned downtime").
  That fixes the human-facing half immediately without touching the tier decision,
  and leaves the age arithmetic for a second slice.
