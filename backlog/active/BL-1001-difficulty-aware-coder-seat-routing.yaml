description: |
  ## What

  BL-983 delivers a stage-addressed parcel to whichever seat of that stage is
  idle, and is deliberately difficulty-blind - it says so in its own title.
  That was the right first slice, and this is the steering half it named.

  A ticket already carries a difficulty signal at mint: `mutation_cost`
  (`low` / `medium` / `high`). Each seat declares the hardest tier it may be
  handed. Seat selection then filters by tier first and falls back to
  BL-983's idle-first choice among the seats that remain eligible.

  ## The tier assignment (operator ruling, 2026-08-20)

  | Seat | Model | Declared tier | Gets |
  |---|---|---|---|
  | `coder` ("coder1") | claude-fable-5 | hard | `high`, `medium`, and `low` on spill-up |
  | `coder@sonnet2` ("coder2") | claude-sonnet-5 | easy-only | `low` only |

  ## Why asymmetric

  A ticket above a seat's tier never lands on it, however idle it is - it
  waits. That is the operator's "only use coder2 for easy tickets" read as
  written: spilling hard work down to the cheap seat re-creates the bounce
  risk the whole change exists to remove, so an idle cheap seat is not a
  reason to do it.

  The reverse is permitted: an easy ticket may go to a harder-tier seat when
  its own is busy. That wastes capability, which costs money rather than
  correctness, and keeps easy work flowing instead of queueing behind a busy
  cheap seat.

  ## How (direction, not mandate)

  Declare each seat's tier next to the thing that already varies per seat -
  the model, in the pack conf's `window` line (`swarmforge/packs/full-forge.conf`
  carries `--model claude-fable-5` / `--model claude-sonnet-5` today) - and
  read it wherever BL-983 reads the seat list. Any declaration site works so
  long as invariant 2 holds: nothing infers a tier from a seat's name, its
  model string, or its position in the list.

  Deliberately NOT a new delivery mechanism: this is a filter in front of
  BL-983's existing idle-first claim path, not a replacement for it.

  ## Scope

  - seat selection for a stage with more than one seat (BL-983's path)
  - a per-seat tier declaration and its reader
  - `specs/features/BL-1001-difficulty-aware-coder-seat-routing.feature` and
    its step handlers

  Explicitly NOT in scope: changing which model a seat runs, adding or
  removing seats, seat-level display on ops surfaces (BL-981
  `remaining_slices[1]`), and any difficulty signal other than
  `mutation_cost` - the field already exists and a second one would need
  reconciling with it.

notes: |
  **Reversal of BL-983's framing, recorded so the epic stays coherent.**
  BL-983's description names "a more capable coder (stronger model, e.g.
  Sonnet beside Fable)" and its approval_context reports the human's addendum
  as "a Sonnet coder beside a Fable coder ... load balancing by ticket
  difficulty toward the more capable seat". Read literally, that makes the
  SONNET seat the strong one. The operator's ruling of 2026-08-20 is the
  opposite: the Fable seat takes the hard work. BL-983 is in `backlog/done/`
  and is not being rewritten; this note is the correction of record. Anyone
  reading BL-983 for tier guidance should read this ticket instead.

  **Do not reach for coder-blamed bounce rate as evidence about either seat.**
  `full-forge.conf`'s own comment (2026-08-20) states the fable-5 bounce
  experiment is ABANDONED as of the second seat's addition: both seats' bounces
  post as `blamed:coder` (BL-983 invariant 3 - seat identity never escapes the
  mailbox layer), so the metric can no longer isolate a seat. Measuring whether
  this ticket helped needs seat-attributed bounces first, which nothing
  provides today - that is a real gap, and a candidate for its own slice rather
  than an assumption this ticket leans on.

  **IR-DRY status, reviewed not ignored.** The checker reports 10 findings on
  the feature file. One real drift was fixed (scenario 04's Then now uses the
  same wording as scenario 03). The remaining findings are all checker
  artifacts: Scenario-Outline placeholders compared against the concrete values
  of other scenarios, antonym pairs (`the hard seat is busy` vs `... is idle`)
  flagged as possible synonyms, and a negative assertion (`no seat holds it`)
  compared against positive ones. Collapsing any of them would merge distinct
  behaviours. Gherkin lint gate: clean.

qa_e2e_procedure: >
  From the repo root, against a live two-seat coder stage.

  1. Confirm the declaration is read, not inferred. With `coder` declared hard
     and `coder@sonnet2` easy-only, deliver a `mutation_cost: high` ticket to
     the coder stage with BOTH seats idle, and confirm the `coder` seat claims
     it and `coder@sonnet2` does not.

  2. Confirm the no-spill-down rule, which is the load-bearing one. Occupy the
     `coder` seat, leave `coder@sonnet2` idle, and deliver a
     `mutation_cost: high` ticket. Confirm NO seat claims it while `coder` is
     busy - specifically that `coder@sonnet2` does not - and that `coder`
     claims it once freed. The ticket must not be lost or dead-lettered while
     it waits.

  3. Confirm `medium` is not easy. Repeat step 1 with `mutation_cost: medium`
     and confirm the `coder` seat claims it.

  4. Confirm spill-up. Occupy `coder@sonnet2`, leave `coder` idle, deliver a
     `mutation_cost: low` ticket, and confirm `coder` claims it.

  5. Confirm the declaration governs, not the seat name. Exchange the two
     seats' declared tiers, repeat step 1, and confirm `coder@sonnet2` now
     claims the `high` ticket. Restore the declarations afterwards and confirm
     the pack conf is back to its committed state.

  6. Confirm single-seat stages are unaffected: deliver tickets of each
     mutation_cost to a one-seat stage (e.g. architect) and confirm each is
     claimed as before, with no tier filtering applied.

