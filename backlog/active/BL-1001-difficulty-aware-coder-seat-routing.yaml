invariants:
  - "A ticket above a seat's declared tier never lands on that seat, however idle it is. The cheap seat's eligibility is bounded by ticket difficulty and is never widened by capacity pressure - waiting is the correct outcome, not a fallback."
  - "A seat's tier is DECLARED, never inferred from its name, its model, or the order the seats were introduced. Exchanging two seats' declarations exchanges their routing, with no code change."

approval_context: >
  Your ruling of 2026-08-20 is recorded and built in: coder1 = the `coder`
  seat (claude-fable-5) and takes the hard tickets; coder2 = `coder@sonnet2`
  (claude-sonnet-5) and takes easy ones only. Note this REVERSES BL-983's
  recorded framing, which named Sonnet "the more capable coder" - see notes.
  Your ruling governs; the note exists so the epic's record stays coherent.

  Two readings I derived rather than asked, both firm unless you say otherwise
  here:

  1. "Only use coder2 for easy tickets" is read as an absolute, so a ticket
     whose mutation_cost is `medium` is NOT easy and goes to coder1. Only
     `low` reaches coder2.
  2. The wait/spill question BL-983 deferred is answered ASYMMETRICALLY: a
     hard ticket WAITS for coder1 and never spills down to coder2 even when
     coder2 is idle (spilling down risks the bounce you are trying to avoid);
     an easy ticket MAY spill UP to coder1 when coder2 is busy (that
     direction costs money, not correctness).

  If you would rather a hard ticket spill down after some wait rather than
  block, say so - that is a different ticket, not a tweak to this one.

