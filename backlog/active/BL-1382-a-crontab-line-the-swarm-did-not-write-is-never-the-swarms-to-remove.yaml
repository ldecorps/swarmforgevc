id: BL-1382
title: "A crontab line the swarm did not write is treated as the swarm's to remove: both root-ownership predicates claim any line naming <root>/.swarmforge/operator/, so a full-stack stop or a recognized-mode schedule install erases a hand-installed schedule"
milestone: M8
type: defect
severity: high
# high: a live fault that destroyed the human's data - three hand-installed
# crontab lines vanished overnight 2026-09-04, and the 09:00 weekday start
# was 40 minutes from being missed when it was caught. Not critical: the
# swarm itself was not down and the schedule was restorable from its saved
# preset. Expedite-lane ordering applies (Article 3.2.4).
status: todo
epic: swarm-reliability
priority: 11
direction: human-intake
depends_on: []
mutation_cost: medium
slice_size_envelope: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]

acceptance: specs/features/BL-1382-a-crontab-line-the-swarm-did-not-write-is-never-the-swarms-to-remove.feature

invariants:
  - "A crontab line carrying no swarmforge marker for this root is byte-preserved by every swarm cron writer for that root - install, uninstall and reconcile - whatever path it names. RULED option 1 on 2026-09-04, so this binds every writer; the earlier clause narrowing it under option 2 is void."
  - "Bash and Babashka decide ownership by ONE rule: a test asserts the shell predicate and the bb strip agree on a shared corpus of lines, so the two readers can never drift (BL-897)."

human_approval: approved
human_ruling: |
  Marker-only ownership everywhere (recommended) - stop, install and reconcile touch only marked lines; unmarked lines reported and left

  Recorded 2026-09-04 by the specifier from the human's VERBATIM reply in
  front-desk thread SUP-17, channel telegram, 2026-09-04T14:13:07.473Z -
  the option 1 label, posted after the Operator relayed the three
  ruling_options into that thread at 14:10:18Z. Not a ruling-keyboard tap:
  a text reply in a support thread writes no field (BL-1369 shape), so it
  is written here with its provenance, the same way BL-1375's ruling was
  recorded from a direct instruction. Filed at
  backlog/answers-archive/ANSWER-2026-09-04-bl1382-marker-only-ownership-everywhere.md.
  human_approval is NOT flipped by this record - that is the human's tap.
approval_context: >
  Your intake of 2026-09-04, item 2 of "What's needed", split out from
  BL-1381. The mechanism is settled and is not what I am asking about: two
  predicates claim any line naming <root>/.swarmforge/operator/ (details in
  description). What is yours is the policy, because it decides what a
  full-stack stop means for a schedule you installed by hand. Your own
  crontab header already documents that ./stop-swarm.sh erases your lines
  and works around it by never calling night-stop.sh; option 1 makes that
  workaround unnecessary, option 2 keeps the stop as designed at BL-1162 and
  fixes only the install path, option 3 changes nothing about ownership and
  makes the writers refuse instead. Also recorded, so you have it before
  deciding: I could not pin which writer fired overnight (see description);
  the predicate is the defect whichever one did.

ruling_options:
  - Marker-only ownership everywhere (recommended) - stop, install and reconcile remove only lines carrying a swarmforge marker for this root, and an unmarked line naming an operator script is reported as left in place
  - Marker-only for install and reconcile, path sweep kept on the full-stack stop - stop-swarm still erases unmarked operator-script lines as today and its help text says so
  - Keep path ownership and refuse instead - install and stop refuse to run while unmarked lines name this root, telling the human which lines to mark or remove first

description: |
  ## What happened (the human's report, verbatim in `source:`)

  Overnight 2026-09-04, between roughly 01:49 and 08:19 BST, the live crontab
  lost 3 of its 4 hand-installed shift lines - exactly the three naming
  `<root>/.swarmforge/operator/*.sh` (`day-shift-start.sh`,
  `day-shift-bedtime.sh`, `night-start.sh`). The 4th, naming
  `<root>/swarmforge/scripts/wait_for_expedite_then_bedtime.sh`, survived,
  as did the BL-675 freshness line and the descent-review line.

  ## The mechanism (verified this pass, by reading both writers)

  Two predicates decide "does this line belong to root R", and both carry the
  same PATH clauses alongside the marker clauses:

  - `swarmforge/scripts/swarmforge_cron_lib.sh::swarmforge_cron_line_belongs_to_root`
    matches the freshness marker, the operator-schedule marker, the
    shift-schedule begin/end markers, `FRESHNESS_ROOT=R `, **and** any line
    containing `R/.swarmforge/operator/`, `R/start-swarm.sh`, or
    `R/stop-swarm.sh`. Consumers: `uninstall_swarmforge_crons.sh` (the
    full-stack `./stop-swarm.sh` path) and `swarmforge_cron_root_has_lines`.
  - `swarmforge/scripts/reconcile_shift_schedule_crontab.bb::strip-schedule-lines`
    repeats the same set (operator marker, begin/end, `R/.swarmforge/operator/`,
    `R/start-swarm.sh`, `R/stop-swarm.sh`). The install path
    (`install_shift_schedule_cron.sh`) writes `stripped + rendered` whenever
    a mode is recognized: `config swarm_shift` in the conf, or a legacy
    `continuous-shifts.json` mode in {day-only, continuous-3-shift,
    night-standing, continuous}.

  That set is precisely the set that was lost: the three operator-script
  lines match a path clause; the `swarmforge/scripts/` line matches nothing;
  the freshness and descent-review lines carry their own markers and are
  outside the schedule strip. The design intent at BL-1162 was to sweep the
  LEGACY presets (`crontab.day-only`, `crontab.day-night`), which are
  themselves hand-installed files naming operator scripts by path and carry
  no marker - so to the predicate, "hand-installed by the human" and
  "legacy swarm-managed" are the same thing. That is the defect.

  ## What I could not pin, and why the ticket does not need it

  - The install path cannot have written anything overnight: the applier lib
    has crashed at load since 2026-08-27 (**BL-1381**), and even loaded, the
    live mode `weekday-day-weekend-night` is unrecognized, so the wrapper
    exits before `crontab -`.
  - The freshness installer strips only its own marker line (read this pass),
    so it is cleared.
  - That leaves the stop path (`./stop-swarm.sh` -> `uninstall_swarmforge_crons.sh`)
    as the only writer whose output matches the lost set, with the freshness
    line re-added afterwards by a start (`install_swarmforge_crons.sh` ->
    `install_freshness_cron.sh`). A `kill_all_swarm` at 01:49:07 BST and the
    human's own front-desk redeploys at 07:26 and 07:33 BST both fall in the
    window, but no log records a cron uninstall (`Removed all swarmforge cron
    lines` appears in no `.swarmforge/**/*.log`), so this is inference, not
    evidence. Per the intake, the exact trigger stays open. The predicate is
    the defect whichever trigger fired, and the acceptance below tests the
    predicate, not the trigger.

  ## How (direction, not mandate)

  - ONE ownership rule, in the shared shell lib, expressed in terms of the
    markers the swarm itself writes. The bb strip consults the same rule -
    either by shelling to the lib or by mirroring the marker list with a
    test that asserts both literals agree (invariant 2, BL-897).
  - Unmarked lines that name the root are SURFACED, never swept: install and
    uninstall print each one as "left in place" (the reconcile already
    computes `surfaced-human`; today nothing prints it).
  - If a legacy-preset sweep is still wanted, it becomes explicit and opt-in
    (a flag on `uninstall_swarmforge_crons.sh`, say) rather than the default
    meaning of "belongs to root". Direction only.
  - Multi-root isolation (BL-783/BL-1162) is unchanged and stays covered.
  - Tests run against fixture crontabs only (`bl1162_swarmforge_cron_property_runner.sh`
    and `test_bl1162_start_stop_swarm_cron_lifecycle.sh` already do); no test
    or e2e step touches the live user crontab.

  ## Scope note on the feature file

  Scenarios `BL-1382 a-full-stack-stop-removes-only-marked-lines-01` and
  `BL-1382 an-unmarked-line-is-reported-not-swept-04` were written for
  ruling option 1. The human RULED option 1 on 2026-09-04 (see
  `human_ruling:`), so both stand exactly as written and nothing is
  retired; the option 2 and option 3 amendments described at mint are void. Nothing is built yet,
  so this is an amendment before the coder starts, not a BL-233 boundary.

  ## Explicitly NOT in scope

  - The applier lib crash and the wrapper's silent-success gap (**BL-1381**).
  - The human's weekday/weekend preset and the operator scripts it names.
  - Re-deriving the overnight timeline commit by commit (intake: out of scope).

qa_e2e_procedure: |
  1. Fixture crontab (via a `crontab` shim on PATH writing a fixture file)
     holding: a freshness line marked for root R; an unmarked line naming
     `R/.swarmforge/operator/day-shift-start.sh`; an unmarked line naming
     `R/swarmforge/scripts/wait.sh R`; a line marked for a sibling root S.
  2. Run `uninstall_swarmforge_crons.sh R`. Only the freshness line for R is
     gone, both unmarked lines and the S line are byte-identical, and the
     output lists the unmarked operator-script line as left in place (ruling
     option 1).
  3. Same fixture, set `config swarm_shift day` in the fixture conf, run
     `install_shift_schedule_cron.sh R` (BL-1381 must be landed for this path
     to run at all - confirm it is): the managed block for R appears, both
     unmarked lines are byte-identical, the output lists the operator-script
     line as left in place.
  4. Add a line carrying `# swarmforge-operator-schedule root=[R]` and run the
     uninstall again: that line IS removed (marker ownership still works).
  5. Run the shared-corpus agreement test (invariant 2) and confirm it fails
     when one reader's marker list is edited and the other's is not.
  6. Live host, read-only: `crontab -l` before and after a `./swarm` start is
     byte-identical apart from the freshness line (which the start re-installs
     with identical content). Do NOT run `./stop-swarm.sh` on the live host as
     part of this check unless the human has said their schedule may be
     re-installed from `crontab.weekday-day-weekend-night` afterwards.
  7. Remove the fixture root in a `finally`, sweeping by prefix before the run
     too (BL-971).

notes: |
  2026-09-04 (specifier): RULING RECORDED - option 1, marker-only ownership
  everywhere, from the human's verbatim reply in SUP-17 at 14:13:07Z
  (provenance in `human_ruling:`). Scenarios 01 and 04 stand; invariant 1's
  option-2 clause voided; e2e step 2 re-tensed. `human_approval` stays
  `pending` until the human taps Approve in the BL-1382 topic or says so
  through the front-desk approval path - an agent never flips it. Once
  approved, the ticket is promotable with no further specifier work.

  `required_wiring` deliberately absent: both predicates are already on live
  paths (`uninstall_swarmforge_crons.sh` sources the lib and `./stop-swarm.sh`
  runs it; `install_shift_schedule_cron.sh` runs the reconcile on every start
  - verified by grep this pass). An anchor on the parcel's own edit to either
  file is satisfied by construction (BL-1235). The acceptance handler and the
  BL-1162 property runner are the gate.

  Why the ticket names a ruling rather than deciding: BL-1162 chose path
  ownership deliberately, to sweep legacy presets that the human installs by
  hand from files under `.swarmforge/operator/`. Reversing that is a policy
  change to what `./stop-swarm.sh` means, and the human's own crontab header
  shows they have already been living around the current meaning. That is
  theirs to settle, and the three options differ in what a stop does to a
  hand-installed schedule.

  The intake's sentence "Left genuinely open — do not assume the process/shell
  crash is the root cause of the stripping" is honoured: this ticket does not
  claim the crash caused the loss, and says so.

  IR-DRY: run on the feature file at mint (see commit).

  Mint-time INVEST: one observable outcome (a hand-installed line survives the
  swarm's cron writers), one sitting once the ruling is in, independent of
  BL-1381 (that ticket makes the install path RUN; this one changes what it
  and the stop path may REMOVE - the e2e step that exercises install merely
  needs BL-1381 landed first, which `depends_on` does not encode because the
  parcel itself can be built and unit-gated without it).

source: |
  Raw intake `backlog/INTAKE-shift-schedule-applier-process-shell-crash.md`
  (human via Claude Code, 2026-09-04), drained by the specifier 2026-09-04 and
  split 1:2 - this ticket carries "What's needed" item 2 and the observation;
  **BL-1381** carries items 1 and 3 (the crash and the silent-success gap).
  The intake is archived at
  `backlog/archive/INTAKE-shift-schedule-applier-process-shell-crash.md`.

  Human words carried verbatim (Article 5.3):

  - "Priority: high — the schedule cron install path is a real correctness
    surface (it can rewrite the user's crontab), and it is currently broken in
    a way that happened to fail safe tonight but should not be trusted to keep
    doing so."
  - "Overnight (between ~01:49 BST and 08:19 BST, 2026-09-04), the live crontab
    lost 3 of its 4 shift-schedule lines — everything referencing
    `.swarmforge/operator/*.sh` (`day-shift-start.sh`, `day-shift-bedtime.sh`,
    `night-start.sh`) — while a 4th line referencing `swarmforge/scripts/`
    (`wait_for_expedite_then_bedtime.sh`, the weekend-stop entry) and two
    unrelated lines (BL-675 freshness check, descent-review) survived
    untouched."
  - "2. Once it actually runs, re-examine whether it — or some other path
    through `install_shift_schedule_cron.sh` /
    `reconcile_shift_schedule_crontab.bb` — really can strip
    `.swarmforge/operator/`-referencing lines while leaving others, and
    under what live conditions (this human's custom
    `crontab.weekday-day-weekend-night` preset is hand-installed, outside
    the `swarm_shift`/legacy `continuous-shifts.json` modes this reconcile
    code actually recognizes — worth checking whether ANY future
    auto-install path should be touching a hand-installed custom schedule
    at all, versus only ever managing its own recognized modes)."
  - "Left genuinely open — do not assume the process/shell crash is the root
    cause of the stripping just because it is the most suspicious thing
    found; it demonstrably isn't, as coded right now."
  - "Out of scope: Re-deriving the exact overnight timeline commit-by-commit
    — the live swarm's own commit history for
    `swarmforge/scripts/shift_schedule*.bb` overnight is the actual evidence
    trail for that, not re-litigated here."
  - "Out of scope: The custom weekday/weekend schedule itself (already
    working, restored, not the subject of this intake)."

