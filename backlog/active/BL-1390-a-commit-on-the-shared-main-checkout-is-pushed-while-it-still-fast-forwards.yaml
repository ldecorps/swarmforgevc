acceptance: specs/features/BL-1390-a-commit-on-the-shared-main-checkout-is-pushed-while-it-still-fast-forwards.feature

required_wiring:
  - 'swarmforge/git-hooks/post-commit::push_sweep_lib.bb::the hook is the CONSUMER git runs through core.hooksPath and it must reach origin through the ONE existing push adapter, never a second git push (BL-1198); the file does not exist today so the literal is fixed at mint (BL-874)'
  - 'specs/pipeline/steps/bl1390PushWhileFastForwardSteps.js::registerSteps::the handler file exists so discovery registers every scenario (BL-1371)'

invariants:
  - "A push happens only when, after a fresh fetch, local main is strictly ahead of origin/main and not behind - never a force push, never while diverged, never from a role worktree branch (BL-891 invariant 1 and BL-1310 stand unchanged). Neither the hook nor any test of it ever writes the live repository's config: every fixture root is a git-init or clone under mkdtemp, proven by rev-parse --git-common-dir before any mutating git command, and the suite asserts the live origin URL is byte-identical after it runs. AMENDED 2026-09-04 after the fixture clobbered the shared origin."
  - "The hook never fails, blocks or delays a commit beyond a bounded time: an unreachable origin, a slow fetch or a refused push leaves the commit exactly as made and logs why, and the periodic push sweep remains the fallback. The hook's own e2e is bounded the same way: at most one instance runs at a time (a lock), its startup reaps only fixture roots no live run owns (dead recorded owner pid or age bound - never a blind prefix sweep), it has a wall-clock bound, and its log names the process chain that invoked it. ADDED 2026-09-04 after 1156 concurrent copies exhausted the host."
  - "One push path: every push from the shared checkout goes through push_sweep_lib.bb's adapter, so the sweep and the hook can never disagree about whether a push was safe."

human_approval: approved
approval_context: >
  Minted on your "go ahead" of 2026-09-04 to my three-point proposal after
  you asked why you were getting so many deadlocks. This is point 1. No
  choice is posed and there are no ruling_options: the shape (a post-commit
  hook on the shared checkout that pushes only while a fast-forward is
  possible) follows from the diagnosis, and the coder is free on the
  mechanics. Point 2 is BL-1391; point 3 is a rule landed in the specifier
  prompt in the same commit.

description: |
  ## What is wrong

  The shared `main` checkout is written by the coordinator (promotes,
  closes), the specifier (mints, amendments), the concierge (topic
  records), the approval bot (taps) and the operator (config). Each commit
  makes local `main` "ahead" of `origin/main`. The push sweep pushes those
  commits only on its own cadence and only while not diverged
  (`push_sweep_lib.bb`, `:diverged` outcome). The moment QA lands on
  `origin/main` while anything local is unpushed, the checkout is both
  ahead and behind: the push sweep refuses, and absorbing origin becomes a
  real merge that the reconcile sweep may perform only on a clean
  `merge-tree` verdict (BL-1130/BL-1236) and may never resolve by reset
  (BL-1310). Any overlap - a ticket YAML both sides touched, a feature file
  a hand-built land carried - is a predicted conflict, the deadlock latch
  trips, and every role's prompt forbids the non-fast-forward merge that
  would clear it, so it waits for a human.

  Measured 2026-09-04: 32 local-only commits (10 concierge topic records, 9
  coordinator promotes/closes, 5 specifier, 4 operator hand-merges, 3
  approval taps, 1 config), 115 deadlock lines, four hand-merges, one close
  held 48 ticks. Nothing had pushed since 14:44Z because the sweep had been
  diverged since then.

  ## The fix

  Push while it is still cheap. If a commit on the shared checkout is
  pushed as soon as it is made - and only while a fast-forward is possible
  - local `main` sits at ahead zero almost all the time, and a QA landing
  arrives as pure lag: `behind>0`, `ahead=0`, which the coordinator's step
  0 already absorbs with `--ff-only` and the reconcile absorbs with no
  merge at all. Divergence shrinks to the race window between one local
  commit and one QA push, which is seconds, not a working day.

  ## How (direction, not mandate)

  - A `post-commit` hook in `swarmforge/git-hooks/` (the configured
    `core.hooksPath`, beside `pre-commit`), active only when the commit
    lands on `main` in the master checkout (not in a linked worktree - role
    branches push only through QA's land). It fetches with a short bound,
    and if local `main` is ahead and NOT behind it pushes through
    `push_sweep_lib.bb`'s existing adapter (invariant 3). If behind, it
    logs `diverged` and leaves the join to the reconcile. It never exits
    non-zero into git and never waits long: a post-commit hook cannot fail
    the commit, but it can stall the committer.
  - The daemon's periodic push sweep stays as the fallback for anything the
    hook missed (a hook disabled by env, a network blip).
  - A concurrent committer (the concierge commits within seconds of a
    specifier mint) must not race the hook into a force or a double push:
    the adapter's own lock or a retry on a refused non-fast-forward push,
    never `--force`.
  - Tests: the hook's decision is a pure function over `{ahead behind
    branch in-worktree?}` in the bb lib, driven by the existing push-sweep
    runners; the hook itself is a thin wrapper.

  ## Explicitly NOT in scope

  - Resolving a conflict that has already formed (BL-1391).
  - The reconcile's own orphaned-merge defects (BL-1386, BL-1387).
  - Role worktree branches: they never push, before or after this ticket.

qa_e2e_procedure: |
  1. Fixture master checkout with a bare origin. Commit on main with origin
     unchanged: the hook pushes, `ahead/behind` reads 0/0, the push went
     through push_sweep_lib.bb's adapter (its log line), the commit is
     intact.
  2. Advance origin, then commit locally: the hook does NOT push, logs
     `diverged`, the commit is intact, and the reconcile sweep's next tick
     sees a two-way divergence exactly as today.
  3. Commit on a linked role worktree branch: no fetch, no push, no log.
  4. Make origin unreachable, commit: the commit completes within the bound,
     the hook logs the failure, nothing is pushed.
  5. Two commits within a second (simulate the concierge following a mint):
     both reach origin in order, no force, no error.
  6. Live: after the parcel lands and the hook is installed on this host,
     watch `main_sync_status_cli.bb` across a specifier mint followed by a
     QA landing - `ahead` returns to 0 within the hook's bound and the
     landing absorbs as `ff-only`.
  7. Isolation, proved not assumed: before the suite runs, record the live
     repository's `remote.origin.url`; after it, assert it is byte-identical
     and that `git worktree list` of the live repository is unchanged. Inside
     the suite, every `git -C "$root"` is preceded by a check that
     `git -C "$root" rev-parse --git-common-dir` resolves under the fixture's
     mkdtemp WORK dir - an empty `$root` (`git -C ""` is the current
     directory) or a path inside the live repository fails the suite loud
     before any mutation. Re-run scenario 04's "unreachable origin" case with
     `root` deliberately emptied: the suite refuses; the live origin is intact.
  8. Concurrency of the suite itself: start the e2e twice at the same
     instant. The second acquires no lock and either waits or exits cleanly
     naming the first's pid; the first's fixture directory is intact
     throughout and passes; at no point do two instances run. Then start ten
     at once: at most one runs, the rest are refused or queued, none
     destroys another's fixture, and each log line names the invoking
     parent chain (pid, ppid, command).
  9. Remove fixture roots in a `finally`. The startup reap removes ONLY
     roots whose recorded owner pid is dead or whose age exceeds a bound
     (BL-971's sweep qualified by BL-1385/BL-1390): a blind prefix sweep
     under concurrent invocation destroys sibling runs, and the hook's own
     scratch, if any, is per-invocation.

notes: |
  ## 2026-09-04 SECOND INCIDENT (specifier) - 1156 concurrent copies of the e2e

  QA (`QA-bl1390-runaway-test-process-explosion-20260904.md`, QA branch)
  counted 1156 concurrent `bash swarmforge/scripts/test/test_bl1390_post_commit_push.sh`
  processes during its BL-1362 land: load 5.9-8.7, 13 of 19 GiB RAM, swap
  in use, the property-suite guard slowing from 332s to 570s and refusing
  on shifting files. QA did not kill them (not its work); by the time the
  specifier looked (17:3xZ) none were left and the load was falling.

  What multiplied them is NOT established, and this record says so rather
  than guessing: the parcel's mutation sweep runs the e2e sequentially (6
  mutants, one `bash` each); the acceptance handler runs it lazily and
  memoizes on the feature's shared context, so an acceptance run spawns it
  once; no registry guard test executes step bodies; the fixture installs
  only the post-commit hook, so fixture commits cannot recurse into the
  live guard chain. The coder root-causes on the bounce, with the one tool
  that answers it: the e2e now logs the process chain that invoked it
  (invariant 2), so the next storm names its spawner.

  What IS established and required regardless: each copy's startup
  `rm -rf ${FIXTURE_PREFIX}*` deletes every other live copy's fixture, so
  N concurrent invocations become N failures - the BL-1385 shape again,
  this time in a test. Invariant 2 extended: a lock, a reap limited to
  dead-owner or aged roots, a wall-clock bound, parent-chain logging.
  Scenario 07 added; e2e steps 8-9 re-tensed. The BL-971 sentence in
  engineering.prompt is qualified in the same commit (boot budget gate run).

  Correction to the 2026-09-04 first-incident record above: the coder's
  rework in the parcel documents the mechanism - an early draft called
  `g "$root"` with `$root` empty and `git -C ""` is the current directory -
  and now guards every git call with `in_fixture`. That establishes what
  the earlier entry left open.

  ## 2026-09-04 AMENDMENT (specifier) - the fixture clobbered the LIVE repository's origin

  Live incident, reported by QA (`QA-bl1390-shared-git-config-origin-clobbered-20260904.md`
  on the QA branch): the shared `.git/config`'s `remote.origin.url` read
  `/tmp/bl1390-post-commit-kTsiBL/does-not-exist.git`, so every push, fetch
  and ls-remote from EVERY worktree failed until QA restored it at 17:01Z
  (`git remote set-url origin git@github.com:ldecorps/swarmforgevc.git`);
  QA's BL-1358 land had silently failed at the push step and was caught by
  QA reading stderr. That URL is exactly the value line 184 of
  `test_bl1390_post_commit_push.sh` assigns with `git -C "$root" remote
  set-url origin "$WORK/does-not-exist.git"`. For it to reach the live
  config, `$root` was empty at that line - `git -C ""` leaves the working
  directory unchanged, and a role worktree's `.git` is a file pointing at
  the shared git dir, so the write landed in the one config every worktree
  shares. HOW `$root` came to be empty, or how else that value reached the
  live config, is NOT established: `setup_repo` sets `root` globally on
  purpose, so a function-local variable is ruled out. Two candidates the
  coder must test on the bounce, with the live origin recorded before and
  after each run: the hook resolving its repository from its own script
  location (the fixture's own comment says it does) so a hook invoked from
  the live worktree's copy acts on the live repository; and a fixture WORK
  dir removed mid-run (the EXIT trap, or a prefix sweep - BL-1385's shape)
  leaving `git -C` pointed at a path that no longer exists. `set -u` does
  not catch an EMPTY value either way.

  Amended: invariant 1 extended (never write the live config; prove the
  fixture root; assert the live origin after), e2e step 7 added. Scenario
  06 added to the feature. Bounce class behavior, producer coder - a test
  that mutates production state is a defect on its own merits; the ticket's
  own e2e step 1 said "fixture master checkout with a bare origin" and the
  fixture does build one, so this is not a spec gap. The general guardrail
  is landed in engineering.prompt with this amendment (boot budget gate
  run), so the next fixture author reads it before writing `git -C`.

  `required_wiring` anchor 1 is a consumer anchor: git runs whatever sits in
  `swarmforge/git-hooks/` through `core.hooksPath`, and the literal
  `push_sweep_lib.bb` inside that file proves the hook reaches the one push
  adapter rather than shelling its own `git push`. Absent today (the file
  does not exist).

  IR-DRY: run on the feature file at mint (see commit).

  Mint-time INVEST: one observable outcome (local main stays at ahead zero
  after a commit that can fast-forward), one sitting, no unbuilt sibling.

source: |
  Human, in the specifier's pane, 2026-09-04 ~15:15Z, with a screenshot of
  the coordinator holding BL-1385's close for 48 deadlock ticks:

    "why am I fetting so many deadlocks?"

  The specifier's assessment proposed three changes; the human replied:

    "go ahead"

  Point 1 as proposed, verbatim: "Writers on the shared checkout push after
  every commit, so `ahead` stays near zero and QA's lands fast-forward. This
  removes most merges outright." Point 2 is BL-1391. Point 3 ("never edit a
  feature file on `main` while its parcel is in flight and a hand-built
  land may carry the branch's copy. Today's conflict is mine.") is landed
  as a rule in swarmforge/roles/specifier.prompt in the mint commit.

assigned_to: coder
