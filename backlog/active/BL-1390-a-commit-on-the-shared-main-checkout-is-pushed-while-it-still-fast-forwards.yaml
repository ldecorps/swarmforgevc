id: BL-1390
title: "A commit on the shared main checkout is pushed at once while it still fast-forwards, so local main stays at ahead zero and every QA landing absorbs by fast-forward instead of by a merge nobody is allowed to make"
milestone: M8
type: defect
severity: high
# high: a broken health signal with daily reach. Every writer on the shared
# checkout (coordinator, specifier, concierge, approval bot) leaves local
# main "ahead", the periodic push sweep refuses once origin has moved, and
# from then on every QA landing needs a real merge that only a clean
# verdict may make. On 2026-09-04 local main reached 32 ahead / 2 behind,
# the deadlock latch tripped 115 times in the daemon log, the coordinator
# held a close for 48 ticks, and the operator hand-merged four times.
status: todo
epic: swarm-reliability
priority: 8
