description: |
  An operator hotfix is live on main and has never passed through the normal
  gates. This ticket stamps it off: confirm or refute the landed behavior and
  open narrow follow-ups for defects found. Do not redesign the launch,
  babysitter, or remote-control subsystems here.

  Before commit f02f6ae5b4, Cursor full-forge seats had three coupled failures:
  the babysitter only recognised a `claude` child and falsely declared a live
  Cursor pane half-launched; `./swarm ensure` accepted a pane whose
  `cursor-agent` process had exited; and the Cursor command embedded the full
  prompt in argv. The landed patch derives a process marker from the
  roles.tsv agent token, repairs a pane only when its expected agent is absent,
  reports Claude remote control as OFF for non-Claude seats, and gives Cursor a
  prompt-file reference instead of prompt text.

  Review the live paths in `babysitter_check.bb`,
  `babysitterd_sweep_lib.bb`, `remote_control_health_lib.bb`,
  `swarm_ensure.bb`, and `swarmforge.sh`. Confirm the marker maps and the
  health/repair callers agree, that a real Cursor child does not produce a
  false CRIT or remote-control WARN, and that a shell-only Cursor pane is
  actually respawned. Treat the commit as reviewable landed work, not a
  licence to reimplement it.
qa_e2e_procedure: >
  1. Run the relevant shell/Babashka unit runners and the acceptance feature
  against the parcel. 2. Start a Cursor-configured pack, confirm the
  babysitter reports the seat's cursor-agent process as present and `rc:<role>`
  as OFF with its action rather than HEALTHY or RC-degraded. 3. Terminate only
  the Cursor agent child while leaving its pane alive; run `./swarm ensure`
  and confirm it invokes the persisted role launch script and reports an
  `agent:<role>` repair. 4. Inspect the launched Cursor command: it must name
  the generated prompt file and must not contain the composed constitution,
  pipeline, role, and pack text. 5. Repeat the health check for a Claude seat
  to confirm its remote-control check remains applicable. Record the degraded
  fallback: this shell and Babashka slice has no mutation, CRAP, or DRY tool;
  its gate is the project runners and these acceptance scenarios.
out_of_scope: |
  - Replacing Cursor Remote or Telegram phone control.
  - General model-steward certification and pack routing (BL-1079).
  - ACP-host operation (BL-1081).
  - Reimplementing the hotfix rather than reviewing its landed diff.
