description: >
  WHAT. End-of-shift closing ceremony already folds the lean ledger into
  a specifier packet. Add a third lever beside promotion order and
  throttle: per-role quality recommendations (effort/model tier dial)
  grounded in how well each role worked this shift.

  Human-approved rule (verbatim intent):
  1. Role worked well this shift → lower quality (cheaper/faster) so it
     can move more work.
  2. Role worked poorly or drove rework (bounces, stalls, bad closes) →
     raise quality so the next shift does better.
  3. Goal: faster overall while keeping output good enough.
  4. (Human refine 2026-08-25) The dial does NOT apply to "auto"
     models. Seats on window --model auto (or steward ids cursor/auto,
     copilot/auto, etc.) stay on auto — no raise/lower recommendation
     or apply; hold/skip only. Provider auto already picks quality;
     rewriting the window model would fight that.

  WHY. Lean coordinator gestures today are only promotion order and
  throttle posture — not model quality/effort. Operator hand-edits pack
  --effort / window models today.

  HOW (direction, not mandate) — slice 1 (this ticket):
  - Define well vs rework signals from existing BL-819/820 ledger fields
    only (bounce classes, dwell, stalls — reuse, do not invent).
  - Emit per-role quality up / down / hold in the closing-ceremony
    packet that already reaches the specifier.
  - Specifier lean pass may record process_ticket / spec_gate_tweak /
    no_change as today; dial recommendations are advisory input to that
    pass, not an automatic pack rewrite.
  - Skip/hold any role whose configured model is auto (see invariant);
    lean signals for that role may still appear in the packet, but the
    dial field must not recommend a model/effort change.
  - Safety: no silent permanent downgrade of critical seats; reversible;
    human override; must not fight promo/throttle.

  Slice 2 (NOT this ticket): auto-apply dial to pack overlay / window
  effort — only after slice 1 is proven. Still excludes auto models.

qa_e2e_procedure: >
  (1) Fixture shift ledger with one high-bounce role and one clean role,
  both on concrete (non-auto) window models.
  (2) Run ceremony packet builder → packet lists raise for the former
  and lower (or hold) for the latter with cited lean fields.
  (3) Confirm pack conf files are unchanged by the ceremony run.
  (4) Specifier outcome CLI still accepts process_ticket / no_change.
  (5) Document how a human refuses/reverses a bad recommendation.
  (6) Same high-bounce fixture with window --model auto (and
  cursor/auto / copilot/auto) → hold/skip only; no raise/lower.

out_of_scope: |
  - Auto-applying dial to pack conf (follow-up slice).
  - Replacing operator pack selection (cursor-forge vs qwen etc.).
  - Making local/CPU replies instant.
  - New Telegram product/UI.
  - Dialing or pinning away from provider auto models.

