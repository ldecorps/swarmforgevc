description: |
  ## What

  Close the gap where Telegram Approvals can show a buttoned ask for a backlog id
  whose yaml never landed (or vanished). BL-1186 incident: concierge posted
  ApprovalRequested from transient working-tree yaml; seven Approve taps returned
  no-ticket-file; buttons stayed live.

  ## Deliverables

  1. **Pre-post gate:** refuse ApprovalRequested unless findTicketFilePath succeeds.
  2. **Post-drop reconcile:** when yaml disappears or pendingApproval clears, close/mark stale the buttoned ask (BL-484 repaint path).
  3. **Mint durability gate:** specifier "spec-ready in paused/" handoff refuses unless committed yaml path exists on main.
  4. Optional: babysitter WARN when telegram-approval-ask-messages keys ⊄ live yaml ids.

qa_e2e_procedure: >
  (1) Missing yaml — no ApprovalRequested, no registered ask. (2) Yaml removed
  after ask posted — reconcile closes ask. (3) Tap on missing yaml — no-ticket-file
  once, buttons gone. (4) Spec-ready without commit — gate refuses.

out_of_scope: |
  - Re-approving BL-1186 content (BL-1186 repair is separate paused ticket).

