description: |
  ## What
  `extension/src/concierge/pipelineBoard.ts`: `gridCaptionLine` (line ~957)
  renders `truncateCaptionDescription(deriveKebabSlug(title))` - the
  64-char `PIPELINE_BOARD_CAPTION_DESCRIPTION_MAX` cap on the RAW slug -
  and the body is HTML-escaped afterwards, so `&` (5x, `&amp;`) and `<`
  (4x, `&lt;`) expand past the cap: a 64-char ampersand caption renders
  at 320 chars. `composePipelineBoardHtml` (lines ~1552-1574) fits the
  message to `PIPELINE_BOARD_MESSAGE_MAX_LENGTH` (4000) by dropping LINK
  entries only; with no links it returns the full html whatever its
  length. A board of fifteen active rows whose titles are mostly
  escapable characters, plus a few parked entries, composes to 4119-4396
  chars.

  BL-956's own property (`extension/test/bl956PipelineBoardCaptionCapInvariants.property.test.js`,
  invariant 1) draws exactly that shape and fails on about one board in
  thirty thousand: 2 of 58,572 draws in the specifier's hunt, fast-check
  seed 10 within its first 1500 runs, every time. At 150 draws per run
  the lane sees it about once in two hundred runs - QA's sighting in
  BL-1467's lane (note 003071), "clean standalone". The file's header
  comment (line 291) claims the margin below 4096 absorbs entity
  expansion; it does not for a whole board. Adjudication, hunt script
  and the seed-10 counterexample:
  backlog/evidence/unowned-red-bl956-caption-cap-adjudication-specifier-20260921.md.

  ## Why
  This is the 2026-07-17 rejected-send outage path BL-956 was minted to
  close: a board Telegram refuses is a board nobody sees. And a property
  that fails on 0.5% of lane runs is a standing red that bounces
  unrelated parcels until an owner lands.

  ## How (direction, not mandate)
  - Budget the caption cap on the escaped length: escape the slug, then
    cap at 64 rendered chars on an entity boundary (never cut `&am…`), or
    shorten the raw slug until `escapeHtml(slug).length <= 64`, keeping
    the ellipsis. The same for the parked and epic list entries if they
    render titles.
  - Give `composePipelineBoardHtml` a last line of defence: after the link
    list is exhausted and the html is still over `maxLength`, trim the
    body (shorter caption descriptions, then the parked list) and announce
    it with the existing overflow line shape - never return over the
    limit, never silently.
  - Pin the seed: the property's invariant 1 gains a deterministic
    example (`fc.assert(..., { seed: 10, numRuns: 1500 })` or the recorded
    board as a plain unit test) so the fix is checked every run, not one
    run in two hundred.

  ## Scope
  - `extension/src/concierge/pipelineBoard.ts` (caption cap, compose
    fallback, the line-291 comment).
  - `extension/test/bl956PipelineBoardCaptionCapInvariants.property.test.js`
    (pinned seed / example; arbitraries unchanged).
  - `specs/features/BL-1684-the-pipeline-boards-caption-cap-is-applied-before-html-escaping.feature`
    and `specs/pipeline/steps/bl1684CaptionCapBudgetsTheEscapedLengthSteps.js`
    (same parcel, BL-233, registered in `specs/pipeline/steps/index.js`).
  - The register row for the bl956 property file leaves in this parcel's
    land (BL-1631); the parcel never edits the register. Documenter: the
    pipeline-board reference's caption-cap sentence says "rendered
    length"; no diagram trigger.

