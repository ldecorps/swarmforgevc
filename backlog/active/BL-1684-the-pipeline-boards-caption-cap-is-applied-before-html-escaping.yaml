     3/3 pass, and the pinned seed-10 example is among what ran.
  2. `node specs/pipeline/cli.js specs/features/BL-1684-the-pipeline-boards-caption-cap-is-applied-before-html-escaping.feature`
     (from the repo root): all ok.
  3. `npx vitest run test/pipelineBoard*.test.js`: green (the existing
     caption and compose tests still hold).
  4. Register: the land retires the bl956 row; the report after landing
     shows no unowned row and no BL-1684 row.

