approval_context: >
  A new feature file is authored here, so it would ordinarily need a tap;
  it is minted approved under the 2026-09-17 operator hotfix (severity
  defect, no choice posed, no ruling_options). FIRM: the message limit is
  a hard invariant - composePipelineBoardHtml never returns html longer
  than its maxLength, links or none. FIRM: every cap stays visible (BL-956
  invariant 3) - a caption trimmed for escaping still ends in the ellipsis
