description: |
  ## What is wrong

  QA note 003466, evidence e7c38760dc (BL-1814's pass, holding it):
  `extension/test/draftPathUnder.property.test.js` > "draftPathUnder
  property: the draft directory depends only on root, never on TMPDIR
  (BL-1537 invariant 1)": `Property failed after 67 tests`, seed
  -957004781, counterexample `[" "," ","..", " "]` (rootSegment, prefix,
  tmpdirASegment, tmpdirBSegment).

  Verified at mint (main 0d152af4c0) with the counterexample:
  `path.join('/bl1537-fc-tmpdir-a', '..')` is `/`, so TMPDIR is `/`.
  `draftPathUnder` returns `/bl1537-fixture-root/ /tmp/ -<pid>-<rand>`,
  whose dirname IS the expected `<root>/tmp` (the invariant holds), but
  the assertion `!draftPathA.startsWith(<tmpdir>)` is false for every
  absolute path once the tmpdir namespace collapses to `/`. A root
  segment of `..` collapses the fixture root the same way. The segment
  generators filter `\0` and `/` but not the two dot segments.

  ## What is wanted
  - The root and both TMPDIR segment generators never draw `.` or `..`,
    so each namespace stays disjoint as the property's own comment says it
    must. How (direction, not mandate): extend the existing `.filter`.
  - The prefix generator (a filename part, never a path segment) and every
    assertion stay as they are.

  ## Scope
  - `extension/test/draftPathUnder.property.test.js`, evidence.

