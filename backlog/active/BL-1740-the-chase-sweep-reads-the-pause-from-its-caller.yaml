approval_context: >
  Minted approved under the 2026-09-17 operator hotfix (severity defect, no
  ruling_options). FIRM: a control pause still holds every queued parcel
  in the LIVE sweep, exactly as e9f91d6746 made it (the human's 2026-09-21
  "drain the seats" directive); only where the reading comes from changes.
  FIRM: the adapter key is `:pause-hold-active?` (fixed at mint so the
  wiring anchor is a literal, BL-874). FIRM: no test edits its way around
