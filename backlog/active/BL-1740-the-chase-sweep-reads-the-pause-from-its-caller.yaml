invariants:
  - "run-sweep! decides a parcel is pause-held only from the pause adapter its caller passes; nothing it calls resolves the checkout the process runs in to make that decision."

description: |
  ## What is wrong

  coder@2's unowned-red note 000068, evidence
  `backlog/evidence/BL-1728-unowned-red-bl1505-property-20260925.md` (on
  coder@2's branch, 2fa4d85946). Committing BL-1728 at 07:28:40Z, the
  property guard refused:
  `test/bl1505DedupSuppressedChaseCountInvariants.property.test.js`,
  3 of 3 red ("expected chaseCount 1 ... got 0"), still red when run alone.

  The specifier ran the same file alone on main at 08:07Z: 3 of 3 green
  (28 s). The difference is the pause. The availability ledger has a
  `pause-start` (`night-closing-ceremony`) at 07:11:24Z and a `pause-end`
  at 07:45:09Z, so the refusal fell inside a live control pause.

  Mechanism: `run-sweep!` computes
  `pause-held? (handoff-lib/pause-hold-active?)` once per role
  (`chase_sweep_lib.bb` ~line 683). The hotfix e9f91d6746 (2026-09-21)
  added that line. `pause-hold-active?` reads
  `.swarmforge/operator/control-pause.json` under `(target-root)`. With no
  explicit root set, `target-root` falls back to the parent of
  `git rev-parse --git-common-dir`, and from any linked worktree that is
  the live master checkout. The test drives `run-sweep!` through `bb -e`
  over a mkdtemp fixture inbox. Its parcel is read as pause-held, so the
  sweep never chases it and the count stays 0. Every other reading
  `run-sweep!` makes (liveness, busy, lane, activity, rate-limit
  cooldown) arrives through `adapters`, and this one does not.

  Reproduced at mint: the test's own sweep snippet, run from a scratch
  `git init` checkout whose `control-pause.json` is `{"active":true}`,
  writes no chase sidecar. The same snippet from the same checkout at
  `{"active":false}` writes `chaseCount 1`.

  ## What is wanted
  - `run-sweep!` takes the pause reading from its adapters under the key
    `:pause-hold-active?`. A sweep whose adapters carry no such key
    treats nothing as pause-held. Every existing fixture then stops
    reading the live marker with no edit of its own.
  - handoffd's chase-sweep adapter map (the map passed at
    `chase-sweep-lib/run-sweep!`, handoffd.bb ~line 2397) passes the live
    reading. A paused swarm still holds every queued parcel, as the
    2026-09-21 directive requires.
  - How (direction, not mandate): `optional-adapter-call`, as the
    `:role-agent-busy?` and `:role-lane-running?` readings already do.
  - The new feature's step handler builds its checkout with `git init`
    under mkdtemp and proves it with `rev-parse --git-common-dir` before
    running anything (Guardrails, BL-1390). It writes the pause marker
    only inside that checkout, never in the live one.

  ## Scope
  - `swarmforge/scripts/chase_sweep_lib.bb` (the pause read in
    `run-sweep!`).
  - `swarmforge/scripts/handoffd.bb` (one adapter entry).
  - The feature, its step handler
    `specs/pipeline/steps/bl1740ChaseSweepPauseFromCallerSteps.js`, and
    its `index.js` registration.

  ## Census (for the architect)
  Test files that drive the sweep:
  `grep -rlE 'run-sweep!|sweep-role-inbox!' extension/test
  swarmforge/scripts/test specs/pipeline/steps` finds 25 (24 tracked, plus
  one untracked scratch runner, `bl1652-non-vacuity-runner-*.bb`). Three
  of them set their own project root: bl852's step handler,
  `chase_sweep_test_runner.bb` and the scratch runner. Only bl1505's
  property file was seen red, because the property lane is the one the
  pre-commit guard runs. The rest go red under a pause only if they
  assert on a stale `new/` item's outcome. The invariant covers all of
  them through the lib default, so no fixture is edited one by one.

out_of_scope: |
  - The dequeue half of e9f91d6746: `handoff_lib.bb`'s
    `resolve-dequeueable-candidates` lower arities default to the same
    live `pause-hold-active?`. Run from a scratch checkout with an active
    pause, `handoff_lib_test_runner.bb` still printed ALL TESTS PASSED
    (checked at mint), so no red is owned there. Mint a ticket if one
    appears.
  - e9f91d6746 carries no `Hotfix-Certification:` trailer and has no
    `backlog/hotfix-ledger.yaml` row. The ledger tracks trailered commits,
    so no row is created. This ticket's feature does pin the chase-sweep
    half of that hotfix's behaviour (the live-reading row).
  - The lane guard's process pattern in the same lib: BL-1714.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1740-the-chase-sweep-reads-the-pause-from-its-caller.feature`:
     all ok (4 of 4).
  2. `cd extension && npx vitest run --config vitest.properties.config.mjs test/bl1505DedupSuppressedChaseCountInvariants.property.test.js`:
     3 of 3 green.
  3. In-process probe, which never touches the live marker: in a scratch
     `git init` checkout under the QA worktree's `tmp/`, write
     `.swarmforge/operator/control-pause.json` as `{"active":true}`. From
     that checkout, run the bl1505 test's `runOneSweep` snippet once
     (adapters without `:pause-hold-active?`). The fixture parcel's
     sidecar reads `chaseCount 1`. Remove the scratch checkout.
  4. `grep -n ':pause-hold-active?' swarmforge/scripts/handoffd.bb`: the
     entry sits in the map passed at `chase-sweep-lib/run-sweep!`.
     `grep -n 'handoff-lib/pause-hold-active?' swarmforge/scripts/chase_sweep_lib.bb`:
     no match.
  5. After landing: REGISTER_ROW_RETIRED for this ticket's property row.

