id: GH-25
title: "Email escalation for unanswered role questions (role_ask)"
source: https://github.com/ldecorps/swarmforgevc/issues/25
description: |2
  If a role question raised via role_ask.bb stays unanswered past a threshold, alert the human by email.
  
  - operator_runtime.bb tick: scan .swarmforge/operator/role-awaiting/*.json; if now - asked_at_ms > threshold and no escalated_at_ms field, escalate, then stamp escalated_at_ms into the marker (one-shot, no per-tick spam).
  - Threshold: SWARMFORGE_ASK_ESCALATION_MINUTES, default 30.
  - Transport: GitHub mention (comment on a dedicated ops issue mentioning @ldecorps via api.github.com with the cached creds) - GitHub sends the email; zero new secrets, known-good corporate egress. Plain SMTP only as fallback variant if this is rejected.
  - Must fire even if the question was never delivered to Telegram (the marker ages regardless) - the escalation doubles as a detector for silently dropped questions.
  - Surface pending/escalated question state in status.json
