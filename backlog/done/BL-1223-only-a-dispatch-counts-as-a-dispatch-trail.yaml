  reading the code alone: counts, the 68-id list, and the paused/active
  cross-reference above were all measured.

  The four handoffs that make BL-1203's own case are
  .swarmforge/handoffs/specifier/sent/00_20260827T194046Z_000789,
  coordinator/sent/00_20260828T012513Z_002928,
  coordinator/sent/00_20260828T015525Z_002932 (the two self-reported gap
  alarms), and coordinator/sent/10_20260828T015657Z_002933, the hand route
  that finally moved it.

