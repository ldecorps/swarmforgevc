invariants:
  - "Verdict equivalence: for any tick, the verdict produced with the cache is the verdict a full re-gather would have produced. The cache only ever replays a verdict it previously computed from a complete enumeration - it never infers one."
  - "Invalidation completeness: a change to the `main` tip SHA, any change to the ordered ahead-SHA set (including a reorder at equal length), or a previous gather that did not complete, all force a full re-enumeration."
