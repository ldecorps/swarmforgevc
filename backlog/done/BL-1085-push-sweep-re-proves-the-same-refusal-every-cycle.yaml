required_wiring:
  - "swarmforge/scripts/handoffd.bb::ahead-range-facts::the single shared ahead-range gather must be wired into the adapters map push_sweep_lib/sweep! is called with - a shared gatherer that exists but is not the thing the adapters map points at leaves both original walks running and is this ticket's own failure mode repeated"

approval_context: >
  Filed medium, matching the human's own suggested classification in the
  intake, and the specifier agrees rather than merely deferring: tonight's
  heartbeat gaps are 10-14s against a 120s freshness budget, so this is
  sustained waste, not an outage.

  The judgement worth your attention is not the severity but the risk. Part 1
  adds a CACHE in front of two safety gates that exist because unapproved work
  reached `main` (BL-630, BL-855, BL-952). A wrong cache does not make the
  daemon slow - it makes a refusal silently stale, which is the exact class of
  failure those three tickets were filed for. That is why invariant 1 is
  written as verdict EQUIVALENCE rather than as a description of the cache
  key, and why the ticket states in terms that this must not become BL-952's
  removed fast path.

  If you would rather have the cheap half only, part 2 (one walk per tick)
  carries none of that risk and is roughly half the win. Say so and it splits.
  The human asked for 1+2 as one ticket, so 1+2 is what is minted.

source: |
  Root intake `backlog/INTAKE-push-sweep-cache-qa-refusal-and-single-ahead-gather.md`
  (human via Cursor, 2026-08-23 ~01:22 BST / 00:22Z, WSL host), drained
  2026-08-23. Filed 1:1 - one intake, one ticket - because the human directed
  it explicitly.

  ## Human directives, verbatim

  > "file in ticket 1+2" (verbatim, Cursor session 2026-08-23 ~01:22 BST) —
  > mint **one** ticket covering cache-until-tip/ahead-set-changes **and**
  > single ahead-range gather per tick.

  The intake's own framing of the same ask: "file a ticket covering
  engineering fixes **(1) cache QA/noop refusal until tip or ahead-SHA set
  changes** and **(2) one ahead-range gather per tick** — the two
  highest-leverage optimizations for tonight's dominant `push-sweep` cost.
  Treat as one ticket (1+2), not two."

  And its closing constraint: "Do **not** fix by weakening BL-630/855/952
  refuse semantics."

  ## Observed (human, live WSL, 2026-08-22T23:40Z-2026-08-23T00:14Z)

  Heavy bundle runs ~every 10s (`chase-sweep-every-cycles`); heartbeats only
  at cycle start/end. Dominant piece is `push-sweep`: p50 ~2s, max ~4.7s in
  the live `handoffd.log` window. The log is saturated with the same refusal
  every heavy cycle:

      push-sweep qa-refused non-qa-ancestor <same 5 shas...>
      sweep-boundary sweep=push-sweep ms=~2000-4700
      master-main-reconcile drift ahead=23 behind=0

  Local `main` is ~23 commits ahead of `origin/main` with a stable set of
  non-QA-approved (or bounced) offending SHAs. Push backoff never engages:
  backoff applies only AFTER the QA/noop gates pass (`push_sweep_lib.bb`
  `:should-push` branch), so a refusal pays the full gather cost forever.

  ## Verified in the tree by the specifier, 2026-08-23 (not taken on trust)

  1. `push_sweep_lib.bb` `sweep!` takes its git access as an injected
     `adapters` map, documented at lines 288-300: `:noop-merge-gate-facts!`
     is "called ONLY when push-decision is :should-push, BEFORE
     :qa-gate-facts!", and `:qa-gate-facts!` likewise. Both run on every
     `:should-push` tick. The adapters map is the clean seam for both halves
     of this fix; neither requires touching the pure decision functions.
  2. `handoffd.bb` `push-sweep-qa-gate-facts!` (line 2657) and
     `push-sweep-noop-merge-gate-facts!` (line 2728) EACH call
     `git-ahead-shas` and then `mapv` a per-commit facts function over the
     whole range - two independent full walks per tick, confirmed by reading
     both bodies.
  3. `push-sweep-qa-gate-facts!` already computes `main-tip` via
     `git-rev-parse "main"`, so half the cache key material is being fetched
     today and thrown away.

  ## The constraint that makes this delicate, in the code's own words

  `handoffd.bb` lines 2667-2677 carry BL-952's warning against exactly the
  shape a careless cache would recreate:

      BL-952: the tip-is-ancestor fast path is GONE from this gatherer - it
      skipped ahead-commit enumeration entirely, so a BOUNCED commit riding
      under an approved tip published with zero scrutiny (BL-945's own
      landing shape: QA lands BL-943, the tip reads approved, the bounced
      parcel rides along).

  The distinction this ticket turns on: BL-952's fast path INFERRED a verdict
  from a property of the tip without enumerating, so it could be wrong. A
  cache keyed on the tip SHA plus the ordered ahead-SHA set REPLAYS a verdict
  that a full enumeration already produced for a byte-identical input, so by
  construction it cannot differ. Building it any other way - keyed on the tip
  alone, or on the ahead COUNT rather than the SHAs - reintroduces BL-952.

  ## Related prior work (do not regress)

  BL-978 (done) fixed the multi-minute `dropped-parcel-sweep` quadratic walk:
  different sweep, same class of "recompute every tick with no invalidation
  key". BL-630 / BL-855 / BL-952 are the QA gate, the noop-merge gate, and
  the removal of the tip fast path respectively; their refuse semantics are
  load-bearing and unchanged by this ticket.

description: |
  Stop `push-sweep` re-deriving the same refusal from scratch every ~10s, in
  the two ways the intake names, without weakening what the refusal means.

  ## 1. Cache the refusal until its inputs change

  When a tick refuses (`:non-qa-ancestor`, `:bounced-parcel`,
  `:noop-landing-merge`, and their siblings) and the current `main` tip plus
  the ordered ahead-SHA set are unchanged from the cached key, replay the
  cached verdict instead of re-running the gathers. Re-gather whenever the tip
  moves, the ahead set changes, or the previous gather did not complete
  (`:facts-complete? false` must never be cached - a gather that failed closed
  is not a verdict).

  ## 2. Gather the ahead range once per tick

  When a gather IS required, walk the ahead range once, build one shared set of
  commit facts, and run both pure decisions over it. The two pure decisions
  need different projections of each commit; that is a matter of selecting
  different keys from one fact set, not of walking twice.

  ## How (direction, not mandate)

  Both halves live behind the `adapters` map `sweep!` is already called with,
  so the pure decision functions in `push_sweep_lib.bb` need not change and
  their existing tests stay meaningful. Whether the cache lives in memory for
  the daemon's lifetime or on disk is the implementer's call; in-memory is
  sufficient for the observed problem and has no invalidation-across-restart
  question to get wrong.

  Naming constraint, deliberate: the shared gatherer's name must contain
  `ahead-range-facts`, so the `required_wiring` gate above can see that the
  adapters map actually points at it. A shared gatherer that exists while both
  original walks still run is precisely the BL-419 shape this project keeps
  hitting.

  ## What must not change

  The refuse semantics of BL-630, BL-855 and BL-952. This ticket makes the
  same verdict cheaper to reach; it must not make any verdict different, and
  it must not reintroduce a path that reaches a verdict without having
  enumerated the range at least once for that exact input.

acceptance: specs/features/BL-1085-push-sweep-caches-its-refusal-and-gathers-once.feature

qa_e2e_procedure: |
  1. On a scratch clone with local `main` ahead of `origin/main` by several
     commits including at least one non-QA-approved commit, run the daemon
     through several heavy cycles.
  2. Confirm from `handoffd.log` that the refusal verdict is unchanged from
     today's - same class, same offending SHAs - and that
     `sweep-boundary sweep=push-sweep ms=` drops substantially after the first
     refusing tick.
  3. Add one commit to local `main`. Confirm the very next tick re-enumerates
     (the cache does not survive a tip move) and reports a verdict computed
     fresh.
  4. Push one of the ahead commits so `origin/main` moves and the ahead set
     shrinks. Confirm the next tick re-enumerates.
  5. Make the gather fail closed (e.g. remove the `swarmforge-QA` ref).
     Confirm the incomplete result is NOT cached: the following tick attempts
     a full gather again rather than replaying.
  6. Instrument or count `git rev-list` invocations for one gathering tick.
     Confirm the ahead range is walked exactly once, not twice.

out_of_scope: |
  Named follow-ons from the same session, deliberately not in this ticket:
  - Backoff-on-refuse cadence (recommendation #3).
  - Sharing `rev-counts!` / fetch with `master-main-reconcile` in the same
    heavy cycle (recommendation #4).
  - Mid-bundle heartbeat (recommendation #5).
  Also out of scope, per the intake:
  - Raising `daemon_log_freshness.conf` thresholds - "not a fix".
  - Operationally resetting local `main` - "helpful ops, not the ticket".
  - Any change to the refuse semantics of BL-630 / BL-855 / BL-952, or any
    restoration of BL-952's removed tip-is-ancestor fast path.

notes: |
  INVEST note on Small: this is two changes in one ticket at the human's
  explicit direction ("file in ticket 1+2"). They are genuinely one sitting
  and genuinely coupled - part 2 produces the single fact set that part 1
  caches, and building part 1 first would mean caching two walks and then
  immediately reworking it. Splitting them would create the dependent-sibling
  shape INVEST's I exists to prevent. `mutation_cost` is medium rather than
  low because the cache adds branching to a safety-critical path.

  If a reviewer wants the risk reduced rather than the scope, the honest split
  is part 2 alone first (pure speedup, no verdict risk) with part 1 following.
  That trade is surfaced in `approval_context` for the human rather than taken
  unilaterally, since the human asked for one ticket.
