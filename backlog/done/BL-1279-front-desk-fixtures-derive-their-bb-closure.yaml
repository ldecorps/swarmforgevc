notes: |
  - [2026-08-29] specifier: QA's note said "untracked", and that word is wrong
    in both senses - the file is tracked in git and clean, and all four tests
    are `standing` rows in suite-manifest.tsv, so the suite does run them.
    Recording this because the correction matters for triage: this is not an
    unenrolled test nobody runs, it is a visible red nobody owns, which is the
    more serious of the two. QA's "BL-784 fixture drift" half was right, and
    incomplete: BL-784's commit added one missing edge, BL-1273's added a
    second, and the note named only the first. Both were found by reading the
    supervisor's `load-file` lines against each fixture's `cp` line rather than
    by trusting either attribution.
  - [2026-08-29] specifier: scope was decided by measurement, not resemblance.
    All four tests were run individually; tick and liveness both die at the
    same `front_desk_supervisor.bb:98:1` frame, fleet_creds shows the same
    missing-artifact symptom, and the refusal test was proven green by adding
    only the two missing libs. One cause, verified per file - which is why this
    is one ticket and not four. A shared symptom alone would not have been
    enough to merge them.
  - [2026-08-29] specifier: the second-order defect, recorded so it is not lost.
    BL-973 guards five fixtures through a hand-enumerated `FIXTURES` map and a
    five-row Examples table. Nothing detects a sixth fixture that copies .bb
    files and is never enrolled - which is exactly how these four rotted while
    the guard sat green beside them. Deriving that membership (e.g. by finding
    every fixture that builds a .bb root) would close the class rather than the
    instance. Deliberately not folded in here; worth its own slice once this
    one lands.
  - [2026-08-29] specifier: no `human_approval` requested. This is a
    straightforward defect with a verified fix and no open decision for the
    operator - flagging it would add a wait without adding information.

