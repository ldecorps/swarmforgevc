    the BL-1358 300 s ceiling. The runner's own green is QA's e2e step 1.

qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `for i in $(seq 1 15); do bb swarmforge/scripts/test/bl983_stage_queue_property_runner.bb || echo FAIL; done`
     -> 15 of 15 print `ALL PROPERTIES HOLD` and no FAIL line; every
     `generator coverage:` line shows `:two-seat` >= 6, `:three-seat` >= 3
     and `:all-busy` >= 4 (the unfixed runner fails about 1 run in 10;
     15 green runs of the unfixed runner happen about 1 time in 5, so the
     coverage counts, not the pass count alone, are the evidence).
  2. `PROPERTY_RUNS=9 bb swarmforge/scripts/test/bl983_stage_queue_property_runner.bb`
     twice -> green both times with `:two-seat 6 :three-seat 3` exactly and
     `:all-busy` >= 4 (the quotas fill the whole schedule at 9 draws; the
     unfixed runner cannot pass this).
  3. Acceptance resolving all three scenarios of the feature file.
  4. Break-then-restore: make `seat-schedule` return only three-seat plans;
     step 1's first run fails with
     `generator coverage: two-seat reached only 0 of 16 (floor 6)`; restore.
  5. `git diff main...HEAD --name-only` names the runner, the new lib, the
     step handler, the feature, evidence and the register row removal;
     `swarmforge/scripts/*.bb` outside `test/` is unchanged and the five
     floor literals of scenario 03 are still present in the runner.
  6. `bb swarmforge/scripts/standing_red_register_cli.bb .` after landing
     reports no row for `bl983_stage_queue_property_runner.bb` and
     `"unowned":[]`.

