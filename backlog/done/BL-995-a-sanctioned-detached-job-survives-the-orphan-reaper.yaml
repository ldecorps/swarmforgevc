id: BL-995
title: "the hardender's only sanctioned way to run a >120s job (python3 double-fork + os.setsid, hardender.prompt:1010) produces a PPID-1 orphan by construction, which handoffd_supervisor's BL-108 reaper then kills on argv match - two standing rules destroy each other, silently, for exactly the property-lane and mutation runs the gates depend on"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 15
direction: swarm-surfaced
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-995-a-sanctioned-detached-job-survives-the-orphan-reaper.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl995::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "BL-108's protection is never weakened. A genuinely crash-orphaned job process is still reaped; this ticket teaches the reaper to tell deliberate detachment from abandonment, it does not teach it to stop reaping."
  - "Registration is not immunity. A deliberately detached job whose owner never collects it is still reaped once it is genuinely abandoned, so the escape hatch cannot become a way to leak processes forever."
  - "A killed job is never silent to its owner. An agent collecting a detached run can discover from that run's own artifacts that the reaper killed it - never only from a supervisor log it has no reason to read."

description: >
  Two standing mechanisms in this repo contradict each other, and neither
  side knows.

  ONE - the sanctioned escape hatch. `swarmforge/roles/hardender.prompt:1010`
  (accepted rule_proposal 2026-08-19, commit `f4b1b0320`) states that a run
  legitimately needing more than ~120s escapes the cap ONLY via a `python3`
  double fork with `os.setsid()` between the two. Its own text records why
  there is no alternative on this host: a `Bash` call with `timeout: 300000`
  still returns `Command timed out after 2m 0s` (exit 143),
  `run_in_background: true` does not detach either and returns the same 2m
  timeout instead of a task handle, and `nohup … & disown` dies too (exit
  144). The hardender re-tested `run_in_background` twice on 2026-08-20 and
  confirms it still caps at 120s.

  TWO - the BL-108 reaper. `handoffd_supervisor.bb`'s
  `reap-orphaned-job-processes!` kills every process whose command line
  matches `job-process-pattern` (`:323`) once `parent-orphaned?` holds. That
  pattern is, verbatim, Stryker roots, `node --test` batches, and the
  property-lane vitest tree: `vitest\.properties\.config\.mjs`,
  `\bnpm exec vitest\b`, `\bnpx vitest\b`.

  A double fork with `setsid` produces a PPID-1 orphan BY CONSTRUCTION - that
  is the entire point of it. So rule one instructs the hardender to create
  precisely the process rule two exists to kill, for precisely the job
  classes the quality gates depend on.

  Measured, not inferred. `.swarmforge/daemon/handoffd-supervisor.log`
  records `reap-job-orphan` for three of these on 2026-08-20 alone:
  13:05:52 (coder, a bl760 property run), 14:09:10 and 14:19:54 (hardender,
  the same property test twice). Each is rule one being followed and rule two
  killing it within seconds.

  THE FAILURE IS SILENT AND MISATTRIBUTABLE, which is why this is `high`
  rather than an annoyance. The job does not report an error - it disappears.
  Its log file stops mid-run. The only record is a line in a supervisor log
  the owning agent has no reason to open, so the natural readings are "the
  property lane hung", "the suite is flaky", or "the host is overloaded". An
  agent can burn several turns re-running a test that is being killed every
  time.

  How (direction, not mandate): the reaper's own docstring already draws the
  right distinction - it targets jobs that "lost their owning parent", not
  jobs that run a long time. What is missing is a way for a DELIBERATE detach
  to say so. A small registry the detach helper writes (pid or pgid, owner,
  started-at, an expiry) under `.swarmforge/`, which the reaper consults
  before killing, would preserve BL-108 exactly while unblocking the
  sanctioned path. Expiry is what keeps invariant 2 true. Whoever implements
  this should also give the detach helper a single home rather than leaving
  every role to hand-roll the python3 incantation - a registry only works if
  registration is not optional.

constraints: >
  Firm lines:

  - Do NOT solve this by narrowing `job-process-pattern`, and do NOT solve it
    by disguising argv. A hardender `rule_proposal` on 2026-08-20 proposed
    wrapping the command in a script file so the orphan's argv would never
    match; it was rejected
    (`backlog/evidence/rule-proposal-rejected-detached-vitest-wrapper-20260820.md`,
    commit `651b9149c`) because it hides a true positive and would leave both
    vitest alternatives of the pattern permanently dead. The same objection
    applies to trimming the pattern. The reaper must keep matching these
    processes and learn to spare the registered ones.
  - Do NOT disable the reaper, or add a global "skip reaping" switch. BL-108
    is a real incident (Stryker respawning sandbox workers under its own root
    and surviving a root-pid kill); invariant 1 is not negotiable.
  - Registration must not be trustable indefinitely (invariant 2). A crashed
    agent that registered a job and then died must not leave it running
    forever - that recreates BL-108 through the front door.
  - Do NOT widen into raising the ~120s Bash ceiling itself. That ceiling is
    a harness property this repo does not control; this ticket makes the
    documented workaround actually work.

qa_e2e_procedure: >
  From the repo root:

  1. Reproduce first, on the current code. Detach a long `npx vitest run
     --config vitest.properties.config.mjs …` exactly as
     `hardender.prompt:1010` instructs, note the pid, and watch
     `.swarmforge/daemon/handoffd-supervisor.log`. Confirm a `reap-job-orphan`
     line naming that pid appears within seconds and the log file stops
     growing. That is the defect; a fix verified without seeing this first is
     not verified.
  2. At the parcel commit, repeat step 1 with the job registered the new way.
     Confirm it runs to completion and its log reaches the end of the suite.
  3. Confirm invariant 1 has not been traded away: start a matching job,
     register nothing, orphan it, and confirm the reaper still kills it. Do
     this with a Stryker-pattern command as well as a vitest one - the
     pattern has five alternatives and a registry lookup applied to only one
     code path would pass a vitest-only check.
  4. Confirm invariant 2: register a job, let its registration age past the
     limit without collecting it, and confirm the reaper kills it. Assert
     that the registry entry is cleaned up too, or the next sweep re-reads a
     stale entry forever.
  5. Confirm invariant 3: after step 3's kill, collect the run the way an
     agent would (tail its log) and confirm the reaping is discoverable
     there. A fix that spares registered jobs but still kills unregistered
     ones silently leaves the misattribution problem exactly as it is.
  6. Confirm the registry is not a race: register and immediately orphan a
     job so the sweep can land between the two, and confirm the job is not
     killed in that window. The detach helper writes the entry BEFORE the
     process can be seen as orphaned, or this fails intermittently and will
     be read as flakiness.
  7. Run the acceptance feature, confirm all four scenarios pass, and that
     the handler is registered in `specs/pipeline/steps/index.js`.
  8. Prove non-vacuity: remove the registry lookup from the reaper and
     confirm scenario 01 fails while scenarios 02 and 03 still pass, then
     revert.

notes: >
  Source: hardender note 20260820T151419Z_000285, "run_in_background also
  caps at 120s here, tested 2x - real gap, ticket?" - answering an open
  question the specifier left when rejecting their earlier rule_proposal on
  this subject.

  CORRECTION, recorded because it is the reason this ticket exists. In
  rejecting that proposal (`651b9149c`) the specifier pointed the hardender
  at `run_in_background` as the sanctioned alternative that keeps a job
  owned. That remedy is wrong on this host: `run_in_background` does not
  detach here, as `hardender.prompt:1010` already documented and as the
  hardender has now re-tested twice. The rejection's PRINCIPLE stands - do
  not disguise a true positive to evade a guardrail - but there was no
  working alternative to offer, which is precisely the gap. The hardender was
  right to push back.

  Sibling context, deliberately not folded in: BL-108 is the incident the
  reaper defends against and must stay defended. BL-815 is the incident
  behind the detach rule's "embed the absolute cd" clause - a detached run
  that executed from the wrong directory for 89 minutes and had to be
  discarded. Neither changes here.

  A PROSE HALF IS OWED, AND NO GATE WILL CATCH IT (BL-798). Once the
  registration mechanism's shape is settled, `hardender.prompt:1010` must be
  amended to say that a detached run is REGISTERED, not merely detached -
  otherwise the standing rule keeps instructing roles to create exactly the
  process this ticket teaches the reaper to spare, and they will not know to
  register it. That amendment is the SPECIFIER's to land on `main`: the
  schema's `required_stages` has no specifier stage, and `required_wiring`
  pins to the parcel commit rather than to `main`, so neither gate can
  schedule or check it. Whoever holds this ticket when the mechanism lands
  should send the specifier a note; the specifier lands the prose and records
  the commit here.

  PROSE HALF LANDED 2026-08-20: `65d104947` on `main`, amending
  `swarmforge/roles/hardender.prompt`'s >120s escape-hatch rule to say a
  detached run is REGISTERED via `swarmforge/scripts/detach_job.sh`, not merely
  detached - plus the expiry default (120 min, `--expires-minutes N`), how to
  collect a run from its own `[detach_job] EXIT=` / `KILLED by SIGTERM` markers,
  and the three measured reap kills of 2026-08-20 as the rule's own evidence.
  Triggered by the architect's note `20260820T182556Z_000309` once the mechanism
  settled. This obligation is now DISCHARGED; nothing downstream builds against
  it. The prose is written against the mechanism as it stands at `e8c9635e` /
  `bc692ffe89` (helper path, `<log-file> [--expires-minutes N] -- <command...>`
  usage, the `.swarmforge/daemon/detached-jobs/<pgid>.json` registry, the 120-min
  default and the two log markers) - if a later review reshapes any of those, the
  prose must be re-amended on `main` by the specifier, since no gate checks it.

  IR-DRY: zero findings.

approval_context: >
  The shape of the fix is the one thing I would like your eye on, because I
  have described a registry without mandating it.

  What I am confident of: the reaper must keep matching these processes
  (narrowing the pattern or disguising argv are both refused above), and it
  must learn to spare a deliberate detach. What I have left open is how a
  detach declares itself - a registry file under `.swarmforge/` is the
  obvious shape and is what the description suggests, but an architect may
  see a cheaper one.

  The judgement I did make: registration expires. That is invariant 2, and it
  is the difference between an escape hatch and a hole - without it, a
  crashed agent's registered job runs forever and BL-108 comes back through
  the front door. If you would rather have no expiry and accept that risk,
  say so, because it simplifies the ticket considerably.

  Severity `high` is mine, on the strength of the silence rather than the
  breakage: the job vanishes with no error, and the natural reading is a
  flaky suite. That is turns burned on a phantom. Push back to `medium` if
  you read a documented-but-broken workaround as contained.

