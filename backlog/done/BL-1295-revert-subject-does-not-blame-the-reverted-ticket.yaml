id: BL-1295
title: "A revert commit inherits its reverted ticket's subject, so the send-time scope gate blames that ticket for the revert's foreign paths and refuses the handoff"
milestone: M8
type: defect
severity: high
status: blocked
epic: swarm-reliability
priority: 12
direction: agent-reported
depends_on: []
mutation_cost: low
slice_size_envelope: low
