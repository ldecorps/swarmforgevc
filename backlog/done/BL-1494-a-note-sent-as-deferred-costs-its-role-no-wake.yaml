id: BL-1494
title: "A note the post-QA branch sweep sends as deferred wakes its role at delivery anyway: BL-1361's ruling was wake only for a dirty worktree, its tell! sets SWARMFORGE_SKIP_SYNC_INJECT so the SEND does not wake, but handoffd's own delivery hop injects the standard wake for every new parcel, so each divergent-branch note costs the role a merge-up turn - 28 such notes to cleaner alone in four hours on 2026-09-08, one merge commit every three to five minutes, four or five wakes per landed bookkeeping commit across the pipeline; a note sent as deferred carries wake: defer and neither the delivery hop nor the chase sweep injects for it"
