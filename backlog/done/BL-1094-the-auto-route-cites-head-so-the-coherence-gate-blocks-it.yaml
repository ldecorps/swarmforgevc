id: BL-1094
title: "The dispatch-gap auto-route cites HEAD as its commit, and the BL-953 coherence gate then refuses it because HEAD's subject names a different ticket - so the daemon's third duty has succeeded once in 29 attempts, and that once was a coincidence"
type: defect
severity: high
# high: a whole daemon duty is non-functional and has been silently retrying
# rather than failing loudly - 28 errors to 1 success in the live log, and the
# single success only because HEAD's subject happened to name the very ticket
# being routed at that instant. Active tickets with no dispatch never get one.
# Not critical: nothing is lost or corrupted and a coordinator can route by
# hand, which is what has been masking it.
status: todo
epic: swarm-reliability
assigned_to: coder
priority: 8
direction: swarm-surfaced
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1094-the-auto-route-cites-head-so-the-coherence-gate-blocks-it.feature
human_approval: approved
approval_context: >
  Firm: the auto-route must be able to succeed. Today it structurally cannot,
  except by coincidence.

  Your call is WHICH of two correct-looking fixes, and they are not equivalent:

  (a) Exempt the daemon's own generated auto-route from the BL-953 coherence
  gate. The gate exists to catch a human reusing a stale draft where the task:
  and commit: lines disagree. A machine-generated dispatch parcel has no such
  risk - its commit is "current tip", not "the work for this ticket". Narrow
  and honest, but it does put a bypass in a gate.

  (b) Stop sending a git_handoff for a dispatch gap and send a note instead.
  Simpler, no bypass - but `dispatch-gap-draft-lines` deliberately chose
  git_handoff so the assignee gets merge_and_process and a task id rather than
  "a soft note the agent can narrate and idle on", which is a real concern the
  original author wrote down. This would give that back up.

  I lean (a): it keeps the delivery semantics the author chose and confines the
  change to the one caller whose commit is genuinely not ticket-specific. But
  (b) is defensible and I would rather you picked.
invariants:
  - A handoff the daemon generates for itself is one the daemon's own validator will accept - no generated parcel is refused by a gate written for hand-authored drafts.
  - A gate that refuses a parcel says which gate refused it and why, in the log line the operator will actually read.
description: >
  WHAT: `dispatch-gap-draft-lines` (`swarmforge/scripts/chase_sweep_lib.bb`)
  emits `commit: <HEAD>` - handoffd's `auto-route!` supplies HEAD. The BL-953
  task/commit coherence gate in `swarm_handoff.bb` then reads HEAD's SUBJECT,
  extracts the ticket ids it names, and refuses the send when the task's
  ticket is not among them (`task_commit_coherence_gate_lib/blocked?`).

  Because this swarm commits per-ticket, HEAD's subject almost always names
  exactly one ticket - some other ticket. So the auto-route is refused almost
  every time it fires, for every gapped ticket, regardless of assignee.

  EVIDENCE, live 2026-08-23: `.swarmforge/daemon/handoffd.log` holds 28
  `dispatch-gap-autoroute-error` lines against ONE success. The one success is
  the proof rather than the exception: `dispatch-gap-autoroute BL-1078
  specifier git_handoff` fired in the ~30-second window when HEAD was the
  specifier's own commit `0d2440c18e`, whose subject
  "BL-1078/1079/1080: write the missing acceptance feature files" resolves to
  the id list ("BL-1078") - so the gate found the task's id among the commit's
  and allowed it. The sibling drafts for BL-1079 and BL-1080, sent seconds
  later against the SAME commit, were both refused - `extract-ticket-ids`
  reads only the prefixed "BL-1078" from that subject, not the bare
  "/1079/1080". Confirmed directly against the gate library.

  WHY the gate is not itself wrong: BL-953's premise is that a git_handoff's
  commit IS the work for its task, so a disagreement means a stale reused
  draft. That premise holds for every hand-authored hop and does not hold for
  this one machine-generated parcel, whose commit is only "current tip". The
  gate is right; the generated parcel is what does not fit it. It is also
  correctly fail-open when a subject names no ticket at all, which is why this
  never shows up in a fixture whose commits have plain subjects.

  How (direction, not mandate): see approval_context - either exempt the
  generated auto-route from the coherence gate, or change what it sends. Do
  not "fix" this by loosening `blocked?` for everyone; that would disarm the
  stale-draft catch the gate exists for.

  RELATIONSHIP TO BL-1086: separate and BOTH real. BL-1086 is the recipient
  half - a ticket whose assigned_to names nobody emits `to: none`, which the
  recipient validator rejects before coherence is ever consulted. Fixing
  BL-1086 alone leaves BL-1079/BL-1080 blocked here; fixing this alone leaves
  BL-777/BL-844/BL-845 rejected there. Neither subsumes the other.
qa_e2e_procedure: >
  1. Fixture with an active ticket that has no dispatch trail and a real
     assignee. Make HEAD a commit whose subject names a DIFFERENT ticket.
  2. Run the dispatch-gap sweep. Before the fix the send is refused; after, the
     assignee receives the parcel. This is the defect in one step.
  3. HEAD whose subject names NO ticket - must still succeed (the gate's
     fail-open path, so the fix is not merely masking).
  4. HEAD whose subject names the routed ticket - must still succeed.
  5. The stale-draft catch must survive: a HAND-authored git_handoff whose
     task: and commit: genuinely disagree is still refused by BL-953. A fix
     that makes step 5 pass has disarmed the gate.
  6. Live: `grep dispatch-gap-autoroute .swarmforge/daemon/handoffd.log | tail`
     shows successes as the ordinary case, not one in twenty-nine.
notes: >
  Found 2026-08-23 while investigating a coder note about misroutes. The note
  reported "4 misroutes: active tickets keep mint status:todo assigned_to:coder
  forever"; running the sweep showed the four `assigned_to: coder` actives all
  HAVE dispatch trails and are correctly left alone, and that the real gap set
  was six tickets failing for two different reasons, neither of them the one
  reported. This ticket is the larger of the two.

  The single logged success was self-inflicted and is worth recording so it is
  not mistaken for the mechanism working: the specifier had just committed
  BL-1078's feature file, which briefly made HEAD's subject name BL-1078. A
  reader scanning the log for "does auto-route ever work" would find that line
  and conclude it does.

