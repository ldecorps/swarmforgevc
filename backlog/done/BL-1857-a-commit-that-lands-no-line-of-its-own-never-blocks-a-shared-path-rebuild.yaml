id: BL-1857
title: "A commit that lands no line of its own never blocks a shared-path rebuild - BL-1830's land step refuses any land whose shared own path an untagged commit touched, and QA's bounce restores carry no ticket id by rule and stay in every later land's range, so every land sharing a path with an in-flight sibling escalates (BL-1842, 2026-10-01); an untagged commit whose every added line on the path is either on origin/main's copy or absent from the landing commit's copy is left out of the attribution, and any other untagged touch still refuses by name"
