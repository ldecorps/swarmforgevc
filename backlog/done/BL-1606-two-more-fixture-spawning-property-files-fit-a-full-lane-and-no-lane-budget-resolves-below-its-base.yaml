  - Cutting either file's cost (bl968's cells are already iterated once
    each, BL-1450; bl1304's spawns are the property).
  - The other 79 bare sites (BL-1596, which depends on this ticket and
    finds these two files already migrated).
  - The unit lane's contention rule (BL-1607, same pass, owns bl1277).
  - Files with no per-test timeout other than bl1304 (each is its own
    unowned-red note).

qa_e2e_procedure: |
  On the parcel commit, from `extension/`, after `npm run compile`:
  1. `for i in $(seq 1 20); do npx vitest run --config vitest.properties.config.mjs test/bl1304DryRunSpawnsNothing.property.test.js || echo FAIL; done`
     -> 20 of 20 green; the same for bl968MaterializedGuardSensitivity 5
     times (about 50 s each alone).
  2. `npm run test:properties` 3 times -> both files green in every run;
     any other timeout recorded with its text and raised as an
     unowned-red note if it is not one of these two files.
  3. `node -e "const h=require('./test/helpers/propertyLaneContentionBudget');console.log(h.propertyLaneTimeoutMs(240000,{forksFn:()=>9,loadavg1mFn:()=>1.8}), h.propertyLaneTimeoutMs(20000,{forksFn:()=>8,loadavg1mFn:()=>1.8}))"`
     -> first number above 240000, second exactly 40000.
  4. Acceptance resolving all four scenarios
     (`specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1606-*.feature`).
  5. `git diff <parent>..<parcel> -- test/bl1304DryRunSpawnsNothing.property.test.js test/bl968MaterializedGuardSensitivity.property.test.js | grep -E '^-' | grep -vE '^---'`
     shows only the bare `240000` line (invariant 2: bl1304 removes
     nothing).
  6. After landing, `bb swarmforge/scripts/standing_red_register_cli.bb .`
     reports no row for either file and `"unowned":[]`, and
     `swarmforge/scripts/property_suite_standing_allowlist.tsv` carries no
     row for either.

