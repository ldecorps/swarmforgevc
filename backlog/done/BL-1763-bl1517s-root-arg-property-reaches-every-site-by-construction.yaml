description: |
  ## What is wrong

  `extension/test/bl1517ProjectRootArgInvariants.property.test.js`:
  property 1 draws `fc.constantFrom(...SITES)` (six wired sites) and a
  bad-argument shape (two), `numRuns: 30`, then asserts
  `seenSites.size === SITES.length` and `seenShapes.size === 2`. Property
  2 draws `fc.constantFrom(...HARNESSES)` (three), `numRuns: 15`, then
  asserts all three. A uniform draw misses at least one of six sites in
  30 runs with probability 0.025, and one of three harnesses in 15 runs
  with probability 0.007. QA's `npm run test:properties` on the BL-1744
  parcel (21a188d947, load 12.55) failed property 1: "expected the
  generator to reach every site, reached:
  ["operator_runtime.bb","expedite_cli.bb","dropped_parcel_sweep_harness.bb","dispatch_gap_sweep_harness.bb","main_sync_status_cli.bb"]"
  (QA evidence 01b2e061f7). commit_integrity_856_scenarios_cli.bb was
  never drawn.

  `sampled_reach_floor_census_cli.bb` reads the file as `no-floor 15`:
  a floor written as an equality on a Set's size is a third shape the
  classifier does not see (after BL-1760's `{ numRuns }` shorthand and
  BL-1762's local helper), recorded on epic BL-1583.

  ## What is wanted

  - Both properties iterate their sites (and bad-argument shapes, and
    harnesses) as cells with `runsPerCell` draws each, and assert the
    floors through `assertReachFloor`, as BL-1583's sweeps did.
  - The census then reads the file `constructed` (scenario 02).
  - Each site spawns a real bb process per draw, so keep the per-cell
    draw count as small as `runsPerCell` allows. The file's wall time
    must not grow past its current budget; record before and after in
    evidence.

  ## Scope

  - `extension/test/bl1517ProjectRootArgInvariants.property.test.js`
    (+ evidence).
  - New: `specs/pipeline/steps/bl1763Bl1517ReachFloorsSteps.js`. Reuse
    BL-1691's step functions.
  - Out of scope: the census classifier (BL-1583 remaining slice); the
    wired scripts themselves (no production change).

constraints: >
  The parcel never edits backlog/standing-reds.tsv (BL-1663); its land
  retires the row (BL-1631).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1763-bl1517s-root-arg-property-reaches-every-site-by-construction.feature`:
     2 of 2.
  2. `cd extension && npx vitest run --config vitest.properties.config.mjs test/bl1517ProjectRootArgInvariants.property.test.js`:
     green; its duration is recorded next to the evidence's before figure.
  3. The register row for the file names BL-1763 on the parcel commit.
  4. `git diff main...HEAD --name-only` names only the test file, the
     step handler, its registration and evidence.
  5. After the land: REGISTER_ROW_RETIRED for
     `extension/test/bl1517ProjectRootArgInvariants.property.test.js`.

