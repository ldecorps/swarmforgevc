approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: the shipped-scan test's
  budget is resolveUnitLaneTimeout from a 20000 ms base (BL-1007's helper,
  the unit lane's own contention rule, capped at its 120 s ceiling), so a
  quiet host keeps 20 s (invariant 1); no assertion is weakened, the scan
  still requires every shipped handler. FIRM: the file's 23.6 s wall is
  also a BL-378 pole and stays in BL-1598's register owned by BL-791;
  cutting the scan's cost is slice D work, not this ticket's.

invariants:
  - "The shipped-scan test on a quiet host (contention factor at or under 1) receives exactly its 20000 ms base: the budget grows only with recorded contention, never by a bare raise."

description: |
  ## What is wrong

  Specifier run of `npm test` on 2026-09-16 (20 cores, 9 forks, 1-minute
  load 10.8): `bl1277UnscopedStepCollisionGuard.test.js > the shipped step
  files register no colliding unscoped pattern` failed after 23537 ms
  (vitest renders the timeout as `Error: STACK_TRACE_ERROR` at line 108,
  the test's own declaration); the file's other five tests passed in under
  30 ms. `shippedCollisionVerdict()` (`extension/test/helpers/stepCollisionGuard.js`)
  requires every file under `specs/pipeline/steps/` through the real
  registry - about 940 handlers - so its cost is the module graph's, and
  under swarm load it crosses the lane's flat `testTimeout: 20000`. QA's
  full `npm test` the same morning (BL-1589-QA-20260916.md, lower load)
  had it green: load-dependent, not deterministic. No owner, no register
  row.

  ## What is wanted

  - The shipped-scan `it(` carries a budget derived through
    `resolveUnitLaneTimeout(20000)` from `specs/pipeline/steps/lib/contentionBudget.js`
    (the helper `extension/vitest.config.mjs` already reaches), never a
    bare literal (scenario 01, source-level).
  - The derivation yields exactly 20000 at factor 1, more under
    contention, and never above the helper's ceiling (scenario 02,
    pure injection).
  - The register row removed in the same land; 20 of 20 green alone and
    3 of 3 full `npm test` runs green for this file (e2e).

  ## How (direction, not mandate)

  - `const { resolveUnitLaneTimeout } = require('../../specs/pipeline/steps/lib/contentionBudget');`
    and `resolveUnitLaneTimeout(20000).effectiveMs` as the third argument
    of that one `it(` - the same seam the property lane's helper wraps.
  - Scenario 01 reads the file's source: exactly one per-test timeout is
    declared, on the shipped-scan test, through the helper from 20000.
  - Documenter: nothing beyond evidence; no diagram trigger.

constraints: >
  One test file and evidence; the helper and the scan's assertions
  unchanged; no numRuns, no skip. The step handler lands with the feature
  (BL-233). Evidence named BL-1600-*.

out_of_scope: |
  - Cutting the scan's cost (BL-791 slice D pole work; the file is in
    BL-1598's register).
  - Any other unit-lane timeout under load: its own unowned-red note.

qa_e2e_procedure: |
  From `extension/` on the parcel commit:
  1. `for i in $(seq 1 20); do npx vitest run test/bl1277UnscopedStepCollisionGuard.test.js || echo FAIL; done` -> 20 of 20 green.
  2. `npm test` 3 times -> the file green in every run.
  3. Acceptance resolving both scenarios.
  4. `bb swarmforge/scripts/standing_red_register_cli.bb .` after landing
     reports no row for the file and `"unowned":[]`.

