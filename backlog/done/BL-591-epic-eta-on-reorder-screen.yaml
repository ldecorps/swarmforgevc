id: BL-591
title: "Epic reorder screen shows a velocity-based ETA per epic — honestly ranged, pack-aware, and never a confident number for blocked work"
milestone: M8
type: feature
status: todo
epic: swarmforge-console
human_approval: approved
severity: medium
priority: 56
direction: human-requested
depends_on: [BL-572]
assigned_to: coder
mutation_cost: medium
invariants:
  - "Every velocity-derived ETA the state feed emits is a range (low strictly below high) carrying a non-empty pace assumption naming pack and trailing window — no code path emits a single-point date or duration."
  - "Weight from a child that cannot start (held in backlog/hold/, status blocked or needs_design, or non-empty promotion_blockers/block_until) never contributes to any velocity-derived duration; every range is a function of buildable weight only."
  - "The estimator is total and pure: for every input — zero velocity, zero children, empty window included — it returns a typed state and never throws, and no NaN or Infinity reaches the state feed."
required_wiring:
  - "extension/src/bridge/bridgeServer.ts::epicEta::the reorder state feed must fold the estimator's per-epic output into its items — a green estimator wired into nothing is the BL-419 shape"
  - "extension/src/bridge/epicReorderUiHtml.ts::paceAssumption::the tile must actually render the range, blocked count, confidence and pace assumption"
source: |
  Human, 2026-07-23, after asking for the intelligence layer's ETA and being
  given a velocity-grounded range: "can we have, as a new mini app screen, an
  estimated ETA for all the upcoming Epics? ... In this screen [the epic
  reorder screen], can I see the best estimate (based on current velocity) for
  each of the epics?"

  Folded onto BL-572's epic reorder screen rather than a separate screen, per
  the human's own "In this screen" - one epic surface, tiles that both reorder
  AND forecast.

description: |
  ## What it adds

  BL-572 renders one tile per epic in priority order and lets the human
  reorder them. This ticket adds, to each tile, a best-estimate ETA for that
  epic based on the swarm's recent completion velocity - so the reorder
  decision is made against "how long is each of these", not just their names.

  It is display-and-estimate only. It changes no scheduling, promotes nothing,
  and does not gate any build. The number informs the human; it does not steer
  the swarm.

  ## Why a naive "velocity x remaining" number would LIE - the hard part

  The operator computed this by hand on 2026-07-23 and the honest answer needed
  four corrections that a naive estimate omits. The screen must not omit them.

  1. **Pack dependence is the dominant term.** Measured throughput was 16-54
     tickets/day on the full 7-pack (Jul 12-17) and 3-4/day on the mono-router
     (Jul 18-23) - a ~5x swing from the pack alone, dwarfing every other
     factor. An ETA that does not name which pack it assumes is close to
     meaningless. The tile must state the assumption (e.g. "~3 wks at current
     mono-router pace") and ideally show how it shifts under the faster pack.

  2. **Blocked / design-gated children have NO throughput ETA.** Some children
     are `status: hold`, `needs_design`, or carry `promotion_blockers` /
     `block_until` (e.g. BL-548 is human-blocked until GH-22/23 land). Their
     completion is not velocity-limited and no velocity number describes it.
     These MUST render as a distinct state ("blocked", "needs ruling",
     "designing") - never folded into a duration, which would forecast work
     that cannot start.

  3. **Remaining work is child SLICES, not the epic tracker.** An epic's
     remaining size is the sum over its open children (active + paused + hold),
     weighted by `mutation_cost` (low/medium/high are materially different
     durations), NOT a count of tickets and NOT the umbrella tracker itself
     (which is `type: epic`, never built directly). A done child contributes 0;
     a high-cost open child contributes far more than a low-cost one.

  4. **Velocity is noisy - a point estimate is false precision.** The daily
     rate ranged 3-54 over two weeks. Show a RANGE or a confidence band, not a
     single date. "~2-4 weeks" is honest; "ready Aug 14" is not.

  ## Data source (a real dependency, name it)

  There is no `completed_at` field on a done ticket. Completion velocity has to
  come from the git history of when each `backlog/done/BL-*.yaml` was ADDED
  (the same `git log --diff-filter=A` the operator used by hand), over a
  trailing window. `burnRate.ts` does NOT provide this - it measures TOKEN
  burn, a different quantity. So this needs either:
    - a small new velocity estimator (completions/day over a trailing window,
      from git), plus a per-epic remaining-cost roll-up, OR
    - a precomputed sidecar the bridge reads (like the cost/health sidecar),
      if running git log from the live bridge per request is too heavy.
  The specifier picks; the estimator itself is a PURE function (completions +
  remaining-cost + window -> ranged ETA) that is unit-testable without git or a
  bridge, mirroring how burnRate/costTelemetry already split pure-from-impure.

  ## Confidence must be visible

  Each epic's ETA carries a confidence that the tile shows, driven by: how
  blocked its children are, how noisy recent velocity is, and how much of its
  remaining weight is high-cost or not-yet-designed. An all-ready epic on
  steady velocity is high confidence; an epic that is mostly needs_design or
  human-blocked is low, and the tile should say why in a word, not fake a date.

acceptance: specs/features/BL-591-epic-eta-on-reorder-screen.feature

qa_e2e: |
  QA sanity-checks the live number against a hand count for at least one
  epic, since a plausible-but-wrong ETA is worse than none. Procedure:
  open the reorder screen on the live Mini App console; pick one epic
  (BL-545 swarm-intelligence-layer is the reference - the operator's
  2026-07-23 hand figures exist); hand-count its open children
  (active+paused+hold) and their mutation_cost weights from the backlog
  YAMLs, and completions in the trailing window from
  `git log --diff-filter=A --since=<window> -- backlog/done/`; verify the
  tile's range, blocked-child count, confidence, and pace label are
  consistent with the hand count; verify an epic with blocked children
  surfaces them distinctly rather than folding them into the duration.

notes: |
  Specifier decisions (2026-08-20, while speccing the acceptance contract):

  - Data source (the choice the description delegated): a NEW pure
    estimator, mirroring burnRate.ts's own pure/impure split. The pure
    function lives in extension/src/metrics/epicEta.ts and maps
    (completion events, the epic's open children with their
    mutation_cost/blocked markers, an injected nowMs + trailing window, a
    pace label naming pack + window) -> a typed per-epic tile state
    {complete | blocked | no-recent-pace | ranged ETA + blocked count +
    confidence}. The impure collector derives completion events from the
    git history of when backlog/done/BL-*.yaml files were ADDED
    (`git log --diff-filter=A` - same approach leanLedgerComposeClose.ts
    already uses), and MUST NOT spawn git per /epic-reorder-state poll:
    cache with a TTL in the bridge process or precompute a sidecar -
    implementer's choice (direction, not mandate).
  - Wiring: computeEpicReorderState folds the estimator output into its
    `items` entries; epicReorderUiHtml.ts renders range, blocked count,
    confidence, and pace assumption. The module name epicEta and the
    payload field paceAssumption are LOAD-BEARING - required_wiring
    anchors on those literals (BL-874: plain substring match), so renaming
    them means the documenter->QA handoff gate fails.
  - Child membership reuses the reorder screen's existing epic-membership
    helpers (readWithinEpicLiveBacklogItems + computeEpicTopics, spanning
    active+paused+hold, slug-resolved per BL-686/BL-687) - do not invent a
    second membership notion.
  - Blocked predicate (checkable): held in backlog/hold/, or
    status: blocked, or status: needs_design, or non-empty
    promotion_blockers, or non-empty block_until.
  - Weights: low < medium < high, strictly monotonic; a child with no
    mutation_cost counts at the medium weight; exact values negotiable.
  - The description's "ideally show how it shifts under the faster pack"
    is NOT gated - naming the pack the estimate rests on is gated
    (epic-eta-01); a second-pack projection is a welcome extra, not a
    scenario.
  - Each invariant needs a coder-authored property test in the same parcel
    (BL-654); invariant 3 is the natural property-based-test target
    (generator over degenerate inputs: empty windows, zero velocity, zero
    children, all-blocked).

out_of_scope: |
  - The reorder interaction itself (BL-572 owns it; this only adds a readout
    to its tiles).
  - Any change to promotion order or scheduling from the ETA. It is advisory.
  - Per-TICKET ETAs. This is per-epic; ticket-level estimation is a separate
    concern if ever wanted.
  - Predicting the human-gated unblock dates (e.g. when GH-22/23 will land).
    A blocked child is shown as blocked, full stop - the screen does not
    forecast when a human will act.
