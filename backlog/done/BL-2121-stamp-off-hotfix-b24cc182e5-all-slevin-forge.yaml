description: |
  Status: hotfix b24cc182e5 landed the pack and launcher. The coder
  reviews it and never re-applies it.

  The human asked for the standing forge with Slevin on every seat and
  the coordinator (not Claude). Hotfix adds:

  - `swarmforge/packs/ollama-slevin-local-model-forge.conf` — BL-2078
    capped standing forge (no rotation router, depth 3),
    `coordinator_agent local-model` on
    prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest,
    same model on all seven window lines.
  - `start-swarm-ollama-slevin-local-model-forge.sh` — staffing + pack-shape
    gates, pins `PACK_STAFFING_SKIP_GATE=1` via `exec env` so a Cursor
    sandbox restore of the literal `${PACK_STAFFING_SKIP_GATE:-1}` cannot
    leave the gate seeing a non-"1" value.

  This is not the same architecture as `ollama-slevin-mono-router` (one
  resident + coordinator, depth 1). Both share the live Ollama server's
  `OLLAMA_NUM_PARALLEL=2`; the forge still serialises decode through the
  shim slot.

  The review asks: does the pack still classify as capped-forge and pass
  the BL-1142/BL-2078 gate with the shim on? Does the launcher refuse
  cleanly when the -novision alias is missing? Does the coordinator
  launch script bake local-model/Slevin (never Claude) when this pack is
  selected?

qa_e2e_procedure: |
  On the parcel commit, ONE run.
  1. `bash swarmforge/scripts/local_ollama_pack_shape_gate.sh . ollama-slevin-local-model-forge`:
     exits 0 and names capped-forge / standing forge (shim on).
  2. `SWARMFORGE_LOCAL_MODEL_SHIM=off bash swarmforge/scripts/local_ollama_pack_shape_gate.sh . ollama-slevin-local-model-forge`:
     exits non-zero naming the missing decode slot.
  3. Read the coder's committed review: pack has no `rotation router`,
     depth 3, coordinator_agent local-model + Slevin model on coord and
     every window; start script pins PACK_STAFFING_SKIP_GATE=1.

