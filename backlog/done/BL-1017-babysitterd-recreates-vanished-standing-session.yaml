  to be restored (intentional seat removal, 2026-08-21 operator directive), and
  the live specifier that came back at 09:25 is not to be bounced.

  IR-DRY: two near-duplicate findings remain on the feature file and are
  deliberate - "should stand" vs "should not stand", and the same
  pane-does-not-exist precondition under two different role names. Both ARE the
  discriminators the scenarios exist to assert; collapsing either would destroy
  the contrast. A third finding (two phrasings of the same negative assertion)
  was real and was fixed before the file was treated as final.

