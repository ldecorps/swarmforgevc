id: BL-1017
title: "A standing-pack role session that vanishes is recreated by the sweep, not merely CRIT-ed about, so one dead pane no longer needs a full start-swarm"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
priority: 12
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1017-babysitterd-recreates-vanished-standing-session.feature

required_wiring:
  - "swarmforge/scripts/babysitter_check.bb::check-live-session::the repair decision must be CONSUMED by the live sweep caller, not merely returned by the lib - this is the BL-419 shape (mechanism built, wired nowhere) and the reason this field is declared at all. Anchored on an existing literal per BL-874, deliberately: the new decision key is the implementer's to name, and arming the gate against a name nobody has written yet is a false block, not a check."

invariants:
  - "A repair is only ever proposed for a role the topology says should stand: the should-stand? suppression covers the repair branch exactly as it already covers the CRIT branch, so a mono-router non-resident is never resurrected as if it were standing."
  - "Repair is bounded: no role can be issued more than the configured attempts inside the cooldown window, so a session that cannot be recreated degrades to plain alerting rather than a respawn storm."

description: >
  WHAT. babysitterd_sweep_lib.bb's check-live-session (line ~45) emits
  `{:severity "CRIT" :message "swarmforge-<role>: tmux session missing"}` and
  stops there. Nothing recreates the session. A standing full-forge role that
  vanishes therefore stays gone until a human runs a full ./start-swarm.sh,
  which recreates all eight sessions - a far broader action than the fault, and
  the very thing that made the 2026-08-21 incident worse. Add a bounded REPAIR
  decision alongside the CRIT, executed through the daemon's existing
  single-role launch path.

  WHY NOW. babysitterd has been logging this as a RECURRING CRIT, not a one-off:
  `swarmforge-specifier: tmux session missing` on 2026-08-19 (many times),
  2026-08-20, and 2026-08-21 08:25Z. When the vanished role is the SPECIFIER the
  cost compounds - intake stops, the backlog root stops draining, and nothing
  else in the pipeline notices, because every other role is healthy.

  VERIFIED AT SPEC TIME, not assumed. check-live-session is the live emitter of
  that CRIT string, and babysitter_check.bb is its live consumer
  (babysitterd_sweep_lib.bb:380 dispatches it; babysitter_check.bb:687 is the
  caller-side gather that supplies :should-stand?). The decision layer is pure -
  it takes a map and returns a map - so this slice is fully unit-testable in the
  Babashka suite without a live tmux, which is what keeps it inside the
  testability boundary.

  How (direction, not mandate). The natural shape is for check-live-session to
  return a repair intent next to the CRIT rather than instead of it - the alert
  must NOT be swallowed by a successful repair, because a session that keeps
  vanishing is a signal worth keeping. Bounding (attempt count, cooldown window)
  and the shape of the intent are the implementer's call; both invariants above
  are constraints on whatever shape is chosen.

  SCOPE BOUNDARY. This ticket is "the session is not recreated". It is NOT "the
  recreate itself is dangerous" - that is BL-1018, which constrains what a
  single-role repair may resolve to, and which this slice's repair path will
  depend on being correct. They are separable and independently valuable: this
  one can land and be gated on its own decision output, and BL-1018 hardens the
  execution surface underneath it. Do not fold them.

qa_e2e_procedure: >
  1. Run the feature's four scenarios against the pure decision function - a
     standing role with no pane yields CRIT plus repair; a should-not-stand role
     yields neither; a present pane never yields a session-recreate repair for
     any of the three process states; a role inside the cooldown yields CRIT but
     no second repair.
  2. Confirm the CRIT is still emitted in the repair case (scenario 01). A
     repair that silences the alert would hide a recurring fault, which is the
     opposite of what this ticket is for.
  3. Wiring check, not a unit check: confirm the repair decision is actually
     read and acted on by the live caller in babysitter_check.bb. A lib that
     returns a repair nobody consumes is the BL-419 failure this ticket names.
  4. Live confirmation on a real pack, recorded as a manual procedure since live
     tmux is outside the unit boundary: kill ONE standing role's tmux session,
     wait for the next sweep, and confirm (a) that role's session comes back,
     (b) no other session was touched - capture the full session list before and
     after, and (c) handoffd is still alive afterwards.
  5. Confirm `./attach-swarm.sh <role>` succeeds for that role after the repair.

