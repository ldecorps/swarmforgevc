id: BL-1269
title: "The pre-QA ancestry gate credits a merge with both parents' changes, so any main-sync commit naming a ticket blocks every forward and demands a merge another guard refuses"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 5
direction: swarm-reported
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1269-ancestry-evidence-is-the-commits-own-contribution.feature

required_wiring:
  - 'swarmforge/scripts/pre_qa_gate_gather_lib.bb::BL-1269::the evidence-path change must land in the gather lib that actually computes candidate paths, marked with this ticket id at the site it fixes'
  - 'specs/pipeline/steps/index.js::bl1269::the step handler must be registered in the step registry or the acceptance runner never runs these scenarios'

invariants:
  - "A candidate commit's blocking path evidence is only content that commit itself introduced: for a merge, its combined diff against all parents, never the union of what its parents changed."
  - "The gate never blocks a forward whose only remedy is an action another guard refuses: no ancestry finding names a commit whose merge the BL-1242 deletion guard would reject."

description: >
  Severity rationale: high - a live fault that leaves a parcel holder with
  no legal action at all. Two parcels sat stuck on it in one day and both
  tickets are now in backlog/hold/.

  What is wrong. BL-972 narrowed the pre-QA ancestry check so that a
  subject-only match is a warning and only PATH EVIDENCE blocks. For merge
  commits that evidence is wrong. pre_qa_gate_gather_lib.bb's
  commit-touched-paths runs `git diff-tree -r --name-only -m`, and -m lists
  EACH PARENT's contribution separately - so a routine "merge main into
  <branch>" commit is credited with the entire main-side changeset. On
  559d9bd19a, the commit that blocked BL-1249, that is 104 paths including
  specs/pipeline/steps/index.js, docs/reference/Specification.MD and a
  dozen extension sources. The merge's own contribution, by the combined
  diff (`diff-tree -m --cc`), is 4 backlog YAML paths. Both numbers are
  reproducible on main today.

  Consequence. Any main-sync or park-sweep merge whose subject happens to
  name a ticket id overlaps almost any parcel's paths, so it always
  presents as blocking evidence. BL-972's whole distinction collapses for
  the commit type the swarm produces most often.

  The remedy the gate demands does not exist. The block tells the holder to
  merge the named commit. 559d9bd19a is a batch park sweep that moves six
  tickets' YAML out of backlog/active/, and the BL-1242 merge-deletion
  guard refuses that merge outright unless each of those six ids is named
  in the commit message as a deliberate closure. So the holder can neither
  forward (ancestry gate), nor merge (deletion guard), nor bounce (no
  defect in its own domain), while the work being forwarded is fine. Two
  documenter escalations recorded it the same day:
  backlog/evidence/BL-1249-expeditor-restart-honours-the-operator-pause-marker-pre-qa-gate-20260829-documenter.md
  and
  backlog/evidence/BL-1238-agent-idle-clear-honours-fullness-threshold-bounce-20260829-documenter.md.

  How (direction, not mandate). Compute a merge candidate's evidence paths
  from its own combined diff rather than from -m. The primitive is already
  in the same file and already trusted: merge-introduces-nothing-unique?
  uses `diff-tree -m --cc` for exactly this reason, so this is closing a
  gap between two functions that sit forty lines apart, not inventing a
  policy. Keep the -m form wherever the goal is "every path this commit
  touched at all"; change it where the goal is "what this commit
  contributed", which is the BL-972 evidence question.

constraints: >
  Out of scope / firm lines:

  - Do NOT relax the subject-match, the main-reachable exclusion, the
    abandoned_commits escape, or the fail-closed posture. BL-972's design
    is right; only the evidence feeding it is wrong.
  - Do NOT weaken the BL-1242 merge-deletion guard, and do not add an
    exception to it for park sweeps. That guard refused a merge that would
    have deleted six tickets' active YAML and it was correct to. This
    ticket makes the ancestry gate stop demanding that merge; it does not
    make the merge safe.
  - Do NOT widen parcel-paths-for-cited to compensate. The defect is on the
    candidate side. Changing both sides at once makes the before/after
    count uninterpretable, and the parcel side's three-dot diff is
    deliberate.
  - Do NOT unpark BL-1249 or BL-1238 as part of this parcel, and do not
    resolve their entangled tips. Whether they can move once the gate stops
    refusing is the coordinator's and their holders' call; this ticket
    ships the gate fix only.
  - Do NOT assert scenario 04 against a re-implementation of the refusal
    path. Drive swarm_handoff.sh against a fixture, per BL-1256's lesson
    about gates that observe the decision layer instead of the wiring, and
    keep the fixture out of the live mailboxes.

qa_e2e_procedure: >
  1. Reproduce the inflation before changing anything: on a fixture with a
     merge commit whose subject names the ticket, confirm the candidate's
     evidence path list contains paths introduced only by a parent, and
     that the same commit's combined diff does not. On the live repo the
     shape is `git diff-tree -r -m --name-only --no-commit-id 559d9bd19a`
     (104 paths) against the same command with --cc (4 paths).
  2. After the change, confirm a merge candidate whose only overlap with
     the parcel comes from a parent's contribution produces a warning and
     the forward proceeds - and that the warning still names the commit and
     branch rather than dropping it silently.
  3. Non-vacuity: confirm an ordinary single-parent candidate with genuine
     overlap still blocks, and that a merge whose OWN combined diff
     overlaps the parcel still blocks. A fix that turns every merge into a
     warning has removed the check rather than corrected it.
  4. Invariant 2 by hand: take the recorded BL-1249 refusal, and confirm
     that after the change no ancestry finding names 559d9bd19a for
     BL-1249. If one still does, check whether merging it is refused by
     swarmforge/scripts/check_merge_deletion.sh; a finding that survives
     while the merge remains refused means the deadlock is intact and the
     ticket is NOT done - report it rather than closing on scenario greens.
  5. Note for whoever verifies step 4: the specifier could not reconstruct
     the historical parcel-paths of the BL-1249 forward, because 76070356bc
     and 559d9bd19a have both since merged to main and the three-dot diff
     that produced them now returns empty. Rebuild the state in a fixture
     rather than trying to re-measure it on the live repo, and do not treat
     an empty live measurement as proof the block is gone.
  6. Confirm no other caller of commit-touched-paths changed meaning. If
     the same function serves both the evidence question and a "touched at
     all" question, the two callers need different answers and sharing one
     helper is how this defect arose.

notes: >
  Source: coordinator note (priority 00) 2026-08-29 - "PRE_QA_GATE ancestry
  demands destructive merges (BL-1249/1238); mint" - forwarding two
  documenter escalations from the same day.

  Measured on main 2026-08-29 while speccing: 559d9bd19a yields 104
  evidence paths under -m and 4 under --cc. The 4 are backlog stage-move
  paths; the 100 are main's own changes since the branch point, which the
  merge merely carried across.

  Second-order question deliberately left open: even reduced to its own
  contribution, a park sweep's paths are backlog bookkeeping, which can
  never be dropped implementation work but can still overlap a parcel that
  moves its own ticket YAML. If step 4 shows the recorded incident still
  blocks after the primary fix, excluding bookkeeping-only evidence is the
  natural follow-up and is in scope for THIS ticket to the extent needed to
  make step 4 pass - it is called out here so the implementer does not
  treat it as scope creep, and so nobody closes the ticket on scenario
  greens while the incident it was minted for still deadlocks.

  Related: BL-972 (the path-evidence rule this restores); BL-1242 (the
  merge-deletion guard whose refusal completes the deadlock, currently in
  backlog/hold/); BL-1249 and BL-1238 (the two stuck parcels).

approval_context: >
  Two parcels were left with no legal action in a single day: forward
  refused, merge refused, nothing in their own domain to bounce. Both
  tickets are parked in backlog/hold/ now.

  One call worth your word. The fix is deliberately narrow - a merge is
  credited with its own combined diff instead of both parents' changes -
  and it leaves untouched the possibility that a park sweep's own backlog
  paths still overlap a parcel. The qa procedure's step 4 is what decides
  whether that second exclusion is needed, and the ticket authorises it
  only if the recorded incident still deadlocks without it. Say so if you
  would rather split that second exclusion into its own ticket up front,
  which is cleaner but risks shipping a fix that does not clear the
  incident it was minted for.

notes: >
  [2026-08-29] coder: implemented per the "How" direction - the only
  caller of pre_qa_gate_gather_lib.bb/commit-touched-paths (gather-
  ancestry-facts, itself the only path into ancestry findings) now adds
  `--cc` to the existing `diff-tree -r --name-only -m` invocation, the
  SAME primitive merge-introduces-nothing-unique? already trusts for the
  adjacent "did this merge contribute anything of its own" question.
  Ordinary single-parent commits are unaffected (-m/--cc are merge-only).
  Confirmed there is exactly one caller (qa_e2e_procedure step 6) and
  documented in the function's own docstring that a future second caller
  needing "everything touched, including a parent's own prior content"
  must call `diff-tree -m` directly rather than repurpose this one.

  Did NOT need the second-order exclusion the notes/approval_context
  flagged as possibly necessary (bookkeeping-only park-sweep paths still
  overlapping a parcel) - qa_e2e_procedure step 4's own fixture
  reproduction of the BL-1249 shape (scenario 04) passes cleanly with the
  primary fix alone: a merge whose own combined diff does not overlap the
  parcel downgrades to a warning and the forward proceeds through the
  real swarm_handoff.sh path, no merge of the park-sweep commit required.

  Verified against real data: `git diff-tree -r -m --name-only
  --no-commit-id 559d9bd19a` (108 paths, close to the ticket's measured
  104 - later history) vs. the same command with `--cc` (4 paths,
  exactly the backlog stage-move paths the ticket names) via
  commit-touched-paths directly.

  New acceptance feature (bl1269AncestryEvidenceIsTheCommitsOwnContribution
  Steps.js) 6/6: scenarios 01-03 drive findings-for-git-handoff directly
  against a real git fixture (structured JSON assertions - fast, no CLI
  spawn per check); scenario 04 drives the real swarm_handoff.sh end to
  end (same fixture pattern bl531PreQaDurabilityWiringGateSteps.js
  established for this exact call chain), reusing its shared
  writeAcceptanceContractFixture helper so the co-located BL-761
  acceptance-contract gate stays silent and this suite tests ancestry
  only. Two real fixture-construction defects found and fixed along the
  way, worth recording since they'd bite anyone else building a similar
  fixture: (1) a linked worktree nested inside the fixture root's own
  working tree needs an early .gitignore entry, or every later `git add
  -A` on the root silently tracks it as a spuriously-changing gitlink-like
  path, polluting every diff; (2) `git merge` on a worktree branch with no
  divergent history of its own silently fast-forwards instead of creating
  a real merge commit even when a distinct `-m` message is given -
  `--no-ff` is required to force a genuine 2-parent merge candidate.

  Regression-checked: pre_qa_gate_lib_test_runner.bb ALL PASS (unchanged -
  this ticket touches only the gather layer, not the pure decision layer);
  BL-531's own suite (bl531PreQaDurabilityWiringGateSteps.js, the sibling
  that already exercises this exact findings-for-git-handoff call chain)
  16/16 unchanged; BL-972's own suite (the path-evidence-not-subject-
  mentions rule this ticket restores, not redesigns) 3/3 unchanged.

  No src/*.ts touched - no CRAP/DRY/Stryker concern (Babashka has neither
  wired, per BL-472). No property test: the invariant is about which git
  plumbing command computes evidence for one already-tested decision
  function, not a range of inputs a generator would draw from - the
  acceptance feature's real-git scenarios are the appropriate encoding.

