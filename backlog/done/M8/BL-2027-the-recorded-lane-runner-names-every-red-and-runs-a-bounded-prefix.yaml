notes: |
  Minted 2026-10-06 by the specifier.
  split from BL-2019 on 2026-10-06 after coder (iq3) held it 12m
  (routed 01:44Z, pulled 01:56Z; the coordinator's note says 60m+, which
  is the seat's time without a commit). The loop-detection halt is the
  trigger (human 2026-10-05: a loop halt means simplify, not only cut for
  size). Session 09464452, 01:46-01:55Z: 101 tool calls, read about 15
  files (fixtureReaper, stepRegistry, runtime, cli, five other handlers,
  suite_inventory), wrote nothing. It then ran the same grep for a
  `ctx.cleanups` convention six times and halted. BL-2019 had said to
  read only bl1782's first 40 lines. The simplification: the questions it
  hunted are answered in the How section (no cleanup code, no index.js
  edit, synchronous steps, the KNOWN_VALUES pattern by line anchor), and
  the one asynchronous case (the killed run) moved to BL-2028.
  Nothing to salvage: worktree clean at the pull, and stash@{0}
  (01:45:47Z, check-suite-file-budget.ts) is earlier drift, not BL-2019.
  BL-2019 was queue-jumped by the human (fa0a525e2d), so this is its
  first slice.
  INVEST: Independent (no dependency). Small (two new files, three runs).
  Testable (mkdtemp fixtures, seconds).
  Amended 2026-10-06 (QA note 003849, spec gap; QA bounce D1/D2 went to the
  coder separately): the description mandated `date +%s%3N`, which BSD
  date on macOS does not support. macOS is a target (local-engineering Tech
  Stack). The clock is now a requirement (whole ms on GNU and BSD date),
  with options as direction, and scenario 06 gates it on this Linux host
  through a BSD-style fake date. The coder built against the old line
  and is not at fault.

