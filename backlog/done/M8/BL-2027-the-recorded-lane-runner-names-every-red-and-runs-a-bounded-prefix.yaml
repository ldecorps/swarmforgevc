human_approval: approved
approval_context: >
  Inherited from BL-2019 (approved, itself inherited from BL-1625), split
  2026-10-06 with no new scope. FIRM (BL-1625): rows are per ITEM,
  appended as each completes, so a run killed part-way leaves the rows of
  the completed items and no more; the runner never runs beside the unit
  or property lane.

description: |
  ## What is wanted

  1. A new script, `swarmforge/scripts/test/run_recorded_lane.sh`:

         run_recorded_lane.sh --lane <name> --list <file> --durations <path> [--limit N]

     - Each line of `--list` is `<item>` TAB `<command ...>`. Run the lines
       in order, one at a time (never in parallel). With `--limit N`, run
       only the first N lines.
     - Around each command, read a millisecond clock before and after. It
       must give whole milliseconds on Linux (GNU date) AND on macOS (BSD
       date, stock /bin/bash 3.2): `date +%s%3N` is GNU-only, and BSD date
       prints a literal `3N` (amended 2026-10-06, QA note 003849). For
       example, use `date +%s%3N` only when its output is all digits, and
       otherwise `node -e 'process.stdout.write(String(Date.now()))'`
       (node is on every host this runs on). The moment
       the command returns, append ONE line to `--durations` with `>>`:
       `{"finished_at":"<iso>","lane":"<name>","file":"<item>","result":"pass|fail","duration_ms":<n>}`
       (`result` is `pass` when the command exits 0). Build it with `printf`.
     - After the last item, print the verdict: a line `passed <n> failed <n>`,
       then one line `FAILED <item>` per failing item, then up to ten lines
       `slowest <item> <seconds>s`, then `wall <seconds>s`. Exit 1 when any
       item failed, else 0.
     - Use `set -uo pipefail` and capture each item's status
       (`bash -c "$cmd" || st=$?`). Never `set -e` across the loop
       (BL-1242), and never `kill` anything.

  2. A new step handler, `specs/pipeline/steps/bl2027RecordedLaneRunnerVerdictSteps.js`,
     binding this feature's scenarios 04 (two rows) and 05. Its feature is
     `specs/features/BL-2027-the-recorded-lane-runner-names-every-red-and-runs-a-bounded-prefix.feature`,
     3 runs in all.

  ## How (direction, not mandate) - everything the handler needs is here

  Read only these, and nothing else under `specs/pipeline/`:
  `bl1782VerificationDebtLedgerSteps.js` lines 1-40 (file shape) and
  `bl1740ChaseSweepPauseFromCallerSteps.js` lines 20-31 (the KNOWN_VALUES
  pattern).

  - File shape: `require` assert, fs, path and `{ spawnSync }`, plus
    `const { trackedTmpRoot } = require('./lib/fixtureReaper');`. Set
    `const FEATURE = '<the exact Feature: text after "Feature: ">';`. Write
    `function registerSteps(registry) { ... }` and end with
    `module.exports = { registerSteps };`.
  - **Do not edit `specs/pipeline/steps/index.js`.** Handlers are
    discovered by the `Steps.js` filename suffix (BL-1371).
  - Register every step as `registry.defineScoped(/^...$/, (ctx, ...) => {...}, FEATURE)`.
  - Fixtures: `const dir = trackedTmpRoot('sfvc-bl2027-');`. Write the list
    file and the durations path inside `dir`. `trackedTmpRoot` deletes its
    roots when the process exits, so the handler needs **no cleanup code**:
    no `afterEach`, no `ctx.cleanups` (that does not exist), and no
    disposables.
  - Every step is synchronous. Run the runner with
    `spawnSync('bash', [RUNNER, '--lane', 'fixture', '--list', listPath, '--durations', durPath], { encoding: 'utf8' })`
    (add `'--limit', '1'` for scenario 05). Keep `status` and `stdout` on
    `ctx`. `RUNNER` is `path.join(__dirname, '..', '..', '..', 'swarmforge', 'scripts', 'test', 'run_recorded_lane.sh')`.
  - KNOWN_VALUES tables, each with a lookup that throws on any other text:
    - shape: `both pass` -> lines `a<TAB>true`, `b<TAB>true`;
      `include one that fails` -> `a<TAB>true`, `b<TAB>false`.
    - exit: `0` -> 0, `1` -> 1.
    - names: `names no failing item` -> no `FAILED ` line;
      `names exactly that item` -> exactly one `FAILED b` line.
  - Scenario 05's "it runs exactly the first item": the durations file's
    single row has `"file":"a"`.
  - Scenario 06 (added 2026-10-06 with the clock amendment): for "a date on
    PATH that prints %3N literally, as BSD date does", the handler writes
    an executable `date` into a fixture `bin/` dir that prints
    `<seconds>3N` (seconds from the real date, resolved by absolute path
    before PATH changes) when an argument contains `%3N`, and otherwise
    runs the real date with the same arguments. It prepends that dir to
    the runner's PATH for that run only. "every row's duration_ms is a
    whole number of milliseconds": every row parses as JSON and its
    `duration_ms` satisfies `Number.isInteger(v) && v >= 0`.

  Then run `node specs/pipeline/cli.js <this feature>`: every run ok, 0 fail. Run
  `cd extension && npm test` before forwarding. No shell test and no
  `suite-manifest.tsv` row: the handler drives the real runner.

  ## Not in scope

  - Scenario 03 (one row per completed item, including the killed run) is
    BL-2028, which depends on this.
  - The front-ends (BL-2020 features, BL-2021 shell) and the docs (BL-2021).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2027-the-recorded-lane-runner-names-every-red-and-runs-a-bounded-prefix.feature`:
     every run ok, 0 fail: scenario 04's rows, 05 and 06 (06 added
     2026-10-06; measured at the amendment, 06 unbound).
  2. `git diff <parcel>^..<parcel> --stat` names only the runner, the
     handler and the parcel's own evidence.

