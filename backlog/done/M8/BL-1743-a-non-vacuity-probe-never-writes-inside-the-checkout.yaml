human_approval: approved
approval_context: >
  Sign-off asked for: that a probe's broken copy must never be written
  inside the checkout, even though today's placement beside the real
  script is what makes the copy's relative loads resolve. The direction
  below keeps those loads working from a temporary root. FIRM: every
  probe still proves its test red against the broken copy - no probe is
  deleted or weakened. FIRM: the launch script sync is not changed here
  (see out_of_scope).

invariants:
  - "No test or step handler writes a file under the checkout it runs from to build a broken copy of a script; every broken copy lives under a temporary root that its run removes, and a root whose recorded owner pid is dead is reaped by the next probe run."

description: |
  ## What is wrong

  QA note 003163 (07:01Z): the QA tree was dirty with a scratch `.bb`
  from a killed bl1652 property run. At mint, the same two untracked
  files are in the master checkout and in seven of the eight worktrees
  (coder@2's has none):
  `swarmforge/scripts/bl1652-non-vacuity-scratch2-11946-1790318102522.bb`
  (128 KB, chase_sweep_lib.bb with the BL-1652 per-sweep respawn cap
  removed) and
  `swarmforge/scripts/test/bl1652-non-vacuity-runner-11946-1790318102522.bb`.
  The master copies date from 06:35:02Z, a run of pid 11946 whose
  `finally` never ran. Every worktree copy has mtime 08:00:02Z, the
  launch second: `swarmforge.sh`'s `sync_worktree_scripts` copies master's
  `swarmforge/scripts/` into each worktree and skips only paths the
  worktree's own git tracks (BL-373).

  The probe (bl1652 lines ~123 and ~240) writes its broken copy beside
  the real script, so that the copy's sibling `load-file` calls resolve.
  Those calls go through `(fs/parent (fs/canonicalize *file*))`. It then
  removes the copy in a `finally`. A SIGKILL, a heap-cap worker death
  (BL-1729) or a timeout skips the `finally`. There is no pre-run sweep
  (the BL-971 rule for mkdtemp fixtures).

  ## Census (derived, then pinned - BL-1445)
  `grep -rlE '(scratch|broken)[A-Za-z]*\s*=\s*path\.join\((path\.dirname\(|__dirname|[A-Z_]*DIR\b)' extension/test specs/pipeline/steps`
  finds 8 files and 15 sites (`grep -rnE` on the same pattern):
  - `extension/test/bl1458BriefingTriggerInvariants.property.test.js`
  - `extension/test/bl1459DocumenterBriefingTipGuardInvariants.property.test.js`
  - `extension/test/bl1505DedupSuppressedChaseCountInvariants.property.test.js`
  - `extension/test/bl1630NoStepHandlerModuleLoadWorkInvariants.property.test.js`
    (writes into `extension/test/helpers/`)
  - `extension/test/bl1652ChaseRespawnBusyGuardInvariants.property.test.js`
  - `extension/test/bl1671MergeDeletionGuardInvariants.property.test.js`
  - `specs/pipeline/steps/bl938AgedNoteRotateFixtureRotationRouterSteps.js`
  - `specs/pipeline/steps/bl943FixtureCleanupVerdictSteps.js`
    (writes into `swarmforge/scripts/test/`)
  After the fix this regex finds none, by design. Scenario 01's census
  therefore derives the population as "every file that builds a broken
  copy of a script, whichever way" and pins it at these 8 (9 since the 2026-10-07 re-census in Scope), with bl1652
  among them.

  ## What is wanted
  - Each probe builds its broken copy under a temporary root of its own.
    The root is removed in `finally`, and a pre-run sweep reaps any root
    whose recorded owner pid is dead (BL-971/BL-1385: never a blind
    prefix sweep - a live sibling run's root is kept).
  - How (direction, not mandate): one shared helper that makes the root,
    writes the broken copy there, and symlinks the real script's siblings
    beside it. The copy's `load-file` of `handoff_lib.bb` and the others
    then resolves, while the siblings' own canonical paths stay in the
    real tree.
  - Every probe still shows its test red against the broken copy, as
    today.

  ## Scope
  - The 9 census files (re-census of 2026-10-07 below).
  - A shared helper under `extension/test/helpers/` (step handlers may
    require it too).
  - The feature and its step handler. Handlers are discovered by their
    file-name suffix (BL-1371); `specs/pipeline/steps/index.js` needs no
    edit.

  ## Re-census 2026-10-07 (main 68e4875d3d), where to read

  The description's grep now finds 9 files and 16 sites:
  bl1835PauseExemptsBriefingInstructionInvariant.property.test.js joined
  with BL-1835 (dd2950dc24) and writes a broken handoff_lib.bb copy beside
  swarmforge/scripts/handoff_lib.bb. Each site, file:line, read with
  offset and limit around the line, never the whole file:
  - extension/test/bl1458BriefingTriggerInvariants.property.test.js:107, :164
  - extension/test/bl1459DocumenterBriefingTipGuardInvariants.property.test.js:165, :331, :372, :400, :483
  - extension/test/bl1505DedupSuppressedChaseCountInvariants.property.test.js:176
  - extension/test/bl1630NoStepHandlerModuleLoadWorkInvariants.property.test.js:124 (writes into extension/test/helpers/)
  - extension/test/bl1652ChaseRespawnBusyGuardInvariants.property.test.js:123, :240, :242
  - extension/test/bl1671MergeDeletionGuardInvariants.property.test.js:117
  - extension/test/bl1835PauseExemptsBriefingInstructionInvariant.property.test.js:197
  - specs/pipeline/steps/bl938AgedNoteRotateFixtureRotationRouterSteps.js:212
  - specs/pipeline/steps/bl943FixtureCleanupVerdictSteps.js:223 (writes into swarmforge/scripts/test/)

out_of_scope: |
  - `sync_worktree_scripts` copying master's UNTRACKED script files into
    every worktree at launch. That is what spread this litter, but
    restricting it to tracked source files has a cost: a new uncommitted
    script in master would stop reaching the seats on relaunch. That is a
    ruling for the human, not a rider on this ticket. Mint it if
    untracked litter spreads again from any other source.
  - Removing the existing stray copies (16 untracked files, pid 11946
    dead, across master and seven worktrees). They were not made by
    this ticket. The new sweep reaps temporary roots only and never
    deletes anything inside a checkout. The coordinator was told the same
    pass: a one-time removal, master first, or the next launch's sync
    copies them back.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1743-a-non-vacuity-probe-never-writes-inside-the-checkout.feature`:
     all ok (2 of 2).
  2. Read from the gather's property row: the seven census property files
     green (bl1505 only outside a control pause until BL-1740 lands); then
     `git status --short -- swarmforge/ extension/test/helpers/` in the
     QA worktree shows no new `*non-vacuity*` path.
  3. The census grep from the description: no match.
  4. `git diff main...HEAD --name-only` names only the census files, the
     helper, the feature, its handler, `index.js`, docs and evidence.

