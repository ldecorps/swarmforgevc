description: |
  ## What

  BL-637 is the third seat (coder, cleaner, hardener) to independently find
  its own real shortfall. The hardener lens found a test-design anti-pattern
  this project's BL-637 acceptance steps file already disclaims in its header
  ("Drives the REAL shell suite — never a parallel reimplementation") — yet
  the shell suite's own newly-added scenarios did exactly that against
  `stop-swarm.sh`: they `source`d `stack_survivor_scan.sh` and hand-wrote the
  refuse/success branching instead of invoking the real entry-point.

  Evidence that gap was real (BL-746 remaining work, now landed): the test
  printed `"full stack SUCCESS — clean slate"` while `stop-swarm.sh` prints
  `"full stack SUCCESS — no known survivors"`, and the test omitted the
  `kill_rc` refuse branch entirely.

  ## What to do

  Extend the BL-727 pilot landing gate (`landPilotedTicket` in
  `extension/src/tools/pilotAcceptanceGate.ts` — same owner as BL-729 /
  BL-731 / BL-737) with a **shell entry-point drive** check:

  1. Collect shell tests touched by the run's non-merge commits
     (`swarmforge/scripts/test/*.sh` only).
  2. Collect non-test `.sh` entry-point basenames named in the ticket YAML
     (`description:`, `required_wiring:`, `acceptance:` path/prose) — exclude
     paths under `scripts/test/`.
  3. If either set is empty → no-op (land proceeds).
  4. If both non-empty: every named entry-point basename must appear as an
     **invocation** in at least one touched shell test (e.g. `bash …/stop-swarm.sh`,
     `./stop-swarm.sh`). `source` of a helper alone does not satisfy.
  5. On miss: refuse with `reasonKind: 'parallel-shell-reimplementation'`,
     naming the entry-point and the offending test path. Refused land is inert.
  6. When ticket YAML or touched-file history cannot be resolved: fail **open**
     with a warning (mirror BL-729 / BL-737), not a silent pass.
  7. Record on the acceptance receipt how many shell tests / named entry-points
     were scanned (when checked).
  8. How-to update on `docs/how-to/BL-727-pilot-acceptance-contract-gate.md`
     (or sibling BL-747 doc) describing the refusal and remediation (drive the
     real script — see companion BL-746).

  ## Out of scope

  - Re-fixing BL-746 remaining work (already drives real `stop-swarm.sh`)
  - Requiring every helper unit test to invoke its consumers
  - Live hardener-stage grep outside `/pilot` land (this is pilot-land only)
  - Changing JS acceptance-steps "drive the real suite" conventions

qa_e2e_procedure: >
  (1) Ticket names stop-swarm.sh; touched test sources helper only → refuse,
  names entry-point + test. (2) Touched test invokes stop-swarm.sh → land
  completes. (3) Refused land leaves yaml + no receipt. (4) No shell tests
  touched → no-op complete. (5) Ticket names no entry-point → no-op complete.
  (6) Unreadable history → land with warning. (7) How-to documents refusal.

