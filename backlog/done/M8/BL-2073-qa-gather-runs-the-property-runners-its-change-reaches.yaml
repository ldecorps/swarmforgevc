human_approval: approved
approval_context: >
  Inherited from BL-2049 (approved, ruling A confirmed by the human and
  landed): "QA's gather runs, on every parcel, the property runners its
  change reaches, and nothing runs the others." BL-2049's own
  approval_context: "On A the specifier mints the gather-row slice the
  same pass (production TypeScript, so it carries the hardener)." FIRM:
  the row runs BL-2049's front-end flag, never a second reach rule; the
  ref is the parcel's own merge-base with main, the same ref BL-2024's
  skip predicate computes. No new ruling is posed.

description: |
  ## What is wanted

  - `extension/src/quality/qaGather.ts`: the CHECKLIST gains one new row,
    `property_runners`, between `properties` and `acceptance`:
    - The ref: the parcel's own merge-base with main,
      `git merge-base main <commit>`, computed through the existing runFn
      seam (the same ref BL-2024's skip predicate computes). When the
      merge-base cannot be resolved, the row is blocked with a reason
      naming the failed merge-base - it never falls back to a wider ref.
    - The command: `swarmforge/scripts/test/run_property_runners.sh
      --changed-from <ref>` with cwd the repository root - the front-end
      computes the parcel's own changed paths and runs exactly the
      reached runners on the recorded lane runner (BL-2049). The row
      never re-lists the population and never passes a directory.
    - The row reads `ran` with the front-end's exit status and output,
      including the front-end's own `no property runner reached since
      <ref>` message when none is reached (exit 0).
  - Every other check runs exactly as today, in the fixed order.
  - The step handler `specs/pipeline/steps/bl2073QaGatherPropertyRunnerReachSteps.js`
    builds each fixture with `git init` under mkdtemp (BL-1390) and calls
    the gather with a `runFn` that passes `git` through to the real git
    and records every other command, answering it with exit 0 - the same
    seam shape as BL-2024's handler.
  - Documenter: the how-to or reference that lists what the gather runs
    (`grep -rln qa-gather docs`) states the new row, its ref rule and its
    fail-closed rule.

  ## Not in scope

  - The reach selector and the front-end flag: BL-2049, landed.
  - Skipping the row for a backlog-only parcel: BL-2024 (paused) owns the
    skip status for the unit and properties lanes; this row is not one of
    them and runs on every parcel.
  - A nightly full run of all 217: ruling B's slice, not ruled.
  - Changing which parcels need QA, or any other check's command.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2073-qa-gather-runs-the-property-runners-its-change-reaches.feature`:
     5 ok (01 x3, 02, 03), 0 fail.
  2. Read the gather report for THIS parcel: it touches extension/src,
     so the property_runners row reads ran with the front-end's own
     output for this parcel's own diff.
  3. `git diff <parcel>^..<parcel> --stat` names only qaGather.ts, the
     feature, the handler, the docs line and the ticket YAML.

