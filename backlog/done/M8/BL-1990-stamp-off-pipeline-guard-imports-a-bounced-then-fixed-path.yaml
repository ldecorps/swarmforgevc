description: |
  ## Status: hotfix 8f2643f123 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  Since landing is a merge (BL-1870 ruling A, BL-1872), a
  bounced-then-fixed parcel lands its whole line on origin/main. BL-1972's
  first try a0b390f7e0 was bounced by the hardener; the fix c734239556
  descends from it and leaves two of its files untouched. Every absorb
  merge of origin/main into the master checkout then ran
  check_pipeline_code_on_main.sh, which anchors each pipeline path on the
  last incoming commit that touched it (BL-1096): a0b390f7e0, which BL-952
  rightly never reads as approved. The merge was refused every tick, the
  sweep fell back to "merge-abort-no-merge-head" and then
  "local-ahead-refused", and main sat diverged (up to 14 ahead and 14
  behind) with every master-resident commit stranded.

  ## What the hotfixes changed

  1cec236e2d (2026-10-05, coordinator note 016537: "systemic: no
  bounce-superseded row, Art4.2 re-fires forever post-fix") moved the rule
  into the shared predicate and replaced the guard-level carrier below:
  `is_qa_ancestor.sh` gains `bounce_superseded_by()`. A commit with a bounce
  verdict reads "approved: ... bounce superseded by <sha>" when a LATER
  commit of the SAME ticket, on the ancestry path to swarmforge-QA,
  origin/main or a lander-queued tip, is itself approved (its verdict runs
  in a subshell). Every consumer now agrees, babysitter's Article 4.2
  detector included (it raised a CRIT on a0b390f7e0 every sweep, escalated
  to the operator). `check_pipeline_code_on_main.sh` drops 8f2643f123's
  carrier: one definition of approval (BL-925 invariant 2). The guard
  test's two new cases now pass through the predicate.

  The first hotfix, 8f2643f123, as landed:

  `check_pipeline_code_on_main.sh`: `same_ticket_approved_carrier()`. When
  a path's anchor is not approved, the path is still imported if a later
  commit on the ancestry path from the anchor to the incoming tip leads
  with the same ticket id, carries the identical blob for that path, and
  is approved by is_qa_ancestor.sh. It looks at no more than 200 commits.
  Same ticket only (BL-1096); a bounced commit still approves nothing on
  its own (BL-952). `test_pipeline_code_on_main_guard.sh` gains a
  same-ticket case (imported) and a different-ticket case (refused). With
  the fix live in the working tree the daemon's next reconcile merged at
  11:36:05Z.

  ## What each stage checks

  - Coder: the change against the description and both invariants, and
    the guard's cost on a long ancestry path. Evidence:
    backlog/evidence/BL-1990-coder-<date>.md.
  - Architect: one pass per invariant: can any commit read approved through
    this supersession that QA never approved, including a ticket id reused
    by an unrelated commit subject, and is the 200-commit bound right for
    every consumer (the land step, the close guard, expedite)?

