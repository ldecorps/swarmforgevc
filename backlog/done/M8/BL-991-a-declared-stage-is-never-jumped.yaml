id: BL-991
title: "route-required-stages delivers a forward hop as addressed whenever the literal target is already a member of the effective set, so a coder addressing QA on a full-chain ticket jumps four declared stages and is merely recorded - the operator has ruled the declaration binding"
milestone: M8
type: feature
status: todo
epic: swarm-reliability
human_approval: approved
priority: 20
direction: human-requested
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-991-a-declared-stage-is-never-jumped.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl991::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "A declared stage is never jumped. For any forward git_handoff on a ticket with a usable declaration, the delivered recipient is never later in canonical order than the first declared stage after the sender."
  - "A stage a binding rewrite defers is never recorded as skipped. A redirected hop skips nothing - it runs the declared stages in order - and neither the envelope header nor the routing-skips line may name the deferred stage."
  - "Enforcement reaches exactly as far as routing already reaches, and no further. A backward bounce, a rejection_reason/reroute_reason detour, a disabled kill switch, and an unusable declaration each deliver the same recipients as they do today."

description: >
  `route-required-stages` (`swarmforge/scripts/swarm_handoff.bb`) resolves the
  ticket's effective stage set and then, on this branch, delivers the parcel
  exactly as the sender addressed it:

    (if (contains? effective literal-to)
      (let [skip (emit-skip literal-to nil)] ...)   ; recipients UNCHANGED
      ...)                                          ; rewrite to next stage

  So membership is treated as permission. A coder addressing QA on a ticket
  declaring `[coder, cleaner, architect, hardender, documenter, qa]` is
  delivered straight to QA - cleaner, architect, hardender and documenter are
  jumped, and BL-951's fix means they are now accurately recorded as jumped.
  Visible, but not prevented.

  The operator has ruled that the declaration binds. The ruling, verbatim:

    "Leave it to sender judgement, but make required_stages binding so a
     declared stage cannot be jumped"

  Both halves matter. A ticket that declares nothing keeps sender judgement
  untouched - that is the first half, and it is why this ticket must not
  become a blanket "always re-traverse the chain" rule (the operator was
  offered that option and did not take it).

  The same hole exists on the non-member branch, which is easy to miss. With
  `[coder, cleaner, qa]`, a coder addressing `architect` today rewrites to
  `next-required-stage(effective, architect)` = QA - forward of the ADDRESSED
  stage, jumping `cleaner`, which is declared. Both branches must respect the
  rule.

  How (direction, not mandate): the rule is expressible as one guard ahead of
  both branches. Let `next` = `next-required-stage(effective, sender)` - the
  first declared stage strictly after the sender, which the lib already
  computes and which needs no reference to the literal target. When `next` is
  non-nil and strictly before `literal-to` in canonical order, deliver to
  `next`. Otherwise fall through to today's logic unchanged, which preserves
  BL-606's pruning contract for a target that is simply not declared.

  Note that a binding rewrite is not a skip, so it must not reuse the skip
  record's `rewritten-away` slot: `emit-skip` would name the deferred stage
  in `skipped=`, asserting that QA was bypassed when QA is precisely what
  will still run (invariant 2).

constraints: >
  This ticket amends a sibling's durable contract, and that is not optional.

  `specs/features/BL-951-stage-skips-are-recorded-whatever-the-ticket-declares.feature`
  scenario 01 is a Scenario Outline over three declaration states, and its
  `full-chain` row asserts that a coder-to-QA hop carries a routing_skipped
  header naming cleaner, architect, hardender and documenter. Under this
  ticket that hop is redirected to cleaner and skips nothing, so the row
  becomes false the moment this lands. Its step handler
  (`specs/pipeline/steps/bl951StageSkipsRecordedSteps.js`) drives the real
  send path against a fixture root, so this is a genuine acceptance red, not
  a stale comment. Remove the `full-chain` row from that outline - `absent`
  and `invalid` both resolve to default-full and stay correct - and let this
  ticket's scenario 01 carry the full-chain case in its new, binding form.
  Both feature files must be green in the same parcel.

  Out of scope:

  - The staleness fail-open. The declaration is read from the SENDER'S OWN
    working tree (`active-ticket-yaml-content` globs `root/backlog/active`),
    so a sender that has not merged the promotion sees no declaration and
    this gate is inert for that ticket. Measured on main 2026-08-20: of 7
    active tickets, all 7 declare required_stages, and BL-969 and BL-970 were
    absent from all six pipeline worktrees' `backlog/active/`. That is
    BL-992, deliberately separate - this ticket must not grow a git-ref
    lookup.
  - Any rule about where a bounce-fix should return to. The operator ruled
    that out: sender judgement stands, and the declaration is the only
    constraint on it. Do not add a coder.prompt/QA.prompt routing rule.
  - The kill switch. With `required_stages_routing_enabled false` this code
    must stay unreachable, exactly as BL-951 left it.
  - Backward bounces, which `routes-forward?` already excludes.
  - BL-748 (`log-routing-skip!` has no try/catch) and BL-754 (unquoted flow
    reasons mis-parse). Same subsystem, separately ticketed.

qa_e2e_procedure: >
  From the repo root:

  1. Reproduce before the fix. Drive `route-required-stages` over a fixture
     root with declaration `[coder, cleaner, architect, hardender,
     documenter, qa]`, sender `coder`, recipient `QA`. Confirm today's
     behaviour: `:recipients` is `["QA"]` and `:routing-skipped` names the
     four intermediate stages. That is the hole this ticket closes.
  2. At the parcel commit, repeat step 1 and confirm `:recipients` is now
     `["cleaner"]`.
  3. Confirm the non-member branch obeys the same rule: declaration
     `[coder, cleaner, qa]`, sender `coder`, recipient `architect` must
     deliver to `cleaner`, not to QA as it does today. A fix that only
     touches the membership branch fails here.
  4. Confirm invariant 2 directly: for step 2, assert that neither the
     envelope `routing_skipped:` header nor any `routing-skips.jsonl` line
     names QA. A record claiming QA was skipped is a defect even though the
     delivery is correct.
  5. Confirm invariant 3 case by case, asserting `:recipients` is byte-
     identical to the literal draft for each: declaration absent; declaration
     invalid; `required_stages_routing_enabled false` with a full chain;
     sender `QA` addressing `coder`; and declaration `[documenter]` with
     sender `documenter` addressing `QA` (no declared stage after the sender,
     so nothing can be jumped).
  6. Run BOTH feature files and confirm both are green:
     `./specs/pipeline/scripts/run_acceptance.sh
     specs/features/BL-991-a-declared-stage-is-never-jumped.feature` and the
     amended
     `specs/features/BL-951-stage-skips-are-recorded-whatever-the-ticket-declares.feature`.
     Confirm the BL-951 outline no longer carries a `full-chain` row and that
     its `absent` and `invalid` rows still pass. Confirm the new handler is
     registered in `specs/pipeline/steps/index.js`.
  7. Prove non-vacuity: restore the `contains? effective literal-to` early
     delivery, confirm this ticket's scenario 01 fails on all three rows,
     then revert. A scenario 01 that still passes under the old code is not
     testing the ruling.
  8. Live check after landing: send a real forward git_handoff on an active
     ticket that declares the full chain, addressed two or more stages ahead,
     and confirm the parcel arrives at the next declared stage.

notes: >
  Source: the specifier's clarifying question to the operator, raised
  2026-08-19 12:58 after QA flagged the coder sending two bounce-fixes
  straight to QA. Probing found no rule in `coder.prompt`, `QA.prompt` or
  `handoff-protocol.md` governing a bounce-fix's return path, so those jumps
  were un-governed rather than non-compliant; BL-951 was written narrowly to
  make the jump visible without prejudging the policy (its invariant 2 says
  so explicitly). The ruling arrived 2026-08-20 via the coordinator (handoff
  `20260820T142547Z_000703_from_coordinator`), and this ticket is the
  enforcement half BL-951 deliberately left undone.

  The three options the operator did NOT choose are worth recording, because
  each would have produced a different ticket: straight back to the bouncing
  role; re-traverse the full chain from the fixing role onward; re-traverse
  only the stages whose domain the fix touched. All three are blanket
  routing rules. The chosen option is not a routing rule at all - it moves
  the decision into the ticket's own declaration, which means a docs-only
  ticket declaring `[documenter, qa]` still lets a fix go straight to
  documenter, and a full-chain ticket does not. Whoever implements this
  should resist any urge to add a default: an absent declaration must stay
  exactly as permissive as it is today.

  Verified against the live code 2026-08-20, not inherited from BL-951's
  prose: `required_stages_routing_enabled true` is set in
  `swarmforge/swarmforge.conf` (the code default is `false`), so this gate is
  live the moment it lands. `next-required-stage`, `hop-skipped-stages` and
  `routes-forward?` all already exist in `required_stages_lib.bb` with the
  exact semantics the guard needs - `next-required-stage` takes
  (required-set, current) and returns the first member strictly after
  `current` in canonical order, self-normalizing case and the
  hardener/hardender alias. No new lib function is required.

  One trap worth naming: `resolve-effective` REJECTS a declaration naming
  coder without QA (default-full, `:qa-omission :rejected`), so a fixture
  like `[coder, cleaner]` cannot be used to exercise the "no declared stage
  after the sender" case - it silently becomes default-full and tests
  nothing. Scenario 04's last row uses `[documenter]` instead, which omits
  coder and may therefore omit QA legitimately.

  IR-DRY: 10 medium-confidence findings, all reviewed and kept. Nine are the
  inherent pairing of a Scenario Outline's parameterized step with the same
  step carrying a literal value in a plain Scenario (`... addressed to
  <addressed>` vs `... addressed to QA`); one step handler regex serves both,
  and collapsing the plain scenarios into outlines would hide which guard a
  regression broke. The tenth pairs `delivered to <delivered>` against
  `delivered to the role it was addressed to` - that contrast IS the feature:
  scenario 01 asserts the recipient CHANGED, scenario 04 asserts it did not.
  An earlier draft had 12 findings including one high-confidence
  placeholder-variant; it was resolved by rewording scenarios 02 and 04 to
  assert delivery-unchanged rather than naming a role, which also states
  their intent more precisely.

approval_context: >
  Two decisions are mine and worth your eye, since neither was settled by the
  ruling itself.

  First, REWRITE rather than REFUSE. When a hop would jump a declared stage I
  have the router redirect it to the next declared stage, rather than
  refusing the send and making the agent re-address it. Rewriting reuses the
  machinery already there (the non-member branch redirects today), never
  dead-ends a committed parcel, and keeps the failure mode identical to one
  agents already encounter. The cost is that a sender who addressed QA is
  delivered to cleaner and must read the tool output to notice. If you would
  rather a jump be refused loudly - exit non-zero, sender re-addresses - say
  so and this becomes a different ticket; the acceptance scenarios would all
  change shape.

  Second, the scope of "binding". I have read the ruling as binding on
  DECLARED stages only: with `[coder, cleaner, qa]` a coder addressing
  architect is redirected to cleaner, but a coder addressing cleaner on a
  ticket where architect is undeclared is still delivered to cleaner and
  architect is still pruned away. That preserves BL-606's original purpose -
  a declaration prunes the chain - and only removes the ability to jump
  FORWARD past a declared stage. The alternative reading, that a declaration
  freezes the chain in both directions, would also forbid pruning and is a
  much larger change.

  Not a decision, but flag-worthy: this gate is inert for any ticket the
  sender has not yet merged. I measured it while writing this - right now 2
  of the 7 active tickets are invisible to all six pipeline worktrees - and
  ticketed it separately as BL-992 rather than growing this one. If you want
  the gate to be trustworthy from day one, BL-992 should be promoted with or
  before this.

assigned_to: coder
