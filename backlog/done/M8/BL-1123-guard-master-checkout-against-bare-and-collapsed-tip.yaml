id: BL-1123
title: "Guard master checkout: never leave core.bare=true or a collapsed tip tree"
milestone: M8
type: defect
severity: critical
# critical: core.bare=true made the master worktree unusable (Cannot find
# SwarmForge project root / git not a work tree); tip collapsed to 1–4 file
# trees (e72eaffdf "refile 1", e9f8b1725b seed/init) — swarm-down class for
# every role that commits on main. Recurred twice the same morning.
