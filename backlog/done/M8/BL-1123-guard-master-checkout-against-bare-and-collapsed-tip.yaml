invariants:
  - "A running swarm never leaves the master checkout with core.bare=true."
  - "A tip whose tree has fewer than a configured safe file-count floor is refused as main HEAD (or healed to the last known full tip) — never left as the live branch tip."
description: >
  WHAT. On 2026-08-25 the master checkout repeatedly flipped
  `core.bare = true`, so `git rev-parse --is-inside-work-tree` was false,
  `ready_for_next.sh` printed "Cannot find SwarmForge project root", and
  roles could not commit without GIT_WORK_TREE workarounds. Concurrently
  `main` tip collapsed to tiny trees (`e72eaffdf` "refile 1" one-file tree;
  later `e9f8b1725b` / `68469c4cea` seed-sized trees). Coordinator restored
  tip to full trees and set bare=false; the flip recurred once during
  open-slot handling. Author of the bare flip / refile chain still unknown
  (author `t` concurrent with BL-695 hardener / BL-534 coder commits).

  WHY. Human/coordinator intake: recover tip/index without losing worktree
  role branches, and identify what sets core.bare=true. Recovery already
  happened; this ticket makes recurrence impossible (or self-healing) and
  records forensic hooks for the writer.

  HOW (direction, not mandate).
  1. Detector (handoffd or babysitter tick): if master .git/config reads
     bare=true, WARN loudly, set bare=false (or refuse daemon work until
     healed), never leave the swarm running against a bare master.
  2. Tip floor: refuse to update refs/heads/main to a commit whose tree
     file count is below a high floor (measured against a recent full tip
     ~7797 files) — or auto-restore from reflog last-full tip.
  3. Forensic: log which process/cwd rewrote .git/config when bare flips
     (inotify/audit or pre-write wrapper) so the unknown writer is named.
  Prefer one durable ownership path (daemon) over agent-prompt prose alone.

qa_e2e_procedure: >
  (1) Fixture with bare=true → detector heals or refuses with a clear
  alarm; after heal, is-inside-work-tree is true. (2) Attempt to point
  main at a tiny-tree commit → refused or auto-restored; tip stays full.
  (3) Unit tests without mutating the live swarm's .git/config — use a
  temp repo. (4) Document recovery runbook for the 2026-08-25 shapes.
  (5) Record degraded Babashka gate.

out_of_scope: |
  - Rewriting history of the abandoned spam tips (leave on reflog).
  - Mid-commit drift WARN mute (BL-1122).
  - Changing who may push origin/main.

