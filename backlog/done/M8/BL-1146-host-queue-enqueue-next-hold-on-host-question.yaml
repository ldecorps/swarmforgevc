invariants:
  - "While the bridge is busy, a vote to enqueue-next pins exactly one queued prompt id (enqueueNextPromptId) and acks Enqueued next: <label>. Will start when idle. — never silently dropped and never run-now."
  - "On idle with a valid pin: if the host agent's finishing reply is not a question, the pinned item starts automatically and skips the choose-next poll; if the finishing reply is a question, the pin is held (item stays queued, no auto-start) until the human answers or explicitly /queue / re-pins."
  - "Idle without a pin keeps today's choose-next poll unchanged (BL-810/BL-894). Clear-all, drop, or expiry of the pinned id clears enqueueNextPromptId. Question detection reuses an existing honest needs-human / host-question signal — fail closed toward hold, not false auto-start."
description: |
  ## What the human asked for

  While Cursor is busy, inbound Host questions queue with "Busy — question
  queued (N waiting). I will ask you to pick one when ready." Today the pick
  poll only appears after idle (`presentQueueSelectionPollAfterIdle`), and a
  vote while busy is dropped (`processQueuedPollAnswer` returns when
  `holder.busy`). The human wants to **pre-choose** which queued item runs
  automatically when idle ("enqueue next").

  ## Locked behaviour (specifier)

  1. **Pin while busy** — queue presentation while a run is in flight offers
     enqueue-next (auto-start when idle), not run-now.
  2. **Idle with pin and host reply is NOT a question** — start pinned
     prompt; skip choose-next poll.
  3. **Idle with pin and host reply IS a question** — **hold**: keep pin;
     no auto-start; human answers host first.
  4. **Idle without pin** — existing choose-next poll (BL-810/BL-894).
  5. **`/queue` while busy** — enqueue-next poll (supersede prior poll id
     as today).
  6. Optional FIFO when exactly one pending and no pin — amendment still
     wins: never FIFO/pin auto-start over a host question.

  State: `enqueueNextPromptId` on `CursorBridgePersistedState`.

  ## Completion, not greenfield

  Extend `extension/src/tools/telegramCursorBridgeLive.ts` /
  `telegramCursorBridgeCore.ts` on the BL-810/BL-811/BL-894 maintain path.
  Not Bubble UI, not new Telegram product chrome.

  ## Out of scope

  - Full queue reordering beyond one "next" pin
  - Auto-running N≥2 without a pin
  - Bubble / Local Agent queue surfaces
