description: |
  ## What is wanted

  A new step handler, `specs/pipeline/steps/bl2028RecordedLaneRunnerRowsSteps.js`,
  binding scenario 03 of
  `specs/features/BL-2028-the-recorded-lane-runner-appends-one-duration-row-per-completed-item.feature`
  (an outline with three rows) against BL-2027's runner,
  `swarmforge/scripts/test/run_recorded_lane.sh`. No production change.

  ## How (direction, not mandate) - everything the handler needs is here

  Read only BL-2027's handler,
  `specs/pipeline/steps/bl2027RecordedLaneRunnerVerdictSteps.js`, and copy
  its shape: requires (with `{ spawn, spawnSync }` from
  `node:child_process`), `trackedTmpRoot`, FEATURE (this feature's text),
  `registerSteps`, KNOWN_VALUES lookups that throw, and the `spawnSync`
  call. Do not edit `specs/pipeline/steps/index.js`: handlers
  are discovered by the `Steps.js` suffix (BL-1371).

  - KNOWN_VALUES:
    - shape: `both pass` -> lines `a<TAB>true`, `b<TAB>true`;
      `include one that fails` -> `a<TAB>true`, `b<TAB>false`.
    - runs: `runs that list to the end` -> one synchronous `spawnSync`
      run; `is killed after the first` -> the killed run below.
    - rows: `one row per item, both passing` -> 2 rows with results
      `pass`, `pass`; `one row per item, one failing` -> 2 rows, `pass`,
      `fail`; `exactly one row` -> 1 row, for item `a`.
  - Count rows by reading the durations file and `JSON.parse`-ing each
    non-empty line.
  - The killed run is the only asynchronous step. The runtime awaits every
    handler (`specs/pipeline/runtime.js` line 76), so write that step as
    `async (ctx) => { ... }`:
    1. Make the second item `sleep 5` instead of its shape's command, so
       the runner is still inside item b when it is killed.
    2. `const child = spawn('bash', [RUNNER, '--lane', 'fixture', '--list', listPath, '--durations', durPath], { stdio: 'ignore' });`
    3. Poll until the durations file holds one row, with a 10 s deadline:
       `while (rowCount() < 1 && Date.now() < deadline) await new Promise((r) => setTimeout(r, 50));`
    4. `child.kill('SIGKILL')`, then `await new Promise((r) => child.once('exit', r));`.
    Kill only `child`, never the test process. The orphaned `sleep 5`
    ends on its own.
  - `trackedTmpRoot` deletes its roots at process exit: no cleanup code.

  Then run `node specs/pipeline/cli.js <this feature>`: 3 ok, 0 fail. Run
  `cd extension && npm test` before forwarding.

  If a row fails on its merits once bound (for example, a row for `b` in
  the killed run), the runner is wrong. Send the specifier a note naming
  the row and what the durations file held. Do not change the runner in
  this parcel: a runner change needs the hardener, and the specifier adds
  that stage.

