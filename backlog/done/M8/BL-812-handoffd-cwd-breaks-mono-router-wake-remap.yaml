source: |
  backlog/INTAKE-mono-router-chase-cwd-starves-dormant-roles.md (human via
  Cursor 2026-08-05 ~12:40 CEST; archived to this ticket on mint). Live
  recurrence confirmed ~13:30–13:50 CEST with chase-wake-error hardender /
