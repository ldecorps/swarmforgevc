invariants:
  - "A role's dwell total is the time that role was occupied: one occupancy window contributes its own duration exactly once, however many parcels shared it. This holds for any batch size and for any role that later becomes a batch role."
  - "The per-parcel ledger events are not touched. A parcel's recorded time at a stage stays its full window even when shared — the correction belongs to aggregation, because the per-parcel number is already right."

approval_context: >
  Wants sign-off on the severity call, the one genuinely arguable field.

  Filed `medium`, matching its sibling BL-918: the ceremony still runs, still
  delivers a packet, and the bounce and skip hypotheses are untouched — so
  nothing is down, and no automation acts on the dwell number.

  The case for `high` is that this is not noise but a deterministic bias with
  a fixed direction: it inflates the two batch roles and only them, on every
  shift, forever. Measured across all twelve recorded shifts, the dwell
  hypothesis named the wrong stage on five (42%), and in every one of those
  five it accused a batch role while the real hotspot was QA. A lean pass
  whose top hypothesis is systematically pointed away from the busiest stage
  is arguably worse than one with no hypothesis at all.

  I did not file `high` because the pass has a human in the loop who can
  probe the claim — which is exactly what happened here. Say so if you read
  that as thinner protection than I did; only the severity field changes.

source: |
  Surfaced by the BL-820 closing-ceremony lean pass, shift 2026-08-18
  (`.swarmforge/lean/ceremony/2026-08-18.json`), from the packet's own
  hypothesis 1: "Longest dwell this shift: hardender (11349628ms) —
  investigate that stage's throughput." Probing that hypothesis is what found
  it to be an artefact of the instrument rather than a fact about hardender.

description: |
  ## What the packet reports, and why it cannot be right

  `deriveOneDwellRecord` (`extension/src/metrics/stageDwell.ts:87`) computes a
  parcel's `processingMs` as `completed_at - dequeued_at` from the handoff
  audit headers. Per parcel that is correct: the ticket really did sit at that
  stage for that long.

  `computeDwellHotspots` (`extension/src/quality/closingCeremony.ts:148`) then
  folds those per-parcel numbers into a per-ROLE total by plain addition:

      dwellByRole.set(e.role, (dwellByRole.get(e.role) ?? 0) + e.data.processingMs)

  Addition is only a valid fold if the role handled its parcels one after
  another. Two roles do not: **cleaner and hardender are batch roles** — the
  constitution says so in as many words (Article 2.4, "Batch roles (cleaner,
  hardener) process multiple parcels at once"), and PIPELINE.md's receive-mode
  column marks exactly those two `batch`. A batch dequeues and completes its
  parcels together, so every parcel in it carries the *same* wall-clock
  window, and the sum counts that one window once per parcel.

  ## Measured on this shift's own ledger

  The batch windows are not merely similar, they are identical intervals:

      hardender  07:15:07 -> 07:44:39   1772s   BL-919
      hardender  07:15:07 -> 07:44:39   1772s   BL-625
      hardender  07:15:07 -> 07:44:39   1772s   BL-913

  Summed against the union of occupied time, per role:

      role         ceremony    real   inflation   parcels/windows
      hardender      11350s   6235s      1.82x            9/5
      cleaner         9730s   3672s      2.65x           11/6
      QA              7635s   7635s      1.00x            9/9
      architect       6222s   6222s      1.00x           11/11
      coder           2296s   2296s      1.00x            3/3
      documenter      1980s   1980s      1.00x            9/9

  Every serial role is exactly 1.00x and every batch role is not — which is
  the signature of the defect, not a coincidence of this shift.

  The ranking consequence is the point. Reported: hardender > cleaner > QA >
  architect. Real: **QA (7635s) > hardender (6235s) > architect (6222s) >
  cleaner (3672s)**. Cleaner is reported second and is actually
  second-to-last. The hypothesis slot told the lean pass to investigate
  hardender's throughput when hardener was not the hotspot.

  ## The bias is structural, not this shift's bad luck

  Recomputed over all twelve recorded shifts, the packet's top-dwell
  hypothesis named the wrong role on five: 08-08, 08-09, 08-13, 08-14 and
  08-18. In all five the displaced real hotspot was QA, and in all five the
  accused role was cleaner or hardener. On the seven shifts where it agreed,
  it agreed because the batch inflation happened not to be large enough to
  overtake the true leader — not because the fold was right.

  So one of only three hypothesis slots is spent on a stage chosen partly by
  how the fold mis-handles batching, and it is spent in a way that
  specifically and repeatedly accuses the two batch roles.

  ## Shape of the fix (direction, not mandate)

  This is an aggregation defect, so fix it in the fold, not at the emitter or
  in the ledger — invariant 2 exists to keep the per-parcel events alone, and
  the note below explains why this is deliberately NOT the same shape as
  BL-918's classify-at-the-composer fix. Reconstructing each parcel's interval
  as `[at - processingMs, at]` and totalling the union per role covers the
  identical-window case and the partial-overlap case together, and needs no
  new knowledge of which roles are batch roles — which is what invariant 1's
  "any role that later becomes a batch role" clause is protecting. A fix that
  hardcodes the current two batch roles, or that collapses only exactly-equal
  timestamps, would pass this shift and rot at the next topology change.

qa_e2e_procedure: |
  1. Take the real shift ledger `.swarmforge/lean/2026-08-18.jsonl`, which
     holds three hardener batches and four cleaner batches. Rebuild that
     shift's packet and confirm hardener reports 6235s (not 11350s) and
     cleaner 3672s (not 9730s).
  2. In the same rebuilt packet, confirm the four serial roles are unchanged
     to the millisecond: QA 7635137ms, architect 6222s, coder 2295834ms,
     documenter 1980132ms. This must be a correction of the batch fold only,
     never a change to how serial dwell is totalled.
  3. Confirm the rebuilt ranking is QA, hardender, architect, cleaner, coder,
     documenter, and that the dwell hypothesis now names QA.
  4. Rebuild the packets for 08-08, 08-09, 08-13 and 08-14 and confirm each
     one's top-dwell hypothesis changes to QA — the four other shifts this
     defect misdirected. Then rebuild 08-07, 08-10, 08-11, 08-12, 08-16 and
     08-17 and confirm their hypotheses are unchanged.
  5. Add a fixture batch of a size not seen in any real ledger (say six
     parcels in one window) at a role that is serial today, and confirm its
     dwell is that one window — the fix must not be keyed to the current
     batch roles or to observed batch sizes.

out_of_scope: |
  - Whether QA's dwell, now the true top hotspot on most shifts, is itself a
    problem. This ticket makes it visible; if QA's throughput turns out to
    need work it earns its own ticket. Correcting the instrument is not the
    same as acting on what it then shows.
  - `queueWaitMs`. It is deliberately excluded from dwell already and stays
    excluded; under mono-router it is dominated by dormant-role waits and
    would swamp the number. Do not fold it in while touching this code.
  - The per-parcel `processingMs` values and everything upstream of them in
    `stageDwell.ts` and the handoff audit headers. They are correct; only the
    per-role fold is wrong.
  - The stall and bounce hypotheses. BL-918 has already corrected the stall
    classification; nothing here touches either.
  - Any per-ticket dwell surface outside the ceremony packet. A ticket's own
    lifecycle correctly shows its full window at a batch stage.

notes: |
  2026-08-18 shift, closing-ceremony lean pass (BL-820). Recorded as this
  pass's `process_ticket` outcome.

  **Probed before speccing; one hypothesis was the instrument, the other was
  already fixed.** Hypothesis 2 ("17 nudge(s) in QA this shift — chase
  pattern") is the BL-921 pattern and needs no new ticket: 13 of the 17 are a
  single escalating burst against BL-625 between 09:34 and 09:56, and the
  remaining four are BL-921 and BL-918. BL-921 (chase trusts the active-role
  marker over pane identity) landed today and is the root cause; re-checking
  this hypothesis on a later shift is the honest way to confirm the fix, not
  another ticket now. Hypothesis 1 is this ticket.

  **This corrects a claim its sibling ticket made explicitly.** BL-918's
  `out_of_scope` says "Dwell and bounce are sound and are not touched here"
  and its notes record dwell as confirmed sound. That check was real but
  single-axis: it verified that `queueWaitMs` is excluded, which is true and
  matters. It did not ask whether summing per-parcel windows is a valid fold.
  Worth remembering that a metric can pass one soundness check and fail
  another on the same line of code.

  **Deliberately NOT the same fix shape as BL-918.** That ticket's invariant 2
  pushed the fix down to the point of classification so every reader saw one
  answer. The tempting move is to apply that shape here too — but it would be
  wrong: the per-parcel events are not misclassified, they are correct, and
  the only consumer that must not add them up is the one that wants a
  per-role total. Pushing this into the composer would corrupt per-ticket
  lifecycle views, which legitimately want the full shared window.

  **No `required_wiring:` deliberately.** The fix changes the body of
  `computeDwellHotspots`, already called from `composeCeremonyPacket`
  (`closingCeremony.ts:188`). There is no new call site the ticket's value
  depends on, so any pattern an entry could carry would already match at
  HEAD and pass vacuously — per BL-874 an entry that cannot fail is worse
  than none, because it reads as a gate.

  **IR-DRY: three findings, resolved by an Outline merge, now zero.** The
  first draft had three scenarios each asserting a differently-worded dwell
  total, which the checker flagged as possible-synonym at 0.455. They folded
  into one Scenario Outline with a `<layout>`/`<expected>` table — a real
  reduction rather than a reworded one, and it puts the whole boundary in a
  single readable table. Final: 8 step occurrences, 7 unique, 0 findings.

  **Degraded gating does not apply.** TypeScript under `extension/src`, so
  mutation, CRAP and DRY all run. No fallback to record.

  **BL-233 obligation.** Both scenarios are new and need their step handlers
  landed in THIS parcel; the acceptance runner throws on any scenario it
  cannot resolve. The `<expected>` column must validate against explicit
  KNOWN_VALUES, not pass through.

