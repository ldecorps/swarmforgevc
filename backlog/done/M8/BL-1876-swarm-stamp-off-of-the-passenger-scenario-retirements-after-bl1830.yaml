description: |
  ## Status: hotfixes c7ee0fb192 and 6dad026320 landed the fix

  This parcel is their stamp-off: the pipeline's review of what landed.
  The coder finds the features and handlers already changed. Review them,
  do not re-apply them.

  ## What the hotfixes changed

  - BL-1375: scenarios 06 and 07 (a passenger through an inconsistent or
    consistent replayed tree) are retired, and the narrative is
    re-tensed. Scenario 01's handler (`a land is available for that
    ticket`, non-tree branch) now asserts BL-1830's rebuild: the shared
    path appears in `rebuilt` with the sibling in `excluded`, and the
    sibling is not in `passengers`.
  - BL-1465: scenarios 01 and 02 are retired; 03 and 04 stand.
  - BL-1466: scenario 02 is retired. New scenario 05 (`a sibling re-fixed
    after its bounce no longer blocks the land`) reuses 02's Given and
    When, and its new Then checks that the bounce state is not blocking,
    that the plan is `replay`, and that the sibling is not a passenger.
  - BL-1389: scenario 03 is retired.
  Each retiring feature's narrative names BL-1876.

  ## What is wanted in this parcel

  - Review each change against BL-1830's ruling and the invariant.
  - The retired scenarios' step definitions are still registered and
    unused: BL-1375's tree-consistency Givens and branch, BL-1465's 01-02
    steps, BL-1466's 02 Then, BL-1389's 03 steps. Remove each one that no
    other feature uses (grep `specs/features/*.feature` for its pattern
    first, the step-registry deletion rule), or say in the evidence why it
    stays.
  - Re-run the passenger census on the parcel commit (`grep -lis
    passenger specs/features/*.feature`, 14 files at mint), running each
    feature. Any other scenario that asserts a passenger riding is raised
    to the specifier as a note, not folded in.
  - The property files that mention passengers (`grep -lis passenger
    extension/test/*.property.test.js`, 7 at mint) are run once each
    alone. A red is raised the same way.
  - Evidence: the review, the census table, and any removal.

  ## Scope

  The four features, their step handlers, and evidence.

out_of_scope: |
  - Removing land_step_lib.bb's passenger machinery (30 mentions at
    mint), now reachable only where BL-1830's rebuild cannot apply. That
    is a deprecator question for the specifier, not this review.
  - Re-stamping the Gherkin mutation manifests.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule), from the repo
  root.
  1. `node specs/pipeline/cli.js` on BL-1375, BL-1465, BL-1466 and
     BL-1389's features: 5/5, 2/2, 4/4 and 4/4 ok. Measured on the
     hotfix tree at mint: the same.
  2. `node specs/pipeline/cli.js` on BL-1830's and BL-1717's features:
     3/3 and 1/1 ok. Measured at mint: the same.
  3. Read the coder's census table and the removals.

