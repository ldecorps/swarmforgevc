approval_context: >
  One thing worth your eye, plus a correction I want on the record.

  The correction. I raised this to the coordinator as a real-timer /
  fs.watch hygiene problem - tests that should be using fakes per the
  Engineering Rules - and the coordinator approved minting it on that
  basis ("real-timer fs.watch tests match the standing isolation rule").
  Probing the files afterwards showed that framing was wrong, and it was
  my error: I had classified them by grep counts without reading them.
  BL-131 already did this work properly. Every controllable part is
  already injected (scheduleTick) and synchronous; the ONE remaining
  async step is real fs.watch delivery, kept real on purpose and
  documented as such in all three files. So this is not a
  use-fakes ticket and the fix must not add fakes. What is actually
  missing is a deadline on the await. The defect is real, but it is a
  different defect than the one I reported, and narrower.

  Severity medium. These three failed together in BL-815's 2026-08-17
  full-suite run and have not been reported since, so unlike BL-932 there
  is no repeat-offender evidence - it is a load-dependent flake, contained,
  and it misreports rather than breaks. Say high if the diagnosability cost
  bothers you more than it does me: a bare timeout naming only the test is
  genuinely expensive to chase, which is most of why this is worth fixing
  at all.

source: |
  Found by the specifier while working QA's BL-914 note, 2026-08-18.

  BL-815's evidence file
  (backlog/evidence/BL-815-unit-suite-timeout-classification-20260817.md)
  recorded these three as items 1-3 of its 2026-08-17 full-suite run, then
  explicitly placed them outside its own authoritative inventory:

  > The four NEW failures (activateBounceWatcher, bounceDrain,
  > bounceWatcher, renderBriefingBurndownCli) are OUTSIDE BL-815's own
  > authoritative inventory (the five named in the 2026-08-05 intake) and
  > are explicitly out of scope for this ticket's classification [...]
  > Worth a look if this recurs; not this ticket's inventory to reclassify.

  The fourth of those four went to BL-914 on QA's report. These three are
  the remainder. Minted on the coordinator's explicit go-ahead
  (`note`, 2026-08-18 22:49): "Yes, mint it".

description: |
  ## What happens

  Three unit tests each prove that a real filesystem event reaches a
  debounce:

  - `extension/test/activateBounceWatcher.test.js` — "startBounceWatcher
    detects bounce file creation"
  - `extension/test/bounceDrain.test.js` — "startGracefulBounceFileWatcher
    detects a bounce-graceful file and deletes it"
  - `extension/test/bounceWatcher.test.js` — "startBounceWatcher wires real
    fs.watch events into the debounce"

  All three use the same shape, introduced by BL-131:

      let resolveCaptured;
      const captured = new Promise((resolve) => { resolveCaptured = resolve; });
      const scheduleTick = (fn) => { capturedTick = fn; resolveCaptured(); };
      ...
      fs.writeFileSync(<watched path>, ...);
      await captured;
      capturedTick();   // fire the debounce synchronously

  That is good design as far as it goes: the debounce delay is injected
  and fired synchronously, so there is no real-clock sleep anywhere. The
  gap is that `captured` has NO deadline. It resolves when the real
  fs.watch event arrives, and never otherwise.

  On a loaded host the OS can deliver that event late, or coalesce and
  drop it. The await then simply sits there until Vitest's lane-wide
  20000ms testTimeout fires, and the report is a bare "test timed out"
  naming the test and nothing else - no indication that what actually
  happened is that a watch event never showed up. Chasing that from the
  failure text alone is expensive, which is the real cost here.

  ## What this is NOT

  It is not a fake-the-timers ticket. BL-131 already injected everything
  that can be injected, and each file carries a comment saying so:

  > fs.watch's own event delivery is the only genuinely OS-async part here
  > - it can't be faked without replacing fs.watch itself [...] No fixed-ms
  > setTimeout anywhere.

  Replacing the real watcher would delete the only thing these three tests
  verify. Invariant 1 exists to stop that being the fix.

  ## How (direction, not mandate)

  Bound each wait and make its expiry say what did not arrive - a race
  between `captured` and a deadline that rejects with a message naming the
  watched path and the awaited event is the obvious shape, and the three
  files can share one small helper rather than each growing its own copy
  (extension/test/helpers/ is where such material already lives).

  Pick the deadline well below the lane's 20000ms so the test's own error
  wins the race and the operator sees the useful message rather than the
  bare one. Whether these three additionally want per-test headroom is a
  judgement call for whoever measures - the point of this ticket is the
  diagnosis, not the budget.

out_of_scope: |
  - Not BL-914, though both live in the unit lane. BL-914's six tests are
    slow because the work genuinely takes that long (real dependency-cruiser
    runs, real mermaid/resvg rendering) and its remedy is headroom. These
    three normally complete in milliseconds and fail only when an event is
    late; headroom alone would leave the undiagnosable failure text intact.
    Different cause, different fix, deliberately not merged.
  - Not BL-932, which is the property lane under a different config.
  - Not the debounce, watcher or drain behaviour itself. This ticket touches
    how the tests WAIT, never what they assert.
  - Not vitest.config.mjs's lane-wide testTimeout.

notes: |
  Correction on the record, because the reasoning that produced this ticket
  was wrong twice before it was right, and the wrong versions are both
  written down elsewhere. First I classified these three by grep counts
  (`setTimeout|fs.watch|await new Promise` hit counts of 4, 2 and 11) and
  concluded they were real-timer hygiene violations needing fake seams.
  That is what I told the coordinator, and it is what the coordinator
  approved. Reading the files showed the counts were mostly matching BL-131's
  own explanatory comments, not live call sites, and that the design is
  already correct apart from the missing deadline. If the phrase "real-timer
  class" appears in any note about these files, it came from me and it is
  wrong.

  Step handlers (specs/pipeline/steps/bl933BoundedWatchWaitSteps.js) do not
  exist yet and must land in the coder's parcel - the acceptance runner
  throws on a scenario with no handler (BL-233).

qa_e2e_procedure: |
  1. The diagnosis, which is the actual deliverable. Force the failure: make
     the watch event impossible to deliver (point the watcher at a path the
     test never writes, or close the watcher before writing) and run the
     test. Confirm it fails from its OWN deadline with a message naming the
     awaited watch event and the path - not a bare Vitest "test timed out".
     Confirm this for all three tests, not just one.
  2. The deadline really is shorter than the lane budget. Confirm the
     failure in step 1 arrives well before 20000ms; if the lane budget wins
     the race the fix has not landed, whatever the code looks like.
  3. The watcher is still real (invariant 1). Inspect all three tests and
     confirm each still registers a real fs.watch on a real temp directory
     and still writes a real file to trigger it. A fake, stub or injected
     watcher is a fail even with every test green - it would mean the tests
     no longer prove what they exist to prove.
  4. Happy path unaffected. Run the three tests normally and confirm they
     pass, then run the whole unit suite from extension/ (never the repo
     root) and confirm no regression elsewhere. Record host load at
     verification time, per BL-914's precedent - a pass on a quiet host is
     weak evidence for a load-dependent flake.
  5. Fixture hygiene. These tests create temp dirs via mkTmpDir; confirm the
     new bounded-wait path still reaches their cleanup when the wait EXPIRES,
     not only when it succeeds. A deadline that throws past a cleanup leaks a
     fixture dir on every timeout, which is the BL-928 failure re-introduced.

