id: BL-1414
title: "A repeating FRESHNESS_VIOLATION is announced on its first tick, then digested at most once per window with a suppressed-tick count, and its recovery announced once; the incident record still gets one line per tick (human, 2026-09-05: reduce the traffic of this alert)"
