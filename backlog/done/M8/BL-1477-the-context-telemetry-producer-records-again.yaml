id: BL-1477
title: "The context-telemetry producer has recorded nothing since 2026-08-30T08:04:46Z: the host's unclean shutdown that morning left context-events.jsonl ending in 4 KB of NUL bytes, readPersistedContextEvents and context_telemetry_store.bb read-events! both throw on that line, so run-context-telemetry-producer.js exits non-zero every cycle, the GH-23 dashboard and BL-565 cost ledger read nothing, and no log line says so; both readers tolerate a torn tail identically, interior damage fails closed but loud, and a tick records at most a capped batch inside its own deadline"
milestone: M8
type: defect
severity: high
# high: a broken health signal - the GH-22 context-events store, GH-23's
# context budget dashboard and BL-565's cost ledger have all been dark for
# eight days without a log line. Not critical: nothing is down and no data
# was lost that the transcripts cannot replay. Fixing it naively WOULD be
# critical-shaped (BL-1454): ~200000 events to backfill, one bb subprocess
# each, no cap, no deadline, against a 60 s wait bound - hence the bound is
# part of this ticket, not a follow-up.
status: todo
epic: swarm-reliability
priority: 7
direction: swarm-reported
depends_on: []
mutation_cost: medium
