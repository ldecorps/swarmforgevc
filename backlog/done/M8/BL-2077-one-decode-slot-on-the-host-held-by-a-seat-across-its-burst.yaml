id: BL-2077
title: "One decode slot on the host, held by a seat across its burst: Ollama serves one completion at a time first come first served, and every completion that follows another seat's is a full iq3 re-prefill (23-66 s against 4-7 s cached), so standing local seats taking turns per request would spend most of the GPU re-reading prompts; the shim now holds one decode slot for one seat at a time, kept while the seat keeps asking, handed over when it goes quiet past an idle grace or has held it past a hold quantum while another seat waits, with the waiting seat kept alive and the holder and waiters on the health endpoint"
