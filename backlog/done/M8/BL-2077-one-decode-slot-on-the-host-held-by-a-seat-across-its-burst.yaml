notes: |
  Minted 2026-10-08 by the specifier, second of the intake's 1:3 split
  (BL-2076 seat names, BL-2077 this, BL-2078 the gated forge pack).
  Not auto-approved: a feature with a new feature file.
  Shape chosen: the intake's A (a lock in the shim) with B's lease
  semantics (held across a seat's burst), in the one process every local
  seat already reaches Ollama through. Why the others lose:
  - A as a per-request lock is what Ollama already does, and it is the
    expensive order: every change of seat is a full re-prefill.
  - B as a separate daemon needs each seat to ask before generating, and
    qwen is a third-party CLI with no hook there; the shim already sees
    every request and nothing else does.
  - C (stay mono) leaves the GPU idle about half of each active hour
    (below); it stays the default for router packs (BL-2078).
  - D (depth caps only) caps tickets, not concurrent /v1 calls; standing
    seats would still interleave per request.
  Measured at mint, 2026-10-08:
  - serve.log prompt-eval lines: cached continuation 0.5-2 s; full
    re-prefill 23-38 s at 20-30k tokens, 66 s at 50k; decode about 26
    tok/s; typical reply 85-130 tokens (3-5 s).
  - GPU busy per hour on the mono pack (sum of [GIN] chat-completion
    latencies, 2026-10-07 20:00 to 2026-10-08 06:00 local): 21, 77, 46, 49,
    50, 19, 25, 79, 67, 43 %.
  - qwen chat JSONL, every local seat since 2026-10-04: 41.5 h model time
    against 11.1 h tool time (21%); tool calls of 15 s or more: 437 calls,
    8.7 h; of 60 s or more: 130 calls, 5.8 h. So one seat leaves the GPU
    idle about a fifth of its active time, and the pipeline (depth 1,
    rotation, waits) leaves more.
  - VRAM, /api/ps: ista-iq3s-coder:latest, 14.5 GB, all in VRAM, context
    73728 (KV about 34 KiB per token, so about 2.4 GB). A second context
    does not fit beside it on 16 GB.
  IR-DRY at mint: "sends a chat completion" against "sends a streamed chat
  completion" are two behaviours, kept; "has not reached" against
  "reaches" are opposite outcomes, kept; the held-for-quantum Given is one
  pattern with two values.
  INVEST: Independent (needs BL-2076's seat names, declared), Negotiable
  (lease shape, grace and quantum values), Valuable (standing seats can
  share one slot without per-request re-prefills), Estimable (one lease on
  one request path), Small (four scenarios), Testable (real shim over a
  fake Ollama that answers on release).
  Amended 2026-10-09 (QA note 003953, evidence e94df3b5cf, D1 spec-gap).
  As minted, the slot keyed on the role the URL names (BL-2076), so on a
  rotating pack every rotation was a change of seat: the rotated-in
  role's first completion waited out the departed role's idle grace (QA's
  repro: 2508 ms at a 3 s grace; up to 30 s at the default) with no other
  seat alive, against invariant 3 and approval_context's FIRM "a lone
  seat never waits". Ruling: a seat is a pane. A rotating pack is one
  seat to the slot whichever role runs; a standing pack's roles are
  separate panes and the idle grace stands. Added scenario 05 with two
  rows: the standing row keeps the fix from collapsing into "every role
  is one seat", which would leave BL-2078's standing pack with no slot.
  Invariant 3 reworded; the how-to's one-seat line follows. No new
  scope: scenario 05 is the executable form of the approved FIRM line, so
  human_approval stays approved. The parcel (1d9eec0235) was built
  correctly against the ticket as minted and QA recorded no bounce, so
  nothing is charged to the coder.
  Rebuild from 1d9eec0235: merge main (this amendment), add scenario 05's
  steps to bl2077DecodeSlotSteps.js, change the slot or the writer, and
  the documenter corrects the how-to's one-seat line.
  The feature was edited on main: the parcel does not change it and
  carries no mutation stamp (no hardener stage), so the BL-1385 conflict
  cannot arise.
  IR-DRY for scenario 05: "names cleaner as holding the slot with no seat
  waiting" against scenario 01's "names coder as holding the slot and QA
  as waiting" are two states, kept; the Given and the When are two
  different sends, kept.
