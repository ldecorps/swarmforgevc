description: |
  ## What is wrong

  QA note 003132 and evidence 32afd7a356
  (`backlog/evidence/BL-1703-unowned-red-hold-QA-20260924.md`): `npm
  test` at BL-1703's parcel a6a5b51a5c, via qa-gather.js at load about
  10, passed every test and exited 1 on the suite file budget guard:
  `2 new-pole offender(s): extension/test/emitLifecycleSnapshotCli.test.js:
  10.9s exceeds the 7.0s per-file budget` / `extension/test/
  telegramFrontDeskBotCli.test.js: 11.3s exceeds the 7.0s per-file
  budget`. The same qa-gather run reported `stragglers_before exit 1`
  (orphaned test processes present before it started).

  Specifier, main, same hour, load 3.1-3.4: both files pass (the
  front-desk file 4.0 s, 276 tests), and calling the guard's own
  `confirmPoleAlone` (recordTestDuration.js, exported) returns 16 ms and
  4,156 ms - both would be contention, a pass. So at QA's run each
  confirmation either measured 7 s or more alone or returned null, which
  BL-1633's FIRM counts as over budget. A 16 ms file measuring 7 s alone
  is implausible even at load 10, so a failed confirmation is the likely
  one - but the refusal line prints only the in-suite number, and the
  confirmation spawns vitest with `stdio: 'ignore'`, so its reason is
  gone. BL-1633's own comment records one real null cause
  (ERR_CHILD_PROCESS_STDIO_MAXBUFFER, 2026-09-18).

  ## What is wanted
  - Scenario 01 (outline): fail then 4.2 s -> contention, both numbers
    named; fail twice -> new pole, both failures named; 8.0 s alone ->
    new pole, both durations named.
  - A null carries its reason out of the confirmation: the spawn error,
    the timeout, a missing report, or no entry for the file.

  ## How (direction, not mandate)
  - `confirmPoleAlone` returns `{ms}` or `{failed: reason}` instead of a
    bare null; the verdict path retries once on `failed` and keeps both
    results for the line. `runGuardAgainstReport` already takes the
    confirmation as a parameter - the tests inject it.

  ## Scope
  - `extension/scripts/recordTestDuration.js` (the confirmation's result).
  - `extension/src/tools/check-suite-file-budget.ts` (retry, verdict,
    line format) and its unit tests.
  - `specs/features/BL-1721-...feature` + the pinned handler.

  ## Not in scope
  - The per-file budget, the pole register, or cutting either file's
    in-suite time (BL-791's slices).
  - Straggler processes before a run (qa-gather already reports them).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1721-a-failed-pole-confirmation-is-said-and-retried-once.feature`:
     all ok (3 of 3).
  2. `cd extension && npm test`: the suite passes; record the host load
     average and, if the guard prints any offender line, that it names an
     alone result or failures.
  3. `git diff main...HEAD --name-only` names only the Scope files, the
     feature, the handler, docs and evidence.
  4. After landing: the land prints REGISTER_ROW_RETIRED for both rows;
     resume BL-1703's land.

