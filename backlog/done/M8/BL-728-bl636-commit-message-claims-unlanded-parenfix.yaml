description: |
  ## What

  Confirm, independently of commit-message prose, whether the "one-shot
  handoffd flags blocked under streaming eval" bug BL-636's ticket described
  is actually fixed on main today, and by what change. BL-723 found:
  landing commit 6a2e4aaf6 says it restored a deliver! close paren dropped
  by BL-611, but that commit's own diff never touches handoffd.bb; the
  explicit repair existed only on unmerged 79c5d09b8 (expedite/BL-571).
  deliver! is balanced on main today — git blame points at 5f9a79511
  (BL-611 productization), likely incidental to removing
  enqueue-babysitter-wake!, not BL-636's priority-ordering land.

  ## Deliverables

  1. **Evidence** — `backlog/evidence/BL-728-handoffd-deliver-paren-verification-<date>.md`
     tracing the bug scenario, whether main is fixed, and which commit(s)
     actually closed deliver! (with `git show` / blame references). Explicitly
     note 6a2e4aaf6 did not touch handoffd.bb.
  2. **Regression lock** — fixture-backed test(s) proving Babashka can load
     handoffd.bb and that `--poll-once`, `--sweep-once`, and
     `--chase-sweep-once` each reach their `*-once done` log line (see
     `test_handoffd_briefing_generation_wiring.sh` for fixture discipline:
     fake tmux, throwaway root, SWARMFORGE_ALLOW_TMP_DAEMON=1).
  3. **Fix if broken** — scenario 05: if any one-shot path still fails, repair
     in this parcel; do not close with evidence alone.

  ## How (direction, not mandate)

  Do not re-litigate BL-636's mono_router_lib priority fix — that half is
  correct and tested. Do not reimplement 79c5d09b8's comment-only paren
  annotation unless verification proves main is still broken. Cite BL-729
  only as context (commit-claim gate); this ticket owns the underlying
  handoffd behaviour.

qa_e2e_procedure: >
  (1) Read evidence file — must name closing commit(s), state fixed/not,
  and note 6a2e4aaf6 absent from handoffd.bb diff.
  (2) Run new handoffd one-shot wiring test(s) — all green on fixture root.
  (3) `bash specs/pipeline/scripts/run_acceptance.sh
  specs/features/BL-728-handoffd-deliver-paren-verification.feature` — all
  scenarios green after compile.
  (4) Optional live: `bb swarmforge/scripts/handoffd.bb . --poll-once` on a
  running swarm root — log contains `poll-once done` (env permitting).

out_of_scope: |
  - Re-litigating BL-636 priority-ordering (mono_router_lib.bb) — correct.
