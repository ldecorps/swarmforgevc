description: |
  ## What the human asked for (verbatim intent)

  Make BL-669 CLI load-file safe with a regression test that
  `(load-file outage_failover_cli.bb)` does not exit.

  Incident: `handoffd.bb` `(load-file …/outage_failover_cli.bb)`. A bare
  `(-main)` printed usage and `System/exit 1`, so restored handoffd could
  not start. Same guard shape as `post_hotfix_merge_origin.bb`.

  Locked: load-file of a CLI must never `System/exit`.

  ## What to do

  1. Keep/confirm the entrypoint guard:
     `(when (= *file* (System/getProperty "babashka.file")) …)`.
  2. Regression test: `(load-file …)` from a harness must return without
     process exit; entrypoint invocation still runs `-main`.
  3. Certify hotfix `ca45facb4` (Hotfix-Certification) via this ticket's
     QA land path / ledger update as house shape requires.
  4. How-to note under BL-669 or BL-1150 docs.

  ## Out of scope

  - Zero-byte preflight (BL-1149)
  - Launch contract standing packs (BL-1151)
  - start-swarm ready semantics (BL-1152)

qa_e2e_procedure: >
  (1) bb harness load-files outage_failover_cli.bb → process still alive,
  exit 0 from harness. (2) bb outage_failover_cli.bb with no args → usage
  path still works. (3) handoffd can load-file the CLI without aborting
  before pid claim.

