description: |
  ## What is wrong

  `specs/features/BL-094-holistic-dev-state-web-ui.feature` has five
  scenarios; 16 of its 17 step lines match no handler, so it fails 0/5
  with "no step handler matched" ("When a browser with the bearer token
  opens the bridge root URL", "Given active tickets exist, some carrying
  a swarm assignment field", ...). BL-094 closed without a binding. The
  BL-1937 census (2026-10-03) counted only features with NO bound step,
  so it missed this one: one generic step binds elsewhere. Found
  2026-10-06 by the specifier measuring BL-2020's bounded sample (the
  first five features in name order).

  ## What is wanted

  A step handler, `specs/pipeline/steps/bl094HolisticDevStateWebUiSteps.js`,
  that binds every step of the feature as written, so it passes 5/5
  against the shipped code. If a scenario's behaviour is no longer
  shipped, stop and send the specifier a `spec-gap` note naming the
  scenario rather than binding it to something else.

  ## How (direction, not mandate)

  Mirror BL-1937's `bl096VelocityBurndownMetricsSteps.js`: drive compiled
  modules in-process; for the bridge, reuse the bridge-server test seam an
  existing bearer-token handler uses (e.g. `deviceRegistrySteps.js`)
  rather than binding a port by hand; register with `defineScoped` under
  BL-094's `Feature:` name so its generic steps never answer another
  feature (BL-1277). Remove the register row in the same parcel only if
  the land step does not (BL-1631 retires it at land).

qa_e2e_procedure: |
  On the parcel commit, ONE run.
  1. `node specs/pipeline/cli.js specs/features/BL-094-holistic-dev-state-web-ui.feature`:
     5 ok, 0 fail (measured 0/5 at mint, main 2026-10-06).
  2. While this ticket is open the register row naming
     BL-094-holistic-dev-state-web-ui.feature is present and owned by
     BL-2022; after the land, check on origin/main that it is gone.

