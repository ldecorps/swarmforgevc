required_wiring:
  - "swarmforge/scripts/babysitterd_sweep_lib.bb::resident-stranded::the finding :key, so the check exists in the ported sweep lib and is reachable from assemble-findings rather than living as an uncalled predicate"
  - "swarmforge/scripts/babysitter_check.bb::resident-active-role::the live sweep entry point must GATHER the resident's active role as a top-level snapshot key. Without this the check reads nil in exactly the case it exists to detect - see 'Wiring findings' in the description. This is the entry that stops the BL-419 shape."

invariants:
  - "Detection never depends on the stranded resident having done anything. Every signal the check reads is observable from outside the resident's own turn — pane state, the active-role file, mailbox contents on disk. The defect being detected IS the resident failing to act, so any check that needs its cooperation cannot see it. This is exactly why both existing safeguards miss it."

approval_context: >
  The intake was explicit that it is "a report, not a design" and asked the
  specifier to size it. Sizing it produced one real choice, which is what needs
  sign-off:

  This ticket specs DETECTION only — the deterministic sweep grows a check that
  sees a stranded resident and nudges the coordinator, which then re-dispatches.
  The intake also floated PREVENTION (proposal 2): have the mono-router
  launch/respawn wrapper enforce the rotate step structurally, as a
  post-condition before the pane's turn truly ends, rather than trusting the
  model to reach the last line of its checklist every time.

  Prevention is deliberately NOT in this ticket. It is a larger, riskier change
  to the rotation path — it has to distinguish "turn ended correctly" from "turn
  ended early", and injecting a reminder into a pane at turn end interacts with
  the endless-loop circuit breaker, which halts the whole swarm on a repeated
  no-op spin. Detection is small, fully decidable from disk, and closes the
  silent-stall half on its own.

  Confirm: detection now, prevention as a separate ticket if the nudge loop
  proves insufficient in practice? Or should prevention be specced alongside?

severity_rationale: >
  high — a live fault that silently stops all pipeline progress. Not critical:
  the swarm is not down and no data is lost, and once detected the existing
  coordinator re-dispatch path recovers it. But unlike the Class A failure it
  sits beside, this one needs no external trigger — it is a property of the
  resident's own turn-ending behaviour, so it can recur every time any role
  finishes a batch. Article 3.2.4 expedite applies; note that depends_on gates
  promotion regardless, so the lane does not actually move it ahead of BL-611.

source: |
  Operator intake `INTAKE-resident-turn-ends-without-self-rotation.md`, filed
  2026-07-26 by the human live during that evening's stall.

  ## Two failure classes, only one of them monitored

  **Class A — already monitored** (`rotate-unhonored`, sweep check 9). A rotate
  INSTRUCTION exists, is delivered, is marked completed, and
  `mono-router-active-role` never flips. Confirmed incident 2026-07-24
  23:59Z-02:57Z: ~1h of repeated CRIT `rotate-unhonored-QA` while the persona
  stayed on coder/cleaner/architect/hardender.

  **Class B — NOT monitored, this ticket.** No rotate instruction exists to
  check, because none was ever written. Measured 2026-07-26 ~20:38Z onward: the
  resident finished a real batch as specifier (BL-680/681/682/683, six commits
  20:29-20:38Z, including an Article 5 constitutional ratification), then ended
  its turn deliberately and reasonably — "it deserves a fresh turn" — without
  the protocol's mandatory last step.

  Verified state 9+ minutes later: `mono-router-active-role` still `specifier`;
  both specifier mailboxes (`new`, `in_process`) empty; pane content
  byte-identical across two captures fifteen minutes apart; process state `Sl+`,
  genuinely sleeping rather than computing.

  ## Why both existing safeguards miss it — the same blind spot twice

  Verified against the tracked helpers, not assumed:

  - `ready_for_next.sh:23` prints `ROTATE_HOME` for a non-home role with an
    empty mailbox and execs `rotate_to_role.sh` (BL-550, covered by
    `test/test_ready_for_next_rotate_home.sh`). It works — but it only runs if
    the resident RUNS `ready_for_next.sh`. Class B is the resident not running
    it at all.
  - `rotate-unhonored` looks for a completed parcel carrying a rotate
    instruction. In Class B no such parcel exists, so the check finds nothing
    and reads green.

  Both are triggered by an action the stranded resident skipped. The two checks
  must be ADDITIVE, not one generalized — that is the intake's own conclusion
  and it is right.

  ## Why this is a turn-boundary problem, not a reasoning problem

  The 2026-07-26 turn was full, productive and well-reasoned, and still skipped
  the mandated final step — with an explicit, self-aware rationale for stopping.
  That is consistent with the session's separate finding that turn OVERHEAD, not
  per-command mechanics, is the dominant cost class (BL-664). A safeguard that
  asks the model to remember one more last line is betting against the same
  boundary that already lost.

description: |
  ## The check

  A deterministic sweep check, distinct from `rotate-unhonored`, whose firing
  signature is the observable shape of Class B:

  - the resident's pane is idle (no busy footer), AND
  - `mono-router-active-role` is not the configured home role, AND
  - the resident's mailboxes (`new` and `in_process`) are empty, AND
  - no dispatch note to the coordinator is pending, AND
  - the idle state has persisted past a grace period.

  All five, together. Each of the last four is a suppressor with a real
  false-positive it exists to prevent — a resident that is busy, holding work,
  legitimately at home, or has already correctly asked for dispatch is NOT
  stranded, and neither is one that merely paused mid-turn.

  On firing: a CRIT-equivalent finding naming the role the resident is stuck in,
  nudged to the coordinator under the same dedup/cooldown contract as every
  other nudge class, so the coordinator re-dispatches.

  ## Where it lives, and why it waits for BL-611

  This is a new entry in the babysitter's check catalogue, which BL-653's
  `out_of_scope` already assigns to BL-611. It must wait for BL-611 for the same
  reason BL-653 does: the sweep lives entirely in gitignored
  `.swarmforge/operator/`, so until BL-611 ports it into `swarmforge/scripts/`
  there is no tracked file for this check to be added to, no test runner to
  cover it, and nothing QA could verify at a commit.

  ## Wiring — the check must RUN, not merely exist

  A pure predicate that no sweep calls is the BL-419 shape: shipped, unit-tested,
  green, and wired into nothing. The check must be registered in the real sweep's
  check list and reachable on a live run, and the acceptance evidence must show
  it firing from the sweep entry point rather than from a direct unit call.

  ## Wiring findings — specifier probe at promotion, 2026-08-19

  `required_wiring:` was deliberately left unpinned at mint because BL-611 had
  not yet chosen the ported sweep's filename. BL-611 has since landed, so the
  paths are now known and pinned above. Probing them turned up three things
  that change what gets built. None is a scope change; all three are traps the
  coder would otherwise hit at the keyboard.

  **1. The active role is invisible to the sweep lib in exactly the Class B
  case — this check cannot be built the obvious way.** `babysitter_check.bb`
  does read the marker (`active-role-marker`, line ~335), but the only path by
  which the role reaches `assemble-findings` is as `:active-role` INSIDE the
  `:rotate-note` map, and `gather-rotate-note` returns `nil` when no rotate
  note exists. Class B is *defined* by no rotate note existing. So a check
  wired into `assemble-findings` that reads the role off `:rotate-note` gets
  `nil` on every real occurrence and can never fire, while passing every test
  written over fakes. That is the BL-419/BL-298 shape — green suite, dark
  production — and it is why the second `required_wiring` entry pins the
  gather site and not just the lib. The fix is a NEW top-level snapshot key
  carrying the resident's active role, independent of `:rotate-note`. Its name
  is fixed as `:resident-active-role` for one reason only: the pre-QA gate
  matches a literal substring, so it needs a string that will actually exist
  (BL-874).

  **2. The streak store is a single scalar already owned by another check.**
  `read-streak`/`write-streak!` in `babysitter_check.bb` read and write one
  integer in one file, and `check-swarm-starved` owns it. A second
  streak-based check sharing it makes the two corrupt each other's counters
  every sweep. Whatever persists this check's grace period must have its own
  slot, or the store must become keyed.

  How (direction, not mandate): a streak is not the only way to satisfy "idle
  has persisted". `active-role-marker-mtime-ms` already exists and measures
  how long the resident has been in its current role with no new persistence
  at all, which may compose better with the pane-idle suppressor than a second
  counter does. Worth weighing before adding state; either is acceptable, a
  shared `streak-file` is not.

  **3. The non-mono-router suppressor already exists — do not re-derive it.**
  `out_of_scope` excludes non-mono-router packs, and the sweep already
  resolves `rotation-router?` once per run via `rotation-router-mode?`. Read
  that, do not invent a second topology probe.

acceptance: specs/features/BL-685-stranded-resident-detection.feature

qa_e2e_procedure: >
  Read this first: THIS CHECK CANNOT BE SEEN FIRING ON THE LIVE SWARM, and
  that is not a defect. Measured 2026-08-19 on this host: eight tmux sessions,
  one per role (`swarmforge-coder`, `-cleaner`, `-architect`, `-hardender`,
  `-documenter`, `-QA`, `-specifier`, `-coordinator`), and no active `config
  rotation` line in `swarmforge/swarmforge.conf`. That is a full 7-role pack
  plus coordinator, not a mono-router pack, so `rotation-router-mode?` is
  false and the stranded-resident shape does not exist here at all
  (`out_of_scope` excludes exactly this topology). Do not wait for it to fire
  live, and do not pass the ticket on the grounds that it "did not misfire" -
  silence on this pack proves only suppressor 3.

  1. Run the acceptance feature and confirm every scenario passes:
     `node specs/pipeline/cli.js specs/features/BL-685-stranded-resident-detection.feature`
     (5 scenarios, 02 an outline over 5 rows). Confirm its step handlers
     landed in the SAME parcel - the file is already a live `.feature` with no
     handlers today, so a parcel that adds scenarios without handlers hard-fails
     the runner (BL-233).
  2. Verify the check is reached from the sweep ENTRY POINT, not by a direct
     unit call: confirm `check-resident-stranded` (or whatever it is named) is
     invoked inside `assemble-findings` in
     `swarmforge/scripts/babysitterd_sweep_lib.bb`, and that a
     `resident-stranded` finding appears in the vector `assemble-findings`
     returns. A predicate that only a test calls is a fail (BL-419 shape).
  3. Verify the live-data half, which is the one that silently rots: confirm
     `swarmforge/scripts/babysitter_check.bb` populates a TOP-LEVEL
     `:resident-active-role` snapshot key, and that it does NOT come from
     `gather-rotate-note`. Prove it the hard way - construct a fixture state
     dir with a `mono-router-active-role` file and NO rotate note at all, run
     the sweep, and confirm the finding still fires. If it fires only when a
     rotate note happens to exist, the check is wired to the one input that is
     absent in every real Class B occurrence and must bounce.
  4. Confirm the grace-period state does not collide with `check-swarm-starved`:
     if a streak was added, confirm it uses its own slot and not the single
     `streak-file` scalar that `read-streak`/`write-streak!` share. Drive both
     conditions in one fixture run and confirm neither counter resets the
     other. If the implementer used `active-role-marker-mtime-ms` instead, no
     new state exists and this step is satisfied by inspection.
  5. Confirm each of the four suppressors independently, one fixture per row of
     scenario 02, and confirm the finding is absent in each. A check that fires
     on a busy resident or one holding an in_process parcel is worse than no
     check - it trains the coordinator to ignore the nudge.
  6. Confirm invariant 1 by inspection: every input the check reads is
     observable from outside the resident's turn (pane state, the active-role
     file, mailbox contents on disk). Any input that requires the resident to
     have run something is a fail - that is the whole defect.
  7. Confirm scenario 05 for real: `git diff` the parcel and confirm no
     `send-keys`, no `tmux` write, no rotate invocation on any path this check
     can reach. It reports and nudges; it never remediates.
  8. `git show --stat`: expect the sweep lib, `babysitter_check.bb`, the step
     handler, and the sweep lib's test runner. Anything touching
     `check-rotate-not-honored` is out of scope (the two checks are additive).

out_of_scope: |
  - Structural PREVENTION in the rotation path (the intake's proposal 2) — see
    `approval_context`. Separate ticket if wanted.
  - Any auto-remediation: this check observes and nudges the coordinator. It
    never rotates the resident itself, sends it a keystroke, or picks a menu
    option — BL-611's read-only invariant covers the whole sweep and scenario 05
    pins it for this check.
  - Changing `rotate-unhonored` (check 9). The two are additive; generalizing
    one into the other is how the blind spot was missed in the first place.
  - The operator's wake source. That is BL-653, a different layer — this ticket
    is about the RESIDENT's turn-ending discipline, not who gets woken.
  - Non-mono-router packs, where every role has its own standing session and the
    stranded-resident shape does not exist.

notes: |
  2026-08-01 Let's Talk (human): severity high → medium so the JumpQ
  pilot-process batch can clear the high tier; detect-only sibling of the
  rotation work already landed, not a live outage.

  Specced 2026-07-27 from the operator intake, which is now archived.

  2026-08-19, promotion pass (specifier): BL-611 has landed
  (`backlog/done/BL-611-...yaml`), so the two deferred `required_wiring:`
  entries are now pinned against real tracked paths, and a `qa_e2e_procedure`
  the ticket had been missing was written. Probing those paths produced the
  three "Wiring findings" in the description - the first of which (the active
  role being unreachable from `assemble-findings` in precisely the Class B
  case) would have let this ship green and dead, so it is worth reading before
  starting rather than discovering at review.

  Also checked and deliberately NOT changed: `specs/features/BL-685-...feature`
  is a live `.feature` with no step handlers yet, which normally violates the
  BL-233 draft rule. Leaving it: features are run one at a time by explicit
  path (no glob runner), so nothing is currently red, and
  `promote_and_route_next.sh:142` gates promotion on a `.feature` existing -
  renaming it to `.feature.draft` would retract this ticket's own promotion.
  The handlers must land in the same parcel that builds the check.

  Sequencing: BL-611 (ports the sweep into git) -> this. Both sit behind the
  same dependency for the same structural reason, and BL-653 joins them — three
  tickets that all needed the babysitter to be a tracked deliverable before they
  could be built at all. That is worth noticing as a pattern rather than three
  coincidences: an untracked prototype accumulates dependents silently.

  The intake noted the coordinator, on receiving the babysitter's stuck-parcel
  nudge, independently began investigating the resident's process tree with
  `ps --ppid` rather than assuming it dead or wedged. That is the correct
  caution and the reason this check reports rather than remediates: from
  outside, a stranded resident and a busy one differ only in signals this check
  is required to read properly.
