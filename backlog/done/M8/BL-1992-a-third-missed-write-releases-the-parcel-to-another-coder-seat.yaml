description: |
  ## What is wanted

  1. A seat BL-1991 already restarted twice on its parcel, which again
     makes three tool calls that are not the named write, is not
     restarted. The parcel leaves its in_process, and the coordinator gets
     a note naming the parcel's ticket so another coder seat can take it
     (scenario 01).
  2. A seat that writes the named file on its last chance keeps its parcel
     and no note is sent (scenario 02).

  ## How (direction, not mandate)

  - The branch sits beside BL-1991's decision, in whatever file BL-1991
    put it.
  - Move the parcel out of in_process the way the coordinator's pull
    already does (in_process to the seat's inbox/abandoned), so nothing
    keeps routing it to this seat.
  - Send the note through `swarmforge/scripts/swarm_handoff.sh` (a `note`
    to coordinator, at most 80 characters, naming the ticket id).
  - Step handler `specs/pipeline/steps/bl1992ThirdMissReleasesParcelSteps.js`
    (BL-1371). Its steps repeat BL-1991's text word for word, so register
    them with `registry.defineScoped(pattern, handler, featureName)`
    (BL-425).

out_of_scope: |
  - Which coder seat takes the released ticket: the coordinator routes it.
  - The seat working on after its ticket was parked as blocked: a separate
    fault (the intake's own words).

