source: |
  backlog/hotfix-ledger.yaml row `5bdf93beed` (detected 2026-09-12, state
  pending, no stamp ticket) surfaced by the certification sweep as a
  coordinator note, forwarded to the specifier 2026-09-12 17:26Z. Hotfix
  landed by the operator (human-directed, Claude Code) 2026-09-12 16:10
  BST. The operator's ask is recorded only in the commit message: "That is
  exactly the deadlock the operator asked to fix (observed live: QA
  resident sent specifier a priority-00 note and sat 'in_process pending
  that reply' while chase logged chase-rotate-seated-preferred-yield
  followed by chase-rotate-departing-mid-parcel, forever)."

  Second row (from BL-1591, absorbed 2026-09-21): backlog/hotfix-ledger.yaml
  row `a27d082c2d` (detected 2026-09-16, state pending, no stamp ticket),
  appended by the certification sweep to the shared checkout and found
  uncommitted by the specifier at the 2026-09-16 ceremony pass (no
  coordinator note had reached the specifier yet; the row was committed
  with BL-1591's mint so the link had a row to sit on). Hotfix landed by
  the operator (human-directed, Claude Code) 2026-09-16 07:58 BST with the
  `Hotfix-Certification: pending` trailer. The commit's own observation,
  quoted verbatim: "Observed live 2026-09-15: closing-ceremony-run's own
  state showed sequence ["freeze-promotion","lean-packet","rotate-documenter",
  "briefing-missing","swarm-stopped"] for the whole night ... No briefing
  existed for 2026-09-15 or 2026-09-16 as of this fix."

description: |
  ## What

  An operator hotfix is live on main and has never been through a gate.
  This ticket is that gate: a REVIEW ticket, not a rewrite ticket -
  confirm or refute, and open narrow follow-ups for anything found.

  ## The failure it fixed (from the commit message and the daemon log)

  BL-1535 (done 2026-09-12) taught the mono-router chase to refuse rotating
  the resident away from a role that is mid-parcel
  (`should-rotate-resident?` -> `:departing-mid-parcel`). Correct - but the
  target role's mail, often a direct question FROM the departing role (QA
  asking the specifier to adjudicate a hold), then had no live pane to
  answer it until the resident happened to go idle. Live on 2026-09-12: QA
  resident sent the specifier a priority-00 note and sat in_process
  pending that reply while chase logged `chase-rotate-seated-preferred-
  yield` then `chase-rotate-departing-mid-parcel`, forever.

  ## What landed (files to review)

  - `swarmforge/scripts/mono_router_lib.bb`: `consult-eligible?` (pure) -
    true only for gate `:departing-mid-parcel`, a target role distinct from
    the departing role, a target session that is not the resident's, and
    no consult already active for that role. Never for `:busy`,
    `:cooldown`, `:already-active`.
  - `swarmforge/scripts/handoffd.bb`: `spawn-consult-session!` fires from
    `attempt-resident-rotate!`'s existing `:departing-mid-parcel` branch
    (the refusal, its reason and its telemetry row are untouched). When
    eligible and `handoff-lib/session-exists?` says the target's own
    roles.tsv session is absent, it asks
    `single-role-repair-lib/resolve-single-role-repair` (BL-1018, the same
    one-atomic-command lib `swarm_ensure.bb` uses) for the commands with
    `:session-present? false` - ONE `new-session -d -s <session>` carrying
    `.swarmforge/launch/<role>.sh` and the openrouter env args - runs them
    through `daemon-cycle-guard-lib/sh!`, writes the marker
    `.swarmforge/daemon/consult/<role>.json` (`role`, `requested_by`,
    `started_at_ms`) and logs `consult-spawn <role> requested-by=<role>`.
    `consult-teardown-sweep!` runs on the daemon's no-extra-timeout cadence
    block (next to `cooldown-sweep`): per marker, a role/session that no
    longer resolves is cleared as `consult-teardown-stale`; a live session
    whose pane is not busy (`chase-sweep-lib/actively-processing?` on
    `capture-pane`) AND whose mailbox has nothing actionable
    (`role-mail-row` `:actionable?` - inbox/new git_handoff, rule_proposal,
    aged note, or any in_process claim) is `kill-session`ed and its marker
    cleared, logged `consult-teardown`; otherwise it is left alone.
  - Tests: `mono_router_lib_test_runner.bb` +7 assertions for
    `consult-eligible?`; green on main 705b6e8ed1 (specifier, 2026-09-12).
    `test_chase_departing_mid_parcel_gate.sh` 8 checks unchanged and green
    - NOTE for the coder: its fake tmux answers every unlisted subcommand
    with exit 0, so `has-session` reads as "present" and the spawn path is
    never reached in those checks. The spawn side has NO automated
    coverage today; scenarios 02-05 are that coverage.

  ## Review goals

  1. Confirm the gate: `consult-eligible?` is true for exactly the
     departing-mid-parcel shape and false for every sibling refusal, the
     same-session case, the same-role case and an active consult
     (scenario 01).
  2. Confirm the spawn: on the refusal, with the target's session absent,
     exactly one `new-session` carrying the target's launch script, never
     a `respawn-pane` (the resident's pane is untouched), marker written,
     and a second refusal while the marker stands spawns nothing
     (scenario 02).
  3. Confirm the consult session is actually reached: the target role's
     ordinary chase wake resolves through `handoff-lib/wake-session` ->
     `resolve-wake-session`, which prefers the configured session when it
     exists - so once the consult session is up, the wake for that role
     lands THERE, not on the resident (scenario 03). This is the step the
     commit message does not mention; without it an aider seat would sit
     on its mail forever (BL-1504's lesson) and the teardown sweep would
     keep the session alive on `:actionable?` indefinitely.
  4. PROBE, do not fix: `resolve-single-role-repair` refuses only a BLANK
     `:launch-script`, and `spawn-consult-session!` never checks that
     `.swarmforge/launch/<role>.sh` exists on disk. On a pack whose target
     role has no launch script (the aider mono-router pack deliberately
     omits the specifier window) the reading of the code is: new-session
     with a nonexistent command, the session exits at once, next sweep
     clears the marker as stale, next refusal spawns again - a spawn loop
     at chase cadence. Reproduce it in the fake-tmux fixture (two
     consecutive refusal calls with the marker cleared between, launch
     file absent) and RECORD the outcome in evidence. Confirmed -> note the
     specifier; the follow-up is a `consult-spawn-refused <role>
     no-launch-script` guard before the spawn, minted separately. Refuted
     -> say why in evidence. Either way, no in-parcel change.
  5. Confirm teardown: idle + nothing actionable -> `kill-session` +
     marker cleared; busy pane -> kept; actionable mail -> kept; session
     gone -> marker cleared, no kill (scenario 04).
  6. Note, do not fix: `consult-teardown-sweep!` is handed the daemon's
     boot-time `roles` map while its sibling sweeps call `(load-roles)`
     per cycle; the `(or (get roles role) (load-role-info role))` fallback
     covers a role added after boot, so this is a consistency remark for
     evidence only.

  ## Scenario notes for the coder

  - Scenario 01 calls `mono-router-lib/consult-eligible?` directly, the
    runner's own shape. Scenario 03 calls `handoff-lib/resolve-wake-session`
    (pure) directly.
  - Scenarios 02 and 04 drive the REAL `handoffd.bb` through the
    `test_chase_departing_mid_parcel_gate.sh` fixture shape (fixture git
    root under mkdtemp proven by `rev-parse --git-common-dir`, fake tmux
    on PATH, `SWARMFORGE_ALLOW_TMP_DAEMON=1`, `bb -e` calling
    `@#'handoffd/attempt-resident-rotate!` and
    `@#'handoffd/consult-teardown-sweep!`). Extend the FAKE, not the
    daemon: `has-session -t <target>` must exit 1 when an env var names
    that session absent (default exit 0 so the 8 existing checks stay
    byte-for-byte unchanged); `capture-pane` must print a busy footer when
    an env var says so; `new-session`/`kill-session` go to TMUX_LOG as
    today. Assert on TMUX_LOG lines, the marker file, and
    `.swarmforge/daemon/handoffd.log` lines.
  - Scenario 04's "actionable mail" row seeds one `git_handoff` file in
    the target's inbox/new; its "idle" row seeds an empty mailbox.
  - Scenario 06 is an outline over both commits: its handler reads
    `backlog/hotfix-ledger.yaml` for the row `commit: <commit>` and
    asserts `state` is not certified/waived and `human_decision` is null;
    BL-1346's handler is the precedent.
  - The step handler is `bl1549SwarmStampConsultSessionSteps.js`, landing
    in the SAME commit as the feature (BL-233); `steps/index.js` discovers
    `*Steps.js` by directory scan (BL-1371); shared fixture helpers go
    under `specs/pipeline/steps/lib/`.

  ## Second hotfix under review: a27d082c2d (absorbed from BL-1591, 2026-09-21)

  The night closing ceremony's rotate-documenter step called
  `rotate_to_role.sh documenter`, the resident-invoked rotation entry that
  `respawn-as!` (BL-805) refuses whenever the resident holds an undrained
  in_process parcel - the normal case mid-work overnight. The old fallback
  sent a plain note to the coordinator, which cannot respawn a pane it
  does not own, so the documenter never got a session and no briefing was
  written on 2026-09-15 or 2026-09-16 (ceremony state "rotate-documenter"
  -> "briefing-missing" -> "swarm-stopped").

  ### What landed (files to review)

  - `extension/src/tools/night-closing-ceremony-run.ts`: `rotateDocumenter`
    and `spawnConsultDocumenter` extracted from `buildRealDeps` and
    exported. `rotateDocumenter` still tries `rotate_to_role.sh documenter`
    with `SWARMFORGE_ROLE=coordinator`; on a nonzero exit it now calls
    `spawnConsultDocumenter` (`bb consult_spawn_cli.bb <target> documenter
    coordinator`, `stdio: 'pipe'`, every failure swallowed) and THEN still
    sends the old `BL-658: rotate resident to documenter for morning
    briefing` note to the coordinator.
  - `swarmforge/scripts/consult_spawn_cli.bb` (new, 112 lines): loads
    daemon_cycle_guard_lib, shell_quote_lib, single_role_repair_lib,
    handoff_lib; usage exit 2; `no-such-role` / `no-session-name` exit 1;
    `already-exists` (session live) and `already-consulting` (marker
    present) exit 0 with no tmux call; otherwise
    `resolve-single-role-repair` with `:env-args []` and
    `:session-present? false`, runs the returned commands, writes
    `.swarmforge/daemon/consult/<role>.json` `{role, requested_by,
    started_at_ms}`, prints `spawned`. Deliberately a copy of handoffd.bb's
    `spawn-consult-session!` (the first hotfix above), not a refactor of it.
  - `swarmforge/scripts/test/test_consult_spawn_cli.sh` (new, 4 checks,
    fake tmux on PATH, own socket file) registered in
    `swarmforge/scripts/test/suite-manifest.tsv` as standing (the same
    hunk trims trailing tabs on two neighbouring rows).
  - `extension/test/nightClosingCeremonyRotateDocumenterFallback.test.js`
    (new, 3 tests): a stub `rotate_to_role.sh` exiting 5, the REAL
    consult_spawn_cli.bb, a fake tmux; drives the real exported functions.
    Its fixture builder tripped three guards on main; BL-1593 (done) owns
    those rows and both fixes - build on BL-1593's landed shape, never
    touch makeFixture's allocation or scripts block yourself.

  ### Review goals (C1-C9)

  C1. Confirm the fallback end to end (scenario 07): run the real vitest
      file against `extension/out` and pin its three test names.
  C2. Confirm the CLI (scenarios 08, 09): run the real shell test and pin
      its four PASS lines and the manifest row; drive the real CLI through
      the fixture shape that test builds (fake tmux logging new-session
      and respawn-pane calls) for the four contract rows. The
      `no-session-name` and `resolve-single-role-repair` non-ok branches
      are not rows - record whether the fixture can reach them.
  C3. Confirm the no-new-teardown-code claim (scenario 04, its CLI row): a
      marker the CLI wrote (its JSON has `role`, `requested_by`,
      `started_at_ms`) must be torn down by the real
      `consult-teardown-sweep!` under the same fixture as the daemon's
      markers (live session, idle pane, empty mailbox -> killed and
      cleared). Name any field the daemon's `write-consult-marker!`
      writes that the CLI does not, and whether the sweep reads it.
  C4. PROBE P1, record, do not fix: `stdio: 'pipe'` discards the CLI's
      status JSON, while the commit message says "the CLI's own stdout
      already named the reason for a human reading the ceremony's process
      output". Record where, if anywhere, a `no-such-role` /
      `already-consulting` refusal is visible after a live ceremony run.
  C5. PROBE P2: after a successful spawn the fallback still sends the
      coordinator the pre-hotfix `BL-658: rotate resident to documenter`
      note. Record what the coordinator prompt tells it to do with that
      note today (a second rotate attempt against a resident that just
      refused, or nothing) and whether the note is now misleading.
  C6. PROBE P3: the ceremony sends `instructBriefing` (a note to the
      documenter) as the action AFTER `rotate-documenter`
      (nightClosingCeremonyRun.ts ~240-244). The spawned session boots
      with an empty mailbox; `consult-teardown-sweep!` kills a consult
      session whose pane is idle and mailbox empty. Record the gap between
      spawn and the note landing, whether a booting pane reads as idle to
      the sweep's predicate, and whether the sweep could kill the session
      before the briefing note arrives. A confirmed race is a note to the
      specifier.
  C7. PROBE P4: `env-args`. handoffd.bb's `spawn-consult-session!` passes
      `(openrouter-respawn-env-args)`; the CLI passes `[]`. Record whether
      a documenter seat on a non-Claude provider (roles.tsv `agent`
      column) would spawn without env it needs, against the live roster.
  C8. Note only, P5: at mint `git branch --contains a27d082c2d` listed
      main, swarmforge-QA and swarmforge-documenter - not coder, cleaner,
      architect, hardender. The ceremony runs from the master checkout's
      `extension/out`, so the live path is main's; record which worktrees
      carry it on the parcel's day.
  C9. Note only, P6: the commit says `daemon_cycle_guard_lib_test_runner.bb`
      reports 0 banned-API debt across 102 files with the new CLI; re-run
      and record.

  ### Scenario notes for the coder (second hotfix)

  - Scenario 07 runs `npx vitest run
    test/nightClosingCeremonyRotateDocumenterFallback.test.js` from
    `extension/` (1.4 s measured) and parses the reporter's test names;
    `extension/out` must be compiled first, as the acceptance lane
    already requires.
  - Scenario 08 runs the real `test_consult_spawn_cli.sh` and greps
    `suite-manifest.tsv` for the row; scenario 09 builds the same fixture
    (fake tmux writing `TMUX_LOG`, `.swarmforge/tmux-socket`,
    `.swarmforge/roles.tsv`, `.swarmforge/launch/documenter.sh`) per row;
    the `roles.tsv row is missing` row uses a role name absent from the
    fixture roster. Validate every Outline column against explicit
    KNOWN_VALUES (never branch on scenario shape).
  - Scenario 04's CLI row writes its marker by running the real CLI (not
    hand-written JSON) so the shape under test is the CLI's own.
  - Fixture roots per BL-1390: `git init` under mkdtemp, proven with
    `git rev-parse --git-common-dir` before any mutating git command; the
    fake tmux and its socket file live inside the fixture, never the live
    socket.

notes: |
  RETIRED 2026-09-25 by the specifier (Article 3.6, Consolidation
  Authority BL-680), superseded by BL-1752 (the chase half, 5bdf93beed)
  and BL-1753 (the ceremony half, a27d082c2d). The human ruled the same
  day that a mono-router pack has exactly one resident ("Mono router = 1
  resident"); both spawners this stamp would have certified are removed by
  those two slices. What survives, consult-teardown-sweep! and
  consult_spawn_cli.bb, stays for BL-1710's on-demand sessions and is
  exercised by BL-1710's own feature. Ledger rows relinked in the
  retirement commit: 5bdf93beed -> BL-1752, a27d082c2d -> BL-1753;
  human_decision stays null for the human's --decide. The feature file
  (including BL-1591's absorbed scenarios) is kept as a scenario-less
  tombstone (check_merge_deletion.sh, BL-1662).

  Ledger: linked to row 5bdf93beed via `hotfix_ledger_update.bb --link` in
  the mint commit. The mint commit also carries the coordinator's
  uncommitted ledger edits (the row itself, and four sibling rows
  normalised pending -> stamp-open) because the file is committed whole.
  Row a27d082c2d re-linked from BL-1591 to this ticket on 2026-09-21 with
  the same tool, in the consolidation commit.

  Consolidation record (BL-680, Article 5.3), 2026-09-21: absorbs BL-1591
  (minted 2026-09-16 by the specifier on the ledger sweep's pending row;
  approved 2026-09-16) on the human's morning consolidation sweep - one
  mechanism (the consult session), two spawners, one teardown sweep, one
  fixture; BL-1591's scenario 04 already reused this ticket's handler.
  BL-1591 retired to backlog/done/M8/ as superseded-by-BL-1549; its
  scenarios are this feature's 07, 08 and 09, the CLI row of 04 and the
  second row of 06; its feature file left as a scenario-less tombstone (a deletion on one side of a diverged main can never join the daemon reconcile - check_merge_deletion.sh, BL-1662). BL-1591 quoted the commit
  message's observation verbatim, carried into source above; no operator
  sentence was quoted. Siblings by subject: BL-1528 (ceremony send
  undeliverable), BL-658 (the night closing ceremony), BL-1593 (done - the
  fallback test's fixture guards). Grep all before minting anything about
  consult sessions or the ceremony's documenter hop. Evidence:
  backlog/evidence/consolidation-sweep-paused-20260921.md.

qa_e2e_procedure: |
  On the parcel commit:
  1. `git diff main...HEAD --name-only` names only evidence, the feature,
     the step handler (+ lib/), and test files (optionally
     `swarmforge/scripts/test/test_chase_departing_mid_parcel_gate.sh` or
     a new sibling test); none of handoffd.bb, mono_router_lib.bb,
     handoff_lib.bb, single_role_repair_lib.bb, consult_spawn_cli.bb,
     night-closing-ceremony-run.ts (invariant 1).
  2. `run_acceptance.sh` on the BL-1549 feature -> 9 scenarios green
     (01 x6, 02, 03, 04 x5, 05, 06 x2, 07, 08, 09 x4).
  3. `bash swarmforge/scripts/test/test_chase_departing_mid_parcel_gate.sh`
     (8 original checks still pass) and
     `bb swarmforge/scripts/test/mono_router_lib_test_runner.bb` green.
     Under `extension/`: `npx vitest run
     nightClosingCeremonyRotateDocumenterFallback` -> 3/3;
     `bash swarmforge/scripts/test/test_consult_spawn_cli.sh` -> ALL
     CHECKS PASSED with 01-04 in its PASS lines.
  4. The evidence file records review goal 4's probe outcome explicitly
     (confirmed with the log lines, or refuted with the reason), and
     C3-C9: the marker-field comparison, P1's visibility, P2's coordinator
     behaviour, P3's timing and the idle predicate, P4's env-args, P5's
     worktree list, P6's debt count.
  5. `backlog/hotfix-ledger.yaml` rows 5bdf93beed and a27d082c2d:
     `human_decision: null`.
  6. Live check, read-only, no launch: `bb swarmforge/scripts/consult_spawn_cli.bb`
     with no arguments prints usage on stderr and exits 2.
  7. After done: the human runs `bb swarmforge/scripts/hotfix_ledger_update.bb .
     --decide 5bdf93beed approved|waived` and the same for a27d082c2d,
     and commits the ledger.
