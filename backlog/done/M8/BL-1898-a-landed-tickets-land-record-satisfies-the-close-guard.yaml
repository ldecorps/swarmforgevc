source: |
  Coordinator note 015137 (2026-10-02 15:08Z), verbatim: "lander notifies
  as coordinator not QA - BL-1887 close blocked".
  Specifier, the same pass: handoffd.bb `lander-send-note!` runs
  swarm_handoff with SWARMFORGE_ROLE=coordinator, so the landed note
  ("BL-1887 QA-approved feb18315ea - move to done and promote next",
  015135) reached the coordinator from: coordinator.
  ticket_close_guard_lib.bb `qa-approved-ticket?` requires from = QA. The
  land step had already written
  `{"ticket":"BL-1887","commit":"feb18315ea","source":"9b21296a49"}` to
  .swarmforge/land-approvals/2026-10.jsonl.

description: |
  ## What is wrong

  BL-1872 moved the land into a daemon: QA queues, handoffd's lander runs
  land_main_publish.sh, and on success sends the bookkeep note
  ceremony_handoff_lib composes for QA. handoffd sends every note as the
  coordinator, so this one arrives from: coordinator.
  `ticket_close_guard_lib.bb` allows an active-to-done move only on a
  handoff from QA naming the ticket (`qa-approved-ticket?`) or an expedite
  QA verdict record (BL-1378). A lander land therefore can never be closed
  by the coordinator, or by handoffd's landed-ticket auto-close (which runs
  close_ticket.sh through the same guard), without QA re-sending by hand.

  ## What is wanted

  - The guard accepts a third approval path: a row in
    `.swarmforge/land-approvals/*.jsonl` naming the ticket, whose `commit`
    is an ancestor of main. It is read the way is_qa_ancestor.sh and
    landed_ticket_autoclose_lib.bb already read that store, and it never
    adds a second definition of approval. The verdict names the record it
    relied on, as BL-1378's does.
  - An unreadable line in that store refuses the close and names the
    store, the posture `record-line-problem` already takes for the expedite
    store.
  - The step handler `bl1898LandRecordSatisfiesCloseGuardSteps`, registered
    in the same parcel. Reuse BL-1378's registered steps where the wording
    is the same, and define only the new ones.

  ## Scope

  ticket_close_guard_lib.bb, its bb test, the step handler, evidence.

  ## Out of scope

  Which role the lander sends as. QA's hand land is unchanged too: it
  still sends from QA, and that path keeps working.

qa_e2e_procedure: |
  On the parcel commit:
  1. ONE run: `node specs/pipeline/cli.js specs/features/BL-1898-a-landed-tickets-land-record-satisfies-the-close-guard.feature`:
     5 of 5 ok.
  2. `bash swarmforge/scripts/test/test_ticket_close_guard.sh` and
     `bb swarmforge/scripts/test/ticket_close_guard_lib_test_runner.bb`
     green, and `node specs/pipeline/cli.js
     specs/features/BL-1378-an-expedite-closed-ticket-can-never-satisfy-the-close-guard.feature`
     still all ok.
  3. After the land, the next ticket the lander lands closes without a QA
     re-send: it reaches backlog/done/ through handoffd's auto-close or the
     coordinator's close, and no "send your QA-approved bookkeep note"
     request appears for it.

