required_wiring:
  - "extension/src/tools/boyScoutRun/run.ts::from '../boyScoutScan'::the run must consume BL-1014's ranking rather than re-deriving one of its own. A second, private ranking would drift from the one the operator was shown, so the run reaches the scan module by name. This is the CONSUMPTION site: run.ts compares the proposal's subject against the top-ranked entry and detects trespass onto the others"
  - "extension/src/tools/boyScoutRun/environment.ts::from '../boyScoutScan'::the same by-name reach at the ACQUISITION site - the default environment obtains the ranking from BL-1014's scan module instead of computing one. One entry per call site per BL-531; either import disappearing breaks the invariant, so both are anchored"
  - "specs/pipeline/steps/index.js::bl1015::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "Bounded and verified: a run cleans at most ONE item, never exceeding the declared size envelope, and commits only after the repository's existing gate set passes on the cleaned result. Oversized, or failing a gate, is refused whole - never partially applied and never committed."
  - "Tests are not the thing being cleaned: a run never edits an existing test assertion to reach green. A cleanup whose only route to green is changing an assertion is a behaviour change wearing a refactor's clothes, and is abandoned and reported rather than forwarded."
  - "Never silently empty: a run that cleans nothing states which reason applied - envelope exceeded, gate failed, assertion would have to change, or nothing ranked. A quiet no-op is indistinguishable from a clean repository, and that ambiguity is the failure this invariant exists to prevent."

description: >
  WHAT. The acting half of the Boy Scout activity. Takes the top-ranked item
  from BL-1014's scan, cleans exactly that one in the same run, and stops.
  Anything that does not fit the envelope is refused whole and reported.

  WHY IN-RUN RATHER THAN MINTING A TICKET (operator ruling, 2026-08-21). The
  operator was offered three shapes - report only, mint-and-route a parcel, or
  clean in the same run - and chose the third, knowing it acts before they see
  the pick. That is the actual Boy Scout Rule: small, now, opportunistic.
  Filing another ticket would just be the backlog, which already exists.

  THE SIZE ENVELOPE IS DERIVED, NOT INVENTED. BL-634 recorded a 65-insertion
  median for a normal slice (against BL-590 slice 1's 1929 insertions across 18
  files, the case that ticket exists for). A Boy Scout cleanup should be
  SMALLER than a normal slice, not larger, so the envelope is 3 files and 120
  changed lines - roughly twice that median, generous enough for a real
  refactor and small enough to stay one sitting. Scenario 02 pins both
  boundaries, including the exactly-at-the-limit case.

  THE TWO FAILURE MODES THAT MATTER MORE THAN THE HAPPY PATH:
  - A cleanup that can only go green by editing an existing test assertion is
    not a cleanup (invariant 2, scenario 04). This is the classic way a
    "refactor" smuggles in a behaviour change, and an autonomous cleaner is
    exactly the thing that would do it without anyone noticing.
  - A run that quietly does nothing is indistinguishable from a run that found
    nothing (invariant 3, scenario 06). Same posture as this repo's standing
    "never a silent cap" rule on the pipeline board.

  HOW (direction, not mandate). TypeScript under extension/src/tools/, beside
  the scan. The cleaned result is verified by the repository's existing gate
  set before commit - this ticket adds no new gate and weakens none.

  SCOPE BOUNDARY. Ranking belongs entirely to BL-1014; this slice never ranks.
  It also never widens the envelope to fit an item, never cleans a second item
  because the first was cheap, and never touches an item other than the top
  one - scenario 01 pins that.

qa_e2e_procedure: >
  1. On a fixture repository whose top-ranked item is a small duplication
     inside one file, run the Boy Scout run and confirm exactly that item is
     cleaned, the diff is within 3 files and 120 lines, and no other ranked
     item is touched.
  2. Confirm the existing gate set ran on the result and that the commit
     exists only because it passed - force a gate failure on the same fixture
     and confirm nothing is committed and the report says the gate failed.
  3. Craft a fixture whose top item needs 4 files, and another needing 400
     lines. Confirm each is refused whole, that the report names the item AND
     the envelope it exceeded, and that the working tree is clean afterwards.
  4. Craft a fixture whose top item cannot be cleaned without changing an
     existing assertion. Confirm the run abandons it, says the item needs its
     own ticket, and leaves the test untouched.
  5. Run against a fixture with an empty inventory and confirm the report
     states why nothing was cleaned rather than exiting silently.
  6. On this real repository, run once and read the report before accepting the
     commit - the first live run should be watched, not trusted blind.

source:
  - "Operator, 2026-08-21: 'devise a boyscoot activity: on demand cleaning ticket that identifies and clean the most annoying technical dept'. Split 1:N under Consolidation Authority - this is the clean half. Operator explicitly chose 'clean it in the same run' over report-only and over mint-and-route."

notes: |

  2026-08-22 specifier — required_wiring entry #1 AMENDED IN FLIGHT (bookkeeping
  only; nothing you build changes). The architect raised a priority-00 note
  during its pass: the anchor had been left pointing at
  `extension/src/tools/boyScoutRun.ts::boyScoutScan`, and the cleaner's split of
  that file into `boyScoutRun/` (7 modules) moved the real by-name reach out of
  it. The old anchor had become VACUOUS rather than absent: `boyScoutRun.ts`
  survives as a doc header and still contains the literal `boyScoutScan` three
  times, all in comments, so the gate would have gone green on prose while the
  actual imports could be deleted unnoticed — the exact failure required_wiring
  exists to catch (BL-419/BL-531).

  Entry #1 is now TWO entries, one per real call site, both anchored on
  `from '../boyScoutScan'`:
  `boyScoutRun/run.ts` (consumption — compares the proposal's subject against
  the top-ranked entry, detects trespass onto the others) and
  `boyScoutRun/environment.ts` (acquisition — obtains the ranking from the scan
  module rather than computing one). The pattern is the import's module
  specifier rather than the imported symbol list, deliberately: it survives a
  reformat or a change to which symbols are imported, and it appears exactly
  once in each file and never in a comment there. Verified with
  `parse-wiring-entry` on the finished lines (both print
  `from '../boyScoutScan'`, byte-identical to the file literal) and matched
  against the architect's parcel commit `aae815e09` — all three entries hit, so
  the documenter's forward to QA will not be blocked.

  No rebuild is owed by anyone for this. The code is already correct; only the
  ticket's description of where to look was stale.
  2026-08-21 specifier: slice 2 of epic boy-scout (BL-1013), filed with slice 1
  (BL-1014) in the same pass. `depends_on: [BL-1014]` is enforced by the BL-957
  promotion gate, which refuses any candidate naming a dependency not yet in
  backlog/done/ - so this cannot be promoted ahead of the scan it consumes, and
  that ordering does not rely on anyone remembering it. House precedent for
  minting a dependent pair up front: BL-676/BL-677, both paused, slice 2
  declaring depends_on slice 1.

  Deliberately NOT marked human_approval: pending. The one decision that
  warranted a human - whether an automated cleaner may act before the operator
  sees its pick - was put to the operator directly on 2026-08-21 and answered
  "clean it in the same run". The remaining numbers (3 files / 120 lines) are
  derived from BL-634's recorded median rather than chosen, and are stated here
  so a later reader can retune them against evidence instead of taste.

  The architect should expect invariants 2 and 3 to need property tests, not
  more example scenarios: both quantify over "every cleanup this run could
  possibly attempt", which no enumeration of fixtures can express.

