approval_context: >
  Your question 2026-10-02: "How do we ensure you won't make the mistake
  again? Can we maje this deterministic gate fornypu?" - gate 1 of 2. FIRM:
  a commit that ADDS a register row in a test lane (property, unit, bb,
  acceptance, shell) is refused unless the owner ticket declares
  hotfix_fallback: needs-ruling (and has ruling_options) or multi-sitting
  (with a hotfix_fallback_reason). Rows already on main and hardening-lane
  rows are not judged. The guard cannot judge whether the reason is true;
  it makes every fallback declared and countable.

invariants:
