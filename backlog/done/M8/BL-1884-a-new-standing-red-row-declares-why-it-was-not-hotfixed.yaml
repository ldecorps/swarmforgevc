source: |
  The human, specifier pane (Claude Code), 2026-10-02, verbatim (Article
  5.3), after the specifier minted an owner and a register row (BL-1883)
  for a red instead of hotfixing it:

  > You do observe the new role that instead of marrying up a failing test with a ticket, you should hot fix on the spot and mint a stampoff instrad, correct?

  > How do we ensure you won't make the mistake again? Can we maje this deterministic gate fornypu?

description: |
  ## What happens today

  The 2026-10-01 directive (specifier.prompt "Hotfix the red, then mint its
  stamp-off"; standing-red amendment section 6) says a red is hotfixed in
  the same pass, and an owner plus a register row is the fallback only for
  a fix that needs a human ruling or is more than one sitting. Nothing
  checks that the fallback was a choice: `check_standing_red_register.sh`
  (BL-1428) judges only that a new row names an open ticket.

  ## What is wanted

  - A commit that adds a row in a test lane is refused unless the owner
    ticket (staged or on disk) declares `hotfix_fallback:` as
    `needs-ruling` with a non-empty `ruling_options`, or `multi-sitting`
    with a non-empty one-line `hotfix_fallback_reason:` (scenarios 01, 02).
  - The refusal names the row and what the owner is missing, in the same
    one-refusal-per-commit shape as the guard's other checks (BL-1252).
  - Rows already on main, merge-inherited rows (BL-1646) and hardening-lane
    rows are not judged (scenarios 03, 04).

  ## How (direction, not mandate)

  - Extend `check_standing_red_register.sh`'s added-row pass; read the
    owner's YAML with the same reader the guard already uses for openness.
  - Step handler `specs/pipeline/steps/bl1884RegisterRowDeclaresFallbackSteps.js`,
    fixture repo under mkdtemp (BL-1390).

  ## Scope

  The guard, its shell test, the step handler, evidence. The specifier
  lands the `hotfix_fallback` schema entry (backlog-schema.md) and the
  specifier.prompt line at activation (BL-798).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1884-a-new-standing-red-row-declares-why-it-was-not-hotfixed.feature`:
     6 of 6 ok (02 has three rows). Measured 0 at mint: no handler exists.
  2. The register guard's shell test: ALL PASS.
  3. In a scratch clone, stage a new shell-lane row naming an open ticket
     with no hotfix_fallback and commit: refused, naming the row.

notes: |
