id: BL-950
title: "QA's approval-to-coordinator hop is the one the BL-806 evidence gate excludes, so a QA pass can close a ticket leaving no trace it ran - BL-585 was approved 4 minutes after dequeue, with no evidence file, naming the documenter's own commit"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 25
direction: swarm-surfaced
depends_on: [BL-806]
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-950-qa-approval-carries-its-own-evidence-commit.feature

invariants:
  - "The gate refuses exactly one shape: a QA approval git_handoff naming the commit QA received for that same task. Every other QA send passes untouched - a bounce, a merge-up note, a marked detour, an approval naming a commit QA actually made. QA is the only role that can land work on main, so a gate that strands a legitimate QA send is worse than the hole it closes."
  - "The gate fails OPEN on every nothing-to-compare-against shape, exactly as BL-806's own lookup does: no mailbox for the sender, a drained in-process box, an unreadable box, or a received parcel with no commit header. An unresolvable lookup never refuses a send."

description: >
  BL-806 refuses a review role's forward-direction `git_handoff` when its
  `commit:` equals the commit that role received for the same task - Article
  4.4's structural backstop, forcing a clean pass to commit its explicit-NONE
  inventory and forward THAT commit. Its `review-roles` set is
  `#{cleaner architect hardender documenter}`, and its own docstring records
  why QA is absent: "its send paths (approval to coordinator, integration on
  main) are excluded this slice to avoid entangling integration mechanics"
  (approval_context scope decision 1, human-approved at the time).

  QA's approval to the coordinator is the last hop before a ticket closes, and
  it is the excluded one. BL-585 went through it on 2026-08-19, measured from
  the live mailboxes:

    07:05:39Z  documenter -> QA git_handoff, commit ace11b6cfa
    07:05:47Z  QA dequeues it
    07:09:56Z  QA broadcasts "BL-585 QA-approved ace11b6cf - merge up"
    07:10:31Z  QA -> coordinator git_handoff, commit ace11b6cfa

  Four minutes nine seconds from dequeue to approval, and the approval names
  the documenter's own commit. No `backlog/evidence/BL-585-qa-*` file exists
  anywhere in the history (`git log --all --diff-filter=A --
  'backlog/evidence/BL-585*'` returns the architect and hardener passes only).
  So the gate the swarm relies on to be its last one left no evidence that it
  ran, and nothing refused the send - the identical BL-536 shape the BL-806
  gate was built for, one hop past where it reaches.

  It was not harmless. `extension/test/conciergeTick.test.js` was already red
  at that moment, from BL-585's own layout rewrite, and stayed red on main
  (BL-949). A pass that took four minutes cannot have run the extension unit
  suite; a committed explicit-NONE inventory would have had to say so.

  How (direction, not mandate): extend the same refusal to QA's approval hop.
  Note that adding "QA" to `review-roles` alone changes nothing - the gate's
  direction test is `required_stages_lib/routes-forward?`, whose
  `canonical-order` is the six pipeline stages and does not contain
  `coordinator`. Probed 2026-08-19: `(routes-forward? "QA" "coordinator")` is
  false, so `blocked?` would never fire. The approval hop needs its own
  direction predicate, and scenario 03's exclusions are what keep that
  predicate from swallowing QA's bounces and merge-up notes.

constraints: >
  Out of scope:

  - QA's integration send - landing the approved commit on `main` and pushing
    origin. BL-806 excluded both QA paths together; this ticket takes the
    approval hop only, for the same reason BL-806 gave: integration mechanics
    entangle a gate that should stay a pure send-time predicate.
  - Bounce-direction sends naming the bare received hash, from any role. BL-806
    left these ungated deliberately (bounce evidence discipline is enforced by
    Article 4.4 plus record-bounce) and scenario 03 pins that they stay
    ungated.
  - Any check on the CONTENT of a QA evidence file, or on how long a pass took.
    This gate proves a commit was made, not that the inventory in it is
    honest - the same limitation BL-806 already accepted. A pass that commits
    an empty evidence file still gets through, and that is a human-review
    problem, not a send-time one.
  - The BL-585 rendering defect itself. That is BL-949.
  - Re-opening or re-gating BL-585. It closed; the two tests it left red are
    BL-949's to fix.

qa_e2e_procedure: >
  From the repo root:

  1. Reproduce the hole before the fix, in a throwaway fixture root rather
     than the live mailboxes: give a QA role-info an in-process git_handoff
     parcel for a task naming commit X, then send a QA -> coordinator
     git_handoff for the same task naming commit X. Confirm it is DELIVERED
     today.
  2. Confirm the stated cause rather than assuming it:
     `bb -e '(load-file "swarmforge/scripts/required_stages_lib.bb")
     (prn (required-stages-lib/routes-forward? "QA" "coordinator"))'`
     prints false on the parent commit. If the fix reached the direction
     predicate by widening `canonical-order`, check that
     `route-required-stages` did not start rewriting recipients into
     `coordinator` - that predicate has other callers.
  3. At the parcel commit, repeat step 1 and confirm the send is REFUSED with
     a message naming Article 4.4 pass evidence.
  4. Confirm invariant 1 one exclusion at a time, reverting between: a QA
     bounce to the coder naming the same commit is delivered; a QA merge-up
     note is delivered; the same-commit approval carrying a reroute_reason is
     delivered; an approval naming a different commit is delivered.
  5. Confirm invariant 2: with the in-process box drained, and again with the
     received parcel's `commit:` header removed, the same-commit approval is
     DELIVERED, not refused.
  6. Run the acceptance feature and confirm all 6 cases pass, plus the
     existing BL-806 gate suite (`swarmforge/scripts/test/` runners for
     review_forward_evidence_gate) - the four review roles must still behave
     exactly as before.
  7. Live smoke: this gate sits in every agent's send path. Before approving,
     confirm at least one real handoff of each type (a forward git_handoff, a
     note) was delivered normally after the parcel commit, and that
     `.swarmforge/handoffs/*/failed/` gained nothing.
  8. `git show --stat`: expect the gate lib, its test runner, this ticket's
     feature file and step handler, and the registry line. No change to any
     role prompt (this is a mechanism, not a rule restatement).

notes: >
  Source: found while speccing BL-949 (the two conciergeTick tests BL-585 left
  red). The specifier noticed no QA commit and no QA evidence file for BL-585
  and asked the coordinator rather than guessing; the coordinator replied
  "Confirmed - BL-585 closed w/ no QA gate at all; docs->close direct".

  That reply is not quite what happened, and the difference is the whole
  ticket. The mailboxes show QA DID receive the parcel
  (`.worktrees/QA/.swarmforge/handoffs/inbox/completed/00_20260819T070539Z_000183_from_documenter_to_QA_for_QA.handoff`,
  dequeued 07:05:47Z, completed 07:10:38Z), broadcast a merge-up, and send an
  approval to the coordinator
  (`.swarmforge/handoffs/coordinator/inbox/abandoned/00_20260819T071031Z_000324_from_QA_to_coordinator_for_coordinator.handoff`).
  The pass ran. What is missing is any durable trace of it: no evidence file,
  and an approval naming the commit QA received. "No QA gate at all" would be
  a routing defect; this is an evidence defect, and only the second one has a
  send-time fix.

  No `required_wiring:` declared, deliberately. The gate lib is already called
  from the live `swarm_handoff.bb` send path (BL-806's own wiring entry
  covers that), so a second substring check would either restate it or, worse,
  match a literal already present in the file and pass vacuously (BL-874). The
  real failure mode here is a predicate that never fires, which no substring
  check can see - acceptance scenario 03 and QA procedure step 2 are what
  catch it.

  IR-DRY: one medium-confidence near-duplicate finding, pairing scenario 01's
  and 02's When steps. Reviewed and kept - they differ only in the commit
  literal because that IS the behaviour under test, and merging them into an
  outline would put the refused/delivered outcome into a placeholder, the
  passthrough shape outline handlers are forbidden to take.

approval_context: >
  You approved BL-806's scope decision to leave QA's send paths out, "to avoid
  entangling integration mechanics". This asks you to take half of that back:
  the approval hop in, the integration push still out.

  Worth knowing before you decide. The gate runs in every agent's send path,
  and QA is the only role that can land work on main - so a mistake here
  cannot be routed around, it stops the pipeline at its last hop. That is
  argued in the ticket as the reason for the exclusions in invariant 1 and the
  fail-open in invariant 2, and QA procedure step 7 makes a live send a
  release condition.

  The alternative disposition, if you would rather not touch the send path
  again: leave the gate as BL-806 approved it and treat the BL-585 pass as a
  one-off to raise with QA directly. I have not specced that, because the same
  hole let a red suite onto main and nothing would have surfaced it if BL-631
  had not tripped over the failures four hours later - but it is one word from
  you either way.

assigned_to: coder
