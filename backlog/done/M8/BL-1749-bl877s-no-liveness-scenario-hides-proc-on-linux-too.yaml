description: |
  ## What is wrong

  coder note 002136, evidence `backlog/evidence/BL-1738-coder-20260925.md`
  (6887fd5988): with BL-1738's fix, BL-877 runs 6 of 7. Scenario 7 fails
  with `expected runtime.log to record that liveness could not be
  determined`. The sweep logs ordinary scan/reap lines instead.

  Cause, read at mint: the step `a host on which no liveness facility can
  be reached` (bl877PortableProcessLivenessSteps.js ~line 235) sets only
  `ctx.env.SWARMFORGE_LSOF_BIN = '/nonexistent/...'`. Its comment says
  "/proc is already absent on this project's own macOS dev/CI host".
  This host is Linux (WSL). Scenario 7 sets no userland, so
  `rootLiveProcessIn` builds no fake proc, and `proc_fd_scan_lib.bb`
  falls back to the real `/proc`. Liveness is therefore determinable, and
  `operator_runtime.bb`'s "liveness could not be determined this pass"
  line (~878) never fires. Before 2026-09-22 the scenario could not be
  seen failing this way, because every BL-877 scenario died earlier on
  BL-1517's refusal.

  ## What is wanted
  - The step makes both facilities unreachable on any host: it also sets
    `SWARMFORGE_PROC_DIR` (the seam `proc_fd_scan_lib.bb` ~line 48 already
    reads) to a path that does not exist. No later Given in the scenario
    may point it back at a real or fake proc.
  - BL-877 runs 7 of 7 on Linux, as it did on macOS.

  ## Scope
  - `specs/pipeline/steps/bl877PortableProcessLivenessSteps.js`.

qa_e2e_procedure: |
