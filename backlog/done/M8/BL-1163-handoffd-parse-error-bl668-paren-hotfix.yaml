description: |
  ## What

  Commit f5b6b49f1 (`feat(BL-668): post-QA sweep fast-forwards clean role
  branches`) left `swarmforge/scripts/handoffd.bb` with two `defn` bodies
  missing closing parens in the post-QA branch-sweep helpers (~lines 3208–3217).
  Babashka fails at load:

  `EOF while reading, expected ) to match ( at [3213,1]`

  `start_handoff_daemon.sh` refuses (`handoffd failed to claim handoffd.pid`).
  Pipeline stalled CRIT until repaired.

  ## Fix (direction, not mandate)

  Close every `let`/`defn` opened in `post-qa-branch-sweep-role-dirty?` and
  `post-qa-branch-sweep-role-in-process?` so Babashka can load the file.
  The intake names line 3211 specifically — verify the whole surrounding
  block, not only that line.

  ## Verification

  - `bb swarmforge/scripts/handoffd.bb <project-root>` loads without parse error.
  - `bash swarmforge/scripts/test/test_handoffd_one_shot_flags_parse.sh` — ALL PASS.
  - `start_handoff_daemon.sh` succeeds on a running swarm root after land.

qa_e2e_procedure: >
  (1) Fixture: Babashka loads handoffd.bb without parse failure.
  (2) test_handoffd_one_shot_flags_parse.sh ALL PASS at parcel commit.
  (3) Live or fixture: start_handoff_daemon.sh claims pid and handoffd.log shows
  a clean start — not "EOF while reading".
  (4) Record degraded Babashka gate if env requires.

out_of_scope: |
  - Re-litigating BL-668 branch-sweep behaviour — only the syntax break.
  - New parse guards beyond existing BL-728 wiring test.
  - QA changed-path gate governance (BL-1164).

