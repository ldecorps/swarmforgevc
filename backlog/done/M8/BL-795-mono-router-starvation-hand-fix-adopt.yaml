notes: |
  ## Severity rationale

  `high`. The pipeline had real work mid-harden and the resident sat idle
  at home with depth cap 1 — a full self-starve, not a cosmetic board lie.
  Article 3.2.4 expedite lane is intentional; flip down only if review
  finds the live risk was already closed by something else.

  ## Acceptance is runnable offline

  The existing shell/bb tests drive real `handoffd.bb` /
  `mono_router_lib.bb` / `chase_sweep_lib.bb` against temp fixtures — no
  live swarm required. Specifier should pin those behaviours in Gherkin
  and keep the wiring test on the `--print-preferred-rotate-target` path
  so a hand-built score row cannot stay green while production starves.

  ## e2e procedure for QA

  1. Run `bb swarmforge/scripts/test/mono_router_lib_test_runner.bb` —
     rule_proposal actionable assertions green.
  2. Run `bash swarmforge/scripts/test/test_chase_sweep.sh` — scenario 06
     escalates AND keeps waking.
  3. Run `bash swarmforge/scripts/test/test_handoffd_rule_proposal_rotate_wiring.sh`
     — A/B/C (rule_proposal preferred; fresh note not; in_process beats
     rule_proposal).
  4. On a live mono-router: drop a directed `rule_proposal` into a dormant
     role's `inbox/new` while resident is at home with empty mail — expect
     rotate to that role (or redirect onto a preferred held claim if one
     exists), never a standing `chase-rotate-skip-broadcast` loop.
