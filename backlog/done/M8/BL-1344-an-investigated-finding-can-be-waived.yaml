id: BL-1344
title: "A babysitter finding over permanent history re-nudges every 30 minutes forever, because the sweep has a cooldown but no way to record that a finding was investigated and is legitimate"
milestone: M8
type: defect
severity: medium
# medium, and deliberately not high: the sweep is working exactly as designed
# and nothing is degraded or at risk. The cost is a coordinator turn every 30
# minutes and, over time, an Article 4.2 CRIT channel nobody reads - real, but
# not an incident. The coordinator that reported it sent it at handoff
# priority 10, explicitly "not a fresh operational emergency", and this
# severity keeps it out of the expedite lane in front of BL-1343.
status: todo
