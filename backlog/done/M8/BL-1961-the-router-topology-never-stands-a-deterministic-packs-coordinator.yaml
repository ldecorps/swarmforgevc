description: |
  ## What is wanted

  `should-have-standing-session?` and `topology-action` in
  `mono_router_lib.bb` take the pack's deterministic flag as an extra
  argument, defaulting to false, so every existing caller and test is
  unchanged. With the flag set, the coordinator is never a standing
  session: absent, it is `:dormant-ok`, never `:ensure-standing`. A
  coordinator session that is alive anyway is also `:dormant-ok`: tearing
  a live seat down is not this ticket's to decide.

  BL-1962 (swarm ensure) and BL-1963 (babysitter) pass the flag in; this
  slice only adds it.

  ## What the coder checks

  The scenario; both new branches (absent and alive) and the unchanged
  default in mono_router_lib_test_runner.bb.
assigned_to: coder
