  Occurrence history: BL-514 (first), BL-624 (second, backlog/done/M8/),
  BL-625 (third, repaired in flight at 4484f4a26). The documenter's note that
  prompted this mint named the third and pointed at the second.

  Deliberately NOT merged with: BL-626 (promotion gate rejects an unmaterialized
  feature draft - the placeholder class, different predicate, different call
  site), BL-761 and BL-880 (the two gates themselves, both behaving as designed
  and untouched here).

  Observation made while sweeping, not part of this slice: BL-533 and BL-534
  still carry full inline `Feature:` Gherkin from before BL-111 made feature
  files the durable contract. They need real feature files extracted, which is
  specifier work. Surfaced, not acted on.

  IR-DRY was run on the feature file (17 step occurrences, 15 unique, 4
  findings). All four are deliberate polarity contrasts - exits zero against
  exits non-zero, violation against no violation, single-ticket against batch
  invocation - not accidental drift. The three clean-case scenarios were merged
  into one Scenario Outline first, which is what took the report from 6 findings
  to 4.

