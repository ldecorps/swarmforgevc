severity_rationale: >
  Filed high, not critical. Nothing is down and no data is lost - both known
  occurrences were recovered in full. But this is a live fault that degrades
  behaviour and defeats a safety signal, which is the high band: each occurrence
  burns a complete pipeline pass (coder, cleaner, architect, hardender,
  documenter all work the parcel before the gate refuses it at the last edge),
  and eleven paused tickets are armed to do it again, one at a time, at
  promotion. It is not critical because each occurrence is individually
  recoverable by a one-line edit, as BL-624 and BL-625 both were.

source: |
  Documenter note 000155 (2026-08-18T08:55Z), to specifier and coordinator:
  "BL-625 acceptance: block scalar unreadable by BL-761 gate (see BL-624)".

  That note reports the third occurrence. BL-624 was the second (closed in
  backlog/done/M8/). BL-514 was the first. BL-625's own occurrence was repaired
  in flight by the documenter at commit 4484f4a26 on the operator's explicit
  real-time instruction to continue rather than block, so the ticket in flight
  is already correct - this ticket is the class, not that instance.

  The eleven remaining armed tickets and the schema contradiction below were
  found by sweeping backlog/active and backlog/paused while dispositioning the
  note; neither was in the note.

description: |
  ## The defect

  `pre_qa_gate_gather_lib.bb`'s `read-yaml-field` captures only the `acceptance:`
  LINE's own tail - never the indented body beneath it. So a ticket written as

      acceptance: |
        specs/features/BL-042-example.feature
        (some prose about the contract)

  yields the raw declaration `"|"`. Downstream:

  - **BL-761 acceptance-contract gate** (documenter->QA hop): `"|"` is non-blank
    and single-line, so `feature-text-at-commit` runs `git show <commit>:|`,
    which fails, so `declaration-readable?` is false. That is a finding, and it
    fails CLOSED. The handoff to QA is refused.
  - **BL-880 acceptance-pointer gate** (every EARLIER hop): `applicable?`
    excludes exactly `#"^[|>][-+]?$"` as block-scalar residue and skips the
    ticket silently - deliberately, so the QA edge can own the judgement "with
    full context".

  Both behaviours are individually correct. Together they mean a ticket that
  names a perfectly real feature file is judged unreadable only at the last and
  most expensive edge in the pipeline, having already been worked by coder,
  cleaner, architect, hardender and documenter. The information needed to refuse
  it was present the moment it was written.

  ## Measured, this repository, 2026-08-18

  Sweeping backlog/active and backlog/paused: **53 tickets** carry a
  block-scalar `acceptance:`. Of those, **12 name a real path matching
  `specs/features/*.feature` inside the block body** - they believe they have a
  contract, and are armed to fail at the documenter->QA hop:

      BL-548  BL-556  BL-557  BL-579  BL-580  BL-584
      BL-585  BL-609  BL-620  BL-621  BL-626  (BL-625, already repaired)

  Nine of the eleven name a feature file that exists on disk. BL-579 and BL-580
  name one that was never written - repairing their shape does not hide that, it
  exposes it: as a single-line pointer the BL-880 gate catches the dangling path
  at the FIRST hop instead of the last, which is the outcome this ticket is for.
  Repair all eleven the same way; do not special-case those two.

  The other 41 block scalars are honest placeholders ("Specifier writes the
  scenarios. Minimum:"). They name no feature file, claim no contract, and are
  deliberately out of scope - see invariant 3 and `Scope` below.

  ## The schema said the opposite, and that is now fixed

  `swarmforge/backlog-schema.md` stated of `acceptance:`: "Older items may still
  carry the criteria inline (`acceptance: \|` followed by a Gherkin block) until
  migrated; both forms are read." That is false against the live gates, and it is
  prose in a file the specifier owns, so it was corrected on `main` in the same
  pass that minted this ticket rather than scheduled as a stage of it (per the
  specifier prompt's BL-798 rule - no `required_stages:` value can schedule the
  specifier, and `required_wiring:` pins to the parcel commit, not to `main`, so
  neither existing gate could have carried it). Nothing in this slice depends on
  that edit; it is recorded here so the ticket reads honestly.

  ## How (direction, not mandate)

  `backlog_hygiene_lib.bb` already exists for exactly this shape of check - it is
  the library behind the specifier's own per-file gate AND the repo-wide audit,
  both of which the specifier prompt already requires be run. One more violation
  kind there reaches both call sites at once.

  The predicate: the `acceptance:` field's own line-tail matches
  `acceptance-pointer-gate-lib`'s block-scalar residue pattern, AND the indented
  body beneath it contains a `specs/features/...feature` path. Consult that
  pattern from the existing lib rather than restating the regex - a second copy
  of it is the drift hazard invariant 1 names, and this repo has already been
  bitten by a hand-mirrored constant (BL-897).

  One trap worth naming, because it fails silently. `backlog_epic_milestone_audit.bb`
  does not print the violations it collects - it filters them into two hardcoded
  buckets (`:missing-epic`/`:missing-epic-on-epic`, and `:missing-milestone`) and
  prints only those, while `all-clean?` still counts every kind. A third kind
  added to the lib alone therefore makes the audit exit 1 having printed nothing
  about why. The violation kind is named `unreadable-acceptance` by this spec so
  both call sites can pin it.

  Reporting only makes the eleven visible. The ticket is not done until they are
  repaired too, which is what scenario 04 asserts: `acceptance:` becomes the bare
  single-line pointer, and the prose that rode inside the block moves to a
  sibling field. `qa_e2e:` / `qa_e2e_procedure:` is the precedent - the shape the
  documenter used to repair BL-625 at 4484f4a26, and already in use on 36 other
  tickets. Repair is a mechanical edit per ticket; none of the eleven is in
  flight, so none has the BL-317/BL-325 worktree-staleness problem.

  ## Scope

  In: the new violation kind in `backlog_hygiene_lib.bb`, its surfacing through
  both existing call sites, its unit tests, and the eleven YAML repairs.

  Out: the 41 placeholder tickets that claim no contract (BL-626 owns
  promotion-readiness for those); any change to the BL-761 or BL-880 gates
  themselves, both of which behave correctly and stay untouched; and the two
  legacy inline-Gherkin tickets BL-533 and BL-534, whose blocks are full
  `Feature:` text with no pointer at all - extracting real feature files for
  those is specifier work, not a coder's, and is not this slice.

approval_context: >
  The evidence is complete and the severity follows the band definitions, so
  neither needs sign-off. Two scope calls do.

  First: scenario 04 asserts the LIVE backlog carries zero violations, which
  makes this ticket's acceptance a standing repo-wide guard. That is deliberate -
  it is what forces the eleven repairs and what stops the twelfth - but it has a
  real cost: once landed, a future parcel that mints a violating ticket fails
  this scenario, and the failure surfaces on whatever parcel happens to be in
  flight rather than on the ticket that caused it. The alternative is to assert
  only against fixtures and let the eleven be repaired by a separate ticket. I
  recommend keeping the standing guard, because a gate whose own acceptance
  tolerates known violations is the shape that let this class survive three
  occurrences.

  Second: I scoped the 41 honest placeholders OUT (invariant 3). They are a
  bigger and different problem - tickets minted with no testable acceptance at
  all, which is an INVEST letter-T failure at mint rather than an unreadable
  declaration - and BL-626 already sits in that space. Confirm you want them left
  alone and I will leave BL-626 to it; say otherwise and I will mint the sweep
  separately rather than widen this slice.

qa_e2e_procedure: |
  From the repo root, on the parcel commit:

  1. Repo-wide audit is clean:
     `bb swarmforge/scripts/backlog_epic_milestone_audit.bb`
     Expect zero unreadable-acceptance violations reported, alongside its
     existing epic/milestone output.
  2. The check actually fires. In `./tmp/`, copy any repaired ticket and put its
     pointer back behind a block scalar:
         acceptance: |
           specs/features/BL-609-resident-spy-font-size-control.feature
     Then `swarmforge/scripts/specifier_backlog_hygiene_gate.sh ./tmp/<copy>.yaml`
     Expect a violation line naming the ticket id and that path, and exit 1.
  3. The scope boundary holds. In the same copy, replace the block body with
     prose naming no feature file. Re-run the gate: expect no
     unreadable-acceptance violation and exit 0. Repeat with the field removed
     entirely - same result.
  4. The single-line form passes: restore the copy's original pointer and re-run;
     expect exit 0.
  5. Batch reporting: run the gate on two violating copies in one invocation and
     confirm BOTH are named before it exits non-zero - it must not stop at the
     first.
  6. Spot-check the repairs by hand: for each of the eleven, `grep -m1
     '^acceptance:'` returns a single-line `specs/features/....feature` path, and
     the prose that used to sit in the block is still present under a sibling
     field - nothing was deleted, only moved.
  7. Confirm the pre-QA gate now agrees. For one repaired ticket, that same
     `read-yaml-field` tail is a real path: `git show <parcel-commit>:<that path>`
     succeeds for the nine whose feature file exists, and fails for BL-579/BL-580
     - which is the intended early, honest failure, not a regression.

