  On the parcel commit, ONE run each (2026-09-17 rule):
  1. `node specs/pipeline/cli.js specs/features/BL-2055-a-local-seat-restart-relaunches-only-on-the-parcel-it-holds.feature`:
     01, 02, 03 ok. Measured 0 at mint: no handler exists yet.
  2. `node specs/pipeline/cli.js specs/features/BL-1991-a-local-seat-that-skips-its-named-write-is-restarted-on-it.feature`:
     4 of 4 ok. Measured at mint (2026-10-07, main 2676e8605a): 4 of 4 ok, 4 s.
  3. `node specs/pipeline/cli.js specs/features/BL-1992-a-third-missed-write-releases-the-parcel-to-another-coder-seat.feature`:
     2 of 2 ok. Measured at mint: 2 of 2 ok, 8 s.
  4. `bash swarmforge/scripts/test/test_bl1991_local_seat_restart_launch.sh`
     and `bash swarmforge/scripts/test/test_bl1971_local_model_repeat_guard.sh`:
     ALL PASS. Measured at mint: both PASS.
  5. Read the parcel's how-to diff: the BL-1991 section says the launch
     script serves only the override for the handoff in in_process.

