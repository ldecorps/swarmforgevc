description: |
  ## What is wrong

  Two faults in BL-1991's restart, both seen on the iq3 coder holding
  BL-1913 (parcel 017169) on 2026-10-06, from its qwen sessions in
  ~/.qwen/projects/-home-carillon-swarmforgevc--worktrees-coder/chats/:

  1. The generated local-model launch script (swarmforge.sh, the
     `local-model)` case: `pending_msgs=('$restart_dir'/*.msg(N))`, then
     `pending_msg="${pending_msgs[1]}"`) serves the FIRST pending override
     by name, whichever parcel wrote it. Overrides outlive their parcel
     (a pane respawned before its loop reads one leaves it on disk, and the
     new pane's loop reads it only at the next qwen exit, on another
     parcel), and older parcels' names sort first. At 23:32Z the guard restarted the
     seat for a missed write of tmp/notes.md (session 3e694b79's 23:31:35Z
     compaction), but the fresh turn (session c1ab1546) opened with an
     earlier parcel's BL-1963 step and edited BL-1963's step handler. At
     23:38Z the guard wrote BL-1963 text for 017169; the launch script
     served a BL-1874 step instead (session 2ea20f23), and the seat
     replaced specs/pipeline/steps/bl1874ThrottleRefreshFailureSteps.js.
     The 23:38Z override was never served and is still pending:
     .worktrees/coder/.swarmforge/local-seat-restart/10_20261006T231403Z_017169_from_coordinator_to_coder_for_coder.handoff.json.msg
  2. local_model_repeat_guard.bb's `in-process-handoff-name` keys the
     restart count on the first file in in_process, sidecars included.
     BL-1992's release moves only the handoff file, so at 23:54Z the
     parcel's `.claim-progress.json` sidecar was left alone in in_process,
     the guard read it as a new parcel with no restarts, and it restarted
     the seat (session 1507e310) on BL-1913 after the release. That session
     edited check_merge_deletion.sh, re-ran one scratch repro about fifteen
     times, and was halted by qwen's loop dialog at 00:05Z.

  The seat's off-ticket work from 1 and 2 was committed on its branch as
  39dec5f68f ("step handlers: throttle refresh failure, babysitter qa-paths
  stub, merge-of-origin-main deletions"; no ticket id, no byline). It is
  not on origin/main and not in the lander queue.

  ## What is wanted

  - When qwen exits, the launch script relaunches it only with the
    override for the handoff now in the seat's in_process, and discards
    any override whose handoff is no longer there (scenarios 01, 02).
  - A seat whose in_process holds only sidecars is not holding a parcel:
    no restart, no release note (scenario 03).

  ## How (direction, not mandate)

  - The override file is named `<in_process handoff file name>.json.msg`
    (`restart-state-file` plus `.msg`), so the launch script can match it
    against the files in `$role_worktree/.swarmforge/handoffs/inbox/in_process/`.
  - The sidecar suffixes already have one home: `sidecar-suffixes` in
    swarmforge/scripts/handoff_lib.bb (.nudge, .chase.json,
    .claim-progress.json, .batch-claim-progress.json). Reuse it if loading
    it stays cheap in a PostToolUse hook; otherwise copy the list and add a
    test that both lists agree (BL-897).
  - The launch-script test swarmforge/scripts/test/test_bl1991_local_seat_restart_launch.sh
    already runs the real `local-model)` case block against a fake qwen;
    scenarios 01 and 02 can drive the same extraction. Scenario 03 can
    drive the guard the way specs/pipeline/steps/bl1992ThirdMissReleasesParcelSteps.js
    does (bl1991RestartGuardCli.bb with a fake kill controller).
  - Steps repeating BL-1991's or BL-1992's text register with
    `registry.defineScoped(pattern, handler, featureName)` (BL-425).

  ## Scope

  swarmforge/scripts/swarmforge.sh (the `local-model)` case's relaunch
  loop), swarmforge/scripts/local_model_repeat_guard.bb
  (`in-process-handoff-name`), their shell tests, the how-to section
  "A seat that skips its named write is restarted on it (BL-1991)" in
  docs/how-to/BL-1052-local-model-seat-launch.md (it says the script
  relaunches with any pending override), the feature, and its handler
  specs/pipeline/steps/bl2055RestartOnlyOnTheHeldParcelSteps.js.

  ## Out of scope

  - The guard's path reading and the restart message's wording: BL-2056.
  - Deleting the off-ticket commit 39dec5f68f or the pending stale
    override by hand: the coordinator's (note sent 2026-10-07).

