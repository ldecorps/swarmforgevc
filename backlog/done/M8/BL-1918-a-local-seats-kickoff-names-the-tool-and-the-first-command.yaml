description: |
  ## Status: hotfix f9c3e4e1da landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  Replayed from a scratch copy of the seat's real interactive first request
  (23483-character system prompt, 13 tools), the kickoff "Read and obey
  every instruction in '<card>' (your card). Then begin your role loop"
  got a prose reply every time: with 13 tools or the 6 loop tools, at
  temperature 0, 0.1 and 0.3, and with a one-line system-prompt nudge.

  ## What the hotfix changed

  swarmforge.sh's local-model launch body now reads: "Use read_file now to
  read '<card>' - it is your card, and obey every instruction in it. Its
  loop starts by running ./swarmforge/scripts/ready_for_next.sh (it is NOT
  at the worktree root)." Replayed with that text, read_file came back 8 of
  8 times, and with the card returned as the tool result,
  run_shell_command ./swarmforge/scripts/ready_for_next.sh came back 8 of 8
  times. "obey every instruction in" stays because BL-1052's scenario 05
  reads it; the line carries no "@" (BL-1837 scenario 01).

  ## What the coder checks

  - The launch line in the diff, and that the regenerated
    .swarmforge/launch/coder.sh carries it.
  - BL-1837's, BL-1845's and BL-1052's features pass.
  - Your own first turn: did you call read_file on your card?
    Evidence: backlog/evidence/BL-1918-coder-<date>.md.

qa_e2e_procedure: |
  1. `grep -c 'Use read_file now to read' .swarmforge/launch/coder.sh` is 1 while the coder is a local-model seat.
  2. `node specs/pipeline/cli.js` on BL-1837's, BL-1845's and BL-1052's features:
     each passes (measured at mint: all ok).
  3. The coder pane's first turn after its last respawn shows "Read" of its
     card (a ✓ Read line), not a request for the card's contents.

