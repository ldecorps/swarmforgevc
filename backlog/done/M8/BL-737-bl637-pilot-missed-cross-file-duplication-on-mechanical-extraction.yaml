id: BL-737
title: "Pilot process: mechanical multi-file --help edit was never checked for cross-file duplication before landing"
milestone: M8
type: defect
severity: low
status: todo
epic: swarm-reliability
assigned_to: coder
priority: 14
direction: queue-jump
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardener, documenter, qa]
human_approval: approved
approval_context: >
  Queue-jump pilot-process hardening (human 2026-07-31 Let's Talk). Open
  judgement: duplication threshold is identical block in >2 touched files
  (BL-637 was 16). Tool may be jscpd scoped to touched paths or a
  heredoc/normalized-line-block helper — refuse rate on real pilot history
  should be measured before land, same discipline as BL-729's verb-scoped
  claim probe. Residual false positives are reword/extract fixes at land
  time, not silent bypass.
acceptance: specs/features/BL-737-pilot-cross-file-duplication-gate.feature
required_wiring:
  - 'extension/src/tools/pilotAcceptanceGate.ts::checkCrossFileDuplication::called from landPilotedTicket before move'
  - 'extension/src/tools/pilot-acceptance-gate.ts::checkCrossFileDuplication::CLI supplies real git-backed touched-file deps'
  - 'specs/pipeline/steps/index.js::bl737PilotCrossFileDuplicationGateSteps::acceptance handler registered'
invariants:
  - "Cross-file duplication is judged only on files the run's own non-merge commits touched — never the whole repo and never files outside the run's commit range."
  - "Identical normalized text appearing verbatim in more than two touched files refuses the land with reasonKind cross-file-duplication; two-file duplication does not refuse."
  - "A refused land is inert for every refusal reason including cross-file-duplication — no yaml move, no receipt, no other durable write."
description: |
  ## What

  BL-637's own landing commit added the same 12-line --help block, by hand,
  to 16 separate scripts in one pass — exactly the DRY smell the cleaner
  stage exists to catch, and exactly the shape (hand-maintained duplicated
  list across many files) BL-671 was filed to eliminate elsewhere in the repo.
  The offline pilot session that landed BL-637 either had no cleaner-equivalent
  pass, or its cleaner-equivalent pass did not check newly-added multi-file
  mechanical edits for duplication before commit.

  ## What to do

  Extend the BL-727 pilot landing gate (`landPilotedTicket` in
  `extension/src/tools/pilotAcceptanceGate.ts` — same owner as BL-729 commit
  claims and BL-731 multiworktree fixture) with a **cross-file duplication**
  check:

  1. Collect files touched by the run's non-merge commits (same ancestry scope
     as `checkCommitClaims`).
  2. Detect identical normalized blocks shared by **more than two** of those
     files (BL-637 threshold). Direction, not mandate: pinned `jscpd` scoped
     to touched paths, or a small pure helper that finds repeated heredoc /
     consecutive-line runs — measure false-positive rate on real pilot history
     before shipping, per BL-729 discipline.
  3. On hit: refuse with `reasonKind: 'cross-file-duplication'`, naming the
     block fingerprint and at least two paths. Refused land is inert.
  4. When touched-file history cannot be resolved: fail **open** with a
     warning (mirror BL-729 unreadable-history posture), not a silent pass
     pretending the check ran.
  5. Record on the acceptance receipt how many touched files were scanned
     (when checked).
  6. How-to update on `docs/how-to/BL-727-pilot-acceptance-contract-gate.md`
     (or sibling BL-737 doc) describing the new refusal and remediation
     (factor shared block — see companion BL-736).

  ## Out of scope

  - Factoring BL-637's duplicated --help bodies (BL-736 remaining work)
  - Repo-wide jscpd on every `/pilot` land regardless of touched files
  - Changing live cleaner-stage jscpd gates (this is pilot-land only)

qa_e2e_procedure: >
  (1) Fixture run pasting same block into 3 touched scripts → land refused,
  names paths. (2) Same block in 2 touched scripts → land completes. (3)
  Refused land leaves yaml + no receipt. (4) Pre-existing dup outside touched
  set does not refuse. (5) Unreadable touched-file history → land with warning.
  (6) How-to documents refusal + fix shape.

