description: |
  ## What is wanted

  - Serve: when `ready_for_next.sh` serves a parcel to a seat whose agent
    is `local-model`, its output names the parcel's phase and the record's
    path, from BL-2037's `local_seat_phase_cli.bb show` (a parcel with no
    record is in `arrange`). A seat on any other agent prints no phase
    line.
  - Move: `local_seat_phase_cli.bb end` and `fail`, run by a local-model
    seat, save the record and only then restart the seat's
    session on the same parcel. The restart is the existing
    `handoff-lib/respawn-pane-fresh!` (the per-parcel fresh session,
    2026-10-04). The parcel stays in the seat's in_process queue, and the
    launch script's resume note sends the new session to it. `pass` needs
    no restart: the same session sends the handoff and runs
    done_with_current.sh.
  - Done: `done_with_current.sh` removes the completed parcel's record
    from the seat's worktree.

  ## How (direction, not mandate)

  - Serve: `swarmforge/scripts/ready_for_next_task.bb` already knows the
    seat's agent (`(:agent (handoff-lib/load-role-info role))`, see
    `maybe-fresh-session-for-parcel!` around line 57). Print the phase line
    next to the served TASK.
  - Move: the restart is the last thing the command does, after the record
    is written (invariant 1), the way `maybe-fresh-session-for-parcel!`
    prints, flushes, then respawns. A restart that fails prints why and
    leaves the seat to carry on in the same session.
  - Done: `swarmforge/scripts/done_with_current_task.bb` knows the
    completed parcel's task; delete `.swarmforge/phase/<ticket>.md` in the
    seat's worktree if it exists.
  - The handler `specs/pipeline/steps/bl2038LocalSeatFreshPhaseSessionSteps.js`
    builds a fixture root with a `roles.tsv` row whose agent column is
    `local-model` or `claude`, an in_process parcel for BL-9001 and a fake
    `tmux` on PATH that logs `respawn-pane`. A fake tmux naming a
    server-creating subcommand puts the file in tmuxReaperGuard's scope:
    require `./lib/fixtureReaper`, `track` the root and `reap` before
    removing it. Run `npm test` before forwarding.

