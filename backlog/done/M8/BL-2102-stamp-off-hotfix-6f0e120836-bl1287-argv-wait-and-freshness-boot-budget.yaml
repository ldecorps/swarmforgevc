description: |
  Status: hotfix 6f0e120836 landed the fix. The coder reviews it and never
  re-applies it.

  QA held BL-2082 on 2026-10-09 (note 003958, evidence 592a3bd139) on two
  reds no open ticket owned, both load-sensitive (load 19.6 to 21.3 on 20
  cores, a hardener Stryker run live):

  1. extension/test/bl1287FixtureSweepScopingInvariants.property.test.js
     invariant 1: "AssertionError: creatorAlive=false: expected
     selected=true, got false". spawnFakeCloudflared
     (test/helpers/bl1287FixtureSweepFixture.js) backgrounds the fake with
     `& echo $!` and returned that pid before the child had exec'd. Until
     it does, ps shows the spawning shell's `bash -c` line, which
     leakedFixtureTunnelPids drops on purpose (BL-1974's SHELL_DASH_C_RE),
     so a sweep sampled in that window missed a fixture it had to select.
     The hotfix polls `ps -o pid=,args= -p <pid>` until the line no longer
     matches SHELL_DASH_C_RE (now exported from fixtureTunnelName.js, one
     definition), bounded at 10 s, returning at once if the process is
     gone. Measured: 28 ms on an idle spawn.
  2. swarmforge/scripts/test/test_build_freshness_cli.sh
     operator-restart-race setup: "operator_runtime did not publish its
     first status" - red in QA's run 1, green in run 2 on the same commit.
     The hotfix adds `wait_for_scale` (load per core from /proc/loadavg or
     sysctl vm.loadavg, cores from getconf; 1 + int(3 x load / cores),
     capped at 6) and multiplies every `wait_for` budget by it. A condition
     that holds still returns at once. Portable to macOS bash 3.2.

  The review asks: is either wait able to hide a real failure (a fixture
  that never execs, a daemon that never boots) rather than only absorb
  load? Each still fails, later.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. Read from the gather's property row:
     bl1287FixtureSweepScopingInvariants 3 of 3.
  2. `bash swarmforge/scripts/test/test_build_freshness_cli.sh`:
     "build_freshness_cli smoke: ALL CHECKS PASSED" (measured on main at
     mint with the change: exit 0, 53 s at load 13.6).
  3. `node specs/pipeline/cli.js specs/features/BL-1287-a-fixture-sweep-must-not-signal-a-live-runs-fixtures.feature`:
     4 of 4 ok (measured on main at mint with the change).
  4. `node specs/pipeline/cli.js specs/features/BL-328-merged-code-reaches-running-daemons.feature`:
     9 of 9 ok, about 290 s (measured on main at mint with the change).
  5. Read the coder's committed review evidence.

