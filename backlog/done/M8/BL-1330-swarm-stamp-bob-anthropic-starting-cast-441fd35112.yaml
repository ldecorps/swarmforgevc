description: >
  WHAT. Operator/Cursor hotfix 441fd35112 is live on main with the trailer
  Hotfix-Certification: pending. Subject: "Restaff bob BoB starting cast:
  Anthropic seats, coder on qwen3.8-max."

  Landed behaviour under review (do not redesign).
  swarmforge/packs/bob-multi-provider-mono-router.conf is re-staffed: the
  seven pipeline `window` lines now read `specifier`, `cleaner`,
  `architect`, `hardender`, `documenter`, `QA` all on
  `claude --model claude-sonnet-5` (efforts unchanged from before: high for
  specifier/architect/QA, medium for cleaner/hardender/documenter), with
  only `coder` (the resident HOME window) staying on
  `claude --model qwen3.8-max --effort high`. `coordinator` is not a window
  line and remains auto-provisioned on claude-sonnet-5 as before — unchanged
  by this commit. The file header/comment block and the PREREQ comment are
  rewritten to describe the new posture (Anthropic subscription for every
  non-coder seat; Token Plan key for the coder seat only) and to state this
  is a "starting cast," not a final staffing.

  No script/lib code changed in this commit (no diff to swarmforge.sh,
  qwen_launch_guard_lib.sh, or any *.bb) — the entire functional change is
  the conf file's window/model assignments and its explanatory comments.

  WHY. Human directive: BoB starts as Anthropic everywhere except the
  resident coder on Token Plan qwen3.8-max (Claude agent); keep the 1M
  context env on that seat only. Separately: an unticketed hotfix never
  becomes an official swarm deal on green tests alone (BL-848).

  HOW (direction, not mandate). Walk the acceptance feature against the
  landed conf at 441fd35112. Open a narrow follow-up only if review finds a
  defect; do not rewrite the pack's staffing or the launcher's remap
  predicate in this parcel.

constraints: >
  Out of scope / firm lines:

  - Do NOT reimplement, rewrite, or revert the hotfix. This parcel confirms
    or refutes what landed at 441fd35112.
  - Do NOT write certified or waived into backlog/hotfix-ledger.yaml. Only a
    recorded human decision does that, however green the suite is (BL-848).
  - Do NOT re-staff the pack again or restore the all-qwen3.8-max cast. The
    Anthropic-everywhere-except-coder cast is the operator's stated starting
    point.
  - Do NOT touch swarmforge.sh, qwen_launch_guard_lib.sh, or launch_role's
    provider chain — none of them changed in this commit; that surface is
    BL-1322's review (commit 4ed88430b2), not this ticket's.
  - Do NOT review or act on the BL-1322 ticket/feature files this same
    commit happened to add — observe the bundling in the evidence file only.

