approval_context: >
  BL-848 hotfix stamp-off for already-landed commit 441fd35112. Review-only:
  it confirms or refutes the land and never reimplements it. No choice is
  posed here — approving authorizes the review parcel; the certify/waive
  decision on the ledger row stays human-only and comes after the review
  (BL-848).

  What to know before approving. The hotfix re-staffs the bob mono-router
  pack a second time in two days: 2026-08-31's multi-vendor mix was replaced
  by 2026-09-01's all-qwen3.8-max cast (stamped separately as BL-1322,
  reviewing commit 4ed88430b2, still pending), and this commit replaces THAT
  with a third posture — Anthropic claude-sonnet-5 on every seat except the
  resident coder, which alone stays on Token Plan qwen3.8-max with the 1M
  context declaration. The commit's own message calls this the "starting
  cast," i.e. deliberately narrower than the prior all-qwen trial, not a
  correction of a defect in it. The stamp confirms or refutes what landed —
  it does not re-litigate the staffing call.

  Also landed in the same commit, not part of this review: the specifier's
  own mint of BL-1322 (a stamp-off ticket + feature file for the PRIOR
  hotfix 4ed88430b2). That bundling is reported as an observation in the
  evidence file, not reviewed as functional code — BL-1322 is its own
  ticket with its own review.

