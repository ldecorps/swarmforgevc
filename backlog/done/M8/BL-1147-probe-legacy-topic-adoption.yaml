description: |
  ## What / why

  Operator intake (2026-08-23): a human asked to **probe legacy topic
  adoption**; the Operator could not answer. Three live adoption paths
  overlap and are easy to confuse:

  1. **BL-294 auto-open** — an unmapped front-desk topic (or DM default key)
     opens a fresh SUP-### via `openSubjectAndRecord` /
     `decideUpdateAction` (`telegramFrontDeskBotCore.ts`).
  2. **Cursor Host topic re-adopt** — when `SWARMFORGE_LETS_TALK_PROVIDER`
     is not `cursor` (or empty default), a message on the bound
     `cursorTopicId` is adopted into `OPERATOR_SUBJECT_ID` instead of
     throwing bridge-owned (`openSubjectAndRecord` in
     `telegram-front-desk-bot.ts` ~1639–1650). **No dedicated unit test
     covers this branch today.**
  3. **Map scrub** — `readFrontDeskTopicMap` strips stale SUP bindings on
     the cursor / Bubble topic ids via `frontDeskTopicMapWithoutCursorBridge`
     and persists when needed (`telegram-front-desk-bot.ts` ~403–414).
     Legacy per-ticket `BL-###` keys in `backlog-topic-map.json` are
     classified separately via `legacyTopicReconcile.ts` (BL-494 close tool).

  This slice ships a **read-only probe** the operator can run against a target
  repo plus tests that lock the adoption branches above — not new product
  chrome.

  ## What to do

  1. Export pure `probeLegacyTopicAdoption(targetPath)` (name may vary) that
     returns a structured report: legacy per-ticket keys (from
     `backlog-topic-map.json`), cursor Host topic id + effective routing
     (`bridge` | `operator-re-adopt` | `unbound`), front-desk bindings on
     cursor/bubble topic ids, and scrub-candidate keys (what
     `frontDeskTopicMapWithoutCursorBridge` would remove) **without writing**.
  2. Thin CLI `extension/src/tools/probe-legacy-topic-adoption.ts` printing
     human-readable lines (exit 0 always when readable; non-zero only on
     missing/unreadable target). `main()` thin over exported helpers.
  3. Unit tests: cursor re-adopt branch in `openSubjectAndRecord` (provider
     `local` / `openai` / non-cursor); bridge-owned throw when provider is
     cursor; probe JSON shape over fixture dirs.
  4. APS step handlers drive the probe + re-adopt pure paths (no live
     Telegram).
  5. How-to under `docs/how-to/BL-1147-probe-legacy-topic-adoption.md`
     explaining the three paths and sample probe output.

  ## Out of scope

  - Closing legacy per-ticket topics (BL-494 tool) or recreating BL topics
    (BL-495)
  - Bubble UI; new Telegram product surfaces
  - Changing BL-294 auto-open semantics or standing-topic ensure logic
  - Live Telegram network calls from the probe

qa_e2e_procedure: >
  (1) Fixture with legacy BL-### in backlog-topic-map + cursor state → probe
  lists them read-only. (2) Provider non-cursor + message on cursor topic →
  OPERATOR binding, no SUP mint. (3) Provider cursor + same → throws
  bridge-owned. (4) Stale SUP on cursor topic id → probe flags scrub
  candidate; readFrontDeskTopicMap persists scrub. (5) How-to matches CLI
  output shape.

