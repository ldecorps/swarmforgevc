id: BL-1461
title: "land-plan answers LAND_CLEAN for a tip carrying a sibling's unlanded work when that work was absorbed before the parcel's last hop: the candidate walk starts at parcel-own-base (the last hop, BL-1432's bound) and never visits earlier unlanded history, so BL-1448's two real land inputs read clean on 2026-09-07 while carrying BL-1349's unlanded files - the wide walk found them, only a hand diff caught it; every commit reachable from the tip and not from origin/main is a candidate, and the cost bound is the re-point"
