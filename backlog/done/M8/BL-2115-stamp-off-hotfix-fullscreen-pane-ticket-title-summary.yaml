human_approval: approved
approval_context: >
  Stamp-off of a hotfix the specifier landed at the human's request in the
  session ("Can you hot fix something to summarise the headzr"). No choice
  is posed. FIRM: the coder reviews it and never re-applies it.

invariants: []

description: |
  Status: hotfix 1a0d8963a4 landed the fix. The coder reviews it and never
  re-applies it.

  The human, on 2026-10-10, sent a phone screenshot of the expanded
  (fullscreen) live-screen pane for BL-1743: the ticket title filled the
  whole screen and the pane output was below the fold.

  The hotfix, in extension/src/bridge/residentSpyUiHtml.ts's webview
  script: buildTicketBlockHtml (used only by buildFullscreenHeadHtml) shows
  summarizeTicketTitle(title) - parenthetical asides dropped, cut at the
  first " - ", ": " or "; " past 20 characters, at most 90 characters at a
  word boundary, an ellipsis when cut. A click on the title (fsHeadEl
  listener, stopPropagation so the fullscreen tap-to-exit does not fire)
  toggles the full title; fsTitleExpanded survives header repaints. The
  full title is kept in a script variable, not an attribute, because the
  page's escapeHtml does not escape quotes.

  The review asks: does the summary ever come out empty or misleading
  (a title that is all parentheses falls back to the full title)? Does
  the toggle ever exit fullscreen?

  The hardener adds unit cases for summarizeTicketTitle (separator cut,
  the 90-character cap, parentheses, unbalanced parentheses, short title
  unchanged) and the toggle, and runs Stryker scoped to those functions.

qa_e2e_procedure: |
  On the parcel commit, ONE run.
  1. `node specs/pipeline/cli.js specs/features/BL-1542-live-screen-ticket-strip-collapse-control.feature`:
     6 of 6 ok (measured at mint in a scratch tree with the change).
  2. Read from the gather's unit row: residentSpyUiHtml.test.js green,
     with the hardener's summary and toggle cases in it.
  3. On the phone, open a pane holding a long-titled ticket fullscreen:
     the header is at most two short lines; a tap on the title shows the
     whole title and the pane stays fullscreen; a second tap summarises it.
  4. Read the coder's and the hardener's committed evidence.

source: |
  The human, 2026-10-10, verbatim: "Can you hot fix something to
  summarise the headzr (cant see the pane, the title os way too long)",
  then "That's the expanded live screen pane".

