id: BL-957
title: "Promotion gate never reads depends_on, so a dependent ticket can reach the coder before the work it depends on has landed (20 live candidates)"
milestone: M8
type: defect
status: todo
epic: swarm-reliability
severity: high
priority: 40
depends_on: []
mutation_cost: low
acceptance: specs/features/BL-957-promotion-gate-refuses-unsatisfied-depends-on.feature
human_approval: approved
assigned_to: coder
approval_context: >
  Two judgement calls are mine, not derived from any existing rule, and both
  are worth a human ruling before the coder builds.

  (1) A dependency counts as satisfied ONLY when it is in backlog/done/. An
  ACTIVE dependency still refuses. I chose this because it is the standard
  the coordinator already applied by hand during the incident — revert commit
  a952d5df3 reads "depends_on BL-620, which is not yet done". The alternative
  (treat active as satisfied) would have let BL-955 race BL-620 through the
  pipeline, which is the ordering hazard itself.

  (2) The gate fails CLOSED on a depends_on id that resolves to no ticket
  anywhere — a typo refuses rather than promotes. This mirrors the fail-closed
  posture Article 3.2.4 already takes on a missing severity, and the dangling-
  reference refusal makeTopPrioritySafety.ts already implements for the same
  field.

  If either ruling goes the other way, only scenario 03's Examples rows change;
  the slice's shape does not.

invariants:
  - "Every promotion route — by-name and auto-pick alike, including any route added later — decides through the one promotion_gates evaluate chain, so none can promote without the depends_on gate having run."
  - "The gate fails closed: any depends_on id it cannot positively resolve to a ticket in backlog/done/ refuses promotion, including ids it failed to parse."

source: |
  Coordinator note to specifier, 2026-08-19 (priority 10):
  "promote_and_route_next.sh ignores depends_on; promoted BL-955 pre-BL-620"

  Incident trail in git log, all 2026-08-19:
    4d1a6f32e Promote BL-955: paused -> active for coder
    a952d5df3 Revert BL-955 promotion: depends_on BL-620, which is not yet
              done (specifier caught this)
    c0c577e1c Promote BL-955: paused -> active for coder
    126140458 Revert BL-955 promotion again: promote_and_route_next.sh does
              not check depends_on
    0c9f9c7c9 Promote BL-620: paused -> active for coder (unblocks BL-955's
              dependency)

  The auto-picker re-promoted the same blocked ticket immediately after the
  first revert, because nothing in the promotion path had changed — the
  coordinator spent four commits fighting a gate that does not exist.

description: |
  ## Defect

  `promote_and_route_next.sh` routes every promotion through the BL-663
  chokepoint `promotion_gates_lib.bb/evaluate`, which is the one place
  human_approval, Article 3.2.4 expedite ordering, `active_backlog_max_depth`,
  orthogonality (advisory since BL-854) and the hold marker are decided.

  `depends_on` is not among them. It is read nowhere in
  `swarmforge/scripts/` at all — verified by grep across the whole script
  tree. The field is honoured only on the TypeScript side
  (`makeTopPrioritySafety.ts`, `bridgeServer.ts`), and that code explicitly
  defers the completion question to a gate that was never built. From
  `bridgeServer.ts:1098`:

      // done/active are satisfied/ignored terminal nodes for ordering
      // purposes (the coordinator's promotion gate owns active's own
      // completion)

  There is no such promotion gate. That comment names this ticket's hole.

  ## Blast radius — this is not a one-off

  BL-955 was the ticket that surfaced it, but measured against the live
  backlog on 2026-08-19, **20 promotable candidates carry at least one
  dependency that is not in `backlog/done/`** (excluding tickets already
  refused by the epic-type, do-not-promote and blocked-status gates).
  Every one of them is reachable by the auto-picker today. Among them:

      BL-603, BL-604   <- nine unlanded dependencies each
      BL-666           <- BL-660, BL-664
      BL-581           <- BL-579, BL-580
      BL-955           <- BL-620   (the one that fired)

  Of the 48 promotion candidates that declare any dependency at all, half
  are currently blocked.

  ## The parsing trap (please read before implementing)

  `read-field` in `promotion_gates_lib.bb` returns **nil for a blank value**,
  by documented design — `field: >` and `field: |` must read as absent. A
  block-style dependency list therefore reads as *no dependencies at all*:

      depends_on:
        - BL-547
        - BL-556

  Using `read-field` for this gate would make it fail OPEN on exactly the
  tickets it exists to catch. Two live paused tickets (BL-556, BL-557) use
  this form today. The gate needs its own reader.

  Four forms occur in the live backlog among promotion candidates
  (paused + hold), measured 2026-08-19:

  | form                                    | count | note                        |
  |-----------------------------------------|-------|-----------------------------|
  | `depends_on: []`                        | 118   | empty, must ALLOW           |
  | `depends_on: [BL-620, BL-948]`          | 47    | flow list                   |
  | `depends_on:` + `- BL-547` block lines  | 2     | reads as absent today       |
  | `depends_on: BL-090, BL-091 (prose...)` | 1     | bare scalar, trailing prose |

  Extracting every `BL-<n>` / `GH-<n>` token from the field's value and its
  block continuation lines handles all four, and ignores the trailing prose
  without needing to parse it.

  ## How (direction, not mandate)

  Adding one refusal to `evaluate`'s fixed chain gets both invocation modes
  at once: `cmd-select` already calls `evaluate` per candidate and drops a
  refused one from the ranking rather than crashing the selection
  (`promotion_gates_cli.bb`), while `cmd-evaluate` prints
  `REFUSE|<gate>|<reason>`. That is why invariant 1 is cheap to hold here
  and expensive to hold anywhere else.

  Ordering within the chain is a real decision: place it after
  `human_approval` and before `depth`, so a ticket-property refusal beats a
  transient global one and the coordinator gets the actionable reason. The
  chain's existing "first failing gate wins, in a fixed order" contract must
  keep holding.

  Resolving a dependency needs the set of done ids. `backlog/done/` holds
  both flat files and `<Mx>/` subfolders (the close-into-done/Mx convention),
  so the reader must recurse — scenario 03 pins this.

  ## Constraints

  - Do not weaken or reorder the existing gates; this adds one link to the
    chain and changes nothing else about the chokepoint's contract.
  - Do not reimplement the check inside `promote_and_route_next.sh`. BL-663
    exists precisely because locally-reimplemented checks drift from the
    chokepoint.
  - The refusal reason must name the unsatisfied dependency ids, so the
    coordinator's next action is obvious without re-deriving them by hand.

  ## Out of scope

  - Auto-promoting the dependency instead of refusing. The coordinator
    decides what to promote; this gate only refuses.
  - Cycle detection across depends_on. `makeTopPrioritySafety.ts` already
    handles cycles for the make-top primitive; nothing in the promotion path
    traverses transitively, and adding traversal here would exceed one
    sitting. File separately if wanted.
  - The sibling promotion-gate tickets BL-626 (unmaterialized `.feature`
    pointer) and BL-634 (slice size envelope) stay independent slices.
  - The BL-798 open-slot nudge's candidate selection and eligibility count
    (chase_sweep_lib.bb / handoffd.bb) — it ranks without running evaluate,
    so it cannot see this gate; that is BL-963's sibling slice
    (depends_on: [BL-957]), minted 2026-08-20 from the architect's
    spec-gap note 20260819T231719Z_000266. This ticket's invariant 1
    covers promotion ROUTES; the nudge only recommends, and stays as-is
    until BL-963 lands.

qa_e2e_procedure: |
  Against the live repo, with the swarm stopped or the coordinator idle:

  1. Confirm the defect still reproduces before the fix:
       bb swarmforge/scripts/promotion_gates_cli.bb evaluate . \
          backlog/paused/BL-955-annotate-caption-derived-text-on-every-forwarding-surface.yaml \
          false 5
     Pre-fix this prints ALLOW even though BL-620 is not in backlog/done/.

  2. After the fix, the same command prints
       REFUSE|depends_on|<reason naming BL-620>
     and exits 2.

  3. Block-style form (the fail-open trap):
       bb swarmforge/scripts/promotion_gates_cli.bb evaluate . \
          backlog/paused/BL-557-model-steward-slice3-role-and-compat-docs.yaml \
          false 5
     must REFUSE naming BL-547 and BL-556 — not ALLOW.

  4. Empty form still promotes: pick any paused ticket with `depends_on: []`
     and a satisfied human_approval; evaluate must print ALLOW.

  5. Auto-pick does not stall: run
       swarmforge/scripts/promote_and_route_next.sh
     in a scratch clone and confirm it promotes an eligible ticket rather
     than erroring out, with any dependency-blocked candidate skipped.

  6. Whole-backlog sweep — for every file in backlog/paused/ and
     backlog/hold/, evaluate must REFUSE exactly the 20 candidates listed in
     the description's blast-radius section and no others.

notes: |
  Lineage: extends the BL-663 chokepoint; same file and same epic as BL-854,
  which converted orthogonality from a refusal to an advisory. This ticket
  moves in the opposite direction — depends_on is declared, per-ticket,
  machine-checkable data, unlike the epic tag BL-854 found too coarse to
  refuse on. That distinction is the reason this one is a refusal and that
  one is not.

  Not to be confused with BL-951, which asks a different open question about
  routing (where a bounce-fix re-enters the pipeline). Unrelated.

notes_coordinator_status: >
  NOT DROPPED - QA-PASSED, LANDING DEFERRED (coordinator, 2026-08-20 02:35Z).
  An unassigned-active sweep flagged "BL-957 no parcel in flight - possible
  drop". Investigated: there is indeed NO parcel in any role mailbox, and QA
  sent nothing for this ticket (zero BL-957 references in QA's sent/). But it
  is not a drop:

    8133043cd "BL-957: QA pass inventory - all gates run, zero defects;
               landing deferred pending BL-958/BL-960 sibling verification."

  QA consumed both inbound parcels (documenter -> QA, commit d166b82fd0),
  passed every gate, and deliberately withheld the landing. So the absence of
  a parcel is the INTENDED state, not a lost message.

  THE RISK IS REAL ANYWAY: a consumed deferral parcel never returns. Nothing
  will re-deliver BL-957 to QA, so the landing depends entirely on QA
  remembering it when the siblings clear. Both blockers are in QA's own hands
  right now (BL-958 and BL-960 are each held by QA), so the trigger is close -
  but it is a memory, not a mechanism.

  Coordinator action: reminded QA directly, and recorded here so any later
  reader (or a fresh coordinator after a context clear) can tell a deliberate
  deferral from an actual drop without re-deriving it. Do NOT treat a future
  "no parcel in flight" sweep hit on BL-957 as a drop while this note stands.

