  2. `node specs/pipeline/cli.js specs/features/BL-902-briefing-email-composes-before-key-check.feature`:
     7 of 7 ok (measured at mint, 2026-10-08).
  3. Read the coder's evidence; confirm the hotfix changed only the shell
     test (`git show cb163341ab --stat`).

