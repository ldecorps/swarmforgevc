description: |
  ## Status: hotfix cb163341ab landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `swarmforge/scripts/test/test_handoffd_briefing_email_wiring.sh` runs a
  real handoffd against a mkdtemp fixture with RESEND_API_KEY unset, and
  its last assertion (BL-902 warning-not-spammed-05) expects exactly one
  `email-misconfigured` line in the daemon log. Since BL-1392 (2026-09-04)
  the daemon's cron-heartbeat sweep runs earlier in the same cycle, finds
  the fixture's `.swarmforge/daemon/freshness-check.cron.log` absent,
  sends its "cron daemon is not running" alarm, and logs its own
  `email-misconfigured` line through `push-alarm-email-missing-key-warned?`,
  a one-shot atom separate from the briefing sweep's by design (handoffd.bb
  says each signal has its own). The test counted 2 and failed. No lane
  runs this shell test; coder@2 ran it while reworking BL-2069 and sent the
  `unowned-red` note (000174, 2026-10-08). No register row named it.

  ## What the hotfix changed

  cb163341ab, test only: before starting the daemon, the fixture creates
  `.swarmforge/daemon/` and touches `freshness-check.cron.log`, so the
  heartbeat reads fresh (under its 10-minute bound) and that sweep sends
  nothing. The briefing sweep's warning is then the only one counted. The
  daemon and both atoms are unchanged.

  ## What the coder does (all of it)

  1. Read `git show cb163341ab` and confirm it touches only the shell
     test's fixture setup, before the daemon starts.
  2. Run the shell test and the feature in qa_e2e_procedure once each,
     output under tmp/.
  3. Write backlog/evidence/BL-2081-coder-<date>.md with the result and
     commit it.

constraints: >
