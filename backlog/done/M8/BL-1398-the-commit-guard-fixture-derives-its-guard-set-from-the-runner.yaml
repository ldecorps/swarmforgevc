approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is posed
  and there are no ruling_options. Found by QA while landing; the red is a
  stale hand-written list, not a defect in any guard.

description: |
  ## What is wrong

  `extension/test/bl632CommitTimeGuardInvariants.property.test.js` builds a
  fixture repository and copies the REAL commit guards into it from a
  hand-written `EXEC_FIXTURE_FILES` list (five `check_*.sh` guards, the
  runner, its libs, two hooks). `run_commit_guards.sh` now also runs
  `check_handler_module_graph.sh` (BL-1385, landed 2026-09-04). The fixture
  does not copy it, the runner in the fixture cannot find it, the chain
  fails, and the property test is red on `main`:

      pre-commit: every guard in this tier ran, so the list above is complete ...
      Test Files  1 failed (1)

  Reproduced this pass with `npx vitest run --config vitest.properties.config.mjs
  bl632CommitTimeGuardInvariants`. The same shape has been fixed before for
  other fixtures (BL-1279: front-desk fixtures derive their bb closure;
  BL-973's hand-enumerated membership), and will recur with BL-1395's guard
  next unless the list is derived.

  ## How (direction, not mandate)

  - Derive the guard set at test time: parse the `run_guard <script> ...`
    lines of `swarmforge/scripts/run_commit_guards.sh` and of
    `swarmforge/git-hooks/pre-merge-commit`, copy each named guard, and
    follow each guard's own `source`/`.` lines one level to copy the libs
    it needs (bounded, no recursion beyond the scripts dir). Keep the
    existing hardlink warming and per-case copy - only the list moves.
  - A guard the runner names but the tree lacks throws, naming it
    (invariant 2) - never `continue`.
  - The two hook files stay explicit: they are what git runs, not what the
    runner lists.
  - No change to any guard or to the runner.

  ## Explicitly NOT in scope

  - Any behaviour of `check_handler_module_graph.sh` itself (BL-1385, done)
    or of the coming `check_bb_scripts_load.sh` (BL-1395).
  - Other fixtures that still enumerate closures by hand; name them in the
    coder's evidence if met, mint separately.

qa_e2e_procedure: |
  1. `npx vitest run --config vitest.properties.config.mjs
     bl632CommitTimeGuardInvariants` on main after the parcel: green, with
     the BL-1385 guard present in the fixture's copied set (assert by
     listing the fixture template).
  2. Add a dummy `run_guard check_zzz_probe.sh` line to a COPY of the runner
     used by the fixture (a seam, never the live file) with the probe script
     present: the fixture copies it and the chain runs it; with the probe
     script ABSENT: the test fails naming `check_zzz_probe.sh`.
  3. Remove a guard line from that seam copy: the fixture no longer copies
     it and the test is still green - the set follows the runner both ways.
  4. Remove fixture roots in a `finally`, reaping only roots no live run
     owns (BL-1385/BL-1390).

notes: |
  `required_wiring` anchor 1 is a genuine consumer anchor: the literal is
  the runner's own line shape (`run_guard`), absent from the test today; it
  can only appear if the test reads the runner.

  IR-DRY: run on the feature file at mint (see commit).

  Mint-time INVEST: one observable outcome (the fixture follows the
  runner), well under one sitting, no unbuilt sibling.

