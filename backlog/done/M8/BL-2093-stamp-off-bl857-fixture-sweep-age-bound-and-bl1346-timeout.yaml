description: |
  ## Status: hotfix 3d5e5064c5 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong, and what the hotfix changed

  1. extension/test/bl857TunnelOwnershipInvariants.property.test.js runs
     `sweepLeakedFixtureTunnels()` at module load: it SIGKILLs every pid
     `leakedFixtureTunnelPids` selects, that is every temp-dir cloudflared
     whose tunnel name names a creator pid that is not alive (BL-1287).
     bl1287's property file and its acceptance handler deliberately spawn
     fixtures that name a DEAD creator, because that is the case they
     test, and hold each one for about a second while the selector runs.
     When bl857 loaded in another fork of the same lane, or in another
     seat's lane (the sweep reads the whole host process table), it killed
     that fixture before bl1287's selector read the table, and bl1287
     invariant 1 failed with "creatorAlive=false: expected selected=true,
     got false" (QA, BL-2061's lane).

     The hotfix keeps the selector unchanged and adds an age bound to the
     KILLER: bl857's sweep skips any selected pid whose `ps -o etime=` age
     is under 30 s (SIBLING_FIXTURE_MIN_AGE_S), or whose age cannot be
     read. A real leak is a `sleep 300` and outlives the bound by minutes,
     so a later load still sweeps it. This is the age half of the
     engineering Guardrails rule "reap only roots no live run owns (a dead
     recorded owner pid, or an age bound)" (BL-1385/BL-1390). `etime`
     rather than `etimes`, which macOS ps lacks. Verified at mint: a
     dead-creator fixture aged 35 s was swept and a fresh one survived a
     real bl857 run (4 of 4).

  2. extension/test/bl1346RcRepairStampInvariants.property.test.js
     invariants 1 and 2 carried a bare `120000` per-test timeout, a
     constant no lane ceiling scales (BL-1596's class). In a full lane at
     load 12-15 invariant 1 timed out at 123 s; alone at load 14.5 it takes
     30.7 s. Both sites now pass `propertyLaneTimeoutMs(120000)` (120 s
     quiet, up to 360 s under load), with a comment. No property body
     changed.

  ## What the coder does (all of it)

  1. Read `git show 3d5e5064c5` against the section above. Confirm only the
     constant, the age reader, the guard line, the timeout arguments, the
     require and the comments changed.
  2. Run bl857TunnelOwnershipInvariants, bl1287FixtureSweepScopingInvariants
     and bl1346RcRepairStampInvariants once each, alone, with
     `--config vitest.properties.config.mjs` and output under tmp/.
  3. Write backlog/evidence/BL-2093-coder-<date>.md with the review result
     and the run results, and commit it.

