source: |
  Human Cursor session 2026-08-25 after refuse-rematch wait-reconcile.
  Intake: backlog/INTAKE-bl1138-residual-refuse-rematch-not-executed.md.
  Follow-on to BL-1138 (replay-bookkeeping execute) / BL-1135 / BL-1130.
description: |
  ## What is wrong

  BL-1138 made `:replay-bookkeeping` execute `git reset --hard origin/main`
  in handoffd. The sibling absorb outcome `:refuse-rematch` still only
  returns `{:success false :outcome :refuse-rematch}` (and Process B
  prints refuse then exits 1). Live master checkout therefore sits on
  `wait-reconcile` / `surfaced: refuse-rematch` until a human rematches —
  measured 2026-08-25 ahead≈12 behind=3 ticks≥13; Cursor merge restored
  `behind=0` / `proceed` (that join was clean under ort).

  ## What to do

  1. When absorb-dispatch chooses `:refuse-rematch`, **execute** rematch
     onto `origin/main` on the live handoffd / Process B path (same class
     of recovery BL-1138 added for replay-bookkeeping), so behind returns
     to 0 without Cursor.
  2. Clear reconcile surfaced `refuse-rematch` on success;
     `main_sync_status_cli` returns proceed|ff-only.
  3. Keep BL-1130 / BL-1120: no editor MERGE_HEAD; no abort of foreign
     MERGE_HEAD.
  4. Soft: if foresight would-conflict falsely refuses a clean ort merge,
     tighten foresight or retry so false refuse-rematch does not stick.

  ## Out of scope

  - Heuristic auto-merge of genuinely conflicted file contents.
  - One-shot ops rematch of the 2026-08-25 refuse-rematch tip (ops; done).
  - Reverting BL-1138 / BL-1130 / BL-1120 product policy text.
qa_e2e_procedure: >
  (1) Fixture: ahead local tip + land that yields refuse-rematch → rematch
  → behind=0 / proceed; no Complete-origin/main-merge. (2) refuse-rematch
  surface does not stand across ticks waiting for human. (3) BL-1130/1120
  preserved. (4) main_sync_status_cli ready after recovery.
