required_wiring:
  - "specs/pipeline/steps/index.js::bl1069TmuxServerVersionSteps::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them. Verified absent from index.js at spec time, so the anchor cannot pass before the work is done"

invariants:
  - "A version judgement about the control plane is read from the live server on the swarm socket, never from whatever `tmux -V` finds on PATH: the swarm never reports as healthy a plane running a binary it did not measure."
  - "Preferring a tmux binary never lowers the version the swarm would otherwise have used."
  - "A stability knob the running tmux rejects never fails an ensure, a launch, or a plane restore."

description: |
  ## What

  An operator hotfix is live on main and has never been through a gate. This
  ticket is that gate. It is a REVIEW ticket, not a rewrite ticket - confirm
  or refute the landed diff, and open narrow follow-ups for anything found.

  ## The failure it fixed

  The control plane died repeatedly while the daemons stayed UP
  (`control-plane-missing`). `./swarm ensure` restored the agents, and the
  server crashed again within minutes. dmesg carried repeated `tmux: server`
  SIGSEGV, `segfault at 208`, against `/usr/bin/tmux` 3.4. The cause is
  Ubuntu tmux 3.4's NULL-window dereference in `resize.c` when
  `WINDOW_SIZE_MANUAL` is set (fault at offset 0x208), fixed upstream by
  commit `6234d79` ("Do not set manual size if no window"), present in tmux
  >= 3.7 and absent from Ubuntu's 3.4 package. Option tweaks alone do not
  substitute for the version.

  ## What landed (files to review, all in commit 61c62f579)

  - `swarmforge/scripts/swarmforge.sh` - `prefer_local_tmux_bin` prepends
    `~/.local/bin` to PATH when a tmux is there; `warn_if_tmux_too_old` warns
    when the version parses below 3.7; `harden_tmux_server` sets
    `focus-events off` and `window-size largest` on the swarm socket. All
    three are called on the `ensure` path and on the toplevel launch path.
  - `swarmforge/scripts/control_plane_lib.bb` - `harden-server!`, the same
    two knobs via `daemon-cycle-guard-lib/sh!` with `:continue true`.
  - `swarmforge/scripts/swarm_ensure.bb` - calls `harden-server!` after a
    plane restore and when the plane is already `:up`.
  - `swarmforge/scripts/install_tmux_wsl.sh` - new; curls a static tmux
    build into `~/.local/bin` without root.
  - `docs/how-to/BL-tmux-wsl-segfault-upgrade.md` - ops bounce procedure.

  ## Review goals

  1. **The verdict reads the client, and the incident state is a client that
     was already fine.** This is the highest-value goal and the reason
     invariant 1 exists. `warn_if_tmux_too_old` runs `tmux -V`, which reports
     the binary on PATH. The intake's own live probe recorded the opposite
     pair: the PATH client was ALREADY 3.7b while
     `tmux display-message -p '#{version}'` on the swarm socket answered 3.4
     and `/proc/<pid>/exe` pointed at `/usr/bin/tmux`, because the server
     predated the install. So on the exact host, in the exact state the crash
     loop lives in, the landed warn is silent. Confirm or refute, and if
     confirmed, make the judgement read the server the swarm is actually
     talking to.
  2. **Preference is by path, never by version** (invariant 2).
     `prefer_local_tmux_bin` prepends `~/.local/bin` whenever a tmux exists
     there, with no version comparison and no platform guard. A host whose
     `~/.local/bin/tmux` is OLDER than the one already on PATH is silently
     downgraded by the function written to upgrade it, and the prepend fires
     on macOS too, where this incident does not exist.
  3. **The hardening is soft, and must stay soft** (invariant 3). Confirm the
     `|| true` in the shell path and `:continue true` in the bb path are the
     real seams, that `harden_tmux_server`'s `list-sessions` guard means a
     dead plane is a no-op rather than an error, and that neither call can
     turn a healthy ensure into a reported failure.
  4. **Weigh what `window-size largest` does to the tiles.** It is a global
     option on the swarm's own server, and the extension's panel tails those
     panes. Confirm the capture path is unaffected, or say what changes.
  5. **`install_tmux_wsl.sh` is unpinned, unverified and x86_64-only.** `VER`
     defaults to a floating `3.7b` and the URL is interpolated to
     `-x86_64.tar.gz`; there is no checksum and no arch branch. The
     engineering guardrail is that tool versions are pinned, not floating.
     Weigh a digest check and an explicit refusal on an unsupported arch
     against the intake's out-of-scope line on packaging; scenario 04 fixes
     the behaviour asked for, which is a refusal by name, not a wider
     installer. Also check the `[[ -z "$SRC" || ! -x "$SRC" && ! -f "$SRC" ]]`
     guard - mixed `||`/`&&` there does not mean what it reads as.
  6. Open narrow follow-up tickets for anything found; do not widen here.

  ## How (direction, not mandate)

  For goal 1 the seam already exists: `control_plane_lib.bb` probes the
  server on the socket, so a version fact can come back with the probe rather
  than from a second, unrelated binary. For goal 2, compare before
  preferring. Neither shape is mandated.

  ## Live verification the human already performed

  Recorded as context, NOT as a substitute for the swarm's own pass: the
  official static tmux 3.7b was installed at `~/.local/bin/tmux` with no root
  and the control plane bounced (`kill-server` + `./swarm ensure`), after
  which `#{version}` was 3.7b, the server exe was `~/.local/bin/tmux`, all
  agents were UP, and `focus-events=off` / `window-size=largest` were set.

out_of_scope: |
  Carried from the intake, which states them as human decisions:
  - Packaging tmux 3.7 into apt / requiring sudo.
  - Operator-runtime tmux socket (separate process; upgrade optional).
  - Doubling coder seats or difficulty-aware routing (BL-1001).
  - Babysitter meminfo / `vm_stat` work - that is the separate babysitter
    auto-heal hotfix intake, minted as its own ticket. Do not conflate.
  - Re-implementing the fix; this stamps the landed diff.

qa_e2e_procedure: >
  1. **Reproduce the blind spot before trusting the fix.** At the parent
  commit, with a control-plane server started by tmux 3.4 and a 3.7b client
  first on PATH, run the swarm's version check and confirm it says nothing -
  the incident state passes silently. 2. At the parcel commit, repeat the
  same pairing and confirm the operator is warned, and that the warning names
  the SERVER version it measured on the socket, not the client's.
  3. **Confirm the live failure mode is gone, as the human asked.** Confirm
  `tmux display-message -p '#{version}'` on the swarm socket reports 3.7b (or
  another >= 3.7) and that `/proc/<pid>/exe` for that server resolves to
  `~/.local/bin/tmux`, not `/usr/bin/tmux` 3.4; confirm dmesg carries no new
  `tmux: server` `segfault at 208` entries across the run. 4. **Preference
  never downgrades.** With an older tmux at `~/.local/bin/tmux` than the one
  on PATH, confirm the swarm launches with the newer one. 5. **Hardening is
  soft.** Force each `set-option` to be rejected in turn and confirm the
  ensure still reports the control plane up and records no control-plane
  failure. 6. **The tiles still render.** With `window-size largest` set on
  the live server, open the extension panel and confirm every role tile still
  tails its pane. 7. **The installer refuses rather than half-installs.**
  Point it at an arch with no build, and separately at a build that fails its
  digest, and confirm in both cases that nothing is left at
  `~/.local/bin/tmux` and the refusal names the obstacle. 8. Record the
  degraded gate explicitly: this diff is shell + Babashka only, so no
  mutation, CRAP or DRY tooling applies - the gate is the runners under
  `swarmforge/scripts/test/` plus these acceptance scenarios.

notes: |
  ## Locked human decisions, carried verbatim from the intake

  1. "Specifier mints a **high** defect / swarm-review ticket (BL-849 shape):
     verify the human-landed PATH preference, version warn, soft harden
     options, and how-to/install script are correct; stamp through the
     normal chain."
  2. "Acceptance must prove the live failure mode: dmesg showed repeated
     `tmux: server` SIGSEGV `segfault at 208` on `/usr/bin/tmux` 3.4; after
     bounce, the control-plane server must report `#{version}` **3.7b** (or
     other >=3.7) from `~/.local/bin/tmux`, not 3.4."
  3. "Do **not** widen into babysitter meminfo/`vm_stat` (already filed) or
     second-coder capacity work."

  Also carried verbatim, on the posture: "**Operator/Cursor hotfix already in
  the tree** - same posture as BL-811 / BL-849 / BL-879: commit makes it
  reviewable; this intake asks the swarm to stamp it off through a
  high-severity review ticket, not to re-implement from scratch."

  ## Related, do not conflate

  - **BL-958** (done) - control-plane-missing classification + `./swarm
    ensure` recovery. Carried verbatim from the intake: "Ensure can restore
    panes after a crash, but cannot stop Ubuntu tmux 3.4 from segfaulting
    again."
  - **The babysitter auto-heal hotfix** - separate intake, separate ticket.
    Carried verbatim: "babysitter never ran ensure on WSL because `vm_stat`
    aborted the sweep. That hotfix restores auto-heal; this one stops the
    underlying tmux crash loop."
  - Upstream tmux commit `6234d79` ("Do not set manual size if no window"),
    present in tmux >= 3.7, absent in Ubuntu's 3.4 package.

  ## Hotfix ledger

  Commit under review: 61c62f579 on main, "Land Cursor hotfix: prefer tmux
  >=3.7 on WSL to stop control-plane segfaults", carrying
  `Hotfix-Certification: pending`. Its ledger entry in
  `backlog/hotfix-ledger.yaml` takes `stamp_ticket: BL-1069`; per that file's
  own header the durable fields are set by a human/operator via
  `hotfix_ledger_update.bb`, never by the sweep and not by me.

  ## Degraded gate, recorded up front

  The whole diff is shell + Babashka: no mutation/CRAP/DRY is wired for
  either layer (engineering.prompt, Startup Tools). The gate is the unit
  runners under `swarmforge/scripts/test/` plus the acceptance scenarios. A
  hardening pass must record that fallback explicitly and must never imply
  mutation ran.

  ## Bash 3.2 target

  `swarmforge.sh` targets stock macOS `/bin/bash` 3.2. The landed
  `[[ ]]`/`(( ))`/`local` usage is 3.2-safe; any repair must stay so, and any
  new array expansion must use `${arr[@]+"${arr[@]}"}` (BL-801).

  ## IR-DRY judgment recorded: 1 finding -> 0 resolved

  A medium-confidence possible-synonym (score 0.571) between scenario 02's
  Given "a tmux at `~/.local/bin/tmux` reporting <local>" and scenario 04's
  Then "no tmux is left at `~/.local/bin/tmux`". Deliberate contrast, not
  drift: the two steps name the same path precisely because the installer
  writes exactly where the preference reads, and rewording either would hide
  that. Left as written.

source: |
  backlog/INTAKE-tmux-wsl-segfault-upgrade-hotfix.md (human via Cursor
  2026-08-22 ~17:10 BST, landed the same day), archived to
  backlog/archive/ on mint by the specifier 2026-08-22. Routed by the
  coordinator as note 20_20260822T161124Z_001006 ("Root intake
  tmux-wsl-segfault-hotfix needs disposal (mint ticket)") and note
  50_20260822T161053Z_001005 ("Stamp INTAKE-tmux-wsl-segfault-upgrade-hotfix
  (tmux 3.7b)").

  Landed diff re-read by the specifier at 61c62f579 before minting; the
  client-versus-server blind spot in review goal 1 is the specifier's own
  finding from that read, cross-checked against the live probe the intake
  already recorded.

  ## Spec amended in flight 2026-08-22 - bookkeeping only, nothing to rebuild

  Scenario 03 lost two Examples rows (`window-size`, `both`) and is now a plain
  Scenario over the surviving knob, and the Feature narrative was re-tensed to
  say so. Reported by the coder as note
  `00_20260822T211409Z_000819_from_coder_to_specifier`: "BL-1069 scn03: 2 rows
  now vacuous + runner reseeds per run."

  Cause: BL-1075 (coder commit 37e12a71e) removed `window-size largest` from
  both hardening halves - `swarmforge/scripts/swarmforge.sh`'s
  `harden_tmux_server` and `control_plane_lib/harden-server!`. Nothing sets
  that option any more, so a fake tmux that REJECTS it is never asked to, and
  the row passed whether or not the code handled a rejection. Vacuous, not red:
  the mirror image of BL-1006's stale-assertion case and just as much the
  successor slice's job to retire. `both` went with it - with one knob left it
  names nothing. The scenario's property is unchanged and still gated by
  `focus-events`, which survives in both halves.

  The coder's second clause is why this had to happen in the feature file:
  `specs/pipeline/generated/` is gitignored and rebuilt from the `.feature` on
  every run, so a downstream edit would be reseeded away.

  No code change, no new scenarios, no new step handlers - `KNOWN_OPTIONS` in
  `bl1069TmuxServerVersionSteps.js` may keep its wider set, which only guards
  against unknown values. Merge `main` and re-read before hardening.

