description: |
  ## Status: hotfix 662b7933c3 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong, and what the hotfix changed

  QA's BL-2055 property lane on 2026-10-07 (load 12-14) timed out two
  tests in files the parcel did not touch:

  1. extension/test/bl1333StampOffInvariants.property.test.js, invariant
     2: 127 s against a bare `120000` per-test timeout, a constant no lane
     ceiling scales (BL-1596's class). Alone at load 9-11 it takes 48 s.
     The hotfix requires `propertyLaneTimeoutMs` and passes
     `propertyLaneTimeoutMs(120000)` to both of the file's bare 120000
     sites (invariants 1 and 2): 120 s on a quiet host, up to 360 s under
     load. A comment says why.
  2. extension/test/bl1445StaffingGateWiringTestDecidesOverrideInvariants.property.test.js,
     invariant 1: 83 s, past its scaled `propertyLaneTimeoutMs(20000)`;
     17.1 s alone at load 9-11. The base moves to 60000 (bl1529's and
     bl1389's class: 60 s quiet, up to 180 s under load), and the
     existing BL-1808 comment gains a line.

  No property body changed.

  ## What the coder does (all of it)

  1. Read `git show 662b7933c3` against the section above. Confirm only
     the timeout arguments, the one require and the comments changed.
  2. Run the two property files once each, alone, with
     `--config vitest.properties.config.mjs` and output under tmp/.
  3. Write backlog/evidence/BL-2066-coder-<date>.md with the review
     result and the run results, and commit it.

