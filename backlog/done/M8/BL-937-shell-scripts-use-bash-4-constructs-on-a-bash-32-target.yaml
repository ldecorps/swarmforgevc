id: BL-937
title: "Six tracked shell scripts use bash-4-only constructs on a stock-macOS-bash-3.2 target, so three handoffd rotation wiring tests and two operator scripts cannot run at all on this host"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 15
direction: agent-proposed
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-937-shell-scripts-run-on-stock-macos-bash-32.feature

invariants:
  - "A port preserves behaviour exactly. Every site that reads command output into an array must yield the identical element list the bash-4 builtin yielded, including for empty output (zero elements), a final line with no trailing newline, and lines containing spaces, tabs and backslashes."
  - "Nothing outside the six named files changes behaviour. This is a portability port, not a refactor - no script gains or loses an argument, a diagnostic, or an exit code, and no production logic is rewritten while passing through."
  - "The replacement idiom stays safe under `set -u` on bash 3.2: an array left empty must still be expandable without an unbound-variable abort (BL-801's `${arr[@]+\"${arr[@]}\"}` rule). The port must not reintroduce the very failure mode it sits next to."

description: >
  engineering.prompt states the target plainly: "Target stock macOS
  /bin/bash 3.2, not Homebrew bash". Six tracked shell scripts violate it
  by using the `mapfile` builtin (bash 4.0+) or case-converting parameter
  expansion `${var^^}` (bash 4.0+). On this host, where /bin/bash 3.2 is
  the only bash present, each dies on the construct.

  Measured 2026-08-19 by invoking each script directly:

    swarmforge/scripts/test/test_handoffd_priority_rotate_wiring.sh
      exit 127, "mapfile: command not found" - 4 sites
    swarmforge/scripts/test/test_handoffd_aged_note_rotate_wiring.sh
      exit 127, same - 2 sites
    swarmforge/scripts/test/test_handoffd_starve_rotate_wiring.sh
      exit 127, same - 4 sites
    swarmforge/scripts/smoke_check_stabilize_two_pack.sh
      exit 127, same - 1 site (line 27)
    swarmforge/scripts/swarm_dashboard.sh <project-root>
      "line 37: mapfile: command not found" - the operator dashboard cannot
      start at all
    swarmforge/scripts/reexpedite_from_wip.sh <project-root> <BL-id>
      "line 33: ${2^^}: bad substitution" - dies before it even reaches its
      own two mapfile sites (lines 80 and 86)

  The three handoffd wiring tests are the sharp end of this. They are three
  rotation-dispatch gates that have never executed once on this host, so
  whatever they assert has never been checked here. Their failure has twice
  been noticed and written off in evidence files as "pre-existing and
  unrelated to this diff" (backlog/evidence/BL-795-hardener-verify-pass.md,
  backlog/evidence/BL-911-coder-pass.md) without a ticket ever being
  raised - a red that has been normalised rather than fixed.

  Precedent for the fix is already in this repo. swarmforge/scripts/
  lifecycle_matrix.sh carries an explicit comment - "Deliberately plain
  indexed arrays, no `declare -A`: this project targets ..." - showing the
  house style for exactly this situation. BL-874 (portable relative mtime
  in shell tests) and BL-877 (portable process liveness without /proc) are
  the same class of ticket, already landed.

  How (direction, not mandate): the standard bash 3.2 replacement for
  `mapfile -t ARR < <(cmd)` is an explicit read loop that appends, and for
  `${var^^}` a `tr '[:lower:]' '[:upper:]'` pass. Whether the read loop is
  written inline at each site or lifted into one shared helper sourced by
  all six files is the implementer's call - one helper is likely cleaner at
  12 sites, but a helper that has to be sourced from a test fixture's own
  subshell may not be worth the plumbing. What matters is invariant 1: the
  resulting array must be indistinguishable from what mapfile produced, and
  the empty-output case is the one that most often is not.

  Acceptance scenario 02 is the standing check that keeps this from
  recurring: a scan of tracked shell scripts, comment lines excluded, for
  the two constructs actually found here.

constraints: >
  Out of scope:

  - Any behavioural change to the six scripts beyond making them run. If a
    ported test turns out to FAIL on a real assertion once it can finally
    execute, that is a SEPARATE defect that this port has surfaced, not
    part of this parcel. Record it with evidence and raise it; do not fix
    it here and do not weaken the assertion to make the port look clean.
    This is the single most likely way this slice blows past one sitting -
    three tests that have never run on this host may well be carrying rot.
  - Banning constructs that do not actually appear in the repo today
    (`declare -A`, `&>>`, `${var,,}` and friends). The scan's construct
    list is deliberately limited to what was measured. Broadening it is a
    later ticket, once this one has cleared the existing violations.
  - Wiring the scan into a standalone pre-commit or pre-handoff gate
    script. The acceptance scenario is the check this ticket delivers;
    promoting it to its own gate command is a separate, smaller follow-up
    and must not be folded in.
  - Installing or depending on a newer bash. The target is the stock
    interpreter, deliberately - the fix is in the scripts, never in the
    host.

qa_e2e_procedure: >
  On the live swarm host, from the repo root, using the stock interpreter
  throughout (`/bin/bash --version` must report 3.2 - if a newer bash is on
  PATH, invoke `/bin/bash` explicitly so the target is really exercised):

  1. Reproduce at the commit before the fix: run each of the six scripts as
     listed in the description and confirm the six failures quoted there.
  2. At the parcel commit, run the three wiring tests under /bin/bash and
     confirm each runs to completion reporting every scenario passing:
     `/bin/bash swarmforge/scripts/test/test_handoffd_priority_rotate_wiring.sh`
     and the aged-note and starve siblings.
  3. `/bin/bash swarmforge/scripts/smoke_check_stabilize_two_pack.sh` -
     confirm it gets past line 27 and reports its own result rather than
     exit 127.
  4. Build a throwaway fixture root containing only
     `.swarmforge/tmux-socket` pointing at a dead socket path, then
     `/bin/bash swarmforge/scripts/swarm_dashboard.sh <fixture-root>` -
     expect the script's own "no swarmforge-* sessions live" diagnostic and
     exit 1, never a mapfile error. Use a fixture root, never the live
     project root, so the running swarm's dashboard is untouched.
  5. `/bin/bash swarmforge/scripts/reexpedite_from_wip.sh <fixture-root>
     bl-000` - confirm the lower-case id is accepted and normalised to
     BL-000 (the script proceeds past its own usage check) rather than
     aborting with "bad substitution". Do not run it against a real ticket.
  6. Run the acceptance feature and confirm scenario 02's scan reports no
     occurrence for either construct across tracked shell scripts, and that
     it does NOT trip on lifecycle_matrix.sh's comment (grep that file's
     line 9 to confirm the comment is still there and still ignored).
  7. Confirm invariant 2 by inspection: `git show --stat` on the parcel
     commit lists only the six scripts plus this ticket's feature file and
     step handler.

notes: >
  Source: found by the specifier while reproducing BL-936, when
  test_handoffd_aged_note_rotate_wiring.sh - one of the rotation fixtures
  being surveyed - failed with exit 127 for a reason unrelated to BL-931's
  gate. Surfaced rather than swept, per the workflow rule. BL-936 and this
  ticket are independent: BL-936 is a fixture premise defect in a JS
  property file, this is a shell portability defect, and neither blocks the
  other.

  Prior sightings, both closed out as noise at the time:
  backlog/evidence/BL-795-hardener-verify-pass.md ("fails on this host with
  `mapfile: command not found` (macOS system /bin/bash 3.2 has no `mapfile`
  builtin) - same failure independent of this diff") and
  backlog/evidence/BL-911-coder-pass.md ("confirmed pre-existing and
  unrelated"). Both readings were correct about their own parcel and wrong
  about the repo: the failure is real, it is ours, and nothing was going to
  raise it on its own.

  Complete inventory as measured, so the coder does not have to re-derive
  it: mapfile at swarm_dashboard.sh:37, smoke_check_stabilize_two_pack.sh:27,
  reexpedite_from_wip.sh:80 and :86, test_handoffd_priority_rotate_wiring.sh
  :73/:99/:128/:156, test_handoffd_aged_note_rotate_wiring.sh:132/:193,
  test_handoffd_starve_rotate_wiring.sh:76/:102/:128/:158; case-converting
  expansion at reexpedite_from_wip.sh:28 and :33. Twelve mapfile sites, two
  expansion sites, six files. Re-verify before trusting these line numbers -
  they were read on 2026-08-19.

approval_context: >
  One thing wants your judgement; the rest is measurement.

  How far the scan should reach. I limited acceptance scenario 02 to the two
  constructs actually present (`mapfile`/`readarray` and `${var^^}`/
  `${var,,}`), and explicitly ruled out banning constructs that do not
  appear today. That keeps the slice honest and small, but it means a future
  `declare -A` still slips through until someone widens the list. The
  alternative - ban the whole bash-4 family now - is more thorough and makes
  the ticket bigger and more speculative. Say the word if you want the wider
  net in this ticket rather than a follow-up.

  Also flagging, not asking: I have written a constraint saying that if one
  of the three never-executed wiring tests fails on a real assertion once it
  can finally run, that is a separate defect to raise rather than fix here.
  That is the main way this slice could blow up, and I would rather it
  bounce out as a new ticket than quietly become a two-day parcel.

