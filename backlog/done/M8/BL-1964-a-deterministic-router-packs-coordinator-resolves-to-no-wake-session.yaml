description: |
  ## What is wanted

  `resolve-wake-session` takes one more key, the pack's deterministic flag,
  and returns no session for the coordinator when it is set and the
  coordinator has no session of its own (mirroring BL-614, which already
  keeps the coordinator out of rotation). `wake-session` reads the pack's
  mode for it. Every other recipient resolves exactly as before, so a
  dormant role still wakes the resident.

  BL-1965 (closing clear) and BL-1966 (babysitter nudge) reach the resident
  through `wake-session`; this slice changes only the resolver.

  ## What each stage checks

  - Coder: the two scenarios; handoff_wake_session_test_runner.bb passes.
  - Architect: the two invariants; every other wake-session caller in
    handoffd.bb treats a nil session as "nobody to wake".
