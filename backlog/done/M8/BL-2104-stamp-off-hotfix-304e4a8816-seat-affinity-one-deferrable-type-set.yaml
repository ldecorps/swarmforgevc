description: |
  Status: hotfixes 304e4a8816 (the two test runners) and c045fbbfc3 (the
  seat_affinity_lib.bb half) landed the fix. The coder reviews both and
  never re-applies them.

  304e4a8816 was meant to carry the lib change too, but the working-tree
  edit of seat_affinity_lib.bb was rewritten to HEAD content at 18:38:09Z,
  7 s before that commit, and the commit went through without it; main's
  runners then referenced an undefined `rework-deferrable-types` until
  c045fbbfc3 (QA note 003960). What rewrote the file is not known; the
  specifier's notes record what was checked.

  The coder reported the red while verifying BL-2095 (note 000199,
  evidence b703c0cba3 on its branch:
  backlog/evidence/unowned-red-bl1004-deferral-hold-gap-20261009.md).
  `bb swarmforge/scripts/test/bl1004_seat_affinity_property_runner.bb`
  failed on main: "hold draw N: deferral-hold? false but some-seat-defer
  true" for every note/awake/rule_proposal draw carrying a task.

  BL-1843 (541d376bfe) dropped rework-claim-decision's type check so a
  note naming a ticket is deferred exactly as a git_handoff for it would
  be. deferral-hold?, which the chase sweep and the flow watchdog consult
  so a deferred parcel never trips a stall alarm, still required
  `git_handoff`. The runner's first sweep also still asserted "only a
  git_handoff is ever deferred". The unit runner asserted "a note is
  never held".

  The two commits together:
  - `rework-deferrable-types #{"git_handoff" "note"}` in
    seat_affinity_lib.bb, read by both rework-claim-decision and
    deferral-hold?, matching rework-claim-decision's own docstring
    ("a git_handoff OR a note"). BL-1655's reclaim branch stays
    type-agnostic in both.
  - The bl1004 runner draws its deferrable shapes over that set and keeps
    awake and rule_proposal as the never-deferred shapes.
  - The unit runner's "a note is never held" now reads held, and awake and
    rule_proposal are asserted never held.
  Live behaviour does not change: claim-task-name resolves a task only for
  a git_handoff's `task:` and a note's `Work BL-...` message.

  The review asks: is a type guard on rework-claim-decision the right
  reading of BL-1843, rather than dropping the hold's type check
  outright? (The guard keeps awake and rule_proposal out on a path no
  live parcel reaches today.)

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `bb swarmforge/scripts/test/bl1004_seat_affinity_property_runner.bb`:
     ALL PROPERTIES HOLD (measured on main after c045fbbfc3; red before,
     and red with 304e4a8816 alone).
  2. `bb swarmforge/scripts/test/seat_affinity_lib_test_runner.bb`: all
     assertions passed. `bash swarmforge/scripts/test/test_chase_sweep.sh`:
     ALL PASS. `bb swarmforge/scripts/test/flow_watchdog_test_runner.bb`:
     ALL PASS.
  3. `node specs/pipeline/cli.js` on the BL-1843 and BL-1004 features:
     7/7 and 5/5 ok (measured on main at mint with the change).
  4. Read the coder's committed review evidence.

