source: |
  Operator, 2026-08-20 morning: "i did not receive my morning briefing?" -
  correct, and silent. Coordinator filed evidence
  (backlog/evidence/briefing-generated-outside-window-never-sends-20260820.md,
  commit 4327a7db2) and routed a mint note to the specifier. The specifier's
  probe CORRECTED the evidence's mechanism theory (correction appended to the
  same file): the BL-214/BL-821 unsent-sweep exists and runs every cycle; the
  actual cause is that the 06:00:18Z daemon generation launched without
  RESEND_API_KEY in its environment - handoffd.log shows email-misconfigured
  at 06:01:56Z and briefing-skip-missing-key 2026-08-20.md on every cycle
  since, while the 03:50Z generation still had the key and sent 2026-08-19.md.

description: |
  ## What is broken

  RESEND_API_KEY deliberately rides only the daemon's process environment
  (BL-215) - the repo never stores it, and that posture stays. But the
  supervisor/watchdog relaunch chain spawns new daemon generations from
  whatever environment happens to run it (handoffd-supervisor.log shows a
  fresh supervisor every ~6 minutes all morning of 2026-08-20). A generation
  launched from a keyless shell loses ALL email capability at once: the
  BL-214 briefing sweep skips every file (briefing-skip-missing-key) and the
  BL-144 daemon-death alarm email is equally dead. The only trace is the
  daemon's own log - the operator's first signal is a briefing that never
  arrives. Telegram alerting is unaffected (it needs no email key).

  ## The fix - two legs, one observable outcome

  After any relaunch, either email still works, or the operator hears about
  it within one sweep cycle:

  1. **Re-source at launch.** The standard launch path
     (start_handoff_daemon.sh - the chokepoint every launcher already goes
     through, per handoffd_supervisor.bb) sources
     `.swarmforge/operator/daemon.env` when it exists, before starting the
     daemon. The file is operator-created, lives under gitignored
     `.swarmforge/` runtime state, is never committed, and its VALUE never
     reaches a log line. No file -> behavior unchanged (ambient env only).

  2. **Alert when still keyless.** When notify_email_to is configured and
     the generation still has no key, the existing one-shot
     email-misconfigured warning additionally reaches the operator through
     the Telegram alert path the daemon already owns (log key direction:
     email-keyless-alert) - once per generation, naming RESEND_API_KEY and
     the env file path the launch looked for.

  ## How (direction, not mandate)

  - Reuse the existing adapter seams: briefing_email_lib.bb /
    daemon_alarm_lib.bb already inject env lookup, transports and log fns -
    the new decision logic stays pure and fixture-tested; the Telegram send
    reuses the daemon's existing operator-alert helper, adding no second
    client.
  - Babashka surface only; no TS. Bb/Clojure has no mutation/CRAP/DRY wired
    (BL-472 deferred) - gated by the bb unit suite
    (swarmforge/scripts/test/); a hardening pass records the degraded
    fallback, never implies mutation ran.
  - Shell tests follow the established fixture pattern: env -u
    SWARMFORGE_CONFIG, env seams, scratch dirs, no live daemon, no real key.

  ## Relations

  - The relaunch CHURN itself (why a new supervisor every ~6 min) is
    BL-967's territory with soak tracked by BL-975 - out of scope here.
    This defect survives the storm fix entirely: one legitimate keyless
    relaunch is enough to lose email silently.
  - BL-821's send window means a stranded briefing self-heals if the key
    returns within today+yesterday UTC; beyond that only the explicit
    one-shot catch-up mails it. Scenario email-key-06 pins the self-heal.

acceptance: specs/features/BL-976-daemon-relaunch-loses-email-key-silently.feature

qa_e2e: |
  In a scratch fixture daemon (env -u SWARMFORGE_CONFIG, fixture conf with
  notify_email_to set, stdout/stderr to a file - never the live daemon):
  (1) launch keyless with no env file: expect the Telegram-alert call
  observed via its seam, briefing-skip-missing-key in the log, exactly one
  alert across several cycles; (2) create the operator env file with a
  dummy key, relaunch: expect the capability check to pass and the sweep to
  attempt the send through the fixture transport; (3) grep every produced
  log for the dummy key value - zero hits. On the LIVE host, after the
  operator provisions .swarmforge/operator/daemon.env (QA never writes the
  real key anywhere): bounce the daemon via the standard procedure and
  verify handoffd.log shows no email-misconfigured line and .sent.json
  gains the day's briefing on the next sweep.

out_of_scope: |
  - The supervisor/watchdog relaunch churn (BL-967 landed, BL-975 soaks it).
  - Any second email client or provider change; the single Resend client
    stays.
  - Storing the key in the repo, in a tracked file, or in VS Code
    SecretStorage for the headless daemon (BL-215 posture unchanged).
  - The historical catch-up path for briefings older than the BL-821
    window (existing explicit one-shot remains as-is).

