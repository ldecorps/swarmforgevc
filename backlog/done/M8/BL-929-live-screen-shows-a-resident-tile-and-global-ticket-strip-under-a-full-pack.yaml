id: BL-929
title: "The Live Screen decides its layout from the mono-router marker file rather than the running pack, so a standing full pack renders a RESIDENT tile, a global ticket strip, and another role's identity on the specifier tile"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarm-reliability
human_approval: approved
priority: 20
direction: human-requested
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-929-live-screen-follows-the-running-pack-not-the-resident-marker.feature

invariants:
  - "The mono-router active-role marker is never on its own sufficient evidence of layout. Its presence, absence or contents never decides what the Live Screen renders for a pack whose running shape says otherwise."
  - "A tile never displays another role's identity. Each tile's label, subtitle and model come from the role that owns that pane."
  - "One renderer serves both the Mini App and Bubble Live. Any layout decision added here is taken in that shared renderer, never forked per surface."

approval_context: >
  Three things to sign off, one of which corrects your intake.

  Your intake said "Pack switch did not clear the marker". Measured: it is
  worse than that. The full pack launched at 19:01 and
  .swarmforge/mono-router-active-role has mtime 19:15 with contents `coder` -
  it was WRITTEN fourteen minutes INTO the full-pack run, by
  handoff_lib.bb's write-mono-router-active-role!. So clearing the marker at
  pack-switch time would not have fixed tonight's screen; it would have been
  rewritten. I have specced the fix as "layout follows positive evidence of the
  running pack" and deliberately NOT as marker hygiene. Marker hygiene may
  still be worth a ticket on its own merits, but it is not this fix and would
  not have prevented this.

  Standalone, not folded into BL-775. Your fold condition was "only if that
  ticket is still the Live renderer owner". It is not - BL-775 is unbuilt
  (status todo, priority 142, blocked on BL-829) and it CONSUMES this renderer
  rather than owning it. Folding would strand a live defect behind a blocked
  ticket. Because both surfaces share one renderer, fixing it here fixes Bubble
  Live for free, which is the "or Bubble Live ships the same lie" worry in your
  intake answered.

  Severity medium, and I want a second opinion on it. Nothing is down and the
  pipeline is unaffected - the per-tile ticket lines are correct, so the
  information is on screen, just badly framed. I filed medium on that basis.
  The argument for high is that this is your hawk view, you are running full
  pack tonight, and a RESIDENT column that does not exist is an actively false
  reading rather than a missing one. Say high and I will change it; the only
  practical difference is the Article 3.2.4 expedite lane, where it would
  compete with BL-928.

source: |
  backlog/INTAKE-live-screen-full-pack-no-resident.md (human via Cursor
  2026-08-18, from the phone Live Screen at
  bubble.musicalsifu.com/resident-spy while the swarm was on full-forge),
  minted 1:1 - nothing split off and nothing merged in.

  Human decisions locked in that conversation, quoted verbatim. The intake
  states "Specifier may challenge or refine; do not silently drop these without
  asking" - the challenge is recorded in approval_context, and nothing below is
  dropped:

  1. "**Full pack: drop the top header.** The `#ticket-strip` block must not
     show when the live layout is standing-fleet (full-forge / seven-pack /
     any non-rotation pack). Ticket id / title / role / model / age, if
     shown, live on the tile that actually holds the claim (already rendered
     as `.pane-ticket` / fullscreen head)."
  2. "**There is no concept of resident** in that layout. Tile `pane-kind`
     labels are the real roles. Never \"Resident\". Never a `id: resident`
     column."
  3. "**Mono-router is a different layout.** Keep Resident + top strip there."
  4. "Surface is the Live Screen the phone was looking at (`/resident-spy`).
     Same renderer as Bubble Live (BL-775); do not fork."

description: |
  ## What happens

  `residentPaneLive.ts` decides the whole layout in one function:

      function isMonoRouterLayout(targetPath, liveRoles) {
        if (readMonoRouterActiveRole(targetPath)) {
          return true;
        }
        return liveRoles.length <= 2;
      }

  The marker check short-circuits before the live-session count is ever
  consulted. The session count on its own is correct - a mono-router pack is
  coordinator plus one resident, so `<= 2` distinguishes the two layouts - but
  it is unreachable whenever the marker file exists.

  Everything downstream hangs off that one boolean:

  - `liveScreenPaneId` returns `'resident'` for the coder role.
  - `liveScreenPaneLabel` returns the literal `'Resident'` for the coder role.
  - `captureLiveScreenPanes` passes the stale active-role into
    `resolveResidentRoleIdentity` as `monoActive`, which is how another tile's
    subtitle gets stamped with a role that pane is not running.
  - The HTML's `updateTicketStrip` is gated on nothing but `focusPane` and
    whether some pane has a ticket. `pickTicketPane` prefers a `resident` or
    `coder` pane and otherwise returns the FIRST pane with any `ticketId`, so
    on a full pack the strip advertises whichever downstream role happened to
    be holding work as if it were the swarm's one current ticket.

  ## Measured, this host, 2026-08-18 evening

  - Eight live sessions on the pipeline socket: coordinator, specifier, coder,
    cleaner, architect, hardender, documenter, QA, all created 19:01.
  - `.swarmforge/mono-router-active-role` present, contents `coder`.
  - `config rotation router` is set in `swarmforge/packs/mono-router.conf` and
    is NOT set in `swarmforge/packs/full-forge.conf`, whose own header reads
    "No rotation - every pipeline role has its own pane".

  What the operator saw on the phone: a top strip reading `BL-640 ...
  Documenter - Sonnet 5 - entered 2m ago`; tile headers COORDINATOR,
  SPECIFIER, RESIDENT, CLEANER, ARCHITECT, HARDENER, DOCUMENTER, QA; and both
  the SPECIFIER and the RESIDENT tile subtitled `Coder on Sonnet 5`.

  ## The correction to the intake's hypothesis

  The intake reasoned that the pack switch failed to clear a leftover marker.
  The marker's mtime is 19:15 - fourteen minutes AFTER the 19:01 full-pack
  launch - and `handoff_lib.bb` `write-mono-router-active-role!` is what writes
  it. So the marker is being actively maintained under a full pack, not merely
  left behind. Clearing it on pack switch would not have prevented tonight's
  screen.

  This is the whole reason the fix is framed as evidence rather than hygiene:
  the layout must be read from what the pack IS, and the marker must never be
  able to override that.

  ## Shape of the fix (direction, not mandate)

  Decide the layout from positive evidence about the running pack. Two signals
  exist and either or both may be used; the precedence is the implementer's
  call:

  - The effective pack config. `config rotation router` is present in every
    rotation pack's conf and absent from the standing packs, and the extension
    already has precedent for reading the active config
    (`resolveSwarmConfigPath` / `countRolesInConfig` /
    `runningSwarmMatchesConfig` in `swarmLauncher.ts`). This is the strongest
    signal and has no launch-time transient.
  - The live session count, which the function already computes and which is
    already correct. Note it is briefly `<= 2` while a full pack's sessions
    come up one at a time, so on its own it can flicker the screen into
    resident mode during a launch.

  What must NOT be used as evidence: the marker file. That is invariant 1 and
  it is the entire defect.

  The HTML side needs the layout to reach it - `updateTicketStrip` today cannot
  know which pack is running - so the snapshot the renderer sends will need to
  carry it. Naming and shape are the implementer's call.

qa_e2e_procedure: |
  1. Full pack, the headline case: with a standing full pack up and
     `.swarmforge/mono-router-active-role` present and non-empty, open
     `/resident-spy`. Confirm there is no `#ticket-strip` in the rendered page,
     no tile labelled Resident, and the coder tile carries the coder role's
     own display name. This is the exact condition observed on 2026-08-18, so
     it should reproduce on the live host without any fixture setup.
  2. Identity leak: on that same screen, confirm the specifier tile names the
     specifier role and its own model, and that no tile other than the coder
     tile mentions the coder role. The 2026-08-18 reading was SPECIFIER
     subtitled `Coder on Sonnet 5`.
  3. Strip is layout-decided, not ticket-decided: on the full pack, arrange for
     exactly one downstream tile (documenter is the natural one) to hold a
     ticket and no other tile to hold one. Confirm the top strip is still
     absent and that the ticket appears on the documenter tile itself. This is
     the check that fails if the host learns the layout but the HTML never
     consults it - the BL-419 shape, and the reason there is no
     `required_wiring` entry on this ticket (see notes).
  4. Mono-router unchanged: switch to a rotation pack - coordinator plus one
     resident - and confirm the coder tile is labelled Resident and the top
     strip returns. Nothing about that layout may change.
  5. Marker independence, both directions: on the full pack, delete the marker
     and confirm the screen is unchanged; recreate it with a different role
     name and confirm the screen is still unchanged. On the mono-router pack,
     delete the marker and confirm the Resident layout still holds on session
     count alone. Invariant 1.
  6. One renderer: confirm the Mini App `/resident-spy` and the Bubble Live
     page render from the same source and show the same layout for the same
     pack. If they diverge, the fix was forked and invariant 3 is broken.

out_of_scope: |
  Every item below is out of scope by explicit human decision in the source
  intake, except the last two, which are mine and are explained.

  - Changing pack topology, depth, or staffing.
  - Pipeline board, Notes, Control.
  - New Live Screen features. Steer is BL-569.
  - Minting without specifier disposition.
  - Marker hygiene on pack switch - clearing or refusing to write
    `mono-router-active-role` under a standing pack. Mine: the measurement
    above shows it would not have prevented this, and building it here would
    let the real defect hide behind it. If the marker being written under a
    full pack is itself wrong, that is its own ticket about handoff_lib.bb,
    not about the Live Screen.
  - Amending BL-775's own "coordinator + resident" framing beyond a pointer
    note. Mine: BL-775 is paused and unbuilt, and because both surfaces share
    one renderer it inherits this fix without a spec change.

notes: |
  Minted 1:1 from the intake. No consolidation was performed, so Article 5.3
  has nothing to preserve beyond the verbatim human decisions already quoted in
  `source:`. The intake's own invitation to challenge was taken up rather than
  declined - see approval_context - and no locked decision was dropped.

  Probed, not taken on report. Every claim in the description was read from
  this checkout at mint time: `isMonoRouterLayout`'s early return,
  `liveScreenPaneId`/`liveScreenPaneLabel`'s literal `'resident'`/`'Resident'`,
  the `monoActive` argument into `resolveResidentRoleIdentity`, and
  `pickTicketPane`/`updateTicketStrip`'s complete lack of layout awareness. The
  eight live sessions, the marker contents and its 19:15 mtime, and the
  presence/absence of `config rotation router` across the two pack confs were
  all read live.

  Why there is no `required_wiring` entry. The failure this ticket most needs
  to prevent is the BL-419 shape - the host learns the layout and the HTML
  never consults it - but the natural anchor for that (the payload field name)
  does not exist yet, and BL-874 is explicit that a pattern is matched as a
  plain substring and must never be a placeholder. Every literal that already
  exists in `residentSpyUiHtml.ts` (`ticket-strip`, `updateTicketStrip`) would
  match today and gate nothing. Scenario 3 covers the same ground and covers it
  better: it fails unless the strip is actually suppressed on a full pack that
  has a ticket-holding tile. A passing scenario is a stronger gate here than a
  grep, so the obligation is carried by the acceptance rather than by a
  vacuous declaration.

  mutation_cost medium rather than the intake's low-medium. The layout decision
  itself is a small pure function with an existing test file
  (`extension/test/residentPaneLive.test.js`, plus a property test alongside
  it). The reason for medium is the HTML half: `residentSpyUiHtml.ts` renders
  from a large template string, and gating `#ticket-strip` inside it is the
  part most likely to survive mutation without a scenario driving it. Budget
  the hardening effort there, not on `isMonoRouterLayout`.

  BL-233 obligation. All four scenarios are new and their step handlers must
  land in THIS parcel - the acceptance runner throws on any scenario it cannot
  resolve.

  IR-DRY run and dispositioned as no-change. Two medium-confidence findings
  after one wording fix (the Background was reworded to stop colliding with the
  When step, which removed a third finding). Both remaining findings are
  polarity pairs the checker does not normalize: `the top ticket strip is not
  shown` against `the top ticket strip is shown`, and `no tile is labelled
  Resident` against `the coder tile is labelled Resident`. Those are opposite
  assertions across the two layouts, which is the whole point of the feature -
  merging them would delete the comparison. Left as written.

