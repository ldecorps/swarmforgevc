human_approval: approved
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is posed
  and there are no ruling_options. The red is a fixture reading production's
  required-daemon list while writing a one-row conf on purpose; the guard
  has had a seam for exactly this since it was written.

description: |
  ## What is wrong

  `extension/test/bl1012FreshnessSelfInflictedIncidents.property.test.js`
  builds a fixture root with its OWN `freshness.conf` pinned to one row,
  `handoffd|120|...`, "so these properties are independent of any ops
  change to the live conf" (its own comment). `daemon_log_freshness_check.sh`
  now runs `daemon_log_freshness_registry_guard.sh` first (BL-784), which
  fails closed when any daemon named in the REQUIRED list lacks a conf row.
  The fixture never sets `FRESHNESS_REQUIRED`, so the guard reads the LIVE
  `daemon_log_freshness_required.conf` from the scripts directory, finds
  `babysitterd` (and others) with no row in the fixture's one-row conf, and
  exits 1 - `runChecker` expects 0. Three properties red on `main`
  (reproduced this pass: "Expected 0, Received 1" at line 89).

  ## How (direction, not mandate)

  - In `mkRoot`/`runChecker`, write a fixture `freshness_required.conf`
    naming exactly the daemons the fixture's conf carries and pass
    `FRESHNESS_REQUIRED=<that path>` in the checker's env beside the
    existing `FRESHNESS_CONF` - the seam the guard reads at its line 8. The
    test's isolation intent is preserved, not weakened.
  - AMENDED 2026-09-04 (coder finding): the guard has a SECOND arm with no
    seam - it walks its own `$SCRIPT_DIR/*_supervisor.bb` (the live scripts
    directory, since the guard runs from there) and refuses any supervisor
    script with no conf row. The registry seam alone therefore still fails,
    naming the first supervisor. Handle it in the fixture, not the guard:
    the fixture conf carries one row per supervisor script DERIVED from the
    same glob the guard walks - never a list written in the test (BL-1398's
    lesson) - each with a fresh heartbeat so the watchdog takes no action on
    it; only handoffd's row varies, so every BL-1012 assertion still reads
    handoffd's behaviour alone. A supervisor script added to the repository
    is covered without editing the test.
  - Add one property row: a fixture registry naming a daemon the fixture
    conf lacks makes the checker exit non-zero naming it (the guard still
    bites - invariant 2).
  - No change to the checker, the guard, or the live conf files.

  ## Explicitly NOT in scope

  - The bl632 fixture's hand-listed guards (BL-1398, same class, its own
    file).
  - Whether babysitterd should be in the live required list (it should; it
    is).

qa_e2e_procedure: |
  1. `npx vitest run --config vitest.properties.config.mjs bl1012` on main
     after the parcel: 3/3 pass.
  2. Temporarily point the fixture's `FRESHNESS_REQUIRED` at the LIVE
     required list: the guard refuses naming `babysitterd` (the guard is
     untouched, invariant 2). Restore.
  2b. Drop one derived supervisor row from the fixture conf (a seam in the
     test, never the live file): the guard refuses naming that supervisor -
     the second arm still bites and the rows are really derived. Add a
     throwaway `zzz_probe_supervisor.bb` to a COPY of the scripts dir the
     fixture points the guard at, if the fixture can redirect it; if the
     guard can only walk the live dir, assert instead that the fixture's
     row set equals the live glob's basenames at test time.
  3. Remove fixture roots in a `finally`, reaping only roots no live run
     owns (BL-1385/BL-1390).

notes: |
  2026-09-04 AMENDMENT (specifier, spec-gap raised by the coder): the mint
  described only the registry seam. The guard's supervisor arm (lines 51-57)
  has no seam and walks the live scripts dir; the mint could not see it
  because the guard exits on the first failure and `babysitterd` failed
  first. The coder's fix - supervisor rows derived from the guard's own glob,
  each with a fresh heartbeat - is adopted as the direction; "no change to
  the guard" stands. The feature's Background said "a one-row conf"; that is
  now a false sentence in a durable contract and is re-tensed (a setup line,
  not an assertion; the coder updates the matching handler pattern in the
  same parcel). Nothing built changes. No bounce: nothing had been reviewed.

  `required_wiring` anchor 1 is a consumer anchor in the BL-1235 sense: the
  literal is the guard's own env name, absent from the test today; it can
  only appear if the fixture uses the seam.

  IR-DRY: run on the feature file at mint (see commit).

  Mint-time INVEST: one observable outcome (the property test is green and
  still isolated), minutes of work, no unbuilt sibling.

