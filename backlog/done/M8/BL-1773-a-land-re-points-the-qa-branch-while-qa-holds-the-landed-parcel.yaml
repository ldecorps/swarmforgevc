  Scenario 03, appended after scenario 02:

    # BL-1773 the-landed-parcels-own-sidecar-does-not-block-the-re-point-03
    Scenario: the re-point proceeds when the landed ticket's parcel carries its own claim-progress sidecar
      Given the worktree's in_process holds a git_handoff whose task names the landed ticket
      And the worktree's in_process holds that parcel's claim-progress sidecar
      When the post-land re-point runs for the landed ticket
      Then it prints LAND_REPOINTED and the branch tip equals origin/main

  And one new Examples row for scenario 02 (parcel column):
    | the landed ticket's git_handoff and a claim-progress sidecar named for a different parcel |
  Scenario 02's existing row "the landed ticket's git_handoff and a second
  parcel" stays. The property test quotes the invariant verbatim, so its
  header and generator change with it: reach the landed parcel's own
  sidecar (proceeds) and a sidecar named for another file (blocks).

  Confirmed live 2026-09-26 09:15Z (QA note 003263): the first re-point
  from QA's worktree fired (924a360b95 -> 7225607287). The BL-1767
  land-approval source 924a360b95 left the QA branch, and is_qa_ancestor.sh
