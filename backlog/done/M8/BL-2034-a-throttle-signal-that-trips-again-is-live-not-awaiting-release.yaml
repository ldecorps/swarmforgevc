description: |
  ## What is wrong

  `extension/src/tools/emit-throttle-recommendation.ts`,
  `updateThrottleEpisode` (around line 196): when the tick's raw cap is
  live (`rawCap !== null`) it updates only `lowestCapReached`. When it is
  clear, it stamps `clearedAtIso` once. Nothing resets `clearedAtIso`
  when a cleared signal trips again, though the type's own comment says
  it is "null while the signal is still live". Every reader takes
  "awaiting release" as an open, unanswered episode with `clearedAtIso`
  set, so a re-tripped episode keeps reading as awaiting release.

  ## What is wanted

  - A tick with a live raw recommendation leaves `clearedAtIso` null. The
    lowest cap reached still holds (BL-1981 invariant 2), and a recorded
    answer is untouched.
  - When the signal clears again, `clearedAtIso` is stamped from that
    clear, so "has read normal for <duration>" counts from the second
    clear.

  ## How (direction, not mandate)

  - The `rawCap !== null` branch sets `clearedAtIso: null` alongside
    `lowestCapReached`.
  - The handler `specs/pipeline/steps/bl2034ThrottleRetripSteps.js` builds
    the fixture the way `bl1981ThrottleHumanReleaseSteps.js` does (its
    helpers `writeOverThreshold`, `writeUnderThreshold`,
    `runEffectiveDepthCli` and `readRecommendation`, lines 34-93), and
    walks the `<history>` column one change at a time, running the depth
    CLI after each. It records the first clear's `clearedAtIso`, so "since
    the second clear" means a later stamp. Validate `<history>` and
    `<awaiting>` against explicit known values.
  - The invariant fits `bl1981ThrottleHoldInvariants.property.test.js`:
    over any generated tick sequence, a live tick leaves `clearedAtIso`
    null.

