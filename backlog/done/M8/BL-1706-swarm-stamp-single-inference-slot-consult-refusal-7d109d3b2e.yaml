description: |
  ## What
  An operator hotfix is live on main and has never been through a gate.
  This is that gate: a REVIEW ticket - confirm or refute, and open narrow
  follow-ups for anything found.

  ## The failure it fixed (from the commit message)
  The mono-router consult spawn (hotfix 5bdf93beed, 2026-09-12, stamped by
  BL-1549) starts a stuck role's own session when the resident is refused
  a rotation with `:departing-mid-parcel`. That refusal only fires while
  the resident is mid-turn, so on a pack whose backend serves one request
  at a time the spawned session is a second requester for the slot the
  resident holds. Observed 2026-09-23 on ollama-ista-iq3s-mono-router: the
  coordinator and a QA consult session both retrying litellm timeouts,
  the coder idle.

  ## What landed (files to review)
  - `swarmforge/scripts/mono_router_lib.bb`: `consult-eligible?` takes
    `:single-inference-slot?` and refuses when true;
    `parse-single-inference-slot?` reads `config single_inference_slot 1`.
  - `swarmforge/scripts/handoffd.bb`: `single-inference-slot-pack?`
    resolves the flag through `backlog-depth-lib/conf-file-path` (the
    same resolution as `auth-respawn-max-attempts`) and
    `spawn-consult-session!` passes it.
  - `swarmforge/scripts/test/mono_router_lib_test_runner.bb`: the TDD
    assertions.

  ## Review goals
  1. Scenarios 01-03 green against the real functions.
  2. Absent flag is byte-for-byte the prior behaviour: BL-1549's feature
     (`specs/features/BL-1549-swarm-stamp-consult-session-5bdf93beed.feature`)
     passes on the parcel commit. Whichever of BL-1549 and this ticket
     lands second re-runs the other's feature in its evidence.
  3. PROBE, do not fix - the census of packs the flag should cover. At
     mint, 1 of 4 tracked `ollama-*-mono-router.conf` packs sets it
     (`ollama-qwen2.5-coder-mono-router.conf`, via ef6048b949);
     `ollama-mixed`, `ollama-qwen3-8b` and `ollama-qwen3` do not, and of
     the 3 untracked siblings only `ollama-ista-iq3s` does. Count with
     `for f in $(git ls-files 'swarmforge/packs/ollama-*.conf'); do grep
     -c '^config single_inference_slot 1' $f; done`. Record the census at
     the parcel commit in evidence; if a local pack that shares one
     inference slot still lacks the flag, note the specifier (a one-line
     conf change, never this parcel's).
  4. Record, do not review: whether a local pack should consult-spawn at
     all is superseded for driver seats by BL-1697/BL-1698, where the
     driver is the only writer to a driver seat's pane. Say so in the
     evidence; do not extend the review there.

  ## Scenario notes for the coder
  - Scenario 01 calls `mono-router-lib/consult-eligible?` directly with a
    map where every other check passes; scenario 02 calls
    `parse-single-inference-slot?` on the four conf texts.
  - Scenario 03 drives handoffd's `spawn-consult-session!` against a
    `mkdtemp` project whose effective conf declares the flag, with a fake
    tmux that records `new-session`; assert none recorded and no consult
    marker written.
  - Do NOT assert the ledger row's `human_decision` in a scenario: it
    goes red, correctly, the day the human certifies (BL-1006). It is a
    QA procedure step instead.
  - The step handler is `bl1706SwarmStampSingleInferenceSlotSteps.js`,
    landing in the SAME commit as the feature (BL-233).

