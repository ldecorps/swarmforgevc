qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `git diff main...HEAD --name-only` names only evidence, the feature,
     the step handler (+ lib/), and files under swarmforge/scripts/test/
     (invariant).
  2. `node specs/pipeline/cli.js specs/features/BL-1706-swarm-stamp-single-inference-slot-consult-refusal-7d109d3b2e.feature`:
     all scenarios ok.
  3. `bb swarmforge/scripts/test/mono_router_lib_test_runner.bb`: ok.
  4. The evidence records review goal 3's census at the parcel commit and
     goal 2's BL-1549 feature run.
  5. `backlog/hotfix-ledger.yaml` row 7d109d3b2e: `human_decision: null`.
  6. After done: the human runs `bb swarmforge/scripts/hotfix_ledger_update.bb .
     --decide 7d109d3b2e approved|waived` and commits the ledger.
