description: |
  ## What landed (review these diffs)

  - 2cdb259806: start-swarm.sh (a loopback OPENAI_API_BASE takes the
    Ollama key; the nohup launch forwards PACK_STAFFING_SKIP_GATE,
    SWARMFORGE_PACK, SWARMFORGE_OLLAMA_CONTEXT_LENGTH and the
    OPENAI_*/OLLAMA_* endpoint vars); swarmforge.sh (the BL-1801 window
    gate composes the STAGE, not the seat id; the qwen launch strips
    `--seat-tier`); full-forge.conf (the coder@iq3 seat line);
    ista-iq3s-coder.Modelfile (num_ctx 49152); local-model/loop.note (no
    up-front reads, large files in parts).
  - 7f38e5d7fe: ollama_ancillary_lib.sh `ollama_ancillary_start_server`
    defaults OLLAMA_FLASH_ATTENTION=1 and OLLAMA_KV_CACHE_TYPE=q8_0,
    caller-set values win; Modelfile num_predict 4096; loop.note edit-tool
    rule.
  - 91c208a923: the Modelfile comment corrected (num_predict does not cap
    qwen's replies).

  ## Review goals

  1. Confirm each change does what its commit says. The scenarios pin the
     behaviours that matter (01-05).
  2. Probe, and report findings by note to the specifier:
     a. No credential value lands in a generated launch script, a prompt
        file or a commit through the new env forwarding (Architecture rule
        4). Grep a fixture launch for the fixture key values.
     b. BL-1711's crash restart goes through
        `ollama_ancillary_start_server`, so a restarted server keeps the
        two defaults.
     c. `start-swarm.sh`'s loopback test matches `127.0.0.1` and
        `localhost` anywhere in the value. Say whether a remote URL that
        contains either string is a real risk.
  3. The documenter writes how to serve a local seat: the two Ollama vars,
     that a hand-started `ollama serve` must pass them, and how to read
     layers-on-GPU and tokens/s from the server log. Link it from
     `docs/index.md`.

  ## How (direction, not mandate)

  - Step handler `specs/pipeline/steps/bl1839SwarmStampIq3HotfixesSteps.js`,
    registered in `specs/pipeline/steps/index.js` in the same commit as
    the feature's first green run (BL-233). `test_local_model_seat.sh`
    already drives the launch-script writer and the gate; reuse its
    fixture shape. Scenario 03 must use a throwaway HOME: the operator's
    ~/.zshenv re-exports real keys over fixtures. Scenario 04 stubs the
    ollama binary and records its environment. Fixture roots under
    mkdtemp, `git init`, `rev-parse --git-common-dir` first (BL-1390).

  ## Scope

  Tests, the step handler and its registration, docs, evidence; the
  smallest start-swarm.sh test seam if scenario 03 needs one.

