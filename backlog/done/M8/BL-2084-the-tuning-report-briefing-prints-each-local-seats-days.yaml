source: |
  Split from BL-1854 on 2026-10-08. BL-1854's source, the human,
  2026-09-30 ~21:00Z, specifier pane, verbatim:

  > tell documenter to add a special local llm section in the daily breifing where telemetry trends are shown, as well as a suggestion as to how to improve its usage as a swarm role

  The split, the human's 2026-10-04 directive, verbatim: "We should make
  the "splitting of ticket if coder cant manage" BAU."

description: |
  ## Why

  The documenter composes the morning briefing, and the human wants a
  Local LLM section in it with the local seats' telemetry trend (BL-1854).
  The numbers must come from a tool. This slice is the trend table; the
  lines under it are BL-2085.

  ## What is wanted

  `bb swarmforge/scripts/local_seat_tuning_report_cli.bb <project-root> --briefing [--days N] [--now <iso>]`
  (default 7 days) prints markdown:
  - for every seat with a BL-1850 settings record
    (`.swarmforge/local-agent/seat-settings/<seat>.jsonl`) that made a
    request in the window, a heading naming the seat and a table with one
    row per host-local date it made requests. Each row: requests, median
    time to first token, median prefill and decode speed, median output
    tokens, thinking share of output, compressions per 10 requests and
    tool-call failure rate, computed as BL-1851 computes them (scenario
    01). A field no record carries prints `unknown` (invariant 2);
  - when no such seat made a request in the window, the single line
    `No local-model seat ran in the last <N> days.` (scenario 02).
  `--seat` keeps working as it does today when `--briefing` is absent.

  ## Start from the salvage (do not rebuild it)

  `refs/swarmforge/salvage/BL-1854` (71c040ff9d) holds a first pass. Take
  ONLY `swarmforge/scripts/local_seat_tuning_report_lib.bb` from it:
  `git checkout refs/swarmforge/salvage/BL-1854 -- swarmforge/scripts/local_seat_tuning_report_lib.bb`.
  Never take its `local_seat_tuning_report_cli.bb` (its `candidate-seats`
  is one `)` short and inverts qwen directory names wrongly), and never
  its `specs/pipeline/steps/Bl2076ShimNamesSeatSteps.js` (another
  ticket's WIP). The salvaged lib parses and holds what this slice needs:
  `epoch-ms` (public), `local-date-of`, `briefing-window`,
  `briefing-day-rows`, `summarise-events` (the shared core
  `summarise-group` now calls) and `summarise-day`. Two known bugs in it:
  - `local-date-of` (line ~60) calls `.toInstant` on the Instant that
    `Instant/parse` returns. Instant has no `.toInstant`, the catch
    swallows it, and every date comes back nil, so no row is ever
    printed. Pass the Instant straight to `LocalDate/ofInstant`.
  - `briefing-window` (line ~70) has the same `.toInstant` call in its
    `->` chain and throws.

  The second attempt (2026-10-08) is at `refs/swarmforge/salvage/BL-2084`
  (d25e2a3cb0, a stash: lib and cli tracked, the step handler under
  `^3`). Use it or not, your call. Both files parse (checked 2026-10-08),
  but its lib's `briefing-window` still throws ("No matching method
  atTime") and `briefing-day-rows` merges buckets with `merge`, so a day
  with requests and compressions loses its requests.

  ## Where to read

  Both files are small; read only these:
  - lib (230 lines after the salvage): lines 50-100 (`epoch-ms` to
    `briefing-day-rows`) and 142-175 (`summarise-events`,
    `summarise-day`).
  - cli (160 lines): `gather` (~line 60), `build-report` (~line 125),
    `-main` (~line 141). The briefing mode calls `gather` once per seat
    with `:seat` and filters its events into the window; no second parser
    (BL-1811).

  ## How (direction, not mandate)

  - Seats are the settings-record file stems; `gather` already maps a
    seat to its qwen directory through `seat-worktree-path` and
    `qwen-cwd-key`. Never derive a seat by inverting a qwen directory
    name.
  - Keep each new function shallow (three nested forms or fewer) and run
    `bb -e '(load-file "swarmforge/scripts/local_seat_tuning_report_cli.bb")'`
    after every edit: the last attempt spent 30 minutes adding and
    removing one closing paren.
  - Step handler `specs/pipeline/steps/bl2084LocalSeatBriefingSteps.js`,
    discovered from its own file (BL-1371), fixtures under mkdtemp, paths
    passed as arguments so fixtures never read the operator's `~/.qwen`.
    It defines the Background and the `When` step; BL-2085 reuses them.
  - The bb test: `swarmforge/scripts/test/local_seat_tuning_report_lib_test_runner.bb`.
  - Documenter: `docs/how-to/BL-1851-local-seat-tuning-report.md` gains
    the `--briefing` mode.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2084-the-tuning-report-briefing-prints-each-local-seats-days.feature`:
     2 of 2 ok. No handler exists at mint.
  2. `bb swarmforge/scripts/test/local_seat_tuning_report_lib_test_runner.bb`
     passes, and BL-1851's feature
     (`specs/features/BL-1851-a-local-seats-tuning-report-compares-its-work-across-the-settings-it-ran-with.feature`)
     still passes.
  3. Live, read-only: `bb swarmforge/scripts/local_seat_tuning_report_cli.bb <root> --briefing`
     prints a table for each seat that made requests in the last 7 days
     (on 2026-10-08 the bare `coder` seat, iq3, had). Paste the output
     into the evidence.

