notes: |
  Minted 2026-10-09 by the specifier from coordinator note 017590.
  The reported defect is not there. Read at mint: in
  ready_for_next_task.bb's claim path, `claimable` is `decided` with every
  :defer removed, then filtered by `difficulty-allows-claim?`, then by the
  given-up set; the claim loop walks that whole list. Measured at mint:
  seat-difficulty-lib/difficulty-claim-decision with full-forge.conf's
  tiers (coder easy, coder@2 hard) answers :skip-ineligible for coder at
  medium and high and :claim at low. All four queued tickets are medium.
  The coder pane shows NO_TASK on the poll after the coordinator's move
  too. The coordinator's hand move did no harm: coder@2, the seat that
  worked BL-2077, is rebuilding it.
  Not minted, the coordinator's detection proposal ("seat reads NO_TASK
  while its stage inbox holds items", a babysitter finding): with tier
  routing an easy seat idles beside a queue of medium work by design, so
  that finding would fire whenever only medium work is queued. A
  stage-level stall (no seat of the stage CAN claim a queued parcel) is
  a different finding and is not proposed here.
  IR-DRY at mint: the two "holds the note" steps and the two
  "mutation_cost is" steps are one pattern each with different values,
  kept; "is at the head of the stage queue" against "stays in the stage
  queue" are two states, kept.
  INVEST: Independent (no dependency), Negotiable (where the line function
  lives, its wording), Valuable (a NO_TASK beside a full queue explains
  itself, so nobody moves parcels by hand or reports a false defect), Estimable (one
  function, one print, one handler on an existing fixture shape), Small
  (two scenarios, three examples), Testable (the real dispatcher in a
  fixture stage).

