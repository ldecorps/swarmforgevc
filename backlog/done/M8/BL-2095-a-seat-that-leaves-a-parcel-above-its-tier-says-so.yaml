human_approval: approved
approval_context: >
  A new feature file needs the human's look. No choice is posed. What
  needs sign-off: a seat prints one line for each parcel it leaves above
  its tier, the way it already prints one for a parcel it defers. FIRM:
  nothing about what a seat claims or leaves changes. Not built: the
  coordinator's proposed babysitter finding "seat idle while its queue is
  not empty" - with tier routing that is the normal state of an easy seat
  whenever only medium work is queued, so it would fire on every such
  hour (notes).

invariants:
  - "What a seat claims, defers or leaves is unchanged: the line is printed for exactly the parcels the tier filter already leaves, and for no other."
  - "The line names no seat of the stage (BL-983 invariant 2, as BL-1004's deferral line)."

description: |
  ## What is wrong

  `ready_for_next_task.bb`'s claim path builds the candidate list, drops
  the parcels it defers to a sibling (BL-1004), printing a DEFERRED line
  for each, drops the parcels above this seat's tier (BL-1001,
  `difficulty-allows-claim?`), printing nothing, then claims the first
  parcel left or reports NO_TASK. Every drop is a filter over the whole
  queue, so a dropped head never holds up the parcel behind it.

  On 2026-10-09 the full-forge pack ran the coder stage as `coder`
  (local iq3, `--seat-tier easy`) and `coder@2` (Claude, hard). Work notes
  for BL-2091, BL-2094, BL-2024 and BL-1784 (all medium) sat in the stage
  queue while coder@2 rebuilt BL-2077; a Work BL-2077 note sat at the
  head. coder's polls printed the DEFERRED line for BL-2077 and then a
  bare NO_TASK. The coordinator read that as "the dispatcher stops
  scanning on a deferred head", moved the BL-2077 note to coder@2 by hand
  and reported a defect (backlog/evidence/coordinator-queue-wedge-20261009.md,
  4e4996730a). coder's next poll was NO_TASK again, because the four
  medium notes were never coder's to take.

  ## What is wanted

  - For each parcel the tier filter leaves, the seat prints one line
    naming the parcel's file, its ticket and its cost as above this
    seat's tier, left in the stage queue for a seat that accepts it
    (scenario 01). The seat still ends NO_TASK when nothing else is
    claimable, and the parcel stays where it is.
  - The line names no seat of the stage, the same rule the DEFERRED line
    keeps (invariant 2).
  - Scenario 02 pins what the coordinator feared had broken: a parcel the
    seat leaves at the head of the queue, by tier or by deferral, never
    keeps it from a claimable parcel behind. Expected green on today's
    code; it is the regression guard for that property.

  ## How (direction, not mandate)

  - A line function beside `seat-affinity-lib/deferral-line` (or in
    `seat_difficulty_lib.bb`), printed where `deferred` is printed, for
    the decided parcels `difficulty-allows-claim?` removes.
  - The step handler can follow `bl1843NoteSeatRulesSteps.js`: a fixture
    roles.tsv with the two seats and their tiers, a fixture ticket per id,
    notes in the stage queue, and the real dispatcher run as the asking
    seat. BL-1843's fixture names the easy seat `coder@iq3`; this one
    makes the easy seat the bare `coder` row, whose mailbox IS the stage
    queue, as on the live pack.
  - A fixture never touches the live repository or a live mailbox
    (engineering Guardrails, BL-1390; BL-1904's foreign-checkout guard).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2095-a-seat-that-leaves-a-parcel-above-its-tier-says-so.feature`:
     3 of 3 ok (01, 02 x2).
  2. `node specs/pipeline/cli.js specs/features/BL-1843-a-note-about-a-ticket-is-claimed-under-the-same-seat-rules-as-its-parcels.feature`:
     7 of 7 ok (measured on main at mint, 17 s; the live mailboxes were
     unchanged after the run).
  3. After the land, the first time the live easy seat polls while only
     parcels above its tier are queued for its stage, its pane shows the
     new line before NO_TASK; record it in the QA evidence (or record that
     no such poll happened during the pass, step 1 being the gate).

