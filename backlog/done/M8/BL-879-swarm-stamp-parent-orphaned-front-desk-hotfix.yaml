notes: |
  Related, do not conflate: BL-849 (done — Darwin process-table stamp-off;
  this is a follow-on on the same janitor surface: enumeration works, the age
  gate was the remaining gap), BL-789 (done — freshness/bridge orphans
  fighting the production front desk; the 2026-08-10 give-up emails are the
  same failure class with a narrower root cause), BL-486 (done — orphan agent
  reaper; out of scope here).

  Locked human decisions, carried verbatim from the intake:
  1. Treat this as **swarm-review stamp-off of a landed hotfix**, not a
     greenfield implement ticket (same posture as BL-811 / BL-849).
  2. Severity **high** — production front-desk give-up emails from fixture
     orphans the janitor already sees but will not kill in time.
  3. Decapitation guards stay: never match host-repo paths; disposable-root
     extract remains mandatory; living-parent fixture bridges stay protected
     by the ordinary `stale?` path.

  ## Acceptance is parked as a draft, deliberately

  `acceptance:` points at a `.feature.draft`. The parent-state Given steps
  ("its parent process is gone/alive/not determinable") have no step handlers
  yet, and shipping a live `.feature` without them hard-fails
  `specs/pipeline/runtime.js` on the first unmatched step (BL-233). The coder
  promotes the draft to a live `.feature` in the same parcel as its handlers
  — same as BL-849 did. Where a step already has a BL-849 handler (sweep
  setup, candidate/reap assertions), reuse it rather than minting a synonym.

  ## Degraded gate, recorded up front

  The whole diff is Babashka: no mutation/CRAP/DRY is wired for that layer
  (engineering.prompt, Startup Tools) — the gate is the unit runners under
  `swarmforge/scripts/test/` plus the promoted acceptance scenarios. A
  hardening pass must record that fallback, never imply mutation ran.

  ## E2E QA procedure (specifier, 2026-08-11)

  1. **The fast path really fires.** On this Darwin host, with the production
     front desk live, plant a synthetic disposable-root parent-orphaned
     bridge fixture (PPID 1, minutes old) and run a one-shot sweep: it is
     reaped in that same sweep — no age wait — and the audit line carries
     `reason=parent-orphaned-front-desk`.
  2. **Decapitation guard.** With the host bot, bridge, `operator_runtime`,
     host babysitterd and host tmux socket all live, confirm every one
     survives that same sweep and port 8765 stays with the production
     bridge. Run this before trusting any reap count.
  3. **A living parent protects.** Start a fixture supervisor with a child
     bridge, sweep, confirm the child survives while its parent lives.
  4. **Probe failure is not orphanhood.** Force the parent probe to error
     and confirm a young front-desk fixture is NOT reaped (age gate governs).
  5. Both unit runners green; record the Babashka degraded-gate fallback
     explicitly in the QA evidence.

