invariants:
  - "No ancillary reap ever skips the disposable-root requirement: a process without an extractable disposable root is never reaped, parent-orphaned or not, so host-repo front-desk processes can never match."
  - "The fast path fires only on a provably gone supervisor: a living parent, or a parent probe that errors or is unwired, falls back to the ordinary age gate — probe failure never reads as orphaned."
  - "Only the front-desk bridge/bot class skips the age gate: babysitter, tmux, and every other ancillary class still require staleness regardless of parent state."

description: |
  ## What

  An operator hotfix is live on main and has never been through a gate. This
  ticket is that gate. It is a REVIEW ticket, not a rewrite ticket — confirm
  or refute the landed diff, and open narrow follow-ups for anything found.

  ## The failure it fixed

  Front-desk supervisor give-up emails fired at ~20:18 and ~21:05 CEST on
  2026-08-10: the production bridge crash-looped on port 8765, hit the
  5-restart cap, emailed, and re-armed. The process table held many
  disposable-root `tmp.*/start-bridge-headless.js` + matching
  `telegram-front-desk-bot.js` leftovers with PPID 1. The janitor sweep WAS
  enumerating them (non-zero candidates — BL-849's enumeration fix works) but
  logged `reaped 0` every cycle: `reapable-tmp-ancillary?` required `stale?`,
  and the ~2h ancillary age gate is far too slow for a fixed host bridge port.
  Fixture supervisors die and leave children reparented to launchd within
  minutes.

  ## What landed (files to review, all in commit 36ea0109e9)

  - `swarmforge/scripts/process_table_lib.bb` — new `parent-orphaned?`
    (PPID 1, dead parent, or missing ProcessHandle → true; any exception →
    false).
  - `swarmforge/scripts/orphan_janitor_lib.bb` — new
    `front-desk-bridge-or-bot-cmdline?` (factored out of
    `tmp-ancillary-cmdline?`); `reapable-tmp-ancillary?` takes
    `parent-orphaned?` + `front-desk-bridge-or-bot?` and skips the age gate
    only when both hold, AFTER the live-window and disposable-root checks.
  - `swarmforge/scripts/orphan_janitor_sweep_lib.bb` — wires the probe as a
    `:parent-orphaned?!` adapter (defaulting to constantly-false when
    unwired) and audits `reason=parent-orphaned-front-desk` when the fast
    path is the deciding factor.
  - Tests: `orphan_janitor_lib_test_runner.bb`,
    `orphan_sweep_enumeration_unavailable_test_runner.bb`.

  ## Review goals

  1. Confirm the decapitation guards hold across the new fast path
     (invariant 1). This is the highest-risk surface in the diff:
     `front-desk-bridge-or-bot-cmdline?` ALONE also matches the host front
     desk — its own docstring says callers MUST still require a disposable
     root. Verify every caller does, and that the fast-path check sits
     strictly after the disposable-root and live-window checks.
  2. Confirm `parent-orphaned?` semantics (invariant 2): exception → false
     fails closed for the fast path; adapter unwired → constantly false.
     Also weigh the missing-ProcessHandle → true branch: a pid that exits
     between enumeration and probe reads as orphaned — confirm this cannot
     widen the pid-reuse race window beyond what the existing stale path
     already accepts.
  3. Confirm scope (invariant 3): babysitter/tmux ancillaries never take the
     fast path — PPID 1 is normal for those, and a living-parent fixture
     bridge (a still-running acceptance test) stays protected by `stale?`.
  4. Confirm the audit reason fires exactly when the fast path decided the
     reap (front-desk AND parent-orphaned AND not stale), so incident
     forensics can tell a fast reap from an age-gate reap.
  5. Open narrow follow-up tickets for anything found; do not widen here.

  ## Live verification the human already performed

  Recorded as context, NOT as a substitute for the swarm's own pass: both
  unit runners green after the change; a one-shot sweep reaped the tmp
  fixture bridges/bots while the host bridge/bot PIDs survived and port 8765
  stayed with the production bridge; `operator_runtime` was restarted onto
  the new code that evening (then lost when an auto-pull autostashed the
  dirty tree — commit 36ea0109e9 restores it).

