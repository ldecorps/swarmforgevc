id: BL-1686
title: "test_bl1378_expedite_close_guard.sh's mk_fixture calls prove_root one line AFTER git -C \"$root\" init -q -b main (BL-1516's own patch cd638f1c6f; unlanded_commit and both bl1374 fixtures get the order right), and the file's startup sweep is the blind BL-971 idiom rm -rf \"${TMPDIR:-/tmp}/${PREFIX}\".* that a second concurrent run of the same file uses to delete the first run's live TMPROOT - under set -uo pipefail mktemp then fails silently, root is '' and git -C '' init runs in the process CWD, the live worktree (architect, 2026-09-21, twice in a row; harmless only because git ignores a re-init of an existing repository); the proof runs before the first mutating command, the five shell tests carrying the blind sweep reap only dead owners' roots, and a regression case pins the order"
