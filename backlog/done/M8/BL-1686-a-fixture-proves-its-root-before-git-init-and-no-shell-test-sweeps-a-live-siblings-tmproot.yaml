human_approval: approved
approval_context: >
  A new feature file is authored here, so it would ordinarily need a tap;
  it is minted approved under the 2026-09-17 operator hotfix (severity
  defect, no choice posed, no ruling_options). FIRM: in every fixture
  helper of the two prove_root files the proof precedes the first
  mutating git command. FIRM: a shell test's startup sweep never removes
  a root whose recorded owner process is alive (zombie-aware liveness as
  BL-1647 ruled, never bare kill -0); the sweep's SHAPE - a pid in the
  root name, or a helper in lib/tmp_cleanup.sh - is the coder's
  direction. FIRM: the regression case fails on today's file and passes
  on the fixed one; BL-1516's scenarios are untouched.

invariants:
  - "No shell test under swarmforge/scripts/test runs a mutating git command against a root it has not proven under its own TMPROOT, and no test's startup sweep removes a temp root whose owner process is alive."

description: |
  ## What
  1. `swarmforge/scripts/test/test_bl1378_expedite_close_guard.sh`,
     `mk_fixture` (lines 68-75): `git -C "$root" init -q -b main` on line
     74, `prove_root "$root"` on line 75. BL-1516 (landed today,
     e78fa06d41 / 12a7c94605) added the proof one line too late; the same
     file's `unlanded_commit` (line 92) and both fixtures of
     `test_bl1374_sync_merge_passengers.sh` (lines 69-70, 91-92) prove
     first.
  2. Line 22 of the same file - and the same line in four siblings - is
     the blind BL-971 startup sweep
     `rm -rf "${TMPDIR:-/tmp}/${PREFIX}".* 2>/dev/null || true`. A second
     concurrent invocation of the file (another seat verifying the same
     parcel, the everyday multi-seat case) deletes the first run's live
     `TMPROOT`. Under `set -uo pipefail` (no `-e`) the next
     `mktemp -d "$TMPROOT/fix.XXXXXX"` fails silently, `root` is the empty
     string, and `git -C "" init -q -b main` runs in the process CWD - the
     seat's live worktree (`git -C ""` is the current directory, BL-1390).
     The architect reproduced it twice in a row on 2026-09-21:
     `mktemp: failed to create directory ... No such file or directory`,
     `warning: re-init: ignored --initial-branch=main`, then prove_root's
     `refusing to mutate ''` - AFTER the init. Only git's tolerance of a
     re-init on an existing repository kept the checkout intact.

  Census (BL-1445): five shell tests carry the blind sweep
  (`grep -ln 'rm -rf "${TMPDIR:-/tmp}/${PREFIX}"' swarmforge/scripts/test/*.sh`):
  bl1363_close_ticket_property_runner.sh (a `*` glob),
  test_bl1376_expedite_branch_handover.sh, test_bl1378_expedite_close_guard.sh,
  test_suite_baseline_cli.sh, test_bl1374_sync_merge_passengers.sh - all
  `set -uo pipefail`, none registering with `lib/tmp_cleanup.sh`'s
  `register_tmp_dir` (108 other shell tests do). Adjudication:
  backlog/evidence/defect-bl1378-mk_fixture-prove_root-ordering-adjudication-specifier-20260921.md;
  architect evidence (architect branch 4c9a3451e7):
  backlog/evidence/defect-bl1378-mk_fixture-prove_root-ordering-architect-20260921.md.

  ## Why
  engineering.prompt Guardrails: a test fixture never mutates the live
  repository - roots are proven by `rev-parse --git-common-dir` BEFORE
  any mutating git command. A proof after the command is decoration, and
  a sweep that reaps a sibling's live root is what makes the proof
  necessary in the first place (BL-1677 fixed this shape in the property
  lane; the shell lane was never migrated). BL-1516's own scenario drove
  `prove_root` in isolation and its wiring anchor was a substring, so
  nothing gated the ORDER - this ticket's regression case does.

  ## How (direction, not mandate)
  - Move `prove_root "$root"` above the `git init` in `mk_fixture`
    (bl1378); audit the four sibling files for any other
    mutate-then-prove sequence.
  - Replace each blind sweep with a pid-scoped one: name the root
    `${PREFIX}.$$.XXXXXX` and at startup remove only roots whose pid
    segment names a dead process, using the zombie-aware liveness BL-1647
    ruled (a `/proc/<pid>` state check, never bare `kill -0`). A small
    `sweep_stale_prefix_roots <prefix>` in `lib/tmp_cleanup.sh` used by
    all five is the natural shape.
  - Regression section in bl1378 (and its handler): create TMPROOT, remove
    it, call `mk_fixture` from an empty scratch CWD, assert the refusal
    text and that the scratch CWD holds no `.git`.

  ## Scope
  - The five shell tests above; `swarmforge/scripts/test/lib/tmp_cleanup.sh`
    if a helper is added; `swarmforge/scripts/test/suite-manifest.tsv` if
    a new section changes a duration row.
  - `specs/features/BL-1686-a-fixture-proves-its-root-before-git-init-and-no-shell-test-sweeps-a-live-siblings-tmproot.feature`
    and `specs/pipeline/steps/bl1686FixtureProofBeforeInitSteps.js` (same
    parcel, BL-233, registered in `specs/pipeline/steps/index.js`).
  - The register row for the bl1378 file leaves in this parcel's land
    (BL-1631); the parcel never edits the register. Documenter: the
    BL-1516 how-to gains "proof before the first mutating command" and
    the shell sweep idiom; no diagram trigger.

qa_e2e_procedure: |
  On the parcel commit, from the repo root, ONE run each.
  1. `bash swarmforge/scripts/test/test_bl1378_expedite_close_guard.sh`
     and `bash swarmforge/scripts/test/test_bl1374_sync_merge_passengers.sh`:
     green, including the new regression section.
  2. `node specs/pipeline/cli.js specs/features/BL-1686-a-fixture-proves-its-root-before-git-init-and-no-shell-test-sweeps-a-live-siblings-tmproot.feature`:
     all ok.
  3. `grep -ln 'rm -rf "${TMPDIR:-/tmp}/${PREFIX}"' swarmforge/scripts/test/*.sh`
     prints nothing (five files at mint).
  4. Two runs of the bl1378 file started within a second of each other,
     from two shells, both green - the one concurrency case this ticket
     exists for; this is the only step that runs a test more than once.
  5. Register: the land retires the bl1378 row; the report after landing
     shows no unowned row and no BL-1686 row.

