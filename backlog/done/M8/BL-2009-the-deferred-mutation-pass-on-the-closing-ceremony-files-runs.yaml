description: |
  ## What is wanted

  The hardener runs the mutation gate BL-1968's pass deferred, on the three
  files above, once the cooldown allows (not before 2026-10-06), and
  discharges the ledger row with
  `bb swarmforge/scripts/hardening_debt_ledger_update.bb <project-root> --discharge BL-1968 mutation --evidence <path>`.
  The same commit removes this ticket's `hardening` row from
  `backlog/standing-reds.tsv` (a register row leaves in the commit that
  discharges it).

  ## How (direction, not mandate)

  - Scope Stryker to the compiled files (`--mutate` over
    `out/metrics/closingCeremonyRun.js`, `out/metrics/closingCeremonyStore.js`,
    `out/quality/closingCeremony.js`), per the hardener card.
  - Survivors the pass cannot kill get one of the three reasons in the
    invariant; first-run debt names an owner ticket (mint it via a note to
    the specifier, the 2026-09-10 rule).

