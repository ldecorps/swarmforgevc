description: |
  ## What is wrong
  QA, reviewing BL-1694 on 2026-09-24 (evidence
  `backlog/evidence/BL-1694-unowned-red-pricing-table-claude-opus-5-5-QA-20260924.md`,
  commit a404193f42), reproduced twice:

      FAIL  test/pricingTable.test.js > BL-627: the current repo roster passes the pricing coverage check
      AssertionError: PRICING_TABLE missing entries for swarm-referenced model(s): claude-opus-5-5

  The specifier ran BL-1436's landed feature on main the same hour: `not
  ok 1 - every model the swarm roster references has a pricing entry`
  (5 pass, 1 fail). Cause: `swarmforge/packs/full-forge.conf` specifier
  window moved to `--model claude-opus-5-5` in db5d1313e4 (human, "Change
  the specifier to opus 5.5."), and `extension/src/metrics/pricingTable.ts`
  has no row for it. The seat's settings file
  (`.swarmforge/launch/specifier.claude-settings.json`) names the same
  model. Until fixed, `estimateCostUsd` returns null for every turn of
  that seat.

  This is BL-1436's incident a second time: on 2026-09-04 the same seat
  moved to claude-fable-5-1 and the same test went red for a day.

  ## What is wanted
  1. A `claude-opus-5-5` row in `PRICING_TABLE`: `inputPerMTok: 4`,
     `outputPerMTok: 20`, `cacheReadPerMTok: 0.2`, no
     `cacheCreatePerMTok`, with a comment citing the source the way the
     `claude-fable-5-1` row does. Source at mint: the project's Claude API
     reference (claude-api skill, models table cached 2026-06-24): "Claude
     Opus 5.5 ... $4.00 ... $20.00", and "at a lower price ($4 / $20 per
     MTok, cache reads $0.20)". That reference lists the model as
     "launching"; re-read it at implementation, and if the published rates
     differ, use the published ones and say so in evidence.
  2. `extension/src/swarm/modelDisplayName.ts` maps `claude-opus-5-5` to
     `Opus 5.5` (BL-1436 did the same for Fable 5.1).
  3. The two register rows this mint adds leave in the same land
     (REGISTER_ROW_RETIRED, BL-1631). The parcel never edits
     `backlog/standing-reds.tsv` (coder.prompt, BL-1663): scenario 04
     asserts both rows present and owned by BL-1712 at the parcel
     commit; their absence is qa_e2e step 5, after the land.
  4. `PRICING_TABLE_VERSION` unchanged: adding a row changes no existing
     rate (BL-1436 added a row without a bump).

  ## How (direction, not mandate)
  - Copy BL-1436's handler shape (`specs/pipeline/steps/`, the BL-1436
    steps file) for scenarios 01-03; scenario 04 reads the map and
    `backlog/standing-reds.tsv` from the parcel's tree.
  - Documenter: wherever BL-1436 documented the table's rows (the cost
    reference page), add the row; no diagram trigger.

  ## Scope
  - `extension/src/metrics/pricingTable.ts`,
    `extension/src/swarm/modelDisplayName.ts`, `backlog/standing-reds.tsv`
    (retire the two rows).
  - New: `specs/pipeline/steps/bl1712PricingTableOpus55Steps.js` (BL-233).
  - Docs as above; evidence.
  - Out of scope: any other row's rates; a guard that stops a pack model
    change from landing without a pricing row (see notes).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule), from `extension/`.
  1. `npx vitest run test/pricingTable.test.js`: all pass, including
     "BL-627: the current repo roster passes the pricing coverage check".
  2. `node specs/pipeline/cli.js specs/features/BL-1712-the-pricing-table-prices-claude-opus-5-5.feature`:
     all ok; `node specs/pipeline/cli.js specs/features/BL-1436-the-pricing-table-prices-every-model-the-swarm-runs.feature`:
     5 of 6, with scenario 01 (roster covered) ok and scenario 04 the only
     failure. Its last step asserts no register row names
     pricingTable.test.js, and that row stays, owned by BL-1712, until
     this land retires it (BL-1663) - expected, not a defect of this
     parcel. 6 of 6 is checked after the land, in step 5.
  3. The evidence quotes the rates source it used and the date read.
  4. `git diff main...HEAD --name-only` names only the Scope files, the
     feature, the handler, docs and evidence.
  5. After landing: `bb swarmforge/scripts/standing_red_register_cli.bb .`
     reports `"unowned":[]` and no row names either file, and the BL-1436
     feature on origin/main reads all ok (6 of 6).
  6. Resume BL-1694's land (held on this red, BL-1566).

