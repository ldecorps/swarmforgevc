human_approval: approved
approval_context: >
  This changes what QA's last gate measures, so it needs your yes. FIRM:
  only a parcel whose OWN diff (merge-base with main to the parcel
  commit) touches nothing outside backlog/ skips, and only the unit and
  property lanes; the straggler, sibling, register, wiring and acceptance
  checks still run, and the skip fails closed on any doubt. QA still reads
  the coder's committed review and still decides. What it buys: about 3
  hours of QA processing per shift at the 2026-10-06 rate (23 stamp-offs x
  ~8 minutes), plus the queue time behind it. What it gives up: a
  stamp-off parcel no longer re-measures main's unit and property state,
  which every code-carrying parcel still does.

description: |
  ## Why

  The 2026-10-06 closing-ceremony packet's top dwell hotspot is QA: 51
  tickets passed QA, with about 12 hours of processing and 10 hours of
  queue wait. 23 of the 51 were review-only stamp-offs (the human's
  2026-10-01 rule, "hotfix the defect and mint a stampoff"), each costing
  the same ~14 minutes of processing as built work. Twelve QA gather
  reports from 2026-10-05 (`.worktrees/QA/tmp/*-gather.json`) put the unit
  lane at 0.6-0.8 min and the property lane at 6.6-8.2 min of every pass.
  A stamp-off parcel's own diff is the coder's review evidence under
  backlog/evidence/: those two lanes then measure main, not the parcel.

  ## What is wanted

  - `extension/src/quality/qaGather.ts`: the `unit` and `properties`
    checks gain a third row status, `skipped`, with a reason naming the
    backlog-only diff. A skipped row starts no command.
  - The decision: compute the parcel's own changed paths as
    `git diff --name-only $(git merge-base main <commit>) <commit>`
    through the existing `runFn` seam. Skip only when that list is
    non-empty and every path starts with `backlog/`. A failed merge-base,
    a failed diff, or any other path runs both lanes as today.
  - Every other check (straggler, sibling, register, wiring, acceptance)
    runs exactly as today.
  - The step handler `specs/pipeline/steps/bl2024QaGatherBacklogOnlySkipSteps.js`
    builds each fixture with `git init` under mkdtemp (BL-1390) and calls
    the gather with a `runFn` that passes `git` through to the real git and
    records every other command, answering it with exit 0.
  - Documenter: the how-to or reference that lists what the gather runs
    (`grep -rln qa-gather docs`) states the skip, its reason text and its
    fail-closed rule.

  ## Not in scope

  - Changing which parcels need QA, or a stamp-off's required_stages.
  - Skipping the acceptance run, or any check other than the two lanes.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. Read the gather report for THIS parcel: it touches extension/src, so
     both lanes must read `ran` (scenario 02 on itself).
  2. `node specs/pipeline/cli.js specs/features/BL-2024-qa-gather-skips-the-unit-and-property-lanes-for-a-backlog-only-parcel.feature`:
     7 ok (01, 02 x4, 03, 04), 0 fail. Scenario 04 (a rename out of
     extension/src into backlog/ runs both lanes) added on the QA bounce
     (D1, 2026-10-09).
  3. After the land, on the next stamp-off QA gathers, read its report:
     both lane rows `skipped` naming the backlog-only diff.

