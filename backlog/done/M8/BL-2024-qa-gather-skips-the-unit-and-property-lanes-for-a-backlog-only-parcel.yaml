  pass from 12 QA gather JSONs dated 2026-10-05.
  QA.prompt carries an "Until BL-2024 lands" line in its gather section
  (landed with this mint); QA's retire trigger fires at land.
  INVEST: Independent. Negotiable (the predicate and reason text are
  direction). Valuable (about 3 QA hours a shift). Estimable (one status,
  one predicate). Small (three scenarios). Testable (mkdtemp git fixtures,
  injected runFn).
  2026-10-07 (specifier, closing-ceremony lean pass for shift 2026-10-07):
