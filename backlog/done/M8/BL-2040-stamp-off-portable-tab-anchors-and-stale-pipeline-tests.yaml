description: |
  ## Status: hotfixes 6038e612b4 and c9132288de landed the fixes

  This parcel is their stamp-off: review them, do not re-apply them.

  ## What was wrong, and what each hotfix changed

  6038e612b4: `test_bl1861_local_llm_remove.sh` (BL-1861) and
  `test_retire_seat_stays_dropped.sh` (BL-1720) anchored tabs with
  `grep -qP`, which BL-989's tree sweep refuses (stock macOS grep has no
  -P). The BL-1861 file's three "still lists a local-model seat" negative
  checks used `grep -qE '\t...'`. GNU grep 3.11 reads `\t` in an ERE as a
  literal `t`, so they matched nothing and passed on any roster; the agent
  shell's grep shim hid it. All eight now build the pattern with `printf`.
  Both tests pass with the checks live.

  c9132288de: `swarmIntakeEnvRouteSteps.js` required `$NUM`/`$URL` but the
  workflow has written `${NUM}`/`${URL}` since 9748747792 (2026-07-22),
  so BL-227's scenario 02 was red on main; it now accepts both.
  `burndownEtaSteps.test.js` resolved steps BL-1277 had scoped to BL-228's
  feature without a feature name; it now passes the name.
  `strykerPwaSandboxSteps.test.js` required a handler BL-267 deleted on
  2026-07-11 (BL-221's feature runs green on its replacement); retired.

  ## What the coder builds

  BL-989's tree sweep (`specs/pipeline/test/bl989PortableGrepTabAnchor.property.test.js`,
  test 3) refuses only `grep -P`. Add an assertion that refuses a
  single-quoted `grep -E` (or `-qE`, `-Ee`...) pattern containing `\t`
  in `swarmforge/scripts/**/*.sh` outside `*mutation_sweep.sh`, the
  fail-open shape 6038e612b4 found. Before the hotfix it would have named
  test_bl1861_local_llm_remove.sh lines 194, 196 and 336. On 6038e612b4 it
  finds zero; prove it is not vacuous with a fixture string it must flag.

  ## What the coder does (all of it)

  1. Read `git show 6038e612b4` and `git show c9132288de` against the section
     above.
  2. Add the assertion; run qa_e2e_procedure steps 1-2 once, output under
     tmp/.
  3. Write backlog/evidence/BL-2040-coder-<date>.md: the review result and
     the run results, and commit it with the test change.

