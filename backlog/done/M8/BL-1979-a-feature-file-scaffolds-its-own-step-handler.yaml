notes: |
  Minted 2026-10-04 by the specifier; approved by the human in the
  specifier pane (source).
  The contract the scaffold must produce (read at mint): a top-level
  specs/pipeline/steps/<Name>Steps.js (BL-1371 discovers files by that
  name; docs/how-to/BL-1371-step-handlers-register-by-discovery.md)
  exporting { registerSteps }; registerSteps(registry) calls
  registry.defineScoped(regex, fn, FEATURE) once per step text, FEATURE
  being the feature's own name (specs/pipeline/stepRegistry.js:
  define/defineScoped/resolve). See
  specs/pipeline/steps/bl1902ReverseHopsAndMergeUpRetireSteps.js lines
  47-60 for the shape.
  Where to read: specs/pipeline/runnerAdapter.js's parseFeatureFile (the
  parser every acceptance run uses - reuse it, never parse Gherkin by
  hand) and specs/pipeline/scripts/resolve_contract_steps.js (resolves a
  feature's steps against a registry without running them - scenario 02
  can use it). Put the tool beside it, e.g.
  specs/pipeline/scripts/scaffold_step_handler.js
  <feature-file> <Name>Steps.
  Escape regex metacharacters in step text; a <placeholder> becomes a
  capture group; a stub throws an Error whose message starts "not
  implemented:" and names the step.
  The specifier's own half (BL-798): once this lands, the coder role
  prompt and swarmforge/roles/local-model/loop.note gain one line - "a
  new step handler starts from the scaffold" - landed by the specifier on
  main in the same pass as QA's land note, never before (a card pointing
  at a tool that does not exist yet would send the seat looking for it).
  BL-1970 is in flight and stalled on exactly this; the specifier asked
  the coordinator to decide whether to pull it behind this ticket.

description: |
  ## What is wanted

  One command, given a feature file and a handler name ending in Steps,
  writes specs/pipeline/steps/<Name>Steps.js: a header naming the feature,
  the FEATURE constant, and registerSteps defining one stub per distinct
  step text in the feature (Background included), each scoped to the
  feature's name, each step with a <placeholder> matching every Examples
  value and handing the value to its stub. Each stub fails with "not
  implemented: <step text>". The command refuses, changing nothing, when
  the file already exists or the name does not end in Steps.

  ## What each stage checks

  - Coder: the five scenarios and a unit test; this ticket's own handler
    starts from the scaffold's output.
  - Documenter: docs/how-to/BL-1371-step-handlers-register-by-discovery.md
    names the scaffold as the way a new handler starts.

