notes: |
  BL-922 bookkeeping only: acceptance: made a single-line pointer (was a
  block scalar hiding the pointer from the pre-QA gates until the
  documenter->QA hop). Nothing anyone builds changes; the text below and in
  qa_e2e_procedure: is the same text, relocated verbatim.

  (specifier writes the feature file). Minimum the design must make testable:

  1. `renderBriefingDiagrams` returns THREE entries - architecture,
     swarm-flow and the new handoff diagram - each with non-empty base64.
  2. The briefing email's diagram section references the new diagram by its
     own cid, matching its attachment 1:1 (the BL-286 contract), and the
     attachment list length matches the diagram count.
  3. A deliberately unparseable handoff-flow.mmd still degrades exactly as
     BL-260 pins - plaintext email with the no-diagram note, non-zero exit
     from the render tool, no crash - and does NOT take the other two
     diagrams down silently in a way that reads as success.
  4. The diagram source parses: rendering it produces a PNG (this is the
     regression guard against a malformed .mmd landing).

  Documenter: fold a short "how a handoff travels" section into the handoff
  docs referencing the new diagram, so the diagram is not the only copy of
  this knowledge.

  ## The acceptance contract was written 2026-08-21, and one minimum was reshaped

  `acceptance:` pointed at a feature file that did not exist - the ticket
  would have bounced within a minute of promotion (BL-314) and hard-failed
  the acceptance runner. Written and linted 2026-08-21; lint clean, IR-DRY
  0 findings on 12 unique steps.

  Minimum 1 above says "returns THREE entries". The feature file
  deliberately does NOT assert three. It asserts one rendered diagram per
  name in the allowlist and that the handoff-mechanism diagram is among
  them - the count is DERIVED. A literal 3 would be correct today and red
  the day BL-580 lands a fourth diagram, which is the "acceptance step that
  pins build state goes red when the system improves" failure
  (BL-643/BL-1005). Build to the derived form; do not reintroduce the
  literal in a step handler.

  Minimums 1, 2 and 4 collapse into scenario 01 for the same reason: it
  renders the COMMITTED sources, not fixtures, so proving the new .mmd
  parses is the same assertion as proving the allowlist entry works
  (BL-454's lesson, which qa_e2e_procedure already names). Minimum 3 is
  scenario 03. BL-260's degradation contract and BL-286's cid contract are
  NOT restated here - they keep their own feature files, and duplicating
  them would mean two files going red for one defect.

out_of_scope: |
  - Changing swarm-flow.mmd or architecture.mmd. This ADDS a third diagram;
    the existing two keep their current content and position.
  - Turning DIAGRAM_FILES into a directory scan. The allowlist is a
    deliberate guard against emailing out a stray .mmd.
  - Any change to the CID attachment mechanism (BL-286) or the
    render-unavailable degradation (BL-260).
  - Diagramming the OPERATOR/front-desk path (Telegram -> bridge -> operator
    -> reply). Related, genuinely undocumented, but a separate diagram and a
    separate ticket if wanted.
