source: |
  Operator intake .swarmforge/operator/INTAKE-iq3-coder-restart-20261005.md
  ("Source: human via Cursor. Suggest one trial. Do not re-open the
  investigation from scratch."), relayed by coordinator note 016541. Its
  sections, verbatim:

  ## What happened

  `ready_for_next.sh` served BL-1928. The seat merged main, then did not write. By 12:48Z the same turn was 261 model steps: 185 `read_file`, 63 shell commands, 6 compactions, 0 edits. `swarmforge.sh` was read 86 times, in 120-line windows. Five compaction summaries name the same next step: write `specs/pipeline/steps/bl1928SeatToolingFromOriginMainSteps.js`. The model answered each one by reading more. The repeat guard wrote 17 `REPEAT` notes, including a fifth identical read and a third identical `grep` of `print-task` in `handoff_lib.bb`. It is still in that turn.

  ## The trial

  When the latest compaction `<next_step>` names a write or an edit, and the seat then makes three tool calls that are not that write, end the qwen process and start a fresh one. The new turn's user message is only that next step, plus an instruction to write the named file and not to read a file it is about to create. Allow two such restarts per parcel. On the third miss, do not restart: the parcel must leave `in_process`, and a note must name the ticket so the other coder seat can take it.

  A seat that writes before the third non-write call is left alone.

  ## Do not try these again

  They are already measured failures, not open design options.

  - Do not turn `skipLoopDetection` back off. On 2026-10-04 the heuristic called 16 reads of different ranges of `swarmforge.sh` a loop, raised a keep/disable dialog nobody answers, and the one-shot turn died at "The request has been halted".
  - Do not make the repeat guard deny the call. Hotfix `66bd85171f` did that. The seat re-sent the denied call every five seconds, which tripped qwen's always-on identical-call halt (`skipLoopDetection` does not disable that one). The guard stays a warning.

  How the restart is built (hook versus launcher) is the coder's. The behavior above is the trial.

  ## Out of this slice

  The seat kept working after the ticket was parked as blocked. That is a separate fault. Do not bundle it here.

description: |
  ## What is wanted

  1. A local coder seat whose latest compaction names a write or an edit
     as its next step, and which then makes three tool calls that are not
     that write, has its qwen process ended and a fresh one started
     (scenario 01). The parcel stays in its in_process: nothing is
     completed or handed off.
  2. The fresh turn's only user message is that next step, plus an
     instruction to write the named file and not to read a file it is
     about to create (scenario 01).
  3. A seat that makes the named write before its third other call is
     left alone (scenario 02). A next step that names no write or edit
     never restarts the seat (scenario 04).
  4. At most two such restarts per parcel; the count is durable, so a
     restart does not reset it (scenario 03). The third miss is BL-1992.

  ## How (direction, not mandate)

  - Where to read (only these lines):
    `swarmforge/scripts/local_model_repeat_guard.bb` - `next-step-of`
    (~61), `transcript-entries` (~66), `latest-next-step` (~111) and
    `answer` (~184). The PostToolUse hook already sees every tool call
    and reads the transcript, so counting the calls since the latest
    compaction and deciding belong beside it. `edit-tools` (~39) names
    the write tools.
  - `swarmforge/scripts/swarmforge.sh` lines 2434-2461 build the local
    seat's qwen kickoff (`launch_body ... -i "Use read_file now ..."`).
    One shape: the hook writes the override message and the parcel's
    restart count under `.swarmforge/` and ends qwen; the launch script
    relaunches qwen with the override message when one is waiting. Read
    no other part of swarmforge.sh.
  - "The named write" is a write_file or edit whose path is the file the
    next step names.
  - Step handler `specs/pipeline/steps/bl1991SkippedWriteRestartSteps.js`
    (BL-1371). Fixture transcripts and a fake process controller; never
    the live seat.

out_of_scope: |
  - The third miss (the parcel leaves in_process, a note names the
    ticket): BL-1992.
  - The seat working on after its ticket was parked as blocked: a separate
    fault, not bundled here (the intake's own words).
  - Turning skipLoopDetection off, or making any hook deny a call.

