id: BL-932
title: "A property test that spawns the real launcher 15 times has no outer per-test timeout, so it times out against the lane's 20s default and fails QA for reasons unrelated to the code under test"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 20
direction: agent-proposed
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-932-subprocess-heavy-property-tests-share-one-declared-timeout.feature

invariants:
  - "The property lane's suite-wide testTimeout in vitest.properties.config.mjs is unchanged by this ticket. The fix is per-test headroom, never a lane-wide raise."
  - "The shared heavy-subprocess timeout value is declared exactly once and imported by every user. Applying this fix must reduce the number of hand-copied declarations, never add a fourth."

approval_context: >
  Two things want your sign-off.

  Severity high, and this is the arguable one. Nothing is down and no data is
  lost, so it is not critical, and on its face "a test needs a bigger timeout"
  reads like the low-severity BL-914. I filed high because of what it does to
  a GATE rather than to a test: the lane reports a failure that has nothing to
  do with the code under test, which is precisely the failure mode BL-871
  named when it added dangerouslyIgnoreUnhandledErrors to this same config
  ("the verdict depends on something other than the code under test"). QA hit
  it three times across two different tickets' QA passes, so it is costing
  real pipeline time and teaching everyone to discount a red lane. Say medium
  if you read it as contained; only the expedite lane changes.

  Whether the DRY half belongs here. SUBPROCESS_HEAVY_TIMEOUT_MS is currently
  hand-copied into three files. I scoped the extraction into this ticket
  rather than splitting it, because the alternative is to fix the reported
  test by adding a FOURTH copy - the fix and the cleanup are the same edit
  here, not two. If you would rather see the extraction as its own ticket,
  say so and this one narrows to the single test.

source: |
  QA `note` to the specifier, 2026-08-18 22:44:

  > onboarderLauncherPidGuard.property.test.js timed out 3x across BL-928/930 QA.

  Probed and confirmed by the specifier before speccing. The report is
  accurate and the mechanism is arithmetic rather than marginal.

description: |
  ## What happens

  extension/test/onboarderLauncherPidGuard.property.test.js declares one
  property with `{ numRuns: 15 }`. Every run builds a fixture and calls
  `spawnSync('bash', [launch_onboarder.sh, dir], { timeout: 15000 })` -
  the REAL launcher against a real filesystem, deliberately unmocked
  (BL-684 invariant 2 is about what the launcher does when handed a real
  process table). Some runs additionally `spawn('sleep', ['5'])` to
  produce a genuinely live pid.

  The property lane runs under its own config,
  extension/vitest.properties.config.mjs, whose `testTimeout` is 20000ms.
  The test declares no third argument to `test(...)`, so it inherits that
  20000ms for ALL FIFTEEN runs combined.

  The numbers cannot work. A single run is permitted up to 15000ms by its
  own inner spawnSync timeout - 75% of the entire test's budget - and
  there are fifteen of them. Even at a fast 1.5s per run the property
  needs ~22s and the budget is 20s. It does not need an unusual host to
  fail; it needs a normal one.

  ## The two knobs, which are not the same knob

  This is the part to get right, and the reason the file LOOKS like it
  already has a timeout:

  - INNER: `spawnSync(..., { timeout: 15000 })` bounds one child process.
    Present, and it is what a naive grep for "timeout" finds.
  - OUTER: `test(name, fn, <timeout>)` bounds the whole property, all
    numRuns of it. This is Vitest's knob, and it is ABSENT.

  A generous inner timeout with no outer one is the worst combination: it
  lets a single slow child eat the whole property's budget.

  ## The established treatment

  BL-871 already solved this shape in this same lane. Its config comment
  records that "raising per-test timeouts (see bl760/bl787/bl797) stopped
  tests failing their OWN assertions", and those three files each pass
  `SUBPROCESS_HEAVY_TIMEOUT_MS` (240000) as `test()`'s third argument.
  This ticket is that same treatment applied to the one heavy
  subprocess property test that never received it.

  ## Why the constant moves at the same time

  `const SUBPROCESS_HEAVY_TIMEOUT_MS = 240000;` is declared independently
  in all three adopting files (bl760:53, bl787:24, bl797:50). Adopting it
  in a fourth file by copying the line again is the wrong direction: the
  value would then need changing in four places and would drift silently.
  Extract it once and have the four files import it.

  ## Scope

  extension/test/onboarderLauncherPidGuard.property.test.js's `test(...)`
  call, the three existing declarations of SUBPROCESS_HEAVY_TIMEOUT_MS,
  and one new shared helper. Not vitest.properties.config.mjs's lane-wide
  default, not any other property test, not the launcher itself.

  ## How (direction, not mandate)

  extension/test/helpers/ is where this lane's shared test material already
  lives (propertyLaneFixtureRunner.js, envRestoreGuard.js and friends), so
  a small module exporting the constant fits the existing shape. Whether
  240000 is still the right value is worth one thought - it was chosen for
  mutation-probe-scale work, and this test is lighter - but do not lower it
  as part of this ticket without measuring; an over-generous outer bound
  costs nothing when the test passes.

  Do NOT reach for numRuns as the fix. Cutting the run count would make the
  symptom go away by testing less, and the generator's reach is the point of
  a property test.

out_of_scope: |
  - Not BL-914. That ticket covers the UNIT suite under vitest.config.mjs;
    this is the property lane under vitest.properties.config.mjs, a separate
    command (`npm run test:properties`), a separate config, and a separate
    20000ms default. The two must not be merged - Engineering Rules keep
    property tests deliberately separate from normal verification.
  - Not the lane-wide default (invariant 1), and not BL-871's
    dangerouslyIgnoreUnhandledErrors gate, which addresses a different
    mechanism (the non-configurable birpc onTaskUpdate heartbeat).
  - Not a general sweep of every subprocess-spawning property test. A survey
    during speccing found many such files with no outer override; most have
    never been reported failing, and turning that into a mass edit is a
    different, unevidenced ticket. See notes:.

notes: |
  Survey taken while speccing (2026-08-18), recorded so the next reader does
  not have to redo it: across the property lane, roughly a dozen files spawn
  real subprocesses without an outer per-test timeout. Only this one has an
  actual failure report behind it, and only three files (bl760/bl787/bl797)
  have ever needed the treatment, so this ticket deliberately fixes the
  reported case and extracts the constant rather than editing every candidate
  on suspicion. If a second file is reported, the extracted helper makes
  adopting it a one-line change - which is part of why the extraction is
  scoped in here.

  Beware the grep trap when reviewing this ticket: `grep timeout` on the
  target file returns a hit (the inner spawnSync one), so a quick check will
  wrongly conclude the test already has an override. The outer knob is the
  third argument to `test(...)`, on the closing line.

  Step handlers (specs/pipeline/steps/bl932SharedHeavyTimeoutSteps.js) do not
  exist yet and must land in the coder's parcel - the acceptance runner throws
  on a scenario with no handler (BL-233).

qa_e2e_procedure: |
  1. The reported failure, gone. Run `npm run test:properties` from
     extension/ (never the repo root) and confirm
     onboarderLauncherPidGuard.property.test.js passes rather than timing
     out. Run it at least twice, and prefer a moment when the host is under
     real load - the whole point is headroom, and a pass on a quiet host
     proves little. Record the host load at verification time.
  2. The outer knob is really there. Inspect the test declaration and confirm
     the timeout is the third argument to `test(...)`, not only the inner
     spawnSync option. Both must be present and distinct.
  3. Single declaration (invariant 2). Grep the property lane for the shared
     constant's value and confirm exactly one declaration remains, with the
     four users importing it. A fourth copied `const ... = 240000;` is a
     fail even if every test passes.
  4. Lane default untouched (invariant 1). Confirm
     vitest.properties.config.mjs still declares testTimeout: 20000, and that
     the unit lane's vitest.config.mjs is not touched at all by this parcel.
  5. No collateral. Confirm the three existing adopters (bl760, bl787, bl797)
     still pass after the extraction - they are the files whose declarations
     moved, so they are where a bad import would show up first.
  6. Lane hygiene. Per the Engineering Rules, an `Unhandled Error` in the
     test:properties output fails the lane unless it is exactly the known
     benign `[vitest-worker]: Timeout calling "onTaskUpdate"` artifact - grep
     the output and confirm nothing else appears.

