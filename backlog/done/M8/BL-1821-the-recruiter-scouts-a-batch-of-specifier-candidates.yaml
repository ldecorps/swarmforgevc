id: BL-1821
title: "Once a week the recruiter scouts a batch of up to N unseen Hugging Face candidates for the local specifier seat, batteries each with the specifier battery, re-batteries the model the steward currently favours for specifier, and keeps a score table (.swarmforge/recruiter/score-table.json) whose recommend line names a challenger only when it passes more than the incumbent - an offer, never a staffing change"
