description: |
  Status: hotfix 597801eadd landed the fix. The coder reviews it and never
  re-applies it.

  Found by the specifier measuring BL-1700's feature on main for BL-2106's
  QA procedure, 2026-10-09: 6 of 7, scenario 03 failing at "And no aider or
  tmux process from the run is left alive" with "leaked process(es)": a
  real steward probe of the prepared alias
  `prepared-ista-daslab-qwen3.8-27b-gsq-rco-gguf-iq3_xxs`, started 18:46Z
  (the steward task backlog/evidence/steward-probe-prepared-20261009.md),
  and a probe tmux for model `--help` alive since 17:58Z. Neither came from
  the scenario: specs/pipeline/steps/bl1700StewardCoderProbeSteps.js read
  `ps aux` for `.probe.tmux.sock` or `stand-in.sh` across the whole host.

  597801eadd: the scenario's first Given step snapshots the pids of every
  matching process (`ps -eo pid=,args=`), and the leak check fails only on
  a matching process whose pid is not in that snapshot. Run on main with
  both probes alive: 7 of 7.

  The review asks: can a matching process that starts DURING the scenario
  but belongs to another run (a concurrent feature run in another
  worktree, a steward probe started mid-scenario) still fail it? If so,
  is tightening the match to this run's own temp root worth a follow-up?

