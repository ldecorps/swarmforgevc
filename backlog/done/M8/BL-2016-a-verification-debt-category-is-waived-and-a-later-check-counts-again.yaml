description: |
  ## Why

  BL-2015 ships both settle verbs and the reader's outstanding-only count,
  gated by the discharge scenario. This slice gates the other two
  behaviours BL-1783 asked for: a waiver settles a category with who and
  why, and a hand check recorded after either kind of settle is new debt
  that counts from one.

  ## What is wanted

  `specs/pipeline/steps/bl2016VerificationDebtWaiveSteps.js`, the step
  handler for this feature's Background, scenario 02 and scenario 04
  (both Examples rows). No production change is expected: if a step fails
  against BL-2015's code, that is a BL-2015 defect, and the coder sends the
  specifier a note naming it rather than patching the verbs here.

  How (direction, not mandate): start from BL-2015's handler
  (`bl2015VerificationDebtDischargeSteps.js`), which already implements the
  Background and the reader steps; copy what you need into this file and
  register with `registry.defineScoped(re, fn, FEATURE)` where FEATURE is
  this feature's exact `Feature:` text. The `<settle>` placeholder is
  validated against an explicit KNOWN_VALUES of `discharge` and `waiver`
  (engineering rule: no passthrough). For `discharge`, settle with the
  Background's committed evidence file; for `waiver`, with any non-blank
  reason.

  ## Scope
  - The feature file and its step handler. Nothing else.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2016-a-verification-debt-category-is-waived-and-a-later-check-counts-again.feature`:
     3 ok (scenario 02 and both rows of 04), 0 fail.
  2. `git diff <BL-2015's land>..<parcel> --stat` touches only the feature
     and the handler.

