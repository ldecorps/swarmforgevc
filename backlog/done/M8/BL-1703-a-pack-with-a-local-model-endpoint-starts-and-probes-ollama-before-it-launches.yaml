id: BL-1703
title: "A launch of any pack whose seats use the local model endpoint probes ollama first - an answering endpoint is used and recorded as external, a silent one is started by the swarm, waited for and recorded as swarm-owned, and one that never answers refuses the launch before any seat starts, naming the endpoint; packs with no local endpoint launch exactly as before"
milestone: M8
type: feature
status: todo
epic: local-llm-swarm
priority: 2
direction: human-requested
depends_on: []
