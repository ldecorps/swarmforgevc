description: |
  Status: hotfix 009daacae7 landed the fix. The coder reviews it and never
  re-applies it.

  Found by the specifier on 2026-10-10 measuring BL-1166's feature on main
  at the BL-2110 mint (rule of 2026-09-27: a procedure step running a
  feature the ticket does not own states its measured result). Scenario
  02 failed at "each section link drills to that section's page list
  derived from docs index.md": "The input did not match the regular
  expression /^(tutorials|how-to|reference|explanation)\//. Input:
  'deprecated/README.md'". No register row or ticket owned it.

  docs/index.md's Reference section links deprecated/README.md, which
  Article 1.7 asks for (the documenter moves retired pages to
  docs/deprecated/ and links them from docs/index.md). Of 364 section
  links it is the only one outside the four Divio folders. The hotfix adds
  `deprecated` to the step's allowed prefixes in
  specs/pipeline/steps/bl1166OperatorDocsSteps.js.

  The review asks: does accepting deprecated/ let a real misfiling
  through (a living page linked from a Divio section to a wrong folder)?
  The step still rejects every other prefix.

