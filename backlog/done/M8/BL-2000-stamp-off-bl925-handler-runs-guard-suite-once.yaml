description: |
  ## Status: hotfix 3024ccb56c landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `specs/pipeline/steps/bl925ReconcileMergeOfPublishedTipSteps.js` ran
  `swarmforge/scripts/test/test_pipeline_code_on_main_guard.sh` once per
  scenario (memoized per scenario only). The suite takes no input from a
  scenario and had grown to ~39 s alone (28 cases); eight scenarios each
  running it passed the feature runner's 300 s ceiling on a quiet host,
  and the runner killed the whole feature before any result printed.

  ## What the hotfix changed

  - `processResult`: one run per process, shared by every scenario; each
    scenario still records it in `ctx.bl925.result`.

  ## Seen in the same pass, not fixed here

  - BL-952's feature failed once (9/10) on an after-hook ENOTEMPTY
    removing its fixture's `.swarmforge/daemon` directory, then passed
    10/10 twice. A cleanup race to watch, not a red today.
  - BL-1096 (7/7, 26 s) and BL-632 (11/11, 7 s) drive the same suite and
    fit.

  ## What the coder does (all of it)

  1. Run qa_e2e_procedure step 1 once, in your worktree, its output saved
     to tmp/out.txt.
  2. Read `git show 3024ccb56c` against the sections above and the
     invariant.
  3. Write backlog/evidence/BL-2000-coder-<date>.md: the result and one
     line saying whether the hotfix matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

