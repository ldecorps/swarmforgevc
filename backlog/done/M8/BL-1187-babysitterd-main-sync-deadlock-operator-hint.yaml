description: |
  ## What

  When `.swarmforge/daemon/main-sync-deadlock.json` is active, babysitterd emits
  a CRIT finding each sweep with ahead/behind/reason and named overlapping dirty
  paths when computable. Finding escalates via BABYSITTER_ESCALATION (deduped);
  coordinator nudge suppressed.

  ## How

  Pure hint in `master_main_reconcile_lib.bb`; `check-main-sync-deadlock` in
  `babysitterd_sweep_lib.bb`; gatherer reads marker + git overlap in
  `babysitter_check.bb`.

qa_e2e_procedure: >
  (1) Fixture active deadlock + overlapping path → CRIT message names path.
  (2) Escalation-eligible, not nudge-eligible. (3) Inactive marker → no finding.

out_of_scope: |
  - Auto-healing dirty overlap.
  - Resident spy sync status UI.

