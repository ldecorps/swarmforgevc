description: |
  ## What is wrong
  `bash swarmforge/scripts/test/test_handoffd_role_context_clear_wiring.sh`
  on main (coder@2 twice, specifier once, 2026-09-22):

      FAIL: setup: coder's initial clear never fired within 30s; log: ...started

  The test boots the real `handoffd.bb` against a fixture root with a
  fake `tmux` on PATH (lines 110-115: `echo "$*" >> CALL_LOG; exit 0`) and
  waits 30 s (line 138) for `role-context-clear-fired coder`. Hotfix
  9237008e9f (2026-08-30, "refuse /clear unless context fullness is known
  and >=75%", the operator directive now in `workflow.prompt`: "Never
  /clear unless context is at least 75% full; if the fraction is unknown,
  do not clear") added `role-context-fullness-percent` to `handoffd.bb`
  (~line 5326): it calls `capture-pane-lines` (`tmux -S <socket>
  capture-pane -p -t <session> -S -400`, line 1013), counts the lines,
  and returns nil for zero lines; `role-context-clear-sweep!` (~line
  5421) then logs `role-context-clear-skip-fullness` or never fires. The
  fake tmux prints nothing, so every role reads unknown and no clear ever
  fires; the test's own scenarios never run.

  The hotfix updated `closing_context_clear_harness.bb` (fullness
  defaults to 80 "so legacy acceptance scenarios" pass - its line 10)
  and `closing_context_clear_test_runner.bb`, and not this wiring test,
  which drives the real daemon and the real probe. BL-316's acceptance
  handler `specs/pipeline/steps/contextClearAllRolesSteps.js` runs this
  shell test as a subprocess (`runRoleWiringTest`, 60 s timeout) for
  scenarios 04 and 05, so `node specs/pipeline/cli.js
  specs/features/BL-316-context-clear-generalize-all-roles.feature` is
  red on main too (ok 1-3 via the harness, not ok 4 and 5). The shell
  test is row 339 of `swarmforge/scripts/test/suite-manifest.tsv` (lane
  standing); the specifier's BL-1505 evidence of 2026-09-10 listed it
  among six unreproduced reds ("initial clear never fired in 30 s").

  Both files assert BL-316's pre-hotfix behaviour - a fresh completion
  on an idle role is cleared, full stop - and neither states the rule
  that replaced it. That is the Article 3.6 shape: a test asserting
  retired behaviour, and a durable contract missing the present one.

  ## Why
  The rule is the human's (2026-08-30): a /clear below 75% throws away
  context for nothing. A test that cannot observe fullness cannot
  distinguish "the sweep is broken" from "the sweep is obeying the
  human", and BL-316's feature - the executable record of when a role IS
  and IS NOT cleared - is silent on the one condition that now decides
  it. BL-1425's register rule: a red is owned or it throttles intake.

  ## How (direction, not mandate)
  - Fake tmux: on `capture-pane ... -t <session> ...`, print a scrollback
    whose length is per session - 400+ lines for coder and cleaner
    (the roles cases 01 and 04 expect cleared), e.g. `seq 1 400` when the
    target matches, so `role-context-fullness-percent` reads 100; keep
    logging every argv to CALL_LOG and `exit 0` for everything else. The
    existing assertions (one /clear to coder's session, /clear before the
    startup re-read, cleaner cleared, architect and hardender never)
    then run as written.
  - New case 05 in the shell test: a fifth role (or the documenter row
    the fixture already writes) with a fresh completion, idle, whose
    session's capture prints 100 lines (25%) - and a sixth reading empty
    - is never cleared; assert `role-context-clear-skip-fullness <role>
    25.0%` is logged for the first and no `role-context-clear-fired` for
    either.
  - `specs/features/BL-316-context-clear-generalize-all-roles.feature`
    gains `# BL-316 context-clear-all-roles-07` "a role whose pane
    fullness is unknown or below 75% is never cleared, even with a fresh
    completion" and `contextClearAllRolesSteps.js` its step (reads the
    shell test's output for the skip line, as scenarios 04/05 read
    theirs). Retire nothing; reword nothing.
  - Evidence: one green shell run with its `ok` lines, one green feature
    run (7/7), and the measured fullness the fake produces per role.
  - Documenter: `docs/how-to/` page for context clearing (BL-309/BL-316)
    states the 75% rule if it does not already; no diagram trigger.

  ## Scope
  - `swarmforge/scripts/test/test_handoffd_role_context_clear_wiring.sh`,
    `specs/features/BL-316-context-clear-generalize-all-roles.feature`
    (scenario 07 appended), `specs/pipeline/steps/contextClearAllRolesSteps.js`.
  - Out of scope: `handoffd.bb`, `closing_context_clear_lib.bb`, the
    threshold and the proxy (the human's rule as landed); the stamp
    ticket the hotfix never got (a hotfix-sweep matter, noted below);
    the other reds the BL-1505 evidence listed.

qa_e2e_procedure: |
  On the parcel commit, from the repo root, ONE run each (2026-09-17 rule).
  1. `bash swarmforge/scripts/test/test_handoffd_role_context_clear_wiring.sh`:
     exit 0, every case `ok` including the new fullness case - at mint it
     fails at setup after 30 s.
  2. `node specs/pipeline/cli.js specs/features/BL-316-context-clear-generalize-all-roles.feature`:
     `# pass 7`, `# fail 0` - at mint scenarios 04 and 05 are not ok.
  3. `git diff main...HEAD --name-only` names only the three scope
     files and evidence; `swarmforge/scripts/handoffd.bb` and
     `closing_context_clear_lib.bb` are unchanged.
  4. After landing: `bb swarmforge/scripts/standing_red_register_cli.bb .`
     reports `"unowned":[]` and no row names either file (the land
     step's REGISTER_ROW_RETIRED lines, BL-1631).

