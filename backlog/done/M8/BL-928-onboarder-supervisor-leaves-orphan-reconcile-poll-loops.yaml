description: |
  ## What happens

  `onboarder_supervisor.bb` supervises exactly one child - `node
  extension/out/tools/onboarder-reconcile.js <root> poll-loop` - through
  `front_desk_supervisor_lib/check-one!`. Three facts compose into a leak:

  1. `stop-all!` destroys only pids recorded in
     `onboarder-supervisor.status.json`. A supervisor that dies without
     running its `finally` - SIGKILL, crash, a host kill of the bb process -
     never runs it at all, and its child reparents to PID 1.
  2. `stop_ancillary_services.sh` `stop_onboarder()` then `rm -f`s
     `onboarder-supervisor.status.json`, so the next supervisor has no record
     of the pid even when one survived.
  3. `check-one!`'s `"not-started"` branch is a bare `spawn!` with no
     `kill-pid!`. BL-403 and BL-411 added `kill-pid!` to the
     `"waiting"`/`"stalled"` and `"gave-up"` re-arm branches only, and both
     explicitly left this branch out of scope.

  The result is a healthy new child plus every unreaped sibling, indefinitely -
  one more per supervisor death, with nothing that ever removes them.

  ## Measured, this host, 2026-08-18 ~20:20 CEST, live swarm up

  | PID | PPID | Age | Role |
  |---|---|---|---|
  | 5343 | 1 | ~3h | live `onboarder_supervisor.bb` (pidfile matches) |
  | 5356 | 5343 | ~3h | live reconcile child |
  | 25731 | 1 | ~19h | leftover `onboarder-reconcile.js poll-loop` |
  | 50175 | 1 | ~11h | leftover `onboarder-reconcile.js poll-loop` |

  All four have cwd `/Users/ldecorps/projects/swarmforgevc`. Re-confirmed
  first-hand by the specifier at mint time - all four still present, same pids,
  ages then 03:12 / 19:42 / 11:31. The two leftovers predate the live
  supervisor's own start, so they survived its startup: a startup sweep is
  exactly the missing step.

  ## Harm

  These poll-loops are outbound-only (`createForumTopic`), not a second
  `getUpdates` poller, so they will NOT 409 the front desk - the intake is
  right about that and it is why this is not critical. What they do:

  - Share `onboarder-heartbeat.json`. `poll-heartbeat-stale?` reads
    `lastHeartbeatMs` from whichever writer last touched the file, so the
    supervisor's stall detector can be answered by a process it does not
    supervise. A genuinely stalled child is masked by a leftover's heartbeat.
  - Duplicate outbound Telegram topic-ensure calls, N-fold per reconcile
    interval.
  - Accumulate without bound.

  ## Shape of the fix (direction, not mandate)

  Sweep once at supervisor startup, before the first tick spawns anything.
  A candidate is reapable when ALL of: its command line names the reconcile
  entrypoint AND this swarm repo root AND `poll-loop`; and its parent is gone
  (PID 1, missing, or dead). Anything else is left alone.

  `front_desk_supervisor_lib.bb` already holds this exact class of function -
  `bridge-entrypoint-holder?` and `decide-bridge-port-action`, pure decisions
  over a discovered process, adapter-injected, no I/O inside. Put the predicate
  and the sweep decision beside them rather than starting a third home. Adding
  a new function there does not change `check-one!`'s semantics for the
  front-desk or negotiation-relay supervisors, which the intake put out of
  scope.

  The parent-gone test is `process_table_lib/parent-orphaned?`, which BL-879
  already built and which is the decapitation guard in invariant 1: the live
  supervisor's own child has a live parent by construction.

  ## Why the enumeration must go through process_table_lib

  Non-negotiable, and the reason is invariant 3.
  `process_table_lib/list-processes!` returns nil when the table cannot be
  enumerated and a vector otherwise, a distinction BL-849 established
  deliberately so "I cannot see the process table" never degrades into "there
  is nothing to reap". A hand-rolled `ProcessHandle/allProcesses` scan loses
  that, and loses the procfs/Darwin split with it. This is the one
  implementation constraint in this ticket; everything else above is direction.

qa_e2e_procedure: |
  1. Fixture root, the reap: build a temp swarm-repo fixture, start two
     orphaned processes whose command line names the fixture root and
     `onboarder-reconcile.js poll-loop` and whose parent has exited, so they
     reparent to PID 1. Start the supervisor for that fixture root. Confirm
     both orphan pids are gone, the supervisor spawned its own child, and
     `onboarder-supervisor.status.json` records exactly one pid, which is that
     child's and is alive.
  2. Decapitation guard: with the supervisor from step 1 still running, start a
     SECOND supervisor process for the same fixture root directly, bypassing
     launch_onboarder.sh's pidfile guard. Confirm the first supervisor's child
     is still alive afterwards - its parent was alive, so it was never a
     candidate. This is invariant 1 and the single most important negative
     check in the ticket.
  3. Root scoping: start an orphaned poll-loop naming a DIFFERENT fixture root,
     then start the supervisor for the first fixture root. Confirm the other
     root's poll-loop is untouched. Invariant 2.
  4. Unreadable process table: force the enumeration to fail through an
     injected seam, not a chmod - see the engineering article's
     failure-simulation rule - and confirm the supervisor still starts, spawns
     its child, reaps nothing, and writes a log line naming the read failure.
     Then repeat on a clean fixture with no siblings and confirm no such line
     appears; the two must be distinguishable from the log alone. Invariant 3.
  5. Break-then-fix: restore the current bare `"not-started"` spawn with no
     sweep and confirm step 1 fails. A green suite after that revert means the
     acceptance is not gating the behaviour - intake acceptance item 4.
  6. Live host, last: do NOT kill anything by hand, the intake forbids it.
     Stop and restart ancillary services normally and confirm the next
     onboarder supervisor start reaps pids 25731 and 50175 itself, leaving
     exactly one live `onboarder-reconcile.js poll-loop` for this root. If
     those pids are already gone by then - a host reboot, an unrelated restart
     - reproduce the condition on a fixture root per step 1 instead and record
     that in the evidence rather than claiming a live confirmation you did not
     get.

required_wiring:
  - "swarmforge/scripts/onboarder_supervisor.bb::process_table_lib::the supervisor must load the shared process-table enumerator; without it there is no sweep at all, and a hand-rolled scan loses the nil-vs-empty distinction invariant 3 depends on"

out_of_scope: |
  Every item below is out of scope by explicit human decision in the source
  intake, not by my judgement.

  - Ad-hoc killing the live leftover PIDs 25731 and 50175. They go away when
    the fix ships and a supervisor next starts, not before.
  - Adding a janitor class for host-repo `onboarder-reconcile.js`. Widening
    `reapable-tmp-ancillary?` or the BL-486 agent-reaper catalog to hunt host
    daemons is how you decapitate a live onboarder; BL-879's janitor correctly
    left these alone and must keep doing so.
  - Changing BL-403 `check-one!` restart semantics for the front-desk or
    negotiation-relay supervisors beyond whatever this ticket must share to
    stay DRY. Adding a new function to the shared lib is fine; changing the
    behaviour of the branches those two supervisors already take is not.
  - The duplicate `--remote-control SwarmForge-Coder` in two live tmux panes.
    That is a rotation/babysitter duplicate inside the live window set;
    separate intake if still wrong after this.
  - The leftover `sfvc-fake-agent-bin` shell.js test process. Fixture cleanup,
    not this supervisor.
  - Sweeping in `stop_onboarder()` rather than at start. See approval_context;
    a second ticket if you want it.

notes: |
  Minted 1:1 from the intake under queue-jump direction at the coordinator's
  routing note. No consolidation was performed, so Article 5.3 has nothing to
  preserve beyond the verbatim human decisions already quoted in `source:`.

  Probed, not taken on report. Every code claim in the description was read
  from this checkout at mint time: `stop-all!`'s recorded-pid-only loop,
  `stop_onboarder()`'s `rm -f` of the status file, and `check-one!`'s bare
  `"not-started"` spawn. The live process table was re-run and all four
  processes from the intake's table are still present with the same pids.

  On the required_wiring pattern. Per BL-874 the pattern is matched as a plain
  substring against the file at the parcel commit, so it must be a literal that
  will really exist. `process_table_lib` is the filename the supervisor's own
  `load-file` line must name - the same form the file already uses for
  `front_desk_supervisor_lib.bb`, `swarm_identity_lib.bb` and
  `fleet_telegram_creds_lib.bb` - and it appears zero times in
  `onboarder_supervisor.bb` today, so the entry is neither invented nor
  vacuous. It is also the one constraint the description marks non-negotiable,
  so the gate and the spec agree.

  mutation_cost low. The decision is a pure predicate plus a filter over an
  already-existing enumerator; `front_desk_supervisor_lib.bb` has an
  established pure-decision test shape (`decide-bridge-port-action`) and
  `swarmforge/scripts/test/test_onboarder_supervisor_tick.sh` is the existing
  fixture harness for this supervisor. Extend both rather than starting new
  ones. Note that harness drives `--check-once`; if the startup sweep does not
  run under `--check-once` - my recommendation, a diagnostic tick should not be
  destructive - the sweep needs its own entry, and that choice belongs to the
  implementer.

  BL-233 obligation. All four scenarios are new and their step handlers must
  land in THIS parcel - the acceptance runner throws on any scenario it cannot
  resolve. The Scenario Outline's `candidate` column must validate against
  explicit KNOWN_VALUES, never a passthrough check.

  Shell and test discipline for the fixture harness: stock macOS /bin/bash 3.2,
  so use the empty-array-safe expansion form; `env -u SWARMFORGE_CONFIG` before
  fixture confs; remove any mkdtemp fixture dir in a `finally`, never after the
  last assertion. Fixture processes must be matched by something that cannot
  match a live host process - the whole point of invariant 2 is that a fixture
  root and the live root are never confused, and the test must not be the first
  thing to break that.

  IR-DRY run and dispositioned as no-change. Seven medium-confidence findings,
  all of them cardinality or polarity pairs the checker does not normalize:
  `two orphaned` against `one orphaned` against `no other` against `exactly one
  live remains`, and the two log assertions (`records that the sweep could not
  read` against `records no read failure`). Those are genuinely different
  assertions, not accidental drift, which is the only thing the checker's own
  suggested_action says to normalize. No available merge is meaning-preserving:
  folding the count-varying Givens into one outline would force scenarios 1 and
  4 to share a Then they do not share. Left as written.

