description: |
  ## Status: hotfix 36c869209a landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What the hotfix changed

  a28aae435b ("Make deprecator duty prominent in specifier prompt",
  2026-08-27) wrapped `depends_on` in backticks inside the Consolidation
  Authority section's sentence "Correct any depends_on entries the cluster
  contradicts." BL-680's step handler reads that sentence as a plain
  literal with whitespace normalised, so scenario 04 has been red since.
  The hotfix removes the two backticks from the prompt. The handler and
  the scenario are unchanged.

  ## What is wanted in this parcel

  - Review the change, and say in the evidence whether any other BL-680
    literal is one formatting edit away from the same red (a backtick or a
    line wrap inside a quoted phrase).
  - Evidence: the review and one run of the feature.

  ## Scope

  The prompt line (review only) and evidence.

