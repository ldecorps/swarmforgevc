description: |
  ## Status: hotfixes c15a0f21aa and aeb9771b84 landed the fix

  This parcel is their stamp-off: review them, do not re-apply them.

  ## What was wrong

  - BL-571 scenario 03, "a classic pack still repairs its missing
    middle-role sessions": swarm ensure repairs a MISSING session by
    creating it (`single_role_repair_lib.bb`'s new-session branch); only a
    present session is respawned. The step handler's fake tmux logged
    only `respawn-pane`, so it saw no repair while ensure reported each
    role repaired.
  - `test_handoffd_supervisor.sh`, the BL-1491 case: it deleted the
    fixture's tmux-socket to keep `halt-swarm!`'s cleanup off real tmux.
    Since BL-1688 (95360d8b00, 2026-09-22) a supervisor with no
    tmux-socket logs "no swarm to supervise" and never halts, so no audit
    row and no availability stop record were written.

  ## What the hotfix changed

  - `specs/pipeline/steps/bl571SequentialRotationDormantParitySteps.js`:
    the fake also logs `new-session` as a repair. Scenarios 01 and 02
    assert NO repair for dormant roles, and still pass.
  - `swarmforge/scripts/test/test_handoffd_supervisor.sh`: the BL-1491
    case keeps the socket; the halt's cleanup reaches only the fake tmux
    on PATH, as cases 01 and 05 already do. Checked after the run: every
    live seat still UP, no new row in the live kill-all-audit log.

  ## What the follow-up hotfix aeb9771b84 changed

  c15a0f21aa's `new-session` branch put the bl571 steps in the tmux-reaper
  guard's scope: the file writes a tmux stub and prepends it to PATH
  (BL-1032 route 2), and the stub now names a server-creating subcommand.
  The file never required `./lib/fixtureReaper`, so
  `extension/test/tmuxReaperGuard.test.js` went red on main (QA note 003840,
  holding BL-1964). aeb9771b84 adopts the reaper the way
  `bl958ControlPlaneLossSteps.js` does: `track(root)` in `mkFixture`,
  `reap(root)` before `rmSync` in `afterEach`. The string stays as it is;
  rewording it to dodge the guard is the move BL-1032 rules out.

  ## What the coder does (all of it)

  1. Run qa_e2e_procedure steps 1 and 2 once each, outputs under tmp/.
  2. Read `git show c15a0f21aa` and `git show aeb9771b84` against the
     three sections above.
  3. Write backlog/evidence/BL-2018-coder-<date>.md: the two results and
     one line per hotfix saying whether it matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

