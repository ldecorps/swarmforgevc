description: |
  ## What / why

  Specs and modules get reported ready while untracked or unwired (dark features).
  Rule proposals: a feature is not delivered until committed; multi-slice epics need
  an explicit runtime-wiring ticket.

  ## Outcome

  Mechanical exit gates for specifier/coder hygiene and epic close:

  1. **Acceptance commit-tracking** — `specifier_backlog_hygiene_gate.sh` fails when
     `acceptance:` points at a path on disk but not in `git ls-files`
     (`untracked-acceptance`). Partner: pre-QA refuses missing blob at cited commit.
  2. **Multi-slice epic wiring checklist** — epic with ≥2 `decomposes_into` children
     fails unless at least one child has non-empty `required_wiring`
     (`epic-wiring-exit-checklist` in `backlog_hygiene_lib.bb`, surfaced through
     `backlog_epic_milestone_audit`).

qa_e2e_procedure: >
  (1) Paused ticket with untracked acceptance feature — hygiene gate fails naming path.
  (2) Same ticket after git add — hygiene passes commit-tracking. (3) Epic with two
  children and no required_wiring — wiring checklist fails. (4) One child adds
  required_wiring — checklist passes. Run bl533_exit_gates_property_runner.bb and
  backlog_hygiene_lib_test_runner.bb.

