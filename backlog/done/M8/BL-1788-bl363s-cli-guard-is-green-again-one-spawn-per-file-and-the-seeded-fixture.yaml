description: |
  ## What is wrong

  Coder note 002194 (2026-09-27 00:35Z), verbatim: "unowned-red:
  BL-363.feature D2/D4: fleetConsole/telegramFD spawns; negotOB init".
  From its evidence (`backlog/evidence/unowned-red-bl363-fleetconsole-telegramfd-negotiateonboarding-coder-20260927.md`,
  on the coder's branch at b6c2116802), found while running BL-1770's
  qa_e2e step 2. Both reds reproduce on `main` at 40f71431cd:

  - Scenario 02 "Each CLI keeps exactly one end-to-end spawn": `found
    violations: fleetConsoleCli=2, telegramFrontDeskBotCli=2`.
    - `fleetConsoleCli.test.js:110`, BL-437 (942dd58109, 2026-07-15):
      "the compiled CLI defaults to the SWARMFORGE_FLEET_DIR env var" spawns
      the CLI a second time. The file already has an in-process `runCli`
      (argv and stdout stubbed, `main()` awaited).
    - `telegramFrontDeskBotCli.test.js:2571`, BL-1620 (b2dbead3d7,
      2026-09-18): `runDefaultRunHandoffProbe` writes a probe script and
      runs it under `node`. The probe patches `child_process.execFile`
      before requiring the compiled module, because the module captures
      `promisify(execFile)` when it loads. The comment there explains why
      it avoided a real `bb`. Logic that only a subprocess reaches is
      invisible to in-process coverage and to Stryker's per-test coverage,
      which is exactly the hazard BL-363's narrative names. So the matcher
      is right to count it.
  - Scenario 04 "A test needing a repository fixture builds it once": the
    handler wants `git ... 'init'` inside the beforeAll of
    `negotiateOnboardingContractCli.test.js`. BL-1039 (5deb04b175,
    2026-08-22) replaced that with `copySeededRepoInto(PREPARED_ROOT)` from
    `helpers/sharedRepoFixture.js`, which seeds one git template per
    process and hands out copies. The file now does less per-test work
    than the scenario asks for, and the handler's proof is out of date.
    The comment above that beforeAll still says "real `git init`/`git
    config`".

  Scenarios 01, 03 and 05 pass.

  ## What is wanted
  - `fleetConsoleCli.test.js`: the SWARMFORGE_FLEET_DIR default is proven
    in-process, with the env var stubbed and restored in a finally. The one
    `runCliSubprocess` smoke test stays.
  - `telegramFrontDeskBotCli.test.js`: the BL-1620 default-runHandoff test
    runs in-process, with no `node` probe. The file keeps its one CLI
    smoke spawn (line 387's helper) and every assertion listed in
    invariant 2.
  - `clisTestedInProcessSteps.js` scenario 04: the beforeAll counts as
    building the fixture once when it builds through the shared seeded
    repository (`copySeededRepoInto`) or runs a git init itself. A test
    body that runs its own git init still fails the scenario.
  - The stale comment above negotiateOnboardingContractCli's beforeAll
    says what the beforeAll now does.
  - `node specs/pipeline/cli.js specs/features/BL-363-clis-tested-in-process.feature`
    passes 5 of 5.

  ## How (direction, not mandate)
  - telegramFD: patch `require('child_process').execFile`, then do a fresh
    require of `out/tools/telegram-front-desk-bot.js` (drop its
    `require.cache` entry first). Put back the original `execFile` and the
    original cache entry in a finally, so later tests see the module every
    other test loaded. Another option is a small injectable seam for the
    module's execFile capture, if it does not change behaviour. Either way,
    the default arrow stays the thing under test.
  - Scenario 04: the handler can accept either build form in the
    beforeAll body, and keep refusing a git init in any test body.
    Non-vacuity: a copy of the source with the beforeAll's build removed,
    or with a git init in one test body, must still go red.

  ## Scope
  - `extension/test/fleetConsoleCli.test.js`,
    `extension/test/telegramFrontDeskBotCli.test.js`,
    `extension/test/negotiateOnboardingContractCli.test.js` (the comment
    only), `specs/pipeline/steps/clisTestedInProcessSteps.js`. Plus
    evidence.
  - The standing-red register row names this ticket; the land retires it
    (BL-1631).

  ## Not in scope
  - `extension/test/briefingDigestLineCli.test.js` (BL-1770, in flight;
    it is the handler's representative file for scenarios 01 and 03).
  - The fact that no role runs the whole acceptance suite, which is how
    these reds lasted 9 to 74 days. See notes.
  - Any production file.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-363-clis-tested-in-process.feature`:
     5 of 5.
  2. From `extension/`: `npx vitest run test/fleetConsoleCli.test.js
     test/telegramFrontDeskBotCli.test.js test/negotiateOnboardingContractCli.test.js`:
     every test passes. Record telegramFrontDeskBotCli's duration (a
     BL-1620 pole file): it must not grow.
  3. `grep -cE "(execFileSync|spawnSync|spawn)\(\s*'node'" extension/test/fleetConsoleCli.test.js extension/test/telegramFrontDeskBotCli.test.js`:
     1 each.
  4. The acceptance register row for
     `specs/features/BL-363-clis-tested-in-process.feature` names BL-1788
     on the parcel commit.
  5. `git diff main...HEAD --name-only` names only the Scope files and
     evidence.
  6. After the land: REGISTER_ROW_RETIRED for
     `specs/features/BL-363-clis-tested-in-process.feature`.

