description: |
  ## Status: hotfix 712e5eb654 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong, and what the hotfix changed

  chase_sweep_lib.bb's sweep reads two things from
  `handoff-lib/target-root` for each role it sweeps: the BL-1004
  deferral context (`stage-deferral-context`) and the BL-2039 tier
  context (`chase-tier-context`), both from roles.tsv and the pack conf.
  `target-root` uses an explicit root set by `set-project-root!`
  (handoffd sets its argv root at startup) and otherwise falls back to
  `git rev-parse --git-common-dir` from the process cwd. Three fixtures
  drove the sweep with no explicit root from inside this repository, so
  they read the LIVE roles.tsv and conf. On 2026-10-09 the live
  full-forge pack had a two-seat coder stage with tiers declared, and the
  sweep left each fixture's "coder" parcel unchased (chaseCount 0):
  - extension/test/bl1505DedupSuppressedChaseCountInvariants.property.test.js:
    3 of 3 red (QA, BL-2091's gather).
  - specs/pipeline/steps/bl1505DedupSuppressedChaseStillCountsSteps.js:
    BL-1505 scenario 03 red.
  - specs/pipeline/steps/lib/bl1740ChaseSweepPauseFromCallerCli.bb:
    BL-1740's "no pause adapter" and "a pause adapter reading false" rows
    red (it pinned the root only for its "live" row).

  Each now calls `(handoff-lib/set-project-root! <fixture root>)` before
  the sweep, with a comment. A fixture root has no roles.tsv or conf, so
  both reads degrade to no seats and no tiers, the plain ladder these
  tests assert. That is the same pin
  bl2039_tier_aware_chase_sweep_property_runner.bb and
  chase_sweep_test_runner.bb already make. BL-1740's CLI pins the
  scratch checkout, whose own pause is active, for every row, so its
  no-adapter rows still prove the sweep ignores that pause. No assertion
  changed.

  ## What the coder does (all of it)

  1. Read `git show 712e5eb654` against the section above. Confirm only
     the three set-project-root! lines and their comments changed.
  2. Run bl1505DedupSuppressedChaseCountInvariants once, alone, with
     `--config vitest.properties.config.mjs` and output under tmp/, and
     the BL-1505 and BL-1740 features once each.
  3. Write backlog/evidence/BL-2098-coder-<date>.md with the review result
     and the run results, and commit it.

