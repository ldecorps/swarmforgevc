description: |
  ## What

  Live seats were confused when special paths were in play. Teach three named
  specials plus the default: **queue-jump**, **ambulance**, **expeditor**, and
  the normal live swarm. Prefer those words; the overloaded label “expedite”
  only appears to disambiguate (Art 3.2.4 severity queue-jump, Approvals button,
  Telegram `/expedite` → expeditor).

  ## This ticket’s process

  BL-715 itself is a **queue-jump** (not the expeditor): specifier owns the
  wording → coordinator puts it on the coder → normal live pack. Promote before
  BL-716. Intake text is the source of truth for the vocabulary:
  `backlog/INTAKE-workflow-prompt-modes-orientation.md`.

  ## Out of scope

  - Runtime behavior changes
  - Renaming `/expedite` or Approvals buttons (prose disambiguation only)
  - BL-716 tunnel DNS

