source: |
  The human, 2026-10-01, verbatim (standing-red-register-amendment §6):

  > Also, update your prompt / c9 stitution: instead of minting a red, hotfix the defect and mint a stampoff.

  Coordinator note 016810 to the specifier, 2026-10-05, verbatim:
  "defect: swarm_ensure reports coder FIXED but session never exists".
  Operator evidence backlog/evidence/session-repair-prefix-match-killed-coder2-20261005.md
  (18:57Z diagnosis, verbatim): "`tmux has-session -t NAME` matches by
  **prefix**, so with only `swarmforge-coder@2` alive,
  `has-session -t swarmforge-coder` exits 0 and the session reads
  \"present\"."

description: |
  ## Status: hotfix 77584c4c11 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  tmux resolves a bare `-t NAME` by prefix. With the iq3 seat's
  `swarmforge-coder` session gone and `swarmforge-coder@2` alive,
  `has-session -t swarmforge-coder` succeeded, so the babysitter's
  single-role repair and `swarm ensure` took the respawn branch, and
  `respawn-pane -k -t swarmforge-coder` landed in coder@2's pane: it killed
  coder@2 mid-turn and started iq3's launch script under coder@2's name,
  then reported the missing seat FIXED. Four times on 2026-10-05.

  ## What the hotfix changed

  - Exact `=NAME` targets in: `babysitter_check.bb` `pane-exists?`;
    `swarm_ensure.bb` `session-exists?`, `kill-session!` and the pane-alive
    `list-panes`; `swarm_status.bb` `session-present?`; `handoff_lib.bb`
    `session-exists?`; `swarmforge.sh`'s launch-time has-session/kill; and
    `role_lifecycle.sh`'s has-session/kill.
  - With the exact session present a bare `-t` still resolves to it
    (verified on tmux 3.7b), so the respawn and capture paths that run
    after a presence check stay correct.
  - New `swarmforge/scripts/test/test_tmux_exact_session_presence.sh`
    (registered standing); `test_swarm_ensure.sh`'s fakes strip a leading
    `=` from their target the way tmux does.
  - Seen working live: at 21:58:35Z the babysitter, reading the patched
    file, logged "swarmforge-coder: tmux session missing" and its repair
    created iq3's session under its own name; coder@2 kept its own.

  ## The follow-up hotfix 4a4063fdc0 (the reds 77584c4c11 left)

  77584c4c11 fixed the fakes in test_swarm_ensure.sh but not the others.
  Every fake tmux that compared the `-t` value literally then read each
  session as absent. Red at 77584c4c11 and green on 77584c4c11^:
  test_handoffd_bl812_cwd_invariant_root_resolution.sh 02 (coder@2's
  unowned-red note 000117), test_consult_spawn_cli.sh 02,
  test_handoffd_aged_note_rotate_wiring.sh A,
  test_handoffd_ambulance_wiring.sh 05, and features BL-571 (01, 02),
  BL-648 (06) and BL-938 (02, 04). test_chase_departing_mid_parcel_gate.sh
  stayed green, but its case 08 read SESSION_MISSING as present, so it
  passed vacuously. 4a4063fdc0 makes each fake strip a leading `=` the way
  tmux does (`${arg#=}`). The sweep: every file under
  swarmforge/scripts/test, specs/pipeline/steps and extension/test naming
  has-session, kill-session or list-panes (16 shell/bb tests run, 19 step
  handlers read).

  ## Out of scope (named, not built)

  - A seat-identity check (a session running another role's launch script
    reads healthy today) - the evidence file's second recommendation.
  - Other `tmux -t <role session>` sites that only run after an exact
    presence check (capture, send-keys).

  ## What the coder does (all of it)

  1. Run qa_e2e_procedure steps 1-5 once each, outputs saved under tmp/.
  2. Read `git show 77584c4c11` and `git show 4a4063fdc0` against the
     sections above and the invariant.
  3. Write backlog/evidence/BL-2014-coder-<date>.md: the three results and
     one line saying whether the hotfix matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

