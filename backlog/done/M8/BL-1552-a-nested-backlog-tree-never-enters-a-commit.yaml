qa_e2e_procedure: |
  On the parcel commit, from the repo root. Fixture root per BL-1390:
  `git init` under mkdtemp, prove it with `git rev-parse --git-common-dir`
  before anything else.
  1. `bash swarmforge/scripts/test/test_check_nested_backlog_path.sh` -
     ALL PASS; `grep -n test_check_nested_backlog_path
     swarmforge/scripts/test/suite-manifest.tsv` prints one standing row.
  2. `bash swarmforge/scripts/test/test_run_commit_guards.sh` - ALL PASS
     (the chain still reports every guard, now six in the cheap tier).
  3. In the fixture with the guard scripts copied in: stage
     `extension/backlog/evidence/BL-1-x.md`, run
     `swarmforge/scripts/run_commit_guards.sh`; expect exit non-zero and a
     refusal naming `check_nested_backlog_path.sh` and
     `backlog/evidence/BL-1-x.md`. Stage `extension/src/backlog/x.ts` and
     `docs/how-to/backlog-notes.md` instead; expect exit 0.
  4. `git ls-tree -r --name-only <parcel-commit> | grep -E '(^|/)backlog/'
     | grep -v '^backlog/'` prints nothing; the three moved files exist
     under `backlog/evidence/` with the stray files' content
     (`git diff <parcel-commit>~1:extension/backlog/evidence/BL-1278-hardender-20260909.md
     <parcel-commit>:backlog/evidence/BL-1278-hardender-20260909.md` is
     empty, same for the other two).
  5. `specs/pipeline/scripts/run_acceptance.sh` on this ticket's feature: 7/7
     (outline 01 x2, outline 02 x3, scenarios 03 and 04).
  6. Break-then-restore: remove the `run_guard` line from Tier 1; scenario
     03 fails (the chain no longer names the guard); restore.
