id: BL-1552
title: "Review-pass evidence written under extension/backlog/evidence/ enters main as if it were under backlog/evidence/: five commits by four roles since 2026-09-07 (BL-1448, BL-1278, BL-1478, BL-1464, BL-1484), three still on main with no copy of that pass under backlog/evidence/, because a role whose shell sits in extension/ resolves the relative path against npm's cwd and no commit guard refuses a second backlog tree; a cheap-tier pre-commit guard refuses any staged path whose backlog area directory is not at the root and names the root path, and the three strays move home"
milestone: M8
type: defect
severity: medium
# medium, not high: nothing is lost - the files exist and git keeps them -
# and the review-forward evidence gate (BL-1307) already refuses a forward
