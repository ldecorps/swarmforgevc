  - 'specs/pipeline/steps/bl1552NestedBacklogTreeNeverEntersACommitSteps.js::registerSteps::the handler lands in the same parcel as the feature (BL-233, BL-1371)'

human_approval: approved
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: the guard keys on a backlog
  AREA directory (paused, active, done, hold, evidence, archive,
  answers-archive, debt, topics) whose backlog/ parent is not the
  repository root - never on the bare word backlog, so
  extension/src/backlog/ and a docs file named backlog-*.md stay allowed.
  FIRM: the guard joins the cheap tier of run_commit_guards.sh and reports
  through the chain (every violation at once, BL-1252); it is not a second
  hook. FIRM: the three stray files move to backlog/evidence/ in this
  parcel and extension/backlog/ is removed; the BL-1464 stray gets a
  -summary qualifier because a detail file of the same date already
  exists. No role prompt is edited: the refusal text teaches the fix at
  the moment it matters. Minted by the specifier as a second finding of
  the 2026-09-13 ceremony pass (evidence
  backlog/evidence/closing-ceremony-2026-09-13-specifier.md).

invariants:
  - "No commit reaching main adds or modifies a path whose backlog area directory (paused, active, done, hold, evidence, archive, answers-archive, debt, topics) sits under a backlog/ that is not the repository root; the refusal names the root-relative path the file belongs at."

description: |
  ## What is wrong

  `git ls-files | grep -E '(^|/)backlog/' | grep -v '^backlog/'` on main
  today prints one directory: `extension/backlog/evidence/`, holding
  `BL-1278-hardender-20260909.md`, `BL-1478-cleaner-20260911.md` and
  `BL-1464-QA-20260913.md`. Each is a review-pass NONE inventory
  (Article 4.4) that the role meant to write to `backlog/evidence/`; the
  role's shell was in `extension/` (npm runs from there,
  local-engineering.prompt) and the relative path resolved against it.
  `git log --all -- extension/backlog/` shows five such commits by four
  roles: BL-1448 cleaner 2026-09-07 (reverted 4 min later), BL-1278
  hardender 09-09, BL-1478 cleaner 09-11, BL-1464 QA 09-13, BL-1484
  architect 09-13 (reverted 30 s later and rewritten at the root path).

  Nothing at commit time refuses the path. The pre-commit chain
  (`swarmforge/scripts/run_commit_guards.sh`, hook at
  `swarmforge/git-hooks/pre-commit` via `core.hooksPath`, shared by every
  worktree) checks size, ticket deletion, pipeline code on main, handler
  registration and module graph - none looks at where a backlog path
  sits. The forward-time gate (`review_forward_evidence_gate_lib.bb`,
  BL-1307) keys on `backlog/evidence/` and so refuses a forward whose only
  evidence is a stray - which is what the two self-reverts look like -
  but a stray beside a proper file (BL-1278 wrote a detail file at the
  root path a minute later; BL-1464 QA wrote its detail at the root path)
  rides through, and for BL-1478 no cleaner file exists under
  `backlog/evidence/` at all and the parcel still reached the architect
  eight minutes later. Whether that last case is the gate's fail-open on
  a batch role's received-commit lookup is for the coder to confirm; the
  commit-time guard is upstream of every one of these shapes.

  ## What is wanted

  - `swarmforge/scripts/check_nested_backlog_path.sh`: reads the staged
    added/modified paths (`git diff --cached --name-only
    --diff-filter=AM`, the same read `check_commit_size.sh` does) and
    exits 1 when any path contains a backlog AREA segment - `backlog/`
    followed by one of `paused`, `active`, `done`, `hold`, `evidence`,
    `archive`, `answers-archive`, `debt`, `topics` - that is not at the
    repository root. The refusal names each offending path and, beside
    it, the root-relative path it belongs at (the substring from
    `backlog/` on). Exits 0 otherwise; a path that merely contains the
    word `backlog` (`extension/src/backlog/…`, `docs/…/backlog-*.md`,
    `backlog/backlog-schema.md`) is never refused.
  - The guard joins Tier 1 of `run_commit_guards.sh` (`run_guard
    check_nested_backlog_path.sh`), so the chain reports it beside every
    other violation in one refusal (BL-1252).
  - `swarmforge/scripts/test/test_check_nested_backlog_path.sh`, in a
    mkdtemp fixture proven by `git rev-parse --git-common-dir` (BL-1390),
    registered in `swarmforge/scripts/test/suite-manifest.tsv` (BL-1424).
  - The three strays move: `git mv` to `backlog/evidence/BL-1278-hardender-20260909.md`,
    `backlog/evidence/BL-1478-cleaner-20260911.md`, and
    `backlog/evidence/BL-1464-QA-20260913-summary.md` (a
    `BL-1464-QA-20260913.md` detail file already exists there; the
    qualifier is the role prompts' same-day convention). `extension/backlog/`
    is gone afterwards.
  - `docs/reference/BL-632-commit-time-guard-refuses-pipeline-code-on-main.md`'s
    guard list gains the guard (documenter).

  ## How (direction, not mandate)

  - Model the script on `check_ticket_deletion.sh` (bash 3.2-safe `case`
    globs, `set -euo pipefail` inside the guard only). The area list is
    one literal in the script, quoted by the refusal.
  - BL-1252's handler (`bl1252CommitGuardCompleteInventorySteps.js`) and
    `test/lib/commit_guard_fixture_copy.sh` already build a fixture with
    the chain and a second refusing guard; scenario 03 reuses that shape
    rather than staging a 50 MB file.
  - Scenario 04's last step is the census pin (BL-1445): the handler
    re-runs the `git ls-files` grep above against the parcel tree and
    expects zero hits.

  ## Not in scope

  - Editing role prompts to say "run from the repo root"; the guard's
    refusal is the teaching moment and reaches the role that needs it.
  - Changing the forward-time evidence gate (BL-1307) or explaining its
    BL-1478 pass beyond what the coder confirms while building.
  - The pre-merge-commit hook: a merge brings in paths a commit-time
    guard on the source branch already checked.

