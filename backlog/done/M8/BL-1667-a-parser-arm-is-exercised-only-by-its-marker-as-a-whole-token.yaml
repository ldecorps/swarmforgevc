id: BL-1667
title: "multiBranchParserCoverageCheck.ts decides an arm is exercised by substring containment (text.includes(marker)), so an arm whose marker sits inside another arm's marker or inside any test text reads as covered when no test touches it - the /pilot landing gate of BL-755 then lands an untested parser arm; QA's lane run hit the counterexample arms c--a, a00, c-- on 2026-09-20 and the same input reproduces against main's compiled tool: an arm is exercised only by a test text carrying its marker as a whole token, and the counterexample is pinned"
milestone: M8
type: defect
