# high: a broken safety signal in a landing gate (fail-open: an untested
# parser arm lands), plus a standing red - the property that found it
# fails on main whenever the generator draws nested markers (QA's full
# lane run, 2026-09-20; the specifier's one run passed 5/5, the direct
