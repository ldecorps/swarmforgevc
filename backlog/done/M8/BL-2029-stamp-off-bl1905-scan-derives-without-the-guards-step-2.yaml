description: |
  ## Status: hotfix b82ff33bac landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `extension/test/bl1905RealDispatcherScan.property.test.js` part 1
  (60 s budget) calls `scanDir()`, which first derives the dispatcher
  names. `realDispatcherScan.js`'s `deriveClosedSelfRooting` ran BL-998's
  guard `test_shell_fixture_dispatch_isolation.sh` in full under `bash -x`
  and read the LAST `SELF_ROOTING=` line of the trace. That took 32-44 s on
  a loaded host; the scan of 1414 handlers took 2.9 s. QA's property lane
  ran beside coder@2's own, and part 1 went red (evidence 897132b09a; the
  assertion text was not kept, alone it passed at 19.6 s).

  ## What the hotfix changed

  - The guard: after step 1b's closure loop, `SWARMFORGE_GUARD_DERIVE_ONLY=1`
    prints a DERIVE_ONLY line and exits 3. Step 2 assigns no
    `SELF_ROOTING` and was most of the `-x` run. The guard exits 3, never
    0, so a lane that sets the variable by mistake fails rather than
    passing without step 2. Unset, the guard is unchanged.
  - `realDispatcherScan.js`: `deriveClosedSelfRooting` sets that variable.
    `bl1539SelfRootingDerivationLib.js`'s `deriveSelfRooting` (the FIRST
    `SELF_ROOTING=`) is untouched.
  - Measured after: the same ten dispatcher names (14.5 s at load 26), part
    1 8.6 s, the BL-1905 feature 3/3, the BL-1539 feature 7/7, npm test
    11174 passed 0 failed.

  ## What the coder does (all of it)

  1. Run qa_e2e_procedure step 3 once, and the property file once
     (`cd extension && npx vitest run --config vitest.properties.config.mjs test/bl1905RealDispatcherScan.property.test.js`),
     outputs under tmp/.
  2. Read `git show b82ff33bac` against the sections above.
  3. Write backlog/evidence/BL-2029-coder-<date>.md: the results and one
     line saying whether the hotfix matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

