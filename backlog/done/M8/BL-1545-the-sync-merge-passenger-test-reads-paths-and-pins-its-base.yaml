approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is posed
  and there are no ruling_options. FIRM: no production code changes -
  land_step_lib.bb already delivers own.txt alone (case 01) and, with the
  base pinned where it stood at the sync, names BL-1296 alone (case 05); only
  the test's two oracles are wrong. FIRM: case 01 keeps asserting that the
  passenger is NOT delivered and additionally asserts it IS reported excluded
  as the siblings' - BL-1389's report is part of the contract now. FIRM: case
  05 keeps driving the LIVE history (BL-1374's qa_e2e step 6 asked for a
  measured regression) but with BOTH ends pinned and a non-empty-range check,
  so it can never again go green on a walk of zero commits. FIRM: the test
  proves each fixture root under its mkdtemp before the first mutating git
  command (BL-1390) and clears inherited GIT_DIR / GIT_WORK_TREE, because
  under `git bisect run` it committed fixtures into the checkout it ran from
