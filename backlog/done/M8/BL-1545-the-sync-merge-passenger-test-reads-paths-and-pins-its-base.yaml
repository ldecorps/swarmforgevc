  - Minted 2026-09-12 by the specifier the same pass the note arrived, per
    the standing-red rule (Article 3.2.4, 2026-09-05 amendment): type
    defect, severity high, two register rows added in the mint commit
    (shell: the test; acceptance: the BL-1374 feature) with first_seen
    2026-09-04 (BL-1389's landing; QA's green run of the file is dated the
    same day).
  - Not a fold-in: no open ticket names the test or the BL-1374 feature.
    BL-1374 and BL-1389 are done. BL-1544 (active, coder) edits
    land_step_lib.bb's subject attributor, a different site, and the coder
    confirmed the red persists with its change stashed; orthogonal by path.
  - The coder's "misattribute path" reading is corrected here, not
    adopted: both cases are stale test oracles over a lib that answers
    correctly (evidence file, raw own-paths map and the two-base
    comparison). No production change is wanted.
  - Fixture-root proof is scoped to this file only because this file is
    the one being edited and the escape was observed on it; BL-1516
    (paused) owns the repository-wide census.
  - IR-DRY at mint: two `possible-synonym` (medium) findings, both kept on
    purpose. (1) The When "the standing suite runs <path>" (scenarios 01-03,
    each its own run reading a different case) vs scenario 04's "... with
    GIT_DIR exported as that clone's git directory" - a different
    environment is the whole point of 04. (2) Case 01's "shared.txt absent
    from the delivered :paths value" vs "own.txt present in" it - present
    and absent are opposite assertions over the same value; do not collapse.

