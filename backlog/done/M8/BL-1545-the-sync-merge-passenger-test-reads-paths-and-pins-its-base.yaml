invariants:
  - "Every assertion in the test about which paths the replay DELIVERS reads the `:paths` value of own-paths' answer, never the printed whole map: a report key that names a path (`:excluded`, `:passengers`, `:content-clear`) is not a delivery of it."
  - "The live-history case fixes both ends of its walk to pinned commits and asserts the walked range is non-empty before any absent check runs; no case's verdict depends on where origin/main points today."
  - "The test creates no ref, commit or working-tree change in the repository it runs from, whatever GIT_DIR / GIT_WORK_TREE it inherits: every fixture root is proven under the test's mkdtemp (git rev-parse --git-common-dir resolves beneath it) before that fixture's first mutating git command, and a failed proof aborts the run naming the root."

description: |
  ## What is wrong

  `swarmforge/scripts/test/test_bl1374_sync_merge_passengers.sh` (BL-1374,
  landed 2026-09-03) fails on `main` (verified 2026-09-12 at `dbcab2ffb2`):

  ```
  FAIL 01: the passenger file is not this ticket's own path (unexpectedly found 'shared.txt')
  FAIL 05: the passenger's own ticket still owns its file (missing 'BL-1296')
  test_bl1374_sync_merge_passengers: 2 FAILURE(S)
  ```

  `specs/features/BL-1374-a-sync-merge-is-not-credited-with-its-passengers.feature`
  is red with it: `bl1374SyncMergePassengersSteps.js` spawns this test and
  throws on a non-zero exit, so all four scenarios fail. The companion
  `bl1374_sync_merge_passengers_property_runner.bb` is green.

  The coder's note reads the two failures as "misattribute path". They are
  not; the lib is right in both cases and the test's oracles are stale:

  - **Case 01** greps the WHOLE printed `own-paths` map for `shared.txt`.
    The raw answer at HEAD is `{:paths ["own.txt"], :warning nil,
    :passengers #{}, :excluded [{:path "shared.txt", :owners #{"BL-9003"
    "BL-9002"}}], :content-clear []}` - the passenger is NOT delivered;
    it is REPORTED excluded, under the `:excluded` key BL-1389 added
    (`06f1babcaf`, 2026-09-04 16:07; land_step_cli.bb prints it as
    EXCLUDED_SIBLING_PATH). Walked every land_step_lib.bb commit since
    BL-1374's self-audit in a scratch worktree: `ok` through BL-1385,
    `FAIL` from BL-1389 onward. A report of an exclusion read as a delivery.
  - **Case 05** calls `path-owner-tickets root (origin-main-sha root)
    "522584ed85" <BL-1296 yaml>`: the tip is pinned, the base is the LIVE
    `origin/main`. `git rev-list --count origin/main..522584ed85` is 0
    today - origin/main has absorbed the tip - so the walk visits no commit,
    `:owners` is `#{}`, the `contains BL-1296` check fails and the two
    `absent BL-1309 / BL-1328` checks pass VACUOUSLY (BL-1445's census-of-
    zero shape). With the base pinned to `3ea55a2e46` (`5d4486eb08^2`, the
    sync merge's main-side parent; 249 commits in range) the CURRENT lib
    answers `{:owners #{"BL-1296"}}`. QA ran this case green on 2026-09-04;
    it went red when origin/main moved, which no lib commit caused.

  Reproducing it also surfaced a BL-1390 violation: under `git bisect run`,
  which exports `GIT_DIR`, the fixture builders' un-proven `git -C "$root"
  init/add/commit/checkout -b tA/merge` operated on the checkout the test
  ran from - the scratch worktree's HEAD became fixture commit `aea94c41ed`
  and a `tA` branch appeared in the LIVE repository's refs. The specifier
  removed it; `main` and every role branch were untouched.

  Evidence: `backlog/evidence/BL-1545-specifier-unowned-red-repro-20260912.md`.

  ## What is wanted

  The test is green on `main` again and its oracles cannot rot the same
  way, printing one `ok` line per check as today (scenario 01):

  - case 01 reads the `:paths` value and asserts `shared.txt` is not in
    it and `own.txt` is; it ALSO asserts the `:excluded` report names
    `shared.txt` with owners `BL-9002` and `BL-9003` (scenario 02) - the
    same fixture, one more observable, no reworded meaning;
  - case 05 pins its base to `3ea55a2e46` (the sync merge's main-side
    parent) alongside the pinned tip `522584ed85`, asserts the walked range
    is non-empty (`git rev-list --count <base>..<tip` > 0) BEFORE any
    absent check, and keeps asserting BL-1296 owns its file while BL-1309
    and BL-1328 do not (scenario 03); it still skips, as today, when the
    pinned commits are unreachable from the checkout;
  - every fixture builder proves its root (`git -C "$root" rev-parse
    --git-common-dir` resolves under `$TMPROOT`) before its first mutating
    git command and aborts naming the root otherwise; the test clears
    `GIT_DIR` / `GIT_WORK_TREE` at start so an inherited value cannot
    redirect a fixture (scenario 04). Under a `git bisect run`-shaped
    environment the repository the test runs from gains no ref, no commit
    and no working-tree change.
  - Documenter: no registered diagram depicts this test; if a how-to or
    reference names the test's cases or case 05's live regression, it
    names the pinned base. The BL-1374 feature file is NOT edited by the
    coder: its four scenarios are the contract this test proves and they
    go green with it.
  - Register: after QA lands, `backlog/standing-reds.tsv` carries neither
    row this mint adds (shell: the test; acceptance: the BL-1374 feature)
    and `bb swarmforge/scripts/standing_red_register_cli.bb .` reports
    both gone (a row leaves in the land that turns the test green).

  ## How (direction, not mandate)

  Extract the `:paths` vector from the printed map once (the map is
  `pr-str`ed by the `ask` helper; a second `println` of `(:paths ...)` on
  its own `OWN-PATHS-DELIVERED` line is simplest and keeps the map print
  for the exclusion assertion). For the exclusion, grep the `:excluded`
  entry for `:path "shared.txt"` and both owner ids. For case 05, replace
  `(land-step-lib/origin-main-sha root)` with the literal base and add a
  `git rev-list --count` premise check on the range, printed as an `ok`
  line like the other premises; keep the `cat-file -e` skip for both
  pinned commits. For the root proof, a `prove_root` helper called right
  after each `mktemp -d` in `mk_autofix` / `mk_entangled`, mirroring
  BL-1516's wording (`rev-parse --git-common-dir` beneath `$TMPROOT`),
  plus `unset GIT_DIR GIT_WORK_TREE` next to `set -uo pipefail`. The
  acceptance handler can follow `bl1543DriftWiringLiveContractSteps.js`'s
  shape (run the standing test, parse the `ok` lines); scenario 04's
  fixture is a scratch `git clone` of a tiny mkdtemp repository whose
  `.git` is exported as `GIT_DIR` for the run, then `git for-each-ref` and
  `git status --porcelain` are compared before and after.

constraints: >
  Test-only parcel: `land_step_lib.bb`, `land_step_cli.bb` and
  `pipeline_stage_lib.bb` are not edited (BL-1544, active, and BL-1467,
  paused, edit the lib; this parcel shares no path with either). The
  BL-1374 feature file and `bl1374SyncMergePassengersSteps.js` are not
  edited. Case 05 keeps reading the live repository's history - a fixture
  rebuild of the 2026-09-03 shape would prove nothing about the report
  that produced BL-1374. Fixture repositories stay under the test's
  mkdtemp with their own origin (BL-1390). The step handler lands with the
  feature (BL-233). No hand-edited mutation manifests.

out_of_scope: |
  - Any change to what own-paths delivers or reports (BL-1374, BL-1389,
    BL-1473, BL-1481 are done and the lib is right in both red cases).
  - The repository-wide fixture-root census and the removal of stray
    entries (BL-1516, paused): this ticket proves the one file it edits;
    BL-1516 remains the systematic backstop and need not touch this file
    once it lands.
  - Putting the standing shell suite into a gated lane so the next stale
    oracle is seen the day its mechanism changes (the gap BL-1524/BL-1526
    record for the bb suite; a shell test can go red on a landing of
    another ticket, as this one did, with nothing running it).

qa_e2e_procedure: |
  1. Acceptance resolving all four scenarios of the BL-1545 feature file,
     and `specs/pipeline/scripts/run_acceptance.sh
     specs/features/BL-1374-a-sync-merge-is-not-credited-with-its-passengers.feature`
     4/4 green with no edit to that feature or its handler.
  2. `bash swarmforge/scripts/test/test_bl1374_sync_merge_passengers.sh`
     exits 0, prints no FAIL line and the ALL PASS line; the case-01 lines
     include the exclusion report naming shared.txt, BL-9002 and BL-9003;
     the case-05 lines include the non-empty-range premise.
  3. Negative control (oracle): in a scratch copy, revert case 05's base to
     `origin-main-sha` and confirm the range premise FAILS (count 0) - the
     vacuous pass is gone.
  4. Negative control (root proof): `git clone` a tiny mkdtemp repository,
     run the test with `GIT_DIR=<clone>/.git` exported, and confirm
     `git -C <clone> for-each-ref` and `git -C <clone> status --porcelain`
     are byte-identical before and after (or the run aborts naming a
     fixture root); the live repository shows no `tA` branch
     (`git branch --list tA` empty).
  5. `bb swarmforge/scripts/test/bl1374_sync_merge_passengers_property_runner.bb`
     still reports ALL PROPERTIES HOLD.
  6. `bb swarmforge/scripts/standing_red_register_cli.bb .` reports no row
     for either file and `"unowned":[]`.

