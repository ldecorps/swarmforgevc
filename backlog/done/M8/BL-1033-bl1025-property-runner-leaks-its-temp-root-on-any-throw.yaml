id: BL-1033
title: "BL-1025's property runner deletes its temp root only after the last assertion - any throw leaks it, and the temp-dir-trap guard is RED at HEAD"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
assigned_to: coder
priority: 21
direction: normal
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1033-property-runner-temp-root-survives-a-throw.feature

invariants:
  - "A fixture temp root is removed on every exit path - assertion failure, thrown helper, or kill - never only when the runner reaches its last line."

human_approval: approved
approval_context: >
  No open design decision - this is a confirmation that the acceptance
  contract is the right one. The fix shape is settled by precedent twice over,
  in this runner's own directory: bl977_supervisor_progress_property_runner.bb
  adds a JVM shutdown hook with the comment "the end-of-run delete-tree below
  never runs when an exception (or a ...)", and
  bl887_scope_predicate_invariants_property_runner.bb adds the same thing with
  the comment "BL-887 QA bounce (temp-dir-trap)" - meaning this exact class was
  already bounced once by QA under this exact guard. What is firm: the temp
  root must survive a mid-run throw, and the guard must go green without the
  runner's own assertions being weakened. What is negotiable: shutdown hook
  versus try/finally, though the two siblings both chose the hook and keep the
  happy-path delete-tree as well.

source: |
  Reported by the coder via note, 2026-08-22: "2 guards RED at HEAD, not mine:
  BL-1018 tmux-reaper, BL-1025 temp-dir-trap". The tmux-reaper half is a guard
  defect and is ticketed separately as BL-1032; this ticket is the
  temp-dir-trap half, which speccing confirmed is a REAL violation.

  Reproduced at HEAD from extension/:
    npx vitest run test/tempDirTrapGuard.test.js
  FAIL - "the real swarmforge/scripts tree has zero temp-dir-trap violations",
  exactly one violation:
    swarmforge/scripts/test/bl1025_expedite_approval_property_runner.bb:
      creates a temp root (fs/create-temp-dir) but has no shutdown hook and
      no try/finally delete-tree

  Confirmed by reading the file. Line 48 creates the root:

    (def root (str (fs/create-temp-dir {:prefix "bl1025-prop-"})))

  and line 181 removes it:

    (fs/delete-tree root)

  at top level, after the last assertion, in no try/finally and behind no
  shutdown hook. Line 181 is reached only if every preceding form completes.
  The runner's own git helper throws on any non-zero exit (line 54-55,
  `(throw (ex-info (str "git failed: " ...)))`), and the exhaustive-sweep
  guard at line 178 can also fail the run. Either path exits before line 181
  and leaves a bl1025-prop-* directory behind forever.

  This is the engineering rule verbatim (BL-971): "A fixture dir from
  fs.mkdtempSync is removed in a finally, never only after the last assertion -
  a throw or bounce otherwise leaks it forever."

notes: |
  Precedent is in the same directory, twice, and one of the two records that
  QA already bounced this exact class under this exact guard:

    bl977_supervisor_progress_property_runner.bb:49-53 - "the end-of-run
      delete-tree below never runs when an exception (or a ...)"; adds
      (.addShutdownHook (Thread. #(when (fs/exists? fixture-root) ...)))
    bl887_scope_predicate_invariants_property_runner.bb:108-117 - "BL-887 QA
      bounce (temp-dir-trap): shutdown hook mirrors this directory's ..."

  Both keep their happy-path (fs/delete-tree root) as well; the hook is the
  abnormal-exit backstop, not a replacement.

  Blast radius: extension/test/tempDirTrapGuard.test.js runs in the DEFAULT
  unit lane (`npm test` -> scripts/recordTestDuration.js -> vitest over
  extension/test), so every pipeline role currently sees this red and must
  decide whether to baseline it. Severity is set on that broken signal - a
  leaked temp directory on its own would be low.

  BL-1025 is already in backlog/done/ and the violating file is on main
  (71ee902a2), so this is a new defect ticket rather than an amendment to an
  active ticket (BL-317/BL-325).

description: |
  ## What

  Make bl1025_expedite_approval_property_runner.bb remove its temp root on
  every exit path, not only when the run reaches its last form.

  ## Why now

  extension/test/tempDirTrapGuard.test.js is in the default unit lane and is
  RED at HEAD, so every role in the pipeline is currently being asked to
  baseline a red suite. The leak itself is minor; the red gate everyone must
  learn to ignore is not.

  ## How (direction, not mandate)

  Follow the two siblings in the same directory: add a JVM shutdown hook that
  deletes the root if it still exists, and keep the existing happy-path
  delete-tree. A try/finally around the body is an acceptable alternative.
  Do not weaken the runner's assertions or its 32-case exhaustive sweep guard
  to make the run stop throwing - the throw paths are legitimate.

  ## Out of scope

  The tmux-reaper guard's false positive (BL-1032), and any change to
  tempDirTrapGuard.js itself - this finding is correct.

qa_e2e_procedure: |
  From the repo root and extension/, against the parcel:

  1. Baseline the defect on a PRE-fix checkout: `npx vitest run
     test/tempDirTrapGuard.test.js` from extension/ must FAIL with exactly one
     violation, bl1025_expedite_approval_property_runner.bb.
  2. Baseline the leak itself, which the guard only infers. Record
     `ls -d $TMPDIR/bl1025-prop-* 2>/dev/null | wc -l`. In a scratch checkout,
     force an early throw (make the git helper's first invocation fail, e.g.
     point it at a non-repo), run the runner, and confirm the count went UP
     and the directory survives. This is the defect, observed rather than
     assumed.
  3. Run the runner on the parcel normally: `bb
     swarmforge/scripts/test/bl1025_expedite_approval_property_runner.bb`. It
     must pass, report its 32-case sweep, and leave no bl1025-prop-* behind.
  4. Repeat step 2's forced throw against the PARCEL. The runner must still
     fail loudly and non-zero, and the count must NOT go up. This is the
     acceptance signal for the ticket.
  5. Repeat with a kill rather than a throw: start the runner, kill it
     mid-run, and confirm no bl1025-prop-* survives - a shutdown hook covers
     SIGTERM; nothing covers SIGKILL, so record which signal was used and
     what was observed rather than claiming both.
  6. Confirm the assertions were not weakened: the 32-case exhaustive-sweep
     guard must still fail the run when the table stops being swept. Break the
     sweep deliberately in a scratch checkout, confirm red, restore.
  7. Run the guard on the parcel; it must pass over the whole
     swarmforge/scripts tree. Then run the full default unit lane
     (`npm test` from extension/) and record its state, noting any failure
     separately tracked by BL-1032.
