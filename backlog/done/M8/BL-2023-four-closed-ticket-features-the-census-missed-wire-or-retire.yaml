description: |
  ## What is wrong

  Four features of closed (or ticketless) work fail on main because most
  of their steps match no handler. The BL-1937 census (2026-10-03)
  counted only features with NO bound step, so it missed all four: one
  to three generic steps bind elsewhere. None has a register row.

  | feature | scenarios | unbound steps | ticket |
  |---|---|---|---|
  | BL-698-telegram-cursor-operator-command-surface | 26 | 104/106 | done |
  | BL-703-operator-hydrate-autopilot-land | 9 | 45/46 | done |
  | BL-1054-a-hydrate-run-boots-on-specifier-and-stays-there | 6 | 13/14 | backlog/debt |
  | BL-unassigned-active-coordinator-nudge | 2 | 6/9 | none |

  ## What happens next (status: blocked until it does)

  The specifier adjudicates each feature in a dedicated pass (Article
  3.6): is the behaviour it describes still shipped? Wire -> a slice in
  BL-1937's shape (one handler, [coder, qa]); retire -> the scenarios are
  retired (never reworded) and the file removed in a slice. BL-698 at 26
  scenarios is more than one sitting either way and will be cut. Each
  slice takes over its feature's register row; this ticket closes when no
  row names it.

qa_e2e_procedure: |
  Per slice. For this ticket: while it is open, the four register rows
  naming these features are present and owned by BL-2023; when it closes,
  none remains on origin/main.

source: |
  Human directive 2026-09-05 ("we should not sweep failing tests under the
  carpet"). The human, 2026-10-01, verbatim: "Also, update your prompt / c9 stitution: instead of minting a red, hotfix the defect and mint a stampoff."
  Not hotfixed in the pass that found them: 168 unbound step lines across
  four features, two of which may describe retired behaviour, is the
  rule's more-than-one-sitting and needs-a-ruling exception.

