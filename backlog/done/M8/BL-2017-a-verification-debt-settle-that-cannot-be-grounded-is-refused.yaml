description: |
  ## Why

  A settle that cannot name its evidence, its author or its reason would
  close a category with nothing behind it. BL-2015 ships the refusals;
  this slice gates them, and documents both settle verbs now that they
  exist.

  ## What is wanted

  1. `specs/pipeline/steps/bl2017VerificationDebtSettleRefusalSteps.js`,
     the step handler for this feature's Background and its five-row
     Scenario Outline. The step splits `<arguments>` on spaces; the token
     `BLANK` stands for an empty argument. "Writes nothing" means the
     ledger's last commit (`git log -1 --format=%H -- backlog/verification-debt-ledger.yaml`)
     is the same before and after. No production change is expected: a
     refusal that does not name its reason is a BL-2015 defect; send the
     specifier a note naming it rather than patching the CLI here.
  2. The documenter replaces the BL-1783 pointer in
     `docs/how-to/BL-1782-verification-debt-ledger.md` (around line 90)
     with how to discharge and how to waive a category: the two commands,
     what each requires, and that a later hand check counts again from one.

  How (direction, not mandate): start from BL-2015's handler for the
  Background and the helpers; register with
  `registry.defineScoped(re, fn, FEATURE)` where FEATURE is this feature's
  exact `Feature:` text.

  ## Scope
  - The feature file, its step handler, and the how-to section.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2017-a-verification-debt-settle-that-cannot-be-grounded-is-refused.feature`:
     5 ok, 0 fail.
  2. Read `docs/how-to/BL-1782-verification-debt-ledger.md`: it shows the
     `--discharge` and `--waive` commands as the CLI accepts them, and no
     longer says settling is BL-1783's.

source: |
  Split from BL-1783 on 2026-10-05 (coordinator note 016828). BL-1783's
  source, carried verbatim (Article 5.3):

  Raw intake `backlog/INTAKE-mechanize-recurring-llm-verification-20260926.md`
  (human via Claude Code, 2026-09-26), split 1:3 by the specifier the same
  day. BL-1782 is the ledger, this ticket settles a category, and BL-1784
  is the throttle. The human's two sentences, verbatim (Article 5.3):
  "I think we should have tool removing llm work wherever it makes sense"
  "this principle should be a core responsibility of the lean coordinator. Or
  is there a way to enforce this rule even harder on the swarm engine?"
  The intake's own proposal, which this slice builds: "until either a tool
  ships (row discharged, evidence linked, same pattern as
  hardening-debt-ledger's discharged_at/discharged_evidence) or the ticket
  owner explicitly waives it."

  The human, 2026-10-04, verbatim: "We should make the "splitting of ticket if coder cant manage" BAU."

