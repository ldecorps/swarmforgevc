description: |
  ## What is wanted

  Each held ticket the gatherer reports carries `:loop-dialog?`: true when
  that seat's pane shows qwen's loop-detection dialog. BL-1985's check then
  raises the seat-stuck CRIT at once, naming the loop dialog (scenario 01).
  The dialog's own text includes "A potential loop was detected" and its
  option "Keep loop detection enabled"; either one on the pane is enough.

  ## Where to read (only these lines)

  - `swarmforge/scripts/babysitter_check.bb` `gather-role` (~323-375): it
    already captures each seat's pane into `pane-text` (~338, the last 40
    lines) and returns it with the role map.
  - The same file at ~1277: `busy-by-role` is built from those role maps.
    Build `loop-dialog-by-role` the same way, beside it.
  - `held-seat-tickets` (~869-910) and its one call at ~1401: pass the new
    map in and add `:loop-dialog? (boolean (get loop-dialog-by-role role false))`
    to each ticket map, next to `:busy?`.
  - `swarmforge/scripts/test/test_babysitter_check.sh` shows how fixtures
    drive the gatherer without a live tmux; copy its shape for the step
    handler.

  ## What each stage checks

  - Coder: scenario 01; test_babysitter_check.sh and the sweep lib runner
    still pass.

