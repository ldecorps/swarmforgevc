description: |
  ## Status: hotfix 3c03fb2e4f landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What the hotfix changed

  The target file the test confirms is an empty test, so each
  confirmPoleAlone call costs vitest's own startup, about 2 s on a loaded
  host. The third test (an absolute path resolves like its repo-relative
  form) now checks resolveConfirmedFile, confirmPoleAlone's only path
  handling: the spawn's --dir and file name come from that answer and
  nothing else, so equal answers mean the same spawn, which the first test
  runs for real. The roots come from the module's own location, as the
  module computes them, so the check holds in a Stryker sandbox (BL-1761).
  Two spawns remain: the success case and the no-entry case.

  ## What the coder checks

  - The test against the description; resolveConfirmedFile is the only
    path handling between the argument and the spawn (scripts/
    recordTestDuration.js).
  - The file alone: `npx vitest run test/confirmPoleAloneOutcomeShapes.test.js`
    passes 3/3. Evidence: backlog/evidence/BL-1922-coder-<date>.md.

qa_e2e_procedure: |
  1. Read confirmPoleAloneOutcomeShapes.test.js's row from the gather's
     npm test: it passes, and its per-file duration is under 7000 ms; the
     lane reports no new-pole for it.
  2. `grep -c confirmPoleAloneOutcomeShapes backlog/suite-poles.tsv` is 0.

notes: |
  - Minted 2026-10-03 by the specifier under the hotfix-then-stamp-off
    directive. Measured at mint, alone at a 1-minute load of about 4.5:
    before 3.30 s and 2.98 s, after 1.97 s and 1.72 s. QA's 7.1 s was on a
    busier host.
  - No register row named this file (standing-reds.tsv, suite-poles.tsv),
    so the hotfix removed none.

