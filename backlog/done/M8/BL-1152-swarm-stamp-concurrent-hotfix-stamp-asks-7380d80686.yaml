description: >
  WHAT. Operator/Cursor hotfix 7380d80686 is live on local main with trailer
  Hotfix-Certification: pending. Subject: Allow concurrent hotfix stamp
  Yes/No asks on Approvals via Telegram.

  Landed behaviour under review (do not redesign):
  (1) resolveAskOptions reads .swarmforge/operator/hotfix-stamp-asks.json for
  threadIds starting with hotfix-, returning that entry's options without
  requiring the single awaiting-answer.json slot.
  (2) Approvals taps on hotfix-<commit> subjects call hotfix_ledger_update
  --decide (approved/waived) via applyHotfixStampAnswer / spawnSync bb, and
  do not forward those answers through the ordinary bridge ask path.

  WHY. Unticketed hotfixes never become official swarm deals on green tests
  alone (BL-848). Concurrent stamp asks were blocked on the single
  awaiting-answer slot; this land unblocks Approvals certify/waive.

  HOW (direction, not mandate). Walk the acceptance feature against the
  landed sources at 7380d80686; open a narrow follow-up only if review finds
  a defect. Do not rewrite telegram-front-desk-bot in this parcel.

qa_e2e_procedure: >
  (1) At commit 7380d80686, confirm resolveAskOptions has a hotfix- branch
  that reads hotfix-stamp-asks.json.
  (2) Confirm applyHotfixStampAnswer / postToBridgeOrHotfixStamp routes
  hotfix- subjectIds to bb hotfix_ledger_update --decide and not postToBridge.
  (3) Confirm non-hotfix threads still use awaiting-answer.json + postToBridge.
  (4) Record degraded Babashka gate (no mutation/CRAP/DRY). Leave
  Hotfix-Certification pending until human ledger decision.

out_of_scope: |
  - Reverting or rewriting the hotfix.
  - Changing how hotfix-stamp-asks.json is authored/posted.
  - Certifying the ledger row without a human decision.
  - Pushing main to origin (human/QA).
  - Reminting BL-848 process itself.

