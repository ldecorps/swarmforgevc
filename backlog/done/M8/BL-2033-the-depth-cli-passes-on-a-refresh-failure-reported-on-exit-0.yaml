description: |
  ## What is wrong

  `swarmforge/scripts/effective_backlog_depth_cli.bb`'s
  `refresh-recommendation!` runs `emit-throttle-recommendation.js` and
  prints its stderr only `(when-not (zero? exit) ...)`. BL-1874 made that
  CLI exit 0 when its refresh fails and name the failure on stderr, so
  the depth CLI now drops the failure. Its callers
  (`promote_and_route_next.sh`, `promotion_gates_cli.bb`) never log it.

  ## What is wanted

  - Whenever the refresh writes anything to stderr, the depth CLI passes
    it on to its own stderr, whatever the exit. A non-zero exit still adds
    `exit=<n>` as today.
  - Stdout is unchanged: the effective depth alone.

  ## How (direction, not mandate)

  - The change is the `when-not (zero? exit)` condition in
    `refresh-recommendation!` (lines 43-52): print when the exit is
    non-zero OR the trimmed stderr is non-blank.
  - The handler `specs/pipeline/steps/bl2033DepthCliRefreshStderrSteps.js`
    builds the fixture the way `test_effective_backlog_depth_cli.sh`'s
    `mk_fixture` does (lines 22-29: a mkdtemp root holding
    `swarmforge/swarmforge.conf` with `config active_backlog_max_depth 3`).
    It adds a fake `extension/out/tools/emit-throttle-recommendation.js`
    that writes the Examples message to stderr and exits with the Examples
    exit. It runs `bb swarmforge/scripts/effective_backlog_depth_cli.bb <root>`
    with `spawnSync` and keeps stdout and stderr apart. Use `trackedTmpRoot`
    from `./lib/fixtureReaper` for the root, so no cleanup code is needed.
    Validate `<exit>` and `<carries>` against explicit known values.

