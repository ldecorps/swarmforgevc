description: |
  ## Start from the salvage (2026-10-05)

  `refs/swarmforge/salvage/BL-1997` (0ded699725, iq3's drift stash of
  18:43Z) holds the map entry in `held-seat-tickets`, exactly as wanted
  below, and the file reads (edamame clean). Apply it with
  `git diff 0ded699725^1 0ded699725 -- swarmforge/scripts/babysitter_check.bb | git apply`
  after merging main. What it does NOT have, and what is left:
  1. the `load-file` of `local_seat_report_lib.bb` beside the others
     (lines 33-49) - without it the new call does not resolve;
  2. the step handler `bl1997RepeatNotesSeatStuckSteps.js` (copy
     `bl1986LoopDialogSeatStuckSteps.js`, as below);
  3. the runbook paragraph (documenter).

  ## What is wanted

  Each held ticket in `held-seat-tickets` carries
  `:repeat-notes-since-claim`: BL-1996's
  `(local-seat-report-lib/current-session-repeat-notes
  (local-seat-report-lib/qwen-projects-dir) dir taken-ms)` for the seat's
  worktree `dir` and its progress origin `taken-ms`, or 0 when `dir` is
  nil. Check 5b (`check-seat-ticket-stuck`, babysitterd_sweep_lib.bb
  ~322-355, BL-1985) already raises the CRIT at ten and names the count;
  nothing changes there. A seat that is not a local model has no qwen
  session directory, so BL-1996 gives it 0. Scenarios 02-04 (BL-1980's
  numbering, kept).

  ## Where to read (only these lines)

  - `swarmforge/scripts/babysitter_check.bb` lines 33-49: the `load-file`
    list. Add `local_seat_report_lib.bb` the same way.
  - `swarmforge/scripts/babysitter_check.bb` lines 896-925
    (`held-seat-tickets`): `dir` and `taken-ms` are already bound in the
    `let`. Add ONE entry to the returned map, on its own line after
    `:loop-dialog? ...` (line 916). Do not change any closing parenthesis
    or bracket: the new line is a key and a value, both closed on that
    line. The edit hook shows a caret if the file stops reading.
  - `specs/pipeline/steps/bl1986LoopDialogSeatStuckSteps.js` (170 lines)
    is the handler to copy. Keep its fixture root, roles row, held handoff
    and sweep; replace the loop-dialog pane text with a qwen session file
    of N REPEAT notes written under a temp directory, and run the check
    with `SWARMFORGE_QWEN_PROJECTS_DIR` set to it. The roles row's agent
    can stay `claude`: the count comes from the session file. Scenario
    04's commit: commit for the ticket in the fixture worktree after the
    notes are stamped, so `taken-ms` moves past them.
  - Scenarios 03 and 04 hold a dwell under 60 minutes (the held handoff's
    claim a few minutes old), or the dwell trigger fires on its own
    (hotfix 9b4ccdd827).

  ## What each stage checks

  - Coder: scenarios 02-04; test_babysitter_check.sh still passes.
  - Documenter: the babysitter runbook's check 5b section names both new
    triggers.

