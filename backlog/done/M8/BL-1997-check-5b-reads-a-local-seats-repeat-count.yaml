  (48 in cfca2aec); next lever? 743f9eaab6". QA's evidence
  backlog/evidence/BL-1971-QA-20261005.md (743f9eaab6): "The guard fires
  correctly and never causes a halt itself. It did not break any of the
  multi-note loops observed: the model goes on cycling, or repeats the
