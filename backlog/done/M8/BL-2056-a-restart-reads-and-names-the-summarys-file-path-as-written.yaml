  architect: "no boundary moves: the guard's decision and its restart and release paths stay as BL-1991 and BL-1992 built them"
  hardender: "Babashka with no mutation lane (BL-472); the change reads a path and words a message, the restart state write is unchanged, and the outline pins each path form"

acceptance: specs/features/BL-2056-a-restart-reads-and-names-the-summarys-file-path-as-written.feature

