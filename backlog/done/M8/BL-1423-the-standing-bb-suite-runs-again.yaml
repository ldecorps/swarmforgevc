  the failure on main, traced both files to hotfix 27d6ab8630, and found
  that no gate could have caught a hotfix (see description), which is
  companion BL-1424. The two are deliberately separate tickets: this one is
  urgent and trivially small; the guard is prevention and touches the
  commit-guard chain's hand-kept copies.

  Lane decision recorded here so no role re-derives it: standing for both.
  Neither is slow, manual, or live-only; the manifest header forbids
  excluding a runnable test. The runner passed when the specifier ran it on
  main today (ALL TESTS PASS); the wiring test was not run from the agent
  pane (it boots a daemon; a leaked fixture daemon confuses liveness) and
  is verified by the coder per the description.

  INVEST at mint: Independent (BL-1239/BL-1240/BL-1342 all landed; BL-1424
  is a sibling, not a dependency either way), Negotiable (row position and
  verification order are direction), Valuable (one outcome: the standing
  suite runs), Estimable (two lines plus a two-scenario handler; low),
  Small (two scenarios, one invariant), Testable (real inventory CLI and
  --list on the parcel tree; live steps in qa_e2e_procedure).

