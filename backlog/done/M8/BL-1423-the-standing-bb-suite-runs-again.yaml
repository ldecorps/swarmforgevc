id: BL-1423
title: "The standing Babashka suite has refused every run since 2026-09-02: hotfix 27d6ab8630 added handoffd_supervisor_startup_grace_test_runner.bb and test_handoffd_outbox_vanished_parcel_wiring.sh with no suite-manifest.tsv row, BL-1240's gate fires only at a parcel's git_handoff so a hotfix never met it, and BL-1342's stamp-off certified behaviour only; both files get a standing row and run_bb_suite.sh runs again"
milestone: M8
type: defect
severity: high
# high: a broken safety signal, not a live fault. run_bb_suite.sh runs the
# inventory gate first and exits 1, so all 486 standing tests have been
# unrunnable through the suite entry point for three days, for every role
# (the refusal reads "the suite inventory is out of date - fix it before
