id: BL-1424
title: "A commit that adds a test file under swarmforge/scripts/test/ with no suite-manifest.tsv row is refused by the pre-commit guard chain: BL-1240 fires only at a parcel's git_handoff, so hotfix 27d6ab8630 (a human commit straight onto main) added two unregistered files on 2026-09-02 and the standing suite refused every run for three days before anyone was told; the guard judges only the files the commit itself adds, never pre-existing drift"
milestone: M8
type: defect
severity: medium
# medium: prevention of a recurring class, not a present fault. The live
# fault is BL-1423's two rows; this closes the path that produced them. A
# hotfix is committed outside the pipeline several times a week (the
# hotfix ledger has 30+ rows) and each one that adds a test file goes dark
# until someone runs the whole suite - the shape BL-1240 ended for parcels.
status: todo
epic: swarm-reliability
priority: 12
direction: swarm-reported
