human_approval: approved
approval_context: >
  One deliberate scope call to sign off or overturn, plus a new feature draft.

  The call: this ticket fixes the PRODUCTION liveness probe (a real macOS
  facility behind the existing shared primitive), rather than marking the three
  tests skipped-on-macOS. Skipping is cheaper and is defensible on the argument
  that both consumers already degrade in their documented-safe direction. It is
  rejected here because degrading is not the same as being correct: on macOS the
  sandbox sweep's live-process guard never fires at all, and the fixture reaper
  never kills an orphan — the exact job it exists for — and a skipped test would
  make that permanent and invisible. That is the same "a check with no standing
  consumer rots" failure BL-420 -> BL-459 -> BL-872 -> BL-874 has now produced
  four times. Overturn this if you want the cheap fix.

  Deliberately NOT in this ticket: the other /proc readers found by the same
  grep (`babysitter_check.bb`'s /proc/meminfo, already handled by BL-802;
  `cursor_bridge_supervisor.bb`'s /proc/<pid>/cmdline; `check_swarm_detached.bb`
  via read_proc_sigignore.sh). They are separate call sites with separate
  fallbacks and would push this past one slice.

