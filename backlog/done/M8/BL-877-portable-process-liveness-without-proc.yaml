description: |
  ## What

  Process liveness is detected by listing `/proc` and reading each pid's cwd and
  open fds (`swarmforge/scripts/proc_fd_scan_lib.bb`, the shared primitive). On
  macOS `/proc` does not exist, the `fs/list-dir` throws, and both callers catch
  it and return empty:

  | caller | on Linux | on macOS (degraded) |
  |---|---|---|
  | `operator_runtime.bb` `live-process-paths!` (~line 763) | set of paths held by live processes; a stale sandbox rooted by one is KEPT | `#{}` — nothing is ever seen as live, so a stale-by-mtime sandbox **is deleted out from under a live process** |
  | `fixture_reaper_sweep_lib.bb` `live-process-paths!` (~line 107) | pid -> paths map; pids rooted in a reaped root are KILLED | `{}` — no pid is ever rooted, so the tree is deleted but **the orphaned process keeps running** |

  Note the two degrade in OPPOSITE directions, and each file's own comment
  argues its own direction is the safe one. Both comments are locally true and
  neither is the point: on the declared host OS the guard simply never fires.

  Three tests assert the Linux-only behaviour and are red on macOS:

  - `swarmforge/scripts/test/test_operator_runtime_sandbox_sweep.sh` — "a stale
    known-prefix sandbox with a live process rooted in it is kept" (line 93)
  - `swarmforge/scripts/test/test_operator_runtime_fixture_reaper_sweep.sh`
  - `swarmforge/scripts/test/test_operator_runtime_fixture_reaper_sweep_bounded_progress.sh`
    — "the remaining orphaned process is killed too" (line 92)

  ## Why it matters

  macOS is a declared target OS (local-engineering.prompt, Tech Stack) and is
  the host this swarm runs on. `swarmforge/scripts/test/` is the sole gate for
  the Babashka layer (engineering.prompt, Startup Tools: no mutation, CRAP or
  DRY there). So a safety guard is inert on the machine that needs it, and the
  one signal that would say so is a test nobody on this host can pass.

  The sandbox-sweep direction is the sharper of the two: deleting a directory a
  live process is rooted in is a real fault, currently held off only by the
  independent staleness threshold and allowlist.

  ## Constraints

  - No GNU/Linux-only dependency and no new package manager install. Stock macOS
    userland only, per engineering.prompt's "stock macOS /bin/bash 3.2" rule.
  - Keep ONE implementation. `proc_fd_scan_lib.bb` is already the shared
    primitive with two consumers; the platform split belongs inside it, callers
    unaware — the same shape `portable_stat_lib.sh` and BL-874's
    `portable_time_lib.sh` follow.
  - Reference, not prescription: `/usr/sbin/lsof` is present on this host and
    reports both cwd and open files per pid (`lsof -a -d cwd`, `lsof -F pn`).
    The implementer chooses the facility; cost matters, because both callers run
    on a sweep tick, and the existing code is careful to scan ONCE per pass
    rather than once per candidate. Preserve that.
  - Behaviour of the three tests must not change — each still asserts what it
    asserted before. If a scenario genuinely cannot hold on a host with no
    liveness facility at all, it fails loud there; it is not quietly skipped.

  ## Out of scope

  - The `setsid` gap surfaced by the same coder pass — that is BL-878.
  - The other `/proc` readers listed in `approval_context` above.
  - Any change to the staleness thresholds, allowlist, or bounded-delete cursor
    logic. This ticket restores the liveness input; it does not retune the
    policy that consumes it.

  ## e2e QA procedure

  1. Confirm the host has no `/proc`: `ls /proc` errors.
  2. Run the three scripts above with `bash <path>`; every one exits 0.
  3. Confirm the guard actually bites rather than passing vacuously: in
     `test_operator_runtime_sandbox_sweep.sh`, the "live process rooted in it is
     kept" check must pass while the sibling stale-and-unrooted entry is still
     reaped in the same run — a probe that reports everything as live would keep
     both and turn that sibling check red.
  4. Confirm the reaper still kills: the orphaned-process check must observe the
     process actually gone, not merely absent from a scan.

notes: |
  - Fourth occurrence of the same class in this area (BL-420 -> BL-459 ->
    BL-872 for temp-dir traps; BL-874 for GNU-only relative time; this for
    Linux-only process introspection). The common cause is the same each time: a
    check whose only consumer is a test that cannot run on this host.
  - BL-413 (`backlog/done/BL-413-stale-sandbox-sweep.yaml`) is where the
    `/proc` scan was introduced, 2026-07-16 — a month before BL-874 and
    unrelated to it. BL-458 extended it from cwd-only to cwd+open-fds after an
    architect bounce; that bounce's reasoning (a process holding a file open
    inside a root is as rooted as one that cd'd there) is preserved in
    `fixture_reaper_sweep_lib.bb`'s comment and must survive this change.
  - BL-802 is the precedent for the fallback shape on the sibling `/proc/meminfo`
    read (`babysitter_check.bb`): try the Linux path, fall back to a native
    facility, degrade loudly.

