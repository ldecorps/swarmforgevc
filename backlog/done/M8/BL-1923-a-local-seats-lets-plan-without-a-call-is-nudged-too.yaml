description: |
  ## Status: hotfix 59a376845a landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  BL-1920's announcement detector (_ANNOUNCE in
  local_model_tool_call_shim.py) matched "I will", "I'll", "I am going
  to", "I'm going to" and "let me" at a sentence or line start. qwen2.5-coder
  also announces with "Let's ...", most often as the last line of a
  numbered plan ("Let's proceed with these steps."). Those replies went
  back to qwen with no call and no nudge, the seat sat idle, and handoffd's
  chase sweep respawned it 100-160 s later, losing the conversation.

  ## What the hotfix changed

  _ANNOUNCE also matches "let's" (straight or curly apostrophe) and "let
  us", with the same sentence-or-line-start anchor, so a mid-word
  "outlet's" is not a trigger. Nothing else changed: the NO_TASK guard,
  the one-nudge limit and the merge of the nudged call are BL-1920's.
  Measured: the live stall replayed with the nudge after it got read_file
  on the manifest 3 of 3 (step 1 of the seat's own plan).

  ## What each stage checks

  - Coder: the regex against the description, and the new unit case
    test_a_lets_plan_is_nudged (three replies from the seat's own words
    nudged, "The outlet's tests passed." not). Evidence:
    backlog/evidence/BL-1923-coder-<date>.md.

qa_e2e_procedure: |
  1. `bash swarmforge/scripts/test/test_bl1917_local_model_seat_url.sh` prints ALL PASS
     (its case 0 runs the shim's unit cases, 23 at mint).
  2. `node specs/pipeline/cli.js specs/features/BL-1052-a-role-seat-can-be-staffed-by-a-downloaded-local-model.feature`
     passes (measured at mint on HEAD 4b0e9adb96: 9 of 9 ok).
  3. handoffd's log shows no endless-loop halt naming the coder since the
     live shim restarted onto this code (2026-10-03 11:24:22Z).

