description: |
  ## What

  BL-637 was explicitly about teardown scripts reporting success/failure
  they didn't achieve, in a repo that runs multiple worktrees side by side
  every day. Its own acceptance suite fails 8/8 the moment a second
  worktree's handoffd.bb is actually running — exactly the condition the
  ticket exists to handle correctly. Running the acceptance gate in an
  environment with only one worktree active would hide this; this repo
  routinely has several worktrees live (coder, cleaner, architect, hardener,
  documenter, QA all run their own).

  ## Question to answer

  Did the pilot run BL-637's acceptance/shell suite at all before landing,
  and if so, in what environment (single-worktree sandbox vs. this repo's
  normal multi-worktree reality)? Harden `/pilot` (or the hardener/QA gate
  contract) so lifecycle/teardown-script tickets are verified against a
  realistic multi-worktree fixture, not just an isolated one.
qa_e2e_procedure: >
  (1) Lifecycle ticket + single-worktree-only run → land refused. (2) Fixture
  with ≥2 worktrees and sibling handoffd → acceptance runs before land.
  (3) Green multi-worktree run lands with receipt metadata. (4) Failed run
  inert refuse.
