approval_context: >
  Found by the 2026-07-31 master-diff review, not reported by any gate. Needs a
  decision because the two honest repairs point opposite ways:

  Option A — finish the retirement: serve a health document at `/lets-talk`
  (`ok`, `talkClient`), retire or redirect the Mini App Let's Talk route, and
  update BL-696's how-to and the CRAP gate to match. The working tree's step
  rewrite then becomes correct.

  Option B — revert the step rewrite: keep the Mini App Let's Talk route as the
  contract says today and drop the working tree's changes to
  `specs/pipeline/steps/bl696LetsTalkSteps.js`, `consoleMenuUiHtml.ts` and the
  BL-696 how-to, leaving retirement to the parked Live Screen migration intake.

  Either way the CRAP gate scope must stop excluding a file the bridge still
  serves. Recommend Option A only if Mini App Let's Talk really is retired;
  otherwise B, because the console entry is already gone in the working tree
  while the route still answers.

description: |
  ## What

  The uncommitted master working tree partially retires Mini App Let's Talk in
  favour of Bubble, and the halves do not meet:

  - `specs/pipeline/steps/bl696LetsTalkSteps.js` was rewritten to fetch
    `GET /lets-talk`, `JSON.parse` the body, and assert `health.ok` and
    `health.talkClient == "bubble"`.
  - `extension/src/bridge/bridgeServer.ts` still answers that route with the
    Mini App HTML page, and the string `talkClient` is produced nowhere in
    `extension/src`. Parsing an HTML body as JSON throws, so those BL-696
    scenarios cannot pass as written.
  - `docs/how-to/BL-696-miniapp-lets-talk-cursor-audio.md` was cut by ~189 lines
    to match the retirement that did not happen on the server.
  - `extension/package.json` dropped `src/bridge/letsTalkUiHtml.ts` from
    `crap:lets-talk-cursor-bridge`, so a 61k file the bridge still serves left
    the CRAP gate's scope while remaining live. `specs/features/BL-697-*.feature`
    still depends on that surface.

  The console half IS done: `consoleMenuUiHtml.ts` replaced the Let's Talk entry
  with a "talk lives in Bubble" note, so the entry point is already gone while
  the route still answers.

  ## Why this is a defect and not a feature

  This is the BL-761 class made concrete — an acceptance contract that cannot
  run reaching the pipeline — plus a quality gate narrowed to exclude code that
  is still live. Nothing failed loudly: the rewrite weakened assertions rather
  than breaking a build, and a gate that stops measuring a file reports green.
  Adopting this chunk unexamined would land both.

  ## Scope

  Resolve the halves per the approved option, and restore the CRAP gate to cover
  every Let's Talk surface the bridge still serves.

  ## Out of scope

  - The full Live Screen migration from Mini App to Bubble. That intake is
    parked in the backlog root awaiting a human answer to a pending specifier
    question; this ticket only reconciles what the working tree already changed.
  - Bubble remote config and hold-music catalog (BL-765).
  - Shared-token inbound fan-out (BL-764).

