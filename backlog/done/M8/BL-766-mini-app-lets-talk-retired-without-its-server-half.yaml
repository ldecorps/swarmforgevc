notes: |
  Do not treat the shrunken CRAP file list as cosmetic. A gate that stops
  measuring a live file is the same failure shape as a test that stops
  asserting: it reports green because it looks at less.

  e2e QA procedure: run the BL-696 acceptance feature against a live bridge and
  confirm every scenario executes and passes rather than being skipped; request
  `/lets-talk` and confirm the body matches what the steps assert; run
  `npm run crap:lets-talk-cursor-bridge` and confirm every Let's Talk source the
  bridge still serves appears in the report.
