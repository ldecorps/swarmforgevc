id: BL-1028
title: "promote_and_route_next.sh answers every commit_integrity refusal with a raw unlocked `git commit`, so a lock-timeout - the exact concurrent-writer case the lock exists for - is overridden rather than obeyed, and if that fallback also fails the `git mv` it staged is left in the shared index with nothing to unwind it"
milestone: M8
type: defect
severity: high
# high, not critical: it needs the integrity CLI to refuse first, so it is not
# the common path and nothing is down. But when it does fire it defeats a
# safety guard silently and writes to the shared master checkout every role
# commits from - a broken safety signal, which is the high bar. Not medium:
# the bypass produces a commit that the guard explicitly refused, and the
# residue case leaves global staged state that any later writer can sweep
# into an unrelated commit (the master-checkout failure mode).
status: todo
epic: swarm-reliability
priority: 60
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1028-promotion-must-not-bypass-a-refused-integrity-commit.feature

invariants:
  - "A promotion never produces a commit that the integrity CLI refused - for any refusal reason, present and future, including ones added after this ticket."
  - "A promotion that does not commit leaves the index exactly as it found it - no rename it staged itself survives the call."

human_approval: approved
approval_context: >
  Needs sign-off on ONE decision: what a refusal should do. The fix direction
  below is to obey the refusal - unwind the staged `git mv` and report failure
  loudly, leaving the ticket in paused/ for the next promotion attempt. The
  alternative is to keep a fallback but make it narrow and honest (retry, or
  fall back ONLY when the CLI is absent, never when it refused). What is firm
  either way: a refusal must never be answered by a raw `git commit`, and no
  path may leave the rename staged. The `else` branch for a target repo with
  no CLI at all is deliberate degradation and stays - scenario 04 pins it.

source: |
  Reported by the coordinator 2026-08-21 as "index-left-dirty regression in
  commit_integrity on renames today - mint defect".

  Probed before speccing rather than minted as filed, and the diagnosis in the
  report is wrong on both halves:

  - There is NO regression in commit_integrity. Neither
    `swarmforge/scripts/commit_integrity_lib.bb` nor `commit_integrity_cli.bb`
    has been touched since before 2026-08-14 (`git log --since` on both paths
    is empty). Its suites are green: `test_commit_integrity_lib.sh` and
    `commit_integrity_lib_test_runner.bb` both report ALL TESTS PASSED, and
    `test_commit_integrity_cli.sh` passes 5/5 including, verbatim, "PASS:
    commit_integrity_cli: a close-guard rejection leaves the caller's
    pre-staged rename exactly as it found it". (Running
    `commit_integrity_856_scenarios_cli.bb` or `commit_integrity_test_cli.bb`
    bare prints a stack trace - that is the lib's own required-argument guard
    firing on empty argv, correct fail-loud behaviour, not a failure. They are
    driven with arguments by the step handlers.)

  - Leaving a caller's pre-staged rename in the index is commit_integrity's
    CONTRACT, not its bug. BL-856 restores the index to the state it found,
    which for this caller already includes the `git mv`. So the symptom the
    coordinator saw is produced by the CALLER, and commit_integrity needs no
    change for this ticket.

  The real fault is in `swarmforge/scripts/promote_and_route_next.sh`:

    230: git -C "$ROOT" mv "$SRC" "$DEST"          # stages, unconditionally
    ...
    255: if [[ -f "$SCRIPT_DIR/commit_integrity_cli.bb" ]]; then
    256:   bb "$SCRIPT_DIR/commit_integrity_cli.bb" "$ROOT" \
    257:     --message "Promote ${ID}: paused -> active for ${ROUTE_ROLE}" \
    258:     --path "backlog/paused/$BASE" \
    259:     --path "backlog/active/$BASE" \
    260:     || {
    261:       git -C "$ROOT" add -A "backlog/active/$BASE"
    262:       git -C "$ROOT" add -u "backlog/paused/$BASE" 2>/dev/null || true
    263:       git -C "$ROOT" commit -m "Promote ${ID}: ..."
    264:     }

  `commit_integrity_cli.bb` exits 1 whenever `:success` is false. The lib
  documents `:reason` as one of `:no-git-dir`, `:lock-timeout`, `:add-failed`,
  `:commit-failed`, `:verify-mismatch`, and the CLI additionally exits 1 on a
  close-guard rejection. The `||` treats all of them identically.

  Note the `||` fires only when the CLI is PRESENT and REFUSED - the "CLI
  absent" case already has its own `else` branch at 265-268. So the fallback's
  entire job is to override refusals.

  Worst case is `:lock-timeout` and `:verify-mismatch`: both mean a concurrent
  writer is active in the shared checkout, which is precisely what the lock
  exists to serialise, and the fallback answers by running an unlocked
  hand-rolled `git add` + `git commit`. commit_integrity's own header says it
  exists so that callers commit "through the same locked
  commit_integrity_cli.bb, never a hand-rolled `git commit` that would race
  the roles committing to main". This caller does exactly that, in the one
  situation where it is most dangerous.

  Second fault, and the coordinator's actual observed symptom: if the fallback
  `git commit` ALSO fails, the `git mv` from line 230 is still staged and
  nothing unwinds it. The index is left holding a paused -> active rename that
  no commit references, in the shared master checkout - global state the next
  writer that commits without a pathspec sweeps into an unrelated commit.

  NOT a duplicate of BL-1024 (active). BL-1024 is the expedite run's
  `move-ticket!` leaving parked tickets and staged moves with no owner -
  different file (`expedite_cli.bb`), different trigger (a whole expedite run),
  different fix (naming the leavings in the closing summary). This ticket is
  the promotion path's missing rollback and its refusal bypass. They share a
  symptom - staged uncommitted backlog renames in master - which is very
  likely why the coordinator read today's BL-1024 leavings as a
  commit_integrity fault. Fixing either alone still leaves the other.

description: |
  ## What

  Make `promote_and_route_next.sh` obey a refusal from
  `commit_integrity_cli.bb` instead of overriding it, and make any promotion
  that does not commit leave the index exactly as it found it.

  ## Why

  Two independent failures in the same block, both silent:

  1. A refused commit is committed anyway, by a raw unlocked `git commit`, in
     the concurrent-writer case the lock exists to serialise. The guard
     reports "refused" and the work lands regardless.
  2. When that fallback also fails, the `git mv` staged at line 230 is left in
     the shared index with nothing to unwind it.

  ## How (direction, not mandate)

  Obey the refusal: unwind the staged rename and exit non-zero naming the
  reason, leaving the ticket in `paused/` for the next attempt. If a fallback
  is kept at all it must be narrow and honest - never a raw commit answering a
  refusal. Whatever the shape, both invariants must hold, and the rollback
  must be scoped to the two paths this script staged itself - never a blanket
  `git reset`, which would discard other roles' staged work in the shared
  checkout.

  The `else` branch at 265-268 (no integrity CLI present in the target repo)
  is deliberate degradation for a target that never had the guard. It stays;
  scenario 04 pins it so a fix does not quietly delete it.

  ## Scope

  - `swarmforge/scripts/promote_and_route_next.sh` - the block at 230 and
    255-268.
  - A shell test driving the script with a stubbed CLI that refuses, asserting
    no commit, a clean index, and the ticket back at its paused path.
  - `swarmforge/scripts/commit_integrity_lib.bb` and `commit_integrity_cli.bb`
    are OUT of scope - verified green and behaving to contract.

qa_e2e_procedure: |
  In a scratch clone (never the live master checkout):

  1. Put an eligible ticket in `backlog/paused/`.
  2. Shadow `commit_integrity_cli.bb` with a stub that prints
     `{"success":false,"reason":"lock-timeout"}` and exits 1.
  3. Run `promote_and_route_next.sh`.
  4. Assert: `git log` has no promotion commit; `git status --porcelain`
     shows nothing staged (no `R ` entry); the ticket file is still at its
     `backlog/paused/` path; the script exited non-zero and named
     `lock-timeout`.
  5. Repeat step 2 with a stub that exits 1 for a close-guard rejection and
     confirm the same four assertions.
  6. Restore the real CLI and run the promotion again: it commits normally,
     the ticket is at its `backlog/active/` path, and the index is clean.
  7. Remove the CLI entirely and run once more: it still promotes and says it
     committed without the integrity guard (scenario 04).

notes: |
  Minted from a coordinator note whose stated diagnosis did not survive
  probing. The note asked for a defect "in commit_integrity"; commit_integrity
  is green and behaving to contract, and the fault is in its caller. Recorded
  here rather than silently re-scoped so the reasoning is walkable.

  IR-DRY (vendored APS) run on the feature file: 4 findings on the first pass,
  3 after fix. The one resolved was accidental drift - the Background read "a
  checkout whose index holds nothing staged" while scenario 03's Then read
  "the index holds nothing staged"; aligned to one wording, so one handler
  serves both. The 3 remaining are deliberate assert/refute contrasts the
  checker scores on token overlap ("a commit is created" vs "no commit is
  created", "accepts" vs "refuses", "active path" vs "paused path") -
  normalising any of them would destroy the behaviour being contrasted.
  Gherkin lint gate: clean parse.

  No `required_wiring:` - this fixes an existing call site rather than
  building a mechanism that needs one.

assigned_to: coder
