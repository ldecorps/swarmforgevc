human_approval: approved
approval_context: >
  One scenario is added to a landed feature file and a CLI's exit status
  changes, so it would ordinarily need a tap; it is minted approved under
  the 2026-09-17 operator hotfix (severity defect, no choice posed, no
  ruling_options). FIRM: a source that is neither on swarmforge-QA nor
  itself a recorded replay with an approved source still grants nothing
  (BL-1405 scenario 03 unchanged). FIRM: the chain is bounded (three
  records) and a cycle grants nothing. FIRM: the writer still writes the
