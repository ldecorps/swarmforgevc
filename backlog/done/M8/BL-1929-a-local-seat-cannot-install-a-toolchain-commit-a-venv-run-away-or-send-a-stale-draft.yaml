description: |
  ## Status: six hotfixes landed the fix

  This parcel is their stamp-off: review them, do not re-apply them.

  ## What was wrong

  - Observation 11 (12:31Z): given "run the tests", the qwen2.5 seat ran
    `sudo apt update && sudo apt install python3 && pip install pytest`; the
    password prompt hung the call to its 120 s bound and the seat stopped,
    asking for Python to be installed by hand. Python 3.12 is installed.
  - BL-1916's bounce (12:55Z): on a review-only stamp-off with nothing to
    commit, git answered "untracked files present (use git add to track)";
    the seat ran `git add tests/ venv/` and committed 1,019 virtualenv files
    and an unrelated pytest file (10aaa15e97, 375k lines). QA's D4: the extra
    paths also took bl1699's `git ls-files` past Node's 1 MB exec buffer.
  - 13:22Z: one text-only reply repeated "Let's execute these commands in
    sequence" for 7127 tokens (about 9 minutes of GPU) until qwen cut it.
  - 13:00:39Z: holding QA's BL-1916 bounce, the seat sent tmp/handoff.txt,
    a draft left from BL-1858 (task BL-1858, commit 127768f186). Its audit
    challenge had been answered in an earlier session, so it queued at once
    and reached the hardender (002384). Task and commit agreed, so the
    coherence gate passed it.

  ## What the hotfixes changed

  - fb62eaa9e8, swarmforge.sh write_local_model_qwen_settings: the seat's
    .qwen/settings.json carries `permissions.deny` for `sudo *`, `apt *`,
    `apt-get *`, `pip install *` and `pip3 install *` (a hard denial even
    under YOLO, probed before the hotfix); npm stays allowed.
  - 358be6be62, .gitignore: `venv/` and `.venv/`.
  - 479155f733, swarmforge/packs/qwen2.5-coder-14b-q5km.Modelfile:
    `PARAMETER num_predict 2048` (every one of the seat's 339 replies that
    day above 1452 tokens was a runaway); applied with `ollama create`.
  - 52a5036fa8, swarmforge/scripts/in_process_ticket_guard_lib.bb (pure
    `decide`) called from swarm_handoff.bb's validate: a git_handoff whose
    leading task ticket is not the ticket of the sender's top-level
    in-process git_handoff (task header) or `Work <id>` note is refused with
    IN_PROCESS_TICKET_MISMATCH, before the audit challenge and any mailbox
    write. Master-resident senders, the dispatch-gap auto-route, a held note
    naming no Work ticket and an unreadable mailbox all pass.

  - ff104fc258, swarmforge/packs/ista-iq3s-coder.Modelfile: num_ctx 49152
    -> 32768 (applied with ollama create). qwen 0.24.7 compacts at
    min(0.85 x window, window - 20000 - 13000), so 49152 compacted at 16152
    tokens and the iq3 seat compacted on every turn (one tool call per 5-10
    minutes for 1.5 hours on BL-1916's bounce); 32768 compacts at 27852. The
    first turn measures ~12.9k prompt tokens; BL-1801's fit check passes.
  - d65a268de5, swarmforge.sh write_role_launch_script: BL-1840's dead-zone
    gate ran only on a full ./swarm launch, so the one-seat regeneration that
    swapped the coder to iq3 put the 49152 window live. A local-model seat's
    script is now written only after the same dead-zone CLI passes; a refusal
    leaves the previous script byte-identical, SWARMFORGE_LOCAL_WINDOW_OVERRIDE
    writes it with a warning, an unknown window is never refused. Two
    fixtures moved their context-length fallback from 49152 to 65536.

  ## What each stage checks

  - Coder: each hotfix against this description and the invariants; the
    four tests below; that no gate or test sends a cross-ticket git_handoff
    on purpose (the mint sweep ran 8 swarm_handoff shell tests and the 20
    features whose handlers drive swarm_handoff; its three pre-existing reds
    are BL-1930's). Evidence:
    backlog/evidence/BL-1929-coder-<date>.md.

qa_e2e_procedure: |
  1. `bb swarmforge/scripts/test/in_process_ticket_guard_lib_test_runner.bb` ends "ALL TESTS PASSED".
  2. `bash swarmforge/scripts/test/test_swarm_handoff_refuses_other_ticket_than_in_process.sh` ends "ALL PASS".
  3. `bash swarmforge/scripts/test/test_bl1829_local_model_qwen_settings.sh` ends "ALL PASS: BL-1829 write_local_model_qwen_settings" (measured at mint).
  4. `node specs/pipeline/cli.js specs/features/BL-1565-a-git-handoff-to-the-coordinator-is-refused-at-send.feature`
     passes (measured at mint: 9 of 9 ok on HEAD 52a5036fa8).
  5. `ollama show qwen2.5-coder-14b-q5km:latest --parameters` prints num_predict 2048 and num_ctx 32768.
  6. `git check-ignore -v venv/pyvenv.cfg` from a worktree prints the .gitignore `venv/` rule.
  7. `ollama show ista-iq3s-coder:latest --parameters` prints num_ctx 32768, and
     `bb swarmforge/scripts/local_model_window_gate_cli.bb dead-zone --role coder --model ista-iq3s-coder:latest --endpoint-url http://127.0.0.1:11434/v1 --context-length "" --override 0`
     prints `TRIGGER: 27852` and exits 0 (measured at mint).
  8. `bash swarmforge/scripts/test/test_local_model_launch_script_dead_zone_gate.sh` ends "ALL PASS: local-model launch script dead-zone gate".

