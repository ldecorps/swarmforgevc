approval_context: >
  Nothing controversial in the fix: trap-based cleanup on catchable
  signals, SIGKILL residue acknowledged as unavoidable and left to the
  existing recognizable name pattern, no sweeper built. Severity medium
  (real leak, inert until the hook re-enables, bounded by OS TMPDIR
  reaping). ONE TIMING WINDOW for you to weigh: the coordinator's
  verification (7a8c06eab) argues cleanup is worth having BEFORE the hook
  re-enables, but your standing directive "reenable the hook after 960"
  plus BL-960's required_wiring mean re-enable rides BL-960, and this
  ticket (depends_on BL-960) lands after it - so the leak accumulates
  from the first interrupted command post-re-enable until this lands,
  one small file per kill. If that window matters to you, qjump this
  ticket the way you qjumped BL-960; approving as-is accepts the window.

notes_coordinator_hold: >
  COORDINATOR HOLD 2026-08-20: not promoted. THREE independent blockers:

  1. depends_on: [BL-960] UNSATISFIED - BL-960 is in backlog/active/, not
     backlog/done/ (BL-957's ruling: only done/ satisfies a dependency).
  2. human_approval: pending.
  3. Capacity: active/ holds 7 against an effective cap of 7.

  RANK WHEN UNBLOCKED: defect/medium, so NOT expedited (Article 3.2.4); queues
  on priority 40, behind BL-962 (defect/high, expedited) and BL-963 (30).

  SEQUENCING FLAG FOR THE SPECIFIER / HUMAN - not an override, a surfaced
  consequence. This dependency direction means the LEAK SHIPS BEFORE ITS FIX.
  BL-960 restores the tool_miss_heal PreToolUse hook that operator commit
  3bac496ec disabled; BL-965 makes its mktemp cleanup kill-safe. With
  BL-965 gated behind BL-960, the hook is re-enabled while the leak is still
  live, and it wraps EVERY Bash command - so from the first interrupted
  command it leaks one $TMPDIR/sfh.XXXXXX per interrupt, with nothing reaping
  them, for the whole window between the two landings.

  The coordinator's evidence (7a8c06eab) recommended fixing this BEFORE
  re-enable. The dependency as specced inverts that. Both orders are
  defensible - BL-965 edits the same generated-bash builder BL-960 is
  rewriting, so building them concurrently would conflict - but the choice
  should be deliberate. Two ways to close the window if that is wanted:
  fold the `trap 'rm -f "$__sfh_out_file"' EXIT INT TERM` into BL-960 itself
  (one line, same file, same parcel), or hold BL-960's hook re-enable until
  BL-965 lands. Coordinator has no authority to pick; flagged for a ruling.

  No orthogonality conflict, no ambulance freeze, no onboarding-contract hold.

