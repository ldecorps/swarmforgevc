id: BL-965
title: "BL-960's heal wrapper leaks its mktemp capture file when the command is killed - no trap installs cleanup, and kills are routine (Bash-tool timeouts, respawn-pane -k, swarm teardown)"
milestone: M8
type: defect
severity: medium
status: todo
epic: tool-miss-auto-heal
human_approval: approved
priority: 40
direction: pipeline-note
depends_on: [BL-960]
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-965-heal-wrapper-temp-file-cleanup-on-kill.feature

invariants:
  - "For every catchable termination of the composed wrapper (normal exit, INT, TERM, HUP), the wrapper's own temp file is removed; only an uncatchable SIGKILL may leave residue, and any residue matches the recognizable ${TMPDIR:-/tmp}/sfh.* pattern so external cleanup can identify it."
  - "Adding cleanup changes nothing else observable: exit code, combined output, and every BL-960 invariant (parse gate, byte-fidelity, heal targeting) hold unchanged over BL-960's own corpus and suites."

description: >
  Severity rationale: medium - a real resource leak, contained: each file is
  one command's captured output, macOS reaps unaccessed TMPDIR files
  periodically, and nothing leaks until the hook re-enables (it rides
  BL-960's landing + role respawns). But once live, EVERY role's every
  killed Bash call leaks one file, and kills are routine on this host
  (the Bash tool's ~120s cap kills long commands; tmux respawn-pane -k;
  kill_all_swarm.sh).

  Found by the hardender reviewing BL-960's parcel (priority-00 note
  20260819T234530Z_000249, sibling-deferred per Article 4.4 rather than
  bounced - BL-960 is a queue-jump carrying the operator's hook re-enable
  and must not grow). Specifier probe confirmed in the parcel's
  build-healing-wrapper-command (tool_miss_heal_lib.bb ~line 192): the
  composed wrapper runs mktemp, captures into the file, and removes it
  only via a plain `rm -f` on the tail path - no `trap` is ever
  installed, so any termination before the tail (signal, timeout kill,
  pane respawn) skips the rm. Note this also bounds BL-960's invariant 2
  honestly: "file side effects byte-identical" holds for runs that
  COMPLETE; kill-time cleanup is this ticket's contract.

  Fix wanted: the composed wrapper installs cleanup for its temp file on
  the catchable termination paths immediately after creating it, without
  altering exit code, output bytes, parseability, or any BL-960
  behavior. SIGKILL residue is acknowledged as unavoidable; the
  recognizable sfh.* name pattern (already present) is the containment,
  and building a sweeper is out of scope.

  How (direction, not mandate): a `trap 'rm -f "$__sfh_out_file"' EXIT
  INT TERM HUP` line right after the mktemp assignment is the classic
  shape; the tail's explicit rm may stay or go as the coder prefers, so
  long as a double removal never errors. Target stock macOS bash 3.2
  (BL-801) - the syntax is fine there, but verify under `set -u`-style
  edge behavior with the existing corpus. The BL-960 test harnesses
  (tool_miss_heal_lib_test_runner.bb, acceptance + property runners)
  are the established seams; a kill-mid-run scenario can background the
  wrapped command against a fixture TMPDIR, signal it, and assert no
  sfh.* residue.

constraints: >
  Out of scope:

  - Any behavioral change to BL-960's parse gate, byte-fidelity, heal
    targeting, one-retry structure, or hook wiring - their scenarios and
    suites stay green, unmodified in meaning.
  - A TMPDIR sweeper/janitor for SIGKILL residue - the name pattern is
    the containment; mint separately only if real accumulation is
    observed.
  - The mktemp failure path (`|| exit 1`) - already correct.

qa_e2e_procedure: >
  1. Fixture kill test (no live state): compose the wrapper for a
     long-running command against a fixture TMPDIR, run it backgrounded,
     send SIGTERM (and SIGINT in a second run) mid-capture; assert the
     fixture TMPDIR holds zero sfh.* files afterward and the file
     existed during the run. Pre-fix this leaves exactly one file per
     kill.
  2. Normal-completion regression: wrapped run completes; exit code and
     combined output byte-identical to unwrapped (cmp), zero sfh.*
     residue, no error from cleanup running after the tail rm.
  3. BL-960 regression: its acceptance scenarios and the three Babashka
     runners all green at the parcel commit. Record the degraded gate
     honestly (no bb mutation/CRAP/DRY - engineering rules).

