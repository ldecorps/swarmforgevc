assigned_to: specifier
mutation_cost: medium
invariants:
  - "No commit path available to a non-QA role — commit, merge, or amend — can land pipeline code on `main`; the guard refuses at creation time."

required_wiring:
  - "swarmforge/git-hooks/pre-merge-commit::swarmforge/scripts/::the --no-ff merge path (merge_and_process) stays unguarded unless this hook exists AND delegates to the standalone guard script; pre-commit alone is the hole this ticket calls out as coverage-in-disguise"

qa_e2e_procedure: |
  Do NOT verify by attempting a real pipeline-code commit on `main` — a
  successful attempt would be the very BL-590 landing this guard exists to
  prevent, and would need reverting off `main`/`origin/main`.

  Verify against a throwaway clone instead, so no live ref is ever at risk:

  1. `git clone /Users/ldecorps/projects/swarmforgevc <tmp>` and, inside it,
     `git config core.hooksPath swarmforge/git-hooks` (the clone does not
     inherit it).
  2. On `main`, stage a trivial edit under `extension/src/` with
     `SWARMFORGE_ROLE` unset. Commit MUST fail non-zero, and the message MUST
     name the offending path and the remedy (scenarios 01, 07).
  3. Repeat with `SWARMFORGE_ROLE=QA`. Commit MUST succeed (scenario 02).
  4. With `SWARMFORGE_ROLE` unset, stage a `backlog/`-only edit. Commit MUST
     succeed — this is the specifier/coordinator bookkeeping path and a
     regression here stalls the swarm (scenario 03).
  5. Branch off, stage an `extension/src/` edit, commit there (MUST succeed —
     scenario 04), return to `main` and `git merge --no-ff` it with
     `SWARMFORGE_ROLE` unset. The merge commit MUST be refused (scenario 05).
  6. Confirm the existing size guard still fires independently (scenario 06)
     and that `swarmforge/scripts/check_commit_size.sh` and
     `check_ticket_deletion.sh` still run from `pre-commit`.

  Also confirm the standalone guard script is invocable outside a hook and
  unit-tested there (BL-105 precedent), since that is what the Gherkin cannot
  pin.

