source: |
  BL-590 post-mortem, 2026-07-25. Four commits put un-QA'd pipeline code on
  `main` and on `origin/main`. Root cause, proven from the cleaner's own
  transcript: it prefixed `cd /home/carillon/swarmforgevc` to its git commands
  and ran its entire pass in the master checkout, which has `main` out.

  BL-629 (deploy gate), BL-630 (publish gate) and BL-631 (detection) all react
  to a bad `main` that already exists. **This is the only layer that stops it
  from existing.** It would have blocked all four commits at source:

  ```
  f8dc07963  git merge 73706d79ed --no-ff   -> pre-merge-commit
  ebd12542d  git add -A && git commit       -> pre-commit
  f69abdc23  git merge e05c025d49 --no-ff   -> pre-merge-commit
  cce634a6c  git add -A && git commit       -> pre-commit
  ```

description: |
  ## The infrastructure already exists — this is a small ticket

  `core.hooksPath` is already set to the **versioned, in-repo** directory
  `swarmforge/git-hooks`, and `swarmforge.sh:278 ensure_commit_size_guard` re-sets
  it on every `./swarm` launch (called at `:1660`). All role worktrees share one
  physical git dir (`git rev-parse --git-common-dir` -> `/home/carillon/swarmforgevc/.git`),
  so a single hook covers every role automatically.

  `swarmforge/git-hooks/pre-commit` (BL-105) is the working precedent: a thin
  hook that delegates to a standalone script (`swarmforge/scripts/check_commit_size.sh`)
  so the guard logic stays testable on its own. Follow that pattern exactly.

  This solves the usual reason hooks get rejected — a hook that lives in
  `.git/hooks` is unversioned and silently absent after a fresh clone or a
  re-created worktree, which is worse than no hook because it reads as
  protection. That failure mode does not apply here.

  ## The rule

  > On branch `main`, refuse a commit or merge-commit whose staged changes touch
  > `extension/src/`, `extension/test/` or `specs/pipeline/steps/`, unless
  > `SWARMFORGE_ROLE=QA`.

  Same QA-exclusive path set as BL-631's detector — keep the two definitions in
  one shared place so they cannot drift apart. Article 4.2 / BL-247 make QA the
  only integration point for code.

  **The deny path deliberately does not depend on `SWARMFORGE_ROLE` being set.**
  Only the QA allowance reads it (and `.swarmforge/launch/QA.sh:3` exports it).
  A role whose env is lost or a bare human shell is refused, not waved through —
  which is the correct default, and also correct on its own merits: an operator
  hand-editing `extension/src/` straight onto `main` is the very thing
  [[no-out-of-bounds-changes-without-spec]] exists to stop.

  `specifier` and `coordinator` are unaffected without any special-casing:
  `roles.tsv` maps both to the master checkout and they commit to `main` all day,
  but only `backlog/`, `docs/`, `specs/features/` and `swarmforge/` — none of
  which are in the refused set.

  ## Two hooks, not one

  `pre-commit` alone is NOT enough and shipping only that would leave a hole
  disguised as coverage:

  - `pre-commit` catches `git commit` — `ebd12542d`, `cce634a6c`.
  - **`pre-merge-commit` is a separate hook** and catches `git merge --no-ff` —
    `f8dc07963`, `f69abdc23`. It does not exist in `swarmforge/git-hooks` today.
    The swarm's own `merge_and_process` uses `--no-ff`, so this is the hook that
    covers the handoff path.

  ## Holes this guard does NOT close — state them in the runbook

  Honesty here is the point: a guard oversold is BL-629's original mistake
  repeated.

  1. **A fast-forward merge fires no hook at all.** Nothing can be caught there.
  2. `git commit --no-verify` bypasses both hooks by design.
  3. `git reset --hard`, `git branch -f`, `git cherry-pick` onto a checked-out
     `main`, and a direct `git push` from another checkout all move `main`
     without a commit hook running.

  This is exactly why BL-630 (publish gate) and BL-631 (detection) are NOT made
  redundant by this ticket and must ship regardless. Three imperfect layers in
  series, not one claimed-perfect one.

acceptance: specs/features/BL-632-commit-time-guard-refuses-pipeline-code-on-main.feature
out_of_scope: |
  - Publish-time refusal (BL-630) and deploy-time refusal (BL-629).
  - Detection/alerting (BL-631).
  - GitHub-side branch protection. A server-side rule is a different trust
    domain and a different failure mode (it cannot read `SWARMFORGE_ROLE`);
    worth its own ticket if wanted, not a substitute for this.
  - Fixing BL-590's own defects. Operator ruled fix-forward 2026-07-25.

notes: |
  2026-08-01 Let's Talk (human): severity high → medium so the JumpQ
  pilot-process batch can clear the high tier; commit guard, not a live outage.

  If an override is provided at all beyond `--no-verify`, it must be explicit
  and logged — never a silent env var that quietly becomes the normal way to
  commit. Same constraint BL-629 puts on its own override.

  Sequencing note for the coordinator: BL-629, BL-630, BL-631 and BL-632 all
  touch adjacent concerns and share the QA-exclusive path definition. BL-631 and
  BL-632 in particular must agree on that set — land one first and have the
  other consume its definition rather than restating it.

  2026-08-17 specifier, resolving that "land one first" ambiguity before
  handing off: verified BL-629 and BL-630 do not exist as tickets at all, and
  BL-631 is still in `backlog/paused/` (unbuilt, though its own prose restates
  the same three paths at lines 77 and 94). **BL-632 therefore lands first and
  OWNS the definition.** Publish the QA-exclusive path set ONCE, in the
  standalone guard script, in a form BL-631's detector can consume — do not
  hand-copy the three paths into a second place.

  Note for whoever specs/builds BL-631: its detector is Babashka
  (`babysitterd`) while this guard is bash, so no import can bridge them. If
  BL-631 ends up mirroring the literal rather than reading it, engineering.prompt's
  BL-897 rule applies — a test must assert both literals agree; a "kept in
  sync" comment is not a gate. That obligation belongs to BL-631, not here.

  Supporting criteria the Gherkin does not pin: guard logic lives in a
  standalone script callable outside a hook, per the BL-105 precedent, and is
  unit-tested there.

