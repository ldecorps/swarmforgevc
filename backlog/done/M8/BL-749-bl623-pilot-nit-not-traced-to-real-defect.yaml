description: |
  ## What

  This review batch's cleaner-lens pass on BL-623 already noticed
  `log-routing-skip!` has no try/catch despite the ticket's own guardrail
  language — but judged it a non-blocking nit rather than tracing the actual
  call site. At `-main` the call sits before `try-sync-deliver!` in the same
  `let`, so a write failure skips real-time delivery (BL-748 remaining work).

  ## What to do

  1. **Role prompts (specifier-landed this turn, BL-798):** cleaner.prompt and
     hardener.prompt already carry section "A ticket's own guardrail claim is
     never a nit until the call site is read (BL-749)". Do not remove or
     reword that section unless human_approval amends it — commit hash is in
     `notes:`.
  2. **`/pilot` (coder):** extend `composePilotExpeditorPrompt` in
     `extension/src/tools/telegramCursorBridgePilot.ts` so offline expeditor
     review hats get the same rule: a gap against the ticket's own explicit
     guardrail claim is never a non-blocking nit until the CALL SITE (not only
     the function in isolation) has been read and the consequence confirmed.
  3. APS scenarios above; how-to cross-link from BL-723 / BL-748 docs.

  ## Out of scope

  - Fixing `log-routing-skip!` itself (BL-748 remaining work)
  - A mechanical land-gate that tries to detect "reviewer skipped tracing"
    (uncodable; this is guidance + prompt composition)
  - Expanding to every review adjective ("smell", "nit") without a ticket
    guardrail claim

qa_e2e_procedure: >
  (1) Grep cleaner.prompt + hardener.prompt for BL-749 call-site-before-nit
  rule. (2) composePilotExpeditorPrompt("BL-749") requires call-site tracing
  before nit-downgrade and names call site vs function-in-isolation.
  (3) How-to notes the rule.

