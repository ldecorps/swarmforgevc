  the red was fixed in the pass that found it.
  Release note sent to QA 2026-10-06: retake BL-2014's parcel 6ebabfb995
  and merge main.
  Seen, not ticketed: the fixture's unassigned-active nudge fails with
  "Unknown sender role: coordinator" on every sweep. It costs time and
  hides nothing, since the scenario is about delivery and rotation.

