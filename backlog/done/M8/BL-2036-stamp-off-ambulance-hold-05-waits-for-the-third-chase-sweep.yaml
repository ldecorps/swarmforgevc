description: |
  ## Status: hotfix 62ef35bcdb landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `swarmforge/scripts/test/test_handoffd_ambulance_wiring.sh` scenario
  ambulance-hold-05 starts a real `handoffd.bb` on a temp root and waited
  at most 40 s for its first `chase-rotate` line. handoffd runs a chase
  sweep every 10 poll cycles. A timestamped trace at load 11 showed sweeps
  at +1 s (the parcel was not yet aged) and +20 s (no rotate), with the
  rotate due on the third. Each 10-cycle stretch also pays this fixture's
  unassigned-active nudge, 6-8 s, because the fixture has no coordinator
  row. The third sweep fell past 40 s, so the scenario failed on a working
  daemon whenever the host was loaded (the coder's two failures). It passed
  on quieter runs (QA's).

  ## What the hotfix changed

  The deadline is 120 s, with a comment giving the measurement. It is a
  bound, not a measurement: the loop still stops at the first rotate line,
  and the documenter-must-not-win check is unchanged. Measured after: ALL
  PASS at load 18.8, 68 s for the whole file.

  ## What the coder does (all of it)

  1. Run qa_e2e_procedure step 1 once, output under tmp/.
  2. Read `git show 62ef35bcdb` against the two sections above.
  3. Write backlog/evidence/BL-2036-coder-<date>.md: the result and one
     line saying whether the hotfix matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

