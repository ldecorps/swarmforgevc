source: |
  Human Cursor session 2026-08-25 (~15:12). Follow-on to done BL-1134 /
  BL-1122 / BL-839. Telegram Alerts still flooding STAGED for
  handoffd.bb / push_sweep_lib.bb after BL-1134 closed. Live
  `check-master-checkout-drift!` → :no-drift. Classifier probe:
  `git add swarmforge/scripts/handoffd.bb` and `git commit -m foo`
  return false for git-add-or-commit-argv-for-root? against
  /home/carillon/swarmforgevc; only `git -C <root> …` returns true.
