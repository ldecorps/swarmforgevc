description: |
  ## What is wrong

  BL-1134 widened commit-in-flight? beyond index.lock to live
  `git add` / `git commit` argv, but gated root match on
  `(str/includes? argv project-root)`. Agent commits on main almost
  always run as cwd-scoped `git add` / `git commit` (no `-C`, root
  absent from argv). Those never mute. The ~45s drift sweep then
  classifies index≠main as :staged-for-reversion and floods Operator
  Alerts with the same handoffd.bb / push_sweep_lib.bb text.

  Secondary residual (specifier/architect call — may ship in-scope or
  defer): (a) mute is still non-sticky, so inter-tool-call gaps with
  index≠main and no live process still WARN; (b) :unknown still alarms
  while in-flight, so index.lock contention can flood UNKNOWN during
  real commits.

  ## What to do

  Make in-flight detection cwd-aware for this project root (reuse
  process-table-lib cwd / project-scoped-process? or equivalent
  read-only observation). Keep index.lock. Acceptance must prove:
  cwd-scoped git add/commit against this root mutes :staged-for-reversion;
  foreign-cwd git does not; durable staged reversion with no signal
  still alarms; check never writes.

  Optional (architect): short sticky mute and/or mute :unknown while
  in-flight — only if cwd-aware process observation alone is shown
  insufficient against the live flood.

  ## Out of scope

  - Auto-restoring / unstaging the master checkout.
  - Moving daemons onto a committed ref.
  - Ancestry heuristics as the sole mute.

qa_e2e_procedure: >
  (1) no-drift silent. (2) durable staged reversion, no lock, no git
  process → alarm. (3) staged-vs-main with live cwd-scoped git commit
  at this root (argv without root string) → no WARN. (4) same with
  git -C this-root still muted. (5) foreign-cwd git add/commit → still
  alarms if staged reversion present. (6) signal cleared, still staged
  reversion → alarm. (7) check never writes.

