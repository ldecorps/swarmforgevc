description: |
  ## What is wanted

  `runClosingCeremony` records the window the run covers on its
  `CeremonyRun` (`windowStart`/`windowEnd`): it starts where the previous
  run's window ended and ends at the real instant the run happens. Runs
  already on disk carry no window: the first post-fix run starts at the
  newest prior run's `deliveredAt` - never the whole ledger. The night
  path's `deliverLeanPacket` and `recordEmptyOutcome` pass the real `nowMs`
  instant, not `${shiftKey}T00:00:00Z`. The run's key may stay the caller's
  local day key; if it is derived from the instant instead, a
  `finish-shift` between 00:00 and 01:00 local in BST lands on the previous
  UTC date - pick one, test it.

  This slice changes which window a run RECORDS, not which events it
  folds: BL-1968 makes the fold use it.

  ## What each stage checks

  - Coder: the two scenarios; closingCeremonyRun.test.js and the night
    path's tests pass.
  - Hardender: mutation on the window computation.
  - Documenter: docs/reference/BL-820-closing-ceremony-lean-pass.md's
    Storage section gains the window field.

