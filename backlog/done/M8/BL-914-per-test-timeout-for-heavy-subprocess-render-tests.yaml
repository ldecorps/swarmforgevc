acceptance: specs/features/BL-914-per-test-timeout-for-heavy-subprocess-render-tests.feature

description: |
  ## What

  Six unit tests do genuinely expensive, real, subprocess-or-render work
  by design (never mocked - each test's own header comment says so
  explicitly) and measure consistently within a few percent of Vitest's
  20000ms default `testTimeout`, even when isolated from every other test
  in the suite:

  - `extension/test/dependencyGateCliReportsAndScope.test.js` — "running
    the REAL checker twice over identical fixture code produces
    byte-identical reports" (runs the real pinned `dependency-cruiser`
    TWICE, by design, to compare outputs).
  - `extension/test/renderBriefingDiagramsCli.test.js` — three tests
    ("renders exactly the two maintained diagrams...", "main() runs
    in-process against the real repo...", "the compiled CLI runs
    standalone as a subprocess...") that render the briefing's real
    architecture diagrams via `mermaidRender.ts` (`beautiful-mermaid` +
    `resvg` - CPU-bound layout and native rendering, deliberately chosen
    over `@mermaid-js/mermaid-cli` to avoid spawning headless Chromium).
  - `extension/test/renderBriefingBurndownCli.test.js` — two tests
    ("renderBriefingBurndown falls back to deriving its own history when
    no snapshot path is given (smoke test against the real repo)" and
    "...when the given snapshot path does not exist"). Added 2026-08-18 on
    QA's report; see notes: for the provenance. Same class as the render
    tests above and then some: both fall back to deriving burndown history
    from the REAL repo's git log, then render a PNG through the same
    `mermaidRender.ts` path (`beautiful-mermaid` + native `resvg`). The
    file's other three tests take a fixture snapshot and are fast; it is
    specifically the two derive-from-real-repo fallbacks that are heavy.

  This project already has an established pattern for exactly this shape
  of problem: BL-362 relocated `dependencyGateCliReportsAndScope.test.js`'s
  own sibling whole-project dependency scan (~1.6s, but the pattern is the
  same) out of the fast unit budget and into the acceptance path, rather
  than touching the global timeout. This ticket is the same fix at a
  per-test scope: Vitest's `test(name, fn, { timeout })` third-argument
  form.

  ## How (direction, not mandate)

  Give each of the six tests above its own explicit, generous timeout
  override (e.g. 45000ms - the largest isolated measurement recorded was
  ~34.4s) via the third `test()` argument. Do NOT touch
  `extension/vitest.config.mjs`'s global `testTimeout: 20000` - that stays
  the default for every other test in the suite, which is not the class
  of problem these four measure into.

  Confirm the fix actually helps: re-run each of the six tests in
  isolation and under a full-suite run, and confirm none times out even at
  whatever load the host is carrying at verification time - the point is
  headroom, not a specific pass on a specific quiet moment.

  ## Scope

  The six named tests' own `test(...)` call sites, in the three named
  files. Not `vitest.config.mjs`'s global timeout, not any other test file,
  not the underlying rendering/dependency-check performance (a genuine
  speed-up of `mermaidRender.ts` or the dependency-cruiser invocation is
  welcome future work but is a different ticket - this one buys headroom,
  not throughput).

invariants:
  - "The suite-wide default testTimeout in vitest.config.mjs is unchanged by this ticket."
  - "Every timeout this ticket grants is a bounded number greater than the default. Disabling a test's timeout (0, Infinity, or removing the guard) is never an acceptable way to make it stop failing - the point is headroom, not removing the hang detector."

notes: |
  Sibling ticket: BL-815 (the classification this fix ticket is one
  consequence of). The evidence file this ticket cites also classified a
  fifth originally-failing test (dependencyGateCliStorageGlobals.test.js's
  localStorage QA-bounce repro) as a one-off load-induced failure with a
  comfortable isolated margin (10.7s) - that one gets no fix ticket, per
  the same evidence file.

  Amended by the specifier 2026-08-18 on a QA `note`: "renderBriefingBurndownCli.test.js
  hits BL-815 load-timeout class, not in BL-914." Verified and adopted -
  the two derive-from-real-repo fallbacks in that file render a real PNG
  through the same mermaidRender.ts path as the tests already listed, and
  carry no timeout override. The BL-815 evidence file already recorded them
  failing in its 2026-08-17 full-suite run (its items 4 and 5) but placed
  them outside its own authoritative inventory, so no fix ticket ever picked
  them up. That is the gap QA caught.

  NOT adopted, deliberately: the same BL-815 passage names three further
  files from that run - activateBounceWatcher.test.js, bounceDrain.test.js
  and bounceWatcher.test.js. They are a DIFFERENT class and must not be
  swept into this ticket. Each drives real `fs.watch` events and real
  timers (11, 2 and 4 such call sites respectively, none with a timeout
  override), which the Engineering Rules forbid outright in the unit suite
  ("no real timers, use fakes for fs/network/tmux/VS Code API/timers").
  Granting them more headroom would entrench the violation instead of
  fixing it; they need a fake-timer/injected-watcher seam, which is a
  different fix in a different place. Left unticketed here on purpose -
  raised to the coordinator separately rather than folded in.

  This ticket had NO `acceptance:` field until this amendment, so it would
  have reached the pipeline with no acceptance contract at all: the BL-761
  contract gate fails closed only on a malformed pointer, and the BL-880
  pointer gate silently skips a missing one, so nothing would have caught
  it. Feature file added in the same pass. Its step handlers
  (specs/pipeline/steps/bl914PerTestTimeoutSteps.js) do not exist yet and
  must land in the coder's parcel - the acceptance runner throws on a
  scenario with no handler (BL-233).
