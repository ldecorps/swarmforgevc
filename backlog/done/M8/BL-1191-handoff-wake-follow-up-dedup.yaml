description: |
  ## What

  Each handoff wake injects the shared literal (`HANDOFF_WAKE_MESSAGE` /
  `default-wake-chat-message`) as a separate Cursor follow-up. Daemon chase,
  rotate, and re-notify before the agent acts stack many identical lines —
  inbox noise when mail is unchanged or empty.

  ## How (direction, not mandate)

  1. **Dedup / collapse:** per-role sidecar tracks last injected mailbox
     fingerprint + timestamp; suppress when unchanged within bounded window.
  2. **Pacing:** align with chase_sweep_lib cooldown semantics (BL-577).
  3. **Attribution:** reuse BL-870 records for every inject and skip.
  4. **False-wake path:** empty mailbox must not stack — gate or downgrade.

  Dedup may live in handoffd notify path, verified inject, or shared sidecar
  under `.swarmforge/daemon/` — pick the layer that sees both daemon and
  extension inject paths.

qa_e2e_procedure: >
  (1) Fixture unchanged mailbox + two sweep cycles → one follow-up max.
  (2) New parcel → exactly one wake + attribution names file.
  (3) Empty mailbox repeated sweeps → no stack. (4) Cooldown window suppresses
  re-notify with named skip reason.

out_of_scope: |
  - Changing wake wording (BL-152).
  - Full multi-parcel inbox UI (BL-838).
  - Root-cause fix for false wakes beyond gating (BL-870).

