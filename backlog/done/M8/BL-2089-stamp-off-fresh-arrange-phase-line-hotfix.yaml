description: |
  ## Status: hotfix d47df679b8 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `local_seat_phase_cli.bb show` returns phase `arrange` and a virtual
  path when no record file exists yet. `ready_for_next_task.bb`'s
  `maybe-print-phase-line!` always printed `PHASE: … - read <path> first.`,
  so a fresh-arrange local seat (live BL-2074) hit File-not-found and
  stalled before reading the ticket.

  ## What the hotfix changed

  - `swarmforge/scripts/ready_for_next_task.bb`: name the path only when
    the file exists; otherwise print the fresh-arrange wording.
  - `specs/features/BL-2038-…feature` + step: the `none` example expects
    the new wording.

  ## What the coder does (all of it)

  Review the landed commit. Do not re-apply the change. Confirm the
  invariants and leave evidence under backlog/evidence/.
