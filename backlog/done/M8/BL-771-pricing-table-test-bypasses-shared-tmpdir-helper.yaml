notes: |
  ## Untracked file that also trips the guard on this checkout

  Running the scanner on the master checkout reports TWO violations:
  `pricingTable.test.js:92` (on main — this ticket) and
  `extension/test/cursorBridgeInboundQueue.test.js:13`, which is untracked
  (`git status` shows `??`) and on no branch. Per the constitution's clean-up
  rule it is surfaced, not swept: whoever owns that work-in-progress should
  allocate through `mkTmpDir` before committing it, or the guard goes red again
  the moment it lands. Do not delete it as part of this parcel.
