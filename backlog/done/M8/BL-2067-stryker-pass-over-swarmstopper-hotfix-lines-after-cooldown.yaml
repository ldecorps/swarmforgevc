  evidence (backlog/evidence/BL-2052-QA-20261007-2.md, 0172221571),
  verbatim remediation: "Specifier: either amend qa_e2e 4 to accept the
  committed hand-mutant evidence ... or keep it and re-route the parcel
  (7b11af2725) to the hardender after 21:22Z with a note naming that sha."

