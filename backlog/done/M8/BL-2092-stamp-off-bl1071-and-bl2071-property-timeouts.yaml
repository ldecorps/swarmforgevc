description: |
  ## Status: hotfix b8611eff86 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong, and what the hotfix changed

  Two property files spawn real subprocesses in sequence and declared no
  budget of their own, so they ran on the property lane's default
  (vitest.properties.config.mjs, BL-1817): 20000 ms on a quiet host and
  never above its 60000 ms cap.

  1. extension/test/bl1071SweepSurvivesAnyProbeFailure.property.test.js
     runs the REAL babysitter sweep over a fixture repo: invariant 1
     eight times (every subset of three broken probes), invariant 3 four
     times. Alone at load 20 on 2026-10-09 they took 22.4 s and 12.9 s;
     coder@2's lane timed one out.
  2. extension/test/bl2071ForwardAndPassAgree.property.test.js runs the
     BL-2071 CLI eight times (two callers over four cells). Alone at load
     12 it took 28.3 s against a scaled 39950 ms; QA's BL-2072 lane timed
     it out.

  The hotfix requires `propertyLaneTimeoutMs` in each file and passes
  `propertyLaneTimeoutMs(60000)` to all three tests: 60 s on a quiet
  host, up to 180 s under load (bl1529's, bl1389's and bl1445's class).
  A comment at each says why. No property body changed.

  ## What the coder does (all of it)

  1. Read `git show b8611eff86` against the section above. Confirm only
     the timeout arguments, the requires and the comments changed.
  2. Run the two property files once each, alone, with
     `--config vitest.properties.config.mjs` and output under tmp/.
  3. Write backlog/evidence/BL-2092-coder-<date>.md with the review
     result and the run results, and commit it.

