source: |
  Coder note 002319 (2026-10-02 08:54Z), verbatim: "unowned-red
  test_finish_shift_lib.sh case 08 (front-desk CLEAN) red on main".

  Specifier, the same pass: `bash swarmforge/scripts/test/test_finish_shift_lib.sh`
  failed case 08 twice ("FAIL: 08: expected front-desk flagged as
  unexpectedly stopped, got: CLEAN") and then passed 18 of 18 on the next
  run. Instrumented failing run: at the snapshot,
  `<root>/.swarmforge/operator/front-desk-supervisor.pid` did not exist
  ("No such file or directory") while `kill -0 $FD_PID` answered alive, so
  `finish_shift_keep_snapshot` recorded nothing and `finish_shift_verify`
  had nothing to miss. The passing instrumented run listed the pidfile
  present before and after start_fixture.

description: |
  ## Status: hotfix 7f5cd31fe6 landed the fix

  This parcel is its stamp-off: the pipeline's review of what landed.
  Review it, do not re-apply it.

  ## What the hotfix changed

  1. `swarmforge/scripts/test/lib/tmp_cleanup.sh`. Its EXIT trap swept
     every registered fixture root. A background child started with
     `sleep 300 & PID=$!` and killed before it exec'd `sleep` is still a
     bash process carrying that trap, and it ran the sweep too. Case 08
     kills three such children just before its snapshot, so the fixture
     root, the front desk's pidfile with it, was deleted mid-test and the
     verify read CLEAN. Found in an xtrace: three concurrent sweeps right
     after the kill. The trap now sweeps only in the process that installed
     it: `BASHPID`, or on stock macOS bash 3.2 the parent of an exec'd sh.
  2. `test_finish_shift_lib.sh` case 02 wrote `/tmp/bl762-02-*.out`, so two
     concurrent runs clobbered each other (02b red in both of two parallel
     runs). The files now live under the run's own root.

  ## What is wanted in this parcel

  - Review both changes. Confirm on stock macOS bash 3.2 if a host is at
    hand, or say in the evidence that the fallback was checked only on
    bash 5.2 here.
  - Census: 134 shell tests source the helper. The 13 that kill
    background children were run on the hotfix; 5 failed, identically on
    HEAD before it, so they are separate reds (the specifier's next pass).
    Re-run the 13 and confirm none regressed.
  - Evidence: the review and that census.

  ## Scope

  The helper, the finish-shift test, evidence.

qa_e2e_procedure: |
