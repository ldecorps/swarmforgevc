  1. `bash swarmforge/scripts/test/test_finish_shift_lib.sh`: 18 of 18,
     run 3 times (a flake ticket hunting this named intermittent failure,
     2026-09-17 rule), two of them concurrently. Measured at the hotfix: 3
     of 3; before it, case 08 failed 3 of 3 and 02b failed under
     concurrency.
  2. `node specs/pipeline/cli.js specs/features/BL-762-finish-shift-leaves-the-phone-path-up.feature`:
     14 of 14, as measured at mint.
  3. `bash swarmforge/scripts/test/test_tmp_cleanup_lib.sh`: ALL PASS. No
     register row names this test (the hotfix retired it).

