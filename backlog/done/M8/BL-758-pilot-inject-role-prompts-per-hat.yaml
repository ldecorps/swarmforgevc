description: |
  ## What

  Today `/pilot` starts with one `composePilotExpeditorPrompt` mega-brief that
  lists stages and says "wear every pipeline hat" without loading
  `swarmforge/roles/<role>.prompt` (or pack overlays) when the casquette
  changes. BL-723 showed that shape skips gates and conventions a role
  wearing its own prompt would treat as mandatory. Evidence gates catch
  silent skips; they do not restore hat-faithful judgment.

  ## Design choice (locked unless human_approval amends)

  **Bridge-driven reinject at hat change** (smallest durable match to live
  rotate): introduce `composePilotStagePrompt(ticket, role)` that returns
  (1) the thin pilot isolation preamble already in today's brief (worktree,
  no handoffd/tmux, Telegram status, stage-boundary cleanup, land via
  `pilot-acceptance-gate` only) and (2) the **full file bytes** of
  `swarmforge/roles/<role>.prompt` (QA → `QA.prompt`), plus the same pack/
  profile overlay fragment the live `prompt_engine_lib` would attach when
  configured. On hat change and bounce-back: `resetAgent` (or equivalent
  session boundary) then inject that composed stage prompt as the active
  system context — same spirit as live `--append-system-prompt-file`.

  Rejected alternatives: (a) mega-brief that only says "read roles/X.prompt"
  (goodwill; failed in BL-723), (b) concatenate all seven role prompts into
  one context (still one agent, not sequential hats), (c) invent a parallel
  "pilot dialect" of duties.

  ## What to do

  1. **`composePilotStagePrompt` + start path (coder):** implement as above;
     change `composePilotExpeditorPrompt` / `/pilot` start so the first stage
     is a specifier (or first required) hat inject — not mega-brief-alone.
     Hat-change + bounce-back paths must reinject.
  2. **Stage evidence:** each `NN-<role>/verdict.json` must include
     `role_prompt_path` (repo-relative under `swarmforge/roles/`) and
     `role_prompt_sha256` (sha256 of the prompt bytes that were injected for
     that stage). Telegram hat status (BL-700) stays; it is not sufficient
     evidence alone.
  3. **Land gate:** `checkPerHatRolePromptEvidence` on `landPilotedTicket` —
     for every completed stage verdict present under the run's expedite dir,
     require both fields; else refuse `reasonKind: 'pilot-hat-prompt-missing'`
     (inert). No-op when no stage verdicts exist yet is not expected at land;
     land with stages should always check. Fail open with warning only if the
     expedite tree cannot be read (mirror BL-729/737).
  4. How-to on BL-727 gate doc or sibling BL-758 describing reinject + evidence.

  ## Out of scope

  - Replacing or delaying evidence-gate tickets (BL-727…BL-757 process half)
  - Unlocking more `/pilot safe` volume by itself
  - Changing live swarm rotate / `--append-system-prompt-file` (reuse it)
  - Implementing this ticket via `/pilot`

qa_e2e_procedure: >
  (1) composePilotStagePrompt(coder) contains coder.prompt body + isolation
  wrapper. (2) composePilotExpeditorPrompt requires per-hat reinject, not
  mega-brief-alone. (3) Verdict missing hash → land refuse. (4) All verdicts
  have path+hash → land completes. (5) Bounce-back composes specifier.prompt.
  (6) Refused land inert. (7) How-to documents reinject + evidence.

