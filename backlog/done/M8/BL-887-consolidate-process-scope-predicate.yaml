approval_context: >
  Two calls need sign-off. (1) Semantics: the consolidation adopts the
  SUPERVISOR's looser predicate (cmdline leg str/includes?, cwd leg
  str/starts-with?, OR'd) for BOTH subsystems — after this, the janitor can
  stale-reap a hung live-parented vitest worker on a cmdline substring match
  alone, even when its cwd never resolves (previously such a process was
  never touched). The architect's BL-886 pass ruled this the right direction
  (the janitor's stricter-on-both version is the one with the demonstrated
  miss); this ticket asks the human to confirm it. (2) The shared helper's
  name is FIXED by this spec (project-scoped-process?) so required_wiring
  patterns stay literal (BL-874). Firm and not reopened: no reaper-class
  widening, no job-process-pattern change, no stale-threshold change.

