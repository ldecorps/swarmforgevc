description: |
  ## What

  After QA lands an approved commit on `main`, a deterministic sweep (a
  natural handoffd or post-land hook — coder locates the single chokepoint)
  visits every pipeline role branch and fast-forwards the clean ones to the
  landed commit. The QA merge-up BROADCAST then only needs to reach roles
  the sweep could NOT settle: dirty worktree, in_process work present, or a
  genuinely divergent (non-ff) branch — those roles get their note exactly
  as today and resolve as the receiver, per the constitution's merge-up
  protocol. The pipeline chain, lineage rules, and QA's integration role
  are unchanged; this automates only the mechanical receiver side of the
  broadcast where no judgement exists to apply.

  ## Constraints

  - Skip conditions are checked per worktree immediately before acting; a
    role whose state changes mid-sweep fails safe to "surface, don't touch".
  - Every sweep action and every skip (with its reason) is logged to the
    handoff/audit trail so the merge-up story stays reconstructable.
  - Constitution/prompt text describing the merge-up protocol is updated in
    the same parcel (documenter pass) so the described flow matches the
    built one — the swarm-workflow diagram included if it depicts the
    broadcast.

qa_e2e_procedure: >
  Fixture with five role branches — three clean/ff-able, one dirty, one
  divergent: sweep settles exactly three, logs two surfaced skips with reasons,
  re-run is no-op. Live: after QA lands, verify clean role worktrees ff without
  LLM merge-up turn; dirty/divergent/in_process roles still receive broadcast note.

