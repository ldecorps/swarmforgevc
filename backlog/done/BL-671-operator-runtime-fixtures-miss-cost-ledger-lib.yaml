source: |
  .swarmforge/operator/INTAKE-test-operator-runtime-fixtures-miss-llm-cost-ledger-lib.md
  (coordinator relay of a cleaner side-finding during BL-647, 2026-07-26;
  archived on drain). The intake asked the specifier to confirm what "miss"
  means before writing acceptance criteria. CONFIRMED on main by the
  specifier, 2026-07-26: `operator_runtime.bb:50` load-files
  `llm_cost_ledger_lib.bb` from its own directory; the fixtures build a
  sandbox by explicitly cp-ing scripts; 10 test_operator_runtime_*.sh
  exist; only test_operator_runtime_bl647_rotation_liveness.sh (line 31)
  copies the ledger lib; the other 9 all copy operator_runtime.bb and all
  omit the lib — so operator_runtime.bb cannot load in their sandboxes.

description: |
  ## Defect

  Sandbox-copy lists are hand-maintained per fixture, so a new load-file in
  operator_runtime.bb breaks every existing fixture that copies the runtime
  — exactly the missed-consumer-sweep shape
  (consumer-sweep-must-be-exhaustive-not-sampled; BL-629 bounced 3x on it):
  whichever parcel added the ledger load-file updated zero of the nine
  pre-existing fixtures (the tenth, BL-647's, was written after and copies
  it). Attribution of the introducing parcel is discoverable via
  `git log -S llm_cost_ledger_lib -- swarmforge/scripts/operator_runtime.bb`
  — confirm during the fix rather than trusting the intake's BL-486 guess.

  ## Fix shape (coder's call between two)

  Preferred: a shared fixture helper that copies operator_runtime.bb
  TOGETHER with the libs it load-files (one list, one owner), so the next
  added lib breaks one place, not nine. Minimal alternative: add the lib to
  all nine cp lists. Either way: run all ten fixtures and confirm each
  passes end-to-end — the acceptance is the suite green, not the cp lines
  present. If any of the nine turns out to fail for an unrelated
  pre-existing reason, surface it in the parcel rather than widening scope.

acceptance: specs/features/BL-671-operator-runtime-fixtures-miss-cost-ledger-lib.feature

notes: |
  BL-723 coder verdict (2026-07-30): on-par. Root cause (hand-maintained,
  unsynced cp lists) addressed structurally via a shared helper; cross-
  checked the helper's lib list against operator_runtime.bb's actual
  load-file forms and all are present. Acceptance suite genuinely spawns
  bash against each of the 10 real fixture scripts end to end. The
  events-lock fixture flake fix is a bonus correctness improvement. No
  coder-eye concerns found.

  BL-723 cleaner verdict (2026-07-30): on-par. Textbook shared-helper fix:
  one sandbox-copy array/function replaces per-fixture cp lists that had
  drifted across at least nine files, with a comment telling future authors
  where to add a new lib; every consumer updated to call the helper. Exactly
  the shape this lens wants.

  BL-723 architect verdict (2026-07-30): on-par. No extension/src files
  touched, no declared invariants. No architecture concerns.

  BL-723 hardener verdict (2026-07-31): on-par. One minor nit, not filed
  as a defect: the regression check meant to keep the sandbox lib list in
  sync only regexes direct load-file calls inside operator_runtime.bb
  itself, missing libs loaded transitively (e.g. via
  fixture_reaper_sweep_lib.bb -> fixture_reaper_lib.bb). Low risk in
  practice — the suite's dynamic "operator_runtime.bb loads successfully
  in its sandbox" check would still catch a genuinely missing transitive
  lib at runtime, so this is a blast-radius/documentation gap in the
  static check, not a silent-failure risk. Judged not to rise to a
  shortfall.
