qa_e2e_procedure: |
  On the parcel commit, from `extension/`:
  1. `for i in $(seq 1 15); do npx vitest run --config vitest.properties.config.mjs test/bl1030StopFlagTokenBoundary.property.test.js || echo FAIL; done`
     -> 15 of 15 green, no FAIL line, every run printing
     `BL-1589 reach map (bl1030): {"kinds":3,"minDrawsPerKind":20}`
     (the printed map, not the pass count alone, is the evidence: 15
     green runs of the unfixed file happen about 9 times in 10).
  2. Acceptance resolving all three scenarios
     (`swarmforge/scripts/run_acceptance.sh specs/features/BL-1589-*.feature`).
  3. Break-then-restore: make the loop pass `i % 2` so kind 2 is never
     built; step 1's first run fails naming the reach floor (`reach
     floor: bl1030 kind 2 drawn 0 < 20`); restore. Then pass a constant
     kind 1; the run fails on `refusedCount >= 12` or the reach floor,
     whichever runs first; restore.
  4. `git diff main...HEAD --name-only` names the test file, the step
     handler, the feature, evidence and the register row removal;
     `extension/src` and `swarmforge/scripts/expedite_lib.bb` are
     unchanged.
  5. `bb swarmforge/scripts/standing_red_register_cli.bb .` after landing
     reports no row for the file and `"unowned":[]`.

