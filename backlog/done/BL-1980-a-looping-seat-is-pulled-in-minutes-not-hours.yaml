description: |
  ## What is wanted

  Babysitter's seat-stuck CRIT for a seat holding a ticket with no commit
  since its claim fires, in addition to the 60-minute dwell, when:

  - qwen's loop-detection dialog is on the seat's pane (the turn has
    halted), or
  - the seat's current qwen session carries at least 10 REPEAT notes
    stamped since the claim.

  The CRIT's message names which trigger fired (the dialog, or the REPEAT
  count), and its key and severity are unchanged, so the coordinator's
  BAU acts on it as it does today. A commit for the ticket after the claim
  suppresses all three triggers.

  ## What each stage checks

  - Coder: the four scenarios; the sweep lib's unit runner.
  - Documenter: the babysitter runbook's check 5b section names the two
    new triggers.

