source: |
  Human via Host (Cursor/Telegram), 2026-08-05 after
  .swarmforge/daemon/handoffd-failure-20260805T141124Z.log.

  Evidence:
  - backlog/evidence/handoffd-crash-ambulance-race-20260805.md
  - Failure log on disk (same stamp)

description: |
  ## What happened

  handoffd exited with FileNotFoundException in ambulance_lib.bb
  ticket-has-file? while slurping a globbed path under backlog/active/ for
  BL-812 — the ticket had just been moved to done/M8. Supervisor BL-144
  wrote the failure log, emailed a path-only alarm, and halted the swarm.

  ## Operator need

  Off-box: cannot read the box path. Death email must attach the failure
  log (Resend attachments already used for briefing diagrams via BL-286;
  death path does not thread them today).

  ## Host-suggested code touchpoints (not binding)

  - swarmforge/scripts/daemon_alarm_lib.bb — alarm-and-halt!
  - swarmforge/scripts/handoffd_supervisor.bb — send-configured-alarm-email!
  - swarmforge/scripts/ambulance_lib.bb — ticket-has-file? try/catch per slurp
  - swarmforge/scripts/test/test_daemon_alarm_lib.sh
  - swarmforge/scripts/test/ambulance_lib_test_runner.bb

  Specifier decision: keep this as one high-severity defect. The two changes
  are one incident slice: the daemon death alarm must carry the crash evidence,
  and the ambulance race that caused this death must degrade without
  weakening BL-144's alarm-and-halt posture.

acceptance: specs/features/BL-813-handoffd-death-email-attach-and-ambulance-race.feature

e2e_qa_procedure: |
  QA verifies both the unit-level contracts and the live alarm surface:

  1. In a fixture or stopped-swarm harness, make alarm-and-halt! write a
     handoffd-failure-<stamp>.log and run the configured email path with email
     capture enabled. Confirm the body still names the file path and ./swarm
     ensure, and that exactly one attachment has the failure-log filename and
     bytes.
  2. Force the attachment builder to fail and confirm halt-swarm! still runs;
     attachment failure may be logged, but it must not block the death halt.
  3. Exercise ticket-has-file? with fs/glob returning an active backlog yaml
     path that disappears before slurp. Confirm the call does not throw and a
     handoffd poll continues.
  4. With an ambulance marker naming a ticket id no backlog yaml declares,
     confirm read-ambulance-state degrades to inactive/off without crashing.
  5. Regression guard: verify the supervisor still performs BL-144's alarm and
     halt behavior and does not auto-restart handoffd after the simulated death.
