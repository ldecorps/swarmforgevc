human_approval: approved
approval_context: >
  A new feature file is authored here, so it would ordinarily need a tap;
  it is minted approved under the 2026-09-17 operator hotfix (severity
  defect, no choice posed, no ruling_options). FIRM: no scenario of the
  fifteen features changes; only how their handlers build fixture roots
  (and BL-325's reference). FIRM: every fixture root is a git checkout
  under mkdtemp whose own git common directory is inside it, proven before
  any git write (Guardrails, BL-1390) - never the live repository.
  FIRM: BL-1517's refusal stays; the fixtures come into line with it.

invariants:
