description: |
  ## Status: hotfix 24872ac7a9 (and its runner fix c6e284cfec) landed

  `own-line?` keeps a line when at least one commit past the merge base
  names the ticket and every commit there names the ticket and otherwise
  only done tickets, or is a merge naming no ticket. Scenario 01 pins it.
  Review it; never re-apply it.

  ## What is still wrong

  A line carrying an unlanded OTHER ticket's commit still moves to the
  start target, and the ticket's own commits on it survive only under
  `refs/swarmforge/parcel-backup/<role>/`, which nothing re-applies. A seat
  that slipped one commit for another ticket onto its line loses its own
  work at the next serve.

  ## What is wanted

  - When take-up! moves a coder's line for a `:start` intent, it
    re-applies the commits past the old merge base whose subjects name the
    ticket (and only done tickets otherwise), oldest first, onto the new
    target, then reports the move as today plus the re-applied count.
  - If any re-application conflicts, the take-up aborts it, leaves the
    worktree exactly where it was (no merge or cherry-pick in progress),
    prints a PARCEL_LINE refusal naming the conflicting commit, and the
    parcel is not taken up (the existing :refused outcome).
  - The backup ref is still written before any move.

  ## How (direction, not mandate)

  - `take-up!`'s :move branch already writes the backup ref and runs
    `git switch -C`; the re-apply follows the switch. `git cherry-pick`
    with the runner's fixture identity; on failure `git cherry-pick
    --abort` and `git switch -C <branch> <old head>` back.
  - Reuse `line-commit-ok?` / `done-ticket?` (from 24872ac7a9) to pick
    the commits, never a second notion of "the ticket's own".
  - The step handler builds fixture repos as
    `swarmforge/scripts/test/parcel_line_lib_test_runner.bb` does (a
    worktree, `refs/remotes/origin/main` set by update-ref, a
    `backlog/done/` dir for a done ticket), under mkdtemp, proving each
    root with `rev-parse --git-common-dir` before any mutating command
    (BL-1390).
  - Documenter: docs/how-to/BL-1871-parcel-line-take-up.md says a line
    stays when it carries "the ticket's own unlanded commits"; it gains
    what now counts (no-ticket merges, done tickets' commits) and the
    re-apply.

