id: BL-985
title: "heal wrapper cannot see drift into a sibling worktree: its only cwd signal is 'fatal: not a git repository', which a worktree never emits - anchor proactively instead"
milestone: M8
type: defect
severity: high
status: todo
epic: tool-miss-auto-heal
human_approval: approved
priority: 12
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-985-drift-into-sibling-worktree-is-re-anchored.feature

invariants:
  - "A role's command never executes with a working directory inside a worktree other than that role's own pinned worktree."
  - "The drift verdict never depends on whether the command would have failed - a command that succeeds in the wrong worktree is re-anchored just the same."

description: >
  Severity rationale: high - a live fault in the safety machinery whose whole
  job is preventing exactly this. It degrades silently: nothing errors, and
  the wrong-worktree writes look normal until someone goes looking.

  Reported by the coordinator as "coordinator shell PWD pins to
  .worktrees/documenter vs main". Where it was OBSERVED is the coordinator;
  where the fault IS is the heal wrapper, which is every role's guard.

  Specifier probe (what is actually true, which is narrower and worse than
  the report):

  - The coordinator's launch script is CORRECT. .swarmforge/launch/
    coordinator.sh both exports SWARMFORGE_ROLE_WORKTREE=<master> and cd's
    there, and the live process confirms it: PID 3172 has
    SWARMFORGE_ROLE_WORKTREE=/Users/ldecorps/projects/swarmforgevc and a cwd
    of the same. Nothing is misconfigured. This is not a launcher defect.
  - The drift is in the Bash tool's PERSISTENT shell, whose cwd survives
    between tool calls and can be moved by any `cd` the role ever ran.
  - The guard that is supposed to absorb that is tool_miss_heal_lib.bb, and
    it is REACTIVE, not a pin. build-healing-wrapper-command runs the
    original command first, captures its output, and only re-anchors
    (`:wrong-cwd` -> `cd <root> && (original)`) when that output matches a
    MISS-CLASS-PATTERNS entry.
  - The `:wrong-cwd` pattern is exactly one string: "fatal: not a git
    repository". A sibling worktree IS a git repository. So the single most
    dangerous drift - master checkout into .worktrees/<other>, where every
    backlog path exists and every git command succeeds against the wrong
    branch - is structurally invisible to the guard. It can only catch drift
    OUT of any repository at all.

  This is the mechanism behind a recurring incident family (coder wrote
  BL-932 to the master checkout instead of its worktree; BL-571 edits landed
  in the architect worktree). Those were read as one-off role mistakes; this
  ticket says the guard could never have caught them.

  How (direction, not mandate): decide from where the shell IS, before the
  command runs - compare the shell's cwd to the pinned worktree and
  re-anchor when they differ. Reuse the existing `:wrong-cwd` heal shape
  (`cd <root> && (subshell-group original)`), which already re-anchors every
  segment of a multi-segment original (BL-960 invariant 3), rather than
  inventing a second anchoring mechanism.

constraints: >
  Firm lines:

  - Do NOT widen MISS-CLASS-PATTERNS with more failure strings. Any
    output-matching signal is reactive by construction and cannot fire for a
    command that succeeded - which is the entire defect. The guard has to be
    decided before the command runs.
  - No behaviour change when there is no drift: with the shell already at the
    pinned worktree, the command reaches the shell byte-untouched. Anchoring
    unconditionally on every command is a far larger blast radius than this
    defect warrants, and would make every role's every command pay for it.
  - The BL-960 parse gate stays in force: any wrapper text this produces must
    still pass `bash -n -c`, and a composition that does not parse fail-opens
    to the byte-untouched original exactly as today.
  - Keep the existing `:wrong-cwd` output heal. It still covers drift out of
    any repository, which the proactive check and it both handle; removing it
    is a regression, not a simplification.
  - Stock macOS /bin/bash 3.2 remains the target for any emitted shell.

notes: >
  Source: coordinator `note` 20260820T113352Z_000685, one line, root-caused by
  the specifier before speccing.

  Slice of epic BL-912 (tool-miss auto-heal). Its four existing children -
  BL-913 pin, BL-934 rm presentation, BL-960 parse-safe round trip, BL-965
  temp-file cleanup - are all done and none covers this hole.

  No required_wiring declared, deliberately. BL-531's shape is a mechanism
  shipped and wired into nothing; here the fix lives inside
  build-healing-wrapper-command, which the PreToolUse hook already calls, so
  mechanism and call site are the same function. Arming a gate against a
  guessed identifier would add BL-874 risk and buy nothing.

  Doc half, in the same parcel: swarmforge.sh:1529 generates the comment that
  every launch script carries - "the tool_miss_heal_hook.bb PreToolUse hook
  pins every Bash command to this, never to whatever cwd the pane's
  persistent shell has drifted to". That is false today and is very likely
  why the coordinator believed it was protected. It becomes true only if this
  ticket lands; if the implementation ends up narrower than the comment
  claims, the comment must be narrowed to match rather than left aspirational.

  BL-233: all four scenarios are in scope for this slice, so their step
  handlers must land in the same parcel.

qa_e2e_procedure: >
  1. Scenario 01: with SWARMFORGE_ROLE_WORKTREE set to the master checkout,
     invoke the wrapper builder with a cwd inside .worktrees/documenter and a
     command that SUCCEEDS there (`git rev-parse --abbrev-ref HEAD` is ideal -
     it returns the documenter branch today). Assert the emitted wrapper runs
     it from the master checkout, and that the branch it reports is master's.
     Repeat for .worktrees/architect per the Examples table.
  2. Scenario 02: same call with cwd already at the pinned worktree - assert
     the command text is byte-identical to the input.
  3. Scenario 03: same call with cwd in a directory outside any repository -
     assert the existing heal still re-anchors it.
  4. Scenario 04: same as 01 with a multi-segment original
     (`pwd; cd extension && pwd`) - assert every segment reports the pinned
     worktree, not the drifted one.
  5. Live check: in the running swarm, `cd .worktrees/documenter` in a role's
     pane, then run `git rev-parse --show-toplevel` through the Bash tool and
     confirm it reports that role's own worktree.
  6. Regression: re-run the BL-960 parse-gate suite - every emitted wrapper
     must still pass `bash -n -c`.

approval_context: >
  One ruling to confirm: this fixes the guard, not the drift. The persistent
  shell will still wander whenever a role cd's somewhere; the ticket only
  guarantees that a wandering shell cannot decide where a command runs.

  I did not spec the stricter alternative - anchor every command
  unconditionally, which is what the launch-script comment already claims
  happens - because it changes behaviour for every role's every command to fix
  a fault that only manifests on drift. If you would rather have the blunt,
  simpler guarantee, say so and I will amend; the constraint forbidding it is
  the only thing standing in the way.

  I could not raise this as a clarifying question: I already have one pending
  (the BL-951 bounce-fix re-entry question) and the one-pending rule applies.

