description: |
  ## What is wrong

  `backlog/hardening-debt-ledger.yaml` carries `parcel: BL-1476, gate:
  mutation, file_set: extension/src/metrics/transcriptWalker.ts,
  extension/src/metrics/turnProfileProducer.ts,
  extension/src/tools/run-turn-profile-producer.ts, detected_at: 2026-09-08`,
  recorded by the hardener with `hardening_debt_ledger_update.bb --defer`:
  `mutation_cooldown_gate.bb` answered skip-cooldown because all three files
  had last been touched on main by BL-1364 on 2026-09-05 and read 2.95-2.97
  of 3 days at run time (BL-1476's own `not_before: 2026-09-08` undershot
  the mark by hours). `transcriptSummaryStore.ts`, the parcel's new file,
  was mutation-tested in that pass and is not owed. BL-1476 then landed by
  hand-built tip-pure replay (`f0f54791c5`, 2026-09-08T02:56Z), which
  re-touched all three files, and closed. The register reader joins ledger
  rows to register rows on (lane, file); the row's parcel is closed and no
  register row names another owner, so `standing_red_register_cli.bb`
  reported it as the register's only UNOWNED row at mint and BL-1429's
  throttle holds the cap while it stands. The coordinator's note
  (2026-09-08T03:49Z) is that reading.

  BL-1468 (paused, not_before 2026-09-10) owns the BL-1452 row and BL-1441
  (active) the 2026-08-19 rows; neither is widened (BL-317/BL-325), so this
  row gets its own owner.

  `mutation_cooldown_gate.bb` on each of the three files at mint:
  `file_age_days: 0.05 (cooldown: 3 days)`, host quiet (load 2.66 on 20
  cores). Earliest run: 2026-09-11.

  ## What changes

  - One Stryker run over the compiled file set (`--mutate` scoped to
    `out/metrics/transcriptWalker.js`, `out/metrics/turnProfileProducer.js`,
    `out/tools/run-turn-profile-producer.js`; `perTest`; sibling links per
    the Verification rules; `extension/vitest.bl1476.stryker.config.mjs`
    already exists from the parcel), under the cooldown and host-load gates,
    recorded as `backlog/evidence/BL-1488-BL-1476-mutation.md` with the
    summary block, load, duration, and zero survivors or one entry per
    survivor with the reason it stands.
  - `hardening_debt_ledger_update.bb --discharge BL-1476 mutation
    --evidence backlog/evidence/BL-1488-BL-1476-mutation.md`; a run that
    cannot complete is recorded with the attempt verb and the row stays
    outstanding and owned (invariant 1).
  - The `hardening` register row naming BL-1488 leaves in the discharge
    commit (invariant 2).

  ## How (direction, not mandate)

  - Run on a quiet host; check `uptime` and the pack's activity first. The
    BL-1476 pass's own runner settings are the starting point.
  - If the dry run times out at the ceiling, record the attempt (verb from
    BL-1439) with load and duration and stop; do not raise the ceiling or
    narrow the mutate scope below the three files.
  - Documenter: nothing to write beyond the evidence file; no diagram.

constraints: >
  No production code changes. The run happens in the coder's worktree
  against compiled `out/**` (compile first; `extension/out/` is
  gitignored). Never `process.chdir()` under mutation; never a hand-edited
  mutation manifest. The step handler lands with the feature (BL-233).

out_of_scope: |
  - BL-1441's 2026-08-19 rows and BL-1468's BL-1452 row.
  - Any change to the cooldown window, the ledger verbs, or the throttle.

qa_e2e_procedure: >
  (1) `bb swarmforge/scripts/mutation_cooldown_gate.bb . extension/src/metrics/transcriptWalker.ts`
  (and the other two) reports the cooldown clear before the run. (2) The
  evidence file shows the Stryker summary block for the three compiled
  files, load and duration, survivors explained. (3)
  `backlog/hardening-debt-ledger.yaml`: the BL-1476 mutation row carries
  `discharged_at` and the evidence path. (4)
  `bb swarmforge/scripts/standing_red_register_cli.bb .`: no hardening row
  for the three files, no unowned row. (5) `bb swarmforge/scripts/effective_backlog_depth_cli.bb .`
  no longer reads a throttled cap on this row's account.

