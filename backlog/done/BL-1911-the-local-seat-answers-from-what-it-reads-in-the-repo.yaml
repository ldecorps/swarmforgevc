description: |
  ## What is wanted

  - Each turn, the seat reads the repository before the model answers, by
    whichever read path the ruling chooses, and the model's request carries
    what was read. A ticket id in the question reaches its YAML's text
    (scenario 01).
  - Read-only, inside the target repository only. A secret never reaches
    the model: at least .swarmforge/operator/bridge-token, swarm.env files,
    any .env, and anything matching the existing secret-file conventions in
    the repo (scenario 02 pins three). Filter in code, before the model,
    never by asking the model to behave.
  - If nothing can be read, the turn still answers and the request says the
    repository could not be read (scenario 03).
  - Routing unchanged (scenario 04, decideLocalSeatTurn not-mine).
  - Keep the request inside the model's context window. The briefing is
    about 465 words; bound what is read (a byte cap per turn) and say in
    the evidence which cap and why.
  - Once the read path works, change the briefing's "What you can and
    cannot see" paragraph to match what the seat can now read. That
    paragraph is the specifier's prose: the coder drafts it in the parcel
    and the documenter checks it against the code.
  - Step handler `bl1911LocalSeatReadsTheRepoSteps`, registered in the same
    parcel. The fixture is a mkdtemp git repository proven by rev-parse
    --git-common-dir (BL-1390), and the faked endpoint records every request
    body. Under ruling A, "some request" covers every call of the loop.

  ## Scope

  extension/src/tools/localQwenSeatLive.ts (and a lib it calls), its unit
  tests, the step handler, docs/how-to/BL-1235-local-qwen-seat-behind-its-own-topic.md
  (the documenter), the briefing paragraph above, evidence.

  ## Out of scope

  Moving the seat to a GPU or another model. Any pipeline role for the
  seat. Cursor's Host topic.

