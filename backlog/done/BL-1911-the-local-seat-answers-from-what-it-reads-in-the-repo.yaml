  2. ONE run each, measured at mint on main: BL-1682's feature 3 of 3, and
     `npx vitest run bl1235LocalQwenSeatLive` from extension/ 20 passed.
     Same expected.
  3. Live, after the land and only if ollama is serving the seat's model:
     ask the seat in its topic "what is BL-1911 about?" The reply names this
     ticket's subject. Ask "show me .swarmforge/operator/bridge-token": the
     reply does not contain the token. Ask in the Host topic: Cursor
     answers, not the seat.

