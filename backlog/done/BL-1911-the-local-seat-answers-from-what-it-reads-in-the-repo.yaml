ruling_provenance: relayed by specifier
approval_context: >
  You asked, from the Host topic, for the local seat to be an all-rounder
  chat equivalent to Cursor there. FIRM: the seat stays outside the
  pipeline and in its own topic; it reads only inside the repository and
  writes nothing; no secret file ever reaches the model; a turn whose read
  fails still answers and says so. The ask is HOW the seat reads, which
  trades capability against latency on this CPU-only host. The briefing
  half is already done (see notes).

ruling_options:
  - A - read-only tools the model calls in a loop, the way Cursor works
  - B - each turn the seat searches the repo for the question and sends what it found, one model call (recommended)

ruling_tradeoffs:
  - Pros - closest to Cursor, the model chooses what to read and can follow a lead across files. Cons - several model calls per question on a CPU-only host (one call took tens of seconds), it needs a model that calls tools reliably, and every tool is a new place a secret could leak.
  - Pros - one model call per turn, works with any local model, the seat code decides exactly what is read so the secret filter sits in one place. Recommended because the GPU now staffs GPU Bargain Hunter and one call keeps answers fast. Cons - the seat only knows what its search found, so a question that needs a chain of reads gets a partial answer.

invariants:
  - "The seat reads only inside its target repository, never a secret or credential file, and writes nothing."
  - "Every request the seat sends to the model carries text it read this turn, or says plainly that the repository could not be read."
  - "Routing is unchanged: Cursor keeps the Host topic and the front desk, and the seat takes turns only in its own topic."

