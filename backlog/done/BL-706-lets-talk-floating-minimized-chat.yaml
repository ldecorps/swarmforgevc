description: |
  ## What

  Add a minimize path on the Let's Talk Mini App page. When minimized, the
  full layout collapses into a floating talk surface (chat-box / letter-like /
  bubble-like) that stays on screen and remains speakable. The human can
  expand back to the full page.

  ## Intent (human words)

  - Not fully backgrounded; not full-screen.
  - A floating piece they can keep talking to while other context stays around it.

  ## Approach

  Prefer an additive UI mode on the existing Let's Talk page over a separate
  product shell. Concrete chrome (size, drag, position, expand control) is
  specifier/designer choice within that intent; keep the first slice simple.
  Spike Telegram WebApp / PWA constraints if needed before coding.

  ## Out of scope

  - Redesigning hold music, language matching, or other Let's Talk product rules
  - Native OS picture-in-picture unless that is the only viable Mini App path
  - A full second app shell unrelated to Let's Talk
  - Duplex / continuous call audio

