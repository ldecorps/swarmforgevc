  Minted 2026-09-05 by the specifier on the human's in-session message
  (06:21 local, screenshot of the Operator topic): "can something be done
  to reduce the traffic of this alert, which is juat noise as far as I am
  concerned". That sentence is carried verbatim; BL-1414 is the half that
  answers it directly. This ticket is the defect the specifier found
  behind the traffic: the alerts are false, and the restarts they trigger
  are real.

  Evidence read this pass, not assumed: `/usr/bin/grep --version` = GNU
  grep 3.11; `LC_ALL=C grep -c -P '\x00'` = 1 line in each of the five
  supervisor logs; the two grep invocations above on
  handoffd-supervisor.log; `.swarmforge/daemon/freshness-incidents.log`
  counts since epoch 1788566400; `ps -o lstart` on the four supervisor
  pids (all started 06:20-06:24 local, i.e. by the check); the cron log's
  `binary file matches` lines and "Started handoff daemon ... and
  supervisor."

  IR-DRY (2026-09-05): 16 step occurrences, 13 unique, three medium findings
  (10s vs 20s measured age; the two fixture shapes; the stubbed run variant).
  Reviewed: deliberate contrasts between distinct fixtures, kept.

  INVEST at mint: Independent (both depends_on landed), Negotiable (How is
  direction; the flag is the obvious fix but the torn-line fallback is
  design), Valuable (one outcome: no false restart/announce), Estimable
  (one function + fixtures; low), Small (four scenarios, two invariants),
  Testable (fixture logs with NUL bytes, stubbed restart/announce).

