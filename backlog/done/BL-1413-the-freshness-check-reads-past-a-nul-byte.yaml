id: BL-1413
title: "The freshness check measures a heartbeat log from the last heartbeat BEFORE a NUL byte: GNU grep stops at binary content, so one crash-zeroed line from 2026-08-30 makes five live supervisors read six days stale, and since cron came back at 04:00Z the check restarts handoffd and four healthy supervisors every cool-off and announces FRESHNESS_VIOLATION every two minutes"
milestone: M8
type: defect
severity: high
# high: a live fault degrading behaviour AND a broken health signal. handoffd
# (with its supervisor) has been killed and restarted every ~5 minutes since
# 04:00Z on a healthy box (12 restarts by 05:30Z), the same for four other
# supervisors, and the Operator topic carries ~120 false alarms an hour. Not
# critical: the swarm keeps running between restarts and no data is lost.
status: todo
epic: swarm-reliability
priority: 2
direction: human-requested
