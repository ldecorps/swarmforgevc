id: BL-1671
title: "check_merge_deletion.sh diffs the WORKING TREE against each parent (git diff --name-status -M HEAD, no --cached) while its own header says it reads the index-held merge result, so a tracked non-YAML path deleted on disk but never staged reads as a deletion the merge makes: on 2026-09-21 the daemon's master-main reconcile was refused twice on the shared checkout (08:43Z a specifier's unstaged rm; 08:47Z swarmforge/runtime/handoff-draft.txt, a TRACKED draft that swarm_handoff.bb deletes after every master-resident send), tripped the main-sync deadlock latch, suppressed wakes and dropped-parcel nudges and paged the human - the guard judges the index, and an unstaged deletion is neither a finding nor touched by the merge"
milestone: M8
type: defect
severity: high
# high: a live fault in delivery machinery - a diverged main cannot join
# while any seat leaves an unstaged deletion of a tracked non-YAML path on
# the shared checkout, and one such deletion is made by every note or
