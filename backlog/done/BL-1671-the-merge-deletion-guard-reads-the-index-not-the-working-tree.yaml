notes: |
  Minted 2026-09-21 by the specifier after the sweep landed (304a373c06),
  the same pass. AUTO-APPROVED under the 2026-09-17 operator hotfix
  (severity defect, no ruling_options) - see
  auto-approve-high-severity-defects-amendment-20260917.md.

  Interim for every seat until this lands: never leave a tracked
  non-YAML path deleted on the shared checkout without committing the
  removal in the same minute (retire a file as a modification instead -
  the sweep's scenario-less tombstones are that shape); after any send
  from the specifier or coordinator draft path while main is diverged,
  `git checkout -- swarmforge/runtime/handoff-draft.txt`. A reconcile
  refusal reading `merge deletes '<path>' ... not named in the commit
  message` on a path nobody committed a deletion of is this ticket's
  shape: restore the path from HEAD and the daemon rejoins on its next
  tick.

  The specifier's 08:54Z note to the coordinator ("main reconcile loops
  merge-abort/no MERGE_HEAD ... step 0") was premature - the daemon had
  already rejoined at 08:52:54Z; no daemon defect, recorded here so the
  same reading is not repeated.

  INVEST: Independent (guard and test exist; nothing unbuilt), Negotiable
  (the read is the requirement, the flag is direction), Valuable (a
  diverged main joins whatever an idle seat left on disk), Estimable (two
  flags, one test case, one handler - one sitting), Small (three
  scenarios, one invariant), Testable (the real guard under the real hook
  in a fixture, seconds).

