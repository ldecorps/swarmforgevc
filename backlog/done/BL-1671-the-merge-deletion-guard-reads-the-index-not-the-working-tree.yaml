human_approval: approved
approval_context: >
  A new feature file is authored here, so it would ordinarily need a tap;
  it is minted approved under the 2026-09-17 operator hotfix (severity
  defect, no choice posed, no ruling_options). FIRM: the guard's finding
  set is computed from the index against each parent, never from the
  working tree - BL-1242's, BL-1341's and BL-1662's scenarios are
  unchanged and stay green, and a path the merge RESULT drops is refused
  exactly as today unless the message names its ticket. FIRM: nothing
