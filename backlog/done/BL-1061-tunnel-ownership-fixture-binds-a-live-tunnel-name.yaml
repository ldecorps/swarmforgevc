id: BL-1061
title: "A tunnel-ownership property fixture binds the operator's REAL tunnel name and drives a reap that enumerates the host process table - so the suite cannot pass while the live tunnel is up, and the suite's own reap can kill it"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
priority: 95
direction: swarm-reported
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1061-tunnel-ownership-fixture-binds-a-live-tunnel-name.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl1061::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them. Verified absent from index.js at spec time, so the anchor cannot pass before the work is done"

invariants:
  - "A tunnel-ownership fixture never binds a name any process outside the run could be serving: the name is unique to the run, and a reap the run performs can only ever select a pid that run created."
  - "The suite leaves no cloudflared-shaped process alive past its own run, however the test dies; a fixture leaked by an earlier run is not alive by the time any assertion reads the process table."

description: >
  AMENDED 2026-08-22 by the specifier, after the coder measured the parcel's
  base commit and found this description named the wrong file and the wrong
  cause. The defect is real and both invariants stand unchanged; what follows
  is the corrected account. Nothing already built changes. The superseded
  wording, and why it was wrong, is preserved under AMENDMENT RECORD in notes.

  TWO COUPLED DEFECTS, and the order they land in is what makes them one ticket.

  1. THE REAP HAS NEVER WORKED ON A GNU USERLAND.
  `swarmforge/scripts/tunnel_ownership_lib.sh:166` enumerates reap candidates
  with `pgrep -fl -- "run $name"`. `-f` decides what pgrep MATCHES (the full
  command line - correct); `-l` decides what it PRINTS, and the two userlands
  disagree. BSD/macOS prints the full argument list; procps-ng prints the
  process NAME only. Measured on this host (procps-ng 4.0.4, 2026-08-22):
  `pgrep -fl -- "sleep 45"` prints `343923 sleep`, where `pgrep -af` prints
  `343923 sleep 45`. `tunnel_decide_orphans` looks for a `run <name>` token
  pair in the text after the pid, is handed `<pid> bash`, matches nothing, and
  selects nothing. So the reap silently no-ops on Linux, which is why orphaned
  fixture tunnels accumulate on this host at all. Same class as BL-1058's
  BSD-only `mktemp -t`: authored on macOS, inert on Linux, green either way.
  This is why `extension/test/bl857TunnelOwnershipInvariants.property.test.js`
  fails its invariant 1 with `pid[0] expected alive=false, got alive=true` -
  its own fixture, under its own unique name, survives its own reap. That
  failure reproduces under a name no other process could be serving.

  2. A FIXTURE BINDS THE OPERATOR'S REAL TUNNEL NAME - and it is NOT bl857.
  `extension/test/bl787NamedTunnelInvariants.property.test.js` sets
  `SWARMFORGE_NAMED_TUNNEL: 'swarmforge-bubble'` at three sites (lines 165,
  231, 348) and roots its fixtures at `bl787-ready-prop-*` - which is exactly
  what the leaked fake cloudflared processes observed on this host were
  launched from. bl857 contains the production name exactly ONCE, in a comment
  at line 18 saying never to use it, and routes every fixture through
  `uniqueName()`. bl857 is the suite that FAILS; bl787 is the suite that BINDS.

  WHY THE ORDER MATTERS. While the reap silently no-opped, bl787's
  production-name binding was inert: nothing was ever selected, so nothing was
  ever signalled. Repairing the enumeration is precisely what ARMS a reap
  scoped to `swarmforge-bubble` to reach the operator's live tunnel - and
  `stop_ancillary_services.sh` reaps through the same name-matched shape. So
  landing the enumeration repair WITHOUT the fixture-name fix would be strictly
  worse than landing nothing, and the two cannot be split across parcels. Both
  are in scope here. Reviewers: the enumeration repair is IN SCOPE for this
  ticket and is not an out-of-scope diff.

  This is the engineering rule "never diff shared globals (/tmp, broad `ps`
  patterns, live runtime paths) - redirect through env seams", and the lib
  already provides the seam: tunnel_ownership_lib.sh:124-128 documents a pure
  filter that "never calls pgrep or kill itself, so a unit test can feed it
  fabricated" candidate lines.

  HOW (direction, not mandate). For the binding: drive the pure filter with
  fabricated candidate lines, or give every fixture a per-run unique name no
  real process can serve - or both. For the enumeration: keep pgrep for the
  pid narrowing and move the LISTING to something POSIX that prints the full
  command line on both userlands. `pgrep -a` is procps-only and is NOT the fix
  - macOS pgrep has no `-a`. The reap's production DECISION (the word-boundary
  `run <name>` check) is the thing under test and is not what changes.
  Invariant 2's sweep obligation is separate and still owed: the suite must not
  depend on a clean process table it did not establish (the process-table
  analogue of BL-971's sweep-by-prefix-BEFORE-the-run rule - nothing traps
  SIGKILL, so a killed run always leaves its fixture behind).

  OUT OF SCOPE. The other four files in the same QA report are NOT this ticket
  and are NOT the same defect - see notes. Every other `pgrep -fl` site in the
  production scripts belongs to BL-1068, not this ticket - the three that
  actually decide or record from the truncated text, and the four that read
  only the pid and are therefore unaffected.

qa_e2e_procedure: >
  1. At the parent commit, with the operator's real Bubble tunnel UP, run
  `npx vitest run --config vitest.properties.config.mjs
  test/bl857TunnelOwnershipInvariants.property.test.js` from extension/ and
  confirm the absence of the behaviour: its invariants fail on the first
  generated case. 2. At the parcel commit, repeat with the real tunnel still UP
  and confirm all three invariants pass. 3. Confirm no fixture binds the
  production name: grep the parcel's property tests and their fixture helpers
  - bl787NamedTunnelInvariants (the binder, three sites at the base commit),
  bl857TunnelOwnershipInvariants, and any shared fixture-name helper - for the
  literal `swarmforge-bubble`, and confirm every remaining occurrence is a
  comment or a negative assertion, never a name a fixture launches under.
  4. Confirm the enumeration repair is real, not just green: on this GNU host,
  confirm the reap now selects a fixture process it created (the base commit
  selects nothing), and confirm the listing does not depend on `pgrep -a`,
  which macOS does not have. 5. Confirm the reap is scoped: with a process
  bound to a DIFFERENT name alive, run the suite and confirm that process is
  still alive afterwards (`kill -0`). 6. Confirm the sweep: leave a
  fixture-shaped process alive, start the suite, and confirm it is gone before
  the run's first process-table assertion. 7. Confirm no leak: after a full run
  AND after a run killed mid-flight with SIGKILL, confirm no cloudflared-shaped
  process from the fixture survives.

notes: >
  AMENDMENT RECORD (specifier, 2026-08-22). The coder measured the base commit
  and reported, in `backlog/evidence/BL-1061-coder-root-cause.md` (commit
  f378db6bc), that this ticket named the wrong file. I verified every claim
  independently against `main` and the live host before amending: bl857 has one
  occurrence of the production name, in a comment forbidding it; bl787 has
  three binding sites; and `pgrep -fl` truncates to the process name on this
  host's procps-ng 4.0.4. The superseded description asserted that bl857's
  fixture "launches its fake cloudflared under the literal production tunnel
  name swarmforge-bubble". That was wrong twice: bl857 does not bind the name,
  and its failure is caused by the inert enumeration (cause 1), not by a name
  collision. Fixing bl857's fixture, as the original wording directed, would
  have changed nothing. The mis-attribution was mine, not the coder's: I
  matched the failing suite to the leaked `bl787-ready-prop-*` fixture roots
  without checking which suite created them. BOOKKEEPING ONLY - the parcel
  already implements the corrected account, no rebuild is asked for, and no
  bounce is charged to any role for this.

  OPERATOR ACTION, OUTSIDE THIS TICKET AND NOT DONE BY ME: at spec time a fake
  cloudflared leaked by an earlier property run was still alive on this host
  bound to the production tunnel name (PID 752728, fixture root
  `bl787-ready-prop-sw7H7K`; the coder later observed 3260911 and 3261290 from
  the same family). I did not kill them - they are not mine and the standing
  rule is to surface, never sweep, what I did not create. Re-checked
  2026-08-22 after the coder's pass: `pgrep -af "run swarmforge-bubble"` now
  matches only the operator's genuine tunnel (PID 316866), so those leaks are
  gone. The leaker was BL-787's ready-property fixture, which is corroborating
  evidence for invariant 2 rather than a separate finding.

  PROVENANCE. QA `note` 00_20260822T134343Z_000879: "Property lane flaky under
  worktree load: bl857,796,643,968,948 - investigate". That single note named
  five files with one diagnosis; investigation found FOUR distinct mechanisms
  and the diagnosis holds for only one of them (BL-1063). Split 1:4 under the
  specifier's Consolidation Authority: this ticket (bl857, live-process-table
  contamination), BL-1062 (bl968 + bl948, unseeded reach floors), BL-1063
  (bl796, unsynchronized backgrounded child - the only genuinely load-sensitive
  one), BL-1064 (bl643, a deterministic grounding gap that is not flakiness at
  all). Full evidence, including the raw run log line numbers, is in
  backlog/evidence/BL-1061-property-lane-triage-20260822.md.

  NOT A LOAD PROBLEM. Recorded explicitly because the reporting note said load:
  these failures are contamination, not contention. They fail identically on an
  idle host, and they would keep failing if the fork pool were reduced to one.

  SPUN OFF, NOT SWEPT: the coder's pass found the same `pgrep -fl` truncation
  in six other production scripts. Four read only the pid and are unaffected;
  two decide a kill from the command TEXT and are therefore inert on Linux
  (`start_bridge_headless.sh:137`, `kill_pipeline_swarm.sh:243`). Neither is
  touched by this parcel. Ticketed as BL-1068, which also carries a third site
  and a same-line pattern defect I found while verifying.

  IR-DRY judgment recorded: 1 finding -> 0. A medium-confidence possible-synonym
  between "the ownership suite starts" and "the ownership suite runs". Real
  drift, not deliberate contrast, so it was resolved: the sweep scenario now
  says "reaches its first assertion about the process table", which is also the
  behaviourally precise moment the invariant cares about.

