qa_e2e_procedure: >
  (1) `bash swarmforge/scripts/test/test_check_documenter_briefing_tip.sh`
  ONCE on the parcel commit: PASS including the large-output cases. (2)
  `cd extension && npx vitest run --config vitest.properties.config.mjs
  test/bl1459DocumenterBriefingTipGuardInvariants.property.test.js` once:
  6 passed, duration recorded. (3) `grep -n 'grep -q' swarmforge/scripts/check_documenter_briefing_tip.sh`
  names no line whose grep reads from a process pipe. (4) The parcel's
  evidence names the sighting's mechanism or its retirement with the
  bounded counts. Never "run it N times" beyond the bounded search above.
  (5) Amendment: BL-1459's feature green through the runner once with
  scenarios 09 and 10; in a fixture per BL-1390, land an out-of-lane
  file's content on main by a commit built off main, then `--tip` a
  documenter commit carrying the briefing and that same file: OK; change
  main's copy of the file: refused naming it. (6) On the live checkout,
  read-only: `--tip` on the newest documenter briefing commit after the
  documenter has merged origin/main prints OK (or names only residue).

