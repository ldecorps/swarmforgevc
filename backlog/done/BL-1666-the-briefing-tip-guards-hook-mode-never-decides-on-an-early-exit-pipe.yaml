invariants:
  - "No decision in check_documenter_briefing_tip.sh depends on a pipe whose consumer can exit before its producer has finished writing; every exemption is computed from a fully read input."
  - "For every path outside the lane, a tip whose blob at that path equals the landed main's blob at that path is exempt whatever its commit ancestry; a path whose blob differs from, or is absent on, the landed main is refused."

description: |
  ## What is wrong

  `swarmforge/scripts/check_documenter_briefing_tip.sh` (landed
  8fad11b0dc, BL-1459) runs under `set -euo pipefail`. Hook mode decides
  two exemptions through early-exit pipes:

  ```
  284: if ! git rev-list --first-parent "${LANDED_MAIN}..${DOCUMENTER_BRANCH}" 2>/dev/null | grep -qx "$INCOMING"; then
  304: if ! git diff --name-only "$BASE" "$INCOMING" 2>/dev/null | grep -q "^${BRIEFINGS_DIR}"; then
  ```

  `grep -q` exits at the first match while the producer may still be
  writing (a long first-parent list; a diff with many paths); the
  producer dies of SIGPIPE, pipefail reports 141, `if !` reads it as
  "not on the line" or "no briefing path", and the merge is NOT judged -
  a briefing tip carrying out-of-lane content lands through the chain
  unjudged. BL-1660 measured the race in a library (57 of 400 runs under
  load, deterministic past the pipe buffer); the guard's `--tip` mode
  has no such pipe (`already_landed_day` uses `git rev-parse --verify`)
  and the specifier's 200 loaded runs of a same-date tip refused every
  time.

  Separately, QA ran `extension/test/bl1459DocumenterBriefingTipGuardInvariants.property.test.js`
  seventeen times after BL-1459 landed (evidence
  `backlog/evidence/unowned-red-bl1459-property-test-flaky-not-deterministic-20260920.md`,
  QA branch): sixteen passed, one failed invariant 1 with
  `AssertionError: expected refusal for the already-landed date 2090-01-01,
  got status 0: DOCUMENTER_BRIEFING_TIP_OK` (test.js:94, the sameDate
  branch). The specifier's one run on main passed 6 of 6 (4.0 s) and the
  guard reproduced no spurious OK under load; identical contents are not
  the mechanism (`writeCommit` throws on an empty commit). Open
  candidates: a concurrent lane's blind temp-root sweep taking the
  fixture root mid-draw (BL-1623/BL-1636: the fixture uses `mkTmpDir`
  under the shared temp dir), or a fixture-state interaction between
  consecutive draws. coder@2's earlier "stale non-vacuity marker" report
  was against the pre-rebuild copy on its branch and is moot on main.

  ## What is wanted

  - Lines 284 and 304 read their whole input: `grep -x ... >/dev/null`,
    or capture the list into a variable and test it in bash; the guard's
    shell test gains a case per exemption whose producer output is far
    larger than the pipe buffer with the match on its first line.
  - The property's fixture roots are `trackedTmpRoot`-registered (BL-1636)
    and each draw's repository is created and read inside one step so a
    sweep between draws cannot empty it; then a bounded search: the file
    three times, and a loop over invariant 1's own draws (one process)
    long enough to cover ten thousand draws. A failure found is fixed
    with its mechanism named in the evidence; none found retires the
    sighting there with the counts.
  - Register row for the property file (lane property, owner BL-1666,
    added at mint) leaves in this parcel's land (BL-1631).

  ## How (direction, not mandate)

  - `first_parent_list="$(git rev-list --first-parent "$range")"; grep -qx
    "$INCOMING" <<<"$first_parent_list"` keeps the -q with no producer
    process to kill; same for the diff. Mirror BL-1660's shell case for
    the large-output shape.

  ## Amendment 2026-09-21 - the out-of-lane exemption judges content, not ancestry

  QA note to the specifier, priority 00, 2026-09-21T09:04:06Z (inbound
  00_20260921T090406Z_003047_from_QA), verbatim: "briefing lane guard
  exempts by ancestry not content, ev e4aafc21a8". QA's evidence
  (`backlog/evidence/documenter-briefing-lane-guard-false-positive-hand-built-provenance-20260921.md`,
  on the QA branch), verbatim: "`judge_tip_paths()` ... exempts it when
  `git merge-base --is-ancestor "$anchor" "$landed_main"`. This is a
  COMMIT-ANCESTRY check, not a content-equality check."

  ### What is wrong

  `judge_tip_paths` (~line 147) exempts an out-of-lane path only when the
  last commit on the TIP's lineage that touched it (`git log -1 ... "$tip"
  -- "$path"`) is an ancestor of the landed main. Six tickets landed on
  2026-09-21 through the condition-(g) hand-build recipe (BL-1657,
  BL-1661, BL-1667, BL-1664, BL-1630, BL-1668): their content sits on
  origin/main in FRESH commits built off origin/main, never the pipeline
  commits the documenter branch carries, so the ancestry test fails on
  content that is byte-identical. Landing the 2026-09-20 briefing
  `f6ab94c8d4` (its own diff: `docs/briefings/2026-09-20.md` alone) was
  refused. Census from the master checkout on 2026-09-21 09:1xZ, the
  guard's own direct mode (`bash swarmforge/scripts/check_documenter_briefing_tip.sh
  --tip f6ab94c8d4`, LANDING = local main): 92 offending paths; comparing
  `git rev-parse f6ab94c8d4:<path>` with `git rev-parse origin/main:<path>`
  for each: 80 identical, 5 differ (`backlog/done/BL-1656-*.yaml`,
  `backlog/evidence/BL-1657-land-escalate-20260920.md`,
  `backlog/standing-reds.tsv`, two `docs/how-to/*.md`), 7 absent on main
  (two `backlog/active/BL-16{30,57}-*.yaml` since moved to done/, four
  evidence files, one `.feature.draft`). The 80 are this defect; the 12
  are inherited pipeline residue the documenter branch never synced
  away - true out-of-lane content (five would auto-merge silently into
  main's newer files), correctly refused, and the documenter's duty (its
  prompt now says to merge origin/main before composing).

  ### What is wanted (added scope)

  - `judge_tip_paths` exempts a path when the tip's blob equals the
    landed main's blob at that path (`git rev-parse -q --verify
    "$tip:$path"` vs `"$landed_main:$path"`), checked FIRST; the ancestry
    test stays as the second exemption for a path the tip removed or a
    tree entry with no blob. A path whose blob differs from, or is
    absent on, the landed main is refused exactly as today.
  - `test_check_documenter_briefing_tip.sh` gains a case: the out-of-lane
    content is landed on the fixture's main by a commit built off main
    (not the documenter's commit), the guard prints OK; and a case where
    main carries a DIFFERENT version, still refused.
  - Two scenarios join BL-1459's feature in this parcel, their steps in
    the existing handler in the SAME commit (BL-233), text below.
  - The evidence re-runs the census above on the parcel's day (the
    offender count after the fix must be the residue only).

  ### Scenario text for BL-1459's feature (added by this parcel)

  ```
  # BL-1459 an-out-of-lane-path-the-landed-main-already-carries-is-exempt-by-content-09
  Scenario: an out-of-lane path whose content the landed main already carries is exempt whatever its commit ancestry
    Given a documenter commit that changes the day's briefing file and docs/index.md
    And the landed main carries that same docs/index.md content through a commit that is not an ancestor of the documenter commit
    When the guard judges that commit as a tip
    Then it prints DOCUMENTER_BRIEFING_TIP_OK

  # BL-1459 an-out-of-lane-path-whose-content-differs-from-the-landed-main-is-refused-10
  Scenario: an out-of-lane path whose content differs from the landed main is refused even when an older version of it was landed
    Given a documenter commit that changes the day's briefing file and docs/index.md
    And the landed main carries a different docs/index.md content
    When the guard judges that commit as a tip
    Then it refuses naming docs/index.md
  ```

  ### Interim (specifier adjudication, same pass)

  `backlog/evidence/BL-1666-briefing-lane-guard-exempts-by-ancestry-not-content-adjudication-specifier-20260921.md`:
  QA lands `docs/briefings/2026-09-20.md` (from f6ab94c8d4) and then
  `docs/briefings/2026-09-21.md` (from 8c67e0eefc) as hand-built
  docs-only commits off origin/main, byte-identical, subject `Land
  documenter briefing <sha> (hand-built, specifier ruling 2026-09-21)`;
  the `--tip` OK of QA.prompt step 2 is waived for those two commits
  only. Until this lands the documenter merges origin/main into its
  branch before composing (documenter.prompt).

