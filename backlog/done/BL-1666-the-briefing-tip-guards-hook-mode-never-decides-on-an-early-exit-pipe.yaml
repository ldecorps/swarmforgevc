approval_context: >
  No feature file is authored or changed here; minted approved under the
  2026-09-17 operator hotfix (severity defect, no choice posed, no
  ruling_options). FIRM: hook mode keeps its three exemptions (not on
  the first-parent line, already on the landed main, no briefing path in
