  property's own draws) - never by loosening the assertion.
  AMENDED 2026-09-21 by the specifier on QA's note 003047 (evidence
  e4aafc21a8): the same guard's out-of-lane exemption judges commit
  ANCESTRY, so content the landed main already carries through a
  hand-built replay (condition (g), six lands on 2026-09-21) is refused as
  unprovenanced - the 2026-09-20 briefing cannot land. Folded here rather
  than minted apart: same 327-line guard, same test file, one sitting,
  and two parcels on one file cannot run concurrently anyway. Two
