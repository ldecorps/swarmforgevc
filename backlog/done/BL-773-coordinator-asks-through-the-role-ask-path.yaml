notes: |
  2026-08-07 human: PROMOTE alongside BL-819 for the specifier. Both are
  in active/; specifier may close/reshape either and mint a third ticket if a
  combined design better covers the mid-verification note-delivery incident
  (briefing 2026-08-07) plus the lean ledger (BL-818/819).

  ## Specifier triage outcome, 2026-08-07

  Kept as written, plus the correction now in `description`. Neither this
  ticket nor BL-819 was reshaped or closed, and they were NOT combined: a
  human-attention channel and a durable telemetry ledger are orthogonal
  concerns, and merging them would mint an oversized incoherent ticket
  (BL-634). The third ticket the human authorized was minted instead:

  - **BL-846** (`type: defect`, `severity: high`, `backlog/paused/`) — the
    actual mid-verification delivery defect. `resolveRolePaneTarget` resolves
    a rotating role's live pane from a `roles.tsv` session mono-router never
    creates, so answer delivery always falls to the queued-note leg, which a
    role holding in-process work is forbidden to read.

  Do not treat this ticket as closing the 2026-08-07 incident when it lands;
  BL-846 is what closes it.

  ## Approach steps re-measured against `main`, 2026-08-07 — what is left

  - **Step 1 (coordinator.prompt ask section) — DONE by the specifier in this
    parcel.** A role prompt is specifier-owned (Article 1.2, "sole writer of
    the constitution and prompt files"), so the coder must not rewrite it;
    review it like any other received content and bounce it to the specifier
    if it is wrong. It satisfies this ticket's own `required_wiring`.
  - **Step 2 (coordinator topic resolves) — ALREADY SATISFIED, no change
    needed.** Verified live: `.swarmforge/operator/role-topic-map.json` already
    carries `"coordinator":3901`. Do not add an entry, and do not introduce a
    fallback to a shared or standing topic — the spec forbids it and the map
    needs nothing.
  - **Step 3 (the answer reaches the coordinator) — coder's, plus the step
    handlers.** The four scenarios in the live `.feature` have no handlers yet
    (`grep` over `specs/pipeline/steps/` finds none); they land in this parcel
    per BL-233. Note the coordinator has a standing tmux session, so its answer
    resolves through the live-pane leg and is NOT affected by BL-846.

  So the remaining code work is the step handlers plus verification, not the
  prompt and not the topic map.

  ## e2e procedure for QA

  With a live swarm, drive the coordinator to raise an optioned question
  (`bb swarmforge/scripts/role_ask.bb "$(pwd)" --role coordinator --question
  ... --options '["a","b"]'`), confirm it appears in the coordinator's Telegram
  topic with two tappable buttons, tap one, and confirm
  `.swarmforge/operator/role-answers/coordinator.json` holds the tapped label
  and that the coordinator's next `ready_for_next.sh` returns the answer note.
  Confirm the coordinator session never exited during the wait.
