invariants:
  - "A question is answerable in exactly one place: the role-ask record for the asking role. No slice of this epic may write a second pending-question or answer store."
  - "The one-pending guard is per role: one role's outstanding question can never refuse, consume, or clear another role's."

required_wiring:
  - "swarmforge/roles/coordinator.prompt::role_ask.bb::the coordinator prompt tells the coordinator when and how to raise a clarifying question; an unwired mechanism asks nothing (the BL-419 shape)"

description: |
  ## What

  Wire the coordinator into the existing role-ask path, the same way the
  specifier already is. When the coordinator hits a decision it cannot resolve
  from the backlog, the config, or the constitution, it runs
  `role_ask.bb --role coordinator`, ends its turn, and is woken when the answer
  lands — instead of blocking, or surfacing the question only on whichever
  remote-control surface happens to be attached.

  ## Why this is wiring, not a new mechanism

  `role_ask.bb` is already role-generic: it takes `--role`, keeps a per-role
  pending file at `.swarmforge/operator/role-awaiting/<role>.json`, and the
  front-desk bot already publishes and answers from that file. It is referenced
  by exactly one role prompt — the specifier's (`grep -rn 'role_ask'
  swarmforge/roles/*.prompt`). Nothing about the coordinator is special; it was
  simply never given the instruction.

  This is deliberately the smallest slice of BL-772 that removes the harm
  reported in the ORIGINAL intake — a coordinator question with no ask path of
  its own, surfacing only on whichever remote-control surface happened to be
  attached. Bubble's spoken nudge (slice C) and the escalation ladder (slice E)
  sit on top of it and are not in this parcel.

  ## What this slice does NOT fix (correction, 2026-08-07)

  It does not fix the 2026-08-07 stuck-QA deadlock, despite that shift's
  briefing and this ticket's own earlier `notes` recording that it would
  "formalize" it. Measured against the code: in that incident the ASK leg
  already worked — the coordinator ran `role_ask.bb --role QA` and the question
  reached Telegram. What failed was DELIVERY of the answer back to a role
  holding in-process work. This slice touches only
  `swarmforge/roles/coordinator.prompt`, so it cannot reach that path, and the
  coordinator has a standing tmux session, so the broken leg never bites the
  coordinator's own asks at all.

  **BL-846** is that incident's actual fix. This ticket keeps its own
  independent merit: the coordinator borrowing another role's `--role` (as it
  had to in the incident) consumes that role's one-pending slot, files the
  answer under that role's identity, and wakes that role instead of the asker.

  ## Approach

  1. Add a "Raising a clarifying question" section to
     `swarmforge/roles/coordinator.prompt`, modelled on the specifier's: the
     command, `--options` for enumerated choices with free-text always
     available, ONE pending at a time, **no polling**, record the resume
     context and end the turn.
  2. Confirm the coordinator's topic resolves for publication the way the
     specifier's does. If the role-topic map has no coordinator entry, add it —
     do not fall back to a shared or standing topic, which would be the second
     routing system BL-772 exists to avoid.
  3. Confirm the answer note reaches the coordinator on its next receive.

  Take particular care with the coordinator's no-exit rule: asking must never
  become a reason for the coordinator session to end or to spin. It asks, it
  records context, it ends the TURN — the session stays up (BL-107).

  ## Out of scope

  - Bubble announcing or speaking that a question is waiting — slice C.
  - Any escalation, reminder, or timeout — slice E extends BL-584 rather than
    adding a timer here.
  - Stale/superseded question closure — slice D.
  - Wiring the remaining pipeline roles (cleaner, architect, hardender,
    documenter, QA). Once the coordinator proves the generic path with a second
    role, extending it is mechanical; doing all seven at once is a bigger blast
    radius than the reported harm justifies.

approval_context: >
  Defaults I picked, all amendable — none of them are load-bearing enough to
  wait on:

  (1) **Per-role topic, not one standing questions topic.** A standing topic
  would duplicate routing the role-topic map already does, and the intake asks
  explicitly for no second decision system.

  (2) **Inline buttons, not polls**, for optioned questions — matching
  role_ask.bb and the approval taps you already use. Free-text always remains
  available, as it does today.

  (3) **This slice is the coordinator only**, not all seven roles. If you would
  rather every role gain the ask path in one go, say so and I will widen it.

  The one thing genuinely worth your judgement: this slice makes the question
  VISIBLE in Telegram but does not yet make Bubble announce it. If the harm you
  actually felt was "I did not hear about it" rather than "it was not in
  Telegram", tell me and I will pull slice C forward ahead of this one — it
  needs BL-769's Android test seam first, which is why I did not lead with it.

