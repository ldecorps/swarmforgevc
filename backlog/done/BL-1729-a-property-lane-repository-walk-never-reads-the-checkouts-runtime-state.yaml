id: BL-1729
title: "The property lane dies on the V8 per-worker heap cap on the shared main checkout (BL-1651's crash signature back: two FATAL heap deaths then ERR_IPC_CHANNEL_CLOSED, 5 of 5 main refusals, 0 in any worktree), so every extension/src commit on main is refused unless the guard is overridden: bl874PortableTimeInvariants and tempDirTrapGuard walk the whole repository root through the shared tolerant walk, which skips .worktrees/ but not the gitignored .swarmforge/, and read its 475 MB of bundled .js (the operator's VS Code CLI servers) into one worker (894 MB and 1778 MB alone on main); the walk never opens the root's runtime directories"
milestone: M8
type: defect
severity: high
# high: a broken safety signal. On the shared main checkout the pre-commit
# property guard cannot return a verdict: the full lane crashes the same
# way on every run (refusal-000001..000005, 2026-09-17 and 2026-09-24/25,
# two heap deaths each), so every commit there that stages extension/src or
# a property file must override the guard (BL-1121: recovery only, never
# the standing recipe) and ships with its properties unverified. The lane's
# verdict also depends on which checkout runs it, not on the code. Not
# critical: nothing is lost, and role worktrees and lands are unaffected.
