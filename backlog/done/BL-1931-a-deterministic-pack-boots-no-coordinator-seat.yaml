description: |
  ## What is wrong

  On a pack declaring `config coordinator_mode deterministic` (BL-1846,
  BL-1847) the launcher still provisions the coordinator seat:
  `provision_coordinator` (swarmforge.sh, census group A) registers and
  starts it like any role, and the session and launch loops create its
  session and write `.swarmforge/launch/coordinator.sh`. On the all-local pack
  that seat is a second qwen client on the one GPU slot; on 2026-09-30 it
  spent 32 minutes walking .swarmforge/ while the resident waited.

  ## What is wanted

  On such a pack, launch keeps the coordinator as a roster row and a mailbox
  and starts no seat. Census constraint: removing the row breaks QA
  approvals (`swarm_handoff.bb` refuses `to: coordinator`), handoffd
  delivery and BL-1847's relay, and on a rotation-router pack
  `is_sequential_dormant` assumes the coordinator is the last role, so QA
  would become a second standing session. The pack
  `swarmforge/packs/ollama-ista-local-model-mono-router.conf` declares
  `config coordinator_mode deterministic` and drops its `coordinator_agent`,
  `coordinator_model` and `coordinator_effort` lines (otherwise
  `check_local_model_seat_windows` still checks a coordinator card).

  ## How (direction, not mandate)

  - Read the mode with `coordinator-config-lib/deterministic-coordinator?`
    (add a mode field to coordinator_config_cli.bb for the shell side).
  - `test_coordinator_provisioned_infrastructure.sh`'s secondary-mode
    regression (:162-178) is a ready template for the fixture launch.
  - Step handler: specs/pipeline/steps/bl1931DeterministicPackBootsNoCoordinatorSeatSteps.js,
    registered in specs/pipeline/steps/index.js.

  ## What each stage checks

  - Coder: the three scenarios; test_coordinator_provisioned_infrastructure.sh
    and test_rotation_sequential_pack.sh still pass.
  - Architect: the three invariants; that nothing removes the row.
  - Hardender: no Stryker lane for bb/shell (BL-472); a hand-mutant pass on
    the mode check, evidence records the degraded fallback.
  - Documenter: docs naming the coordinator as always provisioned
    (census "Prose" list, docs side).

qa_e2e_procedure: |
  1. `node specs/pipeline/cli.js specs/features/BL-1931-a-deterministic-pack-boots-no-coordinator-seat.feature` passes 3 of 3.
  2. `bash swarmforge/scripts/test/test_coordinator_provisioned_infrastructure.sh` and `bash swarmforge/scripts/test/test_rotation_sequential_pack.sh` pass.
  3. `grep -E '^config coordinator_(mode|agent|model|effort)' swarmforge/packs/ollama-ista-local-model-mono-router.conf` prints only `config coordinator_mode deterministic`.

