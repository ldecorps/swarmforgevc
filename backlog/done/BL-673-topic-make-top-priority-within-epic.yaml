approval_context: >
  Second half of the 2026-07-26 operator ask (drill-down reprioritization
  within an epic, "dependencies between topics must be maintained").
  Decisions to sign off: (1) the peer set is the target's OWN epic's live
  topics (paused/ + hold/), but the dependency check and the
  order-preservation invariant are GLOBAL — depends_on crosses epic
  boundaries in today's backlog (e.g. BL-624 -> BL-590), so a cross-epic
  live dependency ranked worse refuses the move exactly like a same-epic
  one. (2) Conflict semantics are refuse-with-named-blockers, never a
  cascade-promotion of the dependency chain and never a downward move; a
  better-ranked live dependency bounds the move (target lands immediately
  after its worst-ranked live dependency). Amend if you want cascade.

