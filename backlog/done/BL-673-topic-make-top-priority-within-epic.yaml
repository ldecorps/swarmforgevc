description: |
  ## What

  The backend for per-topic make-top-priority scoped to one epic: a POST
  route (control-auth, like BL-672's) taking an epic id and a topic id,
  applying BL-672's operation with the peer set = the other live topics
  carrying that epic: id. Reuses BL-672's pure decision core parameterized
  by peer set — this slice must not fork a second renumbering algorithm.

  Semantics inherited from BL-672, restated at this level:
  - Target lands strictly better than every other live topic of its epic,
    unless a live dependency (any epic) bounds it — then immediately after
    the worst-ranked live dependency, reason says so.
  - A live dependency ranked worse than target, a cycle in the live
    transitive depends_on closure, or a dangling depends_on id: refuse,
    changed:false, blockers named, nothing written. done/ deps satisfied;
    active/ deps ignored for ordering.
  - Displacement bumps preserve the relative order of every non-target
    pair globally — a within-epic move must not silently reshuffle other
    epics' topics in the global promotion queue.
  - The tapped epic id must exist and the target topic must carry it;
    mismatches are a 404-class refusal, not a silent global move.

  ## Constraints

  - Ticket YAML priority: only — never handoff priority (Article 3.2.4).
  - Pure core stays filesystem-free; the dependency-closure walk wants
    property tests over generated dependency graphs reaching cycles and
    cross-epic edges (BL-654 asserted-generator-reach, not hoped-for).
  - Coder materializes the .feature.draft to .feature and wires step
    handlers in the same parcel (BL-441/BL-233).

  ## e2e QA procedure

  Against the live bridge: pick a real epic with >=2 live topics, apply
  topic make-top to a dependency-free topic — verify it tops its epic's
  topics, one commit, other epics' topic order untouched. Apply to BL-624
  (live dep BL-590 in hold/) — verify bound-or-refuse per BL-590's rank
  that day, with the reason naming BL-590.
