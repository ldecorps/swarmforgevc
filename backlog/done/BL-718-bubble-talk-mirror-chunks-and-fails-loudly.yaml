approval_context: >
  Two defaults chosen without asking, cheap to amend:
  (1) a mirror failure is surfaced to the OPERATOR channel (log plus operator
  alert), not spoken to the human on the phone — the turn itself succeeded and
  interrupting it with a delivery complaint seemed worse than a quiet operator
  alert; (2) the mirror keeps failing soft with respect to the phone turn: a
  dead mirror never fails the human's Let's Talk turn. Amend if you want the
  failure announced in Bubble itself, or the turn marked degraded.

