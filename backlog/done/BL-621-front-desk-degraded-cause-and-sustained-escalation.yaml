approval_context: >
  One recommendation to veto cheaply: the sustained-outage escalation
  reuses the stuck-delivery direct Telegram send (works during a getUpdates
  409) with a default 30-minute continuous-failure threshold, once per
  episode. If you would rather have email (like the supervisor's gave-up
  path) or a different threshold, say so. Firm: the degraded warning line
  carries the underlying error text from now on — 9 anonymous hours is the
  incident this closes.

notes: |
  2026-08-21 coordinator: blast-radius evidence, same investigation that
  queue-jumped BL-582 (BL-1026 approval tap silently not registering).
  Front-desk's getUpdates poller is the ONE consumer of the shared bot
  token by design (cursorBridgeInboundQueue.js: "only the front desk may
  call getUpdates"; Host/Bubble updates are forwarded into
  cursor-bridge-inbound.jsonl, drained by telegram-cursor-bridge.js, which
  never polls itself). So a front-desk poll-degraded episode blacks out
  not just its own Approvals/BL-topic traffic but Host (Cursor) and Bubble
  too - this is a bigger blast radius than the approval-tap symptom alone
  suggested.

  Concrete evidence, same day: a human message posted to the Host topic
  (asking to reorder pipeline-board sections) produced zero downstream
  effect. `.swarmforge/operator/bridge-cost.jsonl` (the Cursor-agent API
  call ledger) has NO entries at all for 2026-08-21 - last entry
  2026-08-20T10:43:29Z - meaning the Cursor agent was never invoked, not
  that it ran and failed to reply. `cursor-bridge-inbound.jsonl` doesn't
  exist on disk either, but that's inherently ambiguous (drain-then-delete
  makes "never arrived" and "arrived and drained clean" look identical) -
  the cost-ledger silence is the load-bearing evidence here, not the
  missing queue file.

  Not a new root cause, and not asking for new scope: this is supporting
  evidence for THIS ticket's own item 2 (sustained-outage escalation) -
  a silent poll-degraded episode has now been shown to cost more than a
  missed approval repaint. Left as a note, not a description rewrite,
  since content/scope changes are the specifier's call.

