out_of_scope: |
  - Any Telegram API work: no `editForumTopic`, no topic migration, no subject
    change. Measured absent — see `source:`. Re-adding it is scope creep.
  - Renaming or rewording anything under `backlog/evidence/` or `backlog/done/`
    (invariant 3), including the six BL-590 architect bounce records and the two
    parked property tests.
  - Renaming live ticket / feature-file FILENAMES (their content is renamed).
  - Behaviour change of any kind. If a test needs a new assertion to pass, that is
    a signal the rename changed behaviour and the parcel is wrong.
  - Building, finishing or re-cutting the Onboarder itself. Slice 1 is on `main`;
    BL-624 and BL-625 own slices 2 and 3 and will be written in the new vocabulary
    after this lands.
  - Writing the class documentation. BL-643 owns it and now depends on this.

notes: |
  Sequencing, and why this ticket exists separately at all: BL-643's criterion 1
  says docs must not describe a name the code does not use. So the order is
  BL-684 (this) -> BL-643 (prose) -> BL-624/BL-625 (remaining slices, already in
  the new vocabulary). BL-590 slice 1 has already landed on `main`, so there is no
  in-flight parcel for this rename to collide with — that was checked, not
  assumed, before scheduling the rename ahead of the unparked BL-590 work.

  Cheapest-now argument, restated with the new measurement: 36 files on 2026-07-25,
  49 on 2026-07-26. Every parcel built in the old vocabulary adds to it.

  ## Materialized 2026-07-27 (specifier) — BL-441 recovery, with five corrections

  The coder bounced this blocked: `acceptance:` pointed at a `.feature.draft`, which
  no `*.feature` glob and no acceptance runner picks up (BL-441 class). The draft is
  now the live `specs/features/BL-684-...feature`; the `.draft` is removed. Lint gate
  clean; IR-DRY clean (38 step occurrences, 35 unique, 0 findings).

  Five scenarios were CORRECTED rather than shipped verbatim, because each was
  unimplementable as drafted and would have bounced. Intent and scope are unchanged
  in all five — no re-opening of the human's ruling:

  1. **01** contradicted boundary 2, scenario 11 and the done-command: "no live file
     name contains facilitator" is false while this ticket's own filename keeps its
     slug. Reframed to the allowlist form above.
  2. **04/05** asserted "a supervisor is started" — a real `bb` supervisor process
     plus the launcher's `sleep 0.1` pid-claim poll, inside the acceptance suite.
     That breaks engineering.prompt's no-real-timers rule. Reframed to the launcher's
     observable DECISION (declines / does not decline). Real-process coverage stays
     where it already lives: the supervisor tick test, scenario 09.
  3. **08** ran the acceptance suite from inside the acceptance suite — unbounded
     recursion, and no precedent for it anywhere in `specs/`. Reframed to the static
     property it was reaching for: every live feature file's steps resolve against
     the step registry, checked without executing them.
  4. **09**'s "assertions are unchanged from before the rename" is a git-history
     claim that rots the moment any later parcel touches that test. Dropped from the
     durable contract — it is a REVIEW obligation (architect/hardener), not an
     executable scenario. The behaviour claim itself survives as "it passes".
  5. **10** had the same history-claim problem. Reframed to something durably
     checkable and actually stronger: the dated record STILL CONTAINS the old word,
     which is direct evidence it was not rewritten.

  ## One implementation snag the coder should know about, not a prescription

  `launch_onboarding_facilitator.sh` exits on `*_LAUNCH_DRYRUN=1` at line ~28,
  ABOVE the pid-alive guard at line ~48. So dryrun cannot currently exercise the
  guard at all — and the guard is exactly what scenarios 03/04/05 test. Reaching it
  from a test needs either the dryrun check moved below the guard or a separate
  seam. Which one is the coder's call; flagged so it is not discovered late.
