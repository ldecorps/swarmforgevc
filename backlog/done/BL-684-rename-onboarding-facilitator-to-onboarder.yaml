approval_context: >
  RULED by the human, 2026-07-26, answering BL-643's own three-way naming choice:
  **full rename to "Onboarder"** — not "keep Facilitator", not the split (public
  name vs internal module vocabulary). Relayed again through the coordinator the
  same evening: `BL-643 ruled "Onboarder" (rename first)`. BL-643's acceptance
  criterion 1 requires the rename to land as its OWN parcel first, which is this
  ticket; BL-643 now declares `depends_on: [BL-684]` so the ordering is data, not
  a comment.

  Three SCOPING boundaries below are specifier calls made inside that ruling, not
  a re-opening of it — the ruling rejected splitting the *vocabulary*, and this
  ticket renames all of it. What it declines to rewrite is historical *record
  identity*. Amend any of the three if the reading is wrong:

  1. `backlog/evidence/` and `backlog/done/` are untouched (invariant 3).
  2. Live ticket and feature-file FILENAMES keep their `BL-###-...` slug — that
     path is a durable cross-reference from evidence files, `backlog/topics/`
     records, `acceptance:` pointers and git history. Their CONTENT vocabulary is
     updated like any other live surface.
  3. No Telegram work is needed — see the measurement in `source:`. BL-643 feared
     a user-visible topic subject; there is none.

source: |
  ## Measured on the live repo, 2026-07-26 (not recalled)

  ```
  git grep -lI  -i facilitator          ->  49 tracked files
  git grep -oI  -i facilitator | wc -l  -> 456 occurrences
  git ls-files | grep -i facilitator    ->  26 files with it in the NAME
  ```

  BL-643 measured 36 files the day before. The word is still spreading, which is
  the whole argument for doing this now.

  ## Two premises checked — one false, one worse than described

  **FALSE: "the Telegram topic subject is user-visible, so a later rename touches
  something the human already reads"** (BL-643 `notes:`). It does not. The reserved
  topic is created from `ONBOARDING_TOPIC_NAME` and mapped to
  `ONBOARDING_SUBJECT_ID` (`extension/src/tools/telegram-front-desk-bot.ts:782`);
  the human already reads the word "Onboarding". A repo-wide sweep for a
  `Facilitator` string LITERAL returns only paths, imports, identifiers and usage
  lines naming a file — no user-facing text anywhere. So this parcel needs no
  `editForumTopic` call, no topic migration and no Telegram risk at all. That is a
  real shrink of the ticket BL-643 imagined, and the reason it is stated here is so
  no reviewer re-adds the work.

  **WORSE: the agent is RUNNING while this lands.**

  ```
  .swarmforge/operator/onboarding-facilitator-supervisor.pid   -> pid 1253738, alive
  .swarmforge/operator/onboarding-facilitator-heartbeat.json   -> written minutes ago
  .swarmforge/operator/onboarding-facilitator-supervisor.status.json
  .swarmforge/operator/onboarding-facilitator-supervisor.log
  .swarmforge/operator/onboarding-facilitator-supervisor.stop  (stop sentinel)
  ```

  FIVE runtime paths form a contract between four files written in three languages:
  the launcher (`launch_onboarding_facilitator.sh`), the supervisor
  (`onboarding_facilitator_supervisor.bb`), the reconcile CLI
  (`onboarding-facilitator-reconcile.ts`) and `stop_ancillary_services.sh`. Rename
  the paths in some and not others and the failure is not a broken build — it is a
  second supervisor launched alongside the first (the pid guard at
  `launch_onboarding_facilitator.sh:48` looks at a path that no longer exists), or
  an agent that the documented stop route can no longer stop. That is what
  invariant 2 exists for, and it is why this is a `medium`-cost parcel and not a
  one-line sed.

description: |
  ## What to rename

  `facilitator` / `Facilitator` / `FACILITATOR` disappears from live surface, in
  filenames and in content, replaced by the ruled word: `onboarder` /
  `Onboarder` / `ONBOARDER`. The enclosing directory `extension/src/onboarding/`
  already says "onboarding" and does not change.

  Filename moves (`git mv`, so history follows):

  ```
  swarmforge/scripts/launch_onboarding_facilitator.sh     -> launch_onboarder.sh
  swarmforge/scripts/onboarding_facilitator_supervisor.bb -> onboarder_supervisor.bb
  swarmforge/scripts/test/test_onboarding_facilitator_supervisor_tick.sh
                                                          -> test_onboarder_supervisor_tick.sh
  extension/src/onboarding/onboardingFacilitatorState.ts      -> onboarderState.ts
  extension/src/onboarding/onboardingFacilitatorStateStore.ts -> onboarderStateStore.ts
  extension/src/tools/onboarding-facilitator-reconcile.ts     -> onboarder-reconcile.ts
  extension/test/onboardingFacilitatorState.test.js           -> onboarderState.test.js
  extension/test/onboardingFacilitatorStateStore.test.js      -> onboarderStateStore.test.js
  extension/test/onboardingFacilitatorReconcileCli.test.js    -> onboarderReconcileCli.test.js
  specs/pipeline/steps/bl590OnboardingFacilitatorSteps.js     -> bl590OnboarderSteps.js
  ```

  Runtime state under `.swarmforge/operator/` (all five, together):

  ```
  onboarding-facilitator-heartbeat.json          -> onboarder-heartbeat.json
  onboarding-facilitator-supervisor.pid           -> onboarder-supervisor.pid
  onboarding-facilitator-supervisor.log           -> onboarder-supervisor.log
  onboarding-facilitator-supervisor.status.json   -> onboarder-supervisor.status.json
  onboarding-facilitator-supervisor.stop          -> onboarder-supervisor.stop
  ```

  Identifiers follow the same rule — `handleOnboardingFacilitatorMessage`,
  `OnboardingFacilitator*` types, `onboarding_facilitator_*` shell and Babashka
  names. Comments and doc prose in live files too: this is the vocabulary, not
  just the API.

  ## The live-process handoff — the part that is not mechanical

  Because a pre-rename supervisor may be running when the new code first starts:

  - The renamed launcher uses ONLY new-named paths, and additionally refuses to
    start when an OLD-named pid file still holds a LIVE pid, printing why. It
    never adopts, kills or migrates that process — it declines and reports, so a
    human stops the old one deliberately.
  - `stop_ancillary_services.sh` removes the agent's artifacts under BOTH names
    for this one release. Marked in-file as a compatibility shim with the reason,
    so a later cleanup knows why it is there and when it can go.
  - No automatic migration of heartbeat/status CONTENT. They are ephemeral
    liveness data, regenerated within one supervisor tick; migrating them buys
    nothing and risks reading a pre-rename heartbeat as current (invariant 2).

  ## Step handlers and feature files move together

  `specs/pipeline/steps/bl590OnboardingFacilitatorSteps.js` matches step text in
  `specs/features/BL-590-*.feature`. Where the step TEXT contains the old word,
  the text and its handler pattern change in the SAME commit, and the acceptance
  suite passes — a handler renamed out from under a live `.feature` makes
  `specs/pipeline/runtime.js` throw for every parcel in flight, not just this one.

  ## What "done" looks like, as a command

  ```
  git grep -lI -i facilitator -- . ':!backlog/evidence' ':!backlog/done' ':!backlog/topics'
  ```

  returns EXACTLY this allowlist and nothing else — the files whose own SUBJECT is
  the rename, which cannot describe replacing a word without naming it:

  ```
  backlog/active/BL-684-rename-onboarding-facilitator-to-onboarder.yaml
  specs/features/BL-684-rename-onboarding-facilitator-to-onboarder.feature
  ```

  Separately, and with no allowlist: no script, module, entrypoint, identifier,
  env var or `.swarmforge/` state-file NAME contains the old word anywhere.

  (Corrected at materialization, 2026-07-27. The earlier wording — "returns only
  paths whose FILENAME is a `BL-###` record slug, and every one of those files'
  CONTENT is already renamed" — cannot hold: `git grep -l` matches CONTENT, so a
  file whose content was renamed is not returned at all. The allowlist above is the
  same intent stated so it can actually be checked. Boundary 2 of `approval_context`
  is unchanged: live `BL-###` FILENAMES keep their slug, which is why this ticket's
  own two filenames still carry the old word.)

  `backlog/topics/*.json` is excluded as dated record. Those files serialise
  Concierge messages ALREADY POSTED to Telegram; rewriting them would falsify what
  was actually sent. Invariant 3's own rationale — "a record keeps the words that
  were actually used when it was written" — covers them, though it names only
  `backlog/evidence/` and `backlog/done/`. Specifier call at materialization; amend
  if the human reads invariant 3 more narrowly.

