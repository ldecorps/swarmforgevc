human_approval: approved
approval_context: >
  A new feature file is authored here, so it would ordinarily need a tap;
  it is minted approved under the 2026-09-17 operator hotfix (severity
  defect, no choice posed, no ruling_options). FIRM: the chase ladder's
  shape (chase up to maxChases, then respawn a genuinely dead role, else
  dead-letter) and its cooldown are unchanged; this adds the guards the
  wake path already has (busy pane) plus a lane-running reading, caps
  respawns at one per role per sweep, and makes every respawn explain
  itself. FIRM: a role with a truly dead pane and no running lane is still
  respawned exactly as today.

invariants:
  - "A role is never respawned while its own pane shows the busy footer or a test lane is running under its worktree; liveness read from a stale heartbeat alone never respawns a role whose pane or lane is alive."
  - "One sweep respawns a role at most once, however many of its inbox items have reached the chase ceiling, and each respawn writes one log line naming the role, the item that triggered it, the liveness state, the heartbeat age, the pane activity age, the busy reading and the lane reading."

description: |
  ## What is wrong

  `chase_sweep_lib.bb` `decide-item-action`: an inbox new/ item older
  than `chaseTimeoutSeconds` (30 s) on a role with no pane activity for
  `stuckInProcessTimeoutSeconds` (60 s) goes to `decide-stale-item-action`,
  which chases up to `maxChases` (3) and then, when the role's liveness is
  `dead`, `unknown` or `stuck`, answers "respawned". Liveness comes from
  `compute-liveness` over the role's heartbeat (stale 30 s, in-flight
  60 s, dead 120 s) and its pid. The daemon's `:trigger-respawn!` adapter
  gates on busy only for the mono-router resident pane ("a classic-pack
  role's own respawn ... must not be blocked by an unrelated busy
  resident/coder pane") - a standing-pack role's OWN busy pane is not
  consulted. And the decision runs per item: every stuck item past the
  ceiling answers "respawned" in the same sweep.

  2026-09-19: QA dequeued BL-1636's parcel at 02:45Z and ran its lanes.
  At 03:52Z the daemon still saw the pane busy (`chase-wake-skip-busy
  QA`). QA's new/ held five items (001379-001382, 001693) whose chase
  counts had climbed to 6, 8, 10, 12 and 19 across the hours. At
  04:01:31Z the sweep logged `chase-respawn QA ./.swarmforge/launch/QA.sh`
  seven times within 350 ms, and the chaser telemetry records a
  `respawn` row per item at 04:07:09Z (counts 6, 8, 10, 12, 19). The
  babysitter then read `pane alive but NO claude process` at 04:03:17Z
  and 04:08:18Z; the claim-idle ladder counted the absent pane to 6 and
  bounced QA at 04:06:08Z (BL-1649); a second `chase-respawn` x7 followed
  at 04:07:10Z. `/proc/vmstat oom_kill` is 0 since boot: nothing but the
  daemon killed that session. QA re-claimed at 04:11Z and restarted the
  80-minute verification from scratch. No respawn line says why.

  ## What is wanted

  1. `decide-stale-item-action` (or its caller) takes `pane-busy?` and
     `lane-running?`; either true yields "chased" (or "skipped" inside
     backoff), never "respawned". `pane-busy?` is the same footer reading
     `chase-poke-and-notify!` uses for `chase-wake-skip-busy`;
     `lane-running?` is true when a vitest, stryker, bb test runner or
     the acceptance CLI is running with the role's worktree as its cwd
     (the `pgrep -af` reading roles already make, scoped to the
     worktree path).
  2. One respawn per role per sweep: the sweep collects the roles whose
     items decided "respawned" and triggers each once, naming the first
     triggering item; the other items keep their counts.
  3. Every respawn logs `chase-respawn <role> item=<id> liveness=<state>
     heartbeat-age-s=<n> activity-age-s=<n> busy=<b> lane=<b>`; the
     telemetry `respawn` row gains the same fields.

  ## How (direction, not mandate)

  - The pure decision stays pure: gather the two readings in
    `handoffd.bb`'s chase sweep (the busy reading exists; the lane
    reading is one `pgrep` per role per sweep, cached for the sweep) and
    pass them in; runner cases for every combination of liveness,
    busy and lane.
  - The per-sweep set is a `(reduce ... #{})` over the items' decisions
    before any adapter fires.
  - Wiring: the handoffd chase wiring shell test drives one sweep on a
    fixture root with five stuck items, a stale heartbeat and a busy
    footer, and asserts zero respawns and one log line per item chased;
    then the same with the footer absent and no lane, and asserts exactly
    one respawn and one respawn log line.
  - Docs: `swarmforge/handoff-protocol.md`'s chase/respawn paragraph and
    `docs/how-to/BL-611-babysitterd-runbook.md` (the proc-<role> CRIT is
    now distinguishable from a daemon respawn by the log line);
    `docs/diagrams/handoff-flow.mmd` only if it draws the chase ladder.

constraints: >
  The chase ladder's thresholds, backoff and cooldown are unchanged. The
  lib stays adapter-injected; fixtures are mkdtemp roots and fake
  readings, never the live daemon (BL-1390). The step handler lands in
  the same commit as the feature (BL-233). Runtime seconds (BL-1541).

out_of_scope: |
  - The claim-idle ladder's own guards (BL-1649, in flight).
  - Why a role's heartbeat (`.swarmforge/heartbeat/<role>.yaml`, written
    by `extension/src/tools/heartbeat.ts` writeHeartbeat) goes stale
    during a long lane: the heartbeat is a liveness input; this ticket
    stops it from being the ONLY input to a respawn. Name its writer's
    cadence in evidence.
  - The property lane's own crashes (BL-1651).

qa_e2e_procedure: >
  (1) Unit: the bb runner covering chase_sweep_lib.bb green with the new
  cases; the wiring shell test green. (2) Acceptance: the BL-1652 feature
  green through the runner, once. (3) On a scratch daemon-shaped root:
  five stuck items on QA, a heartbeat 10 minutes old, and a pane capture
  carrying the busy footer - one sweep logs no `chase-respawn`; remove
  the footer and the sweep logs exactly ONE `chase-respawn QA ...` line
  with all seven readings. (4) Live, after land: `grep chase-respawn
  .swarmforge/daemon/handoffd.log` shows one line per real respawn, each
  with its readings, and never a burst. Never "run it N times".

