qa_e2e_procedure: |
  On the parcel commit, from `extension/`:
  1. Make a counting shim: `mkdir -p tmp/shim && printf '#!/bin/sh\necho x >> "$BL1564_COUNT"\nexec <real bb> "$@"\n' > tmp/shim/bb`
     with `<real bb>` the absolute path from `command -v bb` resolved
     OUTSIDE the shim dir, `chmod +x`, then `BL1564_COUNT=$PWD/tmp/count
     PATH=$PWD/tmp/shim:$PATH npx vitest run --config
     vitest.properties.config.mjs
     test/bl1297MergeOwnPathsInvariants.property.test.js` five times ->
     green every time, `wc -l < tmp/count` at most 3 per run (unfixed: 98).
  2. Each run's stdout prints `BL-1564 reach map (invariant 1)`,
     `(invariant 2)` and `(invariant 3)` with `cases` at least 21, 18 and
     18 respectively; vitest's per-test duration for invariant 3 is a
     small fraction of the 20 s budget (about 2 s on a quiet host,
     against 7.6-8.7 s alone and > 20 s in the lane unfixed).
  3. `npm run test:properties` from `extension/` -> this file green in
     the full lane; the standing-red row for it is gone from
     `backlog/standing-reds.tsv`.
  4. `git diff main...HEAD --name-only` names the property test, the
     step handler, the feature, evidence, and the register row removal;
     `extension/src/`, the three bb libraries, `vitest.properties.config.mjs`
     and `property_suite_standing_allowlist.tsv` are unchanged;
     `grep -n 'numRuns: 15\|numRuns: 12\|numRuns: 8' <the test>` still
     shows all three counts.
  5. Break-then-restore: move one invariant's bb call back inside its
     per-case loop; the shim count leaves 3 and scenario 02 fails on the
     first run; restore.

