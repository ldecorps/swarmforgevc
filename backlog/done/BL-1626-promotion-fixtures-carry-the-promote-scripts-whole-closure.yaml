description: |
  ## What is wrong

  The coder (seat 1, BL-1614 pass, evidence
  `backlog/evidence/BL-1614-coder-unowned-reds-20260917.md` in
  `.worktrees/coder`) ran every feature whose handler drives
  route_backlog_to_coder.sh and found four red on main. The specifier
  reproduced all four on main 695624c52c at 14:18 local
  (`run_acceptance.sh`, exit 1 each). Three share one class:

  - `specs/features/BL-803-promote-route-sed-bsd-portability.feature`:
    "no eligible paused ticket" - `bl803PromoteRouteSedPortabilitySteps.js`
    copies promotion_gates_cli/lib, backlog_depth_lib and
    swarm_identity_lib (lines 27-33, a hand list annotated "BL-853: ...
    both must travel with the copy"); backlog_depth_lib.bb has load-filed
    daemon_cycle_guard_lib.bb since BL-966 (5c8b0835f8, 2026-08-20), so
    the copied gate dies at load and the promote finds nothing eligible.
    Red since 2026-08-20.
  - `specs/features/BL-1028-promotion-must-not-bypass-a-refused-integrity-commit.feature`:
    same class - its list (lines 44-48) includes daemon_cycle_guard_lib
    but not acceptance_pointer_gate_lib.bb, which promotion_gates_lib.bb
    load-files since BL-626 (ea14fa3039, 2026-08-25). Red since then.
  - `specs/features/BL-1100-promotion-candidacy-is-decided-by-structured-fields-never-prose.feature`:
    "freshness HOLD for BL-9100: interpretFreshnessCliOutput failed -
    fail closed" - promote_and_route_next.sh's BL-1173 gate (lines
    250-274) looks for `$ROOT/extension/out/tools/deprecate-check.js`,
    then relative to the SCRIPT's own directory; the handler copies the
    script into the fixture root (line 52), so both lookups land inside
    the fixture, find nothing, and the gate holds fail-closed. Red since
    the gate was wired (2026-08-27).

  BL-1538 fixed exactly this shape for one property runner and left the
  helpers: `computeClosure(scriptsDir, entryFile)` and
  `diffClosureAgainstList` in `specs/pipeline/steps/lib/operatorRuntimeBbClosure.js`,
  `copyScriptClosure(liveScriptsDir, targetScriptsDir, entrypoints)` in
  `extension/test/helpers/pinnedRepoFixture.js`. Two handlers never
  adopted them.

  ## What is wanted

  - bl803 and bl1028 build their fixture's scripts dir by deriving the
    closure of the entry points they copy (promote_and_route_next.sh's
    bb entry points: promotion_gates_cli.bb and every load-file it
    reaches), never a list; `diffClosureAgainstList` reports nothing
    missing for either fixture (scenario 01).
  - bl1100's fixture lets the freshness gate find the real CLI, and the
    gate answers `allow` for the fixture ticket on its own (scenario 02).
  - A census: every step handler that copies promote_and_route_next.sh or
    promotion_gates_cli.bb into a fixture derives its closure; the
    population is counted and at least the three named (scenario 03,
    BL-1445).
  - BL-803, BL-1028 and BL-1100 green as written (QA e2e); their four
    register rows (three here, BL-937's under BL-1627) leave in their
    lands.

  ## How (direction, not mandate)

  - Replace each hand list with `copyScriptClosure(SCRIPTS_DIR,
    fixtureScriptsDir, ['promotion_gates_cli.bb'])` or `computeClosure`
    plus a copy loop; keep the shell entry point's copy as is.
  - bl1100: `fs.symlinkSync(path.join(REPO_ROOT, 'extension'),
    path.join(root, 'extension'))` in the fixture builder (the gate then
    resolves `$ROOT/extension/out/tools/deprecate-check.js`, and
    deprecate-check reads the fixture root for the ticket and
    adjudications), or a `SWARMFORGE_DEPRECATE_CHECK_CLI` path seam in
    promote_and_route_next.sh's `deprecate_check_cli` resolver - an
    injection of WHERE the real tool is, never a result bypass
    (engineering.prompt). The symlink needs no production change; prefer
    it unless bl1100's other scenarios read the fixture's extension/.
  - Census handler: grep `specs/pipeline/steps/*.js` for the two entry
    point names in a copy call, assert each such file requires one of the
    two closure helpers, print the count.
  - Documenter: the how-to for BL-1538 (if any) lists the three handlers
    as consumers; engineering-detailed.prompt "Acceptance Pipeline" gains
    the invariant's sentence.

constraints: >
  Three step handlers, one census scenario and handler, evidence and
  docs, four register rows (the three here; BL-937's row is BL-1627's).
  No change to any of the three features' scenarios, to
  promote_and_route_next.sh beyond an optional CLI-path seam, to the
  closure helpers, or to any library. The step handler lands with the
  feature (BL-233). Evidence named BL-1626-*.

out_of_scope: |
  - BL-937's feature (BL-1627).
  - A lane that runs landed features (BL-1625, which absorbed BL-1628 on 2026-09-18); any other landed feature
    the census or that lane finds red is its own unowned-red note.

qa_e2e_procedure: |
  On the parcel commit, from the repo root, with extension/out compiled:
  1. `bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-803-*.feature`,
     the same for BL-1028 and BL-1100 - each ONCE, each green.
  2. Acceptance resolving all three scenarios of this feature
     (`bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1626-*.feature`).
  3. The three register rows gone from backlog/standing-reds.tsv;
     `bb swarmforge/scripts/standing_red_register_cli.bb .` names none of
     the three files.
  4. `git diff main...HEAD --name-only` names no library under
     swarmforge/scripts except, if the seam was chosen,
     promote_and_route_next.sh.

