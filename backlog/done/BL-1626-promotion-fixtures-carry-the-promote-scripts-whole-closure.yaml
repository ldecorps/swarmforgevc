approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: no scenario of BL-803,
  BL-1028 or BL-1100 is reworded or retired - their fixtures are repaired
  so they pass as written. FIRM: the closure is DERIVED at fixture build
  from the real load-file graph (BL-1538's invariant), never a longer
  hand list. FIRM: the freshness gate is not bypassed - the fixture gives
  it the real CLI (a link or copy of the repository's extension/out under
  the fixture root, or a CLI-path injection seam that points at the real
  tool), and the gate answers allow on its own. FIRM: the census names
