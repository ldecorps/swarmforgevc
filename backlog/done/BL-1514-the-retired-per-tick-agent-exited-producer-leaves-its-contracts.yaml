id: BL-1514
title: "Three acceptance features still assert the operator tick's per-tick AGENT_EXITED producer that BL-653 retired on 2026-08-26 (BL-368 scenario 03, BL-359 scenario 05, BL-647 scenarios 02-05): red on main for 15 days, hidden by the per-feature runner and, since 2026-09-09, by the ninth fixture-list drift aborting the tick before the assertion; the superseded scenarios are retired, never reworded, and the unwired dead-agent-events producer leaves with them"
milestone: M8
type: defect
severity: high
# high (standing-red rule 2026-09-05): three acceptance-lane features red
# on main since 2026-08-26, deterministic (pass 3 / fail 1, pass 2 / fail
# 5, pass 6 / fail 1 at mint), now three register rows. The runtime is
# right (BL-653 is the human's own wake-model ruling); the broken thing is
# three durable contracts still asserting the mechanism it retired, which
# is exactly what the rule refuses to call medium.
status: todo
epic: code-quality-gates
priority: 12
direction: swarm-reported
depends_on: []
