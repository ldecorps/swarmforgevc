# POST-retirement: the superseded scenarios gone, every remaining one
# still resolving and green (the BL-1251 shape). Not a claim of ownership
# over BL-368's or BL-359's contract; their other scenarios are not edited.
acceptance: specs/features/BL-368-control-loss-is-not-agent-death.feature

# BL-1276: the retiring ticket by construction edits the superseded
# tickets' feature files; declared so the task-scope gate does not read
# the edits (and BL-647's deletion) as foreign. Exact path, one per line.
retires:
  - specs/features/BL-368-control-loss-is-not-agent-death.feature
  - specs/features/BL-359-always-on-operator-presence.feature
  - specs/features/BL-647-rotation-router-liveness.feature

