notes: |
  Minted 2026-09-10 by the specifier on the coder's unowned-red note, the
  same pass (standing-red rule: high at first sighting). Three register
  rows, lane `acceptance`, one per feature file, each naming this ticket,
  first_seen 2026-09-10 (first recorded; red since 2026-08-26, BL-653's
  land).

  Grepped first: no open ticket names any of the three features, their
  handlers, dead-agent-events or the operator tick's liveness; BL-653 is
  closed (done/M8) and its out_of_scope says "BL-647's fix. It lands
  first and stays valid: liveness producers must be pack-aware whoever
  hosts them" - a statement about the babysitter (BL-804 delivered it),
  not a charter to keep BL-647's operator-tick contract. BL-594 (epic
  tracker) and BL-659 mention AGENT_EXITED only in unrelated prose. One
  ticket, not three: one cause, one remedy, and the three files share the
  hardener re-stamp and the same land.

  human_approval is pending because landed feature files change (rows are
  retired, one file is deleted); it poses no choice. The specifier does
  not edit the features on main at mint - the retirement rides the parcel
  (BL-1385: never amend a feature on main while a parcel may carry a
  stamped copy).

