human_approval: approved
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: the target stays stock
  macOS /bin/bash 3.2 (engineering.prompt, BL-801) - nothing here
  loosens it; the two scripts are made to comply. FIRM: BL-937's scenario
  02 (the static construct scan over every tracked script) is kept
  unchanged and is the standing guard. FIRM: BL-937's scenarios 01 and 03
  ("Given the stock system bash reports version 3.2") are RETIRED, not
  reworded - their premise is the host, which this swarm no longer runs
  on; the runtime check they made is kept as a qa_e2e step that runs
  only on a macOS host. FIRM: no skip semantics are added to the
  acceptance runner.

invariants:
  - "No tracked shell script uses a construct stock bash 3.2 lacks; the static scan is the guard and it holds on every host."

description: |
  ## What is wrong

  `specs/features/BL-937-shell-scripts-run-on-stock-macos-bash-32.feature`
  fails on main (specifier reproduction on 695624c52c, exit 1):

  - Scenarios 01 and 03 (Outlines): `Given the stock system bash reports
    version 3.2` -> "expected /bin/bash --version to report 3.2, got: GNU
    bash, version 5.2.21(1)-release (x86_64-pc-linux-gnu)". The handler
    (bl937*Steps.js line 133) asserts the HOST's /bin/bash version. The
    feature was minted on a macOS host; the swarm runs on WSL/Linux now,
    so those scenarios cannot pass here and prove nothing about the
    scripts when they do pass elsewhere.
  - Scenario 02 (the static construct scan) flags two tracked scripts
    correctly: `mapfile -t` at swarmforge/scripts/check_bb_scripts_load.sh:140
    and swarmforge/scripts/check_constitution_doc_citations.sh:41 and 67.
    `mapfile`/`readarray` is a bash 4 builtin; stock macOS bash 3.2 dies
    on it. Both scripts are commit guards in the BL-1242 chain - the first
    thing a macOS operator's commit would run.

  The coder found this while regression-checking BL-1614 (evidence
  `.worktrees/coder/backlog/evidence/BL-1614-coder-unowned-reds-20260917.md`);
  no lane runs landed features, so nobody had seen it (BL-1625, which absorbed BL-1628 on 2026-09-18).

  ## What is wanted

  - The two scripts read their lists with a bash-3.2 construct (`while
    IFS= read -r line; do arr+=("$line"); done < <(...)`, arrays initialised
    `arr=()` and expanded `${arr[@]+"${arr[@]}"}` under `set -u`, BL-801)
    and behave identically: same candidate files, same touched paths
    (scenario 01 scans the two files with the feature's own construct
    regexes; scenario 02 runs BL-937's static scan over every tracked
    script and it passes).
  - BL-937's feature file loses scenarios 01 and 03; its Feature narrative
    is re-tensed where it states the host premise as present (BL-1006);
    scenario 02 is byte-identical (scenario 03 here reads the file).
  - The register row leaves in the same land.

  ## How (direction, not mandate)

  - In each script, replace `mapfile -t NAME < <(cmd)` with
    `NAME=(); while IFS= read -r __line; do NAME+=("$__line"); done < <(cmd)`
    and keep every later `"${NAME[@]}"` under the `${NAME[@]+"${NAME[@]}"}`
    form if the script runs under `set -u`. Run each guard's own shell
    test (suite-manifest rows) before and after.
  - Retire the two Outlines from the feature file; keep their step
    handlers' code only if scenario 02 still uses it, else delete with the
    scenarios (the runner throws on a scenario with no handler, never on a
    handler with no scenario).
  - Documenter: docs/how-to for BL-937 (if any) records the retirement and
    the macOS-only e2e step; engineering-detailed.prompt "Test Speed And
    Isolation" already names the target - add `mapfile`/`readarray` to
    its examples.

constraints: >
  The two scripts, BL-937's feature file (retirement only) and its
  handler, this feature and handler, evidence and docs, the register row.
  No change to any other script, to the construct regex table, or to the
  acceptance runner. The step handler lands with the feature (BL-233).
  Evidence named BL-1627-*.

out_of_scope: |
  - A pinned bash 3.2 binary for Linux hosts, or running the retired
    runtime scenarios under one.
  - Any further construct the scan may flag on other scripts: each is its
    own unowned-red note (the scan is green on the parcel, so none today).

qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-937-*.feature`
     ONCE -> green (scenario 02 only remains).
  2. Acceptance resolving all scenarios of this feature.
  3. `bash swarmforge/scripts/check_bb_scripts_load.sh` and
     `bash swarmforge/scripts/check_constitution_doc_citations.sh` each
     run once on a staged no-op change and exit 0; their own shell tests
     green.
  4. On a macOS host only, if one is available: the two guard scripts run
     under /bin/bash 3.2 to completion - recorded in the evidence when
     run, skipped with a note when no such host exists.
  5. The register row for BL-937's feature gone from
     backlog/standing-reds.tsv.

