notes: |
  ## Severity rationale

  `medium`, matching BL-789 and for the same reason: nothing is swarm-down
  today — the fix is live and working on this host. But the body sits on the
  health-signalling path, its failure mode is silent (a daemon that looks
  alive while its sweeps fail), and the untracked lib means every OTHER
  checkout has a freshness path that dies at a missing `source`. Unreviewed,
  it also risks becoming an ancestor of an unrelated approval (BL-506).

  ## Acceptance contract is runnable (BL-761)

  Every scenario drives the real lib and scripts with a fixture project
  root, a fake `~/.nvm` tree, and stub binaries on PATH — no cron
  installation, no live daemons, no network, no sudo. Same harness shape as
  BL-789's contract; `swarmforge/scripts/test/test_daemon_log_freshness.sh`
  already exists and is the natural home for the checker-side assertions.
  Scenarios 04–06 drive `operator_path_lib.sh` directly — it is a plain
  POSIX-sh testable module. Per engineering.prompt's tool table, shell
  bodies gate on their shell tests; no mutation/CRAP numbers should be
  asked of the `.sh` files beyond the normal suite.

  ## Scenario 05 pins a correction, not current behaviour

  The hand lib's no-alias fallback is `ls -1d "$_base"/v* | tail -n 1` —
  lexicographic, so v9.11.2 sorts after v22.1.0. Scenario 05 deliberately
  pins newest-by-version-order instead. The coder should expect a red
  acceptance run against the unmodified hand lib; that red is the point.
  The same lexicographic tail also sits in the alias prefix-match branch
  (`v22*` matching multiple v22.x) — same fix applies.

  ## IR-DRY findings — reviewed, deliberately kept

  Three medium-confidence `possible-synonym` findings, each a real
  difference in meaning rather than accidental drift:

  - "the resolved bin directory belongs to version v22.1.0" versus
    "...v9.11.2" — one step pattern with a parameterized version; the two
    scenarios assert opposite winners under opposite preconditions
    (alias present versus absent).
  - "the launched daemon inherits a PATH..." versus "the restart command
    inherits a PATH..." — two distinct call sites (start script versus
    freshness restart); the wiring existing in BOTH is the ticket's point.
  - "the crontab entry sets a PATH containing the resolved nvm node bin
    directory" versus "the nvm node bin directory is resolved" — a Then
    assertion about installer output versus the When action that exercises
    the resolver; different sections, different meaning.

  ## e2e procedure for QA

  1. `git ls-files --error-unmatch swarmforge/scripts/operator_path_lib.sh`
     succeeds on the parcel — the lib is tracked, the core defect gone.
  2. `bash swarmforge/scripts/test/test_daemon_log_freshness.sh` — green.
  3. Fixture root + fake nvm tree with v9.11.2 and v22.1.0, node absent
     from PATH: run the cron installer against a stub crontab; the written
     line's `PATH=` contains the v22.1.0 bin dir (version order, not
     lexicographic). Do not touch the live crontab.
  4. Run the checker with `PATH=/usr/bin:/bin` and a stub
     `FRESHNESS_START_CMD` that records `command -v node`: the restart
     resolves node.
  5. Run `start_handoff_daemon.sh` with a PATH resolving bb but not node,
     `HANDOFFD_BB` pointed at a stub that records its environment: the
     launched process resolves node.
  6. With `~/.nvm/alias/default` naming v9.11.2, the resolver returns the
     v9.11.2 bin; with the alias removed, the v22.1.0 bin.
  7. Diff-audit: the parcel's hunks in `daemon_log_freshness_check.sh` and
     `install_freshness_cron.sh` are confined to the 2026-08-03 delta;
     BL-789's 2026-08-02 hunks arrive via its own landed parcel (depends_on
     order), never re-authored here.
  8. Source the lib in a bare `sh -eu` shell and diff `env` before/after:
     only PATH changed.

  ## 2026-08-10 JumpQ (human)

  Human asked to queue-jump this ticket with its prerequisite BL-789 so the
  untracked `operator_path_lib.sh` stop being left-unstaged noise on every
  agent pass. Retagged `priority: 1` (was 47); `direction: queue-jump`
  already set. Stays behind BL-789 (`depends_on`); promote only after
  BL-789 closes.
