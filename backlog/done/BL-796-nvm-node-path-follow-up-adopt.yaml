approval_context: >
  Adopt-and-review of live operator work (BL-506), same fork as
  BL-787..BL-789 and BL-795. Unlike BL-795 this is NOT a pure stamp — two
  corrections are folded in and need explicit sign-off:

  1. The spec pins the no-alias nvm fallback to newest-by-VERSION-ORDER
  (scenario 05: v22.1.0 beats v9.11.2). The hand lib picks the
  lexicographically last directory (`ls | tail -1`), which would resolve
  v9.11.2 over v22.1.0. Single-version hosts never see the difference —
  this host has one version installed, which is why it works live — but
  the contract should pin the correct order before a second version lands.

  2. install_freshness_cron.sh reimplements the lib's bb/node/nvm
  resolution inline while building CRON_PATH, giving two resolvers for one
  question (the BL-789 "one predicate" correction, recurred). The review
  must converge on one resolver — e.g. a lib function that PRINTS the
  resolved PATH so the installer can bake it and the runtime prepend can
  consume it — or state plainly why two are correct.

description: |
  ## What

  The 2026-08-02 Mac host-switch hotfix (BL-789's body) baked a cron PATH
  that found `bb` but not nvm-only `node`. The freshness cron then restarted
  handoffd with that PATH, and every `process/sh ["node" ...]` sweep failed
  with "Cannot run program \"node\" ... No such file or directory" — the
  daemon looked alive while its node-driven sweeps silently did nothing.

  The operator fixed it by hand on 2026-08-03: a new shared POSIX-sh lib,
  `operator_path_lib.sh` (an nvm node-bin resolver plus an operator-bins
  PATH prepend), sourced from the three start paths. The fix works and is
  live; the lib is UNTRACKED (never committed) and the wiring hunks are
  ticket-less in the master tree.

  ## In the master working tree (2026-08-03, none ticketed)

  - `swarmforge/scripts/operator_path_lib.sh` — NEW, untracked. Two shared
    helpers: `swarmforge_nvm_node_bin_dir` (resolve an nvm-installed node's
    bin dir, preferring `~/.nvm/alias/default`) and
    `swarmforge_prepend_operator_bins` (prepend operator bins + resolved
    bb/node dirs onto PATH).
  - `swarmforge/scripts/start_handoff_daemon.sh` — source + prepend before
    the `nohup bb handoffd` launch, so any restart path hands handoffd a
    PATH with node. (This file is NOT in BL-789's list — its whole
    modification belongs to this ticket.)
  - `swarmforge/scripts/daemon_log_freshness_check.sh` — ONLY the
    source-the-lib + `swarmforge_prepend_operator_bins` hunk near the top.
    The rest of that file's uncommitted diff (swarm.env, babysitterd skip,
    fleet telegram fallback) is BL-789's body — not this ticket's.
  - `swarmforge/scripts/install_freshness_cron.sh` — ONLY the node/nvm
    additions to the baked `CRON_PATH` and the lib sourcing. The bb-PATH
    bake itself is BL-789's body.
  - `docs/how-to/hotfix-2026-08-02-mac-host-switch-freshness-bridge.md` —
    the "Follow-up 2026-08-03 — nvm node on PATH" section only; the rest of
    the doc is BL-789's.

  ## Why now

  Same posture as its siblings: unreviewed live operator work risks becoming
  an ancestor of an unrelated QA approval (BL-506), and this body sits on the
  same health path BL-789 guards — while it was wrong, handoffd looked
  healthy while doing none of its node-driven sweeps. The lib being untracked
  is the sharpest edge: a fresh clone or another host runs the three tracked
  scripts, each `source`s a file that does not exist, and under `set -eu`
  they die at the source line — the freshness/restart path is broken at boot
  on any checkout except this one master tree.

  ## Scope

  Adopt the files above (track the lib, keep the three wiring hunks and the
  how-to section), with the two corrections named in approval_context:
  version-order fallback and one-resolver convergence. Extend
  `swarmforge/scripts/test/test_daemon_log_freshness.sh` (or a sibling shell
  test) to cover the checker/start-script/installer assertions.

  ## Out of scope

  - Everything in BL-789's own list (the 2026-08-02 hunks in the two shared
    files, front_desk_supervisor.bb, handoffd.bb heartbeat,
    remote_control_health_lib.bb, the Stryker concurrency question).
  - BL-787's files (tunnel launcher, stop_ancillary_services.sh) and
    BL-788's Bubble body.
  - Making handoffd itself resolve node lazily or degrade gracefully when
    node is absent — that is a daemon-behaviour change, not a start-path
    PATH fix; ticket separately if wanted.

  ## STEERING note

  Sibling of BL-787/BL-788/BL-789/BL-795. Queue-jump so it does not rot,
  but it MUST NOT be active concurrently with BL-789: both tickets carry
  hunks in the same two files (`daemon_log_freshness_check.sh`,
  `install_freshness_cron.sh`), so they fail Concurrent Work Orthogonality.
  depends_on pins the order — BL-789 lands the 2026-08-02 base first, then
  this ticket adopts the 2026-08-03 delta on top.

