description: |
  ## What

  After and between `/pilot` stages, tear down long-lived leftovers from
  this expedition before declaring a stage done or going long-idle:
  hung acceptance runners, leftover Stryker/mutation jobs, and related
  `/tmp/tmp.*` fixture babysitter/bridge ancillaries. Prompt checklist is
  the minimum; do not rely solely on the host orphan janitor (~2h).

  ## Source

  `.swarmforge/operator/INTAKE-pilot-orphan-cleanup-stage-boundaries.md`

  ## Scope

  - `composePilotExpeditorPrompt` stage-boundary cleanup contract
  - Unit tests + Gherkin feature + how-to

  Out of scope: Telegram status matrix (BL-700), changing host orphan
  janitor live-window guards, automated `/expedite`.

