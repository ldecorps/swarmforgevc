source: |
  Human, 2026-07-23, epic BL-594. The blind spot that hid BL-582 for hours:
  the human↔swarm Telegram channel has NO reliability telemetry, so a silently
  failing approval tap is invisible until a human notices a stuck button.
description: |
  The whole front-desk surface emits no reliability trend. Add four series,
  plotted through the shared trend.ts (BL-096) framework:

  1. **Approval-tap outcome** — per tap: recorded / silently-dropped /
     repaint-failed. `recordApprovalDecisionAndClose` already knows changed
     true/false; the callback drop paths (decideCallbackQueryAction) already
     classify not-my-chat / not-principal / unrecognized-data. Emit those
     outcomes, do not invent new ones.
  2. **Steering-delivery outcome** — BL-566 already computes delivered /
     no-pane / undelivered (SteerDeliveryResult). Emit it as a series.
  3. **Poll health** — count `poll degraded` / 409 events per interval. These
     already print to the front-desk log; capture them as structured events
     rather than only prose.

  4. **Concierge tick duration** — wall-clock ms per tick, optionally split
     read/parse/write. Unlike 1-3 this is a DURATION, not a categorical
     outcome, so it needs its own aggregator shape (a summary statistic per
     window, not a success rate). Added 2026-08-21 at the coordinator's
     request on live evidence — see `notes:` below for the measurement that
     motivated it.

  **Measuring must not worsen what it measures (series 4 especially).**
  Series 4 exists because the concierge tick is suspected of stalling on
  synchronous `readFileSync` + `JSON.parse` of a 465KB state blob inside the
  same event loop as the `getUpdates` poll. Emitting a synchronous append on
  every tick would add more synchronous fs work to exactly that loop and
  could deepen the stall it is meant to detect. Buffer, batch, or emit off
  the hot path — the direction is the coder's, but a naive per-tick sync
  append is the one shape that is wrong on its face.

  Append raw events to `.swarmforge/telemetry/human-loop-<YYYY-MM>.jsonl`
  (append-only, gitignored, the context-events.jsonl posture); the aggregation
  to a success-rate-over-time series is a pure, unit-tested function.

  Why it matters: a falling tap-success rate or a rising 409 count is the
  earliest signal of exactly the degradation that took a multi-hour
  investigation this session. This is the leading indicator BL-582 lacked.
acceptance: specs/features/BL-595-human-loop-reliability-trend.feature
out_of_scope: |
  - Fixing tap/steer failures (BL-582/BL-566 own those). This only MEASURES.
  - A dedicated UI; the series joins the existing trend surface.

notes: |
  - "[2026-08-25T16:35Z] coder: humanLoopReliability emit+aggregate; async append; front-desk wiring."
  2026-08-21 coordinator: candidate 4th series, live evidence from today's
  BL-1026-tap-not-registering incident (same investigation that queue-jumped
  BL-582). telegram-front-desk-bot.js's readTickState/writeTickState
  (concierge-tick-state.json) do a synchronous fs.readFileSync +
  JSON.parse/stringify of the WHOLE state blob on every concierge tick, in
  the same process/event loop as the getUpdates poll loop. Measured today at
  465KB (snapshot field alone ~328KB, emittedKeys array at 1505 entries,
  never pruned) - plus telegram-approval-ask-messages.json (198KB, 209
  entries) and ticket-message-map.json (164KB), both also read/written
  synchronously elsewhere in the same file. Under host contention (load
  10.42/12.57/21.26 on 4 cores, measured same session) this sync work is a
  plausible contributor to the "stalled bot no poll heartbeat within 90000ms"
  pattern in front-desk-supervisor.log - not confirmed as dominant over raw
  CPU contention (no tick-duration timing taken), but real and worth trending
  rather than asserting.

  Direction, not mandate: emit tick wall-clock duration (or split
  read/parse/write) as a 4th series here, same append-only
  human-loop-<YYYY-MM>.jsonl posture as the other three. Whether it also
  motivates capping/pruning emittedKeys or splitting the state file is a
  separate, out-of-scope question for whoever reads the resulting trend.

  ## Specifier amendment 2026-08-21 (scope + acceptance)

  Acted on the coordinator's request above: series 4 added to `description:`,
  with the "measuring must not worsen what it measures" hazard stated as
  direction. The coordinator's evidence paragraph is preserved verbatim
  above; nothing was trimmed.

  Two things a reader should know:

  - **Scope grew after approval.** The human approved a THREE-series ticket;
    it now carries four. `human_approval:` is deliberately left `approved`
    rather than reset by me - un-approving a human's decision is not mine to
    do - but the change is recorded here so it is visible rather than
    silent. Re-rule if a fourth series changes the answer.
  - **Kept here rather than split.** Series 4 is a different data shape
    (duration, not categorical outcome) and does enlarge the ticket. It is
    still the right home: a standalone tick-duration ticket would be blocked
    on this one building the append-only log, the emit posture and the
    trend.ts wiring, so splitting would buy a DEPENDENT slice rather than an
    independent one - a worse INVEST outcome than one slightly larger
    ticket. If the coder finds the duration aggregator materially larger
    than the other three, series 4 is the clean seam to split on.

  **Acceptance materialization (BL-233 / BL-441).** Scenarios are parked in
  `specs/features/BL-595-human-loop-reliability-trend.feature` because
  the acceptance runner hard-fails on handler-less scenarios and none of
  this is built yet. The coder MUST, in the same parcel, rename the draft to
  `.feature` and wire its step handlers. Do not close this ticket with the
  draft unmaterialized.

  **IR-DRY reviewed, not merely run.** The first draft scored 2 findings on
  23 unique steps. The 0.7 was genuine: two near-identical aggregation
  scenarios, one per series shape. They were the same behavior parameterized
  by which summary a window reports, so they collapsed into scenario 04's
  outline - the `summary` column now names the difference the two scenarios
  were spelling out longhand. The 0.5 pair disappeared with a rephrase that
  also fixed a circularity: scenario 05 read "when <event> completes / then
  <event> still completes", which asserts nothing; it now performs the event
  and asserts it still succeeds. Final: 0 findings, 21 unique steps.

closed_as: satisfied-by-implementation

deprecator_adjudication: |
  RETIRED by the specifier's proactive deprecator pass, 2026-08-29
  (Article 3.6 / specifier.prompt "Deprecator duty", outcome 2 — retire).

  ## Why this is retired, not built

  This ticket was still sitting in backlog/paused/ with human_approval:
  approved and a promotable status — i.e. fully eligible for the coordinator
  to pick up — while the behaviour it specifies is ALREADY SHIPPED AND LIVE.
  Promoting it would have sent the coder to rebuild working, hardened code.

  ## Evidence checked (2026-08-29)

  - extension/src/metrics/humanLoopReliability.ts is headed "BL-595: pure
    human-loop reliability records + window aggregation", with its companion
    humanLoopReliabilityStore.ts, and telegramFrontDeskBotCore.ts /
    telegram-front-desk-bot.ts carry the emitting call sites.
  - specs/pipeline/steps/bl595HumanLoopReliabilityTrendSteps.js requires the
    compiled extension/out/metrics/humanLoopReliabilityStore and
    humanLoopReliability — the real modules — and index.js:52 registers it.
  - specs/features/BL-595-human-loop-reliability-trend.feature is LIVE.

  ## What was deliberately NOT touched

  The acceptance feature file and its step handlers stay exactly as they are.
  "Retire, never reword" applies to a retired BEHAVIOUR; here only the TICKET
  is stale and the behaviour is live. Deleting the scenarios would remove live
  coverage, and specs/pipeline/runtime.js throws on a scenario whose handler is
  gone — the gate would redden. See the paused-pool zombie-ticket check:
  (1) an implementation file headed with the ticket's own id, and
  (2) that ticket's handler registered in specs/pipeline/steps/index.js.
  Both present ⇒ shipped ⇒ retire, do not build.
