description: >
  WHAT. Measured 2026-08-23 during QA of BL-1099 (unrelated parcel): seven
  deterministic unit failures also reproduce on main outside that diff.

  sampleResourcesCli.test.js (3): expected `SAMPLED 1 role(s)`, got
  `SAMPLED 0 role(s)` (in-process and subprocess); sibling telemetry line
  count 2 !== 3 after recording a sample.

  strykerSandboxSiblingsLib.test.js (4): replacing a stale sibling symlink
  (pwa, swarmforge, .github, docs) throws
  `EEXIST: file already exists, symlink ...` at
  ensureStrykerSandboxSiblingLink (scripts/strykerSandboxSiblingsLib.js:45)
  instead of replacing the broken link.

  WHY. Standing reds on npm test mask real regressions. Grep of
  backlog/{active,paused,hold} for the failing basenames found no open
  ticket (BL-1063 report-after-grep).

  HOW (direction, not mandate). Restore both suites to green, or document
  WONTFIX/allowlist if host environment is intentional — never silent red.

qa_e2e_procedure: >
  From extension/ with swarm.env loaded:
  npx vitest run test/sampleResourcesCli.test.js test/strykerSandboxSiblingsLib.test.js
  — all tests green. Optionally confirm full npm test no longer carries these
