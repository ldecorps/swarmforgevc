id: BL-1403
title: "The merge-deletion guard never reports a moved path as dropped and never refuses unexemptably: a path whose content survives elsewhere in the merge result is not a deletion, and a refusal is attributed from the incoming side when HEAD's introducer names no ticket - today archiving a raw intake refuses every worktree's merge-up with no message that can clear it"
milestone: M8
type: defect
severity: high
# high: a live fault that blocks the pipeline. Every root drain archives an
# intake (git mv into backlog/archive/ with a footer), and the next merge-up
# in EVERY worktree then refuses with "(unattributed)" - no commit message
# can satisfy it, so each role needs the cherry-pick workaround by hand.
# Hit 2026-09-02 (coder, BL-1311) and 2026-09-04 (documenter, BL-1402).
