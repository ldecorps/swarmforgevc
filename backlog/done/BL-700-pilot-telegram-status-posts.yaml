description: |
  ## What

  Require Cursor `/pilot` to keep the Cursor Remote Telegram topic informed
  with structured status on ticket change, hat/casquette change, and
  bounce-back (with explicit reason). Prefer prompt contract; ship pure
  format helpers for the three mandatory lines.

  ## Source

  `.swarmforge/operator/INTAKE-pilot-telegram-status-posts.md`

  ## Scope

  - `composePilotExpeditorPrompt` status-post contract
  - `formatPilotTicketChangeStatus` / `formatPilotHatChangeStatus` /
    `formatPilotBounceBackStatus`
  - Unit tests + Gherkin feature + how-to

  Out of scope: orphan cleanup (BL-701), automated `/expedite`, full agent-
  driven poll send wiring beyond the existing BL-699 prompt rule.

