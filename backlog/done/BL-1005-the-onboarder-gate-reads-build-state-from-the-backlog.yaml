id: BL-1005
title: "BL-643 scenario agent-class-doc-06 froze a build-state snapshot into the gate - it demands the literal 'not built yet' plus BL-624/BL-625 in the Onboarder section, so when those slices actually shipped and the document honestly stopped calling them unbuilt, the gate went red on main asserting a falsehood"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
priority: 12
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-643-non-pipeline-agents-documented-as-a-class.feature

invariants:
  - "The gate never passes vacuously: for any Onboarder section it is given, the handler either extracts at least one build-state claim and checks every one against the backlog, or it fails - reporting zero claims found is a failure, never a pass."

description: |
  WHAT IS WRONG

  `specs/pipeline/steps/bl643NonPipelineAgentsSteps.js` implements the step
  `each unshipped phase is named with the ticket that owns it` as two frozen
  literal checks against the Onboarder section of
  `docs/explanation/BL-643-non-pipeline-agents-as-a-class.md`:

      if (!/BL-624/.test(...) || !/BL-625/.test(...)) throw ...
      if (!/not built yet/i.test(...))                throw ...

  That was true on the day BL-643 shipped (e1c39eef3), when slices 2 and 3
  were genuinely unbuilt. Commit aa1949aec then landed BL-625 and correctly
  rewrote the section to say all three slices (BL-590, BL-624, BL-625) are on
  `main`. The document became MORE accurate and the gate went RED - it now
  demands that a truthful document keep claiming work is unbuilt.

  Reproduce on `main` today:

      node specs/pipeline/cli.js specs/features/BL-643-non-pipeline-agents-documented-as-a-class.feature
      # 16 pass, 1 fail - scenario "the Onboarder document covers only what shipped"
      # bl643: expected the Onboarder section to explicitly state which phases
      # are not built yet

  Red since 2026-08-18. It went unnoticed because QA runs only the ticket's
  OWN feature file, so nothing swept it - it surfaces to whichever parcel next
  touches these documents, and reads as an unrelated ticket's breakage rather
  than as a stale gate. That misattribution is the reason this is `high` and
  not `medium`: a gate that blames the wrong parcel is worse than a plain red.

  WHY IT IS A GATE DEFECT AND NOT A DOCUMENT DEFECT

  The document is correct; the assertion is stale. The underlying mistake is
  that the gate pinned a SNAPSHOT of build state instead of deriving it. Any
  assertion that must go red the moment the system improves is mis-specified.
  This is the specifier's own defect - the contract was written this way.

  WHAT IS WANTED

  The gate should check the document's build-state claims AGAINST THE BACKLOG,
  symmetrically and in both directions, deriving every claim from the document
  under test:

    - a phase the document calls SHIPPED must cite a ticket that is closed
      (present under `backlog/done/`);
    - a phase the document calls UNBUILT must cite a ticket that is still open
      (present under `backlog/active/`, `backlog/paused/` or `backlog/hold/`).

  That form has teeth in BOTH states. Today it verifies BL-590, BL-624 and
  BL-625 really are closed; the day a slice 4 appears it verifies the document
  names its owning ticket and does not pretend it shipped. Shipping a slice
  without updating the document is exactly what goes red - which is the check
  the original scenario was reaching for.

  How (direction, not mandate)

  - Replace scenario `agent-class-doc-06` in the feature file with the outline
    below, verbatim. It already passes `gherkin_lint_gate.sh` and returns zero
    IR-DRY findings; an earlier two-`And` form was flagged as a possible
    synonym pair, which is why it is an outline.
  - `every behaviour it describes is present on the main branch` is unchanged
    and still passes - do not touch it.
  - The two literal checks in the `each unshipped phase ...` handler are
    replaced by the derived check. Delete that step definition; the runner
    THROWS on a scenario step with no handler, so a leftover unmatched step
    fails every scenario in the file. That throw is the real gate here, which
    is why this ticket declares no `required_wiring`.
  - HAZARD: closed tickets do NOT all live under `backlog/done/<Mx>/`.
    BL-590 is at `backlog/done/BL-590-...yaml` while BL-624 and BL-625 are at
    `backlog/done/M8/...`. Resolve a ticket id by searching `backlog/done/`
    recursively, not by assuming the milestone subdirectory.

  THE REPLACEMENT SCENARIO (linted, IR-DRY clean - land exactly this)

      # BL-643 agent-class-doc-06
      Scenario Outline: the Onboarder document's build-state claims match the backlog
        When the Onboarder document is read
        Then every behaviour it describes is present on the main branch
        And every phase it names as <claim> cites a ticket that is <backlog state>

        Examples:
          | claim   | backlog state |
          | shipped | closed        |
          | unbuilt | open          |

  SCOPE

  Two files: the `agent-class-doc-06` scenario in
  `specs/features/BL-643-non-pipeline-agents-documented-as-a-class.feature`,
  and the matching step definitions in
  `specs/pipeline/steps/bl643NonPipelineAgentsSteps.js`. The class document
  itself is already correct and must NOT be edited to satisfy the old gate.
  The reference table, the other seven scenarios and the BL-684 rename gate
  are all out of scope.

  Both files must land in the SAME commit: an amended feature file without its
  handler fails all 17 scenarios, which is strictly worse than today's single
  red.

qa_e2e_procedure: >
  From the repo root, at the parcel commit.
  1. `node specs/pipeline/cli.js
  specs/features/BL-643-non-pipeline-agents-documented-as-a-class.feature`
  and confirm every scenario passes - the count rises from 17 to 18 because
  `agent-class-doc-06` is now a two-row outline.
  2. Confirm the step `each unshipped phase is named with the ticket that owns
  it` no longer appears in either the feature file or the handler
  (`grep -rn "each unshipped phase" specs/`), and that no scenario step is
  left without a handler.
  3. Prove non-vacuity in the SHIPPED direction: temporarily edit the
  Onboarder section's slice-3 line to cite a ticket id that is not closed
  (e.g. `BL-1005`) and confirm the `shipped`/`closed` row FAILS naming that
  id; revert.
  4. Prove non-vacuity in the UNBUILT direction: temporarily add a line
  describing a phase as not built yet citing a closed id (e.g. BL-625) and
  confirm the `unbuilt`/`open` row FAILS; revert.
  5. Prove the invariant: temporarily replace the Onboarder section body with
  prose naming no ticket at all and confirm the gate FAILS on finding zero
  claims rather than passing vacuously; revert.
  6. Confirm `git status` is clean of every temporary edit above before the
  parcel is forwarded.
  7. Confirm the class document
  `docs/explanation/BL-643-non-pipeline-agents-as-a-class.md` is unchanged by
  this parcel (`git diff <base>..HEAD -- docs/`).

notes: >
  Reported live by the coder on 2026-08-20 via a priority-00 note
  ("bl643 scenario 15 red on main: BL-625 doc dropped 'not built yet' the step
  needs"), found while working BL-993, whose step 10 tells the coder to run
  BL-643's feature file. Verified independently by the specifier before
  speccing: the red reproduces on `main` at 225eb9640, and the three Onboarder
  slice tickets are all genuinely closed, so the replacement gate is GREEN on
  arrival rather than red-on-arrival. BL-993's step 10 was amended in the same
  turn to name this pre-existing red so the coder parks it instead of owning
  it. No `required_wiring:` is declared deliberately - see the description.

