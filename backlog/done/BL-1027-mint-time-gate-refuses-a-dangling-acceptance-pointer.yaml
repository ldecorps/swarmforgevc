deprecator_adjudication: |
  RETIRE (specifier, 2026-08-29). Article 3.6 deprecator duty, proactive pass.
  The behaviour this ticket describes is already built, QA-approved and landed
  on main; the ticket stayed in backlog/paused/ with a promotable status, so it
  remained eligible for promotion and would have sent the coder to rebuild
  working, hardened code.

  Verified independently, not taken from a prior sweep's claim:
    - QA approval e77ed8d2a5 confirmed an ancestor of local main
      (git merge-base --is-ancestor). Local main is ahead of origin/main and is
      the fresher ref.
    - Implementation present: swarmforge/scripts/backlog_hygiene_lib.bb, promotion_gates_lib.bb
    - Acceptance handler registered in specs/pipeline/steps/index.js:
      bl1027MintTimeDanglingAcceptanceSteps
  How it got here: closed to done/ by 1e2d8ed80, then resurrected into paused/; re-promotion aafff3ee8 was reverted by the BL-1223 dispatch-trail guard (02e53176e) without closing the ticket.

  Retiring the TICKET only. The .feature file and its step handlers are left
  untouched — the behaviour is live, and the acceptance runner throws on a
  scenario with no handler, so deleting them would drop real coverage and
  redden the gate.

  Full sweep record, including the deliberate keeps (BL-1238 live parcel,
  BL-1222 already in done/, BL-545 epic tracker):
