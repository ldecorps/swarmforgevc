source: |
  Found by the specifier, 2026-08-21, while checking that the four tickets
  from the BL-1021 expedite run were fully minted. BL-1025's `acceptance:`
  named
  `specs/features/BL-1025-expedite-approval-satisfies-the-pipeline-code-on-main-gate.feature`,
  which did not exist. A sweep of every open ticket with a path-style
  `acceptance:` (108 of them) found two more:

    - BL-579 (handoff-mechanism briefing diagram) - `direction:
      human-requested`, `human_approval: approved`, `assigned_to:
      specifier`, filed from a human ask of 2026-07-23. Its own notes say
      "(specifier writes the feature file)". It was never written.
    - BL-580 (front-desk mechanism briefing diagram) - same shape, same
      day, same human, same missing file.

  All three pointers were materialized in commits 918145798 and f2322bfbf,
  so the three instances are closed. This ticket is about the hole they
  came through, which is still open.

description: |
  ## Two gates already check this, and both check it too late

  The existence check is not missing. It exists twice:

  - `acceptance_pointer_gate_lib.bb` (BL-880) arms it at every PRE-QA
    `git_handoff` hop, coder onward. Its own header states the intent:
    stop a stale pointer "before it rides five pipeline stages to the
    documenter->QA edge". It fires only once a ticket has been promoted
    AND picked up by the coder.
  - BL-626 (paused, human-approved 2026-07-25) arms it at PROMOTION.

  A ticket that is never promoted is checked by neither. That is not a
  hypothetical gap: it is the state all three measured instances were in.
  BL-626 would have caught none of them, because none of them was ever
  promoted - they sat in `paused/` advertising a contract that did not
  exist, and BL-579/BL-580 did so for close to a month while their author
  had every reason to believe the work was queued and specified.

  The one place that DOES run on a ticket at mint -
  `specifier_backlog_hygiene_gate.sh`, which the specifier prompt requires
  on every paused YAML touched in a turn - checks `epic:` and `milestone:`
  and, since BL-922, the block-scalar-hiding-a-pointer shape. It does not
  check whether a plain single-line pointer resolves. BL-922's own comment
  states the principle it was following: catch it "HERE, at mint/hygiene-
  gate time, instead of five stages later at the documenter->QA hop". This
  ticket applies that same principle to the shape that actually bit.

  ## Why this is not a duplicate of BL-626

  They close different halves and neither subsumes the other. BL-626 stops
  a dangling ticket from being ACTIVATED; this stops one from being
  WRITTEN. BL-626 is the backstop for a pointer that dangles after mint -
  a feature file deleted or renamed later, or a `.feature.draft` never
  materialized. This one is the backstop for a pointer that never resolved
  in the first place, which is the only one of the two that reaches a
  ticket nobody promotes. Both should exist; today neither does at mint.

  ## How (direction, not mandate)

  - Extend the existing mint-time hygiene check rather than adding a
    parallel gate. It already runs at the right moment and the specifier
    prompt already mandates running it.
  - Decide checkability with the predicate that already owns that
    question - `acceptance-pointer-gate-lib/applicable?`. Do not restate
    the shape rules; a second copy of "which declarations are real
    pointers" is the drift BL-897 names, and this gate has already been
    given one point of truth to consult (BL-922 did exactly this for the
    block-scalar residue rather than re-writing the regex).
  - Resolve against the WORKING TREE, not a commit. This gate runs before
    anything is committed - that is the whole point of catching it at
    mint - so the pre-QA hop's `git cat-file` approach does not transfer.
  - Fail loud, matching the gate's existing posture, and name the ticket
    and the unresolved path so the fix is obvious without re-deriving it.
  - Report every offender in one run, not the first: the specifier invokes
    the gate with several YAMLs at once, and a gate that stops at the
    first hides the rest until the next turn.

  ## Scope

  - swarmforge/scripts/specifier_backlog_hygiene_gate.bb - the check
  - swarmforge/scripts/backlog_hygiene_lib.bb - the pure violation, beside
    the BL-922 unreadable-acceptance one it sits next to
  - swarmforge/scripts/backlog_epic_milestone_audit.bb - the repo-wide
    audit reports the new violation class alongside the others
  - specs/features/BL-1027-mint-time-gate-refuses-a-dangling-acceptance-pointer.feature
    and its step handlers

  Out of scope: the promotion-time gate (BL-626 owns it, unchanged) and
  the pre-QA hop gate (BL-880, unchanged - this ticket only CONSULTS its
  predicate). Also out of scope: policing draft-ness, Gherkin validity, or
  step resolution - existence only, exactly as BL-880 scoped it.

qa_e2e_procedure: >
  1. Reproduce the hole at the parent commit before checking the fix. Write
     a scratch ticket YAML in a temp dir whose `acceptance:` names a
     `specs/features/*.feature` path that does not exist, run
     `swarmforge/scripts/specifier_backlog_hygiene_gate.sh` on it, and
     confirm it reports ok. A gate that was already catching this needs no
     ticket.

  2. At the parcel commit, run the same scratch ticket and confirm it now
     fails, naming both the ticket id and the unresolved path. Then create
     the named file and re-run: it must pass. A gate that fails either way
     is not reading the filesystem.

  3. Walk every row of scenario 01 as a scratch ticket, and confirm the
     five passing shapes really do pass - especially the epic-tracker
     prose (`acceptance: none: "tracker only - see decomposes_into ..."`)
     and the glob-shaped mention. Ten live epic trackers carry the prose
     form today; a gate that refuses them strands the whole epic layer,
     which is the gate-that-strands-a-legitimate-send failure, worse than
     the gap being closed.

  4. Run the gate on three scratch tickets at once, exactly one of them
     dangling, and confirm the offender is named and the two clean ones
     are not. Then make two of the three dangling and confirm BOTH are
     named in one run.

  5. Prove the predicate is shared, not copied: grep the implementation for
     a second definition of which declarations are checkable. There must be
     exactly one, and it must be the one `acceptance_pointer_gate_lib.bb`
     owns. Then change that predicate in the working tree and confirm the
     mint-time gate's behaviour moves with it.

  6. Run the gate over the whole live `backlog/paused/` tree and confirm it
     is clean - the three known instances were materialized in 918145798
     and f2322bfbf, so a violation here means a fourth nobody has found.

notes: |
  ## Ancestry, and why the sibling stays untouched

  BL-626 is human-approved with an operator quote naming the promotion path
  specifically. Its scope is not widened here and its YAML is not edited -
  widening a human-approved ticket past what was approved is not the
  specifier's to do silently. Today's evidence is recorded on BL-626 as
  evidence, and this ticket carries the half that evidence actually
  demands.

  ## IR-DRY reviewed, not merely run

  11 occurrences, 10 unique steps, 1 finding at 0.667: "the specifier's
  backlog hygiene gate runs on all of them" against "... runs on it". Kept
  deliberately. The plurality is not accidental drift in wording - it IS
  what scenario 02 tests, since the gate takes many YAML paths per
  invocation and the defect it guards against is a run that stops at the
  first verdict. Collapsing the two spellings would delete the distinction
  the scenario exists to make.

  ## The count of live epic trackers is evidence, not a constant

  The qa_e2e_procedure names ten epic trackers carrying the prose
  `acceptance:` form as of 2026-08-21. That is a measurement to justify why
  the epic row matters, not a number to assert - do not write it into a
  step handler, or the file goes red the day an epic is opened or closed
  (BL-643/BL-1005).

