id: BL-1021
title: "handoffd deadlocks in dispatch-gap-sweep because the child it shells out to still uses the banned clojure.java.shell API and leaves a grandchild holding the pipe open - the BL-061 deadlock relocated one process hop beyond the gate that was built to prevent it"
milestone: M8
type: defect
severity: critical
status: todo
epic: swarm-reliability
priority: 120
direction: swarm-reported
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1021-daemon-subprocess-cannot-outlive-its-wait-bound.feature

invariants:
  - "No subprocess the daemon spawns can block a sweep past the configured wait bound, at any process depth - a bound that cannot be observed firing is not a bound."
  - "A bounded-wait timeout is always announced: no subprocess call ends the cycle silently."

source: |
  QA session (.worktrees/QA) filed
  .swarmforge/operator/INTAKE-handoffd-dispatch-gap-deadlock-20260821.md at the
  human operator's direction, 2026-08-21, after the operator reported repeated
  `FRESHNESS_VIOLATION restart daemon=handoffd` alerts in Telegram
  (age_secs=128, then 189) and a manual kill+restart that did not resolve it.
  QA explicitly left severity and shape to the specifier.

  Specifier verification 2026-08-21 16:05Z, from source rather than from the
  report. The intake's own conclusion is CORRECTED below: it states "this is a
  different, new deadlock" and "not the known BL-061 bug". handoffd.bb is
  indeed clean - but the banned API is alive one process hop away, in the
  child handoffd spawns. That reframing is what makes this fixable.

description: |
  ## What the operator sees

  handoffd goes to STAT=U (uninterruptible wait) with a frozen heartbeat, the
  freshness watchdog alerts and restarts it, and it re-stalls within minutes.
  Eight log rotations on 2026-08-21, five of them in the ninety minutes before
  the report. Restarting resets the clock, never the cause.

  ## Why the existing guard did not catch it

  BL-061 root-caused a `clojure.java.shell/sh` deadlock in this daemon. The fix
  routed every subprocess call in `handoffd.bb` through
  `daemon_cycle_guard_lib.bb`'s bounded `sh!`, and a closure-gate test locks it
  in. Grepping the live file confirms the fix holds: `handoffd.bb` contains
  zero `clojure.java.shell` references and does not even require
  `babashka.process` itself.

  The gate is real, and it is one hop deep. From
  `daemon_cycle_guard_lib_test_runner.bb`:

      {:entrypoints #{"handoffd.bb"} :read-file read-file}

  It walks the **load-file closure** from `handoffd.bb`. But
  `dispatch-gap-sweep!` does not load its collaborator - it SPAWNS it
  (`handoffd.bb:1756`):

      (daemon-cycle-guard-lib/sh! ["bb" (swarm-handoff-script) (str draft)] ...)

  A process-spawn edge is invisible to a load-file walk, so the gate cannot
  see `swarm_handoff.bb` - and `swarm_handoff.bb:6` is:

      [clojure.java.shell :refer [sh]]

  used by its general-purpose `command` wrapper (~L60) for git and more.
  `clojure.java.shell/sh` has no timeout at all. So the API BL-061 banned is
  back on the daemon's critical path, reached by the one edge type its gate
  does not follow.

  ## The mechanism, from the live stack sample

  `sample 4060 3`, taken while frozen, showed two `send-off-pool` threads
  blocked in `read()` and one in `wait4` on child PID 47125 - a PID that no
  longer existed. The direct child had exited; something it spawned inherited
  the stdout/stderr write ends and outlived it, so the pipe never reached EOF
  and the stream-pump threads blocked forever.

  Two things must both be fixed, and they are independent:

  1. **The child re-introduces an unbounded API.** `clojure.java.shell/sh`
     cannot time out, so once its pump threads block, that process is gone.
  2. **The parent's bound did not fire either - and this half is now
     DETERMINED, not conjectured.** The ticket originally left open which of
     two candidates fired. A deterministic repro run by the specifier
     2026-08-21 settles it, and both halves of the discriminating pair are
     recorded here so nobody re-derives them under pressure:

     - **Control.** `sh!` on a direct child that never exits (`sleep 300`),
       bound 3000ms: returns at **3024ms** with `exit 124` and an
       `on-timeout!` event. The bound works for the case it was built for.
     - **Defect.** `sh!` on a child that prints, exits immediately, and
       leaves a backgrounded grandchild holding the inherited stdout/stderr,
       same 3000ms bound: **still blocked past 20s, no timeout event, no
       return.** Killed by the harness, not by the bound.

     The cause is in `sh!` itself (`daemon_cycle_guard_lib.bb:105-117`), not
     in `destroy-tree`. `(deref proc bound ::timed-out)` bounds only the
     **exit-code wait**. When the direct child exits promptly the timeout
     branch is never taken, and babashka.process then resolves the
     `:out :string` / `:err :string` pump futures **unbounded** - and those
     block in `read()` forever because the reparented grandchild still holds
     the write ends, so the pipe never reaches EOF. `destroy-tree` and
     `on-timeout!` are never reached at all; that is why the log shows no
     timeout line. The bound is not failing to kill the right process - it
     has already returned control to code that then waits with no bound.

     This is why the invariant is phrased "at any process depth": a bound
     over the exit code alone is not a bound over the call.

  ## How (direction, not mandate)

  - The repro is settled (see mechanism 2 above); reuse its shape rather than
    rebuilding it. A fixture script that backgrounds a long sleep and exits
    immediately, invoked through `sh!` with a short
    `SWARMFORGE_SUBPROCESS_WAIT_BOUND_MS`, reproduces the hang in seconds.
    That is scenario 01, and the `sleep 300` control above is worth keeping
    as a companion assertion - it is what proves a fix bounded the drain
    without breaking the exit-wait bound that already worked.
  - Make the bound genuinely unconditional. A fire-and-forget subprocess
    should not capture `:out :string`/`:err :string` at all - redirect to a
    file or /dev/null so no pump thread exists to block. Where output IS
    needed, the bound must return even when the pipe never closes.
  - Move `swarm_handoff.bb` off `clojure.java.shell`, for the same reason
    `handoffd.bb` was moved off it.
  - A process a script detaches must close or redirect inherited stdout and
    stderr before detaching.

  Widening the closure gate to follow process-spawn edges is the systemic
  half and is deliberately NOT here - it is BL-1022, so this ticket can move
  at the speed a critical live defect needs.

  ## Scope

  - swarmforge/scripts/daemon_cycle_guard_lib.bb - the `sh!` bound
  - swarmforge/scripts/swarm_handoff.bb - the banned API and its `command` wrapper
  - swarmforge/scripts/handoffd.bb - only if a call site must stop capturing streams
  - specs/features/BL-1021-daemon-subprocess-cannot-outlive-its-wait-bound.feature
    and its step handlers

  Out of scope: the BL-061 fix itself (correct, and holding), the closure-gate
  widening (BL-1022), and the freshness watchdog's restart behaviour (BL-1012).

routing: |
  This defect is IN the swarm's own delivery machinery: handoffd routes every
  git_handoff and note between roles, so a ticket to fix it cannot be relied on
  to reach a coder through the pipeline it is itself blocking. This is
  precisely the expeditor's rationale (BL-567): walk it through the same role
  hats with the stack stopped, reading only durable git data -
  `swarmforge/scripts/expedite.sh BL-1021`.

  The coordinator decides; recording the reasoning here so the choice is not
  re-derived under pressure. Note that delivery was working at 16:05Z (the
  daemon was healthy, 8 minutes into its latest restart), so the normal
  pipeline may well carry it - but the window is minutes, not hours.

qa_e2e_procedure: >
  1. Reproduce at the parent commit. Write a fixture script that spawns a
     grandchild holding its stdout/stderr and exits immediately. Call it
     through the daemon's chokepoint and confirm the call does NOT return
     within the wait bound, and that no timeout event is logged. This is the
     defect; confirm it before confirming it is gone.

  2. At the parcel commit, repeat step 1 and confirm the call returns within
     the bound, reports a bounded-wait timeout, and emits a timeout event
     naming the sweep and command. Then run the CONTROL in the same session -
     `sh!` on a direct child that never exits - and confirm it STILL returns
     at the bound with exit 124 and a timeout event. The control passed before
     the fix; a fix that bounds the stream drain must not cost the exit-wait
     bound that already worked.

  3. Confirm the sweep chain survives. With the same fixture wired into the
     dispatch-gap sweep, confirm every sweep scheduled after it still emits
     its `sweep-boundary` line and the next `cycle=N-start` appears.

  4. Confirm the banned API is gone from the spawned child: grep
     swarmforge/scripts/swarm_handoff.bb for `clojure.java.shell` and expect
     no match.

  5. Live soak, since this defect is defined by recurrence. With the fix
     running, confirm the daemon survives at least one full hour with no
     freshness-violation restart and no log rotation, and that
     `sweep-boundary sweep=dispatch-gap-sweep` appears repeatedly with a
     duration under the wait bound. The pre-fix baseline is five rotations in
     ninety minutes.

  6. Confirm the acceptance feature runs: all four scenarios execute with
     registered handlers (no runtime THROW on a missing handler).

notes: |
  RUN HISTORY, two runs. Run 1 (2026-08-21, expedited) did NOT complete: the
  specifier stage passed, the coder stage was killed at `stage-timeout` after
  the full 45-minute budget, and the run tore down with `FAILED HALF: ticket`.
  Its specifier output was stranded on the dead run branch and recovered onto
  main at 4595f90fa. Run 2 is the current one, on the same branch, and it runs
  with a larger per-stage budget: the expeditor's `--stage-timeout-ms` default
  was raised from 45 to 90 minutes before it started. That is the operator's own
  remedy for the run-1 timeout, and it is worth recording as history because it
  is the second reason - alongside the checkpoint - that run 2 is not simply
  run 1 repeated. Observed as an uncommitted change in the master checkout at
  run-2 specifier time, so treat the number as run configuration rather than as
  a settled default.

  RUN 2 STARTS FROM A CHECKPOINT - DO NOT REBUILD. Run 1's coder work was NOT
  lost. It was checkpointed to the run branch at `ed8a915f7` ("BL-1021:
  checkpoint coder WIP before re-expedite") before this run started, and that
  commit is already an ancestor of the current branch head. It carries both
  halves of the fix plus their tests: the stream-drain bound in
  `daemon_cycle_guard_lib.bb`, `swarm_handoff.bb` moved off
  `clojure.java.shell`, `bl1021SubprocessOutlivesWaitBoundSteps.js` (387 lines,
  registered in `specs/pipeline/steps/index.js`), and additions to both the
  unit and property runners - 803 insertions over 6 files. An earlier version
  of this paragraph said "nothing was built"; that was written before the
  checkpoint existed and is simply false now. Rebuilding from scratch is how
  run 1 ran out of clock; doing it again would repeat the only failure this
  ticket has actually had.

  What the specifier stage of run 2 verified about that checkpoint, so nobody
  re-derives it: `bb swarmforge/scripts/test/daemon_cycle_guard_lib_test_runner.bb`
  reports ALL PASS (its closure gate included), the property runner reports ALL
  PROPERTIES HOLD (P1=50 real-child runs at pipe-holder depths 1-3, P3=50,
  P2=450), and `swarm_handoff.bb` still loads and prints its usage after losing
  `clojure.java.shell`. The unit runner already carries all three cases
  qa_e2e_procedure step 2 asks for - the defect shape, the `sleep`-forever
  CONTROL, and a fast-path child that must not acquire a bound-length delay.

  That is evidence of promise, NOT a pass. It is unreviewed work-in-progress
  from a killed stage: nobody has run the acceptance feature end to end, and no
  cleaner, architect, hardener, documenter or QA has ever seen it. Treat it as
  a starting position to verify and finish, not as a green implementation -
  "it is built" would be as wrong as "nothing was built".

  One thing worth a reviewer's eye specifically, because it is the change with
  reach beyond this ticket: routing `swarm_handoff.bb`'s `command` wrapper
  through `sh!` puts a wait bound (60s default) and stream capture on all nine
  of its subprocess sites, not only the ones on the daemon's path. Any git call
  there that legitimately runs longer now returns exit 124 instead of blocking.
  That is the intended direction - it is what "no unbounded API on the critical
  path" means - but it is a behaviour change to the CLI as well as to the
  daemon's child, and it deserves to be looked at rather than assumed benign.

  SIZING, and why this ticket is not being split. The run-1 timeout is real
  evidence against INVEST's Small letter: two independent halves plus a
  four-scenario acceptance surface plus a property lane is more than one
  sitting from cold. The honest reading is that it was minted one notch too
  large. It is NOT being split now, for two reasons that both point the same
  way. First, the split is forbidden: BL-1021 is in the active backlog, and
  consolidation - merge or split - happens at spec time only; rewriting an
  active ticket's YAML into siblings is exactly the worktree-staleness failure
  BL-317/BL-325 exist for. Second, the split would be self-defeating even if
  it were allowed: the work is already done as one piece on this branch, so
  splitting would strand `ed8a915f7` across two tickets and cost a second
  seven-stage pass on a `critical` live defect whose whole point is speed. The
  size problem was real and the checkpoint has already absorbed it.

  IF THIS TICKET IS EXPEDITED A THIRD TIME, promote it first - and for run 2
  this was DONE, so do not redo it. The expeditor closes a passing run with
  `move-ticket! root <ticket> "active" "done"`, whose `when-let` silently
  no-ops when the ticket is not in `backlog/active/` - so the ticket would
  finish built, gated and landed while still filed as un-started work, with the
  run reporting success. Promotion is a coordinator duty (Article 3.3) the
  specifier does not hold, and the expeditor does its backlog moves in the
  MASTER checkout while stage work happens in the run worktree - so moving it
  from inside the worktree is invisible to teardown, and moving it in both
  places duplicates the file across two folders at merge. The one correct move
  is in the master checkout, before the run starts:

      git mv backlog/paused/BL-1021-handoffd-deadlocks-on-a-subprocess-whose-grandchild-holds-the-pipe.yaml \
             backlog/active/

  For run 2 that rename is already staged-and-uncommitted in the master
  checkout, matching the expeditor's own park convention, so teardown will find
  the file where it looks for it. This YAML deliberately stays in
  `backlog/paused/` on the run branch, tracking main's committed tree - moving
  it here too is the both-places case above, and would duplicate the file at
  merge.

  None of this applies to a normal live-swarm run, where the coordinator
  promotes as usual. The gap itself is filed as BL-1023, after which the
  workaround stops being needed either way.

  Run 1's specifier stage, 2026-08-21, verified the defect from a deterministic
  repro rather than from the report - the control/defect pair is recorded in
  the description's mechanism 2. Consequence for whoever picks this up:
  qa_e2e_procedure step 1 is EXPECTED to reproduce, and its expected pre-fix
  result is already known (hang past the bound, no timeout event). If step 1
  does NOT reproduce, that is itself the finding - stop and report rather than
  proceeding to a fix for a mechanism you have not seen fire.

  Where "the parent commit" is, for step 1. Because run 1's coder work is
  already committed on this branch, the last commit on it WITHOUT the fix is
  `3ced734d1`, not whatever the parcel's first parent turns out to be after the
  merges this run adds. Reproduce there. Reproducing at a commit that already
  carries the fix would make step 1 come back clean and trip the stop-and-report
  rule above for the wrong reason.

  Sizing note for the second half: `swarm_handoff.bb` reaches
  `clojure.java.shell/sh` through a single `command` wrapper (~L60, 8 call
  sites) plus one direct call at L315 - nine sites, one file. The bounded
  chokepoint is ALREADY in scope there: `swarm_handoff.bb` load-files
  `handoff_lib.bb`, which load-files `daemon_cycle_guard_lib.bb`. So no new
  wiring is needed to reach `sh!`, only the decision to route through it.

  Deliberately NO `required_wiring:` on this ticket. The obvious entry would
  pin `swarm_handoff.bb` to the literal `daemon-cycle-guard-lib/sh!`, but that
  mandates one design for the child's fix when the ticket offers it as
  direction only - a bounded `babashka.process` call would satisfy the
  invariant equally. Scenario 04 already gates the design-neutral half of it
  (the banned API must be absent), which is the property that actually
  matters.

  The 165s `dispatch-gap-sweep` boundary in the intake's log tail is itself
  evidence the bound is not being honoured: 165s is well past the 60s default,
  and that line was the LAST thing written before the freeze.

  Do not "fix" a live occurrence by killing PIDs - the intake says so
  explicitly, and a preserved frozen process is the only way to get a
  symbolicated backtrace if step 1's repro does not reproduce it.

  Lineage: BL-061 (done, M4) is the original deadlock and its fix is correct.
  This ticket is that same API reached by an edge the BL-061 gate does not
  walk. BL-1022 closes the gate; this one closes the hole.
