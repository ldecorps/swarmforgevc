description: |
  ## What is wrong

  `specs/pipeline/steps/bl1428StandingRedRegisterSteps.js` line 74:
  `assert.equal(report.oldest_age_days, 35, 'expected the oldest row's age
  (2026-08-01)')`. The report comes from
  `standing_red_register_cli.bb`, whose `-main` takes only the project
  root and passes `:now (str (java.time.LocalDate/now))` to
  `build-report`. The fixture row is first seen 2026-08-01; the assertion
  was true on 2026-09-05 (the day the feature was stamped) and false from
  2026-09-06 on. Nobody ran it until BL-1646 (a change to the register's
  commit guard) pulled the BL-1428 feature into the changed-path lane
  (BL-1164) on 2026-09-19: the cleaner reported it (note 000879), and one
  run on main 9013f9edee reads
  `not ok 1 - ... expected the oldest row's age (2026-08-01), got: 49`
  (14 s; scenarios 2-7 ok). It is the BL-1006 shape - an assertion
  red-when-correct - with the calendar instead of a successor ticket as
  the trigger.

  ## What is wanted

  - `standing_red_register_cli.bb` accepts an optional injected date
    (`--now YYYY-MM-DD` after the root, or one env seam - pick one, name
    it in the handoff-protocol paragraph), defaulting to today.
  - BL-1428 scenario 01 reads the fixture "as of 2026-09-05" (its When
    step text names the date; the handler passes it), so 35 stays true
    forever; scenarios 02-07 are untouched.
  - BL-1648's own feature gates the seam: a pinned date gives a pinned
    age; no date gives today (a row first seen today reads age 0); the
    injected date never changes rows or ownership.

  ## How (direction, not mandate)

  - Parse the date with `java.time.LocalDate/parse` and refuse a
    malformed value loudly (exit 2 naming the argument) rather than
    falling back to today - a fixture that mistyped its date must not
    silently pass on the real clock.
  - The step text change in BL-1428's feature is a fixture pin, not a
    contract change; say so in the feature's narrative in one sentence.
    Re-stamp its BL-113 mutation header if the runner requires it.
  - Grep the other handlers for the same shape before closing:
    `grep -ln 'Date.now\|LocalDate/now\|new Date()' specs/pipeline/steps/*.js`
    and any `assert.equal(..., <number>` on an `age`/`days` field; list
    the hits in evidence (fix only BL-1428's here; others are a note to
    the specifier).

constraints: >
  No change to build-report or the register's ownership join. Fixture
  roots are mkdtemp, never the live checkout (BL-1390); runtime stays
  seconds (BL-1541). The step handler lands in the same commit as the
  feature (BL-233).

out_of_scope: |
  - The commit guard's ledger join (BL-1646).
  - Any other handler found by the grep above (noted, not fixed here).

qa_e2e_procedure: >
  (1) `node specs/pipeline/cli.js specs/features/BL-1428-every-standing-red-names-an-open-owner.feature`
  ONCE: 7 ok, 0 not ok. (2) The BL-1648 feature green through the runner,
  once. (3) `bb swarmforge/scripts/standing_red_register_cli.bb .` with no
  date still reports today's ages (compare one row's age with the calendar
  by hand). (4) The evidence lists the grep's hits for other clock-bound
  assertions. Never "run it N times".

