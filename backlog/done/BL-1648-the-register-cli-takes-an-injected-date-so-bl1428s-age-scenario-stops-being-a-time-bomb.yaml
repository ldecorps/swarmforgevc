approval_context: >
  A new feature file is authored here, so it would ordinarily need a tap;
  it is minted approved under the 2026-09-17 operator hotfix (severity
  defect, no choice posed, no ruling_options). FIRM: the register's
  live behaviour is unchanged - with no date given the CLI still reads
  today's date; the seam exists for fixtures. FIRM: BL-1428 scenario 01's
  age assertion (35 for a row first seen 2026-08-01) keeps its number;
