approval_context: >
  A new feature file is authored here, so it would ordinarily need a tap;
  it is minted approved under the 2026-09-17 operator hotfix (severity
  defect, no choice posed, no ruling_options). FIRM: the Linux /tmp branch
  gains exactly the bl<digits>- family the Darwin branch already has, no
  other shape; the live project root, and /tmp paths of any other shape
  (a bl-word without digits, a session scratchpad), stay non-disposable.
  FIRM: only candidacy widens - the sweep's existing orphan and age
  conditions for reaping are untouched, so a live test run's ancillaries
  are never reaped for matching the shape (BL-1385/BL-1390).

invariants:
  - "A path is a disposable root only if it names a fixture root shape under the host's temporary base - tmp., aps-, sfvc- or bl<digits>- - and the live project root never is."

description: |
  ## What is wrong

  Coder note 002118 (while hardening BL-1705) and its evidence
  `backlog/evidence/BL-1705-unowned-red-BL849-sweep-20260924.md` (coder
  branch): the BL-849 feature's scenario 03, Example 2 ("the Darwin
  process handle API"), fails `expected pid <n> to be recognized as a
  disposable-root ancillary candidate`. Reproduced by the specifier on
  main the same hour: `# pass 7`, `# fail 1`, same row.

  Why: the row spawns a real `bash <root>/bin/babysitterd.sh <root>`
  under `mkSocketFixtureRoot('bl849-aps-root-')`, i.e.
  `/tmp/bl849-aps-root-XXXX`. `disposable-root-re` accepts
  `/tmp/(tmp.|aps-|sfvc-)...` and, only under
  `/var/folders/.../T/`, also `bl\d+-...`. Checked with the real lib:
  `extract-disposable-root` returns nil for
  `/tmp/bl849-aps-root-Ab12Cd` and `/tmp/aps-Ab12Cd` for the aps shape.

  History: BL-849 landed 2026-08-09 on the Mac, where the handler's root
  came from `os.tmpdir()` (`/var/folders/.../T/bl849-...`, matched). BL-948
  (77c887dc5c, 2026-08-20) moved the handler to `mkSocketFixtureRoot`,
  which always roots under `/tmp`; the host is now Linux. Census,
  2026-09-24: fixture-creation sites in `specs/pipeline/steps` and
  `extension/test` using a `bl<N>-` prefix: 852; using tmp./aps-/sfvc-:
  882 (grep over mkSocketFixtureRoot / mkTmpDir / mkdtempSync prefixes).

  ## What is wanted
  - Scenario 01 (outline): `/tmp/bl849-aps-root-...`,
    `/tmp/bl1366-land-...` and `/tmp/aps-...` roots classify as candidates.
  - Scenario 02 (outline): the live project root, `/tmp/blog-notes` and a
    session scratchpad under `/tmp/claude-1000/` do not.
  - BL-849's feature is 8 of 8 on the parcel commit.

  ## Scope
  - `swarmforge/scripts/orphan_janitor_lib.bb` (`disposable-root-re`) and
    its bb test.
  - `specs/features/BL-1723-...feature` + the pinned handler.

  ## Not in scope
  - The BL-849 handler (it is right: its row is a real process under a real
    fixture root on this host).
  - The sweep's reap conditions.

