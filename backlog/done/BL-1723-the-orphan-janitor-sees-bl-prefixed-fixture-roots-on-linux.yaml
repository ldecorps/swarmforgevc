  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1723-the-orphan-janitor-sees-bl-prefixed-fixture-roots-on-linux.feature`:
     all ok (6 of 6).
  2. `node specs/pipeline/cli.js specs/features/BL-849-swarm-stamp-darwin-orphan-janitor-hotfix.feature`:
     8 of 8.
  3. The orphan-janitor bb runners and the BL-1705 feature: green.
  4. `git diff main...HEAD --name-only` names only the Scope files, the
     feature, the handler, docs and evidence.
  5. After landing: REGISTER_ROW_RETIRED for the BL-849 feature row.

