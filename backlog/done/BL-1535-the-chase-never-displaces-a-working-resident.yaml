description: |
  ## What is wrong

  `swarmforge/scripts/handoffd.bb` `attempt-resident-rotate!` (~line 1646)
  decides a chase rotation through `mono-router-lib/should-rotate-resident?`
  (`mono_router_lib.bb` line 483) with `:resident-busy?` =
  `resident-pane-busy?` = `chase-sweep-lib/actively-processing?` over the
  captured pane tail, plus the ambulance override, the BL-921 already-active
  check and the rotate cooldown. Nothing reads the departing role's
  `inbox/in_process` box - the input BL-805 gave the resident-invoked path
  (`respawn-as!` -> `departing-role-blocking-handoff` ->
  `rotate-gate-decision`), whose docstring records the choice: "the daemon's
  own rotate-resident-to! call ... never routes through this ... (invariant:
  daemon rotation always fails open)".

  A role whose turn is inside a detached command shows an idle footer, and
  so does a role that has written its draft and stands between the two
  `swarm_handoff.sh` calls of the self-audit (a standing challenge under
  `.swarmforge/handoffs/audit_pending/<sha(sender)>/`). On 2026-09-11 the
  aged-note chase for a coordinator->specifier note pulled the resident out
  of the hardender three times:

  | at (Z) | hardender had been seated | what was stranded |
  |---|---|---|
  | 05:29:58 | 3 min | a held parcel; 40 min until the hardender was seated again |
  | 06:17:07 | 8 min | its git_handoff draft to the documenter, unsent; the coordinator noticed at 06:25 and asked the specifier to rotate back by hand |
  | 07:09:38 | 2.5 min | the BL-1518-a rework: a detached mutation rerun that finished at 07:23 (`Done in 14 minutes and 46 seconds`) into a worktree whose session had been killed |

  Full reconstruction, rows quoted from `rotation-2026-09.jsonl` and the
  chase telemetry:
  `backlog/evidence/BL-1535-specifier-displaced-resident-timeline-20260911.md`.
  The held parcel stays actionable (`role-mail-row` counts `in_process` as
  `held`), so the chase eventually brings the role back; the loss is the
  interrupted work, the orphaned run and the wait.

  ## What is wanted

  The chase refuses to rotate the resident away from a role that holds a
  real `in_process` parcel while that role is WORKING, for any target other
  than that role itself, and says so: decision `:departing-mid-parcel`, a
  `chase-rotate-departing-mid-parcel` log line as the other refusals have,
  and one telemetry row naming the departing role, the parcel and the
  signal. A holder that is merely idle - idle footer, no live command, no
  fresh challenge - still rotates away, as the 2026-08-31 seated-preferred
  yield requires. A working signal without a held parcel never refuses.
  `rotate-resident-to!` itself stays ungated (BL-805 scenario 04 holds);
  the `rotate-gate-decision` docstring's "daemon rotation always fails
  open" sentence is re-tensed to name this ticket's gate, because a
  docstring stating a false present is still a lie (BL-1006).

  ## How (direction, not mandate)

  - `should-rotate-resident?` gains two inputs: `:departing-parcel?` (the
    departing role's in_process holds a real `*.handoff`, sidecars
    excluded - `departing-role-blocking-handoff` already computes this) and
    `:departing-working?`. Refuse `:departing-mid-parcel` when both are
    true, the target differs from the departing role, and `:ignore-busy?`
    is false. Order it after `:busy` and before `:already-active`.
  - "Working" for the gather in `attempt-resident-rotate!`: the existing
    footer probe, OR a live process descended from the resident pane's
    `#{pane_pid}` (handoffd.bb already reads it at ~line 1101;
    `orphan_agent_reaper_sweep_lib.bb` walks a pane's tree), OR a standing
    challenge file for the departing role's sender under
    `audit_pending/` whose mtime is younger than `note_actionable_after_ms`.
    Any one suffices; a stale challenge alone does not.
  - The `:already-active` branch is untouched and BL-926's same-role case is
    handled by the target check, not by a new branch.
  - Tests: one `mono_router_lib_test_runner.bb` case per new branch (refuse,
    idle-holder yield, same-target proceed, no-parcel proceed, stale
    challenge proceed); the acceptance handler drives the real gather
    through a rotation-router fixture with a fake `tmux` on PATH whose
    `list-panes -F #{pane_pid}` answers a fixture process (a `bash -c 'sleep
    300'` whose child is the "still running command"), the fixture pattern
    `test_rotate_to_role_stuck_parcel_gate.sh` already uses.

  ## Not in scope

  - Bringing a displaced role back FIRST once the resident is idle (a
    displacement stack). The held parcel is already actionable and
    priority-ranked; if the wait after a legitimate yield proves too long,
    that is its own slice.
  - A role-prompt rule against ending a turn with a detached job running.
    The machinery must not depend on it, and a role that waits in the
    foreground reads busy today already.
  - The 06:15:28Z nudge that judged the hardender stalled six minutes into
    a real pass is a separate stall heuristic and not this ticket's.

