qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `bb swarmforge/scripts/test/mono_router_lib_test_runner.bb` -> exit 0,
     the new should-rotate-resident? cases listed as pass.
  2. `bash swarmforge/scripts/test/test_rotate_to_role_stuck_parcel_gate.sh`
     -> exit 0; case 04 ("daemon-initiated rotation is never gated on a
     stuck parcel") still passes unchanged - rotate-resident-to! is not
     where the gate went.
  3. `bash specs/pipeline/scripts/run_acceptance.sh
     specs/features/BL-1535-the-chase-never-displaces-a-working-resident.feature`
     -> every scenario passes; then run the BL-805, BL-926 and BL-938
     features the same way -> unchanged, all pass.
  4. Live: with the swarm up on a rotation-router pack, seat the resident
     as any worktree role holding a parcel, start `sleep 600` from its pane
     and let the turn end, then queue a priority-00 note to a dormant role
     and wait past note_actionable_after_ms. Expect a
     `chase-rotate-departing-mid-parcel` log line and a telemetry row, no
     respawn; kill the sleep; expect the rotation on the next sweep.
  5. `git diff main...HEAD --name-only` names mono_router_lib.bb,
     handoffd.bb, the bb runner, the handler, the feature, evidence;
     handoff_lib.bb's rotate-resident-to! and respawn-as! are unchanged
     (`git diff main...HEAD -- swarmforge/scripts/handoff_lib.bb` is empty
     or docstring-only).

