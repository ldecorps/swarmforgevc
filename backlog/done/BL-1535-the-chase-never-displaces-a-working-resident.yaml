  DECISION (mono-router-lib/should-rotate-resident?, fed by handoffd.bb
  attempt-resident-rotate!), never in handoff-lib/rotate-resident-to! -
  BL-805 scenario 04 and test_rotate_to_role_stuck_parcel_gate.sh case 04
