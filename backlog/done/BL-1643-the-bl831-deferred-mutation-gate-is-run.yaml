notes: |
  Minted 2026-09-19 by the specifier while completing the coordinator's
  note, the same pass. AUTO-APPROVED under the 2026-09-17 operator hotfix
  (severity defect, no ruling_options) - see
  auto-approve-high-severity-defects-amendment-20260917.md. Owning the
  row is what lifts the throttle: the register reads a ticket in paused or
  active as an owner, so the cap returns the moment this ticket exists on
  main, and the run itself waits for the cooldown and a quiet host. The
  coordinator was sent paused-ready and told the cap may be restored.
  Second row of this shape in two days (BL-1638 yesterday): the deferrals
  are the host's, not the parcels' - BL-1636's /tmp census and the
  in-suite fork contention (BL-1633) are the causes on file.
  INVEST: Independent (the ledger, the verbs, the gate and the file
  exist), Negotiable (concurrency and the quiet-host reading are
  direction), Valuable (the throttle lifts now and the gate BL-831 owed is
  run), Estimable (one config, one run, one discharge - one sitting once
  the host is quiet), Small (two scenarios, two invariants), Testable (the
  parcel's own committed ledger, evidence and register, read in
  milliseconds).
  Retired 2026-09-19 at the shift-end consolidation sweep (BL-680, Article
  5.3): merged into BL-1638, which now owns both deferred-gate rows; the
  register row for bubblePipelinePage.js names BL-1638; this ticket's
  feature file was removed (BL-1638's scenarios 03-04 carry the contract).
  Every sentence quoted from the coordinator's note survives in BL-1638's
  source. Closed by the specifier under its deprecator retire authority,
  not by QA.
