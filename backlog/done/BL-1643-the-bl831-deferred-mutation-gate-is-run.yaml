approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. Same shape as BL-1468, BL-1488
  and BL-1638 (all approved) for one row dated 2026-09-18: run the
  deferred Stryker gate over one compiled file, discharge the row with
  evidence naming an owner for every survivor, remove the register row in
