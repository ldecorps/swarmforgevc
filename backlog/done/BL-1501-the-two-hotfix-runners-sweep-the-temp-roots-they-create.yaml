qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `cd extension && npx vitest run test/tempDirTrapGuard.test.js` ->
     4 passed, 0 failed.
  2. For each runner R in landed_ticket_autoclose_test_runner.bb and
     wake_dedup_lib_test_runner.bb: `D=$(mktemp -d); (cd
     swarmforge/scripts/test && bb -Djava.io.tmpdir=$D R); echo exit=$?;
     ls -A $D | wc -l; rmdir $D` -> exit=0 and 0.
  3. `git diff main...HEAD --stat` touches only the two runners, the
     step handler + index.js registration, the feature file, evidence,
     and the register row removal; `specs/pipeline/steps/lib/tempDirTrapGuard.js`
     and `extension/test/tempDirTrapGuard.test.js` are unchanged.
  4. `swarmforge/scripts/run_bb_suite.sh` (or the two runners directly)
     still green; suite-manifest.tsv rows for both unchanged.
  5. The `unit` row for extension/test/tempDirTrapGuard.test.js is gone
     from backlog/standing-reds.tsv in the land.

