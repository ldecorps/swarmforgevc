id: BL-986
title: "standing-rule-violations scanner reads only the 3 boot-inlined articles, so a boot-budget relocation to reference/ silently zeroes a violation count - BL-337 has been red since the engineering.prompt split"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
human_approval: approved
priority: 20
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-337-standing-rule-violation-observable.feature

invariants:
  - "A rule citation counts as a violation record wherever the constitution keeps it - moving prose between a boot-inlined article and its reference/ elaboration never changes the reported violation count."

description: >
  Severity rationale: high - a broken safety signal that reports a FALSE
  ZERO. An under-reporting violation counter is worse than a missing one: it
  says "this standing rule is being obeyed" when the evidence was merely
  moved out of the scanned set.

  Reported by the coder as one of four pre-existing acceptance reds
  (BL-336/337/343/578, note 20260820T122656Z_000380). Root-caused by the
  specifier before speccing.

  The red, verbatim:

    FAIL: KNOWN VIOLATION: BL-252 is a recorded violation of the
    Scenario-Outline rule (BL-250 is that rule's origin)
      expected: 1
      actual:   0

  What actually happened, traced through history:

  - `40fdf6b3c` landed the Scenario-Outline KNOWN_VALUES rule in
    engineering.prompt, citing BL-250/BL-252/BL-253. BL-250 is the origin;
    BL-252 and BL-253 are its recorded violations. The check in
    swarmforge/scripts/test/standing_rule_violations_lib_test_runner.bb was
    written against that live text and passed.
  - `0c152a3d3` ("Split engineering.prompt into a slim boot summary +
    on-demand reference") moved the citation-bearing prose into
    reference/engineering-detailed.prompt, where it still sits today
    (line 558: "Confirmed 5x across BL-250/BL-252/BL-253").
  - The scanner's `real-files` list is exactly three BOOT-INLINED files -
    engineering.prompt, local-engineering.prompt, architect.prompt. It does
    not read reference/. So the citation left the scanned set, the count fell
    to 0, and the assertion has been failing ever since.

  Nothing was violated and nothing was fixed. The evidence simply moved to a
  file the scanner cannot see.

  Why this is urgent rather than tidy: boot-budget trimming is ROUTINE and
  ACCELERATING. engineering.prompt currently sits at exactly 44000/44000 (see
  BL-859's gate), so every future rule addition forces another relocation to
  reference/ - and each one can silently zero more violation records. The
  specifier performed exactly such a trim on 2026-08-20 (commit 87e7768a1);
  it happened not to move a citation, but only by luck. Verified during this
  probe: engineering.prompt contained no BL-252 citation either before or
  after 87e7768a1, so that commit is NOT the cause.

  How (direction, not mandate): make the scanned set follow the prose rather
  than the boot boundary - scan the reference/ elaborations alongside the
  inlined articles, so a relocation is verdict-neutral.

constraints: >
  Firm lines:

  - Do NOT fix this by re-adding the citation to engineering.prompt. That
    trades a false zero for boot-prefix budget the article does not have
    (44000/44000 today) and leaves the underlying blindness in place for the
    next relocation.
  - Do NOT weaken or delete the KNOWN VIOLATION assertion. It is the only
    check proving the mechanism detects a violation against real committed
    text rather than a fixture - the ticket's own "TRAP - zero violations"
    warning. A green suite bought by deleting it is the exact failure this
    ticket describes.
  - Origin-vs-violation semantics are unchanged: the numerically-smallest
    cited ticket is the rule's origin and is never counted against it, and a
    "(source: ...)" provenance credit is not a violation. Widening the file
    set must not disturb either rule - BL-250 must still count 0 and BL-255
    must still count 0.
  - A citation appearing in BOTH an inlined article and its reference/
    elaboration is ONE violation record, not two. Deduplicate, or the fix
    trades an under-count for an over-count.

notes: >
  Source: coder note 20260820T122656Z_000380, one of four reds. The other
  three are separately ticketed - they have genuinely different causes and do
  not share a fix.

  Evidence timing matters here. This diagnosis was captured at 13:29 on
  2026-08-20, BEFORE a `git pull --rebase --autostash` detached the master
  checkout at 13:38, so it is not contaminated by that swapped tree. (Two of
  the four reds WERE first diagnosed against the swapped tree and had to be
  re-run; this was not one of them.)

  Related but distinct: BL-968 governs step files binding git at MODULE LOAD.
  This is about a step's live-repo assertion at EXECUTION time. Same family -
  contracts coupled to live state - different mechanism.

qa_e2e_procedure: >
  1. Run the standing-rule-violations suite directly
     (`bb swarmforge/scripts/test/standing_rule_violations_lib_test_runner.bb`)
     and assert the KNOWN VIOLATION check reports 1 for BL-252, with BL-250
     and BL-255 both still 0.
  2. Run the acceptance contract
     (`node specs/pipeline/cli.js
     specs/features/BL-337-standing-rule-violation-observable.feature <outdir>`)
     and assert the runner exits 0 with every scenario green. Do not pipe it
     through tail - that replaces the runner's exit code with tail's.
  3. Relocation neutrality (the invariant): take a citation currently in an
     inlined article, move it verbatim into that article's reference/
     elaboration, re-run step 1, and assert the count is unchanged. Move it
     back.
  4. Dedup: place the same citation in BOTH the inlined article and its
     reference/ elaboration and assert it still counts as exactly 1.

approval_context: >
  One judgement to confirm: I scoped this as "widen the scanned set", not
  "restore the citation to engineering.prompt". Restoring would re-green the
  suite in one line, but the article is at exactly 44000/44000 of its boot
  budget, so that line has to be paid for by trimming something else - and
  the blindness would still be there for the next relocation to trip.

  If you would rather have the one-line restore now and the scanner fix as
  separate later work, say so and I will split it.

