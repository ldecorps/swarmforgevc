id: BL-1852
title: "A post-land re-point carries only QA's own commits - the re-point re-applied every other-ticket bookkeeping commit reachable from QA's old tip, including evidence that came in through merged parcels, so its kept set grew from 47 to 2299 commits on 2026-09-30 and every land walked them again; it now re-applies the commits QA made on its own line and those an earlier re-point carried for it, and nothing that came in through a merge"
