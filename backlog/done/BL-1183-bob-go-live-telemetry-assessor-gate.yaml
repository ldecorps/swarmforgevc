notes: |

  ## AMENDMENT 2026-08-30 — required_wiring row 1 (bookkeeping only)
  
  Row 1 read `BoB trial start path::go-live checklist::telemetry + assessor
  readiness`. `pre_qa_gate_lib.bb` splits on `::` and matches the pattern as a
  plain substring against the file at `path` — so it parsed as
  `{:path "BoB trial start path", :pattern "go-live checklist"}`, a path that is
  prose and cannot exist. The gate arms at the documenter->QA hop, the LAST one,
  and fails CLOSED, so this would have blocked the forward after all six stages
  of work were spent. The BL-874 shape. Reported by the coder, 2026-08-30.
  
  Re-anchored to `swarmforge/scripts/model_steward_trial_lib.bb::go-live`.
  
  **Nothing you build changes.** The acceptance contract, the scenarios and the
  described behaviour are untouched; this only makes the wiring declaration
  checkable against a real file. Row 2 is unchanged.
