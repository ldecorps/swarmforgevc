description: |
  ## What is wrong

  `start-swarm-qwen.sh` is tracked and documents its launch as
  `SWARMFORGE_PACK=qwen-anthropic-forge ./start-swarm-qwen.sh`.
  `swarmforge/packs/qwen-anthropic-forge.conf` is NOT tracked, and was never
  tracked: `git log --all` over that path is empty, and a scan of the last 40
  reflog entries finds no commit that ever contained it. It is not reset
  wreckage - it has simply never been committed.

  Every other pack in `swarmforge/packs/` is tracked. So the qwen full forge
  works on this one machine by accident of a working-tree file, and both a
  fresh clone and a `git clean` (which lists it under `Would remove`) leave a
  tracked launcher pointing at a config that is not there.

  ## Why the file must not simply be deleted or committed by an agent

  It is operator-authored config carrying an explicit operator ask ("cloud
  Qwen full forge") and provider credentials guidance. Sweeping it would
  destroy uncommitted human work, which the constitution forbids outright;
  committing it silently is an out-of-bounds change to the operator's own
  configuration. The DECISION - track it, or stop naming it from tracked code -
  is the human's. What this ticket owns is the gate that stops the asymmetry
  from recurring silently and being discovered, as it was here, only when a
  stray-file sweep happened to look.

  ## How (direction, not mandate)

  A check over the committed tree that resolves every pack name appearing in
  tracked launchers/docs to a tracked `swarmforge/packs/<name>.conf`, and
  reports the launcher/pack pair when it cannot.

constraints: >
  - Do NOT delete, move, or commit swarmforge/packs/qwen-anthropic-forge.conf
    as part of this ticket. Surface it; the disposition is the operator's.
  - The gate reads committed content only. Resolving a pack name against the
    working tree would pass today on the very machine where the defect lives.
  - Scope is the pack-name/config pair. Broader "is every referenced file
    tracked" auditing is not in this slice.

qa_e2e_procedure: >
  1. Run the gate on the repo as committed and confirm it names the pair
     start-swarm-qwen.sh -> swarmforge/packs/qwen-anthropic-forge.conf.
  2. Confirm the gate still reports it while the untracked file is present on
     disk - that copy must not satisfy it.
  3. In a scratch clone, commit a stub pack config and confirm the gate goes
     clean, then remove it and confirm the report returns.

out_of_scope: |
  - Any disposition of the operator's qwen pack config itself.
  - Building any gate for swarmforge/scripts/wait_pipeline_drain.sh. Its
    DISPOSITION is now question 3 in approval_context (it blocks build sync),
    but this ticket's gate stays pack-name-only: a pack-name resolver would
    not have caught a stray script, and widening it here would break the
    slice. If the human wants the deployed-surface case gated too, that is its
    own ticket.
    CORRECTION: the earlier text here called this file "an orphan rather than
    a broken dependency", which was wrong - see notes.

source: |
  Surfaced 2026-08-30 by a priority-00 note to the specifier: "Stray untracked
  master files: wait_pipeline_drain.sh, qwen-anthropic-forge.conf".

notes: |
  - [2026-08-30] specifier, CORRECTION to the note below: "no caller, so it is
    left alone" was the wrong test and the conclusion was wrong. The
    coordinator reported wait_pipeline_drain.sh blocking build sync; verified,
    and it is correct. build_freshness_cli.bb's dirty-surface-paths! runs
    `git status --porcelain` (which lists UNTRACKED files) and filters by
    on-deployed-surface?, which is true for anything under swarmforge/scripts/
    outside scripts/test/. So the file trips the BL-629 gate by existing, not
    by being called. Simulated the pure gate decision rather than running
    `sync` (a passing sync recompiles and restarts daemons): sole offending
    path is this file, refuse? true, reason :dirty-surface, clean under
    --override. The lesson worth keeping: for a stray file, "does anything
    call it" is the wrong freshness question - the right one is "does any gate
    read the working tree and does this path land on the surface it reads".
  - [2026-08-30] specifier: minted after checking both stray files rather than
    assuming they were debris. wait_pipeline_drain.sh has no caller anywhere in
    the tree and is left alone. qwen-anthropic-forge.conf DOES have a tracked
    caller, which is what makes it a defect rather than clutter. Neither file
    was touched: the constitution's rule is that ticket-less changes an agent
    did not make are surfaced, never swept.
  - Severity low deliberately: nothing currently running is broken, because the
    working-tree copy is present on the machine that uses it. The cost is
    borne on a fresh clone or after a clean, which is why it stayed invisible.

closed_as: retired-premise-invalid
deprecator_adjudication: |
  RETIRE (specifier, 2026-09-02). Article 3.6 deprecator freshness gate.
  Held at promotion by the coordinator ("self-claims retired, no done/
  closure"). Adjudicated: the ticket's central premise was FALSE AT MINT and
  its residual trigger has since been resolved. Not promoted; not built.

  1. The named pairing never existed. Title and description assert that
     start-swarm-qwen.sh "is tracked and documents its launch as
     SWARMFORGE_PACK=qwen-anthropic-forge ./start-swarm-qwen.sh". Verified:
       git log --all -S'qwen-anthropic-forge' -- start-swarm-qwen.sh
     is EMPTY - that string has never appeared in that file in any commit on
     any ref. The quoted launch line actually lives at
     swarmforge/packs/qwen-anthropic-forge.conf:20, i.e. in a comment INSIDE
     the pack conf itself. A file naming itself is not a tracked launcher
     naming an untracked pack. At 44d2d42591^ the only tracked file outside
     backlog/ containing the string was this ticket's OWN feature file.
     start-swarm-qwen.sh names qwen-anthropic-mono-router (its default) and
     qwen-mono-router; both confs are tracked.

  2. The residual trigger is resolved. swarmforge/packs/qwen-anthropic-forge.conf
     is now TRACKED and clean, added in 44d2d42591 (author t, 2026-08-30
     17:03:28 +0100). Question 1 of approval_context was answered by operator
     action: the file was committed. Recorded as corroborating only - the
     retirement rests on point 1, which stands on its own.

  3. Question 3 is moot. swarmforge/scripts/wait_pipeline_drain.sh is gone
     from the working tree and untracked, so it no longer trips the BL-629
     dirty-surface refusal described in notes.

  4. The acceptance contract became unsatisfiable. qa_e2e_procedure step 1
     requires the gate to name the pair start-swarm-qwen.sh ->
     swarmforge/packs/qwen-anthropic-forge.conf. That pair cannot be produced:
     the launcher never named it and the pack is tracked. Feature scenario 03
     ("an untracked config on disk does not satisfy the gate") has no live
     instance either.

  5. No recurrence today. The one untracked pack in the tree,
     swarmforge/packs/anthropic-mono-router.conf, is named by no tracked
     launcher or doc (exact-name grep excluding backlog/ returns nothing), and
     swarmforge/packs/ is not on the BL-629 deployed surface. The gate would
     report zero findings on today's tree.

  Feature file RETIRED with the ticket. It is demoted from .feature to
  .feature.draft in this commit, which takes it off the executable surface (no
  *.feature glob and no specs/pipeline/runtime.js run picks up a .draft), and
  acceptance: is repointed at the draft so the pointer does not dangle - the
  same shape BL-751 and BL-428 already carry in backlog/done/, and the
  backlog_hygiene_lib.bb dangling check does scan done/ (line 163), so a plain
  delete would have left a standing violation. Unlike BL-1211's retirement -
  where the file was deliberately KEPT as a live .feature because the behaviour
  was live and handlers were registered - nothing here was ever built: no
  bl1286 handler is registered in specs/pipeline/steps/index.js, so no coverage
  is lost. The three scenarios are preserved BYTE-IDENTICAL (diff-verified):
  retired, never reworded. Only the Feature: narrative is re-tensed, because
  the present tense it was written in is now false (BL-1006).

  The recurrence-guard idea is NOT carried forward, deliberately.
  approval_context question 2 asked the human whether the gate was worth
  building at all. That question was never answerable on the record: the ticket
  posed a choice with no ruling_options, so the Approve tap wrote
  human_approval: approved and discarded the ruling (the defect class surveyed
  2026-08-30; BL-1286 was one of the five confirmed). Minting a successor would
  be deciding for the operator on a low-severity gate whose only demonstrating
  instance never existed. If the operator does want a "tracked code never names
  an untracked pack" gate, it needs a fresh ticket minted WITH ruling_options.

  Surfaced, not swept (constitution: ticket-less changes an agent did not make
  are surfaced). Four untracked paths currently sit on the BL-629 deployed
  surface and will refuse `build_freshness_cli.bb <root> sync` with
  :dirty-surface - the same mechanism this ticket documented for
  wait_pipeline_drain.sh:
    extension/src/tools/providerChatSeat.ts
    extension/src/tools/providerChatSeatLive.ts
    swarmforge/scripts/open_swarm_spy_router.sh
    swarmforge/scripts/spy_router_pane_label.sh
  Verified against on-deployed-surface? in build_freshness_lib.bb:59-68 and
  dirty-surface-paths! in build_freshness_cli.bb:191 (which reads
  `git status --porcelain`, listing untracked files). Their disposition is the
  operator's; no agent touched them. Reported to the coordinator, who can keep
  working via the sanctioned `sync --override`.
