description: |
  ## Why

  BL-1846 records the choice (a deterministic coordinator) and scripts
  the happy path's last model hop. What a model coordinator still does
  on a mono-router is read prose. A census of the coordinator's
  completed mail since 2026-08-15, by sender:
  - the daemon itself: "BL-N no parcel in flight" (887), open-slot
    (215), hotfix ledger (189), "closed by handoffd" (52)
  - QA: approvals in more than ten wordings ("QA-approved BL-N
    landed", "BL-N approved SHA", "BL-N landed SHA", ...)
  - specifier: "BL-N ready in paused" in as many wordings
  - coder and others: "unowned-red", "blocked", "already shipped",
    "idle NO_TASK"
  No script can sort that prose without guessing. On a deterministic
  pack each parcel goes to the human, and none waits for a reader that
  does not exist. On 2026-09-30 the all-local pack's iq3 coordinator
  spent ~32 minutes walking `.swarmforge/` for one file while the
  resident waited.

  ## What is wanted

  - On a pack with `config coordinator_mode deterministic` (BL-1846's
    reader), a handoffd sweep named `coordinator-mail-sweep!` runs each
    tick. For every parcel in the coordinator's `inbox/new/` it writes
    one line: sender, type, ticket id if the parcel names one, the first
    line of its `message:` (or its `task:`/`commit:` for a
    `git_handoff`), and the parcel's file name.
  - The lines of one tick go out as ONE message to the Telegram
    OPERATOR topic, through the same outbox
    (`.swarmforge/operator/telegram-reply-outbox.jsonl`, `threadId`
    `OPERATOR`) the open-slot escalation already writes. No email.
    Keep a message within Telegram's 4096-character limit: past it, end
    with "and N more" and relay the rest on the next tick.
  - Only after that outbox line is written, each relayed parcel moves
    unchanged to the coordinator's `inbox/completed/`. The ticket close
    guard (`ticket_close_guard_lib.bb`) reads `completed/`, so a relayed
    QA approval still authorizes the close.
  - `inbox/in_process/` is left alone: a parcel a coordinator seat
    already took (until the no-seat slice lands) is that seat's.
  - handoffd logs `coordinator-mail-relayed <count>` per tick that
    relays, and `coordinator-mail-relay-error <detail>` when the outbox
    write fails.

  How (direction, not mandate): the parcel parsing belongs in a pure lib
  with the file moves in handoffd, as the other sweeps are built.
  Handler: `specs/pipeline/steps/bl1847DeterministicCoordinatorMailSteps.js`,
  registered in `specs/pipeline/steps/index.js` in the same commit.
  Scenario 04 makes the outbox unwritable through a path seam (a
  directory where the file should be), never chmod (engineering Test
  Speed And Isolation). Build every fixture under mkdtemp (BL-1390).

out_of_scope: |
  - Stopping the daemon's own coordinator notes on a deterministic pack
    (dropped-parcel, unassigned-active, hotfix ledger). They arrive in
    the mailbox and are relayed like any other parcel, each already
    cooldown-limited. Replacing them with direct operator alerts is a
    later slice if the volume is a nuisance.
  - Booting no coordinator seat, and babysitterd's pane nudges to it
    (BL-1125 remaining_slices).
  - Reading or classifying prose. Any "skip the routine ones" filter is
    a later ruling, not a guess made here.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1847-a-deterministic-coordinators-mail-is-relayed-to-the-human-and-completed.feature`:
     5 of 5 ok. Measured 0 at mint: no handler exists yet.
  2. `node specs/pipeline/cli.js` on BL-1846's feature (4 of 4 ok once
     BL-1846 lands) and on
     `specs/features/BL-963-open-slot-nudge-consults-promotion-gate-chain.feature`
     (5 of 5 ok, measured on main a38ada4c28 at mint).
  3. Read the diff: the sweep never writes into a parcel file, and it
     moves a parcel only after the outbox append returned.
  After the land (the operator's check at the next deterministic-pack
  launch, not QA's): QA's approval note for a landed ticket appears in
  the Telegram OPERATOR topic within a tick, the coordinator's
  `inbox/new/` is empty, and handoffd's landed auto-close still closes
  that ticket.

