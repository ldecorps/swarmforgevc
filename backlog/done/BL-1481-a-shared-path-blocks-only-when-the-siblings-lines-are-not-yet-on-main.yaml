id: BL-1481
title: "The land step refuses a path shared with a bounced sibling by commit attribution alone, even when every line that sibling added is already on origin/main - so one bounced ticket whose documenter touched Specification.MD refuses every land (BL-1470 on 2026-09-07, BL-1348 bounced, tip differed from main by BL-1470's own 20 lines); a shared path blocks only when the tip-versus-origin/main diff carries a line attributable to the blocking sibling"
milestone: M8
type: defect
severity: high
# high: integration is the swarm's throughput. Specification.MD is touched
# by every ticket's documenter, so a single bounced sibling that reached
# QA refuses EVERY subsequent land at the escalate step until it is
# re-fixed - BL-1470 tonight, and BL-1408, BL-1469, BL-1451 next, each a
# specifier round trip or a hand-built land. The refusal protected nothing:
# the lines it feared were already on main.
status: todo
epic: swarm-reliability
priority: 6
direction: swarm-reported
depends_on: [BL-1470]
