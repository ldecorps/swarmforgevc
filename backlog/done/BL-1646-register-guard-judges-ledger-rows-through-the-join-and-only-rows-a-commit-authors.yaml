  evidence), priority 00, 2026-09-19T02:31:07Z (inbound
  00_20260919T023107Z_000021_from_coder): "guard false-refuses main-merges:
  ledger check skips register indirection". Evidence, verbatim: "A branch
  merge collapses several days of main's history into one `git diff
  --cached` against a single first parent, making every
  already-valid-when-added line look newly "added" to this commit - not the
  guard's stated intent, but its current behaviour." and "Any worktree role
  merging main today, after BL-831 closed (2026-09-19T00:49Z) and while
  this ledger row and BL-1643's register row both stand, hits the same
  refusal on its own next `git merge main`. Not unique to coder@2."
  Parents: BL-1428 (the guard), BL-1643 (the owner whose indirection it
  ignores).

notes: |
  Minted 2026-09-19 by the specifier while completing coder@2's note, the
  same pass. AUTO-APPROVED under the 2026-09-17 operator hotfix (severity
  defect, no ruling_options) - see
  auto-approve-high-severity-defects-amendment-20260917.md.

  Verified at mint with `git grep 'parcel: BL-831' <branch> -- backlog/hardening-debt-ledger.yaml`:
  coder, cleaner, architect, hardender, documenter, QA and art-director
  carry the row; coder@2 does not. The register CLI on main reads
  `unowned 0` (BL-1638 and BL-1643 own both hardening rows).

  This is delivery machinery: the fix cannot reach coder@2 through the
  pipeline it blocks without another seat carrying it, and the human's
  hotfix lane or the expeditor (`swarmforge/scripts/expedite.sh BL-1646`)
  is the short path. The coordinator was told so in the same pass.
  Interim for coder@2's Work note (BL-1636, already built and forwarded):
  BL-1645's - a real commit on its branch whose subject leads with
  `BL-1636:` (its evidence qualifies), then a plain completion; no merge
  of main is needed for that step.

  required_wiring names the step handler only: the production consumer
  (`run_commit_guards.sh` -> the guard) exists before the fix and an
  anchor on it would match unchanged code (BL-1235); scenario 01 runs the
  real guard on a staged merge, which is the gate.
  IR-DRY at mint: scenarios 02, 03 and 05 share "names no owner for any
  hardening row" and 01/04 share the BL-4343 owner Given by design (one
  staged register, two commit shapes); the refusal steps differ only by
  the row they name. Reviewed and kept.

