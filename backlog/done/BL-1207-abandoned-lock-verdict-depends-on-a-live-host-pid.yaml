id: BL-1207
title: "isAbandonedAgentLock's malformed-pid table files a well-formed padded pid as invalid, so its verdict is decided by whether the host happens to be running that pid - red on every systemd host, green elsewhere for the wrong reason"
milestone: M8
type: defect
severity: medium
status: done
epic: code-quality-gates
human_approval: approved
priority: 30
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1207-abandoned-lock-verdict-is-host-independent.feature

invariants:
  - "No assertion about an agent lock's abandonment may have its verdict decided by whether an arbitrary pid happens to exist on the host: a dead-process stand-in comes from a declared constant whose unreachability the suite asserts for itself, never from a small literal that a real system process could hold."
  - "A lock value that parses to a positive integer after trimming is WELL-FORMED, never classified malformed: the malformed-case table and the liveness scenarios stay disjoint and jointly total, so a case moved out of one is asserted in the other and readLockHolderPid's trim branch never silently loses its coverage."

description: >
  Severity rationale: medium - test infrastructure, contained to one
  module's test file, no live swarm behaviour degraded, and the fix
  is one sitting. What keeps it well above low: it is a HARD red on
  this host right now (not intermittent, not allowlisted, not
  skipped), it sits on a module inside the crap:lets-talk-cursor-bridge
  coverage set so it blocks the hardener's gate and the Article 4.5
  changed-path unit test gate for any parcel touching
  cursorBridgeAgentSession.ts, and it has been latent since
  2026-07-28 passing on other hosts for a reason that has nothing to
  do with what it claims to assert.

  The defect, reproduced at mint. extension/test/cursorBridgeAgentSession.test.js:490
  'isAbandonedAgentLock rejects invalid pid values' iterates a table
  of lock-file contents and asserts every one is abandoned. One row
  is the two digits four and two wrapped in spaces. That value is
  not an invalid pid: readLockHolderPid (cursorBridgeAgentSession.ts:148)
  calls .trim() BEFORE Number.parseInt, so it parses to a positive
  integer, is returned as a well-formed pid, and isAbandonedAgentLock
  falls straight through to the liveness check instead of the
  rejection path the test is filed under.

  The verdict is then whatever the host says. On this machine that
  pid is systemd-journal, owned by root: process.kill(pid, 0) raises
  EPERM, and isProcessAlive deliberately and correctly reads EPERM as
  ALIVE (cursorBridgeAgentSession.ts:158-165 - "exists but we may not
  signal it"). So the holder reads alive, isAbandonedAgentLock returns
  false, and the assertion fails. Measured: `ps -p 42` reports
  `root systemd-journal`; the test run reports
  `AssertionError: expected abandoned for "  42  \n" / false !== true`
  at test/cursorBridgeAgentSession.test.js:502.

  Production is RIGHT on both counts and must not be touched. Trimming
  a lock file's contents before parsing is correct (the lock is
  written as `${process.pid}\n`). Reading EPERM as alive is correct
  and is separately and deliberately tested three lines below, at
  test:506. The defect is entirely in the test: it filed an
  environment fact under a behaviour assertion's name. On the hosts
  where it passed, it passed only because that pid happened to be
  free - never because the value was rejected as invalid.

  The repo already knows the right discipline and it simply was not
  applied here. test/bl984FixtureSweep.property.test.js:44 declares
  `DEAD_PID_BASE = 99000000` with the reasoning written out - "far
  beyond any real pid table (macOS pid_max ~99998, Linux ~4M
  default): process.kill(pid, 0) on these raises ESRCH/ERANGE, never
  EPERM". Its mirror image, test/telegramCursorBridgeRedeploy.test.js:170,
  deliberately uses pid 1 for the always-alive/EPERM branch for the
  same reason. Both pick a pid whose liveness is a certainty rather
  than a host accident.

  Fix wanted, three parts. (1) Move the padded case OUT of the
  malformed table - it never belonged there - and assert what it was
  presumably reaching for as real behaviour: a padded pid is parsed,
  and the abandonment verdict then follows liveness alone (scenario
  02, one row owned-and-alive, one row unreachable-and-dead). Do not
  simply delete the row; invariant 2 exists to stop that, because
  deleting it drops the only coverage of readLockHolderPid's trim.
  (2) Take the dead-pid value from a single declared, commented
  constant rather than a literal, and assert its unreachability on
  the host running the suite (scenario 03) so the stand-in can never
  quietly become a real process the way this one did. (3) Guard the
  class against regenerating: assert that no remaining malformed case
  parses to a positive integer after trimming (scenario 04) - the
  check that would have caught this at authoring time.

constraints: >
  Out of scope / firm lines:

  - Production code is correct and stays as it is. Do NOT change
    readLockHolderPid's .trim(), do NOT change isProcessAlive's EPERM
    branch, and do NOT make either "more testable" to suit the test.
    This ticket moves a test case; the module under test does not
    move.
  - Do not weaken the assertion to make it pass - no try/catch around
    the verdict, no skipping the row on Linux, no
    host-conditional expectation. A case whose verdict depends on the
    host is deleted from the malformed table and re-asserted as
    liveness behaviour, never made conditional.
  - Scenario 04's guard MUST key on the structured case list the
    verdict test iterates - never a text grep over the test file, the
    feature file, or this ticket. All three legitimately quote the
    offending value in prose while explaining it, so a prose grep
    would trip on its own contract (the trap-resistance rule for
    self-referential guards).
  - No suite-wide inspection gate over every test file for
    small-literal pids in this parcel. The property is not reliably
    detectable mechanically (a bare integer is not self-evidently a
    pid stand-in) and attempting it here would break the slice's size
    envelope. Scenario 03's on-host unreachability assertion is the
    durable guard for the constant this ticket declares; widening it
    to a tree-wide gate is a separate ticket if the class recurs.
  - The sibling tests that already do this correctly
    (bl984FixtureSweep.property.test.js,
    telegramCursorBridgeRedeploy.test.js) are not churned. Reuse
    their reasoning; if a shared constant is the cleaner landing
    place that is the coder's call, but do not refactor those files'
    existing assertions from this parcel.

qa_e2e_procedure: >
  1. Pre-fix baseline, on this host: confirm the red still reproduces
     and confirm WHY, so the fix is not credited to an unrelated
     change. Run
     `cd extension && npx vitest run test/cursorBridgeAgentSession.test.js -t "rejects invalid pid values"`
     - expect 1 failed with `expected abandoned for "  42  \n"`. Then
     `ps -p 42 -o pid,user,comm` - record the live root-owned process
     that is causing it. On a host where that pid is NOT live this
     baseline will be green; say so explicitly in the evidence rather
     than reporting the step as passed.
  2. Scenario 01: run the malformed-case scenarios; every case
     abandoned, and assert process.kill was never called for them
     (spy with zero calls) - the "no host process was consulted"
     half, which is what makes the row host-independent rather than
     merely currently-correct.
  3. Scenario 02: both rows green - the suite's own pid padded with
     spaces reads NOT abandoned, the declared unreachable pid padded
     with spaces reads abandoned. Same padding on both rows: the only
     thing that varies is liveness.
  4. Scenario 03: signal the declared unreachable pid with 0 and
     record the raised code - must be ESRCH (or ERANGE), never EPERM
     and never success. Record the constant's value in the evidence.
  5. Scenario 04 non-vacuity: add a scratch malformed case whose
     contents are a small padded integer - the guard goes red naming
     it; remove it - green. This is the regression proof, so do not
     skip the red half.
  6. Full-file regression: run the whole
     test/cursorBridgeAgentSession.test.js suite (58 other tests,
     currently skipped by the -t filter) and record it green, in
     particular the EPERM-as-live test at :506 and the
     skips-process.kill-when-pid-missing test at :234, which assert
     the two branches this change is nearest to.

