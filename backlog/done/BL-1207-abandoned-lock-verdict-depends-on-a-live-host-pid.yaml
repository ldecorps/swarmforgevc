approval_context: >
  Two calls to say the word on.

  (1) Severity medium, not high. Medium because it is test-only,
  one file, no live swarm behaviour degraded, one sitting to fix.
  The argument for high, which I considered and did not take: it is
  a hard unallowlisted red on the primary dev host that blocks the
  hardener's gate on that module, and a standing red is exactly what
  teaches a swarm to normalize red. If you would rather it jump the
  queue via the expedite lane, say high and it does; as medium it
  queues on priority 30.

  (2) I deliberately did NOT scope a suite-wide gate that hunts
  small-literal pids across every test file. A bare integer is not
  mechanically distinguishable as a pid stand-in, so such a gate
  would be either noisy or vacuous, and it would blow this slice's
  size envelope. The durable guard I did scope is narrower: the
  declared constant must prove its own unreachability on the host
  running the suite (scenario 03), plus a structural check that no
  malformed case parses to a positive integer (scenario 04). If you
  want the tree-wide sweep anyway, it should be its own ticket
  rather than a widening of this one.

  Firm and not up for negotiation unless you say otherwise: the
  production module is correct and is not being changed. Both the
  trim and the EPERM-means-alive reading are deliberate and already
  separately tested.

