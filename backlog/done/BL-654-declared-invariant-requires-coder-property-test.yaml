source: |
  ## The missing leg of BL-633, exposed on its first live night

  BL-633 shipped 2026-07-25 ~23:00 and WORKED within two hours: BL-635's
  architect send-back #1 is one bounce, on a DECLARED invariant
  (`invariants[2]`: pre-epoch absence renders unavailable, never zero), whole
  class swept, violating site named (`roundsPerClose` fabricates a pre-epoch
  `0` into a trend arrow), bounce recorded with the very tool the ticket
  builds. Compare BL-590: four bounces for one unstated property.

  But the chain BL-633 built has a hole in the middle, measured:

  ```
  grep -ic invariant swarmforge/roles/specifier.prompt  -> 6   (BL-633 ✓)
  grep -ic invariant swarmforge/roles/architect.prompt  -> 11  (BL-633 ✓)
  grep -ic invariant swarmforge/roles/coder.prompt      -> 0   (nobody told him)
  ```

  BL-633's own description names the coder as "the second consumer: an
  invariant is a design constraint before it is a review criterion, which is
  where it is cheapest to satisfy" — but its acceptance had no coder item, so
  the specifier scoped it out and shipped to spec. Nothing is broken; the
  mechanism is half-plumbed. (Hence `feature`, not `defect`, and NOT expedite-
  typed — same taxonomy honesty as BL-649/BL-651.)

  ## The consequence, visible tonight

  The invariant exists as ticket text; the coder implements scenarios and unit
  tests (137 green); the FIRST EXECUTABLE CHECK of the property happens in the
  architect's review sweep. So the architect looks like the property-testing
  role — historically literally true: BL-590's P5/P6 property tests were
  architect-authored during bounces, because nobody upstream held the property
  in hand. With this ticket, tonight's bounce would not have happened: writing
  the property test for invariants[2] would have surfaced roundsPerClose at
  the coder's desk, before any round-trip.

description: |
  ## Division of labour being pinned

  ```
  specifier   STATES the property        (invariants:, BL-633, shipped)
  coder       ENCODES it as an executable property test   <- THIS TICKET
  architect   VERIFIES existence + non-vacuity + coverage; never first author
  hardener    STRESSES it (mutation kills vacuous property tests)
  ```

  "Is property testing an architectural matter?" — the STATEMENT is
  design-level (cross-cutting by nature); the EXECUTION is test code and
  belongs where the constraint is cheapest to satisfy. The architect inherited
  authorship only through the upstream vacuum BL-633 half-filled.

  ## Shape

  1. `coder.prompt`: for EACH `invariants:` entry on the ticket, the parcel
     carries an executable property test asserting it. A slice with no
     invariants changes nothing — the common path stays untouched.
  2. The generator-reach rule is part of the contract, not a footnote:
     [[property-test-generator-must-reach-deep-state]] records a generator
     that passed 400 runs against a live defect because it never reached the
     interesting state. The coder's test must demonstrably reach the states
     the invariant quantifies over (asserted coverage floor, the
     BL-567-established pattern).
  3. `architect.prompt` (small amendment): on a ticket WITH invariants, the
     review's first question becomes "does an executable property test exist
     for each, and is it non-vacuous?" — a missing or vacuous one is the
     send-back, BEFORE any hand-verification of the property itself.
  4. Wiring with BL-608/BL-635 recording: a bounce for "missing property
     test" is recorded like any other, so BL-635's metric can distinguish
     "property violated" from "property never encoded".

acceptance: specs/features/BL-654-invariant-property-test-coder-authored.feature

spec_notes: |
  Specced 2026-07-26 by specifier (expedited run, swarm stopped). The feature
  file translates the approved minimum-behaviour list 1:1; `human_approval`
  stays `approved` because the operator approved that list and directed
  immediate filing ("file le TOUT DE SUITE") — same faithful-translation
  posture as BL-635. Criterion -> scenario map (invariant-property-test-NN):
  1 -> 04+08, 2 -> 07, 3 -> 09+10, 4 -> 06, 5 -> 01+02+03, 6 -> 07+08;
  description shape item 4 (recording wiring) -> 05.

  Decisions resolved by the specifier:
  - ENFORCEMENT IS PROMPT RULES + EXISTING GATES, no new gate tool
    (out_of_scope confirms). Acceptance items about "the architect bounces"
    are pinned as the prompt text that governs that judgement (scenarios
    01-06) plus an executable demonstration on the worked example that the
    checks actually catch both failure modes (scenarios 07-10).
  - CODER.PROMPT CONFLICT: the current Does-Not-Own exclusion says property
    tests "stay with the specifier/hardener" — stale twice over (BL-479 gave
    the architect the property pass; this ticket gives the coder declared-
    invariant authorship). The amendment must rescope that exclusion in the
    same edit (scenario 03), or the new rule contradicts standing text. The
    architect keeps the BL-479 property-coverage pass for UNDECLARED
    properties on touched modules; declared-invariant first authorship moves
    to the coder.
  - NON-ENCODABILITY HATCH: some invariants quantify over prose/process, not
    a pure module (BL-635 invariants[0] is grep-sweepable, not fast-check-
    able; BL-654's own invariants are prompt-text properties). For those the
    parcel carries a stated reason instead of a test — SILENCE about a
    declared invariant is never acceptable; absent both, it is a send-back.
    The architect reviews the stated reason as part of the existence check.
  - GENERATOR-REACH is part of the contract (scenario 02): the test asserts
    its own generator reached the quantified states (a counted reachability
    floor, not hope), weights progress ops for multi-step folds, and
    CONSTRUCTS colliding pairs rather than drawing them independently — the
    two 2026-07-25 failure shapes (a property green 400/4000 runs against a
    live defect). Non-vacuity (break-then-restore) and reachability are TWO
    separate failure modes; scenarios 09 and 10 pin one each.
  - RECORDING (scenario 05): the missing-encoding send-back records with
    failure class `invariant-unencoded` (vs `behavior` for a violated
    property). Worded independent of the CLI name so it composes with
    BL-635 in flight (parked for this expedite): BL-654 states the class in
    architect.prompt; BL-635's `record-bounce --by architect` invocation
    carries it when that lands. No recording machinery is built here.
  - WORKED EXAMPLE (scenarios 07-10): BL-635 invariants[2] ("pre-epoch
    absence renders unavailable, never zero") as a SELF-CONTAINED fixture —
    a trend renderer over a daily series with a recording epoch, correct
    variant renders pre-epoch unavailable, defective variant fabricates 0
    (the roundsPerClose shape). The live sidecar module is NOT targeted:
    BL-635 is parked mid-flight and its roundsPerClose is not on main.
    Coder-authored property test lives in extension/test/
    *.property.test.js, runnable only via `npm run test:properties`
    (vitest.properties.config.mjs), excluded from unit/coverage/mutation
    per the standing separation rule. Step handlers drive the fixture
    variants in-process (fast-check 4.9.0, already pinned).
  - IR-DRY: two medium possible-synonym findings, both resolved as
    genuinely distinct steps (coder vs architect prompt Givens; the real
    test vs its shallow variant) — no unification, it would change what the
    scenarios assert.

  e2e QA procedure (live verification):
  1. `grep -ic invariant swarmforge/roles/coder.prompt` returns nonzero
     (was 0); `grep -c 'demonstrably reach' swarmforge/roles/coder.prompt`
     and `grep -c invariant-unencoded swarmforge/roles/architect.prompt`
     both nonzero.
  2. `npm run test:properties` green, including the new worked-example
     property test; its output shows the reachability floor assertion ran.
  3. Flip the fixture to the defective variant in a scratch copy: the
     property test FAILS with a counterexample naming a pre-epoch window;
     restore, green again (non-vacuity ritual on the worked example).
  4. `specs/pipeline/scripts/run_acceptance.sh specs/features/
     BL-654-invariant-property-test-coder-authored.feature` green.
  5. Confirm the architect.prompt Invariants Review section reads
     existence-first: the BL-633 hand-verification pass now explicitly
     follows the existence/non-vacuity check.

out_of_scope: |
  - Retro-fitting property tests onto shipped tickets.
  - The mutation tooling itself (Stryker scope, APS) — existing gates are the
    enforcement backstop, not this ticket's deliverable.
  - Auto-generating property tests from invariant text. The coder writes
    them; judgement about state-space and generators is the job.

notes: |
  Completes the BL-633 chain end to end: state -> encode -> verify -> stress.
  Filed within two hours of the mechanism's first live use, from its first
  live gap — which is exactly the cadence the operator asked the swarm to
  sustain: the reviewer's discovery becomes the builder's obligation while
  the evidence is still warm.
