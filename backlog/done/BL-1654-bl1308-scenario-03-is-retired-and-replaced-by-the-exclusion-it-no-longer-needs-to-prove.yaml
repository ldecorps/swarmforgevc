description: |
  ## What is wrong

  `specs/features/BL-1308-an-unlanded-sibling-on-a-second-parent-is-invisible.feature`
  scenario 03 ("A replay tip carries no path from a ticket the report did
  not name") builds the 2026-08-30 shape - a forward-merge whose subject
  names the cited ticket, carrying an untagged sibling's commits on its
  second parent - and its handler
  (`bl1308SiblingDetectorCoversReplaySteps.js` line 135-147) first
  asserts that the replay tip DID carry a foreign path, then that the
  report attributes it. BL-1389 (landed 2026-09-04, 06f1babcaf: "a path an
  unlanded sibling owns alone never rides another ticket's land") made the
  land step exclude such paths and print `EXCLUDED_SIBLING_PATH <path>
  <ticket>` for each, so the fixture now yields `replayAdded: ["own.txt"]`
  with `ENTANGLED_SIBLING BL-9002` and two `EXCLUDED_SIBLING_PATH` lines -
  the foreign path never enters the tip, the guard fires:
  `the replay tip carried no foreign path, so this scenario proves
  nothing: ["own.txt"]`. Red since 2026-09-04; first seen by the cleaner
  on 2026-09-19 while reviewing BL-1650 (its evidence
  `BL-1308-cleaner-stale-premise-20260919.md`, reproduced against a fresh
  origin/main checkout without BL-1650); specifier one run on main
  8963bc6ff1: `not ok 4`, scenarios 1-3 and 5 ok. BL-1006's shape: the
  successor that falsified the assertion never retired it.

  ## What is wanted

  - Scenario 03 retired (not reworded), with its comment.
  - A replacement scenario in the same feature, built on the same
    `second-parent` fixture shape: the replay tip adds only the cited
    ticket's own paths, the sibling is named `ENTANGLED_SIBLING`, and every
    sibling path left out is named on its own `EXCLUDED_SIBLING_PATH`
    line - the exclusion BL-1389 performs, pinned where BL-1308's premise
    used to live. Name BL-1389 in the scenario comment so the lineage is
    greppable.
  - The feature narrative re-tensed where it states the old premise as
    present.
  - Register row for the feature (lane acceptance, owner BL-1654, added
    at mint) retired by this parcel's land (BL-1631).

  ## How (direction, not mandate)

  - The handler already parses the CLI's output into `report.replayAdded`
    and `report.out`; the replacement steps read `replayAdded` (equals the
    fixture's own path set) and the `EXCLUDED_SIBLING_PATH` lines (one per
    sibling path, naming BL-9002). No new fixture.
  - Re-run the BL-113 Gherkin mutation stamp if the runner requires it.

constraints: >
  No change to land_step_lib.bb, land_step_cli.bb or the fixture CLI.
  The step handler change lands in the same commit as the feature
  (BL-233). Fixture roots are mkdtemp `git init` repositories (already so).

out_of_scope: |
  - BL-1650's landed-sibling verdict (a different function).
  - Why the changed-path lane (BL-1164) did not surface this red when
    BL-1389, BL-1544, BL-1546 and BL-1594 changed the land step: recorded
    as an observation for the specifier's own follow-up, not this ticket.

qa_e2e_procedure: >
  (1) `node specs/pipeline/cli.js specs/features/BL-1308-an-unlanded-sibling-on-a-second-parent-is-invisible.feature`
  ONCE on the parcel commit: every scenario ok, no scenario titled "A
  replay tip carries no path from a ticket the report did not name", one
  scenario naming BL-1389 in its comment. (2) `grep -c EXCLUDED_SIBLING_PATH
  specs/pipeline/steps/bl1308SiblingDetectorCoversReplaySteps.js` is at
  least 1. Never "run it N times".

