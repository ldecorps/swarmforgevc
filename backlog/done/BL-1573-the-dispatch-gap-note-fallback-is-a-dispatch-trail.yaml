qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `bb swarmforge/scripts/test/dispatch_gap_test_runner.bb` exits 0 and
     its output names the new trail assertion.
  2. `bb -e '(load-file "swarmforge/scripts/chase_sweep_lib.bb") (println (chase-sweep-lib/dispatch-trail-ticket-id {:task nil :message (chase-sweep-lib/dispatch-gap-note-message "BL-217")}))'`
     prints `BL-217`; on main it prints `nil`.
  3. `bb -e '(load-file "swarmforge/scripts/chase_sweep_lib.bb") (println (count (chase-sweep-lib/dispatch-gap-note-message "BL-217")))'`
     prints a number no greater than 80.
  4. In a mkdtemp fixture (test_dispatch_gap_autoroute.sh's shape: one
     active BL-217 assigned to coder), write the arity-1 draft's lines into
     a `.handoff` file under the coordinator outbox and run
     `dispatch-gap-items` over it: the gap list is empty. On main it lists
     BL-217.
  5. `git diff main...HEAD --name-only` names chase_sweep_lib.bb, the bb
     runner, the JS steps test, the handler, the feature, and evidence -
     nothing under swarmforge/scripts/test/test_*.sh and not handoffd.bb.
  6. `cd extension && npx vitest run ../specs/pipeline/test/steps/dispatchGapSteps.test.js`
     (or the project's unit runner for that file) is green.

