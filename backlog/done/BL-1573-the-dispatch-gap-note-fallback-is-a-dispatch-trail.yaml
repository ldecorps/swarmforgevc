id: BL-1573
title: "The dispatch-gap sweep's note fallback is not a dispatch trail: when head-commit-10 fails, auto-route! sends 'BL-x is active with no dispatch on record - auto-routed by the sweep.' and BL-1223's narrowed predicate reads that bare-id note as a mention, so the next sweep re-detects the gap and sends it again every cycle - the sibling unassigned-active nudge was made verb-first for exactly this in BL-1223; the dispatch-gap fallback was not"
