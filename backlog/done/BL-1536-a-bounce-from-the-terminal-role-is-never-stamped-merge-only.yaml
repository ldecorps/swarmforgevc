id: BL-1536
title: "A QA bounce is delivered as a bounce, never as a merge-only handback: swarm_handoff.bb stamps non-forwarding: true on every git_handoff whose SENDER is the last code-worktree role (with-non-forwarding keys on last-pack-role? alone, since 2026-08-30 b27d9f6639), so QA's bounce to an earlier role carries the terminal marker and Article 2.4 tells the recipient to merge and send nothing - seven QA bounces stamped since 2026-09-02, five recovered only by the recipient disobeying the marker, BL-1518-a dropped outright by a hardender obeying it (2026-09-11 07:07-07:35Z) - the stamp follows the hop's DIRECTION: a git_handoff to a role earlier in roles.tsv pipeline order is never stamped, a terminal forward to a non-pipeline recipient still is"
milestone: M8
type: defect
severity: high
