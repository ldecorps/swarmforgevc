  IR-DRY reviewed 2026-08-20: 4 medium-confidence possible-synonyms, all KEPT
  as intentional. (a) "every seat ... already holds a claimed parcel" vs "one
  seat ... holds a claimed parcel" - all-busy vs one-busy are different
  fixtures driving opposite outcomes. (b) one parcel vs two parcels delivered -
  different cardinality, and scenarios 01/02 assert different things about it
  (exactly-one-receives vs one-each), so an Examples table would need an
  outcome column and would obscure both. (c) the When "a parcel addressed to
  that stage is delivered" vs the Then "the parcel is addressed to the next
  stage" - matched on the shared "addressed to" phrasing, which is deliberate
  consistent vocabulary, not drift; they are different keywords asserting
  different things. (d) "each seat holds one of the two parcels" vs "no seat
  holds two claimed parcels" - distribution vs the single-claim guard.
  BL-982's own feature file: 0 findings. Gherkin lint gate: clean on both.

  Size risk: mutation_cost high. The delivery and claim path is shared by every
  stage, so the single-seat regression surface (constraint 4) is as much of the
  work as the multi-seat behaviour. If the claim-guard rework proves larger than
  one sitting, bounce for a split along the deliver / claim line.

  Further thoughts (human 2026-08-20): "add clearly the concept of a more
  capable coder." Incorporated in description, constraints, and
  approval_context - named as the motivating seat shape; still out of scope
  for seat choice in this slice.

approval_context: >
  One ruling to confirm: seat choice in this slice is idle-first and DIFFICULTY
  BLIND - including blind to the more capable coder. Your addendum asked for a
  Sonnet coder beside a Fable coder and for load balancing by ticket difficulty
  toward the more capable seat; that pairing is the motivating concept and is
  named clearly on this ticket, but the steering is the next slice. It is held
  out of this one because it needs a decision from you that this slice does
  not: when the more capable coder (or whichever seat matches the ticket's
  tier) is busy and a different-tier seat is idle, should the ticket WAIT for
  the right seat, or SPILL to the idle one? Splitting here lets the more
  capable coder start absorbing real work (whenever it happens to be idle)
  while that question is open. Say the word if you would rather this slice
  wait and ship difficulty-aware from the start.

