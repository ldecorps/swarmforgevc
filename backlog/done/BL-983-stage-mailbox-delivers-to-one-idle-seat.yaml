id: BL-983
title: "A parcel addressed to a stage is claimed by exactly one of its seats, so two seats of one stage work two tickets concurrently (idle-first, difficulty-blind)"
milestone: M8
type: feature
status: todo
epic: multi-seat-stages
human_approval: approved
priority: 25
direction: human-requested
depends_on: [BL-982]
mutation_cost: high
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-983-stage-mailbox-delivers-to-one-idle-seat.feature

invariants:
  - "A parcel addressed to a stage is delivered to exactly one seat of that stage: never fanned out to several seats, never silently dropped when every seat is busy, and never re-delivered to a second seat once claimed."
  - "Task-mode single-claim holds PER SEAT, not per stage: no seat ever holds two live in_process parcels, and a busy seat is never chosen while a peer seat of the same stage is idle."
  - "Seat identity never escapes the mailbox layer: a seat forwards to the next STAGE, so no downstream role, board, or metric ever learns which seat did the work."

description: >
  What: give a multi-seat stage one addressable queue whose parcels are claimed
  by exactly one seat. Senders keep writing `to: <stage>`; the delivery path
  picks an idle seat of that stage.

  Why: BL-982 makes a second seat boot, but leaves it inert. Until a parcel can
  reach it, duplicating a bottleneck seat buys nothing - which is the whole
  point of the intake.

  Motivating concept (name it, do not implement it here): a more capable
  coder. The pack shape this epic is for is not two identical coder clones -
  it is a cheaper/faster coder seat beside a more capable coder (stronger
  model, e.g. Sonnet beside Fable). That more-capable seat is a first-class
  idea in the epic vocabulary: a seat whose model tier is meant for harder
  work. This slice does not steer tickets toward it; it only makes every seat
  of the stage - including the more capable coder - a real idle claimant so
  work can land on it at all.

  Seat choice is deliberately simple here: prefer an idle seat, tie-break
  deterministically, and leave the parcel queued when every seat is busy.
  Difficulty-aware choice - sending hard tickets to the more capable coder
  (and easy tickets to the cheaper seat) - is the NEXT slice and is gated on
  a human decision (wait vs spill when the right-tier seat is busy). Keeping
  the two apart means this slice can land and be exercised while that
  decision is still outstanding.

  How (direction, not mandate): treat the stage as the address and the seat as
  the claimant, so the existing single-claim guard applies per seat rather than
  per stage. Delivery must stay idempotent under redelivery - the same parcel
  arriving twice must not end up worked twice by two seats, which is the one
  new way a multi-seat stage can lose or duplicate work.

constraints: >
  Firm lines:

  - No difficulty awareness, no model-tier preference, no preference for the
    more capable coder, no round-robin dressed up as balancing. Idle-first
    plus a deterministic tie-break, nothing more. The more-capable-coder
    concept is named so implementers know what this path unlocks; it must not
    leak into seat choice in this slice.
  - Parcel addressing is unchanged: `to: <stage>`. A seat id must never appear
    in a handoff, and no sender learns that a stage has more than one seat.
  - Batch-mode stages (cleaner, hardender) keep their existing batch semantics;
    this slice must not quietly convert a batch claim into a per-seat task claim.
  - The single-seat case must behave exactly as today - a stage with one seat
    keeps its current delivery path and its current claim guard.
  - No change to the pipeline order, promotion route-target, bounce/QA enums,
    board, or stage-dwell. Those all belong to the later metrics slice.

qa_e2e_procedure: >
  1. Scenarios 01-02: with a two-seat fixture stage and both seats idle, deliver
     one parcel and assert exactly one mailbox received it; deliver two and
     assert one landed in each seat.
  2. Scenario 03: mark both seats as holding a claimed parcel, deliver a third,
     and assert it is still queued for the stage and that neither seat's
     in_process count went to two.
  3. Scenario 04: have a seat forward its work and assert the outgoing parcel is
     addressed to the next stage, with no seat id anywhere in the handoff.
  4. Scenario 05: redeliver an already-claimed parcel and assert the peer seat
     receives nothing and the claimant still holds one copy - the idempotency
     case, which is the one that loses or doubles work if it regresses.
  5. Live confirmation: none. Fixture stages only; do not stand a second live
     seat up to test delivery.

