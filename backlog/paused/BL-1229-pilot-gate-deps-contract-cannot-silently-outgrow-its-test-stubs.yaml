  - "[2026-08-28] specifier: that collection gap is the reason this went
    unnoticed for a day, and it is itself unticketed — 25 non-property
    `test/*.test.js` files import from `node:test`. BL-1206 covers only the
    14 `*.property.test.js` files and their allowlist; the main lane has no
    allowlist and a different failure shape, so it is a sibling slice rather
    than a widening of BL-1206. Deliberately NOT folded in here: fixing the
    stubs is worth doing whether or not the lane ever collects these files,
    and bundling them would fail INVEST-Independent for both."
