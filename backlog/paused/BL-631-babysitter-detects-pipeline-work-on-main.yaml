approval_context: >
  Operator ruling 2026-07-25, during the BL-590 post-mortem: "il faut absolument
  détecter ce genre de sortie de route des agents". BL-629 and BL-630 are gates
  that refuse to deploy and refuse to publish. Neither TELLS anyone. The
