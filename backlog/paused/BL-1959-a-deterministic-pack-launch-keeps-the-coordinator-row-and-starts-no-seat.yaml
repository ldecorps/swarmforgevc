description: |
  ## What is wrong

  On a pack declaring `config coordinator_mode deterministic` (BL-1846,
  BL-1847) the launcher still provisions the coordinator seat:
  `provision_coordinator` registers and starts it like any role, and the
  session and launch loops create its session and write
  `.swarmforge/launch/coordinator.sh`. On the all-local pack that seat is a
  second qwen client on the one GPU slot; on 2026-09-30 it spent 32
  minutes walking .swarmforge/ while the resident waited.

  ## What is wanted

  On such a pack, launch keeps the coordinator as a roster row and a
  mailbox and starts no seat. Removing the row breaks QA approvals
  (`swarm_handoff.bb` refuses `to: coordinator`), handoffd delivery and
  BL-1847's relay, so the row stays and only the session and the launch
  script go.

  ## How (direction, not mandate)

  A predicate beside `is_sequential_dormant` (true for the coordinator's
  index when COORDINATOR_MODE is deterministic) that each launch loop
  checks where it checks dormancy.

  ## What each stage checks

  - Coder: the two scenarios; test_coordinator_provisioned_infrastructure.sh
    and test_rotation_sequential_pack.sh still pass.
  - Architect: the three invariants; that nothing removes the row.
  - Hardener: no Stryker lane for bb/shell (BL-472); a hand-mutant pass on
    the mode check, evidence records the degraded fallback.
  - Documenter: docs naming the coordinator as always provisioned
    (BL-1931 census "Prose" list, docs side).
