  This ticket takes the intake's directive 2. BL-1348 takes directive 1.

notes: |
  ## Verified at mint

  - All three named files exist at
    `extension/test/{onboarderLauncherPidGuard,bl1252CommitGuardAggregationInvariants,bl787NamedTunnelInvariants}.property.test.js`.
  - 305 files match `extension/test/*.property.test.js`.
  - The intake's own timings are the operator's measurement, not re-measured
    here; the acceptance re-measures each file directly, so a stale number in
    the description cannot make the gate pass or fail.

  ## Why the per-file budget is not a new gate

  This ticket tunes three files. It deliberately does NOT add a per-file
  duration gate to the lane, even though that is the obvious durable fix.
  BL-378's per-file budget already exists and, measured 2026-08-22, has 19
  live offenders and therefore fails every `npm test` through
  `computeFinalExitCode` - it is already a permanently-red gate. Adding a
  second one beside a red one makes the red harder to read, not easier.
  Holding the line is BL-791's unminted slice C, which exists precisely to
  answer why the two existing ratchets did not stop a regression, and that
  question is not this ticket's to answer.

  ## Why there is no required_wiring

  Deliberate. The deliverable is a change to three existing test files that
  are already collected by the lane's own `include` glob; there is no new
  mechanism and so no call site to prove. An anchor on the acceptance
  handler's registration would be satisfied by this parcel's own diff and
  would gate nothing (BL-1235), and is unnecessary because `acceptance:`
  points at a real `.feature` from the start - the runner throws on an
  unregistered scenario, so the acceptance run is itself the gate.
