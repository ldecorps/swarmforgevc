description: |
  ## The missing piece is one wire and one registry row

  1. THE WIRE: outage record crosses a duration threshold (~20-30 min
     sustained — hysteresis, not reflex; today's 529 storm was absorbed by
     in-turn CLI retries and a mid-review respawn would have destroyed a
     working turn) -> coordinator consults the steward
     (`eligible <provider>/<model> --role <seat>`) -> certified substitute
     applied to the affected seat via the ModelFactory path at the next
     idle boundary -> reverted automatically when the outage `endedAtUtc`
     closes. Nobody calls anybody today.
  2. THE REGISTRY ROW: anthropic/claude-opus-4-8 is NOT in the steward's
     registry, so the steward literally cannot propose the human's example.
     First act: register + certify opus-4-8 as the designated same-provider
     fallback — certification by incumbency (it held the architect seat for
     weeks; its record IS the evidence).

  Model-scoped incidents take the same-provider rung (opus-5 -> opus-4.8);
  a provider-wide outage takes the cross-provider rung (gpt-5.3-codex is
  already certified) — the steward's eligible gate covers both once the
  registry is populated.

  This is the intelligence layer's first autonomous duty under fire —
  bounded, certified, announced, reversible — and the filing-day incident
  provides the complete acceptance fixture: detection record, affected
  seat, candidate substitute, and the reversion trigger.
