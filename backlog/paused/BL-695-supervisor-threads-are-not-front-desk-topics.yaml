id: BL-695
title: "The concierge serialises the human's private supervisor thread into a git-tracked topic record, because nothing in the store distinguishes a supervisor conversation from a ticket's topic"
milestone: M8
type: feature
status: todo
epic: swarm-reliability
human_approval: approved
severity: medium
priority: 109
direction: human-requested
depends_on: []
