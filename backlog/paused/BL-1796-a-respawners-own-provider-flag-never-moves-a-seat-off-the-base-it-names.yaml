  Coder note 002213 (2026-09-29 09:52Z), verbatim: "BL-1793 probe 3a:
  respawner env forces provider flag onto every seat - evidence". The
  evidence: `backlog/evidence/bl1793-swarm-stamp-review-cb8d502fec.md` on
  swarmforge-coder (dde7e4655c), section "3a - the respawner's own flag".
  BL-1793's review goal 3a asked for exactly this finding as a note to the
  specifier.

notes: |
  Minted 2026-09-29 by the specifier (claude-opus-5-5 seat). The measured
  shape is wider than the coder's note. The flag also moves a seat that
  names a DIFFERENT cloud host, not only a local one. The narrower rule
  (a named base wins, and the flag stays for seats with none) was chosen
  after checking the two existing contracts that assert the flag path.
  Neither fixture writes a launch script, so both stay green.
  IR-DRY: five findings accepted. Three are one parameterized step used
  with a placeholder and with a literal (the seat Given, the flag Given,
  the remap Then). Two pair the seat-kind Given with the aider-host Given,
  which build different fixtures.
  INVEST: Independent (BL-1793 is the review that found it; nothing
  waits on it). Negotiable (the How is direction). Valuable (closes the
  respawn-time egress path cb8d502fec left open). Estimable (one
  condition, the BL-1793 harness). Small (3 scenarios, 10 cases, 2
  invariants). Testable (real generator plus real lib, explicit env).
