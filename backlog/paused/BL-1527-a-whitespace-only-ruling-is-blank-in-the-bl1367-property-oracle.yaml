qa_e2e_procedure: |
  On the parcel commit, from `extension/`:
  1. `for i in $(seq 1 10); do npx vitest run --config
     vitest.properties.config.mjs
     test/bl1367ApprovalCarriesItsRuling.property.test.js || echo FAIL;
     done` -> 2 passed every run, no FAIL line.
  2. `node -e 'const h=require("<the helper>"); console.log(h(" "), h("\t"),
     h(undefined), h(""), h("a free answer"))'` -> ok ok ok ok
     unknown-option, and each equals
     `classifyApprovalRulingRequirement(undefined, <same>).kind`.
  3. `git diff main...HEAD --name-only` names the property test, one helper
     under extension/test/helpers, the step handler, the feature, evidence,
     and the register row removal; `extension/src/`,
     `property_suite_standing_allowlist.tsv`, the BL-1367 feature and
     handler are unchanged.
  4. Break-then-restore: in the helper make `" "` answer `unknown-option`;
     the BL-1527 acceptance run fails scenario 02's whitespace rows;
     restore. Then delete the `no-options:ok-blank` (or as named) outcome
     from the reach floor and remove the constructing arm; scenario 04
     fails; restore.
