id: BL-1690
title: "install_freshness_cron.sh writes the BL-675 crontab line as `/bin/sh $CHECKER` (line 61) and daemon_log_freshness_check.sh is a #!/bin/sh script that sources .swarmforge/swarm.env, telegram.env and operator/telegram.env with POSIX `.` (lines 484-496) - but swarm.env is written in bash (`[[ ... ]] || unset X`, `if [[ -z ... ]]`) and the swarm's own launcher sources it under bash (swarmforge.sh line 186), so on Linux, where /bin/sh is dash, every 2-minute run prints `swarm.env: [[: not found` (9,708 of the 13,306 lines in freshness-check.cron.log since 2026-07-28) and evaluates the guards backwards (`[[ ... ]] || unset` always unsets); the checker sources the operator's env files under bash, and a `[[` in any of them is neither an error line nor a reversed guard"
