invariants: []

description: |
  ## What is wrong
  `install_freshness_cron.sh` composes the BL-675 crontab line as
  `PATH=... FRESHNESS_ROOT=<root> /bin/sh <checker> >>freshness-check.cron.log 2>&1`
  (line 61; the marker comment via `swarmforge_cron_lib.sh`), and
  `daemon_log_freshness_check.sh` is `#!/bin/sh` and sources the operator's
  env files POSIX-style:

      for env_file in "$ROOT/.swarmforge/telegram.env" \
                      "$ROOT/.swarmforge/operator/telegram.env" \
                      "$ROOT/.swarmforge/swarm.env"; do
        if [ -f "$env_file" ]; then set -a; . "$env_file"; ...   # lines 488-496

  `swarm.env` on this host is bash: `[[ "${SWARMFORGE_USE_QWEN:-}" == "1" ]]
  || unset SWARMFORGE_USE_QWEN`, `if [[ -z "${QWEN_API_KEY:-}" && -n
  "${BAILIAN_TOKEN_PLAN_API_KEY:-}" ]]; then export QWEN_API_KEY=...`.
  The swarm's own launcher sources the same file with bash `source`
  (`swarmforge.sh` line 186), so bash syntax in it is the accepted
  contract. Under dash, `[[` is a command that does not exist: the
  checker prints `.../daemon_log_freshness_check.sh: 52:
  .../.swarmforge/swarm.env: [[: not found` (and lines 119, 124) on every
  run, and the guards evaluate backwards - a failed `[[` makes `|| unset`
  run unconditionally and an `if [[ ... ]]` block never run.

  Census 2026-09-22: `grep -c '\[\[: not found' .swarmforge/daemon/freshness-check.cron.log`
  = 9,708 of `wc -l` = 13,306 lines; the first occurrence is line 2,734,
  and `git log -S'/bin/sh $CHECKER' -- swarmforge/scripts/install_freshness_cron.sh`
  dates the interpreter to c354f68716 (2026-07-28, BL-675 itself).

  ## Why
  The cron log is what a human reads when the cron path misbehaves - the
  2026-09-18 missing-briefing hunt went through it - and three of every
  four lines are this error. And an env file the swarm accepts under bash
  must mean the same thing when the cron path reads it: today a guard
  meant to KEEP a variable unsets it.

  ## How (direction, not mandate)
  - Run the checker under bash: `#!/usr/bin/env bash` (or `/bin/bash`)
    with the same `set -a; . "$env_file"` sourcing, keeping every command
    bash-3.2-clean (the macOS floor); `install_freshness_cron.sh` composes
    the line with `bash` (or `/bin/bash`) in place of `/bin/sh`, and
    `uninstall_freshness_cron.sh`'s marker match is unaffected (it keys on
    the comment).
  - Alternatively source through `bash -c 'set -a; . "$1"; env -0' _ "$env_file"`
    and import the result - more moving parts for the same outcome; the
    coder chooses.
  - Fixture: a mkdtemp root whose `.swarmforge/swarm.env` holds the two
    bash shapes above with a sentinel variable; run the checker exactly as
    the composed cron line would (same interpreter, `FRESHNESS_ROOT` set),
    capture stderr, assert no `not found` and that a variable the guard
    should keep is kept (observable through whatever the checker already
    prints or writes with it - or a `--print-env` debug flag the parcel
    adds, if nothing today exposes it).

  ## Scope
  - `swarmforge/scripts/daemon_log_freshness_check.sh`,
    `swarmforge/scripts/install_freshness_cron.sh`, a runner under
    `swarmforge/scripts/test/`.
  - `specs/features/BL-1690-the-freshness-cron-checker-runs-under-the-shell-its-env-files-are-written-in.feature`
    and `specs/pipeline/steps/bl1690FreshnessCheckerRunsUnderBashSteps.js`
    (same parcel, BL-233; discovered from its own file, BL-1371).
  - Documenter: the BL-675 how-to's crontab line example; the operator is
    told once (release note line) to re-run `install_freshness_cron.sh`
    after landing so the installed line changes - the parcel does not
    edit the live crontab.
  - Out of scope: the content of any operator env file; BL-1688/BL-1689.

