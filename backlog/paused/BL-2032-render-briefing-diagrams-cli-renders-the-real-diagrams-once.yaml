description: |
  ## What is wrong

  `extension/test/renderBriefingDiagramsCli.test.js` has three render
  tests:
  - "renders exactly the maintained diagrams, named and base64-encoded":
    `renderBriefingDiagrams` on a fixture project root (four copies of an
    86-byte sample), 2.7 s, mostly the renderer's start-up.
  - "main() runs in-process against the real repo and prints the
    maintained diagrams as JSON": all four real diagrams
    (`architecture.mmd` alone is 43 KB), 4.4 s.
  - "the compiled CLI runs standalone as a subprocess and produces the
    same result": the same four real diagrams again, 4.6 s.

  The file's `BL-1038-EXEMPT` comment is legitimate: its signal is a real
  maintained diagram that has stopped rendering, and its cost does not
  grow with the repository. But one real render per run carries that
  signal, and the file pays for two.

  ## What is wanted

  - main()'s in-process test runs against a fixture project root holding
    the four fixture diagrams. It keeps asserting the names and that each
    entry decodes to a PNG.
  - The subprocess test stays on the real project root, so every real
    diagram is still rendered once per run.
  - BL-363's guard keeps passing on the file: exactly one
    `execFileSync('node', ...)` spawn, `main` imported for the in-process
    call, more test cases than spawns, output asserted.

  ## How (direction, not mandate)

  - `main()` resolves its root with `resolveProjectRoot(process.cwd())`,
    which needs a git root holding `.swarmforge/roles.tsv`. BL-1770's
    fixture in `briefingDigestLineCli.test.js` (`mkFixtureCheckout`)
    shows the shape: `git init -b main` under the file's tmp dir, proven
    isolated before any mutating git command (BL-1390), plus a one-row
    `roles.tsv`. Add the four fixture `.mmd` files the existing
    `mkFixtureProjectRoot` writes.
  - The file already stubs `process.cwd()` for its in-process call. Point
    that stub at the fixture root.

