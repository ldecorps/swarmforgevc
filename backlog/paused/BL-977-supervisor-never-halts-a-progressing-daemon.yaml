id: BL-977
title: "handoffd supervisor halted a PROGRESSING daemon: heartbeat-file mtime (61803 ms) crossed the 30s stall window during a 143s in-flight sweep, alarm-and-halt killed every agent at 2026-08-20T07:55:35Z - publish the in-flight sweep marker and make :stalled require true silence"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: pending
priority: 10
direction: human-requested
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-977-supervisor-never-halts-a-progressing-daemon.feature

invariants:
  - "A demonstrably progressing daemon is never halted for a stall: the :stalled verdict requires evidence of true silence - no sweep in flight under its budget - never heartbeat-file mtime alone."
  - "A genuine wedge is still caught within a bounded time: an in-flight sweep that outruns the in-sweep budget yields :stalled exactly as a missing heartbeat does today, and the marker advances only with the poll loop's own progress - never with mere process survival, so a wedged loop cannot forge liveness."

description: >
  Severity rationale: high - this is control-plane LOSS, and worse in
  outcome than its sibling BL-967. alarm-and-halt! kills every agent tmux
  session and by BL-144 design nothing relaunches them: the daemons and
  bridges stayed up, `./swarm status` read control-plane-missing / tmux
  server not responding, and the swarm sat dead until a human ran
  `./swarm ensure`. Not critical only because it is a false positive on a
  healthy host, not data loss.

  Measured chain (do not re-derive - the specifier confirmed every step
  against the live logs at mint):

  1. handoffd.bb writes .swarmforge/daemon/handoffd.heartbeat at the START
     and END of a poll cycle only (BL-789, handoffd.bb:3243 and :3394) -
     never mid-sweep.
  2. daemon_cycle_guard_lib/run-sweep! emits its `sweep-boundary
     sweep=<name> ms=<duration>` line AFTER the sweep returns (BL-967
     invariant 2), and tracks the sweep it is inside in an in-memory atom
     (`current-context`) that is never published anywhere on disk.
  3. handoffd_supervisor.bb's evaluate-health (line 140) returns :stalled
     when pending-outbox-age > stall-ms AND heartbeat-age > stall-ms, with
     SUPERVISOR_STALL_MS defaulting to 30000. It has no notion of a sweep
     being in flight, because nothing publishes one.
  4. On 2026-08-20 the last heartbeat was `cycle=410-start` at
     07:54:33.336Z; the daemon then logged SIX further sweep-boundary
     lines, the last (open-slot-nudge-sweep) at 07:55:08.877Z. The
     supervisor fired at 07:55:35.139Z: heartbeat age 61803 ms (past the
     window), log age 26262 ms (INSIDE it). The daemon was alive and
     progressing; only the mtime signal said otherwise.
  5. The same morning's rotated log shows the reason a cycle can outrun
     30s at all: 41 dropped-parcel-sweep samples, routinely 30-106s, worst
     143269 ms. That cost is BL-978's ticket, not this one.

  Fix wanted (direction, not mandate): the daemon PUBLISHES what it is
  currently doing - an in-flight sweep marker carrying at least the sweep
  name and its start instant, written by the poll loop's own sweep
  transitions (the natural home is daemon_cycle_guard_lib/run-sweep!,
  which already owns both boundaries) - and the supervisor CONSUMES it:
  a sweep in flight for less than an in-sweep budget reads as alive, a
  sweep in flight past that budget reads as :stalled, and an absent or
  idle marker leaves today's verdict exactly as it is.

  On the in-sweep budget: this is deliberately NOT a raise of
  SUPERVISOR_STALL_MS. A silent daemon with nothing in flight must still
  halt in 30s, unchanged. The new budget is a different question - "how
  long may one named sweep legitimately run" - and the implementer must
  pick it from the measured worst legitimate sweep on this host and
  RECORD that measurement in the parcel, not from a round number.
  Whatever value it takes, it shrinks as BL-978 lands.

constraints: >
  Firm lines:

  - Do NOT raise SUPERVISOR_STALL_MS, the BL-675 300s freshness
    threshold, or any existing timeout as the fix. Same directive as
    BL-967 / BL-789, restated by the human in the source intake.
  - Do NOT make the marker a free-running pulser thread. A thread that
    writes liveness on a timer while the poll loop is wedged deletes the
    stall detector entirely - invariant 2 exists precisely to forbid
    that shape. The marker must advance only on real poll-loop progress.
  - alarm-and-halt!'s behaviour on a REAL stall is unchanged: same alarm,
    same email, same halt, same "already halted; awaiting human recovery"
    posture. This ticket changes when the verdict is reached, never what
    the verdict does.
  - evaluate-health stays a pure function over observations (it is
    already kept pure for tests) - the marker arrives as another observed
    field, not as I/O inside the decision.
  - The :dead path (pid gone) is untouched.
  - Do not restructure handoffd's cycle, its sweep ordering, or the
    sweeps' own cost - the cost half is BL-978, deliberately a sibling so
    either can land alone.

qa_e2e_procedure: >
  1. Scenarios 01-02: drive evaluate-health directly with each
     observation row (it is pure) - assert the verdict per the table,
     including that the two rows carrying the measured 2026-08-20 shape
     read healthy while an over-budget sweep and an idle/absent marker
     still read stalled.
  2. Scenario 03: replay the measured observations (heartbeat age 61803
     ms, pending outbox older than 30s, dropped-parcel-sweep in flight
     ~87s) through the real check! path with a stubbed halt-swarm! - the
     halt must never be invoked.
  3. Scenario 04: run a real (fixture) daemon poll cycle over a sweep
     that sleeps, and read the marker file from OUTSIDE the daemon while
     the sweep runs - it names that sweep; after the sweep returns it
     reads idle.
  4. Scenario 05 non-vacuity: freeze a fixture poll loop inside a sweep
     and keep evaluating - the verdict must flip to stalled once the
     in-sweep budget elapses, and halt-swarm! must be invoked exactly
     once (never per-tick).
  5. Live confirmation: with the fix running, watch one real heavy cycle
     (a dropped-parcel-sweep over 30s is currently routine) and confirm
     handoffd-supervisor.log records no alarm-and-halt for it.
  6. Record the measured worst legitimate sweep used to pick the in-sweep
     budget, with the log lines it came from.

notes: >
  Source: operator intake
  .swarmforge/operator/INTAKE-handoffd-stalled-false-positive-alarm-halt.md
  (human via Cursor 2026-08-20 ~09:23 CEST, "mint a defect this shift; do
  not raise thresholds alone as the fix"), archived to
  .swarmforge/operator/archive/ in the same pass. That one intake was
  SPLIT 1:N (Consolidation Authority) into this ticket - the false-stall
  guard, its direction 1 - and BL-978 - the real sweep cost, its
  direction 2. Also carried by the coordinator's priority-00 note
  00_20260820T083313Z_000675 ("New root intake, human directed: handoffd
  dropped-parcel-sweep defect").

  Specifier probe at mint corrected one detail of the intake's own
  account: the intake reads the dying cycle as heartbeat "cycle=400
  (~07:54:23Z)", but the log's last heartbeat is cycle=410-start at
  07:54:33.336Z, and the daemon logged six sweep boundaries after it, the
  last only 26.3s before the halt. That matters to the fix: a naive
  "true silence in the LOG" detector on the same 30s window would have
  read healthy at that instant - but would still false-positive inside a
  single 143s sweep, which is why the marker (with a start instant), not
  log mtime, is the signal specced here.

  Evidence paths, all present on this host at mint:
  .swarmforge/daemon/handoffd-failure-20260820T075535Z.log (reason:
  stalled); .swarmforge/daemon/handoffd-supervisor.log line 1258
  ("alarm-and-halt stalled"); .swarmforge/daemon/handoffd.log.20260820T080001Z
  lines 2741-2752 (last heartbeat and the six trailing boundaries) and
  line 2686 (sweep=dropped-parcel-sweep ms=143269);
  .swarmforge/daemon/reap-orphan-agents-audit.log (07:55:39Z reap).

  Related: BL-978 (sibling, the sweep cost that opened the window);
  BL-967 (done/M8, the 300s freshness kill/restart storm - its
  sweep-boundary logging is what made today's guilty sweep attributable;
  its soak is owed as BL-975); BL-789 (the start+end heartbeat, working
  as designed and not enough); BL-144 (alarm-and-halt never auto-relaunches
  panes - why the swarm stayed down); BL-902 (briefing-path silent gap,
  different signature).

  Orthogonality for the coordinator: touches
  swarmforge/scripts/handoffd_supervisor.bb and the marker-write seam in
  swarmforge/scripts/daemon_cycle_guard_lib.bb (+ handoffd.bb wiring).
  BL-978 touches swarmforge/scripts/chase_sweep_lib.bb and
  handoffd.bb's dropped-parcel-sweep! - they overlap ONLY on handoffd.bb,
  so prefer sequencing the two rather than running them co-active.

approval_context: >
  Two calls to say the word on. (1) This is minted as the GUARD half and
  BL-978 as the COST half, deliberately two tickets: either alone
  reduces the risk and neither blocks the other. If you would rather have
  one ticket, say so and they merge - but the guard is the one that stops
  a healthy host from being killed, so it goes first if only one slot
  exists. (2) The fix introduces a NEW in-sweep budget constant. That is
  not the threshold raise you forbade - SUPERVISOR_STALL_MS stays at 30s
  and a silent daemon still halts in 30s - but it is a new number, and
  the ticket requires it to be derived from a recorded measurement rather
  than chosen. Flag if you want it bounded differently.
