id: BL-1550
title: "draftPathUnder.property.test.js is flaky red on main with no owner: invariant 2's generator draws `.` as a draft name, so the joined path IS the fixture directory and removeDraftIfPresent's bare unlinkSync throws EISDIR - the helper removes only a regular file and leaves a directory in place without throwing, and the property quantifies only over names that are a strict child of the fixture directory"
milestone: M8
type: defect
severity: high
