qa_e2e_procedure: |
  On the parcel commit, from `extension/`:
  1. `for i in $(seq 1 10); do npx vitest run --config
     vitest.properties.config.mjs test/draftPathUnder.property.test.js
     || echo FAIL; done` -> 2 passed every run, no FAIL line.
  2. From the repo root: `node -e 'const fs=require("fs"),os=require("os"),
     path=require("path"); const {removeDraftIfPresent}=require("./extension/out/swarm/draftPathUnder");
     const d=fs.mkdtempSync(path.join(os.tmpdir(),"bl1550-"));
     fs.writeFileSync(path.join(d,"inner"),"x");
     removeDraftIfPresent(path.join(d,".")); removeDraftIfPresent(d);
     console.log(fs.existsSync(path.join(d,"inner")));
     const f=path.join(d,"draft"); fs.writeFileSync(f,"type: note\n");
     removeDraftIfPresent(f); removeDraftIfPresent(f); console.log(fs.existsSync(f));
     fs.rmSync(d,{recursive:true});'` -> prints `true` then `false`, no throw.
  3. `git diff main...HEAD --name-only` names draftPathUnder.ts, the
     property test (and optionally draftPathUnder.test.js), the step
     handler, the feature, evidence, and the register row removal;
     `property_suite_standing_allowlist.tsv`, the three callers, and the
     BL-1537 feature and handler are unchanged.
  4. Break-then-restore: in draftPathUnder.ts restore the bare
     `existsSync`/`unlinkSync` body; scenario 02's two directory rows fail;
     restore. Then drop the generator filter and run step 1 twenty times;
     with the helper fixed every run still passes (the helper, not the
     filter, is what keeps production safe); restore the filter and
     confirm invariant 2's assertion (resolved dirname is the fixture dir)
     is present inside the property body.
