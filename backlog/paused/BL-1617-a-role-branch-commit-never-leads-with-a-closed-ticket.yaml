id: BL-1617
title: "A role-branch commit whose subject leads with a ticket closed on origin/main is refused at commit time: the land step attributes every path by the first ticket id in the subjects that touched it and refuses a path whose only owners are closed (BL-1546), so one such commit blocks every parcel behind it on the branch - the documenter's BL-1576-tagged evidence commit cbde915b2e (2026-09-16) held BL-1608 and BL-1607 at land on 2026-09-17 until the specifier landed the file on main by hand; the commit-msg chain gains a guard that names the closed ticket and the open owner to lead with, silent on main, on untagged subjects and on an unreadable origin/main"
