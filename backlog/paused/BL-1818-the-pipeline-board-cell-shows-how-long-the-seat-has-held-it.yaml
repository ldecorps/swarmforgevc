id: BL-1818
title: "The pipeline board's grid cell shows how long the seat has held each active ticket (0m, 45m, 12h, 3d from the stage map's as-of) instead of a fixed X, in 3-character cells that absorb the separator so the header and the 30-character phone budget hold - and a ruling on how a dwell-only change refreshes the board"
milestone: M8
type: feature
status: todo
epic: pipeline-board
priority: 85
direction: human-intake
depends_on: []
mutation_cost: medium
# medium: the matrix mark and cell width in pipelineBoard.ts, plus (ruling
# A) a second sync path in pipelineBoardSync.ts; Stryker targets both.
slice_size_envelope: medium
required_stages: [coder, architect, hardender, documenter, qa]
