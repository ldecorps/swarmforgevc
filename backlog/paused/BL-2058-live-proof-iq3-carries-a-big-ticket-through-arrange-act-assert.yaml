ruling_provenance: relayed by specifier
approval_context: >
  Your request in the coordinator console on 2026-10-07 (quoted in
  source). FIRM: the vehicle is BL-1743, routed to the bare coder seat
  (the iq3 local model) and never to coder@2 while iq3 holds it; it is big
  for iq3 (nine files, sixteen sites, a new shared helper, read in parts)
  while each phase's own work fits one session. FIRM: the readout records
  whatever happens and never retries; a release or a split request is a
  NOT PROVEN verdict naming the phase, and the coordinator still routes
  the work on so BL-1743 gets done. What has happened so far: every one of
  the 12 parcels served to iq3 since BL-2038 landed (2026-10-06 13:24Z to
  23:46Z, nine tickets, BL-1913 last) printed "PHASE - arrange", and iq3
  ran the phase command 0 times; on BL-1913 two restarts handed it other
  tickets' stale steps (BL-2055) and a real write would have been missed
  for its leading slash (BL-2056). The ask is WHEN the proof runs.

ruling_options:
  - A - after the restart fixes BL-2055 and BL-2056 land (recommended)
  - B - now, before the restart fixes

ruling_tradeoffs:
  - Pros - a stall, release or split then measures iq3 and the phases, not the restart harness that sent it to BL-1963 and BL-1874 on 2026-10-06. Cons - waits for two high defects, both expedited at priority 5. Recommended because BL-2055 and BL-2056 are exactly the faults that turned BL-1913's restarts into off-ticket work, so a NOT PROVEN before they land could not say whether the phases failed.
  - Pros - an answer today. Cons - with 0 phase moves in 12 serves and the restart faults still live, a NOT PROVEN is the likely result and it cannot separate the seat from the harness; the proof would have to run again after BL-2055 and BL-2056.

invariants: []

description: |
  ## What is wanted

  A recorded answer to the human's question: can the iq3 coder carry a
  ticket too big for one session through BL-2037/BL-2038's arrange, act
  and assert phases, each phase in a fresh session?

  1. BL-1743 runs on the bare coder seat (iq3) alone (its notes and
     `assigned_to: coder` say so; the coordinator routes it there).
  2. When BL-1743 has closed, QA reads the trail of every iq3 session
     that held it and writes
     `backlog/evidence/BL-2058-iq3-aaa-live-proof-<date>.md` with:
     - each `PHASE:` line `ready_for_next.sh` served for BL-1743, with
       its time and session;
     - each `local_seat_phase_cli.bb` call (show, end, fail, pass) with
       its time, session and outcome;
     - per session: tool calls, compactions, edits and writes, commits
       naming BL-1743, and how it ended (phase move, BL-1991 restart
       with its override text, BL-1992 release, loop halt, done);
     - the outcome: iq3 forwarded a parcel QA approved; or a failed
       assert asked for a split; or BL-1992 released it; or the seat
       stalled and the coordinator pulled it;
     - the verdict. PROVEN only when iq3 alone moved BL-1743 from
       arrange through pass, every phase in a fresh session, and the
       parcel it forwarded passed QA. NOT PROVEN otherwise, naming the
       phase it stopped in and the evidence for why.

  ## Where the trail is

  - iq3's qwen sessions:
    ~/.qwen/projects/-home-carillon-swarmforgevc--worktrees-coder/chats/*.jsonl,
    one per session; the ones whose timestamps span BL-1743's hold.
    `PHASE:` lines are in run_shell_command results of
    `ready_for_next.sh`; phase moves are run_shell_command calls of
    `local_seat_phase_cli.bb`; compactions are `chat_compression`
    system records.
  - The phase record `.worktrees/coder/.swarmforge/phase/BL-1743.md`
    (gitignored; BL-2038 clears it at done, so the transcripts are the
    durable source).
  - BL-1991 restart state and pending overrides under
    `.worktrees/coder/.swarmforge/local-seat-restart/`; BL-1992 release
    notes in the coordinator's mailbox ("BL-1743 released ...").
  - git: commits naming BL-1743 on swarmforge-coder and any
    refs/swarmforge/parcel-backup/coder/ ref left by a move.

  ## Baseline (2026-10-07, for the write-up to compare against)

  Since BL-2038 landed (3be279fb5f, 2026-10-06 13:24Z) iq3 was served 12
  parcels over nine tickets (BL-2047, BL-2015, BL-2033 three times,
  BL-2034, BL-2048, BL-2053, BL-2051, BL-2005, BL-1913 twice). Each printed
  "PHASE: arrange - read .swarmforge/phase/<id>.md first." No session
  ran `local_seat_phase_cli.bb` (0 calls; .worktrees/coder/.swarmforge/phase/
  does not exist). BL-1913's arrange ran 18 minutes and about 150 reads
  with no write, then its restarts served other tickets' stale steps
  (BL-2055).

source: |
  The human in the coordinator console, 2026-10-07T07:21:40Z, verbatim:
  "are you ever going to try and give iq3 a parcel that will test its
  ability to deal with it using AAA ?" and at 07:23:34Z, verbatim: "fine:
  ask Specifier to mint an live proving of IQ3 to deal with a big ticket
  utilizing the new Arrange Act Assert functionality". Relayed as
  coordinator note 017200: "mint: live-prove iq3's AAA phases
  (BL-2037/2038) on a big ticket". Precedent for a QA-only live readout:
  BL-975.

qa_e2e_procedure: |
  Once BL-1743 has closed (its land, or its split's retirement):
  1. Find iq3's sessions that held BL-1743 (grep the chats directory above
     for BL-1743; keep the ones whose PHASE lines or Work note name it).
  2. Extract the trail items in What is wanted 2 from those sessions, the
     restart directory, the coordinator mailbox and git, and write the
     evidence file with the verdict.
  3. Commit the evidence. The verdict closes this ticket either way; a
     NOT PROVEN is a finding, never a bounce.
  Read-only: never run the seat, never re-route BL-1743, never edit the
  phase record.

