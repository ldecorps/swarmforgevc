invariants: []

description: |
  ## What is wrong

  BL-2072 made each phase of the front-desk bot's poll cycle that runs
  longer than FRONT_DESK_SLOW_PHASE_THRESHOLD_MS (27 s) leave one line in
  .swarmforge/operator/front-desk-diagnostics.log: the startup topic
  checks, the getUpdates wait and the handling of one update batch.
  BL-2061, landed the same day, added a fourth phase in front of the
  getUpdates call: `pollAndForward` first runs `applyHandoverUpdates`,
  which drains the updates the bridge read for the front desk and sends
  each through `processUpdate` (network posts to the bridge, approval
  commits). That call is not wrapped by `timePhaseIfWired`, so a slow
  hand-over batch holds the heartbeat with nothing naming it. QA found
  it while resolving the merge of the two parcels (note 003955, evidence
  backlog/evidence/BL-2061-QA-20261009-2.md).

  ## What is wanted

  - The hand-over apply phase is timed like the other three: when it
    runs at or over the threshold it leaves one line naming
    "hand-over apply" and its duration, and under the threshold it leaves
    nothing.
  - In BL-2072's feature, scenario 01's Examples gain the row
    `| hand-over apply              |` (kept aligned with the others), and
    the narrative's second-to-last sentence gains the phase, e.g. "a slow
    hand-over apply, a slow startup step, a slow long poll or a slow batch
    of updates all look the same from outside". The feature carries the
    hardener's mutation stamp: the hardener re-stamps it in this parcel.
  - The step handler learns the phase: the two regexes that list the
    phases gain `hand-over apply`, and a runner drives the REAL
    `pollAndForward` with a `drainHandoverUpdates` adapter returning one
    update whose handling advances the fake clock by the scenario's
    seconds. Scenario 02's cycle also drains one hand-over that advances
    nothing, so "every phase" includes it.

  ## How (direction, not mandate)

  - `timePhaseIfWired(adapters, 'hand-over apply', () =>
    applyHandoverUpdates(principalUserId, adapters))` at the one call
    site; nothing else in the function changes.

constraints: >
  Fakes for Telegram, the bridge and the clock, a temp operator directory;
  never the live token, the live operator directory or real sleeps. The
  feature row and the handler change land in the same commit (BL-233).

