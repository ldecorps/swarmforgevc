human_approval: pending
approval_context: >
  A changed feature file needs the human's look. No choice is posed. What
  needs sign-off: BL-2072's scenario 01 gains one row, "hand-over apply",
  so the updates the bridge hands over (BL-2061) leave a timing line when
  applying them runs long, the same line the other three phases leave.
  FIRM: the threshold, the line's format and the other phases are
