description: |
  ## Status: hotfixes 66bd85171f and d19171aeb6 landed the fix

  The coder reviews it and never re-applies it (the BL-1858 and BL-1868
  shape): read the commit, run its test, and check the guard against the
  invariant. A review that finds the change wrong says so in a note to the
  specifier rather than rewriting it.

  ## What the hotfix does

  A qwen PostToolUse hook on every tool reads the session transcript and
  warns about a call made twice already, with the same arguments (its
  description, is_background and timeout ignored), since the last edit,
  write_file, compaction, or shell command that changes the repo or the
  mailbox (git commit, merge, checkout, switch, restore, reset, rebase,
  cherry-pick, revert, stash; swarm_handoff.sh, done_with_current.sh,
  ready_for_next.sh). The call still runs; its result carries a REPEAT
  note with the count and the next step the latest compaction summary
  named. It never refuses: a refusal made the seat re-send the identical
  call until qwen's own loop dialog halted it (d19171aeb6 says why). qwen
  writes a turn's calls before running them, so the in-flight call is not
  counted against itself.

  ## What each stage checks

  - Coder: review 66bd85171f and d19171aeb6 against the invariant;
    test_bl1971_local_model_repeat_guard.sh passes.
  - Documenter: the local-model seat launch how-to names the repeat guard
    beside the PreCompact and edit hooks.
