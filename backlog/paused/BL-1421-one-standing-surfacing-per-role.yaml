  a burst alongside the high-volume chase notes"; the coder's completed
  mailbox proves it (30 completions 05:13-05:17Z, 3 s apart), and the
  sweep's state reset plus precedence are the source of the volume.

  IR-DRY (2026-09-05): 16 occurrences, 14 unique, three medium findings
  (told-for-A vs caught-up-to-A Givens; told-nothing vs told-once Thens;
  the two "commit B lands" Givens). Reviewed: each pair is the behaviour
  under test, deliberate, kept.

  INVEST at mint: Independent (both depends_on landed), Negotiable (state
  shape is direction), Valuable (one outcome: one tell per standing
  surfacing, no wake for a working role), Estimable (two lib changes + one
  daemon fact + tests; low), Small (four scenarios, three invariants),
  Testable (pure state fixtures, replay of 103 shas).

