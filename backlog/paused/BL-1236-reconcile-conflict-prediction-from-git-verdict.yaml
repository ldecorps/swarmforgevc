id: BL-1236
title: "master-main reconcile predicts a merge conflict by grepping merge-tree's diff for the word CONFLICT, so ordinary ticket prose resets committed work away"
milestone: M8
type: defect
severity: critical
status: todo
epic: swarm-reliability
priority: 18
direction: agent-reported
depends_on: [BL-1214]
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1236-reconcile-conflict-prediction-from-git-verdict.feature

human_approval: pending
approval_context: >
  This is the tenth reset-to-origin occurrence and the first one whose cause is
  pinned to a single line rather than reconstructed. BL-1214 shipped 2.5 hours
  before it and did not prevent it, because BL-1214 fixed the executor while the
  defect is in the predicate that decides which executor runs. Two things need
  sign-off. (1) Severity critical: it destroys committed work invisibly - every
  branch-walking search reports clean and only the reflog sees the casualties,
  which expire. (2) Scope: this ticket fixes the prediction only. The genuine-
  conflict path still resets without attempting a merge, which is BL-1214's
  explicit, documented contract ("that path must keep behaving exactly as it does
  today") - reopening it is deliberately NOT in this slice. Confirm that boundary
  is where you want it, given a fixed predicate makes that path rare rather than
  routine.

invariants:
  - "A conflict prediction is derived from git's own verdict for the merge, never from a text search over the content being merged."
  - "No divergence that git can merge cleanly is ever resolved by a reset that makes local commits unreachable."
  - "When git cannot produce a merge verdict, the sweep leaves the checkout exactly as it found it — an unavailable answer never authorises a reset."

required_wiring:
  - 'swarmforge/scripts/handoffd.bb::master-main-reconcile-lib/::the daemon must keep asking the shared reconcile lib for the prediction rather than inlining its own check — this anchor is deliberately the stable namespace alias, not the predicate name, which this ticket may rightly rename'
  - 'specs/pipeline/steps/index.js::bl1236ReconcileConflictPredictionSteps::acceptance handler registered'

description: |
  ## What is wrong

  `master_main_reconcile_lib.bb`:

      (defn merge-tree-reports-conflict?
        "True when `git merge-tree` output names a content/add conflict."
        [merge-tree-out]
        (boolean (re-find #"(?i)changed in both|CONFLICT|added in both"
                          (or merge-tree-out ""))))

  Its input is the output of `handoffd.bb`'s `master-main-merge-would-conflict?`,
  which runs the **legacy three-argument** form `git merge-tree <base> HEAD
  origin/main`. That form does not emit a machine-readable verdict — it emits a
  **unified diff of the merged content**. So the regex is searching the text of
  the files being merged.

  This repository's tracked content is saturated with the word "conflict":
  ticket YAMLs, evidence markdown, role prompts, constitution articles, and this
  very lib's own comments. Merging almost any backlog activity therefore
  "predicts a conflict".

  ## The incident (measured, not inferred)

  handoffd log, 2026-08-28:

      06:11:54.973Z  push-sweep diverged delivered
      06:11:56.134Z  master-main-reconcile drift ahead=9 behind=30
      06:11:58.051Z  master-main-reconcile conflict predicted-conflict-colliding-local-ahead
      06:11:59.176Z  master-main-reconcile reconciled

  `predicted-conflict-colliding-local-ahead` is the `:replay-bookkeeping` branch,
  which calls `master-main-rematch-onto-origin!` — `git reset --hard
  origin/main`. Nine commits became unreachable.

  Replaying the same inputs afterwards:

      $ git merge-tree --write-tree 38b7cbb66 bddfe75a1
      73700df8ed86d78967c37060967328411c161104      # exit 0 — CLEAN MERGE

      $ git merge-tree <base> 38b7cbb66 bddfe75a1 | grep -c "changed in both"
      0                                             # no real conflict either

      $ git merge-tree <base> 38b7cbb66 bddfe75a1 | grep -icE 'changed in both|CONFLICT|added in both'
      5                                             # five prose matches

  All five matches are the word "conflict" inside ticket and evidence prose. One
  of them is the line:

      +clean; only `human_approval` was blocking). No conflicts. This is a

  A sentence saying **"No conflicts."** is what predicted the conflict that
  destroyed nine commits, one of which recorded a human's approval tap.

  ## Why BL-1214 did not catch this

  BL-1214 made `:ff-absorb` try a real 3-way merge before falling back to reset,
  and it works. But `post-land-absorb-plan` never reaches `:ff-absorb` here:

      (and (pos? behind) (zero? ahead)) :ff-absorb
      absorb-would-conflict?            :replay-bookkeeping     ;; <- taken
      :else                             :ff-absorb

  With an honest predicate this divergence falls through to `:else :ff-absorb`
  and BL-1214's existing merge absorbs it losslessly. **The predicate is the
  whole fix** — no new executor is needed.

  ## Why severity critical

  Committed work is destroyed, and the loss is invisible to every ordinary
  check: `git log --all --grep=<id>` reports clean because the casualties are
  unreachable rather than un-merged. Only the reflog sees them, and reflog
  entries expire — `.git/gc.log` on this host already shows gc trying to run.
  Ten occurrences to date. It is not `swarm-down`, but it is data loss.

  ## How (direction, not mandate)

  - **Ask git for a verdict instead of reading a diff.** `git merge-tree
    --write-tree <a> <b>` exits 0 for a clean merge and non-zero when the merge
    conflicts (git >= 2.38; 2.43 on this host). The predicate's input then
    becomes a status rather than text, so its signature and probably its name
    change — that is expected and fine.
  - **Make the error path non-destructive.** Today an unusable answer (a failed
    `merge-base`, a git that cannot answer) returns `true`, i.e. "conflict",
    i.e. reset. That is fail-open dressed as fail-closed: the safe default here
    is to do nothing and surface, never to reset. Distinguish "git says
    conflict" from "git could not say".
  - Keep the daemon asking the shared lib for the answer; do not inline a
    second check in `handoffd.bb`.

qa_e2e_procedure: >
  (1) In a scratch clone, create a two-way divergence whose merged content is
  clean but where at least one changed file's text contains the word "CONFLICT"
  — a copy of any backlog ticket will do. (2) Confirm `git merge-tree
  --write-tree <local> <origin>` exits 0. (3) Run the reconcile sweep against
  that clone. (4) Confirm the daemon log records an absorb, not
  `predicted-conflict-colliding-local-ahead`, and that every pre-sweep local
  commit is still reachable from HEAD (`git merge-base --is-ancestor <sha> HEAD`
  for each). (5) Repeat with a genuine content conflict on the same file and
  confirm the existing recovery path is still taken and still logs its conflict
  line. (6) Repeat with `origin/main` made unresolvable so no verdict is
  possible, and confirm the sweep performs no reset and leaves HEAD unmoved.
  (7) On the live repo, watch one full sweep cycle at a real two-way divergence
  and confirm `git log -g` shows no new `reset: moving to origin/main` entry.

out_of_scope: |
  - The genuine-conflict recovery path. When git really does report a conflict,
    the sweep still rematches onto origin/main without attempting a merge. That
    is BL-1214's stated contract ("that path must keep behaving exactly as it
    does today"), not an oversight of this ticket. A fixed predicate makes it
    rare; changing it is a separate decision that needs its own ticket and its
    own approval. Do not fold it in here.
  - Whatever leaves an ambient `GIT_DIR`/`GIT_WORK_TREE` in agent and daemon
    environments. Related hazard class, different site — BL-1233 (launcher),
    BL-1196 and BL-1222 (test/property suites) own their sites.
  - Recovering the nine commits this occurrence destroyed. Already done by the
    specifier in `8c639fc36`; nothing to restore.

