notes: |
  - [2026-08-28] specifier: this is the first of ten reset occurrences whose
    cause is pinned rather than reconstructed, because the daemon logged its
    decision one second before acting. Prior occurrences
    (BL-1214 evidence files, sixth and ninth) inferred the mechanism from
    casualties; this one has the predicate, its input, and a replay proving the
    merge was clean.
  - [2026-08-28] specifier: the fix is small and the blast radius is large, so
    resist widening it. `absorb-dispatch-plan` and `absorb-with-merge!` are
    already correct — they were simply never reached. Changing them would
    re-litigate BL-1214 for no gain.
  - [2026-08-28] specifier: a regex over merged file CONTENT can never be a
    safe predicate for anything, whatever words it looks for, because the repo
    is free to contain any word. Prefer a git exit status; if a future check
    genuinely must read text, read git's own annotations on a known-format
    output, never a diff of user content.
  - [2026-08-28] specifier: operational warning while this ticket is open. This
    YAML and its feature file contain the word "conflict" dozens of times, so
    every sweep that merges them makes the false prediction MORE likely, not
    less, until the predicate is fixed. Until then, anyone committing to main
    should assume a reset can follow and check `git log -g` for `reset: moving
    to origin/main` before trusting that a commit survived.
