notes: |
  - [2026-08-29] specifier: the architect's evidence was accurate on every
    checkable claim - the red, the count ("~30+ across ~20+ files" against a
    measured 34 across 25), the pre-existing-at-f6d369da3 argument, and the
    hypothesis that some flagged lines are fixture strings rather than real
    usage. That last one is why this ticket triages line by line: the
    hypothesis was right, but the proportion is 1 of 34, not "some". A bulk
    migration would have silently corrupted that one test.
  - [2026-08-29] specifier: the architect reported "not already ticketed" after
    grepping for `tmpDirMigrationGuard`, `agentNotesCore`, `bl790-roles` and
    "raw mkdtemp call sites". That conclusion holds, but the grep did miss two
    live neighbours - BL-1226 (paused) and BL-1209 (active) - which name the
    convention gate rather than this guard. Both are checked against and
    excluded in out_of_scope above; neither owns this backlog of unmigrated
    sites.
  - [2026-08-29] specifier: no `required_wiring` armed for the 24 migrated
    files, deliberately. The deliverable IS those edits and acceptance scenario
    01 gates them directly by scanning the real tree; 24 path entries would add
    no check the scan does not already make, and every extra entry is another
    chance to arm an unmatchable pattern (BL-874, BL-960). Only the step-handler
    registration is armed.
  - [2026-08-29] specifier: observed while triaging, deliberately NOT scoped
    here. `pilotMkdtempConventionCheck.test.js` plants its fixture INSIDE the
    real tree (`extension/test/bl743-assess-<pid>.test.js`), which is the same
    directory `tmpDirMigrationGuard.test.js` scans. Under a parallel runner the
    scan could observe a planted file mid-test. It is not the cause of this red
    - the 34 violations are stable and reproducible - and speculating a flake
    into a ticket without evidence would be guessing. Recorded so the next
    reader has it.
  - [2026-08-29] specifier: no `human_approval` requested - a verified defect
    with a measured fix and no open decision for the operator.
