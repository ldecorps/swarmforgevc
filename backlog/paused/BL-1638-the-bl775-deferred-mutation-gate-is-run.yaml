notes: |
  Minted 2026-09-18 by the specifier while completing the coordinator's
  note, the same pass. AUTO-APPROVED under the 2026-09-17 operator hotfix
  (severity defect, no ruling_options) - see
  auto-approve-high-severity-defects-amendment-20260917.md. Owning the
  row is what lifts the throttle: the register reads a ticket in paused or
  active as an owner, so the cap returns to six the moment this ticket
  exists on main, and the run itself waits for the cooldown. The
  coordinator was sent paused-ready and told the cap may be restored.
  INVEST: Independent (the ledger, the verbs, the gate and the files
  exist), Negotiable (concurrency and the quiet-host reading are
  direction), Valuable (the throttle lifts now and the gate BL-775 owed is
  run), Estimable (one config, one run, one discharge - one sitting once
  the host is quiet), Small (two scenarios, two invariants), Testable (the
  parcel's own committed ledger, evidence and register, read in
  milliseconds).
