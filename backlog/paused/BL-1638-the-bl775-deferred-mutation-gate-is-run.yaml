id: BL-1638
title: "BL-775 landed on 2026-09-18 with its Stryker mutation gate deferred - the perTest dry run over out/bridge/bubbleLiveUiHtml.js and out/bridge/residentPaneLive.js timed out twice at the five-minute ceiling under load 11.5-25.2 with swap in use and eight or more concurrent workers, and a plain coverage run in the same window died with ERR_IPC_CHANNEL_CLOSED after a WSL-captured node abort - so the ledger row names a closed parcel, the register reads it as the only unowned row, and BL-1429's throttle holds the cap at one; this ticket owns the row through the three-day cooldown (not before 2026-09-21), recreates the scoped Stryker config the parcel did not land, runs the gate on a quiet host, and discharges the row with a completed result"
