invariants:
  - "The number of bb processes a run of this file starts is bounded by its number of queries, never by its number of fast-check draws."
  - "A fixture git step that exits non-zero stops the fixture and names itself; no later step runs on its result."

description: |
  ## What is wrong

  `extension/test/bl1272LandedSiblingInvariants.property.test.js` drives
  `swarmforge/scripts/land_step_lib.bb` through
  `specs/pipeline/steps/lib/bl1272LandDecisionCli.bb`. The CLI's header
  says both queries are "batched so a whole property run costs one bb
  process", and `landed-batch` takes a JSON array of cases for exactly
  that. Invariant 1's property (lines 31-71) instead calls
  `batch('landed-batch', [oneCase])` INSIDE `fc.property` with
  `numRuns: 60`: 60 bb processes, each `load-file`-ing the 2118-line
  library and its 307-line dependency, 0.19 s each on a quiet host
  (measured, three identical runs; bare `bb -e` is 0.00 s). The 20 s
  `testTimeout` is therefore met at 0.19 s per boot and missed at 0.34 s:

  | who | where | invariant 1 | verdict |
  |---|---|---|---|
  | BL-1499 QA, 2026-09-13 | full lane | > 20 s | fail (noted on BL-1553, not minted) |
  | BL-1485 QA, 2026-09-13 | full lane, run 2 of 3 | 20000 ms timeout, `fatal: ambiguous argument 'origin/main'` from the fixture | fail |
  | BL-1485 QA, 2026-09-13 | alone | (10.9 s whole file) | pass |
  | specifier, 2026-09-13 | alone, main `ccd3ff6e63`, load 5-10 of 20 cores | 29225 ms | **fail** |
  | specifier, 2026-09-13 | alone, same tree, minutes later | 19545 ms | pass by 455 ms |

  Invariant 2 already uses the CLI as designed (four enumerated cases,
  ONE `action-batch` call, 3-7 s building four real repositories with a
  real bare origin) and is not the problem.

  The `origin/main` message: every fixture git step in `build-case!`
  runs through `(process/sh {:dir .. :continue true} ..)`, so a non-zero
  exit is ignored and its stderr captured into a result nobody reads. The
  bare init, both pushes, the clone and the fetch each publish or read
  the `origin/main` the land plan then resolves; when one fails under
  load the fixture continues and the library reports a ref that does not
  exist. Which step failed cannot be recovered from QA's run, nor from the
  next one, until the fixture fails loud.

  Latent since BL-1272 landed the file (`ec0584131b`, 2026-08-30).
  Evidence: `backlog/evidence/BL-1556-specifier-unowned-red-repro-20260913.md`.

  ## What is wanted

  Invariant 1 costs one bb process for all 60 cases and still judges every
  one of them, both halves of its assertion intact (the equivalence and
  the fail-closed clause). A fixture git step that fails stops the fixture
  with a non-zero exit and a message naming the step. The run prints the
  case count (`BL-1556 reach map (invariant 1): {"cases":60,...}`) so the
  acceptance can see the property was not thinned. The file is green on
  `main` alone and in the full lane; the register row this ticket adds is
  removed in the same land.

  ## How (direction, not mandate)

  - Draw the 60 cases up front - `fc.sample(caseArb, { numRuns: 60, seed })`
    with the seed logged so a failure is replayable - make ONE
    `batch('landed-batch', cases)` call, and assert each case against the
    same `expected` equivalence and the same fail-closed clause, naming the
    case's inputs and index in the assertion message (shrinking is lost;
    the cases are four-field records and read fine as printed). Keep the
    non-vacuity `it` and invariant 2 as they are.
  - In the CLI, replace bare `(process/sh {:continue true} ..)` for
    fixture steps with a helper that checks `:exit` and, on non-zero,
    prints `fixture step failed: git <args>: <stderr>` to stderr and exits
    non-zero (or throws so the CLI dies naming it). The test's
    `execFileSync` then throws with that text instead of a later ref error.
  - Step handler `specs/pipeline/steps/bl1556OneBbProcessPerQuerySteps.js`
    puts a counting `bb` shim first on `PATH` (a shell script that appends
    a line to a counter file under a `mkProcessTmpDir` root, then execs the
    real `bb` found by `command -v` on the ORIGINAL PATH) and runs the
    property file alone under the properties config as a real subprocess
    (the bl1534BoundedSweepReachSteps.js shape); for scenario 04 it puts a
    `git` shim first that exits 1 on `push` and delegates every other
    subcommand, runs the CLI's `action-batch` for one case, and asserts
    non-zero exit and `push` in stderr. Land it in the same commit as the
    feature (BL-233).

  ## Not in scope

  - `swarmforge/scripts/land_step_lib.bb`, `vitest.properties.config.mjs`,
    and BL-1272's own acceptance feature and handler are not touched.
  - The BL-1272 parcel shipped a per-draw subprocess property against a
    CLI documented as one-per-run and no stage caught it; no process
    change is minted here.

