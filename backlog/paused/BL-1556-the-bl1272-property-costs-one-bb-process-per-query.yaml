qa_e2e_procedure: |
  On the parcel commit, from `extension/`:
  1. Make a counting shim: `mkdir -p tmp/shim && printf '#!/bin/sh\necho x >> "$BL1556_COUNT"\nexec /usr/bin/env bb "$@"\n' > tmp/shim/bb`
     with the real bb resolved OUTSIDE the shim dir (adjust the exec line
     to the absolute real path from `command -v bb`), `chmod +x`, then
     `BL1556_COUNT=$PWD/tmp/count PATH=$PWD/tmp/shim:$PATH npx vitest run
     --config vitest.properties.config.mjs
     test/bl1272LandedSiblingInvariants.property.test.js` five times ->
     green every time, `wc -l < tmp/count` at most 3 per run (unfixed: 62).
  2. Each run's stdout prints `BL-1556 reach map (invariant 1)` with
     `cases` >= 60; vitest's per-test duration for invariant 1's property
     is a small fraction of the 20 s budget (about 1 s on a quiet host,
     against 11-29 s unfixed).
  3. `bb specs/pipeline/steps/lib/bl1272LandDecisionCli.bb action-batch
     '[{"land":[]}]'` with a `git` shim first on PATH that exits 1 on
     `push` -> non-zero exit, stderr names `push`; without the shim the
     same query answers `replay` with both siblings unlanded.
  4. `git diff main...HEAD --name-only` names the property test, the CLI,
     the step handler, the feature, evidence, and the register row removal;
     `extension/src/`, `swarmforge/scripts/land_step_lib.bb`,
     `vitest.properties.config.mjs`, `property_suite_standing_allowlist.tsv`
     are unchanged; `grep -n 'numRuns: 60\|numRuns: runsPerCell' <the test>`
     still shows 60 cases.
  5. Break-then-restore: move the batch call back inside `fc.property`;
     the shim count returns to 62 and scenario 02 fails on the first run;
     restore.
