human_approval: pending

approval_context: >
  ONE display decision needs your call before this is built; everything else
  in the ticket is settled.

  When every visible ticket belongs to the same swarm, should the board render
  NO badge at all (today's board, byte-identical - what this ticket specs, and
  what invariant 3 pins), or should every row always carry its badge even on a
  single-swarm board?

  Spec'd as "no badge when there is nothing to disambiguate" because the grid
  runs on a 30-character width budget (PIPELINE_BOARD_GRID_MAX_WIDTH, measured
  in pipelineBoard.ts) that today fits about 7 ticket columns, and because
  your own acceptance hint asks that the board "still posts/pins as today".
  Say the word and it flips to always-badge.

  FIRM, not up for decision: one grid rather than two; s1/s2 as the display
  form; a remote swarm's live held-by-role stage rendering as absent rather
  than guessed (this host cannot see another host's mailboxes).

required_wiring:
  - "extension/src/concierge/conciergeTick.ts::readSwarmName::the board tick must resolve its OWN swarm name through the shared existing reader to decide which rows are local. Anchored to an identifier that already exists and is exported (holisticProjections.ts) but appears ZERO times in conciergeTick.ts today, so the pattern cannot match before the work is done and a private second resolver would leave it absent"
  - "specs/pipeline/steps/index.js::bl1009::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "Honest stage: a row owned by a swarm other than this one never renders a live held-by-role marker. Remote pipeline stage is state this host cannot observe, and an unobservable stage renders as absent, never as an inferred or stale one."
  - "Width-bounded: for ANY number of distinct swarm names and any badge text, the rendered grid still fits PIPELINE_BOARD_GRID_MAX_WIDTH and the whole message still fits PIPELINE_BOARD_MESSAGE_MAX_LENGTH. Badges may cost caption text; they may never cost a visible grid column or overflow the send limit."
  - "Mono-swarm parity: when every visible ticket belongs to one swarm, the rendered board is byte-identical to the pre-BL-1009 board. A single-swarm operator sees no change at all."

description: >
  WHAT. The Telegram pipeline board renders ONE kanban grid covering tickets
  from every swarm in the fleet, with each ticket visibly badged by the swarm
  that owns it. Operator naming: swarm1 / swarm2, short s1 / s2. Wire names
  are unchanged - `swarm_name primary` is s1 (Mac) and `swarm_name second` is
  s2 (WSL2 at /home/carillon/code/swarmforgevc, pack second-swarm) - so this
  ticket adds a DISPLAY map (primary -> s1, second -> s2) and does not rename
  anything on the wire.

  The operator's words, verbatim: "Prefer this over 'two grids on one topic.'"

  WHY. s2 is up on WSL2. The board's rows are already fleet-wide by accident -
  membership is exactly backlog/active/, which is shared git - but nothing on
  the rendered board says who owns a row, so an s2 ticket is indistinguishable
  from an s1 one. Verified at spec time - zero live tickets carry a `swarm:`
  field today, so this change is invisible on the current board until the
  coordinator starts assigning; that is the intended enabling order, not a
  gap (see WRITER below).

  WRITER (the data dependency, confirmed, not assumed). The `swarm:` field on
  a ticket YAML is written by the coordinator by hand when routing work to s2
  - BL-090 designed it as a hand-written git field and no script writes it.
  That is a real production writer, so this slice is not consuming a store
  nobody fills. The coordinator-side prose telling s1 that s2 exists as an
  assignable capacity was landed separately by the specifier on main (see
  notes) rather than ticketed, so the writer path is live before this ships.

  HOW (direction, not mandate). PipelineBoardRow gains an optional swarm; the
  tick resolves the local swarm name through the existing shared readSwarmName
  and defaults an absent `swarm:` to it, per BL-090's own convention. The
  30-char grid matrix is already full at about 7 columns of 3-wide cells, so
  the badge is expected to ride the per-column caption line below the matrix
  rather than a matrix cell - invariant 2 and scenario 06 are what actually
  bind here, and any placement satisfying them is fine.

  NON-GOALS, verbatim from the intake. "Do not require a second pipeline board
  topic or second front-desk bot for v1." "Do not replace the fleet console;
  this is the kanban board, not status.json merge." "Do not change secondary
  mode authority (s2 still does not promote/assign)." Also: no second
  getUpdates poller, and the single-message / pin discipline is unchanged.

  DEFERRED, deliberately. The intake's desired-behavior 4 also asks that a
  live "held by role X" stage be merged for s2 rows. This host cannot read
  another host's mailboxes and no cross-host stage signal exists, so that half
  is NOT in this slice - it is recorded on epic pipeline-board (BL-540)
  remaining_slices and is blocked on the cross-host roster slice recorded on
  epic fleet-topology (BL-543). The folder-derived half of desired-behavior 4
  (shared backlog / ticket YAML / folder position) IS authoritative and IS
  covered here. Scenario 05 pins the honest rendering in the meantime.

qa_e2e_procedure: >
  1. On the Mac (s1), pick one paused ticket and add a top-level `swarm: second`
     line to its YAML; commit on main so the shared backlog carries it.
  2. Have the coordinator promote it into backlog/active/ alongside at least one
     ticket with no `swarm:` field.
  3. Wait one concierge tick and read the pinned pipeline board message in the
     board topic. Confirm: ONE grid; both tickets have their own column; the
     s2 ticket's caption carries an s2 badge and the s1 ticket's an s1 badge;
     the s2 ticket shows no held-by-role stage marker; the message is still a
     single pinned message and the grid does not scroll horizontally on a phone.
  4. Move the `swarm: second` ticket back out of active/ and confirm the board
     returns to a badge-free render on the next tick (mono-swarm parity).
  5. Revert the fixture edit from step 1.

source:
  - "backlog/INTAKE-pipeline-board-unified-s1-s2-grid.md (operator, 2026-08-21) - archived to backlog/archive/ on drain. This ticket carries the intake's desired behaviors 1, 2, 3, 5 and the folder-derived half of 4; the live-stage half of 4 was split out to epic pipeline-board remaining_slices."

