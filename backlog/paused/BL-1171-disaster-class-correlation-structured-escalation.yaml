description: |
  ## What

  When multiple checks fire together (handoffd down + proc-* + swarm-starved),
  classify as one `failure_class` and emit a single structured escalation with
  `likely_causes`, `suggested_actions` (owner: babysitterd | operator | human),
  and `evidence_paths` — instead of N undifferentiated CRIT symptom lines.

  Policy matrix direction in source intake; unrecoverable → diagnose only.

qa_e2e_procedure: >
  (1) Inject ≥3 half-launch + handoffd down + starved → one disaster-class
  escalation with playbook fields. (2) Unrecoverable parse error → no repair storm,
  names log path. (3) BL-653 queue receives JSON detail operator prompt can parse.

out_of_scope: |
  - Half-launch repair execution (BL-1169).
  - /postmortem verb (BL-1170).

