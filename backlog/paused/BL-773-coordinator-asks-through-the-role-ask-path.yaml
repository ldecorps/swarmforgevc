notes: |
  ## e2e procedure for QA

  With a live swarm, drive the coordinator to raise an optioned question
  (`bb swarmforge/scripts/role_ask.bb "$(pwd)" --role coordinator --question
  ... --options '["a","b"]'`), confirm it appears in the coordinator's Telegram
  topic with two tappable buttons, tap one, and confirm
  `.swarmforge/operator/role-answers/coordinator.json` holds the tapped label
  and that the coordinator's next `ready_for_next.sh` returns the answer note.
  Confirm the coordinator session never exited during the wait.
