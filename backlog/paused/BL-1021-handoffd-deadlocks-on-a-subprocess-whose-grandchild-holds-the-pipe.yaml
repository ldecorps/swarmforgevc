id: BL-1021
title: "handoffd deadlocks in dispatch-gap-sweep because the child it shells out to still uses the banned clojure.java.shell API and leaves a grandchild holding the pipe open - the BL-061 deadlock relocated one process hop beyond the gate that was built to prevent it"
milestone: M8
type: defect
severity: critical
status: todo
epic: swarm-reliability
priority: 120
direction: swarm-reported
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1021-daemon-subprocess-cannot-outlive-its-wait-bound.feature

invariants:
  - "No subprocess the daemon spawns can block a sweep past the configured wait bound, at any process depth - a bound that cannot be observed firing is not a bound."
  - "A bounded-wait timeout is always announced: no subprocess call ends the cycle silently."

source: |
  QA session (.worktrees/QA) filed
  .swarmforge/operator/INTAKE-handoffd-dispatch-gap-deadlock-20260821.md at the
  human operator's direction, 2026-08-21, after the operator reported repeated
  `FRESHNESS_VIOLATION restart daemon=handoffd` alerts in Telegram
  (age_secs=128, then 189) and a manual kill+restart that did not resolve it.
  QA explicitly left severity and shape to the specifier.

  Specifier verification 2026-08-21 16:05Z, from source rather than from the
  report. The intake's own conclusion is CORRECTED below: it states "this is a
  different, new deadlock" and "not the known BL-061 bug". handoffd.bb is
  indeed clean - but the banned API is alive one process hop away, in the
  child handoffd spawns. That reframing is what makes this fixable.

description: |
  ## What the operator sees

  handoffd goes to STAT=U (uninterruptible wait) with a frozen heartbeat, the
  freshness watchdog alerts and restarts it, and it re-stalls within minutes.
  Eight log rotations on 2026-08-21, five of them in the ninety minutes before
  the report. Restarting resets the clock, never the cause.

  ## Why the existing guard did not catch it

  BL-061 root-caused a `clojure.java.shell/sh` deadlock in this daemon. The fix
  routed every subprocess call in `handoffd.bb` through
  `daemon_cycle_guard_lib.bb`'s bounded `sh!`, and a closure-gate test locks it
  in. Grepping the live file confirms the fix holds: `handoffd.bb` contains
  zero `clojure.java.shell` references and does not even require
  `babashka.process` itself.

  The gate is real, and it is one hop deep. From
  `daemon_cycle_guard_lib_test_runner.bb`:

      {:entrypoints #{"handoffd.bb"} :read-file read-file}

  It walks the **load-file closure** from `handoffd.bb`. But
  `dispatch-gap-sweep!` does not load its collaborator - it SPAWNS it
  (`handoffd.bb:1756`):

      (daemon-cycle-guard-lib/sh! ["bb" (swarm-handoff-script) (str draft)] ...)

  A process-spawn edge is invisible to a load-file walk, so the gate cannot
  see `swarm_handoff.bb` - and `swarm_handoff.bb:6` is:

      [clojure.java.shell :refer [sh]]

  used by its general-purpose `command` wrapper (~L60) for git and more.
  `clojure.java.shell/sh` has no timeout at all. So the API BL-061 banned is
  back on the daemon's critical path, reached by the one edge type its gate
  does not follow.

  ## The mechanism, from the live stack sample

  `sample 4060 3`, taken while frozen, showed two `send-off-pool` threads
  blocked in `read()` and one in `wait4` on child PID 47125 - a PID that no
  longer existed. The direct child had exited; something it spawned inherited
  the stdout/stderr write ends and outlived it, so the pipe never reached EOF
  and the stream-pump threads blocked forever.

  Two things must both be fixed, and they are independent:

  1. **The child re-introduces an unbounded API.** `clojure.java.shell/sh`
     cannot time out, so once its pump threads block, that process is gone.
  2. **The parent's bound did not fire either.** `sh!` wraps the call in
     `(deref proc bound ::timed-out)` with a 60s default, and on a hit it
     destroys the tree and fires `on-timeout!`. The daemon sat 4+ minutes past
     that bound with NO timeout line logged. So either the bounded deref does
     not return while its own `:out :string` pump threads are stuck, or it did
     return and `destroy-tree` could not reach a grandchild already reparented
     away from the tree. Determining which is the first task, because the
     invariant "the bound always fires" is what makes the daemon survivable
     regardless of what any child does.

  ## How (direction, not mandate)

  - Establish which of the two mechanisms above actually fired, with a
    deterministic repro: a script that exits immediately while leaving a
    grandchild holding its stdout/stderr. That repro is also scenario 01.
  - Make the bound genuinely unconditional. A fire-and-forget subprocess
    should not capture `:out :string`/`:err :string` at all - redirect to a
    file or /dev/null so no pump thread exists to block. Where output IS
    needed, the bound must return even when the pipe never closes.
  - Move `swarm_handoff.bb` off `clojure.java.shell`, for the same reason
    `handoffd.bb` was moved off it.
  - A process a script detaches must close or redirect inherited stdout and
    stderr before detaching.

  Widening the closure gate to follow process-spawn edges is the systemic
  half and is deliberately NOT here - it is BL-1022, so this ticket can move
  at the speed a critical live defect needs.

  ## Scope

  - swarmforge/scripts/daemon_cycle_guard_lib.bb - the `sh!` bound
  - swarmforge/scripts/swarm_handoff.bb - the banned API and its `command` wrapper
  - swarmforge/scripts/handoffd.bb - only if a call site must stop capturing streams
  - specs/features/BL-1021-daemon-subprocess-cannot-outlive-its-wait-bound.feature
    and its step handlers

  Out of scope: the BL-061 fix itself (correct, and holding), the closure-gate
  widening (BL-1022), and the freshness watchdog's restart behaviour (BL-1012).

routing: |
  This defect is IN the swarm's own delivery machinery: handoffd routes every
  git_handoff and note between roles, so a ticket to fix it cannot be relied on
  to reach a coder through the pipeline it is itself blocking. This is
  precisely the expeditor's rationale (BL-567): walk it through the same role
  hats with the stack stopped, reading only durable git data -
  `swarmforge/scripts/expedite.sh BL-1021`.

  The coordinator decides; recording the reasoning here so the choice is not
  re-derived under pressure. Note that delivery was working at 16:05Z (the
  daemon was healthy, 8 minutes into its latest restart), so the normal
  pipeline may well carry it - but the window is minutes, not hours.

qa_e2e_procedure: >
  1. Reproduce at the parent commit. Write a fixture script that spawns a
     grandchild holding its stdout/stderr and exits immediately. Call it
     through the daemon's chokepoint and confirm the call does NOT return
     within the wait bound, and that no timeout event is logged. This is the
     defect; confirm it before confirming it is gone.

  2. At the parcel commit, repeat step 1 and confirm the call returns within
     the bound, reports a bounded-wait timeout, and emits a timeout event
     naming the sweep and command.

  3. Confirm the sweep chain survives. With the same fixture wired into the
     dispatch-gap sweep, confirm every sweep scheduled after it still emits
     its `sweep-boundary` line and the next `cycle=N-start` appears.

  4. Confirm the banned API is gone from the spawned child: grep
     swarmforge/scripts/swarm_handoff.bb for `clojure.java.shell` and expect
     no match.

  5. Live soak, since this defect is defined by recurrence. With the fix
     running, confirm the daemon survives at least one full hour with no
     freshness-violation restart and no log rotation, and that
     `sweep-boundary sweep=dispatch-gap-sweep` appears repeatedly with a
     duration under the wait bound. The pre-fix baseline is five rotations in
     ninety minutes.

  6. Confirm the acceptance feature runs: all four scenarios execute with
     registered handlers (no runtime THROW on a missing handler).

notes: |
  The 165s `dispatch-gap-sweep` boundary in the intake's log tail is itself
  evidence the bound is not being honoured: 165s is well past the 60s default,
  and that line was the LAST thing written before the freeze.

  Do not "fix" a live occurrence by killing PIDs - the intake says so
  explicitly, and a preserved frozen process is the only way to get a
  symbolicated backtrace if step 1's repro does not reproduce it.

  Lineage: BL-061 (done, M4) is the original deadlock and its fix is correct.
  This ticket is that same API reached by an edge the BL-061 gate does not
  walk. BL-1022 closes the gate; this one closes the hole.
