description: |
  ## What is wanted

  On a rotation-router pack that declares `config coordinator_mode
  deterministic`, launch creates exactly one role session: the resident's.
  `is_sequential_dormant` treats the last-registered role (the coordinator)
  as the standing infrastructure seat; with no coordinator seat (BL-1959),
  no other role may become a second standing session.

  The all-local pack `swarmforge/packs/ollama-ista-local-model-mono-router.conf`
  declares `config coordinator_mode deterministic` and drops its
  `coordinator_agent`, `coordinator_model` and `coordinator_effort` lines
  (otherwise `check_local_model_seat_windows` still checks a coordinator
  card).

  ## What the coder checks

  The scenario; test_rotation_sequential_pack.sh still passes; the pack's
  coordinator_* lines per the procedure's step 4.
