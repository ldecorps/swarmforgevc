id: BL-1456
title: "The closing ceremony folds every lifecycle event since the previous run: the packet folds only events stamped with the run's UTC date, and since the 24/7 schedule moved the ceremony to about 04:25Z each packet has covered a four-hour sliver of its shift - 176 of 1756 events (10%) across 2026-09-04..07 - so the lean pass read 2026-09-06 as one ticket on a day fifteen moved"
milestone: M8
type: defect
severity: medium
# medium, not high: the ledger keeps every event (append-only; nothing is
# lost) and no other consumer reads the packet, so the fault is contained
# to the lean pass's own view, and the first post-fix run folds forward
# from where the last run stopped. Not low: the pass is the swarm's one
# process-health loop and it has drawn its hypotheses from ~10% of the
# evidence since 2026-09-05, silently - the 09-06 packet read "one ticket,
# BL-1440" on a day fifteen tickets moved and five closed.
