id: BL-1051
title: "A Let's Talk reply does not commit to the language it was asked in: only the French prefix names a reply language, neither forbids switching mid-reply, and a mangled French transcript silently falls to English"
milestone: M8
type: defect
severity: medium
# medium: real and contained, and it degrades the product on the surface the
# operator actually speaks to. A wrong-language or mixed-language reply is
# played back by a TTS voice locked to one locale, so half the utterance is
# spoken in the wrong accent. Nothing is lost or corrupted and the session
# keeps working, so not high.
status: todo
epic: swarmforge-console
priority: 34
direction: human-requested
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1051-a-lets-talk-reply-answers-in-the-language-it-was-asked-in.feature
human_approval: pending
approval_context: >
  ONE design call needs your answer; the rest of the ticket is settled.

  Your two asks pull against each other at the edges. "Per turn, not per
  session" says every turn is judged on its own. "Do not silently lock to
  English after a bad turn" says a badly transcribed turn must not flip you
  into English. Today those meet in the worst place: a transcript with no
  accents and no cue words scores 0-0 and the tie hardcodes `en`.

  Spec'd as: strong evidence still switches language per turn, exactly as you
  asked; only a TIE or an empty transcript carries the PREVIOUS turn's
  language forward instead of falling to English. A French session that gets
  one mangled turn stays French; saying a clear English sentence still
  switches you to English immediately.

  The alternative is pure per-turn with no memory at all - simpler, and the
  bad turn keeps flipping you to English. Say which you want.

  FIRM, not up for decision: both prefixes name their reply language
  explicitly; both forbid switching language mid-reply; the spoken-reply
  constraints (short plain sentences, no markdown, paths or URLs) stay.

required_wiring:
  - "specs/pipeline/steps/index.js::bl1051::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "The two voice-playback prefixes are structurally symmetric: whatever the English prefix states about reply language and monolingual output, the French prefix states too, and the reverse. A rule added to one and not the other is the defect this ticket exists to fix, reintroduced."
  - "Language resolution is total and never blank: for any transcript - empty, whitespace, emoji-only, mangled - resolution returns exactly one supported language and never throws, since every turn must be given a prefix."

description: |
  ## What is wrong

  Three separate gaps in `extension/src/bridge/letsTalkCore.ts`, all reached
  from the same live session on 2026-07-29.

  **1. Only one of the two prefixes names a language.**

      const VOICE_PLAYBACK_RULE_EN =
        "[Let's Talk — reply in short plain sentences for voice playback; ...]";
      const VOICE_PLAYBACK_RULE_FR =
        "[Let's Talk — réponds en français en phrases courtes ...]";

  The French rule says *réponds en français*. The English rule says nothing
  about replying in English - it only constrains the shape of the reply. So
  when the turn resolves to `en`, nothing instructs the agent to answer in
  English at all.

  **2. Neither prefix forbids switching mid-reply.** The phone plays one
  utterance through one TTS voice with one locale. A reply that mixes French
  and English is spoken entirely in whichever voice was selected, so the
  other half comes out in a thick wrong accent. Nothing in either prefix says
  "stay in this language for the whole reply".

  **3. A weak transcript silently becomes English.**

      const frenchHits = countLanguageWordHits(trimmed, frenchWord);
      const englishHits = countLanguageWordHits(trimmed, englishWord);
      return frenchHits > englishHits ? 'fr' : 'en';

  French needs to WIN to be chosen; a tie goes to English. Speech-to-text
  strips accents and mangles cue words, so a French turn that transcribes to
  neither an accented character nor a listed French word scores 0-0 and gets
  the English prefix. That is exactly what the operator experienced as
  "French recognition broke today": the early French turns were fine, one
  poorly transcribed turn scored the tie, and the session answered in English
  from then on.

  ## How (direction, not mandate)

  Give both prefixes the same two sentences - reply in THIS language, and
  stay in it for the whole reply - keeping the existing spoken-reply
  constraints unchanged. For resolution, keep the confident path exactly as
  it is (accents or a clear word-count win still decide the turn on its own)
  and change only what a tie or a blank transcript does: carry the previous
  turn's resolved language rather than hardcoding English. `resolveTurnSpeechLanguage`
  is the seam - it already takes the setting and the transcript, and an
  explicit setting of `en` or `fr` must keep overriding everything, unchanged.

  Not in this slice: widening detection to more languages, changing the TTS
  voice selection itself, or per-user language preferences.

notes: |
  Source intake:
  `.swarmforge/operator/INTAKE-lets-talk-match-reply-language-to-input.md`
  (human via a Let's Talk voice session, 2026-07-29 — the human explicitly
  asked for it to be filed as an intake, not carried as chat memory; archived
  to `.swarmforge/operator/archive/` on drain).

  The human's words, verbatim from the intake:

  - "For each Let's Talk input turn: if the transcript is mostly French, the
    agent must answer in French; if mostly English, answer in English.
    Persist this as product behavior, not as a one-session memory."
  - "each reply must stay in **only one** language end-to-end. Mixing FR and
    EN in one reply breaks phone-side TTS — it locks one voice/locale, so
    English spoken with a French TTS voice (or the reverse) sounds wrong."
  - "Harden detection so spoken French that STT mangles still tends to FR
    when intent is French; do not silently lock to English after a bad turn."
  - "Keep short plain sentences, no markdown / paths / URLs in the spoken
    reply path."

  IR-DRY: one `placeholder-variant` was real and normalized away - scenario
  07's Examples column was renamed `setting` -> `language` so its Then binds
  the same step text as scenarios 04-06 rather than a second placeholder name
  for the same assertion. Four findings remain and are deliberately kept: "no
  previous turn has resolved" against "the previous turn resolved to
  <previous>" (the two states scenario 06 exists to separate), and three
  placeholder-against-literal pairs. No `duplicate` findings.

  On acceptance shape: scenarios 01-03 assert PROMPT TEXT, which is normally
  the fake-acceptance smell (BL-654: a `requireIncludes` over prompt text
  went green while the behavior was rejected). It is not that here — the
  deliverable in gaps 1 and 2 IS the prompt text; there is no behavior behind
  it that the assertion could be standing in for. Invariant 1 is the real
  guard: it makes the two prefixes' symmetry the property, not two
  independently-drifting string checks. Gap 3 is ordinary behavior and is
  gated as such.

qa_e2e_procedure: |
  On the live host with `LETS_TALK_SPEECH_LANGUAGE=auto`:

  1. Open Let's Talk on the phone and speak a clear French sentence with
     accents. Confirm the reply is French, spoken by the French voice, and
     contains no English words at all.
  2. Speak a clear English sentence. Confirm the reply switches to English
     immediately - per-turn switching still works.
  3. Now speak French deliberately badly, or type a French sentence stripped
     of every accent and cue word (the tie case: "il va la bas demain" with
     no accents). Confirm the reply stays FRENCH rather than flipping to
     English, and that the session does not remain English afterwards.
  4. Ask a question whose natural answer would tempt a mixed reply (e.g. ask
     in French about an English-named file). Confirm the spoken reply is in
     one language throughout.
  5. Set `LETS_TALK_SPEECH_LANGUAGE=en` and confirm every turn replies in
     English regardless of the spoken language - the explicit setting still
     overrides detection.
