qa_e2e_procedure: |
  On the parcel commit, from `extension/`:
  1. `for i in $(seq 1 15); do npx vitest run --config
     vitest.properties.config.mjs
     test/bl604TrendAnalysisInvariants.property.test.js || echo FAIL;
     done` -> 4 passed every run, no FAIL line (the unfixed file fails
     about 2 of 15).
  2. In each run's stdout the printed reach map shows `up` >= 10 and
     `down` >= 10.
  3. `git diff main...HEAD --name-only` names the property test, one
     helper under extension/test/helpers, the step handler, the feature,
     evidence, and the register row removal; `extension/src/`,
     `property_suite_standing_allowlist.tsv`, the BL-604 feature and
     handler are unchanged. `grep -n "SIGN_FLOOR = 10" <the test>` still
     matches and `assertReachFloor(coverage, ['up', 'down'], SIGN_FLOOR`
     is still called.
  4. Break-then-restore: in the helper make the `down` arm build an
     ascending pair; scenario 02's `down` row fails and the property's
     own reach floor for `down` fails; restore.
