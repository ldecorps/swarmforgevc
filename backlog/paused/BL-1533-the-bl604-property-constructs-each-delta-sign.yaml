approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: extension/src is not
  edited - computeTrend, buildTrendAnalysis and renderTrendAnalysisSection
  are BL-604's landed contract and the property agrees with them on every
  draw; the fix is in the test's generator only. FIRM: the reach floors
  are not lowered, not dropped, and not made rarer-to-miss by inflating
  numRuns - BL-1062's rule is that a floor is met BY CONSTRUCTION, and a
  floor that is merely usually met is still a flake. FIRM: the file is not
  added to property_suite_standing_allowlist.tsv. Direction, not mandate:
  one helper under extension/test/helpers/ holds a generator that builds a
  trendable series whose final delta has a CHOSEN sign; the property and
  the step handler both require it. Minted by the specifier on QA's
  unowned-red note of 2026-09-11 07:02Z from the BL-1518-a parcel
  (evidence f88b2f4ed5 on swarmforge-QA); the specifier reproduced it
  alone on main 8a1a02c8a9, 2 failures in 15 runs, and BL-1354's QA saw
  the same miss on 2026-09-03.

invariants:
  - "A reach floor is met by construction: every value a floor names is produced by a generator arm that yields it on every draw of that arm, never by a uniform draw the floor merely hopes will cover it."

description: |
  ## What is wrong

  `extension/test/bl604TrendAnalysisInvariants.property.test.js`, invariant
  1 ("states computeTrend own direction and delta, as printed"): the
  length buckets `none`/`one`/`many` are iterated explicitly and each
  asserted to reach `LENGTH_FLOOR = 12` - constructed, as BL-1062 asks.
  But `coverage.up` and `coverage.down` are incremented per RENDERED
  bullet inside that same loop, and only the `many` bucket renders any.
  So the two sign floors (`SIGN_FLOOR = 10`) are a uniform sample: 12
  draws of 1..6 series (fast-check biases toward small arrays), each
  bullet up or down with probability about one half. The expectation sits
  near the floor and nothing constructs either sign.

  fast-check draws a fresh seed per invocation, so some runs miss:

  | who | where | result |
  |---|---|---|
  | BL-1354 QA, 2026-09-03 | full lane | `delta sign down drawn 8 < 10` |
  | BL-1518-a QA, 2026-09-11 | full lane, runs 1 and 3 of 3 | `delta sign up drawn 7 < 10` |
  | specifier, 2026-09-11 | alone, main `8a1a02c8a9`, 15 runs | 2 failed (`down drawn 8`, `up drawn 9`) |

  The 2026-09-03 sighting attributed it to host load. A generator draw does
  not depend on load; the isolated repro is the proof. Latent since
  BL-604/BL-654 landed the file (`4d8bf05993`, 2026-08-30). Evidence:
  `backlog/evidence/BL-1533-specifier-unowned-red-repro-20260911.md`.

  ## What is wanted

  Invariant 1 reaches its `up` and `down` floors on every run because the
  sign of a trendable series' final delta is CHOSEN by the generator, the
  way the length bucket already is - not sampled. The floors stay at their
  values and stay asserted. The run prints its reach map (the BL-1371
  `reach over N draws:` shape) so a reader, and scenario 03, can see the
  counts. The property lane is green on `main`; the register row this
  ticket adds is removed in the same land.

  ## How (direction, not mandate)

  - Put a signed-series generator in one small helper under
    `extension/test/helpers/` (name is the implementer's): given a sign
    (`up` | `down` | `flat`), an arbitrary that yields a trendable series
    (2..8 points) whose LAST two points have that ordering, so
    `computeTrend(points).direction` equals the sign on every draw. The
    property's `many` arm and the BL-1533 step handler both require it
    (invariant 1).
  - Iterate the sign the way the length buckets are iterated: run the
    `many` bucket once per sign with `runsPerCell` (from
    `test/helpers/reachFloors.js`) or an explicit per-sign loop, and keep
    `assertReachFloor(coverage, ['up', 'down'], SIGN_FLOOR, ...)` exactly
    as it stands. The `none`/`one` buckets are untouched.
  - Print the coverage map at the end of invariant 1 with `console.log`
    (BL-1371's `reach over` line is the precedent) so the acceptance can
    read the counts from the run rather than re-deriving them.
  - `extension/src/metrics/trend.ts` and `trendAnalysis.ts` are not
    touched; `specs/features/BL-604-*.feature` and its handler are not
    touched - BL-604's own acceptance is not red and is not this ticket's.

  ## Not in scope

  - Invariant 2's `trendable`/`untrendable` floors and the throwing-loader
    floor are met by construction today and are not changed.
  - The BL-654 parcel shipped a sampled floor and no stage caught it; the
    same fail-open shape BL-1445 names. No process change is minted here;
    the closing ceremony will see the ledger row.

