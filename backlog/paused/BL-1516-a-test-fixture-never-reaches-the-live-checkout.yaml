id: BL-1516
title: "Test fixtures reach the live checkout they run from: BL-1378's fixture ran `git checkout -b side` and committed inside `.worktrees/coder` (2026-09-03), the BL-1494 field runner writes daemon logs under a `bl1395-load-probe-no-root/` placeholder in cwd on every run (2026-09-10), and a bootstrap run from the coder worktree registered six nested `primary/<role>` worktrees (2026-08-30); every fixture root is proven under its mkdtemp before the first mutating git command, the probe placeholder never resolves to cwd, the standing suite fails loud on any new top-level entry it leaves behind, and the thirteen stray entries are removed"
milestone: M8
type: defect
severity: medium
# medium: real but contained. The one live consequence (the coder's
# checkout drifting to `side`) is BL-1515's high; what remains here is a
# fixture class that re-fires on every suite run (today's
# bl1395-load-probe-no-root/ is from 09:42 this morning) and pollutes the
# checkout with ignored files, plus thirteen stray entries. No safety
# signal is broken by this ticket's own defect and no data is lost.
status: todo
