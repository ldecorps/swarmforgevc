approval_context: >
  Minted approved under the 2026-09-17 operator hotfix (severity defect, no
  ruling_options). FIRM: the pass applies only when BOTH the roster names no
  art-director row AND the swarmforge-art-director convention branch does
  not exist. FIRM: BL-1657's fail-closed stays for every ref it resolves
  from a roster row or --branch: an unreadable or unresolvable art-director
  row still refuses, naming it. FIRM: an existing art-director branch is
