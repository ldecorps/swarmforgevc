description: |
  ## What is wrong

  The architect's BL-1665 pass (note 002870, evidence
  `backlog/evidence/BL-1665-architect-unowned-red-test-pipeline-code-on-main-guard-20260930.md`,
  2b64f779d3) found `swarmforge/scripts/test/test_pipeline_code_on_main_guard.sh`
  case `BL-925 provenance-01a` red on main, not caused by BL-1665:
  `Merge refused: check_art_director_tip.sh's resolved art-director branch
  swarmforge-art-director (from the swarmforge-<seat> convention (no
  roles.tsv row for art-director)) does not exist.`

  Cause, verified at mint (main 1176034b94): BL-1657 (85e9483069, landed
  2026-09-20) made `check_art_director_tip.sh`'s hook mode refuse whenever
  its resolved branch does not exist. `resolve_art_director_ref` falls back
  to the `swarmforge-art-director` convention when roles.tsv has no
  art-director row, so a repository with no art director at all refuses
  every merge that reaches the pre-merge-commit chain. BL-1657's own
  approval made fail-closed FIRM for "a ref it cannot resolve"; the
  convention fallback in a repository with no art director resolves a
  name for a lane that does not exist, which that FIRM did not have in mind.

  Census at mint (one run each, 2026-09-30):
  - Shell: the 17 tests under `swarmforge/scripts/test` that reference
    git-hooks, pre-merge-commit, hooksPath or check_art_director_tip. Only
    `test_pipeline_code_on_main_guard.sh` is red (1 case, the message
    above).
  - Acceptance: the 8 features whose handlers merge through the hook chain.
    `BL-925-reconcile-merge-of-qa-published-tip-completes.feature` is 0 of
    8, every scenario refused with the same message; BL-1295 3/3, BL-1459
    12/12, BL-1671 4/4, BL-632 11/11, BL-1657 4/4, BL-1297 6/6, BL-1444
    13/13.
  - Property: the 5 files that merge through the hooks, 12 of 12.
  - Live shape: `/home/carillon/gpu-bargain-hunter` has
    `core.hooksPath swarmforge/git-hooks`, its pre-merge-commit runs this
    guard, its roster has no art-director row and it has no
    swarmforge-art-director branch. Its vendored guard predates BL-1657, so
    its merges pass today; refreshing its scripts would refuse them all.
    This repository has the branch, so it is unaffected.

  ## What is wanted

  1. In hook mode, when `resolve_art_director_ref` answered from the
     convention fallback (no roles.tsv art-director row) and that branch
     does not exist, the guard exits 0: there is no art-director lane to
     guard. How (direction, not mandate): let the resolver report the
     source it used, as it already prints it, and branch on that rather
     than re-deriving "no row" (BL-1811).
  2. Unchanged: a roster row whose worktree cannot be resolved refuses;
     an existing art-director branch is judged by the lane rule (scenario
     03); direct mode with `--branch` refuses a ref that does not exist.
  3. `test_bl1444_art_director_tip_guard.sh` gains the no-art-director
     case beside its three sources.

  ## Scope
  - `swarmforge/scripts/check_art_director_tip.sh`,
    `swarmforge/scripts/test/test_bl1444_art_director_tip_guard.sh`, the
    step handler `specs/pipeline/steps/bl1823NoArtDirectorNoLaneSteps.js`
    (same commit as the runnable feature, BL-233), evidence. No other test
    fixture changes.

