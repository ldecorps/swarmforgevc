description: |
  ## What

  `swarmforge/packs/bob-multi-provider-mono-router.conf` gains a
  `window specifier ...` line on the ruled model, placed after the coder
  home line like every other mono-router pack (e.g.
  anthropic-mono-router.conf: `window specifier claude master --model
  claude-fable-5-1 --dangerously-skip-permissions --effort high`). The
  header's "Role -> agent -> model" table gets the specifier row; the
  "specifier is deliberately ABSENT" sentence and the window-block
  comment go; the PREREQ line claiming `PACK_STAFFING_SKIP_GATE=1` is
  needed because the table lacks an aider/glm entry is retired -
  measured 2026-09-10 by the specifier, `pack_staffing_gate_cli.bb` reads
  `pass` on every b.ai line (api-base-host-providers maps api.b.ai), so
  the hatch is not required and the LAUNCH line drops it. If the human
  rules all-GLM, the prerequisite for the specifier seat is the same
  B_AI_API_KEY the workers use; if Claude, the Anthropic subscription the
  coordinator seat already needs.

  ## Why

  With no specifier line, `rotate_to_role.sh specifier` has nothing to
  resolve on this pack: root intakes and unowned-red notes cannot be
  drained by a swarm running it (four such notes were structurally
  undeliverable on 2026-09-09).

  ## Scenario notes for the coder

  - Scenario 01/03 parse the pack with the launcher's own `parse_config`
    (the test_alternate_runtime_launch.sh shape) and read the header
    text; the ruled agent/model comes from the ticket's `human_ruling`.
  - Scenario 02 runs `bb swarmforge/scripts/pack_staffing_gate_cli.bb
    <root> <conf>` with `env -u PACK_STAFFING_SKIP_GATE` and asserts every
    window row's verdict column is `pass` (BL-1485's lesson: decide the
    variable in the handler, never inherit the pane's).

  ## Not in scope

  - Any worker seat change; the diversified fallback pack (BL-1512).

qa_e2e_procedure: |
  1. `env -u PACK_STAFFING_SKIP_GATE bb swarmforge/scripts/pack_staffing_gate_cli.bb
     . swarmforge/packs/bob-multi-provider-mono-router.conf` -> every
     window line `pass`, the specifier line among them.
  2. On a scratch root, `swarmforge/scripts/rotate_to_role.sh specifier`
     dry shape (bl931 runner) resolves a launch line for the pack.
  3. Header read: role table lists specifier; no "deliberately ABSENT";
     LAUNCH line carries no PACK_STAFFING_SKIP_GATE.
