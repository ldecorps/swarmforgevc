  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `git diff main...HEAD --name-only` names only evidence, the feature,
     the step handler (+ lib/), and new files under swarmforge/scripts/test/
     (invariant).
  2. `node specs/pipeline/cli.js specs/features/BL-1708-swarm-stamp-aider-seats-see-the-served-context-window.feature`:
     all scenarios ok.
  3. `bash swarmforge/scripts/test/test_aider_seat_launch_config.sh`: PASS.
  4. The evidence records goals 3 and 5.
  5. `backlog/hotfix-ledger.yaml` rows ab1d4cb2bd, d0dd4d36b7:
     `human_decision: null`.
  6. After done: the human runs `bb swarmforge/scripts/hotfix_ledger_update.bb .
     --decide <sha> approved|waived` for each and commits the ledger.
