description: |
  ## What
  Two operator hotfixes from 2026-09-23, live on main, never through a
  gate. This is that gate: a REVIEW ticket - confirm or refute, open
  narrow follow-ups for anything found.

  ## What landed (files to review)
  - **ab1d4cb2bd.** `swarmforge.sh`'s aider launch body passes
    `--model-settings-file` and `--model-metadata-file` with absolute
    repo-root paths (aider looked only in its own git root, the worktree,
    so only the coordinator ever read them: one IQ3_S model ran "diff" as
    coordinator and "whole" as QA, and think:false never reached
    coder/QA) and `--llm-history-file` per role under
    `.swarmforge/aider-llm-history/`, created before aider starts. Test:
    `test_aider_seat_launch_config.sh` (registered standing).
  - **d0dd4d36b7.** `swarmforge/packs/qwen2.5-coder-32k.Modelfile`
    (`PARAMETER num_ctx 32768` on the existing tag, per model rather than
    the global `OLLAMA_CONTEXT_LENGTH`, which would also grow the 12 GB
    IQ3_S) and `start-swarm-ollama-qwen2.5-coder.sh` exporting
    `AIDER_MAP_TOKENS=1024` (aider sizes its map at window/8).

  ## Review goals
  1. Scenarios 01-03 green against the real generator and files.
  2. `bash swarmforge/scripts/test/test_aider_seat_launch_config.sh`
     passes on the parcel commit.
  3. Record, do not review: the host-local `.aider.model.metadata.json`
    (gitignored) was set to 32768 by hand in the same session; it is not
    in the repository. Record its presence and value on this host in
    evidence, with the observation that a fresh host would not have it.
  4. Record, do not review: BL-1699 (paused) changes the same aider launch
     line (role note, test loop, timeout) and keeps these three flags;
     whichever lands second re-runs the other's feature in its evidence.
  5. PROBE, do not fix: the commit's own "pre-existing" claim that
     `test_openrouter_provider_support.sh` fails identically on unmodified
     main (staffing gate, seat-model-unresolved). Run it once on the
     parcel commit and record the result; if still red and not in
     `backlog/standing-reds.tsv`, send the specifier an `unowned-red`
     note (standing-red amendment 2026-09-05).

  ## Scenario notes for the coder
  - Scenario 01/02 generate launch scripts the way
    `test_aider_seat_launch_config.sh` does, from the handler, without
    editing that test.
  - Scenario 03 reads the Modelfile and the start script statically.
  - Do NOT assert the ledger rows' `human_decision` in a scenario (red the
    day the human certifies, BL-1006); it is a QA step.
  - The step handler is `bl1708SwarmStampAiderContextWindowSteps.js`,
    landing in the SAME commit as the feature (BL-233).

