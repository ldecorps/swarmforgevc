  ## Status: hotfix 8ed4173ce4 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What the hotfix changed

  Each `confirmPoleAlone` call spawns a real vitest run, about 1 s at load
  5 and about 1.8 s under QA's load. The file made four: the first and
  third tests each confirmed the same repo-relative file. That call now
  runs once (`confirmRelOnce`) and both tests read its outcome. Measured:
  2.1 s for the file at load 5 over two runs, against 3.2 s before.

  ## What is wanted in this parcel

  - Review the change; confirm no assertion changed.
  - Evidence: the review and the file's duration from one run.

  ## Scope

  The test file and evidence.

