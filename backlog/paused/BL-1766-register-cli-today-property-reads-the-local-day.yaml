id: BL-1766
title: "bl1648RegisterCliInjectedDateInvariants' invariant-2 property builds its 'first seen today' row from the UTC day (new Date().toISOString()) while standing_red_register_cli.bb with no --now reads the local day (LocalDate/now), so it goes red (age 1, expected 0) every night from 00:00 to 01:00 BST - red in QA's property lane on 2026-09-26 at 00:1x BST, holding BL-1762's land; the property computes today the way the CLI does"
milestone: M8
