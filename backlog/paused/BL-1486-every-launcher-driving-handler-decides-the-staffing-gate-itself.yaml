id: BL-1486
title: "Six acceptance features (BL-1052, BL-1218, BL-1320, BL-1418, BL-961, BL-628) and the shipped-confs shell test drive the launcher's parse_config on fixtures with no role matrix and pass only under the pane's PACK_STAFFING_SKIP_GATE=1: green in every role pane, red in any shell without the hatch (27 scenario rows red under env -u on main 2026-09-08), so an offline expedite run of any parcel whose e2e names them holds under Article 4.2; each handler declares the override in the environment it spawns - the acceptance-lane sibling of BL-1457"
milestone: M8
type: defect
severity: high
