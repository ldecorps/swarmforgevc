description: |
  ## What happened

  `.swarmforge/launch/coder@iq3.sh` runs
  `qwen ... "Read and obey every instruction in '/home/.../.swarmforge/prompts/coder@iq3.md' (constitution, pipeline, role, pack). ..."`.
  In qwen's own record of each session's first user message the path
  reads `.../prompts/coder @iq3.md`: qwen's "@" file-reference handling
  rewrote it before the model saw it. Sessions 9f06a797 (12:13Z),
  6119e423 (12:27Z) and 992f20dc (12:51Z) each called read_file on the
  spaced path, got "File not found", globbed `.swarmforge/prompts/*`, and
  only then read the card. The parenthetical describes the generic
  composition. A local-model seat's file is the compact card (BL-1798),
  and the first two sessions went on to read the constitution, PIPELINE
  and coder.prompt.

  ## What is wanted

  1. A local-model seat's launch prompt names a card path with no "@" in
     it, and that path holds the seat's composed card (scenario 01).
  2. It does not describe the card as "(constitution, pipeline, role,
     pack)" (scenario 02).
  3. Every other agent is unchanged: a Claude seat named `coder@2` still
     appends `.swarmforge/prompts/coder@2.md` (scenario 03).

  ## How (direction, not mandate)

  - `write_role_launch_script`'s `local-model)` branch in
    `swarmforge/scripts/swarmforge.sh`. Writing the card under a name with
    "@" mapped to "-" is one way to do it; escaping the "@" in the
    prompt is another if qwen passes it through unchanged. Check qwen's
    recorded first user message on a scratch HOME with a loopback fake
    endpoint (BL-1829's method), not the argv string.
  - The babysitter, `swarm_ensure.bb` and the resume path re-execute
    the launch script (BL-323). Check that nothing else reads
    `.swarmforge/prompts/<seat>.md` for a local-model seat before
    renaming it: `grep -rn "prompts/" swarmforge/scripts`.
  - Step handler `specs/pipeline/steps/bl1837LocalSeatCardPathSteps.js`,
    registered in `specs/pipeline/steps/index.js` in the same commit as
    the feature's first green run (BL-233). Drive the launch-script
    writer the way `test_local_model_seat.sh` does, in a mkdtemp fixture
    (`git init`, `rev-parse --git-common-dir` first, BL-1390).

  ## Scope

  `swarmforge/scripts/swarmforge.sh` (the local-model launch branch and
  where its card is written), its shell test, the step handler and its
  registration, evidence.

out_of_scope: |
  - The gemini branch passes its prompt path the same way, and gemini
    shares qwen's "@" handling. No gemini seat carries an "@" in its name
    today. Ticket that separately if one ever does.
  - The window budget qwen uses: BL-1838.

