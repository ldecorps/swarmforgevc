  1. `node specs/pipeline/cli.js specs/features/BL-1837-a-local-model-seats-launch-hands-qwen-its-card-by-a-path-qwen-reads-verbatim.feature`:
     3 of 3 ok. Measured 0 on main at mint: no handler exists yet.
  2. `bash swarmforge/scripts/test/test_local_model_seat.sh` and
     `bash swarmforge/scripts/test/test_alternate_runtime_launch.sh`:
     ALL PASS (both measured on main 7f38e5d7fe at mint).
  After the land (the coordinator's check on the next swarm launch, not
  QA's): the coder@iq3 session's first read_file names the card path and
  succeeds (`~/.qwen/projects/*coder-iq3/chats/<newest>.jsonl`).

