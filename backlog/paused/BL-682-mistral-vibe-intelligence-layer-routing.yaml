source: |
  Drained from `.swarmforge/operator/INTAKE-wire-mistral-vibe-into-intelligence-layer.md`
  (2026-07-26), archived alongside this ticket.

  ## Why this is small: the hard part already shipped

  Unlike the qwen-code ask, Mistral Vibe (`vibe`, `pipx install mistral-vibe`)
  is ALREADY fully built and verified live in this repo:

  - `prompt_engine_lib.bb`'s provider-capabilities carries a `"vibe"` entry
    with the correct real-agent shape (`:wake-style :chat-message`,
    `:bootstrap-style :embedded`), explicitly contrasted in the code's own
    comments against `"aider"`.
  - Two production packs exist and are documented as verified live:
    `swarmforge/packs/vibe-mono-router.conf` and `vibe-forge.conf` — the
    latter's header states "Verified: it ran the script and performed the task
    the output asked for."
  - A dedicated launcher `start-swarm-mistral.sh` exists.
  - Host smoke-check by the coordinator: `MISTRAL_API_KEY` present, `vibe`
    2.19.1 installed (the version the pack comment verified), launcher
    present. Launch-ready TODAY as a standalone pack — that part needs no
    ticket.

  The gap is exactly one layer up: the Intelligence Layer cannot route to it.

description: |
  ## The two registrations, and nothing else

  1. **`model_factory_lib.bb`'s `provider->agent`** is
     `{"anthropic" "claude", "openai" "codex", "cerebras" "aider"}` — no
     `"mistral"` key, so `provider->agent-for` falls through to returning
     `"mistral"` itself, which is not an agent. Add `"mistral" -> "vibe"`.
  2. **Model Steward** (`model_steward_cli.bb register <provider>/<model>
     [--status S] [--context-window N] [--cost-class C]`) has no Mistral entry
     at all — the registry holds only `anthropic/claude-sonnet-5`,
     `cerebras/llama-3.3-70b`, `openai/gpt-5.3-codex`. Without one, no role
     recommendation can ever name Mistral, because `role-recommendations`
     filters to certified registered models.

  ## The model id must be READ, not invented — verified at spec time

  The intake suggested checking `vibe-mono-router.conf` for the model string.
  There isn't one. That pack's per-role column is `--max-price` (a hard
  per-session dollar cap: coder 3.00, everyone else 2.00); Vibe selects its
  own model, and `vibe --help` exposes only `VIBE_ACTIVE_MODEL` as an
  override. No vibe config file exists on this host yet, so the id cannot be
  resolved statically today.

  So the contract is:

  - Resolve the id from the live tool (`VIBE_ACTIVE_MODEL`, or whatever the
    running `vibe` reports as its active model) and register THAT.
  - If the tool supplies no id, register at agent granularity (`mistral/vibe`)
    and record in the entry WHY — that it is agent-granular because Vibe
    chooses its own model per session.
  - Never write a plausible-looking string like `mistral/mistral-vibe` that
    nothing in the system actually reports. The other three entries are real
    model ids; a fabricated fourth would make the registry lie.

  `--cost-class`: Vibe's hard per-session dollar cap makes it a genuine
  low-cost candidate, but pick the class from real usage once it runs rather
  than from the cap alone — the cap bounds spend, it does not measure it.

acceptance: specs/features/BL-682-mistral-vibe-intelligence-layer-routing.feature.draft

out_of_scope: |
  - The packs, the launcher, and the `"vibe"` agent shape. All three exist and
    are verified live; this slice must not touch them.
  - BL-574 (PromptEngine Slice 2, per-model prompt adapters). Orthogonal and
    already at priority 01 in its own right. Vibe is exactly the kind of
    provider that will want an adapter once BL-574 ships — but it uses the
    generic prompt wording today (BL-546 Slice 1 scope) and that is unchanged
    here.
  - The qwen-code onboarding (its own intake, sequenced after this one).
  - Certifying the model or acting on any role recommendation it enables.
    Registration only.

notes: |
  **CAUTION for the builder — two generations of Mistral packs exist.**
  `vibe-mono-router.conf` and `vibe-forge.conf` are the real, working ones.
  `mistral-lean.conf` and `two-pack-mistral.conf` are the OLD, BROKEN
  aider-based attempt, kept only as the historical failure record (aider is a
  file EDITOR and cannot drive the swarm). Do not confuse them, and do not
  "fix" the old ones back into use.

  Gherkin parked as `.feature.draft` per BL-233; the coder promotes it to
  `.feature` and wires its step handlers in the same commit.
