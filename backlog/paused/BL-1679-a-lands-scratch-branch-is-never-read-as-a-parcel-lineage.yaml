id: BL-1679
title: "the land step drops its land-replay/<ticket>-<sha> scratch branch on every failure path but returns it on success for QA to check out and push from, and no mechanism deletes it afterwards (149 refs on this repository from lands up to 2026-09-20, 105 of them already on origin/main; today's BL-1641 refs were removed by QA's hand), while pre_qa_gate_gather_lib's role-branches reads each pipeline role's CURRENT worktree HEAD instead of the roster branch - so for the minute QA's checkout sits on the scratch branch every other seat's pre-QA ancestry gate reads it as swarmforge-QA and the replay commit as a stranded ticket commit (hardener self-check 2026-09-21 13:46-13:47 local: PRE_QA_GATE_FAIL ancestry BL-1641 cf7d8c460f stranded on land-replay/BL-1641-9097b85058); a land's scratch artifacts are never a parcel lineage - the gate reads the roster branch and warns on a drifted checkout, and a landed replay's ref is swept once its tip is on origin/main"
