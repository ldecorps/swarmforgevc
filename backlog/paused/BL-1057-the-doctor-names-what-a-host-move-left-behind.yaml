id: BL-1057
title: "A host move silently leaves host-pinned config behind and nothing notices until a user-facing surface breaks: there is no command a human can run after a switchover to find what is still pointing at the old machine"
milestone: M8
type: feature
status: todo
epic: swarm-reliability
priority: 18
direction: human-requested
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1057-the-doctor-names-what-a-host-move-left-behind.feature
human_approval: approved
approval_context: >
  Two design calls in this ticket narrow what you asked for, so they need your
  ruling before it is built.

  YOU ASKED FOR DETECT AND REPAIR. This ticket specs DETECT ONLY. The reason is
  that the repair half is mostly not automatable: of the two real casualties
  this switchover produced, one (the stale extension/.vscode/settings.json
  target path) is a one-line rewrite, and the other (the Bubble named tunnel)
  needs an interactive browser login plus a deliberate human registration of
  this host as the tunnel operator root, which no script may do unattended.
  Speccing repair alongside detection would mint a ticket that is mostly
  detection wearing a repair label. Say the word and a follow-up ticket adds
  guided repair for the mechanically fixable subset.

  THE DOCTOR IS READ-ONLY PERMANENTLY, NOT JUST IN THIS SLICE. A diagnostic you
  can safely run on a half-migrated host is worth more than one that might
  rewrite config while you are still working out what moved. So a future repair
  capability must be a SEPARATE command, never a --fix flag bolted onto this
  one. That is why invariant 1 is stated as a durable property rather than a
  slice boundary.

  FORM: a standalone script under swarmforge/scripts/, not a ./swarm doctor
  subcommand. Your intake left the form to me. A subcommand would mean editing
  the fork's swarmforge.sh, and a doctor verb is already inside BL-554's
  root-capability-commands epic, which is itself blocked on an unrelated ruling
  from you. Standalone now, foldable into ./swarm doctor later when BL-554 is
  ruled on.

required_wiring:
  - "docs/index.md::how-to/BL-1057-host-switchover-doctor.md::the runbook must be linked from the docs index - a switchover checklist nobody can find is the same failure as not having one, and discoverability is half of what this intake asked for"

invariants:
  - "The doctor never writes. After any run, on any host state including a fully stale one, every inspected file, directory and registry entry is byte-identical to what it was before. This is a durable property of the command, not a boundary a later repair slice may relax - repair belongs to a separate command."
  - "Every declared check appears in the report exactly once with exactly one verdict. A check whose target cannot be read reports BLOCKED; it is never omitted from the report and never assumed OK."
  - "A non-OK finding always names both the concrete location at fault and the remediation step for it. The report never states a failure the reader cannot act on."

description: |
  ## What is wrong

  This swarm's host moved from a Mac (`/Users/ldecorps/projects/swarmforgevc`)
  to WSL2 (`/home/carillon/swarmforgevc`) on 2026-08-22. The daemons and tmux
  sessions came up fine on the new host. What did not come across was the
  host-pinned configuration that lives OUTSIDE the tracked repo or outside any
  daemon's own restart path - and nothing anywhere reported that.

  Two concrete casualties, both found by hand:

  - `extension/.vscode/settings.json` still pointed `swarmforge.targetPath` at
    the old Mac path, so the extension dev workspace targeted a repo that does
    not exist on this machine. Found only because someone opened that
    workspace.
  - `bubble.musicalsifu.com` served Cloudflare **Error 1033**. The named tunnel
    was never registered on this host: `~/.cloudflared/` does not exist,
    `~/.swarmforge/tunnels/` (the BL-857 tunnel-ownership registry) does not
    exist, and `.swarmforge/operator/named-tunnel.env` is absent. A
    `cloudflared` process IS alive, but it is the anonymous quick tunnel, which
    can only ever serve a `*.trycloudflare.com` URL. Found only because a real
    user-facing surface broke and a human noticed.

  The general shape: a host move leaves behind config that is host-pinned by
  design - local editor settings, `$HOME`-rooted credential and registry
  directories, machine-local env files - and there is no command that walks
  them and says which ones still describe the machine you left.

  ## What is wanted

  One command a human runs right after moving the swarm to a new machine or
  path. It walks a declared inventory of host-pinned locations, reports each
  one, and exits non-zero if any of them is not OK.

  Three verdicts, plus a fourth for the case that must never be silent:

  - `OK` - the location is present and describes THIS host and repo root.
  - `STALE` - present, but names a repo root that is not this one. The finding
    quotes the stale value it found.
  - `MISSING` - a host-pinned registration the forge needs is absent entirely.
  - `BLOCKED` - the check could not be run (unreadable, permission denied).
    Reported as its own verdict, never omitted and never counted as OK.

  Every non-OK finding names the remediation step for that specific location.
  For the tunnel entries that means pointing at
  `docs/how-to/named-tunnel-bubble-musicalsifu.md`, whose registration step is
  explicitly a deliberate human action - the doctor tells you to do it, it does
  not do it for you.

  ## Scope

  The declared inventory, at minimum:

  | Location | Check |
  |---|---|
  | `.vscode/settings.json` | `swarmforge.targetPath` and `swarmforge.configPath` name this repo root |
  | `extension/.vscode/settings.json` | `swarmforge.targetPath` names this repo root |
  | `~/.swarmforge/tunnels/operator-root` | present, and names this repo root |
  | `~/.cloudflared/` | `cert.pem`, `config.yml` and tunnel credentials present |
  | `.swarmforge/operator/named-tunnel.env` | present |

  The inventory is DATA, in one place, so adding a sixth location later is a
  one-row change rather than a new code path.

  Deliverables:

  - The command itself, plus its unit suite.
  - `docs/how-to/BL-1057-host-switchover-doctor.md` - the post-move runbook,
    linked from `docs/index.md` (see `required_wiring`).

  ## How (direction, not mandate)

  The natural home is `swarmforge/scripts/`, alongside the existing checkers
  (`babysitter_check.bb`, `master_checkout_drift_lib.bb`,
  `remote_control_health_lib.bb`), following the same `*_lib` plus thin CLI
  plus `test/*_lib_test_runner.bb` shape. It has to run with the extension
  host down, on a machine where the move may be half-finished, so it should
  depend on as little as possible.

  Every `$HOME`-rooted path needs an env seam so the suite never reads the real
  `$HOME` - `tunnel_ownership_lib.sh` already sets the precedent with
  `SWARMFORGE_TUNNEL_REGISTRY_DIR`, and the repo root must be injectable the
  same way rather than derived from `process.cwd()` at import time.

  ## Out of scope

  - Any repair or rewrite of an inspected location. See `approval_context`.
  - A `./swarm doctor` subcommand. See `approval_context`.
  - Anything BL-789 already covers - that ticket hardened the freshness cron
    and bridge supervisor so DAEMONS survive a host quirk. This is the human's
    post-move checklist for things no daemon restarts.
  - Registering this host's named tunnel. That is an interactive human step,
    already handed to the human as a command sequence.

qa_e2e: |
  Run the command on this live WSL host, as it stands, with no fixtures:

  1. It must report `.vscode/settings.json` and `extension/.vscode/settings.json`
     as OK - both were repaired by hand on 2026-08-22 and now name
     `/home/carillon/swarmforgevc`.
  2. It must report all three tunnel locations as MISSING - `~/.cloudflared/`,
     `~/.swarmforge/tunnels/operator-root` and
     `.swarmforge/operator/named-tunnel.env` are all absent on this host, which
     is the state that produced the live Error 1033.
  3. It must exit non-zero, and each MISSING finding must name
     `docs/how-to/named-tunnel-bubble-musicalsifu.md`.
  4. Re-run `git status` and confirm the working tree is unchanged by the run
     (invariant 1 against the real host, not a fixture).

  Then point the injected repo root at a path that is not this checkout and
  confirm the two settings files flip to STALE, quoting the value they hold.

source: >
  Backlog root intake backlog/INTAKE-host-switchover-restart-command.md, raised
  by the human in the coordinator's live pane 2026-08-22 after the Mac to WSL2
  move, and updated the same day with the Bubble named-tunnel Error 1033
  casualty. Drained by the specifier 2026-08-22; that intake produced this one
  ticket and archives pointing at it.

notes: |
  OPERATOR DIRECTIVES, VERBATIM (Article 5.3 - a consolidation never drops a
  human sentence):

    > we have just switched over from mac to WSL

    > maybe there is some house keeping to do ?

    > maybe we need a specific command to restart after a switch over

  TOOLING FALLBACK: implemented in Babashka or shell, this lands in the lane
  that has NO mutation, CRAP or DRY tooling wired (engineering.prompt, Startup
  Tools). Its gate is its own unit suite under `swarmforge/scripts/test/`. The
  hardener must record that degraded fallback explicitly and must not report a
  mutation or CRAP result it did not run.

  OBSERVED BUT NOT SCOPED HERE: the root `.vscode/settings.json` is TRACKED in
  git and carries host paths, so every host move dirties a tracked file - it is
  showing as modified right now. Whether host paths belong in a gitignored
  `settings.local.json` instead is a real question and a separate ticket; this
  doctor only reports the mismatch it finds.

  RELATED: BL-1029 (paused, approved) reasons about behavior whose correctness
  depends on the install path - its assessment still holds under
  `/home/carillon/swarmforgevc`, which contains no apostrophe. BL-554's
  root-capability-commands epic already lists a `doctor` verb; if that epic is
  ruled on and built, this command is the thing that verb should call, not a
  second implementation.
