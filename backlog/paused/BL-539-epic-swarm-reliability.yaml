remaining_slices:
  - "handoffd's abnormal exit is logged identically to an orderly one: the main loop's outer form is a `try` with a `finally` and no `catch` (handoffd.bb ~3318), so a throw escaping `poll-once!` deletes the pid file and logs `stopped` on its way out. A post-mortem reading the log sees a clean shutdown. Found by the specifier while triaging BL-1102 (which fixes the throw itself, not the logging); left unticketed to keep that slice to one sitting."
  - "Batch-claim suspect notes are one per PARCEL, not one per CLAIM: the hardener batch of 2026-08-22T20:20:18Z produced three notes per round, twice, for a single claim by a single owner whose HEAD is shared across all three. Fold a claim into one note naming its parcels. Split out of BL-1076 (which fixes the false trigger) to keep that slice to one sitting; asserted nowhere in BL-1076 feature file."
  - "A QA merge-up `note` parcel is watched for commit progress like a work parcel: the BL-975 merge-up in that same batch got its own progress sidecar and its own suspect note. Decide whether note-type parcels belong in the batch-claim-progress observer at all. Also split out of BL-1076."
  - "Per-ROLE provider passthrough on create_role_session: narrow the tmux secret keep-list from swarm-wide (BL-1049) to per-window `-e` passthrough, so a vibe documenter pane holds MISTRAL_API_KEY while the claude panes on the same server do not. Follows ancillary_provider_fill_tmux_env's existing precedent. Split out of BL-1049 to keep that slice small; asserted nowhere in BL-1049's feature file."
  - "build_freshness_cli.bb's restart-operator-group! spawns the replacement runtime with a direct `bb operator_runtime.bb` call instead of start_operator_runtime.sh, which operator_runtime_supervisor.bb's own header documents as the only correct entry point. The direct spawn skips that script's prior-runtime cleanup, its append-mode log redirect, and its SWARMFORGE_SKIP_OPERATOR gate - so a sync starts an operator runtime even when the operator is deliberately skipped. Routing through the wrapper would also subsume BL-1225's log half, but it carries a behaviour question (what should a sync do when the operator is skipped, given restart-operator-group!'s settle-wait would then throw?) that neither BL-1224 nor BL-1225 should answer. Found by the specifier while splitting the 2026-08-28 double-restart intake; left unticketed to keep both slices to one sitting."

source: "Human hygiene 2026-07-19: every ticket must have an epic; every epic must have a milestone. Tracker created during open-backlog cleanup."

