approval_context: >
  Operator-session, 2026-07-26 00:45-02:20, live forensics after the BL-654
  expedition's restart half failed and two night-start attempts failed
  identically. The swarm was ultimately brought up by MANUAL session assembly,
  which is how it is running tonight. This ticket carries the full evidence
  trail so the fix does not restart the investigation from zero.

  Hydrate batch 2026-07-28: materializes the already-approved prose acceptance
  into APS Gherkin, unchanged in substance.

source: |
  ## The failure signature (3 occurrences, byte-identical)

  ```
  inner ./swarm: "SwarmForge is ready", both sessions listed
  t+2s   swarmforge-coder + swarmforge-coordinator EXIST
  t+3s   ALL sessions gone; tmux SERVER process gone; socket file remains
  outer: "ERROR: swarm did not become ready (wanted 2 sessions)"
  ```

  Occurrences: the expedition's EXPEDITE_START_CMD restart (~00:45), two
  night-start.sh runs (00:54, 01:06), plus two instrumented inner-only
  launches (01:52, 01:58). ALL descended from the operator harness shell.

  ## What was ELIMINATED, with the experiment that eliminated it

  1. Provider outage — `claude -p "say OK"` returned OK mid-failure.
  2. Launch scripts broken — `zsh .swarmforge/launch/coordinator.sh` and
     `coder.sh` run >12s fine from a plain shell.
  3. Orphan reaper — runtime.log shows `reaped 0` throughout.
  4. Stale-daemon nudge race — a verified-zero-process stop (night-stop, "OK
     zero survivors") was followed by an identical failure. (A REAL secondary
     find though: handoffd's startup nudge text was captured typed into a
     BARE pane pre-respawn — "You: command not found" — see note below.)
  5. Ephemeral-caller-kills-server (BL-372 redux) — a witness server
     (`setsid bash -c 'tmux -S w.sock -vv new-session -d "sleep 300"'`,
     parent exits instantly) SURVIVES on this box.
  6. respawn-pane itself — a MANUAL new-session + respawn-pane -k with the
     same launch script boots claude fine (frozen with remain-on-exit:
     Claude Code v2.1.220, Sonnet xhigh, RESUME-ON-START, working spinner).

  ## What is measured but not yet explained

  - The 00:00 CRON night-start (clean cron env) worked and its swarm ran for
    ~45 min. The 21:36 interactive start also worked. Everything after the
    expedition, launched from harness-descended shells, fails.
  - Harness descent leaks env: manual sessions inherited
    CLAUDE_CODE_CHILD_SESSION (claude booted with "Transcript saving is off").
    Scrubbed via tmux set-environment -u + respawn for tonight's manual
    assembly. Whether this marker (or another inherited var) interacts with
    launch_role's respawn-time `-e provider_env_flags` to kill the panes is
    THE open question — claude with the marker boots fine in the manual
    repro, so the interaction, if real, is launcher-path-specific.

  ## Reproduction kit for the coder

  - Failing: `setsid nohup env SWARMFORGE_TERMINAL=none ./swarm . --pack
    mono-router` from a claude-session shell; watch sessions at 1s cadence.
  - Working control: same from cron (or a clean login env).
  - Instrument: pre-create the REAL socket's server with `tmux -vv` AFTER
    the launcher's stop_existing pass, so the server's own death reason is
    logged; or add remain-on-exit before launch_role's respawn.

description: |
  ## Why severity high

  This breaks every unattended restart that is not cron-clean: the
  Expeditor's restart half (measured: BL-654's ride ended restart-ok? false),
  operator-session recoveries, and any future tooling that relaunches from a
  supervised shell. Tonight's swarm runs on HAND-ASSEMBLED sessions — works,
  but transcripts-off nearly shipped as a side effect, and no operator should
  need 90 minutes of forensics to restart a healthy swarm.

  ## Shape

  1. Root-cause with the reproduction kit — the fix is likely either an env
     scrub at session/server creation (tmux start-server with a sanitized
     environment; unset CLAUDE_CODE_* and harness markers) or a correction
     to what launch_role passes via `-e`.
  2. start-swarm.sh gains the diagnosis it lacked tonight: when
     wait_for_ready fails, capture the dead server's last state (remain-on-
     exit on a canary pane, tmux server -vv log path) instead of the bare
     "did not become ready".
  3. The BL-372 detach check clearly passes while the server still dies —
     extend it or its wording so "detached" is not read as "will survive".

acceptance: specs/features/BL-657-launcher-tmux-server-dies-seconds-after-launch.feature

out_of_scope: |
  - The handoffd startup-nudge racing into a pre-respawn BARE pane (typed
    "You have new handoff mail" into a shell prompt, "command not found").
    Real, observed, harmless tonight — but it is a separate ordering defect
    (nudges should target only respawned/claude panes); file or fold as the
    specifier judges, do not silently widen this parcel.
  - Rewriting the launcher's architecture. Find the killer first.

notes: |
  Written at 02:20 after the swarm was brought up by hand: two sessions
  created manually on an operator-owned server, env scrubbed, daemons via
  their own scripts, pid-hold re-armed (BL-647 still pending), babysitterd
  up. The night run continues on that assembly — treat tonight's transcripts
  accordingly. The investigation trail (witness server, frozen panes,
  second-by-second session watches) is in the operator session of
  2026-07-26; the reproduction kit above is its distillation.
