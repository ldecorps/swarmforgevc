id: BL-1285
title: "test_front_desk_supervisor_liveness.sh decides its stall checks by racing a fixed wall-clock cushion, so a loaded host turns three acceptance features intermittently red"
milestone: M8
type: defect
severity: medium
# medium: real but contained. The fixture is CORRECT about the behaviour it
# gates - on an idle host it is 14/14 green - and nothing is lost or corrupted.
# What it costs is trust: three acceptance features go red with it under load,
# and the reds move around, so the honest reading of a failure is "probably the
# flake" - which is how a real regression in the front desk's stall detection
# would get waved through. Not high: no gate is dead and no lane is blind (the
# checks still run and still fail loudly when the supervisor is broken); not
# low: it is not cosmetic, it fires inside the swarm's own delivery machinery.
