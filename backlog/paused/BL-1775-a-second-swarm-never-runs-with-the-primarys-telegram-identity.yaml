  backlog/INTAKE-second-swarm-telegram-line-to-the-human-20260926.md,
  item 1 (operator via Claude Code, commits a5cb9d29fb and 85e42786db).
  The human, verbatim (Article 5.3): "gbh swarm needs me but it's not
  surfacing anything on telegram. Onboarding should at a minimum create a
  topic for the coordinator to use" and "can you fix the onboarding
  process to not do the same mistake next time?"
  Intake item 1, verbatim: "Wanted: a non-primary swarm's launch scripts
  export its own fleet creds AFTER the shell profile is sourced, or env
  senders resolve through `fleet_telegram_creds_lib` the way the front
  desk does."
  Parents: BL-380, BL-436, BL-622, BL-1049.

notes: |
  Minted 2026-09-26 by the specifier (claude-opus-5-5 seat). 1:N split of
  the intake: see BL-1774's notes for the whole map.
  The intake offered two fixes; the launch boundary was chosen at spec
  time because it is two call sites against 20 readers, and it also
  covers readers added later. It is direction, not a ruling.
  Checked at mint: swarmforge.sh and the role launch scripts are zsh
  (shebangs), and the tmux scrub already removes the token from the
  server, so the pane gets it from ~/.zshenv, not from tmux.
  AUTO-APPROVED under the 2026-09-17 operator hotfix (severity defect, no ruling_options) — see auto-approve-high-severity-defects-amendment-20260917.md.
  Expedite lane by severity (Article 3.2.4).

  INVEST: Independent (no open ticket edits the launch template's env or
  the creds lib), Negotiable (resolver shape is direction), Valuable (a
  second swarm cannot post as or poll the primary), Estimable (one CLI
  over an existing lib, two call sites), Small, Testable (zsh under a
  fixture HOME).
