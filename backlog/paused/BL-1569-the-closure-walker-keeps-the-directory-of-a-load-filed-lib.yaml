qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `bb swarmforge/scripts/bb_load_closure_cli.bb swarmforge/scripts swarm_handoff.bb | tr ' ' '\n' | grep suite_inventory`
     prints exactly `test/suite_inventory_lib.bb`; the same for
     `node -e "const {computeClosure}=require('./specs/pipeline/steps/lib/operatorRuntimeBbClosure.js');console.log([...computeClosure('swarmforge/scripts','swarm_handoff.bb')].filter(n=>/suite_inventory/.test(n)))"`.
  2. `bb swarmforge/scripts/test/bb_load_closure_agreement_test_runner.bb`
     and `bb swarmforge/scripts/test/bl973_closure_guard_property_runner.bb`
     exit 0.
  3. `d=$(mktemp -d); source swarmforge/scripts/test/lib/bb_closure_copy.sh; copy_bb_closure swarmforge/scripts "$d" swarm_handoff.bb; ls "$d/test/suite_inventory_lib.bb"`
     exists, and `bb -e "(load-file \"$d/unregistered_test_gate_lib.bb\")"` exits 0.
  4. `bash swarmforge/scripts/test/test_operator_runtime_hotfix_certification_sweep.sh`
     three times -> `ALL CHECKS PASSED`; its fixture log carries
     `hotfix-certification-nudge 0000000001` and no `-nudge-error`.
  5. Break-then-restore: in a scratch scripts dir, make `a.bb` load-file
     `"missing" "b.bb"` with no such file; `copy_bb_closure` exits non-zero
     naming `missing/b.bb`. Restore nothing (scratch).
  6. All 17 shell tests sourcing `operator_runtime_sandbox.sh` still exit
     as they did on main apart from this one (BL-1570 and BL-1571 own the
     other three reds); the row for this file is gone from
     `backlog/standing-reds.tsv`.
