description: |
  ## What is wrong

  `swarmforge/scripts/test/test_operator_runtime_hotfix_certification_sweep.sh`
  (BL-848, lane shell, `standing`) fails on `main` 674d50539a:

  ```
  FAIL - 01: the pre-seeded pending entry (no stamp ticket) triggered a coordinator nudge
  ```

  The fixture's `runtime.log` has the reason the check greps past:

  ```
  hotfix-certification-nudge-error 0000000001 ----- Error ---
  Type:     java.io.FileNotFoundException
  Message:  <fixture>/swarmforge/scripts/test/suite_inventory_lib.bb (No such file or directory)
  Location: <fixture>/swarmforge/scripts/unregistered_test_gate_lib.bb:51:1
  ```

  The sandbox is built by `lib/operator_runtime_sandbox.sh` ->
  `copy_bb_closure`, which derives the copy list from
  `bb_load_closure_cli.bb` (BL-973). `swarm_handoff.bb` load-files
  `unregistered_test_gate_lib.bb` (31ffc314a0, 2026-08-31), whose line 51
  is the codebase's only multi-segment load-file:

  ```
  (load-file (str (fs/path (fs/parent (fs/canonicalize *file*)) "test" "suite_inventory_lib.bb")))
  ```

  Both walkers - `bb_load_closure_lib.bb`'s
  `#"(?s)\(load-file\b.*?\"([^\"]+\.bb)\""` and the JS twin
  `operatorRuntimeBbClosure.js`'s `/\(load-file\b[\s\S]*?"([^"]+\.bb)"/g` -
  capture the last string only and report the bare `suite_inventory_lib.bb`
  (verified: `bb bb_load_closure_cli.bb swarmforge/scripts swarm_handoff.bb`
  and `computeClosure('swarmforge/scripts','swarm_handoff.bb')` both list
  it, 45 entries). `copy_bb_closure` then does
  `[[ -f "$src/$dep" ]] && cp "$src/$dep" "$dest/"` - the file lives under
  `$src/test/`, so it is skipped without a word. The BL-897 agreement
  runner passes because both twins agree on the wrong answer. Red since
  2026-08-31 and unseen for 14 days because nothing runs the standing
  shell suite (BL-1526's gap).

  Blast radius today: 28 shell tests source `copy_bb_closure`; only this
  one both copies `swarm_handoff.bb` and exercises a send inside the tick
  (the sibling `babysitterd-watchdog-nudge-error` in the same fixture log
  is the same cause but not asserted). `operator_runtime.bb`'s own closure
  does not reach the gate lib, so the 15 JS handlers copying
  `OPERATOR_RUNTIME_BB_FILES` by name see no subpath today.

  ## What is wanted

  Both walkers report a multi-segment load-file as the directory-qualified
  relative path (`test/suite_inventory_lib.bb`) and keep reporting
  single-segment ones as bare names; the closure of `swarm_handoff.bb`
  names `unregistered_test_gate_lib.bb` and `test/suite_inventory_lib.bb`
  and no bare `suite_inventory_lib.bb`. `copy_bb_closure` places each
  member at the same relative path under the destination (creating the
  directory) and exits non-zero naming the path when a member is absent
  under the source. The agreement runner pins the multi-segment case.
  `test_operator_runtime_hotfix_certification_sweep.sh` prints
  `ALL CHECKS PASSED` on `main` and the register row this ticket adds is
  removed in the same land.

  ## How (direction, not mandate)

  - Capture the whole `(fs/path (fs/parent (fs/canonicalize *file*)) ...)`
    argument list and join every string literal after the parent with `/`;
    one segment yields today's bare name, so no existing consumer output
    changes. Mirror the same in the JS twin; add the multi-segment fixture
    to `bb_load_closure_agreement_test_runner.bb` and to bl973's property
    runner's DAG generator so a future divergence fails there.
  - In `copy_bb_closure`, `mkdir -p "$dest/$(dirname "$dep")"` before the
    copy, and replace the `[[ -f ]] &&` guard with a loud failure.
  - JS handlers that copy `OPERATOR_RUNTIME_BB_FILES` by name are NOT
    switched in this parcel: their list carries no subpath today and a
    future one fails closed (`copyFileSync` throws ENOENT on a missing
    directory). Record that census in the evidence, not as scope.
  - Step handler `specs/pipeline/steps/bl1569ClosureKeepsDirectorySteps.js`
    drives both CLIs, `copy_bb_closure` into a mkdtemp dest, and the real
    shell test as a subprocess; it lands in the same commit as the feature
    (BL-233).

  ## Not in scope

  - `unregistered_test_gate_lib.bb`, `swarm_handoff.bb`, `operator_runtime.bb`
    and `hotfix_certification_lib.bb` are not touched.
  - The 15 JS handlers copying the operator_runtime closure by name.

