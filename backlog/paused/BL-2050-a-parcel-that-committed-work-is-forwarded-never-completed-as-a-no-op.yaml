description: |
  ## What is wrong

  On 2026-10-06 the coder seat (iq3) received two QA bounces and finished
  both: BL-1843 (QA's 003871, fix `2132eec663`) and BL-2033 (QA's
  003875, fix `e0a36d534b`, then `557fa56a98`). For each it rewrote the
  root `HANDOFF.md`, committed it ("BL-2033: handoff for the QA D1
  remediation By coder."), and ran `done_with_current.sh --no-op` with a
  reason describing the work, recorded on the completed file:

      no_op_reason: BL-2033 QA D1 remediation complete: minted feature
      restored, handler bound, 3/3 rows pass, shell test 9 PASS, npm test
      654/11206; branch swarmforge-coder-rebuild, commit 557fa56a98;
      handoff written

  Nothing was queued. The fixes survived only on a side branch and in a
  `refs/swarmforge/parcel-backup/coder/` ref, and the coordinator found
  them hours later (note 017111). Two things let it happen:

  - BL-1609's forward gate (`forward-gate!` in
    `done_with_current_task.bb`, deciding through
    `forward-evidence-lib/forward-completion-decision`) completes any
    forwarding parcel given a non-blank reason. Its refusal reads "Send
    the forward, or run: done_with_current.sh --no-op \"<reason>\"",
    which offers the bypass to a seat that has the work in hand.
  - `HANDOFF.md` at the repository root is a manual handoff note from
    2026-06-29 (milestone 1, before the mailbox existed). It is the only
    file named for handing off, and both incidents rewrote it.

  ## What is wanted

  1. `forward-completion-decision` takes one more key, `committed?`: a
     commit whose subject's leading ticket id is the parcel's ticket was
     made on HEAD since `inbound-window-start` and is not on main or
     origin/main. That is what `git-log-names-ticket-since?` in
     `done_with_current_task.bb` already answers for BL-1422's Work-note gate. Return a new
     `:refuse-committed` when the inbound is forwarding, the role is not
     master-resident and not the QA stage, no forward is evidenced,
     `committed?` holds, and a reason is given or not. Every other input
     decides exactly as today, and a caller that passes no `committed?`
     key gets today's answers (the batch path's call).
  2. The task path's `forward-gate!` passes `committed?` and, on
     `:refuse-committed`, fails with
     `NOT_A_NO_OP: <ticket> has commit <sha> since this parcel was queued`
     and the next line `Send a git_handoff for <ticket> naming <sha>.`,
     where `<sha>` is the newest such commit (10 hex). That message never
     mentions `--no-op`. Nothing moves on a refusal.
  3. The documenter moves `HANDOFF.md` to
     `docs/deprecated/HANDOFF-milestone-1.md` and lists it on
     `docs/deprecated/README.md` and the "Deprecated pages" line of
     `docs/index.md`; and `swarmforge/handoff-protocol.md`'s BL-1609
     section (the `--no-op` paragraphs near lines 277 and 3279) says a
     role other than QA that has committed for the ticket gets
     `NOT_A_NO_OP`, not the reason path.

  The step handler `specs/pipeline/steps/bl2050CommittedParcelNotANoOpSteps.js`
  reuses the fixture shape of
  `bl1609ForwardingParcelNotCompletedWithNothingSentSteps.js` (a real git
  worktree per role under mkdtemp, the real `done_with_current_task.bb`):
  copy the helpers it needs, do not import across handler files. The
  commit is an empty commit whose subject is `BL-4242: fix`, made after
  the parcel's `created_at`. Validate `<role>`, `<commits>` and
  `<outcome>` against explicit KNOWN_VALUES tables. Register with
  `registry.defineScoped(re, fn, FEATURE)`.

  ## Not in scope

  - Salvaging BL-2033's or BL-1843's fix: the coordinator routed BL-2033's
    (note to the coder naming `e0a36d534b`), and BL-1843 is pulled for a
    split (coordinator note 017116).
  - Why the seat built on a side branch (`swarmforge-coder-rebuild`): the
    gate reads HEAD, so it refuses there too.
  - The batch path (`done_with_current_batch.bb`): a batch seat is
    merge-only (Article 2.4).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2050-a-parcel-that-committed-work-is-forwarded-never-completed-as-a-no-op.feature`:
     4 ok (01 x3, 02), 0 fail.
  2. `node specs/pipeline/cli.js specs/features/BL-1609-a-forwarding-parcel-is-not-completed-with-nothing-sent.feature`
     and the same for BL-1642 and BL-1645: each all ok. These are BL-1609's
     gate's own contracts, so this parcel must leave them green.
  3. `bb swarmforge/scripts/test/forward_evidence_lib_test_runner.bb` and
     `bb swarmforge/scripts/test/bl1609_forward_gate_property_runner.bb`:
     both exit 0.
  4. On the parcel commit: `test ! -e HANDOFF.md`, and
     `grep -c HANDOFF-milestone-1 docs/index.md docs/deprecated/README.md`
     prints a non-zero count for each.

