  swarmforge/scripts/property_suite_standing_allowlist.tsv —
  bl874PortableTimeInvariants and tempDirTrapGuard — neither of which has
  anything to do with the board freeze. Both are labelled "pre-existing;
  tracked under BL-1175". Allowlisting a red silences it, so scenario 06
  checks the attribution rather than taking it on trust. If you would rather
  the allowlist rows were split out and decided separately, say so and I will
  peel them into their own ticket.

