description: >
  WHAT. Operator/Cursor hotfix 2b67f4b1a2 is live on main with the trailer
  Hotfix-Certification: pending. Subject: "Freeze the Telegram pipeline board
  while the pack is asleep."

  Landed behaviour under review (do not redesign).
  extension/src/concierge/conciergeTick.ts gains an optional
  isPipelineBoardAwake adapter and an exported pure gate
  pipelineBoardShouldRefresh(awake) returning `awake ?? true`. While awake,
  runConciergeTick calls syncBoardIfWired then syncBoardPinIfWired exactly as
  before. While asleep it calls NEITHER: the board sync result is
  short-circuited to the previous state and the pin step is skipped entirely,
  so the last posted board and its pin are left untouched. The concierge tick
  itself keeps running — Approvals, role asks and the rest of the phone path
  are deliberately unaffected. extension/src/tools/telegram-front-desk-bot.ts
  supplies the adapter as isSwarmLive(probeSwarmLiveness(targetPath)).

  The same commit also adds two rows to
  swarmforge/scripts/property_suite_standing_allowlist.tsv
  (bl874PortableTimeInvariants, tempDirTrapGuard), both attributed to BL-1175.

  WHY. finish-shift puts the seats to bed but leaves the front desk up, so the
  concierge tick kept recomputing and reposting the pipeline board all night
  against a pack with no live roles. Separately: an unticketed hotfix never
  becomes an official swarm deal on green tests alone (BL-848).

  HOW (direction, not mandate). Walk the acceptance feature against the landed
  sources at 2b67f4b1a2. Open a narrow follow-up only if review finds a
  defect; do not rewrite the concierge tick in this parcel.

constraints: >
  Out of scope / firm lines:

  - Do NOT reimplement, rewrite or revert the hotfix. This parcel confirms or
    refutes what landed.
  - Do NOT write certified or waived into backlog/hotfix-ledger.yaml. Only a
    recorded human decision does that, however green the suite is (BL-848).
  - Do NOT redesign the liveness probe, finish-shift, or the board renderer.
    If review finds a design defect in any of them, that is a narrow follow-up
    ticket, not this parcel.
  - Do NOT remove or re-attribute the two property-allowlist rows the commit
    added. Scenario 06 REPORTS on their attribution; acting on what it finds
    is the human's call (see approval_context).

qa_e2e_procedure: >
  (1) At commit 2b67f4b1a2, confirm conciergeTick.ts exports
  pipelineBoardShouldRefresh and that it returns true for undefined.
  (2) Confirm that on the asleep path runConciergeTick calls neither
  syncBoardIfWired nor syncBoardPinIfWired, and that the returned pipelineBoard
  is the previous state object.
  (3) Confirm telegram-front-desk-bot.ts wires isPipelineBoardAwake to
  isSwarmLive(probeSwarmLiveness(targetPath)).
  (4) Run the extension unit tests covering conciergeTick.test.js and confirm
  the freeze, resume, pin-skip and legacy-default cases the commit added are
  present and green.
  (5) Confirm both property_suite_standing_allowlist.tsv rows the commit added
  name a tracking ticket, and record in the evidence file whether BL-1175
  actually covers tempDirTrapGuard — report only, change nothing.
  (6) Leave Hotfix-Certification pending until the human ledger decision.

