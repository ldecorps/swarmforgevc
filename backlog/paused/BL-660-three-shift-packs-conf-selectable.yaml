id: BL-660
title: "Les 3×8 — three named shift packs (day 09-17, evening 17-01, night 01-09), ONE activated in conf, and every schedule-derived clock (cron start/stop, BL-617 window, closing ceremony, briefing) follows the shift"
milestone: M8
type: feature
status: todo
