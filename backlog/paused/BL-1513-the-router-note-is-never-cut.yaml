id: BL-1513
title: "route_backlog_to_coder.sh composes its Work note from the ticket file's basename and cuts it to the 80-char message limit, so 52 of 107 live tickets reach their first role with the instruction's tail gone (BL-1494 arrived as `read file in backlo` at 07:51Z on 2026-09-10, was completed unworked at 07:55Z and re-routed by hand at 08:21Z); the note names the ticket id and its path, fits for every id, and a message that cannot fit is refused whole, never sent cut"
milestone: M8
type: defect
severity: medium
# medium: real but contained. The ticket id at the head of the note survives
# every live case (the slug is cut only past 75 characters, the id never),
# both parsers that read the note (dispatch trail, BL-1422 completion guard)
# match verb-plus-id and still see a dispatch, and the coordinator recovered
# by hand in one round trip. The cost is the instruction: the only active
# ticket at cap 1 sat unworked for thirty minutes. No safety signal is
# broken and no data is lost.
