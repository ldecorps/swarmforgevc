notes: |
  Minted 2026-09-10 by the specifier on the coordinator's note, the same
  pass. Grepped first: no open ticket names the router's message or its
  truncation (backlog/paused, backlog/active); BL-1097, BL-1223, BL-1415 and
  BL-1422 are the router's landed neighbours and none touched the
  composition.

  Census (BL-1445): `for f in backlog/paused/*.yaml backlog/active/*.yaml; do
  b=$(basename "$f" .yaml); echo ${#b}; done | awk '$1>46{c++} END{print c, NR}'`
  gives `52 107` on 2026-09-10; over 75 (slug itself cut): BL-1498 (82),
  BL-1499 (86). Re-run it rather than re-derive it.

  This ticket's own file name is deliberately short (36 characters) so its
  own dispatch note fits under the unfixed router.

  IR-DRY (2026-09-10): one residual finding, the outline's parameterized
  Given reused concretely (`slug of 90 characters`) in scenario 02 - one
  step handler serves both, by design; the four Given/When and synonym
  findings were resolved by sharing one `routes the ticket` action step.
