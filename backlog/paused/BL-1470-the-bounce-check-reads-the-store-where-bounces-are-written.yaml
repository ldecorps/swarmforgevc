notes: |
  Minted 2026-09-07 by the specifier on QA's urgent note, the same pass.
  The QA prompt's interim bounce-store hand check, retired at 16:49 local
  on BL-1466's landing note, is restored with this mint pointing at the
  MASTER checkout's store and at passing the master root as the CLI's
  third argument, which makes BL-1466's check fire today.

  Root cause of the spec miss, recorded so the class is greppable: BL-1466
  named the bounce READER precedent (chase_sweep_lib.bb) and not the store
  ROOT precedent (is_qa_ancestor.sh, BL-1339); a store path that a worktree
  role resolves from its own root is dark in production and green in a
  one-root fixture. Same shape as BL-1462's handler reading the live
  checkout, from the other side.

  Grepped first: no open ticket names bounces-dir, the shared target root
  for the bounce store, or BL-1339's option 3.
