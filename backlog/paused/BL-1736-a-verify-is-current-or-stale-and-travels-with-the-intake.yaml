description: |
  ## What is wanted

  - Each draft carries a revision. A Verify result records the revision it
    reviewed, and any edit after it marks the result stale in the form.
    Its suggestions stay visible, marked as possibly out of date.
  - One Verify per draft at a time. A second press while one runs starts
    nothing, and the form says a Verify is already running.
  - Submit writes a "Verify history" section into the INTAKE file. It
    lists each suggestion, its source (host check or specifier session)
    and its outcome: accepted, rejected or left open. Then the draining
    specifier knows what was already reviewed (answer 6: Verify is
    optional, and the specifier still applies INVEST at drain).

  ## Scope

  - The drafts store (revision), the verify module (run lock), the intake
    writer (history section).
  - `specs/features/BL-1736-...feature` + the pinned handler.
constraints: >
  The run lock is per draft and released on every exit path of a Verify,
  including a failed or timed-out session run.

out_of_scope: |
  - Ask specifier and its transcript: BL-1737.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1736-a-verify-is-current-or-stale-and-travels-with-the-intake.feature`:
     all ok (3 of 3).
  2. Live: verify a draft, edit a scenario, and see the result marked
     stale. Press Verify twice quickly: the second press says a Verify is
     running.
  3. Submit a draft with one accepted and one rejected suggestion.
     Put "QA e2e test - retire on drain" in the notes field; the specifier
     archives that intake without minting.
     The INTAKE file's Verify history lists both, with their outcomes.
  4. `git diff main...HEAD --name-only` names only the Scope files, the
     feature, the handler, docs and evidence.

