description: |
  ## What is wrong

  `specs/features/BL-1495-a-b-ai-gateway-seat-launches-respawns-and-authenticates.feature`
  (lane acceptance) fails on `main` 228a4b6b3d, all 7 scenario runs:

  ```
  not ok 1 - the launch gate resolves the pack's seats [1]
    error: Scenario "..." failed at step "Given a steward registry fixture
    where tencentcloud2/glm-5.3-flash is certified for every pipeline role
    and anthropic/claude-fable-5-1 is certified for the specifier":
    mkSocketFixtureRoot is not defined
  ...
  # pass 0
  # fail 7
  ```

  Every scenario shares that Background step; it calls `buildStateDir()`,
  whose first line is `mkSocketFixtureRoot('bl1495-staffing-state-')`
  (line 82). The file has no `require('./lib/socketFixtureRoot')`; its
  requires are `node:assert/strict`, `node:fs`, `node:os`, `node:path`
  and `node:child_process` (lines 12-16). Two more calls sit at lines 116
  and 224.

  BL-1410's 046a7d9b84 (2026-09-09 02:02) migrated ten handlers from a
  local `mkTmpDir` to the steps-lane helper. Nine of them gained the
  require in the same diff; bl1495's hunk deleted `mkTmpDir` and rewrote
  the three calls but added no import (`git show 046a7d9b84 --
  specs/pipeline/steps/bl1495BaiGatewaySeatSteps.js`). f1c26a1cd5 (blank
  lines) is the only later touch. BL-1410's own scenario 01 pinned four
  features (BL-551, BL-565, BL-664, BL-771) as its migration census, none
  of the ten it migrated, so its gate never ran the BL-1495 feature - the
  BL-1445 shape, a population pin that misses the population.

  Red since 046a7d9b84 landed; first seen 2026-09-15 by the coder on the
  BL-1486 parcel (`# fail 7` with and without the staffing hatch, evidence
  `backlog/evidence/BL-1486-coder-20260915.md` on the coder branch, note
  03:27Z), which withheld its forward to the cleaner on it. Specifier
  reproduction the same pass: injecting only
  `global.mkSocketFixtureRoot = require(...).mkSocketFixtureRoot` ahead of
  the steps index turns the feature `# pass 7 / # fail 0` in 6.1 s, so the
  missing require is the whole defect.

  ## What is wanted

  `bl1495BaiGatewaySeatSteps.js` requires `mkSocketFixtureRoot` from
  `./lib/socketFixtureRoot` like its ten migration siblings; the BL-1495
  feature passes 7/7 under `specs/pipeline/scripts/run_acceptance.sh` on
  `main`; the acceptance lane's census of handlers calling the helper has
  no member without the require. The register row this ticket adds is
  removed in the same land.

  ## How (direction, not mandate)

  - Add `const { mkSocketFixtureRoot } = require('./lib/socketFixtureRoot');`
    beside the existing requires (the shape at
    `bl802BabysitterdMacosPortabilitySteps.js:15`). The helper installs
    its own exit hook, so the now-empty `fixtureRoots` array and its
    `process.on('exit')` sweep (lines 39-44) are dead; dropping them is
    fine in this parcel but not required.
  - Step handler `specs/pipeline/steps/bl1575BaiGatewayHandlerImportsHelperSteps.js`
    (auto-loaded from the steps directory; export `registerSteps`, BL-233):
    scenario 01 reads the bl1495 file; scenario 02 spawns
    `run_acceptance.sh` on the BL-1495 feature into a scratch outDir and
    reads its TAP summary (6 s measured; the whole feature is well inside
    the BL-1358 300 s per-mutant ceiling, BL-1541); scenario 03 derives
    the caller set with the census grep above and pins it (BL-1445).
    `bl1410StepHandlersTakeTheStepsLaneRootSteps.js:30` already runs a
    feature by ticket id the same way.

  ## Not in scope

  - The BL-1495 feature file and the seat, gate and launcher code it
    exercises are not touched.
  - BL-1410's four-feature Examples pin is not widened here; if the
    specifier wants the migration census gated it is a separate slice.
  - A lane-wide "no undefined identifier" lint (BL-1226's shape) is not
    built here.

