qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1495-a-b-ai-gateway-seat-launches-respawns-and-authenticates.feature ./tmp/bl1495-out`
     -> `# pass 7`, `# fail 0`, exit 0; three times.
  2. `grep -n "require('./lib/socketFixtureRoot')" specs/pipeline/steps/bl1495BaiGatewaySeatSteps.js`
     shows the import; `grep -l 'mkSocketFixtureRoot(' specs/pipeline/steps/*.js | xargs grep -L socketFixtureRoot`
     prints nothing.
  3. `specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1575-the-bai-gateway-handler-imports-the-fixture-root-helper-it-calls.feature ./tmp/bl1575-out`
     -> 3 pass, 0 fail.
  4. `git diff main...HEAD --name-only` names the bl1495 handler, the new
     handler, the feature, evidence and the register-row removal; nothing
     under swarmforge/scripts or extension/src.
  5. Break-then-restore: remove the require; step 1 fails 7/7 with the
     ReferenceError and BL-1575 scenarios 01-03 all fail; restore.
  6. Diff the parcel's merge into main against BOTH parents. The row for
     the BL-1495 feature is gone from `backlog/standing-reds.tsv`.
