qa_e2e_procedure: |
  On the parcel commit, from the repo root after `npm run compile` in
  `extension/`. Fixture root per BL-1390: `git init` under mkdtemp, prove
  it with `git rev-parse --git-common-dir` before anything else.
  1. `bb swarmforge/scripts/test/chase_sweep_test_runner.bb` - ALL PASS,
     including the respawn outline's four rows (busy and error skipped,
     launch script and rotation carried out) and the chase outline's
     three result shapes.
  2. `bb swarmforge/scripts/test/test_handoffd_chase_sweep_wiring.sh` (or
     its bb sibling) - ALL PASS: the live adapters in handoffd.bb return
     results the lib reads. `bash swarmforge/scripts/test/test_chase_departing_mid_parcel_gate.sh`
     - ALL PASS with case 08 in its PASS lines; the telemetry row it
     asserts carries `"poke":"rotate"`.
  3. Under `extension/`: `npx vitest run leanLedgerComposeStall
     closingCeremony` - ALL PASS; `respawn-skipped` is composed as a stall
     and not reported as unrecognised; a rotate-poked chase row composes
     no stall.
  4. `specs/pipeline/scripts/run_acceptance.sh` on this ticket's feature:
     13/13 (01 x4, 02, 03, 04 x3, 05 x3, 06).
  5. Live check, read-only: in the fixture, seed a chaser-telemetry file
     with one `respawn-skipped` row, one `"poke":"rotate"` chase row and
     one `"poke":"wake"` chase row inside a role window and run
     `node extension/out/tools/lean-ledger-record.js` for that ticket;
     the ledger gains one stall with `eventType: respawn-skipped` and
     exactly one chase stall.
  6. Break-then-restore: make the respawn adapter stub report busy and
     drop the caller's keying; scenario 01 fails on "no row of type
     respawn"; restore. Drop the composer's poke predicate; scenario 05
     row 1 fails on "0 stall events"; restore.
