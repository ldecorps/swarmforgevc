human_approval: pending
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: a chaser telemetry row of
  type respawn keeps its meaning "the adapter invoked a launch script or a
  rotation"; an attempt the adapter did not carry out is recorded as
  respawn-skipped with a reason, never as respawn and never dropped.
  FIRM: the chase ladder's decisions are untouched - only the telemetry
  written after the adapter returns changes. FIRM: ledger rows and packets
  already written are not rewritten; the evidence names the affected
  shifts. Minted by the specifier as the BL-820 outcome of the 2026-09-13
  ceremony pass (evidence
  backlog/evidence/closing-ceremony-2026-09-13-specifier.md).

invariants:
  - "A chaser telemetry row of type respawn exists only for a sweep in which the trigger-respawn adapter invoked a launch script or a rotation; every attempt the adapter declined or failed is recorded as respawn-skipped, never as respawn and never omitted."

description: |
  ## What is wrong

  `apply-inbox-item-action!` in `swarmforge/scripts/chase_sweep_lib.bb`
  (~line 468) handles the ladder's `"respawned"` action as
  `(do ((:trigger-respawn! adapters) role) ((:log-telemetry! adapters)
  {:type "respawn" ...}))` - the telemetry row is unconditional. The live
  adapter in `swarmforge/scripts/handoffd.bb` (~line 2104) has three
  outcomes and only two of them respawn: a busy shared resident logs
  `chase-respawn-skip-busy` and returns; a caught exception logs
  `chase-respawn-error` and returns; otherwise it rotates
  (`chase-rotate-to!`) or runs the launch script (`do-respawn!`). The
  adapter's return value carries nothing, and the caller does not look.

  Downstream, `extension/src/metrics/leanLedgerComposeStall.ts` folds every
  `respawn` row into a `stall` event (`CHASER_ATTENTION_SIGNAL_TYPES`),
  `computeStalls` in `extension/src/quality/closingCeremony.ts` sums them
  per role and eventType, and the BL-820 pass reads the result.

  Observed: `.swarmforge/lean/2026-09-12.jsonl` holds 12 QA `respawn`
  stalls (BL-1546, 15:28Z-16:0xZ) and 5 cleaner ones; every one coincides
  with a `chase-respawn-skip-busy` line in the daemon log and no
  `chase-respawn` line - QA was resident 14:18Z-16:16Z hand-landing
  BL-1546 and was never respawned. `2026-09-13.jsonl` holds one each for
  cleaner (00:14:09Z, BL-1460) and architect (02:05:48Z, BL-1482), both
  `chase-respawn-skip-busy` at the same second. The 2026-09-13 packet
  reports them as `respawn` stalls.

  ## What is wanted

  - The adapter reports what it did. `:trigger-respawn!` returns a value
    the caller can key on: carried out (launch script invoked, or the
    resident rotated to the role) versus not carried out, with the reason
    (`busy`, `error`).
  - `apply-inbox-item-action!` writes `{:type "respawn"}` only when the
    adapter carried the respawn out, and `{:type "respawn-skipped" :reason
    <busy|error>}` otherwise - same role, handoffId, count and provider
    fields as today, so the row is attributable to a ticket window exactly
    like a `respawn` row.
  - `respawn-skipped` joins `CHASER_ATTENTION_SIGNAL_TYPES` so the ledger
    composes it as a stall with `eventType: respawn-skipped` and BL-918's
    unrecognised-type report does not flag it. The packet's `stalls`
    already fold by eventType, so it appears there under its own name with
    no packet change.
  - `docs/reference/BL-819-ticket-lifecycle-ledger.md`'s attention-signal
    table gains the type and its meaning (documenter).

  ## How (direction, not mandate)

  - Mirror BL-1505's shape for chases: that slice made the chase row key
    on `wake-result->attempted?` rather than on the raw adapter return.
    Here a small map (`{:respawned? bool :reason kw}`) or a keyword from
    the adapter, read by the caller, is enough; keep `chase_sweep_lib.bb`
    agent-agnostic (BL-208) - the reason is a plain keyword, not a
    provider or pane detail.
  - `chase_sweep_test_runner.bb` already stubs `:trigger-respawn!`
    (`(log-call! "respawn" role)`); the stub returns the outcome each case
    needs. The composer and packet scenarios are Vitest over fixture
    JSONL, the same seams BL-918 and BL-923 used.

  ## Not in scope

  - Changing when the ladder decides to respawn, the busy predicate, or
    what a busy resident does with the attempt (BL-1416 owns the busy-pane
    contract).
  - Rewriting ledger rows or ceremony packets already on disk.
  - The wake-attribution log (BL-870), which already records the skipped
    half of WAKES; this ticket is the respawn rung's telemetry only.

