human_approval: approved
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: a chaser telemetry row of
  type respawn keeps its meaning "the adapter invoked a launch script or a
  rotation"; an attempt the adapter did not carry out is recorded as
  respawn-skipped with a reason, never as respawn and never dropped.
  FIRM: the chase ladder's decisions are untouched - only the telemetry
  written after the adapter returns changes. FIRM: ledger rows and packets
  already written are not rewritten; the evidence names the affected
  shifts. Minted by the specifier as the BL-820 outcome of the 2026-09-13
  ceremony pass (evidence
  backlog/evidence/closing-ceremony-2026-09-13-specifier.md).
  CONSOLIDATED 2026-09-21 by the specifier on the human's morning sweep
  directive: BL-1590 (a chase that rotates the resident is not a stall,
  approved 2026-09-16) is absorbed here - the same adapter, the same
  apply-inbox-item-action!, the same composer and the same docs page, one
  rung up the ladder. Its FIRM lines carry over unchanged: a chaser
  telemetry row of type chase keeps its type, so every reader that counts
  chases today (BL-098's chase-rate signal, BL-870's attribution,
  dashboards) is unchanged - the row gains a poke field naming wake or
  rotate; only the lean composition changes - a chase row naming a
  rotation composes no stall event, a row naming a wake, or a legacy row
  naming no poke, composes exactly the stall it composes today; the chase
  ladder's decisions, chaseTimeoutSeconds, the busy predicate and the
  quality-dial logic are untouched; ledger rows and packets already on
  disk are not rewritten. Both halves were approved separately by the
  human and nothing unapproved was added, so the approval stands (no
  re-pend, BL-1455).

invariants:
  - "A chaser telemetry row of type respawn exists only for a sweep in which the trigger-respawn adapter invoked a launch script or a rotation; every attempt the adapter declined or failed is recorded as respawn-skipped, never as respawn and never omitted."
  - "A chaser telemetry row of type chase whose poke names a rotation never composes a stall event; a chase row naming a wake, or naming no poke, composes exactly the stall event it composes today."

description: |
  ## What is wrong

  `apply-inbox-item-action!` in `swarmforge/scripts/chase_sweep_lib.bb`
  (~line 468) handles the ladder's `"respawned"` action as
  `(do ((:trigger-respawn! adapters) role) ((:log-telemetry! adapters)
  {:type "respawn" ...}))` - the telemetry row is unconditional. The live
  adapter in `swarmforge/scripts/handoffd.bb` (~line 2104) has three
  outcomes and only two of them respawn: a busy shared resident logs
  `chase-respawn-skip-busy` and returns; a caught exception logs
  `chase-respawn-error` and returns; otherwise it rotates
  (`chase-rotate-to!`) or runs the launch script (`do-respawn!`). The
  adapter's return value carries nothing, and the caller does not look.

  Downstream, `extension/src/metrics/leanLedgerComposeStall.ts` folds every
  `respawn` row into a `stall` event (`CHASER_ATTENTION_SIGNAL_TYPES`),
  `computeStalls` in `extension/src/quality/closingCeremony.ts` sums them
  per role and eventType, and the BL-820 pass reads the result.

  Observed: `.swarmforge/lean/2026-09-12.jsonl` holds 12 QA `respawn`
  stalls (BL-1546, 15:28Z-16:0xZ) and 5 cleaner ones; every one coincides
  with a `chase-respawn-skip-busy` line in the daemon log and no
  `chase-respawn` line - QA was resident 14:18Z-16:16Z hand-landing
  BL-1546 and was never respawned. `2026-09-13.jsonl` holds one each for
  cleaner (00:14:09Z, BL-1460) and architect (02:05:48Z, BL-1482), both
  `chase-respawn-skip-busy` at the same second. The 2026-09-13 packet
  reports them as `respawn` stalls.

  ## What is wanted

  - The adapter reports what it did. `:trigger-respawn!` returns a value
    the caller can key on: carried out (launch script invoked, or the
    resident rotated to the role) versus not carried out, with the reason
    (`busy`, `error`).
  - `apply-inbox-item-action!` writes `{:type "respawn"}` only when the
    adapter carried the respawn out, and `{:type "respawn-skipped" :reason
    <busy|error>}` otherwise - same role, handoffId, count and provider
    fields as today, so the row is attributable to a ticket window exactly
    like a `respawn` row.
  - `respawn-skipped` joins `CHASER_ATTENTION_SIGNAL_TYPES` so the ledger
    composes it as a stall with `eventType: respawn-skipped` and BL-918's
    unrecognised-type report does not flag it. The packet's `stalls`
    already fold by eventType, so it appears there under its own name with
    no packet change.
  - `docs/reference/BL-819-ticket-lifecycle-ledger.md`'s attention-signal
    table gains the type and its meaning (documenter).

  ## How (direction, not mandate)

  - Mirror BL-1505's shape for chases: that slice made the chase row key
    on `wake-result->attempted?` rather than on the raw adapter return.
    Here a small map (`{:respawned? bool :reason kw}`) or a keyword from
    the adapter, read by the caller, is enough; keep `chase_sweep_lib.bb`
    agent-agnostic (BL-208) - the reason is a plain keyword, not a
    provider or pane detail.
  - `chase_sweep_test_runner.bb` already stubs `:trigger-respawn!`
    (`(log-call! "respawn" role)`); the stub returns the outcome each case
    needs. The composer and packet scenarios are Vitest over fixture
    JSONL, the same seams BL-918 and BL-923 used.

  ## The chase rung (absorbed from BL-1590, 2026-09-21)

  ### What is wrong

  `apply-inbox-item-action!` (~line 463) handles the ladder's `"chased"`
  action by calling the `:send-wake-up!` adapter and, when
  `wake-result->attempted?` is true, writing `{:type "chase" :role
  :handoffId :count}`. The live adapter (`handoffd.bb` ~2075) is
  `chase-poke-and-notify!`, whose `chase-poke-plan` has three modes:
  `:skip`, `:wake` (inject wake text into a live pane) and `:rotate`
  (`chase-rotate-to!` respawns the mono-router resident AS the chased
  role). Both `:wake` and `:rotate` return `{:attempted true ...}`; the
  row cannot tell them apart and carries no field that would.

  Downstream, `leanLedgerComposeStall.ts` folds every row whose type is in
  `CHASER_ATTENTION_SIGNAL_TYPES` (`chase`, `nudge`, `dead-letter`,
  `respawn`) into a `stall` event inside the role's ticket window;
  `computeStalls` sums them, `primaryHypotheses` turns the largest into
  "N chase(s) in <role> this shift - chase pattern", and `noteStallCite`
  makes every stalled role a `raise` dial citing `stalls`.

  On a rotation-router pack the `:rotate` poke is not somebody having to
  intervene: it is how a dormant role's mail gets a seat at all whenever
  the forwarding seat did not rotate itself there (BL-1557's
  `handoff-forward` covers one recipient; a QA merge-up broadcast has
  five, a reverse hop copy and a coordinator note have none, and a
  resident busy on another parcel rotates only when it is done). The
  rotation itself is already an instrument of its own
  (`.swarmforge/telemetry/rotation-<month>.jsonl`, reason `rotate`,
  BL-594), so the stall fold counts one event twice under two names and
  charges the wait to the chased role's quality.

  ### Census (re-runnable)

  Shift window 2026-09-15T09:00Z..2026-09-16T08:00Z, both files under
  `.swarmforge/telemetry/`. Chase rows by role (`grep '"type":"chase"'
  chaser-2026-09.jsonl | <window> | grep -oE '"role":"[A-Za-z]+"' | sort
  | uniq -c`): cleaner 17, specifier 8, coder 7, QA 6, documenter 5,
  architect 4, hardender 3 = 50. Rotation rows with `"reason":"rotate"`
  in the same window: cleaner 13, architect 5, specifier 5, QA 4,
  hardender 4, documenter 3, coder 2, coordinator 1. Pairing each chase
  row with a rotation row whose `to` equals the chased role and whose
  `at` is within 2 s (a 12-line python join over the two files, recorded
  in the 2026-09-16 ceremony evidence): 26 of 50 - cleaner 8, specifier
  5, architect 4, QA 4, documenter 3, coder 2. Four of the shift's eleven
  cleaner chase events sat on QA merge-up broadcast notes and one on a
  hardender->cleaner reverse-hop copy, none on work the cleaner could
  have picked up faster. The daemon log pairs each with a `chase-rotate
  <role>` line at the same second. The packet's reading of it (2026-09-16):
  `stalls` cleaner chase 6, coder chase 4, QA nudge 3, architect chase 2,
  documenter chase 1, QA chase 1; hypothesis "6 chase(s) in cleaner this
  shift - chase pattern"; `qualityRecommendations` raise for architect,
  cleaner, coder, documenter and QA, each citing only `stalls`. The
  specifier dismissed it on 2026-09-13, 09-14, 09-15 and 09-16
  (`closing-ceremony-<date>-specifier.md`).

  ### What is wanted

  - `chase-poke-and-notify!` returns the mode it performed on its result
    map (`:mode :wake` or `:mode :rotate`) beside `:attempted`/`:landed`.
  - `apply-inbox-item-action!` writes that mode on the chase row as
    `:poke "wake"` / `:poke "rotate"`. A legacy boolean result (every
    existing fake adapter) writes the row exactly as today, no `poke`.
  - `leanLedgerComposeStall.ts`: a `chase` row whose `poke` is `rotate`
    composes no stall event; a row with `poke` `wake` or with no `poke`
    composes as today. `chase` stays in `CHASER_ATTENTION_SIGNAL_TYPES`
    and the unrecognised-type report stays empty.
  - `docs/reference/BL-819-ticket-lifecycle-ledger.md`'s attention-signal
    paragraph says which chase rows count and why (documenter) - the same
    edit that adds `respawn-skipped` to its table.

  ### How (direction, not mandate)

  - BL-1505 already made the wake adapter's result a map and
    `wake-result->attempted?` the only reader of its shape; add the mode
    there and a sibling reader, keep `chase_sweep_lib.bb` agent-agnostic
    (BL-208). `chase_sweep_test_runner.bb`'s `:send-wake-up!` stub returns
    the map each case needs. The composer and its unrecognised-type report
    are Vitest over fixture JSONL (the BL-918/BL-923 seams) - the same
    fixture the respawn-skipped scenarios use.
  - Scenario 06's case 08 lands in
    `swarmforge/scripts/test/test_chase_departing_mid_parcel_gate.sh`,
    whose cases 02 and 04 already drive a real chase rotate through
    handoffd.bb with a fake tmux and read the telemetry file; the handler
    runs that test and parses its PASS lines.

  ## Not in scope

  - Changing when the ladder decides to respawn or chase, the busy
    predicate, chaseTimeoutSeconds, or what a busy resident does with the
    attempt (BL-1416 owns the busy-pane contract).
  - Rewriting ledger rows or ceremony packets already on disk.
  - The wake-attribution log (BL-870), which already records the skipped
    half of WAKES; BL-098's circuit-breaker chase rate and the
    quality-dial arithmetic.

