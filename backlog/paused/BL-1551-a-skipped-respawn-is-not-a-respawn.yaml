id: BL-1551
title: "A skipped respawn is recorded as a respawn: chase_sweep_lib's apply-inbox-item-action! writes a respawn telemetry row right after calling trigger-respawn!, whatever the adapter did, and handoffd's adapter returns after chase-respawn-skip-busy (or chase-respawn-error) without touching a pane - so the lifecycle ledger and the closing-ceremony packet count respawns that never happened (QA x12 on 2026-09-12, cleaner and architect x1 on 2026-09-13, every one a skip-busy); a respawn row means a launch script or rotation was invoked, a skipped attempt is its own type"
