qa_e2e_procedure: |
  On the parcel commit, from the repo root after `npm run compile` in
  `extension/`. Fixture root per BL-1390: `git init` under mkdtemp, prove
  it with `git rev-parse --git-common-dir` before anything else.
  1. `bb swarmforge/scripts/test/chase_sweep_test_runner.bb` - ALL PASS,
     including the outline's four rows: busy and error skipped, launch
     script and rotation carried out.
  2. `bb swarmforge/scripts/test/test_handoffd_chase_sweep_wiring.sh` (or
     its bb sibling) - ALL PASS: the live adapter in handoffd.bb returns a
     result the lib reads.
  3. Under `extension/`: `npx vitest run leanLedgerComposeStall` and the
     closingCeremony packet test - ALL PASS; `respawn-skipped` is composed
     as a stall and not reported as unrecognised.
  4. `swarmforge/scripts/run_acceptance.sh` on this ticket's feature: 6/6
     (one outline x4, two scenarios).
  5. Live check, read-only: in the fixture, seed a chaser-telemetry file
     with one `respawn-skipped` row inside a role window and run
     `node extension/out/tools/lean-ledger-record.js` for that ticket;
     the ledger gains a stall with `eventType: respawn-skipped`.
  6. Break-then-restore: make the adapter stub report busy and drop the
     caller's keying; scenario 01 fails on "no row of type respawn";
     restore.
