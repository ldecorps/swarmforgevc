description: |
  ## Problem

  The swarm runs across several billed surfaces (Cursor subscription, Anthropic
  Claude plan, Qwen Token Plan, others). Today the human cannot see, in one
  place, how fast each plan is being consumed. BL-619 (done) projects weekly
  exhaustion from manually-transcribed usage anchors, but that is a local proxy,
  not a live plan read. BL-553 (paused) is a read-only availability check over
  existing cooldown/ledger state — it does not query provider billing APIs.

  The intake requests: "Can each agent provider used by the swarm query the
  usage for the api it is using so we can have a view on how fast the plan is
  being consumed."

  Before building the query mechanisms and UI, we need to know what each
  provider's API actually exposes. Some providers have programmatic usage
  endpoints; others may not. The feasibility matrix documents this.

  ## Wanted behavior (discovery only)

  For every provider pack currently configured or in use (check
  swarmforge/packs/*.conf and extension/src/ for provider integrations):

  1. Research whether the provider exposes a programmatic usage/billing API
     endpoint. Check official documentation, API references, and developer
     portals.

  2. For each provider with an API, document:
     - Endpoint URL(s)
     - Authentication mechanism (API key, OAuth, etc.)
     - Response shape (JSON schema or example)
     - What data is returned (remaining quota, consumed amount, rate, billing
       period, etc.)
     - Rate limits on the usage API itself
     - Any known limitations or caveats

  3. For providers without a programmatic API, document:
     - Whether a manual console/dashboard exists
     - Whether browser automation is feasible (out of scope for this slice,
       but note it for future work)
     - Whether local transcript burn (existing burnRate.ts) is the only
       available proxy

  4. Produce a feasibility matrix (table or structured document) listing each
     provider, the availability of a usage API, and a confidence level
     (high/medium/low) that a live query can be built.

  5. Recommend which providers should be prioritized for implementation based
     on API availability and swarm usage frequency.

  ## Non-goals

  - Implementing the actual query mechanisms (future slices)
  - Building the UI/view (future slices)
  - Auto-throttling or acting on the data (out of scope per intake)
  - Replacing BL-619's manual-anchor path (keep as fallback)
  - Billing/invoice scraping or browser automation

acceptance: specs/features/BL-1270-per-provider-usage-api-discovery.feature

invariants:
  - "Every provider pack in swarmforge/packs/*.conf is covered by the feasibility matrix — no provider is silently omitted."
  - "The feasibility matrix distinguishes between 'API exists and was verified' vs 'API exists per documentation but not tested' vs 'no API known' — never conflates documentation with feasibility."

out_of_scope: |
  - Implementing query mechanisms for any provider.
  - Building a UI/view (morning briefing, dashboard, or otherwise).
  - Wiring a consumer (BL-553 QuotaManager, briefing, etc.).
  - Auto-throttling or budget enforcement.

mutation_cost: low
notes: |
  Discovery slices are cheap and unblock implementation work. The feasibility
  matrix is the deliverable — a document under docs/reference/ that future
  slices consume. This slice has no code, no tests (beyond the document itself),
  and no wiring. It is purely research and documentation.

  Provider list to research: Anthropic/Claude (Anthropic API), Cursor (Admin
  API / Analytics API), Qwen/DashScope (Alibaba Cloud Model Studio), and any
  others in swarmforge/packs/*.conf. Check the packs to see what is actually
  in use — do not research providers the swarm does not use.

  The intake mentions BL-619's manual-anchor path should be kept as a fallback
  where no API exists. This slice documents which providers fall into that
  category.

  ---
  [2026-08-29] specifier: Anthropic leg pre-researched, so the discovery slice
  starts from evidence rather than a blank page. Labelled per invariant 2 as
  DOCUMENTED, NOT TESTED against this account - read from
  platform.claude.com/docs/en/manage-claude/usage-cost-api.md on 2026-08-29,
  not yet exercised with a real credential. Verifying it against this account
  is still this slice's job.

  Endpoints (raw HTTP only - the usage and cost reports are deliberately NOT
  in any Anthropic SDK, so there is no client-library shortcut):
    - GET https://api.anthropic.com/v1/organizations/usage_report/messages
      Token counts. bucket_width 1m | 1h | 1d; group_by[] model, workspace_id,
      api_key_id, service_tier, context_window, inference_geo, speed; the same
      dimensions work as filters. Paginated (has_more / next_page). Bucket
      caps: 1m -> 1440 max, 1h -> 168, 1d -> 31.
    - GET https://api.anthropic.com/v1/organizations/cost_report
      USD as decimal strings. DAILY granularity only. group_by[] workspace_id,
      description. Priority Tier cost is excluded here and has to be read from
      the usage endpoint instead.
    - GET https://api.anthropic.com/v1/organizations/rate_limits
      Reads CONFIGURED limits (this one IS in the SDKs). Pairs with the usage
      endpoint to express headroom rather than raw consumption.
  Auth: header x-api-key plus anthropic-version: 2023-06-01. Requires an Admin
  API key (sk-ant-admin01-...), an org:admin OAuth token, or a personal or
  service-account key that is NOT workspace-scoped. Workspace API keys are
  rejected, so the swarm's ordinary ANTHROPIC_API_KEY will not work here.
  Freshness ~5 minutes; sustained polling once per minute is supported.

  Four findings that change the matrix's shape rather than just fill a row:

  1. The answer to the human's question is PARTIAL, and honestly so. Neither
     endpoint returns plan-remaining or a quota percentage - both report what
     was CONSUMED. So "how fast the plan is being consumed" is directly
     answerable, and "how much is left" is NOT, without a plan allowance
     supplied from outside the API. That outside anchor already exists:
     BL-619's manual usage-anchor. The honest architecture is live consumption
     over a human-supplied allowance - which also gives acceptance direction 3
     ("never fake a %") real teeth, because a percentage is precisely the
     number no provider hands us.

  2. "The Admin API is unavailable for individual accounts", quoted verbatim
     from the doc. If this is an individual Console account rather than an
     organization, every endpoint above is unavailable and Anthropic is an
     honest `unsupported` row - not a defect, and not something a retry fixes.
     Establish the account type FIRST; it decides whether the rest of the
     Anthropic leg is reachable at all.

  3. Claude Enterprise (claude.ai) organizations do not use this API at all.
     They use the Claude Enterprise Analytics API with an Analytics API key,
     and carry no Admin API keys. Two products, two keys - the matrix needs
     both rows, not one Anthropic row.

  4. Closest match to how this swarm actually bills: the Claude Code Analytics
     API (platform.claude.com/docs/en/manage-claude/claude-code-analytics-api),
     which reports per-user estimated Claude Code cost. The swarm runs Claude
     Code seats, so that may be more representative than org-wide token
     totals. Worth a row of its own.

