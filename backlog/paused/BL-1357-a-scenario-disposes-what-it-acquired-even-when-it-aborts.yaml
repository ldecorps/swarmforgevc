  - "specs/pipeline/steps/index.js::bl1357::the new step handler must be registered - specs/pipeline/runtime.js THROWS on any scenario with no handler. Honest note per BL-1235: satisfied by this parcel's own diff, so it proves nothing about reachability; runScenario already has a live caller and there is no new call site to anchor. Kept because BL-233 requires the handler to land in the SAME commit as the feature file. Verified absent at spec time, grep bl1357 returns 0."

