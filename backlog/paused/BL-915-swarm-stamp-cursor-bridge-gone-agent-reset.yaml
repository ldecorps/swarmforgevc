description: |
  ## What already landed — do not rebuild it

  `ece61cbe63` added `isCursorAgentGone(message)` to
  `extension/src/tools/telegramCursorBridgeCore.ts` and folded it into
  `shouldResetCursorAgentSession`, joining the three faults already classified
  as session-reset (active-run conflict, auth error, connection failure).

  Before the hotfix, a stored `agentId` the Cursor cloud had deleted or expired
  made `Agent.resume` throw `"Agent agent-… not found."`, and the bridge
  surfaced that as a failed prompt. The operator's only remedy was to clear
  bridge state by hand. Now the bridge treats it as a dead session and
  transparently creates a new agent.

  The hotfix shipped with its own tests, including a live-session test that
  drives `promptAgent` through a failing `resume` and asserts a new agent is
  created. **This ticket certifies that work through the full gate stack — it
  is not a licence to redesign the classifier or rewrite those tests.**

  ## Why it still needs a parcel

  A hotfix lands outside the pipeline by definition, so nothing has yet run
  the gates the constitution requires: coverage, mutation with no surviving
  mutants, CRAP <= 6, DRY, and QA's own pass. The stamp parcel runs them and
  closes whatever they surface.

  ## Where to look hardest (direction, not mandate)

  The predicate is a regex over vendor error prose, and that is precisely the
  shape mutation testing tends to find survivors in — a loosened boundary, a
  dropped anchor, or a case-sensitivity flip can leave every existing test
  green. Expect the hardener's real work to be here rather than in the wiring.

  The declared invariants say what the scenarios cannot: the reset set must
  hold exactly the faults a NEW AGENT actually fixes. A quota or rate-limit
  fault resets nothing and burns an agent creation per prompt, which is why
  the existing code deliberately routes those to a fail-fast path — keep that
  boundary intact.

out_of_scope: |
  - Redesigning how Cursor faults are classified, or replacing message-pattern
    matching with a structured error-code check. If the gates show the pattern
    approach is untenable, raise it as its own ticket rather than widening
    this one.
  - Retrying, backoff, or any change to the fail-fast quota/rate-limit path
    beyond proving it still does not reset.
  - The other pending hotfix-ledger rows. Each gets its own stamp ticket.

qa_e2e_procedure: |
  The fault is a cloud-side state (an agentId the Cursor cloud no longer has),
  so it cannot be conjured on demand against the live API. Verify at the seam
  instead:

  1. Confirm the shipped live-session test in
     `extension/test/cursorBridgeAgentSession.test.js` still drives
     `promptAgent` through a failing `resume` and asserts exactly one agent
     creation plus a replaced stored agentId (invariant 2).
  2. Confirm the quota/rate-limit path still fails fast with no agent creation
     (invariant 1) — this is the regression that would be invisible in
     production until a bill arrived.
  3. Confirm the three pre-existing reset faults still reset (scenario 03), so
     the widening did not disturb them.
  4. In the live bridge, corrupt `agentId` in
     `.swarmforge/operator/cursor-bridge-state.json` to a well-formed but
     non-existent `agent-<uuid>`, then send one prompt from Telegram. The
     operator MUST get a normal reply, and the file MUST then hold a different
     agentId. This is the only step that exercises the real SDK error string —
     run it last, and restore the file afterwards.

notes: |
  2026-08-17 specifier, on minting: checked this against the prose-only-hotfix
  waiver rule first. It does NOT qualify for a waiver — `git show --stat`
  shows 12 lines of production TypeScript in
  `extension/src/tools/telegramCursorBridgeCore.ts`, so the acceptance is
  gateable and INVEST letter T passes. Minted rather than waived.

  Ledger linkage: `backlog/hotfix-ledger.yaml` row `ece61cbe63` now carries
  `stamp_ticket: BL-915`, set via `hotfix_ledger_update.bb --link`. Its
  `state:` still reads `pending` and that is correct, not a stale write —
  `hotfix_certification_lib.bb` DERIVES state from the stamp ticket's status
  (R2 state machine, line 129: a linked ticket that is not `done` derives
  `stamp-open`), so the field flips on the next certification sweep rather
  than at link time. The row's `human_decision` stays null until the human
  decides approved/waived — that decision is the one `human_approval: pending`
  above is asking for, and it is the ledger's to record, not this ticket's.

  Scope note for the coder: the hotfix's own tests are evidence, not a
  baseline to beat. If a gate surfaces a gap, close it by adding to them;
  do not restructure passing tests to suit a coverage number.

  BL-233 obligation, stated so it cannot be missed: the acceptance file is
  shipped LIVE (`.feature`, not `.feature.draft`) because the code it
  describes is already in production — but no step handlers exist for it yet.
  All five scenarios need handlers landed in THIS parcel. The runner throws on
  any scenario it cannot resolve, so a partial handler set fails the
  hardener's gate rather than degrading quietly.
