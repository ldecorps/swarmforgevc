approval_context: >
  This is a BL-848 hotfix stamp-off, so the human decision it needs is the
  ledger one: does `ece61cbe63` get certified (approved) or waived? The code
  is already in production on `main` — nothing here proposes changing
  behaviour, and rejecting this ticket does not un-land the hotfix.

  What specifically needs sign-off: the widened classifier. The hotfix added a
  fourth fault to the session-reset set on a message-pattern match. That is
  the right call for the reported fault, but pattern-matching a vendor's error
  prose is inherently brittle in both directions — too narrow and the fault
  returns under slightly different wording, too wide and unrelated faults get
  silently swallowed into a reset loop. Scenarios 04 and 05 pin the
  over-matching half; the hardener's mutation pass is what will probe the
  under-matching half.

  What is firm: the landed behaviour. The coder certifies and closes gate
  gaps — it does not redesign the classifier or rewrite the shipped tests.

