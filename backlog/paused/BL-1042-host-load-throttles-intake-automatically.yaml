id: BL-1042
title: "Article 3.5's host-health throttle is still hand-driven: automate it the way BL-431/432 automated the rework one - but NOT on the existing absolute ratio, which two weeks of live telemetry says would hold intake shut 44.5% of the time"
milestone: M8
type: feature
severity: medium
status: todo
epic: swarm-self-optimization
assigned_to: none
priority: 20
direction: swarm-reported
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1042-host-load-throttles-intake-automatically.feature
human_approval: approved

required_wiring:
  - "extension/src/tools/emit-throttle-recommendation.ts::readHostLoadSampleEvents::the emitter must actually READ the host-load store. Without this call site the diagnosis is computed and nothing ever consumes it - a mechanism shipped, unit-green, and wired into zero of the places it was filed to fix (the BL-419 shape). `readHostLoadSampleEvents` is an existing export of extension/src/metrics/resourceTelemetry.ts, so this is an anchor that already exists rather than a name nobody has written yet."

invariants:
  - "A recommendation only ever LOWERS: the effective cap is min(configured, every active recommendation), and no signal can raise it above the human-configured value."
  - "A throttle engaged by a signal is released by that same signal's own recovery - no human action, no edit to tracked configuration - and the engage and release thresholds differ, so a signal sitting at the boundary cannot oscillate the cap."
  - "The recorded recommendation always names WHICH signal produced the cap, so a composed cap is never attributed to the wrong cause."

description: |
  ## What exists already, and what does not

  The observe -> diagnose -> act loop is complete for ONE signal and absent
  for the other.

  **Rework (complete).** `reworkObservatoryStore` observes,
  `reworkDiagnosis` diagnoses, `emit-throttle-recommendation.ts` writes
  `.swarmforge/coordinator/throttle-recommendation.json`, and
  `backlog_depth_lib.bb`'s `read-effective-max-depth` folds it as
  `min(configured, recommended)` - reached from
  `promote_and_route_next.sh:93-94` at every promotion decision.

  **Host load (observe only).** `startResourceSampler` ->  `sampleRolesOnce`
  -> `appendHostLoadSample` is live and healthy: `.swarmforge/telemetry/
  chaser-2026-08.jsonl` holds **3902 samples spanning 2026-08-08 to
  2026-08-22**, 75 of them today, the most recent `ratio: 11.51` at
  07:07:24Z. `DEFAULT_HOST_LOAD_SEVERE_RATIO` and
  `DEFAULT_HOST_LOAD_SUSTAINED_MINUTES` both already exist.

  Nothing turns any of that into a cap. Article 3.5 sanctions the throttle,
  so today it is driven by hand: on 2026-08-22 the cap was edited to `0` in
  `swarmforge/packs/full-forge.conf` ("severe load 110-150 on 4 cores") and
  back to `4` later the same morning - two git commits to tracked
  configuration, and a restoration that depended on someone remembering.

  ## The measurement that must shape the design

  Mirroring BL-431/432 naively - reuse `DEFAULT_HOST_LOAD_SEVERE_RATIO = 4`
  as the severe threshold - fails on this host's own data. All 3902 samples:

  | | ratio |
  |---|---|
  | min | 0.38 |
  | p25 | 1.55 |
  | median | 3.29 |
  | p75 | 8.98 |
  | p90 | 20.40 |
  | p99 | 54.46 |
  | max | 127.25 |

  **`ratio > 4` holds for 44.5% of all samples** (`> 2`: 64.9%, `> 8`:
  27.9%). A severe threshold at 4 would hold intake shut nearly half the
  time. That is not a circuit breaker, it is a brake stuck on.

  Two further facts about the number itself:

  - The ratio divides by `os.cpus().length` - **4 logical cores on a
    2-physical-core host** - so it already understates pressure by about 2x
    against the cores that actually exist.
  - `DEFAULT_HOST_LOAD_SEVERE_RATIO` was NOT chosen for this question.
    BL-822 ruling 2 set it for "was this day resource abnormal", explicitly
    above `mutation_busy_load_multiplier`'s 2, with a standing instruction
    that "the two dials must not drift into contradiction". This ticket
    would be its **third** consumer. Reusing it silently is how a dial gets
    re-tuned for one consumer and quietly breaks another.

  ## How (direction, not mandate)

  Mirror what BL-431 actually does, which is the part worth copying: it does
  **not** compare against an absolute rate. It compares `reworkRate` against
  a recorded `baselineRate` times a multiplier. The faithful mirror is a
  host-load diagnosis relative to this host's own recent baseline, over the
  sustained window `DEFAULT_HOST_LOAD_SUSTAINED_MINUTES` already names -
  not a single sample, which on today's data swung 0.77 to 46.07 within
  hours.

  Baseline-relative alone is not sufficient, and this project has already
  ruled on why. A permanently-loaded host has a high baseline, so nothing
  ever reads as anomalous - the same collapse recorded in the BL-1007
  disposition ("a genuinely 3x-slower test still passes if load happens to
  be 3x"), whose resolution was that **a finite absolute ceiling is what
  carries the hazard**, with the relative signal doing the ordinary work.
  Apply that ruling here: baseline-relative for the normal case, an absolute
  ceiling past which load throttles regardless.

  Whether the ceiling is a new named constant or a re-justified use of the
  existing one is the architect's call - but it must be a decision recorded
  against the BL-822 warning above, not a silent reuse.

  ## Composition, which is the part with no precedent

  There is exactly ONE `recommended` slot today. A second recommender must
  not clobber the first. Fold both into that single slot as
  `min(reworkCap, loadCap)` so `read-effective-max-depth` and
  `promote_and_route_next.sh` need no change at all - and record which
  signal produced the winning cap, because `throttle-recommendation.json`'s
  current shape (`severity`, `reworkRate`, `baselineRate`) assumes a single
  cause and would otherwise attribute a load throttle to rework.

  ## Out of scope

  - The sampler. Host-load observation already works; do not rebuild it.
  - `promote_and_route_next.sh`, `read-effective-max-depth`, and the pause
    marker. The composition above is deliberately chosen so none of them
    changes.
  - The rework diagnosis itself. It keeps its own thresholds and behaviour.
  - Throttling anything other than intake depth. Article 3.5's lever is the
    cap; seat counts, fork pools and model tiers are not this ticket.
  - Removing the manual path. A human lowering the configured cap must keep
    working, and `min()` already means a manual lower still wins.

qa_e2e_procedure: >
  1. Read the live store first and record what you are testing against:
     count `host_load_sample` rows in `.swarmforge/telemetry/chaser-*.jsonl`
     and note the current ratio. A run against a fixture only proves the
     pure half.

  2. At the parent commit, seed a fixture telemetry store with sustained
     high load and run the promotion path's own cap resolution
     (`bb swarmforge/scripts/effective_backlog_depth_cli.bb <root>`).
     Confirm the absence of the behaviour: the printed cap equals the
     configured cap, unaffected by load.

  3. At the parcel commit, repeat. Confirm the printed cap is lowered, and
     confirm from `throttle-recommendation.json` that the record names host
     load as the cause.

  4. Confirm the sustained window is real: seed a single high spike inside
     an otherwise-quiet window and confirm the cap is NOT lowered.

  5. Confirm release without human action: seed a store whose load has
     recovered and confirm the cap returns to the configured value, with
     `git status` clean - no tracked configuration file was touched.

  6. Confirm no oscillation: seed a store sitting between the engage and
     release thresholds and confirm the cap does not alternate across
     repeated resolutions.

  7. Confirm composition and attribution: seed BOTH a rework diagnosis and a
     load diagnosis recommending different caps. Confirm the lower one wins
     and that the record names which signal produced it. Then confirm the
     never-raise property by seeding a recommendation ABOVE the configured
     cap and confirming the configured cap is unchanged.

  8. Confirm the manual path still works: lower the configured cap by hand
     and confirm the effective cap follows it down even with no diagnosis
     active.

approval_context: >
  The coordinator asked me to "scope automated host-load throttle, mirroring
  BL-431/432 rework gate". I have, but I found something while measuring that
  changes what "mirroring" should mean, and I want your eye on it.


  THE FINDING. Host-load observation is already live and healthy - 3902
  samples over two weeks, still writing this morning. What does not exist is
  anything that turns it into a cap, which is why the throttle is still done
  by hand: on 2026-08-22 the cap was committed to `0` in the tracked pack
  conf and back to `4` a few hours later. But the obvious mirror - reuse the
  existing `DEFAULT_HOST_LOAD_SEVERE_RATIO = 4` - fails against this host's
  own numbers. **`ratio > 4` holds for 44.5% of all 3902 samples.** Median is
  3.29, p90 is 20.4, max is 127. A severe threshold at 4 would hold intake
  shut nearly half the time.


  Also worth knowing: that ratio divides by 4 LOGICAL cores on a 2-physical-
  core box, so it already understates pressure about 2x. And the constant was
  never chosen for this question - BL-822 set it for "was this day resource
  abnormal", with an explicit instruction that it and
  `mutation_busy_load_multiplier` must not drift into contradiction. This
  would be its third consumer.


  WHAT I SPECCED INSTEAD, AND WHY I DID NOT ASK YOU FIRST. BL-431 does not
  compare rework against an absolute rate - it compares it against a recorded
  BASELINE times a multiplier. So the faithful mirror is baseline-relative,
  not absolute, and that needs no number from you. I added a finite absolute
  ceiling on top, because this project already ruled on exactly this collapse
  in the BL-1007 disposition: on a permanently-loaded host the baseline is
  high, so nothing reads as anomalous, and the ceiling is what carries the
  hazard. Both halves come from decisions already made here rather than from
  my taste.


  TWO THINGS I WANT TO FLAG RATHER THAN BURY.


  (1) **This throttles the symptom, not the cause.** Load is 11.5x as I write
  this, and the swarm itself is what generates it. An automatic intake
  throttle will make the swarm admit less work when it is busy, which is
  correct - but it is not the same as the host being right-sized. You have
  been managing this by hand in the other direction too (removing the
  coder@sonnet2 seat on 2026-08-21). I did not spec anything touching seats,
  fork pools or model tiers; Article 3.5's lever is the cap and I stayed on
  it.


  (2) **I kept the manual path working.** `min(configured, recommended)`
  means your hand-lowered cap still wins, and automation can only lower
  further. What automation removes is the part that actually bit today: a
  hand throttle is a commit to tracked config, so restoring it depends on
  someone remembering. Invariant 2 says a throttle is released by the same
  signal that engaged it, with no tracked file touched.

source: |
  Coordinator `note` 10_20260822T070739Z_000815: "Scope automated host-load
  throttle, mirroring BL-431/432 rework gate."

  Sibling prior art in the same epic: BL-431 (rework diagnosis, done) and
  BL-432 (auto-tune intake throttle, done) - the observe -> diagnose -> act
  loop this ticket completes for the second signal.

  Live evidence gathered 2026-08-22 while scoping: 3902 `host_load_sample`
  rows in `.swarmforge/telemetry/chaser-2026-08.jsonl`, distribution in the
  description.

notes: |
  ## Call sites confirmed live while scoping

  - Writer: `extension.ts` -> `startResourceSampler` -> `sampleRolesOnce` ->
    `appendHostLoadSample`. Verified against the store, not by grep alone -
    `appendHostLoadSample` has no external caller and a grep for one returns
    nothing, which reads as a dead mechanism until you check the file and
    find 3902 rows. Do not "fix" the missing caller.
  - Consumer path: `promote_and_route_next.sh:93-94` ->
    `effective_backlog_depth_cli.bb` -> `emit-throttle-recommendation.js` ->
    `read-effective-max-depth`. Already wired; unchanged by this ticket.
  - `costHealthSidecar.ts:778` already reads the same host-load store for
    day classification. A second consumer with a DIFFERENT threshold is
    fine; a second consumer that silently re-tunes the shared constant is
    the BL-822 contradiction. Say which you did.

  ## Related

  - **BL-822** - set `DEFAULT_HOST_LOAD_SEVERE_RATIO` and the
    do-not-contradict instruction.
  - **BL-1007** (paused) - load-relative budgets for the unit lane, and the
    recorded ruling that a finite absolute ceiling is what carries the
    hazard when a baseline-relative signal collapses.
  - **BL-423** - the pause marker folds into the same effective-depth gate;
    untouched here, and the reason the composition was chosen to leave
    `read-effective-max-depth` alone.

  ## IR-DRY judgment recorded

  7 findings -> 4. The real one - a 0.75 near-duplicate between the `When`
  and the `Then` - was shared vocabulary, not drift: both said "the effective
  cap is ...". Rewording the `When` to "the promotion path resolves the cap"
  separates the action from the assertion and reads better. The remaining
  four are placeholder-vs-literal (`<cap>` against the two literal
  expectations), once-versus-repeatedly, and the deliberate contrast between
  a sustained window and a quiet window with one spike - which is precisely
  the distinction scenario 02 exists to make. Kept.

