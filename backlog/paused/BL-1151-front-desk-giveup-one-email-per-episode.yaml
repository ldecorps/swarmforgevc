id: BL-1151
title: "Front-desk give-up escalation emails once per unbroken outage episode — not every cooldown re-arm"
milestone: M8
type: defect
severity: high
# high: broken safety/health signal — repeating "needs human" mail trains the
# operator to ignore a live front-desk outage (Article 3.2.4).
status: paused
epic: swarm-reliability
priority: 5
direction: human-requested
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1151-front-desk-giveup-one-email-per-episode.feature
human_approval: approved
approval_context: >
  Human locked (INTAKE-front-desk-bridge-giveup-email-spam.md): stop the
  recurring ~15min "front desk bridge has given up restarting" emails for the
  same unbroken outage. Specifier disposition: keep escalation armed across
  cooldown re-arms until observably healthy for a grace window (or human
  clear/park/supervisor restart). Sibling BL-1154 covers build-stale burning
  the crash attempt budget. Approve = ship; Amend if you prefer a long
  re-notify floor (hours) instead of armed-across-rearm.
required_wiring:
  - "specs/pipeline/steps/index.js::bl1151FrontDeskGiveupOneEmailPerEpisodeSteps::acceptance handler registered so the runner executes every scenario"
invariants:
  - "A continuous give-up → cooldown → re-arm → give-up loop with no healthy recovery produces at most one escalation email for that episode."
  - "Leaving gave-up solely for cooldown re-arm (no healthy grace) must not reset escalation arming in a way that re-opens email on the next give-up of the same episode."

description: |
  ## What

  Human receives the same SwarmForge email every ~15 minutes while the
  front-desk bridge stays in a give-up → cooldown → re-arm → burn budget →
  give-up loop. Cadence matches FRONT_DESK_GIVEUP_COOLDOWN_MS (900000).
  When status leaves gave-up, escalate-gave-up! resets `{armed?: false, …}`,
  so delivery-based arming (BL-370) does not suppress the next cycle's mail.

  ## Why

  A one-shot "needs human" that re-mails every cooldown without new
  information is not useful and trains the operator to ignore a real outage.

  ## How (direction, not mandate)

  Keep escalation armed across cooldown re-arms until the child is
  observably healthy for a grace window (or human clears / park /
  supervisor restart). Do not remove give-up / bounded restart. Sibling
  BL-1154 addresses build-stale attempt accounting if that is burning the
  budget.

qa_e2e_procedure: >
  (1) Fixture: force give-up, confirm one escalation email/send path fires
  and alarm arms.
  (2) Simulate cooldown re-arm without healthy grace, burn budget to give-up
  again — confirm no second email.
  (3) Simulate healthy grace then a later give-up — confirm a new episode
  may email.
  (4) Inspect live front-desk-supervisor.log / escalation-alarm.json for the
  2026-08-26 ~15min pattern and record evidence that arming now survives
  re-arm.

out_of_scope: |
  - Silencing unrelated swarm emails.
  - Removing give-up / bounded restart entirely.
  - Changing Resend branding.
  - BL-1154 build-stale vs crash attempt accounting (sibling).

