id: BL-626
title: "Promotion gate: refuse to promote a ticket whose `acceptance:` points at a feature file that does not exist (typically still a `.feature.draft`)"
milestone: M8
type: defect
status: todo
epic: code-quality-gates
human_approval: approved
severity: medium
priority: 108
direction: human-requested
depends_on: []
assigned_to: specifier
mutation_cost: medium
invariants:
  - "No promotion path activates a ticket whose `acceptance:` does not resolve to an existing feature file at that moment."

approval_context: >
  Operator asked for this ticket directly on 2026-07-25, in the same turn as the
  coder effort bump: "file un bug pour un gate qui refuse la promotion d'un
  ticket dont l'acceptance: pointe un .feature.draft non matérialisé."

source: |
  Operator request, 2026-07-25, during a bounce-rate investigation.

  ORIGIN INCIDENT: BL-441. Its acceptance feature was parked as a
  `.feature.draft` and was never materialised at promotion time. The ticket was
  promoted and worked anyway, against an acceptance pointer that resolved to
  nothing. Nothing in the promotion path noticed. This was recorded at the time
  as SYSTEMIC ("check other `.draft`-shadowed tickets"), not as a one-off.

  CURRENT EXPOSURE: `specs/features/` holds 352 materialised `.feature` files
  and 13 BL-prefixed `.feature.draft` files. Any ticket whose `acceptance:`
  resolves to one of those 13 can today be promoted with a dangling pointer.

description: |
  ## The hole

  `coder.prompt` (lines 16-23) instructs the coder: when the ticket's
  `acceptance:` field points at a feature file in `specs/features/`, generate and
  run its acceptance entry points via `specs/pipeline/scripts/run_acceptance.sh`.
  QA then owns running the acceptance gate independently as the final check
  before merge.

  Both of those presuppose the file EXISTS. When `acceptance:` names a feature
  that only exists as `<name>.feature.draft`, the pointer dangles:

    - the coder has no runnable acceptance to execute,
    - QA's independent acceptance gate has nothing to gate on,
    - and the ticket can still reach `done/`.

  The failure is SILENT. A dangling acceptance pointer does not error — it
  simply means the ticket's stated acceptance criteria were never executed by
  anyone. That is the defect: the promotion path advertises an acceptance
  contract it does not verify exists.

  ## Shape (specifier owns the detail)

  Fail-closed check at PROMOTION time, mirroring the existing
  `onboarding-contract-gate.js` posture (BL-262) — reuse that gate's
  fail-closed shape rather than inventing a new one:

    - Read the candidate ticket's `acceptance:` field.
    - If it names a path under `specs/features/`, resolve it.
    - If the resolved `.feature` does not exist — especially when a sibling
      `.feature.draft` DOES — refuse the promotion and say which file is
      missing and which draft shadows it.
    - If `acceptance:` is prose (no file pointer), the gate does not apply.
      Many chores and docs tickets legitimately have no feature file; this gate
      must NOT force one on them.

  The refusal must name the offending path. A gate that says only "blocked"
  reproduces the silence it is meant to remove.

  ## ⚠️ Rationale correction — do NOT justify this ticket with bounce data

  This ticket was first proposed with the claim that it would "attack the 73%
  of `behavior`-class coder defects at the root". **That claim was tested
  against the bounce ledger on 2026-07-25 and REFUTED.** Recorded here so the
  hypothesis is not silently resurrected downstream:

    - `.swarmforge/qa_bounces/2026-07.jsonl`, 300 tickets closed since 07-10.
    - Bounce rate for tickets WITH a materialised feature file: 14.8% (n=277).
    - Bounce rate for tickets WITHOUT one: 4.3% (n=23).

  Tickets with feature files bounce MORE, not less. The most likely reading is
  detectability, not defect rate: without a runnable acceptance, QA has nothing
  to reject against, so defects pass silently rather than being caught. That
  reading ARGUES FOR this gate — but on correctness grounds, not on any promise
  of a lower bounce count.

  **Do not scope this ticket to "reduce bounces", and do not accept a bounce-rate
  improvement as its acceptance criterion.** The deliverable is that a ticket
  can no longer be promoted with an acceptance pointer to a file that does not
  exist. Expect the measured bounce rate to go UP if anything, as previously
  invisible defects become detectable.

acceptance: |
  specs/features/BL-626-promotion-gate-rejects-unmaterialized-feature-draft.feature

  Every scenario needs its step handler wired in this same parcel (BL-233).

  Scenario map: 01 outlines the three refusal shapes and asserts the refusal
  names the offending path in each (a feature shadowed by its draft; an
  acceptance pointing straight at a parked draft; a feature absent with no
  draft at all) (#1/#4); 02 an acceptance that resolves promotes unchanged
  (#2); 03 prose acceptance is outside the gate and no feature is demanded
  (#3); 04 a same-prefix sibling feature does not rescue a dangling explicit
  pointer; 05 the backfill audit enumerates the whole exposure at once (#5).

  Scenario 04 is not in the original numbered list and is the one shape a
  reimplementation is most likely to miss. The gate that exists today,
  `is_buildable()` in promote_and_route_next.sh, falls back to a glob over
  `specs/features/<id>-*.feature` when the explicit pointer fails to resolve,
  so any sibling feature carrying the same ticket-id prefix silently passes a
  candidate whose own acceptance dangles. Closing the hole means the explicit
  pointer is authoritative; the glob may only be a fallback for tickets that
  name no path at all.

  Supporting gates:
  - The same function already treats an acceptance naming an existing
    `.feature.draft` as buildable (verified 2026-07-27 against BL-694 while
    it was still parked). That is the live exposure, not a hypothetical: a
    parked draft is by convention non-executable, so resolving to one must
    refuse, not pass. Cover it as a distinct case from the missing-file one.
  - Fail-closed: an acceptance field that cannot be parsed refuses. Absence of
    a readable answer must never read as permission.
  - The refusal text is asserted for CONTENT, not just for being a refusal -
    the named path is the deliverable (prompt-text assertions over a message
    that merely says "blocked" would be fake acceptance here).
  - No new friction on the happy path: a resolving acceptance must promote in
    the same number of steps as before.

  QA end-to-end procedure (live swarm, scratch backlog fixtures - never the
  live paused/ tree):
  1. Point a scratch ticket's acceptance at `<x>.feature` with only
     `<x>.feature.draft` on disk; run the promotion path. It refuses and the
     output names both paths.
  2. Point a second scratch ticket's acceptance directly at a
     `.feature.draft` that exists; run the promotion path. It refuses and
     says the draft is not executable.
  3. Add a decoy `specs/features/<same-id>-other.feature` beside a ticket
     whose own pointer dangles; confirm the decoy does not rescue it.
  4. Promote a ticket whose acceptance resolves, and one whose acceptance is
     prose: both promote, and the prose one is not asked for a feature file.
  5. Run the backfill audit against the real `paused/` and `active/` trees
     read-only; every unresolvable pointer is listed with its path.

out_of_scope: |
  - Materialising the 13 existing drafts. This ticket ADDS THE GATE and
    enumerates the exposure (acceptance item 5); converting each draft is
    separate work, per-ticket, and may legitimately conclude that a given draft
    should be retired rather than materialised.
  - Any change to how the coder or QA RUN acceptance. `run_acceptance.sh` and
    QA's independent gate are unchanged; this ticket only refuses to promote a
    ticket whose acceptance target is absent.
  - Reducing bounce counts. See the rationale correction above — that is
    explicitly NOT this ticket's goal or its measure of success.
  - Forcing a feature file onto tickets that legitimately have none.

notes: |
  Scenarios written by the specifier 2026-07-27 and materialized as a live
  `.feature`, so this ticket is no longer part of the draft exposure it was
  filed to enumerate. Lint gate clean.

  IR-DRY: two medium findings, both reviewed and kept. The first pairs
  "acceptance names a feature file that does not exist" with "...that
  exists" — opposites, not synonyms, and collapsing them would erase the
  happy path. The second pairs the outline's parameterized
  `the refusal names <named>` with scenario 04's concrete
  `the refusal names the missing feature`; that is deliberate reuse, since
  the outline's third row resolves to exactly that text and one handler
  should serve both. Scenario 04's distinct value is in its Given (a decoy
  sibling feature), not in its Then.

  The exposure count in `source:` (13 BL-prefixed drafts) was measured
  2026-07-25 and has moved since — 31 `.feature.draft` files on 07-27, of
  which BL-615, BL-652, BL-675, BL-676, BL-677, BL-678, BL-679, BL-680,
  BL-681, BL-682, BL-683, BL-691, BL-692, BL-693 and three GH- tickets are
  pointed at directly by a paused ticket's `acceptance:`. Do not treat the
  filed number as current; acceptance item 5 exists precisely because the
  set drifts. Two tickets found on 07-27 carry the OTHER shape — BL-579 and
  BL-580 name a `.feature` that exists nowhere, with no draft beside it —
  and are the closest thing to a live reproduction of the origin incident.
