approval_context: >
  Operator, 2026-07-25, from a coder turn report that correctly flagged untracked
  debris and correctly refused to delete it. The rule the coder obeyed is right;
  the debris should never have been there to flag.

source: |
  A coder working BL-629 reported:

  > the worktree root has some untracked, non-ignored debris unrelated to BL-629
  > (`calls.log`, `email-text.txt`, `failure.log`, `status.json` — apparent fixtures
  > from a daemon-death/alarm test). I didn't create these this turn and they aren't
  > staged, so per the "never sweep what you didn't create" rule I'm leaving them
  > alone rather than deleting — flagging them here in case they're stray output
  > worth investigating.

  That is textbook-correct behaviour. `workflow.prompt`'s rule is *"Clean Up After
  Yourself — Never Delete What You Did Not Create"*, and it requires ticket-less
  changes to be **surfaced, not swept**, because in this repo an untracked file is as
  likely to be `.swarmforge/` runtime state or another role's draft as it is litter.

  ## What they actually are

  ```
  .worktrees/QA/{calls.log,email-text.txt,failure.log,status.json}     07-24 03:08
  .worktrees/coder/{same four}                                          07-25 07:03
  ```

  ```
  calls.log    "send-email SwarmForge: daemon died, swarm halted / halt-swarm" x N
  status.json  {"state":"halted","last_incident":{"at":"2026-07-07T08:00:00Z",...}}
  failure.log  "SwarmForge daemon failure report / died_at: 2026-07-07T08:00:00Z"
  ```

  Pinned fixture dates, alarm-path call recordings. These are **test output**, not
  runtime state — daemon-death/alarm tests writing into the CWD instead of a temp
  directory, in whichever worktree the suite happened to run.

  So they fall in a category the rule does not name: **debris created by a TOOL, not
  by a person.** No role created them, so no role may remove them, and they persist
  indefinitely.

description: |
  ## Why "just let roles clean it" is the wrong fix

  The rule is right and should not be relaxed. Its reasoning is empirical: a blanket
  `git clean` in a worktree can take the swarm down, and silent tidying is
  indistinguishable from the phantom-revert class this repo has repeatedly chased.
  A role genuinely cannot tell these four files from load-bearing state — that is why
  the coder was right to stop.

  Fix the source, not the symptom.

  ## The measured harm, which is not hypothetical

  These files **blocked a legitimate `git merge --ff-only`** on 2026-07-25. Bringing
  `swarmforge-QA` up to `main` failed twice on untracked working-tree files, one
  collision round at a time, and required manual removal after verifying each was
  byte-identical to `main`. Untracked debris in a worktree root is not cosmetic — it
  obstructs merges.

  Second harm, quieter: the coder spent part of a turn investigating and reporting
  them, and **the next role will do it again**, and the one after that. Surfacing
  works once; without a destination it becomes a recurring tax.

  ## Surfacing has no destination — the real structural gap

  The rule says ticket-less changes are "SURFACED, not swept". The coder surfaced
  them: into a turn report, in a tmux pane, which scrolls away. Nobody owns
  "investigate flagged debris".

  So the honest reading of the operator's boy-scout instinct is: **leaving the place
  better cannot be an individual role's job here, because roles lack the information
  to distinguish litter from state.** It has to be done by something with the whole
  picture. Two candidates, specifier's call:

  1. The deterministic health daemon (BL-611) gains a check: untracked, non-ignored
     files in a worktree ROOT that match known test-fixture names. It already sweeps
     every worktree and already reports rather than acts.

     **AND IT ALREADY COUNTS THEM — pointing the wrong way.** `count-untracked-files`
     exists at `swarmforge/scripts/babysitter_assess_lib.bb:44` (a `git status
     --porcelain` `??` count), but it is only consulted when the role's HEAD has NOT
     moved (`:74`), i.e. purely as a stalled-role signal. Its hint (`:88-90`) reads:

     ```
     "HEAD still <sha> but N untracked file(s)
      — nudge role to git add/commit before BL-528 halt."
     ```

     Against these four fixture files that advice is **actively harmful**: a role that
     obeys it commits the debris. That is the same shape as the 2026-07-25 incident
     where a `git add -A` swept the operator's uncommitted work into a cleaner commit.
     So the detector must distinguish "role has real work it hasn't committed" from
     "tool droppings in the worktree root" and give the OPPOSITE advice for the second.
     Reuse the probe; do not reuse its verdict.
  2. `.gitignore` the fixture names, so they stop being "non-ignored debris" at all.
     Cheapest, but it hides the leak rather than fixing it, and a future real file of
     the same name would vanish silently. Prefer it only alongside item 1 of the shape
     below.

  ## Shape

  1. **Find the tests that write to CWD and give them a temp dir.** Several suites
     referencing these names already use `mktemp`; the leaking ones do not, or do and
     still write some paths relative to CWD. That is the actual defect.
  2. **A test that leaves a file in the repo or a worktree root fails.** Cheapest
     durable guard: the suite asserts a clean `git status --porcelain` for the root it
     ran in, so the next leak is caught by the test that caused it rather than by a
     coder three days later.
  3. **Remove the eight existing files** (four in `.worktrees/QA`, four in
     `.worktrees/coder`) as part of the parcel, once identified as fixtures — by the
     ticket that owns them, which is the rule working as intended rather than a role
     sweeping unilaterally.

acceptance: |
  Specifier writes the scenarios. Minimum:

  1. Running the daemon-death/alarm suites leaves no untracked files in the repo root
     or any worktree root — asserted by `git status --porcelain`, not by inspection.
  2. A deliberately-leaking test FAILS. Seed one; if the guard cannot catch a seeded
     leak it will not catch a real one.
  3. The eight existing files are gone, and their removal is attributable to this
     ticket.
  4. `workflow.prompt`'s "never delete what you did not create" rule is UNCHANGED.
     This ticket removes the need for a role to face the question; it does not relax
     the answer.
  5. If `.gitignore` is used, it does not mask a future file of the same name in a
     directory where such a file would be real.
  6. If the babysitter check is folded in: a worktree holding ONLY tool droppings does
     not produce a "nudge role to git add/commit" hint. Fixture: the four known fixture
     names in a worktree root with an unmoved HEAD must not advise committing them.

out_of_scope: |
  - Relaxing the never-delete rule. Its reasoning is sound and today's incident
    (`git add -A` sweeping the operator's uncommitted work into a cleaner commit)
    is the mirror-image argument for keeping it.
  - A general "clean the worktrees" sweep. Fix the source; the eight known files come
    with it.
  - BL-611's daemon scope, unless the specifier folds the detection check in there.

notes: |
  Worth recording because it is the interesting half: the coder did everything right
  and the outcome was still bad. It obeyed the rule, surfaced rather than swept, and
  explained its reasoning. The failure is that surfacing had nowhere to go — so a
  correct behaviour produced a report nobody owns, about files that will be reported
  again next week.

  The operator's framing was the boy-scout rule ("leave the place better than you
  found it"), and it is right about the goal. What today shows is that in a repo where
  untracked files are as likely to be load-bearing as litter, an individual role
  cannot execute it safely. The boy-scout duty belongs to whatever has the whole
  picture — the test that made the mess, or the daemon that watches every worktree.
