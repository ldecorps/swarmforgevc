      the required_wiring declaration pinning the test path. It replaces an
      earlier documenter-invoked Babashka gate, for this ticket's own reason —
      a gate someone must remember to run can be forgotten, which is the
      failure being prevented.

  Both human decisions recorded in this ticket's approval_context survive
