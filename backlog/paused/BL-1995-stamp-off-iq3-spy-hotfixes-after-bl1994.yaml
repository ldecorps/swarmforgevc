source: |
  The human, specifier pane, 2026-10-05, verbatim (Article 5.3):

  > We have to fix iq3. Spy on it every 10 minutes. If its gone wrong, hotfix it, and respawn. Repeat until iq3 is functioning normally.

  The fault (iq3 session de07ec69, 13:12-13:22Z, BL-1987): 15 edits in 5
  minutes, then more, each adding or removing one closing paren at the end
  of line 1343 of swarmforge/scripts/babysitter_check.bb. Every edit result
  carried the edit hook's "Unmatched delimiter: ), expected: ] to match [ at
  [1317 8]"; the stray ) was at [1344 56], which no message named.

description: |
  ## Status: hotfixes dfd15ebfb8 and 9d6eb54daa landed the fix

  This parcel is their stamp-off: review them, do not re-apply them. Later
  hotfixes from the same spy loop fold in below while this is paused.

  ## What was wrong

  The edit hook (BL-1970) passed on only the reader's message, which names
  where the unclosed bracket OPENED. For a stray closer, the place to fix is
  where the reader met it, and the message never said where that was. An
  edit also resets the repeat guard's window, so an edit that undid the one
  before it was never warned about.

  ## What the hotfixes changed

  - dfd15ebfb8 `swarmforge/scripts/local_model_edit_hook.bb`:
    `delimiter-error` returns the reader's row and column with its message;
    `stray-closer-note` shows an unmatched closer's line and column, the
    line itself and a caret under the character, and says to fix it there.
    An unclosed form (EOF) gets no such note.
  - dfd15ebfb8 `swarmforge/scripts/local_model_repeat_guard.bb`: `undo-note`
    warns an edit that puts back what an earlier edit of the same file
    replaced, with the number of flips.
  - dfd15ebfb8 tests: test_bl1970 shows a stray `)` at line 2 column 9 with
    its caret and gives an unclosed form no stray note; test_bl1971 warns a
    reversing edit and counts 2 and 4 flips, and warns neither a first edit
    nor a reversal of another file's edit.
  - 9d6eb54daa `swarmforge/roles/local-model/loop.note`: an edit result that
    says the file no longer reads names the one character to change next;
    never re-edit the line just changed.
  - Applied live: both hooks run from the master checkout; the card reached
    the seat at its 13:23Z respawn.
  - The stuck session ignored both notes for ten minutes; the respawn ended
    it. Whether the notes prevent the next toggle is the spy loop's to see.

  ## What the coder checks

  The change against the description and the invariant. Evidence:
  backlog/evidence/BL-1995-coder-<date>.md.

