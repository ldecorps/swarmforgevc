description: |
  ## Why

  BL-2084 prints each local seat's daily trend. The documenter's
  suggestion needs to say what changed beside it: a settings change or a
  model that no longer fit in VRAM.

  ## What is wanted

  Under each seat's table in the `--briefing` output:
  - the seat's settings changes in the window, one line each, as
    `<date> <time> <field> <old> -> <new>` from BL-1850's settings rows,
    with the field's human label and unit (scenario 01:
    `2026-09-30 21:28 GPU power limit 180 W -> 150 W`);
  - every model load in the window that put layers outside VRAM, as
    `<N>/<M> layers on GPU` with its date (scenario 02).
  No line is printed when the window holds neither.

  ## Where to read

  `swarmforge/scripts/local_seat_tuning_report_lib.bb` already holds both
  selections from BL-1854's salvage (landed with BL-2084):
  `settings-changes-in-window` and `spilled-loads-in-window` (around lines
  176-200). Field labels and units: `labeled-settings-paths` (around line
  255) and how `group-transition-diffs` (around line 306) prints old ->
  new. The rendering is in `local_seat_tuning_report_cli.bb`, beside
  BL-2084's per-seat table.

  ## How (direction, not mandate)

  - Reuse `labeled-settings-paths` for the field name and unit; no second
    label table.
  - Keep each new function shallow and run
    `bb -e '(load-file "swarmforge/scripts/local_seat_tuning_report_cli.bb")'`
    after every edit (BL-2084's notes say why).
  - Step handler `specs/pipeline/steps/bl2085LocalSeatBriefingLinesSteps.js`
    defines only this feature's own Given and Then steps; the Background
    and `When the tuning report runs with --briefing` resolve from
    BL-2084's handler.
  - Documenter: `docs/how-to/BL-1851-local-seat-tuning-report.md`'s
    `--briefing` section gains the two kinds of line.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2085-the-tuning-report-briefing-lists-settings-changes-and-spilled-loads.feature`:
     2 of 2 ok. No handler exists at mint.
  2. `node specs/pipeline/cli.js specs/features/BL-2084-the-tuning-report-briefing-prints-each-local-seats-days.feature`:
     2 of 2 ok, and `bb swarmforge/scripts/test/local_seat_tuning_report_lib_test_runner.bb`
     passes.
  3. Live, read-only: `bb swarmforge/scripts/local_seat_tuning_report_cli.bb <root> --briefing`;
     paste the output into the evidence and send the Art Director a
     sign-off note on it (Article 1.10).
  After the land (the coordinator's check, not QA's): the next morning
  briefing's Local LLM section carries this output verbatim, with the
  documenter's suggestion under it.

