id: BL-1611
title: "BL-1195's pre-turn worktree-drift guard reads the in_process box with the flat file reader, which never descends into the batch_ directories batch roles hold their parcels in, so a cleaner or hardender mid-work reads as holding nothing and its own uncommitted edits are refused as WORKTREE_DRIFT_DETECTED - the hardender hit it at session start on BL-1599 on 2026-09-16; the guard reads the box through the batch-aware reader and every roster shape is judged as BL-1195 meant"
milestone: M8
type: defect
severity: high
# high: a live fault degrading behaviour - a batch role's every
# ready_for_next while its tree is dirty is refused (exit 2, nothing
# dequeued or resumed) although it holds a batch; the hardender was
# refused on BL-1599 today and reported it. A guard blind to a roster
# shape is the BL-1515 family.
