required_wiring:
  - 'swarmforge/scripts/ready_for_next.bb::handoff-files-with-batches::the drift guard''s in-process check reaches the batch-aware reader (BL-1235: the guard is the pre-existing consumer; the reader exists since BL-1313)'
  - 'specs/pipeline/steps/bl1611DriftGuardSeesBatchParcelSteps.js::registerSteps::the handler lands in the same parcel as the feature (BL-233, BL-1371)'

human_approval: pending
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: the guard's decision
  (worktree_drift_lib.bb) is unchanged - a role with tracked edits and
  no in-process parcel is still refused; only the "has an in-process
  parcel" input becomes true for a batch role holding a batch directory
  with a parcel inside. FIRM: a batch directory with no parcel inside
  counts as nothing held (an empty batch_ dir is an interrupted claim,
  not a task). FIRM: the master-resident exemption (BL-1515 D1) is
  unchanged. FIRM: one scenario per roster shape - task, batch,
  master-resident - each built in the fixture (the rule this ticket's
  own class taught: a guard that runs on every role's turn is minted
  with the population it quantifies over).

invariants:
  - "For every roster shape, the drift guard's in-process input is true exactly when a git_handoff or note parcel exists anywhere under the role's in_process box, at the top level or inside a batch_ directory."

description: |
  ## What is wrong

  `enforce-worktree-drift-guard!` (`swarmforge/scripts/ready_for_next.bb:204-215`,
  BL-1195) exits 2 with WORKTREE_DRIFT_DETECTED when `git diff --name-only
  HEAD` is non-empty and `has-in-process-parcel?` is false. That predicate
  (line 172) is

  ```
  (boolean (seq (handoff-lib/my-handoff-files (handoff-lib/my-mailbox-dir :in_process))))
  ```

  - the flat reader. A batch role's parcels live in
  `in_process/batch_<stamp>_<seq>/` (the cleaner's and hardender's normal
  shape), and only `handoff-files-with-batches` (`handoff_lib.bb:167`,
  BL-1313) descends into them. So a batch role mid-work always reads as
  holding nothing, and any uncommitted edit of its own - the ordinary
  state of a hardener between a mutation run and its commit - is refused
  on its next `ready_for_next.sh`. The hardender's evidence
  (`.worktrees/hardender/backlog/evidence/BL-1599-hardender-20260916.md`,
  "Worktree-drift guard defect found"): hit at session start on BL-1599's
  own parcel in `batch_20260916T202413Z_000001/`. BL-1195's feature has
  the task shape only; BL-1515's D1 bounce added the master-resident
  exemption to this guard by hand and its own feature the master shape -
  the batch shape was never built in either.

  ## What is wanted

  - `has-in-process-parcel?` reads the box through
    `handoff-lib/handoff-files-with-batches`, so a batch directory with a
    parcel inside counts as held (scenario 01 rows 1 and 3); an empty
    batch directory, or no file at all, does not (rows 2 and 4); the
    master-resident row stays exempt (row 5). The decision library is
    untouched.
  - No flat in_process read remains in `ready_for_next.bb` (scenario 02;
    BL-1445: the census is `grep -n "my-mailbox-dir :in_process"` on that
    file - one site today, line 173).
  - The bb runner for the guard's wiring gains the batch case.

  ## How (direction, not mandate)

  - One line: `(handoff-lib/handoff-files-with-batches (handoff-lib/my-mailbox-dir :in_process))`
    in place of `my-handoff-files`, with a comment naming BL-1313 as the
    reader's origin and this ticket.
  - Scenario 01 drives the real `ready_for_next.sh` on a fixture swarm
    root (the `bl1195WorktreeTrackedContentDriftSteps.js` and
    `bl1515BranchIdentityGuardSteps.js` fixture shapes: roles table with
    the three rows, one worktree each, a tracked file edited, the
    in_process box shaped per row) and reads exit code and stdout;
    scenario 02 reads the source. Seconds (BL-1541).
  - Documenter: `docs/how-to` page for BL-1195 (or handoff-protocol.md's
    pre-turn guards paragraph) says the guard is batch-aware; no diagram
    trigger.

constraints: >
  ready_for_next.bb (one predicate), its bb runner, the feature and
  handler, evidence and docs. worktree_drift_lib.bb unchanged; no change
  to the master-resident exemption or to BL-1515's guard. The step
  handler lands with the feature (BL-233). Evidence named BL-1611-*.

out_of_scope: |
  - The same flat reader in two send-time gate libraries
    (parcel_rollback_guard_lib.bb:67, review_forward_evidence_gate_lib.bb:72),
    which makes BL-1213, BL-806 and BL-1576 silent for batch roles - a
    fail-open twin of this fail-closed defect, owned by BL-1612 (same
    pass).
  - Why the hardender's tree was dirty (its own mutation-run WIP, the
    legitimate case BL-1195 scenario 02 exempts).

qa_e2e_procedure: |
  On the parcel commit:
  1. `bb swarmforge/scripts/test/<runner the coder names>` -> green with
     the batch case.
  2. Acceptance resolving both scenarios
     (`bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1611-*.feature`)
     and BL-1195's and BL-1515's features still resolving.
  3. Live probe on the parcel's own chain: at the hardender stage, with
     the parcel in its batch and one tracked file deliberately edited and
     uncommitted, `./swarmforge/scripts/ready_for_next.sh` resumes the
     batch instead of printing WORKTREE_DRIFT_DETECTED; revert the edit.
  4. `grep -n 'my-handoff-files (handoff-lib/my-mailbox-dir :in_process)' swarmforge/scripts/ready_for_next.bb`
     -> no match.

