description: |
  ## What

  An operator hotfix is live on main and has never been through a gate.
  This is that gate: a REVIEW ticket - confirm or refute, and open narrow
  follow-ups for anything found.

  ## The failure it fixed (from the commit message)

  A newly onboarded swarm has no front desk, so its coordinator had no way
  to reach the human. gpu-bargain-hunter's coordinator sat blocked on a
  human-only decision, with the request visible only in its tmux pane
  (2026-09-26).

  ## What landed (files to review)

  - `swarmforge/scripts/notify_human.sh`: posts to the Coordinator topic
    (`role-topic-map.json`, opened by onboarding since e5a03ee6c7); `--poll`
    sends a non-anonymous poll (question <= 300 chars, 2-10 options of
    <= 100) and keeps the option texts by poll id in
    `.swarmforge/operator/human-polls.json`.
  - `swarmforge/scripts/human_replies.sh`: prints the principal's new
    messages in that topic and their poll votes, marks them read through
    `human-replies-offset.json`; `--peek` marks nothing; exits 3 while
    `.swarmforge/operator/front-desk-supervisor.pid` is alive.
  - Both read the bot token and chat only from
    `~/.swarmforge/fleet/<swarm_name>/telegram.json` (swarm name from
    `.swarmforge/swarm-identity`), never the env - the same ~/.zshenv
    leak BL-1775 fixes at the launch boundary.
  - `swarmforge/scripts/test/test_notify_human_and_replies.sh` (standing
    lane, 16 checks) and its `suite-manifest.tsv` row.

  ## Review goals

  1. Scenarios 01-05 green against the real scripts and a fake Bot API.
  2. `bash swarmforge/scripts/test/test_notify_human_and_replies.sh`: ALL
     PASS on the parcel commit (re-run; do not rewrite unless a finding
     says the suite is wrong).
  3. PROBE, do not fix - each confirmed finding is one note to the
     specifier:
     a. The front-desk guard is a pid-file liveness check. During a
        front-desk restart (stale pid), a run acknowledges every pending
        update through the offset. Does that lose the human's messages
        outside the Coordinator topic, or Approve taps, that the restarted
        front desk would have read? Answer from the Bot API's documented
        getUpdates behaviour (offset confirmation, allowed_updates, which
        telegramClient.ts:645 already pins for the front desk) plus one
        fake-API run.
     b. With no `.swarmforge/swarm-identity`, both scripts fall back to the
        swarm name `primary`. Run from the primary root with its front
        desk down, is that the behaviour wanted, or should the primary
        refuse?
     c. `human-polls.json` and the offset file are written with a plain
        `writeFileSync`, not an atomic write. Is a torn write reachable
        (two coordinators, a kill mid-write), and what does the next read
        do with it?

  ## How (direction, not mandate)

  - Drive the scripts as subprocesses from a mkdtemp swarm root with
    `SWARMFORGE_FLEET_HOME` and `TELEGRAM_API_BASE` pointing at a local
    fake server, as the hotfix's own shell test does (BL-1390: never the
    live `.swarmforge/operator/`, never a real token).

constraints: >
  Fixture roots and homes are mkdtemp directories (BL-1390). No real bot
  token and no network. The parcel does not edit either script.

out_of_scope: |
  Fixing the launch-boundary leak (BL-1775), the Coordinator topic itself
  (BL-1774), the starter kit's coordinator rule that teaches these scripts
  (BL-1758 notes, specifier-owned prose), retiring human_replies.sh (the
  human ruled A on 2026-09-26: it stays), and writing human_decision into
  the hotfix ledger.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1777-a-swarms-coordinator-messages-and-polls-the-human-in-its-own-topic.feature`:
     seven cases ok (01, 02, 03 x3, 04, 05). Record the duration.
  2. `bash swarmforge/scripts/test/test_notify_human_and_replies.sh`: ALL PASS.
  3. Read the architect's and hardener's evidence for review goal 3's
     three probe answers; every confirmed finding names its follow-up
     note.
  4. `git diff main...HEAD --name-only` names only evidence, the feature's
     handler (plus lib/ helpers) and test files.

