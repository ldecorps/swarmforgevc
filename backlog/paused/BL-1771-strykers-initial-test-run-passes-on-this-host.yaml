id: BL-1771
title: "Stryker's initial test run still fails on this host after BL-1761 - bl1418RoleEnumerationClassification.test.js reads six extension/src files through a root two parents up (.stryker-tmp/ in a sandbox, ENOENT), and activePoolFreshnessAudit.test.js, ruled a Stryker-only red to be left out of the mutation run on 2026-09-02, was never actually left out - so no TypeScript parcel can be mutation-tested: bl1418 resolves extension sources from the extension root it runs in, and the default Stryker run excludes exactly the one ruled file"
milestone: M8
type: defect
