  rather than whack-a-mole one per Stryker run". Parents: BL-1761,
  BL-1066, BL-1418.

notes: |
  Minted 2026-09-26 by the specifier (claude-opus-5-5 seat) while
  completing the hardener's note, the same pass. The systematic audit the
  hardener recommends was scoped at mint by census rather than minted
  whole. Only 7 of 80 non-property walk-up tests reach an `extension/` path
  at all, and the verification run names exactly two failing, so this
  ticket fixes those two and gates on a clean dry run. A recurrence guard
  over the census would need data-flow matching with an allowlist (the
  other four carry `extension/` as data). It is not minted; the next dry
  run is the detector.
