description: |
  ## Status: soft shift-close hotfix landed

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  Scheduled bedtime (`wait_for_expedite_then_bedtime.sh`, used by weekday
  17:00 `day-shift-bedtime.sh` and weekend 09:00 stop) waited only for an
  in-flight expedite, then called `./finish-shift`, which SIGTERMs every
  seat. A hardender mid-mutation or a coder mid-bounce was killed at the
  bell. An earlier drain-before-bedtime intent
  (`wait_pipeline_drain.sh`, NOTE 2026-08-26) was never wired.

  ## What the hotfix changed

  - `extension/src/tools/telegramPipelineDrain.ts`: `isInFlightEmpty` —
    true iff no live role has `inbox/in_process` mail (`new/` ignored).
  - `swarmforge/scripts/shift_close_freeze_intake.sh`: T−15 freeze via
    `control-pause.json` + cooldown window pre-consume.
  - `swarmforge/scripts/wait_in_flight_drain.sh`: poll until
    `isInFlightEmpty` or timeout → `drained` | `forced`.
  - `swarmforge/scripts/wait_for_expedite_then_bedtime.sh`: freeze →
    wait expedite → in-flight drain → `./finish-shift`.
  - `docs/how-to/BL-2088-soft-shift-close.md` + fixture test
    `swarmforge/scripts/test/test_wait_in_flight_drain.sh`.

  ## What the coder does (all of it)

  1. Read `git show 5db8326a83` against the invariants and the section
     above. Confirm finish-shift itself is not reimplemented — only the
     wait that precedes it.
  2. Run the three commands in qa_e2e_procedure once each, output under
     tmp/.
  3. Write backlog/evidence/BL-2088-coder-<date>.md and commit it.

  ## What the documenter does

  Confirm `docs/how-to/BL-2088-soft-shift-close.md` matches the landed
  scripts (T−15 table, env vars, drained vs forced). Link it from
  `docs/how-to/BL-762-finish-shift-bedtime-vs-lights-out.md` if that page
  still describes an immediate kill at the scheduled bell.

constraints: >
  Review only: never re-apply or extend the hotfix. Never start a
  mutation run.

out_of_scope: |
  - Changing Control Drain & stop (still full isPipelineEmpty).
  - Per-stage seat-stuck clock allowances (separate intake).
  - Replacing the one-night evening-shift-tonight override mechanism.

assigned_to: coder
