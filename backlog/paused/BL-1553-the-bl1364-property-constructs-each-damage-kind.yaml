qa_e2e_procedure: |
  On the parcel commit, from `extension/`:
  1. `for i in $(seq 1 15); do npx vitest run --config
     vitest.properties.config.mjs
     test/bl1364TurnProfileSeriesInvariants.property.test.js || echo FAIL;
     done` -> 4 passed every run, no FAIL line (the unfixed file fails
     about 1 of 10).
  2. In each run's stdout the printed reach map for invariant 2 shows
     `interior`, `missing` and `unreadablePath` each >= 1 and summing to
     >= 15.
  3. `git diff main...HEAD --name-only` names the property test, the step
     handler, the feature, evidence, and the register row removal;
     `extension/src/`, `property_suite_standing_allowlist.tsv`, the
     BL-1364 feature and handler are unchanged. `grep -n "seen.unreadablePath >= 1\|unreadablePath" <the test>`
     still shows the floor asserted.
  4. Break-then-restore: make the unreadable-path arm build a plain
     readable file instead of a directory; the property's own assertion
     `a window with an unreadable transcript claimed completeness` fails on
     that arm on the FIRST run (not one in ten); restore.
