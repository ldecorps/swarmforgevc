approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: extension/src is not
  edited - buildTurnProfileWindowRecord and the transcript walker are
  BL-1364's landed contract and the property agrees with them on every
  draw; the fix is in the test's own draw only. FIRM: the three reach
  floors are not lowered, not dropped, and not made rarer-to-miss by
  inflating numRuns - BL-1062's rule is that a floor is met BY
  CONSTRUCTION, and a floor that is merely usually met is still a flake.
  FIRM: the file is not added to property_suite_standing_allowlist.tsv.
  Direction, not mandate: iterate the damage kind explicitly (one
  fc.assert per kind, or runsPerCell from test/helpers/reachFloors.js) so
  each kind is exercised on every run, and keep the seen counts and their
  floor assertions. Minted by the specifier on QA's unowned-red note of
  2026-09-13 10:25Z from the BL-1499 parcel (evidence 1ad3cf5cd6 on
  swarmforge-QA, 1 of 10 alone); the specifier's 12 runs alone on main
  fdb19b9bf0 were all green, which a seed miss does not contradict - the
  cause is read off the test source.

invariants:
  - "A reach floor is met by construction: every value a floor names is produced by a test arm that yields it on every run of that arm, never by a uniform draw the floor merely hopes will cover it."

description: |
  ## What is wrong

  `extension/test/bl1364TurnProfileSeriesInvariants.property.test.js`,
  invariant 2 ("one damaged transcript refuses the whole window"): the
  damage kind is drawn INSIDE the property with
  `fc.integer({ min: 0, max: 2 })` (0 interior garbage line, 1 missing
  file, 2 a directory in place of the file), `numRuns: 15`, and after the
  run three floors assert each kind was seen at least once. Nothing
  constructs any kind, so a seed that never draws one of three values in
  15 tries fails the file:

  | who | where | result |
  |---|---|---|
  | BL-1499 QA, 2026-09-13 | full lane, 2 of 2 runs | `never generated an unreadable path: {"interior":6,"missing":9,"unreadablePath":0}` |
  | BL-1499 QA, 2026-09-13 | alone, quiet host, 10 runs | 1 failed, same assertion |
  | specifier, 2026-09-13 | alone, main `fdb19b9bf0`, 12 runs | 0 failed |

  A generator draw does not depend on load; QA's isolated repro is the
  proof, and the miss is read off the source. Latent since BL-1364 landed
  the file (2026-09-05). Evidence:
  `backlog/evidence/BL-1553-specifier-unowned-red-repro-20260913.md`.
  Same class as BL-1533 (`bl604TrendAnalysisInvariants`, the delta sign)
  and BL-1527 (`bl1367ApprovalCarriesItsRuling`).

  ## What is wanted

  Invariant 2 reaches its three damage-kind floors on every run because
  the kind is ITERATED by the test, the way BL-1533 iterates the sign and
  the way the same file's invariant 1 could iterate its own floors - not
  sampled. The floors stay at their values and stay asserted. The run
  prints its reach map (the BL-1371 `reach over N draws:` shape) so a
  reader, and scenario 02, can see the counts. The property lane is green
  on `main`; the register row this ticket adds is removed in the same land.

  ## How (direction, not mandate)

  - Replace the `fc.integer({ min: 0, max: 2 })` arm with an explicit loop
    over the three kinds: one `fc.assert` per kind with
    `numRuns: runsPerCell(15, 3)` (from `test/helpers/reachFloors.js`), or
    an equivalent per-kind loop, so every kind runs on every invocation
    and the total number of draws is not reduced. Keep the `seen` counts
    and the three `assert.ok(seen.<kind> >= 1, ...)` lines exactly as they
    stand (or route them through `assertReachFloor`, which prints the
    same shape).
  - Print the reach map at the end of invariant 2 with `console.log`
    (BL-1371's `reach over` line is the precedent) so the acceptance can
    read the counts from the run rather than re-deriving them.
  - Invariant 1's `someUnworked`/`multiWorked` floors are the same shape
    but sit far from their line (at most 4 of 7 stages can be worked, so
    `someUnworked` is always met; `multiWorked` misses only if all 25
    draws have length 1). Constructing them in the same pass is welcome
    if it is one edit; leaving them is not a defect.
  - `extension/src/metrics/turnProfileProducer.ts` and
    `transcriptWalker.ts` are not touched; `specs/features/BL-1364-*.feature`
    and its handler are not touched - BL-1364's own acceptance is not red
    and is not this ticket's.

  ## Not in scope

  - The `bl1272LandedSiblingInvariants` 20 s timeout QA saw in the same
    full-lane run: passes alone in 10.9 s, BL-871's contention shape, not
    registered, not minted (QA asked for none).
  - The BL-1364 parcel shipped a sampled floor and no stage caught it; the
    same fail-open shape BL-1445 names. No process change is minted here.

