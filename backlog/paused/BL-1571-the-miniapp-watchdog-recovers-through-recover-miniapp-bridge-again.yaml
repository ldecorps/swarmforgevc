description: |
  ## What is wrong

  `swarmforge/scripts/test/test_bl1159_bridge_child_survives_without_crash_giveup_loop.sh`
  (BL-1159, lane shell, `standing`) fails on `main` 674d50539a:

  ```
  FAIL - bl-1159-03: down bridge uses recover (rearm) not bounce kill stub
  ```

  The fixture stubs `bounce_bridge_headless.sh` to write a marker and
  ticks `operator_runtime.bb` with a down `/lets-talk`, threshold 1, and a
  live `front-desk-supervisor.pid`; the marker must NOT appear. On main
  it does, because `miniapp-bounce-bridge!` reads:

  ```
  (process/sh {:continue true}
              "bash" (str bounce-bridge-headless-script) project-root (str miniapp-watchdog-port))
  ```

  BL-1159's landing 43da3844ec (2026-08-26 15:33) had changed that line to
  `recover-miniapp-bridge-script` and added the def. BL-653's landing
  309e11bdef, the same day, restored the old line and removed the def
  (`git show 309e11bdef -- swarmforge/scripts/operator_runtime.bb`) - the
  merge-reverts-landed-work class of BL-571/BL-958/BL-954, missed because
  its diff was read against one parent. `recover_miniapp_bridge.sh` has sat
  on main since, referenced by no bb file. Red for 19 days and unseen
  because nothing runs the standing shell suite (BL-1526's gap).

  Live effect today: a down `/lets-talk` past the threshold runs
  `bounce_bridge_headless.sh` -> `npm run compile`, a
  `stop_bridge_headless.sh` the surviving BL-1159 guard refuses when the
  front desk owns the stack, then `start_bridge_headless.sh` on a port the
  front desk's child already holds. The re-arm path
  (`rearm_front_desk_bridge.sh`) is never reached. The live runtime.log
  shows no `miniapp-watchdog bounced` lines on this host today, so the
  fault is latent here, not firing.

  ## What is wanted

  `miniapp-bounce-bridge!` invokes `recover_miniapp_bridge.sh` (which
  re-arms the front desk when `front-desk-supervisor.pid` is live and
  falls back to `bounce_bridge_headless.sh` otherwise), the def
  `recover-miniapp-bridge-script` is back beside
  `bounce-bridge-headless-script`, and the shell test prints
  `ALL CHECKS PASSED` on `main`. The register row this ticket adds is
  removed in the same land.

  ## How (direction, not mandate)

  - Reapply 43da3844ec's two-line operator_runtime.bb hunk; nothing else
    in that commit is missing from main (its scripts and the shell test
    are present).
  - Step handler `specs/pipeline/steps/bl1571MiniappWatchdogRecoverSteps.js`
    greps operator_runtime.bb for the routing and runs the real shell test
    as a subprocess; it lands in the same commit as the feature (BL-233).

  ## Not in scope

  - `recover_miniapp_bridge.sh`, `rearm_front_desk_bridge.sh`,
    `bounce_bridge_headless.sh`, `stop_bridge_headless.sh`, the BL-1159
    feature file and handler, and BL-653's escalation-driven sweep are not
    touched.

