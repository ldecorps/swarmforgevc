qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `grep -n 'recover-miniapp-bridge-script\|recover_miniapp_bridge' swarmforge/scripts/operator_runtime.bb`
     shows the def and its use inside miniapp-bounce-bridge!;
     `grep -n 'bounce-bridge-headless-script' swarmforge/scripts/operator_runtime.bb`
     shows only the def (no call in the watchdog).
  2. `bash swarmforge/scripts/test/test_bl1159_bridge_child_survives_without_crash_giveup_loop.sh`
     three times -> `ALL CHECKS PASSED`, exit 0.
  3. `git diff main...HEAD --name-only` names operator_runtime.bb, the
     handler, `specs/pipeline/steps/index.js`, the feature, evidence and
     the register-row removal; the four bridge shell scripts are unchanged.
  4. Break-then-restore: point miniapp-bounce-bridge! back at
     bounce-bridge-headless-script; case bl-1159-03 fails; restore.
  5. Diff the parcel's merge into main against BOTH parents; the
     operator_runtime.bb hunk survives. The row for this file is gone from
     `backlog/standing-reds.tsv`.
