notes: |
  ## e2e procedure for QA

  On an otherwise-idle host (check `uptime` load first — a loaded host makes
  every number here meaningless):

  1. Run `npm test` in `extension/` to completion. Confirm it exits green and
     that no worker-termination message appears in the output.
  2. Read the newly appended row in `extension/.test-durations.jsonl`. Confirm
     `result` is `pass`, that `duration_ms` is present, and that `test_count`
     is not lower than the previous row's 438.
  3. Read the per-file duration report the run produced. Confirm every test
     file that ran appears with its own duration and that the list is ordered
     slowest first.
  4. If the recorded duration is over 13000ms, confirm the report names the
     files accounting for the bulk of the run, each with its measured duration
     — that named set is what slice B will be specced against.
  5. Confirm by diff that no test file was deleted, no test was skipped, no
     exclude glob was widened, and that neither `SUITE_DURATION_BUDGET_MS` nor
     BL-378's per-file budget was raised.
