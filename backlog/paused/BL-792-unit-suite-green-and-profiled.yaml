invariants:
  - "No run is made green by removing test coverage: the recorded test_count never falls below the previous recorded run, and no test file is deleted, skipped, or added to an exclude glob."
  - "The declared suite duration budget may fall but never rise — no change in this slice raises SUITE_DURATION_BUDGET_MS or the per-file budget."
