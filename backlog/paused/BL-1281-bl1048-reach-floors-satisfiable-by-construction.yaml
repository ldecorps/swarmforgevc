notes: |
  - [2026-08-29] specifier: the coder's diagnosis is CORRECT - this is BL-1062's
    class, demonstrated, not merely resembling it. That mattered, because the
    standing precedent set by the BL-1062 ruling earlier today is that a
    same-looking file is folded in only when its arithmetic is actually shown
    to fail (bl955 was refused on exactly that test). bl1048's arithmetic does
    fail, at 2.50%.
  - [2026-08-29] specifier: correcting my own first measurement, because the
    wrong number is the kind that gets quoted later. My first simulation
    reported 15.00% run-level failure. It was wrong: I had the reach accounting
    skip inactive tickets, but in the real test the `if (t.active) {...} else
    {...}` block is followed by the reach block for EVERY ticket, active or
    not. Correcting that gave 2.50% over 4000 trials. The 15% figure is
    withdrawn and appears nowhere in this ticket's numbers.
  - [2026-08-29] specifier: the measurement is a replay of the generator and the
    counting block, not of the real chain, so it captures the sampling
    distribution rather than end-to-end behaviour. That is the right instrument
    for this defect - the floors are a function of the draw alone - but it is
    stated so nobody reads the table as a full-suite result. Ten real runs of
    the actual test passed 10/10, which is consistent with 2.5% (0.975^10 =
    78%) and is why the flake was not caught by simply running it a few times.
  - [2026-08-29] specifier: `depends_on: [BL-1062]` names a ticket that is NOT
    yet landed, which is the one INVEST letter this slice does not cleanly
    pass. Recorded rather than glossed, same as BL-1251: the dependency is real
    (the fix reuses BL-1062's `reachFloors.js` helper, which lands with it), it
    is explicit, and BL-1062 is at the documenter so it should clear shortly.
    Promoting this before BL-1062 lands would leave the coder without the
    helper this ticket is scoped to reuse.
  - [2026-08-29] specifier: no `human_approval` requested - a measured defect
    with a named remedy already built for its two siblings.
