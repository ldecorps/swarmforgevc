description: |
  ## What is wrong

  `extension/test/bl1048DeliveredParcelIsNotNotStarted.property.test.js`
  declares NINE reach floors and then hopes an UNSEEDED `fast-check` draw
  happened to clear them. That is BL-1062's defect exactly: the floors are
  right, the sampling is what makes them a per-run lottery, and a red says
  nothing about the code under test.

  ## Measured, not estimated

  Replayed the real generator (`ticketArb`, `fc.array(..., {minLength: 2,
  maxLength: 6})`) and the test's own coverage-counting block over **4000
  simulated runs** at `numRuns: 24`:

  | floor | value | mean | min | miss rate |
  |---|---|---|---|---|
  | deliveredOnly | 8 | 15.3 | 3 | **1.15%** |
  | openedOnly | 8 | 15.3 | 2 | **1.32%** |
  | noParcel | 4 | 15.3 | 3 | 0.05% |
  | bothStatesSameRole | 4 | 15.3 | 5 | 0.00% |
  | crossRole | 6 | 27.0 | 12 | 0.00% |
  | deliveredNote | 4 | 30.6 | 10 | 0.00% |
  | deliveredBatched | 4 | 30.7 | 16 | 0.00% |
  | deliveredMasterResident | 2 | 17.8 | 5 | 0.00% |
  | closedButDelivered | 2 | 12.2 | 2 | 0.00% |

  **Run-level failure on correct code: 2.50%.**

  ## It is two floors, not nine

  The reporting coder described it as "9 floors over 24 draws". The count of
  floors is right and the framing is not: seven of the nine clear by a wide
  margin and need no change at all. TWO carry the entire risk -
  `deliveredOnly >= 8` and `openedOnly >= 8` - both keyed on a `shape` drawn
  at p=1/6 per ticket. Rewriting all nine would be churn across six floors
  that were never at risk, and would enlarge the diff for no behaviour.

  Also worth stating plainly: coverage increments **per ticket, not per draw**.
  Each draw carries 2-6 tickets, so a run accumulates roughly 92 ticket
  observations, not 24. "24 draws" understates the sample by about 4x, which
  is why the miss rates are percent-level rather than the double digits the
  bare floor-vs-draws comparison suggests.

  ## Why a sibling and not an amendment to BL-1062

  BL-1062 is already at the **documenter** with its fix built, hardened and
  documented (`85fa5d74f` construction fix, `120edac96` hardener pass,
  `b345346ac` docs). Adding a third file to it now would force a rebuild of a
  nearly-complete parcel from the coder - exactly the in-flight amendment
  hazard BL-317/BL-325 exist for, and an oversize of a Small slice (BL-634).

  ## How (direction, not mandate)

  Reuse BL-1062's remedy rather than reinventing it: make the coverage the two
  at-risk floors demand reachable **by construction**, floors intact, through
  the shared helper it landed at `extension/test/helpers/reachFloors.js`
  (`assertReachFloor`, `runsPerCell`). Iterating the `shape` space so each
  shape receives a derived share of the run budget is the shape of the fix
  BL-1062 already applied to bl968; the seven safe floors can keep sampling.

  ## Constraints

  - The floors are load-bearing. BL-1062's own helper comment says so: without
    them "a generator that silently stopped producing a value would pass green
    forever". Lowering a floor, deleting one, or widening a range to make the
    run pass is not a fix (invariant 2, scenario 02).
  - Do not add the file to `property_suite_standing_allowlist.tsv`. That trades
    a 2.5% flake for permanent blindness, and the prior BL-1062 ruling already
    refused that remedy for the same class.
  - Do not blunt the shared assertion. Scenario 03 exists for that.

qa_e2e_procedure: >
  (1) Run the test at several explicit seeds and confirm the delivered-only and
  opened-only floors are met on every one. (2) Replay the generator and the
  coverage block over at least 2000 simulated runs and confirm a 0% run-level
  miss rate for those two floors, against the 2.50% recorded above. (3) Read
  the declared floors and confirm all nine are still present, none below its
  previous value. (4) Hand the shared reach-floor assertion a coverage map
  short on delivered-only and confirm it throws naming that value. (5) Run the
  full `test:properties` lane and confirm bl1048 is green and no sibling
  property test regressed. (6) Confirm the file is still absent from
  `property_suite_standing_allowlist.tsv`.

out_of_scope: |
  - bl968 and bl948. They are BL-1062's, its fix for them is already built and
    at the documenter, and nothing here touches them.
  - bl955. The prior BL-1062 ruling (backlog/evidence/BL-1062-specifier-ruling-20260829.md)
    computed its floors as satisfiable by a wide margin and deliberately did
    not fold it in. That decision stands; this ticket does not revisit it.
  - The other seven floors in this same file. Measured at 0.00-0.05% miss, they
    are not defective and changing them would be churn.
  - A repo-wide sweep for every property test that declares a sampled floor.
    That is a real question and a different slice - it needs its own
    measurement per file, and the one lesson this ticket already proves is
    that a floor count is not a defect count.

