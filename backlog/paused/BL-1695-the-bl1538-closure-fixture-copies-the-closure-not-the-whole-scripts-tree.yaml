description: |
  ## What is wrong
  QA's property-lane run for BL-1688 (2026-09-22 12:08 local, QA
  evidence `backlog/evidence/unowned-red-bl1538-fixture-closure-invariant2-QA-20260922.md`,
  QA branch f3702182ca):

      invariant 2 ("the guard reads what the fixture actually copies, never
      what its source claims") fails after 1 property test, counterexample
      ["slice_size_envelope_gate_lib.bb"], seed -793069138. Invariant 1 in
      the same file passed.

  The specifier ran the file alone on main twice within the hour: 2/2
  pass, 863 ms. QA's own full-lane run for BL-1673 at 10:38 local was
  444/444 green with this file in it. The red is load-shaped, not
  input-shaped: invariant 2's property is `fc.constant(member)` per
  closure member, so the seed decides nothing and the counterexample is
  just the member the loop reached when the environment gave way.

  What the file does per iteration (`copyScriptsTree`, lines ~78-90;
  `derivedCopySet`, ~68-75): it copies EVERY file directly under
  `swarmforge/scripts` (496 files, 16 MB) into a fresh `mkSharedTmpDir`
  root, copies the runner under `test/`, patches the runner's source to
  drop one member, then spawns `bb <runner> --copy-into <dest>` (which
  itself recomputes the closure with `bb_load_closure_lib` and copies the
  eight-member closure). The closure of `promotion_gates_cli.bb` has 8
  members, so one run of invariant 2 is about 130 MB of file copying and
  eight bb starts on top of `closureOf`'s own; invariant 1 adds six more
  tree copies and spawns. Alone that is under a second; inside a
  414-file property lane at load average 8-11 (the box on 2026-09-22
  12:11: 7.78, 10.65, 9.08) it is exactly the fixture-spawning shape
  BL-1579 found timing out and BL-1579's remedy (a load-relative budget
  through `contentionBudget`) does not cover an assertion failure.

  The three assertions the iteration can fail on say nothing about WHY:
  `--copy-into failed: <stderr>` (a bb start failing under load - the
  likeliest, and the only one that carries a reason), `<member> was
  expected to be dropped from the real copy but is present` (no copy set
  shown), `the guard's own comparison did not name <member>: <list>`. QA
  recorded the fast-check summary line only, so which of the three fired
  is unknown, and it will stay unknown on the next sighting unless the
  messages carry it.

  ## Why
  A property red in the full lane withholds attention on every parcel it
  lands beside (Article 4.2's note, a specifier round trip, a register
  row), and a red with no captured cause recurs as a new note each time.
  The 2026-09-20 rule that a red in an untouched file is a note, not a
  re-run, is right - it makes the file's own diagnosability the thing
  that matters.

  ## What is wanted
  1. Reproduce ONCE under comparable load - the full property lane
     started alongside (or a Stryker run), load average above 6 - with
     the file's full failure output captured verbatim into the evidence:
     the assertion that fired and its message. If it does not fire in
     that one run, say so and proceed on the code alone (the fixture
     cost below stands on its own).
  2. The fixture copies only what the runner reaches: the closure (from
     `closureOf`) plus the runner file, into a scratch tree shaped as the
     runner expects (`<root>/<member>.bb`, `<root>/test/<runner>`), not
     the 496-file directory; invariant 1's added edges are written on top
     of that copy as today.
  3. Every assertion in the file names the member and the cause
     (invariant above): the spawn assertion keeps stderr AND names the
     member; the presence assertion prints the observed copy set; the
     comparison assertion already prints the guard's list.
  4. Floors, draw budgets (`runsPerCell`, `assertReachFloor`, BL-1586)
     and both invariants' meaning unchanged.

  ## How (direction, not mandate)
  - `copyScriptsTree(dest)` takes the closure list it already has
    (`closureOf(SCRIPTS, ENTRY)` is computed at describe time) and copies
    those names plus `RUNNER_REL`; keep the `test/` sub-dir so the
    runner's parent-of-parent derivation still lands on the scratch root.
    If `bb_load_closure_lib` needs the entry's siblings to resolve
    `load-file` lines, the closure IS that set by definition.
  - One `bb` start per iteration is inherent (the runner's `--copy-into`
    is the behaviour under test); `closureOf` runs once per describe.
  - Reproduction: `cd extension && npm run test:properties` in one shell
    and, when the load is up, `npx vitest run --config
    vitest.properties.config.mjs test/bl1538Bl1028RunnerFixtureClosureInvariants.property.test.js`
    in another, output to a file under `tmp/`; quote the failing
    assertion in the evidence.
  - Documenter: nothing beyond the evidence file; no diagram trigger.

  ## Scope
  - `extension/test/bl1538Bl1028RunnerFixtureClosureInvariants.property.test.js`.
  - `specs/features/BL-1695-the-bl1538-closure-fixture-copies-the-closure-not-the-whole-scripts-tree.feature`
    and `specs/pipeline/steps/bl1695ClosureFixtureCopiesOnlyTheClosureSteps.js`
    (same parcel, BL-233; discovered from its own file, BL-1371).
  - Out of scope: the runner `bl1028_promotion_refusal_property_runner.bb`
    and `bb_load_closure_lib.bb` (BL-1538's production side is fine: the
    file passes alone); the lane's timeouts (BL-1579, BL-1619); the
    shared tmp helper (BL-1677 covered the peer sweep).

qa_e2e_procedure: |
  On the parcel commit, from `extension/`, ONE run each (2026-09-17 rule).
  1. `npx vitest run --config vitest.properties.config.mjs test/bl1538Bl1028RunnerFixtureClosureInvariants.property.test.js`:
     2/2 pass, and `ls` of a scratch root captured by the parcel's
     evidence shows the closure (8 on 2026-09-22) plus `test/` - not 496
     entries.
  2. `node specs/pipeline/cli.js specs/features/BL-1695-the-bl1538-closure-fixture-copies-the-closure-not-the-whole-scripts-tree.feature`:
     all ok.
  3. The parcel's evidence quotes the reproduction attempt's outcome
     verbatim (the assertion line, or the statement that one run under
     load stayed green with the load figures).
  4. `git diff main...HEAD --name-only` names only the property file, the
     feature, the handler and evidence.
  5. After landing: `bb swarmforge/scripts/standing_red_register_cli.bb .`
     reports `"unowned":[]` and no row names this file (REGISTER_ROW_RETIRED,
     BL-1631).

