source: |
  Found during BL-723 (pilot-tonight quality review), hardener viewpoint
  pass, 2026-07-30/31. `specs/pipeline/steps/bl694ResidualAllowlistSteps.js:75`
  registers a step handler for
  `/^a different file with the same basename at (?:at )?a non-stage path
  under the backlog$/`, but
  `specs/features/BL-694-residual-word-allowlist-survives-stage-moves.feature`'s
  Scenario Outline 04 only has two `Examples:` rows ("outside the
  backlog", "elsewhere in the tree") — no "a non-stage path under the
  backlog" row exists. The step regex is registered but never matched or
  executed by any scenario.

  This is dead test code hiding an untested behavior claim: that a
  basename match under a non-stage `backlog/` path (e.g.
  `backlog/topics/BL-624-....yaml`, which shares a basename with a
  grandfathered ticket file but lives under `backlog/topics/`, not
  `backlog/active|paused|hold/`) is correctly NOT excused by
  `BACKLOG_STAGE_RE`/the basename allowlist. Checked
  `onboarderResidualAllowlist.js`'s own `isAllowlisted` (its
  `BACKLOG_STAGE_RE` requires `^backlog/(active|paused|hold)/`, so a
  `backlog/topics/...` path should correctly fail the regex and fall
  through to the exact-path check) and the BL-684 residual-word rename
  guard's own test suite — neither has any test coverage for this
  specific case either. The
  underlying regex logic looks correct by inspection, but the specific
  scenario meant to prove it (this ticket's own review-04 handler) is
  provably unreachable, so the claim rides on inspection alone, not on
  any executed test.

notes: |
  BL-723 hardener verdict on BL-694: not-on-par (independent finding; the
  three prior seats read the acceptance suite as exercising "the real
  scanUnexpected/isAllowlisted functions across all 5 scenarios" and
  found only a "minor dead-code nit" — an unexercised step registration —
  but did not connect that dead code to an actual UNTESTED behavior claim
  worth a defect, treating it as cosmetic).
  Linked pilot-process defect: BL-753.

notes: |
  2026-08-22, specifier: re-verified LIVE at HEAD and given an acceptance
  contract. bl694ResidualAllowlistSteps.js:75 still registers the "non-stage
  path under the backlog" pattern, and Outline 04 in
  specs/features/BL-694-residual-word-allowlist-survives-stage-moves.feature
  still has only the "outside the backlog" and "elsewhere in the tree" rows.
  The handler is still unreachable. Confirmed as filed.

  Scope note: scenario 03 closes the hole for THIS handler file only. A
  repo-wide "no unreachable step handler" gate is real and separate work and
  is deliberately not scoped here — the runner throws only on a step with no
  handler, never on a handler with no step, so nothing catches this class
  anywhere else either.

  IR-DRY: the checker flags "the scan reports no unexpected match" and "the
  scan reports the different file as an unexpected match" as possible
  synonyms. Reviewed and deliberately kept — they are opposite assertions,
  and both texts already exist verbatim in BL-694's own feature file.

description: |
  ## What

  Add the missing `Examples:` row to Scenario Outline 04 in
  `specs/features/BL-694-residual-word-allowlist-survives-stage-moves.feature`
  so the already-written step handler for "a non-stage path under the
  backlog" (e.g. `backlog/topics/`) actually runs, confirming a basename
  match there does NOT inherit the stage-move exemption.

  ## Acceptance

  - The new Examples row exercises the registered-but-dead step handler.
  - `node specs/pipeline/cli.js
    specs/features/BL-694-residual-word-allowlist-survives-stage-moves.feature`
    passes with the new row included.

qa_e2e_procedure: |
  From the repo root:

  1. Baseline the dead handler on the PRE-fix tree: confirm
     bl694ResidualAllowlistSteps.js registers the "non-stage path under the
     backlog" pattern and that BL-694's Outline 04 Examples table has only
     "outside the backlog" and "elsewhere in the tree". The handler must be
     unmatched by every rendered step.
  2. Run `node specs/pipeline/cli.js
     specs/features/BL-694-residual-word-allowlist-survives-stage-moves.feature`
     on the parcel. It must pass with the new row included, and the run must
     execute the previously-dead handler at least once.
  3. Run the BL-752 acceptance feature. Scenario 01 must report a file at a
     backlog/topics path sharing a grandfathered basename as an unexpected
     match.
  4. Prove non-vacuity: in a scratch checkout, relax BACKLOG_STAGE_RE in
     onboarderResidualAllowlist.js to ^backlog/ and re-run. Scenario 01 must
     go RED. Restore.
  5. Prove the fix did not over-tighten: scenario 02 must still excuse the
     grandfathered file at its own stage path, and BL-694's existing
     scenarios 01-03 and 05 must stay green.
  6. Scenario 03 must fail if a handler is added to
     bl694ResidualAllowlistSteps.js with no matching rendered step - add a
     throwaway one, confirm red, remove it.
