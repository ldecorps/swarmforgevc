approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: the walk's fail-loud
  contract survives - a spawn target it genuinely cannot resolve is still
  reported, never dropped (scenario 03); and the green is never earned by
  hiding a site from the walk (rewriting `["bash" x ...]` so the runtime
  literal is no longer first, or building the vector where the scan does
  not look). FIRM: the spawn edges still land where they do today -
  scenario 02 pins the census: start_handoff_daemon.sh and close_ticket.sh
  in the walk's non-bb record, commit_integrity_cli.bb in the closure by
  a spawn edge from chase_sweep_lib.bb, expedite_cli.bb by a spawn edge
  from handoffd.bb. Direction, not mandate: the resolver already reads
  three shapes (a bare literal, a literal wrapped in path plumbing, a
  zero-arg same-file helper) and handoffd.bb's other spawns use the third
  (`(swarm-handoff-script)`), so the three let-bound sites can simply take
  that shape; teaching the resolver a let-bound-literal shape instead is
  acceptable if master_checkout_drift_lib_test_runner.bb gains the cases.
  The fourth site is different in kind: `runner` is the
  EXPEDITE_STAGE_RUNNER test seam, a runtime value with no literal
  anywhere - either the seam is re-expressed so the production spawn is
  the literal `claude` invocation (tests shadow `claude` on PATH, which 13
  existing tests and handlers that set the env var would have to follow),
  or the site declares itself dynamic in a form the resolver reads and the
  runner asserts (a declared dynamic target with a reason is resolved;
  an undeclared one is still unresolved). The architect rules within the
  parcel; the constraint is only that "declared dynamic" can never be
  earned by accident. Minted by the specifier on the coder's unowned-red
  note of 2026-09-11 00:10Z from the BL-1478 parcel; bisect and reach map
  in backlog/evidence/BL-1524-BL-1525-BL-1526-specifier-unowned-red-bisect-20260911.md.

invariants:
  - The closure walk never silently drops a spawn edge - every bb/bash/sh/zsh spawn vector in a reached file is either resolved to a file, recorded as a non-bb script, or reported as unresolved by name (BL-1022, restated for the shapes this ticket adds).

description: |
  ## What is wrong

  `bb swarmforge/scripts/test/daemon_cycle_guard_lib_test_runner.bb` on
  main 7c5e39a8b4 prints three FAIL lines and exits 1. This ticket owns the
  SECOND:

  ```
  FAIL bl1022: every spawn target in the daemon's closure resolved - an unresolvable one fails loudly, never silently
    expected: []
    actual:   [{:from "handoffd.bb", :target "launcher"} {:from "handoffd.bb", :target "script"}
               {:from "chase_sweep_lib.bb", :target "cli"} {:from "expedite_cli.bb", :target "runner"}]
  ```

  `master_checkout_drift_lib.bb`'s `extract-spawn-targets` scans every
  `["bb" ...]` / `["bash" ...]` / `["sh" ...]` / `["zsh" ...]` vector in a
  reached file and resolves the second element through
  `resolve-spawn-target`: a string literal naming a `.bb` (followed) or
  `.sh`/`.bash`/`.zsh` (recorded as non-bb), a literal inside path
  plumbing, or a zero-arg helper defined in the same file whose body
  carries the literal. Anything else is reported - "a skipped target is
  the same class of blind spot one level up". `git bisect` from
  3d5346c256 (green) with this assertion as predicate names
  **306509a6b0** (2026-08-25, "fix(BL-1139): auto-repair durable
  master-checkout daemon-script drift") as the first red: it added
  `(let [launcher (str (fs/path ... "start_handoff_daemon.sh"))] ...
  (sh! ["bash" launcher root]))` to handoffd.bb - a let-bound local the
  resolver does not follow. Three more sites of the same shape have
  accumulated. Today, main 7c5e39a8b4:

  | site | target | what it really is |
  |---|---|---|
  | `handoffd.bb` ~2668 `defer-handoffd-bounce-after-drift-repair!` | `launcher` | let-bound `start_handoff_daemon.sh` |
  | `handoffd.bb` ~2401 | `script` | let-bound `close_ticket.sh` |
  | `chase_sweep_lib.bb` ~2372 | `cli` | let-bound `commit_integrity_cli.bb` |
  | `expedite_cli.bb` ~756 `stage-cmd` | `runner` | the `EXPEDITE_STAGE_RUNNER` env seam: nil in production (the stage spawns `claude -p`), a stub script under test |

  Nobody owned it because nothing runs the standing bb suite as a gate
  (see BL-1524). BL-1364's architect and hardener saw it on 2026-09-05
  and misattributed it to BL-1331.

  ## What this ticket delivers

  1. The three let-bound sites resolve. Simplest: each takes the zero-arg
     same-file helper shape the resolver already reads and handoffd.bb
     already uses for `swarm-handoff-script` - e.g. `(defn-
     start-handoff-daemon-script [] (str (fs/path ... "start_handoff_daemon.sh")))`
     spawned as `["bash" (start-handoff-daemon-script) root]`. Extending
     the resolver to follow a let-bound literal is equally acceptable if
     `master_checkout_drift_lib_test_runner.bb` gains a case per new shape
     and the fail-loud case (scenario 03) still holds.
  2. The expedite seam site resolves or is honestly declared, per the
     architect's ruling in the parcel (approval_context). Either way
     `stage-cmd`'s production behaviour (spawn `claude -p ...`) is
     unchanged and the existing seam consumers keep passing (the census
     of `EXPEDITE_STAGE_RUNNER` users on main 7c5e39a8b4: 4 shell tests,
     6 step handlers or their libs, 3 property tests -
     `grep -rl EXPEDITE_STAGE_RUNNER swarmforge/scripts/test specs/pipeline/steps extension/test`).
  3. The runner's bl1022 assertion passes on the parcel commit with the
     walk's `:unresolved` empty, and scenario 02's census pinned.
  4. **Register rows (this ticket owns them):** `backlog/standing-reds.tsv`
     carries a `bb` row for
     `swarmforge/scripts/test/daemon_cycle_guard_lib_test_runner.bb` and
     an `acceptance` row for
     `specs/features/BL-1031-bounded-chokepoint-covers-the-spawn-reachable-subtree.feature`
     (its scenario 01 drives the same runner and is red for the same
     three reasons: pass 6 / fail 1 on main), both naming BL-1526. This
     ticket `depends_on` BL-1524 and BL-1525, so it is the LAST of the
     three to land and the one whose land turns both files green: QA
     removes both rows in that land (register invariant 2).

  ## Not in scope

  - The load-closure strays (BL-1524) and the spawn-subtree debt
    (BL-1525). By the time this ticket promotes both have landed; if
    either FAIL line still prints on this parcel's commit, that is a
    regression to bounce on, not this ticket's to absorb.
  - Changing which files the daemon spawns. This is about the walk
    SEEING every edge it already has.

  ## Source

  Coder unowned-red note 2026-09-11 00:10Z (BL-1478 parcel). Specifier
  reproduction, bisect and reach map:
  `backlog/evidence/BL-1524-BL-1525-BL-1526-specifier-unowned-red-bisect-20260911.md`.

