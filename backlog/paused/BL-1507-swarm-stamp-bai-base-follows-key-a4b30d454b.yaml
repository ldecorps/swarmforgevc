description: |
  ## What

  An operator hotfix is live on main and has never been through a gate.
  This ticket is that gate: a REVIEW ticket, not a rewrite ticket -
  confirm or refute, and open narrow follow-ups for anything found.

  ## The failure it fixed

  `swarmforge.sh` emits one of two b.ai guard blocks into a role's launch
  script: the host-sniff variant when the window's CLI names api.b.ai
  (base set unconditionally), or the opt-in variant when
  `SWARMFORGE_USE_BAI=1` is honoured without it. The auto-provisioned
  coordinator has no such CLI, so it got the opt-in variant, which
  exported `OPENAI_API_BASE="${OPENAI_API_BASE:-https://api.b.ai/v1}"`.
  When `swarm ensure` respawned that pane at 10:54 on 2026-09-09 the
  respawner's shell still carried `SWARMFORGE_USE_CEREBRAS=1` and
  `OPENAI_API_BASE=https://api.cerebras.ai/v1` (`provider_respawn_env_lib`
  forwards every `SWARMFORGE_USE_*` it sees, and
  `provider_compat_lib/resolve-openai-compat` checks Cerebras first), so
  the KEY switched to b.ai while the BASE stayed Cerebras, and aider
  failed every turn with `OpenAIException - Wrong API Key`.

  ## What landed (files to review)

  - `swarmforge/swarmforge.sh`: the opt-in `bai_guard` now exports
    `OPENAI_API_BASE=https://api.b.ai/v1` and `OPENAI_BASE_URL=...`
    unconditionally (10 lines changed).
  - `swarmforge/scripts/test/test_alternate_runtime_launch.sh` case 11:
    opt-in launch with a stale Cerebras base; the guard block, extracted
    and executed in isolation, must yield the b.ai key AND base. Green on
    main 60623ebf02 with cases 1-10 unchanged (specifier, 2026-09-10).

  ## Review goals

  1. Confirm both guard variants agree (scenario 01, rows 1-2) and that
     the flag unset leaves the environment alone (row 3).
  2. Confirm the secret never reaches the launch script file (scenario
     02) - the existing case 10/11 discipline.
  3. Refute-worthy question for the architect, evidence only: the
     Cerebras and Perplexity opt-in guards above the b.ai one keep the
     `${OPENAI_API_BASE:-...}` shape the hotfix removed for b.ai. "A key
     and an endpoint naming different providers is never what the flag
     meant" applies to them too; the respawn env forwarding that put a
     stale opt-in into the coordinator's shell is the root, and a
     follow-up may want either every opt-in guard base-follows-key or the
     respawner to forward only the opt-in in force. Name it in evidence
     as a follow-up; do not fix here.

  ## Scenario notes for the coder

  - Scenarios 01-02 are case 11's shape: `zsh -f` sources `swarmforge.sh`
    against a fixture root, `launch_role` writes
    `.swarmforge/launch/<role>.sh`, the handler extracts the guard block
    with the same awk and executes it in isolation with the stale base
    exported. Scenario 01's second row uses a window line carrying
    `--openai-api-base https://api.b.ai/v1` (the host-sniff variant, case
    10's shape).
  - The last scenario's handler reads `backlog/hotfix-ledger.yaml` for the
    row `commit: a4b30d454b` and asserts `human_decision` is null;
    BL-1346's handler is the precedent.

