id: BL-980
title: "Pipeline board: each RECENTLY CLOSED line shows how long ago the ticket closed (966 effective-backlog (10min ago)), read from the durable doneClosedAtMs record the section already sorts by"
milestone: M8
type: feature
status: todo
epic: pipeline-board
human_approval: pending
priority: 70
direction: human-requested
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-980-recently-closed-elapsed-time.feature

invariants:
  - "An age is never fabricated: a line carries a parenthetical age only when a durable closure instant is recorded for that ticket, and the age is computed from that record - never from a file mtime, which a rewrite would silently rejuvenate."

description: >
  What and why: the board's RECENTLY CLOSED section lists id + slug with
  no sense of when anything closed, so a ticket closed ten minutes ago and
  one closed yesterday read identically on a phone. The human, reading
  the live board on 2026-08-20 ~08:42, asked for a relative elapsed time
  on each line - verbatim example: "966 effective-backlog (10min ago)".

  How (direction, not mandate): the data is already there and already
  trusted. conciergeTick.ts keeps TickState.doneClosedAtMs - a durable,
  monotonic per-ticket closure instant, stamped once when a ticket is
  first seen in backlog/done/ and deliberately never restamped (its own
  docstring explains why: coupling it to the icon-sync retry diff would
  rejuvenate a ticket every tick its completion message failed to route)
  - and recentlyClosedItems already SORTS the section by it. It is simply
  not carried through to the rendered line: PipelineBoardListSourceItem
  and PipelineBoardListEntry have no field for it. Carry it through and
  render the suffix.

  The ladder, locked here (the intake left "confirm the exact ladder" to
  the specifier): under 1 minute reads "just now"; under an hour,
  "Nmin ago" (the human's own unit); under a day, "Nh ago"; otherwise
  "Nd ago". Scenario 01's table pins every boundary.

  Note there are already several relative-time formatters in the
  extension (concierge/topicTitleAge.ts, concierge/residentPaneSpy.ts,
  bridge/residentSpyUiHtml.ts) with different ladders and different
  wording, for different surfaces. Reuse one only if it fits this ladder
  exactly; otherwise this is a fourth and the cleaner should decide
  whether they consolidate - do not bend this surface's wording to reuse
  a formatter written for another.

constraints: >
  Firm lines:

  - RECENTLY CLOSED lines ONLY. PARKED, AWAITING APPROVAL, ROOT INTAKE
    and the grid captions gain no age suffix - the human's addendum was
    explicit about this, and scenario 04 pins it.
  - The rest of the section's chrome is unchanged: same header, same
    PIPELINE_BOARD_RECENTLY_CLOSED_MAX bound, same ordering, same
    id + slug content ahead of the suffix.
  - Do not introduce a new closure-time source. doneClosedAtMs is the
    record; a ticket with no entry in it gets NO suffix rather than a
    guessed age from a file timestamp (invariant 1, scenario 02).
  - Both render paths - the plain-text content signature and the HTML
    Telegram message - must agree; BL-956's hardener note is explicit
    that these are near-duplicates by design and that the moment they
    diverged was a bounce.
  - The suffix costs characters inside PIPELINE_BOARD_MESSAGE_MAX_LENGTH:
    keep it bounded (the ladder above is at most 9 chars) and confirm
    the link budget still holds.
  - Unit AND acceptance updated in the same parcel (BL-949's lesson).

qa_e2e_procedure: >
  1. Scenario 01: render with a pinned clock and one closed ticket per
     table row - assert the exact suffix at every boundary, including
     59999/60000 ms and 86399999/86400000 ms.
  2. Scenario 02: a closed ticket absent from doneClosedAtMs - the line
     renders with no parenthetical at all (not "(unknown)", not "(0min
     ago)").
  3. Scenario 03: recorded closure 2h before the render instant, backlog
     file rewritten 1 minute before it - the line still reads "(2h ago)".
     This is the invariant's real test; a mtime-based implementation
     passes every other scenario and fails this one.
  4. Scenario 04: each of PARKED / AWAITING APPROVAL / ROOT INTAKE /
     grid captions - no parenthetical age anywhere in those sections.
  5. Both render paths: assert the plain-text body and the HTML body
     carry the same suffixes for the same input.
  6. Live confirmation: post one real board and check a phone screenshot
     against the human's example shape "966 effective-backlog (10min
     ago)". Attach it to the parcel.

