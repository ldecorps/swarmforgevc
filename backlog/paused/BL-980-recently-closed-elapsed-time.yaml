approval_context: >
  One call to say the word on: the exact ladder. Locked here as
  "just now" under a minute, then "Nmin ago", "Nh ago", "Nd ago" -
  your example ("10min ago") fixed the minutes unit; the rest is the
  specifier's call and is easy to change now, awkward later. Also
  confirming the source: the durable doneClosedAtMs record the section
  already sorts by, so an age can never rejuvenate when a backlog file
  is rewritten - and a ticket with no recorded instant gets no age at
  all rather than a guess.
