description: |
  ## Status: hotfix 94d434ae2a landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  BL-2073's land (3a65a6e5ab, 2026-10-08) added a `property_runners` row
  to qa-gather's checklist (extension/src/quality/qaGather.ts, between
  `properties` and `acceptance`), on purpose and asserted by BL-2073's own
  feature. BL-1554's scenario 01 ("the report lists the fixed checklist in
  its fixed order") still named eight checks, so it failed on main: 13 of
  14. No register row named it; QA and the coder of BL-2075 each recorded
  it as pre-existing.

  ## What the hotfix changed

  94d434ae2a, one line: the step now reads `stragglers_before, sibling,
  register, wiring, unit, properties, property_runners, acceptance,
  stragglers_after`. The handler (bl1554QaGatherReportSteps.js) reads the
  list from the step text, so no handler changed.

  ## What the coder does (all of it)

  1. Read `git show 94d434ae2a` and confirm the list matches the `id`
     order in qaGather.ts's checklist.
  2. Run the two features in qa_e2e_procedure once each, output under
     tmp/.
  3. Write backlog/evidence/BL-2079-coder-<date>.md with the result and
     commit it.

constraints: >
