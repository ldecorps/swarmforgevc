approval_context: >
  A new feature file is authored here, so it needs a human tap. Be aware of
  what this ticket does and does not claim.

  It does NOT claim to have reproduced the red. QA's counterexample
  ([prefixed, false], seed -436553632, path 12) was replayed directly - the
  exact unregistered-target case, 30 iterations idle and 30 under load - and
  passed every time. Three other hypotheses were measured and DISPROVED (see
  notes). What is left is two mechanisms that cannot be separated without the
  full lane, and the point of the fix is that it closes BOTH: an
  identity-checked liveness answer is correct whether the wrong answer came
  from a zombie or from a reused pid.

  So the honest framing is: a test that asks a question it does not mean is a
  defect on its own terms, and fixing it is worthwhile even if the flake
  turns out to have a third cause. If you would rather hold this until someone
  captures the failing assertion TEXT from a real lane run (which would say
  which of the three assertions fired and halve the search), that is a
  reasonable call - I asked QA for the counterexample and got it, and asking
  for the assertion message is the natural next request.

description: |
  ## What is wrong

  `extension/test/bl857TunnelOwnershipInvariants.property.test.js:34`:

      function isAlive(pid) {
        try { process.kill(pid, 0); return true; } catch { return false; }
      }

  Every liveness assertion in the file routes through it (lines 149, 254, 261,
  304, 306). `process.kill(pid, 0)` answers *"does some process with this pid
  exist and can I signal it?"* The invariants ask *"is THIS fixture still
  running?"* Those diverge in two ways, both of which get likelier the busier
  the host is:

  1. **Zombie.** The reap SIGKILLs a fixture whose `bash -c` launcher has
     already exited, so the fixture is orphaned and its corpse waits on a
     subreaper. Until it is collected, `kill(pid, 0)` still succeeds - the
     process is dead and the test is told it is alive.
  2. **Pid reuse.** A full property-lane run spawns thousands of processes.
     A pid the reap just freed can be handed to an unrelated one, and the
     check then answers about that process instead.

  Both produce the SAME failure: `isAlive(targetPid)` returns `true` where the
  invariant requires `false`. That is exactly QA's counterexample
  `[prefixed, false]` - `registerTargetOwner: false`, so the target is
  unregistered and MUST be reaped.

  ## The production reap is not implicated

  Worth stating plainly for whoever picks this up: nothing here suggests
  `tunnel_ownership_lib.sh` reaps incorrectly. The defect is in how the test
  asks its question. If the fix makes the red persist, THAT is the signal the
  reap itself is at fault - and the coder should stop and report rather than
  weakening the assertion.

  ## How (direction, not mandate)

  Decide liveness by identity, not by a bare pid signal: confirm the pid is
  both signallable AND still the fixture (its command line still carries this
  run's unique tunnel name), and treat a zombie as gone. `/proc/<pid>/cmdline`
  is Linux-only; `ps -o args= -p <pid>` is POSIX and works on both supported
  OSes, which is the same portability lesson BL-1061 already paid for in this
  exact file.

  Explicitly NOT the fix: a sleep or a retry window before asserting. That
  trades a fast wrong answer for a slow one, is still wrong under enough load,
  and taxes every passing run - the same reasoning `waitForFileSync.js`
  records for BL-1063.

qa_e2e_procedure: >
  1. Run the whole file in the full property lane (`npm run test:properties`),
     not solo and not with a -t filter - the filtered form is what made every
     spec-time reproduction attempt inconclusive. Invariant 3 must be green
     across several consecutive full runs.
  2. Replay QA's exact counterexample against the fixed helper: seed
     -436553632, path 12, `[prefixed, false]`.
  3. Prove the identity check is not vacuous: hold a fixture as a zombie (kill
     it while something delays its reaper) and confirm the helper reports it
     gone while a bare `kill(pid,0)` still reports it alive.
  4. Confirm invariants 1 and 2 in the same file still pass - they share the
     helper and must not regress.
  5. Confirm every scenario resolves to a registered step handler.

