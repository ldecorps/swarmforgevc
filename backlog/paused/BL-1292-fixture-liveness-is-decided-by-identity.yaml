notes: |
  ## Measured, and what was ruled OUT

  Full triage record: `backlog/evidence/BL-1287-bl857-inv3-triage-20260830.md`
  (written before the counterexample arrived) plus the replay below.

  Reproduction attempts, ALL GREEN - this ticket does not rest on a reproduction:

  - inv3 solo, idle host: 1 run.
  - inv3 under 28 CPU burners: 3 runs.
  - inv3 concurrent with bl787 in one fork pool: 3 runs.
  - QA's exact `[prefixed, false]` case replayed directly against the real
    `reap-orphans` (target unregistered, prefixed bystander): 30 iterations
    idle, 30 under load. 0 failures.

  DISPROVED, so nobody re-walks them:

  1. *The fixture is not visible to `pgrep -f` yet when the reap runs.*
     60/60 hits, zero misses, on the exact spawn shape.
  2. *A sibling suite kills bl857's fixtures.* Every kill site in the three
     tunnel property files and in `stop_ancillary_services.sh` is scoped to a
     pidfile or a tunnel name. bl857's own module-load sweep is the only
     host-wide killer and fires before its own tests.
  3. *`old-<target>` is selected by a reap scoped to `<target>`.* It is not:
     `run old-x` does not contain `run x`. The prefixed shape cannot make the
     BYSTANDER assertion fire, which is why this ticket reads the
     counterexample as pointing at the TARGET assertion.

  ## Relationship to BL-1287 - different defect, same file family

  BL-1287 fixes `leakedFixtureTunnelPids` selecting a live sibling's fixtures.
  That is a real, MEASURED defect found while triaging this flake, but it bites
  in the direction bl857-kills-bl787 and is not this. Neither ticket closes the
  other; they can land in either order.
