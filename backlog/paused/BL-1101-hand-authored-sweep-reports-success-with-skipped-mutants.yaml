id: BL-1101
title: "A hand-authored mutation sweep certifies mutants it never ran: expedite_mutation_sweep.sh's only failure branch reads the survivor list, so a stale anchor skips silently while the run prints ALL MUTANTS KILLED and exits 0"
milestone: M8
type: defect
severity: medium
# medium, not high: the false green is real and already happened once (BL-1030),
# but it is contained to ONE fallback gate over ONE Babashka lib, it needs a
# rewrite of the anchored code to trigger, and its worst outcome - an unhardened
# behavior forwarded - is recoverable and still faces architect and QA. Not low:
# a gate that prints ALL MUTANTS KILLED without running the mutants is evidence
# that is not merely missing but actively false, which is the shape BL-1030
# itself was rated high for; it lands lower here only on blast radius.
status: todo
assigned_to: coder
epic: swarm-reliability
priority: 35
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1101-hand-authored-sweep-reports-success-with-skipped-mutants.feature

human_approval: pending
approval_context: >
  One decision needs sign-off: whether a skipped mutant HARD-FAILS the sweep
  (the direction below - non-zero exit, no success line) or merely prints a
  louder warning while the run still passes. The argument for hard failure is
  that a skipped mutant produced no evidence at all, so a run containing one
  has not gated the behaviour it claims to gate; the argument for a warning is
  that a hardener mid-rewrite would hit a red they must clear before they can
  finish, which is friction on the exact pass most likely to trigger it. What
  is firm either way: the run must never print ALL MUTANTS KILLED while any
  mutant was skipped, and it must name the skipped mutants by label so the
  anchors can be repaired.

invariants:
  - "A run in which any mutant did not execute never reports success - neither the ALL MUTANTS KILLED line nor a zero exit."
  - "Every mutant that did not execute is named by its label in the run's output, so the anchors that went stale are identifiable without re-reading the script."
  - "A failing run still restores the working copy it mutated, uncommitted edits included - the new failure path never short-circuits the restore."

description: >
  WHAT. swarmforge/scripts/test/expedite_mutation_sweep.sh applies each of its
  41 mutants by replacing a literal fragment of expedite_lib.bb. When that
  fragment is absent the mutant is skipped (line 55, "skip <label> (anchor not
  found)") and `skipped` is incremented - but `skipped` then reaches no
  conditional. The only failure branch is the survivor list at line 181, so a
  run with skipped mutants prints "ALL MUTANTS KILLED" at line 186 and exits 0.

  WHY IT MATTERS. The anchors are literal fragments of the code under test, so
  the pass that rewrites a guard is exactly the pass whose covering mutants go
  stale - the gate weakens itself precisely when it is being exercised on new
  code. A skipped mutant is not a mild kill: it produced no evidence at all,
  and the summary line reports it as though it had produced the strongest
  evidence available. Observed 2026-08-23 during BL-1030's hardening pass,
  which rewrote the forbidden-stop-flag guard those mutants cover; the hardener
  caught the skip by reading the counts line, re-anchored three mutants, and
  reached 43 killed / 0 skipped. Nothing in the tool would have surfaced it.

  CONSTRAINTS. Scope is the one script. The sibling
  swarmforge/scripts/test/expedite_prove_nonvacuity.sh already handles an
  anchor miss correctly (returns 1, increments `bad`, exits non-zero at lines
  30-33 and 98-101) and needs no change - read it as the reference shape rather
  than refactoring the two into a shared helper. Target stock macOS /bin/bash
  3.2: the script runs under `set -uo pipefail` and expanding an empty array as
  "${arr[@]}" is an unbound-variable error there.

  HOW (direction, not mandate). Make `skipped` load-bearing in the same place
  `survived` already is: report the skipped labels the way SURVIVORS are
  reported, and let any non-empty skip list fail the run. The restore path is
  a `trap cleanup EXIT`, so an added early exit must not be a path that bypasses
  it.

qa_e2e_procedure: >
  In a scratch worktree: (1) run `swarmforge/scripts/test/expedite_mutation_sweep.sh`
  unmodified and confirm it exits 0, prints skipped=0 and ALL MUTANTS KILLED.
  (2) Rename an identifier in swarmforge/scripts/expedite_lib.bb that one
  mutant's anchor quotes (e.g. a fragment of the forbidden-path or
  forbidden-command anchors), leaving behaviour intact so the suites stay green.
  (3) Re-run the sweep: it must exit non-zero, must NOT print ALL MUTANTS
  KILLED, and must name the skipped mutant's label. (4) Confirm
  `git diff swarmforge/scripts/expedite_lib.bb` still shows exactly the edit
  from step 2 and no mutant residue - the failing run restored the working copy.
  (5) Revert step 2 and confirm the sweep is green again.

notes: >
