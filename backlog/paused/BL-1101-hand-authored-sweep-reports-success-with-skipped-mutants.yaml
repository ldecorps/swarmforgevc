  The rule generalizes to any sweep hand-authored fresh under the BL-638 /
  no-wired-tool fallback; this ticket hardens the one committed script, because
  a prompt line is guidance and an exit code is a gate. The rule generalizes to
  any hand-authored sweep; this ticket is the gate for the one committed script.
  IR-DRY on the feature file reports one medium possible-synonym finding pairing
  the pass Then ("exits zero and reports ALL MUTANTS KILLED") with the fail Then
