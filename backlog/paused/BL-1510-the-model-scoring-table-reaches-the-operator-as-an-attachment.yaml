source: |
  backlog/INTAKE-model-score-report-and-resilience-tiered-confs.md
  (operator, 2026-09-09), section 1, split 1:N by the specifier on
  2026-09-10 into BL-1509 (the upload + CLI) and BL-1510 (this: the
  report). Operator directives, verbatim:

  > ## 1. A properly formatted attachment of current scoring, all seats x all models
  >
  > Full `model_steward_cli.bb role-matrix <role> --include-uncertified` pull
  > across all 7 scored roles, taken 2026-09-09 (`coordinator` is NOT part of
  > this - the model steward does not track it as a role-matrix role at all;
  > see the coordinator note at the bottom). Certified models are marked *;
  > uncertified (candidate) are plain.

  > Full registry also carries uncertified candidates never role-matrix-scored
  > at all: `alibabacloud/qwen3.8-flash`, `cerebras/llama-3.3-70b`,
  > `mixai/mimo-v2.5`, `nvidia/nemotron-3-ultra-550b-a55b`,
  > `tencentcloud2/hy3`, `moonshotai/kimi-k3` (certified but also unscored on
  > any role) - worth a `role-matrix ... --include-uncertified` re-pull at
  > delivery time in case new trials landed between now and then.

  > **Deliverable**: render the table above (re-pulled fresh, not copy-pasted
  > stale) as a properly formatted FILE ATTACHMENT delivered to the operator's
  > Concierge Telegram topic - not inline chat text.

  The intake's 2026-09-09 snapshot table (40 rows) is data the renderer
  re-derives; it is preserved in the archived intake, not restated here.

description: |
  ## What

  A headless CLI under `extension/src/tools/` (`render-model-scoring-report.ts`
  is the name the wiring anchor pins) that, for each of the seven scored
  roles, runs `bb swarmforge/scripts/model_steward_cli.bb role-matrix
  <role> --include-uncertified` (the runner is injected so tests feed
  fixture lines), parses the line shape the CLI prints today
  (`<provider>/<model> <score> <evidence>`, verified 2026-09-10), joins
  with the registry's certified set to mark `*`, renders one table file
  in the ruled format under the project's `tmp/` (or a `--out` path), and
  sends it to the Concierge topic through BL-1509's `sendDocument`.
  Columns: Role, Model, Score, Provider/plan (from the registry entry),
  Evidence. A footer line states the coordinator is not a role-matrix
  role. A `--no-send` flag renders only.

  ## Why

  The operator asked for the current scoring as an attachment, fresh at
  delivery, and named the two halves (a document upload; the report).

  ## Scenario notes for the coder

  - Scenario 01/02/03 drive the exported renderer with an injected steward
    runner returning fixture lines and an injected registry reader;
    scenario 02 changes one fixture score between two renders.
  - Scenario 04 injects the send function and asserts one call to the
    Concierge topic id from a fixture topic map, carrying the rendered
    bytes and filename.
  - The certified mark: read the registry the steward CLI reads
    (`model_steward_cli.bb status` or the registry JSON) - do not parse
    the mark out of prose.

  ## Not in scope

  - The upload mechanism (BL-1509). A /command trigger. Any change to
    the steward's scoring.

qa_e2e_procedure: |
  On the parcel commit, from the repo root with the front desk's token and
  chat in the environment:
  1. `node extension/out/tools/render-model-scoring-report.js .` -> the
     attachment appears in the Concierge topic; open it: seven roles, the
     coordinator footer, `*` on certified rows, evidence refs intact.
  2. `--no-send --out tmp/report.<ext>` writes the same file locally; diff
     it against a fresh `bb model_steward_cli.bb role-matrix coder
     --include-uncertified` for one role - every line present.
  3. `npm test` green; Stryker over the renderer with no survivors.
