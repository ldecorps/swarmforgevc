approval_context: >
  A new feature file is authored here, so it needs a tap, and one choice is
  posed - the attachment's file format - as ruling_options below: the
  intake says "properly formatted FILE ATTACHMENT" without naming a
  format. Markdown is recommended: Telegram previews it as text, git
  diffs it, and the steward's evidence references stay readable; CSV
  suits a spreadsheet; HTML renders the widest but is opaque in chat.
  FIRM: the scored roles are the steward's seven (specifier, coder,
  cleaner, architect, hardender, documenter, QA) and the coordinator is
  excluded with a footer saying why, exactly as the intake's coordinator
