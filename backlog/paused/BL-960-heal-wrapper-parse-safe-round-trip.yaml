id: BL-960
title: "BL-913's heal wrapper splices every Bash command into unparseable bash (heredocs/literal parens become silent-partial syntax errors; QA stalled 50 minutes) and misdirects the missing-root heal onto a pipeline's tail — parse-check with silent fail-open, byte-exact round-trip, then restore the disabled hook"
milestone: M8
type: defect
severity: medium
status: todo
epic: tool-miss-auto-heal
human_approval: approved
priority: 25
direction: operator-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-960-heal-wrapper-parse-safe-round-trip.feature

approval_context: >
  Two decisions ride this ticket. (1) Re-enabling the hook: the operator
  disabled the PreToolUse registration on 2026-08-19 (3bac496ec) with the
  stated condition "Re-enable ONLY once the wrapper is parse-checked (bash -n)
  with fail-open to the untouched original"; this ticket treats meeting that
  condition as authorization to restore the registration in the same parcel
  (enforced by required_wiring). Approving this ticket approves that
  restoration; if the hook should stay off longer, say so here. (2) The
  conservative missing-root-argv posture: on a pipeline or ;-sequence where
  the append target is ambiguous, the heal may decline and return the failure
  as-is rather than guess. Firm and not up for re-negotiation: the one-retry
  structure (BL-913 invariant 1) and BL-934's rm-visibility guarantees.

required_wiring:
  - "swarmforge/scripts/swarmforge.sh::\"PreToolUse\": [::the fix is not delivered while the hook stays disabled — the operator's disable comment (3bac496ec) gates re-enable on exactly this parse-checked fail-open, so the restored registration block must ride the parcel. This literal is the JSON key in the restored hooks block; it has zero occurrences in the disable-era file (comments mention PreToolUse only unquoted), so the gate cannot pass vacuously"

invariants:
  - "Every command text the hook hands back to Claude Code parses as bash (checkable via bash -n on the composed wrapper); a composition that does not parse fail-opens to the byte-untouched original command with no narration — BL-913's locked decision 5 (the first miss must not reach the model as a confession) extends to the wrapper's own composition failures"
  - "When no heal fires (first attempt succeeds, or the failure classifies :real-failure), wrapping is observationally invisible: exit code, combined output (stdout+stderr as one stream, i.e. compared against the unwrapped command run with 2>&1, trailing bytes included), and file side effects are byte-identical to the unwrapped command's — for every shape in the corpus (heredocs, literal/unbalanced parens, nested quotes, pipelines, ;-sequences)"
  - "A heal rewrite is applied only where its target is well-defined for the command's actual shape; where it is not (e.g. :missing-root-argv over a pipeline or ;-sequence), the failure returns as-is — a syntactically valid but misdirected re-run is a defect, not a heal"

description: >
  BL-913's PreToolUse:Bash hook rewrites every Bash command every role issues
  into a self-healing wrapper. build-healing-wrapper-command
  (swarmforge/scripts/tool_miss_heal_lib.bb) splices the original command as
  raw text into a command substitution — __sfh_out=$(<ORIGINAL> 2>&1) — once
  for the first run and once per miss-class clause (bash-clause), unescaped
  and never validated as parseable. Two defects, both confirmed by reading
  the source at HEAD (2026-08-19), not inferred:

  Defect 1 — any command that is valid on its own but cannot survive textual
  embedding in $( ... ) becomes a syntax error: heredoc bodies are swallowed
  (observed: a heredoc-written file landed truncated at 776 bytes), and a
  literal ")" in an argument closes the substitution early (observed
  verbatim: "syntax error near unexpected token `)'" then "syntax error near
  unexpected token `elif'" from the wrapper's own dangling scaffolding).
  Failure is silent-PARTIAL — the shell may execute part of the mangled
  command before dying, so state changes land while an error is reported,
  making blind retries unsafe. Live cost: QA sat 50 minutes "Ruminating"
  with no commit while every shell call failed, with an unactioned handoff
  queue behind it; the same failure hit the coordinator and hardener panes.

  Defect 2 — healed-command's :missing-root-argv branch appends
  "$__sfh_root" to the end of the ENTIRE command string, so for a pipeline
  or ;-sequence the argument lands on the final segment, not the program
  that produced the usage error. Captured live from the hardener's session:
  echo "---done---" "$__sfh_root".

  Wanted: the wrapper never hands Claude Code unparseable bash (parse-check
  the composition; on failure return the original untouched, silently); the
  no-heal path is observationally invisible for a hostile corpus (heredocs,
  literal parens, nested quotes, pipelines, ;-sequences — byte-exact output,
  exit code, and file side effects); the missing-root heal reaches the
  intended command or declines; and the hook registration disabled by the
  operator (swarmforge.sh write_claude_settings_file, 3bac496ec) is restored
  in the same parcel, since the disable comment's own re-enable condition is
  exactly this fix.

  How (direction, not mandate): a known constraint discovered while probing —
  $( ... ) strips trailing newlines and the closing printf '%s' never
  restores them, and 2>&1 merges streams at capture time — means the current
  capture strategy cannot meet invariant 2 as-is; capturing to a temp file
  and replaying it (or an equivalent that avoids re-parsing the original as
  spliced text) is a natural shape. For defect 2, restricting the heal to
  commands where the append is well-defined (single simple command) and
  classifying the rest as :real-failure fits the classifier's own stated
  conservative posture. Both are the coder's and architect's call; what must
  hold is the invariants.

constraints: >
  Out of scope:

  - BL-912's remaining slices (B command catalog, C rotation-identity text,
    D constitution line, Cursor surface) stay unminted per the epic's locked
    decision 3. This ticket repairs slice A's shipped behavior only.
  - No change to the one-retry structure (BL-913 invariant 1: the if/elif
    chain guarantees at most one healed re-run structurally) and no
    weakening of BL-934's guarantees (the worktree never appears as a
    literal extra argument; a genuine rm of the worktree stays visible).
    Their scenarios and suites stay green, unmodified in meaning.
  - Not redesigning the Bash tool's stream separation beyond the stated
    combined-stream fidelity; the wrapper already merges stderr into stdout
    by design and the model-facing contract keeps that.
  - Not repairing state corrupted during the 2026-08-19 incident (the
    truncated file was handled live) and no retro-sweep of past sessions.
  - The disable itself (3bac496ec) stays the operator's decision; this
    ticket restores the registration because the disable comment's stated
    re-enable condition is met by this fix — the human_approval gate on this
    ticket is where the operator can veto that.

qa_e2e_procedure: >
  From the repo root:

  1. Reproduce before the fix, from durable git data only: at the parcel's
     merge-base with main, bb -e the lib's build-healing-wrapper-command
     over (a) a quoted-heredoc command and (b) a command containing a
     literal ")" and pipe each composed wrapper into bash -n. Both must
     fail to parse — that is defect 1 in one command. For defect 2, compose
     the wrapper for a ;-sequence ending in an unrelated echo, force the
     missing-root-argv branch, and observe the root appended to the echo.
  2. At the parcel commit, run the Babashka suites
     (swarmforge/scripts/test/tool_miss_heal_lib_test_runner.bb,
     tool_miss_heal_acceptance_runner.bb, tool_miss_heal_lib_property_runner.bb)
     and the BL-960 acceptance scenarios; all green. Note the degraded gate
     honestly: Babashka has no mutation/CRAP/DRY wired (engineering rules) —
     record the fallback, do not imply those ran.
  3. Corpus fidelity live spot-check: for the quoted-heredoc row, run the
     command wrapped and unwrapped against separate fixture dirs and diff
     the written file and captured output byte-for-byte (cmp, not eyeball).
     The pre-fix truncation-at-776-bytes shape must be impossible.
  4. Fail-open silence: force a composition failure through the seam the
     coder provides and assert the hook's returned command is byte-equal to
     the original with no extra output on any stream.
  5. Misdirection guard: reproduce the live shape (failing CLI with a usage
     error, then '; echo "---done---"') and confirm the healed path never
     produces the root appended to the trailing echo.
  6. Wiring is real, not just the lib: the generated
     .swarmforge/launch/<role>.claude-settings.json once again registers the
     Bash-matched PreToolUse hook (test_tool_miss_heal_hook_wiring.sh
     green), and swarmforge.sh at the parcel commit contains the restored
     "PreToolUse": [ block — the required_wiring gate must have passed on
     substance, not on a comment.
  7. Non-vacuity: disable the parse-check call and confirm outline rows
     quoted-heredoc and literal-close-paren fail; restore. A fix whose
     heredoc row still passes without the parse-check is not testing the
     defect.
  8. Regression: BL-913 and BL-934 feature scenarios and suites green and
     unweakened; at most one retry still holds structurally.

notes: >
  Source: backlog root intake
  INTAKE-20260819-tool-miss-heal-wrapper-emits-invalid-bash.md (raised by
  the human operator ~19:55 local via screenshot of the QA session; filed by
  the coordinator, which hit the same failure twice itself), drained to
  backlog/archive/ in the same pass that minted this ticket. Relayed to the
  specifier by coordinator note 00_20260819T185919Z_000613.

  Probe findings recorded so nobody re-derives them: (1) the operator
  disabled the hook the same evening — swarmforge.sh's
  write_claude_settings_file now emits an empty hooks block, with the
  restore path and re-enable condition stated in the disable comment
  (commit 3bac496ec) — so the swarm is unblocked and this fix rides the
  NORMAL pipeline; the intake's BL-567 expeditor concern is resolved, no
  expeditor needed. (2) Both defect mechanisms confirmed in
  tool_miss_heal_lib.bb at HEAD: the raw splice appears in
  build-healing-wrapper-command AND per-clause in bash-clause; the
  :missing-root-argv branch is (str original-command " \"$__sfh_root\"").
  (3) Latent third gap found probing: $() strips trailing output newlines
  and printf '%s' never restores them, so even a benign command's output is
  not byte-faithful today — folded into invariant 2 rather than minted
  separately. (4) "PreToolUse": [ has zero occurrences in the disable-era
  swarmforge.sh, so the required_wiring literal cannot match vacuously
  (BL-874 lesson: literal, never a placeholder).

  Severity rationale (medium, deliberate): the live fault — a whole-swarm
  Bash-path failure with silent-partial state corruption — would be high or
  critical were the hook still enabled, but the operator's same-day disable
  mitigated it; nothing degrading runs today, and what remains blocked is
  the BL-912 feature's re-enable. Real but contained → medium.

  Epic: recorded on BL-912's tracker (decomposes_into + live follow-on
  note) in the same commit as this mint.

  2026-08-19 coordinator — human answer to the approval_context question
  above ("if the hook should stay off longer, say so here"). The operator
