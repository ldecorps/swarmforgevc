notes: |
  - [2026-08-28] specifier: this is the same structural shape as BL-1237,
    minted an hour earlier from a different report - a gate that is correct
    about the condition but fires on a role that cannot act on it, having
    accumulated the condition invisibly in the meantime. Worth watching for as
    a class rather than treating each instance as a one-off.
  - [2026-08-28] specifier: the daily counts above are first-appearance dates
    of the 39 files on main, taken per file from its adding commit, not
    estimated.
  - [2026-08-28] specifier: depends_on BL-1239 is a sequencing constraint, not
    a build dependency - this can be implemented in parallel, but must not
    LAND before the backfill or it refuses every parcel on inherited drift.
