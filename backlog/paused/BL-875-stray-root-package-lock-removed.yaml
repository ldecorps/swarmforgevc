id: BL-875
title: "DEFECT — a stray tracked package-lock.json at the repo root (no package.json beside it) turns any accidental root `npm install` into an unexplained one-line diff that rides along in the next commit"
milestone: M8
type: defect
severity: medium
status: todo
epic: code-quality-gates
priority: 140
direction: normal
mutation_cost: low
required_wiring:
  - "specs/pipeline/steps/index.js::bl875StrayRootPackageLockRemovedSteps::acceptance handler registered so the runner executes this ticket's scenarios"

acceptance: specs/features/BL-875-stray-root-package-lock-removed.feature.draft
human_approval: approved
approval_context: >
  Small slice, one call to sign off. The obvious fix — delete the file — is
  NOT sufficient on its own: npm recreates a lockfile when none exists, so
  deleting alone converts a tracked-diff trap into an untracked-stray trap.
  This ticket therefore pairs the deletion with a root-anchored .gitignore
  entry. Confirm you want the file gone rather than a real root package.json
  introduced; a root manifest is the other way to close this, and would be a
  bigger, different change.

source: |
  Rule proposal from hardener to specifier, 2026-08-10 (handoff
  50_20260810T152507Z_000081_from_hardender_to_specifier): "Repo root has a
  stray package-lock.json, no package.json. npm run from root fails ENOENT but
  rewrites lockfile name to $PWD basename. cd extension/ first; git restore a
  name-only root diff." Rationale given: "Hit this directly (GH-26 pass): a
  cd-mistake left an unexplained root package-lock.json diff that nearly rode
  along in the hardening commit."

  The proposal was ACCEPTED as a working convention and landed in
  local-engineering.prompt. This ticket is the durable fix behind it, so the
  convention can eventually be retired rather than remembered by seven roles.

invariants:
  - "extension/package-lock.json remains tracked — build_freshness_lib.bb keys its deployed-surface check on that exact path, so an unanchored ignore rule silently breaks build freshness."
  - "After this change, no npm invocation run from the repo root can produce a git-visible change there, tracked or untracked."

description: |
  ## What

  `/package-lock.json` is tracked, 91 bytes, and contentless:

      { "name": "swarmforgevc", "lockfileVersion": 3,
        "requires": true, "packages": {} }

  There is no `/package.json`. Nothing reads the root lockfile — a repo-wide
  grep on 2026-08-10 found references only to `extension/package-lock.json`
  (`swarmforge/scripts/build_freshness_lib.bb:65` and its test runner). It
  entered incidentally, not deliberately (`git log -- package-lock.json` shows
  it arriving via "Commit in-flight main changes before BL-144 merge").

  ## Why deleting it is not enough

  Verified on this host, 2026-08-10, in a scratch directory:

  | starting state | command | result |
  |---|---|---|
  | lockfile present, no package.json | `npm install` | exits non-zero, lockfile `"name"` rewritten to cwd basename |
  | lockfile present, no package.json | `npm run <script>` | exits ENOENT, lockfile untouched |
  | lockfile present, no package.json | `npm ci` | fails, lockfile untouched |
  | NO lockfile, no package.json | `npm install` | exits 254, **creates** an 88-byte lockfile named after the cwd |

  So the last row is the trap: deleting the tracked file just converts a
  tracked-diff hazard into an untracked-stray hazard — and an untracked stray
  is arguably worse, because "never delete what you did not create" then makes
  every other role hesitate over it.

  Note the hardener's report named `npm run` as the rewriting command; the
  actual culprit is `npm install`. That matters because the shared Engineering
  Rules explicitly instruct roles to run `npm install` after syncing main when
  package.json changed — so the hazardous command is one roles are told to run.

  ## Scope

  - Remove `/package-lock.json` from the index.
  - Add a root-anchored `/package-lock.json` entry to the root `.gitignore`.
    Anchored, not bare: a bare `package-lock.json` line would also ignore
    `extension/package-lock.json`.
  - Once this lands, the local-engineering.prompt convention added alongside
    it can be trimmed to just the `cd extension/` habit; the documenter should
    not remove it in this parcel, since the rule is still true for any
    worktree that has not merged the fix.

  ## Out of scope

  - Introducing a real root `package.json` / npm workspace. That is a
    plausible alternative fix and a much larger change; if the human prefers
    it, this ticket is superseded rather than amended.

  ## e2e QA procedure

  1. `git ls-files package-lock.json` returns nothing; `git ls-files
     extension/package-lock.json` returns the path.
  2. `git check-ignore -v package-lock.json` matches; `git check-ignore -v
     extension/package-lock.json` does NOT match (exit 1).
  3. From the repo root run `npm install`; it fails. Then `git status
     --porcelain` must be empty — this is the assertion that actually proves
     the trap is closed, and it fails if the ignore entry was forgotten.
  4. Run the extension unit suite from `extension/` and confirm the
     build-freshness tests still pass (guards the anchoring invariant).

  ## Making the contract executable (do this in THIS parcel)

  `acceptance:` above points at a `.feature.draft`. No `*.feature` glob and no
  runner picks up a `.draft`, so as written this ticket can cross all six
  stages with **zero** of its scenarios ever executed. That was correct while
  the slice was unbuilt; it is wrong the moment it is built — and this ticket
  IS the slice that builds it. In the SAME commit as the implementation:

  1. Rename `specs/features/BL-875-stray-root-package-lock-removed.feature.draft`
     to `BL-875-stray-root-package-lock-removed.feature` (drop the `.draft` suffix).
  2. Add `specs/pipeline/steps/bl875StrayRootPackageLockRemovedSteps.js`
     and register it in `specs/pipeline/steps/index.js` under exactly that
     name — the `required_wiring:` entry above pins it.
  3. Repoint this ticket's `acceptance:` at the `.feature` path.

  Do NOT rename the draft without landing the handler in the same commit: the
  acceptance runner THROWS on any scenario lacking a handler (BL-233), so a
  half-done rename turns the suite red for every other parcel in flight.

notes: |
  - Verified unreferenced before proposing removal; the only consumer of a
    path by that name is build_freshness_lib.bb, and it names the
    `extension/` copy explicitly.
  - IR-DRY reports one remaining `possible-synonym` (medium, 0.5) between
    `git tracking the path is <tracked>` and `git ignoring the path is
    <ignored>`. Reviewed and kept deliberately: they sit in the same Scenario
    Outline and assert two different git queries (`ls-files` vs
    `check-ignore`) that merely share sentence shape. Merging them would
    collapse the very distinction the anchoring invariant turns on. Do not
    "normalize" it away.

  ## Freshness + executable-contract amendment [2026-08-30] specifier

  Proactive Article 3.6 check before this ticket can be promoted, not a
  reaction to a gate. **Premise re-verified against the live tree and still
  holds** — see the amendment commit message for what was measured. **Not a
  zombie**: no implementation file carries this id, and no `bl875StrayRootPackageLockRemovedSteps`
  is registered in `specs/pipeline/steps/index.js`. CONFIRM PROMOTE, with the
  contract made executable as spelled out in `description:`.

  **Why this amendment was needed at all.** BL-761's acceptance-contract gate
  fails CLOSED only on an **ABSENT** `acceptance:` declaration. A declaration
  that is present but aims at a non-executable `.feature.draft` passes
  **vacuously** — every gate green, not one scenario run. Nine paused tickets
  carried this shape when it was found; this is one of them.

  **Only ONE `required_wiring:` entry, deliberately.** A second anchor on the
  production symbol being changed was considered and rejected: a symbol that
  already exists matches identically before and after the fix (vacuous), and
  pinning its post-fix contents would falsely block a coder who reaches the
  same behaviour by another route. The handler anchor is the honest gate — it
  guarantees the scenarios RUN, and the scenarios are what assert the
  behaviour. The handler name is fixed HERE, at mint, so the pattern is a
  literal that will exist rather than a placeholder the gate can never match
  (BL-874).
