source: |
  Coder note 002363 (2026-10-03 00:51Z), verbatim: "BL-1886:
  start_bridge_headless.sh host-root default is a /home/carillon literal".
  The coder's BL-1886 evidence (854687bb13), verbatim: "That should not
  exist. It is one user's home path inside a product script. On any other
  host, including the macOS host this swarm moved from, the fallback
  silently does nothing. On this host a root without a build silently
  borrows the live checkout's, which is how this test went
  green-for-the-wrong-reason and then red." It proposed deriving the
  default from the script's own checkout ($SCRIPT_DIR/../..) or having no
  default.
  Census at mint (main 132e655cba), counted with
  `git grep -nE '\$\{[A-Za-z_0-9]+:-/(home|Users)/' -- 'swarmforge/scripts/*.sh' ':!swarmforge/scripts/test'`:
  2 hits, start_bridge_headless.sh:35 and wait_for_expedite_then_bedtime.sh:45.
  host_switchover_doctor_lib.bb's two /home/carillon mentions are docstring
  examples, not defaults.

description: |
  ## What is wrong

  Two non-test scripts default a path to one user's home checkout.
  start_bridge_headless.sh uses it to find a compiled bridge for a project
  with none; wait_for_expedite_then_bedtime.sh uses it as its project root
  when no argument is given (cron passes one).

  ## What is wanted

  - With BRIDGE_EXTENSION_HOST_ROOT unset, the fallback is the checkout the
    running script belongs to (direction: `$SCRIPT_DIR/../..`). An explicit
    BRIDGE_EXTENSION_HOST_ROOT and a project's own build both still win, in
    today's order. The script's header comment says so.
  - wait_for_expedite_then_bedtime.sh with no argument uses the same
    derived checkout.
  - Before relying on the derivation, confirm an onboarded project launches
    the PRIMARY checkout's copy of start_bridge_headless.sh (the shared
    swarmforge.sh launcher), so `$SCRIPT_DIR/../..` is the checkout with the
    build. If a target runs its own copy, send the specifier a note before
    building: the default would then point at the target, which has no
    build.
  - Step handler `bl1909NoHomeCheckoutDefaultSteps`, registered in the same
    parcel. Scenario 01's fixture is a mkdtemp checkout holding
    swarmforge/scripts/start_bridge_headless.sh plus what it sources before
    the dry-run (cursor_ripgrep_env.sh), and
    extension/out/tools/start-bridge-headless.js; it runs that copy with
    BRIDGE_HEADLESS_LAUNCH_DRYRUN=1 and reads the "DRYRUN bridge cmd" line.
    Scenario 02 runs the census grep above over the tree and pins the two
    named files in the searched set (BL-1445).

  ## Scope

  start_bridge_headless.sh, wait_for_expedite_then_bedtime.sh, the step
  handler, evidence.

  ## Out of scope

  Literal home paths in tests, docs, cron entries and docstrings.

qa_e2e_procedure: |
  On the parcel commit, ONE run each:
  1. `node specs/pipeline/cli.js specs/features/BL-1909-no-script-defaults-to-one-users-home-checkout.feature`:
     4 of 4 ok (an outline of 3 rows, and scenario 02).
  2. `bash swarmforge/scripts/test/test_start_stop_bridge_headless.sh` and
     `bash swarmforge/scripts/test/test_bl1382_cron_ownership_agreement.sh`:
     exit 0 (4 s and 0 s at mint on main 132e655cba). Same expected.
  3. The census grep in the source prints nothing (2 lines at mint).
  4. `BRIDGE_HEADLESS_LAUNCH_DRYRUN=1 bash swarmforge/scripts/start_bridge_headless.sh <a mkdtemp dir> 9999`
     from the master checkout prints a bridge command whose entrypoint is
     under the master checkout, with BRIDGE_EXTENSION_HOST_ROOT unset.

