id: BL-1473
title: "own-paths starts from the two-tree diff origin/main..tip, so every path origin/main gained after the branch forked is delivered as a DELETION and every path it deleted since as an addition: BL-1463's replay on 2026-09-07 proposed deleting the freshly minted BL-1470 and BL-1471 tickets, stopped only by the merge-deletion guard; a path is the parcel's to deliver only when a commit in the parcel's own range touched it"
milestone: M8
type: defect
severity: high
# high: a land of any branch older than main's latest commits proposes
# deleting what main gained since - ticket YAMLs, evidence, code - and
# resurrecting what main removed; the deletion half is caught by a guard
# that names tickets, the resurrection half by nothing. Not critical: the
# guard held today and the QA prompt carries the interim review.
status: todo
epic: swarm-reliability
priority: 6
direction: swarm-reported
depends_on: []
mutation_cost: medium
# medium: full-delivered-paths and the own-paths delivered set in
# land_step_lib.bb, plus runner fixtures where origin/main moves after
