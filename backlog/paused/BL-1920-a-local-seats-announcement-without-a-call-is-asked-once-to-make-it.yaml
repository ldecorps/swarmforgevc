description: |
  ## Status: hotfix 0eb5958ab6 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  A text-only announcement turn stays in the seat's history (BL-1919 drops
  text only beside a call), and the model imitates it. Rebuilt from the
  live conversation and replayed: prose 3 of 3. qwen's own next-speaker
  continuation ("Please continue.", model.skipNextSpeakerCheck false)
  still got prose 3 of 3, so that setting is not the fix.

  ## What the hotfix changed

  local_model_tool_call_shim.py: needs_nudge, nudged_request,
  merge_nudged, and _complete (one completion: history stripped, text
  calls rewritten, at most one nudge). A reply with no tool call whose text
  announces an action ("I will", "I'll", "let me", ...) is asked once more
  with "Call the tool now. Reply with the tool call only."; the call it
  gets joins the original text, which qwen still shows on the pane. The
  NO_TASK guard is the declared invariant: an idle seat nudged back into
  ready_for_next.sh would spin, and handoffd halts the whole swarm on a
  NO_TASK spin; so at most one extra call per wake. Log lines gain
  nudge=none|ok|no-call. Measured: the nudge got the call 3 of 3 in replay
  and 3 of 3 through a real shim against live Ollama.

  ## What each stage checks

  - Coder: the functions against the description;
    test_bl1917_local_model_seat_url.sh (its case 0 runs the shim's 22 unit
    cases). Evidence: backlog/evidence/BL-1920-coder-<date>.md.
  - Architect: the invariant as its own pass. Is "ends on a NO_TASK tool
    result" the right guard, or can a wake-nudge-NO_TASK cycle still repeat
    faster than handoffd's chase cadence? Is a text heuristic acceptable
    here, or should the trigger be structural?

qa_e2e_procedure: |
  1. `bash swarmforge/scripts/test/test_bl1917_local_model_seat_url.sh` prints ALL PASS.
  2. `grep -c 'nudge=ok' .swarmforge/local-model-shim/shim.log` is at least 1
     after 2026-10-03 11:41 (the live shim's restart onto this code).
  3. handoffd's log shows no endless-loop halt naming the coder since that
     restart.
  4. `node specs/pipeline/cli.js specs/features/BL-1052-a-role-seat-can-be-staffed-by-a-downloaded-local-model.feature`
     passes (measured at mint: all ok).

