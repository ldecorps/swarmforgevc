description: |
  ## Status: three hotfixes landed the fix

  This parcel is their stamp-off: review them, do not re-apply them. All
  three are in swarmforge/scripts/local_model_tool_call_shim.py and its
  unit file, swarmforge/scripts/test/test_local_model_tool_call_shim.py,
  and all three answer one failure: the seat announced an action in prose
  and called no tool.

  ## 0d44613b74 (was BL-1919): the history shows the seat's own calls

  What was wrong. The model's chat template renders an assistant turn's
  tool calls only when that turn has no text: `{{ if .Content }}{{
  .Content }}{{- else if .ToolCalls }}<tool_call>...`. BL-1917's shim
  keeps a reply's leftover text ("I'll start by reading the card.") as
  content beside the rewritten call, qwen replays that turn as history,
  and the model saw its own turns as announcements with no calls.
  Replayed with the card already read: that history ended in prose 3 of 4
  times; the same history with the text dropped ran ready_for_next.sh 4 of
  4 times. A template that renders both reached 3 of 4, so the fix sits in
  the shim.

  What the hotfix changed. history_without_call_prose drops the text of
  every assistant turn in the request that carries tool_calls, before the
  request goes to Ollama. The reply qwen shows on the pane keeps its text.
  Each log line gains history_stripped=<n>.

  ## 0eb5958ab6: a reply that announces an action is asked once more

  What was wrong. A text-only announcement turn stays in the seat's
  history (0d44613b74 drops text only beside a call), and the model
  imitates it. Rebuilt from the live conversation and replayed: prose 3 of
  3. qwen's own next-speaker continuation ("Please continue.",
  model.skipNextSpeakerCheck false) still got prose 3 of 3, so that
  setting is not the fix.

  What the hotfix changed. needs_nudge, nudged_request, merge_nudged, and
  _complete (one completion: history stripped, text calls rewritten, at
  most one nudge). A reply with no tool call whose text announces an
  action ("I will", "I'll", "let me", ...) is asked once more with "Call
  the tool now. Reply with the tool call only."; the call it gets joins
  the original text, which qwen still shows on the pane. The NO_TASK guard
  is the declared invariant: an idle seat nudged back into
  ready_for_next.sh would spin, and handoffd halts the whole swarm on a
  NO_TASK spin; so at most one extra call per wake. Log lines gain
  nudge=none|ok|no-call. Measured: the nudge got the call 3 of 3 in replay
  and 3 of 3 through a real shim against live Ollama.

  ## 59a376845a (was BL-1923): "Let's ..." is an announcement too

  What was wrong. The announcement detector (_ANNOUNCE) matched "I will",
  "I'll", "I am going to", "I'm going to" and "let me" at a sentence or
  line start. qwen2.5-coder also announces with "Let's ...", most often as
  the last line of a numbered plan ("Let's proceed with these steps.").
  Those replies went back to qwen with no call and no nudge, the seat sat
  idle, and handoffd's chase sweep respawned it 100-160 s later, losing
  the conversation.

  What the hotfix changed. _ANNOUNCE also matches "let's" (straight or
  curly apostrophe) and "let us", with the same sentence-or-line-start
  anchor, so a mid-word "outlet's" is not a trigger. Nothing else changed:
  the NO_TASK guard, the one-nudge limit and the merge of the nudged call
  are 0eb5958ab6's. Measured: the live stall replayed with the nudge after
  it got read_file on the manifest 3 of 3 (step 1 of the seat's own plan).

  ## What each stage checks

  - Coder: each hotfix's functions against its section above, and that
    the reply side is untouched by 0d44613b74; the unit cases each hotfix
    added, including test_a_lets_plan_is_nudged (three replies from the
    seat's own words nudged, "The outlet's tests passed." not);
    test_bl1917_local_model_seat_url.sh (its case 0 runs the shim's unit
    cases, 31 at the 2026-10-04 consolidation). One evidence file with one
    verdict per hotfix: backlog/evidence/BL-1920-coder-<date>.md.
  - Architect: the invariant as its own pass. Is "ends on a NO_TASK tool
    result" the right guard, or can a wake-nudge-NO_TASK cycle still repeat
    faster than handoffd's chase cadence? Is a text heuristic acceptable
    here, or should the trigger be structural? 59a376845a only adds words
    to the heuristic, so the answer covers it too.

