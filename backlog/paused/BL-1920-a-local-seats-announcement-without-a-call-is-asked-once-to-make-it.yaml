  1. `bash swarmforge/scripts/test/test_bl1917_local_model_seat_url.sh` prints ALL PASS
     (measured at the 2026-10-04 consolidation on HEAD 70adf59960: ALL PASS,
     its case 0 running 31 shim unit cases).
  2. `grep -c 'history_stripped=[1-9]' .swarmforge/local-model-shim/shim.log`
     is at least 1 after the coder's last respawn.
  3. `grep -c 'nudge=ok' .swarmforge/local-model-shim/shim.log` is at least 1
     after 2026-10-03 11:41 (the live shim's restart onto 0eb5958ab6).
  4. handoffd's log shows no endless-loop halt naming the coder since the
     live shim restarted onto 59a376845a (2026-10-03 11:24:22Z).
  5. `node specs/pipeline/cli.js specs/features/BL-1052-a-role-seat-can-be-staffed-by-a-downloaded-local-model.feature`
     passes (measured at the 2026-10-04 consolidation on HEAD 70adf59960:
     9 of 9 ok).

