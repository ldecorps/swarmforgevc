human_approval: approved
approval_context: >
  Process B: keep SWARMFORGE_ROLE=QA for pipeline-path hotfixes on main
  (BL-632 unchanged). After every Cursor/operator batch that advances local
  main, immediately attempt git merge origin/main (BL-891 invariants). Do
  not add SWARMFORGE_HOTFIX=1 as a QA replacement. Supersedes the cancelled
  D.3 declared-hotfix-without-QA direction.
required_wiring:
  - "docs/how-to/BL-891-master-main-reconcile-sweep.md::post_hotfix_merge_origin::operator checklist must name the post-batch merge helper"
invariants:
  - "SWARMFORGE_ROLE=QA remains the supported way to land extension/src|test and specs/pipeline/steps hotfixes on main — this slice never replaces that with another exemption."
  - "On merge conflict the helper aborts cleanly, prints conflicted paths, exits non-zero, and leaves the worktree non-merging."
description: >
  WHAT. Local main accumulates Cursor/operator commits (ahead++) while QA
  lands on origin/main (behind++). BL-891 eventually merges on its cadence,
  but overlapping paths (e.g. approval-ask) abort and escalate after the
  coordinator is already deadlock-blocked.

  Process B: after every Cursor/operator batch that advances local main,
  immediately attempt `git merge origin/main` under the same BL-891
  invariants (no reset/stash; abort on conflict; surface conflicted paths).
  Do not wait for reconcile ticks.

  Deliverables:
  1. Document B (+ A before-commit fetch/merge, C no overnight dirty WIP)
     in BL-848 / BL-891 how-tos and a short operator checklist.
  2. Automate one shot: `bb swarmforge/scripts/post_hotfix_merge_origin.bb`
     (or equivalent wrapped in the documented commit recipe) that after a
     hotfix land: git fetch origin main; if behind>0 merge --no-edit
     origin/main; on conflict merge --abort, print conflicted paths,
     non-zero exit; on success clear stale dirty-shaped deadlock when
     behind=0 (existing clear path is fine).
  3. Deadlock honesty (small): if the tree is clean but behind>0, do not
     leave sync-action stuck on a stale dirty deadlock reason — refresh to
     wait-reconcile / conflict as appropriate.

  WHY. Keep the QA role for hotfix lands; fix the deadlock loop with
  process B, not by removing the QA gate. Human decision 2026-08-24;
  supersedes INTAKE-declared-hotfix-guard-no-qa-spoof (SUPERSEDED).

  HOW (direction, not mandate). Prefer a small Babashka helper + how-to
  update; reuse master_main_reconcile_lib clear/trip seams where they
  already exist rather than inventing a second deadlock store.

qa_e2e_procedure: >
  (1) How-to states: keep QA role for hotfix lands; run the post-batch
  merge helper (or equivalent) before ending the Cursor session.
  (2) Fixture: clean behind>0 → merge succeeds or aborts cleanly with path
  list. (3) Test: abort-on-conflict leaves worktree non-merging.
  (4) When behind=0 after success, stale dirty-shaped deadlock reason is
  not left as the sync action. (5) Record degraded Babashka gate.

out_of_scope: |
  - Auto-resolving conflict file contents.
  - Changing who may push origin/main.
  - Replacing SWARMFORGE_ROLE=QA with SWARMFORGE_HOTFIX=1 or another exemption.
  - Stamp-offs for already-landed hotfixes (BL-1115..BL-1117).

