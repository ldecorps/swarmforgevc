id: BL-829
title: "Bubble thin shell, slice B — the pager renders remote pages: the bundle names its pages, the shell hosts them beside the native Talk page, and an unrenderable page never becomes a blank screen"
milestone: M8
type: feature
status: todo
epic: bubble-thin-shell
human_approval: approved
assigned_to: none
priority: 88
direction: human-requested
depends_on: [BL-825]
