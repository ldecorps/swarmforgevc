  the reply note rather than guessed at here.

approval_context: >
  The fix itself needs no sign-off - the tests are stale and the rendering
  they contradict is the one you approved in BL-585. One thing does, because
  you are mid-change in the same file as I write this.

  Your uncommitted edit in the master checkout (working tree at 11:33,
  `pipelineBoard.ts` plus the `pipeline-board-parked-and-caption-refinement`
  evidence note) changes the grid caption from the epic to the full ticket
  title. That evidence note says no acceptance scenario encodes the old
  caption - true - but two UNIT assertions do: `pipelineBoard.test.js` pins
  `2 (no epic)` and the shared-epic caption test, and in this ticket's own
  BL-455 test the currently-PASSING `Concerto` lookup passes only because
  the caption still carries the epic. When your change lands, those go red
  too.

  So: should BL-949 absorb that - re-express all of it against a
  title-derived caption in one pass - or land the pre-hotfix contract and
  leave your change to carry its own test updates through the hotfix ledger?
  I have specced it caption-agnostic (it asserts that the caption carries
  backlog-derived context, never which field), so it survives either answer;
  the question is only whether you want the other two assertions fixed here
  or separately.
