  IR-DRY: the checker reports two medium-confidence `possible-synonym`
  findings, both pairing scenario 01 with scenario 02. Reviewed and kept -
  those two are the deliberate positive/negative pair proving the join is
  load-bearing, not accidental drift. Merging them into a Scenario Outline
