id: BL-949
title: "Two conciergeTick board-wiring tests still assert the pre-BL-585 pivoted-block layout, so the standing unit suite is red on main and every later parcel has to triage two known failures"
milestone: M8
type: defect
severity: high
status: todo
epic: pipeline-board
human_approval: pending
priority: 20
direction: swarm-surfaced
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-949-concierge-board-wiring-asserts-the-live-layout.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl949::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "A wiring test asserts only what the wiring proves. The matrix's internal padding, its caption format and its column ordering are pipelineBoard's own contract, gated by pipelineBoard.test.js and BL-585's acceptance suite; a conciergeTick test that re-asserts them adds no coverage and goes red the moment that contract legitimately changes - which is exactly how these two broke."
  - "Every corrected assertion stays non-vacuous: removing the folders-to-board join, or the role-held join, must make it fail. A test rewritten until it passes is worse than a deleted one, because it still reads as coverage."

description: >
  `extension/test/conciergeTick.test.js` fails 2 of its 111 tests on `main`,
  deterministically, in 4 seconds, at no load:

  - `BL-455: role-held tickets are joined to their backlog item epic/title`
    expects a board line whose text is the bare display id (`1`), the header
    of the old per-ticket block.
  - `BL-473: a ticket physically in backlog/active/ that no role holds still
    renders, in the not-started state` expects the mark row `NS X`, with a
    single plain space.

  Both encode the layout BL-585 replaced. Measured on `main` at
  2026-08-19, the board now renders a shared matrix - a right-aligned id
  header row, eight NBSP-padded stage rows, and one caption line per
  ticket below it:

    (nbsp x5)1(nbsp x3)2
    NS(nbsp x3).(nbsp x3).
    CO(nbsp x3)X(nbsp x3).
    ...
    1 Concerto
    2 (no epic)

  so there is no bare-id line, the mark rows are NBSP-padded rather than
  single-spaced, and the dashed `-- (no epic) --` heading the first test
  also looks for was removed with the epic headings. Each test carries
  further assertions that would fail next once the first is fixed (the
  no-epic heading lookup in one, the `/^[A-Z]{2} \./` stage-row regex and a
  7-row slice against 8 stage rows in the other) - fixing only the line the
  runner names will not turn the file green.

  Introduced by `a2ae8852c` ("BL-585: pipeline board renders one ticket-column
  matrix, not pivoted per-ticket blocks"): that commit rewrote
  `extension/test/pipelineBoard.test.js` for the new layout but left this
  sibling file untouched, and the ticket closed into `backlog/done/M8/` with
  the suite red.

  The cost is not the two tests. It is that `npm test` no longer has a green
  baseline, so every later parcel's QA pass must recognise and discount two
  known failures - which is precisely how a real regression gets waved
  through as noise. It already cost a full triage in BL-631's QA pass
  (evidence `backlog/evidence/BL-631-qa-bounce-20260819.md`, section 6),
  where these two had to be reproduced in isolation at low load and ruled
  unrelated before that ticket's own defect could be reported.

  How (direction, not mandate): re-express both tests against the live
  matrix, keeping what each was written to prove - that `folders.active`'s
  epic/title actually reaches `computePipelineBoard` through the tick, and
  that a ticket in `backlog/active/` no role holds still renders in the
  not-started state. Assert the join and the marks; leave padding, caption
  text and ordering to the suites that own them.

constraints: >
  Out of scope:

  - Any change to `extension/src/concierge/pipelineBoard.ts` or
    `conciergeTick.ts`. The rendering is correct and human-approved
    (BL-585's `approval_context`, items 3 and 4, settled the dashless
    placeholder and the epic-only caption). This ticket corrects tests that
    assert the layout that one replaced.
  - `extension/test/pipelineBoard.test.js`. It was rewritten by BL-585 and
    passes.
  - Re-testing the matrix layout itself. BL-585's feature file already gates
    the column/row shape, the width budget and the NBSP padding against the
    pure module; duplicating that here is what this ticket exists to undo.
  - The other two failures seen in BL-631's full-suite run
    (`renderBriefingBurndownCli`, and the two property-suite timeouts). QA
    reproduced `renderBriefingBurndownCli` green in isolation at low load;
    they are load artefacts, not this defect.
  - Whether BL-585 should have closed with the suite red. See notes.

qa_e2e_procedure: >
  From `extension/` (never the repo root):

  1. Reproduce before the fix, on a checkout of `main`:
     `npx vitest run test/conciergeTick.test.js` reports
     `2 failed | 109 passed (111)`, naming the BL-455 join test and the
     BL-473 not-started test.
  2. At the parcel commit, the same command reports 111 passed, and the
     full `npm test` shows no conciergeTick failure. Note any other failure
     in that run and check it against the load average before attributing
     it here.
  3. Confirm invariant 2 on each corrected test, one at a time, reverting
     between: make `readRoleHeldTickets` return `{}` and confirm the BL-473
     test fails; drop the epic from the fixture's `folders.active` entry and
     confirm the BL-455 test fails. A corrected test that survives both is
     vacuous and must be bounced.
  4. Confirm invariant 1 by inspection: neither corrected test asserts a
     literal run of NBSP or spaces, an exact caption string, or a fixed
     stage-row count. `grep -n 'u00a0' extension/test/conciergeTick.test.js`
     should show NBSP used only to normalise before comparison, never as an
     expected literal.
  5. Run the acceptance feature and confirm all 5 cases pass
     (`./specs/pipeline/scripts/run_acceptance.sh
     specs/features/BL-949-concierge-board-wiring-asserts-the-live-layout.feature`),
     and confirm the step handler is registered in
     `specs/pipeline/steps/index.js`.
  6. Prove the acceptance is non-vacuous: stop the tick passing the backlog
     folders' epic through to the board, confirm scenario 01 fails, restore.
  7. `git show --stat`: expect `extension/test/conciergeTick.test.js`, this
     ticket's feature file, its step handler and the registry line. No
     `extension/src/` file, no `pipelineBoard.test.js`.

