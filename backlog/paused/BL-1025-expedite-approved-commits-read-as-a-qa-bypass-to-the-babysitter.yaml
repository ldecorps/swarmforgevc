id: BL-1025
title: "commits an expedite run walked through its own QA hat still read as 'landed outside QA' to the babysitter's Article 4.2 check, because expedite never advances the swarmforge-QA ref the check relies on"
milestone: M8
type: defect
severity: high
# high, not critical: no real gate was bypassed and no code is wrong - but
# this fires a CRIT/nudge on every future expedite run that touches a
# QA-exclusive path, training the coordinator to treat a known-false alarm
# as noise, which is exactly the failure class Article 4.2/BL-590 exists to
# prevent for the REAL case.
status: todo
epic: swarm-reliability
priority: 70
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1025-expedite-approval-satisfies-the-pipeline-code-on-main-gate.feature

invariants:
  - "A commit that passed an expedite run's own QA hat is never reported by the babysitter's pipeline-code-on-main check as having landed outside QA."
  - "A commit that did NOT pass any QA gate - expedite or live - is still reported, unchanged from today."

source: |
  Observed live by the coordinator, 2026-08-21, from a babysitter health
  sweep CRIT immediately after closing BL-1021 (expedite run 2):

  "pipeline code landed on main outside QA (Article 4.2/BL-247):
  44ef693d9 ... ; 40e35d929 ... ; ed8a915f7 ..." - three commits from
  BL-1021's expedite coder stage, all touching
  specs/pipeline/steps/bl1021SubprocessOutlivesWaitBoundSteps.js.

  Investigation: `is_qa_ancestor.sh` (the ONE shared approval predicate,
  BL-925 invariant 2) requires the commit be an ancestor of the
  `swarmforge-QA` git ref. That ref only advances when a live QA agent
  merges a parcel into its own worktree in the ordinary pipeline. BL-1021
  ran via `expedite.sh`, which walks the same role hats - including a QA
  hat that gave a real advance/bounce verdict - but with the swarm stopped
  and, per the expeditor manual's "machinery it may never use" list, no
  live QA worktree to merge anything into. `swarmforge-QA` therefore never
  moved for this run: `git merge-base --is-ancestor 44ef693d9
  swarmforge-QA` returns false, and so does every other commit in the run,
  including the one the later merge-up commits refer to as
  "QA-approved BL-1021" (341f40e50). That commit wasn't itself flagged only
  because it happens not to touch a QA-exclusive path - not because the
  check recognized it as approved.

  The ticket was already correctly closed (expedite's QA hat is a real
  gate, and the coordinator confirmed no functional defect); this ticket is
  about the detector, not the closed work.

description: |
  ## What happens

  `check-pipeline-code-on-main` (swarmforge/scripts/babysitterd_sweep_lib.bb)
  and its shell twin `check_pipeline_code_on_main.sh` both classify a commit
  as offending when it touches a QA-exclusive path AND is not an ancestor of
  `swarmforge-QA`. That is the correct predicate for the live pipeline,
  where QA merging into its worktree is the only legitimate way pipeline
  code reaches `main`. It is the wrong predicate for an expedite run, which
  is a second, constitutionally sanctioned way pipeline code legitimately
  reaches `main` (Parcel Flow, "Same gates, no machinery" / BL-567) and
  deliberately never touches `swarmforge-QA` or any of the live machinery
  `is_qa_ancestor.sh` was built to check.

  The result: every future expedite run whose coder/cleaner/hardener stages
  touch a QA-exclusive path will trip this CRIT, unconditionally, whether or
  not its own QA hat actually approved the work. There is currently no way
  to tell the two cases apart from the check's own inputs.

  ## Why this matters beyond one noisy alert

  Article 4.2/BL-590 exists so a REAL bypass (pipeline code landed on main
  with nobody having reviewed it at all) is never silent. If expedite runs
  reliably produce a false CRIT here, the trained response becomes
  "check if it was an expedite run, then ignore" - which is exactly the
  muscle memory that lets a real bypass slip through unnoticed the one time
  it matters. The detector needs to actually distinguish "expedite's QA hat
  approved this" from "nothing reviewed this", not rely on a human
  remembering to make that distinction every time.

  ## How (direction, not mandate)

  - Give expedite's QA hat a durable, machine-checkable record of its own
    verdict, in the same spirit as the live QA bounce-verdict stores
    `is_qa_ancestor.sh` already consults (a JSONL record keyed on the
    10-hex commit, or a ticket-YAML field) - written only by
    `expedite_lib.bb`'s own QA-hat verdict handling, never hand-authored.
  - Extend the shared approval predicate (still the ONE place,
    `is_qa_ancestor.sh` - BL-925 invariant 2 - not a second copy in the
    Babashka callers) to treat "expedite QA-hat verdict on file for this
    sha" as an alternate approval path alongside "ancestor of
    swarmforge-QA", with the same fail-closed discipline as the existing
    bounce-store check: an obstructed/unreadable/corrupt expedite-verdict
    store is undeterminable, never read as approved.
  - Do NOT weaken the live-pipeline check itself, and do NOT make
    "commit subject mentions an expedite run" or any other unverified
    self-report sufficient - that is the BL-972-shaped failure this repo
    has already hit once (commit-subject string matching standing in for a
    real gate).

  ## Scope

  - swarmforge/scripts/is_qa_ancestor.sh - the shared predicate
  - swarmforge/scripts/expedite_lib.bb - where the QA hat's verdict is
    already computed; add the durable record write
  - swarmforge/scripts/babysitterd_sweep_lib.bb,
    swarmforge/scripts/check_pipeline_code_on_main.sh - callers, unchanged
    in shape since they already delegate to the shared predicate
  - docs/reference/BL-567-expeditor-manual.md - document the new record
    expedite now writes

  Out of scope: changing what expedite's QA hat itself checks or how it
  reaches its verdict - this ticket only makes that verdict visible to the
  existing Article 4.2 detector.

notes: |
  Filed by the coordinator directly to backlog/paused (swarm-reported
  direction), same pattern as BL-1024 - a process-machinery gap discovered
  during routine bookkeeping, not a spec drafted from a human directive.
  Sibling of BL-1024 by origin (both surfaced from the BL-1021 expedite run
  2 aftermath) but independent by mechanism: BL-1024 is about the run's own
  closing summary naming what it left behind; this one is about an external
  detector's approval predicate not recognizing the run's QA hat at all.
