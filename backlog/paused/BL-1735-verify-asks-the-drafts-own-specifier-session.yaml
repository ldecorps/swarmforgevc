description: |
  ## What is wanted

  - **One Claude session per draft** (answer 3). It is created on the
    draft's first Verify, and its session id is kept with the draft. A
    later Verify resumes it, so it remembers its own earlier findings, and
    BL-1737's Ask panel talks to the same session.
  - **Read-only** (answer 10). It sees the draft, the vocabulary, BL-1734's
    host findings, and it can read the backlog, the feature files and the
    docs. It is started with file-reading tools only, working in the
    repository root. There is no Bash, Edit, Write or network tool, and it
    writes and commits nothing.
    - This is new, not a reuse. `run_ancillary_front_desk.sh` runs Claude
      with `--tools ""` (no tools at all) and nothing in the tree resumes a
      Claude CLI session today (`cursorBridgeAgentSession.ts`). A sibling
      invocation with a read-tool allowlist and a resume argument is the
      shape.
  - **The review.** The prompt carries the specifier's INVEST table (from
    `swarmforge/roles/specifier.prompt`) and asks for findings in a
    structured shape. The host parses them into BL-1734 suggestions with
    `source: specifier`. A finding the host cannot parse is shown as a
    plain note suggestion, never dropped.
  - **Outside the pipeline.** No handoff, no `role_ask`, no wait on a
    shift or on the pipeline specifier seat. It runs at any hour.
  - **Model**: the pipeline specifier seat's model, read from its launch
    settings (direction).

  ## Scope

  - The verify module (BL-1734), a session runner and its command builder,
    and the per-draft session store.
  - `specs/features/BL-1735-...feature` + the pinned handler (a fake runner
    in acceptance).
constraints: >
  The Claude CLI is never invoked by the acceptance lane; the handler
  injects a fake runner and reads the command line the builder produced.
  The session never receives a writable tool list. No handoff file, role
  ask or mailbox write is produced by a Verify.

out_of_scope: |
  - Staleness and history: BL-1736. Talking to the session: BL-1737.
  - Any change to the pipeline specifier seat or its prompt.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1735-verify-asks-the-drafts-own-specifier-session.feature`:
     all ok (4 of 4).
  2. Live, with the swarm running: press Verify on a draft that bundles two
     outcomes. A suggestion from the specifier session names that. The
     specifier seat's `inbox/new` and `in_process` gain nothing, and
     `.swarmforge/operator/role-awaiting/` gains nothing.
  3. Press Verify again: the run log shows the same session id resumed.
  4. `ps` or the run log shows the session's tool allowlist: read tools
     only.
  5. `git diff main...HEAD --name-only` names only the Scope files, the
     feature, the handler, docs and evidence.

