id: BL-1277
title: "Two step files registering the same unscoped step text silently answer each other's scenarios, and nothing refuses the next one"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
priority: 10
direction: swarm-reported
depends_on: []
mutation_cost: low
slice_size_envelope: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1277-step-files-must-not-share-an-unscoped-step-pattern.feature

invariants:
  - "For every feature, each of its steps resolves to a handler registered by that feature's own step file — never to another file's unscoped registration — whatever order the step files load in."
  - "The guard's verdict derives from the registry's actual registrations (the same stepRegistry.js the acceptance run uses), never from a re-implemented scan of step-file source text."

description: >
  `specs/pipeline/stepRegistry.js` resolves an UNSCOPED registration
  (`registry.define`) by first-match across every handler file. So when two
  step files register the same pattern, whichever loads first answers that
  step text for BOTH features, and the loser's scenarios run the winner's
  handler against the winner's fixture. The acceptance run reports a normal
  pass or fail; nothing anywhere says the wrong handler answered.

  This is not hypothetical and it is not new. The coder hit it on 2026-08-29:
  a later BL-1267 parcel silently turned already-shipped BL-1268's acceptance
  from 7/7 to 2/7, failing as `expected allow, got hold (ticket claims itself
  superseded-by in field 'closed_as')` — BL-1267's fixture, evaluated inside
  BL-1268's scenario. The same session also had BL-1220's `the guard passes`
  answering BL-378's scenario. BL-800 fixed one instance of exactly this in
  2026-08 (BL-606 shadowing BL-623) and shipped a property test pinned to
  BL-623's feature alone, so the class survived it.

  A scan of `specs/pipeline/steps/` on main finds 15 distinct step patterns
  registered unscoped by more than one file (17 unordered file pairs), and not
  one of them is fixed anywhere on `main`. This corrects the 12/14 recorded
  when this ticket was minted earlier on 2026-08-29, which also said "two of
  those are the coder's own, already scoped in their worktree and landing with
  their parcel". That premise died the same afternoon: the coder's fix
  `205fdd36f` was entangled in the BL-1273 documenter tip, QA rebuilt that
  parcel tip-pure (`1921de5c4`), and `205fdd36f` is now stranded on all five
  pipeline branches carrying no ticket of its own. Its three files account for
  5 of the 15 patterns; the 10 the coder listed as pre-existing are the rest.
  Spot-checking is not
  reassuring: `the swarm's health is reported` resolves to `runFreshnessTest`
  in one file and `runRuntimeTickTest` in the other, and `the ambulance is
  released` throws on a non-zero CLI status in one and ignores status in the
  other. Each is a live wrong-handler binding whose current green is luck.

  Two of the collisions are past luck: they are RED on `main` right now,
  measured on 2026-08-29 rather than inferred. `specs/pipeline/steps/index.js`
  fixes load order, and in each pair the shadowing file loads first (`bl603`
  line 10, `bl1220` 11, `bl1267` 12, all ahead of `bl1268` 13,
  `noSingleFileBoundsTheSuite` 220, `bl866` 535):

      BL-1268-stale-claim-branch-must-name-this-ticket.feature   2/7  (was 7/7)
      BL-378-no-single-file-bounds-the-suite.feature             3/4  (was 4/4)

  Both tickets are shipped and sitting in `backlog/done/M8/`, and neither is
  defective. What is broken is the acceptance evidence they were closed on.
  That is the sweep half's headline observable: those two features return to
  7/7 and 4/4 with no change to any handler's logic and no change to any
  `.feature` file.

  Two halves, one property, deliberately one ticket: a guard that refuses a
  new unscoped duplicate cannot be armed while the existing collisions are
  present, and clearing them without the guard regresses — that has now been
  demonstrated twice.

  How (direction, not mandate). `registry.defineScoped(pattern, handler,
  FEATURE_NAME)` is the mechanism BL-425 built for this and is what the coder
  already used for their three; each steps file already carries its own
  `FEATURE` constant. The guard's natural home is the unit lane beside the
  existing `extension/test/helpers/materializedRegistryGuard.js` precedent —
  vitest discovers `extension/test/*.test.js` by glob, so no call site is
  needed. Fix the collisions the scan reports AT IMPLEMENTATION TIME rather
  than a list frozen here - the count has already moved once.

  `205fdd36f` is liftable prior art for three of the files (`bl1267`,
  `bl1220`, `bl603`): it scopes them through `registry.defineScoped` with no
  handler change and no feature-file change, and the coder measured all six
  affected features green afterwards. Lift it or re-derive it, the coder's
  call - but read it first rather than rediscovering those three. Recover it
  with `git show 205fdd36f`.

  Merge hazard, stated here so it is not met as a surprise conflict:
  `205fdd36f` is an ancestor of the coder, cleaner, architect, hardender and
  documenter branches but not of `main`. When this sweep lands and those
  worktrees merge `main`, the same three files will have been scoped on both
  sides. Resolve in favour of the landed sweep; never revert the sweep to
  preserve the branch copy.

constraints: >
  - The guard must run in the standard unit lane (`npm test` from
    `extension/`), not as a script nobody invokes. A guard that ships green
    and unwired is the BL-419 shape and does not close this ticket.
  - Change registrations only. No step handler's logic and no `.feature` file
    should change to make a collision go away — if scoping a pattern turns a
    feature red, that feature was already running the wrong handler and the
    red is the finding, not an obstacle to route around.
  - Before scoping a pattern, check which features actually use that step
    text. Scoping BOTH sides of a collision when some third feature relies on
    the unscoped fallback leaves that feature with no handler at all, and the
    acceptance runner hard-fails on a missing handler.
  - Do not change `resolve()`'s existing semantics. BL-425's scoped-then-
    unscoped fallback is relied on repo-wide; this ticket adds a refusal
    beside the registry, it does not re-cut the resolution rule.

qa_e2e_procedure: >
  1. `cd extension && npm install && npm run compile`.
  2. Run the collision guard against the shipped step files and confirm it
     reports zero collisions (feature scenario 03).
  3. Independently corroborate with a scan of `specs/pipeline/steps/*.js` for
     two files registering the same pattern via `registry.define` — expect
     none. This is a second opinion on the guard, not the guard's own output.
  4. Plant a deliberate duplicate: copy an existing unscoped `registry.define`
     pattern into a second steps file, re-run the guard, and confirm it
     refuses and names the pattern and both files. Revert the plant.
  5. Run the full acceptance suite and confirm no feature regressed. Pay
     particular attention to the features named in the collision list —
     `mergedCodeReachesDaemons`, `restrictedFrontDeskOperator`,
     `bl655AmbulanceModeHold`, `bl852ChaseSweepRespectsAmbulanceHold`,
     `bl484DecidedAskClosesItself`, `bl589ApprovalAskCarriesRulingOptions` —
     since one side of each pair has been running the other's handler.
  6. Confirm `npm test` in `extension/` executes the guard (it should appear
     in the vitest file list), proving it is wired by glob and not orphaned.

human_approval: pending

approval_context: >
  Firm and not seeking a decision: that the collisions are real (verified by
  reading both handlers of two pairs) and that `defineScoped` is the fix
  (BL-425 built it for this; BL-800 used it).

  What would benefit from your sign-off: this is minted as ONE ticket that
  both clears the ~10 existing collisions and adds the guard, rather than two.
  The reasoning is that the guard cannot be armed while collisions exist, and
  splitting would either make the guard depend on an unbuilt sibling (an
  INVEST-Independent failure) or need a throwaway baseline/allowlist that
  exists only until the sweep lands. If you would rather see the sweep ship
  first and the guard follow as its own ticket, say so and I will split it.

  Also worth your eye: `severity: high` puts this in the Article 3.2.4
  expedite lane, ahead of non-expedited work. The rationale is that the
  defect degrades the acceptance gate itself — a green acceptance run is the
  evidence every other ticket is judged on, and this makes that evidence
  unreliable in an unsignposted way. It is not swarm-down, so not critical.

  Amended 2026-08-29, after the above was written, with two facts that bear on
  the split question rather than changing it. First, the split is no longer
  hypothetical in one direction: the coder had already scoped three of the
  files, that work was stranded off `main` by an unrelated QA tip-pure rebuild,
  and it is available to lift (`git show 205fdd36f`) — so the sweep half is
  cheaper than it reads. Second, this is not purely preventive any more. Two
  features are red on `main` today as a direct result (BL-1268 at 2/7,
  BL-378 at 3/4, both measured), which is the strongest argument yet for
  landing the sweep quickly, and therefore the strongest argument for the split
  you were being asked about. I have NOT split it on my own initiative,
  because the question was already with you; if you would rather the sweep ship
  first and the guard follow, that answer is now worth more than it was.

notes: |
  Verification done at mint (so the coder and QA need not redo it):
  - `specs/pipeline/stepRegistry.js` read in full: `define` pushes with no
    featureName and `resolve()` falls back to a first-match scan over exactly
    those entries. The collision mechanism is as described.
  - `specs/pipeline/scripts/resolve_contract_steps.js` calls
    `registry.resolve(stepText, feature.name)`, i.e. scoped-first WITH the
    feature name. A feature answered by another file's unscoped registration
    still resolves, so the BL-761 acceptance-contract gate reports it
    runnable. That is why no existing gate catches this class.
  - Scan of main, re-run 2026-08-29 after QA stranded the coder's fix: 15
    colliding patterns / 17 file pairs, none of them fixed on `main`. This
    supersedes the 12/14 recorded at mint. The arithmetic reconciles with the
    coder's evidence file once "three were mine" is read as three FILES rather
    than three patterns: their files carry 5 of the 15 (bl1220 x
    noSingleFileBounds = 1, bl1267 x bl1268 = 3, bl603 x bl866 = 1), and the
    10 in their "wider sweep" table are the remainder - their prose "nine"
    undercounts their own table by one. The scan is source-text and so is
    exactly what invariant 2 forbids the shipped guard from being: it sizes
    the sweep, it is not the guard's verdict.
  - The coder's diagnosis is now durable on `main` at
    backlog/evidence/BL-1277-coder-unscoped-step-collisions-20260829.md,
    recovered verbatim from the stranded commit with a specifier addendum
    recording today's re-measurement. Before this it was reachable only by
    `git show 205fdd36f:`.
  - No existing paused/active/hold/debt ticket covers step-registry
    collisions; `backlog/debt/` checked too (it is a dead lane).
  - BL-800 (done) is the prior instance and its property test is scoped to
    BL-623's feature only — it is not a general guard and is not superseded
    by this ticket.

  IR-DRY: run on the feature file; 4 `possible-synonym` findings remain, all
  of them a Scenario Outline placeholder (`the guard <verdict>`,
  `"<second text>" <scoping>`) compared against its own concrete
  instantiations in scenarios 02/03. Judged resolved by inspection — the 2
  genuine `near-duplicate` findings from the first draft were removed by
  parameterizing scenarios 01-03 into the outline. Collapsing 02 or 03 into
  it would destroy meaning (02 needs three files, 03 uses the real repo).

  No `required_wiring:` declared, deliberately. The guard is wired by vitest's
  glob discovery, so its value does not depend on a call site existing, which
  is the BL-531 trigger. Anchoring an entry at a test file that does not yet
  exist would fail the documenter->QA gate on an absent path rather than check
  anything. The wiring requirement is stated in `constraints:` and verified by
  step 6 of the e2e procedure instead.

  Coder's own diagnosis, preserved: "A green run of the feature you are
  working on is not evidence that the registry is still resolving correctly
  for everyone else." And on the remaining collisions: "a scan is not proof
  any of them is wrong — but the same failure mode is available to all nine,
  and it is silent."

