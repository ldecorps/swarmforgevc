required_wiring:
  - "swarmforge/scripts/swarmforge.sh::BL-1080-choose-a-cursor-seat::every unsupported-agent refusal must name the how-to by path - a refusal that names nothing is exactly the dead end invariant 1 forbids, and docs/how-to/ alone would be vacuous here because the launcher already cites three other how-tos"
  - "swarmforge/packs/cursor-mono-router.conf::window::the pack must exist as a committed conf carrying a window line - this entry earns its keep on the path check rather than the pattern, because a pack that lives only as a snippet inside the how-to gives the operator nothing to pass to --pack"
  - "specs/pipeline/steps/index.js::bl1080::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler"

invariants:
  - "The unsupported-agent error for a rejected cursor token points operators at the Cursor-seat how-to, not a dead end."
  - "Docs state when to use a Cursor seat versus /pilot versus Claude — /pilot remains the offline expeditor, not a live seat."

description: |
  ## What is wrong

  With BL-1078's launcher token and BL-1079's certified identity, a Cursor
  seat becomes possible but not choosable. No committed pack names `cursor`
  on a window line, so there is nothing to pass to `--pack`. And the
  unsupported-agent refusal — emitted from two separate sites in
  `swarmforge.sh`, `validate_agent` and the launch-command builder — says only
  that the agent is unsupported. An operator who guesses `cursor` on an older
  checkout, or misspells it on this one, is told no and given nowhere to go.

  ## How (direction, not mandate)

  Two named deliverables, because `required_wiring` pins their paths:

  - `swarmforge/packs/cursor-mono-router.conf` — a pack staffing at least one
    role with a `cursor` window line, following the existing
    `<provider>-mono-router.conf` convention (`gemini-mono-router.conf`,
    `codex-mono-router.conf`) and its `.prompt` sibling if one is warranted.
  - `docs/how-to/BL-1080-choose-a-cursor-seat.md` — when a Cursor seat is the
    right choice against `/pilot` and against Claude.

  Make every unsupported-agent refusal name that how-to by path. Keep the
  existing wording ahead of the pointer: `test_coordinator_provider_
  configurable.sh` asserts on the literal `Unsupported agent '<x>' for role
  '<y>'`, so append rather than rewrite. Sweep the refusal family rather than
  patching the site you happen to hit first.

  Not in this slice: proving the spike (BL-713); launcher (BL-1078);
  certify (BL-1079); replacing every Claude seat.

qa_e2e_procedure: >
  1. Launch with --pack cursor-mono-router against a scratch target and
     confirm the cursor-staffed window opens with cursor-agent in the right
     worktree - not an empty pane. An uncertified identity should refuse here
     per BL-1078; set the escape, confirm it launches, unset it and confirm it
     refuses again.
  2. Put a misspelt agent token on a window line and launch: the refusal must
     carry the existing Unsupported agent wording AND the how-to path.
  3. Repeat for the coordinator_agent config line, which refuses from the
     second site - both messages must carry the pointer, and this is the check
     that catches a one-site fix.
  4. Open the path the refusal printed, from a clean clone: the file must be
     there, and must answer when to use a Cursor seat rather than /pilot or
     Claude (invariant 2). A file that exists but does not answer that is a
     documenter bounce, not a pass.
  5. Run test_coordinator_provider_configurable.sh and confirm it still
     passes, proving the wording was appended to and not rewritten.

