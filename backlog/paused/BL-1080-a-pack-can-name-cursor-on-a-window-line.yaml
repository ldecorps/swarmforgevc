description: |
  ## What is wrong

  Even with a launcher token and a certified Cursor identity, operators have
  no pack line that names cursor, no how-to for when to use it, and a
  whitelist rejection that does not point at the Cursor-seat path.

  ## How (direction, not mandate)

  Add pack or overlay window lines that staff a role with cursor once
  certified. Write the how-to. Point the unsupported-agent error here.

  Not in this slice: proving the spike (BL-713); launcher (BL-1078);
  certify (BL-1079); replacing every Claude seat.

