approval_context: >
  Feature file written 2026-08-23; the approval the original context reserved.
  Three scenarios and two named deliverables you should sanity-check, because
  required_wiring pins both paths and a rename after approval fails the gate:
  the pack is swarmforge/packs/cursor-mono-router.conf and the how-to is
  docs/how-to/BL-1080-choose-a-cursor-seat.md. Scenario 02 sweeps the
  unsupported-agent refusal across every site that emits it rather than fixing
  the one you would hit first - there are two today and the BL-1018 family
