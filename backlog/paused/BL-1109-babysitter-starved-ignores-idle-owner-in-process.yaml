acceptance: specs/features/BL-1109-babysitter-starved-ignores-idle-owner-in-process.feature
human_approval: pending
approval_context: >
  Firm: a non-abandoned in_process claim is motion for check 10 even when the
  owner pane is momentarily idle, and the CRIT copy must never claim zero
  parcels when claims were counted. Also firm: align the starved gather glob
  with stuck-in-process so batch_/nested worktree claims are visible.

  Your call is only whether "abandoned" for this predicate reuses the existing
  stuck-in-process abandoned definition or needs a narrower starved-only rule.
invariants:
  - "A non-abandoned in_process claim is always motion for the swarm-starved check, regardless of the owning pane's busy classification that sweep."
  - "A swarm-starved CRIT never claims zero pending/in-process parcels when any claim was present in the gather that produced it."
description: >
  WHAT. `check-swarm-starved` in babysitterd_sweep_lib.bb treats an in_process
  claim as motion only when `:owner-busy?` is true (`motion-in-process?`).
  So: active tickets > 0, in_process parcels present, owner pane idle for two
  sweeps (Thinking pause, rotate gap, Cursor follow-up bar) → streak trips
  STARVED and the CRIT text claims "zero pending/in-process parcels".

  Secondary: `in-process-claims` in babysitter_check.bb globs
  `inbox/in_process/*.handoff` only — no `{,**/}` and no batch_* — unlike
  `stuck-in-process-glob`, so nested worktree and batch in_process can be
  invisible to this check even when stuck-in-process sees them.

  WHY. False STARVED drives wrong ops response while parcels are held. Distinct
  from BL-807 (stuck-in-process WARN vs owner-busy); this is check 10 only.

  HOW (direction, not mandate). Count a non-abandoned in_process claim as
  motion regardless of owner-busy, or change the CRIT copy so it cannot claim
  zero parcels when claims exist; align the gather glob with stuck-in-process.

qa_e2e_procedure: >
  (1) Place a non-abandoned *.handoff in a role worktree inbox/in_process with
  the owner pane idle; run two starved sweeps — no STARVED finding.
  (2) Empty all pending and in_process; idle panes; two sweeps — STARVED fires.
  (3) Place a handoff under a nested **/inbox/in_process/ and under a batch_*
  dir; confirm both appear in the starved gather.
  (4) Grep the CRIT message path: with claims present it must not say zero
  parcels.

