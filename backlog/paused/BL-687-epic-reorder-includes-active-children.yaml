invariants:
  - "An epic tile's drill-down lists exactly the non-`type: epic` tickets in paused, hold AND active whose `epic:` slug equals that tile's slug — none of those three folders is ever silently absent, and a `done/` child never appears."
  - "Widening the within-epic set changes ORDER only: for every backlog state, whether a topic make-top is refused, bounded, or accepted on DEPENDENCY grounds is identical to what it was when the set was paused+hold — an `active/` ticket is never a live dependency."
