id: BL-1182
title: "Day-long BoB trial lifecycle — nominate, seat, assess, promote or revert (tie→cheap)"
milestone: M8
type: feature
status: todo
epic: best-of-breed-swarm
priority: 1
direction: human-requested
depends_on: [BL-1181, BL-1178, BL-556]
mutation_cost: high
slice_size_envelope: high
size_envelope_decision: "justify not split - seating a trial without the assessment that ends it would leave a non-permanent model seated indefinitely, which is worse than not trialling. A safe alternative split IS available and is recorded in notes for the human, not taken unilaterally on an approved top-priority ticket."
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1182-day-long-bob-trial-lifecycle.feature

human_approval: approved
approval_context: >
  Core trial loop from BoB intake. Trial window: one operating day. Promote if
  outranks; tie → cheapest wins (cost_class / measured cost). Record losers so
  they are not endlessly re-trialled without new evidence. Live runs gated by BL-1183.

invariants:
  - "Promotion stays only when the trial effectively outranks the permanent model; a tie selects the cheaper cost_class."
  - "A losing trial reverts to the permanent model and records steward evidence against silent re-trial."
  - "Trial start and end same-role model switches transfer agent memory (BL-1178)."

required_wiring:
  - 'swarmforge/scripts/model_steward_cli.bb::trial::the steward CLI must expose the trial lifecycle; verified absent today so this anchor is non-vacuous (BL-874)'
  - "specs/pipeline/steps/index.js::bl1182DayLongBobTrialLifecycleSteps::acceptance handler registered"

description: |
  Steward nominates a candidate that might outrank the permanent model for a
  role; seat runs one day; end-of-day assess → stay if outranks, tie→cheap,
  else revert. Memory transfer on model switches. Production live trials wait
  on BL-1183.

qa_e2e_procedure: >
  (1) Nominate → trial seat armed. (2) Outrank → permanent updates. (3) Tie →
  cheaper wins. (4) Lose → revert + evidence. (5) Memory transfer on boundaries.

out_of_scope: |
  - Starting cast (BL-1181).
  - Declaring production go-live (BL-1183).

source: |
  .swarmforge/operator/INTAKE-best-of-breed-swarm-model-trials.md. Epic BL-1180 child.

notes: |
  - [2026-08-28] specifier, Article 3.6 / size-gate adjudication: JUSTIFY, do
    not split. The slice_size_envelope gate banded this high on the four verbs
    in the title (nominate, seat, assess, promote-or-revert). Checked against
    INVEST rather than against the band: 5 scenarios and 3 invariants are both
    inside this role's own stated caps, and all three depends_on entries are
    landed (BL-1181 and BL-1178 in backlog/done/, BL-556 in
    done/M5-cost-intelligence-backend-flexibility/), so Independent passes.
    The decisive argument against splitting is that the four verbs are one
    state machine, not four deliverables: a seat you can arm but never assess,
    or an assessment with nothing seated, are half-mechanisms, and the split
    would make each child depend on an UNBUILT sibling - which Independent
    forbids more strongly than the size band suggests. The ticket is also
    already human-approved at this shape.
  - [2026-08-28] specifier: fixed a real defect found while assessing the size
    gate. required_wiring row 1 was
    `model steward trial lifecycle::nominate seat assess promote/revert::day
    window` - the PATH segment was prose, not a file path. pre_qa_gate_lib.bb
    reads the path and substring-matches the pattern, with no expansion step,
    so that row could never match and would have hard-blocked the documenter's
    forward to QA on a wiring-absent refusal - the BL-874 shape exactly.
    Replaced with an anchor that is both real and non-vacuous: `trial` does not
    currently appear in swarmforge/scripts/model_steward_cli.bb (verified,
    count 0), so it can only match once the lifecycle actually ships there.
  - [2026-08-27] specifier: minted; one operating day = calendar/shift-aligned
    day locked against swarm_shift_lib in implementation notes if needed.
  Size envelope, 2026-08-29. This ticket tripped BL-634's gate and the trigger
  is HONEST here, unlike BL-1193/BL-1267/BL-1268: this is not a deprecator
  ticket, so its mutation_cost: high is a genuine cost estimate rather than an
  Article 3.6 seat-tier declaration. The band is restated explicitly as high.
  Decision recorded: JUSTIFY, do not split - with a caveat the human should
  see, below.

  Why justify. The lifecycle's obvious cut is nominate+seat from
  assess+promote-or-revert. Taken naively it is unsafe: a slice that seats a
  trial model with no assessment to end it leaves a non-permanent model in a
  role seat indefinitely, which is a worse state than never having trialled.
  The three declared invariants also span the whole lifecycle - outrank-or-
  revert, evidence against silent re-trial, and memory transfer at BOTH the
  start and end switch - so any cut splits an invariant across two slices.

  The alternative I did NOT take, recorded so it is not lost. There is a safe
  split, and it may well be the better decomposition:
    slice A - nominate, seat, and ALWAYS revert at end of day. Complete and
              independently valuable: time-boxed trials that always return to
              the permanent model, yielding comparison telemetry with no
              possibility of a stranded seat.
    slice B - assess, and promote when the trial outranks (tie->cheap),
              replacing slice A's unconditional revert.
  I did not take it because this ticket is human_approval: approved and sits
  at the top of the reprioritised best-of-breed-swarm epic, so re-scoping it
  unilaterally is not mine to do; and I could not raise it as a question
  because my role_ask slot is held by an older unanswered question. If the
  coder finds the slice oversized in practice, this split is the one to ask
  for rather than inventing a different cut.

