id: BL-1182
title: "Day-long BoB trial lifecycle — nominate, seat, assess, promote or revert (tie→cheap)"
milestone: M8
type: feature
status: todo
epic: best-of-breed-swarm
priority: 5
direction: human-requested
depends_on: [BL-1181, BL-1178, BL-556]
mutation_cost: high
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1182-day-long-bob-trial-lifecycle.feature

human_approval: approved
approval_context: >
  Core trial loop from BoB intake. Trial window: one operating day. Promote if
  outranks; tie → cheapest wins (cost_class / measured cost). Record losers so
  they are not endlessly re-trialled without new evidence. Live runs gated by BL-1183.

invariants:
  - "Promotion stays only when the trial effectively outranks the permanent model; a tie selects the cheaper cost_class."
  - "A losing trial reverts to the permanent model and records steward evidence against silent re-trial."
  - "Trial start and end same-role model switches transfer agent memory (BL-1178)."

required_wiring:
  - "model steward trial lifecycle::nominate seat assess promote/revert::day window"
  - "specs/pipeline/steps/index.js::bl1182DayLongBobTrialLifecycleSteps::acceptance handler registered"

description: |
  Steward nominates a candidate that might outrank the permanent model for a
  role; seat runs one day; end-of-day assess → stay if outranks, tie→cheap,
  else revert. Memory transfer on model switches. Production live trials wait
  on BL-1183.

qa_e2e_procedure: >
  (1) Nominate → trial seat armed. (2) Outrank → permanent updates. (3) Tie →
  cheaper wins. (4) Lose → revert + evidence. (5) Memory transfer on boundaries.

out_of_scope: |
  - Starting cast (BL-1181).
  - Declaring production go-live (BL-1183).

