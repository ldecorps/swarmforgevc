description: |
  ## Status: hotfix 6d8a61c1dd landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What the hotfix changed

  BL-1227 (af55356bde, 2026-08-28) compressed Article 5.3 to fit the boot
  prefix: the sentence "A consolidation never drops a human sentence."
  became the section heading, "into the resulting ticket or tickets"
  became "ticket(s)", "The clause binds the ACT" became "Binds the ACT",
  and the refusal clause lost its capital. The handler's four literals now
  follow that wording; the long form stays in
  reference/05-amendments-detailed.md.

  ## What is wanted in this parcel

  - Review the four literals against the scenarios' claims, and say in the
    evidence whether the handler should read the detailed reference too.
  - Evidence: the review and one run of the feature.

  ## Scope

  The step handler and evidence.

