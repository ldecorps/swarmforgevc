approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: the two registry files
  are backlog/standing-reds.tsv (owner in column 3) and
  swarmforge/scripts/property_suite_standing_allowlist.tsv (owner as the
  "owner BL-<n>" token in the rationale column); for each, every row
  present on origin/main whose owner is an OPEN ticket other than the
  landing ticket and which the replay tree lacks is put back into the
  replayed file byte-identical, and one REGISTER_ROW_RESTORED line names
  the file, the row's file column and its owner. FIRM: a row owned by
  the landing ticket that the tip removed still leaves (the drain rule);
  a row owned by a CLOSED ticket that the tip removed also leaves (the
  stale-row retirement lands like any other own change) - only an OPEN
  other owner's row is protected. FIRM: nothing else about the replay
  changes; an unreadable registry file on either side fails closed
  (refuse, never guess).

invariants:
  - "A land never reduces another open ticket's ownership: for every row of either registry file on origin/main whose owner is open and not the landing ticket, the same row is on origin/main after the land."
  - "The landing ticket's own rows are never protected from itself: a row it owns and removed at its tip is absent after the land, exactly as before this change."

description: |
  ## What is wrong

  `land_step_lib.bb` builds the tip-pure replay by taking each delivered
  path WHOLE from the parcel's tip (BL-1241, BL-1473). For a shared
  registry file that every ticket edits - `backlog/standing-reds.tsv`,
  and its mirror `swarmforge/scripts/property_suite_standing_allowlist.tsv`
  - "whole from the tip" means the tip's row set replaces main's. A row
  that went missing on the branch for any reason (a merge on a batch
  branch, a conflict resolution, a stale worktree) is deleted from main
  by whichever parcel lands next, whatever that parcel is about.

  2026-09-16 18:17Z: BL-1548's land (2c1c44e2cc, "tip-pure replay onto
  origin/main") changed the register by exactly one line:

  ```
  -property  extension/test/telegramFrontDeskBotCli.property.test.js  BL-1595  2026-09-16  ...
  ```

  BL-1548 (the launcher's SKIP_DAEMON audit line) never touched the
  register on purpose; BL-1595 was active, mid-rework after an architect
  bounce, and its file still red. `standing_red_register_cli.bb` then read
  the file as unowned, BL-1429 dropped the cap to 1 (coordinator note
  008830, 17:26Z), and the specifier restored the row by hand
  (`backlog/evidence/BL-1604-specifier-adjudication-of-coordinator-unowned-red-20260916.md`).
  Same day, same shape, caught only by luck: BL-1589's tip carried
  BL-1588's four-row removal (blocked because BL-1588 was BOUNCED,
  BL-1481) and BL-1573's tips lacked the bl1280 allowlist row (blocked
  because the touching commit's subject was AMBIGUOUS, BL-1544). An open,
  unbounced owner with a cleanly attributed tip has no gate at all.

  ## What is wanted

  - Before publishing, the replay builder compares each registry file's
    rows on origin/main with the replay tree's: every origin/main row whose
    owner is an open ticket other than the landing ticket and which the
    replay lacks is restored byte-identical, and `REGISTER_ROW_RESTORED
    <registry> <file> <owner>` is printed per row (scenario 01, rows 1 and
    4).
  - A row owned by the landing ticket that the tip removed leaves
    (scenario 01, row 2); a row owned by a closed ticket that the tip
    removed leaves (row 3).
  - An unreadable registry file on either side refuses the land naming
    the file (scenario 02, fail closed).

  ## How (direction, not mandate)

  - Row identity is the `file` column; owner from column 3 (register) or
    the `owner BL-<n>` token (allowlist). Open ticket ids: the basenames
    under backlog/paused and backlog/active on origin/main, the set
    `qa_hold_lib.bb` and `closed-on-main?` already compute - reuse, never
    a second reader.
  - Implement as one pure function over (origin rows, replay rows,
    landing id, open ids) -> (rows to restore), applied to the replayed
    blob in `build-replay` (or whatever the tip-pure builder is named at
    the time) before the tree is written; `land_step_cli.bb` prints the
    lines. Drive the real CLI against a git fixture the way
    `bl1481SharedPathContentCheckSteps.js` does; the pure function gets
    bb runner cases.
  - Documenter: the BL-1241 how-to gains a section; the standing-red
    register header sentence "a row leaves in the same land that turns
    the test green" gains "and no other land removes it".

constraints: >
  land_step_lib.bb, land_step_cli.bb, the bb runner, the feature, the
  handler, evidence and docs only; no change to what the replay carries
  for any other path; no extension/src. The step handler lands with the
  feature (BL-233). Evidence named BL-1604-*.

out_of_scope: |
  - Why rows go missing on branches (merge resolution on batch branches;
    BL-1576's merge-drop guard covers one shape at send time).
  - The pole register of BL-1598 (its rows are owned by the epic; same
    rule can be extended once it lands - a follow-up if a land drops one).
  - Moving register-row removal out of the coder's commit entirely
    (recorded candidate on BL-1589's adjudication; this ticket is the
    smaller, sufficient protection).

qa_e2e_procedure: |
  On the parcel commit:
  1. `bb swarmforge/scripts/test/land_step_lib_test_runner.bb` -> green
     with the new cases named.
  2. Acceptance resolving both scenarios
     (`bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1604-*.feature`).
  3. Scratch reproduction of 2c1c44e2cc's shape: origin/main register
     with a row owned by an open ticket X; a lander Y's tip whose register
     lacks that row; `land_step_cli.bb Y <tip>` prints
     `REGISTER_ROW_RESTORED backlog/standing-reds.tsv <file> X` and the
     published register carries the row.
  4. `git diff <parent>..<parcel> -- swarmforge/scripts/land_step_lib.bb`
     shows the pure function and its one call site, nothing else in the
     replay path.

