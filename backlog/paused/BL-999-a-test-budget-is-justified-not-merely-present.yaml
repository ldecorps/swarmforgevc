id: BL-999
title: "BL-969's standing guard asserts a heavy test's timeout is PRESENT, never that it is ADEQUATE - so two siblings on the same derive+render path still carry 45000ms after one was measured failing at 48926ms under load 77, and the guard stays green while they flake"
milestone: M8
type: defect
severity: medium
status: todo
epic: code-quality-gates
human_approval: pending
priority: 30
direction: pipeline-note
depends_on: [BL-969]
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-999-a-test-budget-is-justified-not-merely-present.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl999::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "A budget is justified by a measurement, not merely present. Every explicit timeout in this file traces to a recorded worst-case run and the margin applied to it, and the guard checks that relation rather than the field's existence."
  - "Structurally identical tests carry identical budgets. Two tests on the same derive+render path never differ in budget because one had a ticket written about it and the other did not."
  - "A test left on the suite default is a recorded decision with a stated margin, never an omission nobody examined."

description: >
  `extension/test/renderBriefingBurndownCli.test.js` has five test call
  sites, three of which derive from the real repo and render. BL-969 raised
  ONE of them - the no-flags CLI test - from the 20000ms suite default to
  90000ms, on an explicit measured basis: a 50808ms probe at load 148, a
  ~23s hardender run, and its own qa_e2e runs of 32245ms and 54991ms at load
  40-58, giving ~1.6x the worst measurement. That reasoning is sound and is
  recorded in the file.

  It was applied to one test. Its two siblings on the same path still carry
  `45000`, set earlier and never revisited.

  THE FIELD DATA, measured by the coder during BL-969's own qa_e2e runs and
  surfaced by note rather than folded in (BL-969's own boundary: "that is a
  new defect note and its own ticket"):

  - A 45000ms fallback sibling FAILED at 48926ms, then passed twice at
    42568ms and 37086ms, at load up to 77. The budget is not marginal - it
    has been exceeded.
  - The fixture-fed CLI test, on the 20000ms suite default, brushed that
    default once before passing at 13585ms.

  WHY THE GUARD DID NOT CATCH IT, which is the part worth fixing rather than
  just bumping numbers. BL-969 shipped a standing invariant test
  (`bl969RealRepoTimeoutInvariant.test.js`) that classifies each call site by
  data source and then asserts, for each real-repo test:

    assert.ok(typeof c.timeoutMs === 'number',
      `real-repo test '...' runs on the suite-default timeout - it must carry its own (BL-969)`)

  That is a presence check. `45000` is a number, so both siblings satisfy it
  while carrying a budget the field has already exceeded. The guard is green
  and the tests flake - the same shape as a scanner reporting a false zero or
  an audit pinned to a dead archive: an assertion that holds while the thing
  it guards does not.

  How (direction, not mandate): two halves, and the second is the durable
  one. Bring the siblings onto the same measured basis BL-969 used, so the
  three tests on one path stop disagreeing. Then strengthen the guard from
  presence to RELATION - each budget compared against a recorded worst-case
  observation for that test, with the margin explicit - so the next
  under-budget is caught by the guard rather than by a coder noticing a red
  during someone else's qa_e2e run. Where the measurements live (beside the
  test, or a small recorded table the guard reads) is the implementer's call;
  what matters is that a number and its justification cannot drift apart.

constraints: >
  Firm lines:

  - Do NOT amend BL-969. It is active and in flight, its own scope line
    explicitly deferred this to a follow-on ticket, and its 90000ms basis is
    correct - this ticket extends that reasoning rather than revisiting it.
    Hence `depends_on: [BL-969]`.
  - Do NOT raise the suite default. BL-969 kept `testTimeout: 20000` untouched
    and its acceptance scenario 02 asserts that; raising the default to absorb
    three slow tests would hide every other test's real cost and silently
    weaken the whole suite's speed gate.
  - Do NOT solve the flake by retrying, by marking a test flaky, or by
    skipping it under load. The runs are genuinely that slow under real host
    load; the budget is what is wrong.
  - The fixture tests are in scope only for invariant 3 - deciding and
    RECORDING whether the default is adequate for them. This ticket is not a
    licence to give every test in the file an override.
  - Preserve BL-969's 3-real-repo/2-fixture classification and its
    code-token markers (`writeFixtureSnapshot(` / the quoted `--snapshot`
    flag). The two fallback tests have the word "snapshot" in their NAMES,
    which is exactly why the markers are code tokens rather than words -
    a guard rewritten to match on names reintroduces that trap.

qa_e2e_procedure: >
  From the repo root. Load must be recorded alongside every timing, because
  a run at idle proves nothing about a budget set for load.

  1. Reproduce the sibling failure at the parent commit. Run the two 45000ms
     fallback tests under real load (record `uptime` before and after) and
     confirm at least one run exceeds 45000ms. The coder measured 48926ms at
     load up to 77; if the host is quiet, say so and note that the
     reproduction is from the recorded evidence rather than a fresh run
     rather than claiming a clean repro.
  2. Confirm the guard's blind spot directly, at the parent commit: set one
     sibling's budget to an absurdly small explicit number (say `1`) and
     confirm `bl969RealRepoTimeoutInvariant.test.js` still PASSES. That is
     the defect in one command - a present-but-useless budget satisfies it.
  3. At the parcel commit, repeat step 2 and confirm the strengthened guard
     now FAILS, and that its message names the test, its budget, and the
     measurement it fails to cover.
  4. Confirm invariant 2: assert the three real-repo tests' budgets are equal,
     and that changing one alone fails the guard.
  5. Confirm invariant 3: assert the two fixture tests' recorded margin
     against the 20000ms default exists, and that deleting that record fails
     the guard. A test silently sitting on the default must not pass.
  6. Confirm the suite default is untouched: `git diff main -- extension/vitest.config.mjs`
     is empty, and BL-969's acceptance scenario 02 still passes.
  7. Confirm BL-969's classification survives: the guard still reports exactly
     3 real-repo and 2 fixture call sites, still keyed on the code-token
     markers rather than test names.
  8. Run the acceptance feature, all scenarios green, handler registered in
     `specs/pipeline/steps/index.js`. Run the full
     `renderBriefingBurndownCli.test.js` twice under load and record both
     wall-clock results per test.

notes: >
  Source: coder note 20260820T163148Z_000391, "burndown sibling+fixture
  budgets flake under load 40-80 - data in BL-969 commit". The data is in
  `9ff014998`'s message and is reproduced above rather than left as a
  pointer, since that commit is on the cleaner's branch (`bbedde169`) and not
  yet on `main`.

  A hypothesis I formed and discarded, recorded so nobody re-runs it: I
  expected the fixture-fed CLI test's 13585ms to come from spawning a
  subprocess. It does not - `runCli` at `:72` is the in-process thin-wrapper
  pattern the engineering rules require, stubbing `process.cwd`/`argv` and
  capturing `process.stdout.write`. So the cost is inside the render path,
  not process startup, and any fix that "avoids spawning" would be aimed at
  something that is not happening.

  Severity `medium`, not `high`: this is a flaky test budget, contained to
  one file, that produces a loud red rather than a silent pass. It costs
  reviewer turns and erodes trust in the suite - the coder hit it during
  someone else's ticket - but nothing ships wrong because of it. What lifts
  it above cosmetic is the guard: a green invariant sitting in front of a
  known-bad budget is how this stays unfixed.

  Same family, worth reading together: BL-986 (scanner reports a false zero
  after the prose it counts moved out of its scanned set), BL-987 (audit
  pinned to a frozen archive), BL-998 (five regression guards that test live
  state instead of their fixture). All four are assertions that hold while
  the thing they guard does not.

  Also recorded from the same commit: the coder attempted a full-file
  double-run four times and "each detached run was killed by the session's
  process reaper (the BL-995 class)". That is BL-995 reproducing in the field
  during unrelated work, and it is why the evidence above is per-test rather
  than whole-file. It is not this ticket's to fix.

  IR-DRY: zero findings.

approval_context: >
  One judgement is mine and worth a look: I scoped this to strengthen the
  guard, not just to raise two numbers.

  Bumping 45000 to 90000 in two places is a five-minute fix and would end the
  flake today. I have written the ticket to also change the guard from
  "a timeout is present" to "a timeout covers its recorded measurement",
  because the numbers-only fix leaves the exact hole that let this happen -
  BL-969 set a correct budget for one test while two identical siblings kept
  a stale one, and the standing guard had nothing to say about it. If you
  would rather take the quick fix now and leave the guard alone, say so and
  this becomes a much smaller ticket; my worry is that the next slow test
  gets a number nobody checks.

  Severity `medium` is argued in `notes:` - a loud, contained flake rather
  than a silent wrong result. Push back to `low` if a flaky budget in one
  test file reads as cosmetic to you, though I would note the coder lost
  four attempted verification runs to it during a different ticket.
