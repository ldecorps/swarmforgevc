invariants:
  - "The exemption is decided PER OFFENDING PATH, by the provenance of the content being imported into that path — never by the incoming branch tip standing in for all of them. A path whose imported content QA did not publish is still refused in the same merge in which sibling paths are allowed."
  - "Provenance that cannot be established is never approval. An anchor commit that does not resolve, a path with no commit on the incoming side, or any `is_qa_ancestor.sh` exit other than 0 refuses that path."
  - "There remains exactly ONE definition of `QA-approved tip` in the repo (`is_qa_ancestor.sh`). This ticket changes which commit the question is asked ABOUT; it does not restate, wrap, or fork the predicate itself."

approval_context: >
  Sign-off wanted on severity only.

  Filed `high`, matching BL-925's own filing for the same failure on the same
  path. Nothing is down: the coordinator got past the 2026-08-23 reconcile by
  keeping "ours" for every QA-exclusive path, which is the correct
  non-impersonating workaround. But it does not clear the condition — those
  files are still only on `origin/main`, the checkout is still multi-hop
  behind for them, and the next reconcile tick meets the identical refusal.
  So local `main` and `origin/main` keep drifting on pipeline code until a
  human intervenes, which is exactly the standing condition BL-925 was filed
  `high` to end and did not.

  Read it as `medium` if you would rather; only the severity field changes,
  and the Article 3.2.4 expedite lane is the only consequence.

source: |
  Coordinator `note` (priority `00`) to the specifier, 2026-08-23 02:14:51Z:

  > Defect: BL-925 guard checks MERGE_HEAD only, misses multi-hop reconciles

  Raised out of a manual reconcile of local `main` against `origin/main`
  (37 local-only / 49 origin-only commits) that the automated BL-891 sweep
  could not complete. The coordinator explicitly declined to patch it inline —
  "fixing the exemption's anchor selection is pipeline-code work, out of
  coordinator's remit" — and flagged it here instead.

description: |
  ## What happens

  BL-925 shipped the exemption that lets a non-QA writer complete a merge which
  only IMPORTS pipeline code QA already published. Read at `main`,
  `check_pipeline_code_on_main.sh` grants it like this:

  1. Collect the offending paths from `git diff --cached --name-only` against
     the three QA-exclusive prefixes.
  2. Find the incoming merge parent — `MERGE_HEAD`, falling back to a lone
     `GITHEAD_<sha>` env var.
  3. Ask `is_qa_ancestor.sh <that one sha>`. If it does not answer yes, the
     exemption is withdrawn **for the whole merge**.
  4. Only if it did answer yes, diff each offending path's staged content
     against that parent and keep refusing any path that differs.

  Step 3 is the defect. The single sha it asks about is the incoming branch
  TIP. On a single-hop-behind reconcile the tip IS QA's landing, so the answer
  is yes and everything works — that is the case BL-925 was built and tested
  against. Once the checkout is several commits behind, `origin/main`'s tip is
  whatever landed last, which is routinely a coordinator bookkeeping commit
  made well after QA's last landing. The tip is then not an ancestor of
  `swarmforge-QA`, the exemption is withdrawn wholesale at step 3, and every
  offending path is refused — including paths whose content QA demonstrably
  did publish.

  ## Measured, not inferred

  On the 2026-08-23 reconcile (merge `37efb07e3`):

  - incoming tip `e57ff6406` — `is_qa_ancestor.sh` exits **1**, a clean no.
    It is itself a merge commit, not a QA landing.
  - the pipeline paths it carried (`extension/test/readLiveRoleHeldTicketsCli.test.js`,
    `specs/pipeline/steps/bl487…`, `bl814…`) each last-touched on the incoming
    side at `a55b5156ba` ("BL-1029: one shared constructor quotes every respawn
    launch path") — `is_qa_ancestor.sh` exits **0** for it, independently, for
    every one of them.

  So the content was approved and the anchor was not. The coordinator's
  workaround was to keep "ours" (defer those files entirely) so the merge
  commit touched no QA-exclusive path — correct, non-impersonating, and it
  leaves the code only on `origin/main`, to meet the same refusal next tick.

  ## Shape of the fix (direction, not mandate)

  Anchor the question per path rather than per merge: for each offending path,
  the commit to ask `is_qa_ancestor.sh` about is the one that last touched THAT
  path on the incoming side (`git log -1 --format=%H <incoming> -- <path>`),
  not the incoming tip. BL-925's content-identity check is unchanged and still
  required — the staged content for the path must still be exactly what the
  incoming parent holds, so a fresh edit staged on top of a legitimate import
  is still refused (BL-925 invariant 1, restated here as invariant 1's second
  sentence).

  A `git merge-base <incoming> swarmforge-QA` anchor is the obvious
  alternative and may well be simpler; it is not mandated either way. What is
  mandated is invariant 1 — the granularity of the decision — and invariant 3:
  whatever anchor is chosen, the yes/no question is still asked of
  `is_qa_ancestor.sh` and nowhere else.

  ## Two hazards worth naming before implementing

  **History simplification.** `git log -1 <incoming> -- <path>` walks a
  simplified history when `<incoming>` is itself a merge — and on this very
  incident it was one. Satisfy yourself that the commit it returns is the one
  whose blob the merge actually took, or pick an anchor that does not depend
  on simplification. If it cannot be established, invariant 2 says refuse.

  **The empty answer.** For a path that exists locally but not on the incoming
  side, that command prints nothing. Passing an empty string on to
  `is_qa_ancestor.sh` must not be mistaken for either verdict — it is
  invariant 2's fail-closed case and it was observed live while probing this
  ticket (three `specs/pipeline/steps/bl*Steps.js` files, local-only, returned
  empty).

  ## What must still be refused

  Everything BL-925 already refuses. A non-QA writer authoring new pipeline
  code on `main` with no merge in progress; fresh pipeline edits staged on top
  of a legitimate import; a path whose incoming content QA never published; a
  path QA published and then bounced (the `is_qa_ancestor.sh` bounce veto,
  BL-952 — scenario 02 row 3 is there to prove the shared predicate is still
  the thing being consulted).

  ## Sibling-contract check (BL-1006)

  This slice changes the anchor BL-925's own feature file was written over.
  Before forwarding, re-read
  `specs/features/BL-925-reconcile-merge-of-qa-published-tip-completes.feature`
  and its handler
  `specs/pipeline/steps/bl925ReconcileMergeOfPublishedTipSteps.js`, and confirm
  scenario 05 (`unpublished-tip-is-not-waved-through-05`) still asserts
  something true under the new anchor. Its Gherkin reads "an incoming commit
  touching pipeline code that is not an ancestor of the QA branch", which is
  anchor-agnostic and should survive — but its handler binds to a named check
  line in `test_pipeline_code_on_main_guard.sh`, and if that fixture's refusal
  came from the TIP rather than from the pipeline-touching commit, the fixture
  is what needs correcting. Retire, never reword, if a scenario turns out to be
  falsified; and re-tense the `Feature:` narrative if it now states a false
  present. No gate catches this — the runner throws only on a MISSING handler.

  ## Explicitly not the fix

  Do not skip hooks (`--no-verify`). Do not set `SWARMFORGE_ROLE=QA` on the
  reconcile daemon. Do not add a second ancestry predicate in bash or Babashka.
  Do not widen the exemption to "a merge is in progress" — that is the trap
  BL-925's invariant 1 exists to forbid and it is unchanged here.

qa_e2e_procedure: |
  1. Fixture repo, multi-hop shape: local `main` with bookkeeping-only commits;
     `origin/main` carrying a QA landing that touches `extension/src/` and
     `specs/pipeline/steps/`, followed by two further bookkeeping commits so the
     TIP is not the landing; `swarmforge-QA` with the landing as an ancestor.
     Merge with no `SWARMFORGE_ROLE` set and confirm the merge commit is created.
     Before the fix this refuses; that is the regression under test.
  2. Repeat step 1 completing the merge with `git commit --no-edit` instead of
     `git merge`, so the `pre-commit` hook path is exercised too. Both must
     allow — BL-925's both-hooks requirement is unchanged.
  3. Same fixture, but stage a fresh edit to a file under `extension/src/` on
     top of the merge. Confirm the commit is refused naming ONLY that path, and
     that the imported paths are not named. This is invariant 1 and the single
     most important negative case.
  4. Same fixture, but make one offending path's last-touching incoming commit a
     non-QA-ancestor while the others remain published. Confirm that one path is
     refused and the others are allowed in the same merge.
  5. Record a bounce verdict against one offending path's last-touching incoming
     commit (either store `is_qa_ancestor.sh` reads) and confirm that path flips
     to refused — proof the shared predicate is still the consulted authority.
  6. Fail-closed: a path present locally and absent from the incoming side's
     history, and an `is_qa_ancestor.sh` undeterminable exit (e.g. an obstructed
     `.swarmforge/bounces`), each refuse rather than allow.
  7. With no merge in progress, author a new pipeline-code commit on `main` as a
     non-QA writer and confirm it is refused exactly as before.
  8. Run BL-925's own suite (`swarmforge/scripts/test/test_pipeline_code_on_main_guard.sh`)
     and its acceptance scenarios unchanged, green.
  9. On the live host, let the BL-891 reconcile sweep run a tick against a real
     multi-hop-behind `main` and confirm the join completes with the pipeline
     paths included and no tick logs a conflict. The 2026-08-23 reconcile of
     `37efb07e3` is the reference case; `e57ff6406` / `a55b5156ba` are the shas
     that made the anchor gap visible.

out_of_scope: |
  - BL-891's sweep itself. It correctly treats a non-zero `git merge` as a
    failure and aborts; the refusal it is reacting to is the bug, not its
    reaction. Its no-half-finished-merge invariant is untouched.
  - BL-1085's push-sweep caching. Adjacent daemon work, different mechanism,
    deliberately not folded in.
  - Widening or narrowing the QA-exclusive path set (`extension/src/`,
    `extension/test/`, `specs/pipeline/steps/`). BL-632's set stands.
  - BL-632's deny-by-default for a bare human shell or a role whose env is
    lost. Unchanged.
  - Moving `main` off the master checkout, or letting the coordinator push.
    Both were already declared out of scope on BL-925 and remain so.

notes: |
  **Probed before speccing; the coordinator's account held up exactly.** Ran
  `is_qa_ancestor.sh` against the real reconcile merge `37efb07e3`: second
  parent `e57ff6406` exits 1, while the last-touching incoming commit for its
  QA-exclusive paths (`a55b5156ba`) exits 0. Read
  `check_pipeline_code_on_main.sh` at `main` and confirmed step 3 above is a
  single call against one sha, with the per-path loop reachable only after it
  passes.

  **The empty-anchor case is mine, not the note's.** Found while probing: three
  local-only `specs/pipeline/steps/bl*Steps.js` files return no last-touching
  commit on the incoming side. Invariant 2 and scenario 02's fourth row exist
  because of it.

  **No `required_wiring:`.** Same reasoning BL-925 recorded for itself — the
  change is inside a script both git hooks already delegate to, so there is no
  new call site the ticket's value depends on and any entry would match at HEAD
  and pass vacuously. Per BL-874 that is worse than none.

  **Shell-test discipline applies.** Stock macOS `/bin/bash` 3.2 —
  `${arr[@]+"${arr[@]}"}` for possibly-empty arrays, which this guard already
  does. Extend `swarmforge/scripts/test/test_pipeline_code_on_main_guard.sh`
  rather than starting a second suite.

  **BL-233 obligation.** All three scenarios are new and their step handlers
  (`specs/pipeline/steps/bl1096PerPathImportProvenanceSteps.js`) must land in
  THIS parcel; the acceptance runner throws on any scenario it cannot resolve.
  The `<provenance>` column validates against explicit KNOWN_VALUES, never
  passthrough.

  **Gherkin hygiene run at mint.** `gherkin_lint_gate.sh` clean; APS IR-DRY
  checker reports 0 findings (an earlier draft split scenario 02 and a separate
  fail-closed outline, which the checker flagged as two possible-synonym pairs —
  merged into one outline).

  **Related, deliberately not conflated.** BL-925 built the exemption this
  narrows the anchor of; BL-632 is the guard whose intent stands; BL-952 added
  the bounce veto inside the shared predicate; BL-1025 added the expedite-hat
  approval route to it; BL-891 owns the sweep; BL-920 is the
  escalation-on-persistent-block sibling.
