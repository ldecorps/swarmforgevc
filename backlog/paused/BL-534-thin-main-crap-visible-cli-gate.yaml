description: >
  WHAT. Add a hard gate so CLIs under extension/src/tools/ keep main() a
  thin wrapper over exported, unit-testable helpers. Logic left only in
  main() is CRAP-invisible (0% coverage via subprocess-only paths) and
  slips regressions — Rank 7 in the recurring-failure-mode audit
  (BL-FIX-007 → BL-534).

  WHY. Recurring hardener rule_proposals (L5–L6). Engineering already
  states the thin-wrapper rule; this ticket makes it machine-checkable
  the way BL-259 made dependency rules machine-checkable.

  HOW (direction, not mandate).
  - Runner: node extension/out/tools/thin-main-gate.js (source
    extension/src/tools/thin-main-gate.ts), mirroring dependency-gate's
    parcel-vs-full CLI shape. npm script thin-main-gate in extension/
    package.json.
  - Measure: for each scoped file that defines main, main must be
    exported and cyclomatic complexity of main's body must be <= 2.
  - Scope: extension/src/tools/**/*.ts (parcel args = changed paths;
    no-arg = full tools tree).
  - Grandfather: parcel mode fail-closed, no allowlist. Full-repo mode
    may skip basenames in extension/thin-main-allowlist.txt; first land
    may seed from a measured baseline; afterward the list only shrinks.
  - Pure pass/fail derivation lives in a testable module (e.g.
    extension/src/quality/thinMainGate.ts); the tools file is the thin
    CLI wrapper — dogfood the rule.

qa_e2e_procedure: >
  (1) Compile extension. (2) Fixture: a tools file with a fat main
  (CC>2) → parcel-mode gate exits non-zero and names the file.
  (3) Fixture: thin exported main → exit 0. (4) Path outside tools/ →
  exit 0. (5) Full-repo with allowlisted fat main alone → exit 0; add a
  non-allowlisted fat main → exit non-zero. (6) npm run thin-main-gate
  works from extension/. (7) Hardener/architect can invoke the same
  binary on parcel paths. Record CRAP/mutation on the quality module.

out_of_scope: |
  - Rewriting every existing fat main in the same parcel (allowlist seed
    is enough for first land).
  - Babashka/shell CLIs outside extension/src/tools/.
  - Changing the engineering.prompt prose rule (already stated).
  - Enforcing CRAP thresholds themselves (npm run crap remains separate).

