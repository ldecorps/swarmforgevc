  Minted 2026-09-24 by the specifier (claude-opus-5-5 seat) on the human's
  ruling, the same pass. The intake's five "needs specifying" points,
  settled: (1) who may call and how - any role, by a note or git_handoff
  to the documenter, as today; the prompt carries the contract; (2)
  publish contract - a commit to document in, a commit or note out, no
  publish without a commit (prompt prose, landed at mint); (3) queue,
  roles.tsv row, window - queue and row stay, the window becomes on-demand;
  (4) morning briefing - stays a documenter call (ruling A of 2026-09-07
  stands; the ceremony already starts the session via consult_spawn_cli.bb);
  (5) the freed pack slot - not reassigned (epic BL-1709 remaining slice).
  Prompt half (BL-798): the call contract and the on-demand session rule
  are landed by the specifier in swarmforge/roles/documenter.prompt
  section "You are a role any agent can call to publish" in the mint
  commit itself; nothing in this parcel builds or edits that prose.
  This intake is also the second input of the 2026-09-23 specifier A/B;
  see backlog/evidence/specifier-ab-20260923-arm-claude-opus-5-5-20260924.md.

