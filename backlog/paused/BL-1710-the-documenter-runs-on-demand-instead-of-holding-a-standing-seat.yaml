id: BL-1710
title: "The documenter runs on demand instead of holding a standing seat - a pack window declared on-demand keeps its roles.tsv row, worktree and mailbox so every hop is unchanged, starts no session at launch, gets its own session started through the consult path when its mail arrives and torn down by the existing consult sweep when idle, raises no missing-session alarm while dormant, and full-forge declares its documenter on-demand"
milestone: M8
type: feature
status: todo
epic: on-demand-roles
priority: 10
direction: human-requested
depends_on: []
