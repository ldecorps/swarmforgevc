id: BL-1726
title: "BL-1705's landed ghost reaper (ca2a683e48) reaps ANY llama-server whose parent is not a live ollama serve, at any age - so a llama.cpp server the human starts by hand outside the swarm (parent: a shell) is killed at the next janitor sweep; a runner counts as ollama's own only when its executable is inside an ollama installation's lib directory AND its --model is an ollama model blob, and every other llama-server is never signalled"
milestone: M8
type: defect
severity: high
# high: a live safety fault - the swarm's janitor (run by operator_runtime
# and onboarder_supervisor) can kill a process it does not own, outside
# the swarm, the moment one exists; the human's GPU is due within days and
# local-model experiments are the queue-jump priority. The specifier's own
# BL-1705 spec asked for the over-broad rule ("reap, any age"); QA passed
# the build against it and flagged it (note 003143). Not critical: no such
# process runs now - the only llama-server is ollama serve's own child.
status: todo
