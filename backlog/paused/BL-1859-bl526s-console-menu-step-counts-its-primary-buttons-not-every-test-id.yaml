description: |
  ## Status: hotfix 2c805e9b0b landed the fix

  This parcel is its stamp-off: the pipeline's review of what landed. The
  coder finds the step handler already changed. Review it, do not
  re-apply it.

  ## What the hotfix changed

  `specs/pipeline/steps/bl526MiniappConsoleMenuSteps.js` held three
  assertions that later approved tickets had made stale:
  1. "Exactly two data-testid" on the console menu. BL-572, BL-592,
     BL-696 and later tickets added buttons on purpose, and the menu
     carried 8 on 2026-10-01 (pipeline-grid, mono-router-feed,
     paused-ticket-pager, catch-up-pager, epic-reorder, spec-tree,
     context-budget, lets-talk). The Given now checks that the menu opens
     with pipeline-grid then mono-router-feed: the part BL-526 owns (the
     BL-1006 frozen-boundary shape). The minted ticket asked to count
     "primary buttons by their selector", but no selector separates those
     two from the rest (all are `a.btn`, and mono-router-feed is
     `.secondary` like the other six), so the hotfix checks their order.
  2. `pipeline-board?token=` and `resident-pane?token=`. The pages
     authenticate with `?bearer=` since BL-696. These were masked behind 1.
  3. `coordinator-pane`. The live screen shows every live pane in one
     grid since 2026-07-22 (9ea75f43c8), and that split id is gone. The
     check is dropped. The live feed is still asserted by the
     `/resident-pane?bearer=` poll and the "Swarm Live Screen" title.
  The feature's narrative line is re-tensed from "a menu with two
  buttons" to "the menu to open with two buttons". The scenario text is
  unchanged.

  ## What is wanted in this parcel

  - Review the three changes against the scenario's observable claims.
    If one of them hides a real regression rather than stale wording,
    fix it here (product code included, then add the stages it needs) or
    raise it to the specifier as a note.
  - Evidence: the review, and the 2026-10-01 menu census above re-run on
    the parcel commit.

  ## Scope

  The step handler, the feature's narrative line, evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-526-miniapp-console-menu-pipeline-grid-mono-feed.feature`:
     1 of 1 ok. Measured on the hotfix tree at mint: 1 of 1 (it was 0 of
     1, "found 8").
  2. `bb swarmforge/scripts/standing_red_register_cli.bb .` reports no
     row for BL-526's feature (the hotfix removed it).
  3. Read the coder's evidence for the review of the three changes.

