source: |
  Specifier, 2026-10-01, while verifying hotfix c54b9060a6 (BL-1858):
  `node specs/pipeline/cli.js specs/features/BL-526-miniapp-console-menu-pipeline-grid-mono-feed.feature`
  printed 0 pass, 1 fail: "Scenario \"Accessing Pipeline Status Grid\"
  failed at step \"Given the miniapp console menu is open on a portrait
  phone viewport\": expected exactly two primary buttons, found 8".
  backlog/evidence/BL-979-coder-findings-20260821.md line 84 already
  recorded it as "unchanged - pre-existing" on 2026-08-21. No
  backlog/standing-reds.tsv row named it.

description: |
  ## Why

  `specs/pipeline/steps/bl526MiniappConsoleMenuSteps.js` asserts
  `(html.match(/data-testid="/g) || []).length === 2` on
  `getConsoleMenuUiHtml()`. That counts every element with a test id, not
  the menu's primary buttons. `consoleMenuUiHtml.ts` last changed in
  BL-592's live spec tree (2026-08-27) and the history restores after it;
  the page now carries 8 test ids. The scenario's own text, two buttons
  for the pipeline grid and the mono-router feed, may still hold.

  ## What is wanted

  - The Given counts the primary buttons by the selector those two
    buttons actually carry, and still finds exactly the pipeline-grid and
    mono-router-feed buttons.
  - If the menu really has more than two primary buttons now, do not
    loosen the count to pass: stop and send the specifier a spec-gap note
    naming what the menu shows, because the scenario would then be stale.
  - The register row this commit adds is retired by the land (BL-1631).

  ## Scope

  The step handler and evidence. No product code.

qa_e2e_procedure: |
  On the parcel commit, ONE run (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-526-miniapp-console-menu-pipeline-grid-mono-feed.feature`:
     1 of 1 ok. Measured on main at mint: 0 of 1, "found 8".
  2. The register row naming the BL-526 feature is present and names
     BL-1859 on the parcel; after the land, no row names it.

