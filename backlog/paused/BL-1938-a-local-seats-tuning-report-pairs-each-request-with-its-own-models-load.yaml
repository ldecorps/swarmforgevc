description: |
  ## What is wrong

  `served-at-or-before` in `swarmforge/scripts/local_seat_tuning_report_lib.bb`
  (BL-1851) pairs a request with the latest Ollama load of ANY model at or
  before the request's time. One Ollama server can load more than one
  model: a second seat, the host-agent chat, or a task outside the swarm
  on the server BL-1861 leaves running. A request can then print another
  model's layers and KV cache as how its own model was served.

  The data to pair correctly is on disk:
  - each request record carries its model tag (`"model":"ista-iq3s-coder:latest"`);
  - each `starting llama-server` line in the Ollama log carries
    `--model <models>/blobs/sha256-<hex>`;
  - the tag's manifest, `<models>/manifests/registry.ollama.ai/library/<name>/<tag>`,
    names that blob in its `application/vnd.ollama.image.model` layer, as
    `sha256:<hex>`.

  ## What is wanted

  The report pairs each request with the latest load of its own model at or
  before it. A request whose model has no such load, or whose tag resolves
  to no blob, is served as "unknown serving".

  ## How (direction, not mandate)

  - Read the models directory from the load line's own `--model` path (the
    parent of `blobs/`). Never from `OLLAMA_MODELS` or a home-directory
    guess: on this host, the launcher's `OLLAMA_MODELS` and the live
    server's blob path name different directories.
  - Parse the blob digest per load in `parse-ollama-loads` (BL-1842's lib
    owns the log, BL-1811), and resolve a tag once per report run.
  - The how-to (`docs/how-to/BL-1851-local-seat-tuning-report.md`, its
    sources table) says the pairing is by model.
