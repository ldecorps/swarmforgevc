description: |
  ## Why

  The BL-1329 epic deferred this slice in `remaining_slices:` with the
  words "ticket this once BL-625 lands; a ticket filed now would sit
  blocked behind four others". BL-625 landed (backlog/done/M8/), as did
  every other Onboarder child (BL-590, BL-624, BL-643, BL-684), and the
  Onboarder runs live as a standing ancillary on every launch
  (`swarmforge/scripts/start_ancillary_services.sh` calls
  `launch_onboarder.sh` whenever TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID
  are set). As of 2026-09-15 `find docs/how-to -iname '*onboard*'` returns
  nothing and no ticket exists for the guide. The human asked for it on
  2026-09-15 through the operator (backlog/archive/INTAKE-operator-question-1789497004958.md).

  What exists today and what this guide is NOT: the tutorial
  `docs/tutorials/Onboarding-New-Project.md` section 0 walks the human
  through the conversation reply by reply (URL, verification pastes,
  `proceed` / `show-me` / `change-this`), and the class document
  `docs/explanation/BL-643-non-pipeline-agents-as-a-class.md` says what
  shipped and where the code is. Neither answers the operator's
  questions: what starts the Onboarder, how do I know it is up, where is
  a target's state, how do I recover a stalled onboarding, how do I stop
  it. That is the how-to.

  ## What is wanted

  A task-oriented page `docs/how-to/BL-1582-onboarder-run-an-onboarding-end-to-end.md`
  that takes an operator from a swarm host with Telegram credentials to
  a target marked `done`, in this order:

  1. Preconditions on the swarm host: the env the ancillary start reads
     (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID; SWARMFORGE_SKIP_ONBOARDER
     unset), the one standing Onboarding topic reused across targets,
     and that the target's OWN bot token is a separate one the
     prerequisites phase collects.
  2. Start and verify: `./swarm` (via `start_ancillary_services.sh`) or
     `launch_onboarder.sh <swarm-repo-root>` by hand, the dry-run env,
     and the liveness evidence to check - the pid file, the log and the
     heartbeat under `.swarmforge/operator/` by their literal names, and
     `./swarm ensure` as the repair when the WARN line appears. State
     plainly that message handling runs inside the front-desk bot's
     single poller, so a running supervisor with no front desk answers
     nothing.
  3. Drive one target end to end: the five prerequisite steps in order
     (toolchain, github-access, fork-clone, target-repo, bot-token), then
     each persisted phase from `checking-prerequisites` to `done` with
     the reply that advances it and the observable post that confirms
     it. Link the tutorial for the per-reply semantics; do not restate
     them.
  4. Inspect and resume: the per-target JSON under
     `.swarmforge/onboarding/`, keyed by the normalized URL slug; pause /
     proceed; restart-resume; re-posting a URL variant resumes the same
     target.
  5. Recover: a clone/survey/propose failure holds at
     `prerequisites-ready` with a `proceed`-to-retry; two targets in
     flight means naming the target; a crashed supervisor's bounded
     restart and what the log shows when the budget is spent.
  6. Launch handoff and stop: the guide says the human runs the posted
     `./swarm <path> --pack mono-router` command on the target host
     themselves - the Onboarder never launches or observes that swarm -
     and names `stop_ancillary_services.sh` and the stop marker as the
     way down.

  Linked from `docs/index.md` under "How-to guides", and cross-linked
  from the class document's Onboarder section and the tutorial's section
  0 in the same parcel.

  ## How (direction, not mandate)

  - Coder: write the page from the code, not from memory - every
    backticked repo path and every runtime file name is taken from the
    script or module that spells it (`launch_onboarder.sh`,
    `onboarder_supervisor.bb`, `stop_ancillary_services.sh`,
    `extension/src/tools/onboarder-reconcile.ts`,
    `extension/src/onboarding/onboarderState.ts`,
    `extension/src/onboarding/contractPhaseRelay.ts`). Write the step
    handler `bl1582OnboarderHowToSteps.js` in the bl441 shape: read the
    page off disk, assert content; for scenario 02 resolve each
    backticked repo-relative path against the repo root; for scenario 03
    read the literal out of the named source file and assert the guide
    carries it.
  - Documenter: final wording, the index line, the two cross-links, and
    the BL-643 honesty rule - a sentence that names unbuilt behaviour is
    removed, not softened.

constraints: >
  Docs, one acceptance step handler, the feature and evidence only;
  `extension/src` and `swarmforge/scripts` unchanged. Shipped behaviour
  only. The step handler lands with the feature (BL-233).

out_of_scope: |
  - Any change to the Onboarder itself, its prompts, or its phases.
  - Restating the tutorial's reply-by-reply walkthrough; the how-to
    links it.
  - The other `remaining_slices` of BL-1329.

qa_e2e_procedure: |
  On the parcel commit:
  1. `swarmforge/scripts/run_acceptance.sh specs/features/BL-1582-*.feature`
     resolves every scenario green.
  2. Read the page once as an operator: every command in it is one you
     could paste on the swarm host; every `.swarmforge/` file name it
     quotes is grep-able in `swarmforge/scripts/launch_onboarder.sh`,
     `swarmforge/scripts/onboarder_supervisor.bb`,
     `swarmforge/scripts/stop_ancillary_services.sh` or
     `extension/src/tools/onboarder-reconcile.ts`.
  3. `ONBOARDER_LAUNCH_DRYRUN=1 swarmforge/scripts/launch_onboarder.sh .`
     prints the DRYRUN line the guide says it prints.
  4. `grep -n "BL-1582" docs/index.md docs/explanation/BL-643-non-pipeline-agents-as-a-class.md docs/tutorials/Onboarding-New-Project.md`
     finds the index line and both cross-links.
  5. Break-then-restore: rename one runtime file name in the page (for
     example the heartbeat file); step 1's scenario 03 fails naming it;
     restore.

