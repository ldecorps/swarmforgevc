id: BL-1416
title: "The auth-class observer (BL-536) classifies a role's whole visible pane, so a hardener mutating providerChatSeat tests that print 'invalid api key' reads as an auth failure; three respawns are skipped as busy yet still count toward the cap, and the human gets a 'provider credentials need manual attention' email for a healthy seat (hardender, 2026-09-05 05:40Z)"
milestone: M8
type: defect
