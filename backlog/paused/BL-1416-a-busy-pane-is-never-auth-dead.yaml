human_approval: pending
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is posed
  and there are no ruling_options. This is the email you asked about at
  06:41 local ("what is going on?"): a false alarm from the auth observer,
  not a credentials problem; the hardener was healthy and mid-run the whole
  time.

description: |
  ## What is wrong

  `observe-pane-auth!` (handoffd.bb) feeds the whole visible pane
  (`capture-pane -p`) to `provider-auth-observe-lib/classify-auth-signal`,
  which is `provider-compat-lib/provider-auth-error-text?`:

      (re-find #"(?i)(invalid api[\s-]?key|authenticationerror|authentication failed|unauthorized)" text)

  The hardener was hardening BL-1383 (`providerChatSeat.test.js`,
  `providerChatSeatLive.ts`) in a scoped Stryker run from ~05:13Z; that
  test file asserts `answered 401: invalid api key` and
  `/invalid api key/`, and vitest prints those into the pane on every
  mutant. handoffd.log:

      05:39:27Z auth-respawn-skip-busy hardender
      05:39:53Z auth-respawn-skip-busy hardender
      05:40:19Z auth-respawn-skip-busy hardender
      05:40:49Z auth-persist-alert hardender Auth-class failure persists on role 'hardender' after 3 respawn attempts (BL-536). Provider credentials likely need manual attention.
      05:40:49Z auth-persist-telegram hardender
      05:40:49Z auth-persist-email hardender

  `do-auth-respawn!` correctly refused to respawn into a busy pane each
  time ("Mirrors do-respawn!'s busy precheck exactly"), but
  `decide-episode-action` had already counted the attempt, so three
  skipped attempts reached the cap and `send-auth-persist-alert!` fired.
  The hardener's claude process (started 05:13:19Z) ran uninterrupted
  throughout; its pane at 05:45Z showed "All 515 tests pass. Now let's
  rerun the scoped mutation pass". The human received the email at 06:40
  local and asked what was going on.

  The busy check lives one step too late: classification should never
  see a busy pane as auth-dead, because a runtime that is mid-turn is
  authenticated by construction.

  ## What is wanted

  - A pane showing the runtime's busy footer classifies healthy whatever
    text it carries; nothing is counted, nothing is sent.
  - An attempt skipped for any reason (busy, capture failure) is not an
    attempt: the episode state advances only when a respawn was performed.
  - The persist alert names the matched pane line (trimmed) and the number
    of performed respawns.
  - An idle pane showing the runtime's own auth error still respawns
    exactly as BL-536 built it.

  ## How (direction, not mandate)

  - `observe-pane-auth!` passes `(chase-sweep-lib/actively-processing? pane)`
    into `decide-auth-observation` as `:busy?`; the lib returns `:none`
    with state untouched when busy. Keep the lib pure; the busy predicate
    stays the one in chase_sweep_lib.bb.
  - `do-auth-respawn!` returns whether it respawned; `observe-pane-auth!`
    commits the incremented state only on `true` (or the lib exposes
    `record-performed-respawn`).
  - `format-alert-reason` gains the matched line (first match of the
    regex, one line, <=120 chars) and the performed count.
  - Scenario 05's fixture is a trimmed excerpt of the hardener's real pane
    from 2026-09-05 (busy footer + the 401 assertion lines).
  - Tests in `swarmforge/scripts/test/` beside BL-536's runners; Babashka
    has no mutation wired (BL-472): the hardening pass records the fallback.

  ## Out of scope

  - Narrowing the regex itself (a test that prints the runtime's exact
    error line would still match; the busy gate and the named match are
    the fix).
  - Chaser respawns of a long mutation run (chase-respawn-skip-busy): they
    are skipped correctly and count nowhere.

qa_e2e_procedure: |
  1. BL-536's runners and the new BL-1416 runner pass; the BL-1416 feature
     passes all seven scenario runs.
  2. Replay: feed the 2026-09-05 hardener pane excerpt through
     `classify-auth-signal` / `decide-auth-observation` with busy true:
     healthy, state unchanged. Same text with the busy footer removed and
     an idle prompt: auth, respawn.
  3. Live, read-only: while a role runs a long test, `grep -a
     'auth-respawn-skip-busy\|auth-persist' .swarmforge/daemon/handoffd.log`
     gains no lines across three observer ticks.
  4. `grep -n 'actively-processing? pane) :healthy'
     swarmforge/scripts/handoffd.bb` returns the observe tick
     (required_wiring).

