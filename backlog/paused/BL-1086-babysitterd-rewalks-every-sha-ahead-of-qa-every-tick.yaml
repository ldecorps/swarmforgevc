id: BL-1086
title: "babysitterd re-walks every SHA ahead of swarmforge-QA every tick: no cache keyed on the three tips, and one shell process per SHA for ancestry — long checks read as a dead daemon and trigger freshness restarts"
milestone: M8
type: defect
status: todo
epic: swarm-reliability
severity: high
priority: 58
direction: aligned
depends_on: []
assigned_to: unassigned
mutation_cost: medium
human_approval: pending

invariants:
  - "Result equivalence: for the same three tips, the result produced with the cache and the batched gather is the result a full per-SHA gather would have produced - both the offending-commit set and the ancestry-unavailable flag."
  - "Invalidation completeness: any of the `main`, `origin/main` or `swarmforge-QA` tips moving, or a previous gather that returned `:ancestry-unavailable? true` or otherwise failed, forces a full re-gather. A fail-closed hole is never cached as clean."
  - "One predicate, and the sweep fails closed as a whole: `is_qa_ancestor.sh` stays the single approval predicate (never a second `git merge-base` invocation alongside it), and any failure anywhere in the batch fails the WHOLE sweep to `:ancestry-unavailable? true` rather than yielding a partial result."

required_wiring:
  - "swarmforge/scripts/babysitter_check.bb::pipeline-code-on-main-cache::the cache must be consulted on the live gather path, not merely defined - a cache that exists while gather-pipeline-code-on-main still walks unconditionally is this ticket's own failure mode repeated"
  - "swarmforge/scripts/babysitter_check.bb::batched-qa-ancestry::the batched ancestry pass must replace the per-SHA shell loop on the live path; a batch helper that exists while qa-ancestor? is still called once per sha leaves the process storm in place"

approval_context: >
  Filed HIGH, which is the one judgement here that is the specifier's rather
  than the intake's. The intake offers both readings honestly - "medium while
  tonight's checks are ~3s; high if the specifier weights the live 12:00Z
  restart storm / age_secs=1146 escalate" - and leaves the call open.

  High, for three reasons. This defect does not merely waste time, it
  MISREPRESENTS the daemon as dead: babysitterd writes its heartbeat only
  after the check returns, so a check that overruns 600s reads as a
  stale-heartbeat violation and gets the daemon RESTARTED mid-sweep. That is a
  broken health signal plus an induced restart, which is the `high` bar as
  written, not a slow-gate annoyance. Second, it has already fired - a
  restart/escalate chain on 2026-08-22 with an announced `age_secs=1146`.
  Third, the conditions are present right now: the sibling push-sweep intake
  records `main` sitting ~23 commits ahead with a stable non-QA set, and this
  gather's cost is O(that set).

  The contrast with its sibling is deliberate rather than inconsistent.
  BL-1085 (push-sweep, medium) wastes 10-14s against a 120s budget and
  breaches nothing. This one breached its budget and caused restarts. Same
  design pattern, different consequence.

  If you would rather this not enter the expedite lane while the queue-jump
  batch is starved, say so and it drops to medium with no other change - the
  work is identical either way.

source: |
  Root intake `backlog/INTAKE-babysitterd-pipeline-code-on-main-cache-and-batched-ancestry.md`
  (human via Cursor, 2026-08-23 ~01:33 BST / 00:33Z, WSL host), drained
  2026-08-23. Filed 1:1 - one intake, one ticket - because the human directed
  it explicitly.

  ## Human directives, verbatim

  > "intake for 1 & 2" (verbatim, Cursor session 2026-08-23 ~01:33 BST) —
  > mint **one** ticket covering cache-until-tip/QA-moves **and** batched
  > ancestry gather for babysitterd's pipeline-code-on-main path.

  The intake's own framing: "file an intake for engineering fixes **(1) cache
  pipeline-code-on-main until tip / `swarmforge-QA` moves** and **(2) one
  batched git gather, not N per-SHA shell scripts** — the two highest-leverage
  ways to fasten the babysitter sweep. Treat as **one** ticket (1+2), not
  two."

  And its constraint: "Do **not** weaken BL-631/925/962 refuse / fail-closed
  semantics."

  ## Deliberately NOT merged with its sibling

  The intake is explicit: the push-sweep intake "is the same cost class on the
  handoffd side; this intake is the babysitterd mirror", and "do not merge
  tickets; different daemon, different gather, shared *design pattern*."
  Minted separately as BL-1085 (push-sweep) and this ticket. They share a
  shape and nothing else - different daemon, different refs, different
  predicate, and one of them can ship without the other.

  ## Observed (human, live WSL)

  `FRESHNESS_VIOLATION escalate swarm=primary daemon=babysitterd
  age_secs=1146 reason=stale-heartbeat threshold=600 (cool-off; no second
  restart)`, with a restart/escalate storm on 2026-08-22 ~12:00-13:04 UTC.

  Implied check durations that morning (heartbeat gap minus the 300s sleep):
  routine ~250-300s, spikes ~635s / ~661s / ~719s, and one ~75 minute gap that
  included a freshness restart mid-stall. Tonight the same check is ~3s when
  the ahead-of-QA set is cheap, so this is load times SHA-set size, not a
  permanent baseline.

  ## Verified in the tree by the specifier, 2026-08-23 (not taken on trust)

  1. `babysitterd.sh` runs the check at line 32 and writes the freshness
     heartbeat at line 36 - AFTER it returns. So a long check is
     indistinguishable from a dead daemon to
     `daemon_log_freshness_check.sh`. `daemon_log_freshness.conf` line 5
     confirms the threshold: `babysitterd|600|...`.
  2. `babysitter_check.bb` `qa-ancestor?` (line 291) shells
     `is_qa_ancestor.sh` (resolved at line 266) once per SHA.
  3. The fail-closed hole the cache must never freeze is
     `{:offending-commits [] :ancestry-unavailable? true}` at line 401.
  4. There is no cache keyed on any tip anywhere on this path.

  ## The constraint that makes part 2 delicate, in the code's own words

  `babysitter_check.bb` lines 230-247 document the CURRENT design as
  deliberate belt-and-suspenders, and it is the thing part 2 has to change
  without breaking:

      Ancestry uses is_qa_ancestor.sh, the ONE shared "is this sha
      QA-approved" predicate (BL-925 invariant 2) ... never a second git
      merge-base invocation. `git rev-list swarmforge-QA..<ref>` enumerates
      CANDIDATES efficiently ... and is_qa_ancestor.sh then CONFIRMS each one
      individually before it is ever treated as offending - belt and
      suspenders, and the literal reuse the ticket asks for.

  So "batch the ancestry" cannot mean "replace the predicate with an inline
  merge-base walk" - that is the exact thing BL-925 forbids. It has to mean
  the SAME predicate answering for many SHAs in one process. Teaching
  `is_qa_ancestor.sh` a batch mode keeps BL-925's invariant literally intact;
  anything that answers approval without going through it does not.

  The same block also fixes the failure posture part 2 must preserve: "Any
  failure anywhere in this resolution chain ... fails the WHOLE sweep closed
  to :ancestry-unavailable? true (invariant 3) - never a partial result that
  could read as 'nothing else was wrong'."

  ## Related prior work (do not regress)

  BL-631 (the pipeline-code-on-main finding), BL-925 (the shared
  `is_qa_ancestor.sh` predicate), BL-962 (merge adjudication). BL-978 (done)
  is the same "recompute every tick with no invalidation key" class on
  `dropped-parcel-sweep`.

description: |
  Stop babysitterd's `gather-pipeline-code-on-main` re-deriving the same
  answer from scratch every 300s tick, in the two ways the intake names,
  without weakening what the answer means.

  ## 1. Cache until any of the three tips moves

  When the `main` tip, the `origin/main` tip (where that ref exists) and the
  `swarmforge-QA` tip are all unchanged from the last SUCCESSFUL gather, reuse
  the previous `{:offending-commits :ancestry-unavailable?}` result. Invalidate
  on any of the three moving, and never cache a gather that returned
  `:ancestry-unavailable? true` or failed - a fail-closed hole cached as clean
  is strictly worse than the cost this ticket is removing.

  ## 2. One batched ancestry pass instead of a process per SHA

  When a gather IS required, answer "is this SHA QA-approved?" for the whole
  candidate set in one pass rather than spawning `is_qa_ancestor.sh` once per
  SHA, then run path and merge adjudication only over the non-ancestor
  remainder. The predicate itself must not move: `is_qa_ancestor.sh` stays the
  one place that answers approval (BL-925), so the natural shape is that
  script gaining a batch mode rather than the caller learning to decide
  ancestry for itself.

  ## How (direction, not mandate)

  The pure assemble and adjudicate helpers stay the source of truth; this is a
  data-access and process-spawn change, not a semantics change. In-memory
  caching for the daemon's lifetime is sufficient - the daemon re-gathers on
  restart, which is correct behaviour and removes any cross-restart
  invalidation question.

  Naming constraint, deliberate: the cache and the batched pass must be named
  so the `required_wiring` gate above can see them on the live path - a
  literal `pipeline-code-on-main-cache` and a literal `batched-qa-ancestry` in
  `babysitter_check.bb`. This ticket's whole value is that the live gather
  goes through both.

  ## What must not change

  The refuse and fail-closed semantics of BL-631, BL-925 and BL-962. Same
  offending set, same `:ancestry-unavailable?` posture, same whole-sweep
  failure rather than partial results.

acceptance: specs/features/BL-1086-babysitterd-caches-and-batches-its-qa-ancestry-gather.feature

qa_e2e_procedure: |
  1. On a scratch clone with several commits ahead of `swarmforge-QA`
     including at least one that is not QA-approved, run
     `babysitter_check.sh <root> --nudge` twice with no ref movement between.
  2. Confirm both runs report the SAME offending set, and that the second run
     spawns no `is_qa_ancestor.sh` process at all (count them, e.g. by
     wrapping the script or watching process spawns).
  3. Confirm the first run spawns ONE such process for the whole candidate
     set rather than one per SHA.
  4. Move each of the three tips in turn (`main`, `origin/main`,
     `swarmforge-QA`), and after each confirm the next run re-gathers.
  5. Make ancestry unanswerable (e.g. remove the `swarmforge-QA` ref) and
     confirm the run reports `:ancestry-unavailable? true`; restore the ref
     and confirm the NEXT run re-gathers rather than replaying the hole.
  6. Confirm the whole-sweep fail-closed posture survives batching: make one
     SHA in the middle of the candidate set unanswerable and confirm the whole
     result is `:ancestry-unavailable? true`, not a partial offending list.
  7. Time a routine check before and after against a large ahead-of-QA set and
     confirm it lands well under the 600s freshness threshold.

out_of_scope: |
  Named follow-ons from the same session, deliberately not in this ticket:
  - Heartbeat before or during the heavy gather, and any sweep-marker
    (recommendation #3). That is a freshness false-positive guard rather than
    sweep speed, and it is the RIGHT companion fix - worth filing, not worth
    bundling.
  - Hard wall-clock abort of the gather (recommendation #4).
  - Throttling the gather to every N ticks (recommendation #5).
  Also out of scope, per the intake:
  - Raising babysitterd's 600s freshness threshold - "not a fix".
  - Operationally advancing `swarmforge-QA` or clearing a non-QA tip -
    "helpful ops, not the ticket".
  - Any weakening of BL-631 / BL-925 / BL-962 refuse or fail-closed semantics,
    and specifically any path that answers QA approval without going through
    `is_qa_ancestor.sh`.
  - The push-sweep sibling BL-1085. Same design pattern, different daemon;
    the intake explicitly says not to merge them.

notes: |
  INVEST note on Small: two changes in one ticket at the human's explicit
  direction ("intake for 1 & 2"). They are coupled the same way BL-1085's two
  halves are - part 2 produces the single gather result that part 1 caches -
  so splitting would create a dependent-sibling pair. `mutation_cost` medium
  because part 2 touches a fail-closed safety path.

  Worth flagging to whoever picks this up: the freshness interaction is the
  reason this is filed high, but the freshness FIX is out of scope
  (recommendation #3). This ticket removes the cause; the heartbeat-ordering
  guard would remove the misdiagnosis. Both are worth having, and if this one
  proves slower to land than expected, filing #3 becomes urgent rather than
  optional.
