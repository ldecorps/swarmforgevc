id: BL-1041
title: "Rescuing orphaned work made it LESS durable: a stash pop moved the only copy of a reviewed-sound fix into another role's uncommitted working tree, dropped the stash entry, and told nobody - the receiving role found work it could neither attribute nor sweep"
milestone: M8
type: defect
severity: high
# high: the safety property "work in flight stays recoverable" was broken,
# not merely inconvenient. Reviewed-sound work that had already been flagged
# twice as at-risk went from "recoverable from a stash" to "one `git restore`
# from gone" in the same operation meant to save it. Not critical: nothing
# was actually lost - but only because a specifier happened to copy it into
# backlog/evidence/ by hand an hour earlier, which is not a mechanism.
status: todo
epic: swarm-reliability
assigned_to: none
priority: 12
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1041-a-rescue-never-makes-orphaned-work-less-durable.feature
human_approval: pending

invariants:
  - "A rescue never reduces durability: the source copy is not dropped until a commit containing the same content exists on a branch."
  - "No role finds uncommitted changes in its worktree that nothing accounts for: work another actor places there arrives as a commit, and its owner is told what and why."

description: |
  ## What happened, in order

  1. Around 2026-08-20 a real, reviewed-sound BL-981 board-seat-leak fix
     (the `stageOfSeat` helper) ended up in a repo-wide `git stash` with no
     worktree. The 2026-08-20 briefing recorded it under "Still open / not
     yet resolved": *"stash@{0} (real BL-981 board-seat-leak fix) has no
     worktree - flagged twice by the specifier, not yet rescued. Real,
     reviewed-sound work ... sitting outside any branch."*
  2. **2026-08-22 07:27:04** - the stash was applied into `.worktrees/coder`.
     All six files carry that mtime to the second, which is the signature of
     one bulk apply rather than of anyone editing.
  3. The stash entry is now gone. All 38 current stash entries were scanned
     for `stageOfSeat`: zero hits, and `git reflog show stash` carries no
     entry for it either - consistent with a `pop`.
  4. The coder, whose worktree it landed in, was not told. It found
     uncommitted changes it could not attribute, and correctly surfaced them
     rather than sweeping them (`note`: *"BL-983 seat-leak edits appeared
     UNCOMMITTED in coder worktree 07:27, not mine"*) - spending a turn to do
     so, and a specifier turn to establish provenance.

  ## Why this is a durability defect and not a manners one

  After step 3 the work existed in exactly two places: an uncommitted working
  copy, and `backlog/evidence/BL-1040-rescued-seat-fold-work-20260822.md` -
  which exists only because a specifier hand-copied it there an hour earlier
  while writing BL-1040. Absent that accident, a single `git restore`, a
  crash-recovery sweep, or a worktree reset would have destroyed work that
  had already been flagged twice as at-risk.

  The rescue was well-intentioned and the work genuinely needed rescuing. The
  defect is that the operation moved the work from a durable-if-obscure place
  (a stash entry) to a volatile one (an uncommitted tree), and destroyed the
  original in the same step. A rescue that can lose the thing it rescued is
  not yet a rescue.

  ## The second harm, which is what exposed the first

  A role is forbidden to sweep changes it did not make - "Ticket-less changes
  you did not make are SURFACED, not swept". That rule is correct and the
  coder followed it. But it means depositing unattributable work in a role's
  worktree guarantees a wasted turn: the role cannot commit it (not its
  ticket), cannot remove it (not its file), and cannot proceed cleanly past
  it. Two turns were spent here on a question a one-line notification would
  have answered.

  ## How (direction, not mandate)

  The behaviour wanted: orphaned work is rescued **onto a branch, as a
  commit**, before the source copy is released; and whoever owns the tree it
  touches is told what landed and why.

  Whether that is a small helper (`swarmforge/scripts/` has `salvage_lib.bb`,
  but that salvages HANDOFFS - abandoning stale parcels and re-injecting at a
  stage - not orphaned CODE, so this is not a natural extension of it), a
  documented coordinator procedure, or both, is the implementer's and
  architect's call. Note only that a rule alone has already been tried: the
  constitution's *"`git stash` is repo-wide; never bare-reach for it to tidy
  just one worktree"* was in force throughout and did not prevent this.

  ## Out of scope

  - The seat-fold fix itself - that is BL-1040, and it is not blocked by this.
  - Reducing the 38-entry stash backlog, or auditing what else is orphaned in
    it. Worth doing; not this slice.
  - Any change to the "surface, never sweep" rule, which behaved correctly.

qa_e2e_procedure: >
  1. Construct the failing case at the parent commit: put a small change in
     a stash with no worktree, then rescue it by whatever means the
     coordinator has today. Confirm the observed defect - the receiving tree
     is left dirty, the stash entry is gone, and no commit contains the
     content.

  2. At the parcel commit, repeat. Confirm a commit on a branch contains the
     rescued content, and confirm it by reading the content out of the
     commit, not by trusting the commit's subject line.

  3. Confirm the ordering, which is the whole invariant: interrupt the rescue
     after the source would previously have been dropped but before the
     commit is made, and confirm the source copy is still present and the
     work is still recoverable.

  4. Confirm the receiving role is told: run a rescue that touches a role's
     worktree and confirm that role receives a message naming what landed and
     why. Confirm the message arrives even when the rescue is otherwise
     silent.

  5. Confirm no false positive on the ordinary path: a role committing its
     own work in its own worktree triggers none of this and is unchanged.

approval_context: >
  Found while settling a coder `note` that said some edits in its worktree
  were not its own. They were not a phantom writer - they were a deliberate,
  well-intentioned rescue by the coordinator. But establishing that turned up
  something worse than the attribution confusion.


  THE NEAR MISS. The rescued work is reviewed-sound, it had already been
  flagged twice as sitting outside any branch, and the rescue moved it from a
  stash entry into an uncommitted working tree and dropped the stash in the
  same step. I scanned all 38 stashes and the stash reflog: it is in none of
  them. For about an hour the only two copies were a dirty working tree and
  an evidence file I had happened to write by hand while speccing BL-1040. A
  `git restore` in that window would have destroyed it.


  WHY I MADE THIS `severity: high` WHEN I KEPT TWO OTHERS TODAY LOWER. I have
  been deliberately conservative with severity today - BL-1039 and BL-1040
  both stayed below what their headline would support. This one I do think
  clears the bar: the broken property is "work in flight stays recoverable",
  nothing about it is latent, and the only reason it did not cost us the work
  is an accident of timing. If you disagree, it is a one-line change.


  ONE THING I WANT TO BE FAIR ABOUT. Nobody did anything careless here. The
  work needed rescuing, the coordinator rescued it, and the coder responded
  exactly as the rules require by surfacing rather than sweeping. The gap is
  that we have no rescue that ends in a commit - so the correct instinct had
  only an unsafe way to act on it. I would not want this ticket read as a
  reprimand of the rescue.

