description: |
  ## What

  An operator hotfix is live on main and has never been through a gate.
  This ticket is that gate: a REVIEW ticket, not a rewrite ticket -
  confirm or refute, and open narrow follow-ups for anything found.

  ## The failure it fixed

  An aider seat's identity arrives only through the post-launch tmux
  bootstrap: `/add swarmforge/constitution.prompt swarmforge/PIPELINE.md
  swarmforge/roles/<role>.prompt`, then the composed prompt
  (`.swarmforge/prompts/<role>.md`). Only `swarmforge.sh`'s `launch_role`
  ran it (`agent_runtime_cli.bb run-bootstrap`). Every later respawn
  re-executed the launch script and stopped, so the new aider process
  began with an empty chat - no role, no constitution, nothing saying it
  may run shell commands - and answered its wake with "I have no shell,
  git, or filesystem tools in this session". A claude seat hides the gap:
  its launch script carries `--append-system-prompt-file`.

  ## What landed (files to review)

  - `swarmforge/scripts/respawn_bootstrap_lib.bb` (new, pure): builds the
    argv for the SAME run-bootstrap verb the launcher uses, reading the
    composed prompt and the compose sidecar
    (`.swarmforge/prompts/<role>.md.metadata.json`) so `two-pack?` and
    `overlay-prompt` stay faithful; names no provider; `bootstrap-steps`
    yields no steps for `:embedded` providers.
  - `swarmforge/scripts/swarm_ensure.bb` `run-single-role-repair!` and
    `swarmforge/scripts/handoff_lib.bb` `rotate-resident-to!`: both call
    it after a successful respawn, fire-and-forget, never throwing.
  - `swarmforge/scripts/test/respawn_bootstrap_test_runner.bb` (24 cases,
    registered standing): green on main 60623ebf02 (specifier,
    2026-09-10). NOTE: this hotfix's new `load-file` edge in
    `handoff_lib.bb` is what broke
    `bl1313BatchGuardVisibilityInvariants.property.test.js` (owned by
    BL-1503) - out of this stamp's scope, named here so the reviewer does
    not re-find it.

  ## Review goals

  1. Confirm both drivers bootstrap and that the argv order equals the
     launcher's (scenario 01) - a drift here is the exact class the
     hotfix closed.
  2. Confirm the embedded-provider no-op (scenario 02): the live pack is
     all-claude today, so this is the path that actually runs.
  3. Confirm a refusal never fails the repair (scenario 03).
  4. Refute-worthy question for the architect, evidence only: the
     bootstrap steps open with a startup sleep and are backgrounded; a
     respawn followed within seconds by a daemon wake (6e05b02dd3's
     fresh-target inject) can race the paste. Say in evidence whether
     the order is guaranteed or merely likely; a follow-up if not.

  ## Scenario notes for the coder

  - Scenarios 01-03 are the runner's own shape (`bb -e` against a fixture
    root with a fake `agent_runtime_cli.bb` capturing argv); the driver
    rows spawn the real `swarm_ensure.bb` repair and the real
    `handoff_lib.bb` rotation with fakes for tmux.
  - The last scenario's handler reads `backlog/hotfix-ledger.yaml` for the
    row `commit: 32fb1ff7e1` and asserts `human_decision` is null.

