acceptance: specs/features/BL-974-shell-fixtures-short-root-and-loud-source-failures.feature

invariants:
  - "No shell test can fail on the socket path-length guard instead of the behaviour it asserts: any fixture that sources swarmforge.sh or resolves a control socket derives its root from the shared short-root helper, enforced by a gate that decides membership by inspection at gate time - never a checked-in roster of file names."
  - "A fixture-block failure is never silent: when a sourced swarmforge.sh or composer invocation fails inside a test helper, the test's failure output names the underlying error before the non-zero exit - discarded-stderr plus set -e must not be able to swallow the diagnosis again."

description: >
  Severity rationale: medium - test infrastructure, loud once actually
  run, no live swarm behavior degraded. What keeps it well above low:
  the breadth (37 shell tests source swarmforge.sh inside mktemp
  fixtures and are exposed on macOS) and the silence (the observed
  failure emits NOTHING - two PASS lines then exit 1), which left a
  closed ticket's acceptance dark for weeks.

  The defect chain, reproduced at mint: swarmforge.sh resolves the
  control socket AT SOURCE TIME (resolve_swarm_socket.bb at
  swarmforge.sh:136); resolve_swarm_socket.bb fail-closes when the
  derived socket path exceeds 100 chars and XDG_RUNTIME_DIR offers no
  short fallback (deliberate, BL-367, under the 104/108 sun_path
  limits). A shell test's fixture root from bare mktemp -d resolves
  under /private/var/folders/... (~70 chars), so
  <root>/.swarmforge/tmux/<id>.sock lands ~103 chars - the guard
  fires before the behaviour under test is ever reached. In
  test_resume_on_start.sh the sourcing zsh block discards stdout AND
  stderr (>/dev/null 2>&1) and the outer set -e kills the script on
  the block's exit status BEFORE the helper's own fail() assert line
  can print: exit 1, zero diagnostic output. Specifier reproduction:
  the same fixture + source sequence run bare prints
  "resolve_swarm_socket.bb: Socket path exceeds the operating
  system's unix-socket path limit (100 chars)...".

  Observed instances: (a) test_resume_on_start.sh - BL-323's
  regression test, found by the architect with BL-323's acceptance
  red 3 of 5 scenario runs (note 00_20260820T053543Z_000283,
  verbatim: "BL-323 acceptance red 3/5: test_resume_on_start.sh
  exits 1 silently"); (b) the cleaner root-caused the identical
  guard hit during the BL-962/961/966 batch on 2026-08-20,
  correcting a wrong "BSD grep" attribution. BL-323 closed green, so
  this regressed later - at latest when BL-367 (2026-07-14) moved
  the socket under the fixture root; nothing noticed because no
  standing gate runs the shell tests (that gap is BL-973's half 2).

  This is the SHELL-surface sibling of BL-948 (active), which fixes
  the same defect class - fixture roots overrunning the socket guard
  - for the JS acceptance step files, with the same two disciplines:
  a shared short-root helper, and an inspection gate so the fix
  cannot rot one file at a time. This ticket must not touch BL-948's
  surface; it delivers the same outcome for
  swarmforge/scripts/test/.

  Fix wanted, three parts: (1) a shared short-root fixture helper
  for shell tests (short base, short prefix, or a short
  XDG_RUNTIME_DIR for the guard's own documented fallback - lever
  choice is the coder's) adopted by every shell fixture that sources
  swarmforge.sh or resolves a control socket, membership decided by
  the gate's inspection; (2) loud source failures - the
  generate-style helpers stop discarding stderr wholesale; on
  failure the underlying error reaches the test output (scenario
  04); (3) BL-323's regression test and acceptance back to green
  (scenarios 01-02) as the proof instance.

constraints: >
  Out of scope / firm lines:

  - The 100-char guard itself is correct and stays fail-closed
    (BL-367): do not raise the limit, warn-only it, or special-case
    tests inside resolve_swarm_socket.bb. Fixtures move; the guard
    does not.
  - No checked-in roster of the affected test files - the gate
    inspects (BL-948 invariant 1's discipline, restated here for the
    shell surface).
  - BL-948's surface (specs/pipeline/steps/ JS fixtures and its
    gate) belongs to that active ticket - reuse its helper/gate
    concepts where practical, but do not modify its in-flight
    deliverables from this parcel.
  - Shell tests that never source swarmforge.sh nor touch a control
    socket are not churned.
  - swarmforge.sh's source-time socket resolution is not
    restructured here (moving it lazy is a real design question, but
    it is launcher behavior, not test fixture scope - if the coder
    finds it load-bearing for the fix, stop and route a note).

qa_e2e_procedure: >
  1. Scenario 01: run test_resume_on_start.sh unpiped (a piped
     invocation reports the tail's exit code) - exit 0, final line
     ALL PASS.
  2. Scenario 02: acceptance runner over BL-323's feature - all
     scenario runs green (the architect measured 3 of 5 red
     pre-fix; record the before/after).
  3. Scenario 03: derive the socket path for a helper-created root
     and assert length <= 100 on this macOS host (the worst measured
     base).
  4. Scenario 04: force the sourced block to fail in a scratch copy
     (e.g. unreadable conf) - the failure output names the
     underlying bb error; nothing exits silently.
  5. Scenario 05 non-vacuity: drop a scratch violating test into the
     tree - the gate goes red naming it; remove it - green.
  6. Bounded sweep evidence: run the 37 swarmforge.sh-sourcing shell
     tests (or the gate's computed member set) and record each
     red/green before and after - bounded effort, timeouts noted,
     slow/live ones may be recorded as excluded per BL-973's
     manifest discipline if that ticket has landed.

