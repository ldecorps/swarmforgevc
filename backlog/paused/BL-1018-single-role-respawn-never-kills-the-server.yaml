id: BL-1018
title: "A single-role repair took down the entire pack tmux server; constrain what such a repair may resolve to so it can never reach beyond its own session"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
priority: 12
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1018-single-role-respawn-never-kills-the-server.feature

invariants:
  - "A single-role repair resolves to commands that name exactly one target session on the pack's own socket: no resolved command can affect another role's session, and none is ever a kill-server or a kill-session."
  - "Resolution is total over session state: for both a present and a missing session the resolver returns a defined, safe command set - it never falls through to a default-socket or untargeted command."

description: >
  WHAT. Constrain what a single-role repair is allowed to RESOLVE TO, so that
  repairing one role cannot take down the pack. Pin the resolution - which is
  pure and testable - rather than trying to test live tmux teardown.

  THE INCIDENT. 2026-08-21 ~08:26 UTC. The operator health sweep found
  swarmforge-specifier genuinely gone (no tmux session, no claude pid) minutes
  after 8/8 had been healthy. It attempted a SINGLE-ROLE respawn: create session,
  then respawn-pane specifier.sh. The ENTIRE pack tmux server then died - socket
  3752320954, handoffd with it. The operator reports respawn-pane was the only
  thing it ran. Recovery needed a full ./start-swarm.sh (no -clean); all eight
  sessions were recreated ~09:25:51 BST.

  ROOT MECHANISM IS UNPROVEN AND THIS TICKET DOES NOT PRETEND OTHERWISE. No
  audit trail survives the teardown. BL-958 already named the hazard class -
  respawn issued against a MISSING session can restart a half-alive tmux server -
  and that is the leading hypothesis, which is exactly why scenario 01 pins
  "a missing session is created, never respawned into". The value here does not
  depend on the hypothesis being right: constraining the resolution surface
  removes the whole family of ways a one-role repair can reach the server,
  whichever member of it actually fired.

  How (direction, not mandate). Resolution should branch on observed session
  state - create when missing, respawn in place when present - and every emitted
  command should carry the pack socket explicitly rather than inheriting a
  default. Whether that lands as a resolver function returning a command vector,
  or as guards inside the existing path, is the implementer's call; the two
  invariants constrain either shape.

  WHY THIS IS ITS OWN SLICE. BL-1017 makes the sweep ASK for a session to be
  recreated. This ticket makes the recreating SAFE. Landing BL-1017 without this
  would automate the exact action that took the pack down, so the two are
  genuinely separable but ordered by prudence rather than by a hard dependency -
  see notes.

qa_e2e_procedure: >
  1. Run the feature's three scenarios against the pure resolver: a missing
     session resolves to create and to NO respawn-pane against it; a present
     session resolves to respawn-in-place and to no duplicate create; and for
     BOTH session states every resolved command names the pack socket
     explicitly, targets only that role's own session, and is never a
     kill-server or kill-session.
  2. Assert the negative directly, not by inspection: scan the resolved command
     set for `kill-server` and `kill-session` and require zero hits. This is the
     assertion that would have caught the incident.
  3. Confirm no resolved command omits the `-S <socket>` form. A command that
     inherits the default socket is the one that can reach a server nobody
     intended to touch.
  4. Live confirmation, recorded as a manual procedure (live tmux is outside the
     unit boundary): on a scratch pack, kill one role's session and drive a
     single-role repair. Confirm the role returns, every other session survives,
     handoffd is still alive, and the socket is unchanged. Record the session
     list and the socket id before and after.

