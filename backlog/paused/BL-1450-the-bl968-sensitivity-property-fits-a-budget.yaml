  `backlog/evidence/BL-1450-unowned-red-bl968-timeout-refuses-unrelated-commits-20260906.md`.
  Interim unblock told to the coder: the documented seam
  `SWARMFORGE_PROPERTY_RERUN_CEILING_SECONDS=600` on its own commit,
  recorded in its evidence - never `SWARMFORGE_SKIP_PROPERTY_SUITE_GUARD`.

  A wiring anchor beyond the handler is deliberately absent: the
  deliverable is the test file itself, already run by the lane config, so
  any anchor on it matches before and after (BL-1235).

  INVEST at mint: Independent (BL-1349 shares the epic and the directive,
  not a file; no unbuilt sibling), Negotiable (runs-per-cell versus a
  spawn per cell is direction; the budget and the kept floors are the
  contract), Valuable (one outcome: the lane's longest file fits the
  rerun net and stops refusing unrelated commits), Estimable (two
  constants and their derivation, one handler; low), Small (three
  scenarios, five runs, two invariants), Testable (the real file spawned
  under the lane config; BL-968's fixture).

