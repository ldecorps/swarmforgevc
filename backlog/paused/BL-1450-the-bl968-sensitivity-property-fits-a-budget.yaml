id: BL-1450
title: "bl968MaterializedGuardSensitivity spawns a fresh process per draw over 3x2 cells x 4 runs (96 spawns, 164-193 s alone, 346 s under the lane's pool), above its own 300 s timeout and the property guard's 180 s rerun ceiling, so every full run times it out and BL-1407's rerun net cannot clear it - the guard refused BL-676's unrelated commit on 2026-09-06; the file fits a per-file budget with every cell kept and the reach floors re-derived, never dropped"
milestone: M8
type: defect
severity: high
# high (standing-red rule 2026-09-05): red in every full property-lane run
# on this host this shift (BL-1348 coder run, BL-1409 QA run, BL-676 commit
# run) and structurally beyond the rerun net's ceiling, so the commit-time
# guard refuses commits that never touched it. A gate that refuses
# unrelated work is a broken safety signal, not a contained nuisance.
