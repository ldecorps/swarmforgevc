description: |
  ## What is wanted

  `coordinator_config_cli.bb <conf>` prints a fourth tab-separated field,
  the pack's coordinator mode: `coordinator-config-lib/coordinator-mode`,
  which is `model` unless the conf declares `config coordinator_mode
  deterministic`. `resolve_coordinator_config` in swarmforge.sh splits the
  four fields and sets `COORDINATOR_MODE` beside the three it sets today.
  BL-1959 reads `COORDINATOR_MODE` to skip the coordinator seat; this slice
  only exposes it.

  ## What the coder checks

  - test_coordinator_config_cli.sh: the three existing expectations gain
    the fourth field (`model`), and a new case declares the mode and
    expects `deterministic`.
  - COORDINATOR_AGENT still ends at the third field: today it is
    everything after the second tab, so it would swallow the new field.
  - The usage comment at the top of the CLI names four fields.

assigned_to: coder
