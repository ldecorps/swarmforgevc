description: |
  ## What is wanted

  A per-parcel phase record in the local-model seat's worktree, and the
  one command that reads and moves it.

  - The record is a file at
    `<worktree>/.swarmforge/phase/<ticket>.md` (`.swarmforge/` is
    gitignored). It holds the current phase (`arrange`, `act`, `assert` or
    `done`), the count of failed asserts, and the notes every phase has
    written, appended in order.
  - The command, `bb swarmforge/scripts/local_seat_phase_cli.bb`, run from
    the seat's worktree:
    - `show <ticket>`: prints the phase and failed-assert count, and the
      record's path. A ticket with no record is in `arrange` with 0.
    - `end <ticket> --to <arrange|act|assert> --notes <file>`: appends the
      notes file's text and moves the record. The legal moves are
      arrange to arrange (more gathering), act or assert (a parcel that
      changes no code), and act to assert.
    - `fail <ticket> --notes <file>`: from assert, appends the notes and
      returns to act, counting the failed assert. At 2 failed asserts it
      moves nothing, appends the notes, and prints
      `SPLIT_REQUEST <ticket>`: the seat then sends the coordinator a note
      `split <ticket>: <seat> failed assert twice` (the existing split
      BAU).
    - `pass <ticket>`: from assert, moves to `done`.
    - Any other move exits non-zero, names the move it refused, and leaves
      the record unchanged.

  ## How (direction, not mandate)

  - Pure transitions in `swarmforge/scripts/local_seat_phase_lib.bb`, a
    small table of legal moves, and the file IO in the CLI (engineering:
    CLI main is a thin wrapper). The two invariants above are a natural
    property test over random move sequences.
  - The handler `specs/pipeline/steps/bl2037LocalSeatPhaseRecordSteps.js`
    runs the real CLI with `spawnSync('bb', [...], { cwd: worktree })` over
    a worktree under `trackedTmpRoot` (`./lib/fixtureReaper`; it reaps at
    exit, so no cleanup code is needed). It maps the outline's `<outcome>`
    to the command (more arrange/ready to act/no code change/done to
    `end --to ...`, failed to `fail`, passed to `pass`) through an explicit
    known-values table, never passthrough.
  - Do not edit `specs/pipeline/steps/index.js`: handlers are discovered by
    the `Steps.js` suffix (BL-1371).

  ## Not in scope

  BL-2038: serving names the phase, `end`/`fail` restart the seat's
  session, done_with_current removes the record. The seat's card prose
  that teaches the phases is the specifier's, landed with BL-2038.

