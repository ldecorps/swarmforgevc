description: |
  ## What is wrong

  `extension/src/tools/localQwenSeatLive.ts` (BL-1235's local qwen seat:
  the topic id, the endpoint probe, the completion call and the turn)
  had never had a Stryker run; BL-1235's hardener fell back to a hand
  sweep of 7 mutants (`6a2f0d2e9d`). BL-1911's hardener ran Stryker over
  it on 2026-10-07 (`a2e54bbee9`, evidence
  `backlog/evidence/BL-1911-hardener-20261007.md`): BL-1911's own lines
  are all killed, and 22 mutants on the older lines are left, 15
  survived and 7 never covered. The hardener rightly did not chase
  another ticket's debt inside BL-1911 and sent the specifier an
  `unowned-survivors` note; this is the owner.

  Census by enclosing declaration (survived / no-coverage; per-mutant
  list and the counting script in
  `backlog/evidence/BL-2059-first-run-survivor-census-20261007.md`):

  | declaration | surv | no-cov |
  |---|---|---|
  | readLocalEndpoint | 5 | 3 |
  | completeWithLocalModel | 4 | 1 |
  | runLocalSeatTurn | 3 | 1 |
  | readQwenLocalTopicId | 2 | 0 |
  | readLocalSeatSystemPrompt | 1 | 0 |
  | resolveReadEndpoint | 0 | 1 |
  | resolveComplete | 0 | 1 |

  Representative gaps: the probe's `/api/tags` URL and the completion's
  `POST` method and `content-type` header can be blanked and no test
  notices; the reason text on a failed probe and the model catalogue it
  reports are never asserted; with `deps.topicId` absent the turn's
  topic lookup is never exercised.

  ## What is wanted

  - The run is repeated with the include set naming every unit-test file
    that reaches the module (at least `bl1235LocalQwenSeatLive.test.js`,
    `bl1235LocalQwenSeat.test.js` and BL-1911's
    `bl1911LocalSeatRepoRead.test.js`); the evidence records the include
    set, the summary block, load and duration, and either zero survived
    and zero no-coverage for `localQwenSeatLive.js` or one
    accepted-equivalent record per remaining mutant with the code-level
    reason.
  - Behaviour tests kill the rest through the exported functions with an
    injected `fetchFn` and fixture files, never a live endpoint: the
    exact request each call makes (URL, method, header), the exact reason
    and catalogue a failed or odd probe reports, the fallback when the
    topic map or briefing cannot be read, and the turn with no
    `deps.topicId`. The two default-dependency resolvers are reached by a
    turn that injects neither `readEndpoint` nor `complete`, over a fake
    fetch.
  - The evidence lists, per declaration in the census, the test file and
    case that now rejects its mutants.
  - Any function `npm run crap` flags in the file stays under 6.
  - Evidence path: `backlog/evidence/BL-2059-localQwenSeatLive-mutation.md`.

  ## How (direction, not mandate)

  - `--mutate out/tools/localQwenSeatLive.js`, `perTest`, sibling links
    per the Verification rules; BL-1911's scoped config
    (`extension/stryker.bl1911.config.json`,
    `vitest.bl1911.stryker.config.mjs` in the hardener worktree) is the
    recipe; the scoped config is not committed. Check
    `mutation_cooldown_gate.bb` first and record its decision.
  - `bl1235LocalQwenSeatLive.test.js` is the home; group the new cases
    by the census's declarations.

constraints: >
  Tests only unless a seam is missing, in which case the smallest
  extraction that exposes the behaviour to an in-process test; never a
  live model endpoint or the live Telegram API; never `process.chdir()`
  under mutation; never a hand-edited manifest.

out_of_scope: |
  - `localSeatRepoRead.ts` and BL-1911's own lines in this file: BL-1911's
    hardener killed or accounted for every one of them.
  - Any change to what the seat posts, asks or answers.

qa_e2e_procedure: >
  On the parcel commit, ONE run each (2026-09-17 rule).
  (1) `node specs/pipeline/cli.js specs/features/BL-1235-local-qwen-seat-behind-its-own-topic.feature`:
  5 of 5 ok (measured at mint on main at dc240b22a2: 5 of 5, 2.5 s).
  (2) Read from the gather's unit row: bl1235LocalQwenSeatLive.test.js
  green with the new cases. (3) `npm run crap` once: no function in
  localQwenSeatLive.ts above 6. (4) Read the hardener's committed
  evidence: Stryker totals for localQwenSeatLive.js with at least the
  run's mutant count recorded, and survived 0, no-coverage 0, or each
  remainder with its code-level reason. QA starts no mutation run.

