  this testing of the local aider? will it spin it up, to test the live
  prob?"

notes: |
  Minted 2026-09-24 by the specifier (claude-opus-5-5 seat) with
  `human_approval: pending` and `ruling_options`: the intake itself marks
  L4 as a real choice, so the queue-jump pre-approval (2026-09-15 ruling)
  does not cover it. The intake's L4 and L6 are merged here because the
  coordinator question and the review-stage question are one decision (the
  first local pack's shape) and the canary is the ticket that needs it.
  The card intake's open questions resolve by branch: 1 (relay home) ->
  handoffd, already BL-1697; 2 (scan `roles/aider/`) and 3 (card
  coverage) and 4 (`ff-main` on the allow-list) -> live only in branch C.

  INVEST (branch A): Independent (depends_on names every unbuilt
  sibling), Negotiable (runbook shape, CLI internals are direction),
  Valuable (the first real local parcel), Estimable (one conf, one small
  CLI, one doc), Small (two scenarios, one invariant), Testable (static
  roster and gate checks; the canary itself is operator evidence).
