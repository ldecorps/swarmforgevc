  Human, verbatim (via Claude Code, 2026-09-23 ~23:05 BST): "When you are
  done with your experimentation, write the final proposal for the
  specifier to pick tomorrow morning. Make it super high priority btw,
  qjump it. The priority is now to introduce local models. I have a
  graphic card arriving in a couple of days, so the tocken generation
