approval_context: >
  Operator, 2026-07-25, deciding BL-612's fate at a keyboard at 21:45: "plutôt
  faisons ça: lorsque la swarm démarre et trouve des approvals pour moi, il faut
  les faire remonter sur le topic approvals de telegram". The ruling channel is
