notes: |
  Supersedes this ticket's own first draft (trigger derived from closure —
  a better constant). The operator's second pass made it a sequence instead
  of a time, which is strictly stronger: whole-night coverage, orphan-free
  scheduled stops, and the mailman structurally incapable of missing the
  swarm. Seventh member of the week's schedule-blindness family, and the
  first that removes a class instead of patching an instance.

  2026-07-27 specifier pass: feature file written (8 scenarios), gherkin
  lint gate clean, IR-DRY reviewed — 14 findings, all medium-confidence
  near-duplicate/possible-synonym on one parameterised step
  (`the recorded closing sequence is "<seq>"`) and on
  `the resident is "<role>" holding an in-flight parcel`; the varying
  quoted value IS the parameter in both, so the wording differences are
  deliberate, not drift. No normalisation applied.

  NOT READY TO PROMOTE until edge 6 is answered — the ticket's premise
  needs a closure-time source that exists in git.
