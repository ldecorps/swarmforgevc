notes: |
  ## IR-DRY findings reviewed and kept

  The feature file's IR-DRY report leaves three `possible-synonym` findings.
  All three were reviewed and are genuine semantic distinctions, not accidental
  drift: a parameterized send versus a concrete one, a specific refusal reason
  versus a parameterized one, and a declared role versus an undeclared one.
  Do not "normalize" them away.

  ## e2e procedure for QA

  With a live swarm:

  1. `POST /agent-notes` with a valid token, a declared role that is currently
     dormant, and a short message. Confirm a `type: note` parcel appears in
     that role's `inbox/new/` at priority `00`, that its `message:` carries
     both the operator attribution and the typed text, and that the role drains
     it on its next `ready_for_next.sh`.
  2. Repeat with a message over the budget, one containing a line break, and an
     empty one. Confirm each is refused with a stated reason and that no parcel
     — and no stray draft file under `tmp/` — is left behind for any of them.
  3. Repeat with a role name the swarm does not declare. Confirm refusal with a
     stated reason and nothing queued.
  4. Repeat with no token and with a bad token. Confirm rejection and nothing
     queued.
  5. Confirm `GET /agents` still answers exactly as before — this slice changes
     no existing contract.
