description: |
  ## What

  Give Bubble a note composer: a navigation entry from the main screen, a role
  picker, a one-line message field, and a send that queues a real `type: note`
  handoff for the picked role.

  Sending only. Amend and withdraw of a still-queued note are slices B and C of
  this epic and must not appear on this screen — scenario 06 asserts their
  absence, so that boundary is checkable rather than merely intended.

  ## Approach

  1. **Role picker reads the roster the bridge already publishes.** The
     authenticated `GET /agents` endpoint already returns
     `{ role, displayName, ... }` derived from `.swarmforge/roles.tsv` — the
     roster the swarm actually runs. Read it; do not re-declare a role list in
     Kotlin, or the picker will drift the first time the pack changes.

  2. **One new authenticated endpoint, `POST /agent-notes`.** Body names the
     recipient role and the message. The namespace is resource-shaped on
     purpose: slice B's list/withdraw and slice C's amend extend the same path
     rather than minting a second vocabulary.

  3. **The handler queues by shelling to `swarm_handoff.bb`** with a draft of
     `type: note` / `to: <role>` / `priority: 00` / `message: <text>`, under
     `SWARMFORGE_ROLE=coordinator`. This is not a new precedent — it is exactly
     what `enqueueRoleAnswerNote` in `telegram-front-desk-bot.ts` already does,
     for exactly the same reason: the constitution forbids hand-writing a file
     into `inbox/new/`, and a bridge process holds no pipeline role of its own.
     Reuse that path rather than growing a second one.

  4. **The message budget is 76 characters, and the composer owns enforcing
     it.** A note's `message:` is one line, 80 characters maximum
     (`handoff-protocol.md`). Four of those are reserved for an `op: ` prefix
     the handler prepends (see below), leaving the human 76. The composer
     refuses — before any network call — a message that is empty, that exceeds
     the budget, or that contains a line break or control character. Refusal
     states which rule was broken. The server re-checks; a client-side-only
     limit is a suggestion, not a constraint.

  5. **The `op: ` prefix exists so the note is attributable.** Because
     `swarm_handoff.bb` stamps `from:` from `SWARMFORGE_ROLE`, an
     operator-composed note would otherwise arrive indistinguishable from one
     the coordinator wrote — the precise confusion that made a stray
     priority-00 "use staging please" note unattributable on 2026-08-01. The
     prefix costs four characters and buys a receiving role the ability to tell
     the two apart at a glance.

  6. **Failures state a reason.** Unreachable host, rejected token, and a
     refused queue write are three different problems and read differently.
     Reuse `BridgeClient`'s existing friendly-failure mapping; a bare status
     code is never the whole message.

  7. **Put the message validation and the roster parsing on the pure-logic side
     of BL-769's JVM seam**, so scenarios 02 and 04 are covered by real unit
     tests rather than a manual procedure. That is the whole reason this ticket
     depends on BL-769.

  ## Out of scope

  - Listing, amending, or withdrawing a queued note (slices B and C).
  - Any handoff type other than `note` — never `git_handoff`.
  - Changing `swarm_handoff.bb`, the handoff grammar, or the mailbox layout.
  - Changing `GET /agents` or any other existing bridge contract.
  - Delivery confirmation beyond "the queue accepted it". Whether the role has
    since woken is slice B's read model, not this one's.

approval_context: >
  Defaults I picked, all amendable.


  (1) **`POST /agent-notes`, a new authenticated endpoint**, rather than
  extending `/lets-talk/*`. Let's Talk is a conversation with the host agent;
  this queues a parcel for a pipeline role. Different thing, different path,
  and slices B and C extend this one.


  (2) **Priority `00` on every note the composer sends.** An operator typing a
  note to a role by hand is, by construction, the blocking-decision lane the
  `00` priority exists for. Tell me if you would rather choose the priority per
  note and I will add the control.


  (3) **76 characters, with a reserved `op: ` prefix.** The full rationale is
  in the epic's approval_context: without the prefix an operator note is
  indistinguishable from a coordinator note, which has already caused real
  confusion. Say the word and I will give you the four characters back.


  (4) **Empty messages are refused.** A note with no message wakes a role for
  nothing.


  The judgement worth your eye: this slice cannot start until **BL-769** lands,
  because without the JVM unit seam its acceptance contract would run zero
  scenarios — which has already happened on five shipped Android tickets. If
  you want the composer sooner, the honest options are to expedite BL-769 or to
  accept a manual-procedure-only contract for this slice. Tell me which.

