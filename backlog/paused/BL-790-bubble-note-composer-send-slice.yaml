  - "Every note this slice queues is written by shelling to swarm_handoff.bb; no code path in the slice writes a handoff file into a mailbox directory directly."
  - "No request body the caller can send produces a handoff draft whose message header exceeds 80 characters or spans more than one line — the endpoint refuses it before any draft is written."
