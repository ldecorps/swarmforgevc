notes: |
  ## e2e procedure for QA

  With a live swarm and a paired Bubble build:

  1. Open the note composer from Bubble's main navigation. Confirm the role
     picker lists exactly the roles in `.swarmforge/roles.tsv` — add or remove
     a role from the running pack and confirm the picker follows.
  2. Send a short note to a role that is currently dormant. Confirm a
     `type: note` parcel appears in that role's `inbox/new/`, that its
     `message:` carries the `op: ` prefix and the typed text, and that the
     role drains it on its next `ready_for_next.sh`.
  3. Type 77+ characters, then a message containing a line break, then an empty
     one. Confirm each is refused on the device with a stated reason and that
     no parcel is queued for any of them.
  4. Point Bubble at a bad token, then at a stopped bridge. Confirm the
     composer states the reason in each case rather than a bare code, and that
     neither reports the note as queued.
  5. Confirm no amend or withdraw affordance is present anywhere on the screen.
