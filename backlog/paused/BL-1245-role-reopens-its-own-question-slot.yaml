id: BL-1245
title: "when the answer never reached the answer store, deliver-role-answer has nothing to pair and the role's pending slot stays shut with no move available to anyone but a human"
milestone: M8
type: defect
severity: high
# high: a live fault that removed a role's only clarifying-question channel
# for five hours on 2026-08-28 with no signal and no available action. Not
# critical: it needs the swarm to be down when the human answers, and nothing
# is lost - the question and the answer both survive, just not paired.
status: todo
epic: swarm-reliability
priority: 20
direction: agent-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1245-role-reopens-its-own-question-slot.feature

human_approval: pending
approval_context: >
  What needs your sign-off is who may reopen the slot. This ticket says the
  ASKING ROLE may, on its own say-so, provided it states a reason that is
  recorded. The alternative is what we have now - only a bot or you - and that
  is exactly what wedged the specifier for five hours today. Letting a role
  reopen its own slot does mean it could in principle abandon a question you
  have not answered yet; the mandatory reason and the preserved marker are the
  check on that, not a refusal.

  Firm, and the reason this is not just "delete the marker": the resolve must
  PRESERVE what was asked. GH-26 already set that posture for the
  undeliverable case (rewrite with a state field, never unlink), and the
  question text plus its asked_at_ms is the only record of what the role
  wanted to know. It must survive, and it must live somewhere the
  pending-guard can never read back as live state.

description: |
  ## What

  A role can reopen its own pending question slot by resolving the outstanding
  question with a stated reason. The resolve is refused with no reason, reports
  plainly when nothing was pending, and preserves the question it resolved -
  text, `asked_at_ms`, and the reason - where the already-pending guard can
  never read it back as live state.

  ## Why

  BL-1244 fixes the ordinary case: an answer WAS recorded, and delivering it
  should free the slot. This is the case where nothing was recorded at all.

  Verified live 2026-08-28. The specifier asked the BL-1191 restart-gate
  question. The human answered it verbatim at 10:54Z - "Hold restart, do not
  push, wait for QA" - while the swarm was DOWN. No bot ran, so nothing was
  written to `role-answers/specifier.json`, and `deliverRoleAnswer` has
  nothing to pair: it reports `no-answer` and leaves the marker exactly where
  it is. Five hours later the specifier had a new question to raise and got:

      {"asked":false,"reason":"already-pending"}

  There is no expiry, no override, and no supported recovery. The only move
  was to read the marker's path out of the source, confirm by hand that the
  answer was on record, and move the file aside - which is what happened, and
  is not a procedure anyone should have to reinvent.

  The out-of-band window is not exotic. A human answers when they are at the
  keyboard, and the times the swarm is down are exactly the times an agent
  most needs to ask something.

  ## The gate shape this is an instance of

  BL-1237, BL-1240 and BL-1241 were one defect shape: a gate whose refusal
  reaches someone with no action available. This is the fifth, and the purest:
  the refusal reaches the asking role, and until this ticket lands there is
  literally no supported action it can take.

  ## How (direction, not mandate)

  `role_ask.bb` already owns writing the marker exclusively, so the resolve
  belongs beside the ask rather than in the TypeScript bot - the bot's own
  clear stays exactly as it is. GH-26's marker shape is the precedent: it
  rewrites the marker with a state field instead of deleting it, and
  `operator-lib/role-ask-blocked?` already reads a state the guard treats as
  not-pending.

  Wherever the preserved record goes, it must not be a `.json` inside
  `role-awaiting/` - `operator_runtime.bb` scans that directory for `*.json`
  and would read the preserved copy back as a live marker.

  ## Constraints

  - A reason is mandatory and is recorded. A blank reason is refused and the
    slot stays shut.
  - Never destroy the question: the preserved record keeps the text and
    `asked_at_ms`.
  - Do not change `clearRoleAwaitingAnswer` or GH-26's undeliverable path.
  - Do not infer resolution from a recorded answer - that pairing is
    BL-1201's, and the case this ticket exists for has no recorded answer at
    all.

qa_e2e_procedure: >
  (1) Raise a question with role_ask.bb; confirm a second ask is refused
  already-pending. (2) Resolve with a blank reason; confirm the resolve is
  refused AND a further ask is still refused. (3) Resolve with a real reason;
  confirm the next ask is accepted. (4) Read the preserved record and confirm
  it holds the original question text, its asked_at_ms, and the reason given.
  (5) Confirm `.swarmforge/operator/role-awaiting/` holds no file any later
  ask reads as pending, and that operator_runtime.bb's status.json does not
  surface the preserved record as an undeliverable drop. (6) Resolve again
  with nothing pending; confirm it says so and exits 0.

out_of_scope: |
  - The recorded-answer case. That is BL-1244, and the two are independent:
    this one is a new verb on role_ask.bb, that one is the delivery leg in the
    TypeScript bot.
  - GH-26's undeliverable-drop path. Already shipped, unchanged.
  - Any expiry or timeout on a pending question. A question the human has not
    answered stays pending however long that takes; the fix is a move the role
    can make, not a clock.
  - Why the swarm was down, and the reset that destroyed the answer record.
    Owned by BL-1236.

invariants:
  - "A role can always reopen its own pending slot: no state of the awaiting marker leaves the asking role with no action available."
  - "Reopening never destroys the question - its text, its asked_at_ms, and the reason given remain readable afterwards."
  - "A preserved record is never read back as live state: the only question the guard treats as pending is one actually raised and not yet resolved."

source: |
  Observed by the specifier 2026-08-28 while working the architect's
  priority-00 note on BL-1230. The marker held the answered BL-1191
  restart-gate question (asked_at_ms 1787914235995, answered by the human
  10:54Z). Recovered by hand: archived to
  .swarmforge/operator/role-awaiting-archive/specifier-20260828-answered.json,
  with the answer record restored to backlog/answers-archive/ (it had been
  destroyed with commit 5ca4950d6 by the reset BL-1236 owns).

