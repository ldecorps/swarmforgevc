id: BL-1783
title: "A verification-debt category leaves the unowned state only by being settled: --discharge marks every outstanding row with discharged_at and a committed discharged_evidence file once a tool makes the check mechanical, and --waive marks them with waived_at, waived_by and a non-blank reason when the check is not worth a tool. Settling never removes a row, touches only the named category, and a hand check recorded after a settle counts again from one"
