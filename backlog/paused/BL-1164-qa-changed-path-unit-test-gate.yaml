description: |
  ## What

  After BL-668, QA passed on acceptance and wiring grep but never ran
  `test_handoffd_one_shot_flags_parse.sh` although `handoffd.bb` was in the
  land diff. The daemon died on the next restart.

  ## Deliverables (specifier landed prose on main at mint)

  1. **Constitution Article 4.5** — changed-path unit test gate for QA:
     diff parcel vs `origin/main`; for each changed production path run every
     mapped unit/wiring/`suite-manifest.tsv` test; bounce to coder with
     `failureClass: unit` when no automated test loads or exercises a changed
     production path; record every changed-path command in Article 4.4
     inventory (RUN or BLOCKED BY, never omitted).
  2. **QA.prompt** — Verification Order bullet naming the changed-path gate
     after the full unit suite bullet, with handoffd.bb →
     `test_handoffd_one_shot_flags_parse.sh` as the worked example.
  3. **Documenter how-to** — operator-facing steps for QA's changed-path
     inventory under Article 4.4 (manifest grep, narrowest command, bounce
     when uncovered).

  ## How (direction, not mandate)

  Day-one tooling is manifest grep + existing `swarmforge/scripts/test/`
  scripts — no new `qa-changed-path-tests.js` helper required in this slice.
  Optional coder.prompt cross-reference may cite BL-1164 but is not mandatory
  deliverable here.

qa_e2e_procedure: >
  (1) Grep constitution Article 4 and QA.prompt at parcel commit — changed-path
  gate text present and matches ticket intent.
  (2) Documenter how-to exists and names manifest grep, narrowest command, and
  coder bounce when uncovered.
  (3) Acceptance scenarios green after compile.
  (4) Confirm specifier mint commit on main recorded in ticket notes.

out_of_scope: |
  - Building qa-changed-path-tests.js (follow-up if manifest grep proves insufficient).
  - Replacing acceptance, property, or full-suite gates.
  - QA running mutation (hardener-only, unchanged).

