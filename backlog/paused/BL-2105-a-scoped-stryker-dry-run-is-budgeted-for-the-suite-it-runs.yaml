id: BL-2105
title: "A scoped Stryker dry run is budgeted for the suite it runs: extension/stryker.config.json sets no dryRunTimeoutMinutes, so every scoped run copied from it starts at Stryker's 5-minute default while the perTest dry run executes the whole unit suite (about 10 minutes on this host) - twice the dry run hit that ceiling and the hardener fell back to hand mutation; the base config carries the 15-minute budget six per-ticket configs already set by hand"
