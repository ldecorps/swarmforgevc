invariants: []

description: |
  ## What is wrong

  `extension/stryker.config.json` sets `timeoutMS` (60000) and
  `timeoutFactor` (3) for each mutant but no `dryRunTimeoutMinutes`, so
  Stryker's default of 5 minutes bounds the initial dry run. With
  `coverageAnalysis: perTest` the dry run executes the whole vitest unit
  suite under instrumentation; the suite alone takes about 10 minutes on
  this host (BL-1599's work ratchet, 605 s). Of the 16
  `extension/stryker.bl*.config.json` files the hardener has written, 6
  raise the budget to 15 by hand and 10 do not.

  Verification-debt category `stryker-dry-run-timeout-fallback` (owned by
  this ticket):
  - BL-1836 (2026-10-02): the dry run timed out at the 5-minute ceiling
    twice; hand mutation stood in.
  - BL-1858 (2026-10-04): timed out at 5 minutes once, then a retry with
    `--dryRunTimeoutMinutes 12` was reaped mid-run; hand mutation stood in.
  - BL-1784 (2026-10-09, on the hardener's branch as 5d494b1093): the run
    was terminated (exit 143) at about 7 minutes on 4 attempts under
    another seat's 10-worker vitest load.

  ## What is wanted

  - `extension/stryker.config.json` carries `dryRunTimeoutMinutes: 15`,
    the value the hand configs settled on (scenario 01).

constraints: >
  The step handler reads the real extension/stryker.config.json, never a
  copy. The handler lands with the feature (BL-233).

out_of_scope: |
  - The exit-143 kills (BL-1784's row, BL-2097's row of 2026-10-09, the
    mid-run reap of BL-1858's retry): identified 2026-10-09 as
    handoffd_supervisor's orphan reaper (`reap-job-orphan`) killing a
    Stryker run launched with a bare `npx stryker run` that outlived the
    Bash tool's 120 s cap. hardender.prompt already required
    `detach_job.sh` for such runs; the specifier moved that rule next to
    the mutation step and into the hardener's local-model card the same
    day. Not this ticket's budget.
  - Editing the existing per-ticket configs.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2105-a-scoped-stryker-dry-run-is-budgeted-for-the-suite-it-runs.feature`:
     1 of 1 ok.
  2. `python3 -c "import json; print(json.load(open('extension/stryker.config.json'))['dryRunTimeoutMinutes'])"`
     prints 15.
  3. After the land: the next hardener pass that runs Stryker records its
     dry-run time in its evidence, and no new
     stryker-dry-run-timeout-fallback row names a 5-minute ceiling.

