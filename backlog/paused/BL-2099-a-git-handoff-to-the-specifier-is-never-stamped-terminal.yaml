  posed and there are no ruling_options. FIRM: the decision stays in
  reverse_hop_lib.bb terminal-forward?, the single decision point BL-1536
  made and swarm_handoff.bb calls; the fix goes there or below it, never
  in a second copy in swarm_handoff.bb. FIRM: reverse copies (back-one,
  back-all) keep their marker and bounces stay unmarked (BL-1302, BL-1313,
  BL-1536 unchanged). FIRM: the receive side (Article 2.4,
