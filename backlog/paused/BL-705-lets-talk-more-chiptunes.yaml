description: |
  ## What

  Expand Let's Talk **hold music** (`chiptuneSongs` in
  `extension/src/bridge/letsTalkUiHtml.ts`) with well-known chiptune themes.

  ## Named asks

  - Thanatos (1986) — favorite; YM referenced at genesis8bit.fr (no file on GH #28)
  - Ghost'n Goblins
  - Zelda
  - Tron
  - Other iconic themes the implementer can reasonably approximate

  ## Approach

  Prefer additive entries in the existing step-sequence player (name + bpm +
  4-channel steps). Do **not** build an Atari ST YM decoder in this ticket.

  ## Out of scope

  - YM file loader / streaming YM playback engine
  - Replacing the existing Zappa-adjacent set (additive unless amended)
  - Hold-music / Pause-all UX changes

