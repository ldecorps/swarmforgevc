description: |
  ## Human, verbatim (Article 5.3)

  "could we imagine that the claude agent does a knowledge transfert?"
  "yes please, and have it priorize as part of the local llm collection"

  ## What is wrong

  BL-1176 built a portable memory payload (BL-1177) and wired
  capture/inject into same-role model switches (BL-1178). Verified at
  mint (main 7d124ad08d):
  - Capture fills `continuitySummary` from a `transcriptSummary` the
    caller passes, and no live caller passes one:
    `buildOutgoingCaptureState` defaults it to `''`, and
    `trial-boundary-memory.js` defaults `--summary` to `''`.
  - `inject` only validates. Nothing is written to disk, so the incoming
    seat never sees even a good summary (BL-1816 owns that half).
  - Only two production paths run the transfer:
    `backendSwitch.switchRoleModel` (the panel's Claude-to-Claude model
    dropdown) and `model_steward_cli.bb`'s `transfer-memory!` at
    `trial nominate` (trial-start) and `trial assess` (trial-end).
    `agentMemoryVendorAdapters.transferMemoryAcrossVendors` (BL-1179's
    matrix) has no caller. The steward trial is therefore the one live
    path on which a Claude seat can hand its role to a local-model seat,
    and this ticket wires it.
  - Pack cold-swaps (`cold_swap_day_shift_to_ollama_qwen.sh`:
    `kill_all_swarm` then relaunch on a local pack) run no transfer at
    all. Extending the brief to them is a question put to the human on
    2026-09-29, not this ticket's scope.

  ## What is wanted

  1. At either trial boundary, `transfer-memory!` knows the outgoing and
     incoming seats' agents (`model-factory-lib/resolve-launch-agent` on
     each seat's provider). A brief is owed exactly when the outgoing
     agent is `claude` and the incoming agent is `local-model`.
  2. When owed, the steward asks the live outgoing seat for a brief and
     waits for it, with a bound the parcel states and records (never
     unbounded; the seat may be mid-parcel). The brief covers the open
     parcels and their state, decisions already taken, landmines, and
     "do next / don't redo", in at most 2000 characters (about 500 tokens:
     it must fit beside BL-1798's 8192-character card in an 8k window).
     How (direction, not mandate): type the request into the seat's pane
     through the existing injection lib (`handoff_inject_lib.bb`, with
     BL-1719's nil-session guard), the request text itself carrying the
     whole instruction (what to cover, the path, the limit), so no role
     prompt needs a new convention. The brief path is
     `.swarmforge/agent-memory/<role>/brief.md`.
  3. The brief reaches `trial-boundary-memory.js` as `--summary-file
     <path>` and becomes `continuitySummary`. The CLI persists the
     schema-1 payload at `.swarmforge/agent-memory/<role>/payload.json`,
     with `capturedAt` (ISO-8601) inside `handoffPack` so BL-1816 can
     judge freshness without a schema change.
  4. An owed brief that never arrives within the bound, is empty after
     trimming, or is over 2000 characters refuses the move through the
     existing `trial-die!` path, naming the reason ("no brief", "empty
     brief", "over 2000"); the seat is not written.
  5. Every other pair, and every step that crosses no boundary, runs
     exactly as today: no request, no wait, no new refusal. Aider
     continuity claims (BL-1179) are out of scope here.

  ## Scenario notes
  - The fixture drives the real `transfer-memory!` path with a stub pane
    (no tmux) and a stub memory tool where the scenario is about the
    steward's decision; scenario 02 runs the real `trial-boundary-memory.js`
    so the persisted payload is the real one. Fixture roots are mkdtemp
    (BL-1390).
  - The handler is `specs/pipeline/steps/bl1815ClaudeSeatBriefSteps.js`,
    landing in the same commit as the runnable feature (BL-233).
  - IR-DRY at mint: 3 possible-synonym findings, all one step pattern with
    different quoted values (IR-DRY does not normalize quoted literals,
    BL-959); no change.

  ## Scope
  - `swarmforge/scripts/model_steward_cli.bb` (and a lib beside it if the
    decision and the wait want one), `extension/src/tools/trial-boundary-memory.ts`,
    `extension/src/tools/agentMemoryHotSwap.ts` or `agentMemoryTransfer.ts`
    only for the persisted payload, their tests, the step handler,
    evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1815-a-claude-seat-briefs-its-local-model-successor.feature`:
     8 of 8 ok (0 of 8 on main at mint, no handler yet).
  2. Read the parcel's evidence for the wait bound and its reason.
  3. In a mkdtemp fixture, never the live steward: arm a trial from a
     claude seat to a local-model seat with the stub pane answering, and
     read `.swarmforge/agent-memory/coder/payload.json` in the fixture:
     schemaVersion 1, the brief as continuitySummary, capturedAt present.
  4. `git diff main...HEAD --name-only` names no `swarmforge/roles/` file
     and no `.swarmforge/` path.

