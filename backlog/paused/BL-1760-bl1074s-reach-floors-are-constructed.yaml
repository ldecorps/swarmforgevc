human_approval: approved
approval_context: >
  Minted approved under the 2026-09-17 operator hotfix (severity high
  defect, no choice posed, no ruling_options). New feature file, the same
  two-scenario shape as BL-1583's sweeps. FIRM: both floors stay at 2 and
  nothing is seeded, retried or given a larger budget to hide the miss.

invariants:
  - "No reach floor value, draw budget, timeout or tolerance in the file is lowered, raised, widened, seeded or retried; both floors (2 re-files, 2 copy-closes) are asserted after the change at the same value, and invariant 2 is untouched."

description: |
  ## What is wrong

  `extension/test/bl1074PostCloseRefileDuration.property.test.js`,
  invariant 1 (lines ~65-98): `fc.property(fc.integer({min: 0, max: 3}),
  fc.boolean(), ...)` with `numRuns = 12`. It counts `casesWithRefile` and
  `casesWithCopyClose`, then asserts each `>= 2`. At least 2 heads in 12
  unseeded draws is not guaranteed. QA's property lane run on the BL-1739
  parcel (fbb9e1f147, 2026-09-25) failed with "generator reached a
  copy-close in only 1 of 12 cases" (backlog/evidence/BL-1739-QA-20260925.md,
  QA note 003193). One run on main the same day was green (1.48 s), which
  is what a seed miss looks like.

  BL-1583's census never caught it. `bb
  swarmforge/scripts/sampled_reach_floor_census_cli.bb .` reads the file
  as `no-floor 8`: it takes invariant 2's literal `numRuns: 8` and does
  not bind the floor to the `{ numRuns }` shorthand. It is the only
  misread among the three files using the "generator reached ... in only"
  counter idiom (meanTicketTimeCost: constructed; metricsTickGate:
  sampled-high). The classifier gap is recorded on epic BL-1583's
  remaining slices and is not this ticket's.

  ## What is wanted

  - Invariant 1 iterates the cells it must reach (refileCount 0..3 x
    copyClose false/true, or the subset the floors need) with
    `runsPerCell` draws each, and asserts both floors through
    `assertReachFloor` at 2, like sweeps 1-4 (BL-1585..BL-1587, BL-1691).
  - The census CLI then reads the file `constructed` (scenario 02).

  ## Scope

  - `extension/test/bl1074PostCloseRefileDuration.property.test.js` only
    (+ evidence).
  - New: `specs/pipeline/steps/bl1760Bl1074ReachFloorsSteps.js`. The step
    texts match BL-1691's, so reuse its handler's functions rather than
    copying them, scoped to this feature.
  - Out of scope: the census classifier (BL-1583 remaining slice); every
    other property file.

constraints: >
  The parcel never edits backlog/standing-reds.tsv (BL-1663); its land
  retires the row (BL-1631).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1760-bl1074s-reach-floors-are-constructed.feature`:
     2 of 2.
  2. `cd extension && npx vitest run --config vitest.properties.config.mjs
     test/bl1074PostCloseRefileDuration.property.test.js`: 3 of 3.
  3. The register row for the file names BL-1760 on the parcel commit.
  4. `git diff main...HEAD --name-only` names only the test file, the step
     handler, the feature's steps registration and evidence.
  5. After the land: REGISTER_ROW_RETIRED for
     `extension/test/bl1074PostCloseRefileDuration.property.test.js`.

