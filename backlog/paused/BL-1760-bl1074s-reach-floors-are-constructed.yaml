id: BL-1760
title: "bl1074PostCloseRefileDuration's reach floors are constructed, not sampled - invariant 1 draws (refileCount 0..3, copyClose boolean) 12 times and then demands 2 re-files and 2 copy-closes, a coin flip that went red in QA's property lane on 2026-09-25 (1 copy-close in 12); rewrite it on helpers/reachFloors (runsPerCell, assertReachFloor) at the unchanged floors, as BL-1583's sweeps did, so the census reads it constructed"
milestone: M8
