id: BL-1097
title: "The coordinator's router hands a role a parcel whose commit already contains that ticket's finished, QA-approved work - nothing advances `status:` past `todo`, so an active ticket looks unstarted until bookkeeping closes it"
type: defect
severity: high
# RAISED medium -> high 2026-08-23 (specifier), on the BL-973 incident below.
# The original medium rationale is preserved verbatim, and its two load-bearing
# claims are what the new evidence falsifies:
#   "medium: real but CONTAINED. Nothing is lost or corrupted and no signal is
#   falsified - the receiving role opens the parcel, correctly finds nothing to
#   do, and completes it. What it costs is a hop on the most expensive seat in
#   the pack, four times in one hour on 2026-08-23. The frequency is carried by
#   priority: 6, not by severity - Article 3.2.4's "two priority scales, never
#   conflate"."
# The receiving role does NOT reliably find nothing to do: on BL-973 the coder
# did not recognise the ticket as finished and built a second, complete, rival
# implementation, which then rode into an unrelated ticket's parcel. That is a
# live fault degrading behaviour - Article 3.2.4's `high` predicate - not a
# wasted hop. Frequency is still carried by priority: 6, unchanged; this raise
# is about blast radius only, and the ticket is still `human_approval: pending`
# so the operator can veto it with the same tap.
status: todo
epic: swarm-reliability
assigned_to: coder
priority: 6
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1097-the-router-re-routes-a-ticket-that-has-already-been-worked.feature
human_approval: approved
approval_context: >
  Firm: a role must not be handed a parcel whose commit already contains that
  ticket's finished work. Article 1.9 forbids FORWARDING a no-op parcel; this
  is the same rule applied to the router that originates one.

  Your call is which signal the router should read, and I have a
  recommendation. The daemon already computes exactly this predicate -
  `collect-dispatched-ticket-ids` / `decide-dispatch-gaps` in
  chase_sweep_lib.bb answer "has this ticket ever been dispatched?" by
  scanning the mailboxes. Reusing it means no new state and no new field to
  keep in sync, and it is already proven in production. The alternative -
  finally making something WRITE `status:` as a ticket moves - is a bigger
  change that introduces a field which can itself go stale, and every role
  would have to maintain it.

  I recommend reusing the existing predicate. If you would rather have a real
  lifecycle `status:`, that is a defensible larger piece of work and this
  ticket should be respecced rather than stretched.
invariants:
  - A router never originates a parcel whose cited commit already contains the finished work for that parcel's ticket - the no-op rule binds the sender, not only the forwarder.
  - The router and the daemon's dispatch-gap sweep agree on whether a ticket has been dispatched - two components must not hold contradictory answers to the same question.
description: >
  WHAT: neither `route_backlog_to_coder.sh` nor `promote_and_route_next.sh`
  checks whether a ticket has already been dispatched. `promote_and_route_next.sh`
  tests only `status: blocked`; the other has no such check at all. So any
  ticket sitting in `backlog/active/` with an `assigned_to` is routable again,
  and stays routable for the whole window between the work finishing and the
  coordinator's separate bookkeeping step moving it to `backlog/done/`.

  Nothing closes that window, because nothing advances `status:`. Measured
  2026-08-23: every ticket in `backlog/active/` read `status: todo`, and a
  search of `swarmforge/scripts/` found NO writer for that field at all. It is
  set once at mint and never again.

  EVIDENCE, 2026-08-23, four in about one hour - all four routed exactly once,
  so these are not duplicate sends, they are single sends of finished work:

    | ticket  | routed to coder | cited commit |
    |---------|-----------------|--------------|
    | BL-713  | 00:12:54        | 0fb5c4442f   |
    | BL-1015 | 00:13:18        | 0fb5c4442f   |
    | BL-1045 | 00:23:27        | (Work note)  |
    | BL-1069 | 01:10:22        | 3b1a58f5b7   |

  The cited commit is the proof. `0fb5c4442f` is the SAME commit named in the
  merge-up "Merge QA-approved BL-1015 (0fb5c4442f) into hardener" - so the
  router handed the coder a parcel whose commit already contained the
  completed, QA-approved BL-1015 work. BL-713 was routed citing that same
  commit and closed in the batch "Close BL-713, BL-1069: move to done
  (multi-ticket QA batch)". Each parcel was dequeued and completed in 50
  seconds to 4 minutes - the receiving role opening it, finding nothing to do,
  and closing it.

  WHY it is not the daemon's auto-route: that path is BL-1093 and BL-1094, and
  it is a different mechanism with different failures. This one originates in
  the coordinator's own routing. The two do not overlap, and fixing either
  leaves the other.

  How (direction, not mandate): see approval_context - prefer reusing the
  dispatch-trail predicate the daemon already has over introducing a written
  lifecycle status. Whichever is chosen, the router and the sweep must not end
  up with two different answers to "has this been dispatched" (invariant 2).

  NOT IN SCOPE: the auto-route path (BL-1093/BL-1094); the `assigned_to`
  mint-default hop (BL-1047); closing the tickets above, which is ordinary
  bookkeeping and already done.
qa_e2e_procedure: >
  1. Fixture: an active ticket whose work is already complete and whose
     dispatch trail exists in the mailboxes. Run the coordinator's route path.
     Before the fix it emits a parcel; after, it does not. That is the defect
     in one step.
  2. The working path must survive: a freshly promoted active ticket with NO
     dispatch trail is still routed to its assignee. A fix that suppresses
     this has broken promotion.
  3. Agreement, which is invariant 2: for a corpus of active tickets, the
     router's "already dispatched" answer matches
     `chase-sweep-lib/decide-dispatch-gaps` for every ticket, with no
     disagreement in either direction.
  4. The window itself: a ticket whose work is finished but which has NOT yet
     been moved to `backlog/done/` must not be routable. This is the exact
     state all four evidence tickets were in, and a fix that only checks
     `backlog/done/` membership will still fail it.
notes: >
  ESCALATING EVIDENCE — BL-973, 2026-08-23 (specifier). The worst observed
  instance of this defect, and the reason severity was raised to `high`. The
  same routable window described above handed the coder BL-973 while it was
  finished but not yet moved to `backlog/done/`. Unlike the four cases in the
  table, the coder did not open the parcel and find nothing to do: it built a
  SECOND, complete, independently-named implementation of both of BL-973's
  invariants (`8e9dbb95d` + `0ccf107134`, ~1800 lines across 20 files) an hour
  after the ticket closed at `a5c184f8e`.

  What it cost, beyond the wasted coder hop the medium rationale predicted:
  a cleaner pass spent refusing it (`6259a8007`); a specifier escalation to
  pick which implementation survives; and - the part that makes this not
  contained - both duplicate commits became ancestors of `bfe5394591`, the
  BL-1063 parcel, so rejected work for one ticket is riding inside another
  ticket's parcel and must be removed before BL-1063 can advance (BL-506).
  Disposition recorded on BL-973: landed implementation stands, duplicate
  discarded in full.

  This strengthens invariant 4 rather than adding a new one: BL-973 was in
  exactly the "finished but not yet in backlog/done/" state that invariant
  already names. It also shows the cost of a miss is unbounded, because
  nothing downstream of the router assumes the receiving role will notice.

  Reported by the coder, twice. The first note - "4 misroutes: active tickets
  keep mint status:todo assigned_to:coder forever" - was accurate, and the
  specifier's first investigation did not confirm it: it checked the daemon's
  auto-route path rather than the coordinator's, and read the wrong mailbox
  directory (`.swarmforge/handoffs/<role>/inbox/`, which is stale, instead of
  the live per-worktree `.worktrees/<role>/.swarmforge/handoffs/inbox/`). On
  that data the four `assigned_to: coder` tickets appeared to have dispatch
  trails and to be correctly left alone - but those trails ARE the four
  coordinator routes being complained about, so the reasoning was circular.

  The coder's second note - "4 no-op routes came from coordinator, not
  auto-route; BL-1086/7 miss that path" - is what corrected it, and is right
  on both counts. Recorded here because the mailbox-path mistake will mislead
  the next investigation the same way.

  Note on ids: the coder's quoted note says "BL-1086/7" because those were the
  ids at the time. Both were renumbered when local main finally merged origin -
  they are now BL-1093 and BL-1094. The quote is left exactly as sent.

  IR-DRY disposition (checker run): one `possible-synonym` finding, reviewed
  and KEPT. Scenario 02's fixed "no parcel is emitted" is deliberately not
  parameterized - that scenario pins one specific state (finished but not yet
  closed) with one possible outcome, and a one-valued Examples column is what
  the prune rule says to remove.

  RESOLVED, the BL-1063 entanglement only (2026-08-23, specifier, on the
  coder's note "BL-973 dups already out at 335455b4c4"). Verified by content,
  not by ancestry (BL-490/BL-495): at `335455b4c4` all fourteen files the two
  duplicate commits added are absent, and every file the landed
  implementation added is present, with the five shared-modified files
  byte-identical to the restore at `cd165925b`. `specs/pipeline/steps/index.js`
  differs only by two unrelated registrations (BL-1063, BL-1086); it still
  requires `bl973CopyListsClosureDerivedSteps` and never required the
  duplicate's step file. Both `main` and `origin/main` are clean of the
  duplicate too. So BL-1063 is unblocked and the BL-506 out-of-scope-diff
  problem is closed. This does NOT change the defect, its severity, or its
  scope: the router still originates the parcel, and the cost recorded above
  was paid in full - a coder pass, a cleaner refusal, a specifier escalation
  and a removal pass. It is recorded only so a later reader does not chase a
  blocker that no longer exists.

  SECOND LIVE INSTANCE, and a correction to the note above (2026-08-23,
  specifier, on an architect note "BL-1063 already in backlog/done/ on main;
  cleaner's parcel is a duplicate"). The entanglement was resolved, but the
  PARCEL was not: BL-1063 closed at `d4b62f063` (03:52Z) and a parcel
  bearing its name kept moving, reaching the architect at 04:59Z, who
  correctly refused to forward it under the No-Op Rule. This is the defect
  in this ticket reproducing end to end, on the very ticket whose
  entanglement the previous paragraph declared resolved.

  MY OWN CONTRIBUTION, recorded because nobody else can see it: the
  specifier notes to coder and cleaner at 04:14Z ("BL-1063 parcel
  bfe5394591 carries it", "get dups out of BL-1063 branch") were sent 21
  minutes AFTER BL-1063 closed. The duplicate-removal work they asked for
  was real, but naming it as BL-1063's parcel attached live work to a closed
  ticket, which is what kept the parcel moving. The removal work belonged
  under THIS ticket, which exists for exactly it. Lesson for the scope
  below: check the ticket's folder on a main ref before naming its parcel in
  a note - the same check the architect ran, one stage earlier. No bounce
  was charged to the cleaner or coder for this, so no BL-990 correction is
  owed; recorded here so the cost is not silently attributed to them.

  UPSTREAM CAUSE, cross-referenced not merged: BL-1100 (paused) specs a
  detector for a ticket QA has landed but never closed, which sits in
  `active/` looking like unstarted work. That state is a direct feeder for
  this one - the router can only re-route a finished ticket while the
  ticket is still in `active/`. BL-1030 is a measured example of both at
  once: landed, never closed, and `assigned_to` backfilled to `coder`.
  Fixing BL-1100 shrinks this ticket's input; it does not replace it, since
  a parcel can also outlive a correctly-closed ticket, as it did here.
