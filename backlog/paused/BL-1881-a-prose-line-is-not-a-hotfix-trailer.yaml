id: BL-1881
title: "The hotfix ledger's sweep reads any message line starting with Hotfix-Certification: as a trailer, so wrapped prose sentences in aa6dacc938 (a specifier prompt commit) and 1877b935a2 (a coordinator ledger commit) became uncertified hotfixes with no stamp ticket; a trailer's value is now one word, and the false entries leave the ledger"
milestone: M8
type: defect
severity: medium
