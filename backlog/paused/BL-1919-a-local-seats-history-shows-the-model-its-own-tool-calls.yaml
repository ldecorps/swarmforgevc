description: |
  ## Status: hotfix 0d44613b74 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  The model's chat template renders an assistant turn's tool calls only
  when that turn has no text: `{{ if .Content }}{{ .Content }}{{- else if
  .ToolCalls }}<tool_call>...`. BL-1917's shim keeps a reply's leftover
  text ("I'll start by reading the card.") as content beside the rewritten
  call, qwen replays that turn as history, and the model saw its own turns
  as announcements with no calls. Replayed with the card already read:
  that history ended in prose 3 of 4 times; the same history with the text
  dropped ran ready_for_next.sh 4 of 4 times. A template that renders both
  reached 3 of 4, so the fix sits in the shim.

  ## What the hotfix changed

  local_model_tool_call_shim.py: history_without_call_prose drops the text
  of every assistant turn in the request that carries tool_calls, before
  the request goes to Ollama. The reply qwen shows on the pane keeps its
  text. Each log line gains history_stripped=<n>.

  ## What the coder checks

  - The function against the description, and that the reply side is
    untouched.
  - test_bl1917_local_model_seat_url.sh passes (its case 0 runs the shim's
    16 unit cases).
  - Your own session's shim log lines carry history_stripped.
    Evidence: backlog/evidence/BL-1919-coder-<date>.md.

qa_e2e_procedure: |
  1. `bash swarmforge/scripts/test/test_bl1917_local_model_seat_url.sh` prints ALL PASS.
  2. `grep -c 'history_stripped=[1-9]' .swarmforge/local-model-shim/shim.log`
     is at least 1 after the coder's last respawn.
  3. `node specs/pipeline/cli.js specs/features/BL-1052-a-role-seat-can-be-staffed-by-a-downloaded-local-model.feature`
     passes (measured at mint: all ok).

