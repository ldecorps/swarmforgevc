source: |
  backlog/INTAKE-20260724-burn-rate-briefing-warning.md — human directive via
  Concierge topic 06:39Z 2026-07-24, re-filed verbatim by the operator because
  the original photo-caption message was silently dropped (that defect is
  BL-620). Near-verbatim: "Add a warning (in morning briefing at least) if
  projected burn rate is too high... At that rhythm, we will run out of tokens
