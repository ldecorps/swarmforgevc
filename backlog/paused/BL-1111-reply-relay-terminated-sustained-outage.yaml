milestone: M8
type: defect
severity: high
# high: live fault degrading operator messaging for half an hour; the
# sustained alert worked (BL-621) but the relay stayed dark.
status: todo
epic: swarm-reliability
priority: 11
direction: human-requested
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1111-reply-relay-terminated-sustained-outage.feature
human_approval: pending
approval_context: >
  Firm: this is a recurrence / new cause after BL-621's sustained escalation
  alert — do not re-spec the alert itself as the fix. Firm: co-occurrence
  with BL-1110's handoffd flap does not prove one root cause; keep this
  ticket independent unless a probe merges them.

  Your call is whether "terminated" vs intermittent "fetch failed" share one
  reconnect path fix or need separate handlers.
invariants:
  - "A reply-relay connection that can recover under a healthy network does so before the sustained-outage alert threshold."
  - "A sustained terminated outage raises exactly one sustained-outage alert for that window, naming the last error."
description: >
  WHAT. On 2026-08-23 ~13:02 local, Operator showed: "front-desk bot: the
  reply-relay loop has been failing continuously for 31m. Last error:
  terminated. It keeps retrying on a capped backoff - this is the only alert
  for this outage." Supervisor log dense with reply-relay degraded /
  terminated and intermittent fetch failed. Co-occurred with handoffd
  stale-heartbeat flap (BL-1110) but not proven the same fault.

  WHY. BL-621 (done) owns the sustained escalation shape; BL-320 (done) owns
  at-least-once egress. This is recurrence / new cause leaving the relay dark
  after the alert fired correctly.

  HOW (direction, not mandate). Identify why reconnect stayed on terminated
  for ~31m; make recovery or actionable diagnostics close that window without
  weakening the sustained alert.

qa_e2e_procedure: >
  (1) Inject or simulate a terminated relay under healthy network — reconnect
  succeeds before sustained threshold, or each failure is distinguishable.
  (2) Hold failures past the sustained threshold — exactly one sustained alert
  naming last error.
  (3) With last error fetch failed, relay health is not reported healthy.
  (4) Correlate front-desk-supervisor.log around a live window if reproducing
  on this host.

