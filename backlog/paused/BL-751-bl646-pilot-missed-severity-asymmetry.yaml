description: |
  ## What

  BL-646 added a new alert-severity branch to a function whose existing
  branches all share a grace-period gating pattern, without following (or
  explicitly deviating from and documenting) that pattern.

  ## Question to answer

  When a ticket adds a new branch to an existing multi-branch decision
  function (severities, states, verdicts), should a gate require diffing
  the new branch's structure against its siblings' shared pattern
  (timeouts, grace periods, guard conditions) before landing — flagging
  any asymmetry for an explicit decision rather than a silent omission?
  Harden `/pilot`'s architect-equivalent or hardener-equivalent step to
  perform this sibling-branch comparison for any new case added to an
  existing multi-branch dispatch.
