description: |
  ## What is wrong

  `extension/src/tools/multiBranchParserCoverageCheck.ts` (174 lines)
  was never mutation-tested: BL-755's hardener pass of 2026-08-26 ran a
  surgical sweep of eight hand-made mutants and no Stryker. BL-1667's
  hardener ran the first scoped Stryker pass on 2026-09-20 (evidence
  `backlog/evidence/BL-1667-hardender-first-run-survivor-census-20260920.md`,
  hardender branch): 216 mutants, 106 killed, 1 timeout, 85 survived, 21
  never covered. Every survivor and uncovered mutant sits in
  `extractCondParsers`, `extractCondArms`, `extractTsMultiArmParsers`,
  `extractTsArms`, `sliceBalancedBlock`, `extractMultiBranchParsers`, and
  `assessMultiBranchParserCoverage`'s `parsers.length === 0` branch -
  none in BL-1667's own lines, and BL-1667's constraint forbids touching
  them. `npm run crap` flags `extractMultiBranchParsers` (complexity 5,
  coverage 15%, CRAP 20.15), `extractTsMultiArmParsers` (7, 83%, 7.26)
  and `assessMultiBranchParserCoverage` (7, 100%, 7.00). The per-mutant
  list (kind, out/ line:col) is in the hardener's census.

  ## What is wanted

  - Unit tests over real source snippets - Clojure `(defn ... (cond ...))`
    bodies and TypeScript multi-arm functions - that kill each survivor
    group: arm extraction from cond clauses and from `return '...'`
    branches, balanced-block slicing, the >= 3-arm threshold, the
    empty-parser no-op.
  - Each accepted equivalent recorded with its code-level reason.
  - The three CRAP-flagged functions under 6 (coverage first; a small
    refactor only where coverage cannot reach).
  - The scoped Stryker run recorded in the evidence at the parcel
    commit; the hardener's pass re-runs it and finds nothing unexplained.

  ## How (direction, not mandate)

  - The hardener's census attributes every mutant to a line; group by
    enclosing function and write one snippet-driven test per group.
    `vitest.bl1667.stryker.config.mjs` (the hardener's scoped config,
    deleted before forwarding) is the run recipe: `--mutate
    out/tools/multiBranchParserCoverageCheck.js`, perTest coverage.

constraints: >
  No production behaviour change; BL-755's feature (7 scenarios after
  BL-1667) stays green. No edit to the shared vitest config - a scoped
  Stryker config that the parcel does not commit (the hardener's own
  rule). Never a `*_FORCE_RESULT` seam.

out_of_scope: |
  - `armExercisedByTests`, `escapeRegExp`, MARKER_CLASS: BL-1667's, and
    its hardener killed their one survivor in-pass.
  - The Stryker dry-run interference the hardener recorded
    (bl1652HandoffdRespawnReadingsWiring.test.js failing under the
    perTest dry run only): an observation for the specifier; not this
    ticket's.

qa_e2e_procedure: >
  (1) `node specs/pipeline/cli.js specs/features/BL-1669-multi-branch-parser-extraction-first-run-survivors-to-zero.feature`
  ONCE on the parcel commit: 2 scenarios ok. (2) `cd extension && npx
  vitest run test/multiBranchParserCoverageCheck.test.js` once: green
  with the new cases. (3) `npm run crap` once: none of the three
  functions above 6. (4) The parcel's evidence names the Stryker totals
  with survived 0 and no-coverage 0, or each remainder with its reason.
  Never "run it N times".

