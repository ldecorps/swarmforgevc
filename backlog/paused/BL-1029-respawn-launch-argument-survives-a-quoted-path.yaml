id: BL-1029
title: "Seven respawn sites still wrap the launch path in bare single quotes; sweep the family BL-1018 fixed one member of"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarm-reliability
priority: 25
depends_on: [BL-1018]
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1029-respawn-launch-argument-survives-a-quoted-path.feature

human_approval: pending

approval_context: >
  Two things want a decision. FIRST, severity. This is a real correctness
  defect in seven live repair paths, but it cannot fire on THIS host: the
  install path /Users/ldecorps/projects/swarmforgevc carries no apostrophe, so
  nothing is currently broken. Filed `medium` on that reasoning (real but
  contained); it becomes `high` the day the forge runs from a path that
  contains one. SECOND, whether the sweep is worth a parcel at all, or whether
  fixing the one site the incident actually reached (BL-1018, already done) is
  enough. The argument for sweeping: the same six-line construction is
  copy-pasted at seven sites, and a fix that lands at one member of a
  construction family is the classic shape that leaves the other six to be
  rediscovered one incident at a time. Firm either way: the round-trip-through
  -a-real-shell verification (scenario 01) rather than a text match, and the
  enumeration deriving its site list from the tree rather than a hand list.

invariants:
  - "Every shell-command string a respawn path emits round-trips through a real shell to the exact original launch path, for every path shape - including one containing an apostrophe."
  - "No site in swarmforge/scripts/ quotes a launch path for a shell on its own; all of them go through one shared quoting helper, and the check proving this derives its site list from the tree rather than from a hand-maintained list of files."

description: >
  WHAT. tmux hands a `respawn-pane` command's trailing argument to
  `$SHELL -c`, so that argument must itself be valid POSIX shell. Seven sites
  build it as `(str "zsh '" launch-script "'")` - a bare pair of single quotes
  with no escaping - which stops being valid shell the instant the wrapped
  path contains an apostrophe. On such a host every one of these repair paths
  fails to restart the role it was invoked to save.

  THE SITES (verified at HEAD 2026-08-22, all seven still present):
  swarmforge/scripts/swarm_ensure.bb:228 (respawn-role!);
  swarmforge/scripts/handoffd.bb:902 and :1171;
  swarmforge/scripts/handoff_lib.bb:876 and :970;
  swarmforge/scripts/babysitter_check.bb:712;
  swarmforge/scripts/remote_control_health_lib.bb:65 (respawn-role-pane!,
  itself already an extract-to-one-place for two callers).

  WHY IT IS NOT ALREADY FIXED. BL-1018 hit exactly this defect in
  single_role_repair_lib.bb, confirmed it live (`sh -c` exits 2, "unexpected
  EOF looking for matching `''"), and fixed that ONE site with a
  `shell-quote-single` helper. Its parcel touched nothing else, because
  nothing in its scope pointed at the siblings. This ticket is the sweep, and
  it is filed the same day precisely so the family is not rediscovered one
  incident at a time.

  WHY THE VERIFICATION SHAPE IS PART OF THE ASK. The defect survived in
  BL-1018's own property runner behind a `str/includes?` check on the raw
  path, which passes whether the escaping is correct or broken (the accepted
  hardener rule of 2026-08-22 records why). Scenario 01 therefore asks for a
  real shell round-trip - construct the argument, evaluate it, compare what
  comes back to what went in - not a text match against it.

  How (direction, not mandate). The natural shape is one shared quoting
  helper that every respawn site routes through, so "the launch path is
  escaped" becomes a property of a single constructor rather than a rule seven
  call sites each have to remember - the posture single_role_repair_lib.bb
  already takes for "names the pack socket explicitly". Where that helper
  lives, and whether the sites reach it by requiring a lib or by calling a
  shared command-builder, is the implementer's call; the two invariants
  constrain either shape. Note that BL-1018's `shell-quote-single` is
  currently `defn-` (private) in single_role_repair_lib.bb - promoting,
  moving, or re-implementing it are all acceptable, but leaving a second copy
  behind is not.

qa_e2e_procedure: >
  1. Run the feature's three scenarios. Scenario 01 must construct the launch
     argument through the real code path and evaluate it in an actual shell
     (`sh -c`), asserting the recovered string is byte-identical to the input
     path - including for the apostrophe row. A text/substring comparison in
     place of an evaluation does not satisfy it.
  2. Confirm scenario 01's apostrophe row FAILS against the pre-fix
     construction: point it at `(str "zsh '" p "'")` (or revert one site) and
     watch it go red, then restore. A round-trip nobody has seen fail is a
     coverage counter.
  3. Confirm scenario 03 is non-vacuous by construction: temporarily rename
     the shared helper and check the enumeration in scenario 02 reports the
     now-unrouted sites rather than silently finding none.
  4. Grep the tree yourself for any surviving `zsh '` interpolation in
     swarmforge/scripts/**/*.bb - the result must be empty apart from prose in
     comments/docstrings. Seven code sites are listed in the description;
     confirm all seven are gone and that no eighth appeared.
  5. Sanity-check a live repair still works on this (apostrophe-free) host:
     stop one non-coordinator role's pane and let the existing heal path
     restore it, confirming the sweep did not regress the common case.

source: >
  Arising from the hardender's rule_proposal of 2026-08-22 (accepted into
  swarmforge/roles/hardender.prompt the same day). Verifying that proposal's
  evidence surfaced the six-plus-one unswept sibling sites; the proposal
  itself was about the assertion shape, not the sites, so this is filed
  separately rather than folded into it.

notes: |
  depends_on: [BL-1018] - not yet landed on main at mint time (it was at the
  hardender/documenter stage, commit fcd3bc7d1 in .worktrees/hardender). The
  dependency is ordering, not scope: BL-1018 owns the eighth site and the
  helper this sweep converges on, so promoting BL-1029 first would produce a
  merge conflict over the same construction. It is genuinely implementable in
  one sitting once BL-1018 is on main.

  No `required_wiring:` deliberately. This ticket has the BL-531 shape - its
  value does depend on call sites existing, not merely on a helper being
  built - but every pattern available at mint time is the implementer's own
  future identifier (the helper's name, the lib it lands in), and BL-874
  records what happens when a placeholder is armed against a plain-substring
  matcher: the gate blocks the documenter's forward on a string nobody ever
  writes. Scenario 02 is the wiring gate here instead, and it is the stronger
  one: it enumerates the sites from the tree and asserts each routes through
  the shared helper, which no fixed substring list could do.

  Gherkin lint gate: clean. IR-DRY: 0 findings (10 step occurrences, 8
  unique; the two repeats are scenarios 02 and 03 sharing a Given/When by
  design). No Background extracted - scenario 01 has a different Given, so a
  Background would attach meaningless setup to it.
