id: BL-1105
title: "Two sessions minting in parallel can claim one ticket id and git will not notice, because the filename carries the slug - both live collisions were caught only by an incidental add/add conflict on a bot-written topic record"
type: defect
severity: medium
# medium, deliberately, not high: both live instances were caught and repaired
# within the hour, no work was lost, and the blast radius is bookkeeping - the
# swarm kept running throughout. What it is NOT is reliably detected, and the
# undetected case is real (see invariants and notes): if a collision ever lands
# with no topic-record conflict to expose it, THAT instance is a high-severity
# report, because a human approval recorded against one ticket would silently
# stand for another. Raising this ticket's own severity pre-emptively would put
# it in the expedite lane on a harm that has not happened yet.
status: todo
epic: swarm-reliability
priority: 8
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1105-a-duplicate-ticket-id-is-refused-at-mint.feature
human_approval: pending
approval_context: >
  Firm: the id is chosen by hand and nothing checks it, twice in two days now.
  The refusal belongs in the gate the specifier already runs on every minted
  ticket (`specifier_backlog_hygiene_gate.sh`) - that call site exists, so this
  needs no new one and carries no `required_wiring`.

  Your call is the PUBLISHED-corpus half, scenario 03. Checking only the local
  working tree cannot catch the case that actually bit us: a parallel session
  had already pushed its BL-1100 to origin/main while my copy was still local,
  so a local-only check would have passed both. Reading `origin/main` at mint
  time fixes that, at the cost of the gate depending on a fetched ref that can
  be stale - a stale ref makes the check MISS a collision, never invent one, so
  it fails safe in the direction that matters. I recommend including it.

  The narrower alternative is local-only: simpler, no ref dependency, and still
  catches a collision within one session - but it would not have caught either
  of the two real ones, which is most of the value.

invariants:
  - "The gate is read-only over the backlog: it reports and refuses, never renames, moves, or rewrites a ticket."
  - "Every corpus the check consults is either fully read or the check fails - an unreadable or partially-read source is never treated as containing no ids."

description: |
  ## What is wrong

  A ticket id is picked by hand from whatever the miner can see, and nothing
  anywhere checks that it is unused. Two sessions minting at the same time will
  eventually pick the same number, and they did: BL-1087/BL-1090 on 2026-08-22
  and BL-1100 on 2026-08-23, each costing a manual reconcile.

  Git does not catch it. A ticket's filename carries its slug, so two DIFFERENT
  tickets under one id land as two differently-named files and merge with no
  conflict at all - which is exactly what happened to both BL-1100 YAMLs. The
  collisions surfaced only because the topic-record automation had written a
  `backlog/topics/BL-1100.json` on both sides, and THOSE collided add/add. That
  is an incidental detector: it fires only when the bot happened to run on both
  sides, and it points at a bookkeeping file rather than at the tickets.

  The repair is cheap but not free, and it is never mechanical: the id has to go
  to whichever side carries a recorded human decision, or an approval a human
  gave is silently reattached to a ticket they never read.

  ## How (direction, not mandate)

  Refuse at mint, in the gate the specifier already runs per ticket
  (`swarmforge/scripts/specifier_backlog_hygiene_gate.sh`, whose logic lives in
  the pure `backlog_hygiene_lib.bb` with its own test and property runners).
  The existing epic/milestone violations are per-file; a duplicate-id check
  needs the whole corpus, so it is a second, corpus-level check rather than an
  extension of `violations-for-file` - how the two compose is the designer's
  call.

  Two corpora, both consulted: the local `backlog/**` tree, and what a parallel
  session has already published (`origin/main`). Keep the published-corpus read
  behind a seam so the decision stays a pure function over a set of ids and the
  git read is one thin, separately-verified piece - the same thin-wrapper shape
  the engineering article already requires of a CLI `main()`.

  ## Out of scope

  Allocating ids automatically, reserving them, or changing the id format. Two
  sessions that cannot see each other's uncommitted work cannot be made to agree
  on a next number by a checker; this ticket makes the clash LOUD and immediate
  instead of silent until a merge. Also out of scope: repairing an existing
  collision (that is a specifier judgement about which side holds a human
  decision) and anything about `backlog/topics/*.json`, which the concierge owns.

qa_e2e_procedure: >
  1. Pick an id already used by a ticket in `backlog/done/`. Write a throwaway
     YAML claiming it, run `swarmforge/scripts/specifier_backlog_hygiene_gate.sh`
     on that file, and confirm it exits non-zero, says the id is a duplicate, and
     names both files. Delete the throwaway.
  2. Give the throwaway a genuinely unused id and confirm the gate passes - and
     that a second file in the same run with no `epic:` is still reported, so the
     new check has not displaced the old ones.
  3. Reproduce the published-corpus case: on a scratch branch, commit a ticket
     with an unused id, push it to a scratch remote ref the gate reads as
     origin/main, then in a clean checkout that does not have that commit, mint
     the same id and confirm the gate refuses it.
  4. Point the published-corpus seam at something unreadable and confirm the gate
     FAILS rather than passing - a silent pass here is the whole defect repeating
     one layer down (invariant 2).
  5. Confirm the backlog is untouched by every run above: `git status` shows no
     rename, move, or rewrite the gate performed (invariant 1).

notes: |
  Reached from the second collision rather than from an operator intake. The
  coordinator's merge `51c7547e1` hit the BL-1100 add/add on the topic record,
  correctly refused to guess which ticket owned the id, and flagged it in its own
  commit message for the specifier. Resolved that instance by renumbering the
  side with no recorded human decision (BL-1100 -> BL-1104, commit on main
  2026-08-23); this ticket is the class the instance belongs to.

  Provenance of the tie-break the repair used, since it is the only part that
  cannot be automated and should not be lost: the id stays with the side
  carrying a recorded human decision - an approval reply, a live topic thread -
  because renumbering that side invalidates something a human actually did. The
  other side renumbers. Same rule was used for BL-1087/BL-1090 the day before.

  No `required_wiring:` on purpose. The rule arms it when a ticket's value
  depends on a call site that does not exist yet (the BL-419 shape); here the
  call site is `specifier_backlog_hygiene_gate.sh`, which the specifier prompt
  already requires be run on every minted ticket. Scenario 04 exercises the gate
  command itself, which proves the wiring far better than a substring anchor -
  and an anchor on the already-loaded `backlog_hygiene_lib.bb` would pass before
  any work was done (BL-874's vacuous-anchor trap).

  IR-DRY disposition (checker run 2026-08-23): the first pass reported 8
  findings, one of them a genuine score-1.0 duplicate - a standalone
  "refused at mint" scenario whose Given was the pool outline's `paused` row.
  Folded the standalone into the outline and moved its distinctive assertion
  (the output names BOTH files) onto the outline, where it holds for every row.
  Five findings remain, all reviewed and KEPT: four separate the LOCAL corpus
  from the PUBLISHED one, which are two different sources and the entire point
  of scenario 03; the fifth separates a fixture named by slug from one named by
  id, which is what scenario 01 exists to distinguish. 15 unique steps of 15.

  Severity is argued in the comment beside the field rather than left implicit,
  because this is exactly the judgement the expedite lane keys on and a silent
  `medium` reads as an untriaged guess.
