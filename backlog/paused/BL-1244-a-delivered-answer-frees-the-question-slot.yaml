notes: |
  - [2026-08-28] specifier: `depends_on: [BL-1201]` is a SEQUENCING dependency,
    not a bundle. BL-1201 is active and is rewriting the exact two functions
    this ticket changes (`captureRoleAnswer`, `deliverRoleAnswer`); promoting
    both at once is the concurrent-work-orthogonality collision the
    coordinator is meant to avoid. Nothing here should be built into BL-1201's
    parcel.
  - [2026-08-28] specifier: GH-26 (done) is the nearest neighbour and does NOT
    cover this. It fixes the marker left behind when deliverRoleQuestion drops
    an UNDELIVERABLE question - bot running, topic id missing. Here the
    question was delivered AND answered AND the answer reached the role. Same
    wedge, third distinct cause.
  - [2026-08-28] specifier: the consume step is now written into
    swarmforge/roles/specifier.prompt so the next role to hit this has a move
    before the fix ships (BL-798 - that prose is mine and landed with this
    mint). It is a stopgap, not the fix: five other role prompts say nothing,
    and a mechanism that works only while six prompts all remember it is not a
    mechanism.
