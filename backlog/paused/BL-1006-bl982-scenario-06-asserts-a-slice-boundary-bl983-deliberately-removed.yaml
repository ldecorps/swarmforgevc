id: BL-1006
title: "BL-982's scenario 06 asserts 'the second seat is inert until the mailbox slice lands' - the mailbox slice (BL-983) landed on 2026-08-20 and deliberately made the second seat a real claimant, so the scenario is now a green-when-broken assertion that is RED on main precisely because the system works"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
priority: 12
direction: swarm-reported
depends_on: [BL-1002]
mutation_cost: low
required_stages: [coder, architect, qa]
stage_skip_reasons: {
  cleaner: "the change is a deletion - one scenario and its two feature-scoped step handlers come out, and one narrative paragraph is re-tensed. No code is added, so there is nothing to DRY.",
  hardender: "the verification is the two existing feature files going green together (BL-982 6/6, BL-983 5/5), both of which already exist and already run in the acceptance lane. A deletion adds no code to mutate; a mutation pass here would score an empty diff.",
  documenter: "grepped and verified 2026-08-21: the only live present-tense prose asserting the second seat is inert is INSIDE BL-982's own feature-file narrative, which this parcel re-tenses as part of the acceptance artifact. `docs/reference/Specification.MD:230,258,282` also say 'inert', but 230 and 282 are DATED changelog entries recording what BL-982 and BL-983 each did (230 already records that BL-983 ends the inertness) and 258 is about BATCH-mode stages, which BL-983 explicitly left single-claimant. All three are correct as written - do not touch them."
