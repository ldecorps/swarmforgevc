acceptance: specs/features/BL-982-second-seat-of-a-stage-boots-with-its-own-model.feature

invariants:
  - "The retirement deletes an obsolete claim, never a live check: every behaviour scenario 06 asserted is still asserted by a scenario that passes. Verified against BL-983's feature file, not asserted."
  - "A step handler is deleted only when no scenario in any feature file still reaches it, and handler scoping is read from the registration call rather than inferred from the pattern text."

description: |
  ## What is wrong

  `specs/features/BL-982-second-seat-of-a-stage-boots-with-its-own-model.feature`
  scenario 06 reads:

      # BL-982 second-seat-boots-with-its-own-model-06
      Scenario: the second seat is inert until the mailbox slice lands
        Given the pack declares two seats for one stage, each with its own worktree
        When a parcel addressed to that stage is delivered
        Then the second seat is not delivered the parcel
        And the second seat claims nothing

  That scenario does not describe a durable behaviour. It describes where
  BL-982's slice STOPPED - a boundary marker, true only for as long as the
  next slice had not shipped. The next slice shipped. BL-983 ("a parcel
  addressed to a stage is claimed by exactly one of its seats") landed on
  2026-08-20 and its whole purpose was to make the second seat a real
  claimant.

  So the scenario is now red BECAUSE the system works. It is the
  green-when-broken shape inverted: it goes red exactly when the feature it
  was waiting for arrives, and it would go green again only if BL-983 were
  reverted.

  ## What is NOT wrong

  **The system.** Stating this plainly because "an acceptance scenario is
  red" reads as "the code regressed", and that reading is false here. The
  failing step is `And the second seat claims nothing`, and the observed
  behaviour is a `to: coder` parcel being claimed by seat `coder@fable` -
  which is BL-983 scenario 01 working exactly as specified. Do not
  "fix" the claim path.

  Note the shape of the failure: the preceding step, `the second seat is not
  delivered the parcel`, still PASSES - the second seat's own mailbox tree is
  genuinely empty, because BL-983 kept the stage as the address and made the
  seat the claimant, never the addressee. Only the final claim assertion is
  obsolete. An implementer who reads the failure as "delivery leaked to the
  second seat" has misread it.

  ## The fix

  **Retire scenario 06.** Not reword it, not invert it - retire it. Its
  successor coverage already exists and is green:

  - BL-983 scenario 01, "a parcel addressed to a stage reaches exactly one of
    its seats", asserts the positive behaviour.
  - BL-983 scenario 05, "a parcel already claimed by one seat is never handed
    to another", asserts the exclusivity half.

  Rewriting BL-982 sc06 into a third statement of that would duplicate
  BL-983's contract inside BL-982's file. The specifier prompt's
  Consolidation Authority is explicit for this case: retire superseded
  scenarios, never reword them.

  Concretely, three things come out or change:

  1. Scenario 06 and its preceding `# BL-982 ...-06` comment, from the
     feature file.
  2. The two now-unreachable feature-scoped handlers in
     `specs/pipeline/steps/bl982SecondSeatSteps.js`:
     `/^the second seat is not delivered the parcel$/` and
     `/^the second seat claims nothing$/`, plus whatever setup in the
     `a parcel addressed to that stage is delivered` handler and the
     module's constants exists only to serve them.
  3. The feature narrative at line 16, which asserts the same falsehood in
     prose: "This slice stops at identity. The second seat boots and is inert
     - nothing is delivered to it and it claims nothing - until the mailbox
     slice lands." Re-tense it to record what the slice did without claiming
     a present that is no longer true - e.g. that this slice stopped at
     identity and BL-983 later made the seat a real claimant. A feature file
     is a durable contract; leaving a false present-tense sentence in it just
     moves the lie out of the executable part.

  ## The trap in step 2

  `a parcel addressed to that stage is delivered` appears in BOTH BL-982's
  and BL-983's feature files, so a grep across `specs/features/` will suggest
  the handler is shared and must be kept. It is not shared: both step files
  register through `registry.defineScoped(re, fn, FEATURE)`, so
  `bl982SecondSeatSteps.js` and `bl983StageQueueSteps.js` each own a separate
  handler for that identical pattern. Deleting BL-982's copy does not touch
  BL-983. This is what invariant 2 is about - read the registration call, not
  the pattern text.

  ## Sequencing

  `depends_on: [BL-1002]`, which is not a content dependency - it is file
  overlap. BL-1002 is active and rewrites two `mkdtempSync(path.join(
  os.tmpdir(), ...))` roots in this same `bl982SecondSeatSteps.js`. Landing
  both concurrently is precisely the non-orthogonal pair the coordinator is
  told to avoid. BL-1002 does not wait on this ticket in return: its
  `qa_e2e_procedure` was amended on 2026-08-21 to PARK scenario 06 as a
  known pre-existing red owned by this ticket, so there is no deadlock.

  After BL-1002 lands, the `os.tmpdir()` roots in this file will already be
  gone. Do not re-introduce one in any code you touch here.

source: |
  Coder note 2026-08-21T01:33:57Z (priority 00, to specifier):
  "BL-1002 blocked: BL-982 sc06 'seat inert' red since BL-983 landed - spec
  gap". The coder was correct to route it here rather than absorb it: the
  defect is in the acceptance contract, which is the specifier's domain
  (Article 4.3 - a failed gate routes to the role that OWNS the fix).

  Specifier-probed and CONFIRMED the same day rather than relayed:

  - `node specs/pipeline/cli.js specs/features/BL-982-second-seat-of-a-stage-boots-with-its-own-model.feature`
    on `main` is 6 passed / 1 failed. The failure is scenario 06 at step
    "And the second seat claims nothing", and the captured output shows the
    parcel `50_..._from_specifier_to_coder_for_coder.handoff` sitting in
    `coder-fable/.swarmforge/handoffs/inbox/in_process/` - i.e. claimed by
    the second seat.
  - `node specs/pipeline/cli.js specs/features/BL-983-stage-mailbox-delivers-to-one-idle-seat.feature`
    on `main` is 5 passed / 0 failed, so the successor coverage that makes
    the retirement safe is not merely present but green.
  - The step handlers are at `specs/pipeline/steps/bl982SecondSeatSteps.js:270`
    and `:277`, under the comment "scenario 06: the second seat is inert".
  - `defineScoped(re, fn, FEATURE)` in both step files confirms the shared
    pattern is not a shared handler.

notes: |
  **`human_approval` is deliberately omitted, not forgotten.** Per
  backlog-schema.md, absent means "not applicable (no approval needed)" and
  the promotion gate passes it, whereas a literal `pending` fails CLOSED. The
  retire-vs-reword question that might have needed a human is already
  answered by standing guidance (Consolidation Authority: retire superseded
  scenarios) plus the verified fact that BL-983's file covers the successor
  behaviour green. There is no design decision left, and `main`'s acceptance
  lane is red while this waits.

  **Why this recurred, and the durable half that is NOT in this ticket.**
  BL-982 stated its own slice boundary honestly in prose AND froze it into an
  executable assertion, and BL-983 - the very ticket named in that assertion
  - landed through the full chain without anyone retiring it. That is a
  process gap, not a code gap: when slice A declares "X is inert until slice
  B lands", the ticket for B owes the retirement of A's boundary assertion.
  The specifier prompt has been amended to say so, and the amendment commit
  is recorded here once landed. It is prose in a file the specifier owns, so
  per BL-798 it was landed directly rather than scheduled as a stage of this
  ticket - no `required_stages` value can schedule the specifier.

  **Same class as BL-1005, and worth reading together.** BL-1005 is "BL-643's
  gate froze a build-state literal and went red when the slices shipped".
  This is the same failure at a different altitude: an acceptance artifact
  pinning a moment in the build's history rather than a property of the
  system. Two instances in two days is the argument that the class is real.
  Both are filed under `code-quality-gates` so they stay findable together.

  **Do not widen scope to a linter.** The tempting generalisation is a gate
  that greps feature files for boundary language ("until ... lands", "is
  inert", "not yet built"). Resist it here: that is a hand list of spellings,
  which is exactly the anti-pattern BL-948's invariant 1 exists to prevent. A
  real gate would have to derive the claim from the backlog's own done set,
  which is BL-1005's territory and a much larger slice than this one. If it
  is worth building, it is worth its own ticket.

qa_e2e_procedure: >
  From the repo root.

  1. Reproduce at the parent commit. Run `node specs/pipeline/cli.js
     specs/features/BL-982-second-seat-of-a-stage-boots-with-its-own-model.feature`
     and confirm 6 passed / 1 failed, the failure being scenario 06 at step
     "And the second seat claims nothing". Note this takes roughly 45s.

  2. At the parcel commit, run the same command and confirm 6 of 6 pass with
     scenario 06 absent from the output - not passing, ABSENT. A scenario 06
     that now passes means it was reworded rather than retired, which is a
     defect in this parcel.

  3. Confirm the successor coverage still holds: run `node
     specs/pipeline/cli.js
     specs/features/BL-983-stage-mailbox-delivers-to-one-idle-seat.feature`
     and confirm 5 of 5 pass. This takes roughly two minutes. This is the
     check that the retirement lost no coverage (invariant 1) - a green
     BL-982 with a broken BL-983 would mean the parcel deleted the behaviour
     instead of the claim about it.

  4. Confirm no live handler was deleted (invariant 2): grep
     `specs/pipeline/steps/bl983StageQueueSteps.js` for
     `a parcel addressed to that stage is delivered` and confirm BL-983's own
     scoped registration is still present and untouched.

  5. Confirm the prose is honest: read the `Feature:` narrative in BL-982's
     feature file and confirm no sentence still asserts in the present tense
     that the second seat is inert or claims nothing.

  6. Confirm `docs/reference/Specification.MD` was NOT edited - lines 230,
     258 and 282 mention "inert" correctly and are out of scope per this
     ticket's documenter skip reason. A diff touching that file is
     out-of-scope work under BL-506 and should be bounced.

  7. Confirm the full unit lane from `extension/` is green and that no
     `os.tmpdir()` root has been re-introduced into
     `specs/pipeline/steps/bl982SecondSeatSteps.js` (BL-1002's fix landed
     first; regressing it here would re-red BL-948's standing guard). Run
     `npx vitest run test/socketFixtureShortRootGuard.test.js` from
     `extension/` and confirm 16 of 16 pass.
