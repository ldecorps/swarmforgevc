description: |
  ## What is wrong

  `extension/src/quality/qaGather.ts` `runChecklist` builds each row's
  `excerpt` as `tailExcerpt(stdout + stderr)`, the last 4000 characters.
  stderr comes last, so a run that ends with allowlisted noise (BL-871's
  `onTaskUpdate` timeouts) pushes out everything the lane printed to stdout:
  a red run's assertion messages and a green run's own verdict lines
  (`recordTestDuration.js` prints `formatSuiteBudgetVerdict` and
  `formatSuiteWorkVerdict`; `recordPropertyDuration.js` prints
  `formatPropertyDurationVerdict`). BL-1769 fixed only `register_join`,
  which now reads the whole output.

  ## What is wanted

  - The unit and property rows carry each failing test's file and message
    as the lane's own JSON report recorded them (`extension/.vitest-report.json`,
    `extension/.property-vitest-report.json`, written by the two recorder
    scripts in the gathered worktree).
  - The same rows carry the lane's verdict lines, read from the run's whole
    stdout, never from the excerpt.
  - A red row whose report is missing or unreadable says so in the row.
  - The excerpt, its length and every other row are unchanged.

  ## How (direction, not mandate)

  - `runChecklist`'s `onRawOutcome` seam already hands the caller the
    unbounded outcome (BL-1554 D1); BL-1769's whole-output join is the
    precedent for reading it.
  - Read the reports after each lane's run, from the cwd the check ran in.
    Keep the reader pure over the report text, so the step handler drives
    it with a fixture report and a fake runFn, never a real vitest run.

