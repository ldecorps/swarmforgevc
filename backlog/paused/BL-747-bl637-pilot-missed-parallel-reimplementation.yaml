description: |
  ## What

  BL-637 is now the third seat (coder, cleaner, hardener) to independently
  find its own real, distinct shortfall. This one is a specific test-design
  anti-pattern this project's own BL-637 acceptance steps file explicitly
  disclaims in its own header comment ("Drives the REAL shell suite — never
  a parallel reimplementation") — yet the shell suite's OWN newly-added
  scenarios do exactly that against a DIFFERENT script (`stop-swarm.sh`)
  than the one the acceptance steps file was guarding.

  ## Question to answer

  Should a pilot (or a live hardener pass) grep a newly-added shell test for
  the specific anti-pattern of `source`-ing a helper and re-deriving branch
  logic inline, instead of invoking the actual entry-point script under
  test? Given this project already names the anti-pattern explicitly in one
  place (the JS acceptance-steps convention), harden `/pilot` to check for
  it in shell tests too — e.g. a mechanical check that any script named in
  a ticket's own description as "the thing this verifies" is actually
  invoked (not just `source`d for one helper function) somewhere in that
  ticket's test file.
