notes: |
  ## Scope widened 2026-08-07 (specifier, BL-680 consolidation authority)

  This tracker was minted for barge-in alone. Two things had already stretched it
  past that before today: BL-826, the hands-free echo-loop defect, is a session
  LIFECYCLE fault rather than a barge-in one, and it has sat here since it was
  minted. And draining
  `backlog/INTAKE-bubble-hey-bubble-offline-wake-and-session-listen.md` produced
  BL-844 (the wake-to-quiet session state machine) and BL-845 (the offline wake
  spotter), which are the loop barge-in interrupts.

  Rather than mint a fourth Bubble epic beside `bubble-thin-shell`,
  `bubble-screens` and `bubble-control` and split one conversation loop across
  two trackers, the epic is renamed to what it actually tracks: the hands-free
  voice loop, of which barge-in is one transition. `epic: bubble-voice-barge-in`
  is unchanged as the id — renaming a live epic id would orphan every child that
  already carries it, for no gain.

  ## Why the epic depends on BL-769

  Every slice is Android — `TalkEngine.kt`, `ReplyAudioPlayer.kt`,
  `HoldMusicPlayer.kt`. Until BL-769's JVM unit seam lands, an Android ticket's
  acceptance contract runs zero scenarios; five tickets have already shipped
  that way. For this epic that is worse than usual: the defects it must prevent
  are races, which are exactly what a manual procedure is worst at catching.
  Children must not be promoted before BL-769.

  **BL-769 has since landed** (`backlog/done/M8/`, 2026-08-06) and the gradle
  JVM seam runs, so this gate is satisfied — recorded here so nobody re-holds a
  child on it. BL-826 was already promoted under it.
