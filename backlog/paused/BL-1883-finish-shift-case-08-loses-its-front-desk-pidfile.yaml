source: |
  Coder note 002319 (2026-10-02 08:54Z), verbatim: "unowned-red
  test_finish_shift_lib.sh case 08 (front-desk CLEAN) red on main".

  Specifier, the same pass: `bash swarmforge/scripts/test/test_finish_shift_lib.sh`
  failed case 08 twice ("FAIL: 08: expected front-desk flagged as
  unexpectedly stopped, got: CLEAN") and then passed 18 of 18 on the next
  run. Instrumented failing run: at the snapshot,
  `<root>/.swarmforge/operator/front-desk-supervisor.pid` did not exist
  ("No such file or directory") while `kill -0 $FD_PID` answered alive, so
  `finish_shift_keep_snapshot` recorded nothing and `finish_shift_verify`
  had nothing to miss. The passing instrumented run listed the pidfile
  present before and after start_fixture.

description: |
  ## What is wrong

  Case 08 calls `start_fixture`, which writes
  `front-desk-supervisor.pid` into `$OP_DIR` of the root that cases 04-08
  share, then snapshots the keep set (front-desk, tunnels). In the failing
  runs the pidfile was already gone. Nothing in the test, in
  `finish_shift_lib.sh`, in `lifecycle_matrix.sh` (the keep set is
  front-desk and tunnels, the stop set babysitterd, onboarder and
  operator-runtime) or in `stop_ancillary_services.sh` removes that file
  on this path, and `tmp_cleanup.sh`'s sweep only removes roots it can
  attribute to a dead owner by name, which a `mktemp -d` root never is.
  So something outside this run removed it.

  ## What is wanted

  - Find the remover and say in the evidence what it was. Candidates the
    specifier did not rule out: a concurrent run of this test or of a
    sibling that resolves its root from the environment rather than its
    own fixture; a live script that deletes a front-desk pidfile
    (`stop_bridge_headless.sh`, `recover_miniapp_bridge.sh`,
    `launch_front_desk.sh`, `swarm_ensure.bb`) pointed at a fixture root;
    an orphan janitor.
  - Fix it where it lives. If it is the test's shared root, give case 08
    its own fresh root (case 07 already does). If it is production code
    reaching a root it should not, fix that, and add the stages that code
    needs.
  - Keep the register row until the land retires it (BL-1631).

  ## Scope

  `swarmforge/scripts/test/test_finish_shift_lib.sh`, and whatever the
  evidence shows removes the pidfile.

qa_e2e_procedure: |
