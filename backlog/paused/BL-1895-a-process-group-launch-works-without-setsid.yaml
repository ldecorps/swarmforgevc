id: BL-1895
title: "lander_lib.bb (BL-1872) and bounded_run_lib.bb launch through setsid, which stock macOS does not ship: on a macOS host the lander never starts a land and every bounded run (the babysitter's checks among them) fails before it begins; both now start their child as a process-group leader through setsid when present and perl's setpgrp otherwise"
milestone: M8
type: defect
severity: medium
