id: BL-1831
title: "check_bounce_revert_scope.sh attributes a single-commit Revert to whichever ticket was bounced most recently anywhere (it has no merge second parent to walk), so it refuses the very revert BL-1576's merge-drop guard prescribes (the documenter's BL-1815 revert was judged as BL-1820 on 2026-09-30) - a single-commit revert is judged against the ticket its reverted commit names, and a ticket with no bounce record is not a bounce revert"
