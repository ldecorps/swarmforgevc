id: BL-1405
title: "A hand-built tip-pure land records its land approval: the BL-1376 route publishes QA's replay to main without the BL-1334 replay-to-source record the land step writes, so every hand-built land reads as unapproved to the one shared predicate and raises a standing Article 4.2 CRIT - six of them on 2026-09-04"
