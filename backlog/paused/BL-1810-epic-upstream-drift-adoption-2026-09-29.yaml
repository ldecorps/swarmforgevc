  Vocabulary (human ruling during this mint, "refer to baton epic"): this
  epic and its children use the Baton orchestra lexicon (BL-242,
  docs/branding/icon-system.md): a player is an agent, a section is a
  role, a conductor is a coordinator, an ensemble is a pack, a swarm is a
  conductor with an ensemble, an orchestra is a fleet, and the podium is
  the console layer that talks to conductors. Upstream's army terms
  (lieutenant, platoon, squad) appear only as quoted upstream branch or
  file names, for traceability.

  Firm constraints from the intake: no upstream-watch.json SHA is
  advanced by any child (advancing the watch baseline is a separate human
  commit after the disposition lands); nothing here installs or runs
  upstream's podium agent or ensemble experiments against the live swarm;
  this fork shares no git ancestor with upstream, so every adoption is a
  manual reimplementation.
