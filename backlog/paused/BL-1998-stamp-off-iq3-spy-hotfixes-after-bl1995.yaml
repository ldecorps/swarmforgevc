source: |
  The human, specifier pane, 2026-10-05, verbatim (Article 5.3):

  > We have to fix iq3. Spy on it every 10 minutes. If its gone wrong, hotfix it, and respawn. Repeat until iq3 is functioning normally.

  The fault (iq3 session fd2a4c47, 13:41-13:43Z, BL-1994): after its
  tests passed, the coder took BL-1994's QA step "Read the iq3 coder pane
  or session: no Unknown recipient role 'qa'" as its own, grepped the shim
  log, listed every mailbox directory under .swarmforge/handoffs, and ran
  one identical ls five times; qwen's loop dialog halted the turn ("A
  potential loop was detected ... The request has been halted.").

description: |
  ## Status: hotfix 66377274b7 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it. Later
  hotfixes from the same spy loop fold in below while this is paused.

  ## What the hotfix changed

  - `swarmforge/roles/local-model/loop.note`: a coder's evidence is what it
    runs in its own worktree (tests, the diff, the ticket's files); it never
    searches logs, panes or other roles' mailboxes, and a qa_e2e_procedure
    step that reads those is QA's, skipped and said so.
  - Applied live: the card was recomposed and the seat respawned at
    13:48:21Z; its first call read the card.

  ## What the coder checks

  The line against the fault above; the card checks in qa_e2e_procedure.
  Evidence: backlog/evidence/BL-1998-coder-<date>.md.

