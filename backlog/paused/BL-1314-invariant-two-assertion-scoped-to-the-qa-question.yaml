notes: >
  Promotion ordering, not a bundling: depends_on names BL-1303 because
  BL-1303 is in flight and its coder pass touches this same test file (the
  fixture repair). Promoting both at once would put two parcels in the same
  file. BL-1314 is independently implementable and gateable once BL-1303 has
  landed; it needs nothing built inside BL-1303 beyond the fixture repair
  that makes the test runnable end to end.

  IR-DRY, resolved not ignored: the checker reports two medium findings on
  this feature file, both pairing a step written with a "<file>" placeholder
  in an outline against the same step written with the literal handoffd.bb in
  a plain scenario. Both normalize to one handler pattern with a quoted
  capture, so there is no duplication in the step registry - the checker
  compares raw text and cannot see that. Do not "fix" it by making scenarios
  03 and 04 artificial outlines.

  The coder also flagged, in the same evidence file, that BL-1303 has no
  merge-path acceptance scenario. Ruled no-change on 2026-08-31 and recorded
  in the ruling evidence file: the merge path is covered executably by
  test_pre_merge_commit_hook.sh cases 01/03/09 and by BL-632 acceptance
  feature, which drives a real `git merge --no-ff` through the real hook.
  Adding a scenario to an in-flight ticket would require its handler in the
  same parcel (BL-233) and would strand a parcel already past the coder
  (BL-971 shape). BL-1303 needs no amendment and its holder needs no note.
