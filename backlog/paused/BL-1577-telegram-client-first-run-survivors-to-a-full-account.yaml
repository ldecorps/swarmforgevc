notes: |
  Minted 2026-09-15 by the specifier while completing the hardender's
  unowned-survivors note, the same pass. INVEST: Independent (BL-1509 is
  not a dependency; the re-measure is this ticket's own first step),
  Negotiable (test shapes are direction), Valuable (the client's mutation
  gate goes from a first run with 126 unaccounted mutants to a full
  account), Estimable (19 no-coverage mutants in three small regions,
  one sitting; the 107 are a recorded disposition, not work, under the
  recommended option), Small (three scenarios, one invariant), Testable
  (the parcel's own evidence). The census pin (at least 640 mutants) is
  BL-1445's discipline.

  Why a ruling and not a plain tap: the human already answered exactly
  this budget question for the three large files on BL-1519 (recommended
  option tapped) and again by analogy on BL-1523; asking a third time
  for a 1174-line file would be churn, but silently deciding it would be
  the BL-1300 shape. The recommended option applies that ruling by
  analogy and says so; the other option is one line to tap.

  Same pass, the specifier amended swarmforge/roles/hardender.prompt: an
  unowned-survivors note's evidence lists every mutant it hands over (or
  commits the JSON report), because a bare count cannot be censused and
  forced this re-run.
