id: BL-981
title: "EPIC — Multi-seat stages: run N seats of one pipeline stage inside one swarm, each with its own model, work routed by ticket difficulty; do not promote directly; tracks children"
milestone: M8
status: todo
type: epic
epic: multi-seat-stages
priority: 26
depends_on: []
decomposes_into: [BL-982, BL-983, BL-1001, BL-1004, BL-1040, BL-1316]

remaining_slices:
  - "Difficulty-aware routing among seats of a stage: map a ticket difficulty
     signal (prefer reusing mutation_cost low/medium/high) to a model tier, prefer
     the more capable seat (motivating instance: more capable coder) for hard
     tickets and the cheaper seat for easy ones when idle, and define the
     busy-preferred-tier fallback. MINTED 2026-08-20 as BL-1001, after the
     operator ruled on the seat/tier mapping (coder1 = the `coder` seat, Fable,
     takes hard work) and the specifier answered wait-vs-spill asymmetrically
     (hard waits and never spills down; easy may spill up)."
  - "Supervisor / chase / ensure / stage-dwell treat seats as instances of a
     stage: dwell still names the STAGE as the bottleneck, while ops surfaces may
     show seat-level detail including each seat's model. The BOARD and STAGE-MAP
     half of this slice was MINTED 2026-08-22 as BL-1040, from a rescued
     uncommitted fix found in the coder worktree: BL-983 enforced its own
     invariant 3 only on the FORWARD path, so a ticket a non-bare seat holds
     reached the board keyed `coder@sonnet2`, matched no bare role name, and
     painted as not-started. Supervisor, chase, ensure and stage-dwell are NOT
     in BL-1040 and this slice stays open for them."
  - "Who may CLAIM a rework, as distinct from who gets fresh work. BL-983's one
     stage queue is a pure race, and seats hold separate worktrees, so a bounce
     can be claimed by a seat with none of the parcel's history - measured live
     on BL-994 (build 782b343a4 on coder@sonnet2; fix 080b30253 on coder does
     NOT have it as an ancestor). MINTED 2026-08-20 as BL-1004, severity high.
     Orthogonal to BL-1001 and does not wait for it."
  - "Operator docs + Swarm Optimizer wording: make the existing 'add/remove a role
     instance' recommendation map to a documented operator step, and let it name
     WHICH model tier to add when the constraint is capacity at a difficulty band."

source: |
  Operator intake .swarmforge/operator/INTAKE-duplicate-bottleneck-seat.md
  (human via Cursor 2026-08-20 ~11:21 BST) plus its Addendum (~11:35 BST),
  archived to .swarmforge/operator/archive/ in the same pass.

  Human's words, verbatim (in-chat via the specifier pane, 2026-08-20):

    "Addendum to duplicating a seat: it needs to have its own model choice.
    For instance, we could have a Sonnet coder and a Fable coder. Load
    balancing wisely according to the difficulty of the ticket"

    "my addedum was for an incoming intake about duplicating bollteneck seats"

  The intake's own framing, preserved: the capability must be GENERIC for any
  bottleneck stage - "do not hard-code coder" - with a second coder as the first
  exercised instance. And: "Per-seat model + wise difficulty routing is part of
  the same epic, not a follow-up nice-to-have."

notes: |
  UMBRELLA / tracking item (type: epic), NOT directly promotable - the coordinator
  promotes CHILD slices, never this. Children carry `epic: multi-seat-stages`.

  SPECIFIER PROBE AT MINT - corrects the intake's own slicing suggestion.
  The intake proposes "identity/roster -> per-seat model/launch profile" as two
  separate steps. Measured against swarmforge/scripts/swarmforge.sh 2026-08-20,
  per-seat model is NOT separate work and needs no new machinery: each `window`
  line already carries its own `--model`/`--effort`/`--remote-control` through
  `extra_args` -> `extra_cli` (parse loop at :505-525; the live conf's seven
  window lines each declare their own model at :291-297). The moment a pack can
  declare two window lines for the same stage, "Sonnet coder + Fable coder" falls
  out for free. So the two collapse into ONE slice (BL-982) and the epic is
  shorter than the intake assumed.

  What actually blocks it is identity keying, all on the role NAME:
  - `ROLE_INDEX` duplicate guard, swarmforge.sh:550-553 ("Duplicate role '$role'")
  - `WORKTREE_INDEX` duplicate-worktree guard, :555-558
  - prompt-file lookup `$ROLES_DIR/$role.prompt`, :575 - must resolve by STAGE
  - role names may not contain underscores (:534) - constrains seat-id syntax
  - session `swarmforge-<role>`, launch `.swarmforge/launch/<role>.sh`,
    remote-control name, worktree/branch family - all must key on SEAT

  Vocabulary this epic locks, used by every child:
  - STAGE - the pipeline hop (`coder`, `cleaner`, ...). What parcels address,
    what metrics and stage-dwell key on, what prompt files are named for.
  - SEAT - a runnable instance of a stage. Owns a session, worktree/branch
    family, launch script, mailbox, claim, and its OWN model/effort profile.
    Seats of one stage are NOT clones of each other.
  - MORE CAPABLE CODER (motivating instance of a more-capable seat) - the
    stronger-model seat of the coder stage, meant for harder tickets; sits
    beside a cheaper/faster peer (e.g. Sonnet beside Fable). Named so children
    keep the product shape visible. BL-982 provisions it; BL-983 makes it an
    idle claimant; difficulty-aware routing (remaining slice) steers hard work
    to it. Generic for any stage: "more-capable seat" is the stage-agnostic
    form - never hard-code coder in implementation.

  Deliberately NOT this epic (from the intake's non-goals, preserved):
  - Not a substitute for BL-090/091 secondary swarm - that is fleet scale, a
    full pipeline clone. This is intra-swarm stage fan-out. Both stay valid.
  - Not mono-router home-role cloning; multi-seat is a standing-pack problem
    first, and mono-router interaction is deferred explicitly.
  - Not auto-spawn on a bottleneck reading. The optimizer already recommends;
    capacity stays a human decision until a later slice deliberately automates it.
  - Not "rename a window to coder2 and hope" - a process outside the stage
    vocabulary is not on the pipeline. BL-931 (done) is the cautionary tale: an
    accidental second coder via rotation on a standing pack.

  HUMAN DECISIONS still to lock (the intake lists five; 1, 3, 4 and 5 have a
  stated human preference and are applied as written, 2 is genuinely open):
  1. v1 trigger: human edits the pack / runs an explicit add-seat command - no
     auto-scale from stage-dwell yet. APPLIED as the intake's recommended default.
  2. Routing policy among seats when the preferred-tier seat is busy and another
     tier's seat is idle: WAIT vs SPILL. OPEN - blocks the routing slice only.
  3. Difficulty signal: reuse `mutation_cost` unless INVEST forces otherwise.
     APPLIED as stated preference; the routing slice locks the mapping table.
  4. Eligible stages in v1: generic, with coder the first exercised instance.
     APPLIED - no child may hard-code a stage name.
  5. Relationship to secondary swarm: both remain valid levers; docs must
     distinguish cost/shape. APPLIED - carried by the docs slice.

  Related, do not duplicate blindly: BL-090/BL-091 (done, multi-swarm
  foundations); BL-542/BL-545 (ModelFactory / Swarm Intelligence Layer - they
  decide WHICH model a role should use; this epic decides that a stage can have
  more than one seat to put a model on, so they meet at the routing slice and
  must not both own the mapping); BL-909 / stage-dwell (bottleneck naming,
  observe-only); coordinator.prompt Swarm Optimizer (already recommends "add a
  role instance" with no substrate behind it - this epic supplies the substrate).
mutation_cost: low
