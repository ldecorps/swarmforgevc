  > main loop past 120s (timeout / skip-when-key-missing before the
  > expensive work / heartbeat during the walk). Do not "fix" this by
  > raising the threshold alone — BL-789 already documented Mac cycles near
  > 120s for a different reason; this stall is a real wait, not a
  > slow-but-healthy tick.

  And on its severity, verbatim:

  > This is **not** currently a swarm-down emergency: cool-off/restart keeps
