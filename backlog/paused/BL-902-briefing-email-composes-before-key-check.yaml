approval_context: >
  One call worth your sign-off: severity `high` rather than `critical`.

  The intake is explicit that this is "not currently a swarm-down emergency"
  — cool-off/restart keeps it self-healing — which rules out `critical`. It
  is above `medium` because the cost is paid on EVERY cycle and is
  unbounded in time: 255 handoffd freshness incidents were recorded today
  alone, each one killing and restarting the daemon mid-cycle, and every
  restart costs handoff latency and push freshness. Downgrade to `medium`
  if you would rather it not take the Article 3.2.4 expedite lane.

  Nothing else here needs a decision — the cause is confirmed against the
  live log (below), not inferred, and the direction is the one you already
  gave in the intake.

