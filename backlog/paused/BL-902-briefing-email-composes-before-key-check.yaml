  `.swarmforge/operator/INTAKE-handoffd-freshness-restart-storm.md` — human
  via Cursor 2026-08-16 ~10:56 CEST, from an Operator-topic screenshot.
  Prompted by today's briefing Flagged #4 / Ask #2 — still no ticket.

  ONE of three tickets this intake was split into (specifier consolidation
