human_approval: pending
approval_context: >
  QA found that the bb property runners run in no lane (note 003876,
  BL-2041's sibling). FIRM: BL-2048, the front-end that runs a list of them
  on BL-2027's recorded lane runner, is needed under every option and is
  approved. FIRM: no option runs all 217 inside a parcel's pass - the
  2026-10-06 census's first 88 runners alone took 20 minutes on the swarm
  host. The ruling is WHICH lane
  runs them. This ticket's scenarios are option A's first half and hold
  under B too. On A the specifier mints the gather-row slice the same pass
  (production TypeScript, so it carries the hardener); on B also a nightly
  slice; on C this ticket is amended into the nightly slice and its
  selector scope dropped, before promotion.

ruling_options:
  - A - QA's gather runs, on every parcel, the property runners its change reaches, and nothing runs the others (recommended)
  - B - as A, plus one full run of all 217 each night while no shift runs, every red sent to the specifier as an unowned-red note
  - C - no per-parcel run, only the nightly full run of all 217, every red sent to the specifier as an unowned-red note
ruling_tradeoffs:
  - Pros - a red the parcel causes shows in the gather QA already reads, before the land; over the last 10 tickets that changed swarmforge/scripts code each run would have been 0 to 23 runners, and a handoff_lib.bb change, the worst case, 62 of the 217 runners (times in the census evidence). Cons - that time is added to QA's pass on bb parcels; a runner no change reaches never runs, so a red from host or tool drift stays unseen. Recommended because each of BL-2041's four unseen reds was a change to a file its test loads or names, which this catches, at the cost of only the runners a change touches.
  - Pros - A's per-parcel catch, plus any drift red seen within a day. Cons - A's per-parcel time, plus a nightly job to build and keep alive (a cron entry and a way to send its reds), one more slice.
  - Pros - no per-parcel time at all. Cons - a parcel's own red is found the morning after it lands, already on main, which is the shape BL-2041 was minted to end; the nightly job still has to be built.

description: |
  ## What is wrong

  `swarmforge/scripts/test/` holds 217 property runners and about 200 of
  them run only when a role picks one by hand (BL-2048 has the census).
  Running all of them is not a per-parcel step: in the 2026-10-06 census
  the first 88 runners alone took 20 minutes on the swarm host. Article 4.5 already asks QA to run every
  test whose scope covers a changed path ("a dedicated helper may follow in
  a later ticket"), and BL-1877's ruling A runs only the vitest property
  files a change reaches. Nothing picks the property runners a change
  reaches, so QA picks them by hand or not at all.

  ## What is wanted (option A's first half; also B's)

  1. A reach selector: `swarmforge/scripts/property_runner_reach_lib.bb`
     and a thin CLI `swarmforge/scripts/property_runner_reach.bb`, the
     same pair shape as `bb_load_closure_lib.bb`/`bb_load_closure_cli.bb`:

         bb property_runner_reach.bb <scripts-dir> <changed-path>...

     Changed paths are relative to the repository root, which is
     `<scripts-dir>/../..` (the selector never runs git). It prints, one
     per line in `LC_ALL=C` name order, the file names of the runners
     (`*_property_runner.bb|sh|js` directly in `<scripts-dir>/test`) that
     any changed path reaches, and nothing when none is reached. A runner
     R is reached by a changed path P under `swarmforge/scripts/` when:
     - P is R itself; or
     - R is a `.bb` and P is a `.bb` in R's load-file closure; or
     - R's own text contains P's file name (a script R spawns, a lib R
       copies into a fixture: 28 of the 211 `.bb` runners load-file
       nothing and reach their code this way, e.g.
       `bl1011_freshness_attribution_property_runner.bb` naming
       `daemon_log_freshness_check.sh`).
     A path outside `swarmforge/scripts/` reaches nothing (a TypeScript
     change is BL-1877's lane).

  2. On BL-2048's front-end, `run_property_runners.sh --changed-from
     <ref> [dir]`: the changed paths are `git diff --name-only
     <ref>...HEAD` in the repository holding `dir`; it runs exactly the
     reached runners on the recorded lane runner. When none is reached it
     prints `no property runner reached since <ref>` and exits 0.

  3. The step handler `specs/pipeline/steps/bl2049PropertyRunnerReachSteps.js`:
     a mkdtemp fixture root (`trackedTmpRoot`) holding
     `swarmforge/scripts/{a.bb,b.bb,c.sh}` and
     `swarmforge/scripts/test/{x,y,z}_property_runner.bb` per the
     Background; `x` load-files `../a.bb` with the repo's own idiom,
     `a.bb` load-files `b.bb`. Scenario 02 `git init`s that root (prove it
     with `rev-parse --git-common-dir` before committing, BL-1390), commits
     a base, changes the one file, commits again, and reads "exactly the
     runners" from a log each fixture runner appends its name to. Validate
     `<changed>`, `<reached>`, `<outcome>` and `<exit>` against explicit
     KNOWN_VALUES tables. Register with `registry.defineScoped(re, fn,
     FEATURE)`.

  ## How (direction, not mandate)

  - The closure: resolve R's own direct deps
    (`bb-load-closure-lib/direct-load-file-deps`) against R's directory
    (`../a.bb` is `<scripts-dir>/a.bb`, `lib/x.bb` is
    `<scripts-dir>/test/lib/x.bb`), then `compute-closure` over
    `<scripts-dir>` from each. Do not call `compute-closure` on R itself:
    it resolves every dep against the root it is given, so from
    `<scripts-dir>` it cannot follow `../a.bb`, and from `<scripts-dir>/test`
    it lists `a.bb`'s own deps but never walks them (measured 2026-10-06 on
    `bl2039_tier_aware_chase_sweep_property_runner.bb`).
  - Do not widen the third rule to the text of the closure's libs: a
    prototype that did reached 68 to 89 runners for most recent bb parcels,
    through comments in widely loaded libs (`handoff_lib.bb` names dozens of
    files), against 0 to 23 for the rule above.

  ## Not in scope

  - The lane itself (the ruling's next slice): the gather row on A, also a
    nightly job on B.
  - A runner reached only through a shell script that another script
    sources, or through a compiled `extension/out` module.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2049-a-change-runs-exactly-the-property-runners-it-reaches.feature`:
     8 ok (01 x5, 02 x3), 0 fail.
  2. `bb swarmforge/scripts/property_runner_reach.bb swarmforge/scripts swarmforge/scripts/chase_sweep_lib.bb swarmforge/scripts/test/bl2039_tier_aware_chase_sweep_property_runner.bb | wc -l`:
     23 (measured at mint with a scratch prototype of the rule above,
     BL-2039's own two paths), and the list includes
     `bl2039_tier_aware_chase_sweep_property_runner.bb` and
     `bl852_chase_sweep_ambulance_hold_property_runner.bb`.
  3. `bb swarmforge/scripts/property_runner_reach.bb swarmforge/scripts swarmforge/scripts/handoff_lib.bb | wc -l`:
     62 (measured at mint, same prototype). A count far below it means the
     closure stopped after one hop (the How's first bullet).

