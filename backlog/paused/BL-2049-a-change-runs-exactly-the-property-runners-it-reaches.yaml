id: BL-2049
title: "Which lane runs the 217 property runners under swarmforge/scripts/test (about 200 run only by hand, QA note 003876) - ruling A, B or C - and its first slice under A or B, a reach selector that reports exactly the runners a change reaches (the runner itself, a .bb in its load-file closure, or a file its own text names) with the property-runner front-end's --changed-from flag running exactly those"
