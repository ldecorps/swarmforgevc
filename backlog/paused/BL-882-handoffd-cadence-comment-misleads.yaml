  New feature draft needs review. The judgement call worth your eye: this is
  deliberately specced as a COMMENT-ONLY reword (severity low, lean
  [coder, documenter, qa] chain) because the specifier's probe found the code
  matches every sweep's own ticket ("shares the same cadence") and BL-617's
