id: BL-1915
title: "A landed ticket's own register rows (standing reds, suite poles, property allowlist) leave main in the commit that closes it, so a line whose ticket owns a row lands on the merge path instead of being rebuilt by the land step"
milestone: M8
type: feature
status: todo
epic: landing-is-a-merge
priority: 5
direction: human-requested
depends_on: []
mutation_cost: medium
# medium: a register rewrite moves from the land step into close_ticket.sh
# and the merge path's decline narrows; three registers, one accepted-pole
# exception.
slice_size_envelope: medium
required_stages: [coder, architect, hardender, documenter, qa]
stage_skip_reasons:
  cleaner: "medium envelope; it reuses land_step_lib's existing row rules rather than adding new code to tidy"
acceptance: specs/features/BL-1915-a-tickets-own-register-rows-leave-main-when-it-closes.feature

human_approval: approved
human_ruling: |
  A - the commit that closes the ticket removes its rows, so a land is only a merge (recommended)
ruling_provenance: tapped
approval_context: >
  The first slice BL-1870 names before the land step's rebuild machinery
  can be deleted. FIRM - which rows leave (the closing ticket's own, never
  an accepted pole, never another open ticket's) is BL-1631's rule,
  reused, not rewritten; the land step keeps retiring at land until the
  deletion slice, and a second pass that finds nothing changes nothing;
  the merge path still declines when the restore half (BL-1604) would
  act. The choice is WHERE the closing ticket's rows leave main. The
  feature file is written for A; under B, scenarios 02 and 03 move from
  close_ticket.sh to the lander and BL-1901's scenario 04 stays.

ruling_options:
  - A - the commit that closes the ticket removes its rows, so a land is only a merge (recommended)
  - B - the merge path removes them inside the land, as the land step does today

ruling_tradeoffs:
  - Pros - the land stays a git merge as ruling A on BL-1870 asked, and a row leaves in the same commit its ticket stops being open, so it is never unowned for a moment. Recommended because the close is where ownership ends. Cons - a row for a test that has turned green stays on main between the land and the close, usually minutes, and close_ticket.sh gains a step.
  - Pros - rows leave main at the same moment as today and the close is untouched. Cons - the merge path edits the tree beyond the merge, so a land is again more than a merge, and the deletion slice then has to keep that rule alive in the merge path.

invariants:
  - "Only the closing ticket's own rows leave a register: another open ticket's row and an accepted pole row never do."
  - "A ticket's own rows and its move to backlog/done/ reach main in one commit, so main never carries a row whose owner is closed because of this step."

source: |
  BL-1870 remaining_slices, verbatim: "First move the registry pass
  (BL-1631 retire, BL-1604 restore) out of the land step, into the merge
  path or the coordinator's close, because BL-1901 declines every line
  that pass would change (amended 2026-10-02)".
  The human, on BL-1870's assessment (relayed by QA as rule_proposal
  003669, 2026-10-01), verbatim:

  > Ok with the idea of landing deamon. Let specifier cook up something. Tell it to first assess if we got the while concept wrong? In my mind it should not be much more than a git merge.

