description: |
  ## Why

  BL-1631 has the land step retire every row the landing ticket owns in
  backlog/standing-reds.tsv, backlog/suite-poles.tsv and
  swarmforge/scripts/property_suite_standing_allowlist.tsv (land_step_lib
  `registry-specs`, accepted poles excepted). BL-1901's merge path cannot,
  so after QA spec-gap 003735 it declines every line whose ticket owns a
  row and the land step rebuilds it. Every standing-red, pole and
  allowlist owner therefore leaves the merge path, and BL-1870's deletion
  slice cannot remove the land step while it still does this work.

  ## What is wanted (ruling A)

  - The merge path no longer declines a line because its ticket owns rows.
    The land publishes the merge, and the rows stay on main.
  - close_ticket.sh removes the closing ticket's own rows from each
    register in the same commit that moves the ticket to backlog/done/.
    It prints one line per removed row, as the land step's
    REGISTER_ROW_RETIRED does.
  - A row another open ticket owns, and an accepted pole row, stay.
  - The merge path still declines when the restore half (BL-1604) would
    act: a line that drops another open ticket's row.
  - Retire BL-1901's scenario 04 ("a land never leaves the landing
    ticket's own register row on origin/main"). Under A it is false.
    Retire it, never reword it (BL-1006); BL-1915's scenario 01 is the
    replacement. That feature carries the hardener's mutation stamp, so
    the retirement rides BL-1915's parcel and is never made on main (BL-1385).

  ## How (direction, not mandate)

  Reuse land_step_lib's `rows-to-retire` and `registry-specs` (the merge
  path already loads them) from a small bb helper that close_ticket.sh
  calls before its commit, adding the rewritten registers to the same
  commit_integrity_cli.bb `--path` list. Narrow land_merge_path.bb
  `registry-decline` so that it reads only the restore half. A multi-id
  close (Article 2.6) removes each id's rows.

  ## Scope

  swarmforge/scripts/close_ticket.sh, a helper it calls,
  swarmforge/scripts/land_merge_path.bb and land_merge_path_lib.bb
  (`registry-decline` and `registry-pass-changes`), their tests, the
  BL-1901 feature (scenario 04 retired) and its step handler, the new
  feature and its step handler bl1915OwnRowsLeaveAtCloseSteps.js. The
  documenter updates the living docs that say the land removes a ticket's
  rows (`grep -rln "BL-1631" docs/`).

  ## Prose the specifier lands at activation (BL-798)

  backlog/standing-reds.tsv's header ("the land step itself retires every
  row whose owner is the landing ticket (BL-1631)... no other land removes
  it"), specifier.prompt's "The owner's scenarios assert the row PRESENT
  and OWNED" rule ("the land removes them"), and
  articles/reference/standing-red-register-amendment-2026-09-05.md,
  written as "Until BL-1915 lands" interims.

qa_e2e_procedure: |
  On the parcel commit, ONE run each:
  1. `node specs/pipeline/cli.js specs/features/BL-1915-a-tickets-own-register-rows-leave-main-when-it-closes.feature`:
     01, 02 (3 rows), 03 ok.
  2. `node specs/pipeline/cli.js specs/features/BL-1901-a-clean-parcel-line-lands-as-a-merge-of-origin-main.feature`:
     01, 02, 03, 05 ok, and scenario 04 is gone with a RETIRED comment.
  3. `node specs/pipeline/cli.js specs/features/BL-1631-a-land-retires-the-landing-tickets-own-register-rows.feature`:
     every scenario ok (the land step still retires until the deletion
     slice).
  4. close_ticket.sh's shell test and the merge path's bb test runner:
     ALL PASS.
  5. After the land, on the first real close of a ticket that owns a row:
     `git show --stat <close commit>` lists both the ticket move and the
     register(s), and `bb swarmforge/scripts/standing_red_register_cli.bb .`
     prints `"unowned":[]`.

