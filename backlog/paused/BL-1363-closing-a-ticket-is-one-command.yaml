human_approval: pending
approval_context: >
  One decision is yours, posed as ruling_options below, and it is about
  existing history rather than the script.
  .
  Closes have been landing in two different places for months - 665 ticket
  files sit loose in `backlog/done/` and 516 more sit in milestone
  subdirectories. A close script has to pick one. Applying the convention only
  to new closes is cheap and leaves the split visible forever; migrating the
  665 touches a lot of files for a tidiness gain and is its own slice, not
  this one.
  .
  My recommendation is listed first - settle new closes into the milestone
  directory and leave history alone, since nothing reads the done area by path
  and a migration is pure churn until something does.
  .
  What to know either way. This changes no gate and no routing. It does not
  promote, it does not push, and it obeys the integrity CLI's refusal exactly
  as promotion already does rather than falling back to a raw commit - which is
  the specific failure BL-1028 recorded.

ruling_options:
  - Apply the convention to new closes only and leave the 665 loose files (recommended)
  - Also migrate the 665 loose files in a separate follow-up slice
  - Keep closing to the done root and stop using milestone subdirectories

description: |
  ## What is wrong

  The coordinator performs two mirror-image bookkeeping rituals after every
  ticket. One is a script and one is not.

  - **Promote** - `promote_and_route_next.sh` moves the file, rewrites
    `assigned_to`, commits through the integrity CLI, and obeys a refusal
    rather than falling back to a raw commit (BL-1028's own fix).
  - **Close** - performed by hand, every time.

  ## Observed

  Over 45 days, classifying every non-merge commit whose paths all sit in one
  backlog area:

  | commit subject | count | source |
  |---|---|---|
  | `Promote BL-N: paused -> active for <role>` | 484 | generated by the script |
  | `Close BL-N: move to done` | 370 | hand-made |
  | `Close BL-N: move to done. By coordinator.` | 39 | hand-made, different by hand |

  The two spellings of the same close are the tell. And the destination has
  drifted with them: `backlog/done/` holds 665 loose ticket files while
  `backlog/done/M1..M8/` hold 516 between them, because nothing decides which.

  ## Why it matters beyond tidiness

  Article 2.6 makes the close the point where a multi-ticket approval either
  records every satisfied id or silently loses one - "an ID that never reaches
  the note stays active forever". A hand-made close is exactly where that is
  missed, and it is invisible when it happens.

  ## How (direction, not mandate)

  - The mirror of `promote_and_route_next.sh`, reusing its integrity-commit
    path rather than growing a second one. Its refusal handling is the model:
    roll the staged rename back, report the reason, change nothing.
  - Take one or more ticket ids so Article 2.6's multi-ticket case is the
    normal path rather than a special one, and refuse the whole batch if any
    id cannot close.
  - Milestone destination comes from the ticket's own `milestone:` field, which
    every ticket already carries and the hygiene gate already enforces.
  - Whether the close also sends the coordinator's own follow-on note is open;
    invariant 3 only requires that it does not PROMOTE.

  ## Explicitly NOT in scope

  - Promotion, routing, and the depth-cap recheck. Those are
    `promote_and_route_next.sh`'s and stay there.
  - Migrating the 665 existing loose files - see ruling_options.
  - The QA-side landing sequence. That is a separate opportunity recorded on
    BL-667 and it has a live sequencing hazard with BL-1354.

qa_e2e_procedure: |
  1. Close a single approved fixture ticket. Confirm the file lands in the done
     area for its `milestone:`, the commit went through the integrity path, and
     nothing else was staged.
  2. Force the integrity check to refuse. Confirm the ticket is still in
     `backlog/active/`, the index is clean, and the refusal reason is printed.
  3. Close two tickets satisfied by one approved commit. Confirm both moved.
  4. Repeat with one of the two unclosable. Confirm NEITHER moved and the
     refusal names the blocker.
  5. Confirm no paused ticket was promoted by any of the above, and that
     `promote_and_route_next.sh` still promotes exactly as before.
  6. Run in the shared master checkout with unrelated dirt present and confirm
     the close stages only its own ticket paths (BL-506).

notes: |
  Minted 2026-09-03 by the specifier during the operator-directed sweep for
  repeatable agentic tasks. Ranked third of the opportunities found; the full
  inventory is on BL-667.

  Verified this pass rather than assumed:
  - The commit counts come from `git log --name-only` over 45 days classified
    by backlog area; the promotion subject matches
    `promote_and_route_next.sh:405` exactly, so those are script-generated.
  - No production file in `swarmforge/scripts` or `extension/out/tools`
    contains the close subject - the only matches are four test fixtures.
  - The 665/516 done-area split was counted directly off the tree.
  - Deliberately NOT proposed, because the sweep found them already
    deterministic: promotion, the `backlog/topics/` records (written by
    `extension/src/concierge/blTopicStore.ts`, 2228 uniform commits), and
    `human_approval` recording (written by the bridge and front-desk bot on
    the human's tap, 295 commits).

  **No production-wiring anchor is declared (BL-1235).** Same reasoning as its
  siblings: the only call site is one this parcel creates, and the prompt
  change making it the coordinator's standard route is the specifier's to land
  (BL-798).

  IR-DRY: two findings, both possible-synonym at 0.5 - singular against plural
  ("the ticket file is in the done area" / "both ticket files are"), and
  "closes the ticket" against "closes the approval". Both distinctions are what
  the multi-ticket scenarios exist to draw. Left as written.

