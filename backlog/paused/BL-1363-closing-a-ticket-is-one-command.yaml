invariants:
  - "A close is one atomic move-and-commit through the SAME integrity path promotion uses, and a refusal is obeyed - never overridden by a raw git commit, and never left staged in the shared index (BL-1028)."
  - "Every ticket id the approval satisfies moves or none does: a partial close is refused, because an id that never reaches done/ stays active forever (Article 2.6)."
  - "Closing never promotes - the follow-on promotion stays promote_and_route_next.sh's, so a refused close cannot strand a promoted ticket on NO_TASK."

