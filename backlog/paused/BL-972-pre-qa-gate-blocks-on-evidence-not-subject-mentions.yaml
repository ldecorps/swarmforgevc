id: BL-972
title: "pre-QA gate blocks forwards on ticket ids merely NAMED in commit subjects: require dropped-work evidence (touched paths/diff content) to block; demote name-only matches to warnings"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarm-reliability
human_approval: pending
priority: 30
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-972-pre-qa-gate-blocks-on-evidence-not-subject-mentions.feature

invariants:
  - "A non-ancestor commit blocks a forward only when path or diff-content evidence ties it to the ticket's parcel - the ticket id in its subject line alone never blocks, and an abandoned_commits listing always exempts."

description: >
  Severity rationale: medium - a real, daily-recurring fault, but loud
  and contained: the gate over-blocks (errs safe), every block is
  visible to the sender, and the abandoned_commits ceremony is a
  working workaround. No safety signal is silenced; throughput and
  turns are what it costs.

  The defect (mechanism verified in code at mint): the gate's ancestry
  check gathers dropped-work candidates from every role branch by
  SUBJECT-line token match alone - gather-ancestry-facts (
  pre_qa_gate_gather_lib.bb) reads log --format=%H<sep>%s and filters
  with message-references-ticket?; ancestry-findings
  (pre_qa_gate_lib.bb) then BLOCKS the documenter-to-QA forward for
  any candidate not an ancestor of the cited commit/main/origin-main
  and not listed in abandoned_commits. Naming a ticket is not carrying
  its work: reverts, BL topic records, evidence commits, and
  cross-references all name tickets whose content they deliberately
  exclude, and each such commit on any role branch blocks that
  ticket's forward. QA measured four blocked passes on 2026-08-20
  alone (BL-935, BL-958, BL-910, BL-959) - three of the blocking
  commits stated in their own subject that the ticket's content was
  deliberately excluded. Same day, the coder's BL-571 D1 re-fix had
  to enumerate two abandoned commits to pass; the abandoned_commits
  escape hatch has its own failure mode (a comment line inside a
  block list voids it).

  Fix wanted: candidacy RECALL stays as-is (subject-token match is a
  cheap, effective first net), but BLOCKING requires evidence - the
  candidate's touched paths overlap the parcel's (the cited commit's
  diff against its merge-base with main; the ticket's acceptance
  feature and required_wiring paths may widen the reference set), or
  its diff content demonstrably carries the ticket's work. A
  subject-only match is reported as a WARNING naming the commit, so
  recall is not lost - it just stops blocking. abandoned_commits
  remains an explicit exemption that beats even path evidence
  (outline row 3), preserving the existing override for deliberate
  exclusions.

  Governing rule: accepted from QA's rule_proposal 2026-08-20 into
  the engineering article (Guardrails: "A gate blocks on dropped-work
  EVIDENCE (touched paths/diff content), never on a ticket id merely
  named in a commit subject"), full narrative in
  engineering-detailed.prompt. This ticket is the code half - the
  gate is pipeline code the specifier cannot land (BL-798 posture:
  prose landed with the acceptance, implementation rides the
  pipeline).

  How (direction, not mandate): the evidence check fits where
  candidates already flow - gather the candidate's touched paths
  (diff-tree; mind that name-only listing is blind to merge commits,
  use the -m form for merges) alongside its sha/message, and let
  ancestry-findings require path intersection before emitting a
  blocking finding, emitting a warning finding otherwise. Diff-content
  matching may be a follow-on if path evidence proves insufficient in
  practice; the invariant is satisfied by either.

constraints: >
  Out of scope / firm lines:

  - Recall must not silently narrow: a commit the old rule would have
    blocked that the new rule does not must still appear as a warning
    in the gate's output - name-only matches become visible warnings,
    never silence.
  - The true-positive class stays caught: a non-ancestor commit whose
    paths overlap the parcel still blocks (outline row 2) - this is the
    BL-536/BL-806 dropped-work protection the gate exists for.
  - abandoned_commits semantics unchanged (still exempts; flow-style
    list discipline unchanged).
  - Commits that do NOT name the ticket remain outside the candidate
    net (unchanged today): widening recall to all-branch content scan
    is explicitly out of scope - note it as a known limitation, do
    not build it.
  - The required_wiring half of the gate is untouched.

qa_e2e_procedure: >
  1. Acceptance scenario 01 (all outline rows) green (gate evaluate over constructed
     facts/fixture repos).
  2. Unit suite for the gate libs green (bb).
  3. Historical replay: re-run the gate for the four 2026-08-20
     blocked passes (BL-935, BL-958, BL-910, BL-959) at their original
     cited commits - each now passes with the formerly blocking
     name-only commit listed as a warning; record the four
     before/after outcomes in the QA evidence file.
  4. Dropped-work regression: construct a fixture where a role branch
     holds a real unmerged ticket commit (overlapping paths, not an
     ancestor) - the gate still blocks and names it.
  5. Confirm the sender-side experience: a documenter forward blocked
     pre-fix by a name-only revert now succeeds without touching
     abandoned_commits.

notes: >
  Source: QA rule_proposal handoff 20_20260820T041840Z_000395,
  verbatim: "pre_qa_gate ancestry must match a ticket by touched
  paths or content, never by ticket ids appearing in a commit SUBJECT
  line." / "Rationale: Four QA passes on 2026-08-20 (BL-935, BL-958,
  BL-910, BL-959) were each blocked by a commit that only NAMED the
  ticket - three said its content was deliberately excluded."
  Accepted by the specifier same day; rule landed in
  engineering.prompt (Guardrails) + engineering-detailed.prompt
  narrative in the acceptance commit.

  Specifier probe: mechanism confirmed at
  pre_qa_gate_gather_lib.bb (gather-ancestry-facts, subject-only %s
  filter via message-references-ticket?) and pre_qa_gate_lib.bb
  (ancestry-findings). Scope note: blocking-criterion change only -
  candidate recall (subject match) and abandoned_commits exemption
  survive; the gate reads required_wiring from the sender's checkout
  and that half is untouched. Related: BL-536/BL-806 (why the gate
  exists), BL-874 (required_wiring literal-pattern lesson - same
  gate, other half), the abandoned_commits flow-style lesson.

  Orthogonality for the coordinator: touches
  pre_qa_gate_lib.bb/pre_qa_gate_gather_lib.bb and their tests - no
  overlap with BL-967 (handoffd), BL-970 (chase_sweep classifier),
  BL-971 (extension property tests).

approval_context: >
  One call to say the word on: blocking now requires PATH overlap
  evidence (content matching deferred as follow-on if paths prove
  insufficient) - the four measured false positives all fail the path
  test cleanly, and true dropped work overwhelmingly shares paths
  with its parcel. If you want content-level evidence in v1 despite
  the cost, say so. Severity medium (not expedited): loud
  over-blocking with a workaround, no silenced signal.

