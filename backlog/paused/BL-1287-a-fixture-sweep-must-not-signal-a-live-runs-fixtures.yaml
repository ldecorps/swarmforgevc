id: BL-1287
title: "leakedFixtureTunnelPids selects every temp-path cloudflared on the host with no scoping to the asking run, so bl857's module-load sweep SIGKILLs a concurrently-running sibling suite's LIVE fixtures in a parallel fork pool"
milestone: M8
type: defect
severity: medium
# medium: real but contained to the property lane. It cannot reach the
# operator's tunnel - the temp-path rule still holds that line, and this ticket
# keeps it (scenario 02). What it costs is the lane's verdict: a suite's result
# becomes a function of which sibling file happened to be mid-flight, which is
# exactly the "verdict depends on something other than the code under test"
# failure BL-871's invariant 1 exists to close, and an intermittently red lane
# is how a real regression gets waved through (BL-816). Not high: no gate is
# dead, no production path is touched, and the suites still fail loudly on a
# genuine reap defect. Not low: it is not cosmetic, and it fires inside the
