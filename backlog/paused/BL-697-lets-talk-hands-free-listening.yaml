approval_context: >
  Operator request via Let's Talk 2026-07-27: after the agent speaks, reopen the
  mic automatically; when the user is silent for ~2–3 seconds, submit the turn
  without tapping Stop. Toggle to enable/disable. See
  docs/reference/specs/BL-697-lets-talk-hands-free-listening.md.

description: |
  ## What

  Optional hands-free mode on the Let's Talk Mini App screen. When enabled,
  listening resumes shortly after TTS playback; silence (~2.5 s after speech)
  ends the capture and submits the turn. Manual Record/Stop remains available.

  ## Scope

  - `extension/src/bridge/letsTalkCore.ts` — thresholds and pure decisions
  - `extension/src/bridge/letsTalkUiHtml.ts` — toggle, Web Audio VAD, auto loop
  - Tests and BL-697 feature file

  Out of scope: server routes, streaming STT, wake word.

assigned_to: coder
