description: |
  ## Status: hotfixes 48d037df88 (runner and comments) and d0b9440211 (guard) landed the fix

  This parcel is their stamp-off: review them, do not re-apply them.

  ## What was wrong

  procps-ng 4.0.4's /usr/bin/kill reads a negative pid that follows a
  signal option as the unknown option -<first digit> and calls kill() on
  the negated first digit, with its exit status inverted. A pid starting
  with 1 makes that kill(-1, SIG): every process the user owns. bash's and
  dash's builtin kill are correct; only an exec of the external binary is
  exposed. bl965_wrapper_cleanup_property_runner.bb ran
  (process/sh "kill" (str "-" sig) (str "-" pid)) in its signal arms.

  ## What the hotfixes changed

  48d037df88: the runner passes "--" before the negative pid. The comments
  in bounded_run_lib.bb and daemon_cycle_guard_lib.bb that explained the
  "--" now say what its absence really does.

  d0b9440211: extension/test/externalKillNegativePidGuard.test.js scans
  swarmforge/scripts, specs/pipeline, extension/src, extension/scripts and
  extension/test for an exec of the external kill (a quoted "kill" program
  name in bb/clj/js/ts; exec/env/xargs/nohup/setsid/timeout kill or
  /usr/bin/kill in a shell script, up to the next ; | &) that passes two or
  more dash-led arguments with no "--". It pins its census: the three
  guarded group kills in handoffd_supervisor.bb, the one in
  daemon_cycle_guard_lib.bb, and both spawnSync('kill') sites in
  mergedCodeReachesDaemonsSteps.js. Before 48d037df88 it flagged exactly
  bl965's line 99.

  ## What the coder does (all of it)

  1. Read `git show 48d037df88` and `git show d0b9440211` against the
     section above. Re-run the guard's census grep,
     `grep -rnE '"kill" .*"--" \(str "-"' swarmforge/scripts`: at
     d0b9440211 it prints 6 lines - handoffd_supervisor.bb x3,
     daemon_cycle_guard_lib.bb x1, bl965's fixed line x1, and
     check_worktree_strays.bb x1, which passes no signal (one dash-led
     argument, so the guard sees it but its census pin does not count it;
     the test's own comment predates bl965's fix and names 4). Confirm no
     exec the guard should see lies outside its five directories.
  2. Run qa_e2e_procedure step 2 and
     `npx vitest run test/externalKillNegativePidGuard.test.js` once, with
     TMUX unset, output under tmp/.
  3. Write backlog/evidence/BL-2053-coder-<date>.md with the review result
     and the run results, and commit it.
