id: BL-1872
title: "The lander daemon lands what QA approves: QA's last act on a parcel is one queue command, and handoffd's lander sweep runs land_main_publish.sh --land for each queued approval, one at a time, records the land, sends the coordinator its bookkeeping note, and returns any land it cannot complete to QA with the land step's own reason, so QA's turn is never held by a land"
milestone: M8
type: feature
status: todo
epic: landing-is-a-merge
priority: 4
direction: queue-jump
depends_on: [BL-1871]
# BL-1871 first: under parcel lines the merge-up broadcast moves nothing,
# so the daemon sends none. Before BL-1871 lands, skipping it would leave
# role branches behind main.
mutation_cost: low
# low: Babashka (a new lib and CLI, one handoffd sweep registration); no
# Stryker lane (BL-472), so the hardener hand-mutates the queue writes and
# the land invocation.
slice_size_envelope: medium
required_stages: [coder, architect, hardender, documenter, qa]
stage_skip_reasons:
  cleaner: "one new lib, its CLI and one sweep registration; the architect and hardener passes cover structure, so the cleaner runs only for large slices"

acceptance: specs/features/BL-1872-the-lander-daemon-lands-what-qa-approves.feature

# Consumer anchor: handoffd.bb is the live daemon whose sweep must reach
# the new lib (BL-1235: the consumer's call, not the parcel's own
# declaration). The lib name is fixed here so the anchor is a literal that
# will exist (BL-874). Handler pin per BL-233/BL-1371.
required_wiring:
  - 'swarmforge/scripts/handoffd.bb::lander_lib::the daemon sweep must run queued lands through the new lib'
  - 'specs/pipeline/steps/bl1872LanderDaemonSteps.js::registerSteps::the handler lands in the same parcel as the feature (BL-233, BL-1371)'

human_approval: approved
approval_context: >
  Second slice of BL-1870 (ruling A). FIRM - QA still decides and owns
  every refusal; the daemon only carries out an approval QA queued. FIRM -
  the daemon runs today's land_main_publish.sh --land, in a worktree of
  its own and never QA's, so every publish gate, the land lock and the
  land-approval record stay as they are. One change to the step: its
  single rematch no longer leaves the worktree on a detached HEAD (QA note
  003673). FIRM - one land at a time, oldest first; each queued approval lands
  or is refused exactly once; a refusal goes to QA by note with the land
  step's reason, and the daemon never retries it. FIRM - no merge-up
  broadcast is sent, because BL-1871 made it a no-op. The land step's own
  simplification (deleting replay, strays and re-point) is a later slice,
  after in-flight parcels drain.

invariants:
  - "Every queued approval is landed or refused exactly once, and the sweep never starts a land while another is running."
  - "Queueing an approval never fetches, builds or pushes: QA's queue command touches only the lander queue."
  - "A land the sweep cannot complete reaches QA as a note carrying the land step's own reason; the sweep never retries it on its own."

source: |
  The human, relayed by QA as rule_proposal 003669 (2026-10-01), verbatim
  (Article 5.3):

  > Ok with the idea of landing deamon. Let specifier cook up something. Tell it to first assess if we got the while concept wrong? In my mind it should not be much more than a git merge.

  QA's rationale, quoting the human's earlier message, verbatim:

  > Could we introduce a new role "lander" dedicated to this task? It is takibg far too long and the stops the whole swarm while it runs. Or change the landing logic all together?

  The human tapped BL-1870 ruling A at 20:18 BST, then, verbatim:

  > Prioritize this work.

  QA note 003682 (2026-10-02), verbatim:

  > BL-1872 add: rematched land sha has no land-approval record (dd2950dc24)

description: |
  ## What happens today

  QA.prompt's land recipe: QA runs `land_main_publish.sh <qa-worktree>
  --land <task> <full-sha> [<issue-ref>]` itself (detached, because the
  harness kills a background command at 30 minutes), reads LAND_PUBLISHED,
  LAND_ESCALATE or the exit-3 ENTANGLED_SIBLING_BLOCK, then sends the
  merge-up broadcast and the coordinator's bookkeeping note through
  `ceremony_handoff.sh`. The whole land runs inside QA's turn.

  ## What is wanted

  1. A queue command QA runs once it has approved: `lander_queue.bb <root>
     --enqueue <task> <full-sha> [<issue-ref>]`. It writes one entry under
     `.swarmforge/lander/queue/` and returns. It fetches, builds and pushes
     nothing (scenario 01). The same task and commit queued again is the
     same entry (scenario 05).
  2. A lander sweep in handoffd. When no land is running, it takes the
     oldest queued entry and runs `land_main_publish.sh <lander-worktree>
     --land <task> <sha> [<issue-ref>]` detached. The lander has a worktree
     of its own (`.worktrees/lander`, created from origin/main on first use)
     and never runs a land in QA's, because QA is reviewing its next parcel
     there while the land runs. The post-land re-point therefore moves the
     lander's branch, not QA's. Under parcel lines (BL-1871) QA's branch
     needs no re-point. Logs go to
     `.swarmforge/lander/<task>-<sha10>.log`. A later tick reads the
     outcome:
     - LAND_PUBLISHED: the entry is marked landed, and the coordinator gets
       the bookkeeping note `ceremony_handoff.sh bookkeep` composes today
       (scenario 02).
     - Any refusal or failure (LAND_ESCALATE, ENTANGLED_SIBLING_BLOCK, a
       conflict with origin/main, a non-zero exit): the entry is marked
       refused, and QA gets a note naming the ticket and the land step's
       own reason (scenario 04). QA adjudicates as today. The sweep never
       retries a refused entry.
     - At most one land runs at a time, oldest first (scenario 03). The
       land lock already stops two publishes from racing; the sweep must
       also not start a second land behind it.
  3. No merge-up broadcast. Under parcel lines (BL-1871) it moves nothing.
  4. The rematch never detaches a worktree (scenario 06). Today
     `land_main_publish.sh`'s single permitted rematch runs `git -C $ROOT
     rebase origin/main $land_sha`. A bare commit as the branch argument
     makes git check it out first, so the worktree is left on a detached
     HEAD at the rebased commit. QA saw its own worktree left that way on
     2026-09-30 and 2026-10-01 (BL-1865's land), note 003673. Build the
     rematched commit without moving any worktree's HEAD (or restore the
     branch afterwards), and push that.
  5. The rematched commit gets its own land approval record (scenario 07).
     The land step records the replay it built (BL-1334), but the rematch
     publishes a different commit, and nothing records that one. So
     is_qa_ancestor.sh reads the published commit as unapproved, and the
     babysitter escalates an Article 4.2 CRIT for an approved land. BL-1835's
     land on 2026-10-02 is the case: the replay 4890a3635a was recorded, its
     push was rejected, the rematch published dd2950dc24 with no record, the
     CRIT fired at 05:44:12Z, and QA added the record by hand at 05:46:40Z
     (note 003682). Today QA is at hand to do that. Under the lander nobody
     is, because QA's turn ends at the queue command. Before the second
     push, record the rematched commit against the same approved source the
     replay's record names, through the recorder the land step already uses
     (`record-land-approval!`, or `record_land_approval.bb`), never a second
     writer (BL-1405). A record written before a push that then fails names
     a commit main never carries, and grants nothing.

  ## How (direction, not mandate)

  - `swarmforge/scripts/lander_lib.bb`, a pure decision (which entry, what
    outcome, which notes) plus thin impure edges, and
    `swarmforge/scripts/lander_queue.bb` as the CLI. handoffd registers
    the sweep the way it registers its other sweeps. The anchor in
    required_wiring is the lib's file name in handoffd.bb.
  - Never wrap the land in `timeout`: a kill mid re-point leaves QA's
    branch half-moved (operator memory, 2026-10-01). A run still going
    past an hour is reported to QA by note and left alone.
  - Notes go through swarm_handoff.sh like every other daemon note. Use
    the sender the daemon already uses for its own notes, and say in the
    evidence which one that is.
  - Step handler `specs/pipeline/steps/bl1872LanderDaemonSteps.js`,
    discovered from its own file (BL-1371). Fixture roots are created by
    `git init` under mkdtemp with a bare origin, proven with `rev-parse
    --git-common-dir` before any mutating git command (BL-1390). Drive the
    sweep's tick function in-process and run the real land step against
    the fixture, the way the BL-1678 and BL-1343 handlers do. Fit the
    feature inside the per-mutant ceiling (BL-1541): measure one full run
    and record it in the evidence.

  ## Scope

  `lander_lib.bb`, `lander_queue.bb`, their bb test runner, the sweep
  registration in `handoffd.bb`, the rematch block in
  `land_main_publish.sh`, the step handler and evidence. The
  documenter writes the how-to (queueing a land, reading the lander log,
  what a refusal note means) and links it from `docs/index.md`. The
  specifier changes QA.prompt's land recipe to queue instead of land when
  this ticket activates (BL-798), as an "Until BL-1872 lands" interim
  that keeps today's recipe until the land, the way BL-1871's prose
  landed (e60cb4e6e0).

  The parcel also retires BL-247 scenario 01 (`qa-integrates-01`), the
  BL-1006 shape: its Then "QA fast-forwards main to the approved commit
  and pushes origin" is false once the lander lands what QA queues, and
  its handler reads the QA.prompt recipe lines that retire with the
  interim. Retire, never reword. This ticket's scenario 02 covers the
  land, and BL-247's scenario 02 still pins that the coordinator runs no
  git merge or push. Remove the step definitions only scenario 01 used
  from `specs/pipeline/steps/qaIntegratesCoordinatorBookkeepsSteps.js`,
  and re-tense the Feature narrative where it says QA lands. That edit is
  not a claim of ownership over BL-247's contract (BL-1251).

out_of_scope: |
  - Changing what the land step decides. Apart from the rematch's detached
    HEAD it runs unchanged here. Deleting its replay, strays and re-point
    is a later BL-1870 slice, after in-flight parcels drain.
  - Running the unit lane on the merged tree before the push. Add it in a
    later slice if a merge-skew red is ever traced to a land.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1872-the-lander-daemon-lands-what-qa-approves.feature`:
     8 of 8 ok (01, 02, 03, two rows of 04, 05, 06, 07). Measured 0 at
     mint: no handler exists yet.
  2. The new lander runner: ALL PASS.
  3. `node specs/pipeline/cli.js specs/features/BL-1678-a-land-never-ships-an-unapproved-forward-that-shares-no-path-with-the-landing-ticket.feature` (the
     publish step's own contract): 4 of 4 ok, as measured on main at
     mint.
  4. `node specs/pipeline/cli.js specs/features/BL-247-qa-integrates-coordinator-bookkeeps.feature`:
     2 of 2 ok, scenario 01 retired. Measured on main 2026-10-02 after
     hotfix 83d5e34527: 3 of 3.
  After the land (the specifier's or coordinator's check, not QA's): the
  next approval QA queues lands without QA running land_main_publish.sh,
  QA's hold on it ends at the queue command, and the lander log for it
  shows LAND_PUBLISHED. For the first land whose log shows LAND_REMATCH,
  `is_qa_ancestor.sh <published sha>` exits 0 with no record added by hand,
  and no pipeline-code-on-main CRIT names that sha.

notes: |
  Minted 2026-10-01 by the specifier, second slice of BL-1870 after the
  human tapped ruling A and said "Prioritize this work." Queue-jump per
  that directive (STEERING.md). IR-DRY findings were reviewed at mint:
  they are value variants (landed or refused, one or two entries) that
  one patterned step covers, not duplicated meaning.
  2026-10-01 amendment, before approval, from QA note 003673 ("LAND_REMATCH
  leaves QA worktree detached HEAD (09-30, 10-01 BL-1865); no ticket"):
  the cause is the bare-sha rebase in the rematch. It is folded in here,
  together with the lander's own worktree, rather than minted as a
  separate defect, because this slice is where the daemon starts
  invoking the step.
  2026-10-02 amendment, after approval, from QA note 003682: item 5 and
  scenario 07, so a rematched land records the commit it published. It is
  folded in for the same reason as note 003673: it is the same rematch
  block, and the lander is what removes QA's hand fix. The human approved
  "every publish gate, the land lock and the land-approval record stay as
  they are", and today the rematch is the one path that publishes with no
  record, so this keeps that promise rather than posing a new choice. The
  ticket was not re-pended, because there is no ruling to collect. The
  approval_context above still says "One change to the step", and that is
  the wording the human approved. A reply re-pends the ticket if the human
  wants this split out instead. Paused, so nobody holds it and no note is
  needed. The feature was linted and IR-DRY checked; the one new finding
  pairs "exactly one landing commit" with the record step, which mean
  different things.
  2026-10-02, second amendment the same pass: BL-247 scenario 01's
  retirement is scoped in (BL-1006), and the activation prose is pinned
  as an "Until BL-1872 lands" interim. Found while hotfixing BL-247's
  77-day red (83d5e34527, stamp-off BL-1878). BL-1878 reviews the same
