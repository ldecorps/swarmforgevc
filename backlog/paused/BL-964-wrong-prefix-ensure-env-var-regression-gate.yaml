id: BL-964
title: "Regression gate: the retired SWARMFORGE_ENSURE_* env-var prefix must never reappear in test code - a wrong-prefix fake injection silently launches real VS Code"
milestone: M8
type: chore
status: todo
epic: code-quality-gates
human_approval: pending
priority: 60
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-964-wrong-prefix-ensure-env-var-regression-gate.feature

invariants: []

description: >
  On 2026-08-20 two VS Code Extension Development Host windows opened
  unprompted during test runs: several test paths exported fake
  check/bounce/supervisor scripts under the WRONG env-var names
  (SWARMFORGE_ENSURE_EXTENSION_CHECK / _EXTENSION_BOUNCE / _SUPERVISOR),
  while swarm_ensure.bb reads SWARM_ENSURE_EXTENSION_CHECK_CMD /
  SWARM_ENSURE_EXTENSION_BOUNCE_CMD / SWARM_ENSURE_SUPERVISOR_CMD. The
  ignored fakes let the real extension bounce run: compile + launch VS
  Code from a test. The human hotfixed every copy (landed on main as
  596098dc3); nothing today prevents the wrong prefix from being written
  again - it fails soft (test passes, side effect escapes).

  Operator directive, verbatim from the intake: "Optional hardening:
  regression grep in a test gate (`SWARMFORGE_ENSURE_EXTENSION` must not
  appear in `specs/pipeline/steps/` or `swarmforge/scripts/test/`) so
  this class cannot recur silently."

  Fix wanted: a standing gate that fails loud when the retired prefix
  appears in test code. Cover at least the two directories the directive
  names; include SWARMFORGE_ENSURE_SUPERVISOR in the refused set (same
  incident, same class). The gate must run somewhere that actually
  executes for every parcel (the extension/test/ suite or an existing
  standing lint gate - note specs/pipeline/test/ is run by no standing
  gate, so do not put it only there).

  How (direction, not mandate): a grep-based check in the style of the
  existing repo lint gates, allowlisting nothing. Trap-resistance
  constraint (this one is firm, per the specifier's self-referential-grep
  rule): the ticket's own step handlers live in specs/pipeline/steps/ - a
  grepped directory - so they must never contain the contiguous retired
  literal; build it at runtime from split parts ("SWARMFORGE_ENSURE_" +
  suffix) when writing scratch fixtures. The .feature file may spell the
  full literal (specs/features/ is not in the grepped set). The gate
  itself may carry the literal only in its own definition.

constraints: >
  Out of scope:

  - Changing start-extension-dev.js's headless guard (BL-578, paused).
  - Renaming or aliasing the SWARM_ENSURE_*_CMD seams themselves.
  - Guarding other env-var families - one class, one gate; generalize
    only if a second incident class appears.

qa_e2e_procedure: >
  1. Clean tree: the gate passes on current main.
  2. Regression: introduce SWARMFORGE_ENSURE_EXTENSION_CHECK in a scratch
     file under swarmforge/scripts/test/ and under specs/pipeline/steps/ -
     the gate fails naming the file and string; remove, passes again.
  3. Confirm the gate is wired into a lane that runs for every parcel
     (not an orphan script) - name the lane in the evidence.

