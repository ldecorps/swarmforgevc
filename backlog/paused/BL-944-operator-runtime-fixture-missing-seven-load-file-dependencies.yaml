id: BL-944
title: "The operator_runtime.bb acceptance fixture list is missing seven transitive load-file dependencies, so thirteen scenarios across three feature files have failed on every run for two weeks"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: pending
priority: 15
direction: agent-proposed
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-944-operator-runtime-fixture-dependency-closure.feature

required_wiring:
  - "specs/pipeline/steps/lib/operatorRuntimeBbFixtureFiles.js::mono_router_lib.bb::the first missing dependency in load order; its presence is the minimum proof the list was actually corrected, not just guarded"
  - "extension/test/operatorRuntimeBbFixtureClosure.test.js::OPERATOR_RUNTIME_BB_FILES::the closure guard must live in extension/test/, the only suite a standing per-parcel gate runs; parked in specs/pipeline/test/ it would rot unrun"

invariants:
  - "Every file the fixture's operator_runtime.bb reaches by load-file, transitively and at any depth, is present in the fixture root before any --tick-once subprocess is spawned. The property is over the whole closure, not over the files anyone happened to notice."
  - "A newly introduced load-file dependency anywhere in that closure fails exactly one guard test, naming the file. It must never again surface as every operator_runtime.bb-ticking scenario failing at once with a FileNotFoundException that names a file no scenario mentions."

description: >
  `specs/pipeline/steps/lib/operatorRuntimeBbFixtureFiles.js` exports
  `OPERATOR_RUNTIME_BB_FILES`, the hand-maintained list of Babashka files
  that four acceptance step handlers copy into a disposable fixture root
  before shelling out to a real `bb operator_runtime.bb <root> --tick-once`.
  Babashka resolves every `load-file` relative to the loading file, so a
  file absent from the list is absent from the fixture and the subprocess
  dies at load time, before reaching the behaviour any scenario is trying
  to prove.

  Seven files in the real transitive closure are missing from the list.
  Measured 2026-08-19 by walking every `load-file` form from
  `operator_runtime.bb`: the closure is 28 files, the list names 22, and
  the set difference is

    mono_router_lib.bb           (via handoff_lib.bb:30)
    prompt_engine_lib.bb         (via handoff_lib.bb:37)
    orphan_janitor_sweep_lib.bb  (operator_runtime.bb:112)
    orphan_janitor_lib.bb        (via orphan_janitor_sweep_lib.bb)
    hotfix_certification_lib.bb  (operator_runtime.bb:115)
    process_table_lib.bb         (operator_runtime.bb:120)
    babysitterd_freshness_lib.bb (operator_runtime.bb:121)

  All seven load-file forms are top level, so they are all reached on every
  tick; only load ORDER decides which one is reported. The observable
  damage today, reproduced by running the feature files directly:
  BL-647-rotation-router-liveness 7/7 fail,
  BL-368-control-loss-is-not-agent-death 4/4 fail,
  BL-359-always-on-operator-presence 2/7 fail (the two whose steps actually
  tick; the other five never reach the subprocess). Thirteen scenarios,
  every one of them failing identically at `handoff_lib.bb:30` with
  `java.io.FileNotFoundException: .../mono_router_lib.bb`.

  This is NOT a same-day breakage. The list was last touched 2026-07-27
  (ca30ddebd, BL-655). The first missing dependency entered the closure on
  2026-08-05, when BL-805 (4a01bec09) added the `mono_router_lib.bb`
  load-file to `handoff_lib.bb`. These thirteen scenarios have therefore
  been red on every run for fourteen days.

  The failure mode is a repeat, not a novelty. The list's own header
  comment says so: "A file operator_runtime.bb depends on that's missing
  from this list throws FileNotFoundException on first load in every one of
  those scenarios at once (BL-412/413/458 predate this list catching up)",
  and it carries two later patch-up comments, BL-647 ("added 2026-07-22
  after this list was last deduped, so every existing consumer's fixture
  was silently missing them") and BL-655 ("same 'a new load-file dependency
  throws in every consumer fixture at once' gap this list exists to
  close"). That is five occurrences of one failure mode, each closed by
  adding the one name that happened to be reported. Adding a sixth set of
  names without changing the mechanism buys another fortnight at most.

  Probed, so the coder does not have to: patching ONLY the reported file is
  measurably insufficient. A fixture built from the current list plus
  `mono_router_lib.bb` fails at `handoff_lib.bb:37` on
  `prompt_engine_lib.bb`; the same fixture plus all seven loads clean past
  every Babashka source. The one-line fix moves the failure, it does not
  end it.

  How (direction, not mandate): the durable half is a check that derives
  the closure from source - walk `load-file` forms from
  `operator_runtime.bb`, follow them transitively, compare against the
  exported list - so drift fails one named test instead of thirteen
  unrelated scenarios. This is engineering.prompt's standing rule for a
  constant mirrored by hand across a language boundary no import can bridge
  (here JS <-> Babashka): "needs a test asserting both literals agree - a
  'kept in sync' comment is not a gate, and drift fails silently" (BL-897).
  The list's three existing comments are exactly the comment that was not a
  gate.

  One decision the closure walk forces: `operator_ask.bb` is in the list
  but in no load-file chain from `operator_runtime.bb` - it appears there
  only in comments, and none of the four consumers spawn it from the
  fixture root (verified 2026-08-19; the two step files that do run that
  CLI, answerPairingAcrossThreadsSteps.js and
  bl466AgentQuestionsAsTelegramPollsSteps.js, invoke it from REPO_ROOT and
  never touch this list). Whether it is dropped or kept behind an explicit
  "needed by a non-load-file mechanism" declaration is the implementer's
  call - scenario 03 only requires that an unreachable entry cannot sit
  there undeclared, because an unexplained extra is how a list starts
  being treated as folklore rather than as data.

constraints: >
  Out of scope:

  - Fixing the thirteen scenarios' own assertions. Once the fixture loads,
    a scenario may fail on something real that has been invisible behind
    the load error for two weeks. That is a SEPARATE defect this parcel has
    surfaced: record it with evidence and raise it, do not fix it here and
    do not weaken an assertion to make this parcel look clean. This is the
    single most likely way the slice blows past one sitting.
  - Changing any file under swarmforge/scripts/. The dependency graph is
    correct as it stands; the fixture's copy of it is what is wrong. A fix
    that edits a .bb file to avoid a load-file has misread the defect.
  - Replacing the copy-a-named-list fixture mechanism with a whole-directory
    copy, a symlink farm, or a classpath. That may well be the better
    long-term design, but it changes the isolation properties of four step
    handlers at once and is a separate, larger ticket. This slice keeps the
    mechanism and makes the list honest.
  - Extending the closure check to other fixture file lists elsewhere in
    specs/pipeline/steps/. Generalising is a follow-up once this one has
    proven itself on the list that actually broke.

qa_e2e_procedure: >
  From the repo root on the live swarm host:

  1. Reproduce at the commit before the fix:
     `node specs/pipeline/cli.js specs/features/BL-647-rotation-router-liveness.feature`
     and confirm 7/7 fail with FileNotFoundException naming
     mono_router_lib.bb at handoff_lib.bb:30. Repeat for
     BL-368-control-loss-is-not-agent-death.feature (expect 4/4 fail) and
     BL-359-always-on-operator-presence.feature (expect 5 pass / 2 fail).
  2. At the parcel commit, re-run all three and confirm every scenario that
     failed for this reason now reaches its own assertions. Report the
     counts. If a scenario now fails on a DIFFERENT, genuine assertion,
     that is the constraints section's surfaced-defect case: it does not
     make this parcel fail, but it must be raised as its own ticket with
     evidence, and QA should say so explicitly rather than passing silently
     over it.
  3. Run this ticket's own feature and confirm 6/6 (scenario 02 is an
     outline over three rows).
  4. Confirm the guard is where it will actually run: the closure test must
     be under `extension/test/` and must execute as part of the standing
     extension suite (`npm test` from `extension/`), not only when invoked
     by name. A guard under `specs/pipeline/test/` is a fail - no standing
     gate runs that directory.
  5. Prove the guard bites, by hand and then revert: delete one entry from
     OPERATOR_RUNTIME_BB_FILES, run the extension suite, confirm exactly
     one test fails and that its message names the deleted file. Restore
     the entry with `git restore` and confirm the suite is green again.
  6. Confirm invariant 1 end to end: build a fixture root from the
     post-fix list only, run `bb <root>/swarmforge/scripts/operator_runtime.bb
     <root> --tick-once`, and confirm no FileNotFoundException naming a
     `.bb` file appears in the output. Use a throwaway root under the
     worktree's own ./tmp, never the live project root.
  7. `git show --stat` on the parcel commit: expect the fixture list, the
     new guard test, this ticket's feature file and step handler, and
     nothing under swarmforge/scripts/.

notes: >
  Source: surfaced by the coder while regression-testing BL-817, recorded
  in `backlog/evidence/BL-817-surfaced-defect-not-fixed-20260819.md` (in
  the coder worktree at the time of writing) and raised to the specifier
  and coordinator by priority-00 note rather than silently patched inside
  an unrelated parcel - the same disposition as BL-937 and BL-938. That
  judgement was correct and this ticket exists because of it.

  Two things the specifier's probe changed from the report as filed:

  - Scale. The report named one missing file; the closure walk found seven.
    A fixture built from the list plus only the reported file was measured
    failing on the next one.
  - Attribution. The report attributed the breakage to BL-931 landing
    earlier the same day. `git log -S mono_router_lib.bb` on handoff_lib.bb
    dates the load-file to BL-805 (4a01bec09, 2026-08-05), and the fixture
    list's last commit is ca30ddebd (2026-07-27). The window is fourteen
    days, not one, which is why the "same-day side effect" framing should
    not be carried forward into the fix.

  Neither correction is a criticism of the report - both were only visible
  by walking the closure, which is precisely the work this ticket makes
  permanent.

  BL-817 itself is unaffected and must not be blocked on this: the coder's
  evidence establishes the failure occurs inside the `--tick-once`
  subprocess at Babashka load time, strictly after BL-817's own `track()`
  calls have already run in the parent process.

approval_context: >
  One thing wants your judgement.

  Scenario 03 - what to do about a listed file the closure never reaches.
  I have specified that an unreachable entry must either be dropped or
  explicitly declared as needed by some non-load-file mechanism, and today
  that is exactly one file, `operator_ask.bb`. I verified none of the four
  consumers spawn it from the fixture root, so dropping it is very probably
  correct and harmless. But it has sat in the list since BL-486 deduped
  three copies of it in July, and I would rather the strict check be a
  deliberate choice than a surprise: if you would prefer the guard only
  catch MISSING files and stay silent about extras, say so and I will drop
  scenario 03. The missing-file half is the defect; the extras half is the
  hygiene I am proposing alongside it.

  Also flagging, not asking: step 2 of the QA procedure may well turn up a
  real assertion failure that has been hidden behind the load error for two
  weeks. I have written that up as a separate ticket rather than part of
  this parcel, because folding it in would turn a one-sitting fix into an
  open-ended one.
