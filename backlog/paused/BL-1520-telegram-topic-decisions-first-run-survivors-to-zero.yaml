human_approval: approved
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options; the budget question for the
  three large files lives on BL-1519. FIRM: survivors are killed by tests
  of externally visible behaviour (which action a decision function
  returns for which input, which chat or principal a message is judged to
  come from), never by asserting a constant's literal for its own sake;
  an accepted equivalent carries the code-level reason and the grep over
  every consumer (BL-234, the union-tag rule); no mutant is suppressed and
  no manifest is hand-edited.
  CONSOLIDATED 2026-09-21 by the specifier on the human's morning sweep
  directive: BL-1521 (the negotiation relay and routing files, approved
  2026-09-10 in the same batch) is absorbed here - identical fix shape,
  same census file, same evidence structure, same epic, 41 mutants
  together, one sitting. Its FIRM lines carry over unchanged: a message
  constant is killed by a test asserting the text the operator actually
  reads through the relay's render path (a `StringLiteral -> ""` mutant on
  operator-facing text is behaviour, not trivia); a regex-alternative
  mutant is killed by an input that one alternative matches and the
  mutant does not, or is recorded as an accepted equivalent with the
  inputs that prove no observable difference (BL-234). Both halves were
  approved separately by the human and nothing unapproved was added, so
  the approval stands (no re-pend, BL-1455).

invariants:
  - "Every mutant Stryker reports for any of the three files at the parcel commit is either killed by a test in the unit suite or recorded in the evidence as an accepted equivalent with the code-level reason; none is silent."

description: |
  ## What is wrong

  On 2026-09-10 BL-1441 ran the Stryker gate BL-620 deferred on
  2026-08-19 over BL-620's file set and discharged the ledger row on a
  completed run (`backlog/evidence/BL-1441-BL-620-mutation.md`, hardender
  tip 5112a3fa5b). It was the first mutation run ever over
  `out/tools/telegramTopicDecisions.js`: 234 mutants, 208 killed, 26
  survived, 0 no-coverage, score 88.89%. The discharge names each survivor
  with the covering-test count that failed to catch it, and the
  specifier's ruling on the hardender's rule proposal of the same day is
  that such a discharge is legitimate only when a ticket owns the
  survivors. This is that ticket for this file.

  The 26, by enclosing declaration (census
  `backlog/evidence/BL-1519-first-run-survivor-census-20260910.md`):
  decideEnsureApprovalsTopicAction 8, decideEnsurePipelineBoardTopicAction
  4, isFromPrincipal 3, isFromMyChat 3, messageTextOf 2,
  decideEnsureResidentSpyTopicAction 2, and one each on
  DEFAULT_SUBJECT_KEY, BABYSITTER_SUBJECT_ID, BABYSITTER_TOPIC_NAME and
  PIPELINE_BOARD_SUBJECT_ID. Three test files reference the module today.

  The same day, BL-1441 ran the gate BL-955 deferred on 2026-08-19 and
  discharged that row too (`backlog/evidence/BL-1441-BL-955-mutation.md`,
  same hardender tip): the first mutation run ever over
  `out/onboarding/negotiationTelegramRelay.js` (61 mutants, 57 killed, 4
  survived, score 93.44%) and `out/onboarding/negotiationTelegramRouting.js`
  (86 mutants, 75 killed, 11 survived, 87.21%); neither had a no-coverage
  mutant. The 15, by enclosing declaration (same census file): relay -
  CONTRACT_AGREED_MESSAGE, ROUND_LIMIT_MESSAGE, CLARIFY_INTENT_MESSAGE,
  COULD_NOT_DERIVE_CHANGE_MESSAGE, one each; routing -
  AMBIGUOUS_INTENT_PATTERN 6, AGREEMENT_PATTERN 4, renderBulletList 1.
  Three and two test files reference the modules. (Absorbed from BL-1521.)

  ## What changes

  - ONE run is repeated over the FULL unit suite, `--mutate` scoped to the
    three compiled files (BL-620's row used a 17-file include set and
    BL-955's a 9-file one, so a survivor there may already be killed by a
    test outside it); the evidence records the include set used, one
    summary block per module, load and duration, and per module either
    zero survived and zero no-coverage, or one accepted-equivalent record
    per remaining survivor with the code-level reason and the consumer
    grep or the inputs that prove it (BL-234).
  - Behaviour tests kill the rest: a decision function's returned action
    for the inputs that distinguish each surviving branch or literal; the
    principal and my-chat predicates on messages that differ only in the
    mutated field; the exported constants through the call that consumes
    them, not by pinning the literal; each relay message constant through
    the relay call that sends it, asserting the text; each routing pattern
    through the routing decision, with one input per alternative the
    mutant drops or widens; renderBulletList through its rendered output.
  - The evidence lists, per function in the census for each file, the
    test file and case that now rejects its mutants (scenario 02), and for
    each of the four message constants the test file and case that asserts
    its text (scenario 03).
  - Evidence path: `backlog/evidence/BL-1520-front-desk-telegram-first-run-mutation.md`
    (one file, one summary block per module).

  ## How (direction, not mandate)

  - `--mutate` scoped to `out/tools/telegramTopicDecisions.js`,
    `out/onboarding/negotiationTelegramRelay.js` and
    `out/onboarding/negotiationTelegramRouting.js`, `perTest`, sibling
    links per the Verification rules; check `mutation_cooldown_gate.bb`
    first for each file (20 and 22 days quiet at mint) and record its
    decisions. A constant whose only reader is another module may need
    its test on that reader; say so in the evidence.
  - Documenter: nothing beyond the evidence file; no diagram trigger fires.

constraints: >
  Tests only unless a seam is missing, in which case the smallest
  extraction that exposes the behaviour to an in-process test. Never
  `process.chdir()` under mutation; never a hand-edited manifest. The step
  handler lands with the feature (BL-233).

out_of_scope: |
  - The other files of BL-1441's runs - telegramFrontDeskBotCore.ts (the
    third file of BL-955's set), transcriptWalker.ts (BL-1523) and the
    large board files (BL-1519's ruling).
  - Any change to what the decision functions decide, to the message
    texts, or to what the patterns accept.

qa_e2e_procedure: |
  1. The BL-1520 feature passes (outline 01 x3, scenarios 02 and 03).
  2. `backlog/evidence/BL-1520-front-desk-telegram-first-run-mutation.md`
     shows one completed Stryker run over the full unit suite with a
     summary block per module - at least 230 mutants on
     telegramTopicDecisions, 60 on the relay and 85 on the routing file -
     zero no-coverage, and per module either zero survived or one
     accepted-equivalent record per survivor with its grep or proof.
  3. Every function named in the census for each of the three files
     appears in the evidence with the killing test file and case; each of
     the four relay message constants appears with the test that asserts
     its text.
  4. `npm test` from `extension/` is green.

