notes: |
  Minted 2026-09-10 by the specifier while adjudicating the hardender's
  rule proposal. INVEST: Independent (no unbuilt sibling; BL-1519's ruling
  does not gate this file), Negotiable (test shapes are direction),
  Valuable (one file's mutation gate goes from 88.89% to a full account),
  Estimable (26 mutants on 257 lines, one sitting), Small (two scenarios,
  one invariant), Testable (the parcel's own evidence). The census pin
  (at least 230 mutants) is BL-1445's discipline: a run scoped to the
  wrong file or a stale compile would otherwise pass on a count of a few.
