id: BL-1098
title: "A merge can put a path back to a superseded state with no commit crediting the change: BL-973's landed fix was reverted that way three times in 24h and restored by hand twice inside one landing, and BL-855's no-op gate is blind to it because the merge took plenty - just not that path"
type: defect
severity: high
# high, not critical: nothing is lost right now (local main holds the correct
# content for every path named below and is 10 commits ahead of origin, so the
# next push repairs origin/main), and the pipeline keeps moving. But this is a
# live fault that has already destroyed landed, QA-approved work three times
# inside 24 hours, is invisible to `git log -- <path>`, and its only defence
# today is a reviewer noticing an acceptance suite drop from 13/13 to 7/13.
status: todo
epic: swarm-reliability
assigned_to: coder
priority: 3
direction: swarm-surfaced
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1098-silent-revert-of-landed-content.feature

invariants:
  - "The verdict is computed from git objects alone - commits, their parents, their trees and their blobs - and never from the working tree, so the shared, chronically-dirty, hot-synced master checkout cannot change the answer."
  - "A path whose tip content matches the newest non-merge commit that authored it is never flagged, whatever its merge history looks like. Measured over the last 60 merges on main: all 27 pipeline stage merge-ups are clean under this rule, while a naive 'a one-sided change was discarded' rule flags 22 of the 60 - including 6b9e7d7801, the deliberate reconcile that was repairing this very defect."
  - "The check's cost is bounded by the paths that merges in the pushed range touched, never by the size of the tree - one authoring-commit lookup per candidate path, not ~1400 per tick on a daemon that already reads as dead when a check runs long (BL-1086)."

required_wiring:
  - "swarmforge/scripts/push_sweep_lib.bb::silent-revert::the sweep's per-commit decision path is the ONLY live chokepoint between a landed merge and origin. A predicate that is fully unit-tested but never consulted here leaves e9c592cc79's exact path open and the ticket's value at zero. BL-855's :noop-merge-gate-facts! adapter is the precedent shape to follow; the reason keyword must be distinguishable from :noop-landing-merge in the sweep's own log line."
  - "specs/pipeline/steps/index.js::bl1098::the acceptance runner throws on any scenario lacking a step handler, so this ticket's handlers must be registered in the same parcel as the behaviour (BL-233). Substring anchor only - the handler file's exact name is the implementer's call."

human_approval: pending
approval_context: >
  One genuine ruling is needed and it is not the predicate: should a detected
  silent revert REFUSE the push, or only alarm and let it through?

  BL-855's sibling gate refuses, and the symmetry argues for refusing here
  too. But that gate fires on a shape nobody produces deliberately, whereas
  this one sits on a path the swarm walks every heavy cycle, and a
  false-refusing gate wedges origin behind main until a human intervenes. The
  measured false-flag profile is good but not zero: on a healthy main, 3 of
  200 sampled code paths hold content their newest authoring commit did not
  write (see notes) - some of those are almost certainly older instances of
  this same defect, but at least one is a deliberate hand-resolution at a
  merge. Refusing on those stalls the sweep; alarming on them does not.

  The spec is written for REFUSE (scenarios 01, 02, 05) because that is the
  safe default and matches BL-855. Reply "alarm only" to flip it and the
  specifier will amend the feature file before the coder starts.

  Nothing else here needs a decision: the defect, its three occurrences and
  the measurements are all agent-surfaced from git objects.

source: |
  QA `note` 000934 to the specifier, 2026-08-23T03:22:44Z: "Merges silently
  revert landed code (BL-973 x2) - see cd165925b/75e764f msg". The two commits
  are QA's own hand-restores, made inside a single BL-1083 landing:
  `75e764f4fe` (restored 4 files the merge had dropped outright) and
  `cd165925b` (restored 3 more it had put back to their pre-BL-973 content).
  The specifier re-probed the claim against git objects before speccing and
  found it materially different in mechanism from QA's own write-up, and
  broader in extent - see description.

description: |
  ## What QA reported, and what the objects actually say

  QA's commit messages attribute the loss to its own merge of `origin/main`:
  "the merge's automatic resolution favored origin/main's stale copy over
  HEAD's newer one with no conflict reported." That reading is wrong, and it
  matters, because a gate built on it would guard the wrong hop.

  For all three files `cd165925b` restored, the three-way inputs to QA's merge
  `75e764f4fe` were:

      path: specs/pipeline/steps/bl814LiveRoleHeldLoudDegradeSteps.js
        merge-base 4cfb08113a  c2df3d3d   <- BL-973's content
        ours       0a3fb5a36a  c2df3d3d   <- unchanged since the base
        theirs     59b7f59943  795179e1   <- changed
        result                 795179e1

  Ours never touched the path; theirs did. Git took theirs. **That merge is
  correct** - it faithfully propagated a revert that had already happened
  upstream. The damage was done earlier, on `main` itself.

  ## The actual mechanism: content no commit authored

  `e556eca1b` ("BL-973: copy-lists follow the real load-file closure") is an
  ancestor of `origin/main`. No commit after it authored that path. Yet
  `origin/main` holds a blob that `a55b5156b` - an EARLIER commit - authored.
  `git log --oneline origin/main -- <path>` reports nothing between the two,
  because the only commits that touched the path are merges, which default
  history simplification hides. Under `--full-history` the truth appears:

      59b7f5994  Merge origin/main into main (BL-891 reconcile)      -> OLD
      37efb07e3  Merge remote-tracking branch 'origin/main' (BL-891) -> NEW
      e57ff6406  Merge remote-tracking branch 'origin/main'          -> OLD
      689b50176  Merge remote-tracking branch 'origin/main'          -> NEW

  A sawtooth. Each reconcile merge that resolves toward the stale side
  re-reverts landed work; the next one puts it back. Three reverts and three
  restores of the same content inside 24 hours, none of them recorded by any
  commit, none reviewed, none with an author or a message. `e9c592cc79`
  (currently `origin/main`) re-reverted QA's `cd165925b` restore a third time,
  hours after QA made it.

  So the signature is not "a merge discarded a one-sided change" - it is
  **the tip holds content that no commit authored**: a blob some EARLIER
  commit wrote, while a LATER commit wrote different content and nothing
  records the change back. The deletion case is the same fault with the blob
  absent: `specs/pipeline/steps/lib/bbFixtureClosureGate.js` and
  `bl973CopyListsClosureDerivedSteps.js` are simply missing from
  `origin/main` with no delete commit against either path.

  ## Why BL-855's gate does not see it

  `noop-landing-merge?` fires only when the merge's tree is byte-identical to
  its first parent's. None of these merges are: `e57ff6406` differs from
  parent1 on 21 paths, `59b7f5994` on 43. They took plenty. They just also
  put a handful of paths back. BL-855 pinned the merge that takes NOTHING;
  this is its harder sibling.

  ## Why the obvious predicate is the wrong one (measured)

  "Flag a merge that discarded a change only one side made" is the intuitive
  rule and it does catch every file QA restored. It also flags **22 of the
  last 60 merges on main**, and one of those 22 is `6b9e7d7801` - the current
  tip, a deliberate reconcile that discarded 21 one-sided changes from
  `origin/main` and was RIGHT to discard every one of them, because each was
  stale. A gate that refuses the commit repairing the defect is worse than no
  gate. Article 4.4's own reasoning applies: a gate that cries wolf gets
  switched off.

  ## How (direction, not mandate)

  The discriminator that separates the two, verified against both the damaged
  ref and the correct one:

      L = newest non-merge commit reachable from <ref> that changed <path>
          (git log -1 --no-merges --full-history <ref> -- <path>)
      flag when <ref>:<path> != L:<path>

  Sharpen it by asking WHICH blob the tip holds: if it equals a blob an
  earlier commit authored, the tip has resurrected a superseded state - a
  revert nobody wrote. If it matches no authored state, a merge hand-blended
  the sides, which is legitimate (QA's own union of both `index.js` require
  lists in `75e764f4fe` is exactly that) and should not refuse.

  Run against the six paths QA had to restore, this says OK on all six on
  `main` and RESURRECT/absent on all six on `origin/main`. Run against the
  tip merge's 21 discarded paths, it says OK on all 21. Scope it to the paths
  that merges in the pushed range touched and it costs one lookup per
  candidate path.

  Whatever the final predicate, the refusal must hand back what a restore
  needs - the path, the commit that authored the content the tip is missing,
  and the merge at which the path stopped matching it - rather than a bare
  status (BL-572/BL-662).

qa_e2e: >
  1. Build a fixture repo (no live state): commit file X, branch, land a
  second commit changing X on the branch, merge the branch into main taking
  main's side for X only, so main's X equals the first commit's blob while the
  second commit is an ancestor. Confirm `git log --oneline main -- X` hides
  the merge and `--full-history` shows it.

  2. Point the sweep at that repo with origin behind main. Assert it refuses,
  and that the refusal names X, the second commit, and the merge.

  3. Delete-shaped variant: repeat with the merge dropping X entirely and no
  delete commit against the path. Assert the same refusal.

  4. Silence check, correct reconcile: build the mirror case - main's X
  matches the NEWER authoring commit and the merge discarded the older blob
  the other side offered. Assert the sweep pushes.

  5. Silence check, live history: run the finished predicate over the last 60
  merges on this repo's `main`. Assert every stage merge-up (coder->cleaner->
  architect->hardender->documenter->QA) passes clean, and that `6b9e7d7801`
  passes clean.

  6. Regression proof against the real incident: run it against `origin/main`
  at `e9c592cc79` and assert it flags all six paths QA restored by hand
  (`bl814LiveRoleHeldLoudDegradeSteps.js`,
  `bl487BoardFreshnessWithoutCoordinatorSyncSteps.js`,
  `readLiveRoleHeldTicketsCli.test.js`,
  `bl973CopyListsClosureDerivedSteps.js`, `lib/bbFixtureClosureGate.js`,
  `bl1043StartupGraceSteps.js`).

  7. Dirty-tree proof: repeat step 2 with uncommitted edits to X in the
  working tree; the verdict must not move.

