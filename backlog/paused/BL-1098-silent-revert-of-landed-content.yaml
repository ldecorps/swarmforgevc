  Live findings from the probe, recorded so nobody re-derives them:

  - Local `main` is 10 commits ahead of `origin/main` and holds the CORRECT
    content for every path named above. The next push repairs origin. No
    manual restore is needed today.
  - Sampling 200 tracked code paths on `main`, 4 hold content their newest
    authoring commit did not write. 3 of those 4 are resurrections of a
    superseded blob (`extension/src/bridge/contextTelemetryGate.ts`,
    `extension/test/reworkRounds.property.test.js`,
    `specs/pipeline/steps/bl451RetirePwaRecertViewSteps.js`); the 4th
    (`extension/test/emitFleetStatusCli.test.js`) matches no authored state
    and is a merge hand-blend. Extrapolated, ~20 paths repo-wide are in one
    of these two states RIGHT NOW. Whether the three resurrections are older
    instances of this defect or benign is not settled here and is not this
    slice's job - once the predicate exists, one sweep answers it. If it
    turns out they are damage, that is a follow-up ticket, not scope creep
    into this one.
  - The 22-of-60 and 27-of-27 figures in the invariants come from probing
    every merge in `git rev-list --merges --max-count=60 main`.
