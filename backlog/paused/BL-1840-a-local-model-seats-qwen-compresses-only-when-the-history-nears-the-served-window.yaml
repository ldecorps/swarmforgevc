description: |
  ## What happens

  - qwen's session record for coder@iq3 (session 992f20dc) holds three
    `chat_compression` events at 12:59:17, 13:04:08 and 13:09:24Z, each
    `triggerReason: token_limit`, e.g. originalTokenCount 17539,
    newTokenCount 17459.
  - qwen's usage record shows the matching requests: 8,429, 5,992 and
    6,739 output tokens (3,060 / 1,243 / 1,764 of them reasoning). The
    recorded replies between them are 120-500 characters.
  - At 24 tokens/s that is ~5 minutes per turn, spent on compressions
    that save ~80 tokens each.
  - Why it fires at ~17.5k in a 49152 window is part of the work: qwen
    0.22.2's compression threshold, and the window it believes, are
    set in its settings (`chatCompression`), and nothing the swarm writes
    sets them.

  ## What is wanted

  1. The seat's qwen settings compress only above 80% of the served
     window: 26214 tokens at 32768, 39321 at 49152 (scenario 01).
  2. Proven against qwen itself: the pinned qwen, run in the seat's
     worktree with the written settings, sends no compression request
     for a 20,000-token history at 49152 (scenario 02).

  ## How (direction, not mandate)

  - Extend BL-1838's `write_local_model_qwen_settings`. Find the key in
    qwen 0.22.2's own settings schema (`qwen --help`, the bundled
    settings schema), not from memory.
  - Step handler `specs/pipeline/steps/bl1840QwenCompressionThresholdSteps.js`,
    registered in `specs/pipeline/steps/index.js` in the same commit as
    the feature's first green run (BL-233). Scenario 02 runs qwen with a
    throwaway HOME against a loopback fake OpenAI endpoint that counts
    requests (BL-1829's method); measure its runtime and state it in
    the evidence. It must fit the per-mutant ceiling (300 s, BL-1541).
    Never the live Ollama, never the operator's ~/.qwen.

  ## Scope

  `swarmforge/scripts/swarmforge.sh` (the settings writer), its shell
  test, the step handler and its registration, evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1840-a-local-model-seats-qwen-compresses-only-when-the-history-nears-the-served-window.feature`:
     3 of 3 ok (two rows of 01, then 02). Measured 0 on main at mint: no
     handler exists yet.
  2. `bash swarmforge/scripts/test/test_bl1829_local_model_qwen_settings.sh`:
     ALL PASS (measured on main 7f38e5d7fe at mint).
  After the land (the coordinator's check on the next coder@iq3 session,
  not QA's): the session's `chat_compression` events, if any, all show
  originalTokenCount above 39321.

