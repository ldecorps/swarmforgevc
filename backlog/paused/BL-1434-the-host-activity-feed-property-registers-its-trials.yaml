id: BL-1434
title: "hostActivityFeed.property.test.js (BL-833) is a bare node script with no test registration, so the property lane reports no suite found and its forty trials have never run under the suite; the register attributed it to BL-1206, whose fix never touches it, so the row orphans when BL-1206 closes; the file registers its trials with vitest, passes alone, still refuses an invented line, and its register and allowlist rows leave with the green"
milestone: M8
type: defect
severity: high
# high: a standing red on main with no valid owner once BL-1206 closes,
# which is a broken safety signal under the standing-red rule (2026-09-05,
# Article 3.2.4). The red itself is contained: BL-833's feed is exercised
# by nothing in the suite until this lands.
status: todo
epic: code-quality-gates
priority: 3
direction: swarm-reported
