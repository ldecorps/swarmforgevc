description: |
  ## What is wanted

  - Each babysitter sweep reads every local-model seat's state with
    BL-1842's `seat-state` (generating, idle, down).
  - A seat that has read as down continuously for ten minutes or more gets
    one email through BL-2045's command, event "down". It gets no second
    down email for the same outage.
  - A seat whose down email was sent and that now reads as idle or
    generating gets one email, event "recovered", which ends the outage.
  - These two emails are bounded per outage as above, not by BL-2045's
    thirty-minute bound for hand-sent events: a hotfix email sent minutes
    earlier never suppresses a down or recovered email.
  - The first-seen-down time and the outage record are kept per seat under
    `.swarmforge/operator/`, so a babysitter restart does not resend.

  ## How (direction, not mandate)

  - Call BL-2045's in-process send function from the sweep, never a shell
    of the CLI per seat per sweep, and never a second rendering of the
    report.
  - Keep the decision pure (state history in, action out) beside BL-2045's
    function, and feed it from `babysitter_check.bb`'s existing sweep;
    babysitter_check.bb is large, so read it by grep and line ranges.
  - The step handler drives the decision and the send with a fake clock
    and a capturing post function, in a mkdtemp fixture (BL-1390).

