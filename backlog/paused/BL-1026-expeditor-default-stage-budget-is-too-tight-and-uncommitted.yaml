id: BL-1026
title: "the expeditor's default per-stage budget of 45 minutes killed a coder stage that was producing work the next run reused, and the raise that fixes it exists only as an uncommitted edit in the shared master checkout"
milestone: M8
type: defect
severity: high
# high, not critical: nothing was lost and --stage-timeout-ms works around it,
# so the swarm is not down. But committed main still carries the 45-minute
# default - every worktree and every fresh checkout still has the fault - and
# the only thing holding the fix is an uncommitted working-tree edit in the
# checkout every role shares. The standing remedy for an unexplained
# master-checkout change is `git restore`, which would silently reinstate the
# fault; an unrelated `git add -A` would sweep it into someone else's commit.
status: todo
epic: swarm-reliability
priority: 70
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1026-the-expeditor-states-its-stage-budget-once.feature

human_approval: approved
approval_context: >
  One number needs a ruling: 90 minutes. What is FIRM is that 45 was too
  tight - run 1 of the BL-1021 expedite killed a coder stage at the budget
  while it was producing work run 2 then reused, so the kill cost a stage
  and bought nothing. What is NOT established is that 90 is right. Run 2's
  coder stage did finish inside it, but it started from run 1's checkpoint,
  so a from-scratch coder stage has never been measured against 90. 90 was
  picked by hand mid-run as twice the old value, with no recorded rationale.
  Confirm 90, name a different number, or say the wall-clock model itself is
  the wrong shape (see notes) and this slice should only land the mirror
  gate.

invariants:
  - "Raising the default never disarms the valve: a stage past whatever the budget is is still killed, and the boundary is >= not >."
  - "Every place the expeditor states its default per-stage budget states the same value as the code, and the check that proves it fails when one of them is changed."

source: |
  Surfaced by the coordinator to the specifier, 2026-08-21 20:50, as an
  uncommitted change on master with no ticket: "Timeout bump uncommitted on
  master, no ticket - own it?"

  Provenance established from the run logs, not assumed. Run 1 of the
  BL-1021 expedite (.swarmforge/expedite/BL-1021-launch.log) ended:

      "history": [ { "stage": "specifier", "verdict": "pass" },
                   { "stage": "coder", "verdict": "fail",
                     "reason": "stage-timeout" } ]

  The coder stage started after the specifier stage finished at 17:29 and
  was killed at 18:15 - the 45-minute budget, to the minute. The default was
  then raised to 90 minutes across all five sites at 20:11, and run 2
  (BL-1021-relaunch.log) passed all seven stages.

  That the killed stage was PRODUCTIVE is on the branch, not inferred:
  ed8a915f7 "BL-1021: checkpoint coder WIP before re-expedite (pipe EOF wait
  bound)" preserved run 1's coder work, and 756d301d8 "BL-1021: re-tense the
  spec for run 2 - the checkpoint exists, do not rebuild" is run 2 reusing
  it. The budget killed a stage that was working, and the work survived only
  because the worktree outlived the process group, not by design.

  The raise is still uncommitted. `git status` on master shows five modified
  files; `git log` on main shows the 45-minute default.

description: |
  ## What happens

  `default-stage-timeout-ms` (expedite_lib.bb) is the expeditor's only
  self-observation. The comment above it says why it must exist: by stopping
  the stack the expeditor kills the babysitter and the Operator - "the two
  processes that would otherwise notice it wedging. It has deliberately
  killed its own watchdog, so it must observe itself."

  It is a pure wall-clock budget, and the CLI ENFORCES it by killing the
  stage's whole process group (`sh-bounded`); `:overrun?` is only a second
  signal for a stage that returned on the boundary. So the budget cannot
  tell a wedged stage from a working one - and at 45 minutes it did not.

  ## Why this is not just "commit the diff"

  Two things make this a ticket rather than a stray edit to tidy away.

  First, committed main still carries 45. Every `.worktrees/*` checkout has
  it, and so would any fresh clone. The fix currently exists as an
  uncommitted edit in the checkout every role shares - the exact state the
  master-checkout discipline rules exist to prevent, and one `git restore`
  away from silently reverting a live behaviour change.

  Second, the value is stated in FIVE places and nothing gates them:

  - `swarmforge/scripts/expedite_lib.bb` - the constant itself
  - `swarmforge/scripts/expedite_cli.bb` - usage comment
  - `swarmforge/scripts/expedite.sh` - usage comment
  - `docs/reference/BL-567-expeditor-manual.md` - "`5400000` (90 min)"
  - `docs/how-to/BL-567-expedite-one-ticket-with-the-swarm-stopped.md` -
    "(default 90 min)"

  The one test that touches the default is self-referential:

      (assert= "15: the default budget applies when none is given"
               expedite-lib/default-stage-timeout-ms
               (:timeout-ms (stage-timeout-verdict {...})))

  It asserts the constant against itself, so it passes for any value and
  says nothing about the four prose mirrors. This is a constant
  hand-mirrored across a boundary no import can bridge, with no gate - the
  shape the engineering guardrail names, and drift here would be silent.

  ## How (direction, not mandate)

  - Land the raised default so committed main and the running behaviour
    agree.
  - Give the mirrors a gate that fails when one of them disagrees with the
    code, and make the gate provably non-vacuous - a check that cannot go
    red is not a check, which is what test 15 already demonstrates.
  - Prefer deriving the documented value from the code, or comparing
    against it, over asserting a second hardcoded literal in the test.
  - Do not weaken the valve while raising it. A stage past the budget must
    still be killed, and the boundary must stay `>=`.

  ## Scope

  - swarmforge/scripts/expedite_lib.bb - the default constant
  - swarmforge/scripts/expedite_cli.bb, swarmforge/scripts/expedite.sh -
    the usage comments
  - docs/reference/BL-567-expeditor-manual.md,
    docs/how-to/BL-567-expedite-one-ticket-with-the-swarm-stopped.md
  - swarmforge/scripts/test/expedite_lib_test_runner.bb - test 15 is
    vacuous with respect to the value; it is in scope to fix
  - specs/features/BL-1026-the-expeditor-states-its-stage-budget-once.feature
    and its step handlers

  Out of scope: making the budget progress-aware. That is the deeper
  question this incident raises and it is deliberately not this slice - see
  notes for its owner and trigger. Also out of scope is anything else the
  expedite run left behind; BL-1024 owns the parked tickets and staged
  moves, BL-1023 the run ticket's move, BL-1025 the approved-commit reading.

qa_e2e_procedure: >
  1. At the parent commit, confirm the fault: `git show
     HEAD:swarmforge/scripts/expedite_lib.bb | grep default-stage-timeout-ms`
     reports 45 minutes, and the mirror check either does not exist or
     passes while a documented site says something else. Confirm the absence
     before confirming the presence.

  2. At the parcel commit, confirm the value actually moved: the constant
     reports the approved budget (90 minutes unless the approval names
     another), and all four prose mirrors say the same. This is the one
     place the number is checked by hand - the feature file deliberately
     never names it.

  3. Drive `stage-timeout-verdict` with a pinned clock for each row of
     scenario 01: no explicit budget just under / exactly at / well past the
     default, then an explicit budget shorter than the default with the
     clock past that but still under the default. Confirm false / true /
     true / true, and that the fourth reports the EXPLICIT budget - if it
     reports the default, the override is broken.

  4. Run the mirror gate and confirm it passes. Then change ONE documented
     site to a different value in the working tree, re-run, and confirm it
     FAILS naming that site. Restore it. A gate that passes both times is
     vacuous and the ticket is not done - test 15 is already an example of
     exactly that.

  5. Confirm the working tree is clean afterwards: `git status` in the
     master checkout must show no lingering modification to the five sites,
     because the parcel now carries the change (see notes).

notes: |
  ## Reconciling with the uncommitted copy on master

  The raise is already live in the master checkout's working tree. The coder
  implements it in `.worktrees/coder` as normal. When the approved commit
  later reaches the master checkout, `git merge` will REFUSE to touch those
  five files while they carry local modifications, even though the content
  is identical. The remedy at that moment is `git restore -- <the five
  paths>` in the master checkout first: the committed version has the same
  content, so nothing is lost. Whoever merges should expect this rather than
  discover it. Until then the working-tree edit is left in place
  deliberately - it is the live mitigation, and reverting it now would
  reinstate the 45-minute budget for any expedite run in the meantime.

  ## The deeper question, with an owner and a trigger

  A wall-clock budget cannot tell a wedged stage from a working one, and
  this incident is that distinction being got wrong. Making it
  progress-aware is deliberately NOT scoped here: the valve exists precisely
  because the expeditor has killed its own watchdog, and a progress signal
  that can itself wedge is a worse valve than a blunt one. Owner: the
  specifier. Trigger: the next time a stage is killed by this budget while
  demonstrably producing work. If that happens, the number is not the
  defect and a ticket for a progress-aware budget is warranted; if it does
  not happen, the blunt budget is right and no ticket is owed. Recording
  both branches so this does not decay into "someone should look at it".

  ## No required_wiring, deliberately

  The mirror gate's call site IS the acceptance contract - scenarios 02 and
  03 fail end to end if the gate is never run, so the feature file already
  gates it. Declaring a wiring entry here would mean pinning a function or
  file name that does not exist yet, which is the BL-874 failure mode.

  ## IR-DRY reviewed, not merely run

  The first draft scored 7 findings on 14 unique steps, and one at 0.8 was
  real: scenario 01 used relative durations ("just under the default
  budget") while a separate explicit-budget scenario used absolute ones ("6
  minutes"), so one step had two spellings. That was accidental drift, and
  it revealed the deeper problem - the two scenarios were the same behavior
  parameterized by which budget is in force. Collapsing them into one
  Scenario Outline with a `budget` column dropped four findings at once and
  removed the last minute-literals from the file. The ceremonial
  `Background: Given the expeditor's per-stage budget` went with it: it was
  a topic sentence, not setup, and scenarios 02 and 03 do not act on a
  stage at all.

  One finding remains at 0.462 and should NOT be "fixed": "every place ...
  is read" against "one place ... is changed to a different budget". They
  share vocabulary because they act on the same set, but one reads it and
  the other mutates it - that opposition is exactly what makes scenario 03
  a vacuity check rather than a restatement of scenario 02.

  ## Sibling relationship

  Fourth ticket out of the BL-1021 expedite run, and independent of the
  other three. BL-1023 (the run ticket's move), BL-1024 (the run naming its
  leavings) and BL-1025 (approved commits read as a QA bypass) are all about
  what the run says or does at its edges. This one is about a constant the
  run enforces in the middle. None blocks any other.
