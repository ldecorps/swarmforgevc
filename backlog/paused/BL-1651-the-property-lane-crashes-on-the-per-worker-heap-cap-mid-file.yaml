human_approval: approved
approval_context: >
  A new feature file is authored here, so it would ordinarily need a tap;
  it is minted approved under the 2026-09-17 operator hotfix (severity
  defect, no choice posed, no ruling_options). FIRM: the lane keeps its
  fork pool and per-worker cap posture (BL-871) - a crash is turned into a
  named, deterministic per-file failure, never into an unbounded heap.
  FIRM: measurement is ONE run of the lane with heap logging, committed as
  a census; the ticket never asks anyone to run the lane N times. FIRM:
  offenders above the ceiling are fixed here only when the fix is a
  retained-reference release of a few lines; anything larger is owned by
