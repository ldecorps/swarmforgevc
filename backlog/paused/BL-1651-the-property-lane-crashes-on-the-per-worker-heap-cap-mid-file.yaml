invariants:
  - "A property file that exceeds its heap ceiling fails as that file, by name, with its peak heap in the report; it never takes the worker or the lane down with it."
  - "The per-worker heap cap the lane spawns with is derived from this host's memory and the resolved fork count so that forks times cap never exceeds the host's available memory at spawn, and the derivation is printed once per run."

description: |
  ## What is wrong

  `npm run test:properties` runs `vitest.properties.config.mjs`: 424
  `*.property.test.js` files, `pool: forks`, `maxForks: WORKER_POOL_SIZE`
  (BL-871's static ceiling; a 20-core host resolved forks=12), each fork
  spawned with `--max-old-space-size=PER_WORKER_HEAP_MB` (the same cap
  the unit lane uses), isolate per file, `testTimeout` 20 s. When a
  worker's V8 heap reaches the cap Node aborts the fork with `FATAL ERROR:
  ... JavaScript heap out of memory` and vitest reports the whole run as
  crashed - no file name in the summary, no heap number, the lane red for
  the parcel.

  Recorded on parcel trees (coder evidence):
  - BL-1636 (2026-09-18): four attempts - the full lane twice, a
    `--poolOptions.forks.maxForks=2` retry, and a single-file-filtered
    attempt - each dying on a different file
    (`bl1371StepDiscoveryInvariants`, `bl1218RemoteControlConfigInvariants`)
    before reaching the parcel's own property file.
  - BL-1639 (2026-09-19): at `bl1495BaiGatewayInvariants.property.test.js`,
    131 tests deep.
  - BL-1645 (2026-09-19): after `bl1297MergeOwnPathsInvariants.property.test.js`.
  - BL-1646 and BL-1649 (2026-09-19, coder@2): the same message.
  Every role then wrote "not re-attempted per the 2026-09-17 run-once
  directive", correctly, and forwarded. The host is not the cause:
  `/proc/vmstat oom_kill` reads 0 since boot on 2026-09-16, 14 GB were
  available at mint, and the single-file attempt died too - one property
  file, running its generated cases, can fill a worker's cap on its own
  (`MaxListenersExceededWarning: 11 exit listeners` on runs of the
  acceptance CLI hints at retained handles across cases).

  ## What is wanted

  1. One measured run of the lane with per-file heap logging (vitest
     `--logHeapUsage`, or an equivalent reporter) committed as
     `extension/test/property-lane-heap-census.txt`: file, peak heap MB,
     cases run; plus the cap and fork count the run spawned with, printed
     once at the top.
  2. A per-file heap ceiling gate: a property file whose peak heap exceeds
     `PROPERTY_LANE_FILE_HEAP_CEILING_MB` (a named constant below the
     worker cap, with headroom) fails as that file with its peak in the
     message - the crash becomes a named, deterministic red on the file,
     never a dead worker.
  3. The per-worker cap derived from the host: forks x cap <= available
     memory at spawn (headroom for the other lanes a busy host runs), the
     derivation printed once per run; on this host that is well above
     whatever cap the crashes hit.
  4. The census's top offenders: fixed in-parcel when the fix is a
     released reference of a few lines (a cleanup the file forgot, a
     module-level array that grows per case); otherwise owned by name in
     a follow-up ticket minted by the specifier on the coder's note before
     this closes - never left as "hardener's next work" (2026-09-10 rule).

  ## How (direction, not mandate)

  - The cap and fork resolution live in
    `extension/test/helpers/propertyLaneContentionBudget.js` and the
    unit lane's sibling module (BL-422/BL-871); keep one derivation, read
    by both configs.
  - The ceiling gate is cheapest as a vitest `afterEach`/`afterAll` hook
    reading `process.memoryUsage().heapUsed` per file in a shared setup
    file, or vitest's own `logHeapUsage` reporter output parsed by a
    guard test; either way the failing file is named.
  - Measurement runs on a quiet host (`uptime` load under 8, no other
    vitest/stryker workers), once; record the load beside the census.

constraints: >
  No property file's assertions change here except to release a retained
  reference. The fork pool ceiling (BL-871) and the run-once directive
  stand. The census is committed, never hand-edited. The step handler
  lands in the same commit as the feature (BL-233). The feature's own
  scenarios never run the full lane - they drive the gate on a fixture
  file that allocates past a tiny ceiling.

out_of_scope: |
  - Per-file DURATION measurement (BL-1619).
  - The chase sweep respawning a busy role while its lane runs (BL-1652).
  - Cross-role lane scheduling (roles run lanes concurrently on one host;
    BL-1618 encodes the lane set per role).

qa_e2e_procedure: >
  (1) Unit: the budget module's tests green. (2) Acceptance: the BL-1651
  feature green through the runner, once. (3) On a quiet host, ONCE:
  `npm run test:properties` completes (no FATAL ERROR), its first lines
  print the derived cap and fork count, and the committed census matches
  the run's per-file peaks within noise. (4) Every census entry above the
  ceiling names an owner: fixed here or a BL id. Never "run it N times".

