  Minted 2026-09-07 by the specifier on the coordinator's unowned-red note,
  the same pass (standing-red rule: high at first sighting). Register rows
  for both files name this ticket, first_seen 2026-09-07.

  Grepped first: no open ticket names either file, `writeLaunchScript`,
  `parsePack` or the hatch in the vitest lane; BL-1445 (paused, approved)
  is the shell-lane sibling and is not widened.

  Not a red in the swarm's own panes: the files are green there because
  the pane exports the hatch. The register row exists because the verdict
  depends on the environment, which is the defect, and because the
  offline expedite - the path the swarm uses to repair its own delivery
  machinery - is exactly the shell that lacks it.

  IR-DRY at mint: the two scenario outlines share the shape "<file> runs
  alone ... passes" by design (one is the fix, the other the regression
  guard over the rest of the class); reviewed and kept.
