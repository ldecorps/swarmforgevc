id: BL-1457
title: "bl1218RemoteControlConfigInvariants (invariant 2) and bl1320DocumentedStepsAreExecutedInvariants drive the launcher's parse_config on a fixture root with no role matrix and pass only under the pane's PACK_STAFFING_SKIP_GATE=1: without it BL-1318's staffing gate refuses the fixture's model line (not-on-role-matrix), no launch script is written and the how-to's own seat line fails to parse - red in QA's offline expedite of BL-1454 on 2026-09-07; every test that drives parse_config on a fixture decides the gate itself"
milestone: M8
type: defect
severity: high
# high (standing-red rule 2026-09-05): two property-lane files whose verdict
# is decided by the ambient environment, red in any shell without the
# operator escape hatch, and they held BL-1454 - the GH-24 kill-loop fix -
# at QA under Article 4.2. A test that passes only because a pane exports a
# bypass is a broken safety signal in both directions: it hides nothing
# today and it will hide the gate's regressions tomorrow. Never medium for
# a red.
status: todo
epic: code-quality-gates
priority: 12
direction: swarm-reported
depends_on: []
mutation_cost: low
# low: two spawnSync call sites in two test files (bl1324's spawn already
# pins the override the same way); no production line changes.
slice_size_envelope: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]

acceptance: specs/features/BL-1457-every-test-that-drives-parse-config-decides-the-staffing-gate-itself.feature

required_wiring:
  - 'specs/pipeline/steps/bl1457FixtureDecidesStaffingGateSteps.js::registerSteps::the step handler lands in the same parcel as the feature (BL-233)'

human_approval: approved
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. What is FIRM: each of the two
  files decides the staffing gate inside its own spawn (an explicit
  override in the environment it spawns, or a fixture role matrix that
  admits the model); no lane-wide export in a vitest config; no production
  line of the launcher or the gate changes. This is the vitest-lane sibling
  of BL-1445 (approved), which fixes the same inheritance in the shell
  lane in the opposite direction - those cases must UNSET the hatch to
  assert refusal; these two must not depend on it at all.

invariants:
  - "A test's verdict on a fixture root never depends on whether PACK_STAFFING_SKIP_GATE is present in the ambient environment: for every file under extension/test that drives parse_config, the result with the variable unset equals the result with it set to 1."
  - "The staffing gate's own refusal is untouched: no production line of swarmforge.sh or pack_staffing_gate_lib.bb changes, and no lane-wide export hides the gate from any test that asserts on it (BL-1318, BL-1445)."

description: |
  ## What is wrong

  BL-1318 (2026-09-01) made `parse_config` in swarmforge/scripts/swarmforge.sh
  call `pack_staffing_gate` for every window line: a model that is on no
  role matrix in the steward registry is refused ("failed check
  'not-on-role-matrix'") and parse_config aborts, unless
  `PACK_STAFFING_SKIP_GATE=1`. The launch environment file exports that
  hatch into every role pane (the full-forge pack carries an uncertified
  seat), so inside the swarm every test that drives parse_config passes
  regardless of what its fixture contains.

  Two property files build a fixture root with a conf and role prompts but
  no steward registry, then spawn `zsh -c "source swarmforge.sh <root>;
  parse_config; ..."` with `process.env` inherited:

  - `extension/test/bl1218RemoteControlConfigInvariants.property.test.js`,
    invariant 2 (`writeLaunchScript`): the fixture's window line names
    `claude-haiku-4-5-20251001`; without the hatch parse_config refuses it,
    `write_role_launch_script` never runs, and the property fails
    "no launch script was written for config off" on its first draw.
  - `extension/test/bl1320DocumentedStepsAreExecutedInvariants.property.test.js`
    (`parsePack`): the how-to's own line
    `window coder claude coder --model claude-opus-5 --seat-tier hard` is
    refused "pack staffing gate refused role 'coder' (line 1):
    anthropic/claude-opus-5 failed check 'not-on-role-matrix'", so the
    property fails on the same counterexample every run.

  Reproduced by the specifier on main at mint (2026-09-07): both files
  green alone in the specifier pane; both red alone under
  `env -u PACK_STAFFING_SKIP_GATE` with exactly QA's two messages. The
  other five files that drive parse_config on a fixture
  (bl1010SwarmNameResolution, bl1078CursorSeatUsesSharedChannels,
  bl1324ClaudeSeatQwenCloudContextWindowInvariants - which already pins the
  override in its spawn env - bl1328QwenModelTokenFormsInvariants,
  swarmforgeShErrorChannelGuard) pass with the variable unset.

  QA's offline expedite of BL-1454 (stack stopped, no pane environment)
  found both red on every draw and, correctly, held the parcel under
  Article 4.2 (`backlog/evidence/BL-1454-QA-20260907.md`). The coder's
  pre-commit run in the same environment had already flagged bl1218.

  ## What is wanted

  Each of the two files decides the gate itself, inside the environment it
  spawns, so its verdict is the same in a role pane, in an offline expedite
  shell, and under `env -i`. Nothing else changes: the gate keeps refusing
  an unadmitted model when no override is declared, and no vitest config
  exports the hatch for every test.

  ## How (direction, not mandate)

  - Neither file is about staffing. The cheapest honest fix is the one
    bl1324 already uses: pass `PACK_STAFFING_SKIP_GATE: '1'` explicitly in
    the `env` of the spawnSync that sources the launcher (bl1218's
    `writeLaunchScript`, bl1320's `parsePack`), with a one-line comment
    naming BL-1318's gate as the reason.
  - The alternative - a fixture steward registry whose role matrix admits
    the models the fixture names - proves the same thing on merit at the
    cost of coupling two unrelated tests to the registry's shape; take it
    only if the first route is refused at review.
  - Do NOT export the variable in `vitest.properties.config.mjs` or the
    unit config (scenario 02): a lane-wide hatch is the pane's mistake
    moved one level down.
  - Remove both files' rows from `backlog/standing-reds.tsv` in the same
    land (scenario 04; the register guard refuses a stale row otherwise).

  ## Docs (documenter, same parcel)

  - One sentence in the launcher/staffing-gate how-to (BL-1318's page, if
    it exists, else the property-lane how-to): a test that spawns the
    launcher decides the staffing override itself. No registered diagram
    depicts this; none changes.

constraints: >
  Test-only change; no production line of swarmforge.sh or the gate lib.
  Fixture roots stay under mkdtemp (the files already do this) and are
  removed in `finally`. The step handler lands in the same commit as the
  feature (BL-233); the handler's own runs of the two files under
  `env -u` and `=1` are real vitest invocations, never a stubbed verdict.
  No hand-edited mutation manifests.

out_of_scope: |
  - BL-1445 (the shell-lane instance: test_pack_staffing_gate_wiring.sh
    must UNSET the hatch to assert refusal) - approved, paused, separate.
  - Whether the launch environment file should still export the hatch
    into every pane at all - an operator/steward question (the uncertified
    seat), not a test-hygiene one.
  - The gate's own behaviour, registry shape, or role matrix content
    (BL-1318).
  - bl1252CommitGuardAggregationInvariants' timeouts - a spawn-budget red
    owned by BL-1349 (active), registered alongside this ticket's rows.

qa_e2e_procedure: >
  From `extension/` on the landed commit. (1)
  `env -u PACK_STAFFING_SKIP_GATE npx vitest run --config
  vitest.properties.config.mjs test/bl1218RemoteControlConfigInvariants.property.test.js
  test/bl1320DocumentedStepsAreExecutedInvariants.property.test.js`: 6/6
  green. (2) The same command with `PACK_STAFFING_SKIP_GATE=1` exported:
  6/6 green. (3) `env -i PATH="$PATH" HOME="$(mktemp -d)" npx vitest run
  ...` on the same two files: green (this is the offline-expedite shape).
  (4) `grep -n PACK_STAFFING extension/vitest*.config.mjs` prints nothing.
  (5) The five other parse_config-driving files (scenario 03) green with
  the variable unset. (6) `backlog/standing-reds.tsv` has no row for
  either file and `bb swarmforge/scripts/standing_red_register_cli.bb .`
  reports them absent. (7) Regression on the gate itself:
  `env -u PACK_STAFFING_SKIP_GATE bash swarmforge/scripts/test/test_pack_staffing_gate.sh`
  behaves exactly as before this parcel.

