description: |
  ## What is wrong

  `swarmforge/scripts/land_step_lib.bb`, `registry-specs` (around line
  2653), gives `backlog/suite-poles.tsv` the predicate
  `:retirable?-fn (fn [line] (not (re-find #"(?i)accepted pole" line)))`.
  `rows-to-retire` uses it to except a row from the land's retirement
  whatever its owner. It was written when "no dedicated column exists".
  BL-1629 adds one: `extension/src/tools/check-suite-file-budget.ts`'s
  `parseRegisterRows` reads the fifth field as the disposition when it is
  exactly `owned` or `accepted`, and treats a row without it (the legacy
  5-column form) as owned. So the land step and the budget check decide
  accepted-ness by different rules.

  ## What is wanted

  - The suite-poles `:retirable?-fn` keeps a row exactly when its fifth
    tab-separated field is exactly `accepted`. Any other row, including a
    legacy 5-column row whose note says "accepted pole", is retirable by
    its owner's land.
  - The register's header comment says the land step reads the
    disposition column.
  - The registry-specs docstring drops "no dedicated column exists".

  ## How (direction, not mandate)

  - The handler `specs/pipeline/steps/bl2035LandStepPoleDispositionSteps.js`
    calls the real `rows-to-retire` through `bb -e` (load-file
    `swarmforge/scripts/land_step_lib.bb`) with the suite-poles entry of
    `registry-specs` and fixture lines. Pass them as EDN on stdin or in a
    temp file, never by string-building Clojure from fixture text. For
    scenario 02 it also loads the compiled `parseRegisterRows` from
    `extension/out/tools/check-suite-file-budget.js` over the same lines.
    Validate `<shape>`, `<note>` and `<verdict>` against explicit known
    values.
  - Documenter: if BL-1629's how-to update describes the land exception by
    note text, it now names the disposition column.

