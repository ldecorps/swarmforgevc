source: |
  The human, specifier pane, 2026-10-05, verbatim (Article 5.3):

  > We have to fix iq3. Spy on it every 10 minutes. If its gone wrong, hotfix it, and respawn. Repeat until iq3 is functioning normally.

  The fault (iq3 pane, 12:27Z): "API Error: llama-server returned invalid
  tool call arguments for "run_shell_command": unexpected end of JSON
  input (Press Ctrl+Y to retry)"; shim log 13:27:36 local: "chat
  model=ista-iq3s-coder:latest status=500 ... finish=None". QA note 003824:
  "iq3 coder looping: same git log x8 since 12:23:58Z, 17m no commit".

description: |
  ## Status: hotfix 418b0a4ab3 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it. Later
  hotfixes from the same spy loop fold in below while this is paused.

  ## What was wrong

  llama-server rejected a tool call the iq3 model wrote as broken JSON,
  Ollama answered 500, the shim relayed it, and qwen stopped the turn at
  "Press Ctrl+Y to retry". A one-shot seat never presses it, so the seat
  sat halted holding BL-1930 from 12:27Z.

  ## What the hotfix changed

  - `swarmforge/scripts/local_model_tool_call_shim.py`: `is_bad_tool_call()`
    (a 5xx whose body says "invalid tool call arguments", nothing else) and
    up to `BAD_TOOL_CALL_RETRIES` = 2 retries of the same request in
    `_complete`; the chat log line gains `bad_call_retries=N`.
  - `swarmforge/scripts/test/test_local_model_tool_call_shim.py`: a parse
    failure is the only retried error; a bad call once is retried into a
    real tool call; a bad call that persists still returns the 500 after
    1+2 requests.
  - Applied live 12:31Z: the old shim stopped, the seat respawned, and its
    launch script's `ensure` started the new shim.

  ## What the coder checks

  The change against the description and the invariant. Evidence:
  backlog/evidence/BL-1993-coder-<date>.md.

