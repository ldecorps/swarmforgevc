source: |
  The human sent the specifier a screenshot of the coder pane, 2026-10-04
  ~09:24Z, with no text: three compactions in four minutes on BL-1851's
  bounce, then "[API Error: Context is too large to send safely after
  automatic compression. Estimated prompt tokens: 35318; hard limit:
  30852.8; compression status: COMPRESSED. Start a new session or reduce
  the resumed history before continuing.] (Press Ctrl+Y to retry)".
  The standing loop it belongs to, the human via Cursor, 2026-10-03,
  verbatim (Article 5.3):

  > Have the swarm observe, raise high severity defect, have specifier implementing them, repeat, until the point where coder2.5 is capable of working.

  Widened the same day. The human, specifier pane, verbatim: "coder is
  still spending most of its time compacting. when will the hotfix take
  effect?" Offered A (raise the window, theirs to rule), B (a short qwen
  system prompt) and C (cap the compaction summary), the human: "do B and C".

