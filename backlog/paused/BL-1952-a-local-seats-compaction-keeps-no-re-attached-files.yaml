description: |
  ## Status: hotfix 3e66c4af7c landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  qwen's chatCompression default, maxRecentFilesToRetain 5, re-attaches
  the full text of the five most recently read files to the history after
  every compaction. In the iq3 coder's session b5bca0b5 (QA's BL-1851
  bounce) those parts were 24284, 26360 and 36031 chars against summaries
  of 5.5-6.5k chars. That left 22324-25598 tokens after each compaction,
  against a 27852-token trigger in a 32768 window. The seat re-read the
  same files at once (read_file of local_seat_tuning_report_lib.bb right
  after it came back embedded), so each file counted twice. At 09:21Z one
  call read two files, and qwen refused the next request: estimated
  35318 tokens against a hard limit of 30852.8. qwen does not recover from
  that error alone; the seat waits for Ctrl+Y, and a retry sends the same
  history.

  ## What the hotfix changed

  - swarmforge.sh, write_local_model_qwen_settings: the written
    `.qwen/settings.json` gains `"model": {"chatCompression":
    {"maxRecentFilesToRetain": 0}}`, so a compaction keeps the summary and
    the most recent turn, and the seat re-reads what it needs. A comment
    above the function records why.
  - test_bl1949_local_model_precompact_hook.sh: asserts the key is written
    and that the provider entry merge keeps it. The first assertion fails
    with KeyError against the pre-hotfix writer.

  ## Second and third hotfixes: c44825d8e4 (C) and 4afdfbb6bf (B)

  With no files re-attached the coder still spent 790 of 1033 model
  seconds (76%) compacting, and made no edit in 15 minutes. Two causes:

  - Its fixed prompt was 12487 tokens (qwen's base prompt 17.5k chars, its
    auto-memory section 6.2k, tool declarations 15k), and the bounce's
    five files were 57 KB, about 15k tokens: more than the 27852-token
    trigger before it could write. B: the launch script exports
    QWEN_SYSTEM_MD, the master checkout's
    swarmforge/roles/local-model/qwen-system.md (1680 chars), which
    replaces qwen's base prompt, and the settings writer adds
    memory.enableManagedAutoMemory false. A captured first request falls
    to 4761 tokens; 3 of 3 replays through the shim still call read_file
    on the card with no text.
  - Each summary was 2.7-3.8k tokens at about 26 tokens/s, 146-188 s. C:
    the shim knows qwen's compression side-query by its summarizer system
    prompt or the directive qwen sends last (never by the history
    between), sends it upstream unstreamed with its budget capped at 1200,
    and appends </state_snapshot> to a summary cut at the cap. qwen's own
    compaction budget here is about 10k, so it keeps a capped summary; its
    cache-sharing path drops an unclosed one. The PreCompact hook now
    names the 1200-token cap.

  ## Fourth and fifth hotfixes: d955df1ca4 and 7d47d8bf63 repair c44825d8e4

  Under the 1200-token cap, the fresh session after the 10:15Z respawn
  failed five compactions in a row (10:18-10:22Z): each reply was cut at
  the cap with no content, qwen recorded COMPRESSION_FAILED_EMPTY_SUMMARY,
  stopped compacting after three, and the seat hit the hard limit again
  (31809 > 30852.8).

  d955df1ca4 assumed hidden thinking: a replay of a 20.5k-token compaction
  built from the live session, sent without think:false, gave 4329 chars
  of reasoning and no content. It sends the side-query with think:false
  and reasoning_effort none, and logs the client's think value, the
  reasoning length and the reply's first characters. That log disproved
  the premise at the next compaction (10:34Z): client_think=False, qwen
  already sends it; the replay had simply left it out. d955df1ca4 is
  harmless and its log line is what found the real cause, but by itself
  it fixed nothing. Review it as the diagnostic it turned out to be.

  The real cause: the reply opened "<analysis> Chronological", spent the
  cap there and never reached <state_snapshot>, and qwen strips an
  <analysis> block. 7d47d8bf63 replaces qwen's paragraph asking for
  <analysis> first, and its closing directive, with an instruction to
  start at <state_snapshot> and <next_step>, and wraps a reply that is
  still analysis only as the snapshot's <current_work> (logged
  salvaged=True), so a compaction never comes back empty. Tool requests
  keep the client's own knobs (a test guards invariant 3).

  ## What each stage checks

  - Coder: all three changes against the description and the three
    invariants, and the new test cases (test_bl1949's four lines,
    test_bl1838's export line, the shim's CompactionTests, its streamed
    compaction case, its thinking-off and tool-knob cases, and its
    analysis-directive and analysis-salvage cases). Evidence: backlog/evidence/BL-1952-coder-<date>.md.
  - Documenter: docs/how-to/BL-1052-local-model-seat-launch.md lists the
    keys the settings writer writes and describes the shim; add the two
    settings keys, the QWEN_SYSTEM_MD export and its prompt file, and the
    shim's compaction cap, each with why.
