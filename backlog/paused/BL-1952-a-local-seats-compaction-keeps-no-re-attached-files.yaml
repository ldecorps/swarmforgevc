description: |
  ## Status: hotfix 3e66c4af7c landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  qwen's chatCompression default, maxRecentFilesToRetain 5, re-attaches
  the full text of the five most recently read files to the history after
  every compaction. In the iq3 coder's session b5bca0b5 (QA's BL-1851
  bounce) those parts were 24284, 26360 and 36031 chars against summaries
  of 5.5-6.5k chars. That left 22324-25598 tokens after each compaction,
  against a 27852-token trigger in a 32768 window. The seat re-read the
  same files at once (read_file of local_seat_tuning_report_lib.bb right
  after it came back embedded), so each file counted twice. At 09:21Z one
  call read two files, and qwen refused the next request: estimated
  35318 tokens against a hard limit of 30852.8. qwen does not recover from
  that error alone; the seat waits for Ctrl+Y, and a retry sends the same
  history.

  ## What the hotfix changed

  - swarmforge.sh, write_local_model_qwen_settings: the written
    `.qwen/settings.json` gains `"model": {"chatCompression":
    {"maxRecentFilesToRetain": 0}}`, so a compaction keeps the summary and
    the most recent turn, and the seat re-reads what it needs. A comment
    above the function records why.
  - test_bl1949_local_model_precompact_hook.sh: asserts the key is written
    and that the provider entry merge keeps it. The first assertion fails
    with KeyError against the pre-hotfix writer.

  ## What each stage checks

  - Coder: the change against the description and both invariants, and the
    two new PASS lines. Evidence: backlog/evidence/BL-1952-coder-<date>.md.
  - Documenter: the BL-1052 how-to lists the keys the settings writer
    writes (near its .qwen/settings.json section); add this one and why.
