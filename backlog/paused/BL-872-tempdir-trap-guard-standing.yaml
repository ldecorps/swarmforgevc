approval_context: >
  New feature draft needs review, plus two deliberate calls to sign off or
  overturn. (1) This ticket carries BOTH halves — remediating the 18 violating
  files AND giving the guard a standing home — in one slice, on the grounds
  that shipping only the remediation guarantees a third round of the same rot
  (BL-420 -> BL-459 -> this). Split them if you disagree. (2) The standing home
  proposed is the extension Vitest suite, mirroring BL-420's own
  extension/test/tmpDirMigrationGuard.test.js, because that is the one suite
  every parcel provably runs; the alternative considered and rejected was
