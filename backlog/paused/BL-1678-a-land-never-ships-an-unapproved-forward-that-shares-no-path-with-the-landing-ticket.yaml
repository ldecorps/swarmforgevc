human_approval: approved
approval_context: >
  A new feature file is authored here, so it would ordinarily need a tap;
  it is minted approved under the 2026-09-17 operator hotfix (severity
  defect, no choice posed, no ruling_options). FIRM: a land publishes a
  tip-pure commit built off origin/main from the landing ticket's own
  attributed paths in EVERY case, LAND_CLEAN included - QA's branch tip is
  never pushed as main again, so origin/main's first-parent line gains
  landing commits, never "Merge ... into QA." merges. FIRM: the land
  step's sibling candidates are every ticket with a commit on the tip
  since origin/main, whether or not it shares a path with the landing
  ticket; an unapproved one is printed and never rides (its paths are
  simply absent from the tip-pure commit), an approved one rides as a
  PASSENGER exactly as BL-1375 prints today. FIRM: the publish step
  refuses to push a commit with two parents or whose diff against
  origin/main names a path attributed to a ticket that is neither the
  landing one nor landed. FIRM: no change to what counts as landed
  (BL-1272/BL-1354/BL-1389 verdicts) or to the replay's content rules.

invariants:
  - "No commit reaches origin/main through a land unless every path it changes against origin/main is attributed to the landing ticket or to a ticket already landed; an unapproved forward merged into QA's branch never rides, whichever paths it touches."
  - "origin/main's first-parent line advances only by tip-pure landing commits and by writers on main itself; a land never pushes a merge commit as main."

description: |
  ## What is wrong

  Two facts combine. (1) QA lands by `git push origin HEAD:main` from
  `swarmforge-QA` after `land_main_publish.sh --decide-only` (QA.prompt's
  recipe, now amended), so main's first-parent line IS the QA branch:
  `git log origin/main --first-parent | grep -c 'into QA\.'` = 375 since
  2026-08-22, 12 on 2026-09-21; a push therefore carries every forward QA
  has merged into its branch - approved or not. (2) `land_step_cli.bb`
  (the step `--decide-only` consults, BL-1309) finds sibling candidates by
  SHARED PATH with the landing ticket: an unapproved sibling among them
  "never rides - it escalates" (its header), an approved one is a
  PASSENGER (BL-1375); a forward on paths the landing ticket never touches
  is no candidate, the step prints LAND_CLEAN, and the push ships it.

  2026-09-21: QA merged BL-1640's documenter forward at 11:42
  (`8f10bdc242`), bounced BL-1640 at 12:15 (D1: the sleep ceremony's
  deadline loop never passes `--conf`), and landed BL-1666 at 12:42 by
  pushing `bbeb70f408 Merge main 99a055be0d into QA.` as main. BL-1666
  (`check_documenter_briefing_tip.sh` and its tests) shares no path with
  BL-1640; QA's BL-1666 evidence records no ENTANGLED/PASSENGER line;
  BL-1640's `1a46af4fd1`, `24919d6d69`, `76bf756a69`, `a0f5711e48` are
  ancestors of origin/main and `git diff origin/main fd6f1eb3ed` is empty
  on all nine BL-1640 TypeScript, test, handler and feature paths - the
  bounced content, defect included, has been on main since. QA later
  approved BL-1640 (13:31) and its own land then escalated as entangled
  with BL-1458 and BL-1641 (adjudication
  `backlog/evidence/BL-1640-land-escalate-adjudication-specifier-20260921.md`),
  which is how the specifier found the earlier ride. The same shape:
  BL-1308's land pushed the held BL-1300 on 2026-08-31 (the publish step's
  own header) and the 2026-09-17 whole-branch push of BL-1605 landed
  BL-1604 unreviewed.

  ## What is wanted

  1. `land_step_cli.bb`'s plan considers every ticket with a non-merge
     commit on the tip since origin/main (the ancestry walk it already
     makes), not only those sharing a path with the landing ticket: an
     unapproved or bounced one is printed (`ENTANGLED_SIBLING` /
     `UNAPPROVED_FORWARD <id>`) and its paths are excluded from the
     tip-pure commit; an approved one is a PASSENGER as today (scenario
     01).
  2. `land_main_publish.sh --land <task> <approved-commit>` (and QA's
     recipe) builds and pushes the tip-pure landing commit in EVERY case -
     LAND_CLEAN means "the landing ticket's own paths, nothing else", not
     "push HEAD" (scenario 02: after a land of a clean tip that also
     carries an unapproved forward on other paths, origin/main gains a
     single-parent commit touching only the landing ticket's paths and the
     forward's paths are absent).
  3. The publish step refuses to push a commit with two parents, or one
     whose `git diff origin/main..<commit> --name-only` names a path
     attributed to a ticket that is neither the landing one nor landed,
     printing the offending id and path (scenario 03).
  4. `docs/how-to/BL-1241-entangled-tip-at-the-land-step-has-a-reachable-remedy.md`
     and the BL-1144 landing how-to say the land is always tip-pure and
     main's first parent never gains a QA merge (documenter). The QA.prompt
     interim (specifier, landed with this mint) is the same rule by hand.

  ## How (direction, not mandate)

  - The candidate set already exists as `ancestry-commits` (BL-1650 item
    0's full walk); drop the shared-path filter from candidate SELECTION
    and keep it for the co-ownership VERDICT. Reuse
    `is_qa_ancestor.sh`/the land-approvals store for "approved" as the
    passenger logic does.
  - The publish step's push becomes `git push origin <landing-sha>:main`
    of the replay's commit whatever the plan said; the two-parent and
    foreign-path refusals are one bash check before the push, tested in
    `test_land_main_publish.sh` over a fixture origin (BL-1390 roots).
  - Fixtures: the BL-1241/BL-1375 feature handlers already build a
    fixture origin with a landing ticket and siblings; add the
    non-overlapping unapproved sibling row.

  ## Not in scope

  - The empty-revert blind spot in `attributing-commits` (BL-1472 skips a
    revert-subject commit; an EMPTY revert - BL-1576's remedy - is
    invisible): observed on 70c0123691, harmless there; a separate ticket
    if it ever attributes wrongly.
  - Rewriting main's history: the 375 merges stay; only future lands
    change shape.
  - The reconcile daemon (BL-891) and the merge-deletion guard (BL-1671).

qa_e2e_procedure: |
  Fixture roots per BL-1390: a fixture origin with main, a QA branch that
  merged two forwards (ticket A approved, ticket B unapproved, disjoint
  paths), never the live checkout.
  1. `bb swarmforge/scripts/test/land_step_lib_test_runner.bb` and
     `bash swarmforge/scripts/test/test_land_main_publish.sh` once: green
     with the new cases.
  2. `bb swarmforge/scripts/land_step_cli.bb <A-task> <A-commit> <fixture>`
     prints the unapproved B by id and a LAND_REPLAY (never LAND_CLEAN);
     the replay commit's `git diff main --name-only` names only A's paths.
  3. `land_main_publish.sh <fixture> --land <A-task> <A-commit>`: the
     fixture origin's main gains one single-parent commit, B's paths are
     absent from it; then a hand `git push origin HEAD:main` of the QA
     branch tip through the publish step is REFUSED naming B.
  4. `specs/pipeline/scripts/run_acceptance.sh` on this ticket's feature:
     3/3, once.
  5. Live, after land: the next QA land's commit on origin/main has one
     parent and `git log origin/main --first-parent -1 --format=%s` is the
     landing subject, not "Merge ... into QA.".

