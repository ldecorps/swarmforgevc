id: BL-1678
title: "A LAND_CLEAN land pushes QA's whole branch tip as main, and the land step's sibling check covers only siblings that share a path with the landing ticket - so every forward QA has merged and not yet approved on OTHER paths ships unreviewed: BL-1640's bounced forward (its D1 defect included) reached origin/main at 12:42 under BL-1666's land on 2026-09-21, and origin/main's first-parent line is 375 'Merge ... into QA.' commits since 2026-08-22 (12 today); the land step judges every unlanded forward on the tip, the publish step lands a tip-pure commit of the landing ticket's own paths in every case, and a push whose new tip is a merge commit is refused"
milestone: M8
type: defect
severity: high
# high: a live fault in delivery machinery - Article 1.8/4.2 says only a
# QA-approved commit lands, and the mechanism lands every merged forward
# whose paths the landing ticket does not touch; on 2026-09-21 a bounced
# parcel's defective content sat on main from 12:42 (BL-1640, the
# deadline loop never passing --conf) with no ticket owning that. The
# BL-1309 header of the publish step names this hazard and the detector
# it consults answers only the shared-path question. Not critical: the
# interim (QA.prompt: always a tip-pure landing commit, pushed by sha)
# closes it by hand at once.
