human_approval: approved
human_ruling: |
  Chase the untested logic only - the no-coverage regions (make the CLI adapter builders thin wrappers or cover them) and the module-level decision tables - and accept the remaining first-run survivors as grandfathered debt guarded by the changed-path gate (recommended)
ruling_provenance: tapped
approval_context: >
  This tracker asks one question and mints nothing on its own. BL-1441
  discharged three deferred mutation gates on completed runs, as its spec
  allows, and those runs were the first time six production files had
  ever been mutation-tested. The two small files are owned by BL-1520 and
  BL-1521 (26 and 15 survivors, one sitting each, minted alongside and
  asking their own taps). The three large files hold about 1,530 survived
  and no-coverage mutants between them (census, with the exact command:
  backlog/evidence/BL-1519-first-run-survivor-census-20260910.md). How
  far to chase them is a budget call, yours: at roughly 60 mutants per
  hardener sitting, chasing all of it is on the order of 25 slices. The
  ruling options below are the alternatives; your tap records one as
  human_ruling and the specifier mints the slices from the census
  accordingly. FIRM regardless of the ruling: the BL-1164 changed-path
  gate keeps guarding every future edit to these files, the ledger rows
  stay discharged (the gates ran), and no survivor is suppressed or
  hand-edited out of a manifest.
ruling_options:
  - Chase the untested logic only - the no-coverage regions (make the CLI adapter builders thin wrappers or cover them) and the module-level decision tables - and accept the remaining first-run survivors as grandfathered debt guarded by the changed-path gate (recommended)
  - Chase everything to zero in function-group slices of at most about 60 mutants each, minted from the census as the epic drains
  - Accept all first-run survivors on the three large files as grandfathered debt guarded by the changed-path gate and close this epic once BL-1520 and BL-1521 land

acceptance:
