slice_size_envelope: low
# low: the tracker itself carries no work; each child declares its own.

source: |
  Hardender `rule_proposal` 2026-09-10 (scope role:hardender, inbound
  00_20260910T202509Z_001262), verbatim: "Mutation gate discharge means the
  run COMPLETED, not survivors killed. First-ever run on a file set can
  surface 1000+ survivors a single hardener pass cannot responsibly chase."
  Rationale, verbatim: "BL-1441 discharged 4 gates, 6 never-hardened files,
  ~1900 survivors, 0 src files touched. Recommend a follow-up ticket per
  file set when survivor+no-cov exceeds ~50 on a first run." Accepted with
  amendment into swarmforge/roles/hardender.prompt the same pass; this epic
  and BL-1520/BL-1521 are the owner tickets that amendment requires.
  Discharge evidence on the hardender's tip 5112a3fa5b:
  backlog/evidence/BL-1441-BL-620-mutation.md, BL-1441-BL-955-mutation.md,
  BL-1441-BL-956-pipeline-board-caption-and-cap-hotfix-mutation.md.

notes: |
  UMBRELLA / tracking item (type: epic), NOT directly promotable - the
  coordinator promotes CHILD slices, never this. Children carry
  `epic: first-run-mutation-debt` and are listed in `decomposes_into`.

  Specifier, 2026-09-10 (mint): the survivors are not a defect in BL-1441 -
  its scenario 02 reads "zero surviving mutants or a reason per survivor",
  every line carries one, and holding the 2026-08-19 ledger rows (and the
  BL-1429 throttle at cap 1) for the weeks a 4000-line file takes to
  harden would turn the standing-red register into a to-do list. The
  defect was that nothing owned the survivors once the rows were
  discharged; this tracker is that owner of record. No-coverage counts
  are against each row's scoped include set (17 and 9 test files), so a
  slice re-measures over the full unit suite before chasing. Two files
  named here also carry unrelated open work (BL-1518 touches
  telegram-front-desk-bot.ts; BL-940 touches pipelineBoard.ts): a child
  slice that reaches a function one of those tickets is changing waits
  for that ticket to land (Concurrent Work Orthogonality).

  Ruling pending. When human_ruling arrives, the specifier records it here
  and mints or retires slices from the census; a slice for either large
  telegram file also names its function group and count in its title so
  the epic's remaining_slices stays a subtraction, not a guess.
