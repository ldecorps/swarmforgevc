description: |
  ## Status: hotfix 78e9346416 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `swarmforge/scripts/swarmforge.sh`'s billing guard for a role in
  `SWARMFORGE_OPENROUTER_ROLES` (BL-523) exported
  `ANTHROPIC_BASE_URL='https://openrouter.ai/api'` and
  `ANTHROPIC_AUTH_TOKEN="$OPENROUTER_API_KEY"` but left `ANTHROPIC_API_KEY`
  alone. Every other claude role's guard unsets it, and the pack path
  (`ancillary_provider_lib.sh` `ancillary_provider_pane_exports`) unsets
  it for OpenRouter too. The user's shell profile re-exports real keys
  into panes, so such a seat could start holding the Anthropic key against
  a third-party endpoint. BL-523's scenario 02 required the unset; the
  feature had no handler until BL-1948, so nothing ever ran it.

  ## What the hotfix changed

  - The guard string now begins `unset ANTHROPIC_API_KEY`, then the two
    exports as before.
  - `swarmforge/scripts/test/test_openrouter_provider_support.sh` case 02:
    the OpenRouter documenter's launch script has the exact line
    `unset ANTHROPIC_API_KEY` and not the first-party
    `unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN`.

  ## What the coder does (all of it)

  1. Run qa_e2e_procedure steps 1 and 2 once each, outputs saved under
     tmp/.
  2. Read `git show 78e9346416` against the sections above and the
     invariant.
  3. Write backlog/evidence/BL-2012-coder-<date>.md: the two results and
     one line saying whether the hotfix matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

