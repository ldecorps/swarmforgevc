id: BL-1044
title: "A glance at six terminal windows says which role each is, never which ticket it holds: put the ticket in the tmux window name so it reaches the OS title bar"
milestone: M8
type: feature
severity: low
status: todo
epic: swarmforge-console
assigned_to: none
priority: 30
direction: human-requested
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1044-the-terminal-title-names-the-ticket-a-role-holds.feature
human_approval: pending

invariants:
  - "The window name is SwarmForge's slot alone: nothing running inside the pane can change it, and the title updater never writes the pane title the agent already owns."
  - "A title is never stale-but-plausible: a role holding nothing shows the last ticket that actually PASSED THROUGH it as a parcel, in a visibly not-held form - never the held form, and never a ticket it merely saw named in a note."

description: |
  ## What

  Each agent runs in its own terminal window. The title bar reads
  `swarmforgevc — tmux -S ~/projects/swarmforgevc/.swarm...` in every one of
  them, so six windows are indistinguishable at a glance, and the tmux status
  line names only the role (`Coordinator`, `Specifier`, ...).

  Put the ticket there: role plus the ticket number **without the `BL-`
  prefix** plus a short slug. When the role holds nothing, show the last
  ticket that passed through it, in a form that reads as past rather than
  current.

  ## What "passed through" means, precisely

  Operator clarification 2026-08-22: *"by cleared I mean the last ticket you
  saw going through you"* - the last ticket this role actually HANDLED as a
  parcel. Not "the last ticket that got closed", and not "the last ticket
  whose id this role happened to see".

  That distinction has teeth, because a role's `inbox/completed/` holds both
  parcels and notes. The architect's, newest first, right now:

      note         message: BL-1014 wiring path fixed on main ...
      note         message: BL-1010 QA-approved 910427ccb8 - merge your ...
      git_handoff  task:    BL-1035-a-respawned-bot-gets-its-own-startup-grace
      git_handoff  task:    BL-1014-the-boy-scout-scan-ranks-debt-by-what-...

  The newest FILE is a note, and the two newest notes both name tickets. A
  title built from "the newest completed file" would show BL-1014 or BL-1010;
  the last ticket that actually went through the architect is **BL-1035**.
  Both wrong answers are plausible-looking, which is the whole hazard.

  So: the newest `git_handoff` in `inbox/completed/`, read from its `task:`
  header. Notes are skipped even when they name a ticket. `inbox/abandoned/`
  is skipped too - an abandoned parcel did not pass through (these exist:
  coder 3, architect 1, documenter 1).

  ## Where it goes, and why not the obvious place

  Not the pane title. The screenshot's `"* Handoff mail ready "`,
  `"Role loop initializ"` and friends are **Claude Code's own** OSC title
  updates, captured by tmux as `pane_title`. Anything written there is
  overwritten on the agent's next turn, and writing over it would also
  destroy a signal the operator is already reading.

  The **tmux window name** is the free slot, and it is already SwarmForge's:
  `swarmforge.sh:1047` renames the window and then sets
  `allow-rename off`, so no in-pane escape can touch it. That is why the
  window name stays `Coordinator` while the pane title churns.

  ## Reaching the OS title bar, on every OS, with no per-OS code

  tmux's own `set-titles on` + `set-titles-string` emits the standard OSC
  title sequence to the OUTER terminal. macOS Terminal, iTerm2,
  gnome-terminal, konsole, xterm and VS Code's terminal all honour it, so
  "and other OSes" needs no branch: it is a terminal-level convention, not
  an OS-level API. Nothing Windows-specific is written or needed.

  ## Where the data is - the PANE's own mailbox, not the board

  Operator clarification 2026-08-22: the ticket shown is the one that went
  through **the given pane**. That rules out the obvious source and this
  ticket previously named the wrong one.

  `.swarmforge/board/ticket-stage-map.json` is keyed by STAGE
  (`{"BL-1035":"coder","BL-1014":"cleaner",...}`), and BL-1040 will
  deliberately fold seat ids onto their stage so the board renders one
  column per stage. That fold is right for the board and **wrong here**: two
  seats of one stage working two different tickets would both title
  themselves with whichever ticket the fold kept. Do not build this on the
  stage map.

  Each seat already has its own mailbox, so per-pane data exists directly.
  The retired `coder@sonnet2` seat's worktree still shows it:
  `.worktrees/coder-sonnet2/.swarmforge/handoffs/inbox/completed/` holds 14
  handoffs of its own, entirely separate from `coder`'s 623.

  The chain from a window to its mailbox is `roles.tsv`: column 5 is the
  display name that IS the tmux window name (`Specifier`, `Coder`,
  `Cleaner`, ...), column 1 the role, column 3 its worktree path. Resolve
  the mailbox through `handoff_lib.bb`'s own `mailbox-dir` rather than
  building the path by hand - worktree-resident roles keep theirs under
  their worktree, while master-resident roles (specifier, coordinator) keep
  theirs at `.swarmforge/handoffs/<role>/inbox/`, and that difference has
  caught people before.

  The held ticket is that pane's own `in_process/` parcel; the last one
  through is the newest `git_handoff` in that pane's own `completed/`, per
  the definition above. The slug is in the handoff's `task:` header - e.g.
  `task: BL-1035-a-respawned-bot-gets-its-own-startup-grace`.

  ## How (direction, not mandate)

  A small updater run from the daemon's existing poll cycle, reading each
  seat's own mailbox, and renaming windows via
  `tmux rename-window` (an external command - unaffected by
  `allow-rename off`). Exact separator, marker for the not-held form, and
  slug budget are the implementer's call; a title bar truncates, so the slug
  needs a bound rather than the whole task name.

  ## Out of scope

  - The pane title, and `allow-rename`. Both stay exactly as they are.
  - The tmux status-line format, the dashboard, and the holistic UI.
  - Any new state file, sweep, or telemetry. This reads what exists.
  - Windows support.

qa_e2e_procedure: >
  1. With the swarm running and at least one role holding a parcel, read the
     macOS Terminal window title for that role's window. Confirm the defect
     first at the parent commit: it names the socket path, not the ticket.

  2. At the parcel commit, confirm the same window's title names the role,
     the ticket number WITHOUT the `BL-` prefix, and a slug.

  3. Cross-check against the source of truth: read
     `.swarmforge/board/ticket-stage-map.json` and confirm the ticket in each
     window's title matches the stage that map assigns it.

  4. Confirm the idle form: pick a role holding nothing and confirm its title
     shows the last ticket that passed through THAT PANE, visibly different
     from a held one. Verify it against the newest `git_handoff` in that
     pane's own seat mailbox - read the file, do not infer it from the title
     you are checking.

  4c. Confirm per-pane isolation, which is the point of the clarification:
     configure two seats of one stage, give each a different parcel, and
     confirm each window titles itself with its OWN ticket. Then confirm the
     board still shows that stage as ONE column - both must hold at once.

  4b. Confirm a note does not fool it, which is the live case: the
     architect's two newest completed items are notes naming BL-1014 and
     BL-1010, while its last actual parcel was BL-1035. Confirm the title
     says BL-1035's number, not either note's.

  5. Confirm the never-held case, which is live today: the cleaner's
     `inbox/completed/` is empty, so its title must show the role alone and
     must not invent a ticket. Confirm the same for a role whose completed
     mailbox holds ONLY notes and no parcel yet.

  6. Confirm the two do not fight: watch a pane through several agent turns
     and confirm the pane title keeps churning with the agent's own messages
     while the window name stays put.

  7. Confirm it survives a handoff: forward a parcel and confirm both the
     sending and receiving windows update within one daemon poll cycle.

  8. Confirm no per-OS code was written - the change should be a tmux option
     plus a rename, with no platform branch anywhere in the diff.

approval_context: >
  Your ask, from the six-window screenshot: put the ticket in the terminal
  title, number without the `BL-` prefix plus a small slug, and show the last
  cleared ticket when idle. Kept deliberately small.


  ONE FINDING THAT SHAPED IT. The obvious place - the pane title - is already
  taken. The `"* Handoff mail ready "` and `"Role loop initializ"` strings in
  your screenshot are Claude Code's own title updates, and anything written
  there gets overwritten on the agent's next turn. The tmux WINDOW name is
  free and is already SwarmForge's: `swarmforge.sh` sets `allow-rename off`
  right after naming it, which is exactly why it still reads `Coordinator`
  while the pane title churns. So this goes in the window name, and tmux's
  own `set-titles` carries it out to the real title bar.


  THE GOOD NEWS ON "AND OTHER OSES". There is nothing per-OS to write. The
  title bar is driven by a standard terminal escape sequence that macOS
  Terminal, iTerm2, gnome-terminal, konsole and xterm all honour, and tmux
  emits it for us. I made "no platform branch in the diff" a QA check rather
  than a hope.


  ONE CALL OF MINE. **I left the exact format to the implementer** - separator,
  how the not-held form is marked, how many characters of slug. A title bar truncates
  and the right budget is something you see rather than specify, so pinning it
  in the ticket would just invite a second ticket to re-tune it. If you have a
  format in mind, say it and I will pin it.

source: |
  Operator, 2026-08-22, in-chat with a screenshot of six agent terminal
  windows: "write little spec to change text in the macos (and other os)
  terminal title bar to show which ticket the agent is working on, (ticket
  number without BL prefix is fine + small slug). if it's idle, show the last
  ticket it cleared."

  Clarified in-chat the same day, verbatim: "by cleaed I mean the last ticket
  you saw going through you".

notes: |
  ## Facts confirmed live while scoping

  - `swarmforge/scripts/swarmforge.sh:1047` renames the window, then sets
    `allow-rename off` on it - the window name is already an owned slot.
  - `.swarmforge/board/ticket-stage-map.json` currently holds
    `{"BL-1035":"coder","BL-1014":"cleaner","BL-1011":"hardender","BL-1010":"QA"}`.
  - `task:` headers carry the slug already, e.g.
    `BL-1035-a-respawned-bot-gets-its-own-startup-grace`.
  - Completed-mailbox counts differ wildly by role (coder 623, architect 542,
    documenter 489, QA 307, hardender 4, **cleaner 0**). The cleaner's empty
    one is why the never-held case is a real scenario and not a hypothetical.

  ## Related

  - **BL-1040** (paused) - folds seat ids onto their stage in the board's
    stage map. **That fold must not be reused here**, and an earlier draft of
    this ticket wrongly said it could be inherited "for free". The board
    wants one column per stage; a pane title wants what THAT pane is doing.
    The two requirements are opposite, and both are correct for their own
    surface.

  ## IR-DRY judgment recorded

  5 findings, all kept. Three are polarity pairs the checker cannot see as
  negation (holds a parcel / holds no parcel, names the ticket / names no
  ticket, has handled a parcel before / has never handled a parcel). The
  other two are arity: one seat versus a second seat of the same stage, and
  one parcel versus two seats each holding a different one. In both, the
  count IS the behaviour under test - collapsing them would erase the
  per-pane isolation this ticket exists to specify.
