description: |
  ## What the human asked for

  GitHub issue 29, in full: *"Send note to Drop-down Agents / Can also do /
  Amend note / Remove note."*

  Those four words were not enough to spec, and the specifier refused to guess.
  Two things then filled the gap, and this epic is built on both:

  1. **`backlog/INTAKE-bubble-send-notes-swipe-screen.md`** (human via Let's
     Talk / Cursor, 2026-07-31) — the drained conversation, which locks nine
     decisions verbatim below. It says explicitly: *"Prefer enriching or
     promoting GH-29 over minting a twin."* This epic is that enrichment; the
     intake is merged into it, not tracked separately.
  2. **The human's 2026-08-03 answer** to the specifier's role_ask: *"role
     picker; amend/remove act on a QUEUED (undelivered) handoff."* — which
     settles the two forks the intake had left open.

  ## Human decisions locked 2026-07-31 — carried verbatim

  The intake states: *"Specifier may challenge or refine; do not silently drop
  these without asking."* They are reproduced here in full so they cannot be
  lost when the intake is archived.

  1. **Navigation.** Expanded Bubble becomes a small horizontal pager. Page one
     is Let's Talk. Page two is Send notes. Swipe left or right between them.
  2. **Default.** Welcome / default page stays Let's Talk. Never open on notes
     by default (for now).
  3. **Agent set.** Drop-down lists every declared swarm role, whether or not
     that role is currently active / awake. Notes to sleeping agents are fine;
     they pick up when they wake.
  4. **Priority.** Bubble-sent notes use priority `00` (same band as Telegram
     human steering), so they outrank ordinary pipeline handoffs (~`50`).
     Priority decides order, not parcel type alone. Already-claimed
     `in_process` work still finishes first; a note is next-look guidance, not
     a hard mid-turn interrupt.
  5. **Layout (sparse).** Agent picker at top. Short text box. One big Send.
     Under that: pending list with Amend and Remove. After Send: clear the box,
     keep the same agent selected, brief confirmation (e.g. sent to that role).
  6. **Pending scope.** Amend / Remove apply only to notes still waiting
     (queued / unclaimed), not ones already claimed.
  7. **Page dots.** Small pager dots so talk vs notes is obvious.
  8. **Out for v1.** No "send to all roles" in version one.
  9. **Note length.** Keep notes short, in the spirit of today's mailbox note
     message limit — long essays fight the overlay and the agents.

  Decisions 1, 2, 5, 7 land in slice B (BL-793). Decisions 3, 4, 9 land in
  slice A (BL-790) and are re-asserted on the device in slice B. Decision 6 is
  the whole premise of slices C and D. Decision 8 is honoured by omission
  throughout.

  ## What "queued / unclaimed" means operationally

  A note is amendable/withdrawable exactly while its recipient has not yet
  claimed it: the parcel is still in the mailbox queue with no `dequeued_at`
  stamped on its envelope. Once `ready_for_next.sh` moves it into
  `in_process/`, the role may already be acting on it and the window has shut.

  That window is short and inherently racy, so the guard in slices C and D
  **fails closed**: if the parcel cannot be shown to still be unclaimed, the
  operation is refused with a stated reason rather than attempted. An amend or
  withdraw that half-lands on a parcel a role is already working is worse than
  one that never lands.

  ## Why the split is bridge-first, device-second

  The prior specifier disposition on the intake left a split hint, and it is
  the right one: *"The blocker covers Android device behaviour only. If this
  intake contains a slice that lives on the bridge ... that slice is testable
  in the Node runner today and is NOT blocked. Split it out and spec it rather
  than holding the whole intake behind BL-769."*

  So slice A is the **bridge send path** — no Android, no BL-769 dependency,
  real Node tests today. Slice B is the **Bubble Notes page**, which is device
  behaviour and does wait on BL-769's test seam.

  The cost of that split is honest and must be stated: **slice A ships an
  endpoint with no caller until slice B lands** — the BL-419 dark-mechanism
  shape. It is accepted here only because slice B is a named, ticketed,
  immediate consumer rather than a hoped-for one, and because the alternative
  is parking the entire epic behind BL-769 for no engineering benefit.

  ## The surface, and the boundary it must respect

  This is **Bubble** — the native Android app under `android/`. Local
  engineering rule 5 names two phone-viewable surfaces that are not
  interchangeable, and this one is unambiguous: composing and queueing a
  handoff is a **write path**, so it rides the authenticated bridge
  (`bridgeServer.ts`) that Bubble already speaks to. It emphatically may not
  ride the static backlog-dashboard PWA, which has no auth and no write path
  at all.

  ## The constraint the coder must not discover the hard way

  A `note`'s `message:` is a **single line, 80 characters maximum**
  (`swarmforge/handoff-protocol.md`). That is decision 9 made concrete, and it
  is what slice A's scenario 04 and slice B's scenario 05 exist to pin down.

  ## Out of scope for the whole epic

  - Any handoff type other than `note`. This composer does not send
    `git_handoff`, and must not: forwarding a parcel is a pipeline role's
    judgement, not an operator button.
  - Send-to-all-roles broadcast (decision 8).
  - Hard interrupt of an agent mid-turn (decision 4 — a note is next-look
    guidance; barge-in is BL-776's epic).
  - Changing `swarm_handoff.bb`, the handoff grammar, or the mailbox layout.
    A note is queued by shelling to the real tool, exactly as
    `enqueueRoleAnswerNote` already does.
  - Changing Telegram steering behaviour, or building any equivalent surface
    on the Telegram Mini App.

approval_context: >
  **Re-flagged for approval — this changed materially after you approved it.**
  You approved an earlier version of this epic this morning. I then found
  `INTAKE-bubble-send-notes-swipe-screen.md`, which is the drained conversation
  behind issue 29 and locks nine decisions I had not seen. My first draft
  contradicted decision 1: I had specced a separate screen off the main
  navigation, where you asked for page two of a horizontal pager inside the
  expanded Bubble, with Let's Talk staying the default. That is now fixed, all
  nine decisions are carried verbatim above, and the intake is merged into this
  epic rather than left as a duplicate.


  Firm, because you said it: role picker over every declared role awake or not;
  amend/remove act on a real queued handoff, not a local draft; priority 00;
  Let's Talk stays the default page; no send-to-all in v1.


  Two calls of mine that need your eye.


  (1) **Bridge first, device second — and slice A is dark until slice B.**
  Splitting the send path onto the bridge means real tests today instead of
  parking everything behind BL-769's Android seam, which is what the previous
  disposition on your intake recommended. The honest cost: slice A ships an
  endpoint nothing calls until slice B lands. I think that trade is right
  because slice B is ticketed and immediate, but it is your call.


  (2) **Four slices.** Send path, Notes page, pending-list + withdraw, amend.
  Slices C and D may merge if the pending list turns out small. If you want
  fewer, larger tickets, say so — I have kept them at this size because a
  merged version would be large by this repo's own p90 measure (BL-634).


  One consequence you should know about rather than discover: an automated
  sender cannot stamp its own identity on a handoff — `swarm_handoff.bb` takes
  `from:` from `SWARMFORGE_ROLE`, so a bridge-originated note arrives stamped
  **from coordinator** (the precedent `enqueueRoleAnswerNote` set). That is
  exactly how a stray priority-00 note reading "use staging please" became
  unattributable on 2026-08-01. Slice A therefore makes the queued note
  distinguishable from a real coordinator note, at the cost of a few of your 80
  characters. Say the word if you would rather have them back.

source: |
  Two sources, merged into this one epic (BL-680 consolidation):

  1. GitHub issue https://github.com/ldecorps/swarmforgevc/issues/29, seeded
     into the backlog root as `backlog/GH-29-bubble-screen.yaml` by
     `.github/workflows/swarm-intake.yml`. Not drained 2026-07-31 / 2026-08-01
     for lack of detail; asked 2026-08-02 via role_ask with three tappable
     options; answered 2026-08-03 with option 1, relayed as a priority-00 note
     from coder: "GH-29: role picker; amend/remove act on a QUEUED
     (undelivered) handoff."
  2. `backlog/INTAKE-bubble-send-notes-swipe-screen.md` (human via Let's Talk /
     Cursor, 2026-07-31) — the drained conversation for the same request,
     which itself asked to enrich GH-29 rather than mint a twin. Held
     2026-07-31 and 2026-08-02 behind the Android acceptance-seam question;
     merged here 2026-08-03 and archived.

notes: |
  ## Open questions the intake asked the specifier to weigh in on, and the answers taken

  - *Pending-list source of truth — only notes this UI sent, or all pending
    notes for that role?* → **All pending notes for the picked role.** A list
    that hides notes another surface queued would show the human a false
    picture of what that role is about to see. Slice C's call; flagged here so
    it is not re-litigated.
  - *Does amend rewrite the parcel in place or replace it?* → deferred to
    slice D, where the mailbox's actual idempotency guarantees can be checked
    rather than assumed.
  - *Bridge or local enqueue path from the companion?* → **Bridge.** Bubble has
    no filesystem access to `.swarmforge/`, and the authenticated bridge is
    already the write path it speaks (local engineering rule 5).
  - *Page naming — "Notes" vs "Steer" vs other?* → **Notes**, matching the
    human's own wording throughout the intake.
  - *Is GH-29 promoted in place or closed for a BL ticket?* → **Promoted in
    place.** GH-29 is this epic, so issue 29 keeps a live pointer.

  ## Relationship to the Bubble Live Screen epic (BL-774)

  Both epics add native Bubble surfaces against the same bridge and both have
  a device slice waiting on BL-769, but they do not overlap: BL-774 is a
  read-only view of `/resident-pane`, this one is a write path that queues
  handoffs. The intake calls the other Bubble screens "complementary swipe
  pages later" — so whichever lands second inherits the pager this epic's
  slice B establishes. Neither blocks the other.
