notes: |
  ## Why the epic depends on BL-769

  Every slice is Android. Until BL-769's JVM unit seam lands, an Android
  ticket's acceptance contract runs zero scenarios — five tickets have already
  shipped that way. This epic's children must not be promoted before it, for
  the same reason BL-774's must not.

  ## Relationship to the Bubble Live Screen epic (BL-774)

  Both epics add native Bubble screens against the same bridge and both wait
  on BL-769, but they do not overlap: BL-774 is a read-only view of
  `/resident-pane`, this one is a write path that queues handoffs. Whichever
  lands second inherits the navigation pattern the first established; neither
  blocks the other.
