source: |
  Specifier, 2026-10-02, running the features whose handlers read
  QA.prompt after a QA.prompt edit (409d7fb1ca, QA note 003682):
  `node specs/pipeline/cli.js specs/features/BL-247-qa-integrates-coordinator-bookkeeps.feature`
  printed "not ok 1 ... expected QA.prompt to instruct a fast-forward of
  main to the approved commit" and "not ok 2 ... expected
  coordinator.prompt to still instruct closing the ticket active ->
  done". The same two failures on HEAD without the edit (git archive
  scratch tree). No backlog/standing-reds.tsv row named it.

  The human, specifier pane (Claude Code), 2026-10-01, verbatim
  (Article 5.3):

  > Also, update your prompt / c9 stitution: instead of minting a red, hotfix the defect and mint a stampoff.

description: |
  ## Status: hotfix 83d5e34527 landed the fix

  This parcel is its stamp-off: the pipeline's review of what landed. The
  coder finds the step handler already changed. Review it, do not
  re-apply it.

  ## What the hotfix changed

  `specs/pipeline/steps/qaIntegratesCoordinatorBookkeepsSteps.js` held two
  prompt literals that later approved tickets reworded with the same
  meaning:
  1. Scenario 02 checked coordinator.prompt for "move its YAML from
     `backlog/active/` to `backlog/done/`". BL-419 (e1123e1933,
     2026-07-17) made the close a `git mv` committed through
     commit_integrity_cli.bb. The step now checks the `git mv
     backlog/active/<TICKET-ID>-<slug>.yaml backlog/done/` line.
  2. Scenario 01 checked QA.prompt for "fast-forward `main` to it" and
     "push `main` to origin". BL-891's prose correction (d5c618fa01,
     2026-08-14) replaced them with the `land_main_publish.sh
     <qa-worktree> --land` recipe, which "pushes the commit the step
     BUILT (fast-forward only ...)". The step now checks those two lines.
     Its "Land it on `main` yourself" and "never force-push" checks are
     unchanged.

  ## What is wanted in this parcel

  - Review both changes against the scenarios' observable claims. If one
    hides a real regression rather than reworded prose, fix it here or
    raise it to the specifier as a note.
  - Evidence: the review, and the feature run on the parcel commit.

  ## Scope

  The step handler and evidence.

out_of_scope: |
  - BL-1872 retires BL-247 scenario 01 when the lander takes the land
