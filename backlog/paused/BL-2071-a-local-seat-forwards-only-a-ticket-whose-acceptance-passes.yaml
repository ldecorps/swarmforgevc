acceptance: specs/features/BL-2071-a-local-seat-forwards-only-a-ticket-whose-acceptance-passes.feature

required_wiring:
  - 'specs/pipeline/steps/bl2071LocalSeatForwardRunsAcceptanceSteps.js::registerSteps::the handler lands in the same parcel as the feature (BL-233, BL-1371)'
# No production anchor on purpose (BL-1235): the check's name is the
# coder's; the scenarios drive the REAL swarm_handoff.bb send and the REAL
