id: BL-2071
title: "A local seat forwards only a ticket whose acceptance feature passes: the iq3 coder's assert step is told to run the ticket's feature but nothing checks it, so QA finds the errors; a local-model seat's git_handoff is queued only when the ticket's acceptance feature passes at the forwarded commit, and the phase CLI's pass runs the same check"
milestone: M8
type: defect
severity: high
# high: a broken quality gate - the assert step is the seat's own check,
# nothing enforces it, and the cost lands on QA as bounces. The human:
# "absolutely".
status: todo
epic: local-llm-swarm
priority: 5
direction: normal
depends_on: []
