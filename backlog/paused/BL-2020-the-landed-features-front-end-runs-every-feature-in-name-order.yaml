description: |
  ## What is wanted

  A new script, `specs/pipeline/scripts/run_all_acceptance.sh`:

      run_all_acceptance.sh [--limit N] [--steps <module>] [--durations <path>] [features-dir]

  - `features-dir` defaults to `specs/features`; `--durations` defaults to
    `specs/pipeline/.acceptance-durations.jsonl` (add that path to
    `.gitignore` next to `extension/.test-durations.jsonl`).
  - It lists `*.feature` in that directory in name order (`LC_ALL=C sort`)
    and writes one list line per feature:
    `<feature>` TAB `bash specs/pipeline/scripts/run_acceptance.sh <feature> <outDir>[ <module>]`,
    where `<outDir>` is a fresh per-run directory under mkdtemp so
    generated entry points never collide, and `<module>` is `--steps` when
    given (run_acceptance.sh's own third argument).
  - Then it calls `bash swarmforge/scripts/test/run_recorded_lane.sh --lane acceptance --list <list> --durations <path>`,
    forwarding `--limit`, and exits with the runner's status.

  And the step handler `specs/pipeline/steps/bl2020LandedFeaturesFrontEndSteps.js`
  for the feature's scenario 02:
  - The fixture directory holds two features in a mkdtemp dir
    (`trackedTmpRoot`), each one scenario with the single step
    `Given a thing`, e.g. `Feature: fixture alpha` and `Feature: fixture
    beta`. Pass `--steps specs/pipeline/test/fixtures/noopSteps.js` (it
    registers `a thing`) and a `--durations` file in the mkdtemp dir, so
    the real registry and the real durations file are never involved.
  - "Exactly those two, in name order" is read from the durations file's
    `file` fields.
  - Register with `registry.defineScoped(re, fn, FEATURE)`.

qa_e2e_procedure: |
  On the parcel commit, with extension/out compiled, ONE run each.
  1. `node specs/pipeline/cli.js specs/features/BL-2020-the-landed-features-front-end-runs-every-feature-in-name-order.feature`:
     1 ok, 0 fail.
  2. Alone on the host (no unit or property lane beside it):
     `bash specs/pipeline/scripts/run_all_acceptance.sh --limit 5` -> five
     new rows in specs/pipeline/.acceptance-durations.jsonl and a verdict.
     Measured at mint by running the same five features one at a time
     (host 1-minute load 20.5): BL-092 4 ok, BL-096 8 ok, BL-097 6 ok,
     BL-100 5 ok, each 2-5 s; BL-094-holistic-dev-state-web-ui.feature
     red 0/5, as the register row owned by BL-2022 describes - so expect
     exit 1 naming exactly that feature. Record the five rows' ms and the
     extrapolated full-run wall (mean ms x the feature count).
  3. `git status --short` shows the durations file ignored, not untracked.

