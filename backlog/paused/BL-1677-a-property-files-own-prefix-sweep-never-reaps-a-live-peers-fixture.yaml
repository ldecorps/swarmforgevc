invariants:
  - "No test file's own fixture sweep ever removes a temp root a live process created: a root is reaped only when the pid its name records is dead or is the sweeping process itself."
  - "Every blind prefix sweep of os.tmpdir() under extension/test, whether it calls os.tmpdir() inline or through a variable, is reported by the BL-1623 finder; the live tree reports none."

description: |
  ## What is wrong

  QA's review of BL-1640 (bounce evidence
  `backlog/evidence/BL-1640-bounce-20260921.md`, QA branch): the property
  lane's one failure of 1267 was
  `extension/test/bl1354SharedPathLandedSiblingInvariants.property.test.js`
  invariant 2, `AssertionError: BL-9400's own lines are all landed but it
  read unlanded (all-landed, 2 siblings): {"landed":[],"unlanded":["BL-9400","BL-9401"],"warning":null}`,
  seed 9660847, in a file BL-1640's diff never touches; vitest processes
  from `.worktrees/coder2` were alive on the host during the review. The
  specifier's solo run on main (850faefe0e): green, 2/2, 18.6 s.

  The file's `sweepFixtures()` (line ~127) does `const parent =
  os.tmpdir(); for (const entry of fs.readdirSync(parent)) if
  (entry.startsWith(FIXTURE_PREFIX)) fs.rmSync(...)` before EACH
  invariant - a blind prefix sweep (engineering.prompt Guardrails, BL-971/
  BL-1385/BL-1390): with two runs of the same file alive (a second lane on
  the host, a guard re-run, a solo re-run beside a lane), one run's sweep
  rm -rf's the other's live fixture. `bl1389UnlandedSiblingPathNeverRidesInvariants.property.test.js`
  (line ~182) and `bl1380ExpediteNeverAnswersUnshownQuestion.property.test.js`
  (line ~113) carry the identical function. BL-1623 (done) built the
  owner-aware `sweepStaleTmpDirs({prefix})` in `test/helpers/tmpDir.js`
  (reaps a root only when the pid its name records is dead or is this
  process) and migrated seven files, guarded by
  `test/helpers/blindTmpDirSweepFinder.js` whose `BLIND_CALL_PATTERN` is
  the literal `readdirSync(os.tmpdir())` - these three alias
  `os.tmpdir()` into `parent`, so `findBlindTmpDirSweeps(test/)` returns
  `[]` on the live tree today and the guard is green over three live
  blind sweeps (BL-1445's fail-open census shape).

  Why the report reads that way (emulated on main, script in the
  adjudication evidence): a fixture whose WHOLE root is removed before
  the classify reports `warning: "land-step: origin/main could not be
  resolved"`; a fixture whose worktree files are removed but `.git` kept
  reads all landed; a fixture whose landed BLOBS are removed while refs
  and commits survive reports exactly
  `{"landed":[],"unlanded":["BL-9400","BL-9401"],"warning":null}` - the
  state a peer's recursive rm leaves partway through `objects/`. The
  verdict's silent "absent" on an unreadable blob is invariant 1's safe
  direction (it never reads landed) and is not changed here.

  ## What is wanted

  1. The three files build their roots with a pid-bearing name
     (`mkTmpDir(\`${FIXTURE_PREFIX}${process.pid}-\`)`, the shape
     `sweepStaleTmpDirs` documents) and replace their own `sweepFixtures`
     with `sweepStaleTmpDirs({ prefix: FIXTURE_PREFIX })`; every draw and
     assertion is unchanged (scenario 01 drives the real helper: a live
     peer's root survives, a dead pid's root and this process's own are
     reaped).
  2. `blindTmpDirSweepFinder.js` also reports `readdirSync(<ident>)` where
     `<ident>` was bound from `os.tmpdir()` in the same file (scenario
     02: a fixture file with the aliased form is reported; the live
     `extension/test` reports none).
  3. `blindTmpDirSweepGuard.test.js`'s `MIGRATED_FILES` gains the three
     files (scenario 03 pins the count at ten, BL-1445).
  4. The register row for the bl1354 file leaves in this parcel's land
     (BL-1631). Documenter: the BL-1623 how-to names the aliased form and
     the three files; no diagram trigger.

  ## How (direction, not mandate)

  - The seven migrated files are the template (any of
    `bl1343ReplayNeverDropsOwnPathInvariants`,
    `bl1309LandDecideEntanglementInvariants` - same land-step fixture
    family as bl1354/bl1389).
  - Finder: a second pattern `const\s+(\w+)\s*=\s*os\.tmpdir\(\)` then
    `readdirSync\(\s*<that ident>\s*\)`, per file; keep the literal one.
  - Fixture roots per BL-1390; the acceptance handler builds two roots
    under a scratch prefix, one named with `process.pid`, one with a pid
    that is dead (a just-exited child's), and runs the real helper.

  ## Not in scope

  - `land_step_lib.bb`'s reading of an unreadable blob (observation above).
  - `stepHandlerModuleLoadBudget.test.js` and
    `bl968StepRegistryMaterializedTreeGuard.test.js`, which read
    `os.tmpdir()` for BL-1636's entry census and remove nothing.

qa_e2e_procedure: |
  On the parcel commit, from `extension/`; fixture roots per BL-1390.
  1. `grep -n 'readdirSync(parent)' test/bl1354SharedPathLandedSiblingInvariants.property.test.js
     test/bl1389UnlandedSiblingPathNeverRidesInvariants.property.test.js
     test/bl1380ExpediteNeverAnswersUnshownQuestion.property.test.js`
     prints nothing; each file calls `sweepStaleTmpDirs`.
  2. `npx vitest run test/blindTmpDirSweepGuard.test.js` once: green,
     MIGRATED_FILES ten.
  3. `node -e "const {findBlindTmpDirSweeps}=require('./test/helpers/blindTmpDirSweepFinder'); console.log(findBlindTmpDirSweeps(require('path').join(process.cwd(),'test')))"`
     prints `[]`; the same over a scratch dir holding one file with
     `const parent = os.tmpdir(); fs.readdirSync(parent)` prints that file.
  4. `npx vitest run --config vitest.properties.config.mjs
     test/bl1354SharedPathLandedSiblingInvariants.property.test.js` once
     while a second copy of the same command runs concurrently from a
     scratch clone: both green (the one concurrency check this ticket is
     about; not "run it N times").
  5. `specs/pipeline/scripts/run_acceptance.sh` on this ticket's feature:
     4/4 (01 x2, 02, 03), once.

