    pause (also deliberate, BL-577), so it advises "rotate" — an action the
    paused daemon is forbidden to take — and says nothing about the pause.
  - Downstream cost: the human read it as a rotation starve, queue-jumped
    BL-651 for it, and the operator/babysitter sweeps reported
    "idle-correct" without ever naming the pause either.

description: |
  ## The defect

  A pause makes the swarm intentionally silent, but nothing that speaks to
  the human during a pause says the swarm is paused. The one component that
  keeps talking — the flow watchdog — describes the symptom of the pause as
  a stall and prescribes an action (`- rotate`) that cannot happen until the
  pause lifts. Every observer above it inherits the confusion.

  ## Shape

  While `pause-active?` holds (`backlog_depth_lib.bb`, marker
  `.swarmforge/operator/control-pause.json`):

  1. The flow-watchdog alarm text says the swarm is paused and until when,
     and drops the action verb it cannot deliver (`- rotate` / `- nudge`).
     The alarm itself is NOT suppressed: a parcel aging inside a long pause
     is exactly what a human should still see.
  2. Whatever the operator/babysitter idle verdict is derived from, a live
     pause is stated in it rather than reported as green/idle-correct.

  Deliberately NOT in this ticket: changing what a pause freezes. BL-617's
  suppression list and BL-577's unconditional watchdog both stay as they are.

acceptance: |
  Specifier writes the Gherkin when this is approved and promoted. Minimum
  behaviour:

  1. Parcel ages past warn while a pause with an `untilMs` is active → the
     alarm names the pause and its end time, and carries no rotate/nudge verb.
  2. Same parcel, no pause active → today's alarm text is unchanged, verb
     included (non-vacuity).
  3. An "until I resume" pause (`untilMs` absent) → the alarm says paused
     with no end time rather than fabricating one.
  4. The alarm still fires during a pause — pause is never a mute.

out_of_scope: |
  - Changing which sweeps a pause freezes (BL-617).
  - Suppressing alarms during a pause.
  - The babysitter's `ps --ppid` depth-1 false CRIT (BL-647 family).
  - Rotation ordering itself (BL-651).

