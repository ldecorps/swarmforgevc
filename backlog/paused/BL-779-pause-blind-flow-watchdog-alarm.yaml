approval_context: >
  Found by the specifier on 2026-08-01 while auditing the live evidence
  attached to BL-651's queue-jump: the "starve" the human queue-jumped for
  was a control pause the operator had set four minutes earlier. The fix
  proposed is observability only (say "paused until X" in the alarm and in
  the operator/babysitter idle verdict), NOT changing what a pause freezes —
  BL-617 froze chase/rotation deliberately and that stays. Approve if the
  alarm should name the pause; reject if a paused swarm alarming as if it
  were stalled is the intended posture.

source: |
  Specifier audit of `.swarmforge/daemon/handoffd.log`, 2026-08-01, while
  speccing BL-651. Full trail in
  `backlog/evidence/BL-651-live-starve-20260801.md` plus BL-651's own notes.

  - 16:00:06Z `.swarmforge/operator/control-pause.json` written
    (`{"active":true,"untilMs":1785657600000}` → 2026-08-02T08:00Z).
  - 16:04:51Z hardener→documenter `git_handoff` (BL-663) lands in the
    documenter worktree `inbox/new/` — sync-delivered by the sender's own
    `swarm_handoff.sh`, i.e. parcels STILL ARRIVE during a pause.
  - 16:00Z→17:41Z: 3660 `poll-skip-paused`, zero chase/rotate lines. BL-617
    suppresses delivery, chase, dispatch-gap, unassigned-active and
    open-slot sweeps while a pause is active. Working as designed.
  - 17:05:03Z `flow-watchdog-alarm ⚠️ WARN flow-stall: parcel … aged 1h0m in
