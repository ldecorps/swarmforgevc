id: BL-1035
title: "the front-desk supervisor's startup grace is nil-guarded, so a heartbeat FILE left by the dead instance condemns its replacement: bot spawned 06:13:56, \"stalled\" 06:13:58, respawned 06:14:02 - a tight loop that spends the restart budget in seconds"
