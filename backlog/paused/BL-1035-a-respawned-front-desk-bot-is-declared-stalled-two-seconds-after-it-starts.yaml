description: |
  ## What happens

  `front_desk_supervisor_lib.bb`'s `poll-heartbeat-stale?` waives staleness
  during the startup grace ONLY when `last-heartbeat-ms` is `nil`:

      (if (and started-at-ms (nil? last-heartbeat-ms)
               (< (- now-ms started-at-ms) startup-grace-ms))
        false
        (boolean (or (nil? last-heartbeat-ms)
                     (>= (- now-ms last-heartbeat-ms) stall-ms))))

  But the heartbeat is not per-process state. It is a FILE -
  `.swarmforge/operator/front-desk-poll-heartbeat.json`, rewritten by the bot
  on every completed poll cycle (`telegram-front-desk-bot.ts:231`) and read by
  `read-poll-heartbeat-ms` (`front_desk_supervisor.bb:313`). Nothing deletes or
  resets it at spawn; grep for the file name shows a reader and a writer and no
  clearer.

  So after any restart of a bot that was NOT polling successfully, the
  supervisor reads the dead instance's timestamp - non-nil and already older
  than the 90s stall window - the nil-guard does not fire, and the replacement
  is declared stalled on the first tick after spawn. Observed live in
  `.swarmforge/operator/front-desk-supervisor.log`:

      06:13:56  started bot pid= 4649 attempt= 3
      06:13:58  stalled bot no poll heartbeat within 90000 ms
      06:14:02  started bot pid= 5562 attempt= 4

  Two seconds, against a 90000ms grace that was written precisely to cover the
  first long-poll cycle.

  ## Why it matters beyond the noise

  The restart budget is bounded and attempts escalate toward the `gave-up`
  state (`FRONT_DESK_GIVEUP_COOLDOWN_MS`, 15 min). A loop that spends an
  attempt every ~4 seconds can exhaust that budget faster than any real fault
  would, taking the front desk fully down for a cooldown it never earned. It
  also amplifies both sibling defects: every extra respawn is another Telegram
  conflict window (BL-1036).

  ## How (direction, not mandate)

  - The grace's condition is the question "has THIS child had time to speak
    yet", so decide it from facts about this child - a heartbeat older than
    this child's own spawn time carries no information about it. Whether that
    is done by ignoring pre-spawn heartbeats, by stamping the writer's identity
    into the file, or by clearing the file at spawn is open; prefer whichever
    stays correct when the file is missing, unreadable, or written by a process
    that outlived a supervisor restart.
  - Keep the guard non-vacuous in the other direction: scenario 02 exists so
    that a replacement which genuinely never polls is still caught when its
    grace expires. A fix that simply widens or removes the stall check would
    reintroduce BL-370's original fault.
  - Preserve the log's clarity per the intake's constraint above: whatever
    decides the grace, a stall must still be recorded with the window it
    exceeded.

  ## Scope

  - swarmforge/scripts/front_desk_supervisor_lib.bb - `poll-heartbeat-stale?`
  - swarmforge/scripts/front_desk_supervisor.bb - `read-poll-heartbeat-ms` and
    the bot entry's `:heartbeat-stale?` predicate (line ~429)
  - extension/src/tools/telegram-front-desk-bot.ts - only if the fix needs the
    writer to record more than `lastHeartbeatMs`
  - specs/features/BL-1035-a-respawned-bot-gets-its-own-startup-grace.feature
    and its step handlers

  Out of scope: the Telegram 409 (BL-1036) and the restart cadence (BL-1037).

qa_e2e_procedure: >
  1. At the parent commit, with a fixture supervisor: write a poll-heartbeat
     file with a timestamp older than FRONT_DESK_STALL_MS, spawn a bot child
     that never writes a heartbeat, and run the supervisor loop. Confirm the
     absence of the fix first - the child is declared stalled within one tick,
     well inside the 90s startup grace, and a second spawn follows within
     seconds.

  2. At the parcel commit, repeat identically. Confirm the child survives its
     full startup grace, and that exactly one spawn happens in that window.

  3. Confirm the guard is still armed: keep the same fixture running past the
     startup grace with no heartbeat ever written, and confirm the child is
     then declared stalled and restarted.

  4. Confirm the clearing case: let the child write a heartbeat during its
     grace and confirm no stall is declared.

  5. Read the supervisor log for all of the above and confirm each stall is
     still recorded with the window it exceeded.

notes: |
  IR-DRY reviewed, not merely run. Three medium findings remain and must NOT
  be "fixed": `the spawned bot is declared stalled` / `... is not declared
  stalled` are a deliberate positive-negative pair (scenarios 02 and 03), as
  are `the spawned bot completes its first poll cycle` / `... completes no
  poll cycle`; and `the spawned bot is not declared stalled` scores against
  `the spawned bot is not declared stalled while its startup grace is running`
  because one asserts the state and the other bounds it to a window.

  An earlier draft said "the replacement" in some steps and "the bot" in
  others for the same subject; that was accidental drift and is fixed (16
  unique steps down to 13).

  No `required_wiring:` is declared: the predicate is already called from the
  bot entry's `:heartbeat-stale?`, so there is no new call site to pin.

