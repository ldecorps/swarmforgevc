  it can be put to test in a swarm controller environment..."
  The human's in-session answers to the specifier's three questions, same
  day: "Which tickets may the local coder@2 seat claim?" - "Low-cost
  tickets (Recommended)"; "Where should the local coder@2 run?" -
  "Separate pack you launch (Recommended)"; "When the local seat fails a
  parcel after its fix turns, what happens?" - "Hand it to Claude coder
  (Recommended)".

