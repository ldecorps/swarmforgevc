id: BL-1548
title: "start_handoff_daemon.sh honours SWARMFORGE_SKIP_DAEMON=1 before its audit machinery exists, so a skipped start request leaves no line in daemon-start-audit.log and the line's own SKIP_DAEMON= field can only ever read empty; audit the invocation first, then skip (still starting nothing, still not re-arming the stopped marker), and add the drift wiring test's case 05 proving the drift-repair bounce reached the launcher"
milestone: M8
type: defect
severity: medium
# medium: real but contained. The audit log is the launcher chokepoint's
# ledger and its invocation line carries a `SKIP_DAEMON=` field that is
# dead by construction - the =1 branch exits at line 32-35 before the
# field is written at line 48. A start request refused by the skip flag is
# invisible after the fact (postmortems read this log; a supervisor-chain
# relaunch under an inherited SKIP=1 would look like it never happened),
# and BL-1543's mint tripped on exactly that invisibility. No live fault,
# no data loss, no safety signal broken: not high.
status: todo
epic: swarm-reliability
priority: 6
direction: swarm-reported
depends_on: [BL-1543]
# BL-1543 (active) re-tenses the same test file to four cases; this ticket
