acceptance: specs/features/BL-1279-front-desk-fixtures-derive-their-bb-closure.feature

human_approval: approved
approval_context: >
  FIRM: the giveup fixture copies front_desk_supervisor.bb's derived
  load-file closure (copy_bb_closure) and runs assert_bb_closure_present
  before its first check, exactly as BL-1279's four fixtures do. FIRM: the
  supervisor it starts runs with SWARMFORGE_FLEET_HOME and BRIDGE_PORT
  inside or owned by its own fixture, both in the same commit as the
  closure fix. A version that loads without them frees the live bridge.

invariants: []

description: |
  ## What is wrong

  Coder note 002188 (2026-09-26 13:12Z), found during BL-1779's census
  run: "unowned-red test_front_desk_giveup*.sh missing lib in cp list".
  Verified at mint by reading the files. The test's `make_fixture` copies
  seven .bb files by hand (line 17). `front_desk_supervisor.bb` load-files
  `daemon_log_freshness_pulse_lib.bb` (line 98) and
  `self_heal_telemetry_lib.bb` (line 104), and `process_table_lib.bb`
  load-files `daemon_cycle_guard_lib.bb`, none of them copied, so every
  `check_once` dies at load. This is BL-1279's exact defect. BL-1279
  enrolled four fixtures by an Examples table naming
  `test_front_desk_supervisor_*`; this one's name did not match, so it
  was never enrolled. It is in `suite-manifest.tsv` as `standing`.

  Dying at load is also what keeps it harmless today. `check_once` passes
  fake TELEGRAM_* but neither `SWARMFORGE_FLEET_HOME` nor `BRIDGE_PORT`.
  Once it loads, it resolves the host's primary creds file (port 8765)
  under the real HOME. Before BL-1779 lands, and even after it (the
  default port is still 8765), BL-789's adopt-or-free then frees the
  live front-desk bridge before spawning its stub.

  ## What is wanted
  1. `make_fixture` derives the copy set with `copy_bb_closure` and runs
     `assert_bb_closure_present`, BL-1279's pattern (see
     `test_front_desk_supervisor_tick.sh` ~30-40).
  2. `check_once` passes `SWARMFORGE_FLEET_HOME` inside the fixture root
     and a `BRIDGE_PORT` of its own (the per-pid port convention its
     siblings use), in the same commit as item 1.
  3. BL-1279's feature gains this file as one Examples row in scenario 01
     (the static closure check). It also gets a row in scenario 03 (the
     test passes) only if the whole BL-1279 feature, run once with the
     row, stays comfortably inside the 300 s per-mutant ceiling (the
     2026-09-14 rule). Otherwise its green run is QA's step 1 and the
     ticket's register row discharge. Record the measured feature time in
     the evidence either way.
  **Never run this test on this host before items 1 and 2 are both in
  the checkout.**

  ## Scope
  - `swarmforge/scripts/test/test_front_desk_giveup_one_email_per_episode.sh`.
  - `specs/features/BL-1279-front-desk-fixtures-derive-their-bb-closure.feature`
    (Examples rows only) and its step handler only if a row needs it.

  ## Not in scope
  - The other census files (BL-1779 runs them). The supervisor's
    resolution and adopt-or-free rules (BL-1779, BL-1780).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `bash swarmforge/scripts/test/test_front_desk_giveup_one_email_per_episode.sh`:
     exit 0, no FAIL line. Before and after, the live bridge's pid on 8765
     (`lsof -ti tcp:8765 -sTCP:LISTEN`) is unchanged.
  2. `node specs/pipeline/cli.js specs/features/BL-1279-front-desk-fixtures-derive-their-bb-closure.feature`:
     all ok, including the new row(s).
  3. The register row naming this ticket is present on the parcel commit
     and is gone after the land (BL-1631).

