  `git grep -l 'front_desk_supervisor.bb' -- 'swarmforge/scripts/test/*.sh' | xargs grep -L copy_bb_closure`
  names 5 files, and only this one copies the supervisor into a fixture
  (`grep -c 'cp .*front_desk_supervisor\.bb'`). The other four drive it
  from the source tree.
