id: BL-1781
title: "test_front_desk_giveup_one_email_per_episode.sh, the fifth front-desk supervisor fixture BL-1279 never enrolled, still hand-lists seven .bb files and dies at load (red in the standing suite) - it derives its copy set with copy_bb_closure, runs the BL-1279 load guard, and gives its supervisor a fleet home and bridge port of its own so that, once it loads, its --check-once can never free the live bridge's port"
milestone: M8
type: defect
