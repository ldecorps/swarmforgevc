human_approval: approved
approval_context: >
  Reported by QA (note 003733) and traced by the specifier. No choice is
  posed. FIRM: a queue entry counts only while it is queued or running and
  only for the ticket it names; a finished land, a missing queue or an
  unreadable entry leaves the verdict as the mailboxes decide it.

invariants:
  - "The daemon's dropped-parcel sweep and dispatch_trail_cli.bb give the same verdict for the same ticket, and both count a lander-queue entry naming that ticket with status queued or running as a parcel in flight."
  - "A missing queue directory, an unreadable entry, an entry for another ticket, or an entry in any other status leaves the verdict exactly as the role mailboxes alone decide it."
  - "The consumers only read the lander queue; none writes, moves or deletes an entry."

source: |
