  ignores lander queue: re-sent queued BL-1879 to QA". QA's note 003732 to
  the coordinator the same minute, verbatim: "BL-1879 not dropped:
  QA-approved 3bef687e1f is in lander queue, lands next".
  Specifier trace, 2026-10-02 22:40-23:10Z:
  - .swarmforge/lander/queue/BL-1879-3bef687e1f.edn reads :status :queued,
    enqueued 18:48Z. The lander lands one entry at a time; BL-1892's run
    alone took until 21:44Z, so BL-1879, BL-1900 and BL-1882 sat queued for
    hours.
  - The coordinator's inbox holds four self-notes "BL-1879 no parcel in
    flight - possible drop." (19:35Z, 20:58Z, 21:28Z, 22:33Z), one per
    cooldown window.
  - chase_sweep_lib.bb's decide-dropped-parcel? reads live-mail? from
    build-dropped-parcel-trail-index over every role's new and in_process
    mailbox only. ticket-dispatch-verdict-in, which dispatch_trail_cli.bb
    prints and route_backlog_to_coder.sh acts on, reads the same facts.
    Neither file mentions the lander.
  - route_backlog_to_coder.sh routes a DROPPED ticket without --force
