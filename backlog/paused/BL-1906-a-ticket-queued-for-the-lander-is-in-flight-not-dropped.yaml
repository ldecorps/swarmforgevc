    the coder "Work <id>" for a parcel QA already approved.

description: |
  ## What is wrong

  Under BL-1872, QA approves a parcel by queueing it with lander_queue.bb
  and completing the git_handoff. The lander lands one entry at a time.
  Until it does, the ticket has no handoff in any role's mailbox, so once
  its last trail event is older than the stall threshold the dropped-parcel
  sweep nudges the coordinator once per cooldown window, and
  dispatch_trail_cli.bb answers DROPPED.

  ## What is wanted

  - A lander-queue entry whose `:status` is `:queued` or `:running`, and
    whose task names the ticket, counts as a parcel in flight for both
    consumers: handoffd.bb's dropped-parcel-sweep! (no nudge) and
    dispatch_trail_cli.bb's `dispatched` verb (DISPATCHED).
  - `:landed` and `:refused` entries change nothing. The lander has already
    sent the bookkeep note or the refusal note, so a ticket that sits after
    that is a real drop.
  - Direction, not mandate: the module that owns the queue answers the
    question (engineering rule, BL-1811). One function in lander_lib.bb
    returning the set of tickets with a land in flight, mapped by the
    lander's own task-to-ticket rule (ticket-of), never a second glob of
    `.swarmforge/lander/queue/*.edn`. Fold that set into live-ids once, so
    that dropped-parcel-evaluation and ticket-dispatch-verdict-in cannot
    disagree.
  - Scenarios 01 and 02 drive handoffd.bb's own dropped-parcel-sweep!,
    loaded under its BL-1395 guard with a mkdtemp root bound through
    `*command-line-args*` (bl1494_post_qa_sweep_wake_field_test_runner.bb's
    idiom). Do not drive dropped_parcel_sweep_harness.bb, which mirrors the
    daemon by hand and would leave the daemon's call site ungated. Stub the
    send the bl1494 way, or deliver into the fixture's own mailboxes the way
    BL-719's handlers do. Never the live root. If the harness stays in use
    by BL-719 and BL-1301, give it the same input in the same commit.
  - Scenario 03 runs the real dispatch_trail_cli.bb against the fixture root.
  - The step handler `bl1906LanderQueuedTicketInFlightSteps`, registered in
    the same parcel, scoped to this feature (BL-1301's handler shows why:
    the sweep step text reads naturally in several features). The fixture
    root is `git init` under mkdtemp, proven by `rev-parse --git-common-dir`
    before any mutating git command (BL-1390).

  ## Scope

  lander_lib.bb (the reader), chase_sweep_lib.bb and/or handoffd.bb and
  dispatch_trail_cli.bb (feeding it in), their bb unit runners, the step
  handler, evidence.

  ## Out of scope

  - BL-1479's parked-active sweep also reads live-ids, but it parks only
    `status: blocked` or future `not_before` tickets, which QA does not
    approve. Reuse the same set there if it is free; do not add a scenario.
  - Why the lander is slow, and a queued entry stuck behind a broken lander
    sweep. A running land past an hour is reported to QA by the lander
    (lander_lib.bb overdue-note); a broken sweep shows as lander-error lines
    in handoffd.log. BL-1870's remaining slice removes most of the land
    step's work.
  - The coordinator.prompt interim (landed by the specifier at mint).

qa_e2e_procedure: |
  On the parcel commit, from your worktree:
  1. ONE run: `node specs/pipeline/cli.js specs/features/BL-1906-a-ticket-queued-for-the-lander-is-in-flight-not-dropped.feature`:
     10 of 10 ok (outlines of 4, 3 and 3 rows).
  2. ONE run each, all measured at mint on main 553f926932: BL-719's
     feature 6 of 6 ok (23 s), BL-1301's 8 of 8 ok (39 s), BL-1415's 6 of 6
     ok (24 s); `bb swarmforge/scripts/test/dropped_parcel_test_runner.bb`,
     `lander_lib_test_runner.bb` and
     `bl1097_router_dispatch_trail_test_runner.bb` ALL PASS (about 1 s
     each). Same results expected.
  3. Read-only against the live root, from your worktree: for every
     `.swarmforge/lander/queue/*.edn` reading `:status :queued` or
     `:running`, `bb swarmforge/scripts/dispatch_trail_cli.bb <master-root>
     dispatched <ticket>` prints DISPATCHED. If the queue holds none, say so
     in the evidence; the fixture rows are the proof.
  4. Read handoffd.bb's dropped-parcel-sweep! and confirm the scenarios
     loaded that function, not a copy of it.

