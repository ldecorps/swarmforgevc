approval_context: >
  No new feature file. Minted approved under the 2026-09-17 operator
  hotfix (severity defect, no ruling_options). FIRM: operator_runtime.bb's
  refusal of a non-checkout root stays (BL-1517); the test adapts. FIRM:
  the fixture root is a `git init` under mkdtemp, proven by
  `git -C <root> rev-parse --git-common-dir` naming the fixture's own .git
  before any git command runs, and the live repository is never touched
  (engineering Guardrails, BL-1390). FIRM: every assertion the test makes
  today stays.

invariants:
  - "The watchdog test's fixture root is its own git checkout, and no git command in the test resolves to the live repository."

description: |
  ## What is wrong

  QA note 003152 and evidence 7d558cc562: the babysitter runner sweep
  (BL-1720's qa_e2e step 2) reached
  `swarmforge/scripts/test/test_operator_runtime_babysitterd_watchdog.sh`,
  which exited 2 with `REFUSED project-root /tmp/tmp.gInNOieaZC: not inside
  a git checkout (git -C <arg> rev-parse --git-common-dir failed)`. QA
  reproduced it on origin/main's own scripts; the specifier reproduced it
  on main (`REFUSED project-root /tmp/tmp.I50M7vel19: ...`, exit 2).

  `make_fixture` (line 28) is `d="$(mktemp -d)"` plus copied scripts;
  `operator_runtime.bb "$root" --tick-once` refuses such a root since
  BL-1517 (`git log -S'not inside a git checkout'`: 3252212a66,
  2026-09-22). The test was never updated when BL-1517 landed.

  ## What is wanted
  - `make_fixture` `git init`s the root (and commits what the runtime
    needs), proves the root with `rev-parse --git-common-dir`, and the test
    passes with every current assertion.

  ## Scope
  - `swarmforge/scripts/test/test_operator_runtime_babysitterd_watchdog.sh` only.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `bash swarmforge/scripts/test/test_operator_runtime_babysitterd_watchdog.sh`:
     exit 0, no REFUSED line.
  2. `node specs/pipeline/cli.js specs/features/BL-906-operator-babysitterd-freshness-watchdog.feature`:
     all ok.
  3. `git diff main...HEAD --name-only` names only the test file and
     evidence.
  4. After landing: REGISTER_ROW_RETIRED for the test's row; resume
     BL-1720's land.

