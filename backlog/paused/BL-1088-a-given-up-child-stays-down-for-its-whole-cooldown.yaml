id: BL-1088
title: "`check-one!` re-arms a given-up child the moment its recorded process is dead, so the 15-minute give-up cooldown all six supervisors declare never applies to the crash-loop case it was written for - and a second test asserts the opposite of the first, so the repo holds two contradictory contracts over one function"
milestone: M8
type: defect
severity: high
# high, not critical: a broken safety mechanism - the bounded restart budget
# six live supervisors rely on - degraded to an unbounded ~2s respawn loop.
# Measured on main, not read off the code. Not critical because the child does
# keep coming back up and no work is lost; the cost is a hot loop, not an
# outage.
status: todo
epic: swarm-reliability
assigned_to: coder
priority: 15
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1088-a-given-up-child-stays-down-for-its-whole-cooldown.feature
human_approval: approved
invariants:
  - "A declared cooldown is the delivered cooldown: a child that has reached give-up is not respawned until its configured `giveup-cooldown-ms` has elapsed, whatever the liveness of the process recorded against it."
  - "Give-up stays a TIMED state, never terminal: once the cooldown DOES elapse the child re-arms with a fresh budget. Restoring the bound must not restore BL-303's sticky give-up."
  - "One contract per behaviour: no two executable assertions in the repo may demand contradictory results from `check-one!` for the same inputs."

description: |
  ## The mechanism

  `swarmforge/scripts/front_desk_supervisor_lib.bb`'s `check-one!` decides
  what happens to a child already in the `gave-up` state:

      "gave-up"
      (if (or (cooldown-elapsed? (:gave-up-at-ms entry) now-ms giveup-config)
              (and (:pid entry) (not (pid-alive? (:pid entry)))))
        (do
          (when (:pid entry) (kill-pid! (:pid entry)))
          {:entry (started-entry (assoc entry :attempts 0) now-ms (spawn!)) :event :re-armed})
        {:entry entry :event nil})

  The second disjunct re-arms as soon as the recorded process is dead. But a
  child reaches `gave-up` by crash-looping until it exhausts its attempt cap -
  so in that case the process is ALWAYS dead. The `or` short-circuits true on
  the very next tick and the cooldown is never consulted.

  So the cooldown is vacuous for precisely the case it exists to bound. The
  re-arm also resets `:attempts` to 0, so the attempt cap resets too: crash ->
  attempts climb to the cap -> gave-up -> next tick re-arm -> crash, forever.

  ## Measured on main, not inferred

  Driving the pure function directly with a 15-minute cooldown 100ms in, a
  dead pid, and an exhausted budget:

      cooldown-elapsed?  => false
      event              => :re-armed
      next status        => running
      next attempts      => 1
      spawns called      => 1

  It re-armed with the cooldown 899,900ms from elapsing.

  ## Blast radius: six supervisors, all of them

  Every one of these loads the lib and passes a 900000ms (15-minute) default
  cooldown, each behind its own env override:

  - `front_desk_supervisor.bb`            (`FRONT_DESK_GIVEUP_COOLDOWN_MS`)
  - `bridge_headless_supervisor.bb`       (`BRIDGE_HEADLESS_GIVEUP_COOLDOWN_MS`)
  - `cursor_bridge_supervisor.bb`         (`CURSOR_BRIDGE_GIVEUP_COOLDOWN_MS`)
  - `operator_runtime_supervisor.bb`      (`OPERATOR_WATCH_GIVEUP_COOLDOWN_MS`)
  - `onboarder_supervisor.bb`             (`ONBOARDER_GIVEUP_COOLDOWN_MS`)
  - `negotiation_relay_supervisor.bb`     (`NEGOTIATION_RELAY_GIVEUP_COOLDOWN_MS`)

  `front_desk_supervisor.bb` ticks every 2000ms. So the declared bound is 15
  minutes and the delivered bound is 2 seconds - a factor of 450 - and for a
  child that can never start, there is no bound at all. For the front-desk bot
  specifically a respawn loop is not merely wasted CPU: overlapping bot
  instances are a known source of self-inflicted Telegram 409 conflicts.

  ## Two contradictory contracts, both live, both green-or-red today

  This is the part that makes the fix a decision rather than a one-liner.

  - `swarmforge/scripts/test/test_front_desk_supervisor_tick.sh` asserts
    `bl-303 supervisor-recovery-02 [not elapsed]: still gave-up, not
    restarted`. It **FAILS on main** - deterministically, 3 runs of 3.
  - `swarmforge/scripts/test/cursor_bridge_supervisor_test_runner.bb:19`
    asserts `gave-up with dead pid should re-arm immediately`, with
    `:gave-up-at-ms 1000000`, `now-ms 1005000` and a 900000ms cooldown - i.e.
    5 seconds into a 15-minute cooldown, dead pid. It **PASSES on main**.

  Same function, same conditions, opposite required outcomes. Whichever way
  this is fixed, one of these two assertions must be retired - retired, not
  reworded, because the surviving contract's own scenarios are the coverage.

  ## Where it came from

  `git log -L` on those lines: the disjunct was added by `c98e1c8d8`,
  **BL-696** - "cursor-bridge test harness, supervisor fixes, and QA auth/step
  fixes", a Mini App cursor-audio ticket. Changing the shared give-up
  semantics for all six supervisors was outside that ticket's scope, and the
  contradicting assertion landed in the same parcel that broke the other one.

  ## Why nobody has fixed it

  The failure has been observed at least three times and correctly ruled out
  as unrelated to the parcel in hand each time, and never ticketed:

  - `backlog/evidence/BL-1035-architect-pass-20260822.md` - "exactly one
    failure ... matches the commit's claimed pre-existing failure exactly ...
    predates and is unrelated to this change."
  - `backlog/evidence/BL-1037-hardener-pass-20260822.md` - "confirmed
    PRE-EXISTING and unrelated ... Matches this same hardener's own BL-1035
    pass note earlier today."

  Each of those judgements was right about its own parcel. The failure simply
  had no owner. The hardener has now escalated it by note, which is what this
  ticket is.

  ## How (direction, not mandate)

  The reading that fits the declared design: the cooldown wins, and the
  dead-pid disjunct goes. `gave-up` means "this child has spent its budget;
  hold it down for the configured window" - liveness of the corpse is not new
  information, it is the definition of the state.

  A supervisor that genuinely needs to recover faster than 15 minutes already
  has the sanctioned lever: **lower its own** `*_GIVEUP_COOLDOWN_MS`. All six
  already read one. That serves the cursor bridge's evident intent without
  removing the bound for the other five, and needs no new mechanism.

  Keep BL-403's guard intact: the re-arm path must still `kill-pid!` any
  process recorded against the entry before spawning a replacement, since a
  child can reach `gave-up` from `stalled` while still alive.

  If the architect concludes instead that some supervisor must bypass the
  cooldown on a dead pid, that must become an explicit per-supervisor opt-in
  with its own justification - never the default for all six - and the
  front-desk assertion is then the one retired.

  ## Scope

  - `swarmforge/scripts/front_desk_supervisor_lib.bb` - the `gave-up` branch
    of `check-one!`.
  - `swarmforge/scripts/test/cursor_bridge_supervisor_test_runner.bb` OR
    `swarmforge/scripts/test/test_front_desk_supervisor_tick.sh` - retire
    whichever assertion loses. Retiring the superseded assertion is IN scope
    for this ticket and must not be left for a later parcel to trip over.
  - Step handlers for this ticket's feature file land in this same parcel
    (BL-233: the acceptance runner throws on a scenario with no handler).
  - Out of scope: `poll-heartbeat-stale?` and startup grace - that is BL-1043,
    a different function in the same file. See notes.

qa_e2e_procedure: >
  1. At the parent commit, confirm BOTH halves of the contradiction are live:
     `bash swarmforge/scripts/test/test_front_desk_supervisor_tick.sh` fails on
     `bl-303 supervisor-recovery-02 [not elapsed]`, and
     `bb swarmforge/scripts/test/cursor_bridge_supervisor_test_runner.bb`
     passes. Both, not just the red one - the point of this ticket is that they
     disagree.

  2. At the parent commit, reproduce the defect directly against the pure
     function: drive `check-one!` with an entry in `gave-up`, a dead pid, an
     exhausted budget and a cooldown that has NOT elapsed. Confirm it returns
     `:re-armed` with `spawn!` called - i.e. the cooldown was skipped.

  3. At the parcel commit, repeat step 2 and confirm the child stays
     `gave-up`, no spawn happens, and `cooldown-elapsed?` is what actually
     decides.

  4. Confirm the bound is not merely restored but genuinely bounded: tick a
     permanently failing child repeatedly across one cooldown window and count
     spawns. It must not exceed the configured attempt cap.

  5. Confirm the guard is still ARMED - the regression that matters most, and
     the one BL-303 exists to prevent: advance past the cooldown and confirm
     the child DOES re-arm with a fresh budget. A fix that makes `gave-up`
     terminal again is a worse defect than the one being fixed.

  6. Confirm BL-403 is intact: re-arm from a `gave-up` entry whose pid is
     still ALIVE and confirm that pid is terminated before the replacement
     spawns, so only one child is ever alive per supervisor.

  7. Confirm the shorter-cooldown lever works, since it is the answer given to
     anyone who needed the old fast re-arm: set a supervisor's own
     `*_GIVEUP_COOLDOWN_MS` low, and confirm it re-arms after that shorter
     window and not before.

  8. Confirm the repo now holds ONE contract: run the whole shell/bb supervisor
     suite and confirm it is green with no assertion anywhere still demanding
     the retired behaviour. Specifically re-run both tests from step 1.

  9. Confirm scope: `git diff` the parcel and confirm `poll-heartbeat-stale?`
     and the startup-grace logic are untouched (that is BL-1043's).

approval_context: >
  The decision that needs a human is WHICH CONTRACT WINS, because the repo
  currently asserts both and the code cannot satisfy both.

  The ticket recommends the cooldown: `gave-up` holds the child down for its
  configured window regardless of the corpse's liveness, and any supervisor
  wanting faster recovery lowers its own `*_GIVEUP_COOLDOWN_MS` - a lever all
  six already have. That restores the bounded restart budget BL-303 was
  written to establish, and the change is a one-line predicate.

  The alternative reading is that a dead child should come back at once and the
  cooldown only ever meant to throttle a wedged-but-alive one. That is
  defensible on its face, but as written it applies to all six supervisors and
  leaves a permanently broken child respawning every 2 seconds forever, which
  no supervisor here declares as its intent.

  What is firm either way: the contradiction must not survive this ticket, and
  the losing assertion is retired rather than reworded. What is open: whether
  any supervisor gets an explicit per-supervisor opt-in to the fast re-arm, and
  if so which and why.

source: |
  Escalated by the hardener as a priority-00 note, 2026-08-23:
  "test_front_desk_supervisor_tick.sh bl-303 recovery-02 fails on main,
  untracked" - i.e. the failure is real, reproducible on main, and no ticket
  tracks it. The test file itself is git-tracked; "untracked" means unowned.

  Verified by the specifier before minting: failure reproduced 3/3 on main,
  root cause traced to `c98e1c8d8` (BL-696) via `git log -L`, the contradicting
  cursor-bridge assertion found and confirmed passing, and the re-arm-despite-
  cooldown behaviour reproduced directly against the pure function.

notes: |
  ORTHOGONALITY - read before promoting. BL-1043 is ACTIVE and edits the SAME
  FILE (`front_desk_supervisor_lib.bb`), though a different function
  (`poll-heartbeat-stale?`, startup grace; this ticket is `check-one!`'s
  `gave-up` branch). Per the constitution's Concurrent Work Orthogonality rule
  these two should NOT be concurrently active. Sequence them; the priority is
  set adjacent to BL-1043's deliberately so they sort together.

  IR-DRY: the checker reports one medium-confidence possible-synonym finding,
  "the give-up cooldown has elapsed" vs "the give-up cooldown has not yet
  elapsed". Reviewed and deliberately kept: these are the two sides of the
  threshold the feature exists to test, not accidental drift, and their Thens
  differ (stays down / re-arms), so collapsing them into one outline would lose
  the distinction. The checker's own guidance is to normalize only accidental
  drift. Do not re-litigate this as a lint failure.

  The earlier draft of the feature file put "the cooldown has not yet elapsed"
  in the Background, which two scenarios then had to contradict; that was fixed
  before commit rather than suppressed.
