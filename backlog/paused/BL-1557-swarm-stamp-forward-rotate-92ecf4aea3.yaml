  live forward-rotation is identified by a `handoff-forward` row whose
  `to` is not coder following a git_handoff send.

qa_e2e_procedure: |
  On the parcel commit:
  1. `git diff main...HEAD --name-only` names only evidence, the feature,
     the step handler (+ lib/), and files under swarmforge/scripts/test/;
     none of the seven hotfix production/doc files (invariant 1).
  2. `run_acceptance.sh` on the BL-1557 feature -> 4 scenarios green
     (scenario 01 = 8 rows).
  3. `bash swarmforge/scripts/test/test_ready_for_next_rotate_home.sh`
     ALL CHECKS PASSED with cases 10-15 (and the new master-rows case if
     added) in its PASS lines; `bb
     swarmforge/scripts/test/mono_router_lib_test_runner.bb` ok.
  4. The evidence file records review goal 4's count and goal 5's
     post-timeout trace explicitly.
  5. `backlog/hotfix-ledger.yaml` row 92ecf4aea3: `human_decision: null`.
  6. After done: the human runs `bb swarmforge/scripts/hotfix_ledger_update.bb .
     --decide 92ecf4aea3 approved|waived` and commits the ledger.
