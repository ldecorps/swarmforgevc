id: BL-1453
title: "Thirteen more TypeScript sites carry a private ^BL-\\d+ ticket pattern (Telegram ambulance and expedite, cursor operator exec, legacy topic reconcile, catch-up feed, telegram control core, bridge ticket update, feature-handler registration text, deprecate-check id parsing, delivery-metrics path classifiers), so a GH-<n> ticket cannot be ambulanced, expedited, reconciled or counted; every site uses BL-1452's shared predicate and none keeps a private one"
milestone: M8
type: defect
severity: medium
# medium: real but contained. Each site excludes GH tickets from one
# feature every BL ticket has; no safety signal is broken (that half is
# BL-1452) and only two GH tickets are live. Not low: an operator's
# /ambulance or Expedite tap on a GH ticket fails silently today.
status: todo
epic: swarm-reliability
priority: 30
direction: swarm-reported
depends_on: [BL-1452]
mutation_cost: medium
slice_size_envelope: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]

acceptance: specs/features/BL-1453-every-typescript-tool-accepts-github-seeded-ticket-ids.feature

human_approval: pending
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. Minted by the specifier together
  with BL-1452 from a sweep of extension/src for BL-only patterns; the
  sweep's hit list is in the description and the ticket asks the coder to
  re-derive it by grep at build, not to trust the list.

invariants:
  - "Exactly one ticket-id predicate exists on the TypeScript side (BL-1452's module); every site that decides whether a string is a backlog ticket id calls it, and a grep of extension/src for a BL-only anchored pattern finds nothing outside that module."
  - "Widening the namespace changes no other behaviour: each site's tests pass unchanged for BL ids, and the GH case is added beside them, never replacing them."

required_wiring:
  - 'extension/src/tools/telegramOperatorAmbulance.ts::isBacklogTicketId::the ambulance command must validate through the shared predicate; absent today'
  - 'extension/src/tools/telegramCursorBridgeExpedite.ts::isBacklogTicketId::the expedite command must validate through the shared predicate; absent today'
  - 'extension/src/metrics/deliveryMetrics.ts::isBacklogTicketId::the path classifiers must recognise a GH ticket file; absent today'
  - 'specs/pipeline/steps/bl1453EveryToolAcceptsGhIdsSteps.js::registerSteps::the handler file exists so discovery registers every scenario (BL-1371)'

description: |
  ## What is wrong

  Swept 2026-09-06 (`grep -rn '\^BL-\|BL-\\d' extension/src`, tests
  excluded) while minting BL-1452. Sites with a BL-only ticket pattern,
  beyond the two BL-1452 fixes:

  - `tools/telegramOperatorAmbulance.ts:39` and `tools/telegramControlCore.ts:75`
    (`/ambulance <id>`): a GH ticket cannot be ambulanced from Telegram.
  - `tools/telegramCursorBridgeExpedite.ts:7` (`TICKET_PATTERN`): the pager
    Expedite tap and /qjump refuse a GH ticket.
  - `tools/telegramCursorOperatorExec.ts:327, 339`: operator exec ticket
    checks.
  - `tools/batchRecoveryArgs.ts:7`: batch recovery CLI.
  - `concierge/legacyTopicReconcile.ts:10` (`PER_TICKET_KEY_PATTERN`) and
    `bridge/catchUpLive.ts:62`: a GH ticket's topic is neither reconciled
    nor fed.
  - `tools/telegramCursorBridgeUpdate.ts:64` (`id: (BL-\d+)`): the bridge
    ticket update never matches a GH ticket file.
  - `tools/featureHandlerRegistrationText.ts:84`: a GH feature file's id is
    not extracted (its handler registration message is blank).
  - `tools/deprecate-check.ts:98, 209, 268, 328`: a GH ticket is never
    parsed as a subject or a dependency by the freshness gate.
  - `metrics/deliveryMetrics.ts:246-258`: a GH ticket's YAML is not a
    slice path, so it is neither counted as active nor as delivered.

  `metrics/swarmMetrics.ts:475` (`/^(BL|GH)-?(\d+)/i`) and the bb side
  already accept both; the exclusion is confined to the sites above. The
  coder re-derives the list by grep at build: the sweep is evidence, not a
  contract (BL-1408 posture).

  ## What is wanted

  - Every site above validates or extracts a ticket id through BL-1452's
    shared predicate (or a shared extractor beside it for the sites that
    pull an id out of a longer string), so a GH id is accepted wherever a
    BL id is (scenario 01, wiring anchors 1-3).
  - No private BL-only pattern remains under `extension/src` outside the
    shared module (scenario 02, invariant 1) - derived by grep, so the
    next site added is caught.
  - Each site's existing BL tests pass unchanged; the GH case joins them
    (invariant 2).

  ## How (direction, not mandate)

  - The shared module gains an extractor (`extractBacklogTicketId(text)`
    returning the leading id or undefined) for the sites that match inside
    a string (`telegramControlCore`, `telegramCursorBridgeUpdate`,
    `featureHandlerRegistrationText`, `deprecate-check`); the path
    classifiers in `deliveryMetrics.ts` build their regexes from the
    module's namespace list rather than literals.
  - Scenario 02's handler greps `extension/src` for `\^BL-\\d|\\bBL-\\d\+\\$`
    and allows only the shared module and `swarmMetrics.ts`'s
    deliberately unanchored task-name matcher (name it in the allow list
    with the reason).
  - Fixtures: each site has a unit test today; add a GH row beside the BL
    row rather than a new file. Telegram commands are pure parsers and
    need no bot.
  - Documenter: the operator how-tos for /ambulance and Expedite say GH
    ids are accepted; `docs/reference/Specification.MD`'s ticket-id
    convention names both namespaces. No diagram trigger fires.

  ## Out of scope

  - The bounce recorders and the sibling checker (BL-1452).
  - The bb side.
  - Any new id namespace.

qa_e2e_procedure: |
  1. The BL-1453 feature passes all ten runs; every touched site's own
     unit and property tests pass; `npm test` green.
  2. Live: in the operator's Telegram topic, `/ambulance GH-29` is
     recognised (engage, then release); the pager's Expedite on GH-29
     records the tap; both recorded in QA evidence and reverted.
  3. `node extension/out/tools/deprecate-check.js . GH-29` parses the
     ticket (a decision, not a parse refusal).
  4. `grep -rn '\^BL-\\d\|\\bBL-\\d+\\$' extension/src` lists only the
     shared module and swarmMetrics.ts's task-name matcher.

notes: |
  Minted 2026-09-06 by the specifier with BL-1452; depends_on BL-1452 for
  the predicate it consumes. The three wiring anchors name the sites with
  a live operator-facing consequence (ambulance, expedite, delivery
  counts); the rest are gated by scenario 02's derived grep.

  INVEST at mint: Independent (waits only on BL-1452, a landed-first
  prerequisite, never a co-parcel), Negotiable (extractor shape and the
  path-classifier construction are direction), Valuable (one outcome: a
  GH ticket is a first-class ticket in every tool), Estimable (thirteen
  mechanical swaps, one extractor, one grep handler; medium), Small (two
  scenarios, ten runs, two invariants - an outline over sites, not a
  scenario per site), Testable (pure parsers; a derived grep).

