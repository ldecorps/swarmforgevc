qa_e2e_procedure: |
  On the parcel commit:
  1. `run_acceptance.sh` on the BL-1561 feature -> 3 scenarios green
     (scenario 01 = 6 rows).
  2. `bb swarmforge/scripts/test/tool_miss_heal_lib_test_runner.bb` ->
     ALL TESTS PASS, with the hotfix's five healed-command cases unchanged
     and the new data-token / existing-helper cases present in its source.
  3. `bash swarmforge/scripts/test/test_tool_miss_heal_hook_wiring.sh` ->
     ALL SCENARIOS PASS.
  4. Live, from any role worktree that carries the commit: write a file
     holding the zsh miss line, grep it with `-n` for that line through the
     seat's ordinary Bash tool, and read the matched line back UNCHANGED
     (the token still bare) with exit 0.
  5. `specs/features/BL-913-pinned-shell-and-one-classified-retry.feature`
     narrative no longer says "one of three"; its stamp header and
     scenarios are byte-identical.
