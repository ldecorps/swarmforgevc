source: |
  Hardener defect note 2026-08-20 ("Defect: renderBriefingBurndownCli 20s
  budget < its own 23s work - flakes for all"), specifier-probed the same
  day: `npx vitest run test/renderBriefingBurndownCli.test.js -t "runs with
  no flags at all"` failed outright in isolation - "Test timed out in
  20000ms", actual work 50808ms at host load average 148 on 4 cores (the
  full 7-role swarm was running). Direct successor to BL-914/BL-815.

acceptance: specs/features/BL-969-burndown-noflags-cli-test-timeout.feature

description: |
  ## What

  `extension/test/renderBriefingBurndownCli.test.js` has five tests. Two
  (the derive-from-real-repo fallbacks) got 45000ms per-test overrides from
  BL-914. Two take a fixture snapshot and are genuinely fast. The fifth -
  "the compiled CLI runs with no flags at all against the real repo
  (unchanged pre-BL-897 behavior)", added by BL-897 on 2026-08-15 - calls
  `main()` with no `--snapshot` flag, so `renderBriefingBurndown` takes the
  `runGitLog`/`deriveTicketLifecycles` walk over the real repo and renders
  a real PNG through mermaidRender.ts (beautiful-mermaid + native resvg):
  the SAME heavy work as the two override-carrying tests. It carries no
  override and runs on the 20000ms suite default.

  BL-914's ticket (and the comment block it left at the top of this test
  file's heavy section) states "the file's other three tests take a fixture
  snapshot and stay fast" - wrong for this one test, which is why BL-914's
  otherwise-thorough inventory missed it. BL-815's 2026-08-17 evidence run
  also never flagged it (it presumably squeaked under budget that day).

  ## How (direction, not mandate)

  Same fix BL-914 applied to its six tests: an explicit third-argument
  per-test timeout on this one `test()` call site. Floor it at 60000ms
  (scenario 01) - 45000ms parity with the siblings would already have lost
  to the 50808ms measurement above. Stay within BL-914's one-order-of-
  magnitude ceiling (200000ms). Do NOT touch
  `extension/vitest.config.mjs`'s global `testTimeout: 20000` (scenario 02).

  Also correct the stale BL-914 comment in the test file (the "other three
  tests take a fixture snapshot and stay fast" sentence) so the
  misclassification that caused this miss does not survive the fix - Gherkin
  cannot gate a comment, so this rides the parcel as ordinary scope.

  ## Scope

  The one named `test()` call site and the stale comment block in
  `extension/test/renderBriefingBurndownCli.test.js`, plus this ticket's own
  step handlers (new `specs/pipeline/steps/bl969*.js`, reusing
  `specs/pipeline/steps/lib/testTimeoutParser.js` - the handlers do not
  exist yet and must land in the coder's parcel, BL-233). NOT
  vitest.config.mjs, NOT the two siblings' existing 45000ms values, NOT any
  other test file, NOT the underlying render/derivation performance.
  Orthogonal to in-flight BL-910 (its parcel touches notDoneBurndown*.ts
  and its own tests, not this file).

invariants:
  - "No test in renderBriefingBurndownCli.test.js that derives history from the real repo (rather than a fixture snapshot) runs on the suite-default timeout - checkable by reading each test's data source against its test() timeout argument."

qa_e2e_procedure: |
  From `extension/`: run `npx vitest run test/renderBriefingBurndownCli.test.js`
  twice, recording `uptime` alongside each run. All 5 tests pass both runs
  with no timeout failure. Then `git diff main -- extension/vitest.config.mjs`
  is empty (suite default untouched). A pass at trivial host load does not
  prove headroom by itself - record the load so the evidence says what it
  actually covers.

notes: |
  Sibling-override question deliberately NOT folded in: the 50808ms sample
  also exceeds the two siblings' 45000ms budgets, but that is one sample at
  an extreme load (148 on 4 cores, ~37x oversubscribed) and the siblings
  have held in practice since BL-914 landed 2026-08-19. If they measurably
  flake, that is a new defect note and its own ticket - an approval here
  authorizes only this ticket's work.

  Lineage: BL-815 (classification) -> BL-914 (six overrides; amended
  2026-08-18 to adopt this file's two fallbacks on a QA note) -> BL-969
  (the fifth test both passes missed). Third pass on this file's timeout
  class; the invariant above is what should make it the last.

