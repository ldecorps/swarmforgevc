id: BL-1410
title: "Seventeen acceptance step handlers take their fixture root from extension/test's mkTmpDir, whose Vitest afterEach sweep the node --test acceptance runner never loads, so every acceptance run of those features leaks its scratch root; two more define a local bare mkdtemp that leaks under any runner - migrate this sub-class to the steps-lane helper, the targeted migration BL-1226's gate deliberately leaves out"
milestone: M8
type: defect
severity: medium
# medium: real but contained. Temp-directory litter on every acceptance run
# of eleven-plus features, and two handlers that leak under Vitest as well;
# the /tmp census BL-1226 cites (24774 bl* dirs) is what this class
# accumulates into. No live fault, no safety signal broken. Not low: the
# hardener found it on a parcel it was NOT reviewing for, and the cleaner had
# to catch BL-1364's instance by hand - the class recurs one handler at a
# time until the population is migrated and BL-1226's gate lands behind it.
