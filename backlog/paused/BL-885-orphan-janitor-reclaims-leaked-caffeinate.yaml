approval_context: >
  What needs sign-off is the DESIGN DECISION, which departs from the intake's
  own leaning with evidence: the intake suggested keying the sweep off the
  pidfile (stale/mismatched-PID detection), but the pidfile references at most
  ONE process — the specifier probed the live host (2026-08-12) and confirmed
  the other 52 leaked caffeinates are unreferenced by anything, so pidfile-only
  detection structurally cannot reclaim them and fails the verbatim human ask
  ("catch those"). The spec instead proves ownership the way the janitor
  already does for vitest trees: exact `-dims` argv AND cwd under the host
  root/registered worktrees (probe confirmed every leaked one carries such a
  cwd), with the pidfile's live PID as a never-reap exemption and an age gate
  for the launch race. Also sign off severity `medium` (contained impact:
  caffeinate is ~0 CPU; harm is indefinite sleep-prevention plus unbounded
  slow accumulation). Firm and not reopened: the fix lives in the existing
  janitor, and the launch path is not changed.

source: |
  backlog/INTAKE-orphan-janitor-caffeinate-dims-reclaim.md (human via chat
