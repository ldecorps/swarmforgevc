description: |
  ## What is wanted
  Each site below builds its broken copy with BL-2116's
  createScratchRoot(prefix) and writeBrokenCopy(root, realPath, transform)
  (extension/test/helpers/nonVacuityProbe.js) and calls cleanup() in its
  finally. Pass the probe's own mutation as the transform, so no second
  write of the broken text is needed. Where the test also used a separate
  mkTmpDir fixture root, keep it as a separate root: do not reuse the
  scratch root as the fixture.
  Every probe still fails its assertion against the broken copy.

  ## Sites (read with offset and limit around each line, never the whole file)
  - extension/test/bl1458BriefingTriggerInvariants.property.test.js:107, :164
  - extension/test/bl1459DocumenterBriefingTipGuardInvariants.property.test.js:165, :331, :372, :400, :483
  - extension/test/bl1505DedupSuppressedChaseCountInvariants.property.test.js:176
  - extension/test/bl1835PauseExemptsBriefingInstructionInvariant.property.test.js:197

  ## Salvage
  The coder seat's stash on swarmforge-coder, "BL-1743 WIP salvage before
  respawn (coder loop-halt 01:56Z)", already swaps bl1458, bl1459 and
  bl1505 onto this API (plus bl1630, which is BL-2118's). Use it as a
  reference, not a patch: it writes the copy twice and leaves the old
  fs.rmSync(brokenPath) beside cleanup().

qa_e2e_procedure: |
  On the parcel commit, ONE run.
  1. Read from the gather's property row: bl1458, bl1459, bl1505 and
     bl1835 green (bl1505 only outside a control pause until BL-1740
     lands, as BL-1743 noted).
  2. `grep -nE '(scratch|broken)[A-Za-z]*\s*=\s*path\.join\((path\.dirname\(|__dirname|[A-Z_]*DIR\b)'` over the four files: no match.
  3. `git status --short -- swarmforge/` in the QA worktree: no new
     *non-vacuity* path.

