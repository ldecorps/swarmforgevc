qa_e2e_procedure: |
  On the parcel commit:
  1. `git diff main...HEAD --name-only` names only evidence, the feature,
     the step handler (+ lib/), and test files; not
     night-closing-ceremony-run.ts, consult_spawn_cli.bb or handoffd.bb
     (invariant 1).
  2. `run_acceptance.sh` on the BL-1591 feature -> 5 scenarios green
     (scenario 03 = 4 rows).
  3. Under `extension/`: `npx vitest run
     nightClosingCeremonyRotateDocumenterFallback` -> 3/3;
     `bash swarmforge/scripts/test/test_consult_spawn_cli.sh` -> ALL
     CHECKS PASSED with 01-04 in its PASS lines.
  4. The evidence file records goals 3-9: the marker-field comparison,
     P1's visibility, P2's coordinator behaviour, P3's timing and the
     idle predicate, P4's env-args, P5's worktree list, P6's debt count.
  5. `backlog/hotfix-ledger.yaml` row a27d082c2d: `human_decision: null`.
  6. Live check, read-only, no launch: `bb swarmforge/scripts/consult_spawn_cli.bb`
     with no arguments prints usage on stderr and exits 2.
  7. After done: the human runs `bb swarmforge/scripts/hotfix_ledger_update.bb .
     --decide a27d082c2d approved|waived` and commits the ledger.
