source: |
  backlog/hotfix-ledger.yaml row `a27d082c2d` (detected 2026-09-16, state
  pending, no stamp ticket), appended by the certification sweep to the
  shared checkout and found uncommitted by the specifier at the
  2026-09-16 ceremony pass (no coordinator note had reached the specifier
  yet; the row is committed with this mint so the link has a row to sit
  on). Hotfix landed by the operator (human-directed, Claude Code)
  2026-09-16 07:58 BST with the `Hotfix-Certification: pending` trailer.
  The commit's own observation, quoted verbatim: "Observed live
  2026-09-15: closing-ceremony-run's own state showed sequence
  ["freeze-promotion","lean-packet","rotate-documenter",
  "briefing-missing","swarm-stopped"] for the whole night ... No briefing
  existed for 2026-09-15 or 2026-09-16 as of this fix."

description: |
  ## What

  An operator hotfix is live on main and has never been through a gate.
  This ticket is that gate: a REVIEW ticket, not a rewrite ticket -
  confirm or refute, and open narrow follow-ups for anything found.

  ## What landed (files to review)

  - `extension/src/tools/night-closing-ceremony-run.ts`: `rotateDocumenter`
    and `spawnConsultDocumenter` extracted from `buildRealDeps` and
    exported. `rotateDocumenter` still tries `rotate_to_role.sh documenter`
    with `SWARMFORGE_ROLE=coordinator`; on a nonzero exit it now calls
    `spawnConsultDocumenter` (`bb consult_spawn_cli.bb <target> documenter
    coordinator`, `stdio: 'pipe'`, every failure swallowed) and THEN still
    sends the old `BL-658: rotate resident to documenter for morning
    briefing` note to the coordinator.
  - `swarmforge/scripts/consult_spawn_cli.bb` (new, 112 lines): loads
    daemon_cycle_guard_lib, shell_quote_lib, single_role_repair_lib,
    handoff_lib; usage exit 2; `no-such-role` / `no-session-name` exit 1;
    `already-exists` (session live) and `already-consulting` (marker
    present) exit 0 with no tmux call; otherwise
    `resolve-single-role-repair` with `:env-args []` and
    `:session-present? false`, runs the returned commands, writes
    `.swarmforge/daemon/consult/<role>.json` `{role, requested_by,
    started_at_ms}`, prints `spawned`. Deliberately a copy of handoffd.bb's
    `spawn-consult-session!` (BL-1549), not a refactor of it.
  - `swarmforge/scripts/test/test_consult_spawn_cli.sh` (new, 4 checks,
    fake tmux on PATH, own socket file) registered in
    `swarmforge/scripts/test/suite-manifest.tsv` as standing (the same
    hunk trims trailing tabs on two neighbouring rows).
  - `extension/test/nightClosingCeremonyRotateDocumenterFallback.test.js`
    (new, 3 tests): a stub `rotate_to_role.sh` exiting 5, the REAL
    consult_spawn_cli.bb, a fake tmux; drives the real exported functions.

  ## Review goals

  1. Confirm the fallback end to end (scenario 01): run the real vitest
     file against `extension/out` and pin its three test names.
  2. Confirm the CLI (scenarios 02, 03): run the real shell test and pin
     its four PASS lines and the manifest row; drive the real CLI through
     the fixture shape that test builds (fake tmux logging new-session
     and respawn-pane calls) for the four contract rows. The
     `no-session-name` and `resolve-single-role-repair` non-ok branches
     are not rows - record whether the fixture can reach them.
  3. Confirm the no-new-teardown-code claim (scenario 04): a marker the
     CLI wrote (its JSON has `role`, `requested_by`, `started_at_ms`) must
     be torn down by the real `consult-teardown-sweep!` under BL-1549
     scenario 04's fixture (live session, idle pane, empty mailbox ->
     killed and cleared). Name any field the daemon's `write-consult-
     marker!` writes that the CLI does not, and whether the sweep reads it.
  4. PROBE P1, record, do not fix: `stdio: 'pipe'` discards the CLI's
     status JSON, while the commit message says "the CLI's own stdout
     already named the reason for a human reading the ceremony's process
     output". Record where, if anywhere, a `no-such-role` /
     `already-consulting` refusal is visible after a live ceremony run.
  5. PROBE P2: after a successful spawn the fallback still sends the
     coordinator the pre-hotfix `BL-658: rotate resident to documenter`
     note. Record what the coordinator prompt tells it to do with that
     note today (a second rotate attempt against a resident that just
     refused, or nothing) and whether the note is now misleading.
  6. PROBE P3: the ceremony sends `instructBriefing` (a note to the
     documenter) as the action AFTER `rotate-documenter`
     (nightClosingCeremonyRun.ts ~240-244). The spawned session boots with
     an empty mailbox; `consult-teardown-sweep!` kills a consult session
     whose pane is idle and mailbox empty. Record the gap between spawn
     and the note landing, whether a booting pane reads as idle to the
     sweep's predicate, and whether the sweep could kill the session
     before the briefing note arrives. A confirmed race is a note to the
     specifier.
  7. PROBE P4: `env-args`. handoffd.bb's `spawn-consult-session!` passes
     `(openrouter-respawn-env-args)`; the CLI passes `[]`. Record whether
     a documenter seat on a non-Claude provider (roles.tsv `agent` column)
     would spawn without env it needs, against the live roster.
  8. Note only, P5: at mint `git branch --contains a27d082c2d` listed
     main, swarmforge-QA and swarmforge-documenter - not coder, cleaner,
     architect, hardender. The ceremony runs from the master checkout's
     `extension/out`, so the live path is main's; record which worktrees
     carry it on the parcel's day.
  9. Note only, P6: the commit says `daemon_cycle_guard_lib_test_runner.bb`
     reports 0 banned-API debt across 102 files with the new CLI; re-run
     and record.

  ## Scenario notes for the coder

  - Scenario 01 runs `npx vitest run
    test/nightClosingCeremonyRotateDocumenterFallback.test.js` from
    `extension/` (1.4 s measured) and parses the reporter's test names;
    `extension/out` must be compiled first, as the acceptance lane
    already requires.
  - Scenario 02 runs the real `test_consult_spawn_cli.sh` and greps
    `suite-manifest.tsv` for the row; scenario 03 builds the same
    fixture (fake tmux writing `TMUX_LOG`, `.swarmforge/tmux-socket`,
    `.swarmforge/roles.tsv`, `.swarmforge/launch/documenter.sh`) per row;
    the `roles.tsv row is missing` row uses a role name absent from the
    fixture roster. Validate every Outline column against explicit
    KNOWN_VALUES (never branch on scenario shape).
  - Scenario 04 reuses `bl1549SwarmStampConsultSessionSteps.js`'s
    teardown fixture, with the marker written by running the real CLI
    (not hand-written JSON) so the shape under test is the CLI's own.
  - Scenario 05's handler reads `backlog/hotfix-ledger.yaml` for the row
    `commit: a27d082c2d` and asserts `state` is not certified/waived and
    `human_decision` is null; BL-1549 / BL-1563 are the precedents.
  - The step handler is `bl1591SwarmStampCeremonyDocumenterConsultSteps.js`,
    landing in the SAME commit as the feature (BL-233); `steps/index.js`
    discovers `*Steps.js` by directory scan, no registration edit.
  - Fixture roots per BL-1390: `git init` under mkdtemp, proven with
    `git rev-parse --git-common-dir` before any mutating git command; the
    fake tmux and its socket file live inside the fixture, never the live
    socket.

