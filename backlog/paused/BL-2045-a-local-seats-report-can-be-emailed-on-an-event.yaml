description: |
  ## What is wanted

  One command, run from the project root:

      bb swarmforge/scripts/local_seat_report_email_cli.bb <project-root> --seat <seat> --event "<text>"

  - It builds the seat's report exactly as `local_seat_report_cli.bb`
    prints it and emails it to `notify_email_to` from `swarmforge.conf`,
    with a subject naming the seat, the event text and the seat's state
    (generating, idle or down).
  - At most one email per seat per thirty minutes. Inside the bound it
    sends nothing, prints that the send was suppressed and when the next is
    allowed, and exits 0. The bound is recorded per seat under
    `.swarmforge/operator/`.
  - No `notify_email_to`, or no `RESEND_API_KEY`: nothing is sent, and the
    output says why (the reasons `daemon_alarm_lib.bb`'s
    `email-send-reason` already distinguishes).

  ## How (direction, not mandate)

  - Send through `daemon_alarm_lib.bb`'s `send-configured-email!`: it
    already resolves recipient, sender and key, and suppresses real sends
    from a test-fixture root.
  - Get the report text from `local_seat_report_cli.bb`'s own rendering
    (factor its render into a callable if needed); never a second
    rendering of the same facts.
  - Keep the CLI a thin wrapper over an in-process function that takes the
    post function, so the step handler drives it with a capturing fake
    (engineering: postFn seams, never env bypasses). Fixtures under
    mkdtemp (BL-1390).

