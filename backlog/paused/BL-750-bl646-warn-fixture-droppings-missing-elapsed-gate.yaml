id: BL-750
title: "babysitter_assess_lib's :warn-fixture-droppings has no elapsed-pct grace period and, sitting first in the cond, also shadows the gated :warn-uncommitted branch - so the boundary is both ungated and unexercised"
milestone: M8
type: defect
