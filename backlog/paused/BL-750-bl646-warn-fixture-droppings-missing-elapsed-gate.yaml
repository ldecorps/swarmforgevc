approval_context: >
  One decision, with a recommendation rather than an open fork. The originating
  note left it open whether immediate wake was deliberate - if so it wanted the
  asymmetry documented instead of fixed. The contract as written takes the
  fix: apply the same grace gate the sibling branches use. Rationale, which the
  note did not have: the observation is not stable. This repo's own engineering
  rule removes fixture dirs in a `finally`, so a suite that is mid-run
  legitimately holds exactly these files and clears them itself - alerting at
  once turns a running test into an operator wake. The shadowing found while
  speccing points the same way: being first in the cond, the ungated branch
  removes the grace period :warn-uncommitted would otherwise have applied, so
  the asymmetry is not a deliberate carve-out but a silent widening. Firm
  either way: the boundary must be exercised by a test that derives claim age
  from the configured timeout. Negotiable: the 0.75 threshold itself - it is
  proposed only for consistency with its siblings. Overrule here if immediate
  wake is genuinely wanted, and scenario 01 becomes a documentation scenario
  instead.

source: |
  Found during BL-723 (pilot-tonight quality review), hardener viewpoint
  pass, 2026-07-30/31. `babysitter_assess_lib.bb`'s new
  `:warn-fixture-droppings` severity branch (~line 104, added by BL-646)
  is the only alert-worthy severity with no `elapsed-pct >= 0.75`-style
  grace-period gate, unlike its siblings `:warn-uncommitted` and `:watch`.

  Consequence: a role that claimed a ticket seconds ago, but whose
  worktree still has stale fixture debris (e.g. `calls.log`) left over
  from an EARLIER, unrelated test run, immediately trips
  `alert-severity?` and wakes the babysitter LLM — with zero grace period,
  unlike every other alert-worthy condition this same lib gates.

  The one new test added for this branch
  (`babysitter_assess_lib_test_runner.bb`) always constructs `claimAtMs`
  15 minutes in the past regardless of the configured idle-timeout, so it
  never actually exercises or asserts the boundary at issue: whether
  immediate-wake-with-no-grace-period for fresh claims is the intended
  design, or an oversight relative to the pattern its sibling severities
  follow.

description: |
  ## What

  Give :warn-fixture-droppings the same claim-age grace period its sibling
  file-state severities already have, and test the boundary on a claim age
  derived from the configured idle timeout rather than a fixed 15 minutes.

  ## Why

  In the severity `cond` (babysitter_assess_lib.bb:114-123) :warn-uncommitted
  and :watch each require `(>= elapsed-pct 0.75)`. :warn-fixture-droppings, at
  line 118, requires only `head-unchanged?` - which is true from the instant a
  claim is taken, since the claim commit is the head. alert-severity? includes
  it, so any leftover dropping wakes the babysitter LLM immediately.

  Two consequences, the second found while speccing and not in the original
  note. First, a suite that is mid-run legitimately holds these files and would
  have removed them in its own `finally`, so the wake fires on work that was
  never stuck. Second, because the ungated branch is FIRST, a worktree whose
  untracked files are all droppings can no longer reach :warn-uncommitted at
  all - it does not merely skip its own grace period, it removes the sibling's.

  ## How (direction, not mandate)

  Gate the branch the way its siblings are gated. The 0.75 figure is proposed
  for consistency, not because it is special - a different threshold is fine if
  argued. Keep the branch ahead of :warn-uncommitted so the more specific hint
  still wins once both are eligible.

  ## Scope

  - `swarmforge/scripts/babysitter_assess_lib.bb` - the severity cond at
    114-123. alert-severity? (153-156) needs no change.
  - `babysitter_assess_lib_test_runner.bb` - its claim age must be computed
    from the configured idle timeout, not the hardcoded 15-minutes-ago it uses
    today, or the boundary stays unobservable however the branch is gated.
  - Existing BL-646 tests stay green.

qa_e2e_procedure: |
  Against the real library, with a pinned clock:

  1. Build a claim-progress sidecar for a role whose worktree head equals its
     claim commit, and drop a single `calls.log` in that worktree untracked.
  2. Configure a 20-minute claim idle timeout and set the claim age to 5
     minutes. Assess. Assert no alert-worthy severity is reported and the
     babysitter is not woken.
  3. Set the claim age to 18 minutes, same timeout. Assess. Assert
     warn-fixture-droppings, and that the hint names the leaking test suite and
     does not advise committing the file.
  4. Set the timeout to 4 minutes and the claim age back to 5 minutes. Assess.
     Assert warn-fixture-droppings - the same age that was silent in step 2,
     proving the boundary moves with configuration rather than a fixed 15
     minutes.
  5. With the claim age back inside the grace period, raise reclaims past the
     warn threshold. Assess. Assert an alert-worthy severity is still reported,
     proving the gate did not spread to the reclaim-driven branches.

