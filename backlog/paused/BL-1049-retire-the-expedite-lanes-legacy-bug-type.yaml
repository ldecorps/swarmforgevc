id: BL-1049
title: "Article 3.2.4's `bug` transition clause has discharged but nobody owns the discharge: the predicate never sees a done ticket, so its `bug` member is vacuous by construction, and ~350 spent chars sit in a boot-inlined article at 44000/44000"
type: chore
status: todo
epic: promotion-queue-ordering
assigned_to: coder
priority: 25
direction: swarm-surfaced
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1049-retire-the-expedite-lanes-legacy-bug-type.feature
required_wiring:
  - 'swarmforge/scripts/backlog_hygiene_lib.bb::bug::the mint gate must actually REFUSE the retired type - violations-for-text is the live checker the shell gate delegates to, so a helper defined anywhere else arms nothing'
human_approval: pending
approval_context: >
  Firm, and I believe uncontroversial: Article 3.2.4 contains a self-described
  transition clause that instructs a future reader to "Drop `bug` from the
  predicate only once no ticket carries it". That condition is met — zero
  promotable tickets (paused/ + active/ + hold/ + root) carry `type: bug`; the
  58 that do are all in `backlog/done/`, which the ranking never reads. So the
  clause pre-authorises exactly this change; I am executing its own trigger,
  not amending the article beyond its mandate.

  Sharper than the count, and the reason this is worth a ticket at all: the
  `bug` member is vacuous BY CONSTRUCTION, not merely "now that the count hit
  zero". `promote_and_route_next.sh` ranks `backlog/paused/*.yaml` only, so
  `expedited?` has never once received a done ticket — yet the predicate's own
  docstring justifies the member as "matched only because some already-done
  tickets still carry it". That justification names an input class the
  predicate cannot receive.

  Needs your call — the one judgement I do not want to make alone: this ticket
  ALSO makes `type: bug` a mint-time refusal. Without that, dropping the
  predicate member opens a silent window (a `bug` ticket minted later would
  lose expedite eligibility with no error). With it, the retirement is
  permanent. If you would rather keep `bug` mintable for some reason I cannot
  see, say so and I will drop scenario 03 and the required_wiring entry, and
  the ticket becomes a pure predicate/prose cleanup.

  Also note: the constitution prose is MY deliverable, not the pipeline's
  (BL-798) — see notes. I have deliberately NOT landed it yet, because it
  edits a constitutional article and this approval is what authorises that.
invariants:
  - No ticket type is simultaneously mintable and unknown to the expedite predicate — retiring a type from `expedited-types` requires the mint gate to refuse it in the same change, so absence can never silently cost a ticket its lane.
  - The boot-inlined article never states a type rule the predicate does not implement — a reader of Article 3.2.4 must not learn a contract the code has retired.
description: >
  WHAT: Retire the legacy `bug` type from the Article 3.2.4 expedite lane —
  in the predicate, in the two test sites that assert the transition branch,
  in the mint gate, and in the boot-inlined article that still instructs a
  reader to perform this very change.

  WHY: two independent reasons, neither of them tidiness.

  (1) A conditional directive whose trigger has fired and which nobody owns
  decays to "never" (the BL-586 shape). Article 3.2.4 says "Drop `bug` from
  the predicate only once no ticket carries it" — no office is named, no
  trigger is watched. It fired at some point before 2026-08-23 and nothing
  moved. This ticket IS the discharge.

  (2) The boot prefix measures 44000/44000 — literally zero headroom, so the
  next character inlined into any boot article fails
  `boot_prefix_budget_gate.sh`. The spent transition clause is ~350 chars of
  that budget spent on an instruction that has already been carried out.
  Removing it does not merely tidy the article, it unblocks the next person
  who needs to add a sentence to any constitutional article.

  CONSTRAINT — the vacuity is structural, and the fix must not pretend
  otherwise: `expedited?` is reached only via `promotion_gates_cli.bb select`,
  which `promote_and_route_next.sh` feeds from `backlog/paused/*.yaml`. Done
  tickets are never candidates. The predicate's docstring currently claims the
  `bug` member exists for already-done tickets; that claim should not be
  preserved in any reworded form, it should go.

  How (direction, not mandate): `expedited-types` at
  `swarmforge/scripts/promotion_gates_lib.bb:164` becomes `#{"defect"}` and
  loses the transition docstring. The mint refusal most naturally belongs in
  `violations-for-text` in `swarmforge/scripts/backlog_hygiene_lib.bb`,
  alongside the existing epic/milestone checks, with its own violation kind
  and `format-violation` line — that is the live checker the shell gate
  delegates to.

  RETIREMENT, NOT REWORDING (BL-1006): two existing assertions encode the
  branch this ticket removes, and both must be DELETED rather than inverted —
  the `bug` rows of scenario 01's outline are the successor coverage.
    - `swarmforge/scripts/test/promotion_gates_lib_test_runner.bb:60`
      ("legacy type: bug + high is still expedited (transition clause)").
    - `swarmforge/scripts/test/promotion_gates_lib_property_runner.bb` — the
      `"bug"` entries in `candidate-type-alphabet` (:252), in this file's own
      independent restatement `expected-expedited?` (:261), and in
      `gen-forced-expedited-candidate`'s `gen-pick` (:286).
  The property runner deliberately restates Article 3.2.4 rather than calling
  the lib back, so a half-done change (lib updated, restatement not) FAILS the
  property suite rather than passing vacuously. That is the intended gate for
  invariant 1's code half — do not "fix" it by having the restatement call
  `expedited?`.
qa_e2e_procedure: >
  1. `bb swarmforge/scripts/test/promotion_gates_lib_test_runner.bb` — green,
     and grep it to confirm the `bug`-is-expedited assertion is GONE, not
     inverted in place.
  2. `bb swarmforge/scripts/test/promotion_gates_lib_property_runner.bb` —
     green. This is the real check on invariant 1's code half: if the lib
     dropped `bug` but the file's own `expected-expedited?` restatement did
     not, the property must fail here.
  3. Mint refusal, live: write a scratch YAML carrying `type: bug` with a
     valid `epic:` (so only the new check can fire) and run
     `swarmforge/scripts/specifier_backlog_hygiene_gate.sh <that file>` —
     expect non-zero exit and a violation line naming the retired type.
     Re-run with `type: defect` and expect exit 0, proving the gate is
     refusing the type and not simply erroring on every input.
  4. `grep -rn 'type: bug' backlog/paused backlog/active backlog/hold` — still
     zero, i.e. the change did not need a data migration.
  5. `bash swarmforge/scripts/boot_prefix_budget_gate.sh` — ok, and the
     measured number is BELOW 44000 (it is exactly 44000 today; if it has not
     dropped, the article trim did not land).
notes: >
