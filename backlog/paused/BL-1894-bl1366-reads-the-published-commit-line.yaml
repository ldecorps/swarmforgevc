description: |
  ## Status: hotfix 6424d253d7 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What the hotfix changed

  `bl1366LandingIsOneCommandSteps.js` maps each scenario claim to a line
  the e2e prints. BL-1716 (ad512073ca, 2026-09-24) reworded the landed
  line because the land publishes a commit it builds off origin/main, not
  the approved commit itself; the handler's `landed` literal is now the new
  line. 9 of 9 at the hotfix.

  ## What is wanted in this parcel

  - Review the change, and check the handler's other literals against the
    e2e's current output, so the next reword is caught here.
  - Evidence: the review and one run of the feature.

  ## Scope

  The step handler and evidence.

