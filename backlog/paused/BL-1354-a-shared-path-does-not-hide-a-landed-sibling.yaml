approval_context: >
  No decision needed from you - this is a straight defect report and I am not
  asking you to choose anything. Flagging it only because of a sequencing
  hazard that is now live and is the coordinator's call, not mine.
  .
  BL-1309 went ACTIVE today. It wires this same sibling detector into
  land_main_publish.sh's decide step - the one landing step QA cannot skip.
