  in_process - the master-resident shape scenario 04 pins.

qa_e2e_procedure: |
  On the parcel commit:
  1. `git diff main...HEAD --name-only` names only evidence, the feature,
     the step handler (+ lib/), and files under swarmforge/scripts/test/;
     none of the eight hotfix production/doc files (invariant 1).
  2. `run_acceptance.sh` on the BL-1563 feature -> 6 scenarios green
     (scenario 01 = 9 rows, scenario 05 = 3 rows).
  3. `bash swarmforge/scripts/test/test_ready_for_next_rotate_home.sh`
     ALL CHECKS PASSED with cases 16-20 (and 21 if added) in its PASS
     lines; `bash swarmforge/scripts/test/test_handoffd_priority_rotate_wiring.sh`
     ALL PASS; `bb swarmforge/scripts/test/mono_router_lib_test_runner.bb`
     exits 0.
  4. The evidence file records goal 4's fixture and outcome, goal 5's
     label observation, goal 6's worktree list and goal 7's timing.
  5. `backlog/hotfix-ledger.yaml` row 0b727b286c: `human_decision: null`.
  6. Live check, no launch needed: `bb swarmforge/scripts/mono_router_rows_cli.bb .`
     prints a roster role or `none` and exits 0.
  7. After done: the human runs `bb swarmforge/scripts/hotfix_ledger_update.bb .
     --decide 0b727b286c approved|waived` and commits the ledger.
