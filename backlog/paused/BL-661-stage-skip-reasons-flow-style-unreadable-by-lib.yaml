id: BL-661
title: "`read-stage-skip-reasons` parses only block-style mappings, but backlog-schema.md and every live ticket declare `stage_skip_reasons` flow-style — so declared reasons never reach the routing audit record"
milestone: M8
type: defect
status: todo
epic: swarm-reliability
severity: low
priority: 30
direction: swarm-surfaced
