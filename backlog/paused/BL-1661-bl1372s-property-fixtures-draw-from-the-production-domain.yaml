invariants:
  - "Every generated fixture in the file is a syntactically valid Clojure snippet on every draw: sha generators emit hexadecimal only, ref generators emit git refname characters only, and the comment stripper's quote-parity assumption holds for every string the generators can produce."

description: |
  ## What is wrong

  `extension/test/bl1372InvariantTwoPin.property.test.js` interpolates
  generated values into Clojure source (`(sh! "git" "merge-base"
  "--is-ancestor" "${sha}" "swarmforge-QA")`) and then strips `;;`
  comments with `stripCommentsKeepStrings` (lines 72-86), which decides
  "inside a string" by the parity of `"` before the `;;`. The sha and
  ref generators are `fc.string({ minLength: 1, maxLength: 20 })` (lines
  93, 117, 180-181, 218-219): unconstrained, so a draw can carry `"` or
  `;;`. fast-check's counterexample `"\";; "` yields
  `(sh! "git" "merge-base" "--is-ancestor" "";; " "swarmforge-QA"))`:
  eight quotes before the `;;` read as even, the stripper cuts the line
  there, `swarmforge-QA` disappears, NARROWED_PATTERN no longer matches,
  and the property asserting "a genuine QA-ancestry predicate must fail"
  fails - `Property failed after 100 tests { seed: 287158657, path:
  "99:2:19:16" }`, `AssertionError: ... false !== true`. Deterministic
  for that seed and for the coder's seedless `node -e` repro (evidence
  `backlog/evidence/unowned-red-bl1372-invarianttwopin-quote-parity-20260920.md`,
  coder@2 worktree); 3/3 green for the coder and 1/1 for the specifier
  (main 5777671147, 10 passed, 0.5 s) without the seed. BL-1247's rule:
  a property generator agrees with the contract it exercises - a sha is
  hexadecimal, a ref is a git refname; neither contains a quote.

  ## What is wanted

  - The four sha/ref generators draw from the production domain:
    hexadecimal of 7-40 characters for a sha, git refname characters
    (`[A-Za-z0-9._/-]`, no leading `-`) for a ref.
  - `stripCommentsKeepStrings` is pinned by a deterministic unit case in
    the same file: a line whose `;;` sits inside a string literal is
    kept whole; a line whose `;;` follows balanced quotes is cut.
  - Register row for the file (lane property, owner BL-1661, added at
    mint) leaves in this parcel's land (BL-1631).

  ## How (direction, not mandate)

  - `fc.hexaString({ minLength: 7, maxLength: 40 })` for shas;
    `fc.stringMatching(/^[A-Za-z0-9._][A-Za-z0-9._/-]{0,19}$/)` for
    refs. No production file changes.

constraints: >
  One test file. No change to NARROWED_PATTERN, to the babysitter check
  under test, or to any feature file. The file stays in the property
  lane's allowlist as it is.

out_of_scope: |
  - Other property files interpolating generated strings into source
    text: none sighted red; a census is a follow-up when one is.

qa_e2e_procedure: >
  (1) `cd extension && npx vitest run --config vitest.properties.config.mjs
  test/bl1372InvariantTwoPin.property.test.js` ONCE on the parcel commit:
  10 or more passed, duration row recorded. (2) `grep -c 'fc.string('
  extension/test/bl1372InvariantTwoPin.property.test.js` is 0. (3) The
  coder's `node -e` repro from the evidence, run against the parcel's
  helper, keeps `swarmforge-QA` in the stripped line. Never "run it N
  times".

