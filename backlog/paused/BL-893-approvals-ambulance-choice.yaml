approval_context: >
  Human-requested 2026-08-14 (Host /queue, typed): "Est-ce qu'ambulance
  fait partie des choix d'approvals ? Sinon fill in a ticket." It does
  not today. The judgement call: this slice ENGAGES ambulance only — it
  does NOT also Approve / Q-jump. Ambulance is a hold of the live stack
  for one ticket (BL-655); Q jump is promote-sooner (BL-490/BL-721). Mixing
  them on one tap would collapse two rungs of the escalation ladder.
  Confirm hold-only. If you want Approve+Ambulance as a single tap, say so
  and that becomes a second ticket.

invariants:
  - "Tapping Ambulance on an Approvals ask, or sending /ambulance BL-xxx in the Approvals topic, engages the same ambulance marker Control already writes — only that ticket's parcels move; human_approval is not flipped by this verb."
