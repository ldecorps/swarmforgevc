human_approval: pending
approval_context: >
  Firm: the lane must not go red on correct code. The coder hit this live -
  "BL-1063 is closed but its P3 property times out at 20s here; lane red on
  load".

  Your call on ONE thing: whether the fix may DROP fast-check for these two
  properties in favour of plain enumeration. I recommend it, because their
  input spaces are 6 and 4 points - a random draw over a space that small
  buys nothing and costs both duplicate work and non-deterministic coverage.
  If you would rather keep every property expressed through fast-check, the
  ticket still works: right-size `numRuns` and add the explicit per-test
  override its sibling already has, and scenario 03 is what changes.

  Note this does NOT overlap BL-1062 (paused). That ticket is about tests
  that ASSERT a coverage floor after an unseeded draw and fail when the draw
  missed, in two other files. This one asserts no floor at all - it simply
  does more real subprocess work than its budget allows. Same epic and same
  family; fixing either leaves the other.
invariants:
  - A property lane verdict is a function of the code under test - never of how loaded the host was when it ran.
  - Where a property's input space is small and finite, every point of it is exercised by construction, never by whether a random draw happened to reach it.
description: >
  WHAT: `extension/test/bl796NvmNodePathFollowUpAdoptInvariants.property.test.js`
  property 3 ("a binary already resolvable on the caller PATH is never
  shadowed") runs 12 fast-check iterations. Each one builds a fake nvm home,
  three temp dirs and two stub binaries, then does a real `spawnSync` of
  `sh -c`. The property lane sets `testTimeout: 20000`
  (`extension/vitest.properties.config.mjs`), and this test takes no
  per-test override - so the whole 12-iteration run must finish inside 20
  seconds, an average of 1.67s per iteration including roughly five
  filesystem operations and a subprocess each. On an idle host that is fine.
  On this host, which runs continuous 3x8 shifts, it is not, and the lane
  reds on correct code.

  WHY IT IS THE SIBLING THAT BROKE: BL-1063 (done) hit exactly this and fixed
  it - for invariant 1 only. Commit `6c4eda981` added the `120000` third
  argument to that one `test(...)` call. Invariant 2 (`numRuns: 10`) and
  invariant 3 (`numRuns: 12`) do comparable real-subprocess work and were
  left on the 20000 lane default. Nothing was wrong with BL-1063's scope -
  its subject was invariant 1's two correctness bugs - but the timeout half
  of that fix applied to all three and only landed on one.

  THE SHARPER FINDING, and why this is not just a timeout to raise: both
  remaining properties draw MORE samples than their input space holds.
  Property 3's space is `binaryArb` (2: bb, node) x `positionArb`
  (3: front, middle, back) = SIX points, drawn 12 times. Property 2's is two
  booleans = FOUR points, drawn 10 times. So over half the subprocess work is
  re-testing points already tested - and because the draw is random with
  replacement, 12 draws over 6 points still does not GUARANTEE all six are
  reached. The test is simultaneously doing too much work and promising less
  coverage than a plain loop would. Raising the timeout alone would keep both
  of those.

  How (direction, not mandate): right-size the work to the space rather than
  the budget to the work. For a space of six points, enumerating it directly
  is both cheaper and stronger than sampling it twelve times - fast-check
  earns its keep on spaces too large to enumerate, which this is not. If any
  headroom is still wanted afterwards, give these two the same explicit
  per-test override invariant 1 already carries, so all three siblings agree.
  Do not simply raise the timeout and leave the sampling as it is.

  NOT IN SCOPE: BL-1062's two files and its coverage-floor assertions; the
  lane's worker-pool and heap budget (BL-871/BL-935); reopening BL-1063,
  which is closed and whose own scope was invariant 1's correctness bugs.
  Changing what any of the three properties ASSERTS - this ticket changes how
  the input space is covered and how long the run is given, never the
  property being proved.
qa_e2e_procedure: >
  1. Baseline the cost: at the parent commit, time property 2 and property 3
     and count the subprocess spawns each performs. Record both numbers.
  2. At the parcel commit, re-run and confirm the spawn count for property 3
     is at most its input-space size (6) and property 2's at most 4, and that
     wall-clock fell accordingly.
  3. Coverage is by construction: confirm every one of the six
     binary-x-position combinations is exercised on EVERY run, not on a
     lucky one. Running the file repeatedly must not change which points were
     covered.
  4. Under load: run `npm run test:properties` while the host is busy (a
     normal shift is enough) and confirm the file passes. Before the fix this
     is the red the coder reported.
  5. The properties still prove what they proved: confirm each still fails
     when the lib is deliberately broken - shadow the caller's binary and
     confirm property 3 goes red for the right reason, not by timeout.
  6. Record the degraded gate: this is a property-lane change, so no
     mutation/CRAP/DRY applies to the assertion itself; the gate is
     `npm run test:properties` plus these scenarios.
notes: >
  Reached from a coder note during BL-1071 review, 2026-08-23: "BL-1063 is
  closed but its P3 property times out at 20s here; lane red on load".
  Verified independently before minting rather than taken on report: the
  `testTimeout: 20000` is in `vitest.properties.config.mjs`; `git log -S`
  confirms `6c4eda981` (BL-1063) introduced the lone `120000` override; and
  the input-space arithmetic above was counted off the checked-in
  `fc.constantFrom` and `fc.record` generators, not estimated.

  Related, do not conflate: BL-1062 (paused, same epic) covers
  `bl968MaterializedGuardSensitivity` and `bl948SocketFixtureInvariants`,
  where the test ASSERTS a coverage floor after an unseeded draw and fails
  when the draw missed. This file asserts no floor - it just overspends its
  budget. The two share a root idea, that a small finite space should be
  covered by construction, and a fix here should be consistent with whatever
  BL-1062 settles on, but neither blocks the other.

  Also related: BL-1007/BL-1008 ruled that property-runner reachability
  floors stay ABSOLUTE and are never scaled with host load. Nothing here
  reopens that. This ticket does not scale a floor with load; it removes the
  load sensitivity by doing less work.

  IR-DRY disposition (checker run twice): 5 findings on the first pass, all
  on variants of the When step. One was genuine drift and was NORMALIZED -
  scenario 04 named the property in its When while its Given did not mention
  it, unlike scenarios 02 and 03; moving the name into the Given lets all
  three share "the property lane runs it". That took the count to 2, both
  KEPT: "runs it" vs "runs it repeatedly" is the difference scenario 03
  exists to draw (determinism ACROSS runs, not within one), and "runs it" vs
  "runs the bl796 file" is one property against the whole file, which is
  what separates scenario 01 from the rest.

