id: BL-1107
title: "bl796 property 3 spends a 20s per-test budget on 12 random draws over a 6-point space, so under host load the property lane goes red on correct code - BL-1063 gave invariant 1 a 120000 override and left its two siblings on the lane default"
milestone: M8
type: defect
severity: high
# high: a broken health signal on a SHARED gate, not a contained defect. A
# false red on `npm run test:properties` blocks whatever parcel is holding
# the lane and teaches every role to re-run rather than read it - the same
# "verdict depends on something other than the code under test" failure the
# lane config's own BL-871 comment exists to close. The host runs continuous
# 3x8 shifts, so the load condition is the normal state, not an edge case.
# Not critical: nothing is lost or corrupted and a re-run on a quiet host
# passes.
