  Sequencing note for the coordinator: prefer landing this AFTER
  BL-967 merges (closure then already contains
  daemon_cycle_guard_lib.bb), or rely on derivation absorbing it -
  hand-verification at QA covers either order via qa_e2e step 2.
  Orthogonality: touches the four listed fixture files + a new
  inventory check; overlaps BL-967's worktree only at
  test_lean_ledger_bb_wiring.sh, which BL-967 deliberately does NOT
  patch (routed here instead) - no live conflict expected.

approval_context: >
  One call to say the word on: half 2's shape - an inventory gate
  (every test invoked-or-excluded-with-reason) rather than a
  run-everything suite, because several bb shell tests are
  legitimately slow or live-touching. If you want an actual all-tests
  runner lane instead (accepting its runtime), say so. Severity
  medium: infra rot, loud once run, nothing live degraded.

notes_coordinator_hold: >
  COORDINATOR HOLD 2026-08-20 04:52Z: not promoted. human_approval: pending,
  and capacity (active/ 7 of 7). defect/MEDIUM, so not expedited; queues on
