  parcel as its handlers — reuse BL-849/BL-879 sweep/reap handlers where they
  already exist rather than minting synonyms.

  ## Degraded gate, recorded up front

  The bb diff has no mutation/CRAP/DRY wired (engineering.prompt, Startup
  Tools) — the gate is the unit runners plus promoted acceptance scenarios.
  The JS half (propertyLaneFixtureRunner.js) is a test helper, outside the
  mutation surface. A hardening pass records the fallback, never implies
