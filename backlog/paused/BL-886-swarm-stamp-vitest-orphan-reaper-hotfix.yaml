  ## E2E QA procedure (specifier, 2026-08-12)

  1. Both new runners green, invoked explicitly:
     `bb swarmforge/scripts/test/orphan_janitor_lib_test_runner.bb` and
     `bash swarmforge/scripts/test/test_handoffd_supervisor_job_reaper.sh`.
  2. Plant a synthetic parent-orphaned fixture group whose root cmdline
     matches a covered vitest shape and whose cwd is under a registered
     worktree (BL-879 synthetic-fixture posture); one-shot sweep reaps it and
     the audit line names the vitest reason.
  3. A live-parented fixture group survives the same supervisor sweep.
  4. Decapitation check FIRST on the live host: any real in-flight
     property-lane run (BL-871 is active) survives; nothing outside the class
     is touched.
  5. Verify goal 6: name the standing invocation that runs the two new test
     files per parcel, or record its absence as a finding + follow-up.
  6. Record the degraded Babashka gate fallback in the QA evidence.
