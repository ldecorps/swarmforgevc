description: |
  ## What

  A Cursor-agent hotfix is live on main and has never been through a gate.
  This ticket is that gate — a REVIEW ticket, not a rewrite ticket (same
  posture as BL-811/BL-849/BL-879): confirm or refute the landed diff, open
  narrow follow-ups for anything found.

  ## The failure it fixed

  Host load hit 259/249/203 on a 4-core host during the 2026-08-12 shift,
  traced substantially to concurrent uncapped property-lane vitest runs
  (BL-871's own defect, active, complementary — do not conflate). A
  crash-orphaned property-lane process group was invisible to the
  supervisor's reaper (the old pattern matched only stryker|node --test) and
  to the janitor sweep, so interrupted runs accumulated unreaped.

  ## What landed (files to review)

  - `handoffd_supervisor.bb` (602c7d014): job-process-pattern widened to
    vitest.properties.config.mjs / npm exec vitest / npx vitest / "(vitest"
    workers; new `job-scope-paths` + `job-in-scope?` (cmdline OR cwd under
    host root/registered worktrees — the cwd leg is load-bearing, vitest argv
    often omits the checkout path); `orphaned-job-groups` now uses
    `process-table-lib/parent-orphaned?` instead of a raw PPID-1 check.
  - `orphan_janitor_lib.bb` / `orphan_janitor_sweep_lib.bb` (1ecbe049f): new
    `hung-vitest-cmdline?`, `project-scoped-path?` (roles.tsv-derived path
    set), `reapable-hung-vitest?` (parent-orphaned → immediate; live-parented
    → waits out SWARMFORGE_ORPHAN_JANITOR_VITEST_STALE_HOURS, default 2.0h);
    `sweep-candidates!` signature change (new required project-root first
    arg) plus a cwd! adapter.
  - `extension/test/helpers/propertyLaneFixtureRunner.js` (1ecbe049f):
    generated fixture files tracked in a module-level Set, removed via
    exit/SIGINT/SIGTERM handlers, not only the finally block.

  ## Review goals (from the intake, plus specifier findings)

  1. Prove the three acceptance properties: (a) a crash-orphaned
     property-lane group under any covered cmdline shape is reaped where it
     previously was not; (b) the SUPERVISOR reaper never touches a
     live-parented run, however long it runs (see approval_context for why
     this is scoped to the supervisor); (c) neither scoping check widens
     beyond host root/registered worktrees.
  2. Confirm `process-table-lib/parent-orphaned?` is the same helper
     BL-849/BL-877 already hardened for Darwin — the hotfix must reuse it,
     never re-derive orphan detection a second way.
  3. NAMED REVIEW QUESTION (architect): `job-in-scope?`
     (handoffd_supervisor.bb) and `project-scoped-path?`
     (orphan_janitor_lib.bb) are two independent implementations of the same
     scoping idea. Rule whether they are legitimately separate (different
     subsystems, different inputs) or must share one helper before they
     drift — decide, record, and open a follow-up if consolidation is due.
  4. NAMED REVIEW QUESTION (architect): the janitor's live-parented
     stale-reap (2.0h) can kill a legitimately long property run. Weigh it
     against BL-871's forthcoming pool cap and rule whether the threshold,
     the fast-path split, or the whole live-parented leg is right.
  5. Verify `sweep-candidates!`'s new required first arg reached EVERY call
     site (an internal signature change — grep, do not assume).
  6. Confirm the two new test files are exercised by a runnable, findable
     gate. Specifier finding 2026-08-12: `swarmforge/scripts/test/` has NO
     glob-style standing runner — every runner is invoked explicitly — so
     "added" is not "wired" (BL-419 shape). The parcel must leave them
     invoked from a documented per-parcel path, or record their absence as a
     finding with a follow-up.
  7. Verify the fixture-runner's install-once guard: repeated
     runAsPropertyLaneFixture calls in one process must not stack listeners
     or double-fire cleanup (invariant 3).

out_of_scope: |
  - BL-871's own pool-cap fix (separate active ticket).
  - Any change to `process-table-lib.bb` itself — this ticket only consumes
    its existing `parent-orphaned?`/`cwd!` helpers.
  - Widening the reaper to any process class beyond Stryker/`node --test`/
    vitest-property-lane.
  - The leaked `caffeinate -dims` reclaim — that is BL-885 (depends on this
    ticket; same janitor files, different process class — do not fold).

required_wiring:
  - "swarmforge/scripts/orphan_janitor_sweep_lib.bb::reapable-hung-vitest?::the sweep must keep calling the new predicate — guards against a partial revert during review"
  - "swarmforge/scripts/handoffd_supervisor.bb::job-in-scope?::orphaned-job-groups must keep consulting the scope check — a revert to the bare substring match reopens the scope-widening hole"

