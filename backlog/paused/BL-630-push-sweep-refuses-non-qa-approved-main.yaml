approval_context: >
  Operator ruling 2026-07-25, during the BL-590 post-mortem. BL-629 gates the
  DEPLOY step (`build_freshness_cli.bb sync`) but says nothing about the PUBLISH
  step. The post-mortem established that publish, not deploy, is what made the
