notes: |
  Minted 2026-10-04 by the specifier on QA note 003797.
  depends_on BL-1851: this changes BL-1851's local_seat_tuning_report_lib.bb,
  which must land first.
  Correction to the ruling's text: parse-ollama-loads carries no speed;
  parse-ollama-load (the latest load only) reads one eval rate. The per-load
  segment parse-ollama-loads already isolates is where the eval lines live.

description: |
  ## What is wanted

  BL-1851's per-request-metrics compute prefill as input tokens over time
  to first token, and decode as output tokens over duration minus time to
  first token. A local-model seat's replies reach qwen through the
  tool-call shim, which asks Ollama without streaming and hands the reply
  back in one burst, so qwen's time to first token covers the whole
  generation. On the live coder records 576 of 597 replies came back within
  50 ms of their first token, and the report printed decode medians of
  1783-11233 tokens per second.

  - A reply whose duration minus time to first token is 50 ms or less is a
    one-burst reply. Its time to first token and prefill speed count as
    unknown, and the group reports how many one-burst replies it holds.
  - A group's decode speed is the median of the llama-server eval rates
    (`print_timing ... eval time = ... tokens per second`) in the server log
    segments of the loads that served it; parse-ollama-loads already cuts
    the log into one segment per load. With no eval line, a streamed reply
    keeps today's client-side figure, and a one-burst reply's is unknown.

  ## How (direction, not mandate)

  Keep the burst predicate pure in local_seat_tuning_report_lib.bb next to
  per-request-metrics; read the eval rates from each load segment in
  local_seat_report_lib.bb beside load-segment-facts.

  ## Scope

  local_seat_tuning_report_lib.bb, local_seat_report_lib.bb, their test
  runners, the step handler bl1954TuningReportServerSpeedSteps (registered in
  the same parcel), and BL-1851's how-to (documenter).
