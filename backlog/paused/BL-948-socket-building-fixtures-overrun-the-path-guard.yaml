id: BL-948
title: "Acceptance fixtures that build a control socket root at os.tmpdir(), whose long macOS base overruns the 100-char unix-socket guard, so scenarios fail on a socket-path refusal instead of the behaviour they assert"
milestone: M8
type: defect
severity: medium
status: todo
epic: code-quality-gates
human_approval: pending
priority: 40
direction: agent-proposed
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-948-socket-fixtures-use-a-short-root.feature

invariants:
  - "The gate defines the adoption set; no hand-maintained list of file names does. A fixture is in scope because it builds a control socket under its root, decided by inspection at gate time - a checked-in roster of paths goes stale on the next step file and reproduces the one-at-a-time patching this ticket exists to end."
  - "A fixture root is removed in a finally, not after the last assertion. Moving roots to a shorter base multiplies nothing if a throwing scenario leaks them; the shared engineering rule already requires this and measured 236 of 287 step files non-compliant on 2026-08-18."

description: >
  `swarm_socket_lib.bb` refuses to bind a unix socket whose path exceeds 100
  characters - a deliberate fail-closed guard under the 104/108 sun_path
  limits (BL-367). Acceptance step files build their fixture roots with
  `mkdtempSync` under `os.tmpdir()`, which on macOS resolves to
  `/var/folders/<hash>/<hash>/T/`. A descriptive prefix plus
  `<root>/.swarmforge/tmux/<hash>.sock` then overruns 100 easily: the measured
  case reached 107.

  The guard fires correctly, but it fires BEFORE the script under test reaches
  the behaviour the scenario means to exercise, so the scenario fails for a
  reason unrelated to what it asserts. In
  `specs/features/BL-368-control-loss-is-not-agent-death.feature`, "A role
  whose process is still alive is never relaunched" never reaches the
  still-alive check at all: `role_lifecycle.sh unpark` refuses on socket path
  length first.

  This is the third occurrence in a single day. BL-817 and BL-938 each hit the
  identical constraint in two other step files on 2026-08-19 and each was
  fixed locally by shortening that one fixture's base. BL-944's coder then hit
  it a third time and recorded it rather than patching it again
  (`backlog/evidence/BL-944-surfaced-defect-not-fixed-20260819.md`, on
  `swarm/coder`). Three identical local patches is the signal that the fix
  belongs one level up.

  Scale, measured 2026-08-19: 301 step files call `mkdtempSync`, 297 of them
  rooted at `os.tmpdir()`. Only 43 of those also build or reference a control
  socket, and only those 43 can hit this guard - the other ~254 are unaffected
  and must not be churned.

  How (direction, not mandate). A shared helper returning a short-enough
  fixture root - a short base such as /tmp, a short prefix, or both - adopted
  by the socket-building fixtures, plus a gate that fails when a fixture that
  builds a control socket roots at the long base. The gate is the point: it is
  what makes the fourth recurrence impossible rather than merely unlikely.

constraints: >
  - Change only fixtures that actually build or reference a control socket.
    The ~254 step files that create a fixture root and never touch a socket
    are out of scope; a sweep across all 297 would be churn with no defect
    behind it.
  - Do NOT relax the 100-char guard in `swarm_socket_lib.bb`, raise its limit,
    or add a test-only bypass. The guard is correct and fail-closed by design
    (BL-367); the fixtures are what is wrong.
  - Preserve the existing fixture-hygiene rules rather than working around
    them: BL-817's fixture tmux server reaping and BL-458's process-leak
    posture still apply to any root the helper hands out, and a fixture tmux
    server is reaped by SOCKET PATH, never by session name.
  - Keep roots unique per scenario. Shortening must not collapse two
    concurrent fixtures onto one path.
  - Out of scope: `swarmforge.sh` reporting the refusal on stdout, which is
    why the failure read as "no output at all". That is BL-947. The two are
    independent and either may land first.
  - Out of scope: re-running or repairing scenarios that fail for reasons
    other than socket path length once these fixtures are moved.

qa_e2e_procedure: >
  From the repo root unless stated:

  1. Reproduce before the fix. At the received commit's parent, run
     `specs/features/BL-368-control-loss-is-not-agent-death.feature` on macOS
     and confirm "A role whose process is still alive is never relaunched"
     fails, and that the real captured output names the unix-socket path limit
     with a path over 100 characters. Record the measured length.
  2. At the parcel commit, run the same feature and confirm that scenario now
     reaches its real assertion and passes, and that the whole feature is
     green (it was 3/4).
  3. Confirm the helper's arithmetic directly: create a root through it, build
     `<root>/.swarmforge/tmux/<hash>.sock`, and confirm the length is within
     the guard's limit with margin. Do this on macOS, where os.tmpdir() is
     long - a Linux-only check proves nothing here.
  4. Confirm the gate bites, then revert: point one socket-building step file
     back at an `os.tmpdir()` root, run the gate, confirm it fails naming that
     file, `git restore`, confirm green.
  5. Confirm invariant 1: add a NEW step file that builds a control socket
     under an os.tmpdir() root and confirm the gate flags it without any list
     being edited. Then confirm the negative case - a step file that creates a
     root and builds no socket is not flagged. Remove the scratch file after.
  6. Confirm invariant 2: make a scenario holding a helper root throw before
     its last assertion and confirm the root is gone afterwards. Check the
     short base directly for leftovers, and confirm no fixture tmux server
     survives, reaping by socket path.
  7. Run the full acceptance suite and confirm no scenario outside this
     ticket's set changed state in either direction.
  8. `git show --stat`: expect the helper, the gate, the socket-building step
     files it covers, this ticket's feature file and step handler. Confirm no
     `.bb` file changed and that no step file lacking a socket was touched.

notes: >
  Source: surfaced by the coder during BL-944 and raised to the specifier and
  coordinator as a priority-00 note on 2026-08-19, per the BL-937/BL-938
  precedent BL-944's own constraints required.

  The 43-file figure is what makes the scope decidable, and it is also why the
  gate matters more than the edits: the same three-line fix has now been
  written three times by three different parcels, each believing it was a
  local fixture quirk.

  mutation_cost is medium rather than low only because of the adoption
  breadth; each individual change is mechanical. If the adoption set proves
  larger than one sitting, the natural split is the helper plus the gate plus
  the currently-failing fixture first, with the remaining adopters following
  once the gate exists to prove the closure - do not split it any other way,
  since a partial adoption without the gate leaves no record of what remains.
