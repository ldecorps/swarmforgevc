id: BL-650
title: "flow-watchdog measures parcel age in WALL-CLOCK time: every swarm stop, cooldown night and rotation wait counts as delay, so tomorrow's 07:00 cooldown lift fires an ESCALATE storm over parcels with zero active-time age"
milestone: M8
