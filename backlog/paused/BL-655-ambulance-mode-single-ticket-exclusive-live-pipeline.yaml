source: |
  ## The gap, demonstrated the night this was filed

  BL-654 was ultra-urgent ("le resident ne doit rien faire d'autre"). The only
  exclusive mode available was the Expeditor (BL-567) — so the WHOLE swarm was
  stopped and the ticket driven through an OFFLINE pipeline, even though the
  live pipeline was perfectly healthy (it had just shipped BL-633 in 95 min
  with zero send-backs). The Expeditor was built for a sick pipeline (its
  birth: fixing the workflow while the workflow was broken); using it on a
  healthy one throws away the real transport, the real gates and the real
  telemetry, and freezes everything the stop orphans.

  ## The escalation ladder this completes

  ```
  1. expedite lane (Art 3.2.4)  priority at PROMOTION - but side-work still
                                 interleaves during transit (broadcasts,
                                 merge-ups, intake drains, home-queue bias)
  2. AMBULANCE (this ticket)     live pipeline, all daemons up, ONE ticket
                                 moves; everything else queues in place
  3. Expeditor (BL-567)          swarm STOPPED, offline stages - last resort,
                                 for when the pipeline itself is the casualty
  ```

  Rung 1 exists, rung 3 exists and now has one live run behind it; rung 2 is
  where "ultra urgent but the swarm is healthy" actually belongs.

description: |
  ## What this slice is

  ONE mechanism — a hold predicate — read at three live decision points, plus
  the human's way in and out. The perimeter (watchdog quiet, promotion freeze,
  automatic exit) is BL-679; this slice is the ambulance itself.

  ## The marker

  `.swarmforge/operator/control-ambulance.json`, in the exact posture of
  BL-423's `control-pause.json` (`backlog_depth_lib.bb`'s
  `read-pause-state` / `pause-active?` pair is the model to copy, not to
  extend — a separate `ambulance_lib.bb` with the same split: an impure
  reader that degrades to "off" on any read/parse failure, and a pure
  predicate over the parsed value). Shape: `{"active": true, "ticket":
  "BL-654", "engagedAtMs": 1753..., "by": "<who>"}`.

  Reads as OFF — byte-identical behaviour to today, on every path — when the
  file is absent, empty, unparseable, carries no `BL-###` ticket id, or names
  a ticket with no YAML anywhere under `backlog/`. That last case matters:
  a marker naming a ticket that does not exist would hold EVERYTHING forever,
  which is precisely the deadlock the operator ruled out. Fail safe, and log
  the reason.

  ## Attribution — the one predicate

  A parcel's attributed-ticket set is every `BL-###` id appearing in its
  `task:` header (git_handoff) plus its `message:` header and body (any
  type). The parcel is HELD when that set is non-empty and does not contain
  the ambulance ticket; otherwise it moves.

  **Attribution fails OPEN, deliberately.** A `note` has no `task:` header,
  and real bounce/steering notes do sometimes name no ticket at all (live
  example: QA's "3fed7545d3 cites 2 evidence files never committed"). Holding
  those would deadlock the ambulance ticket the moment it was bounced without
  its id in the message. The cost of the open direction is one stray note
  reaching the resident; the cost of the closed direction is the ambulance
  never finishing. Only positive attribution to a DIFFERENT ticket holds.

  ## The three read sites (all three, or the mode is dark)

  1. **Delivery** — `handoffd.bb`'s `poll-once!` / `deliver!`. A held parcel
     is simply not delivered this poll: it stays in the sender's `outbox/`,
     untouched, and is re-evaluated next poll. It is never moved to `failed/`,
     `sent/`, `abandoned/` or a quarantine. Log `deliver-skip-ambulance`.
  2. **Dequeue** — `handoff_lib.bb`'s `resolve-dequeueable-candidates`, the
     single funnel both `ready_for_next_task.bb` and the batch helper already
     pass through. A held parcel already sitting in an `inbox/new/` when the
     mode engaged is not a dequeueable candidate; it stays in `new/`. Existing
     `in_process/` work is NOT retracted — a mid-turn claim finishes.
  3. **Rotation actionability** — `handoffd.bb`'s `role-mail-row`, feeding
     `mono-router-lib/actionable-mail?` / `preferred-rotate-target`. Held mail
     is not actionable, so the resident is never pulled to it. This composes
     with BL-576's aged-note rule rather than forking it: ambulance filters
     the candidate set, aging still decides among what survives the filter.

  ## Entry and exit

  - `swarmforge/scripts/ambulance_cli.bb engage <BL-id> | release | status`
    writes/clears/reports the marker. Human-only; nothing in the swarm ever
    engages an ambulance for itself.
  - Telegram Control topic, alongside BL-423's pause verbs: `ambulance BL-654`
    engages, `ambulance off` releases, each confirmed back in the topic naming
    the ticket. The bot is the marker's writer here exactly as it already is
    for `control-pause.json`. This is not optional polish — the operator's own
    use case was phone-bound at 01:15, and a CLI-only ambulance would be
    reachable by nobody at the moment it is needed (BL-419 / BL-335).

  ## Explicitly unchanged by this slice

  Depth is not touched: `active_backlog_max_depth`, the recommended-cap
  throttle and `effective_backlog_depth_cli.bb` all read exactly as before.
  Ambulance is a dispatch filter, not a depth change — so releasing it has no
  cap to restore and cannot leave a throttle stuck on.

  Everything else keeps running: handoffd, babysitterd, Telegram, the
  watchdog, the operator. Staying observable is the whole point versus the
  Expeditor.

acceptance: specs/features/BL-655-ambulance-mode-hold.feature

out_of_scope: |
  - The perimeter — flow-watchdog quiet for held parcels, the coordinator
    promotion freeze, and automatic exit when the ticket lands in done/ or
    leaves the pipeline. All of it is BL-679, specced and queued behind this.
  - Retiring or modifying the Expeditor. It stays the last resort for a
    broken pipeline; this mode assumes a HEALTHY one.
  - Multi-ticket ambulances or ambulance queues. One patient per ride, by
    design; a second emergency is a human re-decision.
  - Auto-triggering from severity/type. Human-only entry, deliberately.
  - Retracting a claim already in `in_process/`. Engaging an ambulance never
    interrupts a turn mid-flight; it decides what happens NEXT.

notes: |
  Invariant to keep front of mind, from the operator's naming: an ambulance
  clears the road WITHOUT stopping the city. The Expeditor evacuates the city.
  Rung 2 should make rung 3 rare — if the Expeditor's log shows it being used
  on healthy pipelines after this ships, something is wrong with this mode's
  ergonomics, and that is a finding worth a ticket.

  ## Specifier rework, 2026-07-26 — what changed and why

  The pre-rework ticket carried a prose `acceptance:` block ("Specifier writes
  the scenarios") over six live surfaces at `mutation_cost: high`. It is now
  split in two, each an independently valuable parcel:

  - **BL-655 (this)** — the hold: marker, lib, CLI, Telegram verb, and the
    three read sites. Engage, hold, release, nothing lost.
  - **BL-679** — the perimeter: watchdog quiet, promotion freeze, automatic
    exit and the release announcement.

  The split is a specifier decision on already-approved intent, not a new ask;
  the operator's directive is quoted verbatim in `approval_context` on both.
  BL-679 is specced and paused, not deferred indefinitely — an ambulance
  without its perimeter is half a mode, and the two should ship back to back.

  ## Known cost of shipping this slice alone

  Until BL-679 lands, held parcels keep aging on the flow-watchdog's
  wall clock, so a long ambulance will emit one WARN and later one ESCALATE
  per held parcel. Noisy, not wrong, and bounded (the watchdog re-alarms only
  on a tier change). Accepted knowingly rather than pulling BL-679's watchdog
  work forward into an already-six-surface parcel.

  ## IR-DRY disposition (do not re-litigate)

  The feature file's IR-DRY report returns no high-confidence findings. The
  remaining medium `possible-synonym` / `near-duplicate` pairs are all the
  same canonical step pattern instantiated with different concrete values
  ("a git_handoff for task BL-654 is queued in the coder outbox" vs
  "... BL-660 ... cleaner inbox") — one step handler regex matches each
  family. That is the intended state, per the checker's own guidance to
  normalize only genuine wording drift.
