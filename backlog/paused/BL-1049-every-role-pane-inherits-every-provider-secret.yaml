id: BL-1049
title: "Every role pane inherits all 15 provider secrets: the tmux server's global environment is seeded from the launching shell, and the BL-657 scrub strips only harness markers"
milestone: M8
type: defect
severity: high
# high: broad credential exposure - fifteen live API keys and bot tokens
# reach seven agent panes, none of which needs any of them, and each pane
# runs an autonomous LLM agent with shell access. It is a live fault in a
# safety boundary (Article-4 sense), not a hypothetical. Not critical: the
# exposure is local to one host, nothing is lost or corrupted, no
# exfiltration is observed, and the swarm keeps running.
status: todo
epic: swarm-reliability
priority: 08
direction: human-requested
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1049-every-role-pane-inherits-every-provider-secret.feature
human_approval: approved
approval_context: >
  ONE design choice needs your call before this is built; the defect itself
  and everything else below is settled.

  Where does the keep-list come from? This spec DERIVES it from the running
  configuration - a swarm whose windows are all `claude` keeps no provider
  key at all, and switching one window to `vibe` automatically keeps
  MISTRAL_API_KEY. The alternative is a STATIC allowlist written into
  swarmforge.conf that the operator maintains by hand.

  Derived was chosen because the live evidence is a Claude-only pipeline
  carrying fifteen keys: with a static list, that list starts empty and every
  provider experiment (the deferred Mistral-documenter trial, the qwen intake)
  becomes "edit two files or the pane silently loses its key". Derived has the
  opposite failure mode: a consumer the config does not mention loses its key
  without anyone editing anything, which is why invariant 2 exists and why
  scenario 07 pins the launcher process out of scope entirely.

  Say the word and it flips to a static conf allowlist.

  FIRM, not up for decision: the launcher process's own environment is NOT
  scrubbed of provider keys (handoffd forks from it 67 lines later and reads
  RESEND_API_KEY from that env - see invariant 1); the deliberate
  passthroughs already in BL-657's keep-vars stay; the scrub happens at the
  two call sites BL-657 already established, not a new hook.

invariants:
  - "The launcher process's own environment keeps every provider secret. Only the tmux SERVER's global environment is narrowed. The two scrubs are separate lists because handoffd and the ancillary supervisors fork from the launcher shell AFTER it scrubs and read their keys from that inherited env."
  - "A name the running configuration needs is never removed. For any configuration, every variable a configured window's provider family reads, and every name on the deliberate-passthrough keep-list, survives the scrub - a scrub that breaks a configured provider is a worse defect than the leak it fixes."
  - "The Babashka lib and its shell twin name the same set. Any name one of them scrubs, the other scrubs; a name added to one only is a silent hole that the live launcher and the diagnostic CLI would disagree about."

description: |
  ## What is wrong

  `tmux new-session` seeds the tmux SERVER's global environment from the
  entire calling shell environment, and every pane the server opens
  afterwards inherits a copy. BL-657 established the scrub hook for exactly
  this reason - but scoped it to Claude Code / Cursor harness markers:

      swarmforge/scripts/harness_env_scrub_lib.bb  (scrub-vars: 10 names)
      swarmforge/scripts/harness_env_scrub.sh      (its shell twin)

  Provider credentials were never in that set. So every role pane still
  inherits every API key and bot token that happened to be exported in the
  shell that ran `./swarm`.

  ## What it is doing right now

  On the live swarm socket, secret-shaped names in the server's global
  environment (values redacted; 76 global variables in total):

      BAILIAN_API_KEY              GEMINI_API_KEY        QWEN_API_KEY
      BAILIAN_CODING_PLAN_API_KEY  MISTRAL_API_KEY       RESEND_API_KEY
      BAILIAN_TOKEN_PLAN_API_KEY   OPENAI_API_KEY        TELEGRAM_BOT_TOKEN
      CEREBRAS_API_KEY             OPENROUTER_API_KEY
      CURSOR_API_KEY               PERPLEXITY_API_KEY
      DASHSCOPE_API_KEY            DEEPSEEK_API_KEY

  Fifteen secrets. Now the other half of the evidence - what this swarm's
  own configuration asks for:

      $ grep '^window' swarmforge/swarmforge.conf
      window specifier  claude master  --model claude-opus-5  ...
      window coder      claude coder   --model claude-sonnet-5 ...
      window cleaner    claude cleaner batch ...
      window architect  claude architect ...
      window hardender  claude hardender batch ...
      window documenter claude documenter ...
      window QA         claude QA ...

  Seven windows, all `claude`. **Zero of the fifteen secrets is needed by any
  pipeline role pane in the running configuration**, and all seven carry all
  fifteen. The pane-side consumers that do read these names are ancillaries on
  their own separate sockets (`launch_front_desk_operator.sh` -> `$FD_SOCK`,
  `launch_operator.sh` -> `$OP_SOCK`), and they already receive their keys as
  explicit `-e` passthroughs via `ancillary_provider_fill_tmux_env` - the
  precedent this ticket follows rather than invents. `role_ask.bb`, the one
  Telegram-facing tool a role pane runs, reads no Telegram credential itself.

  ## The trap that makes this worth specifying carefully

  There are two scrub calls, and they are NOT interchangeable:

      swarmforge.sh:1856  scrub_harness_env              <- the LAUNCHER process
      swarmforge.sh:1862  scrub_tmux_harness_env "$SOCK" <- the tmux SERVER
      swarmforge.sh:1046  scrub_tmux_harness_env "$SOCK" <- create_role_session

  `start_handoff_daemon` runs at swarmforge.sh:1923 - after line 1856 - and
  forks handoffd with plain `nohup`, not into a tmux pane. handoffd reads
  `RESEND_API_KEY` for briefing email. So extending the LAUNCHER-process
  scrub to provider keys would silently kill briefing email while leaving the
  leak untouched. Only the tmux-server scrub may grow. Invariant 1 is that
  sentence, and scenario 07 is its gate.

  ## How (direction, not mandate)

  Give the BL-657 pair a second, separately-named set: provider/secret names
  the tmux server's global environment must not carry, minus a keep-list
  derived from the running configuration's own window provider families
  (`ancillary_provider_lib.sh` already maps a family to the names it needs)
  plus BL-657's existing `keep-vars`. Apply it inside `scrub_tmux_harness_env`
  only, at the call sites that already exist. `harness_env_scrub_names.bb`
  already reads `tmux show-environment -g` on stdin and prints names to
  scrub - it is the natural place for the classifier to become observable.

  Deliberately NOT in this slice, and named here so nobody folds it in:
  narrowing per ROLE, so a `vibe` documenter pane gets MISTRAL_API_KEY and the
  six `claude` panes on the same server do not. That needs per-window `-e`
  passthrough on `create_role_session` and is its own slice - recorded on the
  swarm-reliability epic's remaining_slices.

notes: |
  Source intake: `.swarmforge/operator/INTAKE-tmux-inherits-all-provider-keys.md`
  (archived to `.swarmforge/operator/archive/` on drain). Reported by the coder
  during BL-657 (note to coordinator `00_20260728T204448Z_000726`,
  2026-07-28T20:44Z), parked by the operator on land.

  The intake's three asks, verbatim, and where each landed:

  1. "Documents the leak with a fixture proving keys appear in
     `tmux show-environment -g` / pane env." -> scenarios 06 and 08, and the
     live evidence block in the description above.
  2. "Defines a scrub/allowlist at session create (pair with BL-657 harness
     scrub) so only intentional `-e` passthroughs reach panes." -> scenarios
     01-05 for the swarm-wide keep-list at the session-create hook. The
     per-role `-e` narrowing half is the follow-up slice named under How.
  3. "Does not break deliberate passthroughs (e.g.
     `CLAUDE_CODE_MAX_OUTPUT_TOKENS`)." -> invariant 2, scenario rows 05 and
     06, and scenario 07.

  Operator's own severity suggestion, verbatim: "size a defect (severity
  suggestion: high)". Adopted unchanged.

  Related but distinct: BL-720 (CURSOR_API_KEY leaking through the TEST
  harness, 8 sites) is a test-isolation defect, not this launch-time one.
  BL-657 is the landed harness-marker scrub this extends.

qa_e2e_procedure: |
  On the live swarm, after a launch built from this parcel:

  1. Confirm the leak is gone at the server:
       sock=$(ls -t .swarmforge/tmux/*.sock | head -1)
       tmux -S "$sock" show-environment -g | sed 's/=.*/=<redacted>/' \
         | grep -iE 'key|token|secret'
     On a Claude-only configuration this must print nothing except the
     deliberate passthroughs (CLAUDE_CODE_OAUTH_TOKEN,
     CLAUDE_CODE_MAX_OUTPUT_TOKENS).
  2. Confirm a real pane agrees - not just the server global:
       tmux -S "$sock" send-keys -t swarmforge-coder:0 \
         'env | grep -c OPENAI_API_KEY' Enter
     then read the pane: it must print 0.
  3. Confirm nothing that needs a key lost it. Briefing email still sends
     (`grep -i resend .swarmforge/daemon/handoffd.log` shows no keyless
     alert), the front-desk bot still answers on Telegram, and every role
     pane still reaches its model (each of the seven panes shows a live
     agent, not an auth error).
  4. Flip one window to a non-Claude provider in a fixture conf
     (`window documenter vibe documenter --max-price 2.00`), relaunch, and
     confirm MISTRAL_API_KEY IS present in the server global environment
     while the other fourteen are still absent.
  5. Confirm the launcher's own environment was untouched: handoffd's process
     env still carries RESEND_API_KEY
     (`tr '\0' '\n' < /proc/$(pgrep -f '[h]andoffd.bb' | head -1)/environ \
        | grep -c RESEND_API_KEY` prints 1).
