id: BL-947
title: "swarmforge.sh writes all 27 of its error messages to stdout, so a caller capturing stderr sees silence on every failure path and a caller capturing a value gets the error text mixed into it"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarm-reliability
human_approval: pending
priority: 40
direction: agent-proposed
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-947-swarmforge-sh-errors-reach-stderr.feature

invariants:
  - "stdout of swarmforge.sh carries values, never diagnostics. Several call sites capture a command substitution for its VALUE - the control socket path is the live example - so any diagnostic written to stdout does not merely go unseen, it corrupts the value the caller reads."
  - "A failure that already had a specific reason keeps naming it. This ticket changes the CHANNEL a message leaves by, never its text and never the exit status; a fix that routes to stderr while flattening the reason to a generic message is a worse outcome than the defect."

description: >
  Measured 2026-08-19 on `main`: `swarmforge/scripts/swarmforge.sh` contains
  27 lines of the form `echo -e "${RED}Error:${RESET} ..."`, and NONE of them
  redirects to stderr. `swarmforge/scripts/ancillary_provider_lib.sh` has one
  more with the same shape. Every launcher failure is therefore reported on
  stdout.

  The live example is the control-socket branch, `swarmforge.sh:124-127`:

      if ! TMUX_SOCKET="$(bb .../resolve_swarm_socket.bb "$WORKING_DIR" "$PROJECT_SOCKET_ID" 2>&1)"; then
        echo -e "${RED}Error:${RESET} $TMUX_SOCKET"
        exit 1
      fi

  `resolve_swarm_socket.bb` is correct - it prints its diagnostic to stderr
  and exits 1, exactly as its own header comment promises. The wrapper then
  merges that stderr into the captured value with `2>&1` and re-emits it on
  stdout. So the reason is produced properly and then moved to the wrong
  channel by the caller.

  This is not theoretical. It cost a correct diagnosis on the day it was
  found. BL-944's coder recorded a surfaced defect
  (`backlog/evidence/BL-944-surfaced-defect-not-fixed-20260819.md`, on
  `swarm/coder`) in which
  `specs/features/BL-368-control-loss-is-not-agent-death.feature` fails with
  "expected the refusal to name the reason, got stderr:" - empty. The step
  handler asserts on stderr, the launcher had put the reason on stdout, and
  the evidence concluded that `resolve_swarm_socket.bb`'s "error appears to
  land on stdout". It does not; `swarmforge.sh` moves it there. The evidence's
  remedy note is corrected by this ticket.

  How (direction, not mandate). The mechanical fix is `>&2` on each error
  echo. Prefer routing them through one small helper so the next error line
  cannot be added on the wrong channel, and keep the guard as an assertion
  rather than a convention - scenario 03 is deliberately written over the
  whole script rather than the one branch, because 27 sites patched one at a
  time is how this returns.

constraints: >
  - `swarmforge/` is a MAINTAINED FORK of unclebob/swarm-forge (Architecture
    Rule 2), so a change here is a deliberate, tracked local deviation. Record
    it the way the fork's other deviations are recorded rather than treating
    the file as ordinary local code.
  - Target stock macOS `/bin/bash` 3.2, not Homebrew bash - the shared
    engineering rule, and BL-937 exists because it bit. `echo -e` behaviour
    and any helper added here must hold on 3.2.
  - Do not change any message's text, its colouring, or any exit status. The
    channel is the whole defect.
  - Do not "fix" the `2>&1` on the socket branch by removing it. That capture
    is deliberate: the wrapper needs the bb diagnostic in a variable so it can
    prefix it. Only the re-emission channel is wrong.
  - Out of scope: the other shell scripts under `swarmforge/scripts/` that
    report errors by other means, and any change to `resolve_swarm_socket.bb`
    or `swarm_socket_lib.bb`, which are already correct.
  - Out of scope: the fixture-path defect that made this visible. That is
    BL-948, and the two are independent - BL-947 makes the reason readable,
    BL-948 stops the fixture provoking that particular refusal.

qa_e2e_procedure: >
  From the repo root:

  1. Reproduce before the fix. Run the launcher against a working directory
     whose control socket path overruns the 100-char guard (a deep path under
     a long base is enough) with stdout and stderr captured SEPARATELY, not
     merged. Confirm the refusal text appears on stdout and stderr is empty.
  2. At the parcel commit, repeat step 1 and confirm the refusal now appears
     on stderr and stdout is empty.
  3. Confirm the reason survived (invariant 2): the stderr text still names
     the unix-socket path limit and still reports the offending path and its
     length. A generic "Error: failed" here is a fail even though the channel
     is right.
  4. Confirm the exit status is still non-zero, unchanged.
  5. Confirm invariant 1 on the success path: run against a normal working
     directory and confirm stdout carries the resolved socket path alone,
     with no stray output that would corrupt a command substitution.
  6. Confirm the whole-script guard bites, then revert: add a new
     `echo -e "${RED}Error:${RESET} test"` without `>&2` to swarmforge.sh, run
     the guard, confirm it fails naming that line, `git restore`, confirm
     green.
  7. Run the acceptance feature and confirm all four scenarios pass.
  8. Confirm the stock-bash constraint: run the changed script under
     `/bin/bash` 3.2, not a Homebrew bash, and confirm no behaviour change.
  9. `git show --stat`: expect swarmforge.sh, possibly
     ancillary_provider_lib.sh, the guard, this ticket's feature file and step
     handler, and the fork-deviation record. No change to any .bb file.

notes: >
  Source: raised to the specifier and coordinator by the coder as a priority-00
  note alongside BL-944's handoff on 2026-08-19, per the BL-937/BL-938
  precedent of surfacing rather than fixing a defect a parcel uncovers.
  BL-944's constraints explicitly required that disposition.

  The coder's evidence file located the defect one layer too deep - it named
  `resolve_swarm_socket.bb` as the script putting its error on stdout. Probing
  that script on 2026-08-19 shows it binds `*out*` to `*err*` before printing
  and exits 1; the red `Error:` prefix in the captured output is
  `swarmforge.sh`'s own. The evidence's observation was right and its
  attribution was wrong, which is why this ticket is scoped to the wrapper.

  The 27/0 count is a static measurement over `main`, not a sample.
