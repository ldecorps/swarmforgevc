  - "A wake source is never removed before a live escalation producer covers the condition it stood in for - BL-653's own invariant, carried forward unchanged."
  - "The coordinator-inbox freshness probe keeps its second consumer: the BL-307/BL-310 closing-pass hibernation decision reads the same signal and must be unaffected by any change to the wake path."

