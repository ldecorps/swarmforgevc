notes: |
  Related, do not conflate: BL-486 (done, `/proc` orphan agent reaper — this
  extends its process-table half), BL-458 / BL-413 (done, fixture/sandbox
  sweeps, still `/proc`- and `/tmp`-centric), BL-611 (done, babysitterd
  lifecycle — host daemon stop stays `stop_ancillary_services.sh`; this
  covers LEFTOVER worktree babysitterd/tmux only).

  Locked human decisions, carried verbatim from the intake:
  1. Treat this as swarm-review stamp-off of a landed hotfix, not a
     greenfield implement ticket (same posture as BL-811).
  2. Severity high — silent no-op reaper on the production Mac host.
  3. Decapitation guards stay: never match host-repo paths; disposable-root
     extract remains mandatory for ancillary kills.

  ## Acceptance is parked as a draft, deliberately

  `acceptance:` points at a `.feature.draft`. The scenarios for a reaper
  running against a real Darwin process table need step handlers that do not
  exist, and shipping a live `.feature` without them hard-fails
  `specs/pipeline/runtime.js` on the first unmatched step (BL-233). The coder
  promotes the draft to a live `.feature` in the same parcel as its handlers.

  ## E2E QA procedure (specifier, 2026-08-07)

  1. **The no-op is really gone.** On this Darwin host, run a one-shot sweep
     with disposable ancillaries present and confirm a non-zero candidate
     count. `swept 0` here means the fix did not take.
  2. **A blind reaper says so.** Force the enumeration to fail (make the
     process-table read error) and confirm the sweep reports the check
     unavailable rather than logging `swept 0, reaped 0` — the exact shape
     BL-802 already established for a failed `ps` gather in babysitterd.
  3. **Decapitation guard.** With the host bot, bridge, runtime, host
     `babysitterd` and host tmux socket all live, run a sweep and confirm
     every one survives. Run this before trusting any reap count.
  4. **Linux is not regressed.** The `/proc` path must still enumerate; if no
     Linux host is available, say so explicitly in the QA evidence rather
     than recording it as passed.
