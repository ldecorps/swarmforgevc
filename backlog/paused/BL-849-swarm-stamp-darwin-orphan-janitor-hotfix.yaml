description: |
  ## What

  An operator hotfix is live on main and has never been through a gate. This
  ticket is that gate. It is a REVIEW ticket, not a rewrite ticket — confirm
  or refute, and open narrow follow-ups for anything found.

  ## The failure it fixed

  `operator_runtime` was alive and ticking `orphan-janitor-sweep swept 0
  candidate(s), reaped 0` every cycle while the process table held roughly
  thirty temp `telegram-front-desk-bot.js` + matching
  `start-bridge-headless.js` processes under `/var/folders/.../T/tmp.*`, plus
  worktree `babysitterd.sh` and stale `bl647.sock` tmux sessions. Three
  causes, all Linux assumptions:

  1. candidate scans read `/proc` only — absent on Darwin, so the candidate
     set was empty every tick;
  2. disposable-root matching was `/tmp/tmp.|aps-|sfvc-` only, so Darwin
     `$TMPDIR` never counted as disposable;
  3. ancillary patterns missed `babysitterd.sh`, and `(?:^|\s)tmux` failed to
     match an absolute `/usr/local/bin/tmux`.

  A reaper reporting `swept 0` looks identical to a clean host. That is why
  invariant 1 is stated as a property rather than left to the scenarios:
  every enumeration path must distinguish "nothing to reap" from "I cannot
  see the process table."

  ## What landed (files to review)

  - `swarmforge/scripts/process_table_lib.bb` (new) — `/proc` on Linux,
    `ProcessHandle` (+ `lsof` for cwd) on Darwin.
  - `swarmforge/scripts/orphan_janitor_lib.bb` — Darwin disposable roots;
    `babysitterd.sh` and path-tolerant `tmux` under those roots.
  - `swarmforge/scripts/orphan_janitor_sweep_lib.bb` — enumerate via
    `process_table_lib`.
  - `swarmforge/scripts/orphan_agent_reaper_sweep_lib.bb` — same seam for
    cmdline/scan/age/cwd.
  - Tests: `orphan_janitor_lib_test_runner.bb`,
    `process_table_lib_test_runner.bb`.

  ## Review goals

  1. Confirm the Darwin enumeration path is correct and that a failed
     enumeration is reported, not silently counted as zero (invariant 1).
  2. Confirm the decapitation guards hold: no host-repo path can ever match,
     and the disposable-root extract is mandatory on every reap decision
     (invariant 2). This is the highest-risk surface in the diff — a
     too-broad pattern here kills the human's live Cursor/Telegram session.
  3. Confirm `lsof`-based cwd resolution degrades safely when `lsof` is
     missing, slow, or denied.
  4. Open narrow follow-up tickets for anything found; do not widen here.

  ## Live verification the human already performed

  Recorded as context, NOT as a substitute for the swarm's own pass: one
  post-fix sweep reaped 58 disposable front-desk/headless ancillaries with
  the host bot/bridge/runtime untouched; a follow-up pattern extension reaped
  4 worktree `babysitterd` and 2 `bl647` tmux, leaving host `babysitterd` and
  host `.swarmforge/tmux/...` alone. `operator_runtime` restarted on the new
  code and its ticks are no longer stuck at `swept 0`.

