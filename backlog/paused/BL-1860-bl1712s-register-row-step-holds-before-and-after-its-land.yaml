description: |
  ## Status: hotfix 39391485f0 landed the fix

  This parcel is its stamp-off: the pipeline's review of what landed. The
  coder finds the step handler and feature already changed. Review them,
  do not re-apply them.

  ## What the hotfix changed

  - `specs/pipeline/steps/bl1712PricingTableOpus55Steps.js`: a
    `ticketState` helper finds BL-1712's YAML. In backlog/active or
    backlog/paused, it is open; anywhere under backlog/done (milestone
    folders such as `done/M8/` included), it is done; anywhere else, null.
    Open: both rows present and owned by BL-1712, as before. Done: no row
    names pricingTable.test.js or BL-1436's feature. Null fails.
  - The feature's step text now says both states: "... are owned by
    BL-1712 while it is open and gone once it is done".

  ## What is wanted in this parcel

  - Review the step against the invariant. Known edges to check, not
    mandates: a YAML in two folders at once; a `done/` milestone folder
    more than one level deep.
  - Evidence: the review.

  ## Scope

  The step handler, the feature's step text, evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1712-the-pricing-table-prices-claude-opus-5-5.feature`:
     6 of 6 ok. Measured on the hotfix tree at mint: 6 of 6 (it was 5 of
     6, scenario 04 red).
  2. `node specs/pipeline/cli.js specs/features/BL-1436-the-pricing-table-prices-every-model-the-swarm-runs.feature`:
     6 of 6 ok. Measured at mint: 6 of 6.
  3. `bb swarmforge/scripts/standing_red_register_cli.bb .` reports no
     row for BL-1712's feature (the hotfix removed it).

