description: |
  ## What

  A bb script (swarm-script tier, unit-test suite gate) that enumerates
  backlog/done/ RECURSIVELY (done items nest in milestone subfolders),
  selects tickets with a missing or empty epic:, and emits one report file
  (markdown table or CSV) proposing an epic for each, with per-row
  evidence and a confidence tier:

  - milestone-map: where an existing milestone cleanly maps onto one epic,
    propose it (the map itself is data in the report header, derived from
    the live epic trackers' own milestone: fields — surfaced so the human
    can veto a bad mapping wholesale).
  - roster-match: title/source keyword match against the type: epic roster
    enumerated from backlog/ (id, title, and decomposes_into children as
    match signals). Evidence column shows what matched.
  - needs-judgment: no signal clears the confidence bar — the row carries
    ticket id, title, milestone, and an EMPTY proposal cell for a human to
    fill. Never guess into this column.
  - pre-epic-era: propose the sentinel only when the ticket predates the
    epic system and matches nothing (evidence: its milestone predates the
    earliest epic's).

  Already-tagged done tickets are excluded. The report is the sole output;
  no backlog file is modified (invariant). BL-677 consumes the
  human-amended, human-approved report.

  ## Constraints

  - Deterministic given the repo state: same inputs, same report. No
    network, no LLM calls, no wall-clock content in rows (stable diffs).
  - Testable module per engineering rules: fixture backlog trees, injected
    paths; keep main() a thin wrapper.
  - Coder materializes the .feature.draft to .feature and wires step
    handlers in the same parcel (BL-441/BL-233).

  ## e2e QA procedure

  Run against the real repo: verify the report covers every untagged done
  ticket exactly once, spot-check ten milestone-map rows and ten
  roster-match rows for sane evidence, and confirm git status shows only
  the report file.
