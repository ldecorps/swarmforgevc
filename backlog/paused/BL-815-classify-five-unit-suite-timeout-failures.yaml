notes: |
  Sibling tickets from the same intake: BL-814, BL-816.

  ## Why the acceptance is a `.feature.draft`, not a live feature file

  This slice's deliverable is a committed measurement, not new runtime
  behaviour, so there is nothing for a step handler to drive. Shipping a live
  `.feature` here would hand the acceptance runner scenarios with no handlers
  and hard-fail the hardener's gate for no benefit (BL-233). The draft
  companion preserves the intended shape; the QA procedure below is the real
  verification, and it is a reading task, not an automated one.

  If classification promotes a failure to a real regression, THAT fix ticket
  gets a live feature file of its own — which is the right place for one.

  ## E2E QA procedure (specifier, 2026-08-05)

  1. **Record the host first.** `uptime` and core count, captured in the
     evidence file before any test runs. A classification with no load number
     next to it is not evidence and should be bounced.

  2. **Run each of the five alone**, not just the four files — rows 5-7 share
     a file, and "the file passes" does not establish that each test passes
     when it is not competing with its siblings.

  3. **Re-run the full suite** on the same host state and confirm the failing
     set matches the inventory. If it differs, the inventory is updated with
     both runs recorded — the intake is explicit that the measured set is
     authoritative and that an eighth failure is not to be invented.

  4. **Check each classification against its own evidence.** A row classified
     "load-induced" must show a passing isolated run AND a recorded high load
     for the failing one. A row that fails in isolation on a quiet host is a
     defect and must have a fix ticket id in the consequence column.

  5. **Confirm nothing was made green by budget.** Diff the slice for changed
     timeout values, skips, and exclude globs. Any of those without a recorded
     measured cause fails this ticket outright.
