approval_context: >
  Split 2 of 3 from `backlog/INTAKE-unit-suite-failing-tests-analysis.md`
  (human via Cursor, 2026-08-05). Siblings: BL-814 (the confirmed BL-487
  regression) and BL-816 (the process gate).

  WHY THIS IS ANALYSIS-ONLY AND NOT A FIX TICKET. Your decision 2 said do not
  dismiss as environmental without isolation proof — and the corollary is
  that I cannot spec a fix for these five without that proof either. All five
  are `Test timed out in 20000ms`. On a host at load average 76-250 (4 cores)
  a timeout carries no information: it is consistent with a real slowdown, a
  genuine hang, and a perfectly healthy test that never got scheduled. Guessing
  which, and speccing a fix from the guess, is exactly the reflex you are
  asking the swarm to stop.

  So this slice buys the measurement. It ends with a committed classification
  and, per your decision 1's 1:N permission, whatever fix tickets the evidence
  actually justifies.

  SEVERITY medium, DELIBERATELY, AND NOT AS A DOWNGRADE. Your decision 4 left
  flake severity to me but forbade it vanishing into "noted, not bouncing".
  The confirmed regression carries `high` and is BL-814. These five are
  unclassified, which is not the same as benign — the invariant above is what
  stops "unclassified" becoming a permanent resting place. If isolation
  promotes any of them to a real regression, its own fix ticket gets its own
  severity on the evidence.

  ONE THING TO CONFIRM. The intake says a quiet host. This box has been in the
  250+ band for days under continuous 3-shift operation, so "quiet" may mean
  pausing shifts for the duration of the run. I have not assumed authority to
  do that. If the measurement needs a shift pause, that is your call.

