description: |
  ## The five unclassified failures

  From the full-suite run of 2026-08-05 (`/tmp/vitest_full.log`, ~432s,
  4 files / 7 tests failed, plus 119 `[vitest-worker] Timeout calling
  "onTaskUpdate"` errors). Rows 3-4 of the intake's table are root-caused and
  split to BL-814; these five are not:

  ```
  1  dependencyGateCliReportsAndScope.test.js   identical fixture -> byte-identical reports
  2  dependencyGateCliStorageGlobals.test.js    bare localStorage.setItem global reference
  5  renderBriefingDiagramsCli.test.js          renders exactly the two maintained diagrams
  6  renderBriefingDiagramsCli.test.js          main() in-process against the real repo
  7  renderBriefingDiagramsCli.test.js          compiled CLI standalone as a subprocess
  ```

  All five: `Test timed out in 20000ms`. Both files in rows 1-2 shell out to a
  real dependency-checker subprocess; all three in rows 5-7 render real
  diagrams, one of them as a subprocess. Subprocess-heavy tests are precisely
  the ones a saturated host starves — which is a hypothesis to test, not a
  verdict to assume.

  ## What this slice delivers

  An evidence file at `backlog/evidence/BL-815-unit-suite-timeout-classification-<YYYYMMDD>.md`
  recording, for each of the five:

  - **what production seam it guards** and which ticket introduced it;
  - **the isolation result**: run alone, on a host whose load is recorded
    alongside the result — a number, not an adjective;
  - **a classification**: real regression / real slowdown past the 20s budget /
    load-induced starvation / suite-infra (worker RPC);
  - **the consequence**: a fix ticket id, or an explicit argued reason none is
    needed.

  Then the fix tickets that classification justifies, minimally scoped.

  ## Constraints inherited from the intake, unchanged

  Do not make these green by raising the 20s budget, skipping, widening
  exclude globs, or deleting coverage. If a test genuinely needs more than 20s
  for a defensible measured reason, that is a finding to record and ticket with
  the measurement attached — not an edit to make the red go away.

  Also record the 119 `onTaskUpdate` worker-RPC errors: whether they are a
  consequence of the same saturation, or an independent suite-infra defect.
  They are noise that makes every other signal harder to read, which is its own
  cost even when nothing is failing.

