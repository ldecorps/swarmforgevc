required_wiring:
  - "specs/pipeline/steps/index.js::bl997::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "The busy definition exists in exactly one place per side, and a test asserts the two agree. A comment saying they are kept in sync is never the gate."
  - "When the check fails it names both literals, so the drift is diagnosable without reading both languages and without knowing which side moved."

description: >
  A mid-turn pane is classified twice, in two languages, in two processes.
  The swarm does it in Babashka (`chase_sweep_lib.bb` and, until BL-996, two
  private siblings). The extension host does it in TypeScript:

  - `extension/src/panel/agentPaneState.ts:48` - `UI_MARKERS`, a regex
    alternation carrying the busy footer alongside the idle-prompt hint.
  - `extension/src/swarm/tmuxClient.ts` - the respawn precheck, which
    captures the pane fresh and refuses the respawn outright when it sees the
    footer, overriding its caller.

  The extension host runs in a separate process with no path to a `.bb` lib,
  so no import can bridge these - the marker is mirrored BY HAND. What holds
  it together today is a pair of comments, one on each side, each explaining
  what the literal means. Nothing asserts they are the same literal.

  The engineering rules already name this exact shape and require a test:
  a constant mirrored by hand across a language boundary no import can bridge
  needs a test asserting both literals agree, because a "kept in sync"
  comment is not a gate and drift fails silently (BL-897).

  THE DRIFT IS DATED, NOT HYPOTHETICAL. BL-970 is active and is changing the
  Babashka classifier now; BL-996 will fold two more Babashka consumers into
  it. Nothing in either ticket touches TypeScript, and nothing would tell the
  TypeScript side that the definition of "mid-turn" moved. The first symptom
  would be behavioural and quiet: `tmuxClient.ts` refusing a respawn for a
  pane the swarm now considers idle, or - the direction BL-137 already cost
  this project once - typing a forced respawn into a pane that is genuinely
  mid-turn.

  AMENDMENT 2026-08-20 16:05 (specifier). THE DRIFT IS NO LONGER PENDING -
  IT IS HOURS AWAY. When this ticket was written, BL-970 was merely active.
  It has since passed BOTH coder and cleaner: the fix is commit `fa060af3e`,
  merged for cleanup as `3ced65a86`, and it is now walking architect ->
  hardender -> documenter -> QA.

  That commit does not tweak the Babashka definition, it REPLACES it. The
  classifier now recognizes a live status frame STRUCTURALLY - a
  spinner-glyph-led line with verb words, an ellipsis and a digit-led
  parenthesized elapsed - and it consults only the snapshot's TAIL WINDOW,
  so a byte-perfect frame line quoted deep in scrollback no longer counts.
  The hand-maintained verb list is removed outright.

  The TypeScript side does none of that. It still matches the marker as a
  substring anywhere in the pane. So the moment `fa060af3e` reaches `main`,
  the two sides genuinely disagree: a pane quoting the marker in old
  scrollback is IDLE to the swarm and BUSY to the extension host. The
  TypeScript copy will be carrying, alone, the exact defect class BL-970
  rated `high` - and no test will say so.

  How (direction, not mandate): give each side one definition and a test that
  feeds BOTH the same fixtures and asserts identical verdicts. The fixtures
  are the natural carrier - the marker literal should live in a fixture file
  rather than inline in either source or in this ticket, the way
  `specs/features/fixtures/BL-970/` already holds it, so that prose about the
  gate cannot reproduce the string the gate matches. An agreement test that
  compares behaviour on shared fixtures is stronger than one comparing the
  literals directly, and it keeps working if one side legitimately needs a
  different spelling.

constraints: >
  Firm lines:

  - This ticket does NOT change what "busy" means on either side. It makes the
    two sides provably agree on whatever the definition is. Changing the
    Babashka definition is BL-970; consolidating its Babashka consumers is
    BL-996.
  - Do NOT solve this by making the extension host shell out to Babashka to
    classify. That would put a subprocess in the UI's hot path to remove a
    duplicated string, and the two-layer rule keeps the extension host and
    the swarm substrate as layers rather than one calling the other for
    trivia.
  - Do NOT inline the marker literal into this ticket, its feature file, or a
    source comment that a pane might display. It is a short English phrase
    and any pane rendering it is classified busy by the very code under test.
    BL-970's author already had to quarantine it into a fixture file for this
    reason - its own YAML and feature file contain zero occurrences.
  - `extension/src/extension.ts:422` and
    `extension/src/watchdog/wedgedRespawn.ts:8` mention the marker in
    comments only and classify nothing. Leave them; a sweep that "fixes" a
    comment is churn.

qa_e2e_procedure: >
  From the repo root:

  1. Establish the baseline BEFORE changing anything: confirm both sides
     currently agree. Run the new agreement check at the parcel's parent
     commit content and confirm it passes - if it fails on arrival, the sides
     have ALREADY drifted and that is a finding to report before proceeding,
     not a test to adjust.
  2. Confirm invariant 1 is a gate, not a comment: prove non-vacuity by
     changing the Babashka-side definition alone (in the working tree, not
     committed) and confirming the check goes red. Then change the
     TypeScript side to match and confirm it goes green again. Revert both.
  3. Confirm invariant 2: read the failure output from step 2 and confirm it
     names BOTH literals. A failure that says only "mismatch" forces the
     reader to open two languages to learn what moved.
  4. Confirm scenario 03's consequence directly against the real precheck in
     `tmuxClient.ts`: a fixture rendering a live turn-status frame must be
     refused a respawn. This is the BL-137 direction and is the reason the
     TypeScript copy exists at all.
  5. Confirm the marker literal is not inlined anywhere it could be
     displayed: grep this ticket's YAML, its feature file and any new source
     comment for the literal and assert zero occurrences outside fixture
     files.
  6. Run the acceptance feature, all scenarios green, handler registered in
     `specs/pipeline/steps/index.js`. Run the existing extension test suite
     and confirm no regression in the pane-state and respawn paths.

notes: >
  Split out of the BL-996 sweep (coder note 20260820T155459Z_000389). That
  sweep derived the full closure of busy classifiers rather than hand-listing
  them; this ticket is the half that BL-996 explicitly cannot reach, because
  the extension host cannot import a `.bb` lib.

  The closure, for the record, separating real classifiers from mentions:
  reaching the Babashka chokepoint and needing no change,
  `babysitter_nudge_lib.bb:63` (message string) and
  `remote_control_respawn.bb:75` (delegates); private Babashka classifiers,
  `babysitterd_sweep_lib.bb:207` and `loop_detect_lib.bb:37`, both BL-996;
  private TypeScript classifiers, `agentPaneState.ts:48` and
  `tmuxClient.ts`, this ticket; comment-only, `extension.ts:422` and
  `wedgedRespawn.ts:8`, left alone.

  Severity `medium`, held deliberately after re-examining it when the
  amendment above landed. The argument for raising it is real - once
  `fa060af3e` lands, the TypeScript side alone carries a defect class BL-970
  itself rated `high`. I have not raised it because the blast radius is much
  narrower than BL-970's was: BL-970's `high` came from wake delivery, where
  a false-busy left a role unwakeable for hours. The TypeScript copy gates
  only the extension host's forced-respawn precheck and its pane-state
  rendering, where a false-busy means a refused respawn - visible,
  recoverable, and rare. Same defect, far smaller surface.

  IR-DRY: zero findings.

approval_context: >
  The scheduling question is the one worth your attention, and it cuts
  against the usual instinct.

  I deliberately left `depends_on` EMPTY, even though this ticket is about
  drift that BL-970 and BL-996 will cause. The gate is most valuable landed
  FIRST: if it exists before the Babashka definition changes, BL-970's own
  parcel goes red the moment it drifts and whoever holds it fixes the
  TypeScript side in the same breath. If it lands afterwards, it arrives red
  and reports drift that has already shipped - still useful, but it becomes a
  bug report instead of a guardrail.

  Nothing enforces that ordering, so it is a promotion decision rather than a
  dependency. If you would rather not hold BL-970 for it, that is entirely
  reasonable - just expect this to arrive red and to spawn a follow-up.

  TIMING, added 2026-08-20 16:05 and corrected minutes later: that window is
  now nearly shut. BL-970 has passed coder and cleaner and is walking the
  review stages. This ticket was still `human_approval: pending` when the
  paragraph was first written; you approved it while the amendment was being
  committed, so the remaining decision is no longer approval but PROMOTION
  ORDER - and it now sits with the coordinator, who has been told. If this is
  not promoted ahead of BL-970 landing, expect it to arrive red and to spawn
  a follow-up rather than to act as a guardrail.

  Second, smaller judgement: I ruled out having the extension host shell out
  to Babashka for classification, on the two-layer rule. It would genuinely
  remove the duplication rather than merely policing it, so if you would
  rather pay a subprocess in the UI path to get one true definition, say so
  and this becomes a different ticket.

  COORDINATOR, 2026-08-20 ~16:06: cannot promote yet - backlog/active/ is at
  the effective cap (7/7, no ambulance, onboarding gate allow) with no
  closable ticket right now (QA/documenter/cleaner queues empty; nothing
  approved-pending-close). BL-997 is now the top promotion candidate for the
  next open slot, ranked ahead of BL-996 (which additionally depends_on
  BL-970, still unlanded). Will promote+route the instant a slot frees.
