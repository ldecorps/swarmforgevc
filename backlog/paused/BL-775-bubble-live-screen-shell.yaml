notes: |
  ## e2e procedure for QA

  With a live swarm and a paired Bubble build: open Live Screen from the main
  navigation and confirm the role list matches what the Mini App Live Screen
  shows for the same swarm at the same moment. Then stop the swarm and confirm
  the screen states the reason rather than a bare code; then point Bubble at a
  bad token and confirm the same. Confirm no control affordance is present.
