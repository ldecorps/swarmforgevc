notes: |
  ## Why there is no new steer ticket (BL-680 consolidation record)

  The intake locks a steer text box on the full-screen pane. **BL-569**
  (`live screen interactive pane input`, human-approved, priority 96,
  `status: needs_design`) already specs exactly that, down to the security bar
  — Telegram initData HMAC against the principal, a default-OFF conf flag, an
  append-only injection audit log, rate/size limits, an explicit ARMED state so
  a pocket tap cannot type into a pane, and the hard human constraint that the
  pane header stays visible behind the keyboard strip.

  BL-774's notes flagged BL-569 as at risk of being paid for twice, because it
  builds on the Mini App Live Screen while Live migrates to Bubble. **The
  human's remote-HTML ruling dissolves that risk**: both surfaces now render the
  same bridge-side Live Screen, so BL-569 lands on both at once. It is recorded
  as this epic's slice C and amended for the Bubble principal rather than
  duplicated here.

  ## e2e procedure for QA

  With a live swarm and a paired Bubble build: open Live from the Bubble pager
  and confirm the coordinator and resident cards match what the Mini App Live
  Screen shows for the same swarm at the same moment. Tap the resident, confirm
  the full-screen pane updates on the ~1.5 s cadence and that ticket id, title,
  role, model and claim age are all visible. Stop the swarm and confirm the page
  states the reason rather than a bare code; point Bubble at a bad token and
  confirm the same. Confirm no control affordance is present anywhere on the
  page.
