id: BL-775
title: "Bubble Live Screen — the coordinator + resident pane view ships as a remote HTML page in the Bubble UI bundle, read-only, built from the Live Screen the bridge already serves"
milestone: M8
type: feature
status: todo
epic: bubble-live-screen
human_approval: approved
assigned_to: none
priority: 130
direction: human-requested
depends_on: [BL-829]
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-775-bubble-live-screen-shell.feature

invariants:
  - "One renderer, never two: the Bubble Live page and the Mini App Live Screen are produced from the same bridge-side Live Screen source, so a change to what Live shows cannot land on one surface and miss the other."
  - "This slice is read-only: no code path from the Live page reaches a bridge endpoint that mutates swarm state."
  - "The rendered state is never more confident than the evidence: whenever a pane capture or the bridge supplies a failure reason, the page displays that reason, and a bare status code is never the whole message."

required_wiring:
  - "extension/src/bridge/letsTalkRoutes.ts::bubbleLivePage::the Live page must be registered in the served UI bundle manifest; a page the manifest does not name can never be opened from the pager (the BL-419 shape)"
  - "extension/src/bridge/residentSpyUiHtml.ts::renderLiveScreenBody::the Bubble page must be built from the existing Live Screen renderer, not a second copy of it, or the two surfaces drift on the first change"

description: |
  ## What

  Give Bubble a Live page in its remote UI bundle: an overview showing the
  **coordinator** and the **resident**, tap either for a full-screen pane view,
  with the ticket/role/model/claim-age strip the Live Screen already renders,
  refreshing on the cadence it already uses. Read-only.

  ## Why this ticket was rewritten on 2026-08-06

  This slice was specced native Kotlin. The human ruled on 2026-08-06:

  > Remote HTML for all 4, and flip BL-775 to remote

  — resolving a live contradiction between this epic's specifier-default
  ("*Native UI only, or a staged WebView-backed migration?* — **Native**, from
  slice A") and BL-824's human-locked decision that the APK changes only when
  the thin shell itself changes. A new native screen changes the APK; the human's
  own ruling wins, and BL-774's question 1 has been corrected to match.

  ## What that ruling buys, measured rather than assumed

  The native framing had Bubble re-implementing the Live Screen in Kotlin. Remote
  HTML means the work is mostly **already done on the bridge**, verified against
  the code on 2026-08-06:

  - `residentSpyUiHtml.ts` (789 lines) already renders the pane grid, the
    `ticket-strip` (ticket id, ticket title, role label, model label,
    claim-entered age), and refreshes at `setInterval(refresh, 1500)` — which is
    exactly the 1500 ms cadence the intake locked.
  - `residentPaneLive.ts` already exposes `captureMonoRouterLiveScreen`, whose
    snapshot is precisely the coordinator + resident cast the intake asked for,
    plus `LIVE_SCREEN_ROLE_ORDER` as the canonical order.
  - `/resident-pane` already serves that snapshot under the bridge's read auth.

  So slice A is **not a rewrite**. It is: publish the existing Live Screen
  renderer as a page in the UI bundle, sized and navigable for a phone, and let
  the shell render it. The parity invariant stops being something to police and
  becomes structural — there is only one renderer to drift from.

  ## Approach

  1. Extract the Live Screen body from `residentSpyUiHtml.ts` behind a named
     renderer both the existing Mini App route and the new bundle page call. Do
     not fork the HTML; a copy is the one thing this ticket's first invariant
     forbids.
  2. Register the page in the UI bundle manifest BL-825 defines, so BL-829's
     pager can open it.
  3. Phone layout: the overview shows coordinator and resident as two cards;
     tapping one opens that pane full-screen; a back affordance returns. The
     ticket strip stays visible in the full-screen view — this is a hard
     constraint carried from BL-569 and it binds here too.
  4. Keep the read path exactly as it is. This page adds no bridge contract.

  ## The locked human decisions this page must honour

  Carried verbatim in substance from
  `INTAKE-bubble-live-screen-coordinator-resident.md` (human via Let's Talk /
  Cursor, 2026-07-31), read-only half:

  1. **Navigation.** Live is another expanded-Bubble pager page (same family as
     Notes / Control). Default expand still Let's Talk unless later changed.
  2. **Cast.** Overview shows coordinator and resident (mono-router shape). Tap
     either → full-screen pane view.
  3. **Refresh.** Keep the current Mini App poll period — 1500 ms. Do not invent
     a true continuous stream in version one.
  4. **Metadata.** Ticket id, ticket title, role label, model label,
     claim-entered age, visible in overview and full screen.
  6. **Accepted in spirit.** Clear idle / sleeping empty state; stale mark if the
     tunnel lags; do not pack approvals or Control verbs onto this page.
  7. **Out of version one.** True continuous tmux stream / websocket pipe;
     host-agent thinking screen (BL-834/BL-835); the full classic eight-pane grid
     unless mono later expands.

  Decision 5 — the steer text box — is NOT dropped. It is a write path and it
  already has a fully-specced, human-approved home in **BL-569**, which this
  ticket does not duplicate. See `notes:`.

out_of_scope: |
  - Any control, keystroke, or write action from the Live page. That is BL-569,
    now recorded as this epic's slice C.
  - Deprecating, redirecting or flagging off the Mini App Live Screen. Slice D.
    Dual-run is fine and the human explicitly said cutover can wait.
  - Changing `/resident-pane` or any other bridge contract.
  - The full classic multi-pane grid. Coordinator + resident is the cast.
  - Building the pager's remote-page host. That is BL-829, which this depends on.

approval_context: >
  Already approved as a native screen; re-approved in substance by the human's
  2026-08-06 "flip BL-775 to remote" directive, which is what this rewrite
  implements. Kept at `approved` on that basis rather than re-asking.

  Two specifier calls inside the rewrite, both amendable: (1) the Live Screen
  HTML is EXTRACTED into a shared renderer rather than copied, which touches the
  live Mini App route and so carries a small regression risk to a surface that
  works today — the alternative, a copy, was rejected because it guarantees
  drift; (2) tap-to-fullscreen and its back affordance are specified here, and
  BL-569 records that today's tap-to-restore gesture collides with its
  tap-to-arm, so whoever builds BL-569 must resolve that gesture design against
  this page rather than against the Mini App alone.

