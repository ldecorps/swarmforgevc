    `depends_on`, not just here.

  VISION: SwarmForge currently embeds prompt construction across agent launch scripts
  and constitutions, and model knowledge is scattered across packs, recruiter artifacts,
  and operator folklore. The Swarm Intelligence Layer makes prompt composition and model
  knowledge first-class architectural capabilities so the swarm can scale to many
  providers without duplicating policy in every launch path.

  PILLARS (each is its own promotable child):
    - BL-546 PromptEngine — single authority for every prompt the swarm generates.
      Assembles reusable fragments, applies model-specific adapters, injects project
      and task context, and exposes inspection/caching/versioning. No swarm agent
      constructs prompts directly.
    - BL-547 Model Steward — permanent infrastructure role owning the complete lifecycle
      of model integration: onboarding, benchmarking, certification, capability
      matrices, and continuous improvement of PromptEngine adapters. Produces the
      evidence ModelFactory consumes.
    - BL-525 ModelFactory — recruiter-backed role→model assignment with cheap/quality
      steering and cold-then-hot swap apply paths. Consumes Model Steward artifacts
      and recruiter ranks; does not invent models or prompts.
    - BL-548 Prompt calibration loop — test experimental adapter variants against a
      real model via Model Steward evaluate; promote winners to the adapter catalogue
      with human approval and regression guard.
    - Onboarder (BL-624, BL-625; naming ruled by BL-643) — survey ->
      propose -> negotiate -> agreed contract for a NEW target repo, gating dispatch
      via the BL-262 onboarding-contract gate. Tagged `epic: swarm-intelligence-layer`
      since its own drain landed but never backfilled into this tracker's
      `decomposes_into` (fixed 2026-07-26) or this PILLARS list (fixed same pass).
      Orthogonal to fleet-topology (BL-543): this pillar is per-target CONTRACT
      negotiation, one swarm sequentially retargetable across many projects without
      needing concurrent multi-swarm infrastructure; BL-543 is for when true
      concurrent multi-swarm IS wanted.

  RELATIONSHIPS:
    PromptEngine produces prompts.
    Model Steward improves PromptEngine (adapters, metadata, certification).
    Prompt calibration closes the loop: compose variants → evaluate on model → promote.
    ModelFactory uses Model Steward knowledge to select the most appropriate model.
    Recruiter (BL-233, done) remains recommend-only scout; Model Steward certifies
    and ModelFactory assigns.

  SLICE DISCIPLINE:
    Each child ships in slices (Slice 1 = minimal vertical, later slices add adapters,
    hot-swap, certification automation, etc.). Cross-child dependencies are explicit in
    each child's `depends_on` — e.g. ModelFactory Slice 1 may ship before Model
    Steward certification automation, but must not hard-code prompt text that bypasses
    PromptEngine once BL-546 Slice 1 lands.

  COORDINATOR PROMOTION ORDER (human-approved 2026-07-21; follow strictly):
    1. BL-546 PromptEngine — PROMOTE FIRST. Foundation; extract compose API from
       agent_runtime_lib.bb. Coder ships Slice 1 before Slice 2/3 in the same ticket.
    2. BL-547 Model Steward — PROMOTE IN PARALLEL with BL-546 when active cap allows.
       Registries are independent; do not wait for BL-546 unless at depth cap.
    3. BL-525 ModelFactory — PROMOTE only after BL-546 Slice 1 is on main (depends_on).
       Factory must not ship while launch scripts still assemble prompts directly.
    4. BL-548 Prompt calibration — PROMOTE LAST. Do NOT promote until BOTH:
         (a) BL-546 Slice 2 is on main (adapters + SWARMFORGE_PROMPT_EXPERIMENT), AND
         (b) BL-547 Slice 2 is on main (model-steward evaluate ingestion).
       Ticket-level depends_on [BL-546, BL-547] means those tickets reach done/ — but
       BL-548 Slice 1 additionally needs their Slice 2 code. Verify before promoting.
    Never promote BL-1329 itself (epic tracker). Never promote BL-548 before its
    block_until conditions are met even if depends_on tickets are merely active.

  SUPERSEDES: BL-542 remains as the model-routing sub-tracker for BL-525 only; BL-1329
  is the umbrella epic for the full intelligence layer (renumbered from BL-545
  2026-09-02 — see notes on the duplicate-id resolution). New children use
  `epic: swarm-intelligence-layer`.

