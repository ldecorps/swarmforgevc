description: |
  ## What

  BL-636's landing commit message described restoring a dropped close-paren
  in handoffd.bb; the actual diff never touched that file. On a live pipeline,
  the architect (or QA, per "Forwarded Commits Carry Their Lineage" and
  general diff-review discipline) reviews the actual changed files against
  the commit's own claims before approving — that check either didn't happen
  in the pilot, or happened without cross-referencing the stated fix against
  `git show --stat`.

  ## Question to answer

  Which hat is supposed to catch "commit message claims X, diff shows
  not-X"? Is this implicitly covered by existing bounce/review discipline, or
  does it need an explicit checklist item (e.g. in the architect or QA bounce
  evidence contract, Article 4.4) naming "commit message matches diff" as a
  check? Harden `/pilot` (or the constitution) accordingly.
