description: |
  ## What
  `swarmforge/scripts/merge_drop_guard_lib.bb` (BL-1576's send-time gate,
  bounded by BL-1610) decides "the merge dropped the received side's
  uncontested hunks" per PATH: `changed-paths` = `git diff --name-only
  base side`, `diff-u0`/`blob-sha` read the same path on each side. A
  rename is invisible to it. The daily instance is a backlog promotion:
  `Promote BL-N: paused -> active` is `git mv backlog/paused/BL-N-*.yaml
  backlog/active/` plus one `assigned_to:` line. When the forwarding
  branch has merged main past that promotion and the received branch has
  not, the received side still holds `backlog/paused/BL-N-*.yaml`, the
  forwarded side holds it at `backlog/active/`, and the guard reads every
  line of the file as dropped:

      Cannot send git_handoff for BL-1467: merge 6374919639 dropped 128
      lines of the received side's uncontested hunks in
      backlog/paused/BL-1680-the-local-seat-fixture-pins-the-model-it-fakes.yaml

  (documenter, 2026-09-21 15:35 local; `diff` of the two copies is the one
  `assigned_to: coder` line the promotion added). Fourteen promotions
  landed on main that day. Adjudication:
  backlog/evidence/BL-1683-merge-drop-guard-rename-blind-adjudication-specifier-20260921.md;
  documenter evidence (documenter branch c819aab271):
  backlog/evidence/merge-drop-guard-rename-blind-false-positive-bl1680-20260921.md.

  ## Why
  The guard exists to catch a merge that silently reverts landed work
  (BL-571/BL-958/BL-954); a promotion moves a file and loses nothing. A
  guard that refuses the ordinary case trains every role to reach for
  the excuse commit by reflex, and the excuse is an EMPTY revert whose
  message names a commit nothing reverted - a lie in the history, once
  per promotion per lagging branch. The fix is to judge content, not the
  path string.

  ## How (direction, not mandate)
  - `changed-paths` (or a sibling) runs `git diff -M --name-status base
    side` and returns, per entry, the old path and the new path (`R<score>`
    rows carry both; `A`/`M`/`D` rows one). Build the rename map for the
    forwarded side of the flagged merge.
  - In `findings-for-side`, when the received-side path is renamed on the
    forwarded side, compute `lines-lost` against the NEW path's blob
    (`diff-u0 <received-tip> <forwarded> -- <old> <new>` or diff the two
    blobs directly) - a hunk present at the new path is not lost.
  - Keep `excused-by-blob-identity?` and `revert-excuses?` as they are;
    add the rename case to `refusal-message` so a real drop at a renamed
    path names the new path.
  - Fixtures: `merge_drop_guard_lib_test_runner.bb` gains (a) rename
    without loss -> no finding, (b) rename with a lost uncontested hunk ->
    finding at the new path; the bl1576 property runner's generator gains
    a rename move.

  ## Scope
  - `swarmforge/scripts/merge_drop_guard_lib.bb`,
    `swarmforge/scripts/test/merge_drop_guard_lib_test_runner.bb`,
    `swarmforge/scripts/test/bl1576_merge_drop_guard_property_runner.bb`.
  - `specs/features/BL-1683-the-merge-drop-guard-reads-a-promotions-rename-as-a-dropped-file.feature`
    and `specs/pipeline/steps/bl1683MergeDropGuardMapsRenamesSteps.js`
    (same parcel, BL-233, registered in `specs/pipeline/steps/index.js`).
  - Documenter: the BL-1576 how-to's "why was my send refused" section
    gains the rename case and drops the empty-revert interim once landed;
    no diagram trigger (handoff-flow.mmd shows the gate, not its rule).

