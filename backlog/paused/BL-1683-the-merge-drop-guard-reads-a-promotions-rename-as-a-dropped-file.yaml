  Interim until this lands (verified 2026-09-21 on a detached scratch copy
  of the documenter's tip, e422892902, re-run through the guard: clean):
  for each sha in `git log --format=%H $(git merge-base <merge>^1 <merge>^2)..<received tip> -- <old path>`,
  `git revert --no-commit <full sha>` (it conflicts on the rename),
  `git reset -q HEAD -- . && git checkout -q -- . && git clean -fdq`,
  then `git commit --allow-empty -F "$(git rev-parse --git-dir)/MERGE_MSG"`
  - git's own message carries the literal `This reverts commit <full sha>.`
  line the guard greps for. A hand-written subject without that line is
  NOT excused (the documenter's cf53cdf6b0 was still refused).

  Census (BL-1445): `git log --since='2026-09-21 00:00' --format=%s
  origin/main | grep -c '^Promote'` = 14 on the day of the mint; each is
  a `git mv` paused -> active plus one line.
