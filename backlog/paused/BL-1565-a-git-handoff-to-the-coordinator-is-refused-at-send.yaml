id: BL-1565
title: "A git_handoff addressed to the coordinator is refused at send: QA's post-land close of a PASSED ticket reaches the coordinator as a git_handoff stamped non-forwarding, Article 2.4 makes the coordinator complete it merge-only and wait for a close that never comes, and the ticket sits in active/ at cap 1 until the swarm starves (BL-1527 parcel 002673 on 09-13, BL-1563 parcel 002698 on 09-14) - the close is a note, and swarm_handoff.sh refuses the parcel shape before the mailbox"
