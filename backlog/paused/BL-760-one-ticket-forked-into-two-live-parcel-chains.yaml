invariants:
  - "At most one live git_handoff parcel exists per ticket id across every role's new/ and in_process/ mailboxes; a send that would create a second is refused, never queued."
  - "A refused send is inert: nothing is written to the sender's outbox or sent mailbox, no parcel reaches any recipient inbox, and no wake is injected."
  - "Ticket identity is decided by exact ticket-id equality, never by task-name prefix or substring match."

