description: |
  ## What is wrong

  On 2026-09-10 BL-1441 ran the Stryker gate BL-955 deferred on
  2026-08-19 over BL-955's file set and discharged the ledger row on a
  completed run (`backlog/evidence/BL-1441-BL-955-mutation.md`, hardender
  tip 5112a3fa5b). It was the first mutation run ever over
  `out/onboarding/negotiationTelegramRelay.js` (61 mutants, 57 killed, 4
  survived, score 93.44%) and `out/onboarding/negotiationTelegramRouting.js`
  (86 mutants, 75 killed, 11 survived, 87.21%); neither had a no-coverage
  mutant. The discharge names each survivor with the covering-test count
  that failed to catch it, and the specifier's ruling on the hardender's
  rule proposal of the same day is that such a discharge is legitimate
  only when a ticket owns the survivors. This is that ticket for these
  two files.

  The 15, by enclosing declaration (census
  `backlog/evidence/BL-1519-first-run-survivor-census-20260910.md`):
  relay - CONTRACT_AGREED_MESSAGE, ROUND_LIMIT_MESSAGE,
  CLARIFY_INTENT_MESSAGE, COULD_NOT_DERIVE_CHANGE_MESSAGE, one each;
  routing - AMBIGUOUS_INTENT_PATTERN 6, AGREEMENT_PATTERN 4,
  renderBulletList 1. Three and two test files reference the modules.

  ## What changes

  - The run is repeated over the FULL unit suite (BL-955's row used a
    9-file include set); the evidence records the include set used, the
    summary block per file, load and duration, and either zero survived
    and zero no-coverage per file, or one accepted-equivalent record per
    remaining survivor with the code-level reason and the inputs or grep
    that prove it (BL-234).
  - Behaviour tests kill the rest: each message constant through the
    relay call that sends it, asserting the text; each pattern through
    the routing decision, with one input per alternative the mutant
    drops or widens; renderBulletList through its rendered output.
  - The evidence lists, for each of the four message constants, the test
    file and case that asserts its text (scenario 02).
  - Evidence path: `backlog/evidence/BL-1521-negotiationTelegram-mutation.md`
    (one file, one summary block per module).

  ## How (direction, not mandate)

  - `--mutate` scoped to the two compiled files, `perTest`, sibling links
    per the Verification rules; check `mutation_cooldown_gate.bb` first
    (22 days quiet at mint) and record its decision.
  - Documenter: nothing beyond the evidence file; no diagram trigger fires.

constraints: >
  Tests only unless a seam is missing, in which case the smallest
  extraction that exposes the behaviour to an in-process test. Never
  `process.chdir()` under mutation; never a hand-edited manifest. The step
  handler lands with the feature (BL-233).

out_of_scope: |
  - telegramFrontDeskBotCore.ts, the third file of BL-955's set (BL-1519).
  - Any change to the message texts or to what the patterns accept.

qa_e2e_procedure: |
  1. The BL-1521 feature passes (three runs: two outline rows, one scenario).
  2. `backlog/evidence/BL-1521-negotiationTelegram-mutation.md` shows a
     completed Stryker summary over the full unit suite with at least 60
     mutants on the relay and 85 on the routing file, zero no-coverage,
     and either zero survived or one accepted-equivalent record per
     survivor with its proof.
  3. Each of the four message constants appears in the evidence with the
     killing test file and case.
  4. `npm test` from `extension/` is green.

