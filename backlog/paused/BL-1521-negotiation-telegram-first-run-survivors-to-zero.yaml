approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options; the budget question for the
  three large files lives on BL-1519. FIRM: a message constant is killed
  by a test asserting the text the operator actually reads through the
  relay's render path (a `StringLiteral -> ""` mutant on operator-facing
  text is behaviour, not trivia); a regex-alternative mutant is killed by
  an input that one alternative matches and the mutant does not, or is
  recorded as an accepted equivalent with the inputs that prove no
  observable difference (BL-234); no mutant is suppressed and no manifest
  is hand-edited.

invariants:
