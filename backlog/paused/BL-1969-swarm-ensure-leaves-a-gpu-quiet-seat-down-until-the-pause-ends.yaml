description: |
  ## What is wanted

  While the /gpu pause is active, ./swarm ensure leaves every seat whose
  roles.tsv agent is local-model without a session, and its report names
  that seat GPU-paused (not failed, not repaired). Every other seat,
  including the master-resident ones, is ensured as before. Once
  `untilMs` has passed, or /gpu off cleared the marker, the next ensure
  recreates the seat as it does today.

  Babysitter's swarm-starved finding stays as it is: a starved swarm is
  still starved, and its ensure still restarts the rest of the control
  plane. Only the quiet seat stays down.

  ## How (direction, not mandate)

  - One check in -main's per-role loop, ahead of the `router?` branch,
    reading the marker the way babysitter_check.bb's read-gpu-pause does
    and calling gpu-pause-lib/pause-active? and local-model-seat? on the
    row's agent token.
  - gpu_pause_lib.bb's header: babysitter and ./swarm ensure read the
    predicate; reclaims stop during a pause because of BL-1649's
    `:paused-agent-absent`, not the claim-idle ladder.

  ## What each stage checks

  - Coder: the three scenarios; test_swarm_ensure.sh passes.
  - Documenter: the runbook's GPU-quiet section and the gpu_pause_lib
    header name the readers that exist.
