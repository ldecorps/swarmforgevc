human_approval: approved
human_ruling: |
  A - every ./swarm ensure honours the pause, a hand run too, and /gpu off ends the pause early (recommended)
ruling_provenance: specifier-pane
approval_context: >
  FIRM: while the /gpu pause is active, no ./swarm ensure started by
  babysitter recreates a local-model seat's session; every other seat is
  ensured as before; the seat comes back on the first ensure after the
  pause ends. The one choice is whether a ./swarm ensure the operator runs
  by hand during a pause also leaves the seat down. The scenarios are
  written for A; B changes their When to an ensure started by babysitter,
  and the specifier amends them before promotion.
ruling_options:
  - A - every ./swarm ensure honours the pause, a hand run too, and /gpu off ends the pause early (recommended)
  - B - only ensures babysitter starts honour the pause, and a hand ./swarm ensure brings the seat back
ruling_tradeoffs:
  - Pros - one rule in the one place sessions are recreated, so no caller of ensure added later can reopen the hole, and /gpu off already ends a pause early. Cons - an operator who runs ./swarm ensure by hand during a pause, to fix something else, sees the seat stay down until the pause ends or /gpu off. Recommended because the pause is a promise to the operator's other GPU task, and this hole is an unforeseen caller.
  - Pros - a hand ./swarm ensure keeps meaning bring everything back. Cons - babysitter has to pass a flag to ensure, and every other automatic caller (cron freshness, the control-plane repair, a future one) has to remember it, which is the shape of the hole QA found.

invariants:
  - "While pause-active? holds, no ./swarm ensure recreates a session for a seat whose roles.tsv agent is local-model, in the standing and the mono-router branch alike, and every other seat is ensured exactly as before."

qa_e2e_procedure: |
  1. Read from the gather's acceptance row: the BL-1969 feature passes 3 of 3.
  2. `bash swarmforge/scripts/test/test_swarm_ensure.sh` passes as before.
  3. Read the diff of swarmforge/scripts/swarm_ensure.bb: the pause check
     sits ahead of the router/standing branch in -main's per-role loop, so
     both branches see it.
  4. In a scratch fixture (never the live swarm): write
     `.swarmforge/operator/gpu-pause.json` as
     `{"active":true,"untilMs":<now + 30 min>}`, run babysitter's pure
     swarm-starved check as QA did for BL-1950 (a gpu-quiet coder with no
     session, three idle claude seats, 1 active ticket, prev-streak 2): it
     still returns the CRIT and `{:action :ensure-control-plane}`, since
     the swarm IS starved. Then run `./swarm ensure` against that fixture:
     the coder seat's session stays absent and the report names it
     GPU-paused.
  5. Read swarmforge/scripts/gpu_pause_lib.bb's header and the runbook's
     "A timed GPU quiet is not a stall" section: each names the readers
     that exist.

source: |
  QA note 003800 to the specifier, 2026-10-04 18:49Z: "FYI BL-1950 QA
  detail c6251ae959: starved ensure ignores gpu marker; docstring".
  backlog/evidence/BL-1950-QA-20261004.md (c6251ae959), "Observations
  outside this ticket's invariants", verbatim:

  - **Swarm-starved can still restart the seat.** Its `./swarm ensure` repair
    does not read the marker. It fires only when active tickets exist and no
    parcel is held or pending anywhere (`motion-in-process?` treats any held
    claim as motion), so it is a true starved-swarm recovery, not the paused
    seat read as stalled. Its side effect is to recreate the coder session
    inside the pause. Reproduced against the pure lib: a gpu-quiet coder with
    its session missing, three idle claude seats, 1 active ticket and
    prev-streak 2 gives `CRIT swarm-starved` and
    `[{:action :ensure-control-plane}]`.
  - **A docstring names a reader that does not exist.** `gpu_pause_lib.bb` says
    "Babysitter and the claim-idle ladder read this same predicate". The
    claim-idle ladder (handoffd / `chase_sweep_lib.bb`) does not read it. What
    stops reclaims during the pause is BL-1649's `:paused-agent-absent`, which
    resets the claim clock while qwen is dead. The behavior holds; the stated
    mechanism is wrong.

