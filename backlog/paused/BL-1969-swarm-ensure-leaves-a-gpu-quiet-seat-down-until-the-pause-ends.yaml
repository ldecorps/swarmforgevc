id: BL-1969
title: "./swarm ensure leaves a GPU-quiet local-model seat down until the /gpu pause ends - today its per-role loop recreates every missing session, so babysitter's swarm-starved repair (or any other ensure) during a pause starts qwen and puts the model back on the GPU"
