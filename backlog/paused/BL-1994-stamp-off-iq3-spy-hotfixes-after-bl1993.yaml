source: |
  The human, specifier pane, 2026-10-05, verbatim (Article 5.3):

  > We have to fix iq3. Spy on it every 10 minutes. If its gone wrong, hotfix it, and respawn. Repeat until iq3 is functioning normally.

  > I see this updare very often (qa lowercase). Can you hotfix?

  The fault (iq3 pane, about 12:50Z, BL-1993's own forward): `Edit tmp/handoff.txt`
  `- to: qa` / `+ to: QA`, after swarm_handoff refused the first send with
  "Unknown recipient role 'qa'.". The ticket's required_stages spell the
  stage `qa`; the roster spells it `QA`.

description: |
  ## Status: hotfix 44c9f3f535 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it. Later
  hotfixes from the same spy loop fold in below while this is paused.

  ## What was wrong

  The iq3 coder writes its own handoff draft and copies the next stage from
  the ticket's `required_stages`, which spell it `qa`. `swarm_handoff.bb`
  matched recipients against `roles.tsv` case-sensitively, refused `qa` as
  an unknown role, and the seat spent an edit and a re-send on every
  forward to QA.

  ## What the hotfix changed

  - `swarmforge/scripts/swarm_handoff.bb`: `canonical-role` (the roster's
    spelling when exactly one role matches ignoring case, else unchanged)
    and `canonical-to`, applied to the draft's `to:` right after
    `parse-draft` in `-main`, before the BL-1565 guard and `validate`.
  - `swarmforge/scripts/test/test_mailbox_only_delivery.sh`: `to: qa` is
    queued with `to: QA` in the parcel; `to: nobody` is still refused as an
    unknown recipient. The case test fails with the rebinding removed.
  - Reaches a seat when its worktree merges main (each seat runs its own
    worktree's swarm_handoff.sh).

  ## Hotfix 4949a2d37e: the repeat guard names a cycle and an empty grep

  13:06-13:08Z the iq3 coder, on BL-1987, went round four greps for
  `parse-instant-ms` in four files that do not define it, output `(empty)`
  every time: 22 calls, each past the third warned REPEAT, until a
  compaction broke it. The per-call note does not stop a cycle of several
  different calls.

  - `swarmforge/scripts/local_model_repeat_guard.bb`: `cycle-note` (six
    calls in a row, each a repeat of one made since the last reset, get a
    LOOP note naming the cycle and the edit to make) and `empty-grep-hint`
    (a grep whose `tool_response` reads `Output: (empty)` is told the name
    is not in those files). Both warn only, beside the existing notes.
  - `swarmforge/scripts/test/test_bl1971_local_model_repeat_guard.sh`: six
    repeats over four calls name a cycle of 4; five, a run broken by a new
    call, or an edit between name none; an empty grep (plain or piped) gets
    the hint; a grep that finds something, or an empty non-grep, gets none.
  - `swarmforge/roles/local-model/loop.note`: an empty grep means the name
    is not there; use the first copy of a helper, never compare every copy.
  - Live at once: the hook runs the master checkout's guard. The card line
    reaches the seat at its next session.

  ## What the coder checks

  The change against the description and the invariant. Evidence:
  backlog/evidence/BL-1994-coder-<date>.md.

