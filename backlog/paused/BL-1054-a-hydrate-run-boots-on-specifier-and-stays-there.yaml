  same step with a different literal role or a placeholder against a literal.
  No `duplicate` findings.

  Their suggested disposition, adopted: type feature (the intake offered
  "feature (or defect against BL-698's hydrate pin...)"), and the related
  tickets they named - BL-698 (shipped), BL-518 / BL-550 / BL-648 - are the
  boot/home/rotate lineage this builds on.

qa_e2e_procedure: |
  On the live host, against a scratch target:

  1. Launch the hydrate pack. Confirm the single resident pane is the
     SPECIFIER, running the specifier's own model and effort - not coder's.
  2. Confirm coder never started: no coder pane exists on the socket.
  3. Put mail in the coder mailbox and let a chase cycle run. Confirm the
     resident is still on specifier and the refusal is visible in the log,
     not a silent no-op.
  4. Empty the specifier's inbox and let the rotate-home path run. Confirm it
     still does not move.
  5. Stop the swarm, launch an ORDINARY `--pack mono-router` run, and confirm
     it boots home on coder and rotates normally - nothing was left behind.
