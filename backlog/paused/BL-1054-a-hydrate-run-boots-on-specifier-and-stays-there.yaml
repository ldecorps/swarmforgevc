  The operator's words, verbatim:

  - "Lean-drain is **not** an acceptable permanent answer: it stands coder+QA
    up, burns seats hydrate promised not to start, and tonight proved the
    coordinator will promote into those seats."
  - "Putting `window specifier` first would make specifier the standing home
    for *all* mono-router runs — and break the documented common case
    (already-specced work entering at coder). Hydrate must be a **mode** (or
    a dedicated pack that is only used for hydrate), not a permanent swap of
    home."
  - "Mid-hydrate: coordinator → coder `git_handoff` **BL-657** despite HYDRATE
    HOLD notes - lock must be mechanical, not note-discipline."

  Their own non-goals, carried unchanged: "Do not change default mono-router
  home away from coder for ordinary `/start`"; "Do not implement Cursor
  `/pilot` / `/autopilot` here — only the live-swarm specifier lock used by
  `/hydrate` / `/mint`"; "Do not require a standing 7-pane full-forge for
  hydrate."

  IR-DRY: one `near-duplicate` at 0.78 was real and normalized away - the
  model and effort assertions became one Scenario Outline over a `setting`
