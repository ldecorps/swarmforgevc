id: BL-1054
title: "A hydrate run cannot hold the resident on the specifier: mono-router boots home on coder by design, so cold unspecced intake wakes nobody and the first mail for coder pulls the resident off specifier and starts building"
milestone: M8
type: feature
status: todo
epic: swarm-reliability
priority: 30
direction: human-requested
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1054-a-hydrate-run-boots-on-specifier-and-stays-there.feature
human_approval: pending
approval_context: >
  You offered three shapes and asked the specifier to pick one. Picked: A -
  a dedicated hydrate PACK carrying both the boot ordering and the lock, read
  through the same conf parser that already reads `rotation router` and
  `rotation_home`.

  Why not B (a `--hydrate` launch flag plus a lock file under `.swarmforge/`):
  a lock file is durable state that must be cleared on every exit path,
  including the ones that do not run cleanly, and a hydrate lock that outlives
  its run silently refuses every rotation on the NEXT ordinary swarm. A pack
  has no such failure mode - the mode ends when the pack does.

  Why not C as the unit of work: BL-698 already shipped the Telegram verb, so
  C is not a third design, it is who INVOKES this. Once this pack exists,
  `/hydrate` launching it is a small follow-up rather than a redesign.

  This ticket is the LOCK. The auto drain-stop when the specifier hands off to
  coder is BL-1055, which depends on this - without it a hydrate run simply
  queues the work and waits for you to stop it, which is safe, just manual.

  Your line "Lean-drain is not an acceptable permanent answer" is what this
  replaces; say the word if you want a different shape.

required_wiring:
  - "specs/pipeline/steps/index.js::bl1054::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "While the lock is held, the resident is on the locked role at every observable moment: no rotation path - chase, an aged note, a rotate-home decision, a direct rotate request - can move it, and every refusal is logged rather than silently no-oping."
  - "The lock cannot outlive its run. It is read from the running pack's own configuration, never from durable state on disk, so an ordinary swarm launched afterwards rotates normally without anyone having to clear anything."

description: |
  ## What is wrong

  `swarmforge/packs/mono-router.conf` makes coder the first window and home
  resident on purpose, and says so in its own comment: brand-new UNSPECCED
  intake, which would enter at specifier, will not cold-wake that swarm.
  That is correct for the common case and exactly wrong for hydrate, where
  the whole job is draining unspecced intake and NOTHING should be built.

  Three consequences, all observed on 2026-07-28:

  1. The resident boots as coder, not specifier.
  2. Specifier is only a dormant rotation target, so cold intake wakes nobody.
  3. Once mail exists for coder, or chase prefers coder, the resident leaves
     specifier and starts building.

  `config rotation_home` does not help: it names where an EMPTY non-home role
  rotates back TO, not where the resident is pinned, and its default is still
  coder.

  So a hydrate run was launched on `--pack lean-drain` instead, which stands
  coder and QA up - seats hydrate promised not to start - and the coordinator
  duly promoted and routed BL-657 to coder mid-hydrate, despite HYDRATE HOLD
  notes. That is the evidence that the lock must be mechanical: note
  discipline did not hold, and could not.

  ## How (direction, not mandate)

  A hydrate pack whose first window is the specifier (with the specifier's own
  model and effort, not coder's) and which declares the lock as pack
  configuration - the same shape `mono_router_lib.bb` already reads
  `rotation_home` with, a pure function over conf text. Every rotation
  decision consults it and refuses a non-locked target loudly.

  Not in this slice: the drain-stop when the specifier would hand off to coder
  (BL-1055, depends on this); any change to the default mono-router home for
  ordinary `/start`; the Cursor `/pilot` and `/autopilot` surfaces; and any
  requirement for a standing full-forge.

notes: |
  Source intake:
  `.swarmforge/operator/INTAKE-mono-router-hydrate-lock-resident-on-specifier.md`
