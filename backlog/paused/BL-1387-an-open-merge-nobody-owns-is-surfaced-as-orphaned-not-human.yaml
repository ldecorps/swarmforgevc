id: BL-1387
title: "An open merge nobody owns is surfaced as orphaned, not as a human's: the reconcile sweep classifies a foreign MERGE_HEAD by ownership and liveness, says when its index carries none of the incoming side, and escalates at once instead of holding for a human who is not there"
milestone: M8
type: defect
severity: high
# high: a broken safety signal. The sweep's only reading of an open merge is
# "a human is mid-merge, hold", asserted from MERGE_HEAD presence alone. On
# 2026-09-04 that reading held two roles and the daemon for 15 minutes on a
# merge with no owning process and a poisoned index, and told the human
# nothing a human could act on. Not critical: the hold is safe; the
# misdirection is the fault.
