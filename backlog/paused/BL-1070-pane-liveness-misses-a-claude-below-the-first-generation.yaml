id: BL-1070
title: "The babysitter's liveness check only looks one generation under the pane, so every role in this pack reads as a half-launch and the coordinator is nudged with eight false CRITs a tick"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
priority: 96
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1070-pane-liveness-misses-a-claude-below-the-first-generation.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl1070PaneLivenessDepthSteps::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them. Verified absent from index.js at spec time, so the anchor cannot pass before the work is done"

invariants:
  - "A liveness verdict about a role is a claim about the process tree under its pane, not about one generation of it: an agent the pack really launched is never reported absent because of how many shells sit between the pane and it."
  - "The verdict never counts a process outside the pane's own tree - a working agent under a different role's pane can never stand in for a missing one."
  - "No health check is silently disabled by another check's false negative: a check that cannot run because its gate is unmet says so, rather than going quiet."

description: |
  ## What

  `claude-process-line` in `swarmforge/scripts/babysitter_check.bb:170-177`
  keeps a `ps -eo pid=,ppid=,args=` line only when `ppid` equals the pane's
  own pid, then filters for `claude `. That finds a claude launched as a
  DIRECT child of the pane and nothing else.

  Every role in this pack launches through a wrapper, so claude is a
  grandchild, not a child.

  ## Measured, not inferred (2026-08-22, this host)

  All eight live panes have the identical shape - pane process `sh`, its
  child `zsh /home/carillon/swarmforgevc/.swarmforge/launch/<role>.sh`, and
  `claude` one generation below that:

      swarmforge-specifier   pane 1085448 sh -> 1085450 zsh specifier.sh -> 1085508 claude
      swarmforge-coder       pane 1085473 sh -> 1085474 zsh coder.sh      -> 1085536 claude
      swarmforge-coordinator pane 1085668 sh -> 1085669 zsh coordinator.sh -> 1085717 claude
      (and the same for cleaner, architect, hardender, documenter, QA)

  Running the predicate unchanged against a live `ps` snapshot returns
  `has-claude-process? = false` for every one of them.

  The consequence is already in the log. `.swarmforge/babysitterd/babysitterd.log`
  at 2026-08-22T16:24:46Z:

      CRIT [proc-specifier] swarmforge-specifier: pane alive but NO claude process under it (half-launch/exit)
      ... the same line for coder, cleaner, architect, hardender, documenter, QA, coordinator ...
      NUDGED coordinator: 8 finding(s)

  Every one of those roles was working at the time. This repeats every sweep.

  ## Why it is high, and what bounds it

  Bounding it first, so nobody over-reacts: the `(not has-claude-process?)`
  branch of `check-live-session` emits a CRIT with **no** `:repair` key, so
  this does not respawn or kill anything. Nothing is being destroyed.

  What it does do:

  1. **The half-launch check can no longer do its job.** It fires for every
     role on every tick, so a REAL half-launch is now indistinguishable from
     the noise. A detector that alarms unconditionally has the same
     information content as one that is switched off.
  2. **It nudges the coordinator eight times a tick.** That is the one role
     whose pane must never exit (BL-107), spending turns on findings that are
     all false.
  3. **It silently disables the remote-control check.**
     `check-remote-control` (`babysitterd_sweep_lib.bb:124-125`) is gated on
     `has-claude-process?`, so with the gate stuck false the RC-degraded WARN
     can never fire for any role. That is invariant 3, and it is the reason
     this is not merely a noisy-alert ticket.
  4. Sustained false nudge telemetry is an Article 3.5 circuit-breaker input,
     so a health signal that is wrong in the alarming direction can throttle
     intake.

  ## Why it surfaced only now

  Until the babysitter auto-heal hotfix landed, every sweep on this host threw
  on the missing `vm_stat` before reaching `assemble-findings` - the intake
  for that hotfix records "0 `OK all checks green`; 0 `REPAIR`". While the
  sweep was dead, `check-live-session` never ran and this predicate never
  spoke. Reviving the sweep is exactly what made a long-standing defect
  audible. It is not a regression the hotfix introduced, and BL-1071 (that
  hotfix's stamp-off) should not be blamed for it.

  ## How (direction, not mandate)

  Walk the pane's descendants rather than its children - the `ps` snapshot
  already carries every `pid`/`ppid` pair needed to close the tree, so no
  second process-table read is required. Whatever shape is chosen, invariant
  2 is the one to design against first: widening the match to "any claude in
  the table" would make every role read alive forever, which is the same
  detector failure in the opposite direction and strictly harder to notice.
  Note that the existing `(str/includes? % "claude ")` test is a substring
  match on the argument list; keep in mind what else on this host has the
  word claude in its command line before relying on it alone.

  Do not disturb the `process-gather-failed?` path: BL-802 established that a
  failed `ps` reports UNAVAILABLE, never absence, and scenario 03 guards it.

out_of_scope: |
  - The babysitter's meminfo / `vm_stat` memory floor and the control-plane
    auto-heal path - that is BL-1071, a review of an already-landed hotfix.
  - Redesigning the sweep, the nudge budget, or the alert transport.
  - The `pane_current_command` reporting surface elsewhere in the extension.

qa_e2e_procedure: >
  1. **Reproduce the absence of the behaviour at the parent commit.** With
  the pack up and every agent working, run the liveness predicate against a
  live `ps -eo pid=,ppid=,args=` snapshot for each role's pane pid, and
  confirm it answers false for all of them; confirm babysitterd.log carries
  a `proc-<role>` CRIT for every role on the same tick. 2. At the parcel
  commit, repeat and confirm every working role answers alive and no
  `proc-<role>` CRIT is emitted for them. 3. **Confirm it still detects a
  real half-launch**: kill the claude under exactly one pane, leave the pane
  and its wrapper shell alive, and confirm that role - and only that role -
  raises the half-launch CRIT on the next sweep. 4. **Confirm scoping**: with
  one role's claude killed and the others alive, confirm the killed role does
  not read as alive by borrowing a sibling's process. 5. **Confirm the gated
  check woke up**: with an agent running without `--remote-control`, confirm
  the RC-degraded WARN now fires, and that a role whose liveness cannot be
  determined is reported as not-run rather than silently skipped.
  6. **Confirm BL-802 is intact**: force the process gather to fail and
  confirm UNAVAILABLE, not a half-launch CRIT. 7. Record the degraded gate:
  Babashka only, so no mutation/CRAP/DRY - the gate is the runners under
  `swarmforge/scripts/test/` plus these scenarios.

notes: |
  ## Provenance

  Coordinator `note` 30_20260822T162607Z_001008: "defect: babysitter_check
  has-claude-process? misses claude at depth2". The note carried no evidence
  file; the specifier reproduced the claim against the live host before
  minting - process depths for all eight panes, the predicate re-run against
  a real `ps` snapshot, and the matching CRIT block in babysitterd.log are
  all quoted in the description above.

  ## Concurrent-work orthogonality (for the coordinator)

  This ticket and **BL-1071** both touch `babysitter_check.bb` and
  `babysitterd_sweep_lib.bb`. They are causally independent - different
  functions, different causes, and neither blocks the other - but they are
  NOT orthogonal in the Article 3.2 rule-3 sense. Do not promote them
  concurrently; the second to run should merge `main` first.

  ## Degraded gate, recorded up front

  Babashka only: no mutation/CRAP/DRY is wired for that layer
  (engineering.prompt, Startup Tools). The gate is the unit runners under
  `swarmforge/scripts/test/` plus the acceptance scenarios. A hardening pass
  must record that fallback and must never imply mutation ran.

  ## IR-DRY judgment recorded: 4 findings -> 1 resolved, 3 left

  Resolved: scenario 02 originally said "no claude process runs under this
  pane" while scenario 01's Examples said "nowhere under the pane" for the
  same state - real drift, two phrasings of one concept. Both now use the
  single step `the claude process sits "<depth>"`, with "nowhere under the
  pane" as one of its values.

  Left as written: the remaining three pair a placeholder binding of a step
  against a literal binding of the SAME step - `the role is reported
  "<verdict>"` against `"absent"` and `"unavailable"`, and `the claude
  process sits "<depth>"` against `"nowhere under the pane"`. One registry
  pattern matches all of them; the checker compares step text, so it cannot
  see that they are one step with different arguments. Rewording either side
  would create the drift it is warning about.

  ## Related, do not conflate

  - **BL-802** (done) - process-gather failure reports UNAVAILABLE rather
    than absence. Its behaviour is preserved here and guarded by scenario 03.
  - **BL-1017 / BL-1018** (done) - per-role session repair. Unaffected: the
    branch this ticket fixes carries no `:repair`.
  - **BL-107** - the coordinator's pane must never exit; it is one of the
    eight roles being falsely alarmed, which is why the nudge cost is called
    out rather than treated as cosmetic.

