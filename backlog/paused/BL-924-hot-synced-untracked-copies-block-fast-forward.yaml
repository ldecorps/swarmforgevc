id: BL-924
title: "Untracked hot-synced copies block a worktree fast-forward even when byte-identical to main, so a role branch can only be brought current by clearing collisions by hand, one round at a time"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarm-reliability
human_approval: approved
priority: 88
direction: swarm-surfaced
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-924-hot-synced-untracked-copies-block-fast-forward.feature

invariants:
  - "A merge is refused only when completing it would lose content that exists nowhere else. An untracked copy byte-identical to the tracked version being merged in can lose nothing, and never blocks."
  - "No file whose content exists on no branch is ever removed to clear a collision. Making a merge possible must not be a way to destroy the only copy of something."

approval_context: >
  Wants sign-off on two things.

  **Severity `medium`.** Inherited from BL-640, where the human set medium on
  2026-08-01 with the reasoning "stale-worktree delivery gap, not a live
  outage". The same reading applies: a blocked merge is recoverable by hand and
  was recovered by hand, so nothing is down. The case for `high` is that this
  sits on the recovery path — it is the obstacle you meet precisely when a
  worktree is already stale and you are trying to fix it.

  **That this is a sibling at all.** BL-640 explicitly left the fold-or-split
  call to the specifier and it was split out on 2026-08-18; the reasoning is
  recorded in BL-640's `notes:`. If you would rather have had one parcel, this
  ticket is the thing to retire, and BL-640's scenario 05 comes back.

source: |
  Split from BL-640 by the specifier, 2026-08-18, per that ticket's own
  invitation ("The specifier should decide whether that belongs here or in a
  sibling"). Originally BL-640 scenario 05.

  Found 2026-07-25 while hand-repairing a worktree left stale by the defect
  BL-640 covers. Fast-forwarding `swarmforge-QA` to `main` failed twice:

  ```
  error: The following untracked working tree files would be overwritten by merge:
        swarmforge/scripts/expedite.sh
        swarmforge/scripts/expedite_lib.bb
        ... 10 more
  ```

  The colliding files were verified byte-identical to `main`'s tracked versions
  before removal, so the merge could not have lost anything.

description: |
  ## What blocks, and why it should not

  `sync_worktree_scripts()` copies helper scripts into every worktree at launch
  with `cp -R`. The copies land UNTRACKED. git then refuses any merge that
  would overwrite an untracked file — a good default, because an untracked file
  is content git has no other copy of.

  Here that premise is false. The untracked copy came FROM the tracked content
  and is byte-identical to it. Overwriting it loses exactly nothing, yet the
  merge is refused, and the only way forward is deleting the copies by hand.

  This is the same hot-sync mechanism already recorded as the phantom-revert
  root cause in BL-373. That incident was about the copies making uncommitted
  code look present in every worktree; this one is about the same copies
  blocking a legitimate merge. Same source, two distinct failure modes.

  ## The manual recovery is worse than one round

  git names only the collisions it has reached, so clearing them is iterative:
  remove the named paths, retry, meet the next batch. It took two rounds on a
  single branch, with a "... 10 more" elision hiding the true count. An
  operator repairing a stale worktree under time pressure is the exact person
  who should not be running a discovery loop.

  Scenario 02 pins the reporting half separately from the blocking half,
  because a fix that unblocks identical copies but still dribbles out genuine
  collisions one round at a time has only solved the easy case.

  ## Why this obstructs more than it looks

  The path it blocks is the recovery path. A worktree needs to fast-forward
  precisely when it has fallen behind `main` — which is when a role is most
  likely to be reading something stale. BL-640 covers detecting that staleness;
  this ticket is about being able to act on it once detected.

  ## Shape of the fix (direction, not mandate)

  Two families, and the choice is the coder's. Either the sync stops leaving
  untracked copies behind (write them somewhere git does not arbitrate, or
  track them), or the merge path clears its own copies after proving them
  identical to the incoming tracked content. Invariant 2 is the guard rail on
  the second family: proving identity before removing is the whole safety
  argument, and a clear-first-ask-later implementation would satisfy scenario
  01 while violating the invariant. Whichever family is chosen, the identity
  proof is per-file and must not be widened to "looks like a synced script".

qa_e2e_procedure: |
  1. Build a fixture repo with a worktree carrying untracked copies that are
     byte-identical to the tracked versions on `main`, matching the real shape
     `sync_worktree_scripts()` produces. Fast-forward the worktree to `main`
     and confirm it completes with no manual clearing.
  2. Confirm the merged worktree's file contents match `main` exactly
     afterwards — the point is a merge that could not lose anything, so nothing
     may be lost.
  3. Modify one untracked copy so it differs from `main`. Merge again and
     confirm the merge is refused rather than overwriting it, and that the
     modified content is still there afterwards.
  4. Make several untracked copies differ. Confirm one refusal names every
     colliding path, with no elision and no second discovery round.
  5. Add an untracked file whose content is on no branch at all. Merge and
     confirm it is untouched — this is invariant 2 and the one failure that
     would be unrecoverable.
  6. On a real host, launch the swarm so `sync_worktree_scripts()` runs for
     real, then fast-forward a role worktree that is behind `main`. This is the
     case the fixtures approximate, and the one the 2026-07-25 incident hit.

out_of_scope: |
  - The stale-reference-file delivery gap. That is BL-640, the parent this was
    split from; the two are deliberately independent and neither waits on the
    other.
  - BL-373's phantom-revert symptom. Same hot-sync mechanism, different failure
    mode, already recorded. Do not re-diagnose it here.
  - Whether hot-syncing helper scripts into worktrees is the right design at
    all. That is a larger question; this ticket makes the current design stop
    blocking merges, and picking a fix family that happens to retire the sync
    is allowed but not required.
  - Any change to what a merge does with genuinely conflicting TRACKED content.
    Only untracked collisions are in scope.

notes: |
  Split from BL-640 on 2026-08-18 by the specifier, exercising the fold-or-
  sibling choice that ticket explicitly delegated. Full reasoning is recorded
  in BL-640's `notes:` under "Specifier disposition 2026-08-18"; the short form
  is that the two defects share only how they were discovered, and that
  BL-640's scenario 02 accepts refuse-and-report, which dissolves the one
  coupling that would have forced them into a single parcel.

  `depends_on` is deliberately empty in BOTH directions. This slice needs
  nothing from BL-640, and BL-640 needs nothing from this one.

  **No `required_wiring:`.** The fix changes behaviour on a path that already
  runs — either the existing sync or the existing merge helper. There is no new
  call site the value depends on, so any entry would match at HEAD and pass
  vacuously; per BL-874 an entry that cannot fail is worse than none.

  **Fixture discipline.** Per the engineering article, do not `chmod` to
  simulate failure and do not diff shared globals. Build the collision in a
  fixture repo under the worktree's own `tmp/`, never against a live
  `.worktrees/` path — the failure being reproduced is one that requires
  deleting files to recover from, and a fixture that reaches a live worktree
  could delete real work.

  **BL-233 obligation.** All three scenarios are new and need their step
  handlers landed in THIS parcel; the acceptance runner throws on any scenario
  it cannot resolve. The `<copy>`/`<outcome>` columns must validate against
  explicit KNOWN_VALUES, not pass through.
