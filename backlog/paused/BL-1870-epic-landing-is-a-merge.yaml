id: BL-1870
title: "EPIC - Landing is a merge: parcels travel on their own line from origin/main instead of being merged into every role's long-lived branch, so landing an approved parcel is merge origin/main and fast-forward push, done by a lander daemon instead of a 21-minute QA turn"
milestone: M8
status: todo
type: epic
epic: landing-is-a-merge
priority: 0
direction: human-requested
depends_on: []
decomposes_into: [BL-1871, BL-1872, BL-1887, BL-1892, BL-1895]
remaining_slices:
  - "Retire the entanglement machinery once in-flight parcels drain: QA's merge-up send, the post-land re-point, reverse-hop copies, own-path replay, strays, abandoned_commits, the LAND_ESCALATE conditions and most of land_step_lib.bb"
mutation_cost: medium
verification_category: merge-collateral-scope
# 2026-10-02 (specifier, QA note 003679): the category's three rows are
# hand checks of which lines a bounce's merge-revert removed in branches
# that merge each other. BL-1871's take-up never merges, and this epic's
# retirement slice removes the merge-up and reverse-hop merges, so no
# collateral-scope check is left to make by hand once the epic lands.

human_approval: approved
human_ruling: |
  A - parcel lines plus a lander daemon, so landing is merge origin/main and fast-forward push (recommended)
ruling_provenance: tapped
approval_context: >
  The human asked the specifier, through QA, to first assess whether the
  whole landing concept is wrong. Short answer - yes, in one place. Every
  role merges each parcel into its own long-lived branch, so the commit QA
  approves carries other tickets' unapproved work (QA's branch is 16,590
  commits ahead of origin/main today), and the land step spends a median
  21-minute QA hold, about 100 tickets and 8,741 lines of code taking it
  apart again. FIRM - a worktree per role, the stage order, every gate,
  QA's review and the handoff format do not change. The choice below is
  the direction. Slices are minted after the ruling, each routed only
  through the stages it needs. Full assessment -
  backlog/evidence/BL-1870-landing-concept-assessment-20261001.md
ruling_options:
  - A - parcel lines plus a lander daemon, so landing is merge origin/main and fast-forward push (recommended)
  - B - a lander daemon only, which runs today's land step off QA's turn
  - C - keep the current landing and measure the BL-1852 and BL-1853 speedups first
ruling_tradeoffs:
  - Pros - landing takes seconds and needs no judgment, QA is never held, and a whole class of defects goes away with the replay, strays, re-point and bounce reverts. Recommended because the cost comes from how parcels travel, and only this option changes that. Cons - five slices including a constitution change, the cleaner and hardener switch between parcels one at a time, and in-flight parcels drain through the old step during the move.
  - Pros - QA is freed at once, in about one slice. Cons - each land still takes minutes and runs one at a time, the entanglement machinery and its hand-built conditions stay, and its escalations reach a daemon that cannot judge them.
  - Pros - no new work, and two speedups landed today that nobody has measured yet. Cons - the cost the human named stays, and so does the defect stream that has produced about 100 tickets.

source: |
  The human, relayed by QA as rule_proposal 003669 (2026-10-01), verbatim
  (Article 5.3):

  > Ok with the idea of landing deamon. Let specifier cook up something. Tell it to first assess if we got the while concept wrong? In my mind it should not be much more than a git merge.

  The human's earlier message, as QA's rationale, verbatim:

  > Could we introduce a new role "lander" dedicated to this task? It is takibg far too long and the stops the whole swarm while it runs. Or change the landing logic all together?

