id: BL-1106
title: "A human's control pause is invisible from any worktree - the effective-depth read normalizes the config to the master checkout but not the pause marker, so master resolves 0 while a worktree resolves the full cap and promotes straight through the hold"
type: defect
severity: high
# high: a live fault degrading behaviour AND a broken safety signal. The pause
# marker is the human's explicit "take no new work" control, and it fails OPEN -
# the promotion path does not error, it promotes. Two stray promotes today with
# a pause active since 05:27Z. It also violates a declared invariant of a
# SHIPPED ticket (BL-966 invariant 1, "two checkouts of the same repo can never
# disagree silently"), which is a regression, not a gap. Not `critical`: the
# swarm keeps running and nothing is lost - work is started that a human asked
# to hold, which is recoverable by parking it.
status: todo
epic: swarm-reliability
priority: 9
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1106-a-pause-is-visible-from-every-checkout.feature
human_approval: pending
approval_context: >
  Firm, and measured rather than reasoned: with the pause marker that is active
  right now, `effective_backlog_depth_cli.bb` prints 0 for the master checkout
  and 6 for `.worktrees/coder`. Both promotion entry points
  (`promote_and_route_next.sh`, `route_backlog_to_coder.sh`) derive their root
  from `git rev-parse --show-toplevel`, which in a linked worktree is the
  worktree. So a promote invoked from a worktree walks past the hold.

  Your call is the BLAST RADIUS. I scoped this to the promotion path only - the
  one that produced the reported symptom - and the fix is one normalization at
  the pause read, where BL-966 already put one for the config read. The other
  two pause readers (`babysitter_check.bb`, `handoffd.bb`) take project-root as
  a required argument with no `rev-parse` fallback, so they get master from the
  launcher and are not exposed; I verified that rather than assumed it. If you
  would rather sweep every reader in one ticket, say so and I will widen it -
  but I recommend not, because the two daemons cannot currently reach the bad
  path and a wider slice buys nothing today.

invariants:
  - "Every input to the effective-depth decision resolves at the repository's master checkout - configured cap, throttle recommendation and pause alike. No single input may resolve at the caller's own root, which is how this one was missed."
  - "A non-git scratch root and a never-launched repository keep today's stdout and exit code (BL-966 invariant 3, unchanged) - the fix must not make a fixture's lack of a git repository into a failure."

description: |
  ## What is wrong

  `backlog_depth_lib.bb`'s `read-effective-max-depth` folds three inputs:
  the configured cap, the throttle recommendation, and whether a pause is
  active. BL-966 fixed the identity/config input to resolve at the repository's
  MASTER checkout, via `resolve-identity-root` and `git rev-parse
  --git-common-dir`, precisely because worktrees do not carry the `.swarmforge/`
  state the answer depends on.

  `pause-marker-path` was left building its path from the raw `project-root`.
  `.swarmforge/operator/control-pause.json` is gitignored local runtime state,
  so it exists only in the master checkout and never travels to a worktree - and
  `read-pause-state` reads a missing file as `{:active false}`, its deliberate
  degrade-never-crash posture. The result is not an error anywhere: a worktree
  caller simply sees no pause.

  Measured on the live tree with the pause active:

      bb .../effective_backlog_depth_cli.bb /home/carillon/swarmforgevc              -> 0
      bb .../effective_backlog_depth_cli.bb /home/carillon/swarmforgevc/.worktrees/coder -> 6

  BL-966's own worktree scenario cannot catch it. Its fixture writes a
  swarm-identity and a pack conf but never a pause marker, so the pause
  dimension is identical on both sides and the "same cap from every checkout"
  assertion passes vacuously.

  ## How (direction, not mandate)

  Resolve the pause marker at the same master checkout the config already
  resolves at. `resolve-identity-root` exists, is memoized, and already handles
  the non-git and git-failure cases by returning the given root unchanged -
  reuse it rather than adding a second normalizer.

  The Scenario Outline's `marker` column is natural-language: its step handler
  must validate the cell against an explicit set of known values and fail on
  anything else, never pass the text through to a truthiness check.

  ## Out of scope

  The other two pause readers. `babysitter_check.bb` and `handoffd.bb` both take
  `<project-root>` as a required argument with no `rev-parse` fallback, so they
  receive the master checkout from their launcher and cannot currently reach the
  bad path - surveyed, not assumed. Also out of scope: changing what an
  absent or unparseable marker means (it stays "not paused"), and BL-779's
  separate complaint that a paused swarm's flow-watchdog alarm reads as a starve.

qa_e2e_procedure: >
  1. With the swarm idle, write an active pause marker with no timer to
     `.swarmforge/operator/control-pause.json` in the master checkout.
  2. Run `bb swarmforge/scripts/effective_backlog_depth_cli.bb <master-root>` and
     then the same command against `.worktrees/coder`. Both must print the same
     paused value. Before the fix these differ (0 vs the configured cap) - run
     this step FIRST, on the pre-fix build, and keep the output as the evidence
     that the test is not vacuous.
  3. With the pause still active and at least one promotable ticket in
     `backlog/paused/`, run the promotion path from a worktree root. Confirm
     nothing moves into `backlog/active/`, and that the ticket is still in
     `backlog/paused/` afterwards.
  4. Resume (clear the marker) and confirm both checkouts report the configured
     cap again and a promotion from either root behaves normally.
  5. Confirm the non-git case still works: run the depth CLI against a plain
     temp directory and check stdout and exit code are what they were before.

notes: |
  Reported by the coordinator as a `note` on 2026-08-23: "control-pause.json is
  gitignored/local-only; caused 2 stray promotes today". The report was accurate
  as sent; the mechanism below is this ticket's own survey, and the 0-vs-6
  measurement was taken on the live tree while the pause was active.

  Relationship to BL-966 (done, M8), stated plainly because it matters for
  review: this is the unfixed half of that ticket, not a new discovery. BL-966
  named the exact failure mode - "worktrees carry no .swarmforge/, so resolving
  identity at the caller's own root split the cap per checkout ... silently" -
  and fixed it for one of three inputs. Its invariant 1 is what is violated
  today. BL-966's scenarios are NOT retired by this ticket and stay as written:
  they are true, just narrower than their invariant. In particular its scenario
  04 remains the guard for the non-git root, so this ticket does not restate it.

  The fixture point is the transferable lesson and belongs in review: an
  equality assertion across two configurations is vacuous unless the fixture
  actually differs in the dimension under test. BL-966's worktree scenario
  compares two checkouts that agree on the pause because neither has a marker.
  The scenarios here write a real marker on the master side.

  IR-DRY disposition (checker run 2026-08-23): the first pass reported five
  findings, one score-1.0 - "it prints cap 0" against "it prints cap 7", the
  signal that three near-identical scenarios differed only in literals. Folded
  them into a single three-column Scenario Outline (marker, checkout, cap); all
  three columns are germane and none is constant across rows. One finding
  remains and is KEPT: "a promotable ticket in the paused pool" (setup) against
  "the ticket is still in the paused pool" (assertion) - the same pool, but a
  Given and a Then, and collapsing them would delete the assertion. 10 unique
  steps of 10 occurrences.

  No `required_wiring:` on purpose. The fix lands inside `read-effective-max-depth`,
  whose call site - `effective_backlog_depth_cli.bb`, the one value the
  coordinator's own prompt reads before every promotion - already exists and is
  already what the reported symptom flows through. Scenario 02 drives the
  promotion path end to end, which proves the wiring better than a substring
  anchor; and an anchor on `resolve-identity-root`, already present in the file
  for the config read, would pass before any work was done (BL-874's vacuous
  anchor).
