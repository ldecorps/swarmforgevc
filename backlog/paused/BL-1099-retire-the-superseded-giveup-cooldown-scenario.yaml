human_approval: pending
approval_context: >
  One judgement call: retire BL-303's scenario 02, or keep it as a
  cross-checking regression guard.

  The case for retiring is below - it adds no case BL-1088 does not already
  assert, and it currently reads as a guarantee it does not provide. The case
  for keeping is real too: it is green, it costs almost nothing to run, and a
  second scenario reaching the same function from a different fixture has
  caught things before.

  What tips it for the specifier is that this scenario is not merely
  redundant, it is misleading in a way that already cost something: the
  hardener's own BL-1088 pass records "BL-303 feature 3/3 (regression guard)"
  for a scenario that structurally cannot reach the branch BL-1088 fixed. A
  guard that cannot fail on the thing it appears to guard is worse than no
  guard, because it is counted.

  Reply "keep it" to close this as no-change instead. Nothing else here needs
  a decision.

source: |
  hardener `note` 000563 to the specifier, 2026-08-23T03:34:00Z: "BL-303 scn2
  blind to dead-pid case (see BL-1088 evidence); mint widen ticket", raised
  from `backlog/evidence/BL-1088-hardener-pass-20260823.md` ("Outstanding, not
  this ticket's scope"). The specifier verified the claim against the handler
  source and the registry before speccing, and is deliberately NOT minting the
  widen that was asked for - see description.

description: |
  ## What was asked, and why this is not that

  The hardener asked for a ticket widening BL-303's scenario 02 to cover the
  dead-pid case. Checked against the source: that widening is already
  delivered. BL-1088's own feature file, in flight now, carries

      Scenario Outline: a given-up child is not respawned before its cooldown elapses
        Given the give-up cooldown has not yet elapsed
        And the given-up child's recorded process is <process state>
        Examples: | dead | still alive |

  and its handler threads the row value into the runner
  (`ctx.pidAlive = state === 'still alive'`, passed to `driveTicks`), so the
  two rows genuinely diverge - not a shared-cell outline that passes without
  discriminating. Adding the same matrix to BL-303 would put two executable
  contracts over one function, which BL-1088's own third invariant exists to
  prevent.

  So the work is the mirror image of the request: retire the superseded
  scenario rather than widen it. The successor's scenarios are the coverage.

  ## Why the scenario was blind, precisely

  Not because its Examples table lacked a column - because its fixture picks a
  value on a dimension the feature file never mentions:

      // specs/pipeline/steps/frontDeskSupervisorRecoverySteps.js
      registry.define(/^a child the supervisor has given up on$/, (ctx) => {
        ctx.entry = { pid: null, attempts: 5, status: 'gave-up', ... };
        ctx.pidAlive = false;
      });

  The production branch BL-1088 fixed is guarded by `(and (:pid entry) (not
  (pid-alive? (:pid entry))))`. With `pid: null` the conjunction short-circuits
  and the branch is unreachable, so the row "has not elapsed yet -> leaves the
  child down" passed for a reason that had nothing to do with the behaviour it
  appears to assert. Nothing in the feature file says `pid: null`; no reader
  would guess it. This is the failure mode where a green scenario proves
  something narrower than it reads, and no gate catches it - the runner only
  throws on a MISSING handler, never on one whose fixture dodges the case.

  ## What to retire, and what to keep

  Retire scenario 02 (`supervisor-recovery-02`) and its Examples table, plus
  the step registrations left with no scenario behind them.

  Keep scenario 01 (`supervisor-recovery-01`, the healthy-uptime attempt-count
  reset). BL-1088 asserts nothing about it, and its fixture (`pid: 4242`,
  `pidAlive: true`, now past `healthyResetMs`) does reach what it claims to.

  ## One latent collision this also clears

  BL-303 registers `/^the give-up cooldown (has elapsed|has not elapsed yet)$/`
  UNSCOPED (`registry.define`), and BL-1088's feature contains the step text
  "the give-up cooldown has elapsed". Today BL-1088 is safe: `stepRegistry.js`
  resolves scoped registrations first for their own feature, and BL-1088's
  handler is `defineScoped`. But if BL-1088's scoped registration were ever
  renamed or dropped, BL-303's unscoped one would silently win and BL-1088's
  scenario 02 would run against a `pid: null` fixture with BL-303's hardcoded
  config. Retiring the unscoped registration removes that trap. This is a
  consequence of the retirement, not extra scope - do not go hunting for other
  unscoped collisions in this parcel.

  ## Why this is a separate ticket rather than folded into BL-1088

  BL-1088 is in flight at the documenter, one hop from QA. Amending an
  in-flight ticket's feature file reaches only the role the amendment note
  finds, and the parcel already in someone's hands keeps building against its
  own copy (BL-971). Retiring a sibling scenario is also not BL-1088's
  deliverable and would widen a parcel that is already gated and green. The
  `depends_on: [BL-1088]` here is what sequences it correctly: the promotion
  gate refuses this ticket until BL-1088 is in `backlog/done/`, so the
  coverage always lands before the retirement.

qa_e2e: >
  1. Confirm BL-1088 is in `backlog/done/` before starting - the retirement
  must never precede the coverage.

  2. `swarmforge/scripts/run_acceptance.sh` on
  `specs/features/BL-303-supervisor-giveup-recovery.feature`: assert it runs
  and passes with exactly one scenario, and that the scenario is the
  healthy-uptime attempt-count reset.

  3. `run_acceptance.sh` on BL-1088's feature: assert 5/5, unchanged, and no
  scenario reported as missing a handler.

  4. Coverage proof: for each of the four (cooldown elapsed?, recorded process
  state) pairs, grep the repository's `.feature` files and name the scenario
  that asserts the supervisor's decision for it. All four must be named; a
  pair with no scenario fails this step.

  5. Dead-registration proof: for each step pattern still registered in
  `frontDeskSupervisorRecoverySteps.js`, grep every `.feature` file for its
  text and assert at least one hit.

  6. Run the whole acceptance suite once, not just these two features, to
  confirm no other feature depended on the retired unscoped registrations.

notes: |
  Verified before minting, so nobody re-derives it:

  - `specs/pipeline/stepRegistry.js` resolves scoped registrations for their
    own feature first and only then falls back to unscoped ones, so BL-1088
    is NOT currently mis-resolving. The collision described above is latent,
    not live - do not spec or report it as a live fault.
  - BL-1088's Scenario Outline rows are not a shared-cell survivor: the row
    value reaches the runner through `ctx.pidAlive`. Checked in
    `.worktrees/hardender/specs/pipeline/steps/bl1088GiveUpCooldownSteps.js`
    at the hardener's tip.
  - `the give-up cooldown has not elapsed yet` currently matches no feature
    file text other than BL-303's own scenario 02, so that half of the
    unscoped registration has no other consumer.
