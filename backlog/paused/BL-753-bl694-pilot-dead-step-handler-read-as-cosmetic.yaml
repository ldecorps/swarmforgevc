description: |
  ## What

  Coder/cleaner/architect all noted BL-694's unexercised step registration
  as a "minor dead-code nit", correctly identifying the symptom but not
  asking what BEHAVIOR that dead step handler was meant to prove was
  therefore untested.

  ## Question to answer

  When a review finds a registered-but-never-matched step handler, should
  the check always ask "what specific claim was this step meant to
  verify, and is that claim tested any other way?" before downgrading it
  to cosmetic? Harden `/pilot` so an unreachable acceptance step is
  treated as a potential untested-behavior flag by default, not dismissed
  as dead code, until that question is explicitly answered.
