source: |
  Raw intake `backlog/INTAKE-telegram-intake-builder-20260925.md`: the
  human, via Claude Code acting as specifier for the clarification round,
  2026-09-25; drained by the specifier the same day into epic BL-1731 and
  slices BL-1732..BL-1737. This ticket is S1: the Intake topic, its form and Submit.

  The human's sentences, verbatim (Article 5.3; every slice carries all of
  them):

  > New intake - ask me for clarifications before putting it in, as if you were the swarm specifier.
  >
  > I want a new specialised topic in telegram for helping me inputing new intakes.
  > I am to start by defining a overall goal in thus form
  >
  > As a user
  > I want to do this action
  > So i can acheive this goal
  >
  > I want "a user", "do this action" and "acheive this goal" to be drop down lists populated with what the previous the previous intakes have. This to enforce ubiiquitous language.
  > I can add a new value to the dropdown in case uts empty or does not contain what I want.
  >
  > Then I want to add one or more gherkins scenarios.
  > Given some state
  > When something happens
  > Then some other state
  >
  > Add a "verify" button to have the intake given to the specifier so that it can run is usual skills on it (dry, invest, etc), so he maybcome back with improvements for the pending intake. I can accept or not his changes.
  >
  > Add a submit button so the intake is put in the usual queue.

  > Can I also get a "ask specifier" button ? If I want interactive helpnfrom him while working on this? A push to talk and a tts talking back to me would be great, a bit like we have with bubble, but the agent would be the specifier.

  > 1: I want to be able to delete what I dont want from dropdown lists.
  > 2: qjulp at the back of the local llm slices

  **Amendment 2026-09-25 (pre-implementation, no coder has claimed this
  parcel yet).** The human, on the operator's own suggestion that "propose
  an invariant from these scenarios" belongs to Verify (BL-1735) rather than
  a mandatory field on a form that didn't exist yet, and on the operator's
  offered alternative:

  > Yes please add an optional section "any rule that should always hold?"

  Folded into this slice rather than BL-1735, because it is a form field:
  captured whether or not the draft is ever verified.

description: |
  ## What is wanted

  - **The topic.** A new standing forum topic "Intake". It is created,
    reused and rebound like the other standing topics (the `ensure*Topic`
    family in `extension/src/tools/telegram-front-desk-bot.ts`, decisions in
    `telegramTopicDecisions.ts`, ids in
    `.swarmforge/operator/telegram-standing-topic-ids.json`) and answers
    only the principal (`isFromPrincipal`). It is distinct from the
    support/intake 🎟 SUP threads (BL-418), which are unchanged.
  - **The way in.** Forum topics cannot carry `web_app` buttons
    (`residentSpyTunnelNotify.ts:80-96`), so follow the console's
    precedent: a `url` button in the topic, plus the `web_app` button in
    the principal's private chat (`notify-resident-spy-tunnel.ts`). Any
    principal message in the topic is answered with the way in. When the
    tunnel is down, the answer says the form is unreachable and why
    (scenario 05), never a dead button.
  - **The form**, served at `/intake-form` beside `/epic-reorder` and
    `/catch-up` in `bridgeServer.ts`, and authenticated like them:
    `?bearer=` to read, plus the control token for writes. It has:
    - three narrative dropdowns (actor, action, goal) over the shared
      vocabulary, each with "add new…". An added value is usable in this
      draft at once and joins the shared list only on Submit (answer 8);
    - one or more scenarios in free text (Given/When/Then, plus And/But);
    - an optional "any rule that should always hold?" field, free text, one
      or more lines (2026-09-25 amendment). It travels with the intake the
      same way notes does; nothing derives from it or checks it in this
      slice. Verify (BL-1735) proposing an invariant from the scenarios is
      separate and unaffected: that arrives as a suggestion, this is what
      the human chose to write down themselves;
    - an optional notes field (answer 7).
    One draft at a time in this slice; BL-1733 keeps several. The page
    never uses browser storage (Architecture rule 3; the header of
    `webUiFontSizePreference.ts`).
  - **Submit** writes `backlog/INTAKE-<slug>-<yyyymmdd>.md` at the backlog
    root. It holds "As <actor> / I want to <action> / So I can <goal>",
    the scenarios, the rule field (when not blank) and the notes. The
    file and the vocabulary update are
    committed together through `commit_integrity_cli.bb` (the front desk's
    own commit path, BL-1368; BL-415's `operator_file_question.bb` is the
    closest prior art). The topic then confirms with the file's GitHub
    permalink (`github-permalink` in `operator_lib.bb`, BL-415). Nothing
    pushes in that path today; the permalink resolves once `main` reaches
    origin.
  - **The vocabulary** is durable and tracked, seeded with the starter
    list below. It is stored outside the backlog root's top level, whose
    files are the raw intake queue; `backlog/vocabulary/intake-narrative.yaml`,
    for example. Values are stored without the template words. The
    parenthetical glossary is hint text, not part of the value.

  **Starter vocabulary.** Seed all of it (answer 13); the human deletes
  what they don't want in BL-1733.
  - Actors: the human (the one authorised Telegram principal) · a phone
    user · a SwarmForge VC user (someone running the swarm on their own
    repo) · the operator (a Claude Code session supervising the swarm) ·
    the specifier · the coder · the cleaner · the architect · the
    hardender (the repo's spelling) · the documenter · QA · the
    coordinator · the art director.
  - Actions: file a new intake from my phone · see that an agent has
    accepted my question · chat with a local model about the project ·
    run a swarm seat on a local model · approve or reject a pending
    decision.
  - Goals: know the swarm is working on it · keep the backlog in one
    ubiquitous language · work on the project away from my desk · cut
    cloud token costs · trust that nothing lands without review.

  ## Why the dropdowns are seeded, not mined (intake evidence, 2026-09-25)

  - Of 1,382 feature files, 9 contain an "As a" line and only 2 are real
    narratives. 4 of 95 archived intakes contain one.
  - Steps stay free text: there are 19,309 distinct step phrases, and the
    most reused appears 9 times.

  ## Scope

  - `extension/src/tools/telegram-front-desk-bot.ts` and
    `telegramTopicDecisions.ts` (the topic and its answer).
  - A new `extension/src/bridge/intakeFormUiHtml.ts` plus a routes module,
    wired in `bridgeServer.ts`.
  - The vocabulary store and its seed file; the intake writer.
  - `specs/features/BL-1732-...feature` + the pinned handler.
constraints: >
  The form page keeps no browser storage (Architecture rule 3). Acceptance
  drives the bridge routes, the stores and the topic decision in-process;
  the Telegram client and the phone are the unsuitable boundary
  (engineering Design And Testability). No new STT/TTS, no Verify here.
  The support/intake SUP threads are untouched (BL-418).

out_of_scope: |
  - Kept drafts and deleting values: BL-1733.
  - Verify: BL-1734, BL-1735, BL-1736. Ask specifier: BL-1737.
  - From the intake, for v1: the Bubble Android app and Telegram voice notes
    as Ask surfaces; hold-to-talk; Scenario Outline/Examples tables;
    renaming or merging vocabulary values; a vocabulary for steps.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1732-the-intake-topic-opens-a-form-that-files-an-intake.feature`:
     all ok (10 of 10).
  2. Live, bridge and tunnel up: send any message in the Intake topic. The
     topic answers with the way into the form. Open the form at phone
     width: the three dropdowns offer the starter values.
  3. Submit a draft with a narrative, one scenario, one new goal, and the
     rule field holding "an archived QA e2e intake is never promoted".
     Put "QA e2e test - retire on drain" in the notes field; the specifier
     archives that intake without minting.
     An INTAKE file appears at the backlog root in one commit with the
     vocabulary update, holding the rule field's text. The topic posts its
     permalink. A fresh draft offers the new goal.
  3a. Submit a second draft with a narrative and one scenario, the rule
      field left blank: the INTAKE file is written all the same, with no
      rule section in it.
  4. `curl` the submit route without the control token: refused, and no
     file is written.
  5. With the tunnel stopped, ask the topic for the form: it says the form
     is unreachable and why.
  6. Art Director sign-off note on the form's look (Article 1.10).
  7. `git diff main...HEAD --name-only` names only the Scope files, the
     feature, the handler, docs and evidence.

