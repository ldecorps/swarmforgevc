approval_context: >
  The operator's intake marked this "optional follow-on ... if prompts alone are
  insufficient", so the first decision is whether to build it at all now that
  Article 4.4 binds via the role prompts. Two shape decisions if yes. (1) The
  inventory is OPTIONAL and degrades: a malformed `--items` still records the
