id: BL-1073
title: "inbox/completed and sent grow without bound (12183 handoffs today, 11793 of them past 14 days) and set the cost floor under every mailbox walk: a bounded retention tick drips settled mail into an in-repo archive"
milestone: M8
type: feature
status: todo
epic: swarm-reliability
human_approval: pending
priority: 30
direction: human-requested
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1073-rolling-mailbox-retention.feature

approval_context: >
  Already locked by the human and NOT open for renegotiation: mail leaving the
  window is ARCHIVED IN-REPO and stays readable under the same handoffs root,
  nothing is deleted, and evidence consumers can still read older trails (tap
  answer, 2026-08-22). Also firm from the intake: no big-bang empty, live mail
  in new/ and in_process/ is sacred, and retention is not smuggled into a
  sweep-speed ticket.

  What this ticket ASSUMES as a default and would like confirmed at approval,
  because the human said defaults are welcome but never named these three:
  (1) the rolling window is 14 days (the humans own stated lean), conf-tunable;
  (2) the pace ceiling is 200 handoffs per tick, conf-tunable - at that pace
  todays 11793-file backlog drains over roughly 60 ticks rather than one pass;
  (3) a handoff naming a ticket in backlog/active/ is never archived at any
  age, which is what keeps every consumer verdict about live work identical
  and is proposed as a permanent rule, not a boundary a later slice relaxes.

required_wiring:
  - "swarmforge/scripts/handoffd.bb::retention::the tick must actually be CALLED from the daemon poll loop. A retention lib that is built, unit-tested and green but reachable from no daemon caller is the BL-419 shape - the mailboxes keep growing and the ticket reads as shipped. Zero occurrences of this literal exist in handoffd.bb today, so the pattern cannot match before the wiring is done"
  - "specs/pipeline/steps/index.js::bl1073::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this feature file rather than silently skipping them"

invariants:
  - "Retention never destroys. Every handoff present before a tick is present after it, byte-identical and readable at a path under the same handoffs root - including across an interrupted tick, which may leave a handoff in its old place or its new one but never in neither and never in both."
  - "A tick never changes what any mailbox consumer concludes about live work. Live mail (inbox/new/, inbox/in_process/) and any handoff naming a ticket in backlog/active/ are never archived at any age, so the dropped-parcel, dispatch-gap and unassigned-active verdicts for every active ticket are identical before and after a tick."
  - "Every tick is bounded by the configured pace ceiling. No tick moves more than the ceiling, so a first pass over a large backlog drains across many cycles and no single tick can hold the daemon poll thread on a large tree."

description: >
  What. Add a bounded retention tick to handoffd that moves settled mail older
  than a rolling window out of the hot mailbox listing into an archive under
  the same handoffs root. Settled means inbox/completed/ and sent/ only.

  Why. Those two trees only ever grow, and every mailbox walk in the swarm
  lists them flat: the dropped-parcel sweep, the dispatch-gap scan and the
  unassigned-active nudge all build their dirs from
  handoffd.bb dispatch-gap-scan-dirs, which is new/in_process/completed/sent/
  outbox for each of the eight roles. Measured on this host 2026-08-22 across
  every role mailbox (master-resident roles under .swarmforge/handoffs/<role>,
  the six worktree roles under their own .worktrees/<role>/.swarmforge/
  handoffs): 12183 handoffs in completed/ and sent/, of which 11793 are older
  than fourteen days - 97 percent of the tree is history nothing reads. BL-978
  removed the per-item multiplier over that tree; it explicitly did not touch
  the tree itself, and recorded retention as a follow-on needing a human call
  because moving or deleting mailbox history is a product decision, not an
  incidental fix. This ticket is that decision, now taken.

  How (direction, not mandate). A pure decision function - given a handoff
  file, its own recorded time, now, the window, and whether it names an active
  ticket, is it archivable - plus a bounded mover that applies at most the
  pace ceiling per tick, wired as one more sweep on the existing handoffd poll
  loop next to the other sweeps. Reuse the resolvers the rest of the swarm
  already goes through rather than re-deriving paths: handoff_lib mailbox-dir
  for every roles.tsv role and state (BL-128 calls it the ONE shared resolver
  every mailbox-path caller must go through), and chase_sweep_lib
  handoff-event-ms for the recorded time - its own docstring already says
  "never file mtime (a worktree hot-sync or archive move rewrites it)", which
  is exactly the trap this ticket would otherwise walk into. Archive layout is
  the implementers call so long as scenario 04 holds: readable under the
  handoffs root, and never returned by a flat listing of a hot mailbox dir
  (a sibling archive/ under each mailbox base satisfies both, since every
  consumer lists the state dirs explicitly rather than walking recursively).

  Fail closed on unknown age: a handoff whose recorded time cannot be parsed
  is RETAINED, never archived. Absence of evidence must not buy an eviction -
  the same discipline BL-978 pinned for the freshness read.

constraints: >
  Firm lines carried from the intake and the humans tap, all of them binding:

  - No big-bang empty of inboxes as the primary design, and no plain global
    size cap - the human rejected both in favour of a drip.
  - Nothing is deleted. Archive in-repo, still readable, under the handoffs
    root; older trails stay available to whoever needs them.
  - Live parcels in new/ and in_process/ are sacred until settled.
  - No fix that only raises supervisor freshness thresholds.
  - Retention is a deliberate product decision and stays in its own ticket -
    do NOT fold this into BL-1066 (a separate live CPU defect on the metrics
    poll tick) and do NOT fold it into the Boy Scout epic BL-1013, which
    classifies repo debt and does not bound mailbox retention.

  Scope boundaries for this slice:

  - inbox/completed/ and sent/ only. outbox/, failed/ and abandoned/ are out
    of scope here - outbox is transient, and the other two are small and are
    read as fault evidence.
  - No consumer is changed to READ the archive in this slice. The guarantee is
    invariant 2 (no live-work verdict moves) plus a discoverable readable path
    for humans and audits. If a consumer is later found to need archived
    trails for a settled ticket, that is a named follow-on, not a silent
    widening of this one.
  - The legacy shared dirs .swarmforge/handoffs/sent and
    .swarmforge/handoffs/inbox/completed (pre-BL-128 flat layout) are both
    EMPTY on this host and are out of scope; go through mailbox-dir and they
    never come up.
  - Do not change dispatch-gap-scan-dirs, the sweep decisions, or
    handoffd_supervisor thresholds. This adds a tick; it redefines nothing.

qa_e2e_procedure: >
  1. Scenarios 01, 02 and 05: fixture mailbox trees under a temp root with a
     pinned clock (Background fixes 2026-08-22T12:00:00Z), one handoff per
     Examples row. Assert the disposition of each named file individually -
     archived means gone from the hot dir AND present under the archive;
     retained means still in the hot dir AND absent from the archive. Assert
     both halves; a check that only looks at one side passes for a mover that
     copies without removing, or removes without writing.
  2. Scenario 03: 500 fixture files past the window, ceiling 200. Run two
     ticks, asserting the cumulative archived count after each (200, then
     400). Assert also that the ceiling is the ceiling, not an exact quota -
     a tick with 40 eligible files archives 40, per scenario 04.
  3. Scenario 04: count before and after across BOTH trees and diff the bytes
     of every archived file against its pre-tick content. Then list each hot
     mailbox dir the way the daemon does (flat, via mailbox-dir) and assert no
     archived file is returned.
  4. Scenario 06 - the invariant-2 gate, and the one QA must not wave through
     on unit tests alone. Build a tree with an ACTIVE ticket whose trail spans
     both sides of the window, capture the dropped-parcel sweep verdict and
     the trail evidence for that ticket BEFORE the tick, run the tick, and
     assert both are byte-identical after. Repeat for the dispatch-gap and
     unassigned-active sweeps on the same tree - all three read the same dirs,
     so all three must be pinned.
  5. Scenario 07: run the mover with an injected failure partway through (a
     seam, never a kill of the test process), then list both trees and assert
     each of the 40 files appears exactly once. Then run a full tick and
     assert all 40 are archived, still exactly once each.
  6. Live confirmation after landing, on this host: record the completed/ and
     sent/ file counts per role before enabling the tick, let the daemon run,
     and record them again after a morning. The count must fall
     monotonically by no more than the ceiling per tick, and
     `sweep-boundary` lines for the retention sweep must stay far below
     SUPERVISOR_STALL_MS (30000 ms) - a janitor that blocks the poll thread
     has recreated BL-977 with a different cause.
  7. Live safety check: with the tick running, confirm every ticket in
     backlog/active/ still has its full trail in the hot dirs (nothing of an
     active ticket has moved), and that no dropped-parcel nudge fires for a
     ticket that was not a candidate before.

notes: >
  Source: backlog root intake
  backlog/INTAKE-gradual-inbox-retention-rolling-archive.md (human via Lets
  Talk / Cursor, 2026-08-22 ~16:14 CEST), removed from the root in the same
  pass that minted this ticket. One intake, one ticket - no consolidation.

  Human words preserved verbatim from that intake: the human asked for
  "torture au fil de l'eau" rather than a hard general size cap, and the pace
  requirement is that a first run over todays thousands of files drains over
  many cycles "au fil de l'eau" instead of one giant archive pass. Scenario 03
  and invariant 3 are that sentence made checkable.

  The one clarifying question raised on this intake (BL-607 role_ask, specifier
  topic: archive in-repo / archive to cold storage / delete after the window)
  was answered by the human 2026-08-22T17:01:36Z, verbatim: "Archive in-repo,
  still readable - move under the handoffs root; nothing deleted; evidence
  consumers can still read older trails". That single tap settles the intakes
  open questions 2 (where it goes) and 6 (evidence consumers) together, which
  is why it was asked as one question - both are the ones the intake itself
  marked as needing a human lock. The rest were defaulted per the intakes own
  "defaults welcome", and are listed in approval_context so the human can
  still move them at approval: what moves (completed/ and sent/ only), who
  runs it (a bounded handoffd janitor tick rather than a piggyback on a roles
  dequeue path, so the cost does not fall on whichever role happens to read
  mail and so the pace stays testable), the window (14 days) and the pace
  (200 per tick).

  Measurement at mint, 2026-08-22, this host, counted per role through the
  real worktree layout: total 12183 files in completed/ and sent/, 11793 of
  them older than 14 days. By worktree: coder 1890 (1838 old), architect 1609
  (1569), cleaner 1608 (1570), hardender 1395 (1356), QA 1394 (1360),
  documenter 1290 (1255), master (specifier + coordinator) 2997 (2845). The
  intakes own figure of ~5900 came from BL-978s mint on 2026-08-20 and counted
  a narrower set; the tree has kept growing, which is the point.

  Why the active-ticket exemption is load-bearing rather than belt-and-braces:
  collect-dispatched-ticket-ids decides an active tickets dispatch-gap verdict
  from whether ANY handoff naming it is present in the scan dirs. Archive the
  wrong file and a live ticket reads as never dispatched, and the daemon nudges
  the coordinator about work that is moving fine. Sparing active tickets costs
  almost nothing - a handful are active at a time under the depth cap - and it
  is the cheapest possible way to make invariant 2 true by construction rather
  than by argument.

  Related: BL-978 (done - the single-pass trail index this ticket is the named
  follow-on (b) of; its constraints section says in terms that retention is
  out of its scope and a human call); BL-977 (done - the supervisor false-stall
  guard, the halt this cost triggered); BL-967 (done - the sweep-boundary lines
  the measurements ride on); BL-222 (the scan-dir set); BL-128 (mailbox-dir as
  the one shared resolver). NOT related in scope: BL-1066 (metrics poll tick
  git walk - separate live CPU defect, deliberately not merged) and BL-1013
  (Boy Scout epic - repo debt, not mailbox retention).

  Orthogonality for the coordinator: touches swarmforge/scripts/handoffd.bb
  (one new sweep call) and adds a new lib plus its step handlers. Overlaps
  BL-1066 on nothing; overlaps any other handoffd.bb parcel only on the poll
  loop wiring - prefer sequencing rather than co-activating two handoffd.bb
  tickets.

  IR-DRY at mint: 5 findings, all medium, all reviewed and KEPT as intentional
  - (a) the 40-file vs 500-file Givens differ deliberately (40 sits under the
  ceiling so scenario 04 measures the move, 500 sits over it so scenario 03
  measures the drip); (b) "a retention tick runs" vs "a second retention tick
  runs" are kept distinct so scenario 03 can assert cumulative progress
  without a duplicate step inside one scenario; (c) the three possible-synonym
  pairs are setup-versus-assertion and outline-placeholder-versus-fixed-value
  artifacts of normalization, not drift. The one high-confidence finding at
  first draft (a step repeated inside scenario 07) was fixed, not waived.
  Gherkin lint gate: clean.
