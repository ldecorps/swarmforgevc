required_wiring:
  - "specs/pipeline/steps/index.js::bl1066::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them. Verified absent from index.js at spec time, so the anchor cannot pass before the work is done"

invariants:
  - "A poll tick never re-enters a metrics computation that is still running: a tick arriving while one is in flight is skipped or coalesced, never stacked."
  - "The cost of one metrics computation does not grow with the number of closed tickets - closing another ticket adds no further git subprocess to a steady-state tick."
  - "Every git child this path spawns is reaped; a completed computation leaves no defunct git process behind."

approval_context: >
  The human asked for this to be minted as a queue-jump defect and to be
  tappable same-shift, so this is flagged for that decision rather than for a
  design question. One thing changed during scoping and you should see it
  before you tap.


  THE INTAKE'S DIAGNOSIS WAS SLIGHTLY OFF, AND THE REAL ONE IS WORSE. The
  intake reads the defect as an "unbounded fan-out" of parallel git children
  from a single call. It is not: `gitFollowHistory` uses `execFileSync`, so
  within one call the ~794 walks run strictly one at a time. The parallelism
  comes from somewhere else - `computeSwarmMetrics` is called from
  `swarmPanel.ts:408`, on the `setInterval(poll, STAGE_POLL_INTERVAL_MS)` stage
  poll tick, and `STAGE_POLL_INTERVAL_MS = 2000`. Measured on this host: 794
  done `.yaml` files at ~0.128s per `--follow` walk is about **102 seconds of
  git per computation, scheduled every 2 seconds**. Ticks therefore overlap
  roughly fifty deep in steady state, which is precisely the parallel-git storm
  and the defunct children you saw.


  This matters for the fix: a concurrency cap on git children (the intake's open
  question 2) does not address it, because a single call is already serial. What
  has to change is that a ~102-second job is on a 2-second timer at all.


  WHAT I DID NOT CHANGE. Your three locked decisions are carried through exactly
  as written - defect, high, queue-jump posture, front of the queue. I have not
  softened any of them on the strength of the re-diagnosis.

description: >
  `extension/src/panel/swarmPanel.ts:408` calls `computeSwarmMetrics` on the
  stage poll tick, `setInterval(poll, STAGE_POLL_INTERVAL_MS)` with
  `STAGE_POLL_INTERVAL_MS = 2000` (swarmPanel.ts:37, :388). That call reaches
  `computeMeanTicketTime` (swarmMetrics.ts:158), which lists every closed ticket
  via `listDoneBacklogPaths` - and that lister recurses into the milestone
  subdirectories (swarmMetrics.ts:89-90), so the corpus is the RECURSIVE count,
  794 `.yaml` files today, not the 492 sitting flat in `backlog/done/`. For each
  one it shells `gitFollowHistory` (swarmMetrics.ts:115-122):

    git log --follow --name-status --format=COMMIT%x09%cI -- <relativePath>

  MEASURED ON THIS HOST, 2026-08-22: one such walk takes ~0.128s real. 794 walks
  is therefore **~102 seconds of git per single computation**, scheduled **every
  2 seconds**.

  THAT RATIO IS THE DEFECT. Each tick starts a fresh ~102s job while the
  previous fifty are still running, so the git children accumulate without
  bound until something gives - which is the sustained multi-core saturation,
  the many concurrent `git ... --follow` processes, and the `[git] <defunct>`
  zombies the operator observed at load ~15.8 on 20 cores.

  CORRECTION TO THE INTAKE'S ROOT CAUSE, DELIBERATE AND LOAD-BEARING. The intake
  describes an "unbounded fan-out of `git log --follow`" from one call.
  `gitFollowHistory` uses `execFileSync`, which is synchronous, so a single call
  spawns its 794 children strictly SEQUENTIALLY, one at a time. The concurrency
  is entirely between overlapping TICKS (and between separate panels/hosts), not
  within a call. Recorded explicitly because it changes the fix: capping
  concurrent git children per call - the intake's open question 2 - would cap
  something that is already 1, and would leave the storm untouched.

  ALSO NOT THE CAUSE, CHECKED: the metrics unit tests build fixture repos in
  temp dirs and do not take the live repo as subject, so `swarmMetrics.test.js`
  is not a live-repo offender and is correctly absent from BL-1038's file list.
  The unit lane is not what was melting the host here; the panel's own tick is.

  HOW (direction, not mandate). The shape that follows from the measurement is
  to get the walk off the 2-second tick: compute mean ticket time on its own far
  slower cadence or on demand, cache the per-ticket durations keyed by path and
  commit so a closed ticket is walked once rather than every tick, and guard the
  tick so it cannot re-enter a computation still in flight. A cheaper arrival
  signal than rename-following every done file (the intake's open question 1) is
  a legitimate alternative to the cache and is the implementer's call. Whatever
  route is taken, invariant 3 is separate and still owed - the defunct children
  are their own reliability smell, not merely a symptom of volume.

  SCOPE. The metrics computation and the panel call site that drives it. NOT the
  general Vitest worker-pool sizing (cited only, per the intake). NOT the
  live-repo unit tests BL-1038 already owns - cite that ticket, do not merge
  into it.

qa_e2e_procedure: >
  1. At the parent commit, measure the defect rather than assuming it: time a
  single `git log --follow --name-status --format=COMMIT%x09%cI --
  backlog/done/<any BL-*.yaml>` and multiply by
  `find backlog/done -name '*.yaml' | wc -l`, and confirm the product far
  exceeds STAGE_POLL_INTERVAL_MS. Record both numbers. 2. At the parent commit,
  open the panel against this repo, and while it polls, count concurrent
  `git ... --follow` processes (`pgrep -fc -- '[g]it .*--follow'`) over 30
  seconds; confirm the count climbs rather than staying flat, and note any
  `[git] <defunct>` entries. 3. At the parcel commit, repeat step 2 and confirm
  the concurrent count stays within the declared bound and does not climb with
  time. 4. Confirm invariant 2 against corpus size: run one computation against
  a fixture with ~10 closed tickets and one with ~800, and confirm the git
  subprocess count does not scale with the corpus. 5. Confirm invariant 3: after
  a computation completes, confirm no defunct git process remains
  (`ps -eo stat,comm | grep -c '^Z.*git'` is 0). 6. Confirm correctness was not
  traded for speed - this is the step that catches a "fix" that just returns
  null: against a fixture with known active-to-done durations, confirm the
  reported mean and sample count still match the known values exactly. 7.
  Confirm the panel still updates: with the walk off the tick, confirm mean
  ticket time still appears and refreshes on its new cadence rather than never.

