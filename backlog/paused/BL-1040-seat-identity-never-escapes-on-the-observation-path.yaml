    chrome regex. Different surface, no file overlap.

  ## Untracked, surfaced not swept

  `swarmforge/scripts/test/fixtures/` is untracked in both the coder
  worktree and the master checkout - the same hot-sync orphan already known
  in this repo. It is NOT part of this work and was left in place.

  ## IR-DRY judgment recorded

  The feature file went 8 findings -> 4. The real one - a 0.857
  near-duplicate between "holds a ticket" and "holds a different ticket" -
  was folded into a single "each seat holds its own ticket" step. A sixth
  scenario asserting the single-seat regression was DROPPED rather than
  reworded: its `Given` contradicted the two-seat `Background`, and its
  content is a baseline comparison, which belongs in the QA e2e procedure
  (step 6) rather than in an executable scenario.

  The remaining four are all `possible-synonym` at <= 0.667 between steps
  that name WHICH seat holds the ticket - the bare one, the second one, each
  of them, or the Outline's placeholder over them. That distinction is the
  behaviour under test, so collapsing it would conflate exactly what
  invariants 1 and 2 exist to keep apart. Kept deliberately.

