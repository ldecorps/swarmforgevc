human_approval: approved
approval_context: >
  One scenario is added to a landed feature file, so it would ordinarily
  need a tap; it is minted approved under the 2026-09-17 operator hotfix
  (severity defect, no choice posed, no ruling_options). FIRM: the
  classifier's outputs for every existing scenario and shell case are
  unchanged - first matching config line wins, exactly as today. FIRM:
  the fix is in the library, never a retry or a catch in the property
  test or the gate. FIRM: the new scenario runs the REAL library under
