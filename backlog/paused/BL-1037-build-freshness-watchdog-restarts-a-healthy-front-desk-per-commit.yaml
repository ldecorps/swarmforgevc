id: BL-1037
title: "the build-freshness watchdog restarts a HEALTHY front desk once per commit-plus-grace, and this swarm commits faster than one restart cycle completes: 24 stale detections and 12 respawns in 105 minutes, so the bot spends most of its uptime restarting"
milestone: M8
type: defect
severity: medium
# medium, not high: alone this costs a bounded 20-50s outage per restart and
# the watchdog is doing exactly what BL-582 built it to do. It becomes the
# hour-long unavailability the human reported only through its two amplifiers,
# BL-1035 (a respawn is instantly re-stalled) and BL-1036 (each respawn costs a
# Telegram conflict window) - which is why those two carry the higher severity
# and should be fixed first.
status: todo
epic: swarm-reliability
priority: 0
direction: queue-jump
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1037-the-build-freshness-watchdog-restarts-fewer-times-than-main-moves.feature
human_approval: approved

invariants:
  - "Staleness deferred is never staleness dropped: a commit the watchdog declines to restart for now is still owed a restart later."
  - "A restart is never triggered against a child that has not yet completed a poll cycle on the build it was restarted onto."

source: |
  Split 3 of 3 from .swarmforge/operator/INTAKE-front-desk-freshness-watchdog
  -restart-storm-20260822.md (human report relayed via Cursor 2026-08-22
  ~05:50 UTC). This is the intake's suspect (1).

  The human's report, verbatim:

    "front desk is not listening, I sent something in the Onboarding topic,
    and no answer there either"

  The intake's direction for this half, verbatim:

    "Decide whether the fix is: a longer/adaptive grace period, debouncing
    staleness detection (only restart if still stale after N consecutive
    checks, not the first), batching multiple staleness events instead of
    restarting per-commit, or something else - the freshness watchdog must
    not regress to serving stale code indefinitely (BL-582's own point) while
    also not spending most of its uptime restarting."

  And its standing constraint on any fix here, verbatim:

    "Whatever the fix, it must be observable in the supervisor log (this
    intake was only possible because the log already names each event
    clearly) - do not regress that."

  Siblings from the same intake: BL-1035 and BL-1036.

description: |
  ## What happens

  BL-582 gap (c) restarts a healthy bridge/bot child once its `build_sha` has
  trailed `main`'s tip for `FRONT_DESK_BUILD_GRACE_MS`
  (`front_desk_supervisor.bb:148`, default 300000). It is working as designed,
  and the design was right: before it, a build served 2h23m stale because
  freshness was only ever checked on a crash respawn and a healthy process
  never crashes.

  What the design did not price in is a `main` that moves faster than one
  grace window plus recompile-and-respawn. This swarm lands commits every few
  minutes, so staleness re-arms before the previous restart has finished
  paying for itself. From `.swarmforge/operator/front-desk-supervisor.log`,
  04:30Z-06:14Z on 2026-08-22: 24 `build-stale-detected` events and 12 bot
  respawns, with staleness re-detected 33 seconds to 14 minutes after the
  previous restart completed. Measured cadence, not an estimate.

  Each of those restarts costs a recompile plus a respawn plus a Telegram
  conflict window (BL-1036), and any that followed a stall entered a tight
  loop (BL-1035). The compound effect is what the human hit: a front desk that
  is rarely in a stable polling state long enough to answer.

  ## What must not be lost

  The watchdog's whole point is that a build may not serve indefinitely stale
  code. Any fix that reduces restarts by forgetting a staleness it already saw
  reintroduces the 2h23m window. Invariant 1 states this as a property because
  no single scenario can: deferral is only legitimate if the debt is still
  owed afterwards, and scenario 03 is the one example of it.

  ## How (direction, not mandate)

  The intake lists longer/adaptive grace, debouncing across N consecutive
  checks, and batching; any of these can satisfy the contract, and the choice
  is the implementer's. What the contract fixes is the observable outcome:

  - Under a commit burst, restarts must be fewer than commits (scenario 02).
  - A child restarted onto a fresh build gets to serve at least one poll cycle
    before the watchdog may restart it again (scenario 01) - that is the
    difference between a restart that bought something and one that did not.
  - The debt survives the deferral (scenario 03).
  - A `main` that is not moving costs nothing (scenario 04).
  - Each restart still names the build it moved to, per the intake's
    observability constraint (scenario 05).

  A note on ordering rather than a dependency: fixing BL-1035 and BL-1036 makes
  each restart cheap, which lowers the urgency here but does not remove the
  defect - a healthy process restarted per-commit is still wrong.

  ## Scope

  - swarmforge/scripts/front_desk_supervisor_lib.bb -
    `build-freshness-transition` and `check-one!`'s `build-stale?` branch
  - swarmforge/scripts/front_desk_supervisor.bb - `:build-grace-ms` and any
    additional bound the chosen approach needs, env-overridable in the same
    style
  - specs/features/BL-1037-the-build-freshness-watchdog-restarts-fewer-times
    -than-main-moves.feature and its step handlers
  - docs: whichever reference describes the watchdog's cadence, updated to the
    chosen rule

  Out of scope: BL-1035 and BL-1036; the bridge/bot split (both children are
  governed by the same rule and should stay that way); and any change to what
  counts as stale.

qa_e2e_procedure: >
  1. At the parent commit, drive the supervisor (fixture clock, stub compile
     and spawn) with a synthetic commit stream landing faster than one restart
     cycle completes, for longer than the build grace. Confirm the absence
     first: restarts track commits roughly one-for-one, and at least one
     restart lands on a child that never completed a poll cycle.

  2. At the parcel commit, repeat identically. Confirm restarts are strictly
     fewer than commits, and that no restart hits a child that has not yet
     completed a poll cycle on its current build.

  3. End the burst and let the clock run. Confirm the bot ends on main's
     newest build within one build grace of the last commit - the deferred
     staleness is paid, not dropped.

  4. Run the same fixture with a quiet main for longer than the build grace.
     Confirm no restart at all.

  5. Read the supervisor log across all of the above and confirm every restart
     still records the build it moved to.

notes: |
  IR-DRY reviewed, not merely run. Two medium findings remain and must NOT be
  "fixed": `the bot is running a build that main has moved past` against `the
  bot is running main's newest build` is a deliberate opposite pair (the
  stale and fresh preconditions), and `the bot is running main's newest build`
  against `... within one build grace of the last commit` distinguishes a
  precondition from a timing-bounded assertion, which is the whole content of
  scenario 03.

  The staleness precondition is deliberately NOT in the Background even though
  four of five scenarios open with it: scenario 04 requires the opposite, and
  a Background must hold for every scenario. An earlier draft put it in the
  Background and negated it in 04; the checker flagged the negation, which was
  the right complaint about the wrong line.

  No `required_wiring:` is declared: `build-freshness-transition` is already
  called from `check-one!`, so there is no new call site to pin.
