id: BL-925
title: "The commit-time guard refuses a merge that only IMPORTS an already-QA-published origin/main, so BL-891's reconcile sweep aborts the same clean join on every tick while the checkout is ahead-and-behind"
milestone: M8
type: defect
severity: high
status: todo
epic: deterministic-transit-assist
human_approval: approved
priority: 20
direction: human-requested
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-925-reconcile-merge-of-qa-published-tip-completes.feature

invariants:
  - "A QA-exclusive path reaches `main` from a non-QA writer only when its resulting content is exactly what an already-QA-published commit holds. Being mid-merge is never on its own sufficient — provenance decides, not the presence of MERGE_HEAD."
  - "There is one definition of `QA-approved tip` in the repo. A second predicate that answers the same question differently is the defect, not the fix."
  - "A real conflict still aborts, and the checkout is never left mid-merge — BL-891's invariant is unchanged by anything here."

approval_context: >
  Wants sign-off on severity, which is the only field I moved away from the
  intake's own framing.

  Filed `high`. The intake presents this as the documented remainder of work
  that already ships, which reads like `medium`, and nothing is down right now
  because the human completed the merge by hand. I filed `high` because the
  failure is on the reconcile path itself and it does not self-clear: the sweep
  aborts the same clean merge on every tick for as long as the checkout is
  ahead-and-behind, which the intake establishes is the steady state, and
  BL-920's escalation is explicitly a sibling that "would not have unstuck
  this". So the standing condition is that local `main` and `origin/main`
  drift apart until a human intervenes — the exact condition the memory lesson
  about reading both refs exists to work around.

  Say so if you read that as `medium`; only the severity field changes, and
  the expedite lane it sits in is the only consequence.

source: |
  Operator intake `.swarmforge/operator/INTAKE-bl891-reconcile-qa-published-merge.md`
  (human ldecorps via Cursor, 2026-08-18 ~13:55 BST), drained by the specifier
  the same day. 1:1 — the intake produced this ticket and no other.

  The human's framing question, verbatim:

  > Is there a way to fix the process so that does not happen?

  Asked after reconciling local `main` by hand as merge `47d41d4ff`, because
  the push-sweep would not push a diverged tip and the BL-891 sweep could not
  complete the same merge.

description: |
  ## What happens

  1. Push-sweep alarms: local `main` has diverged from `origin/main`. Measured
     that afternoon at **8 ahead / 69 behind**.
  2. The 8 local-only commits are coordinator bookkeeping (topic records,
     promotions, closes). `origin/main` carries QA's landings, which include
     pipeline files under `extension/` and `specs/pipeline/steps/`.
  3. `git merge --no-edit origin/main` in the master checkout merges **cleanly**
     — "All conflicts fixed but you are still merging." This is exactly the
     join BL-891 intends.
  4. Completing that merge commit is **refused by BL-632's guard**
     (`check_pipeline_code_on_main.sh`, via `pre-commit` / `pre-merge-commit`)
     because the staged changes touch QA-exclusive paths and the reconcile
     daemon is not `SWARMFORGE_ROLE=QA`.
  5. `master-main-reconcile-merge!` in `handoffd.bb` treats any non-zero
     `git merge` as failure, runs `git merge --abort`, and logs a **conflict**.
     So the automated join of a clean, already-published `origin/main` never
     completes, and after one coordinator note it goes quiet.

  ## Why the guard cannot currently tell the two apart

  Read at `main`: `check_pipeline_code_on_main.sh` asks two questions only —
  is the branch `main`, and is `SWARMFORGE_ROLE=QA`. It then greps
  `git diff --cached --name-only` against a three-prefix path set. It asks
  **nothing about where the content came from**, and it has no notion of a
  merge at all. So "QA published this and I am importing it" and "I am
  authoring fresh pipeline code on main" are indistinguishable to it.

  A fast-forward never hits this, because a fast-forward fires no commit hook.
  The recurrence is **ahead-and-behind**, which the intake establishes is the
  steady state of this checkout: QA lands on `origin/main`, coordinator and
  specifier commit bookkeeping on local `main`.

  ## The trap in the obvious fix — read this before implementing

  The tempting shape is "if a merge is in progress, allow pipeline paths". That
  is wrong and invariant 1 exists to forbid it: a writer could stage fresh
  pipeline edits on top of a legitimate merge of a published tip and ride
  through on the merge's coat-tails. The allowance must be decided by
  **content provenance** — this path's resulting content is what the published
  parent holds — not by the presence of `MERGE_HEAD`. Scenario 01's third row
  is that case and it must be refused.

  ## Shape of the fix (direction, not mandate)

  Teach the guard the question BL-630 already asks before push: is the incoming
  merge parent an ancestor of `swarmforge-QA`? Both `pre-commit` and
  `pre-merge-commit` must see it, because they share this one script — the
  human's own recovery used `git commit --no-edit` to complete a merge, so the
  `pre-commit` path is not hypothetical.

  **One wrinkle the intake could not have known.** It asks to "reuse
  BL-630's QA-ancestry question; do not duplicate a second definition of
  'QA-approved tip'", which is right — but that definition currently lives in
  Babashka (`handoffd.bb`'s `git-is-ancestor?` / `push-sweep-qa-gate-facts!`)
  while the guard is bash, so there is no import that bridges them. Per the
  engineering article's constant-across-a-language-boundary rule, if the
  predicate ends up stated in both languages it needs a test asserting the two
  agree; a "kept in sync" comment is not a gate. Extracting one callable
  definition is the better answer where it is practical. Invariant 2 is what
  this must satisfy, by either route.

  ## What must still be refused

  A non-QA **new** commit that itself authors pipeline files on `main` is still
  refused. A genuine dirty-path overlap, or a real merge conflict, still blocks
  and surfaces.

  ## Explicitly not the fix (from the intake)

  Do **not** skip hooks (`--no-verify`). Do **not** set `SWARMFORGE_ROLE=QA` on
  the whole daemon. Do **not** impersonate QA for an unrelated commit.

locked_human_decisions: |
  Quoted from the intake, 2026-08-18. The specifier may challenge or refine
  these; they are not to be silently dropped (Article 5.3).

  1. **Fix the join, not the two-ref split.** QA lands on `origin/main`;
     bookkeeping stays on this checkout's `main`. That split is inherent. The
     process bug is that the merge of a QA-published tip cannot complete.
  2. **Smallest remainder of BL-891, not a rewrite.** Same instruction as the
     2026-08-17 dirty-overlap intake that became BL-919/BL-920.
  3. **Guard stays closed for new pipeline authorship on `main`.** Only the
     already-published incoming parent is in scope.

qa_e2e_procedure: |
  1. Build a fixture repo reproducing the ahead-and-behind shape: local `main`
     carrying bookkeeping-only commits, `origin/main` carrying a QA-published
     tip that touches `extension/src/` and `specs/pipeline/steps/`, with a
     `swarmforge-QA` ref that has the tip as an ancestor. Merge with no
     `SWARMFORGE_ROLE` set and confirm the merge commit is created.
  2. Repeat step 1 completing the merge with `git commit --no-edit` rather than
     `git merge`, so the `pre-commit` hook path is exercised. Both must allow.
     This is the exact command the human used on 2026-08-18.
  3. Stage a fresh edit to a file under `extension/src/` on top of that merge
     and confirm the commit is refused naming that path. This is invariant 1
     and the single most important negative case.
  4. With no merge in progress, author a new pipeline-code commit on `main` as
     a non-QA writer and confirm it is still refused exactly as before — the
     guard's original behaviour must be untouched outside the merge-import case.
  5. Point the incoming merge at a commit that is NOT an ancestor of
     `swarmforge-QA` and confirm the merge is refused.
  6. Create a genuine conflict between the incoming tip and a local bookkeeping
     commit, run the reconcile sweep, and confirm it aborts, reports a
     conflict, and leaves no merge in progress (`git status` clean, BL-891's
     invariant).
  7. On the live host, let the reconcile sweep run a tick against a real
     ahead-and-behind `main` and confirm the join completes and no tick logs a
     conflict for it. The 2026-08-18 incident is the reference case.

out_of_scope: |
  Named by the intake as out of scope unless the specifier chooses them; I have
  not chosen any of them, per locked decision 2 (smallest remainder).

  - Moving `main` off this checkout onto a forever-clean worktree.
  - Letting the coordinator merge or push.
  - Changing QA's `push origin HEAD:main` landing.
  - Rebasing local bookkeeping in the sweep.
  - Rewriting BL-632's deny-by-default for a bare human shell.

  Also out of scope:
  - BL-920's escalation-on-persistent-block. The intake is explicit that it is
    a sibling and "would not have unstuck this: the sweep would still abort
    every tick". Keep that ticket; do not fold it in.
  - BL-356's push-sweep. Opposite direction, and it correctly refuses a
    diverged push. Not the writer here.

notes: |
  Drained 1:1 from the operator intake on 2026-08-18; source doc archived to
  `.swarmforge/operator/archive/` in the same pass per BL-311.

  **Probed before speccing, and the intake's account held up exactly.** Read
  `check_pipeline_code_on_main.sh` at `main`: it asks only branch and
  `SWARMFORGE_ROLE`, has no merge awareness, and greps `git diff --cached
  --name-only` against `extension/src/`, `extension/test/`,
  `specs/pipeline/steps/`. Confirmed both `swarmforge/git-hooks/pre-commit` and
  `pre-merge-commit` delegate to it, which is why the intake's "both must see
  it" is load-bearing rather than defensive.

  **One thing the probe added.** The intake asks to reuse BL-630's QA-ancestry
  question without duplicating the definition. That definition is Babashka
  (`handoffd.bb:2475`) and the guard is bash, so "reuse" cannot mean a call
  today. Recorded in the description and pinned by invariant 2 rather than
  decided here — the coder picks the route, but a silently duplicated
  predicate is not one of the options.

  **The provenance-vs-MERGE_HEAD trap is mine, not the intake's.** The intake
  says only "allow the merge commit (pipeline paths included)" when the parent
  is a QA ancestor. Taken literally that would wave through fresh pipeline
  edits staged on top of such a merge. Invariant 1 and scenario 01 row 3 close
  it. Flagging it because it is a change in emphasis from the intake's wording,
  not a contradiction of it.

  **Related, deliberately not conflated** (the intake's own list): BL-891 built
  the sweep; BL-919 narrowed the dirty gate and was not the blocker here;
  BL-920 is the escalation sibling; BL-632 is the guard whose intent stands;
  BL-630 owns the ancestry question; BL-356 is the opposite direction.

  **No `required_wiring:`.** The change is inside a script both hooks already
  delegate to. There is no new call site the value depends on, so any entry
  would match at HEAD and pass vacuously — per BL-874 that is worse than none.

  **Shell-test discipline applies.** Per the engineering article, target stock
  macOS `/bin/bash` 3.2 — write `${arr[@]+"${arr[@]}"}` for possibly-empty
  arrays, which this guard already does elsewhere — and `env -u
  SWARMFORGE_CONFIG` before fixture confs. The existing suite is
  `swarmforge/scripts/test/test_pipeline_code_on_main_guard.sh`; extend it
  rather than starting a second one.

  **BL-233 obligation.** All five scenarios are new and need their step
  handlers landed in THIS parcel; the acceptance runner throws on any scenario
  it cannot resolve. The `<content>` and `<command>` columns must validate
  against explicit KNOWN_VALUES, not pass through.
