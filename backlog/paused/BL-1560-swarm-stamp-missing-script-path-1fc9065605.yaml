approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. What needs sign-off is the
  DISPOSITION only: that reviewing the landed diff of 1fc9065605 (BL-811 /
  BL-849 posture) rather than re-implementing it is right, and that medium
  is the right severity for a review of behaviour already live. FIRM: the
  parcel changes no file under swarmforge/scripts except to add evidence
  and, where the coder extends it, TEST files under swarmforge/scripts/test/;
  a refuted scenario or a confirmed probe finding is a narrow follow-up via
  note to the specifier, never an in-parcel rewrite. FIRM: the parcel never
  writes human_decision into backlog/hotfix-ledger.yaml (scenario 07) - the
  human records certify or waive with hotfix_ledger_update.bb --decide after
  this reaches done. FIRM: the two findings the specifier made while minting
  are NOT this parcel's to fix - BL-1561 (a data token is rewritten) and
  BL-1562 (the wake nudge still says the bare name) own them. Minted by the
