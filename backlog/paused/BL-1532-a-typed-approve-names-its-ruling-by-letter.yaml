qa_e2e_procedure: |
  On the parcel commit, from `extension/`, after `npm run compile`.
  1. `node specs/pipeline/cli.js specs/features/BL-1532-a-typed-approve-names-its-ruling-by-letter.feature`
     green; BL-1367, BL-434 and BL-721 feature files still green.
  2. Fixture ticket under a mkdtemp root (BL-1390 rules), pending, two
     ruling_options. Feed the bot's Approvals-topic reply path
     `approve <id> b` with a captured reply adapter: the yaml gains
     `human_ruling: |` with the SECOND label verbatim, `ruling_provenance:
     typed`, `human_approval: approved`; the captured reply names that
     label; the approve commit carries the human byline (BL-1368).
  3. Fresh fixture, `approve <id>`: yaml unchanged; reply lists `A)` and
     `B)` with labels. `approve <id> c`: same. Fixture without options,
     `approve <id> a`: yaml unchanged; reply names `approve <id>`.
  4. Fixture already carrying `human_ruling` for A, `approve <id> b`:
     human_ruling still A; reply names A.
  5. `reject <id> not now` on a fixture with options: `human_approval:
     rejected` with the reason, no human_ruling written.
