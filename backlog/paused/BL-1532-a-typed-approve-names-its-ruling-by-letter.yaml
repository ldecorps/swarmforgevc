human_approval: pending
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed. FIRM: a letter that names no declared option, or a letter on a
  ticket with no ruling_options, is refused and nothing is recorded - the
  swarm never interprets a guess (front-desk posture since BL-434). FIRM:
  a ruling already recorded is never overwritten by a typed letter
  (BL-1367 scenario 04's typed twin). FIRM: the recorded human_ruling is
  the bare option label exactly as relay-ruling.js and the tap record it,
  never the letter, so every existing reader of human_ruling is
  unaffected; provenance is the new value `typed`. Depends on BL-1531,
  which defines the letter from the option's position. Human directive
  quoted verbatim in description.

invariants:
  - "The letter-to-option mapping is the one BL-1531 defines from position in ruling_options; the typed grammar never carries its own table."
  - "A typed approve records a ruling only when the letter resolves to exactly one declared option; every other shape (bare approve on a ticket with options, unknown letter, letter with no options) records nothing and the reply says which letters exist."

description: |
  ## Human directive (2026-09-11, verbatim, from the same intake as BL-1531)

  "intake : what to chose? pros and cons should be explained on the
  telegram message."

  The intake's stated want includes: "The reply hint names how to pick one
  ("approve BL-1529 A" or equivalent)."

  ## What is wrong

  `classifyApprovalsTopicReply` (extension/src/concierge/pendingApprovalReply.ts)
  accepts `approve <id>`, `reject <id> <reason>`, `/qjump <id>` and
  `/ambulance <id>`; `APPROVALS_TOPIC_APPROVE_PATTERN` is
  `/^approve\s+(\S+)\s*$/i`, so `approve BL-1529 A` falls through to
  `none` and is surfaced as not acted on. A bare `approve BL-1529` on a
  ticket declaring `ruling_options` reaches `recordApprovalReply` with no
  ruling, which BL-1367 correctly refuses (`ruling-required`) - so the
  human who answers by typing has no route at all, and the ask's reply
  hint tells them to type exactly the thing that is refused. The only
  working route is the button keyboard.

  ## What is wanted

  `approve <id> <letter>` (letter case-insensitive) on a ticket whose
  `ruling_options` has an entry at that letter's position records that
  entry's LABEL as `human_ruling`, `ruling_provenance: typed`, flips
  `human_approval` to `approved`, and confirms naming the label - the same
  one-writer splice the tap uses (`spliceRulingRecord`). Bare `approve <id>`
  on a ticket with options is refused and the reply lists the letters and
  labels to choose from. An unknown letter is refused the same way. A
  letter on a ticket without options is refused and the reply names the
  plain form. An already-recorded ruling is never overwritten. The
  BL-1531 pick hint gains the typed form ("or reply approve <id> <letter>").
  Every other verb is unchanged.

  ## How (direction, not mandate)

  - Classifier: `APPROVALS_TOPIC_APPROVE_PATTERN` becomes
    `/^approve\s+(\S+)(?:\s+([A-Za-z]))?\s*$/i`, returning
    `{ kind: 'approve', backlogId, letter? }`; the reject pattern stays
    checked first, as today.
  - Resolve the letter to a label via BL-1531's shared helper (index from
    letter), against `readRulingOptions`; hand the label to
    `recordApprovalReply(targetPath, backlogId, ruling)` - the seam BL-1367
    already widened - with provenance `typed` (`spliceRulingRecord` takes
    the provenance string; add the value, not a second writer).
  - Reply text on refusal: reuse the `ruling-required` / `unknown-option`
    outcomes `classifyApprovalRulingRequirement` already distinguishes
    (bridgeServer.ts ~line 912 renders them for the pager) so the two
    surfaces say the same thing.
  - The per-ticket-topic grammar (bare `approve`, `isApprovalReplyText`)
    is NOT changed here; a ticket topic ask still routes a choice to the
    keyboard.

  ## Not in scope

  - The pager / PWA typed path (bridgeServer.ts) - it already carries a
    ruling and needs no letter.
  - The message content and button lettering: BL-1531.

