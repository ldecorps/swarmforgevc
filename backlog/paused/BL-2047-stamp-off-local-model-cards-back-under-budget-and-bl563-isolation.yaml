description: |
  ## Status: hotfixes 61c2c53e37 and 171ddbdee0 landed the fixes

  This parcel is their stamp-off: review them, do not re-apply them.

  ## What was wrong, and what each hotfix changed

  61c2c53e37: the BL-2038 phase section (890d5b2f24) put every composed
  local-model card over BL-1798's 8192-character budget (coder 9325,
  cleaner 8848; coder 8261+ in the two-pack mono-router variant). The
  section is compressed (each command kept; the phase CLI named once as
  C), the header's large-file rule absorbs a duplicate read_file bullet,
  three command-running bullets become one, and several rules are
  reworded shorter; the coder card loses one sentence. No rule is dropped.
  Every role is now 7670-8096 plain, 8164 at most in any variant.

  171ddbdee0: BL-563's step handler (1) compared two fixtures' settings
  byte for byte though each embeds its own root in the tool-miss heal
  hook - each root is now masked before comparing; (2) let cold-apply rank
  the live checkout's .swarmforge/model-steward scorecards - it now passes
  an empty MODEL_STEWARD_STATE_DIR. Scenario text unchanged.

  ## What the coder does (all of it)

  1. Read `git show 61c2c53e37` and `git show 171ddbdee0` against the
     section above; check that no rule of the loop note lost its meaning.
  2. Run qa_e2e_procedure step 1 and the three features once, output under
     tmp/.
  3. Write backlog/evidence/BL-2047-coder-<date>.md with the review result
     and the run results, and commit it.

