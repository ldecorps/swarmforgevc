source: |
  The human, 2026-09-30, specifier pane, verbatim:

  > Get the swarm to process your iq3 hot fix. It's ptobably not fi ished yet and I want the swarm to fully master the utilisation of local models.

  The misdiagnosis this prevents is recorded in
  `backlog/evidence/coder-iq3-reliability-20260930-coordinator.md` and
  corrected in `backlog/evidence/coder-iq3-reliability-20260930-specifier.md`.

description: |
  ## Why

  The coordinator read coder@iq3 as stuck ("CPU near 0%", the same pane
  lines, no commits). The seat was generating at 3.5 tokens/s with 8 of
  65 layers on the CPU; later it was compressing its chat every turn. All
  of it was on disk, and it took a specifier's hand trace to find.

  ## What is wanted

  `bb swarmforge/scripts/local_seat_report_cli.bb <project-root> --seat <seat>`
  prints, for the seat's latest session (and `--sessions N` for more):
  - requests, recorded turns, chat compressions (with tokens before and
    after), api errors (scenario 01);
  - total output and reasoning tokens, and the longest request;
  - from the Ollama log's latest load: layers on GPU out of total,
    context, KV cache type; latest generation speed (scenario 02);
  - a state: `generating` (the Ollama log shows generation in the last
    minute), `idle`, or `down` (no qwen process for the seat's worktree)
    (scenario 03).

  Sources, as they are on this host on 2026-09-30:
  - qwen usage: `~/.qwen/usage/token-usage-<yyyy-mm>.jsonl` (sessionId,
    inputTokens, outputTokens, thoughtsTokens, timestamp);
  - qwen sessions:
    `~/.qwen/projects/<cwd with / and . as ->/chats/<session>.jsonl`
    (`system` rows: `chat_compression`, `ui_telemetry` api errors);
  - Ollama log: the path the swarm's Ollama start writes, else
    `.swarmforge/ollama-serve-operator.log` (lines `load_tensors:
    offloaded N/M layers to GPU`, `llama_kv_cache: size = ... K (q8_0)`,
    `llama_context: n_ctx`, `slot print_timing: ... tg = X t/s`).

  ## How (direction, not mandate)

  - A pure lib (parse and summarise) plus a thin CLI (engineering: thin
    main). Paths are arguments with the defaults above, so fixtures never
    read the operator's `~/.qwen`.
  - Step handler `specs/pipeline/steps/bl1842LocalSeatReportSteps.js`,
    registered in `specs/pipeline/steps/index.js` in the same commit as
    the feature's first green run (BL-233). Fixture files under mkdtemp.

  ## Scope

  The new lib, CLI and bb test, the step handler and its registration,
  docs, evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1842-a-local-model-seats-health-is-one-command-away.feature`:
     3 of 3 ok. Measured 0 on main at mint: no handler exists yet.
  2. Live, read-only: `bb swarmforge/scripts/local_seat_report_cli.bb <root> --seat coder@iq3`
     prints the latest session with its compressions and reasoning tokens,
     and 65/65 layers on GPU with a q8_0 KV cache (the state since the
     specifier's 13:50Z restart).

