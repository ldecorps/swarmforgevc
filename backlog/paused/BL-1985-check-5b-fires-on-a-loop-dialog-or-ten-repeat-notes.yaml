description: |
  ## Status: the change already exists - finish it, do not re-derive it

  Your own work from the BL-1980 attempt is saved in git stash commit
  37c87f9232 ("worktree-drift-20261005T072935Z"). In `.worktrees/coder`,
  run `git stash apply 37c87f9232` once. It restores two files:

  - `swarmforge/scripts/test/babysitterd_sweep_lib_test_runner.bb`: its
    five new BL-1980 cases are right as they stand. Keep them.
  - `swarmforge/scripts/babysitterd_sweep_lib.bb`: ONE function does not
    load. In `check-seat-ticket-stuck` (about line 322) the trigger vector
    closes one paren early: `(when (>= ... seat-ticket-stuck-min))` ends
    the `when` before its string, so bb stops with "Unmatched delimiter".
    Replace the whole function, from `(defn check-seat-ticket-stuck` to the
    line before `;; ── check 6`, with exactly this (verified: the runner
    prints ok, test_babysitter_check.sh ALL PASS):

        (defn check-seat-ticket-stuck
          "held-tickets: {:role :task :dwell-min :head-unchanged? :busy?
           :loop-dialog? :repeat-notes-since-claim}, already resolved by the
           gatherer. One CRIT per role, for the longest unchanged claim that is
           stuck: dwell at or past seat-ticket-stuck-min, or a loop-detection
           dialog on the pane, or ten or more REPEAT notes since the claim
           (BL-1980). The message names which trigger(s) fired. paused? suppresses
           the check."
          [held-tickets paused?]
          (if paused?
            []
            (vec
             (for [[role items] (group-by :role (remove :gpu-quiet? (or held-tickets [])))
                   :let [stuck (->> items
                                    (filter :head-unchanged?)
                                    (filter #(or (>= (long (or (:dwell-min %) 0)) seat-ticket-stuck-min)
                                                 (:loop-dialog? %)
                                                 (>= (long (or (:repeat-notes-since-claim %) 0)) 10)))
                                    (sort-by :dwell-min >)
                                    first)]
                   :when stuck]
               (let [dwell (long (or (:dwell-min stuck) 0))
                     repeats (long (or (:repeat-notes-since-claim stuck) 0))
                     triggers (cond-> []
                                (>= dwell seat-ticket-stuck-min) (conj (str "no commit for " dwell "m"))
                                (:loop-dialog? stuck) (conj "qwen's loop dialog is on the pane")
                                (>= repeats 10) (conj (str repeats " REPEAT notes since the claim")))]
                 {:key (str "seat-stuck-" role)
                  :severity "CRIT"
                  :message (str role " has held " (:task stuck) " with no commit since the claim: "
                                (str/join ", " triggers)
                                (when (:busy? stuck)
                                  " — the pane spinner is not progress")
                                " (threshold " seat-ticket-stuck-min "m)")})))))

  Then run these two commands, ONCE each, and commit if both pass:

  1. `bb swarmforge/scripts/test/babysitterd_sweep_lib_test_runner.bb`
     prints `babysitterd_sweep_lib_test_runner: ok`.
  2. `bash swarmforge/scripts/test/test_babysitter_check.sh` ends
     `ALL PASS`.

  Do NOT, on this ticket:
  - make an Edit whose old and new text are the same. If an edit fails,
    re-read the lines once, then replace the whole function as above.
  - run `git stash`, `git stash pop` or `git stash push`.
  - touch `babysitter_check.bb`: the gatherer is BL-1986 and BL-1987.

  If `git stash apply 37c87f9232` fails, write the function above by hand
  and add five runner cases under `;; ── check 5b`: a loop dialog at 5m
  dwell is one CRIT naming "loop dialog"; ten REPEAT notes at 5m dwell is
  one CRIT naming "10"; nine notes is none; ten notes with HEAD moved is
  none; 60m dwell plus a dialog is still one CRIT.

  ## What this slice is

  BL-1980's check-seat-ticket-stuck clause only: the check fires on two
  new facts per held ticket, `:loop-dialog?` and
  `:repeat-notes-since-claim`. Nothing supplies them until BL-1986 and
  BL-1987 build the gatherer, so the live sweep is unchanged by this
  slice alone.

