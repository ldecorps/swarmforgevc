description: |
  ## Status: hotfix f1b8d5f2b7 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `babysitter_assess_lib.bb`'s `worktree-last-own-ticket-commit-ms` (the
  2026-10-04 hotfix 14680e2eef, stamped by BL-1955) counts a commit as the
  seat's progress only when its message names the ticket and carries the
  seat's byline. It matched the byline with `--grep=^By <stage>\.$`, so a
  byline with anything after the stage name never matched. The coder
  seat's 9811cd59fe ("By coder (coordinator-assisted recovery ...)") left
  the clock at the 08:22Z claim, and `check-seat-ticket-stuck` raised
  seat-stuck-coder seven times on 2026-10-06 while the seat was committing.

  ## What the hotfix changed

  The byline pattern is `^By <stage>([^[:alnum:]_-]|$)`: `By coder.` and
  an annotated `By coder (...)` count, `By coders.` does not. The runner
  gained both cases. Measured after: the live coder worktree's own-commit
  time for BL-1843 read 2026-10-06T10:44:32Z, 9811cd59fe's.

  ## What the coder does (all of it)

  1. Read `git show f1b8d5f2b7` against the two sections above.
  2. Run qa_e2e_procedure step 1 once, output under tmp/.
  3. Write backlog/evidence/BL-2042-coder-<date>.md: the review result and
     the run result, and commit it.

