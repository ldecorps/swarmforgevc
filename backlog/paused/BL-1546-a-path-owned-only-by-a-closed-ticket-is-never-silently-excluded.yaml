id: BL-1546
title: "The land step excludes a path whose only owner is a ticket CLOSED on origin/main (the documenter's 'docs: BL-1518 guard how-to and feature narrative ...', 5dbd34f27f, inside BL-1537's own parcel): a closed ticket can never land again, so the content is orphaned and one EXCLUDED_SIBLING_PATH line is all that reports it; a closed-owner path is kept when the landing ticket touches it itself and otherwise refuses by name, never a silent exclusion"
milestone: M8
type: defect
severity: high
# high: approved, QA-gated content is silently absent from main after a
