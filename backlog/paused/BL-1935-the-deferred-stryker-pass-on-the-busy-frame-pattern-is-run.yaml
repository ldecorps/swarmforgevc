  ticket. The Babashka copy has no mutation lane (BL-472); the
  BL-1003 parity property already ties it to this side's verdicts.

  The evidence records the dry-run line, the score, and each survivor's
  disposition: backlog/evidence/BL-1935-hardender-<date>.md.

