id: BL-1458
title: "The morning briefing has one author: every trigger that asks an agent for it sends the documenter the ceremony's instruction note, the VS Code host's compose nudge is retired, and the instruction is one literal across the TypeScript and Babashka builders - BL-099's coordinator nudge and BL-658's documenter instruction both fired on 2026-09-05 and 2026-09-07 and the briefing was composed twice each day (human ruling A, 2026-09-07)"
milestone: M8
type: defect
severity: medium
# medium: the human still received a briefing both days and nothing was
# lost; the cost was a second composition walking five pipeline stages to
# a QA no-op, a wasted documenter fix cycle, and two texts for one morning.
# Not high: the prompt halves (870d0153e6) already stop the live race;
# this parcel retires the code that asks the wrong role.
status: todo
epic: swarm-reliability
priority: 12
direction: human-requested
depends_on: []
