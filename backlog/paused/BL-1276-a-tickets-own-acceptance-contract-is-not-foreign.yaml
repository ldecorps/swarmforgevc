notes: |
  - [2026-08-29] specifier: this ticket has its OWN feature file rather than
    amending `specs/features/BL-1192-pre-handoff-task-scope-gate.feature`, and
    that is deliberate, not an oversight. Pointing its acceptance: at BL-1192's
    file would make BL-1276 the very shape it fixes - blocked by the gate it
    repairs, before the repair exists. (It would in fact bootstrap, because the
    gate runs from the sender's own checkout, which would carry the fix; that
    is too clever to rely on, and its failure mode is the coder blocked again
    with no move.) The gate's contract is consequently across two files. That
    is the lesser harm and I am not minting a follow-up to fold them, which
    would be churn for no behaviour.
  - [2026-08-29] specifier: PROSE HALF IS MINE (BL-798), and no gate will chase
    me for it. `swarmforge/handoff-protocol.md` documents this gate under
    "Mechanics (`task_scope_gate_lib.bb`)" as a bullet list of exemptions -
    today "Positive identification only", the evidence-path bullet, and the
    scope-walk bullet. This ticket adds a fourth exemption, so that list must
    gain a bullet or the documented contract is wrong. I have deliberately NOT
    armed a `required_wiring` entry on it: that check pins the file to the
    PARCEL commit, so it would refuse the documenter-to-QA handoff whenever the
    branch has not merged `main` - a false block, not a check (BL-1241 and
    BL-1272, same reasoning). I am not landing the prose at mint because it
    would document an exemption the code does not yet make. I land it on `main`
    myself when this ticket activates, in the same pass, and record the commit
    here. If this note is still the last word on it when the ticket reaches the
    documenter, the prose has not been written and someone should say so.
  - [2026-08-29] specifier: answered the three questions the gate-shape rule
    requires before speccing a gate change. (1) Who creates the condition -
    I do, at mint, when I point an acceptance: field at another ticket's
    feature file; nothing tells me at that moment, and with this exemption in
    place nothing needs to, because the condition stops being a condition.
    (2) Who receives the refusal and what can they do - after this fix, a
    genuine entanglement still refuses the sender, whose action is BL-1241's
    rebuild hatch; that action is real for every shape that still refuses.
    (3) Is the remedy a no-op in any direction - the unreadable-declaration
    branch is the one place it could become one, which is why the refusal must
    name that it could not evaluate the exemption rather than prescribing a
    rebuild.
  - [2026-08-29] specifier: the IR-DRY checker reports three medium
    possible-synonym findings, all the same benign pair: the Scenario Outline's
    parameterised Given/And against scenario 02's and 03's concrete ones.
    Substituting the Examples row makes the step texts byte-identical, so one
    handler pattern serves both. Reviewed and kept - DRY, not accidental drift.
    (Identical disposition to BL-1272's own IR-DRY note.)
  - [2026-08-29] specifier: BL-1246 is HELD at 3c07857a5 pending this ticket.
    The coder has been told not to rebuild it, not to fork the feature file,
    and not to re-label the commit; it re-sends unchanged once this lands on
    main and is merged into the coder worktree (the gate runs from the sender's
    own checkout, so the fix must be present there, not merely on main).
  - [2026-08-29] specifier: this mint was itself destroyed once, mid-write, by
    the master/main reconcile reset (reflog `reset: moving to origin/main`,
    which also took four landed bookkeeping commits with it - the thirteenth
    occurrence). Recovered from tmp/bl1276-recover/ and pushed to origin
    immediately, because an unpushed commit on this checkout is not durable.
