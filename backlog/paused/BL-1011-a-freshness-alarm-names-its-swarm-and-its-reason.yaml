id: BL-1011
title: "A freshness alarm reaches the operator naming neither its swarm nor its reason - 999999999 is a sentinel for three different faults, printed raw as though it were an age"
milestone: M8
type: defect
severity: medium
status: todo
epic: fleet-topology
priority: 7
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1011-a-freshness-alarm-names-its-swarm-and-its-reason.feature

required_wiring:
  - "swarmforge/scripts/daemon_log_freshness_check.sh::swarm=::the announced text and the durable incident record must both carry the swarm name. Zero occurrences of this literal exist in the file today, so the pattern cannot match before the work is done"
  - "swarmforge/scripts/daemon_log_freshness_check.sh::reason=::the sentinel must be replaced by a named condition in both the announce and the incident record. Also zero occurrences today"
  - "specs/pipeline/steps/index.js::bl1011::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "Self-identifying: every announced line and every durable incident record names the swarm it came from, so an alarm is attributable with no access to the sending host and no matter which credential path supplied the bot token."
  - "No raw sentinel reaches a human: a value that is not an age never renders as a number. Every violation states which of the three conditions fired."

description: >
  WHAT. Make a FRESHNESS_VIOLATION line say which swarm sent it and what
  actually went wrong, in both the Telegram announce and the durable incident
  record.

  WHY. `heartbeat_age_secs` (daemon_log_freshness_check.sh:78-95) returns the
  literal 999999999 for THREE different conditions - the log file is missing,
  the log contains no heartbeat line, or the newest heartbeat's timestamp will
  not parse - and `process_daemon` interpolates that straight into
  "age_secs=${age}" as though it were an age. So the operator is handed a
  number where a reason belongs.

  Both halves cost real investigation time on 2026-08-21. Five alarms arrived
  in the Operator topic between 10:58 and 11:06 BST, all reading
  `age_secs=999999999`, and because the text names no swarm they could not be
  attributed to a host at all: this checkout's own
  .swarmforge/daemon/freshness-incidents.log has NO entry in that window, and
  `append_incident` runs before `do_announce` in both branches, so the sender
  was some other checkout holding the `primary` fleet credentials. It was
  still unidentified after a full investigation of the receiving host. That is
  the defect: the alarm carries nothing to route it back by.

  HOW (direction, not mandate). The checker ALREADY resolves its own swarm
  name from .swarmforge/swarm-identity - but only inside the
  `if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]`
  branch that fills in missing credentials, so a checkout whose credentials
  are already exported never computes it. Scenario 04 pins exactly that trap.
  Hoisting that resolution so it always runs is the expected shape.

  SEVERITY medium, deliberately. The signal fires and is not lost; what is
  degraded is attribution. That costs investigation time and leaves a real
  fault un-routed, but it does not itself stop or degrade a swarm - reserve
  high for the fault that is actively degrading one (BL-1012).

  NOT IN SCOPE. Why the sending host is unhealthy, whatever host it turns out
  to be; the restart-storm and threshold behaviour (BL-1012); credential
  distribution across the fleet.

qa_e2e_procedure: >
  1. In a scratch checkout, write a .swarmforge/swarm-identity naming
     `swarm_name second`, create the daemon dir but NO handoffd.log, and run
     the checker with FRESHNESS_ROOT pointed at it, FRESHNESS_ANNOUNCE_CMD set
     to append its argument to a file, and FRESHNESS_INCIDENT_FILE in scratch.
  2. Confirm the announced line names swarm `second`, names the reason
     `log-absent`, and contains no 999999999 anywhere.
  3. Confirm the incident record line carries the same swarm and reason.
  4. Repeat with a handoffd.log that exists but has no heartbeat line
     (expect `no-heartbeat-line`), and one whose newest heartbeat timestamp is
     garbage (expect `unparseable-timestamp`).
  5. Repeat step 1 with TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID already
     exported in the environment - the swarm name must still appear. This is
     the regression that matters; it is the path that fails today.
  6. Write a log whose newest heartbeat is 300s old and confirm the line reads
     a real age of 300 with reason `stale-heartbeat`.
  7. Delete the scratch checkout.

source:
  - "Operator, 2026-08-21 ~11:06 BST, via screenshot of the Operator topic showing five consecutive FRESHNESS_VIOLATION lines reading age_secs=999999999 with no swarm attribution; asked 'what can be done for that?'. Specifier probe of the live host recorded in this ticket's description and notes."

notes: |
  2026-08-21 coordinator: priority raised 30 -> 7 on direct operator
  instruction to prioritize tickets enabling starting s2 on wsl2. Once s2 is
  running, its freshness alarms are otherwise unattributable to it (the
  999999999 sentinel names no swarm), which is exactly what stalled
