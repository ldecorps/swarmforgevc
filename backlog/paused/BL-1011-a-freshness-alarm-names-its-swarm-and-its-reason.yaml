  2026-08-21 specifier: filed from a live operator report. Sibling filed in the
  same pass: BL-1012 (the restart storm and the absolute threshold), epic
  swarm-reliability. The two are independent - this one is about what the
  message SAYS, BL-1012 about when it fires - and neither depends_on the
  other. They do touch the same file, so the coordinator should not run them
  concurrently (Concurrent Work Orthogonality).

  Probe evidence, live host, 2026-08-21 11:00-11:12 BST:
  - daemon_log_freshness_check.sh:78-95 - three distinct returns of 999999999.
  - :225 and :233 - both announce strings interpolate ${age} with no reason
    and no swarm; grep for `swarm=` and `reason=` in that file returns 0.
  - The swarm-name resolution sits at ~:268, nested inside the credential
    fallback branch.
  - freshness-incidents.log holds 287 historical sentinel entries, so the
    condition is common, not exotic.
  - Unresolved and deliberately left so: which checkout sent the 10:58-11:06
    alarms. s2 (WSL2, brought up 2026-08-21) is the leading candidate but the
    intake archived as INTAKE-s2-advertise-fleet-and-s1-coordinator.md records
    that it may have no fleet/second/telegram.json at all. `tonesmith` is ruled
    out - different botId and different chatId from `primary`. This ticket is
    what makes the next occurrence answerable in one glance.

