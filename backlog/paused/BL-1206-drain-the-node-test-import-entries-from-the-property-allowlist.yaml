qa_e2e_procedure: >
  (1) From extension/, run `grep -l "require('node:test')"
  test/*.property.test.js` and confirm it returns nothing. (2) Run
  `npm run test:properties` and confirm each converted file appears in
  Vitest's own reported file list rather than under "Failed Suites" with
  "No test suite found". (3) Read
  swarmforge/scripts/property_suite_standing_allowlist.tsv and confirm every
  converted file that passed is gone, every converted file that still fails is
  present with a rationale naming its actual failure, and all 14 unrelated
  rows are unchanged. (4) Run swarmforge/scripts/check_property_suite_drift.sh
  and confirm it still exits 0.
