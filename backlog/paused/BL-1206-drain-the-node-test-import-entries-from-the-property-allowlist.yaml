description: |
  ## What

  Remove `const { test } = require('node:test');` from the 13 property-lane
  files that carry it, so `test` resolves to the binding
  `vitest.properties.config.mjs` already provides via `globals: true`, and
  drop from `swarmforge/scripts/property_suite_standing_allowlist.tsv` each
  file that passes once collected.

  The 13, measured 2026-08-27:

      test/alertTelemetry.property.test.js
      test/bl1146HostQueueEnqueueNext.property.test.js
      test/bl1147ProbeLegacyTopicAdoption.property.test.js
      test/bl1150OutageFailoverCliLoadFileSafe.property.test.js
      test/bl669OutageFailoverSteward.property.test.js
      test/bl733ProducerCrosscheck.property.test.js
      test/bl735PilotAcceptanceExecution.property.test.js
      test/bl782LivenessProbesScopedToRoot.property.test.js
      test/crossFileDuplicationCheck.property.test.js
      test/pilotAcceptanceGate.property.test.js
      test/pilotScopedCrapEvidence.property.test.js
      test/resolveMutationConcurrency.property.test.js
      test/shellEntryPointDriveCheck.property.test.js

  ## Why

  `vitest.properties.config.mjs` includes `test/**/*.property.test.js` and
  sets `globals: true`. A file that instead imports `test` from `node:test`
  registers with node:test's runner, which Vitest's collector cannot see.
  Reproduced on `test/alertTelemetry.property.test.js`: node:test executes
  every case and prints TAP `ok`, and in the same run Vitest reports
  `Error: No test suite found in file ...` and fails the file. The assertions
  pass and the file fails simultaneously, so the lane gates nothing here.

  BL-1175 met this under time pressure — a stuck BL-605 parcel — and chose
  the allowlist over the repair, which was the right call then. But it has
  since landed, so all 27 rows now read "pre-existing; tracked under BL-1175
  pending fix" against a closed ticket. An allowlist that outlives its ticket
  stops being a deferral and becomes the permanent state.

  ## How (direction, not mandate)

  The 229 property files that do NOT import node:test already use the bare
  `test(name, fn)` the lane's globals supply, and all 13 of these use plain
  `test(name, fn)` too — no subtests, no `t` argument, no node:test options —
  so this should be a deletion of one line per file rather than a rewrite.
  `require('node:assert/strict')` is runner-agnostic and stays.

  Convert, run the lane, and let the result decide each row: a file that
  passes leaves the allowlist, a file that fails on its own merits stays with
  its rationale rewritten to the real reason (scenario 03). Do not force a
  file green to empty the list.

  ## Out of scope

  The other 14 allowlist rows. They are red for unrelated reasons and are
  named in scenario 04 precisely so a wholesale drain of the file is caught.

  Whatever is re-flipping `core.bare` on the shared repository during property
  runs — BL-1124 / BL-1196 / BL-1200 / BL-1202.

