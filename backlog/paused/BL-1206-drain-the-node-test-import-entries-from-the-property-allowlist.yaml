approval_context: >
  Raised by the architect as an undiagnosed live red ("Vitest 'No test suite
  found' hits 14+ property test files, untracked"). It is diagnosed and it is
  not untracked, so this ticket is deliberately narrower than the note that
  prompted it: all 13 affected files are already on BL-1175's standing
  allowlist, the gate the swarm actually runs
  (check_property_suite_drift.sh) exits 0 on them, and BL-1175's own
  description already names the fix ("green after vitest-globals fix"). The
  architect grepped for the error string rather than the allowlist, which is
  why it read as untracked.

  What is genuinely open, and what this ticket is for: BL-1175 shipped the
  allowlist and landed, so its 27 rows now say "pending fix" against a closed
  ticket and no ticket owns the fixing. This drains the 13 rows that share one
  mechanical cause and leaves the other 14 alone.

  What is worth the human's eye is scenario 03. These 13 files have never
  actually been collected by Vitest, so conversion may reveal a genuine
  failure in one of them. The ticket deliberately does NOT require all 13 to
  go green: a file that fails on its own merits after conversion stays
  allowlisted with its rationale corrected to the real reason. If the
  preference is that all 13 must be green or the ticket bounces, say so and
  scenario 03 inverts. Forcing green under time pressure is how the 27-row
  allowlist got written in the first place.
