id: BL-1743
title: "Eight test files' non-vacuity probes write their deliberately broken copy of a script INSIDE the checkout (beside the real script in swarmforge/scripts/ or swarmforge/scripts/test/, or in extension/test/helpers/) and remove it only in a finally, so a killed run leaves it behind - at 06:35Z on 2026-09-25 a killed property run on the main checkout left bl1652's two broken copies (a chase_sweep_lib.bb with the per-sweep respawn cap removed, and its runner) in swarmforge/scripts/, the 08:00Z launch's sync_worktree_scripts copied them into seven worktrees, and QA reported its tree dirty; a probe's broken copy lives under a temporary root of its own and the next probe reaps any root a dead run left"
milestone: M8
type: defect
severity: medium
# medium: contained. No test is red and nothing loads the stray copies,
# but every killed run (BL-1729's heap deaths on the main checkout kill
# property workers) litters the checkout, the launch sync spreads it to
