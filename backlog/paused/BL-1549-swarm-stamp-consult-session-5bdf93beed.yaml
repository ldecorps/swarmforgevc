qa_e2e_procedure: |
  On the parcel commit:
  1. `git diff main...HEAD --name-only` names only evidence, the feature,
     the step handler + index.js registration, and optionally
     `swarmforge/scripts/test/test_chase_departing_mid_parcel_gate.sh` or
     a new sibling test; none of handoffd.bb, mono_router_lib.bb,
     handoff_lib.bb, single_role_repair_lib.bb (invariant 1).
  2. `run_acceptance.sh` on the BL-1549 feature -> 6 scenarios green.
  3. `bash swarmforge/scripts/test/test_chase_departing_mid_parcel_gate.sh`
     (8 original checks still pass) and
     `bb swarmforge/scripts/test/mono_router_lib_test_runner.bb` green.
  4. The evidence file records review goal 4's probe outcome explicitly
     (confirmed with the log lines, or refuted with the reason).
  5. `backlog/hotfix-ledger.yaml` row 5bdf93beed: `human_decision: null`.
  6. After done: the human runs `bb swarmforge/scripts/hotfix_ledger_update.bb .
     --decide 5bdf93beed approved|waived` and commits the ledger.
