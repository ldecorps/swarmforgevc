notes: |
  Minted 2026-09-26 by the specifier (claude-opus-5-5 seat) from QA note
  003266, the same pass. The specifier read the code on swarmforge-QA
  at mint (local_parcel_driver_lib.bb: start-ticket-parcel! reads
  pre-claim-head at its first let, and commit-shas-since is a plain
  `git log <since>..HEAD`). That code widened the finding from QA's two
  merge commits to every commit the merges brought in. BL-1702's
  depends_on gains BL-1778 in the same commit. The cause is the
  specifier's own FIRM wording in BL-1715 ("so its next parcel starts on
  its pre-claim tree"), which the coder built literally. A FIRM line that
  names a tree must name the right base.
  IR-DRY: four possible-synonym findings, all kept. "the driver finishes"
  vs "the driver has finished" is action vs setup (scenario 02's action
  is the downstream merge). The other three are the outline's
  `<claim merge>` step against its own concrete values in scenarios
  02/03, one handler regex.
  Freshness: deprecate-check was run after the last edit.

  INVEST: Independent (depends only on BL-1715 landing), Negotiable (the
  rev-list form and the function name are direction), Valuable (the
  mixed pack's give-up stops shipping deletions downstream), Estimable
  (one function over persisted state), Small (three scenarios, two
  invariants), Testable (fixture repos driven through the real give-up,
  plus one property).
