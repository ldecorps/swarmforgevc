id: BL-1000
title: "Both freshness shell tests bind their conf seam to the LIVE operator-tunable daemon_log_freshness.conf, then stage a 200s-stale heartbeat and assert a restart - so any ops raise of handoffd's 120s threshold reddens the suite for a reason unrelated to the code; the pinned fixture that fixes it already exists on disk, untracked in every worktree, wired to nothing"
