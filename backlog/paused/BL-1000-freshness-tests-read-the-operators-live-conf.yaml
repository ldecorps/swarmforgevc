required_wiring:
  - "specs/pipeline/steps/index.js::bl1000::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "No test binds a seam to a file the operator is expected to tune at runtime. Every conf, threshold or budget a test reads resolves to a fixture the test owns, so changing production configuration can never change a test result."
  - "Every file a test reads is tracked in git. A test never depends on a path that exists only because hot-sync copied it into the working trees - if a fresh clone cannot run the test, the test is not wired."

approval_context: >
  What needs sign-off: nothing about the diagnosis - it is settled by
  inspection (see source). The one judgement call is the SCOPE. This ticket
  fixes the two files that demonstrably carry the coupling and tracks the
  fixture, and deliberately does NOT sweep the whole shell suite for other
  tests reading live config, even though invariant 1 is written as a class
  property. A repo-wide sweep is a separate, larger slice; minting it here
  would break the size envelope. Say so if you would rather have the sweep.

  Also worth a look: the orphan fixture. It appeared on disk today at 12:52,
  identical in all six worktrees and the master checkout, tracked in no branch
  and referenced by no test. The specifier did not create it and has not moved
  or deleted it (workflow rule: never delete what you did not create). If it
  is yours and you meant it to land differently, say so before this promotes.

source: |
  Specifier probe 2026-08-20, from an untracked file surfaced during a
  master-checkout status sweep.

  `swarmforge/scripts/test/fixtures/daemon_log_freshness.fixture.conf` exists
  untracked in the master checkout AND in all six role worktrees (the BL-373
  hot-sync signature), created 2026-08-20 12:52, tracked in no branch, with no
  git history. Its own header states the intent: "Fixture thresholds for
  freshness unit tests - pinned so a temporary ops raise of the live
  daemon_log_freshness.conf does not invalidate scenarios that assume
  handoffd|120." Nothing references it - `grep -rn "fixture.conf"
  swarmforge/scripts/` returns only unrelated comment matches. Someone
  diagnosed this defect, wrote the fix, and it never landed.

  Verified against the code: `test_daemon_log_freshness.sh:20` and
  `test_bl785_freshness_deliberate_stop.sh:26` both set
  `CONF="$SRC/daemon_log_freshness.conf"` - the live file - and pass it as
  `FRESHNESS_CONF` into every checker invocation.

description: |
  ## What

  `swarmforge/scripts/daemon_log_freshness.conf` is, by its own header
  (BL-675), "per-daemon log-freshness thresholds and paths (one declared
  place)". It is the operator's tuning knob: how long handoffd or babysitterd
  may go quiet before the watchdog kills and restarts it. It ships
  `handoffd|120` and it exists to be changed.

  Two shell tests read that live file as their conf seam:

  - `swarmforge/scripts/test/test_daemon_log_freshness.sh:20`
  - `swarmforge/scripts/test/test_bl785_freshness_deliberate_stop.sh:26`

  Both then stage a handoffd heartbeat 200 seconds old - each carrying the
  comment `# >120s threshold` in the source, which is the coupling stated out
  loud - and assert the watchdog kills the pid, restarts via
  `start_handoff_daemon.sh`, records `daemon=handoffd age_secs=200
  action=restart`, and announces `FRESHNESS_VIOLATION`.

  ## Why it is a defect

  Raise handoffd's threshold past 200 - a legitimate ops action during a
  noisy window, and the only supported way to make that change - and a
  200-second-old heartbeat is fresh. No incident is written. Five assertions
  in scenario 02a go red, plus the equivalents in the BL-785 test. The suite
  now reports a failure that has nothing to do with the code under test, and
  the next role to see it spends a turn diagnosing the wrong thing. The
  operator's honest tune looks like a regression.

  What makes this sharp rather than theoretical is that `run_checker`
  (`test_daemon_log_freshness.sh:60-72`) injects EVERY other seam: root,
  clock (`FRESHNESS_NOW_EPOCH`), incident file, cool-off, and the announce,
  kill and start commands. The conf is the single seam left bound to
  production - not an oversight of principle, just one that got missed.

  ## How (direction, not mandate)

  A pinned fixture conf, tracked in git, that the tests point at instead of
  the live file. That fixture already sits on disk unwired
  (`swarmforge/scripts/test/fixtures/daemon_log_freshness.fixture.conf`) and
  is a reasonable starting point - adopting it means `git add`-ing it, which
  is the whole point of invariant 2. A per-test heredoc conf staged into each
  test's own `make_root` temp dir is an equally good answer if the
  implementer prefers it; what matters is that no test result depends on the
  operator's file.

  Whichever shape is chosen, the staged ages and the fixture's thresholds
  must stay legible together: a reader of scenario 02a should be able to see
  why 200 is stale without opening another file.

  ## Scope

  - `swarmforge/scripts/test/test_daemon_log_freshness.sh`
  - `swarmforge/scripts/test/test_bl785_freshness_deliberate_stop.sh`
  - the fixture conf they read (tracked)
  - `specs/features/BL-1000-freshness-tests-read-a-pinned-fixture.feature`
    and its step handlers

  Explicitly NOT in scope: changing the live conf's values, changing the
  checker's behaviour, and sweeping the rest of the shell suite for other
  live-config readers (see approval_context).

notes: |
  The orphan fixture is evidence, not a deliverable handed over: the
  specifier did not create it, has not moved or deleted it, and it remains
  untracked in every working tree. Whoever adopts it should confirm its
  contents still match the live conf's rows before pinning them - today they
  agree on both rows, differing only in the header comment.

  Not to be confused with BL-784 (paused), which is about daemons MISSING
  from that conf and their heartbeat discipline. This ticket touches no conf
  rows; it changes only which conf the tests read.

qa_e2e_procedure: >
  From the repo root, at the parcel commit. The point of every step is that
  the live conf is never edited in place - stage a raised copy instead, the
  same way an operator's tune would present to the tests.

  1. Reproduce at the parent commit. Copy
     `swarmforge/scripts/daemon_log_freshness.conf` aside, raise handoffd's
     threshold from 120 to 300 in the working copy, run
     `bash swarmforge/scripts/test/test_daemon_log_freshness.sh` and confirm
     scenario 02a fails (no kill, no restart, no incident record). Restore
     the conf from the copy immediately and confirm `git status` is clean on
     that path. Repeat for
     `swarmforge/scripts/test/test_bl785_freshness_deliberate_stop.sh`.

  2. At the parcel commit, repeat step 1 exactly. Both suites must pass with
     handoffd raised to 300. Restore the conf and confirm clean.

  3. Confirm the shipped behaviour did not change: with the live conf back at
     its committed values, run both suites and confirm they pass, and that
     scenario 02a still asserts kill, restart via `start_handoff_daemon.sh`,
     the `age_secs=200 action=restart` record, and the FRESHNESS_VIOLATION
     announce.

  4. Confirm the fresh-checkout property. From a clean clone of the parcel
     commit into a scratch directory (`git clone . <tmp>` then checkout the
     parcel commit - a clone carries only tracked files, which is the test),
     run both suites and confirm they pass. This is the check that catches an
     adopted-but-untracked fixture: the suite is green in the worktrees and
     red in the clone if the `git add` was missed.

  5. Confirm the acceptance feature runs: the three scenarios in
     `specs/features/BL-1000-freshness-tests-read-a-pinned-fixture.feature`
     execute with registered handlers (no runtime THROW on a missing
     handler).
