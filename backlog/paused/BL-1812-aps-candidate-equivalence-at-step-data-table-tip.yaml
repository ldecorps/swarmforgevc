     3 of 3 ok (0 of 3 on main at mint, no handler yet).
  2. `node specs/pipeline/cli.js specs/features/BL-959-aps-candidate-toolchain-equivalence.feature`:
     3 of 3 ok (measured on main at mint).
  3. `backlog/evidence/BL-1812-aps-equivalence-report.md` exists, names
     candidate 27e9915678, and has the four sections and both wall times.
  4. `git diff main...HEAD --name-only` names none of
     `swarmforge.lock.json`, `swarmforge/vendor/aps/`, `upstream-watch.json`.

