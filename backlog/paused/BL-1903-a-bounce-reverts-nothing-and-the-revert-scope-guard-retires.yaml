description: |
  ## What is wanted

  - The guard leaves the chain: `run_commit_guards.sh` (12 guards at mint,
    11 after) and `swarmforge/git-hooks/commit-msg`.
  - Retired, not reworded: check_bounce_revert_scope.sh and its shell
    test (with its suite-manifest row), BL-1471's feature, its step
    handler and index registration, its property test, and the guard's
    entry in BL-1252's guard-inventory step handler.
    test_merge_deletion_guard.sh names the script and is updated, not
    retired.
  - Docs (documenter): docs/how-to/BL-1471-bounce-revert-scope-guard.md
    moves to docs/deprecated/ and is linked from docs/index.md;
    docs/how-to/BL-1252 and docs/reference/Specification.MD stop listing
    the guard as live.
  - The step handler `bl1903RevertScopeGuardRetiresSteps`, registered in
    the same parcel.
  - workflow.prompt's "A Bounce Must Be Reverted Out Of The Bouncing
    Branch" and its detailed reference are the specifier's prose, landed
    at activation (BL-798).

  ## Scope

  The paths under `retires:`, the guard chain, the commit-msg hook,
  BL-1252's handler, test_merge_deletion_guard.sh, the docs, evidence.

qa_e2e_procedure: |
  On the parcel commit:
  1. ONE run: `node specs/pipeline/cli.js specs/features/BL-1903-a-bounce-reverts-nothing-and-the-revert-scope-guard-retires.feature`:
     all ok.
  2. `node specs/pipeline/cli.js specs/features/BL-1252-*.feature`: all ok
     with the shorter guard inventory.
  3. `bash swarmforge/scripts/test/test_merge_deletion_guard.sh` and
     `bb swarmforge/scripts/test/suite_inventory_cli.bb swarmforge/scripts/test`:
     no new problem (2 pre-existing at mint, BL-1641's retired files).

