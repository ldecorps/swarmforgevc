id: BL-936
title: "BL-931's new pack gate refuses BL-805's property fixture before it reaches the gate it tests, so both BL-805 properties fail on every property-lane run"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 10
direction: agent-proposed
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-936-bl805-property-lane-exercises-the-parcel-gate.feature

required_wiring:
  - "extension/test/bl805RotateGateOnUnfinishedInProcessParcel.property.test.js::rotation router::the fixture builder must actually write the pack declaration; adjusting assertions or comments alone leaves the lane red, which is the BL-419 shape this field exists to catch"

invariants:
  - "The fixture is corrected, never the gate. BL-931's refusal stays exactly as strong as it is today - no env bypass, no force flag, no *_FORCE_RESULT seam, and no edit to handoff_lib.bb, mono_router_lib.bb or rotate_to_role.bb/.sh in this parcel."
  - "Both BL-805 properties keep asserting what they assert today: every SHAPES row, both the resident-invoked and the daemon entry, the same expected blocking and proceeding outcomes. This ticket turns a red lane green by fixing the fixture's premise; it does not renegotiate the invariants under test."
  - "The restored properties stay non-vacuous: with BL-805's own unfinished-parcel gate neutralised, property 2 must still fail. A fixture that makes every rotation proceed is a broken test, not a fixed one."

description: >
  extension/test/bl805RotateGateOnUnfinishedInProcessParcel.property.test.js
  drives the real rotate_to_role.sh and handoff-lib/rotate-resident-to!
  against a disposable fixture git repo, encoding BL-805's two invariants:
  the daemon path is never gated by a stuck parcel, and only a real
  *.handoff file in the departing role's in_process box ever gates the
  resident-invoked path.

  BL-931 (landed 2026-08-19) added an EARLIER gate to the same call path:
  rotate-resident-to! now refuses outright when the pack is not a rotation
  router, because on a standing pack the "resident" it would respawn is a
  colleague's own pane. The BL-805 fixture writes roles.tsv, a tmux socket
  pointer and a launch script, but has never declared a pack topology - so
  resolve-rotation-router-mode? reads it as non-router and refuses before
  either BL-805 gate is reached.

  Measured on this host 2026-08-19, running the file alone on the property
  lane: 2 tests, 2 failed, both on the very first generated shape
  ("empty", extraCount 0).

    - property (invariant 1): expected rotate-resident-to! to succeed
      regardless of in_process contents, got
      {:ok false, :reason not-a-rotation-router}
    - property (invariant 2): expected rotation to proceed (no real parcel
      present), got exit 6: "rotate: this pack does not rotate - every role
      has its own pane (target 'cleaner')"

  Nothing about BL-805's behaviour regressed. The fixture's premise did: it
  models a pack that, under the rules as they now stand, has no resident to
  rotate at all.

  Scope is one file. The sibling shell fixture
  swarmforge/scripts/test/test_rotate_to_role_stuck_parcel_gate.sh already
  took this exact amendment when BL-931 landed - it writes a rotation router
  line into its fixture conf with a comment explaining that its own concern
  is the stuck-parcel gate, not the pack gate. The JS property file needs
  the same declaration and the same explanatory comment; the property lane
  is a separate command (`npm run test:properties`) which BL-931's own gates
  never ran, which is why this one file was missed.

  How (direction, not mandate): follow the sibling's route - have
  makeFixture() write `config rotation router` into
  <root>/swarmforge/swarmforge.conf, which is the default conf path
  handoff-lib/rotation-router-pack? resolves against from this fixture's
  target-root. Verified by direct probe 2026-08-19 that declaring the pack
  router on a fixture of exactly this shape flips rotation-router-pack? to
  true and makes rotate-resident-to! "cleaner" return {:ok true} with a real
  respawn-pane call in the fake tmux log - i.e. the BL-805 gate, and only
  the BL-805 gate, then decides. Carry a comment at the fixture site saying
  why the declaration is there, so the next gate added upstream of BL-805
  finds a signpost rather than a mystery.

constraints: >
  Out of scope:

  - Any change to BL-931's gate, its resolution function, or any other
    production script. This is a fixture defect; the production behaviour
    under test is correct as it stands.
  - Extracting a shared fixture-builder helper out of this property file.
    Keep the fixture self-contained and local, as it is today - extraction
    is a separate refactor and would move the declaration out from under
    this ticket's required_wiring anchor.
  - The other rotation fixtures. Verified 2026-08-19 that
    bl812_project_root_override_property_runner.bb,
    bl917_recompose_never_loses_prompt_on_failure_property_runner.bb,
    bl911_rotation_recompose_test_runner.bb, expedite_lib_test_runner.bb and
    the BL-805 acceptance feature (5/5) are all green - they either declare
    the pack already or never reach the gate. This file is the only one left
    red.
  - swarmforge/scripts/test/test_handoffd_aged_note_rotate_wiring.sh, which
    also fails on this host but for an unrelated, pre-existing reason (it
    uses the `mapfile` builtin, absent from the stock macOS /bin/bash 3.2 this
    repo targets). Tracked separately as BL-937; do not fold it in here.

qa_e2e_procedure: >
  On the live swarm host, from extension/:

  1. Reproduce the red state at the commit before the fix:
     `npx vitest run --config vitest.properties.config.mjs
     test/bl805RotateGateOnUnfinishedInProcessParcel.property.test.js`
     - expect 2 tests, 2 failed, with "not-a-rotation-router" in one failure
     and "this pack does not rotate" in the other.
  2. At the parcel commit, run the same command - expect 2 tests, 2 passed,
     and no occurrence of "not-a-rotation-router" or "does not rotate"
     anywhere in the output.
  3. Confirm invariant 1 by inspection: `git show --stat` on the parcel
     commit lists no file under swarmforge/scripts/ and no production
     source; the diff is the property file (plus this ticket's feature file
     and step handler).
  4. Confirm invariant 3 empirically: temporarily neutralise BL-805's own
     unfinished-parcel gate (make the resident entry proceed regardless),
     rerun the file, and confirm property 2 FAILS. Restore, rerun, confirm
     green. Record both results.
  5. Run the full property lane once (`npm run test:properties`) and confirm
     the BL-805 file is green within it, not merely in isolation.
  6. Run the BL-805 acceptance feature to confirm no collateral damage:
     `node specs/pipeline/cli.js
     specs/features/BL-805-rotate-gate-on-unfinished-in-process-parcel.feature`
     - expect 5/5, unchanged.

notes: >
  Source: a priority-00 note from QA to the specifier, 2026-08-19
  ("bl805 property test broken by BL-931's new non-router-pack rotate
  gate"). Reproduced and root-caused by the specifier before minting rather
  than taken on report; the reproduction output is quoted verbatim in the
  description above.

  Process observation for the closing ceremony, not a deliverable of this
  ticket: BL-931's review chain amended four sibling shell fixtures for
  exactly this reason and its architect pass records running each of them,
  but no stage ran `npm run test:properties`. A gate added to a call path
  that JS property fixtures drive has no standing check that reaches those
  fixtures. Worth a lean-pass hypothesis about whether the property lane
  belongs in the hardener's required evidence when a parcel changes a
  Babashka call path the extension lane drives.

approval_context: >
  This is a straightforward red-lane repair with no open design question, so
  it should be safe to wave through. Flagging two judgement calls in case you
  disagree:

  - I scoped it to the fixture and forbade touching BL-931's gate
    (invariant 1). The alternative reading - that the gate is too broad and
    should exempt something - I rejected: the gate is correct, and BL-805's
    own subject matter only exists on a rotation-router pack, so a fixture
    that does not declare one is modelling a pack where the behaviour under
    test cannot occur.
  - I pinned the fix to the same conf route the sibling shell fixture already
    uses, rather than leaving the route open (swarm-identity would work too).
    Consistency between two fixtures amended for the same reason seemed worth
    more than the flexibility, and it lets required_wiring anchor on a
    literal that will actually exist.
