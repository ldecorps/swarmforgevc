  Its requested outcomes 1-6 (the screen itself) are BL-834.

verification: |
  ## Runnable gate

  This ticket is entirely TypeScript on the bridge and the host tools, so
  `specs/features/BL-833-host-agent-activity-feed.feature` runs in the Node
  acceptance runner and the parcel sits in normal Stryker/jscpd/CRAP scope. The
  coder writes its step handlers in THIS parcel (BL-233).

  The third invariant needs a real test, not an assertion of intent: a scenario
  drives a turn with the feed's write path failing and asserts the turn still
  completes and still replies.

notes: |
  ## e2e procedure for QA

  With a live bridge and a host agent bound: start a Let's Talk turn and, from a
  second authenticated client, read the feed route — activity must appear while
  the turn is still running, not only after the reply. Attach to the event
  stream and confirm new lines arrive without polling. Compare the feed's lines
  against what the Telegram topic showed for the same turn: the feed may hold
  more lines (it is not throttled to chat cadence) but must hold no line Telegram
  did not derive from the same host events. Then end the session and confirm the
  feed reports the host as quiet rather than stalling. Finally, run a turn long
  enough to exceed the buffer bound and confirm the oldest lines are evicted and
  the process's memory does not grow with the session.
