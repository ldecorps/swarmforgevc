invariants:
  - "The feed contains only lines the host agent actually emitted: no synthesized step, no inferred progress, and no reconstructed transcript ever enters it."
  - "The feed is bounded: a long-running session cannot grow its stored activity without limit."
  - "Observing a turn never damages it: teeing into the feed is best-effort, and no failure of the feed can delay, drop or fail the host agent's own turn or its reply."

required_wiring:
  - "extension/src/tools/telegramCursorBridgeLive.ts::recordHostActivity::the progress reporter must actually tee into the feed; a feed nothing writes to stays dark however green its unit tests are (the BL-419 shape)"
