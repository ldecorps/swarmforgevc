verification: |
  ## Runnable gate

  This page is TypeScript and HTML on the bridge, so
  `specs/features/BL-832-bubble-health-trends-page.feature` runs in the Node
  acceptance runner and the parcel sits in normal Stryker/jscpd/CRAP scope. The
  coder writes its step handlers in THIS parcel (BL-233).

  The first invariant is checkable rather than aspirational: for each readout,
  a test asserts the page's figure equals what the named existing computation
  returns for the same inputs, so a second formula fails the gate rather than
  merely violating a principle.

  ## Recorded manual procedure (device surface)

  The WebView render is device surface and BL-829 owns its verification. QA
  confirms only that this page opens from the Bubble pager on a paired phone and
  that every readout is legible at phone width without horizontal scrolling.

notes: |
  ## e2e procedure for QA

  With a swarm that has closed several tickets recently: open Health from the
  Bubble pager and compare each figure against the same metric from the bridge
  route or CLI that computes it — they must agree exactly, not approximately.
  Confirm each readout names its own window. Then point the page at a fresh or
  empty swarm and confirm each readout says it has no observations rather than
  showing zero.
