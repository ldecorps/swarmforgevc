notes: |
  Minted 2026-09-11 by the specifier while answering the coder's and the
  coordinator's BL-1488 notes, the same pass. INVEST: Independent (BL-1488
  is not a dependency; the re-measure is this ticket's own first step),
  Negotiable (test shapes are direction), Valuable (the walker's mutation
  gate goes from 58.77% with 45 unreached mutants to a full account),
  Estimable (52 mutants to kill on 389 lines, one sitting; the 82 are a
  recorded disposition, not work, under the recommended option), Small
  (three scenarios, one invariant), Testable (the parcel's own evidence).
  The census pin (at least 380 mutants) is BL-1445's discipline.

  Why a ruling and not a plain tap: the human already answered exactly
  this budget question for the three large files on BL-1519 (recommended
  option tapped); asking it again for a 389-line file would be churn, but
  silently deciding it would be the BL-1300 shape. The recommended option
  applies that ruling by analogy and says so; the other option is one
  line to tap.
