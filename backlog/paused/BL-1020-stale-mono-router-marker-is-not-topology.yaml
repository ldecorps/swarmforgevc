id: BL-1020
title: "A stale mono-router-active-role marker survives on a non-router pack, where some paths ignore it and attach still reads it - topology must come from the pack config alone"
milestone: M8
type: defect
severity: low
status: todo
epic: swarm-reliability
priority: 60
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1020-stale-mono-router-marker-is-not-topology.feature

invariants:
  - "Topology is derived from the pack configuration, never from a leftover marker file: on a pack whose rotation is empty, no code path treats mono-router-active-role as authoritative."

description: >
  WHAT. `.swarmforge/mono-router-active-role` still contains "specifier" (mtime
  2026-08-19 23:25) on a pack that is NOT a router - full-forge, rotation empty.
  Make the marker inert on a standing pack everywhere, and surface it as stale
  rather than leaving it to be silently consulted.

  WHY IT MATTERS EVEN THOUGH IT IS PROBABLY HARMLESS TODAY. Topology resolution
  keys off swarm-identity and pack conf (empty rotation -> standing ensure), so
  the marker should not put ensure on the illicit-teardown path. But attach's
  no-arg `resident` path still reads it. A file that SOME paths consult and
  others ignore is a trap in exactly the way BL-931's marker era already proved:
  it reads as authority it no longer has, and the next person to add a code path
  has no way to know which convention applies. It was also adjacent state during
  the 2026-08-21 teardown, which is how it was found - it is not being claimed as
  that incident's cause.

  How (direction, not mandate). Either clear the marker when the pack is
  standing, or make every consumer resolve topology from the pack configuration
  and treat the file as a cache that is ignored when it disagrees. Preference,
  weakly held, for the latter plus a stale report, because deleting state during
  a resolve is a side effect in a read path. The implementer's call.

  SCOPE BOUNDARY. Router packs keep reading the marker exactly as today
  (scenario 02 pins this). This ticket removes its authority on STANDING packs
  only; it is not a step toward retiring the mono-router mechanism.

qa_e2e_procedure: >
  1. Run the feature's three scenarios: on an empty-rotation pack the marker is
     not consulted as topology and resolution comes from the pack config; on a
     rotation pack the marker is still honoured; and a marker left on a standing
     pack is reported stale.
  2. Scenario 02 is the regression that matters most - confirm it is genuinely
     exercising the router path and would fail if the marker were made inert
     unconditionally. An over-broad fix that ignores the marker everywhere would
     break live router packs, and this scenario is what stands between the two.
  3. Grep for every reader of mono-router-active-role and confirm each is either
     covered by a scenario or demonstrably router-only. A fix that corrects the
     resident path while leaving another reader consulting the file has not
     satisfied the invariant - which is a property over ALL paths, not over the
     one path that was noticed.
  4. Confirm the live leftover is handled: with the current full-forge pack and
     the existing marker present, resolution must not name "specifier" resident
     on the basis of that file.

source: |
  Intake .swarmforge/operator/INTAKE-attach-swarm-specifier-session-missing.md,
  goal 4, quoted verbatim from the intake: "Stale `mono-router-active-role` on a
  non-router pack is cleared or ignored so attach/ensure never consult it as
  topology." Archived on drain per BL-311. The intake filed it under "Adjacent
  state (do not ignore)" and did NOT claim it caused the teardown; that
  distinction is preserved here. Siblings: BL-1017 (goal 1, primary, carries the
  human's verbatim ask), BL-1018 (goal 2), BL-1019 (goal 3's status half).
  Prior art: BL-931, which stopped rotate from STEALING the specifier pane on
  full-forge - see notes for why this is not that ticket.

notes: |
  2026-08-21 specifier. Severity low, deliberately: no live fault is attributed
  to this. It is a latent trap and a boy-scout-shaped cleanup, and inflating it
  to medium on incident adjacency alone would be exactly the severity theater the
  rubric warns against. It is real enough to ticket and small enough to be
  cheap.

  NOT a duplicate of BL-931 (done). BL-931 stopped rotation from stealing a
  standing role's pane; this is the leftover MARKER FILE from that era still
  being read as topology afterwards. Checked before minting: no existing paused
  or active ticket mentions mono-router-active-role.

  Single invariant, and that is the honest count - the other two candidates
  considered were restatements of it rather than independent properties. Per the
  BL-633 guidance an empty or short invariants list is a legitimate outcome and
  padding it would be noise.
