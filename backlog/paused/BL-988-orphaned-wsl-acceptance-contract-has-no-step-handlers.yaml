id: BL-988
title: "BL-578's acceptance contract is orphaned: no step handler matches 'Given a WSL platform fixture', so all 7 scenarios fail at the first step - restore the handlers or retire the contract"
milestone: M8
type: defect
severity: medium
status: todo
epic: code-quality-gates
human_approval: pending
priority: 30
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-578-devhost-bounce-wsl-window-leak.feature

invariants:
  - "Every scenario in a live specs/features/*.feature has a step handler that matches it - a contract with no binding is either restored or retired, never left in the tree to fail."

description: >
  Severity rationale: medium - a contained but total failure. Unlike a drifted
  assertion, this contract asserts nothing at all: it fails at the first Given
  of every scenario, so the behaviour it was written to protect (BL-578's WSL
  dev-host window leak) is currently ungated.

  Reported by the coder as one of four pre-existing acceptance reds
  (BL-336/337/343/578, note 20260820T122656Z_000380).

  Measured by the specifier - 0 pass, 7 fail, every scenario failing
  identically at its first step. Verbatim:

    Scenario "kill-old constructs termination commands targeting the
    Windows-side dev host": no step handler matched "Given a WSL platform
    fixture"

  Verified TWICE, deliberately: first at 13:38:26 on 2026-08-20 and again
  after recovery. The first run landed five seconds after a
  `git pull --rebase --autostash` detached the master checkout, so it was
  discarded as possibly contaminated; the re-run on the restored tree, with
  extension/out compiled, reproduces it identically. The finding stands on
  the clean run.

  This is the BL-233 failure mode in its settled form: the acceptance runner
  throws on any scenario lacking a step handler, and this contract's handlers
  are absent from specs/pipeline/steps/. Nothing named bl578 exists there.

  Two legitimate outcomes, and the ticket must pick one on evidence:

  - RESTORE. If the BL-578 behaviour still ships (kill-old targeting a
    WSL-side dev host, the headless-swarm marker refusal, the --force
    override), the handlers were lost and belong back, and the contract
    resumes gating.
  - RETIRE. If the behaviour was withdrawn or superseded, the contract is
    stale and should be removed, not re-bound to code that no longer exists.
    Per engineering rules, grep every .feature for a handler's patterns
    before deleting a step-handler file - and the converse applies here:
    establish the behaviour's fate before deleting the contract.

  How (direction, not mandate): determine which of the two applies by
  checking whether the dev-host bounce behaviour is still live, then execute
  that branch fully. Do not leave a third state where the file stays and
  fails.

constraints: >
  Firm lines:

  - Do NOT make the suite green by deleting the feature file without
    establishing the behaviour's fate. That converts an ungated behaviour
    into an unnoticed one.
  - Do NOT stub the handlers to pass. A handler that matches the step and
    asserts nothing is worse than no handler: it reports green over an
    ungated behaviour, where the current state at least fails loudly.
  - If restoring: all 7 scenarios bind and pass in the same parcel. A partial
    restore leaves the runner throwing, which is the state being fixed.
  - Target OS rules are unchanged - macOS and Linux only. A WSL fixture is a
    FIXTURE describing Windows-side behaviour observed from the Linux side;
    it is not an invitation to add Windows support.

notes: >
  Source: coder note 20260820T122656Z_000380, one of four reds. The other
  three have genuinely different causes and are separately ticketed
  (BL-986 scanner blindness, BL-987 audit canary, BL-989 grep -P).

  BL-578's own ticket YAML is no longer in backlog/ - the feature file
  outlives it, which is the intended BL-111 posture (feature files are the
  durable contract). So the ticket YAML cannot be consulted for intent;
  git history for the contract and its original implementation is the source
  of truth for the restore-vs-retire decision.

qa_e2e_procedure: >
  1. Run the contract:
     `node specs/pipeline/cli.js
     specs/features/BL-578-devhost-bounce-wsl-window-leak.feature <outdir>`.
     If RESTORED: runner exits 0, 7 of 7 green. If RETIRED: the feature file
     is gone and no runner invocation references it.
  2. If restored, assert the handlers actually gate: break one behaviour
     deliberately (e.g. make kill-old omit the Windows-side target) and
     confirm the matching scenario goes red. A contract that stays green
     under a deliberate break is a stub, which the constraints forbid.
  3. If retired, grep every remaining .feature file for the removed handlers'
     step patterns and confirm no other contract depended on them.
  4. Full-suite check: the acceptance suite has no scenario failing with
     "no step handler matched".

approval_context: >
  One decision I deliberately left to the implementer rather than fixing at
  spec time: restore versus retire. It turns on whether the BL-578 dev-host
  bounce behaviour still ships, which is a question about live code, not
  about intent - so it belongs to whoever does the work, with both branches
  spelled out and both gated.

  Flag if you already know the behaviour was withdrawn; that collapses this
  to a small retirement and I will amend.
