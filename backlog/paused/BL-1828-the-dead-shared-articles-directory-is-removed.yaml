id: BL-1828
title: "Once BL-1758 has removed the swarm wrapper's upstream-fetch block, swarmforge/scripts/shared-articles/ (three unused upstream prompts the old block populated) is deleted, so the starter kit stops copying dead prose into every new target, and the two test fixtures that create the directory only to skip that retired download drop it"
milestone: M8
type: chore
status: todo
epic: onboarding-target-repo
priority: 30
direction: specifier-found
depends_on: [BL-1758]
# BL-1758 removes the wrapper block that fetches an upstream archive
# whenever this directory is missing (swarm:16 on main at mint). Deleting
# the directory first would make every ./swarm launch download an unpinned
# upstream tarball (Architecture Rule 2), so this lands strictly after it.
mutation_cost: low
# low: a directory removal and two fixture lines; no production logic.
slice_size_envelope: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]

# A removal with no scenarios of its own (BL-1251): the pointer names
# BL-1758's feature, the starter-kit contract this removal must keep green
# (0 of 7 on main at mint only because BL-1758's handlers ride its parcel).
# It is not a claim of ownership over BL-1758's contract.
acceptance: specs/features/BL-1758-a-greenfield-target-gets-a-launchable-starter-kit-from-the-local-checkout.feature

human_approval: pending
approval_context: >
  A plain cleanup, no choice posed. FIRM: it lands only after BL-1758
  (depends_on). FIRM: nothing reads the three files (census at mint below);
