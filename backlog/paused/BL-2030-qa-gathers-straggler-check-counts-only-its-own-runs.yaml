description: |
  ## What is wrong

  `extension/src/quality/qaGather.ts`'s `stragglerCheck` runs
  `pgrep -fl 'node --test|stryker|vitest'` host-wide, before and after the
  gather. Every role shares the host, so another checkout's live run (the
  hardener's Stryker, a coder seat's property lane) makes the row read as a
  QA straggler (pgrep exit 0). QA then attributes each match by hand from
  `/proc/<pid>/cwd` or its args, three times so far.

  ## What is wanted

  - The straggler rows list every matched run with the worktree it belongs
    to: the `.worktrees/<role>` checkout its working directory is under, or
    `master` for the main checkout.
  - Only a run under the worktree the gather runs from counts as a
    straggler. The row keeps pgrep's reading: exit 0 when the gathering
    worktree has a straggler, 1 when it has none. The excerpt still names
    every matched run, with its worktree.
  - The main checkout contains every `.worktrees/<role>` path, so "under the
    gathering worktree" never means a plain prefix match on the main
    checkout's path.

  ## How (direction, not mandate)

  - A small classifier over (pid, args, cwd) rows, pure and unit-testable,
    with the /proc read as the IO edge (engineering: CLI main is a thin
    wrapper). The check's `build` may call a small compiled CLI in place of
    pgrep.
  - The handler starts real short-lived processes whose args contain the
    pattern's tool name (for example, `node -e` with a sleep and a
    `vitest` argument) with their cwd in fixture dirs laid out as
    `<root>/.worktrees/QA`, `<root>/.worktrees/hardender` and so on under
    mkdtemp. It runs the check with the fixture's QA dir as the gathering
    root, asserts only about its own fixture runs, and kills only the
    processes it started. The host's real runs match too and are foreign
    by construction. Validate `<tool>`, `<worktree>` and `<verdict>`
    against explicit known values.
  - BL-2024 (paused) also edits `qaGather.ts` (it skips two lanes for a
    backlog-only parcel). The two are independent but touch the same file,
    so they should not run concurrently.

