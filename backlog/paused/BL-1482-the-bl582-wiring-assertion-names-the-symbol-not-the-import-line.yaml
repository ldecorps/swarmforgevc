id: BL-1482
title: "BL-582's acceptance handler pins the front desk's commitIntegrityRunner import as a two-token line literal, so BL-1368's second imported name (humanDecisionCommitMessage, landed 2026-09-05) turns scenario 05 red on main (hidden by the per-feature runner, found 2026-09-08 by the coder batch-verifying BL-1475); the wiring assertion names the symbol and the module it protects instead of the whole line"
milestone: M8
type: defect
severity: high
# high (standing-red rule 2026-09-05): an acceptance-lane feature red on
# main since 2026-09-05, deterministic, now a register row. The production
# wiring it guards (both approval commit adapters bound to the one
# commitApprovalWrites) is intact; the broken thing is the safety signal,
# which is exactly what the rule refuses to call medium.
status: todo
epic: swarm-reliability
