milestone: M8
type: defect
severity: medium
status: todo
epic: swarm-reliability
priority: 152
direction: normal
depends_on: []
assigned_to:
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]

invariants:
  - "No success assertion in this test can pass when swarm_handoff.bb exits non-zero, prints no success line, or queues no parcel — widening a stale literal must not make the check vacuous."
