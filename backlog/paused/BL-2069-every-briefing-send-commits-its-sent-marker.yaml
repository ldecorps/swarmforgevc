id: BL-2069
title: "Every briefing send commits its sent marker: from 2026-10-02 to 2026-10-07 each logged commit of docs/briefings/.sent.json failed - three times because the daemon's root was relative and `git add` ran inside docs/briefings with a repo-relative path, twice on a held index lock - so the markers reached git days late by hand, and 10-07's not at all"
milestone: M8
type: defect
severity: high
# high: a broken record - the sent marker is BL-821's cross-host "mailed
# exactly once" guard and the one record of when a briefing went out; it
# has not reached git on its own for six days, a hand commit was needed to
# unblock the reconcile on 2026-10-06, and BL-1880's QA bounce came from
# reading it.
status: todo
epic: code-quality-gates
