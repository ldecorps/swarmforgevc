acceptance: specs/features/BL-2069-every-briefing-send-commits-its-sent-marker.feature

required_wiring:
  - 'specs/pipeline/steps/bl2069BriefingMarkerCommittedSteps.js::registerSteps::the handler lands in the same parcel as the feature (BL-233, BL-1371)'
# No production anchor on purpose (BL-1235): handoffd.bb already passes
# briefing-email-lib/commit-sent-marker! as :commit-marker!, so any pattern
# on it matches before and after. The scenarios must drive the REAL
# send-unsent-briefings! with the REAL commit-sent-marker! over a fixture
