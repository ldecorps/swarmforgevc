description: |
  Status: hotfix 93a21154d6 landed the fix. The coder reviews it and never
  re-applies it.

  Local-model (qwen) and Claude TUIs run in tmux's alternate screen, so
  `history_size` stays 0 and `capture-pane` only returns the painted frame
  (~24 rows). Humans can scroll inside the agent UI to the welcome screen;
  the Mini App / Resident Spy could not.

  The hotfix: host-side accumulation (BL-070 `accumulatePaneHistory`) in
  `extension/src/bridge/residentPaneHistory.ts`, wired through
  `residentPaneLive.ts` with a 500ms poller while the spy is open; qwen
  footer chrome (`➜`, box rules, Type your message, Working…) detected in
  `paneHistory.ts` / `media/panel.js` so status rows are not duplicated;
  Expand in `residentSpyUiHtml.ts` opens pinned to the live tail and
  unpins when the human scrolls up.

  The review asks: does accumulation ever drop mid-turn content between
  polls? Does qwen chrome ever leak into retained history? Does Expand
  ever open at the top of a long transcript or yank the user while they
  are reading history?

qa_e2e_procedure: |
  On the parcel commit, ONE run.
  1. `cd extension && npx vitest run test/residentPaneHistory.test.js test/footerDetectionParity.test.js test/paneHistory.test.js test/residentSpyUiHtml.test.js test/residentPaneLive.test.js`:
     all green (measured at mint).
  2. Read the coder's committed review evidence.
  3. On the phone Mini App, Expand a busy Slevin seat after it has been
     working: the view starts at the live tail; scroll up shows earlier
     tool output, not only ~24 rows.

source: |
