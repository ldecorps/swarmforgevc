notes: |
  Sibling tickets from the same intake: BL-815, BL-816.

  Recurrence history worth keeping in front of whoever fixes this — the same
  fixture, the same silent shape, twice:

  ```
  BL-655   handoff_lib.bb gains ambulance_lib.bb    fixture not updated -> {}
  BL-805   handoff_lib.bb gains mono_router_lib.bb  fixture not updated -> {}
  ```

  That is the argument for scenario 03. A third recurrence is a matter of
  when, and the only thing that changes the outcome is the failure being loud.

  ## IR-DRY disposition (specifier, 2026-08-05)

  The checker raises two medium-confidence findings on this feature file, both
  deliberately kept:

  - `the failure is surfaced to the caller` vs `no failure is surfaced to the
    caller` (scenarios 03/04)
  - `role "coder" holds active ticket "BL-900" ...` vs `no role holds an
    active ticket ...` (scenarios 01/02/03 vs 04)

  Both are positive/negative polarity pairs, and the distinction each draws IS
  the behaviour under test — collapsing either would delete the contract. The
  checker's own guidance is to normalize only when the differing wording is
  accidental drift; it is not. No change made.

  Background was also left minimal on purpose: the "carries every load-file
  dependency" Given cannot move into it, because scenario 03 asserts the
  opposite and a Background carrying it would contradict that scenario.

  ## E2E QA procedure (specifier, 2026-08-05)

  1. **Reproduce before fixing.** On any host, run
     `npx vitest run test/readLiveRoleHeldTicketsCli.test.js` from
     `extension/`. Confirm 2 failed / 3 passed with deep-equal `{}`, and note
     the duration — it completes in seconds. A timeout instead means you are
     looking at a different failure; stop and say so.

  2. **Confirm the mechanism directly, not through the test.** Copy the four
     currently-listed `.bb` files into an empty fixture tree and run
     `bb <fixture>/swarmforge/scripts/pipeline_stage_cli.bb report <fixture>`.
     Confirm `FileNotFoundException` naming `mono_router_lib.bb` at
     `handoff_lib.bb:28`. Add the fifth file and confirm it loads.

  3. **After the fix**: both BL-487 tests green, and step 2's five-file
     fixture still the minimal set — deleting any one of the five must still
     break it. That is what proves the copy list was not widened to
     everything.

  4. **The loud-degrade contract (scenario 03).** Delete one dependency from
     the fixture and confirm `readLiveRoleHeldTickets` surfaces a failure
     rather than returning `{}`. Then confirm the genuinely-empty case — a
     valid fixture with no role holding a ticket — still returns an empty
     result without raising. Both halves, or the change has just traded one
     indistinguishable case for another.
