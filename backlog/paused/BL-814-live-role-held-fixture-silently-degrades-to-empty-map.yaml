description: |
  ## The failure

  Two tests in `extension/test/readLiveRoleHeldTicketsCli.test.js` fail with a
  strict deep-equal, expecting `{ coder: ['BL-900'] }` and receiving `{}`:

  ```
  BL-487: reports a role-held ticket computed LIVE from the real in_process mailbox
  BL-487: a stale/absent ticket-stage-map.json cache is irrelevant
  ```

  ## Root cause, proven

  The test builds a fixture by copying the real `.bb` scripts plus their
  `load-file` dependencies into an isolated tree, then runs the REAL
  `pipeline_stage_cli.bb report` subprocess against it. Its copy list is:

  ```js
  ['pipeline_stage_cli.bb', 'pipeline_stage_lib.bb', 'handoff_lib.bb', 'ambulance_lib.bb']
  ```

  BL-805 added a new leaf dependency to `handoff_lib.bb`:

  ```clojure
  ;; handoff_lib.bb:28  (BL-805)
  (load-file (str (fs/path (fs/parent (fs/canonicalize *file*)) "mono_router_lib.bb")))
  ```

  `mono_router_lib.bb` is not in the copy list. Running the real CLI against a
  fixture built each way:

  ```
  without mono_router_lib.bb:
    java.io.FileNotFoundException: .../mono_router_lib.bb (No such file or directory)
    Location: .../handoff_lib.bb:28:1
  with mono_router_lib.bb:
    loads cleanly
  ```

  The subprocess dies, and `readLiveRoleHeldTickets` swallows the failure and
  returns `{}` — which is indistinguishable from the legitimate "no role is
  holding a ticket" answer. The test file's own BL-655 comment predicted this
  exact mode in advance:

  > omitting it here does not throw loudly, it makes the real `bb` subprocess
  > fail and readLiveRoleHeldTickets silently degrade to `{}` (a
  > missed-consumer regression this exact copy-the-real-scripts fixture exists
  > to catch).

  ## Why this is high severity, not a test-only annoyance

  The silent degrade is in `readLiveRoleHeldTickets` — production code behind
  the live board's role-held view (BL-487). Any runtime condition that makes
  that subprocess fail (a missing dep, a bb upgrade, a permissions problem)
  renders the board confidently blank rather than visibly broken. The test
  fixture is how we find out; it found out, and the finding was waved through
  twice as load noise.

  ## The two-part fix

  1. **Restore the fixture.** Add `mono_router_lib.bb` to the copy list so the
     two BL-487 tests pass again.
  2. **Make the degrade loud.** A failed computation must not return a
     legitimate-looking empty map. Distinguish "ran, found nothing" from "did
     not run" and surface the latter. Scenario 03 is the contract; the shape
     of the signal (throw, error result, logged-and-flagged) is the coder's
     design call, but a bare `{}` on subprocess failure is not acceptable.

  ## What this ticket must NOT do

  Do not make the suite green by widening the copy list to every `.bb` in the
  directory. That trades a loud, specific failure for a fixture that never
  fails and never catches the next BL-655/BL-805 recurrence. Copy what is
  actually depended on.

