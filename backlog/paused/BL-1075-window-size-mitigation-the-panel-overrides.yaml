approval_context: >
  Two calls are worth a look before this runs. First, severity `medium` rather
  than `high`: the knob is inert and the how-to overstates it, but the defence
  that actually carries the load on a vulnerable host is the tmux >= 3.7
  preference, which is landed and live. Nobody is less safe than they would be
  with the knob deleted - they are only told otherwise. Calling it `high` would
  jump it ahead of the standing high-severity defect queue for an inert option
  and a doc sentence. Second, the scope cut: the version-conditional question
  (what to do when the panel tiles a control plane older than 3.7) is
  deliberately deferred to a successor rather than folded in, because it needs
  the server-version fact BL-1069 is still building. See `notes:`.

