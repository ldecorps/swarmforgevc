  - 'specs/pipeline/steps/index.js::bl1075WindowSizeOwnershipSteps::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this feature file rather than skipping them. Verified absent from index.js at spec time, so the anchor cannot pass before the work is done'

invariants:
  - "The swarm never applies or documents a tmux option as a mitigation when a component of the same product unconditionally overrides it at a narrower scope."
  - "Dropping an inert knob never drops a live one: every option the hardening step applied before is still applied afterwards on every path that applied it, shell and Babashka alike."
  - "Tile sizing survives: for every role window the panel manages, the rows the panel asked for are the rows in force after the change, on every path that sized them before."

description: |
  ## What

  `window-size largest` is set as a stability mitigation on the swarm's
  control-plane server, and named as one in the ops runbook. It cannot take
  effect on any window the extension tiles. Stop applying and stop claiming a
  mitigation that does not hold; change nothing else.

  ## Why it cannot hold

  tmux(1) on `resize-window`: "This command will automatically set window-size
  to manual **in the window options**." A window option beats the server
  global. So every window the panel sizes is `manual` no matter what the
  server global says, and `largest` is unreachable there by construction -
  not a race, not an ordering bug, and not fixable by changing who writes
  last.

  The panel cannot simply stop sizing. A headless tmux snaps every pane to
  80x24, which caps a tile at 24 lines of a full-screen TUI; sizing is what
  makes the tiles readable at all, and it is per-role because a selected tile
  is taller than the rest (BL-040/043/051).

  ## The three writers, all on the same socket

  All of these address `<target>/.swarmforge/tmux-socket`, the one file
  `readTmuxSocket` reads and `swarmforge.sh` writes:

  - `swarmforge/scripts/swarmforge.sh:290` - `harden_tmux_server` sets
    `-g window-size largest` (and `-g focus-events off`), on the shell ensure
    path and the toplevel launch path.
  - `swarmforge/scripts/control_plane_lib.bb:191` - `harden-server!` sets the
    same two, after a plane restore and when the plane is already `:up`.
  - `extension/src/panel/paneTailer.ts:226,229` - `applyPaneSettings` sets
    `-g window-size manual` and then calls `resizeWindow` per role. It runs on
    panel start and again on every socket change and role-set change, so it
    re-asserts continuously while the panel is open.

  Note that the panel's own `setWindowSizeManual` is not the load-bearing
  half. Deleting it would change nothing: `resizeWindow` sets the window
  option regardless. Any fix that only removes the global setter and declares
  victory has not moved the behaviour - confirm against a live server, not by
  reading the call sites.

  ## What is in scope

  1. The hardening step stops applying a window-size it cannot keep, on all
     four call paths, shell and Babashka.
  2. `focus-events off` is untouched. Nothing overrides it and it stays
     applied on every path that applied it before (invariant 2). Deleting
     `harden_tmux_server` / `harden-server!` wholesale is the wrong fix.
  3. `docs/how-to/BL-tmux-wsl-segfault-upgrade.md:43-44` stops naming a
     window-size option among the soft mitigations. The sentence that
     survives must still say what does carry the load - the version upgrade.
  4. Tiles keep sizing exactly as they do today (invariant 3).

  ## How (direction, not mandate)

  The obvious shape is to drop the window-size line from both hardening
  functions and the doc list. It is not mandated: an implementation that
  keeps a window-size decision somewhere it actually holds - for instance at
  the same scope the panel writes - satisfies the invariants equally, as long
  as it does not fight the panel and does not change what the tiles get.

out_of_scope: |
  - **The version-conditional refusal.** What the swarm should do when the
    panel is about to tile a control plane running a tmux older than 3.7 -
    where `resize-window` arms WINDOW_SIZE_MANUAL per window and the version
    upgrade is the only real defence - is the successor ticket, not this one.
    See `notes:` for why it is cut here rather than folded in.
  - Re-opening anything in BL-1069. That ticket stamps the landed hotfix; the
    finding here came out of its own review goal 4 and belongs in a narrow
    follow-up by that ticket goal 6, which is this.
  - The tmux installer, the version warn, and the PATH preference - all
    BL-1069.
  - Changing how tiles are sized, how many rows they get, or the per-role
    sizing rule.

qa_e2e_procedure: >
  1. **Reproduce the inertness at the parent commit.** On a live swarm, run
  `./swarm ensure`, then read `tmux -S "$(cat .swarmforge/tmux-socket)"
  show-options -gv window-size` and confirm it is `largest`. Open the
  extension panel, wait for the tiles to populate, and read the same option
  per window with `show-window-options -v window-size -t <role>`: confirm
  every tiled window answers `manual` while the global still answers
  `largest`. That pairing is the defect - the global mitigation is set and
  unreachable at the same time. 2. **At the parcel commit**, repeat: confirm
  no window-size mitigation is applied at a scope the panel overrides, and
  that the tiled windows are unchanged from step 1. 3. **The live knob
  survives.** Confirm `show-options -gv focus-events` is `off` after each of
  the four paths in scenario 02: a full `./swarm` launch, `./swarm ensure`
  with the plane up, `./swarm ensure` after a `kill-server` restore, and the
  Babashka already-up path. 4. **The tiles are untouched.** With the panel
  open, select a tile so it grows and confirm the selected role window
  reports the taller row count and the others keep theirs, matching what the
  same steps produce at the parent commit. 5. **The runbook is honest.** Read
  `docs/how-to/BL-tmux-wsl-segfault-upgrade.md` end to end and confirm it
  names no window-size option as a mitigation, and still says plainly that
  the version upgrade is what protects the host. 6. **Record the degraded
  gate explicitly.** The swarm-side half is shell + Babashka, for which no
  mutation, CRAP or DRY tooling is wired - that half is gated by the runners
  under `swarmforge/scripts/test/` plus these scenarios. The
  `extension/src/panel/paneTailer.ts` half is TypeScript and IS covered by
  the normal mutation/CRAP/DRY tooling; do not let the shell fallback excuse
  the TypeScript side.

notes: |
  ## Provenance

  Reported by the coder while working BL-1069, as note
  `00_20260822T201631Z_000812_from_coder_to_specifier`: "BL-1069 found:
  window-size largest fights extension window-size manual". Minted here per
  BL-1069 review goal 6 ("Open narrow follow-up tickets for anything found;
  do not widen here").

  The coder read it as a fight between two writers of the server global. It
  is worse than that and the specifier verified it against tmux(1) before
  minting: the panel's per-window `resize-window` sets the window option, so
  the global loses on tiled windows unconditionally. There is no ordering in
  which `largest` wins there.

  ## Disposition for BL-1069 itself: nothing to fix, stamp it

  BL-1069 review goal 4 asks whether `window-size largest` affects the tiles
  and says "Confirm the capture path is unaffected, or say what changes". The
  answer is that the capture path is unaffected, precisely because `largest`
  never reaches a tiled window. BL-1069 records that as its goal 4 finding
  and stamps; it is not a bounce and BL-1069 does not widen to fix this.

  ## Why the version-conditional half is a successor, not part of this

  On a control plane older than 3.7, the panel arms WINDOW_SIZE_MANUAL per
  window and that is the documented segfault trigger. Deciding what the swarm
  should do about that - refuse to tile, warn, or size differently - needs
  the server-version fact BL-1069 is building (its review goal 1 moves the
  version judgement off `tmux -V` and onto the server on the socket). Folding
  it in here would make this slice depend on unlanded sibling work and fail
  INVEST-I. It is also not a risk this ticket introduces or removes: that
  exposure exists identically before and after, and the defence against it is
  the tmux >= 3.7 preference, which is already landed and live. Mint the
  successor once BL-1069 lands.

  Per BL-1006, that boundary is stated in the `Feature:` narrative and here,
  and deliberately NOT frozen into an executable scenario - it would go red
  the moment the successor ships.

  ## Orthogonality warning for the coordinator

  This ticket touches `swarmforge/scripts/swarmforge.sh` and
  `swarmforge/scripts/control_plane_lib.bb`, which are the same files
  BL-1069 has under review, and it touches
  `docs/how-to/BL-tmux-wsl-segfault-upgrade.md`, which BL-1069 landed. Do not
  promote this concurrently with BL-1069 (Concurrent Work Orthogonality).
  Promote it after BL-1069 closes.

  ## Severity rationale

  `medium`, deliberately. The knob is inert and the runbook overstates it,
  which is a real defect in a safety-adjacent document. It is not `high`
  because nothing is actually less protected than it would be with the knob
  absent: the protection that works is the tmux >= 3.7 preference, landed and
  live. Rating it `high` would put it ahead of the standing high-severity
  defect queue (Article 3.2.4) for an unreachable option and one doc
  sentence, which it does not deserve.

  ## Bash 3.2 target

  `swarmforge.sh` targets stock macOS `/bin/bash` 3.2. Any repair must stay
  3.2-safe; a new array expansion must use `${arr[@]+"${arr[@]}"}` (BL-801).

  ## IR-DRY judgment recorded: 1 finding -> 1 resolved

  A medium-confidence possible-synonym (score 0.667) between scenario 01 When
  "the swarm hardens that server" and scenario 02 When "the swarm hardens
  that server on the <path> path". Real drift, not deliberate contrast: 01
  asserts what the hardening step does and is path-agnostic, while 02 asserts
  that each call site still reaches it. Scenario 02 was reworded to "the
  swarm reaches the <path> path", which says what it actually tests. Re-run
  is clean: 13 step occurrences, 12 unique, 0 findings.

  A Background was considered for the shared Given in 01 and 02 and declined:
  scenarios 03 and 04 need no live server, so hoisting it would change what
  they assert.

