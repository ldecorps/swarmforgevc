source: |
  The swarm has EIGHT agents that are not pipeline roles, and no document says so,
  names them as a set, or explains what makes them different. Launchers under
  `swarmforge/scripts/`:

  ```
  babysitter            front_desk            front_desk_operator
  negotiation_relay     onboarding_facilitator   operator
  resident_spy_tunnel   support
  ```

  Plus the **Expeditor**, which is not a launched agent at all but a driver that
  wears every pipeline hat in turn — a third category again.

  Documentation coverage is uneven and nobody planned the unevenness. Counting
  non-briefing, non-archive files under `docs/`:

  ```
  operator 21 · support 9 · onboard 6 · expeditor 5 · front desk 5 · babysitter 5
  model steward 3 · negotiation 2 · facilitator 1 · resident spy 0
  ```

  Four of the eight have no role prompt either (`onboarding_facilitator`,
  `negotiation_relay`, `front_desk_operator`, `resident_spy_tunnel`), so for those
  there is no authored description of their behaviour anywhere.

  ## Re-measured 2026-07-26 — three irregular cases the table must EXPLAIN

  Verified against the repo while BL-684 was specced. Every count above still holds,
  and the mapping is less tidy than "eight agents, eight prompts, eight launchers":

  - **`launch_*` scripts:** 9 files, but `launch_contract_lib.bb` is a library, not an
    agent — so eight launched agents, as stated.
  - **A prompt with no launcher:** `swarmforge/roles/model-steward.prompt` exists and
    the model steward has 3 doc files, but there is no `launch_model_steward.sh`. It
    is a non-pipeline agent that is not started like the others.
  - **A launcher whose prompt is named for the ROLE, not the launcher:**
    `launch_front_desk.sh` has no `front_desk.prompt`; the authored description lives
    in `support.prompt`. That is why the naive count says "four with no prompt" — the
    front desk is covered under another name.

  So the enumeration is a MEASUREMENT to redo at writing time, from the repo, and the
  table must have a row for each irregular case with the irregularity explained. An
  agent silently omitted because it did not fit the table's shape is the exact failure
  this ticket exists to end.

  ## The naming question, with the evidence

  "Onboarder" appears in exactly TWO tracked files, and both are BL-590's own —
  quoting the operator in its `source:`:

  > "BUILD THE ONBOARDER, do not hand-run a one-off runbook."
  > "give the onboarder a repo URL"

  **"Onboarder" was the human's word first.** "Facilitator" entered at
  implementation and now carries **36 files**: the ticket, its feature file, the
  launcher, the supervisor, the state machine, the store, the reconcile CLI, the step
  handlers, the Telegram topic subject.

  So this is not bikeshedding — it is a documented drift from the word the person who
  asked for it used, into vocabulary invented while building it.

description: |
  ## The name is RULED — this ticket no longer decides it

  The three-way choice this ticket was filed to force is CLOSED: the human ruled
  **full rename to "Onboarder"** on 2026-07-26 (see `approval_context`). The rename
  itself is **BL-684**, its own parcel, and this ticket now declares
  `depends_on: [BL-684]` so criterion 1 is enforced by data rather than by a reader
  noticing a sentence. Nothing here re-opens the naming question; the remaining work
  is prose.

  Two premises in this ticket's original argument were checked against the repo while
  BL-684 was specced, and one of them was wrong:

  - **Wrong: "a live Telegram topic subject ... user-visible in that topic."** There
    is no user-visible `Facilitator` string anywhere. The reserved topic is created
    from `ONBOARDING_TOPIC_NAME` (`telegram-front-desk-bot.ts:782`) — the human
    already reads "Onboarding". BL-684 therefore needs no Telegram work at all.
  - **Right, and now measured: the word is still spreading.** 36 tracked files on
    2026-07-25; 49 files and 456 occurrences on 2026-07-26.

  ## Then document the CLASS, not just two members

  The operator asked about two agents, but the missing thing is the category. A
  reader cannot currently answer: what is a non-pipeline agent, what may it do that a
  role may not, how is it started and stopped, who supervises it, and where do its
  logs go?

  Suggested Divio placement (specifier's call):

  - **explanation/** — what makes an agent non-pipeline. They hold no ticket, appear
    in no `roles.tsv` chain, and are not bounded by the pipeline's gates. Some are
    conversational (Onboarder, Support), some are supervisory (Operator, babysitter),
    some are transport (front desk, negotiation relay, resident spy tunnel), and the
    Expeditor is none of these — it is a driver that *wears* the pipeline hats. That
    taxonomy is the document's spine.
  - **reference/** — one table: every non-pipeline agent, its launcher, its stop
    path, whether it has a role prompt, where its log lives, and whether
    `start_ancillary_services.sh` manages it. That table would have made BL-637 and
    BL-611 obvious months earlier.
  - **how-to/** — the Onboarder's operational guide, once its name is ruled and its
    slices are built.

  ## What is already written, and must not be duplicated

  The **Expeditor is done**: `docs/how-to/BL-567-…`,
  `docs/explanation/BL-567-why-the-expeditor-commands-the-stack…`, and the full
  `docs/reference/BL-567-expeditor-manual.md`. This ticket should LINK those from the
  class document, not restate them. Restating is how two descriptions drift apart.

  ## Honest constraint on the Onboarder half

  **BL-590 is parked in `hold/` at architect bounce #6, and slices 2 and 3 are
  unbuilt.** Documenting it "at length" now would document something in flux — the
  exact failure mode of writing docs ahead of behaviour.

  So scope the Onboarder documentation to **what slice 1 actually shipped** (its own
  Telegram topic, the prerequisites state machine, per-target state, restart
  resume), state plainly that survey/gate/prompts/launch-handoff are not built, and
  say which ticket owns each. A doc that describes unbuilt behaviour is worse than a
  missing one, because a reader cannot tell which half is real.

acceptance: specs/features/BL-643-non-pipeline-agents-documented-as-a-class.feature

out_of_scope: |
  - Building anything, and that now explicitly includes the rename: **BL-684 owns it**
    and this ticket depends on it. If a documenter finds live code still saying
    `facilitator`, BL-684 is incomplete — bounce it there rather than renaming here.
  - Re-deciding the name. Ruled 2026-07-26; `approval_context` records it.
  - Finishing BL-590. It is parked; see `backlog/evidence/BL-590-parked-20260725.md`.
  - Retiring the babysitter agent — BL-611 owns that; this ticket documents whatever
    state it is in when written.
  - Writing role prompts for the four agents that lack them. Worth its own ticket if
    the specifier thinks they need one.

notes: |
  The naming half was time-sensitive in a way documentation usually is not, and it is
  now DISCHARGED: ruled 2026-07-26, carved out as BL-684, and this ticket blocked
  behind it. The urgency was real — 36 tracked files on 2026-07-25 became 49 on
  2026-07-26 — and BL-624/BL-625 would have added more. The one claim that did not
  survive checking is the Telegram one: no user-visible `Facilitator` string exists,
  so the rename touches nothing the human reads (BL-684 `source:` has the measurement).

  Worth stating in the explanation doc, because it is the thing a newcomer gets wrong:
  a non-pipeline agent is NOT a lesser role. The Operator supervises the swarm from
  outside it; the Expeditor can drive the entire pipeline with the swarm stopped.
  "Non-pipeline" describes where they sit, not how much authority they have.

  ## Promoted from draft to executable, 2026-07-27 — three decisions recorded

  **1. Why the coder stage came back.** These scenarios are repo assertions —
  enumerate the launchers, resolve each printed path — of exactly the shape
  `specs/pipeline/steps/bl684OnboarderRenameSteps.js` already implements. They are
  executable, so they need a handler file, and a handler file is a test. The
  documenter may not write tests (documenter.prompt, "Does Not Own"), so the stage
  that lands them is the coder.

  **Who writes what, and why in that order.** The chain runs coder → … →
  documenter → QA, so a deliverable authored at the documenter's stage cannot be
  verified by a gate that runs before it. Therefore the CODER lands the two
  documents AND their verifier in one green parcel; the DOCUMENTER's pass is its
  own proper work and is not a formality — Divio mode placement, the `docs/index.md`
  links scenario 08 gates, prose currency, and consistency with what the code says
  today. If the documenter judges the coder's placement or framing wrong, that is a
  normal documenter edit, not a bounce.

  **2. One scenario was retired, not reworded.** The draft's scenario 01 ("no
  document calls the agent a facilitator") is gone. BL-684 shipped, and it shipped
  its own permanent gate for that check — its feature scenario 01 plus
  `extension/test/onboarderRenameNoResidualFacilitator.test.js`. A second gate over
  one behaviour is dead weight, and restating it here would have forced this feature
  file into BL-684's residual-word allowlist to buy nothing. The other half of the
  retired scenario ("the rename parcel has already landed") is now carried as data:
  `depends_on: [BL-684]`, which this ticket's own description already argued for.

  **3. Promotion hazard — read before moving this ticket to `active/`.** THIS FILE's
  content legitimately still contains the retired word (it is the ticket that raised
  the naming question), and it is grandfathered by EXACT PATH —
  `backlog/paused/BL-643-…` — in that residual-word test's allowlist. Moving it to
  `backlog/active/` therefore turns the test red without changing a byte of its
  content. That is **BL-694**, already specced and reproduced when BL-590 was
  unparked. Land BL-694 first, or expect one red test on promotion. The feature file
  itself is clean: it names the retired word nowhere, so it needs no allowlist entry.

  ## End-to-end QA procedure

  1. `specs/pipeline/scripts/run_acceptance.sh specs/features/BL-643-non-pipeline-agents-documented-as-a-class.feature`
     — all 8 scenarios pass (the outlines expand to 6 + 3 + 3 rows).
  2. Re-derive the enumeration by hand at the QA commit — `ls swarmforge/scripts/launch_*.sh`
     minus the library — and confirm the table's row set matches, including the three
     irregular cases the ticket's `source:` names. Scenario 01 automates this; QA
     confirms the handler's enumeration is the repo's, not a hardcoded list.
  3. Spot-check three table rows by resolving their launcher, stop path and role
     prompt against the working tree. A path that resolves only because the handler
     normalised it is a defect, not a pass.
  4. Read the Onboarder section against `git log main -- extension/src/onboarder*`
     and confirm every behaviour described is on `main`, and every unshipped phase
     names its owning ticket (BL-624, BL-625).
  5. Confirm `docs/index.md` links every added document, in the same commit.
