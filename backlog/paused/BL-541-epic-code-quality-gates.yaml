  - "Unbound closed-ticket features - MINTED 2026-10-04. The census (backlog/evidence/BL-1937-closed-tickets-features-with-no-step-handler-census-20261003.md) found 55 closed tickets' acceptance features with no step handler; BL-1937 binds BL-096. The human ruled A on 2026-10-03 (specifier role_ask, verbatim: A - register all 54 now (throttles intake)) and all 54 were registered (7ac0a7826f). Adjudication (backlog/evidence/BL-541-unbound-feature-adjudication-20261004.md): 11 parked debt/ features became .feature.draft (cbf3e77ad9), 14 were retired whole and 18 scenarios retired from 14 more (df3fda6d4e), and the 29 left are bound by BL-1939 to BL-1948, each owning its features' register rows."
