  - "BL-973's closure guard hand-enumerates WHICH fixtures it guards (bbFixtureClosureGate.js FIXTURES, nine entries on 2026-09-07); every fixture not in the map rots beside a green guard. Third occurrence: BL-973 (5), BL-1279 (4 front-desk fixtures), BL-1480 (2 promote_and_route_next fixtures). Derive membership from the fixtures themselves (every shell test or step file that copies .bb files), so an unenrolled fixture is impossible. Recorded as a candidate follow-up in BL-1279's notes; promoted here to a tracked slice."

