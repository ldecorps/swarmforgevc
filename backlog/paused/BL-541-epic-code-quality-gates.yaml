remaining_slices:
  - "BSD-vs-GNU userland portability sweep of the shell surface. BL-1058 fixes the one live mktemp break; the mirror bombs are still there - four test scripts call GNU-only `sed -i` with no suffix operand, which is exactly what BL-803 had to fix in promote_and_route_next.sh for the other direction. Precedent for the fix shape already exists in swarmforge/scripts/portable_stat_lib.sh."
  - "Nothing runs the shell test suite on both userlands, which is the reason BL-1058 shipped green on macOS and went dark the moment the host moved. There is no CI lane for it at all (.github/workflows/ carries only dashboard and intake jobs). Until something exercises the suite on both, a platform-dialect regression is only ever found by a migration."
  - "promotion_gates_cli.bb (lines 130-139) falls back to parse-max-depth and then the DEFAULT cap of 5, silently, when effective_backlog_depth_cli.bb exits non-zero - a dead effective-cap CLI reads as a real depth refusal. Found 2026-09-07 via BL-1480 (a fixture whose copied CLI died at load failed with 'active count 5 >= cap 5' against a configured -1). Make the fallback loud (log the exit and stderr head) or refuse; kept off BL-1480 to keep that slice to the fixtures."
  - "BL-973's closure guard hand-enumerates WHICH fixtures it guards (bbFixtureClosureGate.js FIXTURES, nine entries on 2026-09-07); every fixture not in the map rots beside a green guard. Third occurrence: BL-973 (5), BL-1279 (4 front-desk fixtures), BL-1480 (2 promote_and_route_next fixtures). Derive membership from the fixtures themselves (every shell test or step file that copies .bb files), so an unenrolled fixture is impossible. Recorded as a candidate follow-up in BL-1279's notes; promoted here to a tracked slice."

source: "Human hygiene 2026-07-19: every ticket must have an epic; every epic must have a milestone. Tracker created during open-backlog cleanup."

