qa_e2e_procedure: >
  Read the how-to and follow it literally, without consulting any other page.
  Copy a live pack to a fixture, apply the documented add step verbatim, and run
  `SWARMFORGE_TERMINAL=none ./swarm <root> --pack <fixture>` far enough to parse:
  the stage must come up with two seats, each on the model the page said to
  write. Apply the documented removal step and re-parse: one bare seat. Then
  deliberately break the documented constraint — declare `<stage>@<seat>` with no
  bare seat — and confirm the parse refuses with the message the page warns
  about. Finally run the steward command the page names for the role and confirm
  it prints a ranked list the tier guidance can actually be read against.

notes: |
  ## Premise verified before minting, and it did not hold

  Grepped for the "existing recommendation" the intake asked to reword:
  `role instance`, `add a role`, `remove a role` across `extension/src`,
  `swarmforge/scripts` and `docs/` returned nothing, and `stageDwell.ts` /
  `stage-dwell-report.ts` contain no recommendation text — only the bottleneck
  naming. Recorded here so the next reader does not go looking for it.

  ## One invariant, deliberately

  Only one property holds across all four scenarios: no documented step is
  believed on prose alone. Manufacturing a second or third to fill the field
  would be padding on a slice this size.

  ## IR-DRY judgment recorded

  One `possible-synonym` finding at 0.5, kept: "a fixture pack with two seats of
  one stage" is a Given that SETS UP that state in scenario 02, while "the stage
  has two seats" is the Then that ASSERTS it in scenario 01. Setup and assertion
  are not drift, and collapsing them would make scenario 02 assume what
  scenario 01 proves.
