approval_context: >
  A premise correction to approve, then one choice. The intake asks to "make the
  existing 'add/remove a role instance' recommendation map to a documented
  operator step". There is no such existing recommendation: grepped
  `extension/src`, `swarmforge/scripts` and `docs/` for "role instance",
  "add a role" and "remove a role" — zero hits. The optimizer instrument
  (`extension/src/metrics/stageDwell.ts`) names a bottleneck stage and emits no
  recommendation text at all. So there is nothing to reword, and this ticket
  writes the operator step that was assumed to exist.
  The choice is whether it stays documentation. Writing the how-to closes the
  operator gap today at low cost. Making the optimizer EMIT the recommendation
  puts the advice where the bottleneck is already named, but it is real code on
  a live instrument and a bigger slice than the intake budgeted.
ruling_options:
  - Docs only - write the how-to now, leave the optimizer emitting no recommendation
  - Docs now and mint the optimizer-emits-a-recommendation slice as its own child
  - Docs plus emit - build the optimizer recommendation in this same slice

invariants:
  - "Every command and window line the how-to prints is exercised against a real pack parse by this ticket's own scenarios — no step is asserted in prose alone."

description: |
  ## Gap

  BL-982 (landed) lets a pack declare a second seat of one stage with its own
  model; BL-1001 (landed) routes work between seats by ticket difficulty. The
  optimizer names a bottleneck stage. Nothing joins them up: when the
  coordinator is told the coder stage is the bottleneck, no page says how to add
  a seat there, how to take it away again, or WHICH model tier to add when the
  constraint is capacity at a particular difficulty band rather than raw speed.

  ## Wanted

  A how-to under `docs/how-to/` covering, for an operator who has just been
  handed a named bottleneck:

  - the exact `window` line that adds a second seat of a stage, with its own
    `--model`, and the exact edit that removes it again;
  - the constraint a second seat cannot violate — a stage declaring an extra
    `<stage>@<seat>` must also declare its bare stage-named seat, because
    parcels address the stage (enforced today in `parse_config`,
    `swarmforge/scripts/swarmforge.sh`);
  - which model tier to add for a difficulty band, and the steward command that
    lists the models ranked for that role
    (`model-steward role-matrix <role>`, `swarmforge/scripts/model_steward_cli.bb`);
  - a pointer to BL-1001's existing page for how work is then split between the
    seats, rather than restating it.

  ## Why the scenarios exercise a pack parse

  A how-to whose commands are only asserted in prose rots silently — and this
  one prints a `window` line whose grammar `parse_config` enforces and has
  changed before (seat ids, the bare-seat requirement, receive modes,
  propagation). The acceptance here runs the documented line through a real pack
  parse so the page cannot drift away from the parser without going red.

  ## Not this slice

  - Making the optimizer emit the recommendation (see `ruling_options`).
  - Any change to how work is routed between seats — BL-1001 owns that and has
    shipped.
  - The dwell fold: BL-1319, minted from the same intake.

