description: |
  ## What

  New file `swarmforge/packs/candidate-diversified-fallback-mono-router.conf`,
  a `config rotation router` pack with the same config block as
  anthropic-mono-router.conf, whose window lines are (agent syntax per
  the shipped packs: `window <role> cursor <role> --model auto`,
  `window <role> codex <role> --model gpt-5.3-codex`, the Qwen Token Plan
  line as qwen-mono-router.conf writes it):

  | seat | agent | model | plan |
  |---|---|---|---|
  | coder (HOME) | codex | gpt-5.3-codex | OpenAI |
  | specifier | cursor | auto | Cursor |
  | cleaner | cursor | auto | Cursor |
  | architect | codex | gpt-5.3-codex | OpenAI |
  | hardender | cursor | auto | Cursor |
  | documenter | aider or the qwen line the shipped qwen pack uses | qwen3.7-plus | Alibaba Token Plan |
  | QA | cursor | auto | Cursor |
  | coordinator | per human_ruling | | |

  Header: the role -> agent -> model table with one line of rationale per
  seat (score and evidence ref from the steward, why this plan and not a
  repeat of the previous seat's), the plan-diversity intent, which
  coordinator picks were proven live and which were not, PREREQ (keys
  by env var name only, never a value), and the LAUNCH line - the
  bob-multi-provider-mono-router.conf convention.

  ## Why

  anthropic-mono-router.conf is the tier-1 fallback already; this is the
  tier-2 pack for two plans down at once, so the swarm degrades one tier
  per exhausted plan instead of stopping.

  ## Scenario notes for the coder

  - Scenario 01 parses the pack with the launcher's `parse_config` and
    resolves each line's provider through `pack_staffing_gate_lib.bb`'s
    own lookups (agent-model-providers, api-base-host-providers).
  - Scenario 02 runs `bb model_steward_cli.bb eligible <provider>/<model>
    --role <role>` per line, no `--override-uncertified`.
  - Scenario 03: `env -u PACK_STAFFING_SKIP_GATE bb pack_staffing_gate_cli.bb
    <root> <conf>` - every window row `pass` (decide the variable in the
    handler; BL-1485).
  - Scenario 04 reads the header and the coordinator config lines against
    the ticket's `human_ruling`.
  - If gpt-5.3-codex or qwen3.7-plus fails the gate or eligibility on the
    real registry, STOP and note the specifier with the verdict - the
    pick is the operator's to change, not the coder's.

  ## Not in scope

  - Running a coordinator trial (a separate ticket if option 2 is ruled).
  - Changing any existing pack; automatic switching between packs.

qa_e2e_procedure: |
  1. `env -u PACK_STAFFING_SKIP_GATE bb swarmforge/scripts/pack_staffing_gate_cli.bb
     . swarmforge/packs/candidate-diversified-fallback-mono-router.conf`
     -> every window line `pass`.
  2. For each line: `bb swarmforge/scripts/model_steward_cli.bb eligible
     <provider>/<model> --role <role>` -> eligible.
  3. `SWARMFORGE_TERMINAL=none ./swarm <scratch-root> --pack
     candidate-diversified-fallback-mono-router` on a scratch root with
     fake keys reaches the staffing gate with every seat `pass` (the
     launcher may then fail on missing real keys - that is after the
     gate, and expected).
