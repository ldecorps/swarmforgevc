id: BL-966
title: "effective_backlog_depth_cli silently returns a different cap per checkout - worktrees lack .swarmforge/ so the identity fallback yields 3 while master resolves 7, with no warning (fail-open on a governance constant)"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarm-reliability
human_approval: approved
priority: 30
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-966-depth-cli-same-answer-from-every-checkout.feature

invariants:
  - "For one repository, the depth resolution returns the same cap from the master checkout and from every linked worktree of it - two checkouts of the same repo can never disagree silently (the BL-897 mirrored-constant shape, across checkouts)."
  - "A cap that does not derive from a resolvable swarm-identity is never returned silently: the fall-through to the tracked default conf is surfaced on stderr; a genuinely never-launched repo still gets the default value with exit 0, just never quietly."
  - "A non-git scratch root (the existing test-harness shape: a plain temp dir) keeps resolving against the given root with today's stdout and exit code - the fix must not require fixtures to be git repositories; only the new stderr fall-through notice may appear there, and any harness asserting empty stderr is adjusted in the same parcel."

description: >
  Severity rationale: medium - live promotion is unaffected (the coordinator
  runs from master, which resolves correctly), but every role following the
  CLI's documented usage from its own worktree receives a confidently wrong
  governance constant with no signal, and this is the THIRD depth-cap
  confusion incident in two days (BL-961's hold cited 2 from the wrong pack
  conf; the all-roles broadcast said 7; the architect measured 3).

  Measured (coordinator evidence
  backlog/evidence/...resolves-differently-per-worktree-20260820.md, commit
  d0c649827; specifier re-reproduced both values): from the master checkout
  the CLI returns 7 (swarm-identity present, launch_pack full-forge ->
  packs/full-forge.conf); from .worktrees/coder it returns 3
  (swarm-identity MISSING - .swarmforge/ is master-checkout runtime state
  that no worktree has - silent fall-through to tracked
  swarmforge/swarmforge.conf). No warning, no nonzero exit, nothing on
  stderr. Raised by the architect (note 20260819T235853Z_000270)
  challenging the coordinator's cap-is-7 broadcast; coordinator verified
  and ruled 7 operative.

  Mechanism (specifier probe): the CLI is a thin loader; the resolution
  lives in backlog_depth_lib.bb (~line 115), which reads
  swarm_identity_lib's identity AT the caller-supplied project-root and
  falls back to the tracked default conf when absent. Also found while
  probing: promote_and_route_next.sh line 94 calls this CLI with stderr
  swallowed (2>/dev/null || true) - today it runs from master so promotion
  is correct, but the promotion path itself shares the silent-fallback
  fragility if ever invoked with a worktree root.

  Fix wanted: the depth resolution finds the repository's master-checkout
  identity regardless of which linked checkout invokes it, so the
  documented usage just works from anywhere; only when NO identity exists
  for the repository (never launched) does it fall back to the tracked
  default conf, and that fall-through is loud (stderr notice; exit stays 0
  so existing scripted callers keep parsing stdout). The CLI's usage text
  states what project-root accepts.

  How (direction, not mandate): `git -C <root> rev-parse --git-common-dir`
  yields the master checkout's .git from any linked worktree; its parent is
  where .swarmforge/ lives. Degrade to the given root untouched when the
  root is not a git repo (invariant 3 - the harnesses pass plain temp
  dirs). Where the normalization lives - the depth lib's conf-path
  resolution vs a helper in swarm_identity_lib - is the architect's call;
  what must hold is the invariants. Keep the slice to the depth-resolution
  path: do NOT rewrite swarm_identity_lib's generic read semantics for
  every consumer in this parcel.

constraints: >
  Out of scope:

  - promote_and_route_next.sh's own stderr swallow and error handling -
    noted above as shared fragility; it keeps working unchanged through
    this fix. Mint separately if its handling should harden.
  - Repo-wide changes to how OTHER swarm_identity_lib consumers (ancillary
    provider routing, babysitter topology) resolve identity - same
    fallback family, different slices; this ticket fixes the depth path
    and states the pattern.
  - The throttle-recommendation and pause-marker layers of the effective
    cap - untouched; only WHERE the configured cap's conf is found changes.
  - backlog_depth_conf_path_cli.bb keeps agreeing with the main CLI - in
    scope only insofar as both must resolve identically (they share the
    lib); no separate contract change.

qa_e2e_procedure: >
  1. Live reproduction, before/after (read-only): bb
     swarmforge/scripts/effective_backlog_depth_cli.bb . and the same
     against .worktrees/coder - pre-fix 7 vs 3 silently; post-fix both
     print the same cap with clean stderr.
  2. Fixture: a scratch git repo with one linked worktree and a
     swarm-identity naming a pack conf with a distinctive cap - both
     checkouts resolve that cap (scenario 01/02).
  3. Fixture: no identity anywhere - default-conf value on stdout, the
     fall-through notice on stderr, exit 0 (scenario 03).
  4. Fixture: plain non-git temp dir root - today's behavior byte-for-byte
     (scenario 04); the existing backlog_depth lib/test runners stay green.
  5. Confirm promote_and_route_next.sh still promotes correctly from
     master in a scratch clone (its caller contract unchanged).

notes: >
  1:1 - the coordinator's mint request (note 20260820T000030Z_000635,
  evidence d0c649827, itself adjudicating the architect's challenge note
  000270) produced this ticket and no other. The coordinator's operational
  ruling stands and is not re-litigated here: 7 is operative for the live
  swarm; this ticket makes the tooling agree from every checkout.

  Hardening note: Babashka - no mutation/CRAP/DRY wired (BL-472 deferred);
  hardening gates on the lib's existing test/property runners plus the new
  scenarios, recording the degraded fallback.

  IR-DRY reviewed 2026-08-20: 3 medium-confidence possible-synonyms, kept -
  each pairs a with-identity Given against the no-identity Given, or a
  clean-stderr Then against the notice-on-stderr Then; those distinctions
  ARE the behavior under test. Scenarios 01/02 and 03/04 already share
  their exact common steps and handlers.

approval_context: >
  One design ruling to confirm: resolve-then-answer rather than
  fail-closed. From a worktree the CLI RESOLVES the master identity and
  answers correctly (rather than erroring, since a role's legitimate
  question is "what is the cap"); only a repository with no identity at
  all falls back to the default conf, loudly on stderr, exit 0. The
  stricter alternative - nonzero exit whenever identity is absent - was
  considered and set aside because a never-launched repo legitimately has
  no identity and existing scripted callers parse stdout with errors
  suppressed. Say the word for fail-closed instead and scenario 03 flips.

