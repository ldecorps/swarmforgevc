description: |
  ## Status: hotfix 81a2c737c2 landed the fix

  This parcel is its stamp-off: the pipeline's review of what landed. The
  coder finds the four files already changed. Review them, do not re-apply
  them.

  ## What the hotfix changed

  1. `swarmforge/scripts/test/test_shell_fixture_dispatch_isolation.sh`
     (BL-998 scenario 03). BL-1665's land (c0e67cd2cf, 2026-09-30) rewrote
     `grep -qE "$(execution_re "$var")" 2>/dev/null` as
     `grep -E "$(execution_re " >/dev/null$var")" 2>/dev/null`: the redirect
     went inside the argument, so the variable name became
     " >/dev/nullREADY" and no offender could ever match. The guard failed
     open for three days. The redirect is back after `grep`. Run over the
     real test directory the guard still passes, so no offender landed in
     that window. Re-check that, and grep the rest of c0e67cd2cf's 144 files
     for the same misplaced-redirect shape (the specifier's search found
     only this one).
  2. `bl1316ClaimTimeEffortSteps.js`: the fixture asserted the self-audit
     challenge exits 0, which BL-1529 changed to non-zero. The challenge is
     now told apart by its AUDIT_REQUIRED text.
  3. `bl1317AdaptEffortSteps.js`: BL-1609 refuses to complete a forwarding
     parcel nothing forwarded. The fixture completes with a stated
     `--no-op` reason, and the effort record still runs as a clean pass
     (done_with_current_task.bb signals "clean" for any forwarding inbound).
  4. `bl529TicketBranchMismatchGuardSteps.js`: BL-966's depth lookup warns
     on stderr when the swarm identity names no depth conf, and scenario
     01 requires a passing guard to print nothing. The fixture's identity
     now names a fixture conf, as swarmforge.sh writes it.

  ## What is wanted in this parcel

  - Review the four changes against the scenarios' observable claims. If
    one hides a real regression rather than a stale fixture, fix it here or
    raise it to the specifier as a note.
  - Evidence: the review, and the census of c0e67cd2cf in item 1.

  ## Scope

  The guard, the three step handlers, evidence.

qa_e2e_procedure: |
