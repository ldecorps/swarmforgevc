     5 of 5 ok. Measured at mint: 5 of 5 on the hotfix tree, 4 of 5 before.
  2. BL-529 6 of 6 (3 before), BL-1316 6 of 6 (0 before), BL-1317 3 of 3
     (2 before).
  3. `bash swarmforge/scripts/test/test_shell_fixture_dispatch_isolation.sh`
     prints PASS on the parcel commit; BL-1539 7 of 7 and BL-1665 6 of 6,
     as measured at mint.
  4. Read the coder's evidence for the review and the census.

