approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. One placement decision is firm
  unless you Amend: the dot renders at the head of the ticket's caption
  line (inside the board block, where captions already live), never in
  the fixed-width stage cells, so BL-585's width budget and your 2026-08-19
