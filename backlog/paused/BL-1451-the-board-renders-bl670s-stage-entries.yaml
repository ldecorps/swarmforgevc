id: BL-1451
title: "BL-670's ticket-stage entries (stage, status, asOf, healthDot) reach nothing that renders: the board's only input is a bare role-to-ids record, the live grid inverts the map back into it, and no health dot has ever appeared on the board (found by BL-940's coder, 2026-09-06) - the tick hands the board the entries, rows carry status and as-of, and the dot renders on the caption line"
milestone: M8
type: defect
severity: medium
# medium: a human-facing artifact lacks a promised element (the dot) and
# BL-670's invariant 2 has one consumer instead of two; nothing live is
# degraded and no safety signal is broken. Not low: the board is the
# operator's primary phone view and the dot is what BL-670 was rescoped
# to deliver.
