source: |
  Coder note 002325 (2026-10-02 09:56Z), verbatim: "unowned-red
  test_bl1366_land_is_one_command.sh: killed land left lock held". The
  specifier reproduced it (1 of 21 checks red) and found the subshell PID.

  The human, specifier pane (Claude Code), 2026-10-01, verbatim (Article
  5.3):

  > Also, update your prompt / c9 stitution: instead of minting a red, hotfix the defect and mint a stampoff.

description: |
  ## Status: hotfix 89935d52d0 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What the hotfix changed

  The killed-land case ran `( cd "$root" && bash land_main_publish.sh ... ) &`
  and sent TERM to `$!`, the subshell. The land ran on orphaned, still
  holding `.swarmforge/land-main.publish.lock`, so the case failed unless
  the land had already finished within its 2 s. The land is now `exec`'d,
  so the TERM reaches it and its trap releases the lock. 2 of 2 runs green.

  ## What is wanted in this parcel

  - Review the change.
  - Judge one production behaviour the hotfix exposed: `run_land`'s
    `trap land_release_trap EXIT INT TERM` releases the lock on TERM but
    does not exit, so a TERMed land continues afterwards, without its lock
    if it was mid-sequence. Exiting at once is not obviously right either:
    a kill mid re-point leaves a branch half-moved (operator note,
    2026-10-01). Write the reasoning in the evidence, and if the land should
    change, send the specifier a note so it is ticketed (BL-1872 edits the
    same script).

  ## Scope

  The test file and evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run: `bash swarmforge/scripts/test/test_bl1366_land_is_one_command.sh`
  exits 0, every check PASS (measured at the hotfix: 2 of 2 runs). Read
  the coder's evidence on the TERM question.

