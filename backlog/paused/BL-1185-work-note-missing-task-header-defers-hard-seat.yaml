description: |
  ## What

  `difficulty-allows-claim?` reads cost only via `header-field "task"`. Work
  notes are `type: note` with `message: Work BL-…` and **must not** carry
  `task:` (`swarm_handoff.bb`: task is git_handoff-only). Nil task → nil cost
  → hard seat `:defer-better-fit` when an easy sibling is idle → `NO_TASK`
  while the ambulance patient sits in `new/`.

  ## Fix (direction — locked 2026-08-27)

  Attribute Work notes for difficulty the same way `supersede_lib` already
  does: prefer `task:` when present (git_handoff), else parse `Work BL-…`
  from the message. **Do not** stamp `task:` onto notes.

  ## Ops (temporary — coordinator)

  Easy seat pinned busy so hard can claim BL-1174 under nil-cost path. Remove
  pin when this lands or ambulance clears. BL-1185 stays paused while
  ambulance patient is BL-1174.

qa_e2e_procedure: >
  (1) Fixture Work note without task: → cost from message / yaml high.
  (2) Hard seat claims ambulance patient; not defer-better-fit. (3) Work emit
  stays type:note with no task:; swarm_handoff still refuses task on notes.
  (4) Non-Work note without task: still nil cost.

