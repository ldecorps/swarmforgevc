    not taken from QA's note. `freshest-main-ref` is unchanged on `origin/main`
    (where BL-1237 landed) and still selects by
    `rev-list --left-right --count main...origin/main`;
    `path-ancestry-absorbed?` is called with that single selected `ref`;
    `staleness-report`'s remedy sentence is still the hardcoded "Merge main".
  - [2026-08-29] specifier: confirmed NOT live at mint time. All thirteen
    `swarmforge/constitution/articles/reference/*` files have the same most
    recent touching commit in `main` and in `origin/main`, so there is no path
    on which the two refs disagree today. It WAS live earlier the same day:
    `engineering-detailed.prompt` sat at `abc603b6e` on local `main` only while
    the counts were `41 47`, which is the state that produced the specifier
    seat block recorded in
    `backlog/evidence/BL-1237-guard-blocks-the-specifier-on-main-20260829.md`.
    Origin has since received that commit.
  - [2026-08-29] specifier: BL-1237's `qa_e2e_procedure` step (6) checks only
    that the cleaner can take a turn; nothing in it varies the two refs against
    each other, which is why a passing BL-1237 leaves this live. Step (7) above
    is the successor check, and steps (1)-(2) are the ones that would have
    caught the fail-open.
  - [2026-08-29] specifier: no BL-1237 scenario is falsified by this ticket, so
    there is nothing to retire under the slice-boundary rule. BL-1237's
    scenario 03 asserts a refusal names a remedy that resolves it - this ticket
    strengthens that assertion to name the correct ref, it does not contradict
    it.
  - [2026-08-29] specifier: routing warning, same as BL-1237 hit. The
    spec-ready note announcing this ticket, and these notes, are `type: note`
    with no `task:` header - they are not a dispatch trail. If
