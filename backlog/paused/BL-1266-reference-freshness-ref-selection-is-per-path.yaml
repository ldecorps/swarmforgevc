id: BL-1266
title: "The reference-freshness guard picks which ref to compare against by whole-repo commit count, so it can both miss real drift and refuse for an amendment on the ref it never read"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
priority: 17
direction: agent-reported
depends_on: [BL-1237]
mutation_cost: low
