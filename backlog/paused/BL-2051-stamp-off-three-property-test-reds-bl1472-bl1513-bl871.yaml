description: |
  ## Status: hotfixes 435b2de1a9, 372b68930b and 25cb223e0d landed the fixes

  This parcel is their stamp-off: review them, do not re-apply them.

  ## What was wrong, and what each hotfix changed

  435b2de1a9: bl1472_revert_reapply_transparent_property_runner.bb P1
  builds two fixture repos and compared delivered-attribution's whole map.
  BL-1857 (6c740f69b7, 2026-10-01) added :untagged-commits, a list of
  commit shas, which differ between two repos for the same logical commit,
  so P1 failed on every case. P1 now compares owners, both flags and the
  count of each sha list, which is the answer the runner's header pins.

  372b68930b: bl1513_router_note_fits_property_runner.bb expected the
  router note "Work <id>: read backlog/active/<id>-*.yaml". BL-1614
  (da0933c0ce, 2026-09-17) changed route_backlog_to_coder.sh's MSG to
  "Work <id>: merge main first, then read backlog/active". The runner now
  composes that template in one helper for both invariants, and its length
  sweep straddles the new threshold (49 + id length <= 80).

  25cb223e0d: bl871PropertyLaneWorkerPoolCapInvariants.property.test.js
  invariant 1 computed the pool ceiling in its own process
  (floor(cores - 5-minute load)) and asserted the spawned fixture run's
  peak concurrency stayed under it. The spawned config computes the same
  expression seconds later; under a loaded lane the two readings straddle
  an integer (counterexample fileCount=4). The check now reads the ceiling
  from the run's own [property-lane-budget] forks= line, as the heap check
  already reads workerHeapMB= (BL-1651).

  ## What the coder does (all of it)

  1. Read `git show 435b2de1a9`, `git show 372b68930b` and
     `git show 25cb223e0d` against the section above. For 25cb223e0d,
     confirm that the fixture run names more than one file, so the printed
     forks= is the config's maxForks (vitest.properties.config.mjs,
     resolveLaneForks).
  2. Run qa_e2e_procedure steps 1 and 2 and the bl871 test file once, with
     output under tmp/.
  3. Write backlog/evidence/BL-2051-coder-<date>.md with the review result
     and the run results, and commit it.
