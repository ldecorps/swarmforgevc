notes: |
  ## Verified before minting

  - The coordinator's recovery landed: BL-604 is in `backlog/done/` on
    `origin/main` and absent from `active/`.
  - All three production callers already use the shared BL-1198 primitive, so
    this is NOT the BL-419 "shipped but unwired" shape. Recorded because that
    is the first thing a reviewer will suspect.
  - No open ticket covers this. BL-1198 (push-before-reset), BL-1214
    (ff-absorb real merge), BL-1236 (merge verdict), BL-1256 (kill-switch stay
    loud) are all in `done/`; nothing in `paused/`, `active/`, `hold/` or
    `debt/` mentions `master_main_reconcile`.

  ## The kill switch is NOT the remedy here

  `master_main_reconcile_enabled` was shipped OFF by BL-1248 and deliberately
  re-armed to `true` by the operator on 2026-08-29 (`cce70d985`), to clear the
  durable skipped-by-config deadlock that was parking coordinator bookkeeping.
  Turning it back off would restore that deadlock. This ticket makes ON safer;
  it must not be read as an argument to disable the sweep, and no part of it
  touches that flag.

  ## Specifier action taken alongside this mint

  Local `main` was 8 ahead / 0 behind at triage. Rather than leave those
  commits exposed for the ticket's whole lifetime, they were pushed
  (`git push origin main:main`, under the BL-1144 lock discipline: acquire
  `.swarmforge/land-main.publish.lock`, re-fetch, re-verify `origin/main` is
  still an ancestor of local `main`, push, release). `main...origin/main` is
  now `0 0`. That closes the current window; it does not fix the defect, which
  will re-open it on the next daemon cycle that cannot reach the remote.

occurrences:
  - "[2026-08-30] The first loss NOT caught by the person who caused it, and the
    first to reach a shipped ticket. Commit 16062880b (BL-1241's QA.prompt half,
    naming land_step_cli.bb as the entangled-tip remedy) was reset away and
    landed on no branch. BL-1241's YAML half survived, so the ticket sat in
    backlog/done/ reading as complete while the half that gives the built CLI
    its only caller was simply gone - precisely the BL-798 shape that prose half
    exists to prevent. Nothing detected it: not a gate, not the ticket, not the
    reflog. The coder happened to grep QA.prompt for land_step_cli, found zero
    hits, and sent the specifier a priority-00 note. Re-landed as 8cceab0e3 by
    applying that commit's patch (byte-identical; verified via git diff against
    16062880b).
    Two things this adds to the severity case above. First, `main` reflog shows
    NINE resets to origin/main on this date, not seven. Second, the note that
    every loss so far was recoverable from the reflog is true but incomplete:
    recovery depends on somebody NOTICING, and this one was invisible for a day.
    An audit after the fact is not a realistic backstop - `git fsck --dangling`
    reports 873 dangling commits in this repo, so there is no practical way to
    tell lost work from ordinary rebase and merge-up debris by inspection. A
    sample of 60 was attempted and was worthless: it did not even contain
    16062880b. Prevention at the push-verdict, which is what this ticket builds,
    is the only workable fix."

