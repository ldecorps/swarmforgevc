id: BL-679
title: "Ambulance mode slice 2 — the perimeter: held parcels stop alarming, promotion freezes, and the mode exits by itself when the patient is delivered"
milestone: M8
type: feature
status: todo
epic: swarm-reliability
human_approval: approved
severity: medium
priority: 01
direction: human-requested
depends_on: [BL-655]
assigned_to: specifier
mutation_cost: medium

invariants:
  - "The mode can only ever exit — never enter — on its own; every engage is a human act, and no swarm signal creates an ambulance."
  - "An ambulance ticket that leaves the pipeline for a human ruling releases the mode rather than starving it: no marker state can leave the swarm holding everything with nothing able to move."

required_wiring:
  - "swarmforge/scripts/flow_watchdog_lib.bb::ambulance::held parcels must reach the tier decision as muted, or the mode alarm-storms exactly when the human wants quiet"
  - "swarmforge/scripts/handoffd.bb::ambulance::the auto-exit sweep and the open-slot nudge suppression both live on the daemon's existing cadence"

approval_context: >
  Operator, 2026-07-26 ~01:15, mid-expedition of BL-654: "expeditor est un
  dernier recours. ne devrait-il pas aussi y avoir un mode où la swarm tourne
  normalement, sauf que le resident n'est autorisé qu'à travailler sur un
  unique ticket. en mode ambulance". Same approved directive as BL-655; the
  2026-07-26 specifier rework split that one ticket into the hold (BL-655)
  and this perimeter, rather than widening the ask. Reject here if the
  perimeter is wanted differently — the hold ships either way.

source: |
  BL-655 delivers the hold: engage, only one ticket's parcels move, release,
  nothing lost. Three things it deliberately leaves out, each of which the
  operator's original ticket named explicitly, and each of which is what
  turns a working mechanism into a mode a human would actually reach for at
  01:15:

  1. **It alarms at you.** The flow-watchdog measures parcel age on the wall
     clock. Held parcels keep aging, so a 90-minute ambulance emits a WARN
     and then an ESCALATE for every parcel the human deliberately held —
     noise generated by the very act of asking for quiet.
  2. **The backlog keeps filling.** Nothing stops the coordinator promoting
     more work into `active/` during the ride. The routing note for a newly
     promoted ticket is held by BL-655's dispatch filter, so no work actually
     starts — but `active/` churns and the ticket's own state drifts.
  3. **It never ends by itself.** The mode sits engaged until a human
     remembers to release it, including the case where the ambulance ticket
     has already reached `done/` and there is nothing left to protect.

description: |
  ## 1. Watchdog quiet — via the existing single mute, not a new branch

  `flow_watchdog_lib.bb`'s `decide-tier` has a deliberate structural
  guarantee: `snoozed?` is its ONLY mute, and its input map's allowed-key set
  (`tier-decision-input-keys`) is unit-tested to keep it that way. Do not add
  an ambulance branch to it — that guarantee is load-bearing and its own
  acceptance scenario.

  Compose at the CALLER instead: `evaluate-parcel-tier` already assembles the
  input map, and it is the documented place for exactly this ("kept separate
  from decide-tier itself so the structural guarantee lives on the decision
  fn alone"). A parcel HELD by an engaged ambulance arrives with `:snoozed?`
  true. That is honest, not a workaround: an ambulance IS a durable, visible,
  human-written declaration that these parcels are acknowledged and waiting —
  the same thing a snooze means.

  The ambulance ticket's OWN parcels are never muted. A stalled ambulance is
  the one thing the human most needs to hear about, and it alarms exactly as
  it does today.

  ## 2. Promotion freeze

  While engaged, no new item is promoted from `paused/` into `active/`:

  - `handoffd.bb`'s open-slot nudge (the "open slot + paused work -
    promote+route" wake) does not fire.
  - `coordinator.prompt` gains the rule, and `ambulance_cli.bb status`
    is what it reads to check.

  Depth is NOT touched — no cap is lowered, so none has to be restored
  (BL-655 makes the same commitment; between them the mode can never leave a
  throttle stuck on).

  **An expedited critical/high defect filed mid-ambulance queues like
  everything else.** This is the one place the mode outranks Article 3.2.4,
  and it is deliberate: the human chose the ambulance knowingly and only a
  human lifts it. It must be visible rather than silent — the release
  announcement names any queued expedited defect FIRST, ahead of everything
  else that was waiting.

  ## 3. Automatic exit

  A sweep on the daemon's existing cadence releases the mode when the
  ambulance ticket is no longer in the pipeline, and announces which case
  fired:

  - **Delivered** — the ticket's YAML is in `backlog/done/`. Release, and
    announce the ride is over plus what was held.
  - **Left for a human ruling** — the YAML is in `backlog/hold/`, or has
    vanished from `backlog/` entirely. Release, and say so LOUDLY: this is
    the deadlock case the operator ruled out, and a mode that keeps holding
    everything for a ticket nobody is working is strictly worse than no mode.
  - **Bounced but still in flight** — the YAML is still in `backlog/active/`.
    The mode HOLDS. A bounce is normal traffic: the rework lineage is
    ambulance lineage and flows under BL-655's attribution rule.

  Exit is one-directional. Nothing here may ever ENGAGE an ambulance; the
  swarm never self-declares one.

acceptance: specs/features/BL-679-ambulance-mode-perimeter.feature.draft

out_of_scope: |
  - Everything in BL-655 (marker, lib, CLI, Telegram verbs, the three hold
    read sites). This slice consumes that predicate, it does not restate it.
  - Reworking the flow-watchdog's wall-clock age into active time. That is
    BL-650 and stands on its own; this slice only mutes what the human
    explicitly held, and does it through the existing snooze channel.
  - Multi-ticket ambulances, ambulance queues, auto-engage. Same exclusions
    as BL-655.

notes: |
  Sequencing: this should follow BL-655 closely rather than sit in the queue.
  An ambulance whose only observable side effect at the human's end is an
  alarm storm will not get used, and an unused rung 2 sends the operator back
  to the Expeditor on a healthy pipeline — the exact failure BL-655's notes
  say is worth its own ticket.

  The Gherkin is parked at `specs/features/BL-679-ambulance-mode-perimeter.feature.draft`
  until BL-655 lands (BL-233: the acceptance runner throws on scenarios with
  no step handler, so an unbuilt slice's feature file must not be live). The
  coder promotes the draft to `.feature` in this parcel and wires its
  handlers in the same commit.
