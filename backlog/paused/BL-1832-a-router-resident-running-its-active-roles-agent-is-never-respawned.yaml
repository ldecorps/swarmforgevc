human_approval: approved
approval_context: >
  A new feature file; no choice is posed. FIRM: under rotation router the
  home pane is healthy when it runs a live process of the home role's
  agent OR of the agent of the role the resident is active as (both, so a
  rotation still in progress is never killed). FIRM: a home pane running
  neither is still a half-launch CRIT with a repair, as today. FIRM: with
  no honoured active-role marker (standing pack, or an absent or unknown
  marker, BL-1345 invariant 3) each seat is judged against its own agent
  alone, as today.

invariants:
  - "Under rotation router, a home pane holding a live process of the home role's agent or of the agent of the role the resident is active as yields no proc-<home> finding and no repair."
  - "Where the active-role marker is not honoured (a standing pack, or an absent or unknown marker), every seat is judged against its own roles.tsv agent alone, exactly as today."

required_wiring:
  - 'swarmforge/scripts/babysitter_check.bb::babysitterd-sweep-lib/seat-expected-agents::the live gatherer asks the pure resolver which agents the home pane may run'

description: |
  ## What is wrong

  `babysitter_check.bb`'s `gather-role` sets `:expected-process` from the
  roles.tsv `agent` column of the role whose session it inspects. Under
  `config rotation router` only the home role's session stands, and the
  resident runs every other role inside it (BL-804). The sweep resolves
  `resident-active-role` from the marker in the same pass, but only
  after `gather-role` has run, and `gather-role` never reads it. So when
  the home role and the active role use different agents, the pane holds
  a healthy process of the wrong name. `check-live-session`
  (`babysitterd_sweep_lib.bb`) then raises the `proc-<home>` half-launch
  CRIT with an `:ensure-session` repair, and `ensure-role-session!` runs
  `tmux respawn-pane -k` with the HOME role's launch script. That kills
  the active role mid-turn.

  Measured 2026-09-30 from the live logs: the human switched to the ISTA
  mono-router pack (coder on aider, everything else on claude) at
  20:56Z on 2026-09-28. From 22:00Z to 05:00Z babysitterd logged 60
  `CRIT [proc-coder] ... NO aider process` findings and a
  `REPAIR [repaired] swarmforge-coder` every ten minutes (the repair
  cooldown). Thirty-one QA Claude sessions started between 00:00Z and
  05:00Z, each about a minute after a repair tick. QA's background
  `land_main_publish.sh --land` was killed at 02:15:35.804Z and at
  04:36:56.399Z, the exact timestamps of those two repair ticks. QA was
  landing BL-1788, BL-1707 and BL-1785 (a 20-40 minute walk each). No
  land walk ever finished: QA gave up on them and hand-built BL-1788 and
  BL-1707 at 02:27Z and BL-1785 at 05:38Z. The
  lifecycle ledger charged this to QA as 1515 chases and 22 respawns on
  BL-1785. handoffd's respawns in that window were restoring QA after
  each kill, not killing it: the land was already dead when each one
  read `lane: false`. On 09-30 there were zero repairs, because the pack
  is now all-Claude.

  ## What is wanted

  - Under rotation router, the agents the home pane may run are the home
    role's agent and the agent of the role the resident is active as.
    A live process of either means the seat is healthy: no half-launch
    finding and no repair (scenario 01, whose rows cover QA-in-resident,
    a rotation still in progress, and the resident at home).
  - A home pane running neither agent is still the half-launch CRIT with
    its repair (scenario 02).
  - Where the marker is not honoured (standing pack, or an absent or
    unknown marker), nothing changes: each seat is judged against its own
    agent alone (scenarios 03, 04). This is BL-1345's rule and must not
    regress.

  ## How (direction, not mandate)

  - Put the resolver in `babysitterd_sweep_lib.bb` as a pure function
    named `seat-expected-agents`. It takes the router flag, the home
    role, the honoured active role, and the roles-to-agent map, and
    returns the set of acceptable agent tokens. The `required_wiring`
    anchor is that literal call from `babysitter_check.bb`, so the live
    gatherer, not only the lib, has to use it. Code near the I/O asks
    the module that owns the answer (BL-1811).
  - `gather-role` currently runs before `resident-active-role` is
    resolved. Either resolve the resident first, or re-judge the home
    seat's agent presence once it is known; that choice is yours.
    `agent-process-line` already finds one agent's marker anywhere under
    the pane tree (BL-1070), so asking it once per acceptable agent is
    enough.
  - Step handler: `specs/pipeline/steps/bl1832RouterResidentActiveAgentSteps.js`,
    registered in `specs/pipeline/steps/index.js` in the same commit as
    the feature's first green run (BL-233). Drive the pure decision
    (BL-1169's posture) or the real `babysitter_check.sh` on a private
    tmux socket with renamed `exec -a` children (BL-804's posture, where
    an `aider` child works the same way as its `claude` one). Any fixture
    root is created under mkdtemp and never touches the live repo
    (BL-1390).

  ## Scope

  `swarmforge/scripts/babysitterd_sweep_lib.bb`,
  `swarmforge/scripts/babysitter_check.bb`, their bb tests, the step
  handler and its registration, evidence. Not the repair executor, the
  cooldown, or handoffd's chase sweep.

