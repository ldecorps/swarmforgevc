  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1832-a-router-resident-running-its-active-roles-agent-is-never-respawned.feature`:
     6 of 6 ok (3 outline rows plus 3 scenarios). Measured 0 on main at
     mint: no handler exists yet.
  2. `node specs/pipeline/cli.js specs/features/BL-804-babysitter-mono-router-topology-awareness.feature`:
     6 of 6 ok. Measured 4 of 6 on main at mint (2026-09-30); 01 and 04
     are red as the register row owned by BL-1833 describes, and they go
     green when BL-1833 lands, which this ticket depends on.
  3. `node specs/pipeline/cli.js specs/features/BL-1169-babysitter-half-launch-starvation-auto-repair.feature`:
     4 of 4 ok, and
     `node specs/pipeline/cli.js specs/features/BL-1345-a-stale-router-marker-does-not-staff-a-standing-pack.feature`:
     7 of 7 ok (both measured on main at mint).
  4. In-process probe: load `babysitterd_sweep_lib.bb` with `bb -e` and
     call `seat-expected-agents` for a router pack with home coder on
     aider and the resident active as QA on claude. The set holds both
     "aider" and "claude". The same call on a standing pack holds only
     the seat's own agent.
  5. `grep -n 'babysitterd-sweep-lib/seat-expected-agents' swarmforge/scripts/babysitter_check.bb`
     shows the call in the gatherer path.

