description: |
  ## The defect

  The map becomes {ticket -> {stage, status, asOf}}, status one of
  claimed | in-transit-to | last-known. Derivations: claimed from
  in_process (as today); in-transit from the parcel in `new/` (recipient =
  next stage); last-known from the durable handoff trail (sent/ headers) —
  the same trail BL-659's completion ring will read: ONE derivation, two
  consumers, they can never disagree.

  Fixture: the filing-morning state (parcel in cleaner new/ + stale night
  batch in in_process) must derive "647 · cleaner (in transit) · as of
  10:11", never NS.

  ## Health dot

  Health dot per ticket from the yaml bounce fields (BL-635 recorder,
  live): green no bounces, yellow 1-2, red 3+ ("3 barely, 8 no way" — red
  IS the bound speaking). Confirmed 2026-08-19 that `bounce_history:` is a
  real, populated field on ticket YAMLs with a real production writer
  (e.g. BL-572 carries three entries with at/by/blamed/class/commit/
  evidence), so this needs no new store.

  ## What is already done — do NOT rebuild it

  The original filing said "Sync triggers close the gap where only
  promote_and_route_next calls sync today: either handoffd's sweeps call it
  or the board derives at render time from the trail (coder's call)". That
  choice is already made and shipped. BL-487 (done) made the concierge tick
  shell out to `pipeline_stage_cli.bb`'s side-effect-free `report`
  subcommand on EVERY tick (extension/src/concierge/conciergeTick.ts
  `syncBoardIfWired`, see its own BL-487/BL-814 comments), so the
  coordinator-written cache is no longer the source of truth and staleness
  is NOT the remaining defect. Do not re-litigate sync triggers.

  ## The live sites (verified 2026-08-19, worktree and origin/main)

  What IS still live is the derivation itself:
  `swarmforge/scripts/pipeline_stage_cli.bb`'s `role-ticket-pairs-for`
  reads only `(handoff-lib/mailbox-dir role-info :in_process)` — the `new/`
  inbox and the durable `sent/` trail are invisible to it.

  The value shape change crosses a language boundary. Today
  `.swarmforge/board/ticket-stage-map.json` is {ticket-id -> role}, a bare
  role string, produced by `pipeline_stage_lib.bb`'s
  `reconcile-stage-map`/`filter-active`, typed `Record<string, string>` by
  `extension/src/swarm/swarmState.ts`'s `readTicketStageMap`, and consumed
  by `extension/src/bridge/pipelineGridLive.ts`'s
  `invertTicketStageToRoleHeldTickets`. Moving to
  {ticket -> {stage, status, asOf}} touches all four sites in two
  languages; per the engineering article's mirrored-constant rule the two
  sides need a test asserting the shapes agree, not a comment.

  ## How (direction, not mandate)

  Whether the three statuses are derived in one pass over all three sources
  or layered as a precedence chain, and whether the TS side adapts at the
  boundary or carries the richer shape throughout, is the implementer's
  call. `reconcile-stage-map`'s existing role-order precedence is the
  obvious place to express "claimed beats in-transit beats last-known", but
  it is not mandated.

acceptance: specs/features/BL-670-pipeline-board-last-known-stage-and-health.feature

qa_e2e_procedure: |
  On the live swarm host, with BL-585's matrix already landed:

  1. With a ticket genuinely in transit (its parcel sitting in the next
     role's new/ inbox, nothing claimed), let the concierge tick repaint the
     pinned Pipeline Board. Confirm on a PHONE that the ticket shows its
     last-known stage with an in-transit marker and an as-of time — NOT
     not-started. This is the whole point of the ticket; if it reads NS the
     gate has failed regardless of what the unit tests say.
  2. Confirm `.swarmforge/board/ticket-stage-map.json` carries the richer
     {stage, status, asOf} shape for that ticket, and that
     `pipeline_stage_cli.bb <root> report` prints the same thing.
  3. Claimed case: let a role claim the parcel and confirm the same ticket
     flips to status claimed at that role on the next tick.
  4. Last-known case: with every in_process and new/ box empty, confirm a
     ticket already forwarded to the documenter still shows documenter with
     status last-known, not not-started.
  5. Aggravator: leave a stale orphaned claim with no derivable ticket id in
     an in_process box and confirm it neither crashes the derivation nor
     displaces a real ticket's stage.
  6. Health dot: confirm a ticket with 0 recorded bounces shows green, one
     with 2 shows yellow, and one with 3+ shows red, reading from the
     tickets' own `bounce_history:` entries.
  7. Regression: confirm BL-585's matrix layout is unchanged by this parcel —
     same columns, same padding, same epic captions.

