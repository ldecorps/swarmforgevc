qa_e2e_procedure: |
  On the parcel commit, from the repo root after `npm run compile` in
  `extension/`. Fixture roots per BL-1390: `git init` under mkdtemp,
  proven with `git rev-parse --git-common-dir` before anything else.
  1. `bb swarmforge/scripts/test/chase_sweep_test_runner.bb` - ALL PASS,
     including the three result shapes of scenario 01.
  2. `bash swarmforge/scripts/test/test_chase_departing_mid_parcel_gate.sh`
     - ALL PASS with case 08 in its PASS lines; the telemetry row it
     asserts carries `"poke":"rotate"`.
  3. Under `extension/`: `npx vitest run leanLedgerComposeStall
     closingCeremony` - ALL PASS; a rotate-poked chase row composes no
     stall and is not reported as unrecognised.
  4. `specs/pipeline/scripts/run_acceptance.sh` on this ticket's feature:
     7/7 (two outlines x3, one scenario).
  5. Live check, read-only: seed a fixture chaser file with one
     `"poke":"rotate"` chase row and one `"poke":"wake"` row inside a
     role window and run `node extension/out/tools/lean-ledger-record.js`
     for that ticket; the ledger gains exactly one chase stall.
  6. Break-then-restore: drop the composer's poke predicate; scenario 02
     row 1 fails on "0 stall events"; restore.
