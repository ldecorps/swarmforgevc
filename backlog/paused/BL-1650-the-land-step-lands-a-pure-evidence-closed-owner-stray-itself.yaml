  - 'specs/pipeline/steps/bl1650LandStepPureEvidenceStraySteps.js::registerSteps::the handler lands in the same parcel as the feature (BL-233, BL-1371)'

human_approval: pending
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: BL-1546's rule stands for
  every path that is not pure evidence or documentation - a closed-owner
  stray touching code, a feature, pipeline steps or backlog YAML is still
  LAND_ESCALATE, never decided by the step. FIRM: the cherry-pick keeps
  the stray commit's author and subject (`-x` trailer), lands on main
  before the parcel's replay, and is named in the land log; nothing is
  abandoned. FIRM: an ancestor whose every path is byte-identical to
  main after the parcel's own edits is reported as landed, never as
  entangled.

invariants:
  - "The land step decides a closed-owner stray on its own only when every path the stray commit touches is under backlog/evidence/ or docs/; one path outside that set makes the whole stray an escalation, exactly as today."
  - "A stray the step lands is recorded: the land log names the cherry-picked commit, its source sha and its paths, and the landed commit carries the -x trailer; nothing lands silently (BL-1546)."

description: |
  ## What is wrong

  `land_step_cli.bb` (BL-1546) refuses to replay a parcel when the
  two-tree diff carries a path whose only owner is a ticket closed on
  origin/main and no commit of the parcel touches it - correctly, since
  the alternative was silent exclusion. On 2026-09-19 that path was
  `backlog/evidence/BL-831-coder-forward-gate-false-refusal-20260918.md`:
  the coder's record of a forward-gate incident, committed on the coder
  branch (6d63104e70) after BL-831 had moved to the cleaner, never part of
  any parcel, and BL-831 closed the next day. Every branch that merged the
  coder branch since carries it, so every later land escalated on it
  (BL-1636, QA evidence
  `BL-1636-QA-land-escalate-closed-sibling-evidence-20260919.md`). The
  step also printed `ENTANGLED_SIBLING BL-1634` for an ancestor
  (1e97976a66) whose content is entirely on main through BL-1634's own
  tip-pure replay - ancestry-only, nothing to land.

  BL-1537's condition (d) and the new condition (e) (2026-09-19) let QA
  clear this by hand with a `git cherry-pick -x`; the step can do the
  same thing itself for exactly this class, and say so in its log.

  ## What is wanted

  1. Before the replay, for each closed-owner stray commit in the parcel's
     ancestry whose EVERY path is under `backlog/evidence/` or `docs/`
     (and none under `extension/`, `swarmforge/`, `specs/`, `android/`,
     `pwa/`, `backlog/{paused,active,done,hold}/`, `backlog/*.tsv`,
     `backlog/*.yaml`): cherry-pick it with `-x` onto main ahead of the
     parcel's replay, under the same lock, and log
     `LAND_STRAY_EVIDENCE_LANDED <sha> -> <landed sha> <paths>`.
  2. A closed-owner ancestor whose paths are all byte-identical between
     the parcel tip (after the parcel's own edits) and origin/main is
     reported `LAND_SIBLING_LANDED <ticket>` and never counted as
     entangled.
  3. Everything else keeps BL-1546's refusal and text.

  ## How (direction, not mandate)

  - The classifier is pure (a path set in, a verdict out) with runner
    cases for the boundary list; the cherry-pick lives beside the replay's
    existing git calls; the log line rides the existing land log.
  - Fixture: a `git init` root with a main, a role branch carrying (a) a
    pure-evidence stray from a closed ticket, (b) a stray touching one
    script, (c) an ancestor replayed onto main with identical content;
    run the real `land_step_cli.bb` on each shape.
  - Docs: `docs/how-to/BL-1428-standing-red-register.md` is not this; the
    land step's how-to (BL-1144/BL-1447 family) gains the two lines.

constraints: >
  Fail-closed posture unchanged for anything not in the pure-evidence
  set; an unreadable path set or an unreadable stray commit is an
  escalation. Fixture roots are mkdtemp `git init` repositories, proven by
  `rev-parse --git-common-dir` before any mutating git command (BL-1390).
  The step handler lands in the same commit as the feature (BL-233).

out_of_scope: |
  - Why roles commit incident evidence on their long-lived branches (a
    process note: land such evidence through the adjudicator's own main
    commit, as the specifier does).
  - The task-scope send gate (BL-1547).

qa_e2e_procedure: >
  (1) Unit: the bb runner covering land_step_lib.bb green with the new
  cases. (2) Acceptance: the BL-1650 feature green through the runner,
  once. (3) Replay of 2026-09-19 on a scratch clone: a branch carrying
  6d63104e70's shape lands with one `LAND_STRAY_EVIDENCE_LANDED` line and
  the parcel replay proceeds; the same fixture with the stray touching a
  script under swarmforge/scripts is refused with BL-1546's text. Never
  "run it N times".

