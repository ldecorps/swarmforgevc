id: BL-1650
title: "The land step lands a closed-owner stray whose every path is pure evidence or documentation itself (cherry-picked onto main ahead of the replay, recorded in the land log) and treats a closed-owner ancestor whose paths are content-identical to main as landed, not entangled - so a role's incident evidence committed on its long-lived branch after its ticket closed no longer escalates every later land (BL-1636, 2026-09-19)"
