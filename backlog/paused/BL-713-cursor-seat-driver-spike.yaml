notes: |
  e2e QA procedure: pick one small real ticket for the spiked role. Start the
  seat through the spike CLI with the spike-only escape set. Send that role a
  real `git_handoff` through `swarm_handoff.sh` from the previous stage. Confirm
  the seat wakes, `ready_for_next.sh` returns the task, the stage work lands as
  a commit with the role byline, and a handoff reaches the next role's mailbox —
  all without a human typing into the seat. Then unset the escape and confirm the
  seat refuses to start for a production pack. Capture the transcript as the
  slice's evidence artifact.
