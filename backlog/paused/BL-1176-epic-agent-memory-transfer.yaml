description: |
  ## Why

  Same-role model changes today are pack/pane swaps. Transcripts and agent
  session memory are vendor-specific; crossing providers (or models) typically
  drops mid-ticket reasoning. BoB and steward hot-swap are useless or harmful
  without continuity.

  ## Loop

  Capture portable memory for a role → inject into the incoming agent on the
  same role before live work → fail closed with a clear signal when transfer
  is impossible for a vendor pair.

  ## Children (minted 2026-08-27)

  | Slice | Ticket | Delivers |
  | --- | --- | --- |
  | Payload + API | BL-1177 | Portable memory payload + capture/inject |
  | Wire paths | BL-1178 | Hot-swap / relaunch / trial start-end |
  | Cross-vendor | BL-1179 | Adapters + unsupported matrix |

invariants:
  - "Never silently pretend continuity when transfer is impossible — refuse with a clear signal."
  - "Memory transfer is same-role only — not cross-role merge or a global shared brain."
  - "Epic is not directly promotable — coordinator promotes children only."

