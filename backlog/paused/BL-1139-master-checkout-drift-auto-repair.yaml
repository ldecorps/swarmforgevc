acceptance: specs/features/BL-1139-master-checkout-drift-auto-repair.feature
required_wiring:
  - "swarmforge/scripts/handoffd.bb::master-checkout-drift-sweep!::repair must run on the live drift sweep after classify when durable drift and not commit-in-flight — a repair helper that exists while the sweep only WARNs repeats this ticket"
  - "swarmforge/scripts/master_checkout_drift_lib.bb::check-master-checkout-drift!::check path must remain write-free — repair is a separate verb"
  - "specs/pipeline/steps/index.js::bl1139MasterCheckoutDriftAutoRepairSteps::acceptance handler registered"
invariants:
  - "check-master-checkout-drift! never writes the index or worktree — repair is a separate verb."
  - "Repair candidates are always a subset of resolve-daemon-executed-paths — non-daemon paths are never restored by this ticket."
  - "While commit-in-flight? is true, no restore runs and BL-1122/1134/1137 mute behaviour is unchanged."
description: |
  ## What is wrong

  BL-839 detects MASTER CHECKOUT DRIFT when daemon-executed scripts on the
  master checkout are not the code on main. Auto-restore was out of scope
  ("surfaced, not swept"). Mute tickets BL-1122 / BL-1134 / BL-1137 only
  quiet mid-commit false WARNs. Durable drift still requires a human.
  Human 2026-08-25: **the swarm must deal with durable daemon-script drift
  without human intervention.**

  ## What to do

  When durable drift is detected on the daemon-executed path closure and
  commit-in-flight? is false: restore those paths from main (`git checkout
  main -- <path>`), re-check, emit a one-shot Operator note
  `MASTER CHECKOUT DRIFT RESTORED: …`, and deferred-bounce handoffd via
  `start_handoff_daemon.sh` / `restart-handoffd-group!`. Keep
  `check-master-checkout-drift!` read-only; put mutation in a separate
  repair verb. Fail-closed: restore failure or residual drift keeps WARN.

  ## Out of scope

  - Moving daemons onto a committed ref (BL-839 out_of_scope).
  - Auto-committing drifted content onto main.
  - Repairing non-daemon paths.
  - Weakening mid-commit mute.
  - Reminting BL-839.

qa_e2e_procedure: >
  (1) Fixture durable drift on a daemon-executed path, not in-flight →
  path matches main after sweep; one RESTORED note; no repeating WARN.
  (2) Same drift while commit-in-flight → no restore; mute unchanged.
  (3) Restore failure → WARN still. (4) Successful restore → handoffd
  bounced through start_handoff_daemon.sh (deferred). (5) Property:
  repair ⊆ resolve-daemon-executed-paths; check write-free.

