id: BL-1359
title: "The Article 4.2 sweep charges a merge with paths it never introduced: --first-parent is a no-op on git diff-tree -m, so a merge is judged on the union of every parent's diff"
milestone: M8
type: defect
severity: high
# high, not critical: it fails CLOSED, so nothing is corrupted and no
# unapproved code lands. It is graded high because it is a broken health
# signal, not a nuisance: `specs/pipeline/steps/index.js` is the registry
# every ticket appends to, so the false charge fires on essentially every
# merge-up and does not self-clear with time. BL-1344's waive names ONE
# finding key, so a systematically recurring false positive cannot be
# absorbed by it - each merge-up would need a fresh waive forever. The
# failure BL-1344's own approval context named ("an Article 4.2 CRIT that
