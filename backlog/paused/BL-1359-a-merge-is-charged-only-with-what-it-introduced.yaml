invariants:
  - "A merge is charged with exactly the QA-exclusive paths it introduced relative to its FIRST parent: never a path whose merge result is byte-identical to that parent, and never fewer paths than that two-tree diff contains."
  - "Fail-closed is unchanged (BL-962 invariant 3): any git call that cannot answer still withholds the WHOLE sweep as ancestry-unavailable - a narrowed charge set never becomes a silent clean."
