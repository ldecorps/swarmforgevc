  This ticket exists ONLY so your 2026-07-26 board addendum is not lost. Your
  2026-08-19 ruling sent all layout to BL-585 and dropped the mini-slug row,
  but two directives in that addendum had nowhere to land: BL-585's
  out_of_scope explicitly excludes the LINKS list, and the
  time-with-current-agent mark renders a value rather than deriving one, so it
