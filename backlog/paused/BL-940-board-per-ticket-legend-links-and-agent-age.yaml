source: |
  Residue of BL-670's original filing (.swarmforge/operator/INTAKE-pipeline-board-last-known-stage.md,
  operator session 2026-07-26), split out under the human's ruling of
  2026-08-19: "BL-670 = semantics + health dots only; ALL layout incl. slug
  stays with BL-585, no slug per ruling #4." Article 5.3 — a consolidation
  never drops a human sentence — is why this ticket exists rather than the
  directives being trimmed. Traceable in both directions: BL-670's notes
  record what moved here and why.

description: |
  ## Why a separate line at all

  Telegram renders no links inside a `<pre>` code block. The grid lives in
  one, so any per-ticket deep-link has to sit on its own line OUTSIDE it.
  That constraint is the whole design here — it is not a stylistic choice.

  ## The human's directives, verbatim

  From the 2026-07-26 filing:

    "Telegram renders no links inside code blocks, so a per-ticket legend
    line follows OUTSIDE it: detail deep-link to the ticket's own BL topic
    (BL-295/BL-329 — no new surface), gherkin deep-link into the BL-659
    Knowledge Explorer, degrading gracefully (raw feature file on GitHub, or
    omitted) until that epic ships — the board never waits on it."

    "Time-with-current-agent beside the stage mark ('AR X(34m)'), BL-650
    active time once available, wall time labelled until then."

    "Compactness: readable in a phone-width Telegram code block;
    two-significant-unit durations."

  (The compactness sentence is shared with BL-585, which owns the width
  budget and the bare display ids; the two-significant-unit duration rule is
  this ticket's, since it governs the mark rendered here.)

  ## Graceful degradation is the load-bearing part

  BL-659's Knowledge Explorer may not exist when this ships. The board never
  waits on it: the gherkin link falls back to the raw feature file on GitHub,
  or is omitted, and every other section still renders. That is what lets
  this ticket land independently of that epic — it is pinned by its own
  scenario rather than left as an aspiration.

  ## Live surface, verified 2026-08-19

  The BL topic deep-link needs no new surface: per-ticket BL topics already
  exist (BL-295/BL-329) and `backlog/topics/BL-<n>.json` records are written
  automatically today. BL-513 (done) already links every ticket shown on the
  board to its current backlog folder, so this ticket adds a per-ticket
  legend line rather than redesigning the LINKS list — confirm at build which
  of the two carries the topic link, and do not duplicate it in both.

  ## How (direction, not mandate)

  Whether the legend is one line per visible column or a compact run, and
  whether the elapsed value is formatted by a shared helper with the rest of
  the board's durations, is the implementer's call. `asOf` from BL-670's
  derivation is the input for the elapsed time; do not re-derive it.

invariants:
  - "The board never waits on the Knowledge Explorer: an absent or unreachable explorer degrades the gherkin link (GitHub fallback, or omitted) and every other board section still renders."
  - "No link is emitted inside the code block, where Telegram would render it as inert text."

acceptance: specs/features/BL-940-board-per-ticket-legend-links-and-agent-age.feature

qa_e2e_procedure: |
  On the live swarm host, real Telegram, with BL-585 and BL-670 landed:

  1. On a PHONE, confirm the pinned board shows a per-ticket legend line
     BELOW the code block, and that its BL-topic link is tappable and opens
     that ticket's own topic. A link rendered as plain text means it was
     emitted inside the <pre> — that is the failure this ticket exists to
     avoid.
  2. Confirm the stage mark carries the time with the current agent to two
     significant units (e.g. `X(34m)`, `X(2h15m)`), and that the board still
     does not scroll horizontally on a phone in portrait.
  3. Confirm the elapsed time is labelled as WALL time while BL-650 active
     time is unavailable, rather than being presented as active time.
  4. Degradation, all three ways: with the Knowledge Explorer available,
     confirm the gherkin link opens the ticket's gherkin view; with it absent,
     confirm the link falls back to the feature file on GitHub; with it
     unreachable, confirm the link is omitted and the rest of the board is
     unaffected. Do NOT skip the unreachable case — an explorer that hangs is
     the realistic failure, not one that is cleanly absent.
  5. Regression: confirm BL-585's matrix and BL-670's health dot are unchanged.

