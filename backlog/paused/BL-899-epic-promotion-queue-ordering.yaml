remaining_slices: |
  - BL-900 (filed): epic-priority-first ordering in `rank-key`. When two
    otherwise-eligible candidates are compared, the containing epic's own
    `priority:` is considered ahead of the child ticket's `priority:`.
  - Drifted-child audit (unfiled, explicitly parked by the intake): report
    child tickets whose `priority:` contradicts their epic's, so the drift is
    visible. The intake put backfilling out of scope "unless specifier judges
    otherwise"; once BL-900 lands, the child number stops driving cross-epic
    order and an audit becomes reporting rather than a migration.
  - Retire the bulk make-top-priority rewrite (unfiled): today the only way to
    raise an epic is to rewrite `priority:` on the tracker AND every child
    (`b174c9a6c`, `bc6bc9f63` — 18+ files touched per invocation). Once
    ordering reads the epic's own number, that becomes a one-field edit and
    the bulk rewriter can go.
  - Epic-reference hygiene (unfiled, measured 2026-08-16): one epic id has
    THREE trackers (`swarm-intelligence-layer` → BL-712 p31, BL-545 p30,
    BL-542 p35) and one epic id has five children but no tracker at all
    (`cost-intelligence`). BL-900 must not block on either — it defines
    deterministic fallbacks — but the underlying data wants cleaning.

