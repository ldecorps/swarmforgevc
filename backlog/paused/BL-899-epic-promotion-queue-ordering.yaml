notes: |
  ## Why this is an epic and not a lone ticket

  The intake asks for one behavior change, and BL-900 is that change. The epic
  exists because (a) no existing epic owns promotion-queue policy — the
  closest candidates are the lifecycle-ledger epic (`lean-aware-coordinator`),
  the git-choreography epic (`deterministic-transit-assist`) and the auto-heal
  grab-bag (`swarm-reliability`), and none of them is about ordering — and
  (b) the intake itself parks a second slice and the measured data surfaces
  two more, listed above. Every non-epic ticket needs a non-empty `epic:`
  (BL-544), so the alternative was filing BL-900 under an epic that does not
  describe it.

  ## Measured context, 2026-08-16 (not inferred)

  `promotion_gates_lib.bb`'s `rank-key` is
  `[(if (expedited? content) 0 1) (read-priority content) (read-id content)]`
  — the expedite bucket (Article 3.2.4), then the child ticket's OWN
  `priority:`, then id. `epic:` is read only to build an orthogonality
  ADVISORY and plays no part in ordering. Lower `priority:` numbers sort
  FIRST; an absent or unparseable value becomes 999999 and sorts last.

  Live callers, confirmed by grep rather than assumed:
  `promotion_gates_cli.bb`, `promote_and_route_next.sh`, `chase_sweep_lib.bb`.

  26 epic ids carry a `type: epic` tracker in `paused/`+`active/`; 19 epic ids
  have children. Epic trackers do carry their own `priority:` — so the data
  this epic wants to rank by already exists and has a real writer.
