description: |
  ## What is wrong

  `extension/test/renderBriefingBurndownCli.test.js` carries a
  `BL-1038-EXEMPT` comment for three tests that run against this
  checkout:
  - "renderBriefingBurndown falls back to deriving its own history when no
    snapshot path is given (smoke test against the real repo)": 12.6 s.
  - "renderBriefingBurndown falls back to deriving its own history when the
    given snapshot path does not exist": 14.1 s.
  - "the compiled CLI runs with no flags at all against the real repo":
    7.0 s.

  Each one ends in `render-briefing-burndown.ts`'s
  `deriveTicketLifecycles(runGitLog(projectRoot, 'backlog/', 'main'))`
  over the whole live history, and that cost grows with every commit. The
  file is the unit lane's slowest (34.2 s), and at 14 forks it sets the
  lane's wall. The exemption's reason is that nothing else exercises the
  fallback derivation. A fixture checkout exercises the same code path
  without the live history, which is how BL-1770 resolved the identical
  case in `briefingDigestLineCli.test.js`.

  ## What is wanted

  - The three tests run against a fixture checkout built once per file: a
    `git init -b main` under the file's own tmp dir, with a small
    `backlog/` history (two commits moving one ticket file from
    `backlog/active/` to `backlog/done/` is enough for a non-empty
    diagram), and a `.swarmforge/roles.tsv` at its root so
    `resolveProjectRoot` resolves it for `main()`. Each test still asserts
    what it asserts today.
  - The `BL-1038-EXEMPT` comment goes with the live read.
  - The file measures under 5600 ms in the unit lane, and its row in
    `backlog/suite-poles.tsv` is removed in the parcel (BL-1598's
    stale-row rule).

  ## How (direction, not mandate)

  - Copy BL-1770's fixture: `briefingDigestLineCli.test.js`,
    `mkFixtureCheckout` and its `beforeAll` (the block under "end-to-end:
    the compiled CLI's own real output, against a fixture repo"). It
    proves the fixture is its own repository (`rev-parse
    --git-common-dir` inside the root) before any mutating git command
    (BL-1390).
  - The file already stubs `process.cwd()` for its in-process `main()`
    call. Point that stub at the fixture root instead of this checkout.
  - The fake ticket ids the snapshot tests use (`ZZ-9000x`) prove which
    path ran. Keep a fixture ticket id distinct from them, so the fallback
    tests still show the derived history, not the snapshot, was used.

