id: BL-1789
title: "A vanished role session names how its agent ended - every generated launch script records its agent's start and exit (status and time) in .swarmforge/agent-lifecycle/<role>.jsonl, and babysitterd's session-missing CRIT appends the role's newest entry: the exit it recorded, a start with no exit after it, or that no entry was readable; key, severity, repair and the existing message prefix unchanged"
milestone: M8
type: defect
severity: medium
# medium: a real, recurring fault in a health signal. The CRIT fires
# correctly but carries no cause. On 2026-09-27 that let the coordinator
# tell the human 7 hardender pane deaths were OOM kills (they were not),
# and it costs the operator a forensic wake-up per vanish. Contained:
# babysitterd recreates the session in the same sweep and no parcel has
# been lost. Not high: nothing is down, and the human has already been
# corrected.
status: todo
epic: disaster-recovery-loop
priority: 15
direction: operator-found
depends_on: []
mutation_cost: low
