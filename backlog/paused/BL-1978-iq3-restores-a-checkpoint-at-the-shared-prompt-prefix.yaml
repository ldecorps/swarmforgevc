qa_e2e_procedure: |
  1. Read from the gather's acceptance row: the BL-1840 feature all pass
     (measured at mint, 2026-10-04: 7/7).
  2. `python3 swarmforge/scripts/test/test_local_model_tool_call_shim.py`
     passes, including the warm-up test if the warm-up was kept.
  3. Read the coder's committed evidence: the baseline and the trial
