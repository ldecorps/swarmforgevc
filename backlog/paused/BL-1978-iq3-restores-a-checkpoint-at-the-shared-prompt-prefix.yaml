source: |
  QA note 003809 to the specifier, 2026-10-04 21:54Z, verbatim: "iq3
  cache: 83 session-start full re-prefills (no ckpt<=4973 LCP); human ok".
  The specifier asked the human what "human ok" meant; the human chose,
  in the specifier pane (Claude Code), 2026-10-04, verbatim:

  > Spec a time-boxed spike (Recommended)

  The option read: "Medium defect: try a prefix-warming request from the
  shim (and any Ollama checkpoint setting) on one live session; keep it
  only if the server log shows restores at the shared prefix. Saves
  roughly 28% of ~89 min of re-prefill per 46 h, if it works."

notes: |
  Minted 2026-10-04 by the specifier on QA note 003809 and the human's
  pane choice (source). human_approval approved with ruling_provenance
  specifier-pane, as BL-1877 recorded its pane approval; a reply choosing
  otherwise re-pends it.
  Measured at mint from .swarmforge/ollama/serve.log (from 2026-10-03
  00:13 to 2026-10-04 ~22:55 local): 303 "forcing full prompt
  re-processing due to lack of cache data (likely due to SWA or
  hybrid/recurrent memory ...)" lines; 289 of them were checked against an
  LCP of at most 5000 tokens, and their prompt evals total 5358 s (median
  17708 tokens, 21 s each). iq3's qwen35 architecture keeps recurrent state
  the cache cannot rewind, so the server restores only from a saved
  checkpoint at or below the LCP; the stable prefix (qwen's system prompt
  and tools) is about 4973 tokens and the earliest checkpoint a session
  makes sits at 5109, just past it - e.g. task 171273: "checking checkpoint
  with [5109, 5109] against 4973...", then the forced re-process.
  Measurement method (save as a tmp/ script; read-only): for each task id,
  join "task N | forcing full prompt re-processing", "task N | checking
  checkpoint with [..] against LCP" and the next "prompt eval time = X ms /
  T tokens"; count the forced ones with LCP <= 5000 and sum X. A restore
  shows as a restored-checkpoint line for the task instead of the forced
  line.
  Steps, in order, with a stop rule (the spike's time box):
  1. Baseline: run the method over the log since the shim's last restart.
  2. Lever A, Ollama: check whether the installed Ollama exposes a
     checkpoint position or spacing setting (its env vars and `ollama
     serve --help`); if one would put a checkpoint at or below the shared
     prefix, record it - setting it is the operator's, not this parcel's.
  3. Lever B, the shim: behind the flag file
     .swarmforge/local-model-shim/prefix-warm.on (read on every request, so
     no restart is needed to try it), when a request's system message
     differs from the last one the shim forwarded (a new session), first
     send Ollama one extra call with only that system message (and the
     tools) and max_tokens 1, discard its answer, then forward the request
     unchanged. Unit-test both halves: the extra call's shape, and the
     forwarded request byte-identical with the flag on or off.
  4. Trial: create the flag file, let the seat's next compaction or new
     session happen, and run the method again over that window.
  5. Stop rule: if step 4 shows no restore at or below the shared prefix,
     remove Lever B's code, keep the evidence, and say so; the ticket
     closes on the measurement. If it shows restores, keep the code and the
     flag file, and add one line to docs/how-to/BL-1052-local-model-seat-launch.md.
  Where to read: swarmforge/scripts/local_model_tool_call_shim.py (759
  lines) - _call_upstream at ~590 and _complete at ~615 only; the tests in
  swarmforge/scripts/test/test_local_model_tool_call_shim.py (484 lines),
  read the class around one existing upstream-call test.

description: |
  ## What is wanted

  Find out whether iq3 can resume from a cache checkpoint at the shared
  prompt prefix after a compaction or at a new session, instead of
  re-processing the whole prompt, and keep the change only if it does.
  The evidence names the baseline, the lever tried, the trial result and
  the verdict, using the method in notes. Nothing qwen sends changes.

  ## What each stage checks

  - Coder: the five steps in notes, in order, with the stop rule; the shim
    tests pass either way.
