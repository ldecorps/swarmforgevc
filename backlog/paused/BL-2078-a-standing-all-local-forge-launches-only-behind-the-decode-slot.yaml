human_approval: pending
approval_context: >
  Third of three slices from the human's 2026-10-07 intake (about nine
  panes busy, GPU inference one at a time). A new feature file and a
  choice: how many tickets may be in flight at once on the standing pack,
  which caps how many seats can want the one decode slot together. FIRM:
  the pack is the live pack's seven iq3 seats standing plus its Claude
  coordinator, one model load; the gate refuses it whenever the seats
  bypass the shim (no decode slot); router packs stay mono-router as
  today. The live pack's `config single_inference_slot 1` line is read by
  nothing since BL-1752, so the new pack does not carry it - BL-2077's
  slot is what keeps inference one at a time.

ruling_options:
  - A - depth 3 (recommended)
  - B - depth 5
  - C - depth 2
ruling_tradeoffs:
  - Pros - a third parcel mostly overlaps another seat's tool time, filling much of the GPU's idle half hour, and a waiting seat waits at most two hold quanta. Cons - below the human's suggested ceiling of about 5. Recommended because the slot serves one seat at a time, so beyond about three parcels extra seats mostly queue.
  - Pros - the human's suggested soft ceiling, five parcels in flight. Cons - up to four seats can queue on one slot, each hand-over costs a 23-66 s re-prefill, and a waiting seat can wait four hold quanta, past qwen's 15 min stream idle limit unless keepalive counts.
  - Pros - fewest hand-overs and re-prefills, waits of one quantum at most. Cons - leaves more of the idle GPU time unused than depth 3.

invariants:
  - "The local pack-shape gate allows a standing local forge only while its seats reach Ollama through the tool-call shim; every shape it refused before this slice it still refuses."

description: |
  ## What is wrong

  The only launchable all-local pack on this host is mono-router
  (ollama-ista-local-model-claude-coord-mono-router: seven iq3 windows,
  one resident at a time, Claude coordinator, depth 1), because BL-1142
  decided standing local seats would wedge Ollama. With one resident, the
  GPU idles whenever that seat runs a tool or waits: busy 21, 77, 46, 49,
  50, 19, 25, 79, 67 and 43 % of the hours from 2026-10-07 20:00 to
  2026-10-08 06:00 local. The local pack-shape gate
  (local_ollama_pack_shape_lib.sh) allows only `mono-router`.

  ## What is wanted

  - A pack conf `ollama-ista-local-model-claude-coord-forge`: the live
    mono pack's seven local-model windows standing (no `config rotation
    router`), its Claude coordinator lines, the same model tag on every
    window, no `single_inference_slot` line, and
    `active_backlog_max_depth` at the human's ruling (scenario 02; QA
    checks the value).
  - A start script that runs the local pack-shape gate on that pack and
    launches it only when the gate allows (wiring entry 2).
  - The gate allows that capped standing shape while the seats reach
    Ollama through the shim, and refuses it with
    `SWARMFORGE_LOCAL_MODEL_SHIM=off`, naming the missing decode slot
    (scenario 01). Everything it refused before stays refused (invariant):
    BL-1142's five scenarios stay green.
  - The KV budget is named: one slot is one context, 73728 tokens today
    (14.5 GB on the card per /api/ps, 2026-10-08).
  - Living doc: docs/how-to/BL-1142-local-ollama-mono-vs-forge-cpu.md -
    mono-router stays the decision for router packs and the default; the
    standing forge behind the decode slot is allowed, with the
    2026-10-08 measurements and the start command.

  ## How (direction, not mandate)

  - `capped-forge` already exists in `bl1142_classify_standing_shape`
    (positive depth, at most 8 windows); allow it in
    `bl1142_shape_allowed_for_local_decision` when the shim is not off.
  - Model the start script on start-swarm-ollama-ista-local-model-claude.sh.

constraints: >
  Never launch the pack, start a seat or touch the live tmux server in a
  test: the gate and the conf are read, not run. bash 3.2 rules. The step
  handler lands with the feature (BL-233).

out_of_scope: |
  - Switching the live swarm to this pack: the human's call after the land.
  - More than one decode slot (BL-2077 notes).
  - The deterministic coordinator (BL-1846/BL-1847): the pack keeps the
    live pack's Claude coordinator, which uses no GPU.
  - Removing the inert `single_inference_slot` line from existing packs.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2078-a-standing-all-local-forge-launches-only-behind-the-decode-slot.feature`:
     3 of 3 ok (01 x2, 02).
  2. `node specs/pipeline/cli.js specs/features/BL-1142-local-ollama-mono-vs-forge-cpu.feature`:
     5 of 5 ok (measured at mint, 2026-10-08: 5/5).
  3. The pack conf's `active_backlog_max_depth` equals the number in this
     ticket's `human_ruling`.
  4. `bash swarmforge/scripts/local_ollama_pack_shape_gate.sh <root>
     ollama-ista-local-model-claude-coord-forge` exits 0, and exits non-zero
     with `SWARMFORGE_LOCAL_MODEL_SHIM=off`, naming the decode slot.
  The first live run of the pack is the human's to start; its measurement
  (the shim's hand-over log lines, waits, GPU busy per hour) is the next
  slice's evidence, not this parcel's.

