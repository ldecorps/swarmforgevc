notes: |
  Minted 2026-10-08 by the specifier, third of the intake's 1:3 split
  (BL-2076 seat names, BL-2077 the decode slot, BL-2078 this). Shape and
  measurements: BL-2077's notes.
  Not auto-approved: a feature with a new feature file and a ruling.
  The intake's soft cap on parcel-active seats is `active_backlog_max_depth`:
  each ticket in flight occupies one seat at a time, so the depth is the
  number of seats that can want the slot together.
  BL-1142's decision (mono-router stay) is amended, not superseded:
  BL-1142 scenario 01 ("names mono-router stay") still holds for router
  packs, so no BL-1142 scenario is retired.
  IR-DRY at mint: no findings after the shared Given moved to Background.
