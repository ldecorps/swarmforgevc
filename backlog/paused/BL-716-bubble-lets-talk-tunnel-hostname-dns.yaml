invariants:
  - "When the configured bridge base URL host cannot be resolved or reached, Let's Talk does not stay in a fake-healthy recording / hands-free state — the human sees a clear reconnect failure and recording stops or is refused."
  - "After the operator refreshes or receives a live tunnel URL, a Let's Talk turn succeeds without reinstalling the app."
  - "A hostname change on the host side has an operator-visible path to update the phone (settings, pairing, or Telegram) — silent stale prefs are not the steady state."

