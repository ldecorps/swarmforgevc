description: |
  ## What

  Live 2026-07-30: Let's Talk on the phone showed hands-free recording with
  `Unable to resolve host "oem-participant-outer-nail.trycloudflare.com": No
  address associated with hostname`. Turns never reached the bridge. Host had
  local bridge up and a long-lived quick tunnel; failure presented as phone
  DNS / stale prefs, not swarm-down.

  ## Queue-jump only (clarified 2026-07-30)

  Human: **not** offline expeditor / `/expedite` / pilot. Jump the promotion
  queue (`direction: queue-jump`; severity high also feeds Art 3.2.4 among
  defects), then **normal live pipeline**: specifier → coordinator to coder →
  rest of the pack. Same gates. Promote after BL-715 when both are waiting.
  Name the intent **queue-jump** so it is not confused with the expeditor.

  ## Approach

  Specifier turns this into a tight acceptance contract (detect unreachable
  URL; clear UX; refresh/push live URL; optional durable tunnel vs automated
  refresh). Coder implements. Do not redesign barge-in or wake-word intakes
  here.

  ## App discovery (human ask 2026-07-30 evening)

  Today: host Telegram-notifies the new quick-tunnel URL; Bubble stores pairing
  only in prefs / Downloads mirror and does not consume that notify — so a
  revived hostname is invisible until manual paste.

  Make the new URL discoverable — specifier picks primary:
  1. **Stable hostname** (named Cloudflare tunnel) — best; URL stops rotating.
  2. **Deep link / App Link** from the existing Telegram notify
     (`swarmforge-bubble://pair?…` or HTTPS) — one-tap writes prefs.
  3. **Fixed discovery document** on stable HTTPS (Pages / named endpoint)
     that Bubble polls on 530/DNS failure; keep token handling safe.
  4. **Failure UX** — prompt “Refresh pairing” instead of raw Cloudflare JSON.

  Near-term while quick tunnels remain: (2). Production steady state: (1).
  Share design with finish-shift revive path.

  ## Out of scope

  - Offline expeditor / pilot
  - Closing-ceremony / briefing
  - Full hey-bubble / barge-in intakes

