qa_e2e_procedure: |
  On the parcel commit, from the repo root, on this Linux host:
  1. `bash swarmforge/scripts/test/test_operator_runtime_fixture_reaper_sweep_liveness_undetermined.sh`
     and `bash swarmforge/scripts/test/test_operator_runtime_sandbox_sweep_liveness_undetermined.sh`
     three times each -> `ALL CHECKS PASSED`, exit 0.
  2. `grep -n SWARMFORGE_PROC_DIR <each file>` shows the seam on the
     undetermined tick; `git diff main...HEAD -- swarmforge/scripts/proc_fd_scan_lib.bb swarmforge/scripts/fixture_reaper_sweep_lib.bb swarmforge/scripts/sandbox_sweep_lib.bb`
     is empty.
  3. `bash swarmforge/scripts/test/test_operator_runtime_fixture_reaper_sweep.sh`
     and `..._sandbox_sweep.sh` (the determined-case siblings) still pass.
  4. Break-then-restore: remove the seam from one file; on this host its
     undetermined checks fail again; restore.
  5. Both rows are gone from `backlog/standing-reds.tsv`.
