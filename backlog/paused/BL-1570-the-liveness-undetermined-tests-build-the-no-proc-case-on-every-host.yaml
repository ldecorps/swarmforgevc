description: |
  ## What is wrong

  Two BL-877 shell tests (lane shell, `standing`) fail on `main`
  674d50539a on this Linux/WSL host:

  - `test_operator_runtime_fixture_reaper_sweep_liveness_undetermined.sh`:
    `FAIL - undetermined: the process rooted in the reaped root survives`
    and `... records its own distinct liveness-undetermined message`.
  - `test_operator_runtime_sandbox_sweep_liveness_undetermined.sh`:
    `FAIL - undetermined: a stale sandbox with nothing rooted in it is KEPT`
    and `... the sweep records that liveness could not be determined`.

  Both headers say "On this host /proc is already absent (macOS). Pointing
  SWARMFORGE_LSOF_BIN at a nonexistent path ... simulates total
  unavailability". On Linux `/proc` exists, `proc-fd-scan-lib/live-pid-paths!`
  answers from it, liveness IS determined, and the sweeps correctly reap
  the stale orphan - the opposite of what the undetermined case asserts.
  The same commit that landed the tests (184f6ac467, 2026-08-11) gave
  `proc_fd_scan_lib.bb` a `SWARMFORGE_PROC_DIR` override "so a test" can
  point it elsewhere; neither test uses it. Rerun with
  `SWARMFORGE_PROC_DIR=/nonexistent-proc`, both print `ALL CHECKS PASSED`.
  Red on every Linux host since 2026-08-11, 34 days, unseen because
  nothing runs the standing shell suite (BL-1526's gap) and the files
  were written and last run on macOS.

  ## What is wanted

  Each file's undetermined tick exports `SWARMFORGE_PROC_DIR` naming a
  directory that does not exist (alongside the nonexistent lsof it already
  forces), so the case is constructed identically on macOS and Linux; the
  header comment describes the construction instead of the host. Both
  files print `ALL CHECKS PASSED` on `main` on this host, and the two
  register rows this ticket adds are removed in the same land.

  ## How (direction, not mandate)

  - Add `SWARMFORGE_PROC_DIR="$REAP_ROOT/.no-proc"` (any path under the
    fixture that is never created) to the `run_tick` env of each file, on
    the undetermined tick; a green tick elsewhere in the same file, if any,
    keeps the real `/proc`.
  - Step handler `specs/pipeline/steps/bl1570LivenessUndeterminedProcDirSteps.js`
    runs both shell tests as subprocesses and greps each FILE for the seam;
    it lands in the same commit as the feature (BL-233).

  ## Not in scope

  - `proc_fd_scan_lib.bb`, `fixture_reaper_sweep_lib.bb`,
    `sandbox_sweep_lib.bb`, `process_table_lib.bb` and the determined-case
    siblings (`test_operator_runtime_fixture_reaper_sweep.sh`,
    `test_operator_runtime_sandbox_sweep.sh`, green) are not touched.

