description: |
  ## What is wanted

  A ledger event belongs to the first ceremony run after it is appended,
  whatever its `at` stamp says (every bounce event is stamped at midnight
  of its date, extension/src/metrics/leanLedgerComposeBounce.ts). The fold
  goes by append order from where the previous run stopped, so no event is
  folded twice and none is skipped. The first run on record folds the
  whole ledger; a previous run from before BL-1967 carries no record of
  where it stopped, so the first post-fix run starts at that run's
  `deliveredAt` (it may re-see the few events that run folded) - never the
  whole ledger; name that migration run and its folded count in the
  evidence. An empty window keeps the explicit empty outcome.

  ## How (direction, not mandate)

  - The ledger files are append-only JSONL with an idempotent appender. A
    per-file cursor on the run - lines already folded per
    `<yyyy-MM-dd>.jsonl` - lets the next run fold every line past it,
    without reading a stamp and without a new field on the event. A
    `recordedAt` stamp on every event is the other honest route.
  - `shiftWorkedSinceLastCeremony`, `isEmptyCeremonyPacket` and the
    determinism candidates (BL-1365) are untouched.
  - Retire the "calendar-day bucketing, no shift boundary exists yet"
    sentences in closingCeremony.ts's fold comment and the
    leanLedgerStore.ts header ("re-bucketing is a mechanical follow-up").
    The per-day file bucketing itself stays.

  ## What each stage checks

  - Coder: the five scenarios; closingCeremony.test.js passes.
  - Hardender: mutation on the fold.
  - Documenter: docs/reference/BL-820-closing-ceremony-lean-pass.md ("a
    pure fold over one shift's worth of ledger events" - define the
    window) and docs/reference/BL-819-ticket-lifecycle-ledger.md lines
    40-43 (the "shift boundary that doesn't exist yet" clause).

