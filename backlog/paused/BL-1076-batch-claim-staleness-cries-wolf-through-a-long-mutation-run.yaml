id: BL-1076
title: "The batch-claim staleness observer judges every role by one flat 20-minute HEAD clock, so a hardener mid-Stryker - an hour of real work with edits uncommitted in its worktree - is surfaced to the coordinator as a suspect claim, twice"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
priority: 96
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1076-batch-claim-staleness-cries-wolf-through-a-long-mutation-run.feature
human_approval: approved
approval_context: >
  Three calls in this ticket are mine and reversible if you disagree.

  SEVERITY HIGH, NOT MEDIUM. The blast radius is only coordinator attention -
  the observer is structurally incapable of touching the parcel (BL-678
  invariant 2), and the coordinator correctly read all six notes as false. What
  makes it high is what a health signal that fires on correct behaviour does
  over time: this one cries wolf on every long mutation pass, which is exactly
  the class of note that must still be believed the day it is real, because the
  near-miss BL-678 was built to prevent is a duplicate forward of a parcel that
  really has stalled. If you would rather it not sit in the expedite lane
  alongside the current high-severity queue, say so and I will re-cut it as
  medium - the fix does not change.

  THE HARDENER WINDOW IS 90 MINUTES, COPIED NOT SHARED. BL-528 already grants
  hardender a 90-minute window in its own task-mode ladder for this exact
  reason, so the number is not invented here. The two libraries deliberately
  keep separate literals: they answer different questions (is the owner alive
  and working, versus is this claim progressing) and may legitimately diverge.
  The ticket says so out loud so the cleaner does not DRY them into one shared
  constant on the next boy-scout pass.

  A PER-ROLE CONF KEY IS IN SCOPE. Strictly, the defect is fixed by the
  built-in map alone. I added the operator override because without it neither
  you nor QA can exercise the behaviour without a 90-minute soak, and a fix
  nobody can watch work is a fix nobody can trust. It is six lines mirroring
  two parsers that already exist beside it.

required_wiring:
  - "specs/pipeline/steps/index.js::bl1076BatchClaimVisibleWorkSteps::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this feature file. Verified absent from index.js at spec time, so the anchor cannot pass before the work is done"
  - 'swarmforge/scripts/batch_claim_progress_lib.bb::"hardender"::the per-role tolerance map must carry a hardener entry in the pure lib, not only in the daemon adapter - the whole defect is that this literal is missing here. Verified absent from this file at spec time'
  - "swarmforge/scripts/batch_claim_progress_lib.bb::worktree-dirty::the visible-work gate must reach the pure decision function, not live only in the daemon wiring where no unit or mutation run can see it. Verified absent from this file at spec time"
  - "swarmforge/scripts/handoffd.bb::batch-claim-progress-suppressed::a suppressed observation must reach the daemon log, or invariant 2 has no delivery and a permanently dirty worktree silences the signal with nothing to show for it. Verified absent from this file at spec time"
  - "swarmforge/swarmforge.conf::batch_claim_progress_role_stale_threshold_minutes::the operator override must be documented beside the two keys it mirrors, or it is a setting only the source tells you exists. Verified absent from the conf at spec time"
  - "swarmforge/scripts/test/batch_claim_progress_sweep_harness.bb::worktree-dirty::the sweep harness reimplements the daemon call rather than invoking it, so an un-updated harness silently keeps testing the old two-argument shape and every sweep-level scenario goes vacuous. Verified absent from the harness at spec time"

invariants:
  - "The observer remains incapable of acting on a parcel. No label it can return, including the new suppression label, re-forwards, re-delivers, moves, copies or deletes a handoff; the only observable action past this namespace is still a coordinator-facing note."
  - "No suppression is silent. Every observation the sweep declines to surface is recorded against the parcel id with its reason, so a worktree that is dirty forever is visible as a suppressed signal rather than as an absent one."
  - "The stale clock is driven only by the sidecar recorded progress instant, and that instant moves only when HEAD actually advances. No gate defers a decision by rewriting lastProgressAtMs, so a reported age is always the true age since real progress."

description: |
  ## What is wrong

  `batch_claim_progress_lib.bb` (BL-678) surfaces a coordinator note when a
  batch role's worktree HEAD has not moved for `default-stale-threshold-ms`.
  That threshold is one flat 20 minutes for every batch role, and HEAD movement
  is the only progress signal it reads. A hardener mid-Stryker breaks both
  assumptions at once: mutation passes routinely run an hour or more before the
  first commit, and the work in flight sits uncommitted in the worktree.

  Measured on this host on 2026-08-22, from
  `.swarmforge/daemon/handoffd.log` and the sidecars under
  `.worktrees/hardender/.swarmforge/handoffs/inbox/in_process/batch_20260822T202018Z_000001/`:

  - 20:20:18Z - hardener claims a three-parcel batch (BL-1015, BL-1057, and
    the BL-975 QA merge-up note).
  - 20:20:44Z - merges land; all three sidecars record `lastCommit f0eb88878f`.
  - 20:40:46Z - the sweep surfaces all three as suspect. The hardener is
    working: `git status --porcelain` in its worktree shows
    `M extension/test/boyScoutRun.test.js`.
  - 21:10:48Z - the 30-minute cooldown expires and all three are surfaced
    again.

  Six coordinator notes in fifty minutes, none describing anything wrong. The
  coordinator recognised them as false and reported the pattern rather than
  acting on them, which is the good outcome and not one to rely on.

  ## Why it matters

  The observer is structurally incapable of touching a parcel, so nothing was
  damaged. The cost is that a health signal fires on correct behaviour, every
  long mutation pass, forever. The note it produces is the one that must still
  be believed on the day a batch claim really has stalled - that is the
  duplicate-forward near-miss BL-678 was built to prevent.

  ## What good looks like

  A batch claim is surfaced as suspect only when its owner shows no work by
  either signal available: HEAD has not moved for that role's own tolerance,
  AND the worktree holds no uncommitted work. Everything else the observer does
  is unchanged.

  ## How (direction, not mandate)

  Both signals are already proven next door in BL-528's task-mode ladder
  (`claim_progress_lib.bb`), which grants `hardender` 90 minutes via
  `:role-idle-timeout-ms` and treats `worktree-dirty?` as not-yet-overdue. The
  same two ideas, applied to the batch observer:

  1. A per-role tolerance map in `batch_claim_progress_lib.bb` resolved the way
     `resolve-claim-idle-timeout-ms` resolves its own: the role entry wins for
     that role, the configured base applies to everyone else. `hardender` gets
     90 minutes.
  2. A visible-work gate: a dirty owner worktree yields a third label
     (`:suppressed-visible-work`) alongside `:silent` and `:stale-suspect`.
     Suppressed and silent both send nothing; suppressed is logged. The daemon
     adapter `role-worktree-dirty?` already exists at `handoffd.bb:1528` and is
     already passed into another sweep spec, so this is a pass-through, not new
     machinery.
  3. An operator override `config batch_claim_progress_role_stale_threshold_minutes <role> <n>`,
     parsed with the same degrade-to-default posture as the two keys beside it.

  Deliberately NOT shared with BL-528: the two libraries keep their own 90.
  They answer different questions and may diverge; the header comment should
  say so, because the obvious cleanup is to merge them and that would couple a
  liveness ladder to a progress observer.

  Two documentation edits ride along, because they are what stops the next
  reader from re-deriving all of this: `batch_claim_progress_lib.bb`'s header
  says the decision "only ever returns one of two labels" - the third label
  preserves the substance of BL-678 invariant 2 but falsifies that sentence,
  and it needs re-wording rather than deleting. `swarmforge/handoff-protocol.md`
  describes the sweep and needs the new gate.

  ## Scope

  - `swarmforge/scripts/batch_claim_progress_lib.bb` - per-role map, resolver,
    third label, header re-wording.
  - `swarmforge/scripts/chase_sweep_lib.bb` - pass role and dirtiness through
    `apply-batch-claim-progress-check!`; per-role conf parser.
  - `swarmforge/scripts/handoffd.bb` - wire `role-worktree-dirty?` into
    `batch-claim-progress-sweep!`; log suppressions.
  - `swarmforge/scripts/test/batch_claim_progress_sweep_harness.bb` - mirror
    the daemon call shape.
  - `swarmforge/swarmforge.conf`, `swarmforge/handoff-protocol.md` - document.
  - `specs/features/BL-1076-...feature` and its step handler.

  Out of scope, recorded on the BL-539 epic as the next slice: one batch claim
  produces one note per parcel (three parcels, three notes, twice over here),
  and a QA merge-up `note` parcel is observed for commit progress at all. Both
  are real, both are about note volume rather than false positives, and folding
  them in would push this past one sitting.

qa_e2e_procedure: |
  Run in the live swarm. The per-role conf override exists so this takes
  minutes rather than a 90-minute soak.

  1. Baseline, non-overridden role is unchanged. With no per-role key set,
     confirm a cleaner batch claim whose HEAD has not moved and whose worktree
     is clean is still surfaced at the base threshold: watch for
     `batch-claim-progress-suspect <id>` in `.swarmforge/daemon/handoffd.log`
     and the matching coordinator note.

  2. Per-role tolerance. Add `config batch_claim_progress_role_stale_threshold_minutes hardender 2`
     to `swarmforge/swarmforge.conf`. With the hardener holding a batch claim,
     clean worktree, HEAD unmoved, confirm a suspect line appears after ~2
     minutes - proving the per-role key is read. Remove the key and confirm
     that with HEAD unmoved for 25 minutes and a clean worktree, no suspect
     line is emitted for the hardener, while step 1 still fires for cleaner.

  3. Visible-work gate. Re-add the 2-minute hardener key, then dirty the
     hardener worktree (`touch` a tracked file so `git status --porcelain` is
     non-empty). Wait past the threshold and confirm:
     - NO `batch-claim-progress-suspect` line for that parcel,
     - NO note in the coordinator inbox for it,
     - a `batch-claim-progress-suppressed` line naming the parcel id and the
       reason.
     Then clean the worktree and let HEAD advance by one commit; confirm the
     sidecars for every parcel in that batch record the new commit and no note
     is sent.

  4. Nothing was touched. For every parcel exercised above, confirm it is still
     in `in_process` with no copy in `inbox/new/` and no duplicate anywhere in
     the mailbox tree.

  5. Remove the conf key added for the test and confirm the daemon returns to
     the built-in tolerances.

notes: |
  Provenance: coordinator `note` 20260822T211127Z_001029, priority 40,
  "Stale-claim self-note false-positives on hardener long Stryker runs, 2x".
  Called a self-note because the daemon sends it with SWARMFORGE_ROLE set to
  coordinator and addressed `to: coordinator` - the coordinator sees it arrive
  from itself. That is BL-678 working as designed; only the trigger is wrong.

  IR-DRY: the checker reports six medium findings on this feature file, all of
  the same shape - a parameterised step (`<minutes>`, `<role>`,
  `<observation>`) flagged against a literal form of the same step in another
  scenario. One handler regex serves both forms, so this is not accidental
  drift and the checker's own guidance ("normalize only when the different
  wording is accidental drift") says leave it. Recorded here so it is not
  re-litigated at architect or hardener.

  BL-678's own feature file is not falsified by this change: its scenario 04
  ("a stale-progress parcel is surfaced as suspect") runs as the synthetic role
  `batchrole`, which has no per-role override, in a worktree whose only writes
  are under the gitignored `.swarmforge/` and so reads clean. It must stay
  green - if it goes red, the gate has been changed in a way this ticket did
  not ask for. Its harness does need the new call shape (see required_wiring).

