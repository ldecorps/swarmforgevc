invariants:
  - "Every hard-tier verb (stop, start, restart, bounce, drain-*, ensure, ambulance, kill-all, hydrate, mint, autopilot, land) is a no-op unless the sender is the principal AND the message is in the Cursor Remote topic (or an explicitly aligned Control alias) AND the confirm gate has passed — wrong topic or unauthorised tap never mutates swarm state."
  - "Every path that starts or relaunches swarm, extension child, or cursor/headless bridge after /start, /restart, /bounce, or /redeploy re-reads .swarmforge/swarm.env before spawn — never relaunches from a stale host process.env alone."
  - "/pilot, /autopilot, and /land refuse when the swarm is live (unless an explicit Stop & run confirm runs first); /hydrate and /mint refuse when any full-pack pipeline role is up — Cursor-as-expeditor never races a live pack."

