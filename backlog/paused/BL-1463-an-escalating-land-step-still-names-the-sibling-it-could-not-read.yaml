qa_e2e_procedure: >
  (1) `specs/pipeline/scripts/run_acceptance.sh
  specs/features/BL-1272-a-landed-sibling-is-not-reported-as-entangled.feature`
  prints `ok 1..6` (row 4 included). (2) `bb
  swarmforge/scripts/test/land_step_lib_test_runner.bb` green, including
  BL-1343's scenario-06 case. (3) In a scratch clone, make a sibling's
  attribution unreadable the way BL-1272's handler does (an `own.txt`
  the walk cannot read) and run `bb swarmforge/scripts/land_step_cli.bb
  <task> <tip>`: `LAND_ESCALATE`, one `ENTANGLED_SIBLING <sibling>`, the
  note naming it, the reason, exit 1. (4) `land_step_cli.bb no-ticket-task
  <tip>`: `LAND_ESCALATE` and no `ENTANGLED_SIBLING` line. (5) The
  register has no row for BL-1272's feature.

