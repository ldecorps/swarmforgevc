approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. What is FIRM: BL-1343's refusal
  stands (an unreadable attribution escalates, never narrows to a replay);
  this parcel adds names to the refusal, not a replay. BL-1272's feature
  text is unchanged - its row 4 goes green because the CLI now says what
  the scenario always asked for.

invariants:
  - "Whenever the land step holds positive evidence that a sibling is unlanded - an attribution it could not read included - every outcome it prints, LAND_REPLAY or LAND_ESCALATE, names that sibling; naming never depends on which action follows."
  - "BL-1343 scenario 06 holds: an unreadable attribution refuses rather than narrowing; the escalate map gains the sibling sets and loses nothing."

description: |
  ## What is wrong

  `swarmforge/scripts/land_step_lib.bb` `land-plan`: after
  `entangled-siblings` returns `{:entangled :landed :unlanded ...}`, the
  cond's third branch calls `own-paths`; when it returns `paths` nil (the
  attribution could not be read - BL-1343 scenario 06's fail-closed case)
  the plan is `{:action :escalate :reason ...}` and nothing else. The
  `:replay` branch two lines below carries `:entangled :landed :unlanded
  :landed-paths :excluded :passengers`; the escalate branch carries none.
  `land_step_cli.bb`'s `:escalate` outcome prints `LAND_ESCALATE` and the
  reason and exits 1 - no `ENTANGLED_SIBLING` line (printed only under
  `:replay`, line ~148) and no `entanglement-note` (printed only for a
  failed replay, line ~166).

  BL-1272's scenario 01 row 4 ("unreadable" sibling state, expected
  "reported") reads the CLI output through `namedAsEntangled`, which looks
  for the sibling id on an `entangled tip - sibling ticket(s)` note line.
  Output on main (2026-09-07, reproduced by the specifier):
  `LAND_ESCALATE` / `land-step: could not read own.txt's attribution` - the
  sibling is never named. Rows 1-3 and scenarios 02-03 pass. The feature's
  hardener stamp is 2026-08-30 (8/8 mutants killed); BL-1343 landed
  2026-09-02 and turned the unreadable case from a narrowed replay (which
  named the sibling on the replay path) into an escalate (which names
  nobody). BL-1389 (2026-09-04) rewrote the same branch and kept the shape.
  Found by the coder on 2026-09-07 verifying BL-1447's e2e
  (`backlog/evidence/BL-1447-unowned-reds-bl1272-bl1297-20260907.md`, coder
  branch), reproduced identically on the pre-BL-1447 library.

  ## What is wanted

  An escalating land step names the siblings it has evidence for: the
  escalate map carries the same `:entangled :landed :unlanded` sets the
  replay map does, and the CLI prints `ENTANGLED_SIBLING <id>` per unlanded
  sibling plus the entanglement note on every escalate that has them
  (scenario 01), and nothing of the kind when it has none (scenario 02).
  The action stays escalate (scenario 03). BL-1272's feature goes green
  with its text untouched, and its register row leaves (scenario 04).

  ## How (direction, not mandate)

  - `land-plan`: in the `(nil? paths)` branch, `(merge {:action :escalate
    :reason ...} (select-keys sets [:entangled :landed :unlanded]))`; the
    earlier `warning` escalate (entangled-siblings could not walk) has no
    sets and stays bare; the "task name names no ticket id" escalate
    likewise. Read the landed BL-1446 first - the branch moved.
  - `land_step_cli.bb` `:escalate` outcome: after `LAND_ESCALATE`, print the
    `ENTANGLED_SIBLING` lines and `(entanglement-note task-name (:unlanded
    plan))` when `:unlanded` is non-empty, then the reason; keep exit 1.
    Share the sibling-printing block with the replay outcome (one
    function) rather than a second copy.
  - Fixtures: `land_step_lib_test_runner.bb`'s BL-1343 scenario-06 case
    asserts the escalate map now carries the sets; BL-1272's handler needs
    no change (its `namedAsEntangled` reads the note line).
  - Docs: `docs/reference/BL-1241-entangled-tip-at-the-land-step-has-a-reachable-remedy.md`
    outcome table - LAND_ESCALATE lists siblings when it has them. The QA
    prompt's land-step item describes the three outcomes; the documenter
    adds the sibling lines to the escalate outcome there too (prose is
    specifier-owned: the specifier lands that line at activation and
    records the commit here). No registered diagram changes.

