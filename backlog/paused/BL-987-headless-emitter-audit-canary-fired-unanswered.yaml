id: BL-987
title: "headless dark-emitter audit canary has been firing unanswered: audit-04 expects zero resource-sample entries in live chaser telemetry, finds 1022 - decide whether H1 is stale or a headless caller was added"
milestone: M8
type: defect
severity: medium
status: todo
epic: code-quality-gates
human_approval: approved
priority: 30
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-336-headless-dark-emitter-audit.feature

invariants:
  - "The audit's recorded headless verdicts match the live system at the moment the audit runs - a verdict that no longer holds fails the audit rather than being carried forward."
  - "Every live artifact the audit re-verifies against is resolved at run time, never named by a literal that can go stale. A path pinned to a calendar month stops describing the live system the moment that month ends, and the audit cannot tell."

description: >
  Severity rationale: medium - a real, contained defect. The contract is
  doing its job (it detected drift); what is broken is that nobody answered
  it, so the acceptance suite has carried a standing red.

  Reported by the coder as one of four pre-existing acceptance reds
  (BL-336/337/343/578, note 20260820T122656Z_000380).

  Measured 2026-08-20 13:29 by the specifier - 1 of 8 scenarios red, the
  other 7 green. Verbatim:

    Scenario "The verdict comes from a real headless run, not from reading
    the code" failed at step "Then each verdict is supported by which
    surfaces populated in that run": audit-04: expected zero resource-sample
    entries in the live chaser telemetry (H1's own re-verification) - found
    1022. Either H1 is stale or a headless caller was added without updating
    the audit.

  This is NOT a contract that rotted and should be loosened. It is a canary
  that fired: the audit deliberately re-verifies its own recorded verdict
  (H1) against the live system, and the contract's own error text names the
  two possible answers. The fix is to answer it, not to widen the assertion.

  Which of the two it is, is exactly the work of this ticket and is
  deliberately NOT guessed at spec time:

  - If a headless caller WAS added since H1 was recorded, the audit is
    correct and out of date - update the audit to record the new caller and
    its verdict.
  - If H1 is simply stale (the verdict no longer describes the system),
    re-derive it from a real headless run and record the new verdict.

  1022 entries is a large number, which weakly favours "a caller was added
  and has been running for some time" over "an off-by-a-few drift" - offered
  as a starting hypothesis to test, not a conclusion.

  How (direction, not mandate): re-run the audit's own headless procedure to
  establish ground truth first, then correct whichever side is wrong. The
  contract already describes the procedure; scenario 01's other 7 passing
  scenarios show the harness itself is sound.

  AMENDMENT 2026-08-20 (specifier, from hardender note
  20260820T144928Z_000280). THE OPEN QUESTION IS SETTLED BY MEASUREMENT, and
  the real defect is bigger than either branch above.

  The hardener reported that `chaser-2026-07.jsonl` holds the 1022
  resource_sample rows and that they date from Jul 19. Both true. But that
  file is not the live one, and the live one tells a different story.
  Measured directly, 2026-08-20 ~14:55:

  | file                  | resource_sample rows | first          | last                     |
  |-----------------------|----------------------|----------------|--------------------------|
  | chaser-2026-07.jsonl  | 1022                 | 2026-07-19     | 2026-07-21T21:01:58Z     |
  | chaser-2026-08.jsonl  | 10389                | 2026-08-01     | 2026-08-20T14:54:39Z     |

  So: a headless caller is emitting resource samples RIGHT NOW, continuously,
  and has been all month. The "H1 is stale" branch is dead - this is the
  "a headless caller was added" branch, and it is no longer a hypothesis to
  test. The starting hypothesis recorded above ("1022 weakly favours a caller
  was added") reached the right conclusion for the wrong reason: 1022 was
  never the live number.

  THE ACTUAL DEFECT, and it is in the audit itself
  (`specs/pipeline/steps/headlessDarkEmitterAuditSteps.js:116`):

    const chaserPath = path.join(MAIN_CHECKOUT, '.swarmforge', 'telemetry',
                                 'chaser-2026-07.jsonl');

  The month is a hardcoded literal, written when the audit was authored in
  July, and the comment two lines above calls it "the real main checkout"
  live telemetry. `chaser-*.jsonl` is a MONTHLY ROLLING family - the writer
  is `monthlyTelemetryFile` in `extension/src/metrics/resourceTelemetry.ts:145`,
  which composes `chaser-${YYYY-MM}.jsonl` from the sample's own timestamp.
  July's file has been frozen since 2026-07-21. The audit has therefore been
  re-verifying H1 against a dead archive since 2026-08-01, and will report
  1022 forever no matter what the live system does.

  THE TRAP, which is why this must not be fixed the obvious way: answering
  the canary by updating H1 to record "1022 resource samples exist" makes the
  suite GREEN and PERMANENTLY BLIND - green against a frozen file, while the
  live file it never opens grows unbounded. That is the same false-green
  family as BL-986 (a scanner whose count fell to zero because the prose
  moved out of the scanned set) and BL-968 (a gate blind from its own
  landing). Both were found by accident, months later.

  How (direction, not mandate), REVISED: fix the pointer first, then answer
  the canary against the live file. Resolve the telemetry path at run time -
  derive the current month the way the writer does, or read the whole
  `chaser-*.jsonl` family - and only then record H1's corrected verdict for
  the caller that is actually emitting.

constraints: >
  Firm lines:

  - Do NOT re-baseline the expectation to 1022 to make the suite green.
    Recording "whatever the system currently does" turns the canary into a
    tautology and is the precise failure the audit exists to prevent.
  - Do NOT fix it silently inside the audit. Scenario 08 ("Nothing is fixed
    silently inside the audit") is a passing contract today and must stay
    passing; a newly discovered dark emitter becomes its own ticket
    (scenario 07), not an in-place repair.
  - The verdict must come from a real headless run, not from reading the
    code. That is scenario 04's whole subject - the one that is failing.
  - Do NOT leave the hardcoded month in place while answering the canary.
    A verdict recorded against `chaser-2026-07.jsonl` is a verdict about an
    archive, and the audit cannot tell the difference. The path must be
    resolved at run time (invariant 2). This is not an optional tidy-up: it
    is the difference between a fix and a permanent false green.
  - Do NOT hardcode `chaser-2026-08.jsonl` instead. Swapping one dead literal
    for the next one is the same defect with a later expiry date - it would
    go stale on 2026-09-01 and nobody would notice until the next audit red,
    if there ever is one.

notes: >
  Source: coder note 20260820T122656Z_000380, one of four reds. The other
  three have genuinely different causes and are separately ticketed
  (BL-986 scanner blindness, BL-988 orphaned contract, BL-989 grep -P).

  Diagnosis captured at 13:29 on 2026-08-20, BEFORE the 13:38
  `git pull --rebase --autostash` detached the master checkout, so it is not
  contaminated by that swapped tree.

  Sibling in kind: BL-816 (paused) is the process rule that a red suite
  observed and waved through must leave a recorded decision. This ticket is
  what BL-816 exists to prevent - a canary that fired and was carried
  silently. Worth citing there as a live instance.

  AMENDMENT SOURCE: hardender note 20260820T144928Z_000280, "BL-336 audit
  stale: chaser-2026-07.jsonl has 1022 resource_sample rows, Jul19". The
  report is accurate and was the thread worth pulling - but on its own it
  points the wrong way. Read alone it suggests the telemetry is old and the
  emitter quiet, which would favour the "H1 is stale" branch. Opening the
  sibling August file inverted that: 10389 rows, the newest written five
  minutes before the note was sent. The lesson for the next reader is that a
  count from ONE file in a monthly rolling family is never evidence about the
  live system - the same shape as a stale-ref read.

  What did NOT change: the re-baseline prohibition stands unchanged and now
  matters more, since the tempting number (1022) is not merely
  whatever-the-system-does, it is whatever-a-dead-archive-did.

qa_e2e_procedure: >
  1. Run the contract and assert all 8 scenarios green:
     `node specs/pipeline/cli.js
     specs/features/BL-336-headless-dark-emitter-audit.feature <outdir>` -
     runner exit 0. Do not pipe through tail; that masks the exit code.
  2. Assert the answer is recorded, not assumed: the ticket must state which
     branch was true (caller added vs H1 stale) with the real headless run
     that established it.
  3. Negative check on the re-baseline constraint: confirm the expected value
     in audit-04 is still a derived zero-or-justified figure, not the literal
     1022 observed today.
  4. Confirm scenarios 07 and 08 still pass - a newly found emitter became a
     ticket and nothing was repaired in place.
  5. Confirm the pointer is derived, not literal: grep the audit's step
     handler for `chaser-2026-` and assert ZERO hits. Any calendar month in
     a path literal fails this step regardless of whether the suite is green.
  6. Confirm the audit now reads the live file: with the fix in place, the
     count audit-04 reports must match
     `grep -c resource_sample .swarmforge/telemetry/chaser-$(date +%Y-%m).jsonl`
     on the main checkout. If it still reports 1022 while that command
     returns five figures, the pointer was not fixed.
  7. Prove the false-green trap is closed - this is the important one. Roll
     the clock forward past a month boundary (or add a row to a
     next-month file) and confirm the audit follows it rather than staying
     pinned. An audit that goes green in step 1 but cannot pass this step has
     been made blind, not fixed.

approval_context: >
  I did not guess which branch is true (headless caller added vs H1 stale),
  because the contract's own message says both are possible and neither is
  determinable without a real headless run. That determination is the
  ticket's work rather than a spec-time assumption.

  Severity is medium rather than high, but the reason has changed and you
  should know it. I originally wrote "unlike BL-986, this signal is not
  reporting a false ZERO - it is loudly correct and merely unanswered." That
  is no longer accurate: the audit reads a frozen July archive, so its 1022
  under-reports the live figure by an order of magnitude and is pinned
  forever. It is a stale number, not a correct one.

  I have kept `medium` anyway because the audit is currently RED and loud -
  nothing is silently passing today, so the fault is contained. What makes it
  worth your eye is the trap rather than the current state: the obvious fix
  (record 1022 as the new verdict) turns a loud red into a permanent silent
  green. Say the word if you would rather carry it at `high` on the strength
  of that.
