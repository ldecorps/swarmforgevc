source: |
  QA note 2026-08-20T18:13Z (priority 00, to specifier+coordinator): "New
  defect: BL-982/983 steps reintroduce BL-948 socket-root violation".

  Specifier-probed the same day, and the probe CONFIRMED the report rather
  than correcting it (unusual - most filed hypotheses do not survive):

  - `specs/pipeline/steps/bl982SecondSeatSteps.js:54` and `:103`, and
    `specs/pipeline/steps/bl983StageQueueSteps.js:34`, each call
    `fs.mkdtempSync(path.join(os.tmpdir(), '<prefix>'))`.
  - Both files also reference a control socket - `bl982...:248-249` and
    `bl983...:52-53` write `fake.sock` and `.swarmforge/tmux-socket`.
  - That is both halves of the gate's in-scope predicate
    (`specs/pipeline/steps/lib/socketFixtureRootGuard.js`), so both files
    are violations by the gate's own definition.
  - Running the standing gate confirms it: `npx vitest run
    test/socketFixtureShortRootGuard.test.js` from `extension/` fails
    1 of 16 - "the real specs/pipeline/steps tree has zero socket-fixture
    long-root violations" - and the failure output names both files with
    the remedy. The other 15 cases pass.
  - Both files are tracked on `main` (BL-983 landed them at `0817e9ef1`).

description: |
  ## What

  BL-948 shipped two things: `specs/pipeline/steps/lib/socketFixtureRoot.js`'s
  `mkSocketFixtureRoot` helper, and a standing gate that fails the suite when
  a socket-building step file roots its fixtures at `os.tmpdir()`. macOS
  resolves `os.tmpdir()` under `/var/folders/<hash>/<hash>/T/`, so a fixture
  root there plus `.swarmforge/tmux/<hash>.sock` overruns
  `swarm_socket_lib.bb`'s fail-closed 100-char limit, and the scenario dies on
  a socket-path refusal instead of asserting its own behaviour. Three step
  files hit this on 2026-08-19 and were each patched locally; BL-948 exists to
  make the fourth recurrence impossible.

  BL-982 and BL-983 are the fourth and fifth recurrence.

  ## What is NOT wrong

  **The gate.** This is worth stating plainly because the obvious reading of
  "a violation landed" is "the gate has a hole", and that reading is false
  here. The gate's in-scope predicate is exactly right, it inspects each
  file's own text at gate time as BL-948's invariant 1 requires, it catches
  both files, and it prints the remedy. Do not spend this ticket widening it.

  ## The fix

  Replace the three `fs.mkdtempSync(path.join(os.tmpdir(), '<prefix>'))` calls
  with `mkSocketFixtureRoot('<prefix>')` from
  `specs/pipeline/steps/lib/socketFixtureRoot.js`, and make the gate green.
  While in each file, confirm the fixture root is removed in a `finally` and
  not merely after the last assertion - BL-948's invariant 2, and the shared
  engineering rule.

  ## Scope

  - `specs/pipeline/steps/bl982SecondSeatSteps.js`
  - `specs/pipeline/steps/bl983StageQueueSteps.js`
  - `specs/features/BL-1002-...feature` and its step handlers

  Explicitly NOT in scope: changing the gate, changing the helper, the
  behaviour BL-982/BL-983 assert, and the shell-fixture surface (that is
  BL-974, which declares itself disjoint from `specs/pipeline/steps/`).

notes: |
  **`human_approval` is deliberately omitted, not forgotten.** Per
  backlog-schema.md, absent means "not applicable (no approval needed)" and
  the promotion gate passes it, whereas a literal `pending` fails CLOSED and
  would block this behind a human tap. There is no design decision here - the
  remedy is dictated by an already-shipped helper - and `main`'s test lane is
  red while this waits. If you would rather review it first, set it to
  `pending` and it will hold.

  **Corroborated independently 2026-08-20 18:50, and the cost is worse than
  "main's lane is red".** The hardener hit this while hardening BL-995 (note
  `20260820T184403Z_000292`, evidence
  `backlog/evidence/hardener-found-defect-socket-fixture-root-bl982-983-20260820.md`,
  written in the hardener worktree and committed with that parcel). They ran
  the guard not out of curiosity but because a standing rule obliges it: any
  parcel touching `specs/pipeline/steps/` must run every
  `test/*Guard*.test.js` before forwarding, and BL-995 added a step file.

  So this defect does not sit quietly on `main` - it TAXES EVERY UNRELATED
  PARCEL that touches that tree. Each one inherits a red guard, has to
  diagnose it, has to establish it is pre-existing rather than its own, and
  has to write that up before forwarding. The hardener did exactly that for
  BL-995 and confirmed `bl995DetachedJobSteps.js` is itself clean. That is
  the argument for promoting this ahead of its priority band: the cost
  recurs per parcel, not once. (It also means the process question below has
  now been answered in the affirmative at least once - the standing rule DOES
  reach this guard when followed, which narrows that question to why BL-982's
  and BL-983's own passes did not.)

  Verified by the specifier before folding this in, rather than relayed:
  `npx vitest run test/socketFixtureShortRootGuard.test.js` on `main` is 1
  failed / 15 passed, and the violation list is EXACTLY the two files already
  scoped - no third violator has joined since this ticket was minted, so the
  scope is unchanged. Line detail from the hardener's pass, to save the
  implementer a search: `bl982SecondSeatSteps.js:54` and `:103` are the two
  `mkdtempSync(path.join(os.tmpdir(), ...))` roots and `:249` writes
  `.swarmforge/tmux-socket` beneath one; `bl983StageQueueSteps.js` has the
  same shape.

  **The process question this ticket does NOT answer.** Both parcels crossed
  coder, cleaner, architect, hardener, documenter and QA while a standing
  gate in the default test lane named them by path. Whether the lane was not
  run, or was run and the red misread, cannot be settled from git history -
  it needs the mailboxes and the parcels' own evidence files (the durable
  lesson is explicit: git history cannot prove a gate did not run). That is a
  real question and probably its own ticket, but it is a different kind of
  work from restoring a green lane and bundling it here would fail INVEST.
  Flagged to the coordinator in the same pass as this ticket.

  **Do not widen the gate in this parcel.** BL-948's invariant 1 is that the
  gate defines the adoption set by inspection, never a roster. The gate did
  its job; the failure is downstream of it.

qa_e2e_procedure: >
  From the repo root.

  1. Reproduce at the parent commit. From `extension/`, run
     `npx vitest run test/socketFixtureShortRootGuard.test.js` and confirm it
     fails 1 of 16 on "the real specs/pipeline/steps tree has zero
     socket-fixture long-root violations", naming both
     `bl982SecondSeatSteps.js` and `bl983StageQueueSteps.js`.

  2. At the parcel commit, run the same command and confirm 16 of 16 pass.

  3. Confirm the behaviour the changed files assert is unchanged: run the
     BL-982 and BL-983 acceptance scenarios and confirm they pass on their
     own assertions. A scenario that now passes but previously died on a
     socket refusal is the point; a scenario that changed what it asserts is
     a defect in this parcel.

  4. Confirm the fix is the shared helper, not a local shortening: grep both
     files for `mkSocketFixtureRoot` and confirm no `os.tmpdir()` remains in
     either. A hand-rolled short base would pass the gate today and rot on
     the next helper change.

  5. Confirm each fixture root is removed in a `finally` (BL-948 invariant 2),
     and that the full unit lane from `extension/` is green - this ticket's
     purpose is a green lane, so a lane still red for any other reason must
     be reported, not absorbed.
