description: |
  ## What

  An operator hotfix is live on main and has never been through a gate.
  This is that gate: a REVIEW ticket - confirm or refute, and open narrow
  follow-ups for anything found.

  ## The failure it fixed (from the commit message)

  A freshly onboarded swarm got only the contract-negotiation topic. With
  no front desk yet, its coordinator had nowhere to surface a request:
  gpu-bargain-hunter's coordinator sat blocked on a human-only action
  (2026-09-26), with the ask visible only in its own tmux pane.

  ## What landed (files to review)

  - `extension/src/tools/provision-onboarding-telegram-channel.ts`:
    `ensureCoordinatorTopic` opens a "Coordinator" forum topic and records
    it as `coordinator` in `<target>/.swarmforge/operator/role-topic-map.json`;
    idempotent (an existing entry is kept, other roles' entries survive);
    `main` calls it only once the group is detected and prints
    `coordinatorTopicId` or `error`.
  - `extension/test/provisionOnboardingTelegramChannelCli.test.js`: two
    new cases (opens and records; keeps an existing topic).
  - `docs/tutorials/Onboarding-New-Project.md`: the Coordinator topic
    paragraph, and `<swarm-name>` must equal the target's
    `config swarm_name` (BL-1776 makes the provisioner enforce that).

  ## Review goals

  1. Scenarios 01-02 green against the real exported
     `ensureCoordinatorTopic` with a fake Bot API (the `postFn` seam).
  2. The two unit cases above pass on the parcel commit; re-run, do not
     rewrite unless a finding says they are wrong.
  3. PROBE, do not fix: `readRoleTopicMap` returns `{}` for a map it
     cannot parse, and the write that follows replaces the file. Does a
     corrupt `role-topic-map.json` lose every other role's topic? If so,
     that is a follow-up note to the specifier (unreadable is not empty,
     BL-1773's fail-closed posture), not an edit here.

  ## How (direction, not mandate)

  - Drive the compiled `extension/out/tools/provision-onboarding-telegram-channel.js`
    export in-process with a stubbed `postFn` (the hotfix's own unit
    tests show the shape); fixture targets under mkdtemp (BL-1390), never
    a real token or the live `.swarmforge/operator/`.

constraints: >
  Fixture targets are mkdtemp directories (BL-1390). No real bot token and
  no network. The parcel does not edit the provisioner or the tutorial.

out_of_scope: |
  Enforcing the swarm name (BL-1776), the second swarm's credential leak
  (BL-1775), the engine's notify_human.sh / human_replies.sh (hotfix
  6cef9b7ecd, its own stamp), and writing human_decision into the hotfix
  ledger.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1774-onboarding-opens-the-new-swarms-coordinator-topic.feature`:
     three cases ok (01 x2 rows, 02). Record the duration.
  2. `cd extension && npx vitest run test/provisionOnboardingTelegramChannelCli.test.js`:
     all pass.
  3. Read the hardener's and architect's evidence for review goal 3's
     probe result; a confirmed loss must name its follow-up note.
  4. `git diff main...HEAD --name-only` names only evidence, the feature's
     handler (plus lib/ helpers) and test files.

