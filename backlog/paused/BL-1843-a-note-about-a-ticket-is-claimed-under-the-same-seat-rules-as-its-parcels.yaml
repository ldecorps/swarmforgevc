description: |
  ## Status (2026-10-06): simplified, not split - the fix is built and verified

  The coordinator pulled this at 11:4xZ (note 017051, "coder held 61m+,
  drifted off-ticket"). The seat's work was nearly complete: its commit
  9811cd59fe holds the seat_affinity_lib.bb change and two runner tests,
  and its stash 3afb3eedb0 held the claim-loop wiring and a step handler
  of the right shape. The specifier put them together, fixed the two
  faults that kept the feature red, and pinned the result as
  `refs/swarmforge/salvage/BL-1843-v2` (7a1e1c834e, parent 9811cd59fe).
  Verified from a git-archive of that commit: this feature 7 of 7,
  supersede_lib and seat_affinity_lib runners pass; with it applied,
  BL-1001 6/6, BL-1004 5/5, BL-1616 5/5, BL-1655 8/8, BL-1615 8/8,
  BL-1871 9/9, BL-1185 4/4, BL-1608 4/4.

  The two faults it fixes, so the review knows what changed:
  - The claim loop passed the affinity rule a parcel's `task:` header,
    which a note does not carry. It now passes `claim-task-name`'s answer.
  - Scenario 02 row 2 (coder, which worked BL-9002, asks): BL-1001's
    prefer-fit deferred coder to the idle easy seat while the affinity
    rule deferred that seat back, so the note waited out the deadline. A
    seat that worked the ticket itself now outranks prefer-fit, never
    `:skip-ineligible` (`difficulty-allows-claim?` takes `own-tasks`).
    The handler's "stays in the stage queue" step also asserted a
    DEFERRED line for a tier refusal, which prints only NO_TASK; it now
    asserts that line only when a sibling worked the ticket.

  ## What the coder does (all of it, in order)

  1. `git merge refs/swarmforge/salvage/BL-1843-v2` into your branch, then
     merge main. Do not change `seat_affinity_lib.bb`,
     `ready_for_next_task.bb` or `bl1843NoteSeatRulesSteps.js`: they are
     the verified fix. Do not bring anything else from your stash.
  2. Run, once each, output under tmp/: this ticket's feature (7 of 7);
     `bb swarmforge/scripts/test/seat_affinity_lib_test_runner.bb`,
     `supersede_lib_test_runner.bb` and
     `ready_for_next_claim_task_name_runner.bb` (all pass); and
     `cd extension && npm test` (its guards scan step handlers).
  3. This ticket is also the stamp-off of hotfix 336ca56aef (BL-1608's
     feature retired a census step pinning exactly 2 call sites of
     claim-task-name; this fix adds two more). Read `git show 336ca56aef`
     and run BL-1608's feature: 4 of 4. Never re-apply it.
  4. Write backlog/evidence/BL-1843-coder-<date>.md with the results,
     commit it with the merge (`By coder.`), and send the git_handoff to qa.

  ## What happened

  - Note 013884 (`to: coder`, "BL-1816 still todo - build+forward BEFORE
    completing this note", created 10:50Z) sat in the coder stage queue.
    coder@iq3 dequeued it at 12:15:46Z; the file is now in
    `.worktrees/coder-iq3/.swarmforge/handoffs/inbox/abandoned/`. BL-1816
    is low, and the primary coder had completed a Work note for it at
    09:30Z (BL-1834's incident).
  - A "BL-1830 still todo ..." reminder went the same way at ~14:42Z while
    the primary coder was landing BL-1830 commits. BL-1830 is medium and
    coder@iq3 is `--seat-tier easy`.

  ## Why

  - `ready_for_next_task.bb` `claim-task-name` resolves a note's ticket
    through `supersede-lib/task-name-from-content`, which reads only
    `Work BL-...`. "BL-1830 still todo ..." yields nil, so
    `difficulty-allows-claim?` prices it as no ticket and any seat takes
    it.
  - `seat-affinity-lib/rework-claim-decision` makes a candidate only of a
    `git_handoff` whose task a sibling worked. A note is never deferred.

  ## What is wanted

  1. The easy-only seat leaves a note about a medium ticket in the stage
     queue, in either wording (scenario 01).
  2. A note about a ticket the other seat worked waits for that seat
     (scenario 02), bounded by the same cross-seat deadline as a rework
     (scenario 03).
  3. A note naming no ticket is claimed as today (scenario 04), and a
     single-seat stage never defers.
  The coordinator.prompt already asks for the `Work <id>:` wording
  (landed with this mint). This ticket makes the filters hold when the
  wording slips.

  ## How (direction, not mandate)

  - One reader decides which ticket a note names (BL-1185/BL-1608: the
    shared reader, never a second parser). If it widens to a leading
    ticket id, check its other consumer, `worked-task-names-in`: a
    completed reminder must not count as having worked a ticket unless the
    seat did (BL-1715 and `--no-work` already exclude declined work).
  - Step handler `specs/pipeline/steps/bl1843NoteSeatRulesSteps.js`,
    discovered from its own file name (BL-1371; never edit
    `specs/pipeline/steps/index.js`), landing in the same commit as the
    feature's first green run (BL-233). `bl1004ReworkClaimSteps.js`
    and `bl1001DifficultyAwareSeatRoutingSteps.js` already build a two-seat
    stage fixture. Reuse them. Fixture roots under mkdtemp, `git init`,
    `rev-parse --git-common-dir` first (BL-1390).

  ## Scope

  `swarmforge/scripts/ready_for_next_task.bb` (the claim loop),
  `seat_affinity_lib.bb`, the shared note reader if it changes, their bb
  tests, the step handler and its registration, evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1843-a-note-about-a-ticket-is-claimed-under-the-same-seat-rules-as-its-parcels.feature`:
     7 of 7 ok (two rows of 01, three of 02, then 03, 04). Measured 0 on
     main at mint: no handler exists yet.
  2. `node specs/pipeline/cli.js` on the BL-1004 feature (5 of 5 ok) and
     the BL-1001 feature (6 of 6 ok). Both measured on main d95c636ea3 at
     mint.
  After the land (the coordinator's check, not QA's): no coder@iq3
  `inbox/abandoned/` entry for a note about a ticket the primary coder
  holds.

