id: BL-1100
title: "The promotion scan disqualifies a candidate by grepping its WHOLE ticket YAML for a hold phrase, so an orthogonality caution, a dependency wait, or a spec step that merely describes the behaviour reads as a human park - three live tickets are silently unpromotable and the auto-pick path drops them without a word"
type: defect
severity: high
# high: a live fault degrading behaviour AND a broken safety signal, in the
# one place that decides what the swarm works on next. Three paused tickets
# are unpromotable right now and will stay so forever. What lifts this above
# `medium` is that the auto-pick path `continue`s with NO message: the
# candidate does not appear, no refusal is printed, and nothing anywhere
# records that a ticket was considered and dropped. It is undetectable
# except by reading the script - which is how it was found.
status: todo
epic: swarm-reliability
assigned_to: coder
priority: 8
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1100-promotion-candidacy-is-decided-by-structured-fields-never-prose.feature
human_approval: approved
approval_context: >
  Firm: prose must never decide promotion. A sentence a human wrote to
  EXPLAIN an ordering constraint cannot be indistinguishable from one that
  parks the ticket, and a dropped candidate cannot be silent.

  Your call is whether to DELETE the prose check or narrow it, and I have a
  recommendation. Delete it. Its own header comment says it exists to keep
  epics out of the candidate pool - but the anchored sibling check
  `is_epic_type` already does exactly that, and does it correctly. Measured
  2026-08-23 against `backlog/paused/`: 34 tickets match the phrase, 27 of
  them `type: epic` and therefore already excluded without it. Of the 7
  that remain it is right about 3 and wrong about 4. It has no unique true
  positive that a structured field does not already express.

  One thing to decide with it: BL-556's park is conditional - "not ahead of
  GH-22" - and GH-22 has since reached `backlog/done/`, so its stated
  condition is already satisfied. This ticket deliberately does NOT release
  it; it re-expresses the park as `status: blocked` exactly as it stands
  today. Releasing it is your call, or the coordinator's, as a separate
  bookkeeping step.
invariants:
  - No ticket is ever disqualified from promotion by free prose - every refusal is decided by a structured field or by the directory the ticket sits in, never by a sentence written to explain something.
  - Every promotion candidate that is skipped is announced with its ticket id and the gate that skipped it - a candidate never disappears silently.
  - The change releases no ticket a human parked - each prose-parked ticket is still refused afterwards, and the human sentence that parked it survives verbatim in that ticket.
description: >
  NOTE ON QUOTING: this ticket cannot write the trigger phrase, because
  doing so would make the ticket itself unpromotable by the very defect it
  fixes. It is written below as the regex `do[- ]not[- ]promote`, which the
  guard does not match. That constraint IS the defect, stated as compactly
  as it can be.

  WHAT: `swarmforge/scripts/promote_and_route_next.sh:112` defines
  `is_do_not_promote()` as `grep -qiE 'do[- ]not[- ]promote' "$f"` over the
  ENTIRE ticket YAML - description, notes, source, acceptance prose, every
  line. It has two call sites and they fail differently:

    - line 178, the explicit `<BL-id>` path: prints
      "Error: <id> is do[- ]not[- ]promote, epic, or blocked" and refuses.
      Wrong,
      but at least visible.
    - line 197, the auto-pick scan: `is_do_not_promote "$f" && continue`.
      The candidate is dropped with NO output at all. This is the silent
      half, and it is why three tickets have been starved without anyone
      noticing.

  The check cannot distinguish a human parking a ticket from a human
  DESCRIBING a promotion constraint, because both are the same English
  sentence. Both live in `notes:` by design - the script's own header
  comment at line 9 says it reads notes deliberately.

  EVIDENCE, measured 2026-08-23 across `backlog/paused/` - 34 tickets match:

    - 27 are `type: epic`, already excluded by the anchored sibling
      `is_epic_type`. The prose check contributes nothing on any of them,
      which is the whole population its header comment says it exists for.
    - 4 are FALSE positives, silently unpromotable today:
        BL-1031 (line 185) - a dependency wait on BL-1022, already declared
          structurally as `depends_on: [BL-1022]`, which the BL-957 gate
          enforces correctly.
        BL-1070 (line 148) - an Article 3.2 rule-3 orthogonality caution
          about not running it concurrently with BL-1071.
        BL-1074 (line 139) - a dependency wait on BL-1066, likewise already
          `depends_on:`.
        BL-893 (line 58) - not about this ticket at all. It is numbered
          spec step 4 describing what the Approvals surface must not do
          when the operator picks an option. A ticket that SPECIFIES the
          promotion behaviour is disqualified by the guard that implements
          it.
    - 3 are TRUE positives, all genuine human parks: BL-553 (line 20),
      BL-556 (lines 40-41), BL-828 (line 253).

  A fifth false positive is what raised this: BL-1071 tripped the guard on
  its OWN orthogonality prose - the same BL-1070/BL-1071 pair - and the
  coordinator had to promote it by hand on 2026-08-23 (cd4072cb4), recording
  in the commit that the real gates ALLOW it and the overlap is advisory
  only. That hand-promotion is the workaround this ticket removes the need
  for.

  So the check's unique contribution is 3 true positives and 5 false ones,
  and all 3 true positives are already expressible with mechanisms that
  exist, are anchored, and are tested.

  How (direction, not mandate): delete `is_do_not_promote()` and both call
  sites, and re-express the three genuine parks as `status: blocked` - the
  anchored sibling check `is_blocked_status`
  (`^status:[[:space:]]*blocked[[:space:]]*$`) already refuses on it, in the
  same function, correctly. `status: blocked` is a value the coordinator can
  clear when the stated condition is met, which is what those three parks
  need; `backlog/hold/` stays what Article 3.1 says it is, a human-only park
  released by a human. The human directive text stays in each ticket's
  `notes:` untouched and verbatim - the field marks the park, it does not
  replace the sentence (Article 5.3).

  Then make the auto-pick skip speak: one line per skipped candidate naming
  the ticket id and which gate skipped it. Without it, invariant 1 has no
  observable signal and the next false block is as invisible as this one.

  NOT IN SCOPE: moving `is_blocked_status` into the `promotion_gates_lib.bb`
  chokepoint where it arguably belongs - that is the BL-663 consolidation and
  a separate slice. Releasing BL-556 even though its condition is satisfied
  (see approval_context). Documenting `status:` in `swarmforge/backlog-schema.md`,
  which is the specifier's own file to land and is being handled out of band
  (see notes). The extension-host promotion path, which was BL-1083 and is done.
qa_e2e_procedure: >
  1. The defect in one step: put a paused fixture ticket carrying the
     first Examples sentence from scenario 01 in its `notes:` - the
     feature file carries it literally, this ticket cannot - and otherwise
     fully eligible, then run the auto-pick scan. Before the fix
     it is not among the candidates and nothing is printed; after, it is a
     candidate.
  2. The explicit path, which fails differently and must also be fixed: run
     `promote_and_route_next.sh <that fixture id>`. Before the fix it exits
     non-zero with the same "is do[- ]not[- ]promote, epic, or blocked"
     refusal; after, it promotes.
  3. Invariant 3, the one that would be catastrophic and silent if dropped:
     for BL-553, BL-556 and BL-828, confirm each is STILL refused by the
     scan after the change, and confirm by `git diff` that the human
     directive sentence in each ticket's `notes:` is byte-identical to
     before. A fix that releases any of these three has regressed a human
     park - check this before checking anything else passes.
  4. Invariant 2: run the scan against a paused corpus containing at least
     one epic and one `status: blocked` ticket, and confirm each skipped
     candidate produces exactly one line naming its id and its gate. A skip
     with no line fails this step.
  5. The working path survives: an ordinary paused ticket with no hold of
     any kind is still selected and still routed, and the existing
     `swarmforge/scripts/test/test_promote_and_route_next_no_limit_depth.sh`
     still passes.
notes: >
  Reported by the coordinator as a `note` on 2026-08-23 03:49Z, after it hit
  the false positive on BL-1071 and promoted that ticket by hand rather than
  leaving it starved. The report was accurate as sent and needed no
  correction; the survey of the other 33 matches is this ticket's own.

  On the phrase this ticket will not write: the guard is case-insensitive
  and matches the whole file, so a ticket describing the guard is
  disqualified by it. That is the same trap the specifier prompt warns about
  under "Design self-referential YAML-grep guards trap-resistant", and
  BL-893 is the live instance of it - a specification of the promotion
  behaviour, refused by the promotion behaviour. Whoever works this ticket
  should keep the elided form in any YAML they touch; the feature file
  quotes the literal freely, which is safe because only ticket YAML is ever
  scanned.

  `status:` is used by the scan (`is_blocked_status`) but is NOT documented
  in `swarmforge/backlog-schema.md` - the field list there has no `status`
  row at all. That is a specifier-owned prose deliverable per the BL-798
  rule, not the coder's, and it is deliberately out of this ticket's scope
  so that no gate here depends on a `main` commit the parcel branch may not
  carry. LANDED on `main` as bdf04fe62 (2026-08-23), which documents both
  `status:` and the equally-undocumented `severity:`. Nothing the coder
  builds changes because of it - it is the prose half, recorded here so
  this ticket does not read as carrying an undelivered deliverable.

  IR-DRY disposition (checker run): one `near-duplicate` finding, medium
  confidence, reviewed and KEPT. It pairs "the ticket is among the
  candidates" with "the ticket is not among the candidates". The two differ
  by the negation, and that negation is the entire contrast the feature
  exists to draw - collapsing them would erase the behaviour under test.
