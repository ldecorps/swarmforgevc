id: BL-1446
title: "The land step's bounded walk (BL-1432) starts at the task's LAST handoff boundary: a routine origin/main sync after that hop pulls already-landed siblings into the range and manufactures an entanglement, and the replay's own-path set covers only the commits after the hop - BL-1424's replay pushed a main tip without its guard (2026-09-06); a commit reachable from origin/main is never a candidate, a replay carries every hop's work, and the bounded and wide walks agree"
milestone: M8
type: defect
severity: high
# high: the land step silently pushed a main tip that lacked a QA-approved
# parcel's deliverable, and printed LAND_PUBLISHED for it. Caught only by
# QA's own diff diligence, recovered by hand within nine minutes; the
# source branch never lost the work. Not critical: main was repaired
# before any downstream action and no data is gone. A land mechanism
# that can drop content is a broken safety signal (Article 3.2.4).
