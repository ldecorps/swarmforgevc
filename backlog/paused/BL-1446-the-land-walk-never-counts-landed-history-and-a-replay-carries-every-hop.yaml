  sibling, not a prerequisite), Negotiable (the range set and the
  attribution base are direction), Valuable (one outcome: a land never
  drops a parcel's work or invents an entanglement from landed history),
  Estimable (two range changes, one fixture shape, one handler; medium for
  the bb fixture work), Small (three scenarios, five runs, three
  invariants), Testable (fixture repositories, the real CLI, a rebuilt
  incident).

