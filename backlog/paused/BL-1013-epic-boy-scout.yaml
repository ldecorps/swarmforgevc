id: BL-1013
title: "EPIC — Boy Scout: an on-demand run that finds the debt already costing the most, and cleans exactly one piece of it; do not promote directly; tracks children"
milestone: M8
status: todo
type: epic
epic: boy-scout
priority: 1
depends_on: []
decomposes_into: [BL-1014, BL-1015]
mutation_cost: high
source:
  - "Operator, 2026-08-21: 'devise a boyscoot activity: on demand cleaning ticket that identifies and clean the most annoying technical dept'. Scope shape ruled by the operator in the same exchange: clean the top item in the same run (not report-only, not mint-a-ticket), over the widest evidence base (code quality + bounce recurrence + runtime/ops bloat)."

remaining_slices:
  - >
    Trigger the run from the phone - a console/Telegram command surface on top
    of BL-1014's CLI, so a run can be asked for without a terminal. Belongs
    with the BL-517 console epic's command surface; deliberately not in slice 1,
    which ships the CLI that any trigger would call.
  - >
    Record each run's outcome durably, so a debt item REFUSED for exceeding the
    size envelope three runs running becomes its own ranked signal - "too big to
    boy-scout, needs a real ticket" is exactly the thing a standing tracker
    should surface, and today nothing would notice it.
  - >
    File-level bounce attribution. .swarmforge/bounces/<month>.jsonl records
    ticket, producingRole, ticketType, failureClass, commit and at - but NOT the
    files a bounce touched, so slice 1 can only rank bounce recurrence by class
    and role. Joining each record's commit through git show --stat would give
    per-file hotspots; verified absent at spec time, deliberately deferred.

notes: |
  UMBRELLA / tracking item (type: epic), NOT directly promotable — the
  coordinator promotes CHILD slices, never this. Children carry
  `epic: boy-scout` and are listed in `decomposes_into`.

  VISION: the Boy Scout Rule as a thing you can ASK FOR, not only a habit you
  hope each role remembers. "Annoying" is defined as RECURRENCE — debt that
  costs once is just debt; debt that costs again and again is what the
  operator actually feels — and recurrence is measurable from stores this repo
  already keeps.

  WHAT THIS IS NOT, and why it is not a duplicate of two things that look
  close (checked at spec time, both live):
  - **BL-428** is a standing tracker for bringing ~88 pre-existing high-CRAP
    functions under threshold OPPORTUNISTICALLY, on-touch, never as a big-bang
    sweep. That is the Boy Scout Rule applied to ONE metric, with no trigger
    and no ranking. This epic does not replace it: CRAP becomes one of five
    ranked sources, and BL-428 stays the standing home for that metric's debt.
  - **BL-820**'s closing-ceremony lean pass already runs an evidence-driven
    "what is worst" ritual with a recorded outcome — but its scope is
    explicitly the FORGE PROCESS ("how work is specified, gated, routed and
    evidenced"), explicitly not the code under build, and it fires at shift
    close rather than on demand. This epic is that ritual's missing sibling for
    code and ops debt, on the operator's trigger.

  The five evidence sources, all verified live at spec time:
  1. backlog/hardening-debt-ledger.yaml — 5 rows today, gates DEFERRED under
     host load, read via swarmforge/scripts/hardening_debt_ledger_read.bb.
     Already shows recurrence: telegramFrontDeskBotCore.ts appears twice.
  2. .swarmforge/bounces/<month>.jsonl plus bounce_history on 80 done tickets —
     89 bounces blamed on coder. Class and role only, not file (see
     remaining_slices).
  3. CRAP > 6 — `npm run crap` from extension/ (extension/scripts/crapReport.js).
  4. Duplication — `npm run dry` from extension/ (jscpd, pinned in package.json).
  5. Runtime/ops bloat — measurable path counts. On 2026-08-21 this host carried
     694 rotated handoffd.log.* archives and a 797-entry .swarmforge/daemon/,
     plus an untracked hot-sync orphan present in all seven worktrees.

acceptance:
  none: "tracker only — see decomposes_into children for acceptance"
