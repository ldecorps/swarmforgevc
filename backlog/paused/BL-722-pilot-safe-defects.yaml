description: |
  ## What

  Operator verb `/pilot safe` (and `/pilot safe --list`) selects from the safe
  pilot pool defined with the human 2026-07-30: specced defect, not
  needs_design, approved, mutation_cost low, paused. Rank high→medium→low
  severity then priority then id. Start uses the same pilot hat-walk as
  `/pilot BL-xxx`.

  ## Why

  Encode safe scoping so the human does not hand-pick among ~15 low-blast
  defects. Empty pool must refuse, never silently widen the filter.

