invariants:
  - "A /pilot safe start never selects a ticket that fails the safe filter (type defect, real .feature, not needs_design, human_approval approved, mutation_cost low, paused by default)."
  - "When the safe pool is empty, /pilot safe does not start a pilot and does not fall back to a medium/high-mutation or needs_design ticket."
