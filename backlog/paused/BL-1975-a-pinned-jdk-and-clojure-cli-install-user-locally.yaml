notes: |
  Split from BL-472 on 2026-10-04 (slice 1 of 3: BL-1975 toolchain, BL-1976
  the three tools, BL-1977 the gate). Approval inherited, no new scope.
  Where to read: swarmforge/scripts/install_aps_tools.sh (52 lines, read it
  whole) is the model - pin read from swarmforge.lock.json, verify before
  anything moves into place, idempotent. swarmforge.lock.json's
  secondary_host_substrate entry shows how the repo pins an install by
  exact version. Pick the JDK (an LTS Temurin build is the obvious one) and
  the Clojure CLI version, and record both with their sha256 in a new lock
  entry; name the user-local directory in the lock entry too. Give the
  script a download-source seam (an env var or argument) so the step
  handler serves fixture archives instead of the network.
  Hosts: this one is the one that runs the hardener. A secondary host
  (BL-101) runs the same script when it is provisioned; nothing here
  changes that host now.

description: |
  ## What is wanted

  A script installs a pinned JDK and the Clojure CLI into a user-local
  directory on a swarm host. Each download is checked against the sha256
  the lock file pins before anything is unpacked into place; a mismatch
  stops the install with nothing installed. Running it again downloads
  nothing. It writes one environment file that sets JAVA_HOME and puts the
  pinned java and clojure first on PATH, which BL-1976 and BL-1977 source,
  so the toolchain they use is always the pinned one, never whatever the
  shell happens to find. No sudo, no package manager.

  ## What each stage checks

  - Coder: the four scenarios.
