description: |
  ## What is wrong

  coder note 002136, evidence `backlog/evidence/BL-1738-coder-20260925.md`
  (on the coder branch, 6887fd5988), section "Residual failures". With
  BL-1738's fix, BL-325 runs 5 of 7. Scenarios 2 ("A reply typed into
  the item's topic reaches a consumer that acts on it") and 6 ("The whole
  loop closes without the human being bypassed") fail with `expected
  operator-decide.js invoked with [...], got []`.

  `OPERATOR_DECIDE_STUB` (humanInTheLoopClosedSteps.js ~line 34) is the
  SOURCE TEXT of a script the fixture writes to
  `<root>/extension/out/tools/operator-decide.js`. Its third line is
  `const { mkSocketFixtureRoot } = require('./lib/socketFixtureRoot');`.
  No `./lib/` exists beside the written file, so the spawned stub throws
  `MODULE_NOT_FOUND` before its `appendFileSync` to `consumed.log`. The
  coder reproduced it in isolation. The line looks like the same BL-948
  edit (77c887dc5c) that should have gone at the module top. BL-1738
  adds the real module-scope require, and this is the stray copy.

  ## What is wanted
  - The stub text loads only `fs` and `path`, which is what it uses.
    Scenarios 2 and 6 go green, and BL-325 runs 7 of 7.

  ## Scope
  - `specs/pipeline/steps/humanInTheLoopClosedSteps.js` (the stub string
    only).

