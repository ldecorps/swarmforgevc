id: BL-1110
title: "handoffd's heartbeat went stale past the 120s freshness budget again after BL-967/BL-1021, driving restart flap and pid-claim races"
milestone: M8
type: defect
severity: high
# high: broken safety/health signal — freshness restarts mid-delivery and
# pid-claim races leave the swarm flapping. Not critical: supervisor still
# restarts; swarm not permanently down.
status: todo
epic: swarm-reliability
priority: 10
direction: human-requested
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1110-handoffd-heartbeat-stale-past-budget-recurrence.feature
human_approval: pending
approval_context: >
  Firm: do not resolve this by raising the 120s threshold alone. A threshold
  bump is allowed only alongside a named root-cause fix in the same parcel.

  Your call is which cause class to pursue first when more than one is
  evidenced (delivery-loop stall vs restart/claim race vs another measured
  stall). Closest paused cousin BL-1102 (spawn throw can kill handoffd) is a
  different signature — do not fold without a probe that proves sameness.
invariants:
  - "A healthy handoffd delivery loop never ages its heartbeat past the configured freshness budget without a logged, named stall cause."
  - "Raising the handoffd freshness threshold is never the sole change that closes this ticket."
description: >
  WHAT. On 2026-08-23 the Operator surface showed:
  restart swarm=primary daemon=handoffd age_secs=138 reason=stale-heartbeat
  threshold=120; then FRESHNESS_VIOLATION escalate; then another restart.
  freshness-check.cron.log carried prior "handoffd failed to claim
  handoffd.pid" lines. Heartbeat recovered later; host CPU was not the driver
  of this window (median load ratio ~0.09 / 20 nproc).

  WHY. Recurrence after BL-967/BL-1021. Alert path worked; the stall did not.

  CONSTRAINTS. Do not "fix" by raising the 120s threshold alone. Do not fold
  into BL-1102 without a probe proving the same fault. daemon_log_freshness.conf
  was back at handoffd|120 (pre-BL-967 budget) at filing.

  HOW (direction, not mandate). Instrument or reproduce why the heartbeat file
  aged past 120s (delivery loop blocked, supervisor race, or other measured
  cause); close that path; keep or justify the budget in the same parcel.

qa_e2e_procedure: >
  (1) With handoffd healthy, sample heartbeat age across one full 120s window —
  stays under budget, no restart.
  (2) Force or simulate a pid-claim conflict on restart — logged refusal, no
  unbounded flap from that alone.
  (3) Diff daemon_log_freshness.conf: handoffd still 120, or threshold change
  lands with a named root-cause commit message/notes entry.

