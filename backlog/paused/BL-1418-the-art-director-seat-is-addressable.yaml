human_approval: pending
approval_context: >
  Two things need you. First, the tap: a new feature file is authored here.
  Second, a choice this ticket cannot make: the seat SHAPE. Standing pane
  (recommended) means an always-on tmux window like the other roles, its own
  Telegram topic in the sidebar, and it reviews on wake; on-demand means no
  pane until the coordinator rotates it in for a look-and-feel task (the
  Model Steward's shape, cheapest); presentation stage means it also edits
  templates and CSS itself and sits before QA on artifact parcels (heaviest,
  changes the pipeline topology and needs a follow-up ticket for
  required_stages, routing manifest and Article 4.3). Article 1.10 and the
  role prompt are written for the reviewer shapes and say so. Your 07:5x
  addendum ("probably a responsibility for the documenter?") is the fourth
  option: no new seat, Article 1.10 folds into 1.7 as a documenter duty,
  the design system and inventory become documenter deliverables, and this
  ticket retires; BL-1419 (the email) proceeds unchanged either way.
ruling_options:
  - Standing pane (recommended) - always-on window, own topic, reviews on wake; coder implements briefs
  - On-demand seat - no pane; coordinator rotates it in per look-and-feel task
  - Presentation stage - edits templates and CSS itself; sits before QA on artifact parcels
  - Fold into the documenter - no new seat; look-and-feel becomes a documenter duty and this ticket retires

description: |
  ## What is wanted

  Article 1.10 (landed 2026-09-05 with the human's directive) introduces the
  Art Director. Prose alone is not a seat: `swarm_handoff.sh` refuses a
  recipient not in `.swarmforge/roles.tsv`, `ensureRoleTopics` creates no
  topic for a role the icon map does not know, the model factory cannot
  assign it a model, and `prepare_worktrees` creates no worktree for a role
  the pack does not declare. This ticket makes the seat real everywhere a
  role must exist, under whichever shape the human rules.

  Human directive, verbatim: "introduce new role: Art Director. whose job is
  tonlook at the look and feel on arte facts produced by the swarm."

  ## What changes

  - `swarmforge/packs/full-forge.conf`: a `window art-director claude
    art-director --model claude-sonnet-5 --dangerously-skip-permissions
    --effort medium --remote-control SwarmForge-ArtDirector` line (task
    receive mode, forward-only). Under the on-demand ruling the same line
    sits in the rotation config instead; under the stage ruling it also
    gains a chain position (a follow-up ticket, see out of scope).
  - `roleTopicMapStore.ALL_SWARM_ROLES`, `topicIcon.ts` (`RoleTopicIconRole`
    and its icon map: `art-director: '🎨'`, or the next free icon if that
    collides), `model_factory_lib.bb` `swarm-roles`.
  - `.swarmforge/roles.tsv` is derived from the pack at `./swarm` start;
    `prepare_worktrees` (swarmforge.sh) creates `.worktrees/art-director` on
    branch `primary/art-director`; the launch script and claude settings
    are generated as for every role. Verify, do not hand-write.
  - `docs/design/artifact-inventory.md` and `docs/design/system.md` are the
    role's own first deliverables, not this parcel's; the documenter adds
    the role to the roles page(s) under docs/ and the how-to for launching
    the pack.

  ## How (direction, not mandate)

  - Grep for the literal `hardender` across extension/src and
    swarmforge/scripts to find every role enumeration; classify each as a
    chain list (untouched) or a swarm-roles list (gains art-director) and
    record the classification in the evidence file (invariant 1).
  - A unit test that greps the same way and asserts the classification, so
    the next role added does not repeat the hunt by hand.
  - Fixture swarm for scenarios 01-02: a `git init` root under mkdtemp with
    a pack copy; never the live `.swarmforge/` (BL-1390).

  ## Out of scope

  - The presentation-stage ruling's chain work (required_stages enum,
    routing manifest, PIPELINE_CHAIN, Article 4.3 stage row): a follow-up
    ticket if that option is chosen.
  - The role's own artifacts (inventory, system, briefs).

qa_e2e_procedure: |
  1. The BL-1418 feature passes all seven scenario runs; the role-list unit
     test passes.
  2. Live: after `./swarm` on the pack, `grep art-director .swarmforge/roles.tsv`
     returns the row; `tmux ls` on the swarm socket shows
     `swarmforge-art-director` (standing ruling) or the rotation config
     names it (on-demand); `.worktrees/art-director` exists on branch
     `primary/art-director`.
  3. From the specifier pane: send `type: note / to: art-director /
     priority: 50 / message: hello` via swarm_handoff.sh; the file appears
     under the art director's mailbox `inbox/new`; `ready_for_next.sh` in
     that pane returns it.
  4. `.swarmforge/operator/role-topic-map.json` gains an `art-director`
     entry after `ensureRoleTopics`; the topic's icon differs from the
     other eight.
  5. `bb swarmforge/scripts/model_factory_cli.bb assign --mode quality`
     lists art-director.

notes: |
  Minted 2026-09-05 by the specifier on the human's in-session directive
  (verbatim in description). The constitution entry (Article 1.10), the
  PIPELINE.md row, the adoption record and the role prompt were landed by
  the specifier the same pass (Article 1.2 / 5.1, BL-798 rule: prose the
  specifier owns is landed by the specifier, never left for a stage).

  The ruling is posed as ruling_options (BL-1300) so a tap records it; the
  scenarios are written to hold under every option (invariant 2), so the
  ruling amends the description's pack line, not the feature.

  IR-DRY (2026-09-05): 12 occurrences, 12 unique, no findings.

  AMENDED 2026-09-05 (specifier, ticket still paused and pending): the human
  asked in-session whether the role is "probably a responsibility for the
  documenter"; added as ruling option 4 so the tap records it. Scenarios
  are unchanged; under option 4 the ticket retires rather than builds.

  INVEST at mint: Independent (no unbuilt sibling; BL-1419 does not need
  this), Negotiable (icon, list-finding test are direction), Valuable (one
  outcome: the seat exists), Estimable (one pack line, three lists, one
  test, docs; medium because of the hunt for enumerations), Small (four
  scenarios, three invariants), Testable (fixture swarm + live checks).

