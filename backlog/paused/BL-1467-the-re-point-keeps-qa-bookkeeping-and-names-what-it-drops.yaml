notes: |
  Minted 2026-09-07 by the specifier on QA's note, the same pass, with
  BL-1466 (the land-time half). The two are independent: BL-1466 keeps
  bounced content off main whatever the branch holds; this ticket keeps
  QA's evidence trail intact and makes the re-point's drops visible.

  Grepped first: no open ticket names post-land-repoint!'s discard or the
  reflog recovery; BL-1432 (done) ruled the re-point, BL-1438 (done) wired
  it, both with "clean" meaning uncommitted-clean only.

  Why re-apply rather than skip: skipping whenever local commits exist
  would skip after every tip-pure land (the branch is always ahead by its
  own history) and return BL-1432's growth; re-applying only bookkeeping
  keeps both promises.

  required_wiring names the step handler only: the publish wrapper
  (`land_main_publish.sh`) already calls `land_step_cli.bb repoint` and
  echoes whatever it prints, so an anchor on the wrapper's text would name
  a literal that never appears there (BL-874) and an anchor on the CLI is
  the parcel's own diff (BL-1235); scenario 02 reads the real output.
