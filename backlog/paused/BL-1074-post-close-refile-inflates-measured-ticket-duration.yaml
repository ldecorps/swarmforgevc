human_approval: pending

approval_context: >
  This is a sibling defect deferred out of BL-1066 by BOTH the coder and the
  architect, who each declined to fix it inside that parcel and asked the
  specifier to decide whether it earns its own ticket. It does, and this is it.
  Nothing here changes what BL-1066 built; it changes what one number MEANS.


  THE ONE JUDGEMENT CALL WORTH YOUR EYES IS THE SEVERITY. I set `high`, and I
  want to be straight about why, because I refused an escalation to `high` on a
  different ticket (BL-759) in the same turn. `high` is for "a live fault
  degrading behaviour or a broken safety/health signal". Mean ticket time is a
  health signal an operator reads to judge whether the swarm is slowing down,
  it is currently wrong for 308 of 802 closed tickets, the error runs to ~10x
  on an affected ticket (the pinned fixture reports 49 hours for a 5-hour
  ticket), and it is wrong SILENTLY - the panel gives the reader no indication.
  That is the carve-out, not an inflation of it. What would make it `medium` is
  if the number were merely imprecise; it is not, it is systematically
  over-reported and it will drift further every time the done/ folder is
  reorganised.


  IF YOU DISAGREE, amend the severity rather than rejecting the ticket - the
  defect is real either way, and `medium` would still be an honest reading if
  you weigh a display metric lower than I have.

source: |
  Architect note to specifier+coordinator, 2026-08-22, during the BL-1066
  architect pass: "BL-1066: post-close re-file inflates duration (pinned
  test) - ticket?". Raised as a non-blocking priority-50 note under Article
  4.4's routing for an out-of-scope item found during review, explicitly not
  blocking that parcel.

  Originally flagged by the CODER of BL-1066 in
  `backlog/evidence/BL-1066-coder-note-20260822.md`, section "One PRE-EXISTING
  correctness observation, deliberately NOT changed": "This is the pre-BL-1066
  semantics exactly (the old per-file `--follow` read the newest arrival at the
  same path), and it is preserved here on purpose: this ticket is about what
  the computation COSTS, and changing what it MEANS is a separate decision with
  a visible effect on the reported mean. It is pinned by a test ... so the
  behaviour cannot drift unnoticed, and flagged here for the specifier to
  decide whether it wants its own ticket."

  Confirmed independently by the architect in
  `backlog/evidence/BL-1066-architect-pass-20260822.md`: "The coder's own
  flagged, deliberately-preserved quirk (a ticket re-filed after close inflates
  its measured duration) is real, unchanged from pre-BL-1066 behavior, and
  already pinned by a named test."

notes: |
  Measured on this host at spec time, from `main` (local `main` 26 ahead / 0
  behind `origin/main`, so it is the fresher ref):

      $ ls backlog/done/*.yaml | wc -l          # 494 flat
      $ find backlog/done -name '*.yaml' | wc -l # 802 recursive
      $ find backlog/done -mindepth 1 -maxdepth 1 -type d | wc -l  # 7

  So 308 of 802 closed tickets - 38% of the corpus - sit under a milestone
  subdirectory, meaning they arrived at their current path by a post-close
  re-file and every one of them reports an inflated duration. This is not a
  tail case; it is most of the drift in the displayed mean.

  Read `docs/reference/Specification.MD:4277` alongside the code. It already
  documents the CORRECT meaning - "How long on average a ticket takes to move
  from backlog/active/ to backlog/done/" - so this is implementation drift away
  from a written contract, not an undecided question about what the metric
  should be. That line needs no amendment; the code needs to match it.

  WHERE THE BUG IS, as of BL-1066's rename-chain walk (read in the architect
  worktree at `aae815e09`). `ticketDurationMs` in
  `extension/src/metrics/swarmMetrics.ts` opens with
  `const closing = byPath.get(donePath)?.[0]` - the NEWEST arrival at the
  path the file occupies today. For a re-filed ticket that arrival IS the
  re-file. `activationTimeMs` then walks the rename chain back through those
  same done/ -> done/ re-file hops until it finds the hop whose `fromPath`
  starts with `backlog/active/`, and returns the arrival BEFORE it. So the
  walk already visits the true closing hop - it just discards the timestamp
  and keeps only the activation. Direction, not mandate: the same walk can
  return both ends. This is why `mutation_cost: low` is honest.

  Only `R` and `A` statuses become arrivals (`readArrival`), so an ordinary
  edit to a closed ticket's YAML does not affect its duration today and must
  not start to. Invariant 1 is phrased over commits generally for that reason.

  BL-1006 - THE PINNED TEST IS A SLICE-BOUNDARY ASSERTION AND RETIRING IT IS
  PART OF THIS TICKET, NOT A SIDE EFFECT. BL-1066 froze the inflated
  semantics into `extension/test/meanTicketTimeWalk.test.js`, in the test
  named "a ticket re-filed twice INSIDE done/ is still traced back to its
  activation", which asserts `meanMs === 49 * HOUR_MS` for a ticket that
  truly took 5 hours, above a comment reading "preserved deliberately: this
  ticket is about what the computation COSTS, and changing what it means is a
  separate decision". That is red-when-correct: it goes red exactly when THIS
  slice ships. It is scoped here so nobody discovers it as a mystery failure.

  One deliberate deviation from BL-1006's default, stated so the reviewer can
  challenge it rather than assume an oversight: BL-1006 says retire, never
  reword, because the successor's own scenarios are the coverage. Here a
  blanket retirement would delete real coverage. That test's NAME and its
  activation-side assertion - that a two-hop rename chain is still traced back
  to the activation - remain true and are not covered by scenario 01 of this
  ticket, which fixes the hop count at 1 and 2 but asserts the END. So: delete
  the frozen `49 * HOUR_MS` expectation and the "preserved deliberately"
  comment block, keep the fixture and the activation-side assertion. If a
  reviewer would rather see it retired outright and the two-hop trace-back
  re-expressed as a scenario here, that is a legitimate call - say so on the
  bounce and it will be respecified.

  Sweep done at spec time so the implementer does not have to guess where else
  the old meaning is frozen: `grep -rln "computeMeanTicketTime|mean ticket
  time|meanTicketTime" docs/ specs/` returns only
  `docs/reference/Specification.MD` (already correct, see above) and
  `specs/features/BL-1066-...feature` (carries no statement about the END, so
  nothing to retire there). The only frozen assertion is the unit test named
  above.

  `depends_on: [BL-1066]` is a real ordering constraint, not bookkeeping: this
  ticket edits `ticketDurationMs`/`activationTimeMs`, which exist only on
  BL-1066's branch. BL-1066 was at the architect with a clean pass (Article 4.4
  NONE) when this was written, so the wait should be short - but do not promote
  this before BL-1066 lands on `main`, or the coder inherits a file that has
  neither function in it.

description: |
  ## What

  A ticket's measured duration ends at the wrong moment. `computeMeanTicketTime`
  (`extension/src/metrics/swarmMetrics.ts`) reads a closed ticket's END as the
  newest arrival at the path the file occupies TODAY. When a ticket is re-filed
  after it closed - moved from `backlog/done/` under a milestone directory, and
  moved again when that directory is renamed - the newest arrival is the
  re-file, not the close, and the reported duration is inflated by however long
  the re-file came afterwards.

  Make the END the moment the ticket entered `backlog/done/` on its final
  active -> done transition, so that nothing committed after a ticket closed
  can change the duration it reports.

  ## Why it matters

  308 of the 802 closed tickets in this repository - 38% - already sit under a
  milestone subdirectory, so their durations are already inflated. The error is
  not small: the fixture pinned in the current suite reports 49 hours for a
  ticket that took 5. It is also silent - the panel shows a mean with a sample
  count and no indication that a third of the sample is over-reported - and it
  gets worse on its own every time the done/ folder is reorganised, since a
  reorganisation moves the measured END forward for every file it touches while
  the real durations stay put.

  Mean ticket time is one of the signals an operator reads to judge whether the
  swarm is slowing down. A silently over-reported one is worse than a missing
  one, because it is trusted.

  ## How (direction, not mandate)

  The rename-chain walk BL-1066 introduced already visits the hop this ticket
  needs. `activationTimeMs` walks back from the current path through the
  done/ -> done/ re-file hops until it reaches the hop whose `fromPath` starts
  with `backlog/active/`; that hop's own timestamp IS the close. Today only the
  arrival before it (the activation) is returned and the close is discarded.
  Returning both ends from the one walk is the obvious shape, but the
  implementer owns the choice - what this ticket fixes is the meaning, not the
  mechanism.

  Preserve the two behaviours BL-1066 established and tested: the copy-close
  fallback (a close recorded as an Add with no rename to follow back) must
  still resolve, and the reopen case must still measure the LAST active -> done
  cycle rather than the first.

  ## Scope

  - `extension/src/metrics/swarmMetrics.ts`
  - `extension/test/meanTicketTimeWalk.test.js` - including retiring the frozen
    boundary assertion described in `notes:` above
  - `specs/features/BL-1074-post-close-refile-inflates-measured-ticket-duration.feature`
    and its new step handler, registered in `specs/pipeline/steps/index.js`

  Explicitly NOT in scope: the cost and reaping work BL-1066 delivered. Do not
  reintroduce a per-ticket `git log --follow`; invariant 2 exists to catch that.
  Also not in scope: any change to how the mean is displayed, or any
  backfill/annotation of historical values.

  ## Acceptance signal

  The four scenarios in the feature file pass; the existing unit suite passes
  with the one boundary assertion corrected and no other test deleted or
  weakened; and a computation over the live repository reports a mean that is
  unchanged by renaming a `backlog/done/` milestone directory.

  ## QA end-to-end procedure

  1. From a clean checkout of the QA-approved commit, `npm run compile` from
     `extension/` (`extension/out/` is gitignored; do not trust a stale build).
  2. Run the full unit suite. Confirm `meanTicketTimeWalk.test.js` runs and
     passes, and read its diff: confirm the `49 * HOUR_MS` expectation is gone
     and the activation-side assertion survives. A run that passes because the
     test was deleted is a bounce.
  3. Run the acceptance runner on this ticket's feature file. Confirm all four
     scenarios EXECUTE (not skipped) and pass - `specs/pipeline/runtime.js`
     throws on a missing handler, so a skip means the registry entry is absent.
  4. Run `npm run test:properties` for BL-1066's three property files
     (`metricsTickGate.property.test.js`, `meanTicketTimeCost.property.test.js`,
     `meanTicketTimeReaping.property.test.js`) and confirm they still pass -
     this is invariant 2's live check that no per-ticket subprocess returned.
  5. Against the live repository, run the metrics CLI and record the mean.
     Then, in a scratch clone, `git mv` one `backlog/done/<milestone>/`
     directory to a new name, commit, and re-run. The mean must be identical.
     Before the fix it moves; that difference is the whole defect.
