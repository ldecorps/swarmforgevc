id: BL-1074
title: "Mean ticket time reads a closed ticket's END as its latest re-file, not its close, so every ticket ever moved under a milestone directory reports an inflated duration - 308 of the 802 closed tickets today"
milestone: M8
type: defect
severity: high
status: todo
