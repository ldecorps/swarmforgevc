description: |
  ## Why

  Babysitterd finds and escalates well but synthesizes poorly: today's
  starvation cascade (handoffd down + 9× half-launch + swarm-starved) read as
  separate CRIT fires, operator got symptoms not playbooks, and post-incident
  learning required hand-written INTAKE-*.md hours later.

  ## Loop

  Detect (mostly exists) → Diagnose (failure class + clue bundle) → Repair
  (bounded auto, extend BL-1017/BL-958) → Learn (/postmortem verb + intake stub).

  ## Children (minted 2026-08-27)

  | Slice | Ticket | Delivers |
  | --- | --- | --- |
  | Repair | BL-1169 | Half-launch + swarm-starved bounded auto-repair |
  | Learn | BL-1170 | `/postmortem` operator verb + registries + intake stub |
  | Diagnose | BL-1171 | Disaster-class correlation + structured escalation |

