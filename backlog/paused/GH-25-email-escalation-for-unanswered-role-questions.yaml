notes: |
  QA e2e procedure: with the operator runtime live, write a synthetic
  role-awaiting marker back-dated past the threshold (no escalated_at_ms);
  observe within one tick a GitHub comment mentioning the human on the ops
  issue, escalated_at_ms stamped into the marker, and status.json showing
  the question as escalated; confirm the next tick posts nothing further.
  Then verify a fresh under-threshold marker escalates nothing and shows
  as pending in status.json.
