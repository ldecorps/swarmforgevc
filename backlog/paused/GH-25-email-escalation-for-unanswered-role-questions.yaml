description: |
  ## What

  A role question raised via role_ask.bb that stays unanswered past a
  threshold must reach the human by email. The operator runtime's tick
  scans `.swarmforge/operator/role-awaiting/*.json` (written by
  `swarmforge/scripts/role_ask.bb`); any marker whose age since
  `asked_at_ms` exceeds the threshold and which carries no
  `escalated_at_ms` is escalated exactly once, then stamped with
  `escalated_at_ms` in the marker so subsequent ticks skip it.

  ## Behavior

  - Threshold: `SWARMFORGE_ASK_ESCALATION_MINUTES`, default 30.
  - Transport: a comment mentioning @ldecorps on a dedicated ops issue via
    api.github.com using the already-cached GitHub creds — GitHub delivers
    the email. No new secrets. (Plain SMTP was offered by the human only as
    a fallback variant and is out of scope until requested.)
  - Delivery-independent: the marker ages regardless of whether the
    question ever reached Telegram, so the escalation doubles as a detector
    for silently dropped questions (see sibling defect GH-26 — this ticket
    is the safety net ABOVE that fix, not a substitute for it).
  - Visibility: pending and escalated question state is surfaced in
    status.json each tick.

  ## Integration points (verified live 2026-07-25)

  - `swarmforge/scripts/operator_runtime.bb` `tick!` (~:1575) and its
    status.json publisher (`status-file`, ~:135).
  - `swarmforge/scripts/role_ask.bb` marker shape
    (`.swarmforge/operator/role-awaiting/<role>.json`, `asked_at_ms`).

out_of_scope: |
  - Plain SMTP transport (fallback variant only if GitHub mention is
    rejected by the human).
  - Fixing the undeliverable-drop wedge itself — that is defect GH-26.
  - Re-escalation / reminder cadence after the one-shot escalation; the
    single stamp is the contract.

