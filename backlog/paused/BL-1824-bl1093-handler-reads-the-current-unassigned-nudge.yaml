description: |
  ## What is wrong

  Coder note 002232: `specs/features/BL-1093-an-active-ticket-with-no-real-assignee-strands-between-two-sweeps.feature`
  is 4 of 8 on main, with no register row. Measured at mint (main
  b8d6aa6b31): scenario 01's four rows fail at "Then the coordinator is
  nudged about the ticket" with `expected coordinator unassigned nudge
  for BL-1093, got: UNASSIGNED-NUDGED BL-1093 exit= 0`. The sweep DID
  nudge. `specs/pipeline/steps/bl1093NobodyAssigneeSteps.js:123` matches
  `message: ${TICKET} active unassigned`, while `chase_sweep_lib.bb:1254`
  sends `Work <id> active unassigned - assign_to and route it.` since
  BL-1223 (6797c580fa, 2026-08-29), which updated its own runner
  (`dispatch_gap_test_runner.bb:312`, green at mint) and not this
  handler. Scenarios 02-05 pass.

  ## What is wanted
  - BL-1093's scenario 01 recognises the nudge the sweep actually sends,
    still requiring `to: coordinator` and the ticket id. How (direction,
    not mandate): match the id and "active unassigned" in the message line
    rather than a hard-coded start of message, so the next wording change
    does not red it (BL-1811: the sweep owns the text).

  ## Scope
  - `specs/pipeline/steps/bl1093NobodyAssigneeSteps.js`, evidence.

