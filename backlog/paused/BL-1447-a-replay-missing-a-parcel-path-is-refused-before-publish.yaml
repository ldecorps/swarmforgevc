id: BL-1447
title: "A replay tip missing any path the parcel's own commits changed is refused before it is published: the land step compares the replay against the cited tip path by path and answers LAND_ESCALATE replay-incomplete naming every missing path instead of LAND_REPLAY - the net that would have refused BL-1424's replay on 2026-09-06 before LAND_PUBLISHED"
