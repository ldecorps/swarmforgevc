description: |
  ## Status: three hotfixes landed the fix

  This parcel is their stamp-off: review them, do not re-apply them.

  ## What was wrong

  A served git_handoff named no ticket file, only "from backlog/active/". The
  coder seat read README.md, then asked the user for the ticket. A question
  is not an announcement, so BL-1920's nudge did not fire. Replayed from the
  seat's own transcript with the nudge added: a tool call 3 of 3, every one
  on a guessed backlog/active/BL-1916.md. And with the nudge live, the call
  the seat chose was ask_user_question. qwen 0.24.7 declares all 13 of its
  tools whatever coreTools says, so that tool and the plan-mode pair were
  always there.

  ## What the hotfixes changed

  - 55182a77c3, local_model_tool_call_shim.py: needs_nudge also fires on a
    reply that asks the user for input ("could/can/would you", "please
    provide/clarify/specify/confirm/share/tell/let me know"). The NO_TASK
    guard and the one-nudge limit are unchanged.
  - e69b66a68d, handoff_lib.bb and ready_for_next_task.bb: active-ticket-file
    finds <root>/backlog/active/<id>-*.yaml (or <id>.yaml), absolute. A served
    git_handoff's step 2 reads "2) Read <path> with read_file - it is <id>'s
    spec - then implement it with your edit/test tools."; a Work note adds
    "The ticket it names is <path> - read it with read_file.". Without a file
    the text is as before.
  - 7f95cdc139, swarmforge.sh write_local_model_qwen_settings: excludeTools
    and tools.exclude also name ask_user_question, enter_plan_mode,
    exit_plan_mode and propose_goal. Checked live: 9 tools declared after
    the respawn, 13 before.

  Live result (11:46Z): the respawned seat read its card, ran
  ready_for_next.sh, read the named BL-1916 YAML, then the Modelfile under
  review.

  ## What each stage checks

  - Coder: each hotfix against the description and both invariants, and
    the new tests (shim test_a_question_to_the_user_is_nudged; the
    active-ticket-file and step-2 cases in handoff_lib_test_runner.bb;
    test_bl1829_local_model_qwen_settings.sh's longer list). Is the
    question regex too wide? A finished seat that ends "Can you merge
    this?" gets one nudge, and the NO_TASK guard ends it. Evidence:
    backlog/evidence/BL-1925-coder-<date>.md.

qa_e2e_procedure: |
  1. `bash swarmforge/scripts/test/test_bl1917_local_model_seat_url.sh` prints ALL PASS
     (its case 0 runs the shim's unit cases, 24 at mint).
  2. `bb swarmforge/scripts/test/handoff_lib_test_runner.bb` ends "ALL TESTS PASSED".
  3. `bash swarmforge/scripts/test/test_bl1829_local_model_qwen_settings.sh` ends "ALL PASS".
  4. `node specs/pipeline/cli.js specs/features/BL-1052-a-role-seat-can-be-staffed-by-a-downloaded-local-model.feature`
     passes (measured at mint on HEAD 7f95cdc139: 9 of 9 ok).
  5. In the coder seat's qwen transcripts after 2026-10-03 11:45:51Z, no
     ask_user_question call appears, and shim.log's tools= count for the
     coder is 9.

