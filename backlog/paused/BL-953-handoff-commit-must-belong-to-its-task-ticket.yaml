id: BL-953
title: "A git_handoff's task and commit headers are never checked against each other, so a commit belonging to one ticket rides two pipeline hops under another ticket's name"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: pending
priority: 20
direction: swarm-surfaced
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-953-handoff-commit-must-belong-to-its-task-ticket.feature

required_wiring:
  - "swarmforge/scripts/swarm_handoff.bb::task_commit_coherence_gate_lib.bb::the gate must be loaded and called from swarm_handoff.bb's validate, beside the BL-760 duplicate-chain and BL-806 review-forward guards. A lib that ships green but is reachable from no send path is the BL-419 shape: the defect stays live while the ticket reads as closed."

invariants:
  - "Fail-open is absolute. Only a POSITIVE, resolved contradiction may refuse a send - the commit resolved to at least one ticket id AND the task's ticket is not among them. Every other outcome accepts: no ticket id in the commit's history, an unreadable commit, a task name that resolves to no ticket. A handoff gate that blocks on ambiguity does not degrade the pipeline, it stops it."
  - "Ticket identity is exact id equality, never prefix or substring match. BL-93 must never match BL-935 and BL-95 must never match BL-953 - the same trap duplicate_chain_guard_lib.bb calls out by name, and the reason it routes through pipeline-stage-lib/extract-ticket-id rather than comparing raw task strings."
  - "A refused send has no side effects: nothing delivered to any mailbox, no tmux wake injected, no partial artifact left behind - identical to every other refusal raised in validate."

description: >
  A `git_handoff` carries a `task:` naming one ticket and a `commit:` naming one
  commit. Nothing in `swarm_handoff.bb` checks that the two agree, and on
  2026-08-19 that gap put a parcel carrying zero BL-935 content two hops down the
  pipeline under BL-935's name.

  Measured from the mailboxes and git on 2026-08-19:

  - 12:30:52 the coder sent `task: BL-949-...` / `commit: 896e1d5cb2` to the
    cleaner. Correct - 896e1d5cb2's subject is "BL-949: concierge board-wiring
    tests assert the live matrix...".
  - 12:31:31, thirty-nine seconds later, the coder sent that SAME commit again,
    this time as `task: BL-935-cap-the-vitest-fork-pool-under-a-live-full-forge-pack-on-macos`.
    BL-935's real work is a different commit entirely (e4b327e031, later
    dfc82c1fdf); 896e1d5cb2 touches only conciergeTick.test.js and two BL-949
    step-handler files. Nothing of BL-935 is in it.
  - The cleaner merged it as 7185e6319a - whose own merge message reads "Merge
    coder's BL-949-... into cleaner" - and forwarded it to the architect still
    labelled `task: BL-935-...`, exactly as PIPELINE.md step 3 requires
    ("preserving the stable task name"). The cleaner is not at fault here: it
    did what the rule says, and its own merge subject already stated the
    contradiction in plain text.
  - The architect caught it by eye, completed the parcel instead of forwarding
    it, and reported it up. Containment held only because a human-attention
    stage happened to look.

  Why the existing guard could not catch it: BL-760's duplicate-chain guard keys
  on the ticket id extracted from the `task:` header, so one commit sent under
  two DIFFERENT task names reads as two unrelated tickets and both pass. That
  guard covers one ticket forking into two chains; this ticket covers the
  complementary axis - a task naming a ticket its commit does not contain.

  Why it matters beyond the tidiness: the parcel is the evidence. A stage that
  approves BL-935 on this parcel approves it on BL-949's diff, and BL-935 can
  reach `backlog/done/` having shipped nothing - the same
  credited-with-work-it-does-not-contain family as BL-952.

  How (direction, not mandate): a small decision lib in the shape of the three
  guards already wired into `validate` (duplicate_chain_guard_lib.bb,
  review_forward_evidence_gate_lib.bb, pre_qa_gate_gather_lib.bb), reusing
  pipeline-stage-lib/extract-ticket-id rather than adding a second ticket-id
  parser. The one design point worth care is which commits count as "introduced"
  by the cited commit - the tip subject alone is not enough, since a role's
  forward is a merge commit whose subject may name the ticket only indirectly.
  The coder chooses the range; the scenarios fix the behaviour at its edges.

  Deliberately NOT in scope: the coder's underlying slip (a stale field surviving
  in a reused handoff draft) is a plausible proximate cause but is not what this
  ticket fixes - the gate must hold whatever caused the mislabel. No change to
  PIPELINE.md's preserve-the-task-name rule, which is correct as written.

qa_e2e_procedure: >
  Replay the real incident against the built gate, in a scratch clone so no live
  mailbox is touched:

  1. Pick two landed commits whose subjects name different tickets - the incident
     pair 896e1d5cb2 (BL-949) and e4b327e031 (BL-935) both exist on main.
  2. Write a git_handoff draft with `task:` naming BL-935's full task name and
     `commit: 896e1d5cb2`. Run swarm_handoff.sh on it. EXPECT: non-zero exit, a
     refusal naming both BL-935 (from the task) and BL-949 (from the commit), and
     no new file in any role's inbox/new/.
  3. Change only the `task:` line to BL-949's task name and re-send. EXPECT:
     accepted and delivered.
  4. Fail-open check, the one that matters most: send a draft citing 8c79644444
     ("Merge commit 'e336c44dba' into swarm/coder", whose subject names no
     ticket) under task BL-631, then again under task BL-945. EXPECT: BOTH
     accepted - this is the lawful Article 2.6 multi-ticket batch forward the
     coder actually made that morning, and a gate that blocks it is worse than
     the defect.
  5. Confirm the gate is reachable from the real send path, not only from its own
     tests: grep swarm_handoff.bb for the lib load and the call site.

notes: >
  Surfaced 2026-08-19 by the architect, which reported a "stray cleaner->architect
  handoff" to the coordinator; the coordinator relayed it to the specifier as
  "Cleaner mislabeled BL-935 handoff w/ BL-949's commit 7185e63" (two notes, ids
  ...000574 and ...000575).

  That attribution is wrong and is corrected here: the mislabel was minted by the
  CODER at 12:31:31 (parcel 50_20260819T123131Z_000325_from_coder_to_cleaner),
  not by the cleaner. The cleaner received `task: BL-935` / `commit: 896e1d5cb2`
  and forwarded the same task name with its own merge commit, which is what the
  pipeline rule requires of it. No bounce is owed to the cleaner. Recorded so the
  blame does not get re-derived from the note text later.

  Live state at mint: the stray parcel is dead - the architect completed it
  rather than forwarding it, so nothing is stranded and no cleanup is pending.
  BL-949's genuine chain is alive and at the documenter (commit 4908fbcaeb).
  BL-935 remains active and assigned to the coder. Both tickets were still in
  backlog/active/ and neither was closed on the strength of the mislabelled
  parcel, so there is no bookkeeping to unwind.

approval_context: >
  Firm: the defect is measured, not inferred - the two coder parcels 39 seconds
  apart are on disk, and the commits they cite are on main.

  What needs sign-off is the fail-open posture. This gate deliberately lets a
  mislabel through whenever it cannot positively prove one, because the
  alternative - blocking on ambiguity in the send path every role depends on -
  risks stopping the pipeline rather than degrading it. That means it would NOT
  have caught a mislabel whose commit subject happened to name no ticket. If you
  would rather it refused on ambiguity and forced an explicit override header,
  say so and the scenarios change accordingly.
