invariants:
  - "Exactly one healed re-run per miss: no classification path produces a second retry, and a failure outside the recoverable classes is never re-run at all."
  - "The pinned environment is derived from the role's own worktree, never from the cwd the process happened to inherit."
  - "When a heal succeeds the model receives only the healed result; when it does not, the model receives the real failure exactly once — never both."

