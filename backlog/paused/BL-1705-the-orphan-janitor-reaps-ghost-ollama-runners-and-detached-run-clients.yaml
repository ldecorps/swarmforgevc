title: "The orphan janitor reaps ghost ollama processes - a model runner (llama-server or ollama runner) whose parent is no longer a live ollama serve, and a detached `ollama run` client older than a grace period - while never touching a runner a live server owns, however large, nor the server itself"
milestone: M8
type: feature
status: todo
epic: local-llm-swarm
priority: 2
direction: human-requested
depends_on: []
