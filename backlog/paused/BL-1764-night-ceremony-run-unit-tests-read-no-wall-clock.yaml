description: |
  ## What is wrong

  `extension/src/tools/night-closing-ceremony-run.ts` computes
  `nightKey = localDayKey(nowMs)` on every tick and continues a night only
  while `prev.nightKey === nightKey`. `extension/test/nightClosingCeremonyRun.test.js`
  starts 19 of its tick sequences at `Date.now()` (census:
  `grep -c 'Date.now()' extension/test/nightClosingCeremonyRun.test.js`
  = 19, 2026-09-25). The three BL-1641 tests tick at t0, t0 + 1 s and
  t0 + 40 min. When t0 is within 40 minutes of local midnight, the third
  tick has a new nightKey, the runner starts a new night, and the sequence
  ends `freeze-promotion` instead of reaching the deadline.

  QA's unit lane on the BL-1704 parcel (d4fd242514, 2026-09-25 23:29 BST)
  failed exactly those three (evidence `backlog/evidence/BL-1704-QA-20260925-2.md`
  and its detail commit b9541a9791 on QA's branch). The specifier
  reproduced it on `main` at 23:30 BST the same night: `TZ=Europe/London`
  3 failed / 17 passed; `TZ=UTC`, `Asia/Tokyo` and `America/New_York`
  20 of 20.

  ## What is wanted

  - Every test in the file starts its ticks from a fixed local date-time
    (for example `new Date(2026, 8, 25, 12, 0, 0).getTime()`) chosen so
    every tick the test makes stays inside one local calendar day. The
    file never reads the wall clock (scenario 01).
  - Same tests, same assertions, same count (scenario 02 pins the census:
    20 tests, 32 `runNightClosingCeremony(` calls today).

  ## Scope

  - `extension/test/nightClosingCeremonyRun.test.js` (+ evidence).
  - New: `specs/pipeline/steps/bl1764NightCeremonyTestsWallClockSteps.js`
    and its registration.
  - Out of scope: the runner itself. A real ceremony that runs across
    local midnight restarts in the same way; that production defect is
    BL-1765, and fixing it does NOT make these tests hour-proof on its own
    (tick 3 lands past that fix's bound), so this slice stands alone.
  - Out of scope: `extension/test/nightClosingCeremonyGate.test.js`, which
    also reads `Date.now()` and is green; not examined for day keying.

constraints: >
  The parcel never edits backlog/standing-reds.tsv (BL-1663); its land
  retires the row (BL-1631). BL-1676 (paused) adds tests to the same file;
  the coordinator keeps the two apart (Concurrent Work Orthogonality).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1764-night-ceremony-run-unit-tests-read-no-wall-clock.feature`:
     every scenario ok (01 x2, 02).
  2. Pick the zone whose local hour is 23 right now:
     `TZ23=$(node -e 'let o=23-new Date().getUTCHours();if(o<-12)o+=24;if(o>14)o-=24;console.log("Etc/GMT"+(o>=0?"-"+o:"+"+(-o)))')`,
     then `cd extension && for tz in "$TZ23" UTC; do TZ=$tz npx vitest run test/nightClosingCeremonyRun.test.js; done`:
     20 of 20 under both. Scenario 01 is the proof that no hour matters;
     this run just shows it at 23:xx local.
  3. The register row for `extension/test/nightClosingCeremonyRun.test.js`
     names BL-1764 on the parcel commit.
  4. `git diff main...HEAD --name-only` names only the test file, the
     step handler, its registration and evidence.
  5. After the land: REGISTER_ROW_RETIRED for
     `extension/test/nightClosingCeremonyRun.test.js`.

