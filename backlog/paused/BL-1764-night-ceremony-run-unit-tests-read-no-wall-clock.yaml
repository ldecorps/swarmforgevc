id: BL-1764
title: "nightClosingCeremonyRun.test.js's tests start their ticks at Date.now() and the runner keys a night on the local calendar day, so the three BL-1641 tests (tick 3 at +40 min) go red whenever the unit lane runs within 40 minutes of local midnight - red in QA's unit lane on 2026-09-25 at 23:29 BST, green under TZ=UTC at the same instant; every test in the file starts from a fixed local date-time instead"
