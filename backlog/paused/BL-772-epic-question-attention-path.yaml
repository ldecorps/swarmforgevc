notes: |
  ## Verified before speccing, 2026-08-01

  `role_ask.bb` is role-generic by construction (`--role <role>`, per-role
  pending file) but is wired into exactly ONE role prompt — the specifier's.
  `grep -rn 'operator_ask\|role_ask' swarmforge/roles/*.prompt` returns the
  specifier and the operator only. The coordinator therefore has no ask path
  at all, which is why its question could only appear on the remote-control
  surface. Slice A is that missing wiring, not a new mechanism.

  The mechanism itself is proven end to end: the specifier's own 2026-07-30
  question was posted, answered by tap on 2026-08-01, and delivered back as a
  `note` — that round trip is what this epic generalises.
