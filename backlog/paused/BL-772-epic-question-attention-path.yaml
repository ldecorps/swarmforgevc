description: |
  ## Why this epic exists

  A coordinator question arrived through cloud remote control while the human
  was not watching that surface. The coordinator flow blocked waiting for an
  answer, and no cross-channel alert existed to pull attention to it. Silent
  waiting stalls the whole operator and coordinator path.

  The requested outcome is that a question raised by the swarm has a
  *guaranteed attention path*: it surfaces where the human already watches
  (Telegram), it is answerable there with one tap when options exist, Bubble
  nudges when one is outstanding, and the answer returns through the existing
  canonical channel.

  ## The constraint that shapes every slice

  "Answers must route back through the existing flow without creating a second
  decision system." This project already has the mechanism — `role_ask.bb`
  writes `.swarmforge/operator/role-awaiting/<role>.json`, the front-desk bot
  posts it to that role's own Telegram topic with tappable options and a
  free-text fallback, and the answer lands in
  `.swarmforge/operator/role-answers/<role>.json` and is delivered to the role
  as a `note`. Every slice here EXTENDS that path. None of them invents a
  parallel one.

  **Correction, 2026-08-07:** "delivered to the role as a `note`" is the
  DORMANT-role leg only, and reading it as the whole delivery story is what let
  a real deadlock hide inside this epic's own premise. There are TWO legs — a
  live-pane inject, then a queued note as fallback — and for a rotating role
  the live leg can never fire, because pane resolution reads a `roles.tsv`
  session mono-router never creates. A role that is BOTH the active resident
  AND holding in-process work is forbidden by its own harness to read its
  mailbox, so the queued note is unreachable and the answer strands. That is
  **BL-846**, and it is what makes this epic's central claim ("answerable where
  the human already watches") hold for every role rather than only for dormant
  ones.

  ## Open design questions and the defaults taken

  These were the intake's five open questions. Slice A takes a default for each
  so work can start; the human amends on the slice, not here.

  1. *Single standing topic, or per-role routing?* — **Per-role**, reusing the
     existing role-topic map. A standing "questions" topic would be a second
     routing system next to the one already shipped.
  2. *Poll first, or inline buttons?* — **Inline buttons**, because that is what
     `role_ask.bb` and the approval taps already use, and taps already record.
  3. *Bubble alert cadence?* — **One-shot on the not-pending → pending
     transition** (slice C). Reminders belong to the escalation ladder, not the
     announce path.
  4. *Auto-escalate after a timeout?* — **Yes, but not a new timer**: slice E
     extends BL-584's stale-approval email escalation to role asks.
  5. *How are stale/superseded questions closed?* — **Slice D**, together with
     the single-source-of-truth question about what "outstanding" means.

  ## Out of scope for the whole epic

  - Re-architecting the Cursor bridge prompt queue (BL-767 owns origin-topic
    answering for queued bridge prompts).
  - Any change to what the coordinator decides — only to how it asks.

