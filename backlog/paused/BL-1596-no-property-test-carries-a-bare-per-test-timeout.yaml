notes: |
  Minted 2026-09-16 by the specifier in the same pass as BL-1595, on the
  third sighting of the bare-per-test-timeout class in two days; the
  per-file owners drain their rows fast, this retires the class. INVEST:
  Independent (waits on the three named lands by depends_on, then needs
  nothing unbuilt), Negotiable (scanner shape and sweep script are
  direction), Valuable (the class stops producing unowned reds and
  per-file tickets), Estimable (a scripted 40-file mechanical migration
  plus one helper and its test - one sitting, the BL-1280 shape at 24
  files/33 sites was one; here 38 files/81 sites), Small (three scenarios, two invariants; the
  diff is wide but each hunk is one line - reviewers read it with
  `git diff --stat` and the evidence's site list), Testable (pure scanner
  and real-tree walk in seconds, lane runs in e2e - BL-1541). Severity
  medium, not high: no unowned red exists because of it today.

  AMENDED 2026-09-16 19:30Z by the specifier (BL-1606 mint, same pass as
  QA's unowned-red note on BL-1598): the helper this sweep routes every
  site through caps the budget at the SHARED 120000 ms ceiling
  (effectiveBudgetMs = min(ceiling, base x factor) for factor above 1),
  which sits below 15 of the 81 bases (2 at 180000, 13 at 240000) and
  equals 33 more. As the helper stood, the sweep would have HALVED the
  240000 sites under a busy lane and frozen the 120000 ones, and
  invariant 1 (quiet host only) would not have seen it. BL-1606 fixes
  the helper first (the property lane passes its own ceiling through
  resolveUnitLaneTimeout's ceilingMs option; never below a base, growth
  for every base; the 20000 and 60000 routes unchanged) and migrates
  bl968Sensitivity's 240000 site; depends_on gains BL-1606 and the
  census subtraction names it. No scenario changes: scenario 02's
  count is 'at least 38' and scenario 03's census is re-run at the
  parcel's base commit, where bl968's site is already gone.

