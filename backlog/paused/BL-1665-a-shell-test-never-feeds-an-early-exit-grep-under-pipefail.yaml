description: |
  ## What is wrong

  Measured by the specifier on main 128e527ce0, 2026-09-20 03:5x Z: of
  408 files in `swarmforge/scripts/test/*.sh`, 125 both set `pipefail`
  and contain `| grep -q` (732 sites; the eight heaviest:
  test_swarm_ensure.sh 73, test_ready_for_next_rotate_home.sh 37,
  test_property_suite_drift_guard.sh 33, test_daemon_alarm_lib.sh 21,
  test_role_ask.sh 20, test_merge_deletion_guard.sh 20,
  test_pipeline_code_on_main_guard.sh 19, test_branch_claim_guard.sh 16).
  bash's builtins write a multi-line string to a pipe line by line
  (BL-1660's measurement: 57 of 400 runs under load), so when the needle
  is on an early line, `grep -q` exits, the producer's next write dies
  of SIGPIPE, pipefail reports 141 and `|| fail` fires on a present
  needle. Seen live: the specifier's first run of
  test_merge_deletion_guard.sh case 02 on main ("refusal must name
  BL-0001, got: ... (BL-0001, introduced at ...") while the property lane
  loaded the host; the second run passed. BL-1539 fixed one instance in
  a production guard on 2026-09-14; BL-1660 owns the library instance.

  ## What is wanted

  - A guard `swarmforge/scripts/check_shell_test_early_exit_pipe.sh` in
    the pre-commit chain: for every staged `swarmforge/scripts/test/*.sh`
    that sets pipefail, refuse any line where a pipe feeds `grep` with a
    `-q` in its flag cluster, naming file and line; files without
    pipefail are not judged. Bash 3.2 compatible (no mapfile).
  - A codemod over the 124 in-scope files: `| grep -q<flags> <args>`
    becomes `| grep <flags> <args> >/dev/null` (a `!`-negated pipe keeps
    its `!`); assertions on a literal needle may become
    `[[ "$OUT" == *needle* ]]` instead. Every assertion keeps its needle
    and flags.
  - Scenario 04 pins the census: the scan reports at least 400 files and
    names none.

  ## How (direction, not mandate)

  - `grep -nE '\|\s*grep\s+-[A-Za-z]*q' <file>` is the detector; the
    codemod is a `sed -E` over the same pattern with a manual pass on
    the eight heaviest files. Run the shell lane once after; a case that
    goes red under the codemod was asserting on grep's early exit and is
    rewritten by hand.

constraints: >
  No change to any production script or to any feature file other than
  this one. test_merge_deletion_guard.sh is BL-1664's. The guard reads
  staged content only; a bypass env var is not added.

out_of_scope: |
  - The 31 production scripts under swarmforge/scripts with the same
    shape: BL-1660's census; a production guard is that ticket's
    successor if a second production sighting lands.
  - `| head -1`, `| sed q` and other early-exit consumers: not sighted;
    the detector is extended when one is.

qa_e2e_procedure: >
  (1) `node specs/pipeline/cli.js specs/features/BL-1665-a-shell-test-never-feeds-an-early-exit-grep-under-pipefail.feature`
  ONCE on the parcel commit: 6 rows ok. (2) The shell lane once: green.
  (3) `for f in swarmforge/scripts/test/*.sh; do grep -q pipefail "$f" && grep -nE '\|\s*grep\s+-[A-Za-z]*q' "$f"; done`
  prints nothing outside test_merge_deletion_guard.sh. Never "run it N
  times".

