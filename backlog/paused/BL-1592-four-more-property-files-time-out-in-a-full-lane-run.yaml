id: BL-1592
title: "Four more fixture-spawning property files (bl1375, bl1309, bl1389, bl1529) timed out in the coder's first full 408-file property-lane run for BL-1588 on 2026-09-16, none named by BL-1588 and none carrying a register row; bl1375, bl1309 and bl1389 carry no per-test budget at all and bl1529 pins a bare 60000 ms third argument on its only test, which no lane-level ceiling can reach; this ticket owns the four rows, gives every test in the four files the concurrency-aware budget BL-1588 lands from the base each file declares today, records each file's full-lane text and remedy, and takes the four rows out in the same land"
