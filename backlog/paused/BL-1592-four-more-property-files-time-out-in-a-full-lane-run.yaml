notes: |
  Minted 2026-09-16 by the specifier while completing the coder's
  unowned-red note, the same pass; the four register rows in
  backlog/standing-reds.tsv name this ticket, the coordinator was sent the
  paused-ready note and the coder (holding BL-1588) the owner note so its
  evidence can cite BL-1592 by id. No parcel is withheld on these reds
  today; the rows exist so that QA's next full-lane run on any parcel
  finds them owned (Article 4.2). INVEST: Independent (waits on BL-1588's
  land by depends_on, then needs nothing unbuilt), Negotiable (per-file
  or config-level wiring is direction, the handler accepts both),
  Valuable (four more lane reds stop withholding unrelated parcels and the
  class stops re-minting one file at a time), Estimable (at most ten
  it() wirings, one bare literal replaced, 5 bounded lane runs, one
  sitting), Small (four scenarios, two invariants), Testable (source-level
  checks and the in-process budget seam in seconds; runners in e2e -
  BL-1541). Severity high per the standing-red rule, not medium.

