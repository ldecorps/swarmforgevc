qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `bash swarmforge/scripts/test/test_swarm_handoff_inbound_non_forwarding.sh`
     five times -> `ALL PASS`, exit 0 every time; the output of case 03
     shows `AUDIT_REQUIRED` once and `HANDOFF QUEUED (mailbox only, no tmux
     inject):` once.
  2. `git diff main...HEAD --name-only` names the shell test, the step
     handler, `specs/pipeline/steps/index.js`, the feature, evidence, and
     the register-row removal; `swarmforge/scripts/swarm_handoff.bb` and
     `handoff_lib.bb` are unchanged (`git diff main...HEAD -- <path>` empty).
  3. `grep -n 'SKIP_DAEMON\|MAILBOX_ONLY' <the test>` shows SKIP_DAEMON only
     on the refusal cases and MAILBOX_ONLY on the queueing send.
  4. Break-then-restore: delete the second call in case 03; the test fails
     on `expected exit 0` and the feature's scenario 01 goes red; restore.
  5. The row for this file is gone from `backlog/standing-reds.tsv`.
