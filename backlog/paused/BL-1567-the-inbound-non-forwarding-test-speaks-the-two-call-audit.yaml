description: |
  ## What is wrong

  `swarmforge/scripts/test/test_swarm_handoff_inbound_non_forwarding.sh`
  (BL-1302, lane shell, `standing` in suite-manifest.tsv) fails on `main`
  674d50539a at its third case:

  ```
  PASS: a lone non-forwarding inbound blocks the forward
  PASS: a non-forwarding inbound still blocks alongside an ordinary forwardable inbound
  FAIL: ordinary-only in_process: expected exit 0, got 1: ... AUDIT_REQUIRED
  HANDOFF_NOT_QUEUED
  ```

  Its `run_send` invokes `swarm_handoff.bb` ONCE per case. The first
  invocation of any git_handoff draft is the self-audit challenge
  (Article 2.3): it prints `AUDIT_REQUIRED` / `HANDOFF_NOT_QUEUED`,
  queues nothing, and since BL-1529 (7115aa7595, 2026-09-12) exits
  non-zero. Case 03's `[[ "$rc3" -eq 0 ]]` therefore cannot pass. Before
  BL-1529 it passed because the challenge exited 0 BEFORE the delivery
  leg - the case never verified a queue at all, so it was vacuous from
  the day it landed (2026-08-30). BL-1530 fixed the three files that
  were red on 2026-09-11; this one was still green then and turned red
  the day after.

  A second identical call is necessary but not sufficient in this
  fixture: `run_send` exports `SWARMFORGE_SKIP_DAEMON=1` and the fixture
  creates no `.swarmforge/tmux-socket`, so `deliver-parcel!` throws
  "tmux socket file missing", which `swarm_handoff.bb` makes fatal
  (exit 1) under SKIP_DAEMON. The established escape is
  `test_mailbox_only_delivery.sh`'s `SWARMFORGE_MAILBOX_ONLY=1` with
  `SWARMFORGE_SKIP_DAEMON` unset, which takes the `:skipped` sync
  result and prints `HANDOFF QUEUED (mailbox only, no tmux inject):`.

  Census (BL-1445, evidence file): 12 shell tests draft a git_handoff
  and invoke swarm_handoff; 11 are green on main; this is the only red.

  ## What is wanted

  Case 03 tolerates the first call under both exit conventions
  (`|| true`), asserts it printed `AUDIT_REQUIRED` and queued nothing,
  then makes the identical second call and asserts exit 0 and the
  mailbox-only queue grammar, with the non-forwarding refusal still
  asserted absent on both calls. Cases 01 and 02 are unchanged: a
  refusal exits before the audit. The file prints `ALL PASS` on `main`
  and the register row this ticket adds is removed in the same land.

  ## How (direction, not mandate)

  - Give `run_send` a mode: the refusal cases keep `SWARMFORGE_SKIP_DAEMON=1`
    (they never reach delivery); the queueing case exports
    `SWARMFORGE_MAILBOX_ONLY=1` and unsets `SWARMFORGE_SKIP_DAEMON`, the
    shape `test_swarm_handoff_refuses_coordinator_git_handoff.sh` (BL-1565,
    in flight) and `test_handoff_state_dir_worktree_root.sh` (BL-1530) use.
  - Assert the queue on the second call's stdout (`HANDOFF QUEUED (mailbox
    only, no tmux inject):`) and on the outbox file existing, not on exit
    code alone.
  - Step handler `specs/pipeline/steps/bl1567InboundNonForwardingTwoCallSteps.js`
    runs the real shell test as a subprocess and greps the FILE for the
    two-call shape (bl1530ShellTestsSpeakTheAuditSteps.js's shape); it
    lands in the same commit as the feature (BL-233).

  ## Not in scope

  - `swarm_handoff.bb`, `handoff_lib.bb` and the audit protocol are not
    touched; no env var that skips the audit is added or read.
  - The sibling `test_swarm_handoff_inbound_non_forwarding_batch.sh` is
    green and untouched.

