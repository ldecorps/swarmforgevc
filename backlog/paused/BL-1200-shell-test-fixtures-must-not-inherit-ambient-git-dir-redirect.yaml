acceptance: specs/features/BL-1200-shell-test-fixtures-must-not-inherit-ambient-git-dir-redirect.feature
human_approval: pending
approval_context: >
  Sibling of BL-1196, minted because BL-1196's approved scope is the JS half
  only (a vitest setupFiles module for extension/test/**) and cannot reach
  the shell suite at all. Not an amendment to BL-1196: that ticket is already
  human-approved, its fix is different machinery in a different test lane,
  and each half lands independently.

  This half is not a prediction — it fired at 19:31 BST on 2026-08-27 while
  the specifier was mid-mint. swarmforge/scripts/test/expedite_fixture.sh
  wrote twenty commits authored "expedite fixture" onto local main, left the
  master checkout on a detached HEAD, and left `main` claimed by a stray
  /tmp worktree. No content was lost (the commits are empty; origin/main is
  still an ancestor of local main), but every master-resident role has been
  committing off-branch since. Full trace: backlog/evidence/
  master-checkout-detached-by-expedite-fixture-20260827.md.

  Measured the same day, not estimated: 332 shell tests live under
  swarmforge/scripts/test/, 75 of them run git, and 0 clear either variable.

  What is worth the human's eye: this ticket names a shared guard file as
  its shape (mirroring BL-1196's approved gitEnvGuardSetup.js) rather than
  two inline `unset` lines, on the grounds that the 73 unguarded git-using
  tests it does NOT touch are exactly how this recurs. If two inline unsets
  are preferred, say so and the required_wiring below must change with it.
description: |
  ## What

  Add `swarmforge/scripts/test/lib/git_env_guard.sh`: sourcing it unsets
  `GIT_DIR` and `GIT_WORK_TREE` unconditionally, and it is safe to source
  more than once. Source it from two places:

  1. `swarmforge/scripts/test/run_bb_suite.sh` — the standing suite entry
     point (BL-973), so every test the sweep spawns is clean.
  2. `swarmforge/scripts/test/expedite_fixture.sh` — the fixture that
     actually fired, so a test invoked DIRECTLY from an agent pane (which is
     how today's incident happened, not via the suite runner) is clean too.

  ## Why the runner alone is not enough

  Today's corruption did not come from a suite sweep. Agent panes run single
  test files by hand — `bash swarmforge/scripts/test/test_expedite_cli.sh` —
  and that path never touches run_bb_suite.sh. A guard installed only at the
  suite entry point would have left this exact incident free to happen again.
  The shared fixtures that themselves shell git are the second lever, because
  they are what the hand-run tests load.

  ## Why a shared file rather than two inline unsets

  Two `unset` lines fix the two sites known today and leave the same footgun
  for whichever of the other 73 git-using shell tests is edited next — the
  precise way the JS half recurred after BL-1124 shipped its detector. A
  single sourceable guard makes "add one line" the whole cost of protecting
  site 76, and gives the invariant below something to point at. This mirrors
  the shape already approved for the JS half in BL-1196
  (`gitEnvGuardSetup.js`), deliberately: two halves of one defect should not
  be fixed in two unrelated styles.

  ## Constraints

  - Unset, do not merely override. A test that deliberately sets either
    variable for its own purposes afterward must still work — the guard
    clears an INHERITED value at source time, nothing more.
  - Do not migrate the other 73 git-using shell tests in this ticket. The
    guard exists so they can be covered one line at a time as they are
    touched; a 73-file sweep is a different ticket and a worse review.
  - Do not weaken `lib/tmp_cleanup.sh` or the other shared test libs — this
    is an additional sourceable file beside them, matching their conventions.
  - The guard must be sourceable from a test that is already running under
    `set -u`; it must not itself fail when the variables are unset to begin
    with (the common case).

qa_e2e_procedure: >
  (1) Export GIT_DIR/GIT_WORK_TREE at a decoy repository, run
  expedite_fixture.sh against a temp root, and confirm the fixture's own temp
  repository holds the commits while the decoy's HEAD, branch tip and commit
  count are all byte-identical before and after. (2) Same setup, but run the
  standing suite via run_bb_suite.sh --list plus one real standing test, and
  confirm the decoy is untouched. (3) Grep the shipped
  expedite_fixture.sh and run_bb_suite.sh for the guard source line — a guard
  that exists and is sourced nowhere is the failure this step catches, and it
  is the same failure this ticket is about. (4) Confirm test_expedite_cli.sh,
  test_bl1023_expedite_bookkeep.sh and test_expedite_qa_verdict_store.sh (the
  three callers of the fixture) still behave as they did before the guard —
  note that test_expedite_cli.sh has a known pre-existing red (BL-782) that
  this ticket neither fixes nor is blocked by; compare against that baseline,
  not against green.

out_of_scope: |
  - The JS half — BL-1196, already approved and paused, fixes
    extension/test/** with a vitest setupFiles module. Neither half blocks
    the other.
  - Migrating the other 73 git-using shell tests to source the guard.
  - BL-782 (test_expedite_cli.sh's own 28 pre-existing failures). Same
    fixture, different defect; this ticket must not be gated on that suite
    going green.
  - BL-1124's post-hoc shared-main/core.bare detector — the after-the-fact
    companion, unaffected.
  - Recovering the master checkout from the detached HEAD this incident left,
    and deciding the fate of the stray /tmp/specifier-main-main worktree that
    holds `main`. Those are live ops actions, surfaced to the coordinator and
    the human; this ticket is the prevention.
  - Finding where the ambient GIT_DIR/GIT_WORK_TREE in agent panes comes from
    in the first place. No swarm launcher exports them; the guard is correct
    regardless of the answer, and a test suite that only behaves when its
    host environment is clean is the defect either way.

invariants:
  - "A test fixture's git writes land in the repository the fixture created, never in a repository named only by an inherited environment variable."

