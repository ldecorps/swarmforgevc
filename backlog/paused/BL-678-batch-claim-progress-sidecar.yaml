source: |
  BL-648's source, "same family" section, 2026-07-25 afternoon episode: a
  batch-mode claim (cleaner) wrote NO claim-progress sidecar, so a healthy
  in-flight parcel was indistinguishable from a lost one, and the
  coordinator nearly re-forwarded a duplicate at 16:47. Both episodes
  reduce to: a parcel in in_process/ is invisible to every observer, and
  nothing verifies its owner is alive (BL-648) or making progress (this).

description: |
  ## Shape

  1. **Batch claims write a sidecar.** When a batch role claims parcels,
     each claim gets a sidecar record (owner role, parcel id, claim
     instant, last-progress instant) refreshed as the batch progresses —
     cheap, durable, next to the claim itself.
  2. **Chase-side observers consult it.** The chase/nudge sweep and any
     re-forward decision path read the sidecar first: fresh progress means
     healthy — no re-forward, no duplicate; stale progress means the
     parcel is surfaced to the coordinator as suspect, named, with its
     age — surfacing, not silent re-delivery, is the mid-run action
     (re-delivery past a LIVE owner is exactly the duplicate hazard).

  ## What NOT to do

  - Do not touch BL-528's idle thresholds or task-mode claim handling.
  - Do not let the sidecar become a liveness oracle for dead owners —
    that is BL-648's launch-time sweep; this mechanism assumes a live
    owner and answers "is it progressing", not "is it alive".

  Coder materializes the .feature.draft to .feature and wires step
  handlers in the same parcel (BL-441/BL-233).

  ## e2e QA procedure

  On a live batch (cleaner with two parcels): verify sidecars appear at
  claim and refresh during work; trigger a chase sweep mid-batch and
  verify no re-forward happens and no duplicate lands; freeze the batch
  role past the staleness threshold and verify the coordinator gets a
  named suspect surface line, and the parcel is still not re-delivered.
