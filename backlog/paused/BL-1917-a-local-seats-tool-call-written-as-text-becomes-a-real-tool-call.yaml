description: |
  ## Status: hotfix 102d854f87 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  qwen2.5-coder-14b writes its tool call as text. Replaying the coder
  seat's captured first request: 5 of 5 replies were a ```json fence
  naming read_file with the right arguments, at 4096 and at 32768 alike.
  Ollama parses a reply into tool_calls only when it starts with the
  template's <tool_call> tag, so qwen received plain content, printed it,
  and the turn ended. A template without the tag parsed 0 of 5 real
  replies, so the fix sits outside the model.

  ## What the hotfix changed

  - swarmforge/scripts/local_model_tool_call_shim.py (stdlib Python):
    forwards every request to Ollama unchanged, except a chat completion
    that declares tools. That one goes upstream unstreamed, and a fenced,
    bare or <tool_call>-tagged JSON object naming a declared tool becomes
    tool_calls; other text stays content. A streaming client gets SSE back,
    with a keepalive comment while Ollama works. GET /shim/health names it.
  - swarmforge.sh: local_model_seat_url gives a local-model seat the shim's
    URL (SWARMFORGE_LOCAL_MODEL_SHIM_PORT, default 11439;
    SWARMFORGE_LOCAL_MODEL_SHIM=off keeps the endpoint) and starts nothing;
    the seat's pane script starts the shim (local_model_shim_start_line),
    reusing one that answers. write_local_model_qwen_settings takes the
    seat URL as an optional 6th argument.
  - local_model_qwen_provider_cli.bb: --base-url sets the provider entry's
    baseUrl; the window is still read from --endpoint-url. The provider
    entry is what qwen uses, over OPENAI_BASE_URL.
  - Tests: test_bl1917_local_model_seat_url.sh (standing; its case 0 runs
    test_local_model_tool_call_shim.py).

  ## What each stage checks

  - Coder: the diff against the description; run
    test_bl1917_local_model_seat_url.sh and BL-1052's feature; one live
    check through the running shim (its log line for your own first turn
    reads rewritten=1). Evidence: backlog/evidence/BL-1917-coder-<date>.md.
  - Architect: a new process now sits in the seat's request path. Is the
    pane-script start the right owner of its lifetime (babysitterd, the
    ollama ancillary and BL-1711's crash restart all leave it alone), and
    is a seat whose shim cannot take its port loud enough?
  - Documenter: docs/diagrams/architecture.mmd draws the seat's path to
    OLLAMA and its change-trigger fired (a new process in that path, a new
    .swarmforge/local-model-shim/ state folder); update it.
    docs/how-to/BL-1052-local-model-seat-launch.md says the seat targets
    127.0.0.1:11434 directly; say it goes through the shim and how to turn
    the shim off.

qa_e2e_procedure: |
  1. `bash swarmforge/scripts/test/test_bl1917_local_model_seat_url.sh` prints ALL PASS (5 cases).
  2. `node specs/pipeline/cli.js specs/features/BL-1052-a-role-seat-can-be-staffed-by-a-downloaded-local-model.feature`
     passes (measured at mint: all ok).
  3. `curl -s http://127.0.0.1:11439/shim/health` names local-model-tool-call-shim
     and upstream http://127.0.0.1:11434/v1 while the coder seat is staffed.
  4. `grep -c 'rewritten=1' .swarmforge/local-model-shim/shim.log` is at least 1:
     the seat ran a tool the shim rewrote.
  5. architecture.mmd shows the shim between the seat and OLLAMA; the BL-1052
     how-to names the shim and SWARMFORGE_LOCAL_MODEL_SHIM=off.

