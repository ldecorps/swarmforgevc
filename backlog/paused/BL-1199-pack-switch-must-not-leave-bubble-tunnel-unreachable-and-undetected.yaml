human_approval: approved
approval_context: >
  Operator intake 2026-08-27 ~19:16 BST
  (.swarmforge/operator/INTAKE-pack-switch-kills-bubble-cloudflared.md,
  priority 01): switching to the Anthropic swarm
  (./start-swarm-anthropic.sh -> openrouter-anthropic-mono-router) left the
  Bubble named tunnel (swarmforge-bubble -> bubble.musicalsifu.com) down. No
  cloudflared process; recorded pid 3732619 no longer alive; the last
  resident-spy-cloudflared.log line was a successful register at
  2026-08-27T17:53:39Z followed by silence, with no graceful-shutdown line.
  Ops recovered by hand.

  Two of the intake's three wanted fixes are scoped here; the third
  (front-desk status must not report running with dead pids) was checked
  against the live code and is ALREADY satisfied — see notes for the
  file:line evidence and the verbatim directive. What needs the human's eye
  is that disposition, and the decision to rename the existing
  "cloudflare-tunnel" status row to "vscode-tunnel" so the two tunnels can
  never be confused again (verified 2026-08-27: that label is defined at
  swarm_status.bb:280 and read by nothing else in the repo, so the rename
  breaks no consumer).

  Firm: the named tunnel's own liveness must be observed directly, and a
  green editor-tunnel row must never be able to stand in for it. Negotiable:
  where the shared liveness check lives, and whether a failed assertion
  triggers one bounded relaunch before reporting.
description: |
  ## What

  Make the Bubble named tunnel's liveness an observed fact on the two
  surfaces that lied during this incident.

  1. **Ancillary start asserts, it does not assume.**
     `swarmforge/scripts/start_ancillary_services.sh` (the named-tunnel block
     at its `launch_resident_spy_tunnel.sh` call) treats a zero exit from the
     launcher as the end of the story. Re-read the recorded pid after launch
     and confirm the process is actually alive before reporting success. A
     failed assertion is reported loudly and names the *named* tunnel.

  2. **`./swarm status` shows the two tunnels as two rows.**
     `swarmforge/scripts/swarm_status.bb:280` renders exactly one tunnel row,
     `cloudflare-tunnel`, sourced from `.swarmforge/operator/tunnel.pid` —
     which is the editor tunnel (`code tunnel` / `swarmforge-ops`). Nothing
     anywhere observes `.swarmforge/operator/resident-spy-cloudflared.pid`.
     Split into a `vscode-tunnel` row and a `bubble-cloudflared` row so a
     live editor tunnel can never render as Bubble being up.

  ## Why

  The failure was not that a process died — processes die. The failure was
  that nothing could tell anyone it had. The operator read `./swarm status`,
  saw `cloudflare-tunnel UP`, and that row was truthfully reporting a
  completely different process. The one surface that could have caught it at
  the moment of the switch — ancillary start — had already accepted the
  launcher's exit code as proof of a running tunnel, minutes before the
  tunnel stopped running. Both halves are the same defect wearing two faces:
  a liveness claim that was never actually checked against the process it
  claims to describe.

  ## How (direction, not mandate)

  One shared "is the named tunnel live?" predicate (pidfile + `kill -0`)
  consulted by both call sites, rather than two hand-rolled checks that can
  drift apart. When the assertion fails at ancillary start, one bounded
  relaunch attempt before reporting is reasonable — `launch_resident_spy_
  tunnel.sh` is already idempotent (it prints `already running pid=` and
  exits when the pid is live), so calling it again is safe. One attempt, no
  retry loop.

  ## Constraints

  - **The assertion must run from ancillary start**, not only from a status
    command a human has to remember to type — the point is that the pack
    switch itself surfaces the failure. QA verifies the call site, not only
    the predicate (see qa_e2e_procedure step 3).
  - **No network probe in the gate.** The intake offers an HTTPS probe to the
    configured hostname as optional; keep the acceptance contract pid-based
    so it stays deterministic and offline. A probe may ship behind a flag,
    but no scenario may depend on reaching Cloudflare.
  - Do not change what `launch_resident_spy_tunnel.sh` does — it worked; it
    was the only thing that did. This ticket observes it, it does not
    rewrite it.
  - The named tunnel is operator-root-only (the launcher already refuses
    elsewhere, BL-857). A root with no named tunnel configured must report
    "not configured", never "down" — an absent tunnel is not a fault.

qa_e2e_procedure: >
  (1) Fixture: write a `resident-spy-cloudflared.pid` holding a pid that is
  not alive, with a named tunnel configured; run the ancillary-start
  named-tunnel path with the launcher stubbed to exit 0 without spawning
  anything; confirm the outcome reports the named tunnel DOWN and that the
  message names the named tunnel, not the editor tunnel. (2) Fixture: a live
  editor-tunnel pid in `operator/tunnel.pid` and a dead pid in
  `resident-spy-cloudflared.pid`; run `./swarm status`; confirm a
  `vscode-tunnel` row reads UP and a separate `bubble-cloudflared` row reads
  DOWN in the same render — this is the exact shape the operator saw as one
  green row. (3) Grep the shipped `start_ancillary_services.sh` to confirm
  the assertion is actually invoked there and not only defined; a passing
  predicate with no call site is the failure this step exists to catch. (4)
  Live, on the operator root: `bash swarmforge/scripts/stop_ancillary_
  services.sh .` then confirm `./swarm status` shows `bubble-cloudflared`
  DOWN, then `./swarm ensure .` and confirm it returns to UP.

out_of_scope: |
  - **Front-desk stale `running` status** — the third wanted fix in the
    intake. Verified already satisfied in the live code; the verbatim
    directive and the evidence are preserved in notes. Nothing to build.
  - **Why the cloudflared process died during the pack switch.** The log
    shows a clean register and then silence with no shutdown line, so the
    kill itself is unexplained. Detecting the death is this ticket;
    diagnosing the killer is a separate investigation and must not hold this
    fix, which is what makes that investigation possible next time.
  - The optional HTTPS probe to the configured hostname as a gated
    requirement (see Constraints — it may ship, it may not be depended on).
  - `operator_tunnel.sh` / the editor tunnel's own behaviour. It was healthy
    throughout; it is renamed on the status surface, not modified.

invariants:
  - "No tunnel status row is ever derived from a different tunnel's pidfile — every row observes the process it names."
  - "Liveness of an ancillary service is never inferred from its launcher's exit code; it is re-read from the process after launch."

source: |
  .swarmforge/operator/INTAKE-pack-switch-kills-bubble-cloudflared.md
  (human via Cursor, 2026-08-27 ~19:16 BST, priority 01), archived to
  .swarmforge/operator/archive/ on mint. The intake's three wanted durable
  fixes, verbatim:

    1. "After ancillary start, assert live `cloudflared` for the named tunnel
       (pidfile + `kill -0` + optional HTTPS probe to the configured
       hostname), not only VS Code tunnel health."
    2. "Front-desk status must not report `running` when supervisor/bridge
       pids are dead (stale status lied through the outage)."
    3. "Optionally: `./swarm status` should distinguish `vscode-tunnel` vs
       `bubble-cloudflared` so a green "cloudflare-tunnel" row cannot mask
       Bubble being down."

  Directive 1 is scenario 01; directive 3 is scenario 02; directive 2 is
  dispositioned in notes below. Mechanism confirmed by the specifier reading
  swarm_status.bb, start_ancillary_services.sh and
  launch_resident_spy_tunnel.sh directly, not inferred from the intake.

