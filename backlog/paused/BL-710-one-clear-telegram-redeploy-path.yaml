notes: |
  e2e QA procedure: make a visible no-op change to a front-desk-only source
  file, send the front-desk redeploy form from the Cursor Remote topic, Confirm,
  and verify a NEW front-desk build fingerprint is live (build stamp or process
  start time) while the cursor bridge is untouched; repeat with the union form
  and verify the status reply names every process that actually restarted;
  finally send a redeploy form from a non-principal sender and from the wrong
  topic and verify both no-op. Related: `docs/how-to/BL-698-telegram-cursor-operator-commands.md`,
