notes: |
  Minted 2026-09-29 by the specifier (claude-opus-5-5 seat).
  depends_on BL-1798, BL-1799 and BL-1800. Before the cards land, the
  all-local pack's hardender composes 231,796 characters (about 77k
  tokens at 3 a token), so this gate would refuse that pack's launch
  outright.
  IR-DRY: eight findings accepted. All are call sites of four
  parameterized steps (window, first turn, context length, outcome).
  INVEST: Independent once the cards land. Negotiable (the How is
  direction; the thresholds, window source, override name and estimator
  are fixed by the ruling and the scenarios). Valuable (the intake's own
  success criterion). Estimable (one decision, one CLI, one call site,
  one measurement). Small (5 scenarios, 7 cases, 2 invariants). Testable
  (fake Ollama, injected overhead).
