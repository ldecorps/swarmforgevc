source: |
  Architect pass on BL-620, 2026-08-19
  (.worktrees/architect/backlog/evidence/BL-620-architect-pass-20260819.md),
  delivered to specifier + coordinator as a priority-00 note under Article
  4.4 rather than a bounce: "the ticket's own description states the 'no
  vision' annotation as a general principle for 'routed content', but the
  actual acceptance criteria scope it narrowly: scenario 04 only covers the
  backlog-topic routing path." BL-620 itself is COMPLIANT against its
  written scenarios and was not blocked on this.

  Root incident behind the principle is BL-620's own: the human's photo +
  caption directive was silently dropped, closing with "I hope you have
  vision to see the picture."

description: |
  ## Defect

  BL-620 fixed `messageTextOf` to return `text ?? caption`. That is ONE
  shared seam, so every text-reading surface inherited caption support in
  the same commit. BL-620 also introduced `annotateRoutedMediaText` — the
  "no vision, said out loud" note — but wired it into only THREE call
  sites, all inside `processMessageUpdate`'s backlog-topic branch
  (post-existing, operator-context, open-decision).

  Every other surface now forwards caption-derived words onward with the
  note absent. The reader — a human in a topic, or an AGENT receiving a
  steering nudge in its pane — has no way to know an unread image was
  attached. That is precisely the false belief the incident directive
  demanded the front desk never create, and the shared-seam fix made it
  reachable on six more paths at once.

  ## Verified live, not taken on report

  Re-checked at the architect-forwarded commit before writing this ticket:
  `grep -n annotateRoutedMediaText extension/src/` returns its definition
  plus exactly three call sites, all at `telegramFrontDeskBotCore.ts:2354`,
  `:2358`, `:2366`. The six unannotated forwarding surfaces below each read
  `messageTextOf` and pass the result onward:

  1. **steering** — `attemptSteeringDelivery` -> `redirectToRole(role, text)`;
     the text is injected into an agent's live pane.
  2. **agent-questions** — `attemptAgentQuestionsTopicDelivery` ->
     `postToBridge(pendingThreadId, decision.text, ...)`.
  3. **onboarding** — `attemptOnboardingTopicDelivery` ->
     `handleOnboarderMessage(topicId, decision.text, ...)`.
  4. **negotiation relay** — `negotiationTelegramRouting.ts:89` reads
     `messageTextOf(update)` and relays it.
  5. **approvals reject reason** — `deliverApprovalsTopicReply` ->
     `recordApprovalDecisionAndClose(..., { kind: 'rejected', reason })`;
     a caption-derived reason lands in a DURABLE ticket record.
  6. **recert amend text** — `deliverRecertTopicReply` ->
     `queueRecertAmendProposal(scenarioId, decision.newText)`; likewise
     durable.

  ## Fix shape (direction, not mandate)

  Reach the existing `annotateRoutedMediaText` seam from each of the six
  forwarding boundaries. It is already the right shape — a posting-time
  transform over `(text, update)` — and BL-620's architect pass confirmed
  it is correctly NOT applied at decision time. Whether that is six call
  sites or one shared wrapper at the delivery boundary is the
  implementer's call; the invariants above are the constraint.

  Two of the six write into durable records rather than posting a message.
  The note belongs in the STORED value there: someone reading that ticket
  rejection or that amend proposal a week later is exactly the reader who
  cannot otherwise tell an unread image was attached.

  ## The one surface deliberately excluded

  `attemptControlTextDelivery` also reads `messageTextOf`, but its text is
  PARSED as a command and never displayed. Appending a note would corrupt
  the parse. Scenario 03 pins that exclusion as a standing guard so a later
  "annotate everything" sweep cannot quietly break command parsing.

  ## Scope

  extension/src/tools/telegramFrontDeskBotCore.ts (the five in-file
  forwarding boundaries above), extension/src/onboarding/negotiationTelegramRouting.ts
  (the relay). NOTE: overlaps telegramFrontDeskBotCore.ts with BL-620 and
  BL-621 — sequence all three, never concurrent (Concurrent Work
  Orthogonality). BL-620 must be in backlog/done/ before this is promoted:
  it is what lands `annotateRoutedMediaText` in the first place.

acceptance: specs/features/BL-955-annotate-caption-derived-text-on-every-forwarding-surface.feature.draft

required_wiring:
  - "extension/src/onboarding/negotiationTelegramRouting.ts::annotateRoutedMediaText::the negotiation relay is the one forwarding surface in a different file; it forwards messageTextOf output today with no annotation, and a fix that only touches telegramFrontDeskBotCore.ts leaves it dark"

qa_e2e_procedure: |
  QA end-to-end procedure (live swarm). BL-620's own procedure already
  covers the three backlog-topic surfaces; this one covers what it did not:
  1. From the principal account, send a photo with a caption into a bound
     ROLE STEERING topic. The role's pane receives the caption words AND
     the image-not-read note — read the pane, not just the bot log.
  2. Answer a pending agent question with a photo + caption in the Agent
     Questions topic: the answer that reaches the asking role carries the
     note.
  3. Reject a ticket in its Approvals topic with a photo + caption as the
     reason. Read the ticket's recorded rejection reason back from disk:
     the note is present in the STORED text, not only in the chat echo.
  4. Send a control command (e.g. the pause verb) as a photo caption in the
     Control topic: it executes exactly as the plain-text command does, and
     no note is appended to what the parser read.
  5. Send a plain-text (no attachment) steering message: forwarded text is
     byte-identical to what was typed — no stray note.

out_of_scope: |
  - Reading or processing image content. The front desk still has NO
    vision; this ticket only makes that fact visible everywhere. Unchanged
    from BL-620's own out_of_scope.
  - Control-topic command text (see "the one surface deliberately excluded"
    above) — scenario 03 guards the exclusion rather than closing it.
  - The drop-audit half of BL-620. Its out_of_scope deliberately limited the
    audit line to the main poll drop path; extending audit lines to the
    side-channel drop paths is a separate question and is NOT bundled here
    (that would fail INVEST-S and mix two observable outcomes).
  - Voice-message handling (decideVoiceUpdateAction path, untouched).

notes: |
  Every scenario needs its step handler wired in this same parcel (BL-233).
  The feature file is parked as `.feature.draft` and `acceptance:` points at
  the draft: none of these scenarios has a handler yet, and the acceptance
  runner THROWS on a live `.feature` scenario with no handler. Rename it to
  `.feature` in the implementing parcel.

  Scenario -> shape map: 01 the six unannotated forwarding surfaces each
  reach the annotation seam; 02 the no-attachment guard (annotation never
  fires without media); 03 the control-parse exclusion guard.

  IR-DRY disposition (checker run 2026-08-19, 2 findings, both
  `possible-synonym`, confidence medium, score 0.667): both compare the
  outline's `the "<surface>" surface is wired` against the concrete
  `the "steering"` / `"control-delivery"` instantiations in scenarios 02 and
  03. That is the SAME step text with a bound parameter, not accidental
  wording drift — the checker does not normalize quoted literals, so a
  placeholder and its own instantiation always score as near-duplicates
  here. Deliberately not "normalized"; do not re-litigate.

  INVEST at mint: I — needs BL-620 landed (already built and past
  architect), no unbuilt sibling. N — fix shape is direction; six call sites
  or one wrapper is the implementer's call. V — one observable outcome: no
  reader is left believing an image was seen. E — one sitting, mutation_cost
  low (call-site wiring over an existing pure helper). S — 3 scenarios, 2
  invariants. T — every scenario is externally observable, with a live
  procedure above.

approval_context: >
  Two judgment calls worth a cheap veto. (1) The two DURABLE surfaces —
  an approvals rejection reason and a recert amend proposal — get the
  image-not-read note written into the stored record, not just echoed in
  chat. That means the note becomes part of a ticket's permanent history;
  say so if you would rather those two stay clean and carry the note only in
  the chat echo. (2) Control-topic command text is deliberately left
  unannotated because the text is parsed, not displayed, and a note would
  break the parse — scenario 03 locks that in. Firm, and inherited from
  BL-620's approved directive: no caption-derived words may reach any
  reader, human or agent, in a form that lets them believe the attached
  image was seen.
