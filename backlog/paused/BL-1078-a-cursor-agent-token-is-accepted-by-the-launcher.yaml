description: |
  ## What is wrong

  BL-713 proves a Cursor agent can complete one parcel through a spike CLI.
  Ordinary packs still cannot staff a window with cursor: swarmforge.sh's
  agent whitelist is `claude|codex|copilot|grok|aider|vibe|gemini` — no
  cursor token — and ensure / poke / wake have no Cursor ACP or SDK host
  process behind them.

  ## How (direction, not mandate)

  Accept a cursor agent token on the launcher whitelist. Wire ensure and
  poke/wake to the ACP or SDK host process that backs a Cursor seat,
  reusing the seat driver BL-713 landed. Replace the spike-only CLI as the
  ordinary launch path for pack windows that name cursor.

  Not in this slice: steward certify (BL-1079); pack lines and how-tos
  (BL-1080); changing /pilot.

