  1. `node specs/pipeline/cli.js specs/features/BL-1862-the-local-llm-comes-back-into-the-running-swarm.feature`:
     9 of 9 ok (01, two rows of 02, four rows of 03, 04, 05). Measured 0
     on main at mint: no handler exists yet.
  2. The lib's bb tests (BL-1861's and this one's): ALL PASS.
  3. Read-only on the live host: `nvidia-smi --query-gpu=memory.used,memory.total
     --format=csv,noheader` answers (13381 MiB, 16311 MiB at mint with the
     model loaded), so the live probe path is the one the scenarios stub.
  QA does not run add against the live swarm; the human runs the pair.

