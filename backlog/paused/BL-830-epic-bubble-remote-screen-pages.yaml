notes: |
  ## Consolidation record (BL-680)

  Three intakes in, four tickets out. One 1:1 (Pipeline -> BL-831), one 1:1
  (Health -> BL-832), and one 1:N split (Host thinking -> BL-833 feed + BL-834
  page) because the intake's own mint hint asked for it: "Likely epic + thin
  slice A (shell + one live source) rather than one fat ticket."

  Every operator directive quoted in the three source intakes survives verbatim
  in substance into the ticket that inherited it — the Pipeline intake's six
  locked decisions into BL-831, the Health intake's six into BL-832, and the
  Host-thinking intake's requested outcomes into BL-833/BL-834. No human
  sentence was dropped to make a merge fit.

  The fourth screen intake in that cluster,
  `INTAKE-bubble-live-screen-coordinator-resident.md`, is NOT in this epic: it
  is the same surface as BL-775 and was consolidated into it, with its steer
  directive routed to BL-569. Recording that here so the cluster's four-in /
  four-out arithmetic is walkable from either end.

  ## Priority

  85, below BL-824 (88) and BL-774 (86) deliberately. The architecture that
  determines how a screen ships, and the migration already in flight, both
  outrank new pages.
