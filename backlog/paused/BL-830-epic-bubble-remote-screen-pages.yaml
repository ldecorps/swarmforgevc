approval_context: >
  The technology question this epic used to be blocked on is already answered by
  the human, so nothing here re-opens it: "Remote HTML for all 4, and flip BL-775
  to remote" (2026-08-06). Every page in this epic is remote HTML in the UI
  bundle.

  What is worth the human's eye is the split, not the technology. Two of these
  screens (Pipeline, Health) render read models the bridge already computes and
  are close to packaging work. The third (Host thinking) is not: the host agent's
  progress lines exist but reach only Telegram today, so it needs a real bridge
  feed built first. It is split into BL-833 (the feed) and BL-834 (the page)
  rather than pretending it is the same size as its siblings.

  The one thing deliberately NOT specced here: a redaction pass over the
  host-agent feed. The intake asks for "the same redaction posture as other
  operator surfaces if one already exists" — verified 2026-08-06, no redaction
  helper exists in `extension/src`. BL-833 states that plainly rather than
  claiming a posture it would be inheriting from nothing.

description: |
  ## Why this epic exists

  Three of the four Bubble screen intakes the human drained on 2026-08-06 are
  not Live Screen (BL-774) and not the shell architecture (BL-824). They are new
  pages: the in-flight Pipeline board, a swarm Health/Trends view over a
  fortnight, and a live view of the host agent thinking. This epic tracks them
  as one family because they share a shape, a dependency and a discipline.

  **The shape.** Each is a page in the UI bundle BL-825 resolves and BL-829
  renders. None of them is native, and none of them changes the APK — which is
  the whole point of the human's 2026-08-06 ruling and of BL-824's locked
  decision that the APK changes only when the thin shell does.

  **The dependency.** All three depend on BL-829, the remote page host. Named
  explicitly, not assumed: a page in a bundle that nothing renders is a feature
  that ships green and stays dark.

  **The discipline.** Every figure and every cell these pages show is read from
  a computation the bridge already performs. None of these pages may grow a
  second metrics engine, a second board read model, or a second definition of
  what a stage is. Where the existing computation is missing something the page
  needs, the fix is to extend that computation once — never to derive a rival
  number in a page.

  ## Why these are Node-testable, and why that matters

  Because the human chose remote HTML, these pages are TypeScript and HTML on
  the bridge, not Kotlin on a device. Their acceptance contracts run in the Node
  acceptance runner today and sit in normal Stryker/jscpd/CRAP scope. That is a
  direct consequence of the ruling and it is worth stating: the same three
  screens specced native would have carried the degraded unit-test-gap fallback
  and a manual device procedure as their only real gate.

  What remains device surface is only the WebView render itself, which BL-829
  owns and verifies by recorded manual procedure. No page in this epic re-runs
  that verification.

  ## Local engineering rule 5

  Every page here is the LIVE surface: authenticated bridge endpoints, live
  swarm state. No page in this epic routes its data through the static
  `pwa/` projection.

remaining_slices:
  - "Slice E — Mini App overlap retirement: once Pipeline lands on Bubble, decide and execute what happens to the Mini App /pipeline-board route (redirect, deprecate, or remove behind a flag). The human said cutover can wait and dual-run is fine, so this is deliberately last."
  - "Slice F — window and layout controls: making the Health page's window user-selectable, and any per-page density or ordering preference the human asks for after living with the defaults."
  - "Slice G — Canary pass rate as a Health readout, once the Workflow Canary epic lands a pass-rate signal worth trending."

invariants:
  - "No page in this epic derives a number, a cell or a stage placement the bridge does not already compute: there is one computation per figure, and the page reads it."
  - "Every page degrades to an honest empty or unavailable state that names its reason; no page presents fabricated zeros, a stale view as current, or a perpetual spinner."

out_of_scope: |
  - The Live Screen page. That is BL-774 / BL-775, a separate epic with its own
    migration story.
  - The remote page host, the bundle resolver and the APK update path. BL-824's
    slices; this epic depends on them and must not re-open them.
  - Building a metrics warehouse or a long-term analytics store. The human
    explicitly put this out of scope on the Health intake.
  - Editing tickets, approving work, or driving Control verbs from any page in
    this epic. Those surfaces exist elsewhere and the intakes explicitly refuse
    to have them packed onto these pages.
  - Immediate deletion of any Mini App surface. Slice E, later, dual-run first.

