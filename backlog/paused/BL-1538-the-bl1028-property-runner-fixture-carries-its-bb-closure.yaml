description: |
  ## What is wrong

  `swarmforge/scripts/test/bl1028_promotion_refusal_property_runner.bb`
  fails on `main` (verified 2026-09-11 at `84067ea1ce`, exit 1):

  ```
  FAIL P0 (control: an accepted promotion really does commit in this fixture)
    exit=1 head-moved=false
  FAIL coverage: the generator reached :control-commit only 0 time(s), floor 1
  ```

  `make-fixture!` (lines 94-96) copies a hand list of five `.bb` files into
  the disposable root. `promotion_gates_lib.bb` has since gained three
  `load-file` edges the list was never updated for:

  | edge | landed | commit |
  |---|---|---|
  | `acceptance_pointer_gate_lib.bb` | 2026-08-25 | `ea14fa3039` (BL-626) |
  | `headroom_cap_raise_lib.bb` | 2026-08-25 | `798c6d630e` (BL-1128) |
  | `slice_size_envelope_gate_lib.bb` | 2026-08-27 | `392e2cbf89` (BL-634) |

  So the control promotion's `promotion_gates_cli.bb` dies at load
  (`FileNotFoundException ... acceptance_pointer_gate_lib.bb`, replicated in
  a scratch root with the same five files). The runner's OWN design is what
  surfaced it: P0 is a control that an accepted promotion really commits.
  Without it every refusal property P1-P3 passes vacuously, because a
  promotion that dies at load also produces no commit and leaves the index
  alone. That vacuity is the worse half, as in BL-1279 and BL-1496.

  BL-1496 owns the identical rot in the sibling shell fixture
  (`test_bl1028_promotion_obeys_integrity_refusal.sh`), but its census
  grepped `*.sh` only. And this runner could not have been enrolled in the
  closure guard even if someone had tried: `bbFixtureClosureGate.js` knows
  `module`, `vitest-module`, `shell-copy` and `shell-sandbox` - no kind can
  read what a bb-authored fixture copies.

  ## Census (the population, counted, not assumed)

  Evidence: `backlog/evidence/BL-1538-BL-1541-specifier-unowned-red-census-20260911.md`
  §1. `grep -ln 'promotion_gates\|promote_and_route_next'
  swarmforge/scripts/test/*.bb` returns 11 runners; `grep -ln fs/copy
  swarmforge/scripts/test/*.bb` returns 5. All 15 run on 2026-09-11: this
  runner is the only closure-rot red. bl998 and bl983 are red for unrelated
  causes and are owned by BL-1539 / BL-1541.

  ## What is wanted

  - The runner derives its copy set from the entry point it drives
    (`promotion_gates_cli.bb`) instead of hand-listing it, so tomorrow's
    `load-file` edge is picked up with no edit (scenarios 01, 03).
  - The derivation is pinned to a census and cannot pass over an empty or
    truncated set (scenario 02).
  - The closure guard can read a bb-authored fixture's effective copy set
    behaviourally, and this runner is enrolled (scenario 04).
  - The runner is green with `:control-commit` reached (scenario 05).
  - Documenter: no registered diagram depicts test-fixture wiring; the
    `docs/` change, if any, is the standing-suite note beside BL-1496's.
  - Register: after QA lands, `backlog/standing-reds.tsv` carries no row
    for this file and `bb swarmforge/scripts/standing_red_register_cli.bb .`
    reports it gone.

  ## How (direction, not mandate)

  `swarmforge/scripts/bb_load_closure_lib.bb` already ships
  `compute-closure` (BL-973) and is `load-file`-able from a runner the same
  way every lib here is; `bb_load_closure_cli.bb` is its CLI twin. Replace
  the `doseq [dep [...]]` with the closure of `promotion_gates_cli.bb`.
  `swarm_identity_lib.bb` and `daemon_cycle_guard_lib.bb` are in the
  closure today via `backlog_depth_lib.bb`, so nothing is lost. For the
  guard: a new `kind` (say `bb-copy`) whose effective list comes from
  RUNNING the runner with a print-the-copy-set flag into a scratch dir - the
  behavioural read the file's header comment insists on - is the smallest
  honest shape; a `BB_FIXTURE_CLOSURE`-style export has no bb analogue. The
  `bb_load_closure_agreement_test_runner.bb` (BL-897) already asserts the
  JS and bb closures agree; if you add an entry point there, keep it.

constraints: >
  Test-fixture and test-gate parcel only: no production line of
  promote_and_route_next.sh, promotion_gates_lib.bb, promotion_gates_cli.bb
  or any promotion gate changes; the other 14 runners in the census are not
  touched. bbFixtureClosureGate.js is shared with BL-1496 (paused) - the
  coordinator serialises the two; whichever lands second merges main and
  re-reads the FIXTURES map rather than replacing it. The runner's P0
  control and its coverage floors stay exactly as they are - they are what
  caught this.

out_of_scope: |
  - The sibling shell fixture `test_bl1028_promotion_obeys_integrity_refusal.sh`
    - owned by BL-1496.
  - Deriving the closure guard's MEMBERSHIP (which fixtures it watches)
    instead of hand-enumerating it - the root cause of every recurrence, still
    unowned, revisit once BL-1496 lands (its own out_of_scope names it).
  - The other four `fs/copy` bb runners: green today; enrolling them is the
    membership slice above.

qa_e2e_procedure: |
  1. Acceptance resolving all five scenarios of the feature file.
  2. `bb swarmforge/scripts/test/bl1028_promotion_refusal_property_runner.bb`
     exits 0, prints `ALL PROPERTIES HOLD`, and its coverage line shows
     `:control-commit 1` (or more). Run it twice - the second run must not
     depend on state the first left behind.
  3. Negative control, proving the derivation is live: in a scratch clone,
     add one new `load-file` line to `promotion_gates_lib.bb` pointing at a
     new sibling `.bb`, re-run the runner, and confirm the new file lands in
     the disposable root with no edit to the runner.
  4. `node -e` (or grep) on `specs/pipeline/steps/lib/bbFixtureClosureGate.js`
     shows `bl1028_promotion_refusal_property_runner.bb` among FIXTURES, and
     the closure guard run is green for it; then, in a scratch copy, make
     the runner drop one closure file from what it copies and confirm the
     guard names that file (the behavioural read is real).
  5. `bb swarmforge/scripts/standing_red_register_cli.bb .` reports no row
     for this file and `"unowned":[]`.

