description: |
  ## What is wrong

  - `/land`: when the batch's in-flight queue empties, the bridge asks
    "Land queue clear. Drain-stop the swarm now?". On yes,
    `telegramCursorBridgeLive.ts`'s `land-sleep` branch calls
    `writeOperatorBounceSentinel(repoRoot, 'swarm')` and replies "land:
    drain-stop requested (bounce sentinel written)". The swarm sentinel is
    a stop-and-relaunch request (`bouncer.ts`: Bounce = stop + launch),
    consumed only by a VS Code extension host. So a yes asks for a
    restart, and on a headless host it does nothing at all. /stop's drain
    mode, `executeStopMode(repoRoot, 'drain')`, already does what the
    question asks.
  - Stop & run: the `stop-and-run` branch calls `runOperatorStop`, which is
    `kill_all_swarm.sh`, the nuclear pipeline kill. BL-698's how-to says
    "(drain-stop, wait until clear, then pilot)". The reply prints the
    kill script's output and never names the mode.

  ## What is wanted

  - A yes to the land question runs /stop's drain mode through the same
    path /stop's Drain-stop button takes, and a no runs no stop. Neither
    answer writes the bounce sentinel.
  - Stop & run runs the mode the ruling picks (A: emergency, B: drain),
    and its reply names the mode that ran. With ruling A, the documenter
    corrects the how-to's `/pilot` line. With ruling B, the 90 s
    `awaitSwarmDrain` wait becomes the drain's own wait.

  ## How (direction, not mandate)

  - A handler `specs/pipeline/steps/bl2026BridgeStopAnswersSteps.js` drives
    the Live inbound handler (`handleInboundDecision`) with a fake context,
    the `mkCtx` pattern in `extension/test/telegramCursorBridgeLive.test.js`,
    on a mkdtemp root with a stub `kill_all_swarm.sh` that records it ran.
    Register steps with `defineScoped` under this feature's name (BL-1277).
    The outline validates `<answer>` and `<stop>` against explicit known
    values.
  - If the handler puts a fake `tmux` on PATH that names a server-creating
    subcommand, adopt `./lib/fixtureReaper` (`tmuxReaperGuard.test.js`).
    Run `npm test` before forwarding.
