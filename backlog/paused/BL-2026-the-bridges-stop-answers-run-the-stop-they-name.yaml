  A - Stop & run keeps the emergency stop, its reply says so, and the how-to line is corrected (recommended)
ruling_provenance: tapped
approval_context: >
  FIRM: a yes to the /land queue's "Drain-stop the swarm now?" runs /stop's
  drain mode (executeStopMode drain), and no stop answer writes the bounce
  sentinel. The ask is Stop & run. When /pilot meets a live swarm, its Stop
  & run button runs the emergency stop (kill_all_swarm.sh, then a 90 s wait
  for the swarm to clear, then the pilot). BL-698's spec and its living
  how-to both say drain-stop. Either the reply and the how-to say
  "emergency stop" (A), or the button drains first (B). The scenario holds
  under both, because the reply names whichever mode ran.
ruling_options:
  - A - Stop & run keeps the emergency stop, its reply says so, and the how-to line is corrected (recommended)
  - B - Stop & run drains first as BL-698 and the how-to say, then pilots once the pipeline is empty
ruling_tradeoffs:
  - Pros - the pilot starts within about a minute, which is what a pilot asked for now needs, and /stop already offers the drain to a principal who wants it before piloting. Cons - in-flight agent turns are killed mid-work. Recommended because the existing 90 s wait was written for a fast stop, and a drain belongs to /stop.
  - Pros - no in-flight work is lost, and the button keeps the meaning BL-698 gave it. Cons - the pilot waits until every parcel in flight is done, which can be hours, and the 90 s wait must become the drain's own timeout.

invariants:
