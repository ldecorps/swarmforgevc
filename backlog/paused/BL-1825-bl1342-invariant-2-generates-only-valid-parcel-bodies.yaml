description: |
  ## What is wrong

  Coder note 002234: `extension/test/bl1342CrashloopStampInvariants.property.test.js`
  invariant 2 ("a skipped parcel is left as found and re-evaluated later")
  failed with seed 429610160. Reproduced at mint (main 8ed4575574) by
  running that test from a scratch copy with the seed pinned: fails
  deterministically, counterexample `[" "]`, at "the once-skipped parcel
  was never re-evaluated".

  Cause: the property draws the vanishing parcel's body with
  `fc.string({ minLength: 1, maxLength: 40 })`, newlines mapped to spaces,
  so a draw can be whitespace only. The fixture's parcel has no message
  header, so its body IS the note. `handoff_lib.bb`'s `corrupt-handoff?`
  treats a blank body as a corrupt handoff (BL-365), and the second poll
  quarantines it instead of delivering it. The daemon is correct; the
  generator quantifies over parcels that are not valid. With `numRuns: 2`,
  the failure shows only on a rare seed, so the red is intermittent.

  ## What is wanted
  - Invariant 2's generator draws only bodies a valid parcel can carry
    (non-blank after trimming). How (direction, not mandate): a filter on
    the existing arbitrary, or a leading non-space character.
  - Everything else in the property stays: the fixture, the four "left as
    found" assertions, the re-evaluation assertion, `numRuns: 2`.

  ## Scope
  - `extension/test/bl1342CrashloopStampInvariants.property.test.js`,
    evidence.

