     green (3 of 3).
  2. Read the parcel's evidence: a seed-429610160 run of invariant 2 from a
     scratch copy (not committed) passes, and a sample of the new body
     arbitrary (1000 draws) holds no blank body.
  3. `node specs/pipeline/cli.js specs/features/BL-1342-swarm-stamp-handoffd-crashloop-hotfix-27d6ab8630.feature`:
     9 of 9 ok (as measured on main at mint).
  4. `git diff main...HEAD --name-only` names only the test file and
     evidence.
  5. After landing: REGISTER_ROW_RETIRED for this ticket's property row.

