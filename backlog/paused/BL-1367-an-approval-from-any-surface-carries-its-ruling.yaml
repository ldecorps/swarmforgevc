id: BL-1367
title: "The paused-pager Approve route cannot record a ruling: recordApprovalReply takes no ruling argument, so a ticket approved from the phone reads fully approved while the choice it posed is silently discarded"
milestone: M8
type: defect
severity: high
# high: a live fault in a decision path, not a cosmetic one. Nothing is
# corrupted, but the ticket reads APPROVED with its question unanswered, which
# is worse than an obvious failure - the next role cannot tell consent from a
# complete answer and builds on a guess. Demonstrated: BL-1309.
