description: |
  ## What is wrong

  QA note 003138 and evidence b8b7a3ab55: the property lane at load 11-14
  failed `BL-1650/BL-654 invariant 2: a landed stray is recorded` with
  `Error: Test timed out in 20000ms.` (test/bl1650LandStepPureEvidenceStray
  Invariants.property.test.js:177). Specifier on main, load 12.4: the file
  alone passes, invariant 2 in 10.8 s, invariant 1 in 2.5 s.

  Each of invariant 2's draws (shapes 1-3, runsPerCell(9, 3)) calls
  `buildStrayLandsFixture` (a fresh repository with an origin and
  commits) and then `runCli` (a full `bb land_step_cli.bb` run), about
  1.2 s per draw at that load.

  ## What is wanted
  - Invariant 2's per-draw decision is made without a fresh fixture and
    a fresh CLI process per draw: one fixture per shape (reset between
    draws), and the draws' land runs made in one bb process calling the
    lib the CLI wraps (BL-1663's pattern).
  - One draw per run still runs the real CLI and asserts its printed
    lines, so the CLI wiring stays covered.

  ## Scope
  - `extension/test/bl1650LandStepPureEvidenceStrayInvariants.property.test.js`
    (and a helper beside it if one is needed).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule), from `extension/`.
  1. `npx vitest run --config vitest.properties.config.mjs test/bl1650LandStepPureEvidenceStrayInvariants.property.test.js`:
     2 of 2; record invariant 2's duration and the host load - expect
     well under half of the 10.8 s measured at load 12.4.
  2. The floor audit: `git diff main...HEAD -- extension/test | grep -E
     '(numRuns|assertReachFloor|runsPerCell)'` - no value lowered.
  3. `node specs/pipeline/cli.js specs/features/BL-1650-the-land-step-lands-a-pure-evidence-closed-owner-stray-itself.feature`
     (from the repo root): all ok.
  4. After landing: REGISTER_ROW_RETIRED for this file's row; resume
     BL-1697's land.

