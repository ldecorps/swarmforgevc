  the defect.

  Hardening note: Babashka - no mutation/CRAP/DRY wired (BL-472
  deferred); hardening gates on the daemon wiring/unit suites and must
  record the degraded fallback. Test rules: env-seam timeouts, output
  to a file, never kill() of the test process, fixture tmux reaped by
  socket path.

approval_context: >
  The three-part shape (bound the waits + boundary logging + fix the
  identified wait) is how the ticket makes your "identify and fix the
  real wait" directive estimable in one parcel: parts 1-2 are the
  structural fix that both prevents silent stalls forever and names the
  culprit on its next occurrence; part 3 closes tonight's specific
  cause. Firm per your directive: no threshold-raise-as-fix. One thing
  to say the word on if you disagree: severity high (expedited) - the
  storm is live and degrading transport, though self-healing keeps the
  swarm functional.

