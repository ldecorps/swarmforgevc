id: BL-967
title: "handoffd restart storm recurrence: cycle 0 goes silent mid-chase-sweep past the 300s freshness threshold (~6-min kill/restart loop) - bound every in-cycle wait, make sweep boundaries self-localizing, and fix the real blocking wait"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 20
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-967-handoffd-cycle-stall-bounded-waits-and-sweep-boundaries.feature

invariants:
  - "No single subprocess or file-I/O wait inside the daemon's poll cycle can silently exceed the freshness threshold: every such wait carries a bound well under the threshold, and hitting the bound is logged and survived (the cycle continues or ends cleanly) - a wedged tmux/git/child process may cost one bounded wait, never the heartbeat."
  - "After a heavy cycle, the log alone localizes any stall to one sweep: each sweep in the heavy bundle emits a boundary line (sweep name + duration) even when it took no action, so 'last log line' always names the guilty sweep - at bounded volume (boundary lines on heavy cycles only, never the 1s idle ticks)."

description: >
  Severity rationale: high - a live, recurring fault degrading the handoff
  transport itself: the daemon is killed and restarted every ~6 minutes
  (30+ restarts since 20:38Z on 2026-08-19), costing handoff latency and
  chase freshness and spamming the operator Telegram topic. The cool-off/
  restart loop's self-healing is what keeps this below critical.

  Symptom (operator intake 2026-08-20 ~00:34 CEST, from Telegram
  screenshot; specifier re-verified live at ~00:05Z): repeated
  "FRESHNESS_VIOLATION restart daemon=handoffd age_secs=320-423
  threshold=300" alerts every ~6 minutes - each a kill+restart by
  daemon_log_freshness_check.sh (BL-675). The daemon process stays alive
  but its poll cycle goes silent past 300s with no end-of-cycle heartbeat.

  Stall signature - NOT the BL-902 shape (that was a silent
  briefing-email compose between lifecycle-snapshot-ensured and
  email-misconfigured). Tonight cycle 0 reaches the chase sweep, emits
  per-item actions, then nothing: the intake's capture ends at
  "chase-respawn QA"; the specifier's fresh capture (daemon 85s old, log
  25 lines) ends with a burst of SEVEN chase-wake-skip-busy QA lines
  within ~2.5s then one chase-wake-skip-busy coordinator, then silence.
  Both endpoints are per-item chase actions (the :skip branch logs at
  handoffd.bb:1455), so the block sits INSIDE or immediately AFTER the
  chase item loop - and every sweep that follows (claim-progress,
  auth-observe, unassigned-active, dispatch-gap, flow-watchdog, briefing,
  push-sweep, master-main-reconcile) logs only on events, so a healthy-
  but-later sweep is indistinguishable from a stalled one. A process
  sampler at filing time showed the main thread blocked in read/open
  syscalls - the BL-057 family (subprocess pipe wait), and the chase path
  is dense with unbounded tmux!/process/sh calls (capture-pane on every
  busy-gate, send-keys wake delivery, git rev-parse per worktree).

  Operator directive, verbatim from the intake: "Let specifier deal with
  that." and "Direction (not mandate): mint a defect. Identify which
  sweep blocks cycle 0 past 300s and fix the real wait - do not 'fix' by
  raising the threshold alone (BL-789 documented Mac cycles near 120-232s
  for slow-but-healthy work; this is silence with no end-of-cycle
  heartbeat). Consider whether BL-902's fix is incomplete, whether a new
  sweep regressed, or whether cycle-0's sweep bundle is simply too heavy
  for a 300s budget on this host."

  Fix wanted, three parts that together satisfy the directive: (1)
  bounded waits - every subprocess/file wait in the cycle path gets a
  timeout well under the freshness threshold, logged and survived on
  hit, so no single wedged call can ever again take the heartbeat past
  budget (this converts any future stall from a kill/restart into one
  logged, attributed timeout); (2) sweep-boundary observability - heavy
  cycles log each sweep's name and duration even when idle, so the next
  occurrence self-localizes instead of demanding another live hunt; (3)
  with those two in place, identify tonight's actual blocking wait from
  the first attributed timeout (or from the evidence paths below if it
  reproduces under a fixture) and fix that real wait. Record the
  identified cause in the parcel's evidence.

  How (direction, not mandate): babashka.process supports :timeout /
  destroy-on-timeout shapes, or wrap the shared tmux!/sh! helpers with a
  deadline so the bound lands at the chokepoint rather than per call
  site; the daemon wiring tests already override timeouts via env seams
  and redirect a backgrounded daemon's output to a file (engineering
  rules) - use those seams, never real timers in tests. The heavy-cycle
  boundary lines can ride the existing chase-sweep-every-cycles cadence.

constraints: >
  Out of scope / firm lines:

  - Raising the 300s handoffd threshold in daemon_log_freshness.conf as
    the fix, alone or primarily - the operator's directive forbids it;
    a threshold change is acceptable only as a documented consequence of
    measured healthy-cycle cost, alongside the real fix, never instead.
  - The freshness watchdog itself (daemon_log_freshness_check.sh, BL-675)
    - it is working as designed; only the daemon's cycle changes.
  - Retro-cleaning tonight's restart history or Telegram noise.
  - Redesigning sweep CONTENT (what chase/dispatch-gap/briefing decide) -
    only their wait-bounding and boundary logging change.

qa_e2e_procedure: >
  1. Fixture (no live daemon): through the daemon wiring test seams, run
     a cycle where one injected subprocess hangs past the bound - the
     cycle logs the attributed timeout, survives, and the end-of-cycle
     heartbeat lands within the threshold budget (scenario 01). Pre-fix
     this hangs the cycle silently.
  2. Fixture: a heavy cycle emits one boundary line per sweep with a
     duration, including sweeps that took no action (scenario 02); idle
     1s ticks add no boundary lines (scenario 03).
  3. Live soak (read-only observation): after the parcel lands and the
     daemon restarts on it, .swarmforge/daemon/freshness-incidents.log
     gains ZERO new handoffd restart entries over a 30-minute window
     while the swarm is active, and handoffd.log shows completed cycles
     with boundary lines. If a timeout IS hit live, its log line names
     the sweep and call - record it as the identified cause with the fix
     applied or a follow-on minted.
  4. Regression: BL-789's slow-but-healthy posture preserved - a cycle
     legitimately near 120-232s completes without any kill, timeout
     spam, or behavior change.

