description: |
  ## What is wrong

  QA note 003138 and evidence b8b7a3ab55
  (`backlog/evidence/BL-1697-unowned-red-hold-QA-20260924.md`): the unit
  suite, run by qa-gather at load 11-14, exited 1 on the per-file budget:
  `extension/test/bl1652HandoffdRespawnReadingsWiring.test.js: 13.4s
  exceeds the 7.0s per-file budget` (every test passing). Alone at load
  13.2: 7/7 in 9.6 s. Specifier on main, load 12.4: 8.0 s alone. QA timed
  a bare `load-file handoffd.bb` at 737-1140 ms under that load.

  The file's `loadHandoffdAndRun` (BL-1673 shape: form in a file, bb FILE
  invocation) is called once per case, so seven cases load handoffd.bb
  seven times. The confirmation measured it over budget alone, so this is
  a real pole at that load, not BL-1721's failed-confirmation case.

  ## What is wanted
  - One bb process per file run evaluates every case's form (for example
    one script printing one line of results per case, parsed by the
    cases), keeping each case's assertion and its failure message
    per-case.
  - The `role-lane-running?` cases still see their spawned lane process:
    it is started before the single bb run and stopped after it.

  ## How (direction, not mandate)
  - BL-1663's pattern for bl1474's property: build every case's form, run
    bb once in a `beforeAll`, and have each `test` read its own result.

  ## Scope
  - `extension/test/bl1652HandoffdRespawnReadingsWiring.test.js` only.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule), from `extension/`.
  1. `npx vitest run test/bl1652HandoffdRespawnReadingsWiring.test.js`:
     7 of 7; record its duration and the host load average beside it -
     expect under half of the 8.0 s measured alone at load 12.4.
  2. `node specs/pipeline/cli.js ../specs/features/BL-1652-the-chase-sweep-never-respawns-a-busy-role-and-respawns-at-most-once-per-sweep.feature`
     (from the repo root): all ok.
  3. The file's bb call site count: one `execFileSync('bb'` (or spawn) in
     the file, reached once per run.
  4. After landing: REGISTER_ROW_RETIRED for this file's row; resume
     BL-1697's land.

