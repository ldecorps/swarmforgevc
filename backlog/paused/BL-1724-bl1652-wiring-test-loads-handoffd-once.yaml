approval_context: >
  No new feature file. Minted approved under the 2026-09-17 operator
  hotfix (severity defect, no ruling_options). FIRM: every one of the
  file's seven cases keeps asserting what it asserts today against the
  real handoffd.bb; only the number of bb processes changes. FIRM: the
  probe form stays in a file, never on argv (BL-1673 - a form naming a
  fixture worktree on argv is seen by lane-running?'s own scan). FIRM: the
  7.0 s budget is unchanged and no suite-poles row is added.

invariants:
