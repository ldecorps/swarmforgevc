description: |
  ## What

  Retune `composePilotExpeditorPrompt` so Cursor `/pilot` optimizes output
  quality over speed, and treats bounce-backs to earlier pipeline roles as
  first-class (native-swarm spirit). Prompt must also say: human questions
  from any hat → Telegram poll on Cursor Remote.

  ## Source

  `.swarmforge/operator/INTAKE-pilot-quality-bounce-backs.md`

  Sibling intakes (do not expand this ticket into them):
  - INTAKE-pilot-telegram-status-posts.md
  - INTAKE-pilot-orphan-cleanup-stage-boundaries.md

  ## Scope (this ticket only)

  - `extension/src/tools/telegramCursorBridgePilot.ts` prompt contract
  - Unit tests on prompt composition (extend
    `extension/test/telegramCursorBridgePilot.test.js`)
  - Spec feature `specs/features/BL-699-pilot-quality-bounce-backs.feature`
  - How-to note as needed (documenter)

  Out of scope: structured Telegram status helpers, orphan cleanup, full poll
  API (prompt rule only here), changes to automated `/expedite`.

  ## Acceptance scenarios (specifier)

  - BL-699 pilot-quality-01 — quality over speed + evidence/gate discipline
  - BL-699 pilot-quality-02 — bounce-backs first-class with rationale; no papering over
  - BL-699 pilot-quality-03 — forbid rushing QA stamp
  - BL-699 pilot-quality-04 — Telegram poll required for human questions
  - BL-699 pilot-quality-05 — offline mode, no expedite_cli/claude -p, worktree
    isolation, expedite-lock gate unchanged

