approval_context: >
  New feature draft needs review. The judgement call worth your eye is the
  scope line: this fixes the SILENT part (a missing root becomes a refusal
  instead of the cwd) and deliberately does NOT try to detect "you passed a
  live root on purpose" — an explicit `.` or an explicit live path stays
  allowed, because a harness pointed at real state deliberately is a
  legitimate diagnostic. If you want the harness to refuse a root that
  looks live even when named explicitly, say so and that becomes a second,
  larger ticket. Also confirm severity: `medium` (needs an incorrect
  invocation to trigger, and the one live occurrence was caught and
  quarantined) rather than `high` (when it does trigger it writes into the
  live handoff transport).

source: |
  Hardender rule_proposal to specifier, 2026-08-14 (handoff
  50_20260814T012006Z_000124_from_hardender): "Never run a
  *_sweep_harness.bb w/o its fixture-root arg: bb fs/path silently drops a
  nil first segment, resolving relative to cwd - inside a live worktree
  this scans real mailboxes, not a fixture."

  Rationale as reported: "Ran dropped_parcel_sweep_harness.bb with no args
  hardening BL-719; it used this worktree as root, delivering 2 real notes
  into the live coordinator inbox for BL-871/BL-746. Quarantined before
  pickup."

  Accepted as a hardender rule in `dc85c6ba8` (the operator-discipline
  half). This ticket is the durable half: the guard the rule is currently
  standing in for.

notes: |
  Specifier probe, 2026-08-14 — the report is accurate and the hazard is
  wider than the one file it was found in:

  1. `(fs/path nil ".swarmforge" "roles.tsv")` returns the RELATIVE
     `".swarmforge/roles.tsv"` — verified directly under bb. No exception,
     no warning; the nil segment is simply dropped, so the whole sweep
     re-roots at the process cwd.
  2. `swarmforge/scripts/test/dispatch_gap_sweep_harness.bb:20` on `main`
     carries the identical unguarded `(def project-root (first
     *command-line-args*))`, and drives the same real `chase_sweep_lib.bb`
     decisions through the same real `swarm_handoff.bb` send path — so the
     reported incident is reproducible today, on `main`, in a file the
     original report never named.
  3. `swarmforge/scripts/test/commit_integrity_856_scenarios_cli.bb:22`
     has the same silent shape. It has no send path, so its failure mode is
     bogus results read off live state rather than parcel delivery — still
     in scope, lower stakes.
  4. `swarmforge/scripts/test/bl619_token_burn_briefing_harness.bb:28` and
     `commit_integrity_test_cli.bb:32` use `(nth *command-line-args* 0)`,
     which THROWS on a missing arg. They already fail loud and need no
     change — they are the shape the guarded harnesses should end up
     behaving like.
  5. `dropped_parcel_sweep_harness.bb` (the file in the incident) landed
     with BL-719 and is on `origin/main` (`2e5eac51b`) with the same silent
     `(first *command-line-args*)` shape and zero `System/exit`. It is
     unambiguously in scope and is armed in `required_wiring` below.
     Caveat for the implementer: it is NOT yet in the LOCAL `main` ref,
     which lags `origin/main` by 22 commits — see BL-891, filed from this
     same probe. Resolve the file against `origin/main` (or your own role
     branch, which has BL-719 merged), not against a stale local `main`.

invariants:
  - "No harness under swarmforge/scripts/test/ ever resolves its fixture root relative to the process working directory: an absent root is refused, never defaulted."
  - "A refused invocation is inert — it reads no mailbox, writes no state, and sends no handoff, so the filesystem is byte-identical before and after it."

required_wiring:
