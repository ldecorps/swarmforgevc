  - "swarmforge/scripts/test/dropped_parcel_sweep_harness.bb::System/exit::same mandated refusal in the harness the incident actually happened in; also zero System/exit occurrences today"

description: |
  ## What

  Several harnesses under `swarmforge/scripts/test/` take the fixture
  project root as a bare first positional argument
  (`(def project-root (first *command-line-args*))`) and then build every
  path from it with `babashka.fs/path`. `fs/path` silently drops a nil
  first segment, so omitting the argument does not error — it yields a
  relative path and re-roots the entire run at the process working
  directory. Run inside a live worktree, the harness reads the real
  `.swarmforge/` state.

  That is not a read-only accident. A sweep harness exists precisely to
  exercise the REAL mechanism — the same `chase_sweep_lib.bb` decisions
  through the same `swarm_handoff.bb` send path — so a cwd-rooted run
  decides against live tickets and DELIVERS live parcels into other roles'
  inboxes. This has happened once already (see `source:`).

  Make the missing argument a loud refusal: print a usage line naming the
  missing fixture root to standard error and exit non-zero via an explicit
  `System/exit`, before any mailbox read, state write, or handoff send.

  ## Why

  The hazard is currently held off by operator discipline alone — the
  hardender rule accepted in `dc85c6ba8` tells the role to always pass the
  root explicitly. That rule earns its place as a reading aid, but a guard
  clause removes the failure mode outright, and the same unguarded shape is
  already live on `main` in a harness the original report never named
  (`notes:` item 2). The cost of the fix is a few lines; the cost of the
  next occurrence is polluted live mailboxes plus the recipient's time
  working a parcel nobody sent.

  ## Scope

  Every harness under `swarmforge/scripts/test/` that binds a fixture root
  from a bare positional argument, as that set exists at implementation
  time. At spec time (2026-08-14) that is
  `dispatch_gap_sweep_harness.bb`, `dropped_parcel_sweep_harness.bb` and
  `commit_integrity_856_scenarios_cli.bb`. The two `(nth ... 0)` harnesses
  in `notes:` item 4 already throw and are out of scope. Resolve this set
  against `origin/main`, not the local `main` ref (see `notes:` item 5).

  Scenario 03 is the durable half: the check must ENUMERATE the harnesses
  it covers rather than carry a hardcoded list, so a harness added later
  with the same unguarded shape fails the check instead of shipping the
  hazard again.

  ## Constraints

  - Do NOT change what a correctly-invoked harness does. These harnesses
    deliberately drive the real send path against a fixture root; that
    posture is the point of them and stays exactly as it is.
  - Do NOT try to detect "this root looks live." An explicitly passed root
    — including `.` — remains allowed; a harness pointed at real state on
    purpose is a legitimate diagnostic. Only ABSENCE is refused.
  - Refuse via an explicit non-zero `System/exit`, not a bare uncaught
    throw, so the failure reads as a usage error rather than a crash.
  - Babashka has no mutation, CRAP or DRY tooling wired (BL-472 deferred).
    The hardening pass here is gated by the Babashka unit-test suite under
    `swarmforge/scripts/test/` alone, and must record that degraded
    fallback rather than imply mutation ran.

  ## QA end-to-end procedure

  From a scratch directory outside any worktree
  (`mkdir -p ./tmp/bl889-scratch && cd ./tmp/bl889-scratch`), run each
  in-scope harness with no arguments. Each must print a usage line naming
  the missing fixture root, exit non-zero, and leave the scratch directory
  with no `.swarmforge/` in it. Then run `dispatch_gap_sweep_harness.bb`
  against a fixture root with a seeded dispatch gap and confirm the nudge
  lands in the FIXTURE's coordinator inbox while the live repository's
  coordinator inbox is untouched (compare a `ls` of
  `.swarmforge/handoffs/coordinator/inbox/new/` before and after).
