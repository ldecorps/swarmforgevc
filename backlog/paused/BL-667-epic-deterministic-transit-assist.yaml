description: |
  Deterministic assist, LLM keeps the judgement: scripts do the transit
  steps that are pure choreography; anything needing judgement (conflicts,
  red suites, bounce merges) surfaces to the role annotated, unapplied.

  The operator's transcript prototype (see BL-664's source) shows raw git
  is ~4% of seat time — the yield is ELIMINATED TURNS (each wrapped in
  boot+read overhead), not seconds saved per command. Sequencing is
  therefore: BL-664 profiler first; its measured turn-overhead and
  mechanical share size and order the remaining slices before they are
  specced. Before/after rides the COST experiment log.

  Shared guards for every slice (the week's scars): worktree state moves
  via GIT ONLY, never cp -R (BL-373); refuse dirty worktrees
  (operator-tunnel/QA-live-work contamination); never stash-pop; target
  worktrees computed from roles.tsv — structurally eliminating the cd-habit
  class behind the BL-590 main contamination.
mutation_cost: low
