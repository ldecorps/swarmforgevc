description: |
  Deterministic assist, LLM keeps the judgement: scripts do the transit
  steps that are pure choreography; anything needing judgement (conflicts,
  red suites, bounce merges) surfaces to the role annotated, unapplied.

  The operator's transcript prototype (see BL-664's source) shows raw git
  is ~4% of seat time — the yield is ELIMINATED TURNS (each wrapped in
  boot+read overhead), not seconds saved per command. Sequencing is
  therefore: BL-664 profiler first; its measured turn-overhead and
  mechanical share size and order the remaining slices before they are
  specced. Before/after rides the COST experiment log.

  Shared guards for every slice (the week's scars): worktree state moves
  via GIT ONLY, never cp -R (BL-373); refuse dirty worktrees
  (operator-tunnel/QA-live-work contamination); never stash-pop; target
  worktrees computed from roles.tsv — structurally eliminating the cd-habit
  class behind the BL-590 main contamination.
mutation_cost: low

notes: |
  ## Sweep of repeatable agentic work, 2026-09-03 (operator-directed)

  Directive: "make the rounds and collect opportunities across the board to
  turn agentic repeatable tasks into deterministic scripts wherever possible."

  Method: classify every non-merge commit over 45 days by whether all its paths
  sit in one area, then check each repeated ritual against the existing tool
  inventory. 12903 non-merge commits; 81% are single-purpose.

  ### Ranked gaps (ritual performed by hand, no tool)

  | # | Ritual | Volume / 45d | Tooling today | Status |
  |---|---|---|---|---|
  | 1 | Pass and bounce evidence file | 2182 commits (16.9%) | gate only, hardened 3x | **BL-1362** |
  | 2 | Ceremony handoff sends | ~2 per ticket | none | **BL-1360** |
  | 3 | Ticket close and bookkeeping | 409 commits | promote scripted, close not | **BL-1363** |
  | 4 | Post-QA merge-up | 5 turns per landing | BL-668, near-inert | **BL-1361** + pre-merge |
  | 5 | QA land sequence | ~1 per ticket | primitives only, no whole-land mode | **BL-1366** |
  | 6 | Per-pass orphan check | 326 evidence files | daemon sweep libs only, no per-pass CLI | **BL-1370** |

  ### Already deterministic - do NOT propose these again

  - Promotion and routing - `promote_and_route_next.sh` (484 generated commits).
  - `backlog/topics/` records - `extension/src/concierge/blTopicStore.ts`
    (2228 uniform commits).
  - `human_approval` recording - the bridge and front-desk bot write it on the
    human's tap (295 commits).
  - Daily briefings - generated (882 commits).

  ### Opportunity 5: the QA land sequence - UNBLOCKED and filed as BL-1366

  `land_main_publish.sh` exposes `--acquire-lock`, `--decide-only` and
  `--release-lock` but has no mode that performs a whole land; its own header
  states the caller protocol nothing implements. QA orchestrates the five steps
  by hand after every approval.

  Held back at sweep time because BL-1354 was ACTIVE and changing what the
  entanglement verdict concludes. **BL-1354 landed the same day**, and QA
  reported the resulting contract by `note`: the landed-sibling verdict is
  **per-ticket, not per-path** - a sibling is judged on its own attributed
  lines, merge commits excluded. That is the contract worth wrapping, so the
  slice was filed as **BL-1366** on 2026-09-03.

  ### Opportunity 6, added 2026-09-03 by the operator: the per-pass orphan check

  Found by the operator watching a QA pane run `sleep 15; ps -o pid,pgid,etimes,cmd`
  mid-pass, not by the commit sweep - and that is the methodological lesson.
  This ritual leaves NO commit, so counting commits could never have surfaced
  it. 326 evidence files record an orphan check in a dozen different hand-written
  phrasings; every orphan mechanism in the repo is a daemon sweep library with
  no entry point for a role's own pass. Minted as BL-1370.

  **The sweep's method has a known blind spot because of this.** Commit volume
  misses every ritual that produces no commit - the orphan check, the ceremony
  sends (BL-1360, found from a screenshot), the land sequence. BL-1364's
  mechanical-share trend is the signal that would see them, which is a second
  argument for wiring it.

  ### The pattern behind all six

  This swarm reliably builds the ENFORCEMENT for a ritual and leaves the
  PERFORMANCE of it to an LLM turn. Evidence has a gate hardened three times
  and no writer; the handoff draft has six send-time gates and no composer;
  closing has an integrity CLI and no caller. Where both halves exist -
  promotion - the ritual costs no agent turn at all and drifts nowhere.

  ### Third instance of a related failure, found while sweeping

  `buildTurnProfileSeries` (BL-664, the profiler this epic named as the
  measurement that would size its own slices) has ZERO production importers.
  BL-668 shipped and is near-inert; BL-664 shipped and is unwired. Both are the
  BL-1235 shape - a mechanism built, gated, landed, and reachable by nothing.
  It is why BL-668's ineffectiveness went a week without notice, and why this
  sweep had to be done by hand off git history instead of read off a trend.
