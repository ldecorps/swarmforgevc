remaining_slices: |
  - BL-668 (filed): post-QA deterministic branch sweep — fast-forward every
    clean role branch to main after a landing; kills the trickle-all-night
    merge-up broadcast turns (5 turns per landed ticket).
  - Delivery-time pre-merge (unfiled — size with BL-664 data first):
    handoffd delivery attempts the merge in the RECIPIENT's worktree
    (computed from roles.tsv, never a cd habit) + compile/unit smoke;
    parcel arrives annotated "pre-merged <sha>, suite green" or "conflict
    in <files>" with the merge unapplied. Guards non-negotiable: the
    merge-drops-fix trap means pre-merge NEVER absolves re-running tests
    on bounce merges; refuses dirty worktrees; git-only state moves.
