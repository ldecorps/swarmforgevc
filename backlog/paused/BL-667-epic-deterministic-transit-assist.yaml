remaining_slices: |
  - BL-668 (LANDED, and it did not work): post-QA deterministic branch sweep.
    Shipped and running on the handoffd cadence, but measured 2026-09-03 across
    the daemon logs at 125 surfacings against 3 fast-forwards. Its ff-only
    contract meets the normal state of a role branch - carrying its own commits
    ahead of origin/main - so a fast-forward is impossible by definition and the
    five merge-up turns per landing are still being spent. Do not count this
    slice as delivering its intent.
  - BL-1360 (filed 2026-09-03): handoff tail command, send half - the merge-up
    broadcast, the bookkeeping note and the spec-ready note are composed from
    one definition instead of hand-written, re-checked against the protocol and
    character-counted every time. This is the "handoff tail command (unfiled -
    smallest)" slice below, now filed.
  - BL-1361 (filed 2026-09-03): the post-QA sweep tells the roles it could not
    settle. BL-668 surfaces by writing a log line nobody reads; this makes its
    verdict visible, which is also what makes the pre-merge slice's before/after
    measurable.
  - BL-1362 (filed 2026-09-03): a review pass records its evidence by tool.
    Highest-volume gap in the sweep - 2182 of 12903 non-merge commits in 45 days
    carry nothing but a hand-written evidence file, against a gate hardened three
    times with no writer behind it.
  - BL-1363 (filed 2026-09-03): closing a ticket is one command, the mirror of
    promote_and_route_next.sh. 409 hand-made close commits against 484 generated
    promotion commits, and a done area split 665 loose against 516 in milestone
    directories.
  - Delivery-time pre-merge (STILL UNFILED - now the highest-value child, and
    BL-664 has landed so the sizing gate this epic set is satisfied): handoffd
    delivery attempts the merge in the RECIPIENT's worktree (computed from
    roles.tsv, never a cd habit) + compile/unit smoke; parcel arrives annotated
    "pre-merged <sha>, suite green" or "conflict in <files>" with the merge
    unapplied. Guards non-negotiable: the merge-drops-fix trap means pre-merge
    NEVER absolves re-running tests on bounce merges; refuses dirty worktrees;
    git-only state moves. BL-1361's measurement is the argument for it: the
    ff-only sweep cannot reach 97% of cases and a real merge in a clean
    worktree is what can.
  - Commit half of "commit and hand off" (unfiled): commit --only <declared
    paths> before the send. Split out of BL-1360 deliberately - staging on an
    agent's behalf in a shared checkout is where BL-506 ticket-scope discipline
    lives and it needs its own guards.

