  INVEST at mint: Independent in code (BL-432 landed) with one data
  dependency declared honestly (BL-1428's CLI; a stub reading the TSV
  directly is NOT an acceptable substitute, invariant 1 of BL-1428),
  Negotiable (module shape and conf reader are direction), Valuable (one
