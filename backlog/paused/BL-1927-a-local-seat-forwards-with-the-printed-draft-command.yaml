source: |
  Root intake backlog/archive/INTAKE-coder2-tool-calls-20261003.md. The
  human, via Cursor, 2026-10-03, verbatim (Article 5.3):

  > I want to ascertain whether or not coder 2.5 can run tools.
  > Can we start the swarm with coder2 seat and have the swarm dedicated to make it work. Kind of like dogfood local llm swarm.
  > Feel free to reprioritize the local llm tickets in front of qa landing rewrite for this exercise.

  and, ~10:18 BST:

  > In fact, it might be more efficient to remove the anthropic coder and leave it all to coder2.5.
  > Have the swarm observe, raise high severity defect, have specifier implementing them, repeat, until the point where coder2.5 is capable of working.

  Observation 10 (coordinator note 015895, 12:01Z: "coder stall BL-1916:
  fake handoff_done file, no real forward"). Session 79269ebf (11:56Z): the
  coder committed with `git add .`, ran `git handoff next` twice, then wrote
  .swarmforge/handoffs/outbox/handoff_done/BL-1916.handoff_done reading
  "Task BL-1916 has been handed off to the next role." Session 42df14c2
  (12:01Z) ran ./swarmforge/scripts/git_handoff.sh, which does not exist.
  Neither session read its card.

description: |
  ## Status: two hotfixes landed the fix

  This parcel is their stamp-off: review them, do not re-apply them.

  ## What was wrong

  - The served text's step 3 was "Commit, git_handoff to the next role, then
    done_with_current / ready_for_next." A local seat reads git_handoff as a
    command: `git handoff next`, then a script named git_handoff.sh.
  - RESUME_NOTE ("Run ./swarmforge/scripts/ready_for_next.sh as your very
    first action, before reading or doing anything else") came before the
    qwen kickoff's "Use read_file now to read <card>". The seat obeyed the
    first sentence and never read its card, where the five-line draft
    example (5a89725e03) lives. handoffd respawns the seat often, so most of
    its sessions start this way. Replayed: run_shell_command
    ready_for_next.sh 3 of 3.

  ## What the hotfixes changed

  - aec0daba54, handoff_lib.bb: forward-draft-command builds one shell
    command that writes tmp/handoff.txt (type git_handoff, to the next
    stage, priority 50 for the coder and 00 otherwise, task, commit = first
    10 characters of HEAD). In task mode, with a next stage, print-task's
    steps become: 3) commit only your paths, never `git add .`, message
    ending `By <stage>.`; 4) that command, then swarm_handoff.sh
    tmp/handoff.txt, with "git_handoff is the draft's type, not a git
    command" and the AUDIT_REQUIRED answer; 5) done_with_current.sh.
    ready_for_next_task.bb passes the stage after this role's in the served
    ticket's required_stages (required_stages_lib, the resolver
    swarm_handoff routes by).
  - e2e2287822, swarmforge.sh: the resume check also sets
    LOCAL_RESUME_NOTE, and the qwen launch line puts it AFTER the card
    instruction. Replayed: read_file on the card 3 of 3. The live coder.sh
    was patched to the same lines.

  ## What each stage checks

  - Coder: both hotfixes against the description and both invariants; the
    new cases in handoff_lib_test_runner.bb (the command, run in a fixture
    repo, writes the five lines with HEAD's 10 characters);
    test_resume_on_start.sh. Evidence: backlog/evidence/BL-1927-coder-<date>.md.

qa_e2e_procedure: |
  1. `bb swarmforge/scripts/test/handoff_lib_test_runner.bb` ends "ALL TESTS PASSED".
  2. `bash swarmforge/scripts/test/test_resume_on_start.sh` ends "ALL PASS".
  3. `node specs/pipeline/cli.js specs/features/BL-1871-a-role-takes-up-a-ticket-on-its-own-line.feature`
     passes (measured at mint on HEAD e2e2287822: 9 of 9 ok).
  4. `node specs/pipeline/cli.js specs/features/BL-1052-a-role-seat-can-be-staffed-by-a-downloaded-local-model.feature`
     passes (measured at mint on HEAD e2e2287822: 9 of 9 ok).
  5. In the coder seat's qwen transcripts after 2026-10-03 12:08:06Z (its
     respawn onto this code), its first tool call in each session is
     read_file on its card, and no call runs `git handoff` or git_handoff.sh.

