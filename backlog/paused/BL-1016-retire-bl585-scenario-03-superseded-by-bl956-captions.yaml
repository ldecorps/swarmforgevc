id: BL-1016
title: "main is RED: BL-585 scenario 03 still asserts the epic-in-caption behaviour BL-956 deliberately removed - 2 of 14 failing on main today, masked until BL-979's pivot was reverted"
milestone: M8
type: defect
severity: high
status: todo
epic: pipeline-board
priority: 10
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-585-pipeline-board-ticket-column-matrix.feature

invariants:
  - "Retirement never removes the last assertion of a live behaviour: every behaviour the retired scenario asserted that the code STILL has is covered by a named surviving scenario elsewhere, identified before the deletion, not assumed."
  - "No orphaned handler: retiring a scenario removes every step handler it alone used, and leaves no handler registered that no feature file references."
  - "The narrative is part of the contract: no sentence in the touched Feature: block survives stating a behaviour the code no longer has - a durable contract carrying a false sentence is still a lie, executable or not."

description: >
  WHAT. Retire BL-585 scenario 03 ("the epic prints as a per-ticket caption
  under the matrix"), remove the two step handlers it alone used, and re-tense
  the BL-585 Feature narrative sentence that still promises epic captions.
  RETIRE, do not reword - the successor coverage already exists (see below).

  MAIN IS RED RIGHT NOW. Verified independently by the specifier on 2026-08-21,
  not taken from the report: `node specs/pipeline/cli.js
  specs/features/BL-585-pipeline-board-ticket-column-matrix.feature` on a clean
  `main` gives `# pass 12 / # fail 2` of 14. Both failures are scenario 03's
  two Examples rows.

  WHY IT IS RED. BL-956 (landed on `main`) moved the grid caption from the
  ticket's EPIC to its TITLE. Its own code comment says so in as many words -
  pipelineBoard.ts:656, "the caption carries the full ticket TITLE (the human's
  hotfix - the epic moved out of this line when captions became per-ticket)" -
  and `gridCaptionLine` now reads `row.title ?? row.slug ??
  NO_BACKLOG_ENTRY_LABEL`, never `row.epic`. BL-585 scenario 03 was never
  retired, so it still expects `537 swarm-reliability` and `537 (no epic)`
  from a fixture row carrying an epic, no title and an empty slug. On the
  shipped code that row's caption is `537 (no backlog entry)` for BOTH rows.

  WHY NOBODY NOTICED. Nothing ran BL-585's suite at BL-956's own tip. Then
  BL-979's pivot rewrote this same feature file wholesale for an unrelated
  layout change, coincidentally replacing the stale scenario and MASKING the
  red. Reverting BL-979 (required to clear BL-986's contamination, per
  BL-490/BL-495) removed the mask, not the defect. This is the third recorded
  instance of the BL-1006 family - a stale assertion outliving the behaviour it
  pins, going red when a successor ships, and surfacing later as a false red on
  an unrelated parcel.

  THIS IS NOT AN OPEN PRODUCT CALL. The architect's evidence flagged
  epic-vs-title as "a product call, flagging rather than picking" - the correct
  caution for their stage. Resolved at spec time: the human already picked, in
  BL-956, which the code comment records as "the human's hotfix". Captions
  carry the title. Nothing here needs a fresh decision.

  SUCCESSOR COVERAGE, named so invariant 1 is checkable before the deletion:
  BL-956 scenario 01 ("A grid caption identifies its ticket by title, not by
  epic") pins the positive behaviour AND the negative ("no caption line reads
  '1 concerto'"). BL-956 scenario 02 ("A grid row with no backlog entry still
  identifies itself") covers the entry-less row. Between them every live
  behaviour scenario 03 touched is already asserted. Deleting it removes no
  coverage - which is exactly why this is a retirement and not a rewrite.

  SCOPE, precisely three edits:
  1. Delete scenario 03's Scenario Outline and its Examples table from
     specs/features/BL-585-pipeline-board-ticket-column-matrix.feature.
  2. Delete the two handlers in
     specs/pipeline/steps/bl585PipelineBoardTicketColumnMatrixSteps.js that
     scenario 03 alone used - `/^active ticket BL-537 whose epic is (.+)$/`
     (~line 145) and `/^the caption line "(.+)" appears below the matrix$/`
     (~line 155). Grep-verified at spec time: "appears below the matrix" occurs
     in NO other feature file. "whose epic is" also appears in BL-854's feature,
     but that handler's pattern is anchored on the literal "active ticket
     BL-537" and cannot match it - re-verify before deleting.
  3. Re-tense the Feature narrative sentence "The epic stops being a section
     heading and becomes a short caption line under the matrix, one per visible
     ticket column." It states a false present.

  WHY NO required_wiring. This ticket's deliverable is a DELETION. The pre-QA
  wiring gate checks that a pattern is PRESENT at the parcel commit, so it
  cannot express "this is gone" and declaring one would arm a gate against the
  wrong thing. Deliberate omission, not an oversight.

qa_e2e_procedure: >
  1. On the parcel tip run `node specs/pipeline/cli.js
     specs/features/BL-585-pipeline-board-ticket-column-matrix.feature` and
     confirm every remaining scenario passes with zero failures (12 of 12 after
     the two Examples rows are retired).
  2. Confirm the same command on `main` BEFORE the merge still shows 2 failures
     - i.e. that this parcel is what turns it green, and the red was real.
  3. Run BL-956's own feature and confirm it is unchanged and still green - the
     successor coverage must survive untouched.
  4. Grep every .feature file for "appears below the matrix" and for "active
     ticket BL-537 whose epic is" and confirm zero hits remain anywhere.
  5. Run the full acceptance suite and confirm no scenario now lacks a handler -
     specs/pipeline/runtime.js THROWS on a missing handler, so an over-deletion
     fails loudly here rather than silently.
  6. Read the BL-585 Feature narrative and confirm no sentence still promises
     the epic appears in a caption.

source:
  - "architect note to specifier + coordinator, 2026-08-21 12:00Z, priority 00: 'BL-956 broke BL-585 sc03 caption on main - evidence filed, needs ticket'. Evidence: backlog/evidence/BL-956-vs-BL-585-caption-mismatch-discovered-20260821.md, authored by the architect while actioning QA's BL-986 bounce. Not yet on main at ticket-writing time - read it with `git show 37c34cfa5:backlog/evidence/BL-956-vs-BL-585-caption-mismatch-discovered-20260821.md`."

notes: |
  2026-08-21 specifier: filed from the architect's note. The architect handled
  this exactly right - saw a correctness defect outside both parcels in front of
  them, did not hand-patch it inline, filed durable evidence, and routed it for
  ticketing rather than treating it as a rule_proposal.

  Every claim in that evidence file was re-verified independently before this
  ticket was written, per "a peer's claim must be re-run":
  - BL-979's pivot 89fc90eee is NOT an ancestor of main (so main carries the
    pre-pivot files, and the red is live on main rather than a branch artifact).
  - gridCaptionLine on main reads title/slug/NO_BACKLOG_ENTRY_LABEL, never epic.
  - NO_EPIC_LABEL still exists at pipelineBoard.ts:177 but is used only for sort
    grouping at :279, never for a caption - so scenario 03's "537 (no epic)"
    expectation is stale too, not just the epic-name row.
  - The acceptance run reproduces 12 pass / 2 fail on a clean main.

  ACCEPTANCE POINTER IS DELIBERATE. `acceptance:` points at BL-585's OWN feature
  file - the contract this ticket repairs - rather than a new one. There is no
  new behaviour to pin: BL-956 scenarios 01/02 already pin it, and writing fresh
  Gherkin here would duplicate that coverage, which is precisely what the
  retire-never-reword rule forbids. The acceptance signal is that existing file
  passing green.

  Related in-flight, do not conflate: BL-979 (the pivot, bounced, its un-reverted
  commit contaminated branches and is being cleared) and BL-986 (QA bounce whose
  clearing surfaced this). Neither is at fault here and neither needs to land
  first - this defect pre-dates both on main and is independently fixable.
