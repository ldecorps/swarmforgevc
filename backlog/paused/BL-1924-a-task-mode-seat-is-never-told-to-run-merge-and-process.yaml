  human, via Cursor, 2026-10-03, verbatim (Article 5.3):

  > I want to ascertain whether or not coder 2.5 can run tools.
  > Can we start the swarm with coder2 seat and have the swarm dedicated to make it work. Kind of like dogfood local llm swarm.
  > Feel free to reprioritize the local llm tickets in front of qa landing rewrite for this exercise.

  and, ~10:18 BST:

  > In fact, it might be more efficient to remove the anthropic coder and leave it all to coder2.5.
  > Have the swarm observe, raise high severity defect, have specifier implementing them, repeat, until the point where coder2.5 is capable of working.

  Observation 7 (specifier, 2026-10-03 11:25-11:34Z): the coder's take-up
  succeeded ("PARCEL_LINE: moved swarmforge-coder onto 59a376845a"), then
  it ran merge_and_process as a shell command (exit 127), globbed
  swarmforge/scripts for *merge*, chmod +x'd land_merge_path.bb, ran it
  three times with guessed arguments, and opened it in nano.

  Folded in 2026-10-04 with hotfix 92f53eee1b. The human, asking the
  specifier about the iq3 coder's pane, 2026-10-04, verbatim (Article 5.3):

  > is there a ticket for this? this compression is probably not a good sign is it?

description: |
  ## Status: hotfixes 4b0e9adb96 and 92f53eee1b landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  BL-1871 made the task helper move a role's worktree onto the parcel
  before printing it, but handoff_lib.bb's print-task still printed "1)
  Execute the PAYLOAD (merge_and_process ...) in this worktree." for every
  git_handoff. A Claude seat knows from its prompt that this is not a
  command. A local seat runs it, gets exit 127, then looks for a script
  that merges. And when the take-up was refused, PARCEL_LINE said "Commit
  or restore them and ask again" while the ACTION block below it said "Do
  NOT run ready_for_next.sh again until you finish it".

  ## What the hotfix changed

  - parcel_line_lib.bb: take-up! returns its outcome (:stay, :moved,
    :refused; nil when the intent asks for no move). The lines it prints
    are unchanged.
  - ready_for_next_task.bb: both print sites pass {:task-mode? true
    :take-up <outcome>} to print-task.
  - handoff_lib.bb: print-task gains that arity. In task mode step 1 says
    ready_for_next.sh already put the worktree on the parcel's line, that
    there is nothing to merge, and that merge_and_process is not a shell
    command. After a refused take-up the ACTION says the parcel was NOT
    taken up, to fix what PARCEL_LINE names and run ready_for_next.sh
    again, and no work or done_with_current steps follow it. The batch
    helper's one-arity call prints today's text, since a batch seat merges.

  ## Second hotfix (92f53eee1b): a reverse copy gets no work

  print-task gave a task-mode non-forwarding git_handoff (Article 2.4) the
  same steps as a forward parcel: "2) Read <ticket> ... then implement
  it" and "4) Forward it to <next stage>". Since BL-1871 a reverse copy
  carries no work in task mode and is never taken up, so the seat stays
  on its current line. On 2026-10-04 the iq3 coder, served the
  architect's reverse copy of BL-1851 (22aab9b028) at 06:07Z, rebuilt
  that already-shipped ticket from scratch on BL-1858's line, where none
  of its code exists. qwen compacted 15 times before the 07:18Z session
  end and 7 more in the first 22 minutes after the 08:28Z relaunch. The
  last three summaries were byte-identical, no file was written, and
  QA's real BL-1851 bounce (d0d925e71b) waited in the inbox behind it.
  The four reference files the seat kept re-reading (about 8.5k tokens)
  do not fit beside its prompt floor under qwen's 27852-token trigger,
  so each compaction dropped them and the seat read them again.

  The hotfix: in task mode a reverse copy prints one step, run
  done_with_current.sh (which completes a non-forwarding parcel with no
  reason, BL-1609), and says to ignore the payload's merge_and_process
  and replay lines. Forward parcels print as before. The batch helper's
  one-arity call also prints as before, since a batch seat still merges
  a reverse copy.

  ## What each stage checks

  - Coder: the change against the description and both invariants, and
    the new cases in handoff_lib_test_runner.bb and
    parcel_line_lib_test_runner.bb, including the 2026-10-04 reverse-copy
    block (it fails six ways against the pre-92f53eee1b lib). Evidence:
    backlog/evidence/BL-1924-coder-<date>.md.
  - Documenter: docs/how-to/BL-1871-parcel-line-take-up.md shows the
    PARCEL_LINE lines but not the ACTION text served under them; add what
    a task-mode seat is told after a move, a stay, and a refusal, and for
    a reverse copy (92f53eee1b), including
    step 2's named ticket file (e69b66a68d, reviewed under BL-1925) and
    steps 3 to 5's printed forward command (aec0daba54, reviewed under
    BL-1927); both of those tickets leave their documentation to this pass.

qa_e2e_procedure: |
  1. `bb swarmforge/scripts/test/handoff_lib_test_runner.bb` ends "ALL TESTS PASSED".
  2. `bb swarmforge/scripts/test/parcel_line_lib_test_runner.bb` ends "ALL PASS: parcel_line_lib.bb".
  3. `node specs/pipeline/cli.js specs/features/BL-1871-a-role-takes-up-a-ticket-on-its-own-line.feature`
     passes (measured at mint on HEAD 4b0e9adb96: 9 of 9 ok; re-measured
     2026-10-04 on HEAD 92f53eee1b: 9 of 9 ok).
  4. In the coder seat's qwen transcript after 2026-10-03 11:34:49Z (its
     respawn onto this code), no run_shell_command runs merge_and_process
     or land_merge_path.bb.
  5. The first reverse copy (non-forwarding: true) served to the coder seat
     on a line that holds 92f53eee1b: its qwen transcript shows
     done_with_current.sh run with no read_file of that ticket's YAML, no
     commit and no swarm_handoff before it. Read-only; if none has been
     served by the time QA runs, record it as not yet observed.

