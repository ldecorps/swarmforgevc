  E2E QA procedure: on the fix commit run
  `bb swarmforge/scripts/test/prompt_engine_test_runner.bb` — expect
  "ALL PASS" and a printed "stable-prefix chars:" value at or under 42000;
  run the acceptance suite and confirm this ticket's feature, BL-858's, and
  BL-618's are ALL green (BL-858's `headroom-budget-02` un-reds as a side
  effect of the trim — it is a live budget assertion, and its going green
  is the point of the parcel); sample two moved passages and confirm each
  is findable verbatim under `articles/reference/` with its slim article
  still pointing there; boot one role via its launch script and confirm the
  slim articles still arrive in the system prefix.

  Sequencing with BL-859 (active, in flight): prefer landing BL-883 first
  so BL-859's real-tree e2e check ("gate exits 0 on an under-budget tree")
  is runnable as written. If BL-859 reaches QA first, its gate exiting
  NON-zero against the real 46947-char tree is the gate's CORRECT verdict,
  not a defect — BL-859's notes carry a 2026-08-12 amendment saying
  exactly this; do not bounce BL-859 for it.

  Interim practice until BL-859 lands: the specifier runs the bb runner
  before committing any boot-inlined article change and refuses to land an
  amendment that pushes the prefix over 44000 without moving equivalent
  prose out in the same commit. This is BL-859's rule adopted as manual
  discipline ahead of its gate; it does not change BL-859's scope.

  Adjacent, deliberately not merged: BL-640 (paused) covers reference/
  amendments not reaching roles' stale worktrees; this parcel widens its
  blast radius but does not cause or fix it. The constitution/prompt files
  are specifier-owned surface: the specifier reviews the choice of moved
  passages at the QA-evidence stage if disputed, but the mechanical move
  rides the normal pipeline under the acceptance contract (BL-858
  precedent).

