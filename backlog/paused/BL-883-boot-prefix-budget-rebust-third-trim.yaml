  runner output and throws at 46947.

description: |
  ## Problem

  The boot stable prefix (constitution + articles + PIPELINE, inlined into
  every agent launch) is 46947 chars against the 44000-char budget — the
  third overrun of a boot-prefix threshold (BL-618: 53408 > 51200 cap;
  BL-858: 65138 > 51200 cap; now 46947 > 44000 budget). Unlike the prior two
  this is a BUDGET bust, not a cap bust: the bb runner still reports ALL
  PASS at 51200, but BL-858's landed acceptance feature
  (`specs/features/BL-858-boot-prefix-back-under-cap.feature`, scenario
  `headroom-budget-02`) is a LIVE assertion at 44000 and is RED on main
  right now. Every parcel gating on the acceptance suite sees a
  pre-existing failure — the exact "normalized red" condition BL-859's own
  description warns is how a real red gets waved through. Severity high for
  that reason: a landed safety signal is broken on main.

  ## Why it regressed — predicted, not surprising

  BL-858 landed at 43757 chars (243 under budget) on 2026-08-09 and its own
  description said landing without BL-859's authoring-time gate "buys
  roughly a week at the observed growth rate". Five amendment commits since
  (617e202ef..main) added +3190 composed chars in three days (~1063/day):

      workflow.prompt          8604 -> 10482  (+1878)
      local-engineering.prompt 5861 -> 6584   (+723)
      engineering.prompt       5477 -> 5986   (+509)
      03_backlog.md            3340 -> 3450   (+110)

  BL-859 (the gate that would have charged each amendment at authoring
  time) is in flight with the coder but not landed. This ticket is the trim
  that restores green and gives BL-859 an under-budget tree to land on; it
  does not replace BL-859.

  ## Fix mechanism (established, not novel)

  The BL-433 split mechanism exactly as BL-618 and BL-858 ran it: move
  incident-backed elaboration prose out of the boot-inlined articles into
  `swarmforge/constitution/articles/reference/` (read on demand, never
  inlined), leaving each slim article's normative rules intact plus a
  one-line pointer to the absorbing reference file. Primary donors are the
  three files carrying the fresh growth above — the recent amendments'
  incident narratives (BL-715 seat orientation, BL-875 lockfile incident,
  the test:properties allowlist rationale) are elaboration of exactly the
  kind the reference/ corpus absorbs — plus older inline elaboration still
  in workflow.prompt (the largest boot file at 10482 chars).

  ## Landing target: at or under 42000 chars, with teeth

  46947 - 42000 = ~4950 chars to move. 42000 is chosen to leave >= 2000
  chars under the budget — a few days of amendments at the observed rate,
  enough for BL-859 to land and take over — while displacing as little
  guaranteed-at-boot guidance as possible. Both prior trims prove that only
  a number with acceptance teeth gets honored (BL-618 landed 291 over its
  prose instruction to leave "comfortable headroom"; BL-858 landed 243
  under the only asserted number), so 42000 is asserted by scenario
  `landing-headroom-02`, PINNED to this parcel's fix commit: measure the
  fix commit's tree THROUGH the real composer (prompt_engine_lib /
  the bb runner run against a materialized checkout of that commit — never
  a re-derived second implementation that can drift from what boot pays).
  Commit-pinning is deliberate: the scenario stays green regardless of
  later growth, so this parcel adds no third live threshold that would red
  below the budget. The durable live gates remain BL-858's 44000 and
  BL-618's 51200 only.

  ## Step handlers — the established reuse discipline

  Reuse the commit-agnostic steps as-is by binding their exact text: "the
  prompt engine test runner executes", "the runner reports ALL PASS" (both
  bl618StablePrefixCapSteps.js), "the stable prefix length is at most
  44000 characters" (bl858BootPrefixCapSteps.js:188), the parameterized
  passage-search/pointer/diff-comparison When/Then steps, and the two
  cap-value steps. Add a NEW steps file for this parcel's own Given texts
  ("the repository at the BL-883 fix commit", "...the BL-883 parcel
  removed...", etc.) scoped to this parcel's own fix commit, plus the new
  commit-pinned `landing-headroom-02` handler. Do NOT edit BL-618's or
  BL-858's FIX_COMMIT constants — that silently rewrites a landed ticket's
  acceptance contract. Note the Background text must differ from BL-858's
  ("the repository at the parcel's fix commit" is bound to BL-858's commit).

  The acceptance file ships as `.feature.draft` because its Given steps
  have no handlers yet. Materialize it to a live `.feature` in the SAME
  parcel that lands the handlers and point this ticket's `acceptance:` at
  the live path (BL-233); landing handlers without materializing leaves the
  contract unexecuted, materializing without handlers is BL-618's QA bounce.

acceptance: specs/features/BL-883-boot-prefix-budget-rebust-trim.feature.draft

