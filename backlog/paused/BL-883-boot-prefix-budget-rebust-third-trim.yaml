approval_context: >
  Sign-off wanted on the 42000-char LANDING TARGET, not the mechanism. The
  mechanism (BL-433 prose split into articles/reference/) is twice-approved
  (BL-618, BL-858) and carried over unchanged; the 44000 budget and 51200 cap
  are untouched.

  What is new: both prior trims landed nearly AT their binding threshold
  (BL-618: 291 chars of headroom; BL-858: 243 chars under the budget) because
  the threshold was the only number with acceptance teeth, and both re-busted
  within days. This ticket therefore makes the landing headroom itself a
  commit-pinned acceptance scenario: land at or under 42000, leaving >= 2000
  chars for amendments while BL-859's authoring-time gate (in flight) lands
  and takes over enforcement. The pin is to the fix commit, so this scenario
  stays green forever and never manufactures a new live red threshold below
  the budget.

  If you would rather see a larger trim, a restructure, or a budget change,
  say so and this is respecced — those are materially different parcels.

source: |
  Coordinator note (priority 00, 2026-08-12 01:22Z):
