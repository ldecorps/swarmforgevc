qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `git diff main...HEAD --name-only` names only evidence, the feature,
     the step handler (+ lib/), and files under swarmforge/scripts/test/
     (invariant).
  2. `node specs/pipeline/cli.js specs/features/BL-1707-swarm-stamp-stop-banner-fallback-and-its-steward-competency.feature`:
     all scenarios ok.
  3. `bash swarmforge/scripts/test/test_agent_runtime_inject_mock.sh` and
     `bb swarmforge/scripts/test/model_steward_test_runner.bb`: green.
  4. `backlog/hotfix-ledger.yaml` rows 22a2a9fc7f, 7ba57573ff,
     e94b78a7a3: `human_decision: null`.
  5. After done: the human runs `bb swarmforge/scripts/hotfix_ledger_update.bb .
     --decide <sha> approved|waived` for each and commits the ledger.
