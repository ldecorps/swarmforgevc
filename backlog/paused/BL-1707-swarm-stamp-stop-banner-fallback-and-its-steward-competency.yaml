description: |
  ## What
  Three operator hotfixes from 2026-09-23, live on main, never through a
  gate. This is that gate: a REVIEW ticket - confirm or refute, open
  narrow follow-ups for anything found.

  ## What landed (files to review)
  - **22a2a9fc7f.** `agent_runtime_inject.bb`'s no-narration suffix
    appended "if nothing to do, reply exactly `! ready_for_next.sh`" to
    every injected aider text, including handoffd's in-process-resume
    banner, which says "Do NOT run ready_for_next.sh again" in the same
    breath. Observed live: an aider coder/QA seat re-ran the forbidden
    script. `notify-agent!` gains `:fallback-command` (default unchanged);
    `notify-in-process-resume!` passes `safe-idle-fallback-command`
    (`"true"`). Test: `test_agent_runtime_inject_mock.sh`.
  - **7ba57573ff.** `local_model_compliance_battery.py` and
    `model_steward_lib.bb`: two safety-critical competencies
    (`coder-stop_banner_compliance`, `coder-tool_capability_denial`);
    `_escalating_probe` catches a per-call error instead of crashing
    before the scorecard write; the default per-call timeout 240 s ->
    900 s, overridable by `MODEL_STEWARD_BATTERY_TIMEOUT_S`.
  - **e94b78a7a3.** Withdraws `coder-tool_capability_denial` from the
    gate and the battery: it failed a model for asking to have a file
    added to the chat, which aider's own system prompt requires. The gate
    ignores the entry on old scorecards.

  ## Review goals
  1. Scenarios 01-03 green against the real code.
  2. The existing tests pass on the parcel commit:
     `test_agent_runtime_inject_mock.sh`, `model_steward_test_runner.bb`.
  3. Record, do not review: under BL-1697 (paused) a driver seat receives
     no resume banner at all; the banner and this fallback remain for
     every non-driver aider seat. Scenario 01 pins a QA seat for that
     reason. A successor ticket that brings QA under the driver retires
     scenario 01's banner row (BL-1006).
  4. PROBE, do not fix: whether the 900 s default is still right once the
     GPU is in (the commit itself says it is "still not always enough on
     this hardware"). Record the battery's measured per-call times, if any
     run exists after the GPU lands, in evidence.

  ## Scenario notes for the coder
  - Scenario 01 drives `notify-agent!` (with `:text`, and via
    `notify-in-process-resume!`) against a fake tmux recording typed text,
    for an agent whose capability is `:shell-run-script`.
  - Scenario 02 calls `certification-safety-gate` on the three entry
    lists.
  - Scenario 03 runs the battery against a stand-in HTTP endpoint that
    stalls past a short `MODEL_STEWARD_BATTERY_TIMEOUT_S` on one probe;
    never the real ollama.
  - Do NOT assert the ledger rows' `human_decision` in a scenario (red
    the day the human certifies, BL-1006); it is a QA step.
  - The step handler is `bl1707SwarmStampStopBannerCompetencySteps.js`,
    landing in the SAME commit as the feature (BL-233).

