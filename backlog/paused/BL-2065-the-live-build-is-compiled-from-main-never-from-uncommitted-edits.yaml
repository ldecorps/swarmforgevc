human_approval: approved
approval_context: >
  From QA's live alarm (note 003900) on 2026-10-07. No choice is posed:
  the behaviour is fixed (the live build equals main's committed tree)
  and the mechanism is the architect's. FIRM: the master checkout's
  working tree is never modified by the build (scenario 02), and a failed
  recompile still never keeps the front desk down (BL-328 scenario 08).

invariants:
  - "Whatever the master checkout's working tree holds, the build the supervisor compiles equals the build of main's committed tree."
  - "The build never writes to, stages, restores or deletes a file in the master checkout's working tree."

description: |
  ## What is wrong

  front_desk_supervisor.bb's `ensure-current-build!` runs
  `npm run compile` in the master checkout's extension/ whenever
  extension/out/BUILD_SHA differs from main. tsc compiles what the
  working tree holds, uncommitted and untracked files included, and the
  build is then stamped as main's commit.

  On 2026-10-07 an uncommitted, hand-made implementation of BL-1911 (a
  repo reader for the local qwen seat, extension/src/tools/localSeatRepoRead.ts
  plus an edit to localQwenSeatLive.ts and a test and step handler) sat
  in the master checkout from 07:41Z. Every recompile from 07:46Z (about
  twenty that morning) compiled it into extension/out. The cursor bridges
  the bridge supervisor started at 09:31Z, 09:36Z, 09:45Z, 09:47Z and
  10:23Z loaded it. QA found its secret filter leaky and the files
  blocking the reconcile (note 003900). The source files were gone from
  the checkout by 10:45Z, the 10:49Z recompile built a clean
  localQwenSeatLive.js, and the specifier restarted the cursor bridge
  child at 10:50:05Z (pid 27628) so it loaded the clean build. The
  pipeline's BL-1911 parcel, which carries the reviewed filter, is a
  different implementation.

  ## What is wanted

  - The supervisor's recompile builds main's committed tree: an
    uncommitted edit or an untracked source file in the master working
    tree never reaches the compiled output (scenario 01, invariant 1).
  - BUILD_SHA names the commit the build was compiled from, and the
    working tree is left exactly as it was (scenario 02, invariant 2).
  - A failed recompile keeps today's behaviour: the front desk still
    comes up, loudly (BL-328 scenario 08 stays green).
  - Living docs: docs/how-to/BL-1154-build-stale-restarts-not-crash-giveup-budget.md
    and docs/reference/BL-629-build-freshness-qa-approval-gate.md say
    the build is compiled from main's committed tree.

  ## How (direction, not mandate)

  - One shape: export main's tree (`git archive` or a dedicated build
    worktree kept at main) into a build directory, run the compile there
    with the live node_modules linked, then swap the output into
    extension/out atomically. The architect decides, including whether
    an uncommitted change under extension/src should also raise an alarm.
  - Fixture project: a tiny extension/ with a package.json whose compile
    script runs tsc on two files, committed on main in a mkdtemp repo.

constraints: >
  Fixture repositories under mkdtemp only, proven by rev-parse
  --git-common-dir before any mutating git command (BL-1390); never the
  live checkout, never the live supervisor. bash 3.2 rules for any shell.
  The step handler lands with the feature (BL-233).

out_of_scope: |
  - A role running `npm run compile` or `npm test` by hand in the master
    checkout also writes extension/out from the working tree. That is a
    separate path; if the architect finds the same fix covers it, say so
    in the evidence.
  - The cursor bridge supervisor has no stale-build restart of its own:
    pid 32710 kept the stray build until it was killed by hand. A note to
    the specifier if the architect wants it owned.
  - Who wrote the stray implementation.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2065-the-live-build-is-compiled-from-main-never-from-uncommitted-edits.feature`:
     4 of 4 ok (01 x3, 02).
  2. `node specs/pipeline/cli.js specs/features/BL-328-merged-code-reaches-running-daemons.feature`:
     all ok (the recompile and its failure path are unchanged).
  3. After the land, on the live swarm: the next "stale-build-detected
     recompiling before respawn" line in front-desk-supervisor.log is
     followed by a build whose BUILD_SHA equals `git rev-parse main`, and
     `git status --porcelain` in the master checkout is unchanged across
     it.

