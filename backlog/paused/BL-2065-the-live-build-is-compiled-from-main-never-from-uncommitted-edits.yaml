id: BL-2065
title: "The live build is compiled from main, never from uncommitted edits: the front-desk supervisor's stale-build recompile ran `npm run compile` on the master checkout's working tree, so an uncommitted hand-made BL-1911 implementation with a leaky secret filter went live in the cursor bridge from 09:31Z to 10:50Z on 2026-10-07 under a BUILD_SHA naming main"
milestone: M8
type: defect
