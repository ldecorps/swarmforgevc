qa_e2e_procedure: |
  On the parcel commit, from `extension/`:
  1. `for i in 1 2 3; do npx vitest run --config
     vitest.properties.config.mjs
     test/bl1373PathSetCacheInvariants.property.test.js || echo FAIL;
     done` -> 3 passed every run, no FAIL line; every per-test duration
     vitest prints is under 20000 ms, and under 10000 ms when the host's
     1-minute load average is below the core count.
  2. In each run's stdout, each of the three printed reach maps shows
     `sweeps` <= 10 and `decisive` equal to that test's `numRuns`.
  3. `git diff main...HEAD --name-only` names the property test, the step
     handler, the feature, evidence, and the register row removal;
     `extension/src/`, `swarmforge/scripts/`,
     `specs/pipeline/steps/lib/babysitterSweepFixtureHelpers.js`,
     `property_suite_standing_allowlist.tsv`, the BL-1373 feature and
     handler are unchanged. `grep -c "finding1 && !finding2" <the test>`
     -> 0 for the both-not-found branch (the decisive branch may remain).
  4. Break-then-restore: make the stub path script in the test print no
     paths at all (an empty `P1`); the reach floor fails naming `decisive`
     and scenario 03 fails; restore. Then set invariant 1's `numRuns` to
     15 with two sweeps per draw; scenario 02 fails on `sweeps`; restore.
