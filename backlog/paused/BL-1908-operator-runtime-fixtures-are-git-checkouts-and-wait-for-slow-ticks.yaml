description: |
  ## Status: hotfix 8bd8940741 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What the hotfix changed

  - The 13 tests' make_fixture calls init_git_fixture_root (the shared
    operator_runtime_sandbox.sh helper hotfix 8b1c763709 introduced), the
    same one-line change 8b1c763709 made to BL-763's test.
  - Two timing bounds that held only while a full operator_runtime tick was
    fast. On the WSL host one tick took about 20 to 25 s.
    test_operator_runtime_fixture_reaper_sweep_bounded_progress.sh's orphans
    slept 30 s, so the third had exited by itself before tick 2's "survives"
    check; they now sleep 600 s, and the cleanup trap kills them.
    test_operator_runtime_tick.sh's BL-481 live-loop section used a fixed
    3500 ms tick interval and 5 s deadlines; a tick longer than the interval
    makes the next wake due at once. It now times one tick with the loop's
    env (TICK_S) and scales the interval and every deadline from it.
  - BL-671's feature: scenario 01 retired (narrative records why). It ran
    all sixteen fixtures inside one acceptance step, about 25 minutes here,
    three past its 120 s spawn limit. Each fixture is its own standing
    shell row. The handler's scenario 02 check now reads the derived
    closure (bb_load_closure_cli.bb, what the helper copies) instead of
    lib names in the helper's text, which BL-973 removed. And
    test_operator_runtime_watch_adoption.sh, which copies no runtime at
    all, is a named exemption with its reason.
  - BL-684's handler: the supervisor fixture copies the supervisor's derived
    load-file closure (it missed process_table_lib.bb, so the supervisor
    died at load); scenario 07 passes the startup-grace override the shell
    twin passes (BL-1043); the supervised child's pid is handed to after()
    so it no longer outlives the run; scenario 11 finds the ticket in any
    backlog folder (it read backlog/active/ after BL-684 closed); scenario
    01 accepts what extension/test/onboarderResidualAllowlist.js accepts
    (BL-694's list, which had grown by nine files this one never followed).
  - extension/test/onboarderResidualAllowlist.js allows
    backlog/standing-reds.tsv, which names BL-684's feature by its real
    filename in the row BL-1907 owns.

  ## What is wanted in this parcel

  - Review each change above. Say in the evidence whether the
    watch_adoption exemption, the scenario 01 retirement and the scaled
    live-loop timings stand.
  - Evidence: the review and one run of each check below.

  ## Scope

  The files hotfix 8bd8940741 touched (review only), evidence.

  ## Out of scope

  BL-684's scenario 09 and the two shell tests BL-1907 owns: they are red
  only while a live subreaper adopts orphans (BL-1907). The tick test's own
  runtime (967 to 1528 s here) is an observation, not this ticket.

