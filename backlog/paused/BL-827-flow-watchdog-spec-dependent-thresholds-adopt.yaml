  Five files written in a single pass at 2026-08-06T12:18:59Z:

  ```
   M swarmforge/scripts/flow_watchdog_lib.bb              +249
   M swarmforge/scripts/test/flow_watchdog_test_runner.bb +114
   M swarmforge/scripts/handoffd.bb                       +4
