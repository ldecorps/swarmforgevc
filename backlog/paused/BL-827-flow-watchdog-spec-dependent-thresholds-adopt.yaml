approval_context: >
  Retro-ticket for functional work already sitting uncommitted in the master
  working tree (ticket-less, BL-506), surfaced by the 2026-08-06 master-diff
  review and ruled KEEP by the coordinator the same day. Same adopt posture
  the human already approved on BL-763, BL-765 and BL-788 — the coder starts
  from the working tree, the pipeline reviews it as ordinary parcel content,
  and nothing is reverted before review.

  What needs sign-off is not whether to keep it — that is ruled — but one
  design property the working tree does not address, and that a human should
  decide rather than an architect: **calibrating an alarm from a route's own
  history means the watchdog learns to tolerate whatever that route has been
  doing.** A hop that has been chronically slow for two weeks teaches the
  table that slow is normal, and the alarm quietly stops firing on it. The
  60-second warn floor bounds the fast direction only. Options are in the
  description under "The adaptation hazard"; the human's call is which one
  ships.

source: |
