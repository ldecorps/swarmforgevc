description: |
  ## What

  Soft-tier operator verbs on the shared BL-698 surface:

  | Verb | Tier | Behaviour |
  | --- | --- | --- |
  | `/deprecate` | soft | Ranked scan; retire top item or refuse |
  | `/deprecate dry` | read | Scan only |
  | `/deprecate check BL-xxx` | read | Same as BL-1173 CLI (or wraps it) |

  Rank sources by recurrence + blast radius (Boy Scout philosophy). Three-bucket
  adjudication (BL-564): retire / defect / human ask. On retire: remove dead
  logic, retire scenarios, move docs to `docs/deprecated/` and link from
  `docs/index.md`.

  ## Model capability (locked human decision 2026-08-27)

  `/deprecate` execution is judgment across many tickets, specs, docs, and code
  surfaces. It MUST run on a hard-tier / multi-document reasoning model only.
  Easy seats and weak/local-only models refuse with "needs hard-tier
  multi-document reasoner." `mutation_cost: high` enforces the claim path.

qa_e2e_procedure: >
  (1) /deprecate dry ranks without mutating. (2) /deprecate retires one orphan
  conf flag + writes docs/deprecated stub + index link. (3) Ambiguous candidate
  → human ask, no deletion. (4) Oversized retirement → refuse with reason.

out_of_scope: |
  - Replacing Boy Scout code-debt scan (BL-1013).
  - Big-bang retirement of all stale paused tickets.

