description: |
  ## What is wrong

  Specifier run on main at 40b28c4219, 2026-09-16 21:35Z:

  ```
  PASS: baseline: empty inbox on a ticket branch prints NO_TASK and never fires the guard
  FAIL: 01(swarmforge-coder): a passing guard emits no warning, got: backlog_depth_lib: no swarm-identity for /tmp/tmp.p6mjnCofJ3 - falling back to the tracked default conf /tmp/tmp.p6mjnCofJ3/swarmforge/swarmforge.conf
  ```

  The fixture (lines 30-46) writes
  `.swarmforge/swarm-identity` as `swarm_name primary / swarm_mode
  autonomous` and nothing else. `backlog_depth_lib.bb/conf-file-path`
  (BL-966, 5c8b0835f8, 2026-08-20) reads
  `active_backlog_max_depth_conf_path` from that file and, when it is
  absent, prints the fallback line to stderr by design ("never silent").
  `ready_for_next_task.bb` reads the pack conf through that function on
  every claim since BL-1004 (19b28a1a84, 2026-08-21: `pack-conf
  (mono-router-conf-text)` in the claim path). Scenario 01's first row
  asserts `-z "$ERR"` after a passing claim (line 107), so it has failed
  since 2026-08-21. BL-1530's shell-test census (2026-09-11) did not
  cover this file (its population was the tests that drive
  swarm_handoff). The coder recorded it first today.

  Census of the shape (2026-09-16, `grep -l swarm-identity
  swarmforge/scripts/test/*.sh`, then the key, a claim-path invocation
  and an empty-stderr assertion per file): five fixtures write an
  identity without the key and drive the claim path
  (test_branch_claim_guard, test_worktree_drift_guard,
  test_worktree_drift_guard_master_resident_exempt, test_supersede_guard,
  test_reference_freshness_guard); only test_branch_claim_guard asserts
  an empty stderr, so it is the only one red for this reason. The grep:
  `for t in $(grep -l 'swarm-identity' swarmforge/scripts/test/*.sh); do echo "$t $(grep -c active_backlog_max_depth_conf_path $t) $(grep -cE 'ready_for_next_task|ready_for_next\.sh' $t) $(grep -c '\-z "\$ERR"' $t)"; done`.

  ## What is wanted

  - The fixture's swarm-identity carries
    `active_backlog_max_depth_conf_path` naming a tracked conf under the
    fixture root (the launcher's own shape, `swarm_identity_lib.bb`), and
    that conf exists before the first claim (scenario 01, invariant 1).
  - The test green: exit 0, every case PASS (scenario 02; about 30 s -
    sixteen claim invocations - inside the per-mutant ceiling, BL-1541).
  - The census pinned: exactly one shell test that drives the claim path
    asserts an empty stderr, and it is this one (scenario 03, BL-1445).
  - The register row removed in the same land.

  ## How (direction, not mandate)

  - Two fixture lines after the identity write:
    `mkdir -p "$ROOT/swarmforge"; : > "$ROOT/swarmforge/swarmforge.conf"`
    and the identity gains a third tab-separated row
    `active_backlog_max_depth_conf_path<TAB>swarmforge/swarmforge.conf`
    (the same relative form `test_backlog_depth_conf.sh` uses); keep the
    `.gitignore` of `.swarmforge/` as is.
  - Scenario 01 reads the script; scenario 02 runs it from the repository
    root (the BL-1530 handler's shell-runner shape, output captured);
    scenario 03 runs the census grep above in process over the real tree.
  - Documenter: `docs/how-to` page for BL-966 (or the shell-test
    conventions page) says a fixture swarm root carries the conf-path key;
    no diagram trigger.

