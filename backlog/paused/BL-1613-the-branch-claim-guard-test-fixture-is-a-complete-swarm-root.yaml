qa_e2e_procedure: |
  On the parcel commit:
  1. `bash swarmforge/scripts/test/test_branch_claim_guard.sh` -> exit
     0, every line PASS, no FAIL.
  2. Acceptance resolving all three scenarios
     (`bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1613-*.feature`).
  3. `git diff <parent>..<parcel> -- swarmforge/scripts/test/test_branch_claim_guard.sh | grep -E '^-' | grep -vE '^---'`
     shows only the identity printf line (no assertion removed).
  4. After landing, `bb swarmforge/scripts/standing_red_register_cli.bb .`
     reports no row for the file and `"unowned":[]`.

