id: BL-970
title: "wake busy-gate misclassifies from whole-pane word matching: an idle role whose scrollback shows background-shell chrome or quoted busy-marker text is permanently 'busy', hence unwakeable (and a live spinner with an unlisted verb reads idle)"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: pending
priority: 20
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-970-wake-busy-gate-idle-pane-misclassification.feature

invariants:
  - "A pane rendering the idle input prompt with no live turn-status frame is never classified busy, whatever marker text persists in its visible scrollback (stale or backgrounded tool chrome, busy-marker phrases quoted inside transcript text)."
  - "A pane rendering a live turn-status frame is classified busy even when its status verb appears in no hand-maintained verb list - a new spinner verb upstream must not require a list edit here to keep mid-turn panes protected from wake injection."

description: >
  Severity rationale: high - a live fault in a safety/health signal (wake
  delivery). Observed 2026-08-20 ~04:00Z (evidence commit ecc14dd14): QA
  idle at an empty prompt with 5 lingering background shells (one
  caffeinate, shells 3-4 hours old), its property suite finished, yet the
  deliver-path wake was skipped as busy and handoffd's chase had logged
  the same skip repeatedly - QA was likely unwakeable for hours and its
  BL-910 parcel sat delivered-but-unworked for 70+ minutes. Below
  critical: mail lands durably, and the role recovers on any
  self-initiated turn (which is how this instance eventually cleared).

  The defect: the busy gate classifies from a whole-pane text snapshot
  using an anywhere-in-snapshot marker-word match. All four gate
  predicates (deliver, chase, rotate, nudge - in handoffd.bb,
  handoff_inject_lib.bb, babysitter_nudge_lib.bb) funnel into the one
  pure classifier in chase_sweep_lib.bb (actively-processing? over
  busy-activity-patterns), so fixing the chokepoint fixes every caller
  and no call site changes. Two failure directions, one surface:

  (1) False-busy, self-sustaining: marker text that persists at an idle
  prompt keeps matching forever - the running-state tool chrome of a
  long-lived background shell (a caffeinate never completes, so its task
  line never flips to the finished form), or a busy-marker phrase quoted
  inside displayed text (a log line, source code, or a spec that names
  the marker). Because every wake path shares the predicate, chase
  retries re-skip identically; only the role's own spontaneous turn can
  scroll the marker away, and an unwoken role takes none. Specifier
  probe reproduced both variants as fixtures against the live classifier
  at mint time (both classify busy pre-fix; see acceptance fixtures
  idle-bg-shell-running-chrome.txt and idle-quoted-busy-marker.txt).

  (2) False-idle, latent (the BL-147 regression class the code comment
  itself warns about): the spinner-verb list is hand-maintained and
  incomplete. At mint time two live mid-turn panes (QA, documenter)
  showed status verbs absent from the list and classified busy only via
  the token-counter pattern; a spinner frame without that counter
  classifies idle and would be typed into mid-turn (fixture
  midturn-unlisted-verb-no-counter.txt, classifies idle pre-fix).

  Fix wanted: classify from the pane's rendered turn state, not from
  marker words anywhere in the snapshot - an idle input prompt with no
  live status frame is never busy regardless of scrollback content, and
  a live status frame is busy regardless of which verb it carries. The
  acceptance fixtures (two real captures, four synthetic) define the
  contract; the coder owns the concrete heuristic.

  How (direction, not mandate): the live status frame and the idle
  prompt occupy the tail/footer zone of the snapshot and have a stable
  structural shape (glyph + verb + ellipsis + parenthesized elapsed
  time; the prompt line and its footer). Anchoring classification to
  that zone's structure - rather than word-matching the whole snapshot -
  satisfies both invariants at once and removes the verb list rather
  than growing it. The coordinator's incident evidence also measured
  that the age of the pane shell's newest child process cleanly
  separates working (1s) from stalled (66m); that process-level signal
  is available as a cross-check but is NOT required, and if adopted it
  must not add per-role process scans to the daemon's 1s idle tick.

constraints: >
  Out of scope / firm lines:

  - Never weaken toward injecting into a genuinely mid-turn pane: the
    BL-135/BL-147 posture (skip wake while mid-turn) is the invariant
    the gate exists to hold. The fix narrows what counts as mid-turn to
    reality; it must not blur it.
  - Wake retry/aging POLICY is unchanged (deliver-path single wake,
    BL-576 aged-note chase cadence) - only classification changes.
  - BL-967's territory (handoffd cycle wait-bounding, sweep-boundary
    logging) is a sibling active ticket; do not restructure the cycle
    here. This ticket changes the classifier and its tests.
  - Role behavioral hygiene (agents leaving caffeinate/stale background
    shells behind) is real but separate - not this ticket.
  - Verbatim busy-marker strings stay confined to the fixture files:
    do not quote them in the ticket YAML, feature prose, commit
    messages, or handoff notes (an agent displaying them becomes the
    false-busy input under test - the trap this spec was authored
    around).

qa_e2e_procedure: >
  1. Acceptance scenarios 01-02 green via the runner (pure classifier
     over the six fixtures; pre-fix state for regression context:
     idle-bg-shell-running-chrome and idle-quoted-busy-marker
     classified busy, midturn-unlisted-verb-no-counter classified idle,
     the other three already correct and pinned).
  2. bb unit suite green (swarmforge/scripts/test/), including the
     classifier's own tests.
  3. Live read-only sweep: capture every live role pane through the
     real capture path and run the shipped classifier on each; every
     pane at an idle prompt classifies idle (including any with a
     lingering-shells footer) and every pane showing a live status
     frame classifies busy. Record the role-by-role table in the QA
     evidence file.
  4. Live wake: pick (or stage in QA's own pane) a role that is idle
     with at least one lingering background shell; deliver a note to
     it and confirm the daemon log shows a delivered wake for it, not
     a busy skip, and the pane wakes.
  5. Hardening fallback recorded per engineering rules: Babashka has
     no mutation/CRAP/DRY wired (BL-472 deferred) - gate on the unit
     and acceptance suites and say so in the evidence.

notes: >
  Source: coordinator note handoff
  00_20260820T040220Z_000653 ("mint defect: bg shells make a role
  permanently busy, unwakeable - see git log") plus the coordinator's
  evidence file
  backlog/evidence/role-with-background-shells-is-unwakeable-20260820.md
  (commit ecc14dd14), from a babysitter in_process-age alert on BL-910
  at QA. The evidence's ask, verbatim: "Busy-detection must distinguish
  'the agent is mid-turn' from 'the agent is idle but has background
  shells'."

  Specifier probe corrections to the filed hypothesis (probe-before-
  speccing): (a) busy detection does NOT read child processes - it is
  pane-text pattern matching at a single chokepoint
  (chase_sweep_lib.bb actively-processing? / busy-activity-patterns),
  reached by all four gate predicates; the "background shells" effect
  is their persistent rendered chrome in the snapshot, which is why the
  role never recovers (no wake, no new turn, marker never scrolls off).
  (b) The incident-time pane text is unrecoverable, but both false-busy
  variants were reproduced synthetically against the live classifier at
  mint time, and a live all-panes sweep additionally surfaced the
  false-idle direction (two mid-turn panes carrying status verbs absent
  from the hand-maintained list - the compute-the-closure lesson
  applied to a verb list). Fixtures: two real captures shipped with the
  spec (idle QA pane with a lingering-shells footer; mid-turn
  documenter pane with an unlisted verb), four synthetic.

  Orthogonality for the coordinator: BL-967 (active, at coder) works in
  handoffd.bb and may add boundary logging into chase_sweep_lib.bb;
  this ticket edits chase_sweep_lib.bb's classifier and its tests.
  Prefer not co-active, or sequence merges deliberately.

  Related: BL-135/BL-147 (why the gate exists), BL-576 (aged-note
  chase - retries exist but share the broken signal), BL-921 (marker
  vs pane-identity divergence - same family of stale-signal wake
  defects), BL-967 (sibling transport defect, distinct function).

approval_context: >
  Two calls to say the word on: (1) severity high (expedited lane) -
  the wake path is a health signal and the incident produced hours of
  silent unwakeability, but mail is never lost and roles self-recover
  on any own turn; (2) scope folds the false-idle direction (unlisted
  spinner verbs typed-into risk) into the same ticket because both
  directions are one classifier and one fixture suite - splitting them
  would mint two tickets editing the same ten lines. Firm: the fix may
  not weaken mid-turn protection (BL-147), and wake retry policy is
  untouched.

notes_coordinator_hold: >
  COORDINATOR HOLD 2026-08-20 04:25Z: not promoted. Two blockers -
  human_approval: pending, and capacity (active/ holds 7 against an effective
  cap of 7).

  EXPEDITED (defect/high, Article 3.2.4). ALL THREE expedited candidates are
  now approval-blocked: BL-968 p20, BL-970 p20 (this), BL-969 p30 - none
  promotable. Meanwhile the last two slots went to BL-946 and BL-948, both
  defect/MEDIUM, because they were the only approved buildable candidates.
  So the approval gate, not capacity, is currently choosing lower-severity
  work over higher. Stated as fact, not as a request to bypass anything:
  human_approval is a human decision and the coordinator does not override it.

  PROVENANCE / LIVE IMPACT: this ticket is the fix for a defect the coordinator
  observed in production tonight (evidence ecc14dd14). QA sat idle at a prompt
  for ~70 minutes holding a completed BL-910 gate while every wake to it was
  refused - `deliver-notify-skip-busy QA` - because hours-old background shells
  read as "busy". handoffd logged that same skip three times in one second just
  before it stalled. The defect is live now: QA still accumulates unread mail
  that no wake will deliver, and it recovers only when it happens to take a turn
  on its own. Any role that backgrounds a long run is one skipped wake from an
  indefinite stall.

