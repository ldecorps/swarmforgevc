description: |
  ## Status: hotfix 0ea531fa5f landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong, and what the hotfix changed

  QA's BL-2044 unit-lane run at 06:09Z on 2026-10-07 shared the host with
  two other full unit suites (5-minute load 13.7).

  1. extension/test/bl1901MergePathLandDeclines.test.js: "a push that
     loses the race twice declines to the land step ..." timed out at the
     flat 20 s per-test cap (2.7 s alone on a quiet host; each of the six
     tests builds a real git fixture and spawns land_merge_path.bb with its
     own 60 s bound). The hotfix gives all six tests BL-1607's heavy-test
     timeout, `resolveUnitLaneTimeout(20000, { factor:
     unitLaneHeavyContentionFactor() }).effectiveMs`, the form
     bl1277UnscopedStepCollisionGuard.test.js already uses. At load 19.8
     it resolves to 99 s.
  2. extension/test/bl1698LocalParcelDriverMailAndReleaseEdgeCases.test.js:
     the per-file budget gate's solo confirmation measured 7.3 s against
     the 7.0 s budget (3.7 s alone on a quiet host; D4 alone drives two
     real bb daemon ticks), so it refused the file as a new pole. The
     hotfix moves the three hold-and-answer cases (D4, D5 and pass 2
     D1/D2, with runR1R2Probe and the LIB/execFileSync requires they use)
     verbatim to extension/test/bl1698LocalParcelDriverHoldAnswerEdgeCases.test.js.
     Fastest of three alone at load 17 to 20: 3.2 s and 5.2 s.

  ## What the coder does (all of it)

  1. Read `git show 0ea531fa5f` against the section above. Confirm the
     moved tests are byte-identical to their originals
     (`git show 0ea531fa5f^:extension/test/bl1698LocalParcelDriverMailAndReleaseEdgeCases.test.js`)
     and that no test was dropped (7 before, 4 + 3 after).
  2. Run the three test files once each, alone, with output under tmp/.
  3. Write backlog/evidence/BL-2057-coder-<date>.md with the review result
     and the run results, and commit it.
