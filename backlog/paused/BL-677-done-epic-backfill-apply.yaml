approval_context: >
  Slice 2 of the done-epic-backfill (see BL-676). Decisions to sign off:
  (1) the apply refuses to run unless the mapping file carries an explicit
  human approval line — the report BL-676 emits is inert until a human
  stamps it; (2) writes land as BATCHED commits through the shared
  commit-integrity path (commit_integrity_cli.bb), one commit per batch,
  never one per ticket and never a hand-typed commit on the shared main
