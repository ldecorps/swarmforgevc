description: |
  ## What

  A bb script that reads BL-676's report after the human has amended and
  approved it, and writes each proposed epic: into the corresponding
  backlog/done/ ticket YAML (recursive tree), in batches, each batch
  committed through commit_integrity_cli.bb. Output is a summary: applied,
  skipped-already-tagged, skipped-empty-proposal, refused rows.

  Behavior:
  - No approval line in the mapping file: refuse, write nothing.
  - Unknown epic value anywhere in the mapping (not in the type: epic
    roster and not the pre-epic-era sentinel): refuse the entire run
    before any write — a typo must fail loud, not scatter novel strings.
  - A target ticket now carrying a non-empty epic: skip and report, never
    overwrite.
  - Empty proposal cells: skip and report.
  - Re-run after success: finds nothing to write, exits without a commit.
  - A ticket id in the mapping with no file under done/: refuse the run
    (the mapping is stale against the tree — regenerate BL-676's report).

  ## Constraints

  - The parcel updates backlog-schema.md's epic: row to document the
    pre-epic-era sentinel for done-folder history (BL-676's
    approval_context decision 2 names this parcel pair as its delivery).
  - Testable module, fixture trees, injected commit runner — assert batch
    boundaries and refusal-before-write in tests, not by hope.
  - Coder materializes the .feature.draft to .feature and wires step
    handlers in the same parcel (BL-441/BL-233).

  ## e2e QA procedure

  On the real repo with a human-approved report: run the apply, verify the
  summary counts reconcile with the report's rows, git log shows batched
  "By" commit-integrity commits only, spot-check ten rewritten done
  tickets, then re-run and verify a clean no-op.

  ## Making the contract executable (do this in THIS parcel)

  `acceptance:` above points at a `.feature.draft`. No `*.feature` glob and no
  runner picks up a `.draft`, so as written this ticket can cross all six
  stages with **zero** of its scenarios ever executed. That was correct while
  the slice was unbuilt; it is wrong the moment it is built — and this ticket
  IS the slice that builds it. In the SAME commit as the implementation:

  1. Rename `specs/features/BL-677-epic-backfill-apply.feature.draft`
     to `BL-677-epic-backfill-apply.feature` (drop the `.draft` suffix).
  2. Add `specs/pipeline/steps/bl677EpicBackfillApplySteps.js`
     and register it in `specs/pipeline/steps/index.js` under exactly that
     name — the `required_wiring:` entry above pins it.
  3. Repoint this ticket's `acceptance:` at the `.feature` path.

  Do NOT rename the draft without landing the handler in the same commit: the
  acceptance runner THROWS on any scenario lacking a handler (BL-233), so a
  half-done rename turns the suite red for every other parcel in flight.

notes: |
  ## Freshness + executable-contract amendment [2026-08-30] specifier

  Proactive Article 3.6 check before this ticket can be promoted, not a
  reaction to a gate. **Premise re-verified against the live tree and still
  holds** — see the amendment commit message for what was measured. **Not a
  zombie**: no implementation file carries this id, and no `bl677EpicBackfillApplySteps`
  is registered in `specs/pipeline/steps/index.js`. CONFIRM PROMOTE, with the
  contract made executable as spelled out in `description:`.

  **Why this amendment was needed at all.** BL-761's acceptance-contract gate
  fails CLOSED only on an **ABSENT** `acceptance:` declaration. A declaration
  that is present but aims at a non-executable `.feature.draft` passes
  **vacuously** — every gate green, not one scenario run. Nine paused tickets
  carried this shape when it was found; this is one of them.

  **Only ONE `required_wiring:` entry, deliberately.** A second anchor on the
  production symbol being changed was considered and rejected: a symbol that
  already exists matches identically before and after the fix (vacuous), and
  pinning its post-fix contents would falsely block a coder who reaches the
  same behaviour by another route. The handler anchor is the honest gate — it
  guarantees the scenarios RUN, and the scenarios are what assert the
  behaviour. The handler name is fixed HERE, at mint, so the pattern is a
  literal that will exist rather than a placeholder the gate can never match
  (BL-874).
