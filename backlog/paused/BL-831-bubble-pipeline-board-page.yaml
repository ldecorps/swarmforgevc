verification: |
  ## Runnable gate

  This page is TypeScript and HTML on the bridge, so
  `specs/features/BL-831-bubble-pipeline-board-page.feature` runs in the Node
  acceptance runner and the parcel sits in normal Stryker/jscpd/CRAP scope. The
  coder writes its step handlers in THIS parcel (BL-233).

  ## Recorded manual procedure (device surface)

  The WebView render is device surface and BL-829 owns its verification. QA
  confirms only that this page opens from the Bubble pager on a paired phone,
  that the grid scrolls horizontally without the page scrolling with it, and
  that the detail sheet opens and closes without losing the grid behind it.

notes: |
  ## e2e procedure for QA

  With a live swarm holding at least one in-flight ticket: open Pipeline from
  the Bubble pager and confirm the grid's marks match what the Mini App
  `/pipeline-board` shows for the same swarm at the same moment. Confirm each
  listed in-flight ticket has a blurb visible without opening anything. Tap one
  and confirm the sheet shows its spec sections and, for a ticket whose
  `acceptance:` names a feature file that exists, that file's scenarios. Then
  close every active ticket (or point at an idle swarm) and confirm the page
  states that nothing is in flight rather than showing the last grid.
