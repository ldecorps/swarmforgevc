id: BL-1614
title: "The coder declines a freshly routed Work note on a stale read: it dequeues the note seconds after the promotion commit, reads backlog/active in its unmerged worktree, finds the ticket still paused and unassigned, and completes the note with a stated no-work reason - four tickets on 2026-09-16 (BL-1604, BL-1605, BL-1608, BL-1610) and three before, each recovered by the dropped-parcel sweep about forty-five minutes later; the claim names main's promotion when the tree is behind, and a no-work completion of a Work note whose ticket is active on main is refused"
