approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: the fact both changes
  read is "is <ticket> in backlog/active on main (or origin/main,
  whichever is ahead - BL-891)", answered with git show against the ref,
  never with the worktree's files; unreadable refs fail open (no hint,
  no refusal) with a warning. FIRM: BL-1422's decision table is
  extended by one input, not rewritten - a Work note whose ticket is
  paused or absent on main still completes with its reason exactly as
  today, and its five scenarios stay green. FIRM: the claim never merges
  on the role's behalf; it prints MERGE_MAIN_FIRST with the ticket id
  and main's tip and leaves the merge to the role (the lineage rule).
  FIRM: the route note's message says merge main first within the
  80-character cap.

invariants:
  - "A Work note is never completed with a no-work reason while its ticket sits in backlog/active on main: the completion helper reads that fact from the ref, never from the worktree, on every invocation with a reason."

description: |
  ## What is wrong

  Coder mailbox, 2026-09-16 (`.worktrees/coder/.swarmforge/handoffs/inbox/completed`,
  Work notes from the coordinator, times Z):

  | ticket | routed | dequeued | completed | stated reason |
  |---|---|---|---|---|
  | BL-1608 | 20:35:45 | 20:35:48 | 20:36:14 | "still in backlog/paused/ with assigned_to: null - not promoted to active ... no work to do until the coordinator promotes" |
  | BL-1605 | 20:47:53 | 20:47:56 | 20:48:01 | "still in backlog/paused/ ... Paused-ready informational note, not a git_handoff task assignment." |
  | BL-1610, BL-1604 | 20:59, 21:14 | seconds later | seconds later | the same sentence |

  The promotion (`Promote BL-1608: paused -> active for coder`) is a
  commit on main made seconds before the note; the coder's worktree had
  not merged it, so `backlog/active/` there did not have the file and
  `backlog/paused/` still did. The coder read its own tree, concluded the
  note was the specifier's paused-ready inform (which goes to the
  coordinator, never the coder), and completed with `--no-work`, which
  BL-1422 accepts on any non-blank reason. The coordinator's
  dropped-parcel sweep found "no parcel in flight" at 21:22Z and 21:33Z
  and re-routed with "Work BL-1608: now active/assigned in main, merge
  first - retry"; the coder merged, found the ticket active, and worked it.
  Three earlier completions carry the same reason (2026-09-06, 09-08,
  09-10). BL-1610's incident is the other face: the coordinator routed
  BL-1606 by a git_handoff carrying main's tip, which does force the
  merge through the lineage rule, and that route tripped the merge-drop
  gate.

  Nothing in `coder.prompt` said "merge main before you read a Work
  note's ticket" (landed with this mint), and nothing mechanical checks
  the premise: the ticket's state on main is one `git show` away.

  ## What is wanted

  - On claiming a Work note whose ticket is in `backlog/active` on main
    (or origin/main, whichever is ahead) but not in the worktree's
    `backlog/active`, the claim prints `MERGE_MAIN_FIRST: <id> is active
    on main at <10-hex>; merge main before reading it` after the TASK
    lines (scenario 01 rows 1-3). Nothing is merged for the role.
  - `done_with_current.sh --no-work "<reason>"` on a Work note whose
    ticket is in `backlog/active` on main is refused naming the ticket
    and main's tip, the note staying in in_process (row 4, invariant 1);
    with the ticket paused or absent on main it completes with the
    reason as today (rows 5-6; BL-1422's own scenarios unchanged).
  - `route_backlog_to_coder.sh`'s message reads
    `Work <id>: merge main first, then read backlog/active` (fits the
    80-character cap; today's basename form is truncated mid-word for
    every long slug, as `008934`'s "read " shows).
  - The Work-note decision runner gains the new input's cases.

  ## How (direction, not mandate)

  - `work_note_evidence_lib.bb`: `work-note-completion-decision` takes a
    fourth input `active-on-main?` (nil when unreadable = today's
    behaviour); `:refuse-active-on-main` when a reason is given and the
    ticket is active on main. `done_with_current_task.bb`'s
    `work-note-gate!` gathers it with
    `git -C <root> show <ref>:backlog/active/<id>-*.yaml` (a
    `git ls-tree <ref> backlog/active/ | grep <id>-` is enough), ref =
    the ahead one of main/origin/main via `git rev-list
    --left-right --count`.
  - `ready_for_next_task.bb`: after the claim prints, the same read;
    print the hint when the worktree's `backlog/active` lacks the file.
  - `route_backlog_to_coder.sh:141` message text; the Work-note parser
    (BL-1223, `work-note-ticket-id-from-message`) must still extract the
    id - verify against its regex before changing the wording.
  - Scenarios drive the real scripts on a fixture repository with a
    main branch and a worktree (the BL-1422 handler's fixture plus a
    branch): seconds (BL-1541).
  - Documenter: handoff-protocol.md's Work-note paragraph names the hint
    and the refusal; coder.prompt already carries the rule.

constraints: >
  ready_for_next_task.bb (the hint), done_with_current_task.bb and
  work_note_evidence_lib.bb (the input), route_backlog_to_coder.sh (the
  message), the runner, the feature and handler, evidence and docs. No
  merge performed by any helper; no change to BL-1422's five scenarios.
  The step handler lands with the feature (BL-233). Evidence named
  BL-1614-*.

out_of_scope: |
  - Routing coder work as a git_handoff to force the merge (BL-1610's
    incident; the Work note stays the route).
  - The specifier's paused-ready note to the coordinator (unchanged; it
    never reaches the coder).
  - BL-1609's forwarding-parcel gate in the same file.

qa_e2e_procedure: |
  On the parcel commit:
  1. `bb swarmforge/scripts/test/<runner the coder names>` -> green with
     the active-on-main cases.
  2. Acceptance resolving all six rows
     (`bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1614-*.feature`)
     and BL-1422's feature still resolving.
  3. Live probe on the parcel's own chain: promote a scratch ticket on a
     fixture root and route it; the claim prints MERGE_MAIN_FIRST; a
     `--no-work` completion is refused; after merging, the same
     completion with work evidenced completes plain.
  4. `bash -c 'source swarmforge/scripts/route_backlog_to_coder.sh'`
     is not runnable standalone - read line 141 and confirm the message
     under 80 characters for the longest active basename.

