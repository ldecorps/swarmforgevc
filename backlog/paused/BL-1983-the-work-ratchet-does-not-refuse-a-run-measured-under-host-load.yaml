source: |
  QA note 003813 to the specifier, 2026-10-05 07:21Z: "BL-1958 held
  00b97d11af: unowned reds bl1375+bl1678 props, unit work ratchet".
  QA's gather .worktrees/QA/tmp/BL-1958-gather.json: unit `npm test` exit 1;
  .worktrees/QA/extension/.test-durations.jsonl at 06:59:55Z: test_count
  1161, result pass, work_ms 613108, work_budget_verdict over-budget; at
  07:23:42Z: test_count 1161, result pass, work_ms 391647, ok.

  The human, specifier pane, 2026-10-05, asked how the ratchet should treat
  host load, chose "Skip under load (Recommended)".

description: |
  ## What is wrong

  BL-1599's work ratchet sums each file's wall time in npm test's report
  and fails the run when the sum exceeds 550000 ms by more than 10 percent.
  Its premise is that work is "fork-independent and stable across hosts".
  On a loaded host it is not: each file's wall time inflates with the
  machine. This host has 20 logical cores, and in .test-durations.jsonl the
  same suite has read from 209574 ms to 613844 ms. On 2026-10-05 the BL-1958
  gather failed npm test at 613108 ms with all 1161 tests green, at a
  5-minute load average near 15, and QA held the parcel on it.

  ## What is wanted

  1. A run is under host load when its 5-minute load average at the end of
     the run is at or above half the host's logical cores (10 on this
     host). Read both from `os` at decision time.
  2. Under host load, an over-budget verdict does not fail npm test: the
     work line is still printed, marked as unmeasured under host load, and
     the work exit code is 0 (scenario 01). The test exit code and the
     per-file guard's exit code are unchanged.
  3. Below the threshold, BL-1599's verdict and exit code stand unchanged
     (scenario 01's 9.9 row, invariant).
  4. Every duration record in `extension/.test-durations.jsonl` carries
     the 5-minute load average and the core count (scenario 02).

  ## How (direction, not mandate)

  - Where to read: `extension/scripts/recordTestDuration.js` lines
    225-270 (the work verdict at ~250, `workExitCode` at ~252,
    `buildRecord` call at ~254); `computeFinalExitCode` in
    `extension/scripts/testDurationRecorderLib.js` at ~60;
    `classifySuiteWork`/`formatSuiteWorkVerdict` in
    `extension/src/tools/check-suite-duration-budget.ts` at ~89 and ~133.
  - A pure function taking (verdict, load, cores) and returning the work
    exit code and the mark keeps the decision testable without a real
    load; the handler drives it with the scenario's numbers, never the
    host's real load.
  - Keep BL-1599 scenario 01 deterministic: its step classifies with no
    load input, so it must not start reading the real host load.

out_of_scope: |
  - The per-file guard (BL-1633) and its confirm-alone step: unchanged.
  - The property lane's load sensitivity: BL-1984.
  - Changing the 550000 ms budget or the 10 percent tolerance.

