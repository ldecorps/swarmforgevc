id: BL-1787
title: "A closed owner's pure-evidence or doc stray that the land step can neither cherry-pick nor prove superseded (BL-1670 grounds a/b, BL-1768 ground c) aborts the whole replay today, so a stray on paths the landing ticket never touched turns EVERY land into LAND_ESCALATE and a condition (g) hand build (BL-1657 and three more on 2026-09-20; BL-1748, BL-1764, BL-1704, BL-1766 and BL-1749 on 2026-09-26, each after a 20-40 min walk): when none of the stray's paths is one of the landing ticket's own, the step leaves it unlanded, prints LAND_STRAY_DEFERRED naming it, and still builds, verifies and records the landing ticket's own commit"
