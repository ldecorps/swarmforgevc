  AUTO-APPROVED under the 2026-09-17 operator hotfix (severity defect, no ruling_options) — see auto-approve-high-severity-defects-amendment-20260917.md.
  What the specifier measured at mint (2026-10-04, master checkout):
  - The creator-pid regex (CREATOR_PID_RE, /\brun\s+sfvc-test-(\d+)-/)
    takes the first number after "run sfvc-test-", so the random label
    cannot mislead it.
  - With creatorAlive=true the creator is the test's own process, so
    process.kill(pid, 0) succeeds; "dead" can only come from
    isProcessAlive's `ps -o stat=` call throwing (its catch reads every
    failure as "gone"), or "unknown" from creatingPidFor returning null.
  - ps honours COLUMNS: a 246-character command line read with
    `ps -eo pid=,args=` comes back 81 characters at COLUMNS=80. COLUMNS is
    not exported to any agent or vitest process seen at mint, so this is
    a demonstrated hazard, not a confirmed cause.
  - The spawner race (spawnFakeCloudflared returns the backgrounded pid
    before its exec; until then ps shows the bash -c line with "$1"
    tunnel ... run "$3", which passes the line filter and carries no pid):
    0 of 80 probes caught it, idle or with all 20 cores saturated.
  The scenarios close all three paths, so the red cannot recur through
  any of them; the review says whether one of them matches what QA saw.
  Where to read: extension/test/helpers/fixtureTunnelName.js -
  CREATOR_PID_RE at ~73, creatingPidFor ~78, isProcessAlive ~95 (it calls
  node's execFileSync directly; the selector takes an injected one at
  ~133), leakedFixtureTunnelPids ~133-152. The property test:
  extension/test/bl1287FixtureSweepScopingInvariants.property.test.js
  (invariant 1 at ~44). Fixture spawner:
  extension/test/helpers/bl1287FixtureSweepFixture.js ~28.
