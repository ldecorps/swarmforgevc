description: |
  ## What is wanted

  The leaked-fixture sweep never selects a fixture whose creating run is
  alive because of how ps showed it:

  - It reads ps command lines whole, whatever COLUMNS says.
  - A line that is a shell's -c command (a fixture's spawner before its
    exec) is not a fixture line.
  - When ps cannot be run to ask for the creator's state, the creator is
    not read as gone.

  A fixture whose creating run has exited is still selected (BL-1287
  invariant 2), and BL-1287's own property tests still pass.

  ## How (direction, not mandate)

  - `ps -ww` (or an empty COLUMNS in the child's env) for every ps the
    sweep runs.
  - Tell "ps ran and found no such pid" (exit status 1, empty output) from
    "ps could not run" (an error with a code, or a signal) in
    isProcessAlive; only the first is "gone".
  - Drive the scenarios through the selector's injected execFileSync with
    canned ps output; inject the liveness probe the same way if needed.

  ## What each stage checks

  - Coder: the four scenarios; BL-1287's unit and property tests pass.
