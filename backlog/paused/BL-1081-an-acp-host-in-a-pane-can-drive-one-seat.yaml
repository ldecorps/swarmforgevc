description: |
  ## What is wrong

  Two expensive incident families exist because pane text is the control
  channel: lossy idle detection and interactive-menu blocks. ACP gives
  stop reasons and structured permission requests. Cursor seats over SDK
  or ACP need that same structured path, or they inherit the pane traps.

  ## How (direction, not mandate)

  Build a thin ACP-host-in-a-pane for exactly one seat. Host the agent as
  an ACP subprocess over stdio. Expose stop reason and permission events
  to the deterministic layer. Prove idle detection and permission handling
  without the menu-block CRIT path. Falsifiable: if structured control
  fails, reject for our control model — that is a valid cheap outcome.

  Prefer sharing machinery with BL-713's Cursor seat driver rather than a
  third control model.

  Out of scope: replacing PromptEngine / Steward / Factory; migrating
  every Claude seat; aider.

