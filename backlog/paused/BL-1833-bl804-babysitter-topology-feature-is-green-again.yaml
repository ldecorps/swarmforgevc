approval_context: >
  No new feature file; the acceptance pointer is BL-804's existing
  feature. No choice is posed. FIRM: BL-804's feature file is not edited.
  FIRM: the half-launch CRIT names the agent the way an operator reads it
  ("NO claude process"): the fix is in production text, never a looser
  assertion. FIRM: the fixture gets a swarmforge-QA ref inside its own
  mkdtemp git root, never the live repository's (BL-1390).

invariants: []

description: |
  ## What is wrong

  Measured 2026-09-30 on main (a32c9cb5e1) with
  `node specs/pipeline/cli.js specs/features/BL-804-babysitter-mono-router-topology-awareness.feature`:
  4 of 6 ok. `backlog/standing-reds.tsv` has no data rows at all, so
  both reds are unowned.

  1. `babysitter-mono-router-topology-awareness-01` ("dormant-role
     absence is quiet on a green router sweep") fails at "the sweep
     reports OK all checks green". The sweep prints
     `UNAVAILABLE [pipeline-code-on-main] ... the swarmforge-QA ref could
     not be resolved (fails closed, never reads as clean)`. BL-631
     (cf2c2ad96a, 2026-08-19) added that check, and it fails closed on a
     root with no `swarmforge-QA` ref. The handler's fixture root
     (`bl804BabysitterMonoRouterTopologyAwarenessSteps.js`) has no git
     repository, so a green sweep is unreachable. The fail-closed
     behaviour is correct; the fixture is incomplete.
  2. `babysitter-mono-router-topology-awareness-04` ("a live dormant pane
     is still fully checked") expects
     `CRIT [proc-specifier] swarmforge-specifier: pane alive but NO claude process under it`
     and gets `NO claude  process`, with two spaces.
     `check-live-session` (`babysitterd_sweep_lib.bb`) builds the text
     from `:expected-process`. That is the argv substring from
     `agent-process-marker-lib`, which is `"claude "` with a trailing space
     so that it does not match `claude-*` binaries. Hotfix f02f6ae5b4
     (2026-08-23) started using it in the message. The operator sees the
     same padding: babysitterd.log holds 14 `NO claude  process` lines
     and none with a single space. `aider` has no padding, which is why
     the 2026-09-29 lines read correctly.

  ## What is wanted

  - BL-804's feature runs 6 of 6 on the parcel commit, with its feature
    file untouched.
  - The half-launch CRIT names the agent without the marker's padding,
    for every agent (`claude`, `aider`, `cursor-agent`, ...). The
    process match keeps using the padded marker.
  - The fixture root for scenario 01 is a `git init` under mkdtemp that
    carries a `swarmforge-QA` ref, so the pipeline-code-on-main check
    resolves and finds nothing. Prove it with `rev-parse --git-common-dir`
    before any git command mutates anything (BL-1390).

  ## How (direction, not mandate)

  - The gatherer already passes `:expected-agent` (the plain token)
    beside `:expected-process`. Building the message from that token, or
    trimming the marker, are both fine.
  - The register row this pass added names this ticket. Leave it alone:
    a parcel never edits `backlog/standing-reds.tsv` (BL-1663), and the
    land retires it (BL-1631).

  ## Scope

  `swarmforge/scripts/babysitterd_sweep_lib.bb` (message text) and its bb
  test, `specs/pipeline/steps/bl804BabysitterMonoRouterTopologyAwarenessSteps.js`
  (fixture), evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-804-babysitter-mono-router-topology-awareness.feature`:
     6 of 6 ok. Measured 4 of 6 on main at mint: 01 and 04 red as above.
  2. `node specs/pipeline/cli.js specs/features/BL-1169-babysitter-half-launch-starvation-auto-repair.feature`:
     4 of 4 ok, and
     `node specs/pipeline/cli.js specs/features/BL-1345-a-stale-router-marker-does-not-staff-a-standing-pack.feature`:
     7 of 7 ok (both measured on main at mint).
  3. `git diff <parcel>^..<parcel> -- specs/features/BL-804-babysitter-mono-router-topology-awareness.feature`
     is empty.
  4. The register row for BL-804's feature names BL-1833 on the parcel
     commit. After the land, `grep BL-804-babysitter backlog/standing-reds.tsv`
     on `origin/main` prints nothing.

