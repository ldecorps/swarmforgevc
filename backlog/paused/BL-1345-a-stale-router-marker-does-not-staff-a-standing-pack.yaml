id: BL-1345
title: "A leftover mono-router resident marker is honoured on a standing pack, so a relaunch staffs one role's pane with another role and that role is simply absent"
milestone: M8
type: defect
severity: high
# high: a live fault that silently removes a role from the swarm. Two
# relaunches on 2026-09-02 produced a duplicate coordinator and zero
# specifiers, the specifier's inbox backed up unnoticed, and a human had to
# hand-launch the session because the automatic respawn never fired. Not
# critical - nothing collapsed, no work was lost, and moving one file aside
# fixes it once you know.
status: todo
epic: swarm-reliability
priority: 6
direction: swarm-reported
assigned_to: none
depends_on: []
mutation_cost: medium
slice_size_envelope: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1345-a-stale-router-marker-does-not-staff-a-standing-pack.feature

human_approval: pending
approval_context: >
  No choice is posed - the behaviour is not in dispute and the repair is the
  implementer's, so there are no ruling_options.

  What to know before approving. `.swarmforge/mono-router-active-role` is a
  rotation-router pack's note of which role its single resident is currently
  wearing. It is meaningless on a standing pack, where every role has its own
  pane - but it survives in `.swarmforge/` after the router session that wrote
  it is gone, and a reader that does not first ask which pack is running will
  act on it. On 2026-09-02 a marker written at 11:07 reading `coordinator`
  made both of that day's relaunches staff the specifier's pane with a second
  coordinator, leaving the swarm with no specifier at all. The failure is
  quiet from every angle: seven sessions are alive, the pane looks healthy,
  and only the backing-up inbox eventually says otherwise.

invariants:
  - "Which role staffs a pane is decided by the running pack's topology; a resident marker is consulted only on a pack that declares rotation router, and never as a fallback when the topology is already known."
  - "An absent, unreadable or unknown-role marker changes staffing for no pack - it leaves the pack's own assignment standing rather than selecting a default role."
  - "No repair path may leave two live sessions for one role, or zero for a role the pack assigns a pane."

required_wiring:
  - 'specs/pipeline/steps/index.js::bl1345StaleRouterMarkerStaffingSteps::acceptance handler registered so the runner executes every scenario. Absent at spec time, grep bl1345 returns 0.'

description: |
  ## What is wrong

  `.swarmforge/mono-router-active-role` holds one word: the role a
  rotation-router pack's resident is currently wearing. Nothing clears it when
  that pack stops, so it outlives the session that wrote it.

  `swarmforge.sh`'s `resolve_and_sweep_relaunch_resume` reads it correctly -
  the whole block is inside `if [[ "$ROTATION_MODE" == "router" ]]`, so on a
  standing pack it is never consulted and `MONO_ROUTER_BOOT_ROLE` stays empty.

  `babysitter_check.bb` does not. Its sweep gather resolves
  `rotation-router?` (line 1110) and then reads
  `resident-active-role (active-role-marker)` at line 1113 **unconditionally**,
  passing it into the sweep as `:resident-active-role`, and deriving
  `:resident-mailbox-empty?` and `:dispatch-note-pending?` from it. On a
  standing pack the sweep therefore reasons about a "resident" that does not
  exist, named by a file nobody has cleared.

  ## Observed, 2026-09-02

  The marker read `coordinator`, mtime 11:07. BOTH relaunches that day (13:18
  and 16:34) produced a duplicate `launch/coordinator.sh` in the specifier's
  pane and no specifier. Recovery took a human: move the marker aside, TERM the
  duplicate, wait 60s for a chase-respawn that never logged one, then
  hand-create the session with `tmux new-session ... zsh launch/specifier.sh`.
  Moving the marker aside is what made the 18:00 relaunch staff correctly.

  ## How (direction, not mandate)

  Two independent things are wrong and either alone would have prevented this:
  the marker is read without asking which pack is running, and it is never
  invalidated when the pack that owns it stops. Fixing the read is the smaller
  and more certain change; clearing or stamping the marker at pack start is
  the belt to that brace. Both are in scope; which carries the weight is the
  implementer's call.

constraints: >
  Out of scope / firm lines:

  - Do NOT change what the marker means or does on a rotation-router pack.
    Scenario 03 is the regression guard and BL-648's boot-role resolution stays
    exactly as it is.
  - Do NOT delete the marker as a general cleanup step from a role's turn. It
    is pack lifecycle state; clearing it belongs to pack start or stop, not to
    whoever happens to notice it.
  - Do NOT hardcode a per-role expectation anywhere in the repair. BL-804's
    invariant 1 already forbids a hardcoded per-role standing list, and the fix
    must stay derived from topology.
  - Do NOT fold in the chase-respawn finding below. It is unverified and needs
    its own evidence.

qa_e2e_procedure: >
  (1) Reproduce: on a standing pack, write `coordinator` into
  `.swarmforge/mono-router-active-role`, relaunch, and confirm the pre-fix
  behaviour - the specifier's pane runs `launch/coordinator.sh` and there is no
  specifier. `ps -o cmd= -p <pane pid>` is the ground truth here, not
  `tmux list-sessions`: all seven sessions are alive either way.
  (2) Apply the fix and confirm the same marker changes nothing - every pane
  runs the role its pack assigns, exactly one session per role.
  (3) The negative case that matters most: on a rotation-router pack, a marker
  naming a known role must STILL boot the resident as that role. A fix that
  makes the marker inert everywhere has broken BL-648.
  (4) Kill one role's session on a standing pack with the stale marker present
  and confirm the repair path restaffs that pane with its own role.
  (5) Marker absent, unreadable, and naming an unknown role: staffing
  unchanged in all three, for both pack shapes.
  (6) Confirm no path can produce two live sessions for one role - that is the
  observable that was wrong on the day, and it is cheaper to assert than to
  infer from pane text.

notes: >
  Scoped after reading the live code rather than the report alone. Verified
  that `swarmforge.sh` gates its marker read on `ROTATION_MODE == router` and
  that `babysitter_check.bb:1113` does not. What is NOT claimed: that the
  babysitter read is the only staffing path, or that it is the specific one
  that mis-staffed the pane on the day. It is an ungated read of a marker that
  should not apply, which is a defect on its own terms; the parcel should
  confirm the full path rather than inherit that inference.

  Open, deliberately not minted (the evidence itself calls it unverified):
  handoffd's chase-respawn did not re-staff the missing specifier within 60s
  and logged no respawn line, so the human hand-launched. Whether respawn is
  gated on the same stale marker or simply slow is unknown. If the parcel
  answers it, say so in the evidence and a follow-up gets minted then.

  Also open from the same sweep and not part of this ticket: the
  `.swarmforge/bounce` sentinel re-armed 17:34 UTC is still unconsumed.

  IR-DRY adjudication at mint (do not re-litigate): three medium-confidence
  possible-synonym findings, all of them the phrase "the role its pack assigns
  it", which is this ticket's central concept and is meant to read identically
  everywhere. Scenario 01 asserts it over every pane at launch, 02 over one
  pane after a repair, and 05 uses its negation as a Given. Shared vocabulary,
  not drift.

  required_wiring carries the acceptance-handler pin only. The fix changes an
  already-wired read inside the babysitter's sweep gather, so any anchor on
  that file or on `rotation-router?` is satisfied before and after and would
  prove nothing (BL-1235). Saying so beats banking a meaningless green.

