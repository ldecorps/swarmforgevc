approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: the two reach floors the
  file asserts today (clean parcel seen, genuinely foreign commit seen)
  stay asserted at their value; the fix is to make both arms reached BY
  CONSTRUCTION - an outer loop over the two arms with runsPerCell draws
  each, the way BL-1578 does for its three files - never to lower a floor,
