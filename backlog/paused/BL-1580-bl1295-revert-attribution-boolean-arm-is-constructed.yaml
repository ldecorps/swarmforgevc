invariants: []

description: |
  ## What is wrong

  QA ran `npm run test:properties` on the BL-1578 parcel on 2026-09-15
  (`backlog/evidence/BL-1578-QA-unowned-red-20260915.md`, QA commit
  801d6847b8) and saw one red file BL-1578's diff never touches:
  `extension/test/bl1295RevertAttributionInvariants.property.test.js`,
  `property (invariant 2): a revert of the task's own merge never changes
  the verdict`, with

  ```
  AssertionError: generator never produced a genuinely foreign commit - the case that must still refuse
  ```

  The test draws `fc.boolean()` uniformly with `numRuns: 6` and afterwards
  asserts BOTH `seen.clean > 0` AND `seen.genuinelyForeign > 0`. Six
  uniform coin flips land all on one side 2 x 0.5^6 of the time; the
  specifier's simulation of that exact draw over 3000 fast-check seeds
  missed an arm in 94 (3.13%), the highest miss rate of any file in this
  class so far (BL-1578's worst was 1.5%). Nothing is wrong in the code it
  exercises: the gate's verdict is the same with and without the revert on
  every draw that runs. This is the BL-1062 sampled-reach-floor lottery,
  the shape BL-1555, BL-1559, BL-1572 and BL-1578 fixed in other files.
  BL-1578 was withheld by QA under Article 4.2 on it; this ticket owns it.

  ## What is wanted

  - The two arms (clean parcel, genuinely foreign commit) are iterated as
    2 cells with `runsPerCell(6, 2)` = 3 draws each, so every run builds
    both the parcel the defect breaks and the one that must still refuse.
    Nothing else about a draw changes: each draw still builds the with-
    revert and without-revert repositories and compares the two verdicts.
  - The per-arm floor is asserted through the shared `assertReachFloor`
    helper (`extension/test/helpers/reachFloors.js`) so an arm that
    stopped being produced fails the file naming that arm, and the two
    existing `seen.clean > 0` / `seen.genuinelyForeign > 0` assertions
    remain in the source at their value (scenario 03).
  - Each run prints one reach map line in the BL-1578 shape, computed
    from the counts the run actually reached, never restated:
    `BL-1580 reach map (bl1295): {"arms":2,"minDrawsPerArm":3}`.
  - The file is green alone under the properties config 15 of 15 times
    (QA e2e step 1), and this ticket's register row is removed in the
    same land that turns it green.

  ## How (direction, not mandate)

  - Outer `for` over `[false, true]`, one `fc.assert` per arm with
    `numRuns: runsPerCell(6, 2)` and the arm as a constant inside, exactly
    as BL-1578's bl622 iterates its collision arm; the per-draw body is
    unchanged. Invariant 1 in the same file is not sampled this way and
    is out of scope.
  - Each draw costs two repository builds and two bb subprocesses; the
    draw count does not change, so the file's runtime and timeout are
    untouched.
  - Documenter: nothing beyond the evidence file; no diagram trigger.

constraints: >
  Test file and evidence only; `extension/src` unchanged. No floor
  lowered, no tolerance widened, no retry, no seed pinned, the draw
  budget of 6 unchanged. The step handler lands with the feature (BL-233).

out_of_scope: |
  - Invariant 1 of the same file, and any other property file's floor.
  - The property lane's timeouts (BL-1579).

qa_e2e_procedure: |
  On the parcel commit, from `extension/`:
  1. `for i in $(seq 1 15); do npx vitest run --config vitest.properties.config.mjs test/bl1295RevertAttributionInvariants.property.test.js || echo FAIL; done`
     -> 15 of 15 green, no FAIL line, every run printing
     `BL-1580 reach map (bl1295): {"arms":2,"minDrawsPerArm":3}` (the
     printed map, not the pass count alone, is the evidence: 15 green
     runs of the unfixed file happen about 3 times in 5).
  2. Acceptance resolving all three scenarios
     (`swarmforge/scripts/run_acceptance.sh specs/features/BL-1580-*.feature`).
  3. Break-then-restore: drop the `true` arm from the iterated arms; step
     1's first run fails naming the reach floor (`reach floor: ...
     genuinelyForeign drawn 0 < 3` or `seen.genuinelyForeign > 0`,
     whichever runs first); restore.
  4. `git diff main...HEAD --name-only` names the test file, the step
     handler, the feature, evidence and the register row removal;
     `extension/src` is unchanged.
  5. `bb swarmforge/scripts/standing_red_register_cli.bb .` after landing
     reports no row for the file and `"unowned":[]`.

