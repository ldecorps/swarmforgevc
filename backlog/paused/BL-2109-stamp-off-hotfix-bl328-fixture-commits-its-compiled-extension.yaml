  On the parcel commit, ONE run (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-328-merged-code-reaches-running-daemons.feature`:
     9 of 9 ok, about 5 min (measured at mint in a scratch tree of HEAD plus
     the change: 9 of 9, 271 s).
  2. Read from the gather's unit row: bridgeServer.test.js green, with the
     hardener's poll-relay case in it.
  3. Read the coder's and the hardener's committed evidence.

