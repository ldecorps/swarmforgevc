description: |
  Status: hotfix 14698a6122 landed the fix. The coder reviews it and never
  re-applies it.

  QA held BL-2102 on 2026-10-10 (note 003967, evidence b8e913c304) on a
  red no open ticket owned: BL-328 scenario 05 ("A restart loses no
  messages in either direction") failed at "When the affected processes
  are restarted to pick up new code" with "sync failed: error: git archive
  failed: fatal: pathspec 'extension' did not match any files".

  Cause: BL-2065 (1b86f77b89, 2026-10-08) made safe_recompile_lib.bb build
  from `git archive <main-sha> -- extension`. The scenario's fixture
  (specs/pipeline/steps/mergedCodeReachesDaemonsSteps.js, mkGitRoot +
  copyRealCompiledExtension) copied a compiled extension/out into the
  fixture root but never committed it, so the archive found nothing.

  The hotfix, in that step file only:
  1. copyRealCompiledExtension now commits extension/out (`git add -f`,
     node_modules left out since the lib links it in itself) and moves
     main and swarmforge-QA to that commit. The archive then carries the
     compiled tree, and the swap puts a whole out/ back, not an empty one.
  2. With the archive fixed, the scenario reached its last step and failed
     "fetch failed": the second /events connect ran before the bridge the
     restart respawned was listening. connectAndCollect now goes through
     fetchEventsWhenListening, which retries a refused connection every
     200 ms for up to 15 s and then rethrows.
  3. With that, a full run failed "expected no further delivery of an
     already-acked entry" (one isolated run passed). Cause, production:
     extension/src/bridge/bridgeServer.ts seeds its in-memory emittedIndex
     from the persisted cursor ONCE, at start. An ack that lands after the
     new bridge started (the restart's bot racing it) leaves emittedIndex
     behind, so the next poll tick re-sends the acked entry to every
     client, and a freshly started bot has no dedup memory of it: a
     duplicate Telegram reply. The poll now relays from
     Math.max(emittedIndex, readPersistedCursor(targetPath).ackedIndex).
     Connect-time redelivery (BL-320) still starts at the persisted
     ackedIndex, so nothing unacked is skipped.

  The review asks: can the 15 s retry hide a real failure, a restart that
  never brings the bridge back? It cannot pass one: past the deadline the
  original fetch error is thrown and the step stays red. And is the max()
  ever above an entry that is not yet acked? It is not: the cursor only
  advances on an ack of the entry at its position.

  The hardener adds a unit case for the poll relay (an ack written after
  the bridge started is not re-sent on the next tick) and runs Stryker on
  bridgeServer.ts scoped to the poll relay.

