description: |
  ## Status: hotfix 35a8448e4c landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  The iq3 coder worked BL-1929 on a line that also held BL-1851's work,
  and resolved a suite-manifest.tsv merge conflict on it. BL-1929's land
  (fd4c492d3b, a tip-pure replay) took suite-manifest.tsv whole and
  published the row `local_seat_tuning_report_lib_test_runner.bb
  standing`, which is BL-1851's (its commit 4afccb0400 adds the row and
  the runner). BL-1851 has not landed, so main named a runner it lacks,
  and run_bb_suite.sh failed with MISSING. BL-1830 exists to stop exactly
  this, and its feature still passes.

  ## What the hotfix changed

  The row is removed from main's manifest. BL-1851's land brings the row
  back with its runner.

  ## What the coder checks

  The hotfix against the description and the invariant, then why BL-1830's
  guard let the row through: was the row inside BL-1929's own diff (the
  merge resolution), or is BL-1851's line invisible to the guard because
  it is in flight rather than queued to land? Evidence:
  backlog/evidence/BL-1953-coder-<date>.md. A guard gap goes to the
  specifier as a note; it is not built in this parcel.
