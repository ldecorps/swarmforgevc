acceptance: specs/features/BL-1433-a-branch-that-holds-the-landed-commit-is-not-behind.feature

human_approval: pending
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. This is the coordinator's
  "BL-1421 not suppressing" report, diagnosed in the daemon log and the
  library before minting: BL-1421 works as specified, and the specification
  had a hole - its "caught up" test is vacuous for a branch that already
  holds the landed commit, which is what every role branch looks like once
  it has merged main and started its own work. The hole is the specifier's
  own (BL-1421's scenarios all say "the role's HEAD still lacks A"). The
  fix is small and lives in the sweep library plus one new fact from the
  daemon; asking the coordinator to promote it on the expedite lane now.

invariants:
  - "A role whose HEAD contains the landed commit is never told it is behind, whatever else its worktree holds: the sweep surfaces only work the role must merge up, and a branch that is merely ahead has nothing to merge."
  - "divergent-branch means exactly HEAD lacks the landed commit and cannot fast-forward to it; for that case BL-1421's standing surfacing holds unchanged (told once, until the role's HEAD gains the commit it was told about) and BL-1361's every-reason-told contract holds unchanged."
  - "An unanswerable containment fact never produces a note: when the supplier cannot read the role's HEAD or the landed commit, the role is skipped with a logged reason for that cycle, the same posture the sweep already takes for a missing ref."

required_wiring:
  - 'swarmforge/scripts/handoffd.bb::contains-landed?::the daemon fact supplier answers whether the landed sha is an ancestor of the role HEAD, the fact decide-role needs; absent today (grep returns 0)'
  - 'specs/pipeline/steps/bl1433BranchHoldsLandedCommitSteps.js::registerSteps::the handler file exists so discovery registers every scenario (BL-1371)'

description: |
  ## What is wrong

  Coordinator note 2026-09-05T12:31Z: "BL-1421 not suppressing: 10x dup
  branch-behind notes to architect, ~50s apart". Traced the same hour:

  - `handoffd.log` shows, every ~50 s cycle since 12:26Z:
    `post-qa-branch-sweep-surfaced <role> branch cannot fast-forward to
    landed commit` then `post-qa-branch-sweep-told <role> divergent-branch
    deferred`, for cleaner, architect, hardender and documenter. 61 notes
    reached their inboxes between 12:19Z and 12:34Z (15, 15, 14, 17),
    every one reading "branch behind abb209f4f1: branch cannot fast-forward
    to landed commit - merge up". The daemon had restarted at 12:19:08Z,
    after BL-1421 landed at 12:13Z, so this is BL-1421's code running as
    written.
  - The architect's branch is 17 commits ahead of origin/main and 0 behind:
    it already contains the landed commit and carries its own parcel work.
    `post_qa_branch_sweep_lib.bb` `decide-role` reaches its last branch for
    it (not in-process, not dirty, `can-ff?` false) and surfaces
    `:divergent-branch`. Then `surface-already-recorded?` asks
    `caught-up-to-told?` - `git merge-base --is-ancestor <told-sha> HEAD` -
    which is TRUE, because HEAD contains the landed commit it was told
    about. So the record never blocks a re-tell, and `record-surface!`
    rewrites the same record with the same sha every cycle.
  - BL-1421's own scenarios all begin "the role's HEAD still lacks A"; the
    case where HEAD already holds A and is simply ahead was never written,
    so the fix did what it promised and this case fell through.

  ## What changes

  - A new fact from the daemon's supplier, `contains-landed?`: the landed
    sha is an ancestor of the role's HEAD (`git merge-base --is-ancestor
    <landed> HEAD` in the role's worktree, the same primitive `can-ff?` and
    `caught-up-to-told?` already use).
  - `decide-role` checks it right after the missing-ref and already-settled
    checks, before in-process and dirty: a role whose HEAD contains the
    landed commit is `{:action :holds-landed}` - logged, never surfaced,
    never told, never woken - whatever its worktree holds (invariant 1).
    "Merge up" is a no-op for it; dirtiness or in_process work there is the
    parcel, not lateness.
  - `:divergent-branch` is then reachable only for a HEAD that lacks the
    landed commit and cannot fast-forward (invariant 2). For it BL-1421's
    suppression is meaningful again: the role is told once and then not
    until its HEAD gains the told sha.
  - An unreadable containment fact is a logged skip for the cycle
    (invariant 3), never a tell.
  - `surface-reason-text` and the note wording are unchanged; nothing
    about fast-forwarding, waking or the state file's shape changes.

  ## How (direction, not mandate)

  - The supplier: one more key in `post-qa-branch-sweep-role-facts!`
    (handoffd.bb ~4041), `:contains-landed? (and head landed
    (git-is-ancestor? wt landed head))`; the library reads it in
    `decide-role` with `nil` meaning unanswerable.
  - Scenarios 01, 02 and 04 are pure: reuse `bl1421OneStandingSurfacingSteps`
    fixture shapes (state maps and a facts map per role); 04 replays twenty
    cycles the way BL-1421 scenario 04 replays 103 landed commits.
  - Scenario 03 drives the real supplier against a `git init` fixture with a
    bare origin under mkdtemp; prove the root with `rev-parse
    --git-common-dir` before any mutating git command (BL-1390).
  - BL-1361 scenario 03's "a divergent branch" row and BL-1421 scenario 01's
    row stay valid: their fixtures describe a HEAD that lacks the landed
    commit. If a fixture supplied no containment fact, give it the fact
    rather than reading absence as "contains"; absence must never silence
    a real tell (invariant 3 is about an unREADABLE fact, not an absent
    fixture key - the coder states which in the evidence).

  ## Out of scope

  - Waking policy (BL-1361 ruling) and the standing-surfacing state shape
    (BL-1421).
  - Anything about the land walk (BL-1431, BL-1432).

qa_e2e_procedure: |
  1. The BL-1433 feature passes (four scenarios, six runs); BL-668, BL-1361
     and BL-1421 features still pass; `post_qa_branch_sweep_lib_test_runner.bb`
     passes.
  2. Live, after land and one handoffd restart: over fifteen minutes,
     `grep -c post-qa-branch-sweep-told .swarmforge/daemon/handoffd.log`
     for the current window is 0 for every role whose branch is ahead of
     origin/main and 0 behind (`git -C .worktrees/<role> rev-list --count
     HEAD..origin/main` is 0), and the log shows the holds-landed skip for
     them instead. Before this ticket the same window showed one told line
     per role per cycle.
  3. Make one role branch genuinely divergent in a throwaway clone (a
     commit on the branch and a different commit on the clone's main, the
     branch lacking it): the sweep tells it once and not on the next cycle.

notes: |
  Minted 2026-09-05 by the specifier on the coordinator's note (verbatim in
  description), diagnosed from `handoffd.log`, the coordinator's sent
  folder (the sweep speaks as the coordinator), the architect worktree's
  ahead/behind counts, and the library's `decide-role`,
  `surface-already-recorded?` and the daemon's `caught-up-to-told?`. The
  specifier owns the hole: BL-1421's scenarios only described a HEAD that
  lacks the landed commit.

  Until this lands: the notes are told, not woken, so no turn is spent on
  them; roles clearing their inboxes should complete them with
  `done_with_current.sh` reading each one (BL-1422 pending), never blind.
  No conf switch silences this sweep; a hotfix of `decide-role` is the
  human's call if the flood must stop before the parcel lands.

  INVEST at mint: Independent (BL-668, BL-1361, BL-1421 landed), Negotiable
  (fact name and action keyword are direction), Valuable (one outcome: a
  role is told only when it has something to merge), Estimable (one fact,
  one branch in decide-role, one handler; low), Small (four scenarios, six
  runs, three invariants at the cap), Testable (pure state fixtures plus
  one git fixture; live step in qa_e2e_procedure).

