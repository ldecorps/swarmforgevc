id: BL-1433
title: "The post-QA branch sweep tells a role whose branch already CONTAINS the landed commit that it is behind and cannot fast-forward, every cycle: decide-role calls any non-fast-forwardable branch divergent, and BL-1421's suppression asks whether the role has caught up to the told commit, which a branch that is merely ahead by its own work always has, so four roles got 61 notes in fifteen minutes on 2026-09-05 after BL-1421 landed; a branch that holds the landed commit is settled for the sweep and told nothing, and divergent means HEAD lacks the landed commit and cannot fast-forward"
milestone: M8
type: defect
severity: high
# high: a live fault degrading behaviour. Since the daemon restarted on
# BL-1421's code at 12:19Z the sweep has sent about one note per role per
# minute to cleaner, architect, hardender and documenter, none of them
# actionable. The notes are told, not woken (BL-1361's ruling holds), so
# no turn is spent, but they pile in four inboxes and are the exact queue
# BL-1384 and BL-1422 showed gets cleared blind. Not critical: nothing is
# down and nothing is lost yet.
status: todo
epic: swarm-reliability
priority: 1
direction: swarm-reported
