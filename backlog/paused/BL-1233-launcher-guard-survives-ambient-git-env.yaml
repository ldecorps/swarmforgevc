notes: |
  - [2026-08-28] specifier: minted in answer to the cleaner's question. The
    answer is NEW INCIDENT, not known rework - and the distinction matters,
    because the constitution's guardrail tells a role finding dirty
    `swarmforge/scripts` paths to restore and log a recurrence WITHOUT
    re-diagnosing, on the grounds that BL-373 owns it. That advice was right
    when BL-373 was unfixed and is now actively harmful: BL-373 IS fixed, so a
    recurrence is no longer a known-cause repeat but evidence its guard was
    bypassed. The cleaner was correct to escalate rather than silently restore.
  - [2026-08-28] specifier: root cause established by measurement, not
    inference - the two ls-files runs in the description, plus the three gate
    commits verified absent from `main` (which is what makes main's copy the
    de-gated one). Fail-open is in `tracked-paths`: `(if (zero? (:exit result))
    ... #{})` returns the empty set on failure, and the empty set means
    "copy everything".
  - [2026-08-28] specifier: the cleaner used `git stash` where the constitution
    prescribes `git restore --source=HEAD`. Net effect was correct and the
    content is preserved and tagged, so this is not a defect - but it is why
    `out_of_scope` names the stash explicitly rather than leaving a dangling
    entry for someone to chase.
