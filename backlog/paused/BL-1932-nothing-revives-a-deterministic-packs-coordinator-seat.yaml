description: |
  ## What is wrong

  With the seat gone at launch (BL-1931), the keep-alive paths treat its
  absence as a fault (census group B): `swarm_ensure.bb`'s `ensure-role!`
  respawns it from whatever launch script exists without checking;
  `mono_router_lib.bb` counts the resident and the coordinator as standing,
  so `topology-action` restores it; babysitterd raises `pane-coordinator`,
  escalates to the operator every 30 minutes and repairs it. A stale
  `.swarmforge/launch/coordinator.sh` exists on this host (the launcher never
  deletes launch scripts), so the seat would be back within ~10 minutes of
  boot.

  ## What is wanted

  On such a pack, ensure, the router topology and babysitterd skip the
  coordinator seat entirely; ensure exits zero and its report has no
  FAILED/FIXED coordinator line.

  ## How (direction, not mandate)

  - `should-have-standing-session?`, `should-stand-role?` and
    `(ensure-role! (str "agent:" role)` receive only role names today; the
    pack mode has to reach them (read once per run).
  - Step handler: specs/pipeline/steps/bl1932NothingRevivesTheCoordinatorSeatSteps.js.

  ## What each stage checks

  - Coder: the four scenarios; test_swarm_ensure.sh,
    mono_router_lib_test_runner.bb and babysitterd_sweep_lib_test_runner.bb pass.
  - Architect: the two invariants; ensure's launch-contract gate
    (launch_contract_lib) still behaves on a deterministic pack.
  - Hardender: hand-mutant pass on the three skips (BL-472 fallback recorded).
  - Documenter: any how-to describing ensure/babysitter coordinator repair.

qa_e2e_procedure: |
  1. `node specs/pipeline/cli.js specs/features/BL-1932-nothing-revives-a-deterministic-packs-coordinator-seat.feature` passes 4 of 4.
  2. `bash swarmforge/scripts/test/test_swarm_ensure.sh`, `bb swarmforge/scripts/test/mono_router_lib_test_runner.bb` and `bb swarmforge/scripts/test/babysitterd_sweep_lib_test_runner.bb` pass.

