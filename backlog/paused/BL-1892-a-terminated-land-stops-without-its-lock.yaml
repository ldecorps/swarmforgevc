approval_context: >
  The coder's proposal from reviewing BL-1890 (source). FIRM: a land sent
  TERM or INT releases the lock and exits non-zero (143 or 130) without
  pushing; during the post-land re-point it finishes the re-point first,
  so no branch is left half-moved (the operator's 2026-10-01 lesson about
  killing a land mid re-point). Medium severity, so it waits for you.

invariants:
  - "A land never pushes or re-points after it has released the land lock."

source: |
  Coder note 002334 (2026-10-02 12:17Z), from its review of BL-1890's
  stamp-off, verbatim: "BL-1890: TERMed land runs on lockless; propose exit
  143 except mid re-point".

description: |
  ## What happens today

  `run_land` and `run_push` in `land_main_publish.sh` set
  `trap land_release_trap EXIT INT TERM`. `land_release_trap` releases the
  lock if held and returns, so on INT or TERM bash resumes the script after
  the handler: the land goes on to push and re-point with no lock held. The
  re-point runs inside a command substitution, so a TERM sent only to the
  land's own process already waits for it to finish; a TERM sent to the
  whole process group also kills the re-point mid-way.

  ## What is wanted

  - On INT or TERM: release the lock and exit non-zero, never push after
    the signal (scenario 01).
  - During the post-land re-point: finish the re-point, then release and
    exit, including when the signal goes to the whole process group
    (scenario 02).
  - The EXIT path and every existing BL-1366 check behave as today.

  ## How (direction, not mandate)

  - A distinct INT/TERM trap that records the signal; release and exit at
    once outside the re-point, and after it inside.
  - Step handler `specs/pipeline/steps/bl1892TerminatedLandStopsSteps.js`,
    fixture repo with a bare origin under mkdtemp (BL-1390), the same shape
    as test_bl1366_land_is_one_command.sh. Signal the land itself (exec, the
    BL-1890 lesson), and the process group for scenario 02.

  ## Scope

  `land_main_publish.sh`'s traps, its shell test, the step handler,
  evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1892-a-terminated-land-stops-without-its-lock.feature`:
     2 of 2 ok. Measured 0 at mint: no handler exists.
  2. `bash swarmforge/scripts/test/test_bl1366_land_is_one_command.sh`:
     every check PASS (rc 0 at mint).
  3. BL-1366 and BL-1872 features green.

