id: BL-1757
title: "A target's Telegram front desk and Cursor Remote bridge start from the tooling root's compiled tools - a pack conf may name the swarmforgevc checkout that serves it (config tooling_root <abs path>), swarmforge.sh exports it as SWARMFORGE_TOOLING_ROOT, and launch_front_desk.sh and start_cursor_bridge.sh resolve their node entrypoints there while still serving the target; a project with its own extension/out and no tooling root resolves exactly as today, and neither is refused naming both places looked"
milestone: M8
type: defect
severity: high
# high: a live swarm's human-facing health channel is down - gpu-bargain-
# hunter (onboarded 2026-09-25, its own Telegram bot provisioned for phone
# monitoring, BL-380/381) runs with no front desk and no /rc because both
# launchers look for $ROOT/extension/out, which only swarmforgevc has.
status: todo
