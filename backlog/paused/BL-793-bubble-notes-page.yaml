notes: |
  ## e2e procedure for QA

  With a live swarm and a paired Bubble build:

  1. Expand the Bubble from a cold start. Confirm it opens on Let's Talk.
     Repeat after having previously swiped to Notes and after having sent a
     note — confirm it still opens on Let's Talk every time.
  2. Swipe to Notes and back. Confirm both directions work and that the pager
     dots track the current page.
  3. Open the role picker. Confirm it lists exactly the roles in
     `.swarmforge/roles.tsv`, including roles with no running session. Add or
     remove a role from the running pack and confirm the picker follows.
  4. Send a short note to a dormant role. Confirm the parcel lands in that
     role's `inbox/new/`, that the text box clears, that the same role stays
     selected, and that the confirmation names the role.
  5. Enter an over-budget message, then one containing a line break, then an
     empty one. Confirm each is refused on the device with a stated reason and
     that no request reaches the bridge.
  6. Point Bubble at a bad token, then at a stopped bridge. Confirm the page
     states the reason in each case rather than a bare code, and that neither
     reports the note as queued.
  7. Confirm no amend or withdraw control is present anywhere on the page.
