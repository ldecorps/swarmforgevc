description: |
  ## What

  Turn the expanded Bubble into a two-page horizontal pager. Page one is Let's
  Talk, unchanged and still the default. Page two is **Notes**: a role picker
  at the top, a short text box, one big Send, and pager dots so the human can
  see which page they are on.

  Send calls BL-790's `POST /agent-notes`. This slice adds no server behaviour.

  ## The human's locked decisions this slice implements

  From `backlog/INTAKE-bubble-send-notes-swipe-screen.md`, 2026-07-31 — the
  intake says *"do not silently drop these without asking"*:

  - **1. Navigation.** Horizontal pager; page one Let's Talk, page two Send
    notes; swipe left or right between them.
  - **2. Default.** The expanded Bubble opens on Let's Talk. Never on Notes.
  - **3. Agent set.** The picker lists every declared role, awake or not.
  - **5. Layout.** Picker at top, short text box, one big Send. After Send:
    clear the box, keep the same role selected, show a brief confirmation
    naming the role.
  - **7. Page dots.** Small pager dots so talk vs notes is obvious.
  - **9. Note length.** Short, in the spirit of the mailbox note limit.

  Decision 5's *"under that: pending list with Amend and Remove"* is
  deliberately NOT in this slice — it is slice C. Scenario 07 asserts those
  controls are absent, so the boundary is checkable rather than merely
  intended.

  ## Approach

  1. **Pager, not a new Activity.** The human asked for a swipe inside the
     expanded panel, not a separate screen off the main navigation. Let's Talk
     keeps its current behaviour as page one; do not restructure it beyond what
     hosting it in a pager requires.

  2. **The role list comes from the swarm's roster, not from Kotlin.** Read it
     from the bridge (`GET /agents`, already authenticated and already derived
     from `.swarmforge/roles.tsv`). A role list re-declared in Kotlin will
     drift the first time the pack changes. Dormant roles are offered exactly
     like awake ones.

  3. **The message limit is re-asserted on the device.** BL-790's endpoint
     enforces it, but the human should see the constraint while typing rather
     than discover it as a rejection. Refuse empty messages, over-budget
     messages, and messages containing a line break, stating which rule was
     broken — before any request goes out.

  4. **Failures state a reason.** Unreachable host, rejected token and a
     refused queue write read differently. Reuse `BridgeClient`'s existing
     friendly-failure mapping; a bare status code is never the whole message.

  5. **Put the message validation, the roster parsing and the pager's
     default-page rule on the pure-logic side of BL-769's JVM seam**, so
     scenarios 01, 03 and 05 are covered by real unit tests rather than a
     manual procedure. That is the whole reason this ticket depends on BL-769.

  ## Out of scope

  - The pending list, amend, and withdraw (slices C and D).
  - Any change to the bridge, including BL-790's endpoint contract.
  - Any change to Let's Talk's own behaviour beyond hosting it as page one.
  - Send-to-all-roles broadcast (locked decision 8).
  - Additional pager pages — the other Bubble screen intakes describe
    "complementary swipe pages later"; this slice establishes the pager, it
    does not populate it.

approval_context: >
  This slice is new — it is the device half of what you approved this morning
  as one bundled ticket. Splitting it out is what lets the bridge half (BL-790)
  proceed now instead of waiting on BL-769's Android test seam.


  Everything here is your own locked decision from the 2026-07-31 intake, so
  there is little of mine to sign off. The two calls that are mine:


  (1) **The pending list is not in this slice.** Your locked layout puts it
  under the Send button, so this page will look incomplete until slice C lands.
  I kept it out because the pending list needs a read model that does not exist
  yet, and bundling it would make this ticket large by this repo's own p90
  measure (BL-634). Tell me if you would rather wait and get the whole page at
  once.


  (2) **Depends on BL-769.** Without the JVM unit seam this ticket's acceptance
  contract would run zero scenarios — which has already happened on five
  shipped Android tickets. If you want the Notes page sooner, the honest
  options are to expedite BL-769 or to accept a manual-procedure-only contract
  for this slice. Tell me which.

