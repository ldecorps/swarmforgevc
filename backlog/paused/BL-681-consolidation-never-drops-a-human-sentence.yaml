description: |
  ## The whole change

  One clause added to the constitution's amendments article, plus a citation
  from `specifier.prompt` back to it so the role that exercises the authority
  points at the law rather than restating it.

  Draft wording:

  > **A consolidation never drops a human sentence.** When intakes or tickets
  > are merged, split, or otherwise reshaped before entering the pipeline,
  > every directive quoted from a human survives verbatim into the resulting
  > ticket or tickets. A consolidation that cannot preserve one is refused,
  > not trimmed.

  ## Why law and not prompt

  BL-680 grants the specifier the power to rewrite the shape of its own
  inputs. The guarantee that the human's words survive that rewrite should not
  live in the same document as the power — and should not evaporate the day
  the authority moves to another role. A rule in `specifier.prompt` reaches
  the specifier; a rule in the constitution reaches whoever consolidates next.

  ## Why it is human-gated

  Article 5.1: a constitutional change is ratified by an explicit human
  decision. This ticket therefore ships `human_approval: pending` and stays
  paused until you rule — deliberately, and per the intake's own instruction
  that it must never be folded silently into the role parcel.

acceptance: specs/features/BL-681-consolidation-never-drops-a-human-sentence.feature.draft

out_of_scope: |
  - The consolidation mechanics themselves (N:1, 1:N, the epic-top-priority
    pass, the caps). BL-680, shipping independently of this ruling.
  - Any other constitutional change. One clause, deliberately tiny.
  - Enforcement tooling. This slice states the law; nothing here builds a
    checker for it.

notes: |
  Sequenced after BL-680 (`depends_on`) so the clause lands next to the
  authority it constrains rather than ahead of it. If BL-680 ships and this is
  rejected, the never-drop rule still holds as a role obligation — BL-680
  states it in specifier.prompt as well, and its own invariants list carries
  it. What a rejection costs is reach: it stops binding a future consolidator
  that is not the specifier.

  Gherkin parked as `.feature.draft` per BL-233; the coder promotes it and
  wires handlers in the same commit.
