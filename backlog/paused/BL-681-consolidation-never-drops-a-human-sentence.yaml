source: |
  Drained from `.swarmforge/operator/INTAKE-specifier-consolidation-authority.md`
  (2026-07-26), whose layering addendum answers the human's own question
  "faut-il l'inscrire dans sa constitution?" verbatim:

  > **Constitutional law (`constitution/articles/`)**: ONE clause qualifies —
