description: |
  ## What is wanted

  At nine or ten panes a phone grid has five rows of two. Each tile then
  shows its whole head, role name, model label, ticket id, both clamped
  slug lines and age, with nothing cropped. The brief's arithmetic: a
  700px viewport less the ticket strip leaves about 126px a row, and the
  head needs about that today (16px 12px padding, a 10px gap, five text
  lines); a shorter phone has less. `.pane-col` is overflow hidden, so
  what does not fit is cut off.

  ## How (direction, not mandate)

  Extend the crowded step the page already has. BL-609's `.pane-count-7`
  and `-8` rules (BL-1858 added `-9`/`-10` to them) step down only
  `.pane-title` and `pre`, which a grid tile does not show. Add `-9`/`-10`
  rules for `.pane-head` (tighter padding and gap) and for
  `.pane-grid-model`, `.pane-grid-ticket-id`, `.pane-grid-slug` and
  `.pane-grid-age` (one font step down), as added selectors or a sibling
  rule, never by changing a value one to eight panes use.

  ## The values scenario 02 pins

  Census of extension/src/bridge/residentSpyUiHtml.ts at main 0eb5958ab6
  (`grep -nE 'pane-head \{|pane-grid-(model|ticket-id|slug|age)|pane-count-[78] (pre|\.pane-title)' -A4`):
  `.pane-head` padding `16px 12px` and gap `10px`; `.pane-grid-model` and
  `.pane-grid-ticket-id` font-size `clamp(9px, 3.2vw, 11px)`;
  `.pane-grid-slug` and `.pane-grid-age` font-size `clamp(8px, 2.8vw,
  10px)`; the seven- and eight-pane `.pane-title` at 11px and `pre` at
  `calc(var(--pane-font-size) - 2px)`. "Smaller" for a clamp means its
  minimum and maximum both drop. The handler reads the page
  getResidentSpyUiHtml returns (extension/out/bridge/residentSpyUiHtml,
  as BL-609's handler does), never a copy of the CSS.

qa_e2e_procedure: |
  1. `node specs/pipeline/cli.js specs/features/BL-1921-a-nine-or-ten-tile-phone-grid-shows-every-tiles-full-head.feature` passes.
  2. Send the art-director a sign-off note naming the parcel commit. It
     checks the Live tab on a phone (or a 390px-wide emulated view) with
     nine seats staffed: every tile shows its age and both slug lines, and
     an eight-seat grid looks as it did. Approve on its LGTM; a defect list
     routes per Article 4.3.

