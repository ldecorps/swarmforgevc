invariants:
  - "A property test carrying a declared invariant must be falsifiable: breaking the code path the invariant names turns that property red."
  - "The property's generator reach and splitTelegramChunks's own boundary stay related by construction - the property keeps crossing the boundary when TELEGRAM_MESSAGE_MAX_LENGTH changes, with no second literal to keep in sync by hand."

human_approval: approved
approval_context: >
  One open decision, with a recommendation. The ticket offers two fixes:
  generate longer strings against the real 4096 default, or pass a small
  maxLen so ordinary lengths split. Recommendation is the second - it keeps
  the property fast and, more importantly, removes the second number
  entirely, so nothing drifts when TELEGRAM_MESSAGE_MAX_LENGTH moves. Driving
  the real default with 12000-char inputs re-introduces exactly the pair of
  hand-related literals that caused this. What is firm: scenario 02 - the
  property must go red against a multi-chunk branch that loses a character;
  a fix that only widens the generator without demonstrating falsifiability
  does not close this ticket. What is negotiable: which of the two fixes,
  and how the deliberate break in scenario 02 is staged.
source: |
  Found during BL-723 (pilot-tonight quality review), architect viewpoint
  pass, 2026-07-30. BL-718 declares the invariant "Mirror delivery is
  length-independent: a reply of any length reaches the Bubble topic
  complete and in order, or fails loudly — length alone never silently
  truncates or drops a transcript." Per BL-654, the coder authors a
  property test encoding a declared invariant.

  `extension/test/cursorBridgeLive.property.test.js` does carry
  `property: splitTelegramChunks reassembles without loss for short
  strings`, but its generator is `fc.string({ maxLength: 200 })` against
  `splitTelegramChunks`'s real default boundary
  (`TELEGRAM_MESSAGE_MAX_LENGTH = 4096`,
  extension/src/tools/telegramCursorBridgeCore.ts:26). Since 200 < 4096,
  `text.length <= maxLen` is true on every generated run, so
  `splitTelegramChunks` takes its early-return branch (`return [text]`) on
  every single property run — the multi-chunk split/rejoin loop the
  invariant is actually about never executes. Proof of vacuousness: a
  deliberately broken multi-chunk branch (e.g. dropping the first
  character of `remaining` after a split) would leave this property fully
  green.

  Not a live production risk: `extension/test/telegramCursorBridgeCore.test.js`
  independently covers the multi-chunk case with real examples (line ~496,
  `'a'.repeat(5000)` at the true 4096 boundary asserting `chunks.join('')`
  reassembles losslessly, plus newline-boundary and byte-limit edge cases).
  This is a rigor gap in the declared-invariant property-test contract, not
  a behavior bug.

notes: |
  BL-723 architect verdict on BL-718: not-on-par (independent finding,
  additional to the coder's already-filed acceptance-wiring gap: BL-726/727).
  Linked pilot-process defect: BL-739.

notes: |
  2026-08-22, specifier: re-verified LIVE at HEAD and given an acceptance
  contract. cursorBridgeLive.property.test.js:53 still generates
  fc.string({ maxLength: 200 }) and calls splitTelegramChunks(text) with no
  maxLen, against TELEGRAM_MESSAGE_MAX_LENGTH = 4096
  (telegramCursorBridgeCore.ts:26). The early return `if (text.length <=
  maxLen) return [text]` therefore fires on all 80 runs and the split loop
  never executes. Confirmed vacuous, exactly as filed.

  The contract deliberately makes FALSIFIABILITY the acceptance signal
  (scenario 02), not merely a wider generator: a generator change alone can
  still be vacuous, and this ticket exists because a green property proved
  nothing.

description: |
  ## What

  Fix the generator in `extension/test/cursorBridgeLive.property.test.js`'s
  `splitTelegramChunks` property so it actually reaches the multi-chunk
  branch, e.g. either:

  - Generate strings long enough to cross the real default boundary
    (`fc.string({ maxLength: 12000 })` against the real 4096 default), or
  - Parameterize `maxLen` down to a small value the way the example-based
    tests already do (`splitTelegramChunks(text, smallMaxLen)`), so
    reasonable string lengths still exercise splitting.

  Either way, assert on the ACTUAL invariant claim across the generated
  range: lossless, order-preserving reassembly (`chunks.join('') === text`
  after undoing the newline-trim the splitter performs, or an equivalent
  order-preserving check) AND every emitted chunk's length within the
  configured `maxLen`.

  ## Acceptance

  - The property test fails when run against a deliberately broken
    multi-chunk branch (verify with a throwaway break-then-fix pass, per
    this project's non-vacuous-property-test discipline), then passes
    again against the real implementation.
  - `npm run test:properties` stays green.

qa_e2e_procedure: |
  From extension/, against the committed parcel:

  1. Baseline the vacuity claim on the PRE-fix code: in a scratch checkout,
     edit splitTelegramChunks's multi-chunk branch to drop the first
     character of each continuation (remaining.slice(1) after the split), then
     run `npm run test:properties`. The chunking property must stay GREEN -
     that green is the defect. Restore.
  2. Run `npm run test:properties` on the parcel. It must pass, and the
     property lane output must carry no Unhandled Error / Unhandled Rejection
     other than the known benign vitest-worker onTaskUpdate timeout.
  3. Repeat step 1's deliberate break against the PARCEL's property. It must
     now go RED and name a losing input. This is scenario 02 and is the
     acceptance signal for the whole ticket; restore afterwards.
  4. Confirm scenario 01 directly: instrument or assert that at least one
     generated input produced more than one chunk in a normal run. A run in
     which every input returned a single chunk fails this ticket even if
     every assertion passed.
  5. Confirm no hand-related literal was introduced: change
     TELEGRAM_MESSAGE_MAX_LENGTH in a scratch checkout and re-run the
     property. It must still cross the boundary without any second constant
     being edited. Restore.
  6. Re-run extension/test/telegramCursorBridgeCore.test.js; its existing
     example-based multi-chunk coverage must stay green.
