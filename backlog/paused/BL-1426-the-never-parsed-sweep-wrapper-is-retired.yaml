  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. One decision is stated so you can
  Amend it: the wrapper is RETIRED, not repaired. The repair is one
  character, but the file has never worked, nothing calls it, BL-668's own
  contract has no scenario for it, and it carries a second copy of the
