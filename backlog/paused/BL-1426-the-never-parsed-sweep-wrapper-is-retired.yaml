description: |
  ## What is wrong

  `swarmforge/scripts/post_qa_branch_sweep.bb` (BL-668, f5b6b49f1f,
  2026-08-26) fails to read: `role-facts` closes `(zero? (:exit (sh! ...)))`
  but never closes the `(and head ...)` around it, so the reader meets the
  map's `}` with a `(` still open:

      Unmatched delimiter: }, expected: ) to match ( at [41 17]

  A pure reader pass over every `.bb` directly under `swarmforge/scripts`
  on 2026-09-05 found exactly this one unreadable file out of 286. It has
  been so since the commit that created it. Nothing noticed because:

  - nothing runs it. Its only caller is its own shim
    `post_qa_branch_sweep.sh`; no cron, operator recipe, test or manifest
    row names either. The live sweep is `handoffd.bb`, which load-files
    `post_qa_branch_sweep_lib.bb` and supplies its own facts
    (`post-qa-branch-sweep-role-facts!`, `handoffd.bb` ~4029-4052).
  - BL-1395's load guard never reached it: its whole-tree loop is drained
    by an earlier stdin-reading script and stops at file 107 of 286
    (BL-1427). The per-commit guard landed on 2026-09-04, after this file.
  - BL-668's feature has five scenarios, all driven through the acceptance
    seam `test/post_qa_branch_sweep_cli.bb`; none names the wrapper.

  The wrapper is also a duplicate. Its `role-dirty?`, `role-in-process?`
  and `role-facts` restate the daemon's private supplier line for line.
  BL-1421 (active) adds a `caught-up-to-told?` fact to the daemon's
  supplier; a repaired wrapper would then run a sweep that re-tells every
  role, the very defect BL-1421 fixes.

  ## What changes

  - Delete `swarmforge/scripts/post_qa_branch_sweep.bb` and
    `swarmforge/scripts/post_qa_branch_sweep.sh`.
  - `docs/how-to/BL-668-post-qa-deterministic-branch-sweep.md`: remove the
    "Manual invocation" block under "When it runs" and the "CLI wrapper" row
    of the Modules table; one sentence records that the wrapper was retired
    on 2026-09-05 (this ticket) and that `handoffd` is the only runner.
    `docs/reference/Specification.MD` line ~4052 drops the wrapper from the
    BL-668 module list. `docs/index.md`'s how-to line needs no change.
  - The documenter checks the diagram registry: `swarm-flow.mmd` depicts
    the daemon's sweep, not the wrapper, so no diagram trigger fires.

  ## How (direction, not mandate)

  - Scenario 02 is a reader pass, not a load: read each file form by form
    with a pushback reader and report the file and message on the first
    exception; evaluate nothing (a load would run entry calls, which is
    BL-1427's business). It is the cheap whole-tree check the load guard's
    drained loop could not give, and it stays green as long as no script is
    unreadable.
  - Scenario 03 looks for a fenced code line invoking
    `post_qa_branch_sweep.bb` or `post_qa_branch_sweep.sh`, never the bare
    file name: the retirement sentence in the how-to may name it.
  - `retires:` declares the three BL-668-owned paths so the task-scope gate
    admits deletions and doc edits from this ticket.

  ## Out of scope

  - The load guard's drained loop and executed entry calls (BL-1427).
  - Any change to the daemon's sweep, the lib, or their tests (BL-1421).
  - A deduplicated shared fact supplier for a future manual entry point;
    if one is ever wanted it is minted after BL-1421 lands and built on the
    lib, not on a copy.

qa_e2e_procedure: |
  1. The BL-1426 feature passes (three scenarios); BL-668's feature still
     passes all five scenarios unchanged.
  2. At the parcel commit: `git ls-files swarmforge/scripts | grep -c
     post_qa_branch_sweep` is 2 (the lib and its test-dir seam are not in
     scope; the wrapper and shim are gone) - concretely the survivors are
     `post_qa_branch_sweep_lib.bb` under scripts/ and, under scripts/test/,
     `post_qa_branch_sweep_cli.bb` and `post_qa_branch_sweep_lib_test_runner.bb`.
  3. `git diff <received>..<parcel> --stat` touches neither `handoffd.bb`
     nor `post_qa_branch_sweep_lib.bb` nor its test runner (invariant 1).
  4. `bb swarmforge/scripts/test/post_qa_branch_sweep_lib_test_runner.bb`
     passes; the how-to's "When it runs" section has no fenced command.
  5. After land, on main, the reader pass of scenario 02 run by hand over
     `swarmforge/scripts/*.bb` reports 0 unreadable.

