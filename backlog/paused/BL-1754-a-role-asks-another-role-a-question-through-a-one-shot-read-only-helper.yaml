id: BL-1754
title: "A role with a question for another role asks it through a one-shot read-only helper that answers and exits - bb swarmforge/scripts/peer_question.bb --from <role> --to <role> --question <text> runs the target role's own prompts as one print-mode Claude call with file-reading tools only, prints the answer, records the question and answer, and never claims a parcel, drains an intake, starts a tmux session or outlives its answer; a target seat on any other provider is refused by name"
milestone: M8
type: feature
status: todo
epic: local-llm-swarm
priority: 20
direction: human-directive
depends_on: []
mutation_cost: medium
# medium: a bb CLI (no mutation/CRAP/DRY wired for Babashka, BL-472) whose
# risk is process handling - a bounded child, killed with its group on
