invariants:
  - "A registry row whose owner is the ticket being landed does not survive that land: after the replay commit is built, no row in backlog/standing-reds.tsv, swarmforge/scripts/property_suite_standing_allowlist.tsv or backlog/suite-poles.tsv names the landing ticket as owner (an accepted pole row excepted)."

description: |
  ## What is wrong

  A standing-red row is meant to leave "in the same land that turns the
  test green" (register header, BL-1428). Nothing makes that happen:
  the parcel's author may forget (BL-1623's parcel carried both its rows
  to QA's tip untouched, and QA approved against its own e2e step 5),
  or a tip-pure replay may keep origin/main's whole registry blob when
  the path is entangled with unlanded siblings (BL-1613's replay carried
  no register change at all). BL-1604 (landed 2026-09-17) fixed the
  other direction - a land must not DROP another open ticket's row it
  carries whole from the tip - and its mechanism is exactly the shape
  this needs: `rows-to-restore` (pure) and
  `restore-other-tickets-registry-rows!` (orchestrator) over
  `registry-specs` in `land_step_lib.bb` (~1620-1700), run in the replay
  build (~1941), printing `REGISTER_ROW_RESTORED` lines.

  Same day, three times: BL-1605 (10:04, its row kept by a hand-resolved
  merge), BL-1613 (13:14, its replay carried no register change), BL-1623
  (16:44, parcel never removed its rows). Each read `unowned` in
  `standing_red_register_cli.bb` within minutes, the coordinator throttled
  intake to one (BL-1429), sent the specifier a note, and the specifier
  retired the row by hand (9c56a9bc50 for BL-1613, this pass for
  BL-1623). A land that cannot close its own row is a land that trips the
  swarm's own safety signal.

  ## What is wanted

  - `rows-to-retire` (pure): from a registry's data lines, the rows whose
    owner is task-ticket-id - both the replay tree's own copy and any row
    origin/main carries that the replay tree would restore (scenario 01
    drives it on fixture lines for all three registries, including the
    accepted-pole exception).
  - The orchestrator drops those rows from the replay tree's registry
    files in the same pass that restores other tickets' rows, and the CLI
    prints `REGISTER_ROW_RETIRED <registry> <file> <owner>` per row
    (scenario 02, the real land step on BL-1604's fixture shape).
  - BL-1604's behaviour unchanged: a row for another OPEN ticket that the
    tip lacks is still restored (scenario 03 - the BL-1604 case re-pinned
    beside the new one).
  - `standing_red_register_cli.bb .` on the replay commit reports no
    unowned row for the landing ticket.

  ## How (direction, not mandate)

  - `rows-to-retire [{:keys [lines owner-fn task-ticket-id accepted?-fn]}]`
    beside `rows-to-restore`; `registry-specs` gains a `:retirable?` (false
    for an accepted pole row, BL-1629's disposition, when that column
    exists); the orchestrator filters the replay file's lines through it
    before appending restored rows, so a retired row cannot be restored
    back.
  - `land_step_cli.bb` prints the retired lines from the plan next to the
    restored ones (`:register-retired`).
  - bb runner cases in `land_step_lib_test_runner.bb` beside BL-1604's;
    the acceptance handler reuses BL-1604's fixture builder.
  - Documenter: `docs/how-to/BL-1241-entangled-tip-at-the-land-step-has-a-reachable-remedy.md`
    and the register header sentence ("leaves in the same land") gain the
    mechanism; QA.prompt's grep sentence (landed with this mint) points
    here.

constraints: >
  land_step_lib.bb (one pure function, one orchestrator change),
  land_step_cli.bb (one print), the bb runner, the feature and handler,
  evidence and docs. No change to BL-1604's restore rule, to any
  registry's format beyond reading BL-1629's disposition when present, or
  to the standing-red reader. The step handler lands with the feature
  (BL-233). Evidence named BL-1631-*.

out_of_scope: |
  - Deciding whether the test is green: QA's approval is the precondition
    (Article 4.2 already forbids approving over a red the parcel owns).
  - The hand-land route (a push from a worktree, 1bcfa2ba45's shape) -
    it runs no land step; QA.prompt's grep sentence is the only stop there.
  - Rows owned by closed tickets that were never landed through this
    step (today's three are retired by hand already).

qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `bb swarmforge/scripts/test/land_step_lib_test_runner.bb` -> green,
     the retire cases and the BL-1604 restore cases both present.
  2. Acceptance resolving all scenarios
     (`bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1631-*.feature`)
     and BL-1604's feature still resolving.
  3. Live, on this ticket's own land: THIS ticket has no register row, so
     add none; instead the land of the next ticket that owns a row (any
     standing red whose owner is in flight) prints REGISTER_ROW_RETIRED
     for it and `standing_red_register_cli.bb .` reports no unowned row
     after the close - recorded by QA in the first such land after this
     one, cited by ticket id in this ticket's done notes.

