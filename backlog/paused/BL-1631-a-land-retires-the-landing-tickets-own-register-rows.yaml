  column is the landing ticket are retired; a row owned by any other
  ticket is untouched, and BL-1604's restore of other OPEN tickets' rows
  is unchanged (a regression pin is scenario 03). FIRM: retirement is
  printed, never silent - one REGISTER_ROW_RETIRED line per row, in the
