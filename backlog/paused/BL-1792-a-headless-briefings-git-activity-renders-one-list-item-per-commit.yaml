description: |
  ## What is wrong

  Art Director brief, 2026-09-28
  (`docs/design/briefs/2026-09-28-headless-briefing-wall-of-text.md`, on
  `swarmforge-art-director` at `3d8d7563c7`; lands on `main` through the
  BL-1444 path, QA on the art director's note, not with this parcel).
  Reviewed on the real send path (`render-markdown-to-html` then
  `render-briefing-html`) over the real 2026-09-27 briefing at ~390 px:

  > the composer emits each git log line as its own line of plain text
  > with no leading `- ` bullet marker and no blank line between entries
  > [...] CommonMark collapses consecutive non-blank lines with no bullet
  > syntax into a single paragraph, so the rendered email's "Recent git
  > activity" section is not a list at all - it is one unbroken `<p>` of
  > ~30 commit messages run together with single spaces [...] On a ~390px
  > phone mail client this is an unreadable wall of text.

  Measured at mint (2026-09-28) by rendering `docs/briefings/2026-09-27.md`
  through `markdown-to-html-lib/render-markdown-to-html`: 5 `<p>` elements,
  0 `<li>` elements, longest paragraph 17,316 characters. The "Backlog
  counts" section folds the same way: `<p>active: 7 paused: 118 done: 903</p>`.
  The brief scopes the git section; the counts are the same helper and
  the same fix.

  Cause: `compose-banked-briefing` (`swarmforge/scripts/banked_briefing_lib.bb`)
  joins `git-activity-lines` and `daemon-health-lines` through
  `lines-or-fallback` as bare lines, and writes the three count lines
  bare too. `markdown_to_html_lib.bb` treats a line as a list item only
  when it starts with `- ` (`list-item-line?`), so bare consecutive lines
  become one paragraph run. Both live callers (`handoffd.bb`
  `compose-and-write-banked-briefing!`, `compose_banked_briefing_cli.bb`)
  pass already-formatted strings and are not the site of the defect.

  ## What is wanted

  Intended result, from the brief: "each git log line in a headless-
  composed briefing appears as its own visually separated line in the
  sent email - either a real Markdown list (`- <line>` per commit, one
  `<li>` per commit, consistent with the existing bulleted-list handling
  and the BL-1442 bold-ticket-id rule) or, at minimum, a hard line break
  the renderer preserves per source line."

  - Every line-per-entry section the composer emits (Recent git activity,
    Backlog counts, Daemon health) is a Markdown list: one `- ` item per
    entry, so the existing list renderer yields one `<li>` per commit and
    per count. Scenarios 01-03.
  - An empty section still prints its fallback line (scenario 04);
    whether the fallback is itself a list item is the coder's call, the
    scenario asserts only that the text is present.
  - Nothing outside the composer changes (invariant).

  How (direction, not mandate): prefix each entry with `- ` inside
  `lines-or-fallback` (or a sibling helper applied at the three sites);
  the count lines can go through the same helper as a three-element
  vector. `banked_briefing_test_runner.bb` and the BL-308 handler only
  substring-match the lines, so they stay green; extend the runner with
  the list-item assertion rather than leaving it to the feature alone.

  Note on BL-1442: a git activity item opens with the commit id, not a
  ticket id, so the bold-leading-id rule will not fire on these items.
  That is correct and not in scope; the brief's "consistent with" is met
  by the items being real `<li>` elements.

  ## Scope
  - `swarmforge/scripts/banked_briefing_lib.bb` (the composer only).
  - `swarmforge/scripts/test/banked_briefing_test_runner.bb` (new
    assertions).
  - The feature file and its step handler
    `bl1792HeadlessBriefingListItemsSteps`, registered in
    `specs/pipeline/steps/index.js` in the same commit as the feature
    (BL-233). The handler drives the real composer and the real renderer
    through a bb harness, the same drive as
    `bl1442BriefingListItemLeadingIdBoldSteps` (`briefing_email_harness.bb`)
    and `bankedBriefingHeadlessSteps`; a new harness under
    `swarmforge/scripts/test/` is fine if the existing ones do not expose
    the composer's inputs.
  - `docs/design/artifact-inventory.md` row 1: the documenter records the
    follow-up the same way the BL-1442 entry is recorded, once the brief
    is on `main`.

  ## Not in scope
  - `markdown_to_html_lib.bb`, `briefing_email_lib.bb`: they render lists
    correctly today (BL-1419).
  - The ordinary coordinator/documenter-composed briefing (prose with
    headers; the brief spot-checked 2026-09-20 and it is unaffected).
  - Why two headless briefings shipped with no art-director sign-off: the
    art director recorded that in its own evidence (tip 7052ebcc42).
  - Landing the brief itself: BL-1444's path (art director notes QA).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1792-a-headless-briefings-git-activity-renders-one-list-item-per-commit.feature`:
     5 of 5 (four scenarios, the outline has two rows).
  2. `bb swarmforge/scripts/test/banked_briefing_test_runner.bb`: passes,
     and its output names the new list-item assertion.
  3. `node specs/pipeline/cli.js specs/features/BL-308-banked-mode-headless-briefing.feature`
     and `specs/features/BL-1641-a-ceremony-at-its-briefing-deadline-produces-a-briefing-before-the-stop.feature`:
     measured at mint on main 2026-09-28: BL-308 8 of 8 in 4 s, BL-1641
     4 of 4 in 15 s. Expect the same on the parcel; record both verdicts.
  4. Surface check, the brief's own test: `bb
     swarmforge/scripts/compose_banked_briefing_cli.bb <scratch-root>
     2026-09-28` on a scratch clone with 30 commits, render the file
     through `markdown-to-html-lib/render-markdown-to-html`, and confirm
     30 `<li>` elements and no `<p>` longer than one commit line. Attach
     the rendered HTML to the evidence; the art director answers QA's
     sign-off note with LGTM or a defect list (Article 1.10).
  5. `git diff main...HEAD --name-only` names only banked_briefing_lib.bb,
     its test runner, the feature, the handler, its registration, any new
     harness, the inventory row and evidence; markdown_to_html_lib.bb and
     briefing_email_lib.bb are absent.

