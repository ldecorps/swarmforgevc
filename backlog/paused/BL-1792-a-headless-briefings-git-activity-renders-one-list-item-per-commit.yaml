id: BL-1792
title: "A headless closing-ceremony briefing's Recent git activity is one 17,316-character paragraph in the sent email: the composer emits bare lines with no list marker, CommonMark folds them into a single <p>, and a phone reader cannot see where one commit ends; the composer emits one Markdown list item per entry (Art Director brief 2026-09-28)"
milestone: M8
type: defect
severity: medium
# medium: a real, contained defect in a human-facing artifact. Every
# headless-composed briefing (several nights a week per docs/briefings/.sent.json,
# most recently 2026-09-26 and 2026-09-27) ships unreadable on the phone; no
# safety signal is broken and no data is lost. Not a standing red.
epic: art-direction
priority: 8
depends_on: []
mutation_cost: low
# low: Babashka has no mutation/CRAP/DRY wired (BL-472); the change is one
