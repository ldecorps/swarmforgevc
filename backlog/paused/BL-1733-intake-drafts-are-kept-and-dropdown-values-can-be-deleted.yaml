description: |
  ## What is wanted

  - **Drafts** are kept by the bridge host, several at once
    (`.swarmforge/operator/intake-drafts/`, for example, following the
    `.swarmforge/operator/*.json` stores the other Mini App routes keep).
    They are listed when the form opens, and each can be resumed exactly as
    left or discarded. Values added to a draft stay in that draft until
    Submit (BL-1732), so discarding the draft drops them.
  - **Delete**: each dropdown value has a Delete that asks for a confirm.
    A confirmed delete removes the value from the shared vocabulary,
    committed through the same path as Submit. A cancelled one changes
    nothing. A submitted intake is a file already written and is never
    touched. An open draft keeps its value even after the value leaves the
    list.

  ## Scope

  - The form page and its routes (BL-1732's modules).
  - The drafts store; the vocabulary store's delete.
  - `specs/features/BL-1733-...feature` + the pinned handler.
constraints: >
  No browser storage in the page (Architecture rule 3). A delete is a
  vocabulary commit, never an edit of any INTAKE file or draft. Renaming
  or merging values stays out of scope (intake v1).

out_of_scope: |
  - Verify and Ask (BL-1734..BL-1737).
  - Renaming or merging vocabulary values (intake v1 out of scope).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1733-intake-drafts-are-kept-and-dropdown-values-can-be-deleted.feature`:
     all ok (6 of 6).
  2. Live at phone width: start two drafts, close the form, reopen it.
     Both are listed and each resumes as left. Discard one that added an
     actor: a fresh draft does not offer that actor.
  3. Delete a seeded value you will restore by hand afterwards, first
     cancelling and then confirming. It stays after the cancel and leaves
     later drafts after the confirm. An intake that used it still reads
     it. Restore the value.
  4. `git diff main...HEAD --name-only` names only the Scope files, the
     feature, the handler, docs and evidence.

