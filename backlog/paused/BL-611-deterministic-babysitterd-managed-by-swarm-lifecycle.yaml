id: BL-611
title: "Productize babysitterd — the deterministic health-sweep daemon replaces the LLM babysitter hawk, managed by start/stop-swarm like the other daemons, nudging the coordinator with CRIT findings"
milestone: M8
type: defect
status: todo
epic: swarm-reliability
human_approval: approved
severity: high
priority: 05
direction: human-requested
depends_on: []
assigned_to: specifier
mutation_cost: medium
approval_context: >
  Hydrate batch 2026-07-28: materializes the already-approved prose acceptance
  (A-G, 1-7 with 6b/6c/6d) into APS Gherkin, unchanged in substance; the
  runtime-fold design question is answered per the 2026-07-25 operator ruling
  already recorded in this ticket's description.

invariants:
  - "No check raises a CRIT while the swarm is verifiably making progress. Every finding is a claim about absence, so each one must be false whenever a live, checkable signal of work exists — a busy pane, an actively-worked claim, a recent commit. A sweep that cries wolf is worse than no sweep: it trains its only reader to dismiss it, which is how a real starvation gets ignored."
  - "The sweep is read-only apart from the coordinator nudge line. It observes and reports; it never respawns, moves a parcel, answers a menu, or sends any other keystroke — including on the paths that detect a wedged or menu-blocked pane."

source: |
  Human, 2026-07-24 (operator rc session): "can you write a script that performs
  a routine health check. make that script be called periodically (use an
  existing daemon? or create a new one). and have that script nudge the
  coordinator with its finding. that's the behaviour I was trying to get the
  babysitter role to do but never managed to get it right." Then, after the
  operator built and started a live prototype: "yes. babysitterd should be
  managed by the start and stop swarm scripts, like the other daemons. but yes
  this has to be documented and otherwise digested by the swarm."

  A WORKING PROTOTYPE EXISTS and is running on the Linux box right now:
  `.swarmforge/operator/babysitter_check.sh` + `.swarmforge/operator/babysitterd.sh`
  (gitignored operator layer — see the operator memory note
  babysitter-daemon-deterministic-health-sweeps). This ticket ports that
  prototype into the repo properly: tests, lifecycle wiring, runbook.

description: |
  ## Problem

  The existing babysitter (`swarmforge/scripts/start_babysitter.sh` — Telegram
  topic + LLM + wake runtime) is an LLM agent asked to do deterministic work.
  The human's verdict after multiple attempts: it never behaved right. Health
  checking is not judgment work — every check it should perform is a mechanical
  predicate over processes, files, and pane state. An LLM adds cost, latency,
  and nondeterminism to a job a shell script does reliably.

  Meanwhile the operator layer has independently accumulated exactly those
  predicates as hard-won memory lessons (futex-hang, pane_current_command lies,
  menu blocks, OOM spirals, dead-letters). The prototype encodes them.

  ## Shape — port the prototype, don't reinvent it

  A deterministic sweep script + a small loop daemon, in swarmforge/scripts/,
  managed by the SAME lifecycle as the other daemons:

  - `start_ancillary_services.sh` starts babysitterd where it currently starts
    the LLM babysitter (the `SWARMFORGE_SKIP_BABYSITTER=1` env skip carries
    over unchanged); `stop_ancillary_services.sh` / `stop-swarm.sh` stop it;
    `kill_all_swarm.sh` includes it in the nuclear path (pidfile signal, same
    pattern as handoffd's `signal_pid_file`). `./swarm ensure` gains a
    `babysitter` component that verifies pid-alive and restarts if not
    (same posture as the rc:<role> component).

  - THE AGENT-BASED BABYSITTER IS FULLY RECYCLED INTO THIS — not optional,
    not behind a flag. Human ruling 2026-07-24 (follow-up): "recycle existing
    babysitter as a swarm role into this daemon based solution, so that there
    is no confusion. babysitter as an agent based solution was not a good
    idea." One babysitter exists after this ticket: the daemon. The name
    "babysitter" refers ONLY to it.

  ## Recycle inventory (surveyed 2026-07-24; the old hawk is already DEAD —
  ## launcher pid dead, `.swarmforge/babysitter/stop` marker since Jul 22)

  SALVAGE (deterministic parts, already pure + test-covered — reuse, do not
  rewrite):
  - `swarmforge/scripts/babysitter_assess_lib.bb` (+ its test runner) — pure
    BL-528 claim-progress risk scan (role heading for bounce/halt with HEAD
    unchanged). Fold in as sweep check #11; its wake-enqueue consumer goes away,
    the finding routes through the same CRIT/WARN nudge contract as the rest.
  - `swarmforge/scripts/babysitter_nudge_lib.bb` (+ test runner) — reuse
    whatever fits the typed-coordinator-nudge path; drop the LLM-wake parts.

  REMOVE (the agent layer — the part that "was not a good idea"):
  - `swarmforge/roles/babysitter.prompt` — the role prompt; no babysitter role
    exists after this ticket.
  - `babysit.sh` (repo root) — the hawk on/off wrapper.
  - `swarmforge/scripts/start_babysitter.sh` — LLM launch (Telegram topic +
    claude session + wake runtime); superseded by the daemon start.
  - `swarmforge/scripts/babysitter_enqueue_wake.sh` and the wake-runtime path
    in `babysitter_lib.bb` — no LLM to wake.
  - `extension/src/tools/notify-babysitter.ts` — Telegram babysitter-topic
    notify; out of scope for the daemon (findings go to log + coordinator).
  - References in `ancillary_provider_lib.sh`, `telegram-front-desk-bot.ts`
    (+ its core/test), `start-swarm.sh`/`stop-swarm.sh` help text — update to
    the daemon; front-desk must not offer to launch an agent babysitter.
  - Runtime state `.swarmforge/babysitter/` — the daemon uses the pidfile/log/
    state layout from the prototype; specifier picks the final dir name, but
    stale hawk state must not be mistaken for daemon state.

  ## Sweep checks (from the running prototype — keep all eight)

  1. tmux session + live claude process per role pane (via `ps --ppid`, never
     `pane_current_command` — it lies with a live child)
  2. `--remote-control` flag present on each live process (RC health signal)
  3. handoffd + supervisor alive AND handoffd.log fresh (< 5 min) — catches the
     futex-hang where the process is alive but the ensure loop is dead
  4. `.swarmforge/handoffs/failed/` dead-letter box non-empty
  5. stuck `inbox/in_process/` parcels > 30 min — INCLUDING worktree mailboxes
     (`.worktrees/*/.swarmforge/handoffs/`), master's alone is a false negative
  6. pane blocked on an interactive menu/dialog — REPORT ONLY, never pick an
     option (standing playbook rule)
  7. busy-but-frozen pane: busy footer present but spinner-stripped content
     hash unchanged across 3 consecutive sweeps
  8. available-memory floor (orphaned vitest/stryker OOM lesson)
  9. rotate-note-not-honored — newest completed parcel carrying a rotate
     instruction (rotate_to_role.sh <role> / "Rotate to <role>"), older than a
     grace period (10 min), whose target != `.swarmforge/mono-router-active-role`
     => CRIT naming the parcel, expected vs actual persona, and the remediation.
     SUPPRESSION RULE (live-validated fix, 2026-07-24 02:59Z): fire ONLY when
     the note is NEWER than the active-role file's mtime — if the persona
     changed after the note completed, the note was honored or overtaken and
     comparing it to the CURRENT persona is a false positive (observed: an
     honored QA note re-alarming for 1h while the swarm legitimately rotated
     through architect/hardender; one spurious coordinator nudge sent 02:30Z).
     LIVE-VALIDATED 2026-07-24: caught starvation #2 (parcel 000741 dequeued and
     marked completed, rotate never executed) on the sweep after the original
     8 checks read all-green through it; the nudge landed and the coordinator
     engaged. This is the dominant real failure class observed — instructions
     acknowledged but not acted on — and it is fully decidable from disk.
  10. swarm-starved — active tickets present, zero pending AND zero in_process
     parcels across master + worktree mailboxes, and NO pane showing a busy
     footer, sustained for 2 consecutive sweeps (streak state; single-sweep
     idle never fires — orchestration pauses are normal) => CRIT.
     SUPPRESSOR RULE (live-validated fix, 2026-07-24 06:20Z): "pending" counts
     ONLY recent parcels (<=120 min) and NEVER abandoned/ (terminal, like
     failed/). Observed: five abandoned/stale strays (one from six days prior
     in a worktree inbox/new/) held pend>0 permanently, suppressing the check
     through a real 1-hour starvation the sweep read as all-green. Fixture:
     a starved snapshot plus only stale/abandoned parcels MUST still fire.

  The claim-progress risk scan salvaged from babysitter_assess_lib.bb becomes
  check #11.

  PLANNED-PAUSE AWARENESS (added to prototype 2026-07-24 13:27Z, with BL-617):
  the sweep reads `.swarmforge/operator/control-pause.json` first. While a
  pause is ACTIVE (human timed-pause or BL-617 nightly cooldown), the
  starvation-class checks (9, 10) are SUPPRESSED — planned quiet is not
  starvation. Conversely, check #12: an active pause whose untilMs expired
  >15 min ago = CRIT resume-overdue (the auto-resume sweep failed; the swarm
  would sleep past its window). Both behaviours fixture-tested in the port:
  paused snapshot => no starved/rotate findings; expired-active snapshot =>
  resume-overdue fires.

  ## Nudge contract (the part the LLM version got wrong — pin it in Gherkin)

  - Only CRIT findings nudge the coordinator; WARN/OK stay in the log.
  - Nudge = a typed message + Enter into the coordinator pane (typed messages
    submit; remote-app draft overlays do not — verified 2026-07-24).
  - Deduped per finding-key with a cooldown (default 30 min) so a persistent
    condition nudges once, not every sweep.
  - If the coordinator pane/process is down, log NUDGE-SKIP — never nudge into
    a dead pane, never fall back to acting on the swarm itself.
  - The babysitter NEVER fixes anything: no respawns, no menu picks, no parcel
    moves. It observes and reports. Judgment stays with the coordinator/human.

  ## Engineering shape (testability boundary)

  Finding assembly is a PURE function: given a snapshot struct (sessions,
  processes, file listings/ages, pane captures, meminfo) it returns the
  findings list (key, severity, message) and the nudge decision (which
  findings, given dedup state + now). Unit tests drive that pure core with
  fixtures — no tmux, no fs, no sleep. The gathering layer (tmux/ps/find) and
  the loop daemon are thin I/O wrappers per the CLI thin-wrapper rule.

  ## Documentation ("digested by the swarm")

  - Runbook: what babysitterd checks, what a nudge looks like, how to
    start/stop/ensure it, where the log and state live, and the env skip.
  - The coordinator's prompt/constitution articles get one line so the
    coordinator KNOWS what a "babysitter health sweep:" message is and that it
    is a trusted deterministic report, not a hallucination to re-verify from
    scratch.
  - Note in the operator docs that the operator-layer prototype is superseded
    once this lands (the operator stops its private copy).

  ## AMENDED 2026-07-25 (operator): remove the LLM babysitter AGENT outright

  Operator: *"il faut virer les traces de l'ancien babysitter as an agent."*

  Context that makes this urgent rather than tidy. Restarting the stack on
  2026-07-25 showed `./swarm status` reporting `babysitter-runtime DOWN` — for the
  RETIRED LLM hawk, which `.swarmforge/swarm.env` deliberately skips
  (`SWARMFORGE_SKIP_BABYSITTER=1`, comment: "cost > value for this project"). The
  daemon that actually works, the deterministic script, is wired into no start path
  at all and had to be relaunched by hand from a line that exists only in the
  operator's memory notes.

  So the status line reports DOWN for something deliberately absent, and reports
  nothing about the one that is doing the work. That is a broken health signal, which
  is why this is repriced `severity: high` / `priority: 05` — same family as BL-637.

  ### Removal set — verified by inspection, five files

  ```
  babysit.sh                                       root entry point: "always-on hawk", the LLM
  swarmforge/scripts/start_babysitter.sh           wrapper -> launch_babysitter.sh
  swarmforge/scripts/launch_babysitter.sh          spawns the claude session (14 agent refs)
  swarmforge/scripts/babysitter.claude-settings.json   its model/effort
  swarmforge/roles/babysitter.prompt               its role prompt
  ```

  Not a pipeline role in any pack — `grep babysitter swarmforge/packs/*.conf` is
  empty, so no pack conf changes and no roles.tsv row.

  ### Callers that must be updated in the same parcel

  ```
  swarmforge/scripts/start_ancillary_services.sh:72-78   the SKIP gate + start call
  swarmforge/scripts/stop_ancillary_services.sh          references start_babysitter.sh
  swarmforge/scripts/swarm_ensure.bb:~341                gates ensure on SKIP_BABYSITTER
  swarmforge/scripts/babysitter_runtime.bb:126-128       "llm-down relaunching" -> dead path
  ```

  ### KEEP — this is where the specifier must not over-delete

  These are DETERMINISTIC and are what this ticket builds on. Zero agent references
  by inspection:

  ```
  babysitter_assess_lib.bb + babysitter_assess.bb    pure claim-risk scan (BL-528)
  babysitter_lib.bb, babysitter_nudge_lib.bb
  babysitter_nudge_resident.bb, babysitter_enqueue_wake.sh
  4 test runners under swarmforge/scripts/test/
  ```

  ### The load-bearing design question

  `babysitter_runtime.bb` exists TO WAKE THE LLM — its `scan-claim-risks!` produces
  wake events, and at `:126-128` it relaunches the agent when the LLM is down. With
  no agent, that consumer disappears. The specifier must decide, not assume:

  - **(a)** retire the runtime too, folding its BL-528 claim-risk scan into the
    ported deterministic check, so there is ONE sweep; or
  - **(b)** keep the runtime and repoint its findings at the coordinator nudge path
    directly, so there are two sweeps with distinct duties.

  (a) is simpler and matches "one deterministic sweep"; (b) preserves tested code.
  Either is defensible — what is not defensible is deleting the agent and leaving a
  runtime whose only purpose was to feed it.

  ### `SWARMFORGE_SKIP_BABYSITTER` semantics must flip with the port

  Today it means "skip the expensive LLM hawk", and `.swarmforge/swarm.env` sets it
  with the reason "cost > value". After the port it would mean "skip the free
  deterministic sweep" — so an operator inheriting that `swarm.env` silently disables
  the new daemon too. The parcel must either rename the slot or state the new meaning
  and flag the stale `swarm.env` line in the runbook.

  ### Also needs classifying, not silently deleted

  `backlog/topics/BABYSITTER.json` (a durable Telegram topic record) and
  `extension/src/tools/notify-babysitter.ts`. Both may serve the deterministic daemon
  just as well as the agent. Specifier's call.

  ## OPERATOR RULING 2026-07-25 (second): "il faut eradiquer l'agent babysitter -
  ## c'est maintenant un demon"

  This settles the design question this ticket left open, and it settles it in favour
  of **one sweep, not two**.

  `babysitter_runtime.bb` exists to WAKE THE LLM — its `scan-claim-risks!` produces
  wake events, and at `:126-128` it logs `llm-down relaunching` and respawns the
  agent. With the agent gone, its consumer is gone. The operator's phrasing — the
  babysitter IS now a daemon — means option (a): **retire the runtime too, folding its
  BL-528 claim-risk scan into the ported deterministic check.** Do not keep a second
  sweep alive whose only original purpose was feeding something that no longer exists.

  What must NOT be lost in that fold: the claim-risk scan itself is real, tested
  behaviour (reclaim counts, HEAD-unchanged detection, untracked-file counts) and its
  test runners must keep passing against whatever absorbs it.

  ## RETYPED `feature` -> `defect`, and the reasoning is auditable

  Found while checking whether the operator's priority ruling would actually take
  effect: it would NOT have. The Article 3.2.4 expedite lane selects
  `type: defect` with critical/high severity. As a `feature` at `priority: 05`, this
  ticket sat outside the lane entirely despite being repriced `high` — the ruling
  would have been silently inert.

  Retyped because the defect is genuine, not to game the lane:

  - The only working health sweep **does not survive a reboot** and must be restarted
    from a line that exists in operator memory notes, not in the repo.
  - `./swarm status` reports `babysitter-runtime DOWN` for the deliberately-retired
    LLM agent while reporting **nothing** about the deterministic daemon actually
    doing the work. A health signal that names the absent thing and hides the live one
    is broken, not merely incomplete.

  Both were demonstrated by the 2026-07-25 restart. The productization is the FIX for
  that defect; it is not new scope wearing a defect label. Stated here so a reader can
  disagree with the reclassification rather than discover it.

  ## Not urgent, and that matters for sequencing

  The agent is ALREADY inert — `.swarmforge/swarm.env` sets
  `SWARMFORGE_SKIP_BABYSITTER=1`, so every launch skips it. Eradication is hygiene
  with a real health-signal defect attached, not an incident. It rides the pipeline
  properly rather than being hand-applied.

acceptance: specs/features/BL-611-deterministic-babysitterd-managed-by-swarm-lifecycle.feature
out_of_scope: |
  - Any auto-remediation (respawns, parcel moves, menu picks). Observation and
    coordinator nudges only — by design, per the human's division of labour.
  - Telegram/topic surfaces for findings (the old hawk's notify path). If
    wanted later, separate ticket.
  - The operator rc's semantic pane-analysis loop (reading what agents SAY,
    lost-rotation forensics) — that stays LLM/operator work, not this daemon.
  - Windows/mac portability beyond the current Linux swarm host.

notes: |
  ## Amended 2026-07-27 (specifier) — operator intake folded in, not split out

  Operator intake `INTAKE-babysitter-starved-false-positive-narrow-pane.md`
  (filed 2026-07-26) reported two compounding bugs in the PROTOTYPE's check 10.
  Dispositioned as an amendment to this ticket (new acceptance 6d + the first
  invariant) rather than as its own ticket, for a reason worth recording:

  **The prototype is not in git.** `.swarmforge/operator/babysitter_check.sh` and
  `babysitterd.sh` are untracked and gitignored (`.gitignore:4 .swarmforge/`), and
  nothing in the repo invokes them — verified by exhaustive grep, the only hits
  are prose references in this ticket and BL-653. A standalone defect ticket
  would therefore have been unbuildable: the coder cannot commit a change to an
  untracked file, and QA cannot verify it at a commit. THIS ticket is the moment
  that logic becomes tracked and testable, so it is the only place the fix can
  land without being written twice.

  That also makes the amendment cheap: the port has not started (status todo,
  paused, no feature file yet), so there is no in-flight parcel and no worktree
  staleness — the constitution's mid-flight amendment protocol does not apply.

  Scope is unchanged in spirit: this ticket already said "port the prototype,
  with tests", and acceptance 3 already required each check to be tested "firing
  AND STAYING QUIET". 6d supplies the two staying-quiet shapes that were proven
  live, which 3 asserted in the abstract and 6c did not cover for check 10.

  The intake left the busy-detection fix approach explicitly to the specifier;
  6d passes that choice through to the implementer rather than mandating one,
  because the right answer depends on what the ported capture path looks like.
  The BEHAVIOUR is fixed; the mechanism is not.

  Supporting criteria the Gherkin does not pin (design/documentation, not
  runtime behaviour):

  - The runtime question (fold `babysitter_runtime.bb`'s claim-risk scan into
    the ported check, option (a)) is answered in the design per the 2026-07-25
    operator ruling — no second sweep whose only purpose was feeding the now-
    removed LLM. `babysitter_runtime.bb` is retired; every check it performed
    still runs somewhere, with its existing test runners passing against
    whatever absorbs it.
  - Every KEEP-listed deterministic file (`babysitter_assess_lib.bb` +
    `babysitter_assess.bb`, `babysitter_lib.bb`, `babysitter_nudge_lib.bb`,
    `babysitter_nudge_resident.bb`, `babysitter_enqueue_wake.sh`, and their 4
    test runners) still exists and its test runner passes.
  - `SWARMFORGE_SKIP_BABYSITTER`'s flipped meaning (was: skip the LLM hawk; now:
    skip the deterministic sweep) is stated in the runbook, and the stale
    `.swarmforge/swarm.env` line is called out there.
  - A runbook exists: what babysitterd checks, what a nudge looks like, how to
    start/stop/ensure it, where the log/state live, and the env skip; plus the
    coordinator-facing doc line about "babysitter health sweep:" messages.

