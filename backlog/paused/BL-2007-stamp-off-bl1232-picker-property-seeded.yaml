description: |
  ## Status: hotfix d994ee6d63 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `extension/test/bl1232ShiftVelocityChartInvariants.property.test.js`'s
  "clears the gap on clustered layouts where index-thirds would not" drew
  120 unseeded cases and required at least 40 of them to be layouts
  index-thirds would crowd. Sampling the same generator over 2000 seeds:
  mean 56, lowest 33, 4 seeds (0.2%) below 40. QA's gather drew 39.

  ## What the hotfix changed

  - `{ numRuns: 120, seed: 10 }`: seed 10 draws 63 discriminating layouts
    (checked with the test's own two-argument fc.assert shape). The same
    remedy as bdb172641b (BL-1877, stamp-off BL-1973). BL-1583 is the epic
    for constructing such floors instead of sampling them.

  ## What the coder does (all of it)

  1. Run `cd extension && npx vitest run --config vitest.properties.config.mjs test/bl1232ShiftVelocityChartInvariants.property.test.js`
     once (the ticket is about this file alone), its output saved to
     tmp/out.txt.
  2. Read `git show d994ee6d63` against the sections above and the
     invariant.
  3. Write backlog/evidence/BL-2007-coder-<date>.md: the result and one
     line saying whether the hotfix matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

