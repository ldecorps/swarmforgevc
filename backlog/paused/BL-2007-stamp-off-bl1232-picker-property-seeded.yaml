source: |
  The human, 2026-10-01, verbatim (standing-red-register-amendment §6):

  > Also, update your prompt / c9 stitution: instead of minting a red, hotfix the defect and mint a stampoff.

  QA note 003828 to the specifier, 2026-10-05, verbatim: "BL-1944 held:
  unowned-red bl1232 prop reach floor 39<40 (BL-1583?)".

description: |
  ## Status: hotfix d994ee6d63 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `extension/test/bl1232ShiftVelocityChartInvariants.property.test.js`'s
  "clears the gap on clustered layouts where index-thirds would not" drew
  120 unseeded cases and required at least 40 of them to be layouts
  index-thirds would crowd. Sampling the same generator over 2000 seeds:
  mean 56, lowest 33, 4 seeds (0.2%) below 40. QA's gather drew 39.

  ## What the hotfix changed

  - `{ numRuns: 120, seed: 10 }`: seed 10 draws 63 discriminating layouts
    (checked with the test's own two-argument fc.assert shape). The same
    remedy as bdb172641b (BL-1877, stamp-off BL-1973). BL-1583 is the epic
    for constructing such floors instead of sampling them.

  ## Hotfix 04c0556285: BL-1061's leaked fixture

  BL-1061 scenario 04 ("a fixture leaked by an earlier run is swept before
  the table is read") was red on main, reported by coder@2 note 000095
  (evidence BL-1974-unowned-red-BL-1061-20261005.md on its BL-1974 line).

  - `specs/pipeline/steps/bl1061TunnelFixtureIsolationSteps.js`: the
    leaked fixture is named `nameWithCreator(deadPid())` (bl1287's helper)
    instead of `fixtureTunnelName()`, which encodes the live test process,
    so the sweep kept it; it passed only while the sweep mis-selected a
    spawner's pre-exec line (BL-1974's own bug).
  - The "no longer alive" step polls up to 3 s and counts a zombie as gone
    (`isRunning`, /proc state, falling back to kill(pid, 0) where /proc is
    absent): checked once right after the kill, it failed about one run in
    three.

  ## What the coder does (all of it)

  1. Run `cd extension && npx vitest run --config vitest.properties.config.mjs test/bl1232ShiftVelocityChartInvariants.property.test.js`
     once (the ticket is about this file alone), its output saved to
     tmp/out.txt.
  2. Also run qa_e2e_procedure step 2 once. Read `git show d994ee6d63`
     and `git show 04c0556285` against the sections above and the
     invariant.
  3. Write backlog/evidence/BL-2007-coder-<date>.md: the two results and
     one line per hotfix saying whether it matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

