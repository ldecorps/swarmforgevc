id: BL-2087
title: "BL-1584's sampled-reach-floor send gate checks a coder's first send of a ticket against the parcel's base on main, so a first-hop parcel that adds a sampled-low property test is refused - today a coder that took the ticket from a Work note has no received commit, the gate sends silently, and at least 13 sampled-low files landed after the gate shipped (two went red in QA on 2026-10-08)"
milestone: M8
type: defect
severity: high
# high: a broken safety signal. The gate exists to stop the class of
# daily unowned reds (BL-1583) and is silent at the only hop that adds the
# files; two reds on 2026-10-08 came from files it passed (bl2055, BL-2083;
# bl2049, BL-2086).
status: todo
epic: sampled-reach-floors
