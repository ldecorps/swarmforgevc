notes: |
  Minted 2026-10-08 by the specifier in the closing-ceremony lean pass.
  Measured from the QA gather JSONs dated 2026-10-07 (16 gathers): the
  properties row's duration_ms and exit, the ticket's previous gather, and
  `git merge-base --is-ancestor` between their commits. A first draft of
  this ticket's feature, from an earlier session of this pass, said "7
  re-gathers, 5141 s" and "only backlog/ and docs/ files -> no property
  file". Both were corrected before mint: three of those re-gathers followed
  a red or unfinished lane, and bl1333/bl1115 read backlog/hotfix-ledger.yaml,
  bl1320 reads a docs/how-to page, and bl1277 lists specs/features.
  Dynamic routing: production TypeScript with a durable record ->
  [coder, architect, hardender, documenter, qa]. architect: the record's
  home and the selector's new rule are a boundary the spec states but
  cannot pin. Cleaner dropped (medium).
  INVEST: Independent (BL-2024 shares the file, not a premise). Negotiable
  (the record's shape and the selector's matching are direction). Valuable
  (QA re-gathers, on the bottleneck stage). Estimable (one row decision,
  one record, one selector rule). Small (two scenario outlines). Testable
  (mkdtemp git fixtures, injected runFn, the real selector).
  No ruling_options: approve means this rule, reject keeps every gather on
  the whole lane.
