id: BL-926
title: "The resident-invoked rotate gate refuses a rotation INTO the role that owns the blocking parcel, so a resident whose active-role marker has diverged can never rotate home and the parcel stays stranded"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 15
direction: agent-proposed
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-926-rotate-gate-refuses-rotation-into-the-parcels-own-owner.feature

invariants:
  - "The gate refuses only when the rotation would abandon a parcel the DEPARTING pane itself owns. The mere presence of a parcel in some role's in_process box is never on its own sufficient to refuse."
  - "The change may only turn refuse into proceed, and only where the rotation target names the same role as the departing role. No input that resolves to proceed or proceed-forced today may resolve to refuse once the change is in."
  - "Rotation never removes, moves, renames or completes a parcel. Whatever the in_process box held before the rotation it holds after, so the owning role resumes it through ready_for_next.sh's in_process-first check."

approval_context: >
  Wants sign-off on two things.

  Severity high. Nothing is down and no data is lost - one
  SWARMFORGE_ROTATE_FORCE=1 or a manual respawn clears it, and the stranded
  parcel is recoverable in full. I filed high rather than medium because it is
  a live fault that does not self-clear and it defeats a recovery path the
  swarm just paid for: BL-921 landed the live-identity check specifically so a
  diverged resident would rotate instead of false-waking, and this gate then
  refuses that very rotation. Say so if you read it as medium; only the
  expedite lane changes.

  Whether to split at all. I minted this and BL-927 as two tickets from one
  incident rather than one combined ticket. They fix the same gate but
  different halves: this one is a pure decision change with no new I/O, BL-927
  plumbs a live tmux identity probe into a new call site. Either alone clears
  the observed deadlock. Combining them would put a pure function change and a
  new wiring seam in one parcel, which is what INVEST-S argues against - but if
  you would rather see one ticket, say so and I will fold BL-927 in.

source: |
  Observed live by the specifier on 2026-08-18 ~19:04 BST, in this repository,
  while idle-checking after ready_for_next.sh returned NO_TASK.

  Not from an operator intake and not from a peer's report - this is a
  first-hand reproduction. The specifier tried to rotate home per the
  mono-router non-home rule (BL-550) and was refused:

  > rotate: refused - in_process still holds an unfinished parcel:
  > .worktrees/coder/.swarmforge/handoffs/inbox/in_process/10_20260818T172915Z_000482_from_coordinator_to_coder_for_coder.handoff.
  > Run done_with_current.sh to complete it first, or set
  > SWARMFORGE_ROTATE_FORCE=1 to override.

description: |
  ## What happens

  Under mono-router one pane serves every role in turn.
  rotate_to_role.bb -> handoff-lib/respawn-as! gates the rotation on the
  departing role's own inbox/in_process/ box (BL-805): a real undrained
  *.handoff there refuses the rotation, so a role cannot walk away from work it
  claimed.

  The gate is decided by mono-router-lib/rotate-gate-decision, whose entire
  input is {:blocking-file :force?}:

      (cond
        (nil? blocking-file) :proceed
        force?               :proceed-forced
        :else                :refuse)

  It has no notion of which role is being rotated TO. So when the departing
  role and the rotation target are the same role, it still refuses - even
  though rotating a pane INTO the owner of a parcel abandons nothing. It is the
  opposite of abandonment: it is the only way that parcel gets picked up.

  ## Measured, this repository, 2026-08-18

  - .swarmforge/mono-router-active-role read `coder` (mtime 18:38 BST).
  - The pane's live identity was `specifier` (SWARMFORGE_ROLE=specifier,
    composed specifier role prompt) - the BL-921 divergence, recurring after
    BL-921's own fix landed, because BL-921 fixed the daemon's chase and rotate
    DECISIONS, not this resident-invoked gate.
  - .worktrees/coder/.swarmforge/handoffs/inbox/in_process/ held one real
    parcel: the coordinator's 17:29:15Z routing note for BL-640, an ACTIVE
    ticket, dequeued 18:02:12Z and never completed.
  - ready_for_next.sh answered NO_TASK - correctly, for the specifier it was
    running as.
  - rotate_to_role.sh coder was refused, on that same coder parcel.

  So the pane could neither work the parcel (wrong persona) nor rotate into the
  persona that could (gate). BL-640 sat stranded for ~62 minutes with the
  pipeline reporting a healthy resident.

  ## Why this is not already covered

  - BL-805 built this gate and reads the raw active-role marker deliberately.
    Its own docstring says it fails OPEN on a missing/blank marker rather than
    "guessing an identity and gating on the wrong role's mailbox" - but a
    marker that is present and WRONG fails closed, which is the case BL-921
    later proved is common.
  - BL-921 (done) taught should-rotate-resident? and
    dormant-mailbox-chase-action to require live-identity agreement. Verified
    at origin/main: live-role-agrees? is present and both call sites consult
    it. That fix is working - it is precisely why the daemon wants to rotate
    this pane. This gate then blocks the rotation it asked for.
  - BL-685 (paused) detects a resident stranded off its home role and nudges
    the coordinator to re-dispatch. Its recovery is also defeated here: the
    nudge tells the resident to rotate, and the rotate is refused again. Worth
    knowing when BL-685 is built; not a reason to fold it in.

  ## Shape of the fix (direction, not mandate)

  Give rotate-gate-decision the rotation target alongside the blocking file,
  and let it answer proceed when the target names the same role whose box holds
  the parcel. Everything else about the gate is unchanged - a real departure
  over an owned, undrained parcel still refuses, and the force override still
  behaves exactly as BL-805 specified.

  The caller (respawn-as!) already knows both facts: it computes
  (departing-role-blocking-handoff) and receives target-role as its own
  parameter. Nothing new has to be discovered; the gate simply cannot currently
  see one of them.

  ## What must still be refused

  A resident departing to a DIFFERENT role while holding a real undrained
  parcel of its own. That is the abandonment BL-805 exists to stop and this
  ticket does not touch it.

qa_e2e_procedure: |
  1. Build a fixture mono-router layout with a role whose inbox/in_process/
     holds one real *.handoff parcel, and the active-role marker naming that
     same role. Invoke the resident rotation entry targeting that same role and
     confirm the pane respawns rather than exiting 5.
  2. Immediately after step 1, confirm the parcel file is still present in
     in_process/, byte-identical and same filename - the gate must not have
     drained, moved or completed it (invariant 3). Then run the role's
     ready_for_next.sh and confirm it resumes that parcel rather than answering
     NO_TASK.
  3. Same fixture, but target a DIFFERENT role. Confirm the rotation is still
     refused, exits non-zero, and names the blocking parcel - BL-805's
     behaviour unchanged.
  4. Repeat step 3 with SWARMFORGE_ROTATE_FORCE=1 and confirm it proceeds and
     still prints the loud warning naming what was left behind.
  5. With an empty in_process/, and with a box holding only a
     claim-progress/nudge/chase sidecar and no *.handoff, confirm both rotate -
     unchanged, and the sidecar case is the BL-805 regression most likely to be
     broken by a careless signature change.
  6. On the live host, reproduce the divergence: with the marker naming one
     role and the pane running another, invoke rotate_to_role.sh <marker role>
     and confirm the pane comes back as that role and drains its in_process
     parcel. The 2026-08-18 BL-640 strand is the reference case.

required_wiring:
  - "swarmforge/scripts/handoff_lib.bb:::target-role::respawn-as! must pass the rotation target into rotate-gate-decision; a gate that cannot see the target still refuses the deadlock case, which is the BL-419 shape (mechanism shipped, wired into zero call sites)"

out_of_scope: |
  - Resolving the departing role from the pane's live identity rather than the
    raw marker. That is BL-927, minted from this same incident. It is the other
    half of the same gate and closes the residual case this ticket does not: a
    diverged marker where the target is a THIRD role, so target-equality never
    fires and the gate still protects a mailbox the pane does not own.
  - Detecting a stranded resident at all (BL-685).
  - Anything on the daemon's own rotation path. rotate-resident-to! is
    deliberately ungated so chase-driven drain cannot deadlock on the parcel it
    is clearing (BL-805's invariant); do not gate it here.
  - Why the marker diverged in the first place. BL-921 addressed the chase
    consequences; the write path that leaves a stale marker is not in scope and
    should be filed separately if this recurs after both halves land.

notes: |
  First-hand, not reported. Every fact in the description was read directly
  from this checkout at the time of the strand - the marker file and its mtime,
  the parcel filename with its dequeued_at, the refusal text, and
  rotate-gate-decision's source. The memory lesson about re-running a peer's
  claim does not apply because there is no peer claim here.

  Verified BL-921 is landed before blaming it. Read both refs per the
  local-main-lags lesson: `git rev-list --left-right --count main...origin/main`
  gave `12  0`, and live-role-agrees? is present in
  origin/main:swarmforge/scripts/mono_router_lib.bb at both call sites. So this
  is a genuine uncovered call site, not a regression of BL-921 and not a ticket
  already fixed.

  mutation_cost low - rotate-gate-decision is a three-branch pure cond with an
  existing pure-decide runner
  (swarmforge/scripts/test/mono_router_lib_test_runner.bb) and an existing
  shell integration test
  (swarmforge/scripts/test/test_rotate_to_role_stuck_parcel_gate.sh). Extend
  both rather than starting new ones.

  On the required_wiring pattern. Per BL-874 a pattern is matched as a plain
  substring and must be a literal that will really exist, never a placeholder.
  `:target-role` is this codebase's own established map key for exactly this
  concept - handoffd.bb passes :target-role at lines 403 and 1362 into the two
  sibling gate functions - and it appears zero times in handoff_lib.bb today,
  so the entry is neither invented nor vacuous. If the implementer has a strong
  reason to name the key differently, amend this entry in the same commit
  rather than working around the gate.

  Shell-test discipline. Per the engineering article the shell test targets
  stock macOS /bin/bash 3.2 - use the empty-array-safe expansion form for
  possibly-empty arrays - and `env -u SWARMFORGE_CONFIG` before fixture confs.
  Reap fixture tmux by socket path, never session name (fixtures reuse live
  session names). Remove any temp fixture dir in a finally, not after the last
  assertion.

  BL-233 obligation. All scenarios are new and their step handlers must land in
  THIS parcel - the acceptance runner throws on any scenario it cannot resolve.
  The box and decision columns must validate against explicit KNOWN_VALUES, not
  pass through.

  IR-DRY run and dispositioned as no-change. The checker reports 10 (BL-926)
  / 8 (BL-927) medium-confidence findings and every one is a placeholder-vs-
  literal pair (`"<target>"` against `"coder"`) or two genuinely different
  assertions (`proceed` against `proceed-forced`). That is the known limitation
  - IR-DRY does not normalize quoted literals - not accidental drift, which is
  the only thing its own suggested_action says to normalize. Neither available
  merge is meaning-preserving: the outline varies the very fields a Background
  would have to fix, and the two standalone scenarios assert different Thens
  (parcel survival and resume, against the force override). Left as written.
