id: BL-989
title: "test_role_lifecycle_cli.sh uses GNU-only `grep -qP`, which stock macOS BSD grep rejects - BL-343's acceptance contract fails on the swarm host"
milestone: M8
type: defect
severity: medium
status: todo
epic: code-quality-gates
human_approval: pending
priority: 30
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-343-routing-break-even-measurement.feature

invariants:
  - "Every shell helper the test and acceptance suites drive runs on stock macOS userland - no GNU-only tool flag is relied on without a portable fallback."

description: >
  Severity rationale: medium - a real, contained defect on the primary
  development host. It reds one acceptance contract deterministically, and
  the failure text names the cause outright.

  Reported by the coder as one of four pre-existing acceptance reds
  (BL-336/337/343/578, note 20260820T122656Z_000380).

  Measured by the specifier on the restored master checkout - 1 of 6
  scenarios red, 5 green. Verbatim:

    Scenario "The cost of bringing a parked role back is measured from a real
    unpark" failed at step "Then the cost of bringing it back is recorded
    from that unpark": expected "routing-break-even-01/02 setup: a real park
    then a real unpark of the same role is recorded, in order, with real
    timestamps" (01) in the real output, got:
    grep: invalid option -- P
    usage: grep [-abcdDEFGHhIiJLlMmnOopqRSsUVvwXxZz] [-A num] [-B num] [-C[num]]

  The chain, traced rather than guessed:

  - specs/pipeline/steps/routingBreakEvenSteps.js:31,40 shells out to
    swarmforge/scripts/test/test_role_lifecycle_cli.sh.
  - That script, lines 102-103, defines its two roles.tsv predicates with
    `grep -qP "^$2\t"`.
  - `-P` (PCRE) is a GNU grep extension. Stock macOS ships BSD grep, which
    rejects it outright with the usage block above - so the predicate never
    evaluates and the setup assertion never finds its expected line.

  The attribution is safe to state here because the tool named itself: the
  error is literally `grep: invalid option -- P` followed by the BSD usage
  string. (A previous incident on this repo blamed BSD grep for what turned
  out to be a 100-character socket-path limit, so the bar for naming it is
  direct evidence, which this is.)

  What `-P` was buying is small: `^$2\t` needs a literal TAB. That is the only
  reason PCRE was reached for, and it has portable spellings.

  How (direction, not mandate): express the tab without PCRE - a literal tab
  in the pattern, `grep -q "$(printf '^%s\t' "$2")"`, or awk with a tab field
  separator. The coder picks; the constraint is that it runs on stock macOS
  grep and still anchors on a real tab, not on whitespace generally.

constraints: >
  Firm lines:

  - Do NOT require GNU grep (ggrep, Homebrew coreutils) on the host. The
    engineering rules already target stock macOS userland; adding a toolchain
    dependency to make a test pass inverts that.
  - The predicate must still match a real TAB, not `\s` or a space class.
    roles.tsv is tab-separated; loosening the anchor would let a role name
    that is a prefix of another match the wrong row.
  - Both predicates change together (roles_tsv_has and roles_tsv_lacks, lines
    102-103). Fixing only the positive one leaves the negative predicate
    silently always-true, which is worse than the current loud failure.
  - Do not "fix" this by raising the step's 120000ms spawnSync timeout. The
    slowness is real but separate (see notes); the red is the grep flag.

notes: >
  Source: coder note 20260820T122656Z_000380, one of four reds. The other
  three have genuinely different causes and are separately ticketed
  (BL-986 scanner blindness, BL-987 audit canary, BL-988 orphaned contract).

  Separate observation, deliberately NOT bundled: this contract is very slow.
  It produced no output for over seven minutes on the swarm host before
  emitting results - it drives a real shell suite (120s timeout), a real
  vitest run and a real park-cycle-report binary. That is a speed concern of
  the same family as BL-971's property-lane budgets, not a correctness one,
  and folding it in here would oversize the slice. Worth its own ticket if it
  keeps costing reviewers turns.

  Rule candidate, blocked on budget: engineering.prompt already carries
  "target stock macOS /bin/bash 3.2, not Homebrew bash" for shell syntax. The
  same discipline for GNU-only TOOL FLAGS (grep -P, sed -i semantics, date
  -d) would have caught this at authoring time. Not proposed as an amendment
  in this ticket because the article sits at exactly 44000/44000 of the boot
  prefix budget (BL-859 gate), so any addition must be paid for by a
  relocation in the same commit - and see BL-986 for what a careless
  relocation can silently break.

qa_e2e_procedure: >
  1. Run the shell suite alone on stock macOS:
     `bash swarmforge/scripts/test/test_role_lifecycle_cli.sh` - it completes
     with no "invalid option" line on stderr.
  2. Run the contract:
     `node specs/pipeline/cli.js
     specs/features/BL-343-routing-break-even-measurement.feature <outdir>` -
     runner exits 0, 6 of 6 green. Do not pipe through tail; that replaces
     the runner's exit code with tail's, and this suite is slow enough that
     a truncated tail is tempting.
  3. Tab-anchoring is preserved: add a roles.tsv row whose name is a strict
     prefix of an existing role (e.g. "cod" beside "coder") and assert
     roles_tsv_has "cod" does not match the "coder" row.
  4. Negative predicate still discriminates: assert roles_tsv_lacks returns
     false for a role that IS present - proving it did not become
     always-true.
  5. Portability spot-check: confirm the chosen spelling contains no `-P`,
     no `\s`, and no ggrep/gnu-prefixed binary.

approval_context: >
  Nothing here needs a product decision - the failure names its own cause and
  the fix is a portable spelling of one predicate.

  The one judgement I made: I kept the >7-minute runtime OUT of this ticket.
  It is a genuine problem and I have recorded it in notes, but it is a
  different defect class (wall-clock cost, like BL-971) and bundling it would
  make a one-line portability fix unestimable. Say the word if you would
  rather have them together.
