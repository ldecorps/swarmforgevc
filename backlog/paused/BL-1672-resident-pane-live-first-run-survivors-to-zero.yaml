approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. What needs sign-off: that all
  76 are chased in one sitting. BL-1519's ruling (chase the untested
  logic only, grandfather the rest) was a budget call over three large
  files holding about 1,530 mutants - 25 slices; this file is one sitting
  by that ruling's own 60-per-sitting arithmetic, has never had a
  baseline, and the coder found none of its survivors equivalent by
  inspection (exact role-name comparisons, exact find predicates, exact
  label strings that existing tests assert only loosely). FIRM: no
  production behaviour changes - every contract BL-522's, BL-775's and
  BL-1243's features pin stays green; only tests are added, and a
  refactor for CRAP keeps the same outputs. FIRM: "accepted equivalent"
  needs the code-level reason in the evidence (BL-1520's rule), never
  "first-run debt" - this ticket IS the owner that reason names.

invariants:
  - "Every mutant Stryker reports for the file at the parcel commit is either killed by a test in the unit suite or recorded in the evidence as an accepted equivalent with the code-level reason; none is silent."

description: |
  ## What is wrong

  `extension/src/bridge/residentPaneLive.ts` (416 lines, BL-522's
  Resident Spy / live-screen capture and the mono-router layout
  decisions) was never mutation-tested: BL-775's hardener deferred the
  gate on 2026-09-18 when the perTest dry run timed out twice under load
  11.5-25.2. BL-1638 ran it on 2026-09-21 on a quiet host (load 2.05,
  49 s, 139 tests; evidence `backlog/evidence/BL-1638-BL-775-mutation.md`
  on the coder branch): `out/bridge/residentPaneLive.js` 148 killed, 67
  survived, 9 never covered, 224 instrumented, score 66.07%
  (`bubbleLiveUiHtml.js`, the row's other file, 7/7 killed). The coder,
  correctly, did not chase 76 mutants inside a discharge parcel and did
  not discharge BL-775's row without an owner to name; this is that
  owner.

  Census by enclosing declaration (exact, from the run's stdout; script
  and per-mutant list in
  `backlog/evidence/BL-1672-first-run-survivor-census-20260921.md`;
  survived / no-coverage):

  | declaration | surv | no-cov |
  |---|---|---|
  | captureResidentPaneLive | 13 | 5 |
  | tryCaptureRolePane | 9 | 1 |
  | captureLiveScreenPanes | 10 | 0 |
  | captureMonoRouterLiveScreenUncached | 10 | 0 |
  | withHeader | 9 | 0 |
  | monoRouterActiveRoleForPane | 6 | 0 |
  | orderLiveScreenRoles | 2 | 1 |
  | captureCoordinatorPaneLive | 2 | 1 |
  | derivePaneActivitySignal | 3 | 0 |
  | paneCaptureFailedReason | 1 | 1 |
  | decideMonoRouterLayout | 1 | 0 |
  | liveScreenPaneLabel | 1 | 0 |

  Representative survivors (coder's evidence): `id === 'resident' ||
  roleEntry.role === 'coder'` with `===` flipped to `!==`;
  `panes.find((entry) => entry.id === 'resident')` with the predicate
  replaced by `true`; `withHeader(unavailablePane(), 'Coordinator')` with
  the label emptied. Existing tests assert that "a pane is present", not
  which pane, selected how, labelled what.

  ## What is wanted

  - The run is repeated over the FULL unit suite (BL-1638's scoped
    include set was four test files, so a survivor there may already be
    killed by a test outside it); the evidence records the include set,
    the summary block, load and duration, and either zero survived and
    zero no-coverage or one accepted-equivalent record per remaining
    survivor with the code-level reason and the consumer grep (BL-234).
  - Behaviour tests kill the rest, through the exported functions over
    the fake tmux client the existing tests use: the exact pane ids,
    labels and role comparisons `captureLiveScreenPanes`,
    `captureMonoRouterLiveScreenUncached`, `monoRouterActiveRoleForPane`,
    `liveScreenPaneLabel` and `withHeader` choose between; the
    failure and empty-capture paths of `captureResidentPaneLive`,
    `captureCoordinatorPaneLive`, `tryCaptureRolePane` and
    `paneCaptureFailedReason` (the nine never-covered mutants live
    there and in `orderLiveScreenRoles`); the signal boundaries of
    `derivePaneActivitySignal` and `decideMonoRouterLayout`. Exported
    constants through the call that consumes them, never by pinning
    the literal.
  - The evidence lists, per declaration in the census, the test file
    and case that now rejects its mutants (scenario 02).
  - Any function `npm run crap` flags in the file under 6 (coverage
    first; a small refactor only where coverage cannot reach).
  - Evidence path: `backlog/evidence/BL-1672-residentPaneLive-mutation.md`.

  ## How (direction, not mandate)

  - `--mutate out/bridge/residentPaneLive.js`, `perTest`, sibling links
    per the Verification rules; the run recipe is BL-1638's scoped
    config (`extension/stryker.bl775.config.json` and
    `vitest.bl775.stryker.config.mjs` on the coder branch, commit
    1836f592d0) widened to the full suite; the parcel's own scoped config
    is not committed (the hardener's rule). Check
    `mutation_cooldown_gate.bb` first and record its decision.
  - Group by the census's declarations and write one fixture-driven test
    per group; `residentPaneLive.test.js` (677 lines) and
    `bl1243PaneActivitySignal.test.js` are the homes. The property test
    (`residentPaneLive.property.test.js`, BL-1243's invariants) stays in
    the property lane; a survivor that a property expresses better than
    an example is the exception, not the rule.
  - Documenter: nothing beyond the evidence file; no diagram trigger.

constraints: >
  Tests only unless a seam is missing, in which case the smallest
  extraction that exposes the behaviour to an in-process test; never
  `process.chdir()` under mutation; never a hand-edited manifest; fakes
  for tmux, never the live socket. The step handler lands with the
  feature (BL-233).

out_of_scope: |
  - `bubbleLiveUiHtml.js` (7/7 killed) and BL-775's ledger row: BL-1638
    discharges the row naming this ticket as the survivors' owner, and
    the standing-red register row for `residentPaneLive.js` leaves with
    that discharge (BL-1631).
  - Any change to what the capture functions or the layout decisions
    return.

qa_e2e_procedure: >
  (1) `node specs/pipeline/cli.js specs/features/BL-1672-resident-pane-live-first-run-survivors-to-zero.feature`
  ONCE on the parcel commit: 2 scenarios ok. (2) `cd extension && npx
  vitest run test/residentPaneLive.test.js test/bl1243PaneActivitySignal.test.js`
  once: green with the new cases. (3) `npm run crap` once: no function in
  residentPaneLive.ts above 6. (4) The parcel's evidence names the
  Stryker totals over the full unit suite with at least 220 mutants and
  survived 0, no-coverage 0, or each remainder with its reason and grep.
  (5) `bb swarmforge/scripts/standing_red_register_cli.bb .` names no
  hardening row for residentPaneLive.js once BL-1638's discharge has
  landed. Never "run it N times".

