id: BL-754
title: "take-flow-reason's single-quote and unquoted branches are completely untested - an unquoted comma does not merely truncate a reason, it silently drops the next stage entirely"
milestone: M8
type: defect
severity: medium
# medium, not high: quoted values are the live convention, so nothing in
# production is losing a reason today. Not low: the parser reports a partial
# result as complete for present-but-malformed input, which is the silent
# mis-parse class this project's own hardener guidance names as a gap, and two
# of three branches have never been executed by any test.
status: todo
epic: swarm-reliability
priority: 83
direction: normal
