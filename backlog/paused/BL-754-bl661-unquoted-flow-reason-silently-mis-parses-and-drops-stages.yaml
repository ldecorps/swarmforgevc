human_approval: pending

approval_context: >
  One decision to confirm, and a recommendation rather than an open fork. The
  originating note left it undecided between rejecting unquoted comma-bearing
  values and requiring quoting at the schema level. The contract as written
  takes a third, narrower route: keep parsing best-effort, never throw, and
  surface the unparseable remainder as a reported rejection the routing-skip
  record carries - mirroring what resolve-effective already does for the
  sibling required_stages declaration on the same header line. Rationale:
  reasons feed an observational record, not a routing decision, so a throw
  would let a cosmetic typo block a live handoff, which is strictly worse than
  today's silent drop. What is firm either way: no partial parse may be
  returned in silence, and quote style must not change the result. Overrule
  the recommendation here if a hard schema-level rejection is preferred - only
  scenario 02's Then and invariant 3 change.

source: |
  Found during BL-723 (pilot-tonight quality review), hardener viewpoint
  pass, 2026-07-30/31. `take-flow-reason`
  (swarmforge/scripts/lib/required_stages_lib.bb:87-108) has three
  branches: double-quoted (`"..."`), single-quoted (`'...'`), and
  unquoted/bare (`:else`, splits on the first comma).

  Every test in `required_stages_test_runner.bb` (lines ~226-260) and
  every scenario in the `.feature` file uses double-quoted reason values
  only. The single-quote branch is entirely untested, and the unquoted
  `:else` branch's actual failure mode is untested: for an unquoted,
  comma-containing reason like
  `stage_skip_reasons: { cleaner: no test, obvious }`, the `:else` branch
  splits at the FIRST comma — `take-flow-reason` returns `["no test",
  "obvious"]` — so the parser stores `cleaner -> "no test"` and then tries
  to parse `"obvious"` as the start of a NEXT `stage: reason` pair. Since
  `"obvious"` has no colon, the next stage/reason pair fails to parse
  correctly (silently mis-parsed or dropped depending on exactly how the
  recursive parse loop handles a colon-less remainder) — with no error
  surfaced anywhere.

  Not filed as high severity: this ticket's own docstring states live
  tickets always use quoted values by convention, so current production
  risk is low. But the parser accepts and silently mis-parses unquoted
  input rather than rejecting it, and nothing proves what it actually does
  in that case — exactly the "a parser that returns the same value/keeps
  going for present-but-malformed input as for well-formed input" pattern
  this project's own hardener guidance already names as a gap class.

description: |
  ## What

  Cover take-flow-reason's two never-executed branches, and stop the unquoted
  branch from reporting a partial parse as a complete one.

  ## Why

  Two of the three branches have no test and no scenario. The single-quoted
  branch is duplicate logic that nothing has ever run. The bare/unquoted
  :else branch splits on the first comma, and the note that filed this
  understated the damage: for

      stage_skip_reasons: { cleaner: no test, obvious, architect: covered }

  take-flow-reason returns ["no test" "obvious, architect: covered"], and the
  caller's loop then fails its `^([A-Za-z]+)\s*:\s*(.*)$` match against that
  remainder - a comma precedes the colon - so `(if (nil? m) pairs ...)` returns
  early. The result is {cleaner "no test"}. Architect's declared reason is not
  truncated, it is gone, and nothing reports it.

  ## How (direction, not mandate)

  Mirror the posture already settled for the sibling declaration on the same
  header: resolve-effective surfaces a present-but-invalid required_stages as a
  returned rejection reason the caller carries onto the routing-skip record,
  without throwing. Do the same here. Recovering the later pairs after a
  malformed one is welcome but not required - what is required is that the
  partial result is never presented as complete.

  Do NOT add a durable acceptance scenario that pins today's buggy output. Such
  an assertion goes red exactly when the fix lands (BL-1006). The current
  behaviour is characterised in `source:` above as evidence; if a
  characterisation test helps during TDD, keep it local to the coder's pass.

  ## Scope

  - `swarmforge/scripts/required_stages_lib.bb` - take-flow-reason (87-108) and
    parse-flow-skip-reasons' loop (109-135), which is where the drop occurs.
  - `required_stages_test_runner.bb` - single-quote cases mirroring the existing
    double-quote ones, and the unquoted comma case.
  - Existing double-quoted-value tests and BL-661's scenarios stay green.

qa_e2e_procedure: |
  In a scratch clone, driving the real library rather than a fake:

  1. Write an active ticket whose header carries
     `stage_skip_reasons: { cleaner: "no test, obvious", architect: "covered" }`
     and read it. Assert cleaner's reason keeps the comma and architect's
     reason is present.
  2. Repeat with single quotes throughout. Assert byte-identical results to
     step 1 - this is the branch nothing has ever executed.
  3. Repeat with `{ cleaner: no test, obvious, architect: covered }`. Assert the
     read reports the declaration malformed and names the unparseable
     remainder, and that architect's reason is not dropped without that report.
  4. Send a real git_handoff on the step 3 ticket. Assert the parcel is
     delivered, the process does not abort, and the routing_skipped header or
     journal line carries the malformed-declaration report.
  5. Repeat with `{ cleaner: no test }` - unquoted, no comma. Assert it is
     accepted as before and nothing is reported malformed.

