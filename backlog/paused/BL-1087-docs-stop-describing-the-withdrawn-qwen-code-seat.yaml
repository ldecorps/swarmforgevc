invariants:
  - "No file under docs/ names a swarmforge/packs/*.conf that is not present in the tree, other than a placeholder that is illustrating pack naming rather than naming a real pack."

approval_context: >
  One thing needs your call rather than a rubber stamp: what happens to the
  shipped-work entries in `docs/reference/Specification.MD`.

  That file is a historical log - it records what shipped, entry by entry, and
  entries are not normally deleted. The BL-1052 and BL-1053 entries are not
  wrong about history: that work really did ship. They are wrong about the
  present, because they name a pack conf, a runbook, a shell test and two
  property runners in the present tense, and every one of those files is now
  gone.

  The ticket asks for the entries to be RE-TENSED and to point at the
  disposition evidence - not deleted. If you would rather they were removed
  outright, or left exactly as they are with the drift accepted, say so and
  this gets respecced. The runbook and index entry are a separate matter and
  are removed either way; a runbook whose launch command fails is not a
  historical record of anything.

  The severity is medium, not high: nothing in the running swarm is broken by
  this, and the blast radius is an operator losing time on a launch that
  cannot work. It is not low either - the docs index actively advertises the
  seat, so the wrong path is the discoverable one.

source: |
  Found by the specifier on 2026-08-23 while closing out the coder's
  priority-00 note `00_20260823T005014Z_000838` ("BL-1043 parcel re-adds
  qwen-code: merge fbea96a60f first, it re-drops it").

  The note itself needed no spec - the coder had already re-dropped the
  content in `fbea96a60f` and the branch was verified clean. But verifying it
  surfaced this: the BL-1052/BL-1053 supersede disposition
  (`backlog/evidence/BL-1052-BL-1053-supersede-disposition-20260823.md`,
  commit `9c6df2c3d`) checked that the CODE paths were absent and never
  checked the DOCS that describe them. That disposition is the specifier's
  own, so this is a loose end of its author's making, filed rather than
  quietly patched.

  Verified on `main` this pass. Absent from the tree:
  `swarmforge/packs/qwen-code-mono-router.conf`,
  `swarmforge/packs/qwen-code-mono-router.prompt`,
  `specs/pipeline/steps/bl1052QwenCodeSeatSteps.js`,
  `specs/pipeline/steps/bl1053QwenProviderRoutingSteps.js`,
  `test_qwen_code_seat.sh`, `bl1052_qwen_code_seat_property_runner.bb`,
  `bl1053_qwen_provider_routing_test_runner.bb`,
  `bl1053_provider_routing_property_runner.bb`.

  Still describing them as live:

  1. `docs/how-to/BL-1052-qwen-code-mono-router-launch.md` - a 102-line
     runbook whose instruction is `./swarm <repo-root> --pack
     qwen-code-mono-router`. That pack conf does not exist, so the command
     fails.
  2. `docs/index.md` line 100 - a published index entry linking to that
     runbook, which is how an operator would find it.
  3. `docs/reference/Specification.MD` - the shipped-work entries for BL-1052
     and BL-1053, naming the removed conf (line 70), the removed runbook
     (line 82), the removed shell test (line 84) and the removed property
     runners (lines 33-34, 85), all in the present tense.

description: |
  Bring the documentation back in line with a tree the supersede already
  changed, and leave a check behind so the next removal cannot drift the same
  way.

  ## What is wrong

  The qwen-code mono-router seat was removed from the tree and the removal
  stands. The documentation that describes it was not removed with it, so the
  docs index advertises a seat that does not exist, its runbook hands an
  operator a launch command that cannot work, and the shipped-work log asserts
  in the present tense that five removed files are there.

  ## What should happen

  The runbook goes, and its index entry goes with it in the same pass - a
  removal that leaves the link behind swaps one wrong page for a dead one.

  The shipped-work log is a different thing and is treated differently: it is
  a historical record and its entries stay, re-tensed so they record that the
  seat shipped and was then superseded and removed, pointing at the
  disposition evidence for the reasoning. History is preserved; the false
  present tense is not.

  A doc naming a pack conf the tree does not have is then a checkable
  property, and the invariant above says so. Its check has to survive the
  placeholder `swarmforge/packs/NAME.conf` that Specification.MD twice uses to
  ILLUSTRATE pack naming - that is documentation working correctly, and a
  naive grep reports it as drift on day one.

  ## How (direction, not mandate)

  Delete the runbook and its index entry. Edit the two Specification.MD
  entries in place. For the invariant, a check that walks docs/, collects the
  `swarmforge/packs/*.conf` paths named, and reports the ones absent from the
  tree - with the placeholder distinguished by something more durable than a
  hardcoded exception list if you can find one.

  ## What this does not change

  The aider-based `qwen-mono-router` seat is a different, pre-existing path
  that this supersede never touched: `swarmforge/packs/qwen-mono-router.conf`,
  `start-swarm-qwen.sh`, and the qwen arms in
  `swarmforge/scripts/ancillary_provider_lib.sh` all stay exactly as they are,
  as does the paused BL-1077. Over-removing here would be a worse defect than
  the one being fixed.

acceptance: specs/features/BL-1087-docs-stop-describing-the-withdrawn-qwen-code-seat.feature

qa_e2e_procedure: |
  1. On the parcel commit, confirm
     `docs/how-to/BL-1052-qwen-code-mono-router-launch.md` is gone and that
     `grep -n "BL-1052-qwen-code-mono-router-launch" docs/index.md` returns
     nothing.
  2. Follow every relative markdown link in `docs/index.md` and confirm each
     target file exists - this is the half-done-fix failure mode, a removed
     page still linked.
  3. Read the BL-1052 and BL-1053 entries in
     `docs/reference/Specification.MD`. Confirm neither asserts that the
     removed conf, runbook, shell test or property runners currently exist,
     and that each names
     `backlog/evidence/BL-1052-BL-1053-supersede-disposition-20260823.md`.
  4. Run the invariant's check against the parcel tree and confirm it reports
     nothing.
  5. Non-vacuity, in a scratch clone: delete
     `swarmforge/packs/qwen-mono-router.conf` (which docs do reference) and
     confirm the check now reports exactly that path. Restore it.
  6. Confirm the placeholder is not reported: `grep -n "packs/NAME.conf"
     docs/reference/Specification.MD` still returns its two lines, and step 4
     was clean with them present.
  7. Confirm the aider path is untouched: `swarmforge/packs/qwen-mono-router.conf`
     and `start-swarm-qwen.sh` are present, and
     `grep -c qwen swarmforge/scripts/ancillary_provider_lib.sh` is unchanged
     from `main`.

out_of_scope: |
  - Re-litigating the BL-1052/BL-1053 disposition. The removal stands; that
    was settled in
    `backlog/evidence/BL-1052-BL-1053-supersede-disposition-20260823.md` and
    this ticket only makes the documentation agree with it.
  - Removing or altering anything on the aider-based qwen path, or BL-1077.
  - The reframed BL-1052/BL-1053 tickets themselves, which are paused awaiting
    approval on their new local-model shape and are not touched here.
  - A general documentation-freshness sweep. The invariant covers one specific
    and checkable class - a doc naming a pack conf that is not there - and is
    deliberately not a link checker, a spell checker, or a staleness heuristic.
  - Extending the check to `specs/`, `swarmforge/roles/` or the constitution.
    Only `docs/` is in scope.

notes: |
  Worth noticing for its own sake: the supersede disposition verified the
  removal by CONTENT rather than by ancestry, which was the right instinct and
  caught a real error - and it still missed this, because it only looked where
  the code was. Removing a capability means removing its documentation in the
  same breath, and nothing in the pipeline says so today. If the invariant's
  check turns out to generalise cleanly, the wider rule is a candidate for a
  `rule_proposal` later; it is deliberately not folded into this slice.
