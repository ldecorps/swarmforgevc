id: BL-1085
title: "BL-1039's repo-creation guard keys on the wrapper's NAME (`git(`), not on what the wrapper does, so a test whose helper is spelled anything else creates repositories invisibly"
type: defect
severity: low
# low, and deliberately so - this is a LATENT gap, not a live one. Measured
# 2026-08-23 against the whole unit corpus: the guard reports zero genuine
# misses. Every file that really creates a repository is either detected or
# carries a BL-1039-EXEMPT reason, and every local wrapper that spawns git in
# extension/test is named `git`, so the pattern matches the convention that
# actually exists. Nothing is wrong today and no signal is currently false -
# the exposure is that the invariant survives only while that naming
# convention holds, and nothing enforces the convention.
status: todo
epic: unit-suite-speed
assigned_to: coder
priority: 55
direction: swarm-reported
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1085-the-repo-creation-guard-keys-on-a-wrapper-name.feature
human_approval: pending
approval_context: >
  This one genuinely needs your steer on WHETHER, not just how - I can argue it
  either way and I would rather you decided.

  For: BL-1039's invariant 1 ("no unit-lane test creates a git repository of
  its own") is a real speed invariant worth 144.2s, and right now it is
  enforced by a gate that a rename defeats silently. Tests here are written by
  many different agents over time, so a naming convention nothing enforces is a
  thin thing to hang an invariant on.

  Against: there is no live miss, the fix has a genuine false-positive risk
  (see invariant 2), and a guard that goes red because the code is CORRECT is
  the exact BL-1032 defect this guard's author was explicitly avoiding when
  they hard-coded the narrow pattern. Doing nothing is a defensible answer.

  A cheaper third option, if you want the risk closed without touching the
  matcher: leave the guard alone and add a convention check that fails if any
  test-corpus helper spawning git is named anything but `git`. That enforces
  the assumption the guard already relies on, and cannot produce the
  red-because-correct failure. Say the word and I will respec it that way.
invariants:
  - The guard identifies a repository creation by what the call DOES, not by the identifier it is spelled with - renaming a helper never changes whether its `init` call is seen.
  - The guard never fires on code that is correct - test DATA containing a call (a whole-line string literal describing file contents) and the shared fixture helper's own internal spawn must both stay unflagged, or the gate becomes one everybody waves through.
description: >
  WHAT: `CREATES_A_REPO` in `extension/test/helpers/repoCreationGuard.js` ends
  in the alternation `\bgit\(\s*[^,()]+,\s*\[\s*['"]init['"]`, which requires
  the wrapper to be spelled literally `git`. A helper named `g`, `runGit`,
  `sh`, or anything else calling `init` is invisible to the guard, and so is
  the repository it creates.

  MEASURED STATE, 2026-08-23 - the gap is latent, and the ticket should not
  pretend otherwise. Scanning the whole unit corpus: the guard reports zero
  genuine misses. Thirteen files mention an `init` spawn; three really create
  repositories and all three are detected and carry a `BL-1039-EXEMPT` reason
  (blTopicStore, config, pilotAcceptanceGateCli); the other ten do not create
  anything (a commit whose MESSAGE is `init`, or whole-line string literals
  that are test data - `liveRepoDerivationGuard.test.js` is the latter, and
  the guard is right to skip it). Every local wrapper that spawns git in
  `extension/test` is named `git`. So the guard matches the convention that
  exists; the exposure is that only the convention, unenforced, keeps it true.

  WHY the narrowness is not simply a bug to widen - and why a naive fix is
  worse than the gap. The guard's own comment records the reasoning: `\bgit\(`
  deliberately demands the paren immediately after `git` so that
  `gitIn(dir, ['init'...])` - the shared fixture helper's OWN internal spawn,
  whose entire purpose is to create the template repository - is not matched.
  Widening the pattern to catch arbitrary wrapper names will match that helper
  and any similar one, and the guard then goes red precisely because the code
  is correct. That is the BL-1032 defect one guard over, and the cheapest way
  to satisfy such a gate is to obfuscate the call - "a lie the next reader has
  to disbelieve".

  How (direction, not mandate): key on the wrapper's DEFINITION rather than
  its call site - find helpers in the file (or its imported helpers) whose body
  spawns `git`, collect those identifiers, then match `<identifier>(` calls
  carrying an `init` argument. That keeps `gitIn` and the fixture helper
  excludable by the existing self-exempt list rather than by an accident of
  spelling. Resolving imports fully may not be worth it; a same-file
  definition scan plus the existing exemption mechanism may be enough, and if
  it is, say so rather than building binding resolution.

  NOT IN SCOPE: BL-1039's own conversions, the exemption markers already
  recorded, and BL-1038's sibling guard. This ticket changes how the guard
  RECOGNISES a creation and nothing else.
qa_e2e_procedure: >
  1. `node -e` against the guard helper: a fixture string using a wrapper named
     something other than `git` (e.g. `runGit(dir, ['init', '-q'])`) must be
     reported by `createsRepository`. That is the defect reproducing today.
  2. Re-run the guard over the real corpus via `findRepoCreations` - the
     violation list must be EXACTLY as it is today (currently empty once the
     three exempt files are honoured). A fix that adds violations against
     files that were already correct has failed invariant 2, and the diff in
     that list is the evidence either way.
  3. Specifically confirm still-unflagged: `liveRepoDerivationGuard.test.js`
     (its `init` lines are whole-line string literals - test data), the shared
     fixture helper's own `gitIn` internal spawn, and the four SELF_EXEMPT
     paths.
  4. `npm test` from `extension/` stays green and the guard's exit code still
     folds into the run.
notes: >
  Reported by the coder as a `note` on 2026-08-23: "BL-1039 guard matches
  wrapper NAME git( only - any other spelling is invisible". The observation
  about the regex is correct and is what this ticket carries.

  I did not take the severity from the report. BL-1039 is already in
  `backlog/done/`, so this could not be an amendment to an in-flight spec, and
  before minting I measured the corpus rather than assuming a live hole: there
  is none today. Recording that here so nobody re-derives it, and so the
  ticket is not read as "the guard is broken" - it is not.

  IR-DRY disposition (checker run): two `possible-synonym` findings remain,
  both reviewed and KEPT. "scans every test file" (scenario 03, corpus-wide)
  vs "scans the file" (single-file) is a real difference in scope, and
  scenario 02's fixed "not flagged" verdict is deliberately not parameterized -
  every row expects the same outcome, and a one-valued Examples column is
  exactly what the prune rule says to remove. Two earlier findings WERE drift
  and were resolved by folding the recognised/not-recognised helper scenarios
  into a single outline with a `spawns` column.
