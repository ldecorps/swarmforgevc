    through the bounce bound, 5de352ed1d settled on two) and was never
    measured. Each recovery is a full headless agent invocation, so too high
    costs real tokens and too low abandons a ticket mid-run. Confirm 2, or say
    what it should be. This is a question for the human, NOT scope for this
    parcel - changing the bound stays out of scope either way.
  - [2026-08-30] specifier, ADJUDICATION of the coordinator's dropped-commits
    report (backlog/evidence/BL-1254-dropped-commits-20260830.md). The report is
