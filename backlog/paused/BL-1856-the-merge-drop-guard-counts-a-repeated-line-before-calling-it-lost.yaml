id: BL-1856
title: "The merge-drop guard counts a repeated line before calling it lost - merge_drop_guard_lib.bb's lines-lost matches a side's removed and added lines by text alone, so Specification.MD's 400-odd identical \"Prior entry —\" separators make any merge that keeps the other side's new entries read as a resurrection (BL-1845's documenter send, 2026-10-01); a line text becomes a finding only when the merge's count of it differs from the side's own count plus the other side's net change of it"
