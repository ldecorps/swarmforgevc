human_approval: approved
approval_context: >
  Sign-off on narrowing what BL-1576's guard reports. FIRM: a line text is a
  finding only when the merge's count of that text differs from the side's
  own count plus the other side's net change of it. That clears the
  repeated-separator false positive that held BL-1845. Putting back the one
  copy a side removed, or dropping one copy a side added, is still found.
  FIRM: the blind spot this accepts. A merge that puts back a copy this side
  removed AND deletes an untouched copy of the same text elsewhere keeps the
  count and is not found. That needs two errors on one repeated line in one
  resolution, and catching it would need position-aware matching, a larger
  change. FIRM: no change to which hunks are contested, to excuses, or to
  the refusal text.

invariants:
  - "A line text is a lost-line finding only when the merge's count of it differs from the side's own count plus the other side's net change of it; a copy the other side added or removed elsewhere is never one."
  - "For a line text that occurs once in base, both sides and the merge, findings are exactly what the text-set rule reports today."

source: |
  Documenter note 001612 (2026-10-01 01:48Z), verbatim:

  > merge_drop_guard false-pos blocks BL-1845 send - see evidence

  Documenter evidence (documenter branch, 3f138711ac):
  `backlog/evidence/BL-1845-documenter-merge-drop-guard-false-positive-20261001.md`.
  Specifier adjudication (this commit):
  `backlog/evidence/BL-1845-specifier-merge-drop-guard-boilerplate-separator-adjudication-20261001.md`.

description: |
  ## Why

  `lines-lost` (`swarmforge/scripts/merge_drop_guard_lib.bb`) builds
  `own-removed` and `own-added` as sets of line texts from one side's
  uncontested hunks. It then reports every `+` line of diff(side, merge) in
  `own-removed`, and every `-` line in `own-added`. That is exact for a
  line that appears once. `docs/reference/Specification.MD` ends every
  changelog entry with the line `Prior entry —`, 402 times at the base of
  the BL-1845 incident. When one side removes one copy (moving or
  deduplicating an entry) and the other side adds entries (each with its
  own copy), every added copy matches the removed text. No resolution that
  keeps both sides' work can then pass.

  Measured at adjudication:
  - The guard on BL-1845's refused forward reports received 3 and sender
    1, all four `Prior entry —`.
  - A count of every non-blank text in base, both sides and the merge
    leaves exactly one real discrepancy: the separator the documenter put
    back where the hardener's dedupe had left none.

  The documenter worked around it by hand with a three-commit recipe. The
  shape recurs on most documenter merges of this file.

  ## What is wanted

  - For each candidate text the current rule selects, the number of
    findings is bounded by counts over the whole path, where
    expected(t) = count(side, t) + count(other, t) - count(base, t), never
    below 0:
    - resurrections of t: at most count(merge, t) - expected(t);
    - drops of t: at most expected(t) - count(merge, t).
    Blank lines stay excluded, as today.
  - `findings-for-merge` reads the four blobs of each path it already
    diffs (base, both parents, merge) and passes their counts.
  - The rest of the guard is unchanged: contested hunks, excuses, the
    BL-1610 scan bound, the refusal message.

  ## How (direction, not mandate)

  - Whether `lines-lost` takes the counts as an extra map key or a
    separate pure function caps its result is the coder's call. Write the
    choice in the evidence. Keep it pure: it is BL-1576's property target.
  - `bl1576_merge_drop_guard_property_runner.bb` property 2b checks
    `lines-lost` against a brute-force text-set oracle. That oracle states
    the old rule, so rewrite it in this parcel to the count rule, not
    delete it. Its reach floor must still find a real loss. Keep the five
    `lines-lost` unit cases in `merge_drop_guard_lib_test_runner.bb` green
    or adapt them; they use texts that occur once (invariant 2).
  - The step handler `specs/pipeline/steps/bl1856MergeDropGuardCountsRepeatedLinesSteps.js`
    builds real git fixtures under mkdtemp (BL-1390), runs the real
    `findings-between`, and validates `resolution` against explicit
    KNOWN_VALUES. BL-1576's own handler already builds this kind of
    fixture. It is discovered from its own file (BL-1371).

  ## Scope

  `merge_drop_guard_lib.bb`, its unit runner, the BL-1576 property runner,
  the step handler, evidence. Not in scope:
  - printing the lost lines' text in the refusal (worth a sibling ticket if
    wanted);
  - position-aware matching;
  - BL-1576's, BL-1610's and BL-1683's landed features, whose scenarios
    use texts that occur once and stand as written.

