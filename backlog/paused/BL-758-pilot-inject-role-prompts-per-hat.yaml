description: |
  ## What

  Today `/pilot` (Cursor-as-expeditor) starts with one composed system brief
  that lists stages and tells the agent to wear every pipeline hat in turn.
  It does not, at each hat change, inject the real role prompt that the live
  swarm would load for that stage (specifier, coder, cleaner, architect,
  hardener, documenter, QA — including any stage overlays the pack already
  uses).

  Consequence observed in BL-723: the pilot skipped gates and conventions
  that a role wearing its own prompt would treat as mandatory. Evidence gates
  (sibling tickets) catch silent skips; they do not restore hat-faithful
  judgment. One mega-brief remains a different agent than seven sequential
  role loads.

  ## Requested outcome

  1. At each pilot hat change (and on bounce-back to an earlier role), inject
     that role's real prompt content as the active system context for the
     stage — not a one-line reminder of the role name.
  2. Keep the existing pilot isolation rules (worktree, no handoffd/tmux,
     Telegram status posts, stage-boundary cleanup) as a thin wrapper around
     those role prompts, not as a replacement for them.
  3. Prefer reusing the same role prompt files / overlays the live pipeline
     already loads; do not invent a second parallel "pilot dialect" of duties.
  4. Machine-checkable: a pilot run's stage boundary evidence shows which
     role prompt was active (path or content hash), not only a free-text
     "now wearing coder" status line.
  5. Out of scope: replacing the evidence-gate tickets (BL-727…BL-757 process
     half); those still land. This ticket does not unblock more `/pilot safe`
     volume by itself.

  ## Question for specifier

  Exact injection mechanism (append-system-prompt per stage vs session
  restart vs Cursor skill swap) is a design choice — pick the smallest
  change that makes the active prompt content match the live role for that
  hat, with durable proof at the stage boundary.
