description: |
  ## What is wrong

  A multi-seat stage's shared queue is the mailbox of the seat whose id is
  the stage name (`handoff_lib.bb` `stage-queue-dir`). On the full-forge
  pack that seat is `coder`, the iq3 local-model seat, declared
  `--seat-tier easy`; `coder@2` is `--seat-tier hard`. The dispatcher's
  claim loop leaves a medium or high ticket's parcel in that queue for
  coder@2 (BL-1001). The chase sweep (`chase_sweep_lib.bb`
  `sweep-role-inbox!`) sweeps each role's own `inbox/new/` and acts on
  the mailbox OWNER, reading no tier. So a parcel waiting for coder@2 is
  chased against coder, and once past `maxChases` with coder's pane quiet,
  coder is respawned over it, or, if responsive, the parcel is
  dead-lettered. coder@2 is never woken for it.

  On 2026-10-06, Work BL-2022 (016946) reached chaseCount 20, and handoffd
  respawned the coder seat at 08:39:10Z and 08:57:09Z while it held
  BL-1843 in progress. The intake that reported it read the result as a
  dispatcher skip.

  ## What is wanted

  - Over a parcel the swept seat may not claim (the claim loop's decision
    answers `:skip-ineligible` for that seat), the sweep sends that seat no
    wake, never respawns it and never dead-letters the parcel on its
    account.
  - When another seat of the stage may claim it and has nothing in
    progress, the sweep wakes that seat.
  - When no seat of the stage may claim it, the parcel goes to the
    dead-letter alarm with no respawn: a respawn cannot make it claimable,
    and a human needs to hear about it.
  - A parcel the swept seat may claim keeps today's ladder exactly.

  ## How (direction, not mandate)

  - BL-1004's `item-deferral-held?` is the precedent: a per-item decision
    read beside `held?` in `sweep-role-inbox!`, with the stage context read
    once per role sweep. Reuse `seat_difficulty_lib.bb`'s
    `difficulty-claim-decision` and `parse-seat-tiers`/`parse-seat-models`,
    and the ticket cost the claim loop reads
    (`handoff-lib/active-ticket-mutation-cost` over the parcel's task, as
    `ready_for_next_task.bb`'s `claim-task-name` resolves it). Do not copy
    the tier table.
  - Fail toward today's behaviour: an unreadable conf, roles.tsv or ticket
    leaves the item on today's ladder, as BL-1004's hold does.
  - The step handler drives the REAL `run-sweep!` through a bb runner with
    fake adapters, as `specs/pipeline/steps/bl1652ChaseRespawnBusyGuardSteps.js`
    does (`chase_sweep_test_runner.bb`). Never a new helper alone: the
    acceptance must exercise the function handoffd calls. Fixtures under
    mkdtemp, never this checkout's mailboxes (BL-1390).
  - The Background's two seats run different models: BL-1167 turns tier
    rules off for a stage whose seats share one model, and that stays so.

