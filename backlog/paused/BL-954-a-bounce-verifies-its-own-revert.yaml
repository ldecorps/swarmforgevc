id: BL-954
title: "The constitutional bounce revert is trusted and never verified, so a skipped one is invisible until the unreviewed content is already on origin/main — both BL-935 architect bounces left 5 of 7 files live in swarmforge-architect and nothing fired at bounce time"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 20
direction: swarm-surfaced
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-954-a-bounce-verifies-its-own-revert.feature

required_wiring:
  - "extension/src/tools/record-bounce.ts::bounceRevertCheck::the check must be loaded and called from the go-forward bounce recorder (BL-635 generalised it to every reviewing role, and its JSONL record already carries the two inputs the check needs: the bounced commit and the bouncing role). A checker that ships green but is reachable from no bounce path is the BL-419 shape - the leak stays live while the ticket reads as closed."

invariants:
  - "The verdict is decided by whether the bounced commit's CONTENT is present at the bouncing branch tip, never by whether the commit is reachable from it. This is the constitution's own instruction - confirm CONTENT is gone, never by ancestry - and a properly reverted bounce, whose commit stays an ancestor forever, must read clean."
  - "The already-on-main exception never produces a revert instruction. A bounced commit that is already an ancestor of main resolves to a breach report and nothing else; the check must never push a role toward reverting published history."
  - "Recording the bounce is never contingent on the check. The record is written whatever the check concludes or fails to conclude, and a check that cannot complete reports its cause rather than reading as clean."

description: >
  Bouncing a parcel requires the bouncing role to remove the bounced commit's
  content from its own review branch in the same step ("A Bounce Must Be
  Reverted Out Of The Bouncing Branch", BL-490/BL-495), confirmed by CONTENT
  and never by ancestry, with one exception: a commit already an ancestor of
  main is reported as a breach instead of reverted.

  Nothing checks that any of this happened. The step is pure discipline, and
  when it is skipped the bounced content stays live in the reviewing branch
  and rides forward on every later, unrelated parcel that role correctly
  forwards - until it reaches main. Both times this has been caught, it was
  caught by hand, hours later, by a role that happened to look.

  Measured on 2026-08-19, BL-935's two architect bounces:

  - 12:34 +01 the architect bounces e4b327e031 (structurally vacuous
    property test). No revert. At that moment e4b327e031 was NOT an ancestor
    of main - main first contained it at 13:52:35 +01 - so the constitution's
    revert step applied squarely and the exception did not.
  - 13:09 +01 the architect bounces dfc82c1fdf (the coder's fix for the first
    bounce, routing defect). No revert. main first contained it at 14:02:14
    +01, again after the bounce.
  - git log --all --grep over both hashes shows no revert commit for either,
    and the content is still there: of the 7 files in e4b327e031, 5 are
    byte-identical at swarmforge-architect's tip and differ from their parent
    - measured file by file, not by ancestry.
  - Both commits are now on main AND origin/main while BL-935 sits unapproved
    in backlog/active/.

  A check at bounce time would have fired on both, before either leaked, from
  data that already exists: .swarmforge/bounces/<YYYY-MM>.jsonl already
  records the bounced commit and the bouncing role for every bounce.

  How (direction, not mandate): the natural home is the bounce recorder
  itself - the role is already telling the system it bounced something, and
  that is the moment the branch state is unambiguous (the fix does not exist
  yet, the ticket is not approved, so any bounced content still live is a
  real violation with no benign reading). Whether the check blocks, warns, or
  merely reports is the coder's and architect's call; what must not survive
  is a bounce that says nothing at all about its own required revert.

constraints: >
  Out of scope:

  - BL-952 (active). That ticket fixes how a landing DECISION reads approval
    - the publish gate inferring "approved" from swarmforge-QA ancestry.
    This one fixes the SOURCE: whether the bouncing role's branch was
    actually cleaned. They compose and neither subsumes the other; BL-952
    blocks the leak at the exit, this catches it at the entrance. Do not
    widen either into the other - BL-952 is in flight and rewriting an active
    ticket's YAML is the staleness failure BL-317/BL-325 exist for.
  - Reverting anything already published. e4b327e031 and dfc82c1fdf are both
    ancestors of main; the constitution's explicit exception applies (do NOT
    revert, report the breach), and that report is this ticket. Disposition
    of the landed BL-935 code is the operator's call.
  - Performing the revert automatically. This ticket makes the skipped step
    VISIBLE. An agent that silently rewrites its own branch on the strength
    of a heuristic is a worse failure than the one being fixed.
  - Re-litigating where a bounce-fix re-enters the pipeline (open question
    with the operator, BL-951's orbit). This check is indifferent to the
    answer: whatever route a bounce-fix takes, the bouncing branch still has
    to be clean.
  - Retro-checking historical bounces in the store. Going forward only; a
    sweep over the existing month's records is a separate ticket if wanted.

qa_e2e_procedure: >
  From the repo root:

  1. Reproduce before the fix, from durable git data only. For each path in
     git diff-tree --no-commit-id --name-only -r e4b327e031, compare
     git show swarmforge-architect:<path> against git show e4b327e031:<path>
     and git show e4b327e031^:<path>. Five of the seven match the bounced
     version and differ from the parent - the bounced content is live in the
     bouncing branch, and no revert commit exists for it anywhere
     (git log --all --grep=e4b327e0). That is the defect in one command, and
     today nothing reports it.
  2. At the parcel commit, drive the check over a fixture repo - never the
     live worktrees - holding one unreverted bounce and one properly reverted
     one. The unreverted case must report a violation and name the revert
     command; the reverted case must report clean.
  3. Confirm invariant 1 is content-based, not ancestry-based: in the
     reverted fixture, assert git merge-base --is-ancestor <bounced>
     <bouncing-branch> still exits 0 AND the check still reports clean. A
     check that reports violation here has encoded ancestry and fails this
     step.
  4. Confirm invariant 2: a fixture whose bounced commit is already an
     ancestor of main must report a breach and must NOT emit a revert
     command. Grep the output for any revert instruction; finding one fails
     this step.
  5. Confirm invariant 3: force the check to fail (unresolvable commit, then
     missing bouncing branch) and confirm in each case that the bounce record
     is still in .swarmforge/bounces/<YYYY-MM>.jsonl, that the reported
     verdict is undeterminable, and that the cause is named. A silent
     swallow, a lost record, or an undeterminable case reading as clean each
     fail this step.
  6. Prove non-vacuity: replace the content comparison with an ancestry check
     and confirm scenario 01's reverted row and scenario 02 both fail, then
     restore. A fix whose reverted case still passes under an ancestry-only
     implementation is not testing the defect.
  7. Confirm the wiring is real, not just the lib: record-bounce.js run
     against the fixture actually produces the check's output. A green unit
     suite over an unreachable helper is the BL-419 shape this ticket's
     required_wiring exists to refuse.
  8. Confirm nothing regressed: an ordinary bounce recording still writes the
     JSONL record and the ticket's bounce_history exactly as before
     (BL-635/BL-689 suites green, no test weakened).

notes: >
  Source: architect note to specifier+coordinator, priority 00, 2026-08-19
  14:03 +01 (00_20260819T130323Z_000240_from_architect): "BL-935's e4b327e03
  unreverted bounce landed a vacuous property test on main", backed by
  backlog/evidence/BL-935-vacuous-property-live-on-main-20260819.md and
  self-reported by the architect as its own process gap.

  Probing confirmed the mechanism and corrected one fact, recorded here so
  nobody re-derives it:

  The architect's evidence states git merge-base --is-ancestor dfc82c1fd main
  was FALSE and that main's copy of the property test was byte-identical to
  the bounced vacuous version. That was true when observed. It is no longer:
  the coder's fix dfc82c1fdf reached local main at 14:02:14 +01, roughly one
  minute before the evidence was written, and main now carries the corrected
  property test. The content exposure was real - main shipped the vacuous
  test from 13:52:35 to 14:02:14 +01, about ten minutes - and it is closed.
  What is NOT closed, and is what this ticket is for, is that the leak
  happened at all and that nothing detected it.

  So this ticket is deliberately NOT scoped to the vacuous test. That defect
  was found and fixed by the pipeline working as intended. The defect here is
  that a bounce says nothing about its own required revert, which is why the
  same class has now been observed twice in one day from two different
  bouncing roles (BL-945/QA in BL-952, BL-935/architect here) and both times
  was found by accident.

  The bouncing role being the ARCHITECT rather than QA is the load-bearing
  new fact. BL-952's approval_context offered the operator a cheaper
  alternative - "verifying the BL-490/BL-495 revert instead", scoped to the
  QA ref. This occurrence disqualifies that option on its own terms: this
  bounce never touched the QA ref's bounce record, so a QA-ref-only revert
  check would not have seen it. A note carrying that constraint has gone to
  BL-952's holder.

  IR-DRY: 9 medium findings, all reviewed and kept. Seven are the two
  Scenario Outlines' own instantiations (<content_state> against live/
  reverted, <verdict> against clean/undeterminable) - step reuse, not
  duplication. The remaining two pair "the bounced commit is still an
  ancestor of the bouncing branch" with the content steps; that contrast IS
  scenario 02's assertion (ancestry true, content gone, verdict clean) and
  merging either would erase the invariant the scenario exists to prove.

approval_context: >
  Two things worth your eye.

  First, whether this should be its own ticket at all rather than folded into
  BL-952. I have kept it separate deliberately: BL-952 changes how a landing
  reads approval, this changes whether the bouncing branch was cleaned, and
  they fail independently. But they are close enough that you may prefer one
  ticket - say so and I will withdraw this and amend BL-952 instead. Note
  that BL-952 is already active, so that route means a mid-flight amendment.

  Second, how loud the check should be. I have specced it to REPORT, not to
  block, because a bounce that cannot be recorded is worse than a bounce
  whose revert is unverified - the send-back itself must never be held
  hostage to a git check. If you would rather a violation hard-fail the
  bounce recording, that changes invariant 3 and I should rewrite it before
  this runs.

  There is also a live disposition question already sitting with you from
  BL-952 that this ticket does not touch: BL-935's two unapproved commits are
  on origin/main right now, the same way BL-945's are. This ticket reports
  that breach per the constitution and deliberately does not act on it.
