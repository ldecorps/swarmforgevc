description: |
  ## What is wrong

  Concurrent writers to origin/main (QA lands, coordinator closes, peer
  bookkeeping) while long QA gate windows hold a tip on a stale base cause
  frequent push races. Rematch recovery works; frequency is the defect.
  Evidence: BL-999 / BL-1100 bounce cascades vs BL-989 closes tonight.

  ## Locked mechanism (specifier)

  Ship **both** as one coherent control:

  1. **Late tip rematch at publish** — fetch + tip-pure rematch immediately
     before the land push; gate-time purity is advisory; publish-time purity
     is authoritative; bounded retry on residual race.
  2. **Serialize publishers to origin/main** — a land/close lock (or single
     publisher) so a second land waits or rematches once at the lock edge,
     not mid-gate after a peer already pushed.

  Optional soft follow-on (same ticket only if cheap): defer coordinator
  close/bookkeeping while a QA land is in flight. Do not mint a kitchen-sink
  epic.

  ## Out of scope

  - Reopening BL-1130 / BL-1131 / BL-1135 / BL-1138 / BL-1141
  - One-shot ops rematch; push-sweep QA-refusal cache (separate)
  - Weakening BL-630 / BL-855; allowing impure lands or force-push
  - Five× ready_for_next handoff-mail spam (named follow-on if still loud)
