id: BL-1834
title: "The Work-note gate counts every ticket-naming commit on the role's HEAD since the note was created, so the coordinator's own 'Promote <id>' and 'BL topic record for <id>' commits, made seconds after the dispatch and merged in from main, read as the role's work - on 2026-09-30 the coder completed the Work notes for BL-1830, BL-1833 and BL-1816 back to back with nothing built and went idle, stranding three active tickets (coordinator note 013867) - a commit reachable from main is never a role's work evidence"
milestone: M8
type: defect
severity: high
# high: dispatched work is dropped silently. The gate built to stop
# exactly this (BL-1422) waves it through, and the completed Work notes
# still read as a dispatch trail, so nothing re-routes. Three active
# tickets stranded in one drain, one of them a high defect (BL-1833).
status: todo
epic: swarm-reliability
priority: 2
