specifier_pickup_2026_09_02: |
  Picked up on the coordinator's note "BL-472 promoted (active), author its
  feature file at pickup". The feature file is deliberately NOT written yet,
  and the ticket's own text is why: it says the Gherkin is authored at pickup
  "once the open questions above are resolved", and warns that "a feature file
  whose scenarios outrun an undesigned build would be premature". Question 1
  is now resolved; its answer opens a decision that is not the specifier's to
  take. Writing scenarios now would spec a build that may never happen.

  ## OPEN QUESTION 1 — ANSWERED, empirically

  "Do clj-mutate/crap4clj/dry4clj build+run in THIS environment (babashka, not
  full Clojure/JVM)? Confirm before pinning."

  **No. All three need a JVM, and this host has none.**

  - All three upstream repos exist: `git ls-remote` succeeds for
    github.com/unclebob/{clj-mutate,crap4clj,dry4clj}. The premise is sound.
  - Local toolchain, measured: `bb` = babashka v1.12.218. `java`, `clojure`,
    `clj`, `lein` are ALL ABSENT.
  - Each repo's `bb.edn` declares `:deps` — clj-mutate on the Maven coords
    org.clojure/tools.reader and speclj/speclj; crap4clj and dry4clj on
    io.github.unclebob/deintroverter4clj by `:git/url` + `:git/sha`. Babashka
    resolves `:deps` through deps.clj, which shells to the Clojure CLI.
  - Measured, not inferred: `bb tasks` in each of the three clones fails
    immediately with
    `java.lang.Exception: Couldn't find 'java'. Please set JAVA_HOME.`
    at `borkdude.deps$get_java_cmd`. This is dependency RESOLUTION failing —
    no tool code is reached at all.
  - Upstream agrees this is a real boundary, not a local misconfiguration:
    clj-mutate ships a `spec-bb` suite whose bb.edn task is documented as
    "Run alternate specs for JVM-only failures under Babashka".

  Consequence: wiring these tools is not "pin + install script". It requires
  provisioning and pinning a JVM plus the Clojure CLI on every host that runs
  a hardener .bb pass. That is the branch the ticket flagged in advance ("if
  they are JVM-only the wiring story changes, and may argue for keeping .bb on
  unit-tests-only permanently"), so it goes back to the operator as
  `ruling_options` rather than being decided here.

  ## OPEN QUESTIONS 2 and 3 — provisional specifier disposition

  Recorded now so that if the ruling is "provision the JVM", the spec can be
  written immediately without another round trip. Neither is binding on the
  operator.

  - Q2, scope: `swarmforge/scripts/*.bb` only, excluding
    `swarmforge/scripts/test/`. That is exactly the deployed surface
    `build_freshness_lib.bb`'s `on-deployed-surface?` already defines, so the
    gate's scope and the deploy gate's scope agree by construction instead of
    drifting apart.
  - Q3, bar: NOT hardener parity on day one. On-touch only, per BL-428 — the
    existing .bb corpus has never faced a mutation or CRAP gate, so a
    big-bang flip would block every .bb-touching ticket at once, which the
    ticket's own "FIRST-PASS COST" note already warns against.

  ## INVEST, if the build is ruled in

  As written the ticket is PIN + INSTALL + WIRE + incremental rollout, which
  fails S (one sitting) and now also E (the JVM provisioning question
  dominates the estimate). It must be split 1:N before any parcel moves —
  provisioning, pin+install, then the on-touch gate — not minted oversized.
  Deliberately not split yet: option 2 of the ruling retires the whole thing,
  and splitting first would mint tickets to immediately retire.

