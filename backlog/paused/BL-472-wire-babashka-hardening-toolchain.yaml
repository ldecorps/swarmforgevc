human_ruling: |
  Provision a JVM and Clojure CLI on swarm hosts, then build pin install and wire
approval_context: >
  Your 2026-08-30 activation ("build the Babashka hardening toolchain") is not
  in doubt and is not being second-guessed. Picking the ticket up answered its
  own blocking question, and the answer changes what you are buying.

  All three tools exist and all three are JVM tools. Each declares :deps in
  bb.edn, and babashka resolves those through deps.clj, which shells to the
  Clojure CLI and needs java. This host has babashka v1.12.218 and no java, no
  clojure, no clj, no lein - so `bb tasks` dies in all three repos before any
  tool code runs. clj-mutate even ships a spec suite named for "JVM-only
  failures under Babashka", so the gap is upstream's own, not a local
  misconfiguration.

  So this is no longer pin-plus-install-script. It is "put a JVM and the
  Clojure CLI on every host that runs a hardener .bb pass, and keep them
  pinned", and that is an infrastructure commitment with an ongoing cost. The
  ticket itself anticipated this branch and said it "may argue for keeping .bb
  on unit-tests-only permanently" - which is why this is going back to you
  rather than being decided here.

  Nothing is broken while you decide. The documented gap stays accurate and
  .bb scripts keep their unit-test gate.
ruling_options:
  - Provision a JVM and Clojure CLI on swarm hosts, then build pin install and wire
  - Keep .bb on unit-tests-only permanently and retire this ticket
  - Pin and vendor the tools now but run the gate only where a JVM already exists
