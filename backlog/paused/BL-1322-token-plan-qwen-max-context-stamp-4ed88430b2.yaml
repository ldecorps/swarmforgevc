approval_context: >
  BL-848 hotfix stamp-off for already-landed commit 4ed88430b2. Review-only:
  it confirms or refutes the land and never reimplements it. No choice is
  posed here — approving authorizes the review parcel; the certify/waive
  decision on the ledger row stays human-only and comes after the review
  (BL-848).

  Three things to know before you approve. First, the hotfix re-staffed the
  bob mono-router pack: every pipeline seat now rides the claude agent with
  --model qwen3.8-max (Qwen Token Plan via apps/anthropic), and only the
  coordinator stays on claude-sonnet-5 (Anthropic Max, auto-provisioned) so
  wake/poke stays Max-backed. That replaces the multi-vendor staffing of
  2026-08-31; the commit calls this a quality trial. The stamp confirms or
  refutes what landed — it does not second-guess the trial.

  Second, a cross-pack side effect: the fix adds the 1M context declaration
  to the SHARED Token Plan compat branch, so packs using the global
  SWARMFORGE_USE_QWEN=1 flag now also declare CLAUDE_CODE_MAX_CONTEXT_TOKENS
  on their Claude seats, not just bob. The commit's own comment says that is
  intended ("every Qwen Claude seat"). Reported by the review, not undone.

  Third, the 1M declaration rests on the platform claim that Token Plan
  qwen3.* is officially 1M, and it is operator-overridable
  (${CLAUDE_CODE_MAX_CONTEXT_TOKENS:-1000000}). The review records what it
  can verify about the served window, but the gateway's real window size is
  an operator-platform fact this ticket does not negotiate.

