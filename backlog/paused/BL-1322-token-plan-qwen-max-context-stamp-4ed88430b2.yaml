  extra_cli_targets_qwen_cloud and that it returns true exactly when --model
  is followed by a qwen* value, including --model as the last token (no
  value) returning false.
  (2) Confirm the launch-script Token Plan compat branch fires on
  SWARMFORGE_USE_QWEN=1 OR the predicate, and exports
  CLAUDE_CODE_MAX_CONTEXT_TOKENS with the :-1000000 default on both paths.
  (3) Confirm launch_role's new elif is LAST in the provider chain (after
  the agent != claude and role_uses_openrouter branches, so nothing shadows
  it), sources qwen_launch_guard_lib.sh, and passes QWEN_API_KEY and the 1M
  declaration via -e.
  (4) Confirm bob-multi-provider-mono-router.conf: seven window lines, all
  claude seats on --model qwen3.8-max, first line coder home, efforts
  high/medium as landed, coordinator absent from the window list.
  (5) If the bob pack is live, verify a qwen seat's pane env carries
  CLAUDE_CODE_MAX_CONTEXT_TOKENS via read-only `tmux -S <socket>
  show-environment` (never attach/probe the server, BL-657); otherwise
  record the simulated -e flags from a generated launch script.
  (6) Leave Hotfix-Certification pending until the human ledger decision.

