description: >
  WHAT. Operator/Cursor hotfix 4ed88430b2 is live on main with the trailer
  Hotfix-Certification: pending. Subject: "Hotfix bob mono-router onto Token
  Plan qwen3.8-max with a real 1M Claude Code window."

  Landed behaviour under review (do not redesign). swarmforge/scripts/
  swarmforge.sh gains extra_cli_targets_qwen_cloud(), which is true exactly
  when a seat's pack CLI tokens contain --model followed by a qwen* value.
  The launch-script generator's Token Plan anthropic-compat branch now fires
  on SWARMFORGE_USE_QWEN=1 OR that predicate, and additionally exports
  CLAUDE_CODE_MAX_CONTEXT_TOKENS="${CLAUDE_CODE_MAX_CONTEXT_TOKENS:-1000000}"
  into the seat's launch script. launch_role() gains a final elif: a claude
  seat whose --model is qwen* gets QWEN_API_KEY (via
  qwen_guard_apply_credential_fallbacks) and the same 1M declaration passed
  as pane -e env, even when the pack never set the global flag.
  swarmforge/packs/bob-multi-provider-mono-router.conf is re-staffed: all
  seven pipeline windows become claude seats on --model qwen3.8-max (coder
  home, effort high/medium per role), coordinator stays claude-sonnet-5 and
  is auto-provisioned outside the window list; the header documents the
  mis-sizing rationale and warns against setting SWARMFORGE_USE_QWEN=1 at
  pack launch (that would remap the coordinator too).

  WHY. Pipeline seats were compacting mid-ticket because Claude Code
  mis-sizes unrecognized qwen* gateway IDs to ~50k and auto-compacts. The
  declaration gives a Token Plan seat its real 1M window. Coordinator stays
  Anthropic Max so handoffd wake/poke stays subscription-backed. Separately:
  an unticketed hotfix never becomes an official swarm deal on green tests
  alone (BL-848).

  HOW (direction, not mandate). Walk the acceptance feature against the
  landed sources at 4ed88430b2. Open a narrow follow-up only if review finds
  a defect; do not rewrite the launcher's remap path in this parcel.

