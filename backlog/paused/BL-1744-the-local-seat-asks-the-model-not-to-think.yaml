description: |
  ## What is wrong

  `completeWithLocalModel` (`extension/src/tools/localQwenSeatLive.ts`
  ~line 144) posts `{ model, prompt, system, stream: false }` to ollama's
  `/api/generate`. On a thinking-capable model the reply opens a `<think>`
  block that can use the seat's whole reply budget before any answer. The
  operator measured it on qwen3.8-27b-iq3s-seat: 132 s, cut off
  mid-thought. The seat's whole purpose is a short spoken-style answer
  (its briefing says "Answer in a few short sentences that read well
  aloud").

  ## What is wanted
  - Every completion request carries `think: false`, with or without a
    system prompt. A model without the thinking capability ignores the
    field.
  - The two request-body assertions in
    `extension/test/bl1235LocalQwenSeatLive.test.js` expect it.
  - The reference is the operator's staged diff, captured verbatim in
    `backlog/evidence/BL-1744-staged-operator-hotfix-think-false-20260925.md`
    (13 source lines, most of them the docstring's reason, and 2 test
    lines). The operator ran it green: 8 test files, 78 tests. BL-1682's
    property invariant B ("no key other than `system` ever changes")
    still holds, because the field is present in both bodies.

  ## Scope
  - `extension/src/tools/localQwenSeatLive.ts` (`completeWithLocalModel`
    and its docstring).
  - `extension/test/bl1235LocalQwenSeatLive.test.js` (two assertions).
  - The feature, its step handler and `index.js` registration.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1744-the-local-seat-asks-the-model-not-to-think.feature`:
     all ok (2 of 2).
  2. `cd extension && npx vitest run --config vitest.config.mjs test/bl1235LocalQwenSeatLive.test.js`:
     all pass.
  3. `git diff <parcel> -- extension/src/tools/localQwenSeatLive.ts extension/test/bl1235LocalQwenSeatLive.test.js`
     against the evidence file's diff: identical, or the difference is
     named in a stage's evidence.
  4. After landing: master's working-tree copy of the two files (UNSTAGED
     since 2026-09-25 11:3xZ, see notes) is superseded by the land. Tell
     the coordinator to `git restore --` both paths on the master
     checkout (identical content, nothing is lost) so BL-891's reconcile
     can absorb the land. Then `git status --short -- <both paths>` prints
     nothing, and `bb swarmforge/scripts/build_freshness_cli.bb . sync` is
     no longer refused on them.

