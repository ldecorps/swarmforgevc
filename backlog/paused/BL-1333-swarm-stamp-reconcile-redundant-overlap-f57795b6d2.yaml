id: BL-1333
title: "Swarm stamp-off: certify hotfix f57795b6d2 (reconcile auto-resolves a dirty overlap whose content already matches origin/main), covering d5739d84cc as its first half"
milestone: M8
type: defect
severity: medium
# medium: the hotfix is live and unblocked a real multi-hour stall, so nothing
# is currently stalled by the stamp itself. Not high - there is no active
