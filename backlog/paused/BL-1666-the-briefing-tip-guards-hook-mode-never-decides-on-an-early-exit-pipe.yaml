description: |
  ## What is wrong

  `swarmforge/scripts/check_documenter_briefing_tip.sh` (landed
  8fad11b0dc, BL-1459) runs under `set -euo pipefail`. Hook mode decides
  two exemptions through early-exit pipes:

  ```
  284: if ! git rev-list --first-parent "${LANDED_MAIN}..${DOCUMENTER_BRANCH}" 2>/dev/null | grep -qx "$INCOMING"; then
  304: if ! git diff --name-only "$BASE" "$INCOMING" 2>/dev/null | grep -q "^${BRIEFINGS_DIR}"; then
  ```

  `grep -q` exits at the first match while the producer may still be
  writing (a long first-parent list; a diff with many paths); the
  producer dies of SIGPIPE, pipefail reports 141, `if !` reads it as
  "not on the line" or "no briefing path", and the merge is NOT judged -
  a briefing tip carrying out-of-lane content lands through the chain
  unjudged. BL-1660 measured the race in a library (57 of 400 runs under
  load, deterministic past the pipe buffer); the guard's `--tip` mode
  has no such pipe (`already_landed_day` uses `git rev-parse --verify`)
  and the specifier's 200 loaded runs of a same-date tip refused every
  time.

  Separately, QA ran `extension/test/bl1459DocumenterBriefingTipGuardInvariants.property.test.js`
  seventeen times after BL-1459 landed (evidence
  `backlog/evidence/unowned-red-bl1459-property-test-flaky-not-deterministic-20260920.md`,
  QA branch): sixteen passed, one failed invariant 1 with
  `AssertionError: expected refusal for the already-landed date 2090-01-01,
  got status 0: DOCUMENTER_BRIEFING_TIP_OK` (test.js:94, the sameDate
  branch). The specifier's one run on main passed 6 of 6 (4.0 s) and the
  guard reproduced no spurious OK under load; identical contents are not
  the mechanism (`writeCommit` throws on an empty commit). Open
  candidates: a concurrent lane's blind temp-root sweep taking the
  fixture root mid-draw (BL-1623/BL-1636: the fixture uses `mkTmpDir`
  under the shared temp dir), or a fixture-state interaction between
  consecutive draws. coder@2's earlier "stale non-vacuity marker" report
  was against the pre-rebuild copy on its branch and is moot on main.

  ## What is wanted

  - Lines 284 and 304 read their whole input: `grep -x ... >/dev/null`,
    or capture the list into a variable and test it in bash; the guard's
    shell test gains a case per exemption whose producer output is far
    larger than the pipe buffer with the match on its first line.
  - The property's fixture roots are `trackedTmpRoot`-registered (BL-1636)
    and each draw's repository is created and read inside one step so a
    sweep between draws cannot empty it; then a bounded search: the file
    three times, and a loop over invariant 1's own draws (one process)
    long enough to cover ten thousand draws. A failure found is fixed
    with its mechanism named in the evidence; none found retires the
    sighting there with the counts.
  - Register row for the property file (lane property, owner BL-1666,
    added at mint) leaves in this parcel's land (BL-1631).

  ## How (direction, not mandate)

  - `first_parent_list="$(git rev-list --first-parent "$range")"; grep -qx
    "$INCOMING" <<<"$first_parent_list"` keeps the -q with no producer
    process to kill; same for the diff. Mirror BL-1660's shell case for
    the large-output shape.

constraints: >
  The guard's decisions and messages are unchanged for every input the
  BL-1459 feature and the guard's shell test already pin. No change to
  BL-1459's feature or handler. Fixture roots stay mkdtemp git init
  repositories registered for reaping.

out_of_scope: |
  - The 31 production scripts with the same shape (BL-1660's census)
    and the 125 shell tests (BL-1665).
  - The art-director guard's own pipes: BL-1657 reworks that guard.

qa_e2e_procedure: >
  (1) `bash swarmforge/scripts/test/test_check_documenter_briefing_tip.sh`
  ONCE on the parcel commit: PASS including the large-output cases. (2)
  `cd extension && npx vitest run --config vitest.properties.config.mjs
  test/bl1459DocumenterBriefingTipGuardInvariants.property.test.js` once:
  6 passed, duration recorded. (3) `grep -n 'grep -q' swarmforge/scripts/check_documenter_briefing_tip.sh`
  names no line whose grep reads from a process pipe. (4) The parcel's
  evidence names the sighting's mechanism or its retirement with the
  bounded counts. Never "run it N times" beyond the bounded search above.

