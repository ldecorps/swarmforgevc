approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: extension/src is not
  edited - emit-throttle-recommendation and standingRedSignal are landed
  contracts (BL-1429) and the fold property agrees with them on every draw;
  the fix is in the test's own draws only. FIRM: no reach floor is lowered,
  dropped, or made rarer-to-miss by raising numRuns - BL-1062's rule is
  that a floor is met BY CONSTRUCTION, and a floor that is merely usually
  met is still a flake (same FIRM line as BL-1555 and BL-1559). FIRM: the
  three BL-1429 invariants and every assertion in the file keep their text
  and meaning; only how invariant 1 chooses each draw's rework and
  standing-red category changes. Minted by the specifier on QA's
