qa_e2e_procedure: |
  On the parcel commit, from `extension/`:
  1. `for i in $(seq 1 15); do npx vitest run --config vitest.properties.config.mjs test/bl1429StandingRedThrottleFoldInvariants.property.test.js || echo FAIL; done`
     -> 15 of 15 green, no FAIL line, and every run prints
     `BL-1572 reach map (invariant 1): {"combinations":12,"minDrawsPerCombination":5}`
     (the unfixed file fails about 1 run in 15 and prints no reach map;
     15 green runs of the unfixed file happen about 1 time in 3, so the
     printed map, not the pass count alone, is the evidence).
  2. Acceptance resolving all three scenarios of the feature file
     (`swarmforge/scripts/run_acceptance.sh specs/features/BL-1572-*.feature`
     from the repo root).
  3. Break-then-restore: remove `severe` from the iterated rework cells;
     step 1's first run fails naming the reach floor
     (`reach floor: combination severe:none drawn 0 < 5` or the
     `seen.size` assertion, whichever runs first); restore.
  4. `git diff main...HEAD --name-only` names the property test file, the
     step handler, the feature, evidence and the register row removal;
     `extension/src` is unchanged and invariants 2 and 3 of the file are
     byte-identical to main.
  5. `bb swarmforge/scripts/standing_red_register_cli.bb .` after landing
     reports no row for
     `extension/test/bl1429StandingRedThrottleFoldInvariants.property.test.js`
     and `"unowned":[]`.

