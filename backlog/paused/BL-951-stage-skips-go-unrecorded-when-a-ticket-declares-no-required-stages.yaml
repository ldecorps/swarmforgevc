id: BL-951
title: "route-required-stages returns before recording whenever required_stages is absent or invalid, so a forward hop that jumps four stages leaves no envelope header and no log line — the conservative default is the one case with no audit trail"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: pending
priority: 20
direction: swarm-surfaced
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-951-stage-skips-are-recorded-whatever-the-ticket-declares.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl951::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "Absence of a declaration is never quieter than presence of one. Every forward hop that leaves a stage behind produces the same durable evidence - envelope header and log line - whether the ticket declares required_stages fully, declares it invalidly, or omits it entirely."
  - "Recording a skip never changes delivery. The recipients a draft resolves to must be byte-identical before and after this change; this ticket makes a bypass visible, it does not make required_stages an enforcement floor (see notes - that question is with the operator)."
  - "The envelope header and the routing-skips log line never disagree. A hop writes both or neither; a header with no log line, or a line with no header, is a defect in either direction."

description: >
  `route-required-stages` (`swarmforge/scripts/swarm_handoff.bb`) short-circuits
  on this line, before any skip is recorded:

    (if (= :default-full (:source decision))
      identity-result
      ...)

  `:source` is `:default-full` in three cases - the field is absent, the field
  is empty/unparseable, or the declaration is present but its CONTENT is
  invalid. In all three the function returns `{:recipients recipients
  :routing-skipped nil}`, so no `routing_skipped:` envelope header is stamped
  and no line is appended to `.swarmforge/routing-skips.jsonl`.

  The result is exactly inverted from the intent. A ticket that DECLARES the
  full chain gets its skips recorded; a ticket that declares nothing - the
  default, and the conservative reading "every stage is required" - records
  nothing at all. `handoff-protocol.md` states the opposite twice: "Silently
  skipping a stage is not the failure mode" and "Skip recording is not a
  nice-to-have; it is load-bearing for post-hoc audit and debugging."

  Measured on main 2026-08-19, from the live mailboxes:

  - BL-631 carries no `required_stages` field. After QA bounced it at 10:51,
    the coder sent the fix straight back to QA at 11:28 (handoff
    `50_20260819T112854Z_000317_from_coder_to_QA`), jumping cleaner,
    architect, hardender and documenter. That handoff has NO
    `routing_skipped:` header, and `grep BL-631` across every worktree's
    `routing-skips.jsonl` returns nothing. Four stages bypassed, zero record.
  - BL-945 declares `required_stages: [coder, cleaner, architect, hardender,
    documenter, qa]`. Its coder->QA hop 6 minutes later DID stamp
    `routing_skipped: BL-945 coder->QA skipped=cleaner,architect,hardender,documenter`
    and did append a log line. Same jump, same day, opposite evidence -
    purely because one ticket declared and the other did not.

  Second strand, same short-circuit: `resolve-effective` returns
  `:rejected? true` with a `:rejection-reason` for a present-but-invalid
  declaration, and `required_stages_lib.bb`'s own docstring requires that
  "the rejection itself must be logged loudly by the caller - never silently
  folded into the same bucket as 'no declaration at all'". Grepping
  `swarm_handoff.bb` for `rejected?`, `rejection-reason` or `qa-omission`
  returns nothing: the caller never reads those keys. An invalid declaration
  is folded into exactly the bucket the docstring forbids.

  How (direction, not mandate): the skip record derives from the hop itself
  (`hop-skipped-stages sender delivered`), which needs no declaration to
  compute - so the recording path does not belong behind the
  `:default-full` return. Restructure so the effective set governs only the
  REWRITE decision, while recording runs for every forward hop; carry the
  rejection reason onto the record when one exists.

constraints: >
  Out of scope:

  - Making `required_stages` an enforcement floor. The router today honours
    any forward address that is a member of the effective set, so a sender
    may legitimately jump ahead; whether that should be refused is a policy
    question raised with the operator, not this ticket. This ticket makes
    the jump VISIBLE and changes delivery for nobody (invariant 2).
  - The kill-switch path. With `required_stages_routing_enabled false` the
    function must keep returning untouched recipients and recording nothing,
    so the documented "identical to legacy behavior" promise holds.
  - Backward bounces. `routes-forward?` already excludes them and must keep
    doing so - a bounce is not a skip.
  - BL-748 (`log-routing-skip!` has no try/catch, so a write failure blocks
    delivery) and BL-754 (unquoted flow reasons mis-parse). Same subsystem,
    separately ticketed, neither fixed here.
  - Backfilling records for hops already taken, BL-631's included.

qa_e2e_procedure: >
  From the repo root:

  1. Reproduce before the fix. Confirm the field evidence still reads as
     described: the handoff
     `.worktrees/QA/.swarmforge/handoffs/inbox/completed/50_20260819T112854Z_000317_from_coder_to_QA_for_QA.handoff`
     has no `routing_skipped:` line, and
     `grep -h BL-631 .worktrees/*/.swarmforge/routing-skips.jsonl` returns
     nothing, while the BL-945 handoff `...000318...` does carry the header.
  2. At the parcel commit, drive `route-required-stages` over a fixture root
     for all three declaration states (absent, invalid, full-chain) with
     sender `coder` and recipient `QA`; each must return a
     `:routing-skipped` map naming cleaner, architect, hardender and
     documenter.
  3. Confirm invariant 2 directly: for every case in step 2, the returned
     `:recipients` is `["QA"]` - unchanged from the literal draft. Any case
     that rewrites a recipient, or refuses the send, is a bounce.
  4. Confirm invariant 3: for each case, the stamped envelope header and the
     appended `routing-skips.jsonl` line name the same stage list. Assert
     both artifacts, not one.
  5. Confirm the kill-switch: with `required_stages_routing_enabled false`,
     the same three cases record nothing and deliver to QA.
  6. Confirm the backward case: sender `QA`, recipient `coder`, declaration
     absent - no record.
  7. Run the acceptance feature and confirm all 7 cases pass
     (`./specs/pipeline/scripts/run_acceptance.sh
     specs/features/BL-951-stage-skips-are-recorded-whatever-the-ticket-declares.feature`),
     and that the handler is registered in `specs/pipeline/steps/index.js`.
  8. Prove non-vacuity: restore the `:default-full` early return, confirm
     scenario 01's `absent` and `invalid` rows fail while the `full-chain`
     row still passes, then revert. A fix whose absent-row still passes
     under the old code is not testing the defect.

notes: >
  Source: QA flagged "coder sent 2 bounce-fixes direct to QA, skipped
  cleaner" to the coordinator, who routed it to the specifier as a note on
  2026-08-19 (handoff `20260819T114657Z_000572_from_coordinator`).

  The flag's premise did not survive probing, and the correction is the
  ticket. The router does not skip stages: when the literal recipient is
  already a member of the effective set it delivers exactly as addressed and
  only RECORDS what the hop passed over. So the coder chose both jumps, and
  `routing_skipped` is evidence of a sender's choice, never of a router
  rewrite. The defect is not that stages were skipped - it is that one of
  the two jumps left no trace. Verified by running the decision lib against
  BL-945's real ticket text: it resolves the full declared set and returns
  `next-required-stage after coder => "cleaner"`, i.e. the lib is correct
  and the caller's early return is the fault.

  Whether a bounce-fix may return straight to the bouncing role is
  deliberately NOT settled here. No rule in `coder.prompt`, `QA.prompt` or
  `handoff-protocol.md` addresses the return path, so both jumps were
  un-governed rather than non-compliant. Raised with the operator as a
  clarifying question; a ruling may later add an enforcement ticket, which
  this one is written not to prejudge (invariant 2).

  IR-DRY: 7 medium-confidence findings, all reviewed and kept. Five pair a
  positive assertion with its negative (`carries a routing_skipped header` vs
  `carries no routing_skipped header`) or a forward hop with a backward one -
  the contrast is the point. The remaining two would merge scenarios 02 and
  05 into one outline; they share an observable (nothing recorded) but
  exercise different guards - 02 is an adjacent hop with nothing between, 05
  never reaches routing because `routes-forward?` rejects it - so merging
  them would hide which guard a regression broke.

  Field note for whoever fixes this: `.swarmforge/routing-skips.jsonl` is
  written under the SENDER's own worktree root, so the audit trail is
  fragmented across `.worktrees/*/.swarmforge/`. The master checkout has no
  such file at all, though `handoff-protocol.md` cites the bare path as
  though it were one place to read. Not fixed here - flagged because step 1
  above will otherwise look like a missing log rather than a scattered one.

  THIRD DATA POINT, 2026-08-19 (architect note, verified) - and it corrects
  the framing above. The architect reported BL-935's D1-fix as another
  coder->architect jump. It is a third instance, but NOT of the shape this
  ticket describes, and the difference matters to whoever fixes it.

  BL-935 DECLARES the full chain - `required_stages: [coder, cleaner,
  architect, hardender, documenter, qa]`, present in the coder's own
  worktree copy today. By the reading above it should therefore have been
  recorded. It was not: the hop
  `50_20260819T115514Z_000320_from_coder_to_architect` carries no
  `routing_skipped:` header, and no `BL-935` line exists in any worktree's
  `routing-skips.jsonl`. Two sibling hops the same morning DID record -
  BL-945 at 10:46 and BL-942 at 10:51, both `coder->architect skipped=cleaner`.

  The timeline resolves it, and vindicates the root cause while breaking the
  ticket's own declared/absent wording:

  - 2026-08-19T00:45:56Z - `required_stages` lands on `main` for BL-935
    (commit `4f02c8b8e`, then in `backlog/paused/`).
  - 2026-08-19T11:55:14Z - the coder sends the hop. NO record.
  - 2026-08-19T11:56:04Z - the declaration reaches the coder's worktree
    (merge `8c7964444`), 50 seconds AFTER the hop.

  So the declaration existed on `main` for eleven hours, and the sender still
  could not see it. `:source` was `:default-full` at hop time because the
  SENDER'S CHECKOUT lacked the field - exactly the early return this ticket
  is about. Root cause confirmed, third time.

  What must change in the reading: "a ticket that DECLARES the full chain
  gets its skips recorded" is wrong as written. Recording depends on whether
  the declaration is visible in the SENDER'S WORKTREE AT HOP TIME, not on
  what the ticket says on `main`. That is the BL-317/BL-325 worktree-
  staleness pattern compounding this defect.

  That widens the blast radius well beyond what the description estimates.
  It is not only tickets that never declare. Every ticket is unrecorded
  across the window between the specifier minting or amending a declaration
  on `main` and the sender merging it - and a promotion (`paused/` ->
  `active/`) is itself a `main`-side move the sender must merge before it
  sees anything. That window covers a ticket's first hops, which is when
  jumps are most likely. Severity `high` stands, and this is the strongest
  evidence for it yet: the signal is blindest exactly when work is youngest.

  Fixer's note: do not conclude from this that the fix needs a `main` lookup.
  Deriving the record from the hop itself (`hop-skipped-stages sender
  delivered`, as "How" already directs) needs no declaration at all and is
  therefore immune to the staleness race - which is a further argument for
  that direction over reading the effective set first. Step 2 of the QA
  procedure already covers the `absent` case that reproduces this; no new
  fixture is required, only the corrected understanding of WHEN `absent`
  occurs in the field.

approval_context: >
  Two things worth your eye before this runs.

  First, the scope line. I have deliberately limited this to making a
  stage-jump visible, and NOT made `required_stages` binding - a sender can
  still address any later stage and be delivered there. That keeps the
  ticket small and reversible, but it means that after this lands you will
  see accurate records of jumps that nothing prevents. If you would rather
  the router refuse an undeclared jump outright, say so and this becomes a
  different, larger ticket.

  Second, the severity. I have called it `high` because the missing record
  is a broken safety signal rather than a cosmetic gap: it is precisely the
  "shipped without a documenter pass" failure (BL-463) that the skip-record
  was designed to catch, and it is blind in the default case, which is most
  tickets. Push back to `medium` if you read an audit gap as contained.
