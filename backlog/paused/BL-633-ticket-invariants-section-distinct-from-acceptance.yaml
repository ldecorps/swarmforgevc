source: |
  BL-590 slice 1, 2026-07-25. Four architect send-backs:

  ```
  #1  un-guarded durable writes in facilitator turn
  #2  idempotency guard misses redelivered batches
  #3  unguarded no-active branch re-applies stale text
  #4  re-paste at prerequisites-ready wipes the checklist
  ```

  Four renvois, ONE property: durable writes must be idempotent under Telegram
  redelivery. The spec is 315 lines with 10 named scenarios for slice 1 — it is
  detailed, not vague. But:

  ```
  grep -iE "idempot|redeliver|replay|duplicate|at-least-once" <BL-590 yaml>
  -> one incidental hit ("restarting does not duplicate it", about topic
     creation, not message processing)
  ```

  The coder implemented each scenario correctly, then patched idempotency
  site-by-site as the architect pointed at each site in turn. Whack-a-mole. Each
  round cost a full coder->cleaner->architect loop.

  Second occurrence, so this is not a one-off: **BL-606** took three architect
  send-backs all circling routing-record integrity ("every hop's routing record
  drops its first skipped stage", "a reviewer's bounce is rewritten forward onto
  the bouncer", "prose-read declaration + bounces silently rerouted").

  Frequency beyond these two is NOT established — see BL-635, which exists
  because the data to answer that question was never persisted.

description: |
  ## The gap in the schema

  `swarmforge/backlog-schema.md` (51 lines) has `acceptance:` as an optional
  field pointing at a Gherkin feature file under `specs/features/`. Gherkin
  scenarios are **examples**: concrete input -> concrete expected output. There
  is nowhere in the schema to state a **property** — something that must hold
  across every scenario, including the ones nobody wrote down.

  Enumerating examples cannot express "every durable write is idempotent under
  redelivery", because the statement is about the whole surface, not about any
  one path through it. Ten scenarios did not imply it, and the coder had no
  reason to infer it.

  ## Shape

  Add an `invariants:` field to the schema, distinct from `acceptance:`:

  - **`acceptance:`** stays what it is — the Gherkin contract, examples.
  - **`invariants:`** a short list of properties that hold across the whole
    slice, each phrased so a violation is checkable. "Every durable write is
    idempotent under redelivery of the same update" is one line and would have
    collapsed BL-590's four rounds into one, or zero.

  Keep it SHORT by design. A specifier that writes fifteen invariants has just
  written prose nobody reads; the useful case is one to three properties that
  the scenarios cannot express. The specifier should say in the ticket what the
  cap is and why.

  ## Who consumes it, and this is the load-bearing part

  The **architect** is the primary consumer. Today it discovers a missing
  property by finding a violation, bounces that site, and the next round
  surfaces the next site. With an `invariants:` list it reviews the slice
  against the property once and bounces the whole class in one pass — the
  difference between BL-590's four rounds and one.

  The **coder** is the second consumer: an invariant is a design constraint
  before it is a review criterion, which is where it is cheapest to satisfy.

  Note the natural fit with property-based tests: an invariant states exactly
  what a property test asserts, so an `invariants:` entry is a strong hint that
  a scenario-based test is the wrong tool. See
  [[property-test-generator-must-reach-deep-state]] for the recorded trap when
  the generator never reaches the state the property is about.

  ## RETYPED feature -> defect, high (operator directive 2026-07-25: "il faut expediter")

  Recorded so the reclassification can be disputed rather than discovered. The ticket
  schema has `acceptance:` (Gherkin EXAMPLES) and no way to state a PROPERTY that must
  hold across every example. That is not a missing convenience — it is a spec artifact
  unable to express something it must express, and the cost is measured:

    BL-590  four architect send-backs (#1/#4/#5/#6) on ONE unstated invariant
    BL-606  three send-backs, all on one routing-record property

  Seven rounds of pipeline work on two tickets, each round a full
  coder→cleaner→architect loop, because a property the scenarios could not express was
  discovered one violation site at a time.

  `severity: high` on the same reasoning as BL-635: this is the direct cause of the
  measured 21.8% rework rate, and the expedite lane exists for work the swarm created
  for itself.

acceptance: |
  Specifier writes the scenarios. Minimum behaviour:

  1. `swarmforge/backlog-schema.md` documents `invariants:` — its purpose, the
     acceptance/invariants distinction, and the length cap the specifier settles
     on.
  2. The specifier role prompt instructs: before writing scenarios, ask what
     must hold across ALL of them, and state those as invariants. A slice whose
     invariants list is empty is a legitimate outcome, not a failure — most
     small slices genuinely have none.
  3. The architect role prompt instructs: review against the declared
     invariants as a distinct pass, and when a violation is found, look for
     every other site violating the same invariant BEFORE sending back — one
     bounce per property, not one per site.
  4. A reader that already parses ticket YAML does not break on the new field
     (backwards compatible; the many existing tickets without it stay valid).
  5. Retro-fixture: BL-590's own invariant ("every durable write is idempotent
     under redelivery of the same Telegram update") is written into its ticket
     as the worked example in the schema doc.

out_of_scope: |
  - Enforcing that every ticket declares an invariant. Most slices have none and
    a mandatory field would be filled with noise, which is worse than empty.
  - Auto-deriving invariants from code or from bounce history.
  - Retro-fitting invariants onto closed tickets.
  - BL-590's own rework. Operator ruled fix-forward 2026-07-25.

