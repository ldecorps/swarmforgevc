description: |
  ## What is wrong

  `extension/src/quality/nightClosingCeremonyLive.ts` (273 lines) was never mutation-tested before BL-1640's hardener
  ran a scoped Stryker pass on 2026-09-21 (evidence
  `backlog/evidence/BL-1640-hardener-first-run-survivor-census-20260921.md`
  and the per-mutant list beside it, hardender branch 76bf756a69): 260
  mutants, 57 survived, 27 never covered against the three-file include
  set. None sit in BL-1640's own changed lines. Per-declaration census
  (`backlog/evidence/BL-1640-first-run-survivor-census-by-declaration-20260921.md`,
  survived / no-coverage): advanceBriefing 12/11;startFrozen 13/4;advanceFrozen 7/10;enterBriefing 11/0;advanceNightClosingCeremony 6/2;idleState 6/0;pushUnique 2/0.

  The survivors sit in the state transitions: advanceBriefing's deadline and briefing-present branches, startFrozen's initial state fields, advanceFrozen's drain-versus-park choice, enterBriefing's sequence bookkeeping - the existing tests walk one happy sequence and assert loosely on the resulting state.

  ## What is wanted

  - The run is repeated over the FULL unit suite first (the hardener's
    include set was three files; a no-coverage mutant here means no test
    in THAT set reached it); the evidence records the include set, the
    summary block, load and duration, and either zero survived and zero
    no-coverage or one accepted-equivalent record per remaining survivor
    with the code-level reason (BL-234).
  - Behaviour tests kill the rest, grouped by the census's declarations:
    every transition's inputs that distinguish each surviving branch (deadlines before/at/after now-ms, briefing present or absent, worked-a-shift true or false), the state fields startFrozen writes, the sequence entries pushUnique keeps or drops.
  - The evidence lists, per declaration in the census, the test file and
    case that now rejects its mutants (scenario 02).
  - Any function `npm run crap` flags in the file under 6 (coverage
    first; a small refactor only where coverage cannot reach).
  - Evidence path: `backlog/evidence/BL-1674-nightClosingCeremonyLive-mutation.md`.

  ## How (direction, not mandate)

  - `--mutate out/quality/nightClosingCeremonyLive.js`, `perTest`, sibling links per the Verification
    rules; the hardener's scoped config shape
    (`vitest.bl1640.stryker.config.mjs`, uncommitted) widened to the full
    suite; the parcel's own scoped config is not committed. Check
    `mutation_cooldown_gate.bb` first and record its decision.
  - Drive time through the functions' own now-ms arguments and the
    fixtures `test/nightClosingCeremonyLive.test.js test/nightClosingCeremony.property.test.js` already builds; never a wall clock, never
    `process.chdir()`.
  - Documenter: nothing beyond the evidence file; no diagram trigger.

constraints: >
  Tests only unless a seam is missing, in which case the smallest
  extraction that exposes the behaviour to an in-process test; never a
  hand-edited manifest. The step handler lands with the feature (BL-233).
  Promote only after BL-1640 and BL-1641 have landed - the census is re-derived at the parcel's
  start because those parcels change this file.

out_of_scope: |
  - The other two ceremony files (night-closing-ceremony-run.ts: BL-1676 and the BL-1519 remaining slice; night-closing-ceremony-gate.ts: BL-1675).
  - Any change to what the ceremony decides.

qa_e2e_procedure: >
  (1) `node specs/pipeline/cli.js specs/features/BL-1674-night-closing-ceremony-live-first-run-survivors-to-zero.feature` ONCE on
  the parcel commit: 2 scenarios ok. (2) `cd extension && npx vitest run
  test/nightClosingCeremonyLive.test.js test/nightClosingCeremony.property.test.js` once: green with the new cases. (3) `npm run crap` once: no
  function in the file above 6. (4) The parcel's evidence names the
  Stryker totals over the full unit suite with at least 250 mutants and
  survived 0, no-coverage 0, or each remainder with its reason. Never
  "run it N times".

