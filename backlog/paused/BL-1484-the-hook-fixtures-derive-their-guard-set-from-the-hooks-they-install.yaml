human_approval: pending
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: the fix is in the four test
  fixtures, the BL-1398 helper and one step handler only - no guard, no
  hook and no runner is changed. FIRM: the two green commit-msg copies are
  in scope with the two red ones (the BL-1408 sweep shape: one helper, one
  fix, no ninth hand edit), not deferred until they go red. Worth knowing:
  this is the class BL-1408's sweep declared complete on 2026-09-06; its
  enumeration grepped for a guard these four fixtures predate, so they
