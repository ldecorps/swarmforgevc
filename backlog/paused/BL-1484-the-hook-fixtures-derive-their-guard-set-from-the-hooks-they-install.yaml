invariants:
  - "Every hook-installing fixture's copy set is a function of the hooks it installs and the runner they exec, read at run time through BL-1398's helper - never a list in the test: a guard added to the pre-commit chain or to commit-msg is copied and run without editing any test."
  - "Exactly one reader of each hook line shape exists in the repo (BL-1408 invariant 2 carried forward): the four fixtures consume BL-1398's helper and none carries a parse of its own."
