source: |
  Found by the specifier on 2026-10-01 while measuring, for BL-1866's
  qa_e2e_procedure, the features whose step handlers sweep at
  registration (the 2026-09-27 rule: a procedure step that runs a feature
  the ticket does not own states its result as measured at mint).
  `node specs/pipeline/cli.js specs/features/BL-1343-replay-drops-the-tickets-own-path.feature`
  on main 4efbf49fd4 gave 5 pass, 1 fail:

  > not ok 5 - An empty replay set on an identical tip is a real answer
  > ... expected nothing left to replay, got: {"action":"escalate","reason":"land-step: 557bb0c632..557bb0c632 holds no commit credited to BL-9343"}

  No row in backlog/standing-reds.tsv named this feature.

  The human, specifier pane (Claude Code), 2026-10-01, verbatim
  (Article 5.3):

  > Hotfix the lqst red and filen8n a stamp off

description: |
  ## Status: hotfix a2173a96ea landed the fix

  This parcel is its stamp-off: the pipeline's review of the hotfix, and
  the evidence the original ticket asked for. The coder finds the code
  already changed. Review it, do not re-apply it.

  ## What was wrong

  BL-1343's scenario 05 says that when the tip is identical to
  origin/main, land-plan answers that nothing is left to replay and does
  not refuse. The specifier bisected it on 2026-10-01. Each revision was
  exported with `git archive <rev> specs swarmforge` into a scratch dir,
  with the live `extension/` linked in, and the feature run there:
  - 0fee3e80d1 (BL-1670, 09-21 09:51) and 4823eafa41~1: 05 ok.
  - 4823eafa41 (BL-1678's land, 09-21 15:45): 05 not ok.
  - 2420ea71ed~1, 2420ea71ed (BL-1713), 958ceac5fa, cd041b61bb,
    17fa16cf56, bfc95ef977, 3439119833: 05 not ok.

  BL-1678 replaced the bare `{:action :land}` that land-plan returned for
  a clean tip with a tip-pure replay built from the ticket's own paths.
  On an identical tip that replay had an empty index, so it escalated.
  BL-1713 (09-24) later added the `range-credits-ticket?` check ahead of
  the replay. An empty range credits nothing, so the escalation read
  "<origin/main>..<commit> holds no commit credited to <id>".

  ## What the hotfix changed (a2173a96ea)

  1. `land_step_lib.bb`: `tip-is-origin-main?` resolves the cited commit
     and compares it with origin/main. `land-plan` is now a `cond`: no
     ticket id escalates as before; when the caller passed no
     `:origin-main`, land-plan resolves it once and calls itself with it
     (BL-1431's one read); an identical tip answers
     `{:action :nothing-to-replay :paths [] :origin-main <sha>}` before
     any walk; everything else runs the old body unchanged.
  2. `land_step_cli.bb`: a `:nothing-to-replay` clause prints
     `LAND_ESCALATE` and BL-1713's reason, byte for byte, and exits 1.
     QA citing origin/main still has nothing of the ticket's to land, and
     BL-1713's scenario 01 row 2 keeps refusing it. The ticket's original
     direction, `{:action :land}`, would have printed LAND_CLEAN with no
     built commit and broken that row. This is why the hotfix took a
     distinct action instead.
  3. `land_step_lib_test_runner.bb`: one case pins invariant 1 for a full
     and a short sha (no `:commit`, no new branch).
  4. `backlog/standing-reds.tsv`: BL-1343's row retired, since the hotfix
     turned it green.

  ## What is wanted in this parcel

  - Review the hotfix against both invariants. Known edges to check, not
    mandates: a cited ref that is not a sha (`origin/main`, `HEAD`); an
    unresolvable origin/main (`:origin-main nil` must still fall through
    to the old body); the self-call never recursing twice.
  - The evidence says what every consumer of land-plan does with the new
    answer. At mint, land_step_cli.bb is the only production consumer.
    BL-1872's lander reads the CLI's LAND_ESCALATE, which is unchanged.
    Any caller that would misreport it is raised as a note to the
    specifier, not folded in.
  - If the review finds a defect, fix it in this parcel with a new unit
    case, and say so in the evidence.

  ## Scope

  `swarmforge/scripts/land_step_lib.bb` (land-plan and
  tip-is-origin-main? only), `swarmforge/scripts/land_step_cli.bb` (the
  new clause only), `swarmforge/scripts/test/land_step_lib_test_runner.bb`,
  and evidence.

constraints: >
  BL-1343's feature and step handler are not edited. Never edit
  backlog/standing-reds.tsv in the parcel (coder.prompt, BL-1663); the
  hotfix already retired the row.

out_of_scope: |
  - BL-1865 (the bl1343 property file's per-draw lib load).
  - BL-1375 (01, 06, 07), BL-1465 (01, 02) and BL-1466 (02): red on main
    before the hotfix and identical after it. The specifier handles them
    separately.
  - Any lane that runs every feature on main. That this red went unseen
    for 10 days is the general gap, not this ticket's.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule), from the repo
  root.
  1. `node specs/pipeline/cli.js specs/features/BL-1343-replay-drops-the-tickets-own-path.feature`:
     6 of 6 ok. Measured on the hotfix tree at mint: 6 of 6 ok.
  2. `node specs/pipeline/cli.js` on
     `specs/features/BL-1678-a-land-never-ships-an-unapproved-forward-that-shares-no-path-with-the-landing-ticket.feature`
     and on
     `specs/features/BL-1713-the-land-step-never-blesses-a-commit-carrying-none-of-the-tickets-own-work.feature`:
     4 of 4 ok each. Measured on the hotfix tree at mint: 4 of 4 ok each.
  3. `bb swarmforge/scripts/test/land_step_lib_test_runner.bb`: ALL PASS,
     including the BL-1868 identical-tip case. Measured at mint: ALL PASS.
  4. Read the coder's evidence for the consumer list and the review of
     both invariants.
  After the land: `bb swarmforge/scripts/standing_red_register_cli.bb .`
  reports no row for BL-1343's feature (the hotfix already removed it),
  and the hotfix ledger entry for a2173a96ea moves on to awaiting-human
  once this ticket is done.

