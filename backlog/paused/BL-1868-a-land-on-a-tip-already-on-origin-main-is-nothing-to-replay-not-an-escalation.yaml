id: BL-1868
title: "BL-1343's scenario 05 has been red on main since BL-1678's land (4823eafa41, 2026-09-21) with no register row: land-plan on a tip already identical to origin/main escalates (today 'origin/main..commit holds no commit credited to <ticket>', before BL-1713 'nothing to commit ... own-paths identical to origin/main') instead of answering that nothing is left to replay; this ticket owns the row and restores the non-refusal"
