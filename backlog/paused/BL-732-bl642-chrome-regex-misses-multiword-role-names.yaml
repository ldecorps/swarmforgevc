id: BL-732
title: "needsHumanDetection pane-title chrome regex misses every role display name outside a single [A-Za-z][\\w-]* token - multi-word AND @-seat names"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarmforge-console
assigned_to: specifier
priority: 75
direction: normal
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-732-pane-title-chrome-covers-every-producible-role-name.feature

invariants:
  - "Every pane title display_name_for_role can emit is recognized as chrome - the recognized set is derived from what the launcher produces, never a hand-listed subset of separators."
  - "Widening chrome recognition never swallows content: a box-rule line whose text is not a launcher-produced session name is still kept, and a pane of nothing but chrome still yields the no-question-captured placeholder rather than an empty body."

human_approval: approved
approval_context: >
  One open decision, with a recommendation. Speccing traced this defect wider
  than filed: the shipped pattern misses four of the six role names this repo
  has actually configured, not just multi-word ones. The '@' seat form
  ("coder@sonnet2" -> "SwarmForge Coder@Sonnet2") misses too, because '@' is
  neither rewritten to a space by display_name_for_role nor inside \w - and
  that form has run live in this repo's own pack. The decision is how the
  recognized set is derived: recommendation is to derive it from the shell
  transformation's contract (any run of title-cased tokens joined by single
  spaces, tokens themselves allowing the punctuation display_name_for_role
  passes through) rather than appending ' ' and '@' to the character class,
  which is the same hand-list shape that produced this bug. What is firm: the
  six names in the Examples table are all really producible today, scenario 02
  must keep real text, and scenario 03's fail-closed placeholder must survive
  the widening. What is negotiable: the exact expression of the derivation.
source: |
  Found during BL-723 (pilot-tonight quality review), coder viewpoint pass,
  2026-07-30. extension/src/panel/needsHumanDetection.ts:39 defines
  PANE_TITLE_SESSION_NAME_PATTERN = /^SwarmForge [A-Za-z][\w-]*$/, which only
  matches a single token after "SwarmForge ". swarmforge/scripts/swarmforge.sh
  display_name_for_role():304-316 title-cases hyphen/underscore-split role
  names into space-separated words (e.g. model-steward -> "Model Steward"),
  so a pane title rule line "SwarmForge Model Steward" is NOT recognized as
  chrome by the shipped regex — confirmed directly against the live regex.
  This is the exact leak class BL-642 was meant to close, left open for any
  multi-word role.

notes: |
  BL-723 coder verdict on BL-642: not-on-par for this gap — the rest of the
  fix (FOOTER_START_PATTERN, NO_QUESTION_TEXT_CAPTURED fail-closed fallback)
  is correct and well tested. Linked pilot-process defect: BL-733.

  2026-08-22, specifier: re-verified LIVE at HEAD and given an acceptance
  contract. needsHumanDetection.ts:40 still carries the unchanged pattern;
  display_name_for_role (swarmforge.sh:331) still rewrites only '-' and '_';
  swarmforge.sh:2035/2042 still compose "SwarmForge ${DISPLAY_NAMES[$i]}".
  Traced worse than filed: the '@'-seat form misses too, and the current pack
  has no multi-word role at all, so the multi-word case as filed is latent
  while the seat case has run live. Severity left at medium: the leak needs a
  non-plain role name to be configured, but when one is, every needs-human
  capture from that pane carries chrome.

description: |
  ## What

  Widen PANE_TITLE_SESSION_NAME_PATTERN (or the isPaneTitleRuleLine check
  around it) to match any role name display_name_for_role() can actually
  produce — not just a single [A-Za-z][\\w-]* token.

  Speccing (2026-08-22) found this wider than filed. Run against the six role
  names this repo has actually configured, the shipped pattern matches two and
  misses FOUR:

    coder          -> "SwarmForge Coder"           MATCH
    QA             -> "SwarmForge Qa"              MATCH
    model-steward  -> "SwarmForge Model Steward"   MISS  (space)
    coder_extra    -> "SwarmForge Coder Extra"     MISS  (space)
    coder@sonnet2  -> "SwarmForge Coder@Sonnet2"   MISS  ('@' not in \\w)
    hardender@zz9  -> "SwarmForge Hardender@Zz9"   MISS  ('@' not in \\w)

  The '@' seat form is the one that has actually shipped: this repo's pack ran
  `window coder@sonnet2 ...` until the seat was removed 2026-08-21, and the
  seat pool still names coder@extra, hardender@zz9, cleaner@b. Because '@' is
  neither rewritten to a space by display_name_for_role nor a member of \\w,
  a seat pane's title rule leaks into the captured question text verbatim.

  Direction (not mandate): derive the recognized set from what
  display_name_for_role can emit rather than appending ' ' and '@' to the
  character class — a hand-extended list is the shape that produced this bug
  and will drift on the next separator the launcher learns.

  ## Acceptance

  See specs/features/BL-732-pane-title-chrome-covers-every-producible-role-name.feature

qa_e2e_procedure: |
  Against the live repo, no swarm restart needed:

  1. Confirm the producible names. Run display_name_for_role from
     swarmforge/scripts/swarmforge.sh under zsh for each of: coder, QA,
     model-steward, coder_extra, coder@sonnet2, hardender@zz9. Expect
     "Coder", "Qa", "Model Steward", "Coder Extra", "Coder@Sonnet2",
     "Hardender@Zz9". These are the six names scenario 01 covers.
  2. Confirm the titles are built from them: swarmforge.sh composes
     "SwarmForge ${DISPLAY_NAMES[$i]}" for the terminal window/pane title.
  3. Baseline the defect BEFORE the fix. Test the shipped
     PANE_TITLE_SESSION_NAME_PATTERN against "SwarmForge " + each of the six
     display names. Expect exactly two matches (Coder, Qa) and four misses.
     If all six already match, the fix has landed - do not pass on that alone,
     go to step 5.
  4. Run the BL-732 acceptance feature via specs/pipeline/cli.js. Expect 6/6
     Examples rows in scenario 01 to strip the pane-title rule.
  5. Prove non-vacuity: revert the widening in a scratch checkout and re-run.
     Scenario 01's four previously-missing rows must go red. Restore.
  6. Guard against over-widening: scenario 02's box-rule line reading
     "Waiting for your answer" must still be KEPT, and scenario 03 must still
     produce NO_QUESTION_TEXT_CAPTURED rather than an empty body.
  7. Re-run the existing BL-642 needsHumanDetection suite; it must stay green.
