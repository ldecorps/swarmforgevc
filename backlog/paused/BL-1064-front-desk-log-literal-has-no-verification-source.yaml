id: BL-1064
title: "The Front Desk row's BL-582 diagnostics log is grounded against a launcher that never writes it, so both bl643 property tests fail on EVERY host, deterministically - the property lane has a permanent red that is not flakiness and not load"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
priority: 70
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1064-front-desk-log-literal-has-no-verification-source.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl1064::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them. Verified absent from index.js at spec time, so the anchor cannot pass before the work is done"
  - "specs/pipeline/steps/bl643NonPipelineAgentsSteps.js::'Front Desk': [::LOG_VERIFICATION_SOURCE_OVERRIDES must gain a Front Desk entry naming the file that actually writes the diagnostics sink. The pattern is the map's own existing key formatting (compare 'Model Steward': [ on line 155) and is verified ABSENT from the file today - the bare strings Front Desk and telegram-front-desk-bot both already appear elsewhere in this file and would have passed before any work was done. Single-quoted key, matching this file's style; the gate matches this as a plain substring with no YAML unescaping (BL-960), and the entry was verified through parse-wiring-entry at spec time"

invariants:
  - "Every row whose log literal is written somewhere other than its launcher declares that writer explicitly; the grounding check never falls back to a source that cannot contain the literal."

description: >
  `specs/pipeline/steps/bl643NonPipelineAgentsSteps.js` grounds each row's log
  literal by reading the script the row's Launcher column links, unless the row
  has an entry in `LOG_VERIFICATION_SOURCE_OVERRIDES`. Three rows already carry
  such an entry, each for the same reason: their log is written by something
  other than their launcher (Babysitter -> babysitterd.sh, Support ->
  support_runtime.bb, Model Steward -> model_steward_store.bb).

  The Front Desk row is a fourth case with no override. Its Log location cell in
  `docs/reference/BL-643-non-pipeline-agents-reference-table.md` names TWO
  literals - `.swarmforge/operator/front-desk-supervisor.log` and
  `.swarmforge/operator/front-desk-diagnostics.log` (BL-582's durable diagnostic
  sink). Measured at a7390808f: `swarmforge/scripts/launch_front_desk.sh`
  contains `front-desk-supervisor` 4 times and `front-desk-diagnostics` ZERO
  times. The diagnostics literal is written by
  `extension/src/tools/telegram-front-desk-bot.ts` - the bot itself, not its
  launcher. So the row is ungrounded and the checker is right to say so.

  BOTH tests in `extension/test/bl643NonPipelineAgentPaths.property.test.js`
  therefore fail, including the non-vacuity test, whose message is explicit:
  `bl643: row "Front Desk" log literal(s) not found (by basename) in its
  verification source(s): [".swarmforge/operator/front-desk-diagnostics.log"]`.

  THIS IS NOT FLAKINESS. It is deterministic, reproduces on `main` (verified in
  the master checkout, not only in the reporting worktree), and is independent
  of host load and of seed. It is severity high because it is a permanently red
  gate rather than an intermittent one: while it stands, NO role can get a clean
  property-lane run for any ticket, which is exactly the condition that trains a
  swarm to wave a red lane through (BL-816).

  THE TABLE IS CORRECT AS WRITTEN - do not "fix" the documentation by deleting
  the diagnostics literal from the row. That literal is a true and useful claim
  about where BL-582's sink lives; what is missing is the checker's knowledge of
  which file writes it. Deleting the claim would turn a caught drift into an
  uncaught one.

  ROUTING NOTE FOR THE COORDINATOR AND FOR QA'S BOUNCE ROUTING. The defect is in
  the step registry's source map, not in the prose, so this is NOT a
  documenter-owned doc defect despite the symptom pointing at a reference table
  (Article 4.3: ownership drives routing, not the surface the failure names).

  HOW (direction, not mandate). Add the Front Desk override naming the real
  writer(s) of both literals, in the same shape as the three that already exist.
  Consider while you are there whether the fallback should FAIL LOUD when a row
  names several literals and the fallback source can only account for some of
  them - the current fallback silently produced a source that could never
  contain one of the two, and that silence is why this sat until a property run
  surfaced it.

qa_e2e_procedure: >
  1. At the parent commit, in the MASTER checkout (not a worktree), run
  `npx vitest run --config vitest.properties.config.mjs
  test/bl643NonPipelineAgentPaths.property.test.js` from extension/ and confirm
  the absence of the behaviour: both tests fail, and the non-vacuity failure
  names `.swarmforge/operator/front-desk-diagnostics.log`. This also confirms
  the defect is on main and not an artifact of the reporting worktree.
  2. At the parcel commit, repeat and confirm both tests pass. 3. Confirm the
  grounding is real, not bypassed: verify the Front Desk override names a file
  that genuinely contains the literal `front-desk-diagnostics`, and that the
  supervisor literal is still grounded too. 4. Confirm non-vacuity survives: add
  a throwaway row carrying a log literal no source contains, confirm the check
  fails naming that row and literal, then remove it. 5. Confirm the table was
  not weakened: diff
  docs/reference/BL-643-non-pipeline-agents-reference-table.md and confirm the
  Front Desk row still names both log literals. 6. Confirm the whole property
  lane: run `npm run test:properties` and confirm bl643 is no longer among the
  failures.

notes: >
  PROVENANCE. QA `note` 00_20260822T134343Z_000879: "Property lane flaky under
  worktree load: bl857,796,643,968,948 - investigate". Split 1:4 under the
  specifier's Consolidation Authority. This file was reported as load-related
  flakiness and is neither - recording that explicitly, because a deterministic
  red filed as a flake is the kind of item that gets re-run instead of fixed.
  Siblings: BL-1061 (bl857), BL-1062 (bl968 + bl948), BL-1063 (bl796, the only
  genuinely load-sensitive one). Evidence:
  backlog/evidence/BL-1061-property-lane-triage-20260822.md.

  IR-DRY: 0 findings; no normalization needed.

