description: |
  ## Shape (three pieces + unchanged backstop)

  1. ANCHOR: the human occasionally relays the Usage numbers (operator
     command or Telegram verb). Two anchors + transcript-measured burn
     between them self-calibrate %-per-token; thereafter the swarm projects
     its own gauge between anchors. A stale anchor (>N days) means degraded
     mode, labelled as such — never a confident number.
  2. BURN METER: transcript-derived tokens per shift per seat, from the
     BL-664 walker — including the OPERATOR SESSION itself (a governor that
     ignores its own supervisor lies).
  3. GOVERNOR: runs at each shift boundary (BL-660's shift applier is the
     natural host). remaining% / time-to-reset vs measured burn/shift gives
     the verdict, in order of preference: full shift -> SHORT shift (trim
     hours) -> CHEAP shift (ModelFactory `assign --mode cheap`, certified
     seats only — the verb exists, BL-525) -> SKIP (announce; approvals and
     Telegram still drain at the next start).

  The founding fixture is the filing-day arithmetic above (71% at 2.2 days,
  5x over budget) — the governor's acceptance must reproduce its verdict.

  Relations: BL-660 (shift source — the governor is its budget twin),
  BL-619 (briefing warning — the governor is the acting counterpart of that
  read-only warning), BL-551 ledger (fed by the same walker), COST
  experiment log (verdicts are annotations).
