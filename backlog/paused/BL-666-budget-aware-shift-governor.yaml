approval_context: >
  Your ask 2026-07-26 ("can the swarm be aware of my token usage? and adapt
  the cadence of 3x8 it can afford to keep going to the next replenish"),
  shaped by the operator session. Firm: no programmatic plan-usage API
  exists, so calibration needs you to relay the Usage % occasionally (one
  Telegram line like "budget 71% reset thu-07:00"); burn between anchors is
  self-measured from transcripts (BL-664 walker). Needing your sign-off:
  the verdict ladder full -> SHORT shift -> CHEAP shift (ModelFactory
  certified cheap assignment) -> SKIP, decided at each shift boundary and
  always announced with its arithmetic. Reject if you'd rather the swarm
  only WARN (BL-619 already leads the briefing with the burn warning) and
  leave cadence decisions to you.
invariants:
  - "The governor never spends paid credits without an explicit human opt-in — the prepaid plan and credits are different substances."
  - "Every verdict is announced with its arithmetic (remaining% / days-to-reset vs measured burn/shift) — never silent."
  - "The PROVIDER_LIMIT/cooldown machinery remains the hard floor when pacing miscalculates — the governor never weakens the BL-305 fail-open backstop."

