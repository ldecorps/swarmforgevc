  step, not drift - scenario 06 varies aliveness rather than age, so it
  cannot fold into the outline's Examples table.

  Sibling stamp-off BL-1333 (f57795b6d2 + d5739d84cc) is the same shape and
  the same reviewer can reuse its posture, but the two are independent: no
  depends_on, and neither blocks the other.

