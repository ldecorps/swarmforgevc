invariants: []

source: |
  Specifier census, 2026-10-03:
  backlog/evidence/BL-1870-merge-path-decline-census-20261003.md, cause 1.
  .swarmforge/lander/BL-1891-d3bb22043c.log, BL-1893-90b1c556a8.log and
  BL-1906-ec82c2560a.log each read "LAND_PATH land-step: merging
  origin/main into the line conflicts". The first two merge cleanly under
  `git merge-tree`; the merge was refused by the commit-msg hook.

description: |
  ## What is wrong

  land_merge_path.bb `build!` runs `git merge --no-ff` and, on any
  non-zero exit, aborts the merge and declines with "merging origin/main
  into the line conflicts". git's stderr is discarded. A commit hook that
  refuses the merge commit (the pre-merge-commit or commit-msg chain) is
  reported as a conflict. On 2026-10-03 three declines were the
  commit-msg hook's check_merge_deletion.sh (BL-1913) and none was a
  conflict. The land record is what QA, the coordinator and the BL-1870
  census read to learn why a line left the merge path.

  ## What is wanted

  - A real conflict is declined naming the conflicted path(s).
  - A hook refusal is declined with the refusing hook's first refusal
    line, and the reason never says "conflicts".

  ## How (direction, not mandate)

  Before `git merge --abort`, read the unmerged paths (`git diff
  --name-only --diff-filter=U`). If there are none, the merge was refused
  after it resolved, so take the first non-blank stderr line. Keep the
  LAND_PATH line on one line, and truncate a long reason the way the land
  step already truncates a replay refusal.

  ## Scope

  swarmforge/scripts/land_merge_path.bb (`build!`), its bb test runner, the
  new feature and its step handler bl1914MergePathDeclineReasonSteps.js.

qa_e2e_procedure: |
  On the parcel commit, ONE run each:
  1. `node specs/pipeline/cli.js specs/features/BL-1914-a-merge-path-decline-names-gits-own-reason.feature`:
     01, 02 ok.
  2. `node specs/pipeline/cli.js specs/features/BL-1901-a-clean-parcel-line-lands-as-a-merge-of-origin-main.feature`:
     every scenario ok (measured at mint, see notes).

