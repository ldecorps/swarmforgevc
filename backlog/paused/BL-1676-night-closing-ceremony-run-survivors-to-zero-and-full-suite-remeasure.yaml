description: |
  ## What is wrong

  `extension/src/tools/night-closing-ceremony-run.ts` (499 lines) was never mutation-tested before BL-1640's hardener
  ran a scoped Stryker pass on 2026-09-21 (evidence
  `backlog/evidence/BL-1640-hardener-first-run-survivor-census-20260921.md`
  and the per-mutant list beside it, hardender branch 76bf756a69): 413
  mutants, 38 survived, 293 never covered against the three-file include
  set. None sit in BL-1640's own changed lines. Per-declaration census
  (`backlog/evidence/BL-1640-first-run-survivor-census-by-declaration-20260921.md`,
  survived / no-coverage): runNightClosingCeremony 21/1;applyAction 3/8;localDayKey 5/0;parseHmToMs 3/0;withRuntimeLoudCodes 2/0;gateBypassed 2/0;resolveCeremonyDeadlines 1/1;ceremonyIsDue 1/0;parseArgs 0/58;buildRealDeps 0/51;sendHandoffNote 0/28;shiftWorkedSinceLastCeremony 0/25;briefingSent 0/20;rotateDocumenter 0/17;spawnConsultDocumenter 0/15;scanInFlight 0/13;newestMtimeMs 0/12;readActiveRole 0/11;listHandoffs 0/10;main 0/6;scanHeld 0/5;statePath 0/4;readLiveState 0/4;writeLiveState 0/4.

  The 38 survivors sit in runNightClosingCeremony's tick (21: which action the tick applies, which state it writes back, which loud codes it surfaces), applyAction's dispatch (3), and the pure helpers localDayKey, parseHmToMs, withRuntimeLoudCodes, gateBypassed, resolveCeremonyDeadlines, ceremonyIsDue (14). The 293 no-coverage mutants are the CLI entry (parseArgs 58, main 6), the dep builders (buildRealDeps 51, sendHandoffNote 28, rotateDocumenter 17, spawnConsultDocumenter 15) and the fs/mailbox readers (shiftWorkedSinceLastCeremony 25, briefingSent 20, scanInFlight 13, newestMtimeMs 12, readActiveRole 11, listHandoffs 10, scanHeld 5, statePath/readLiveState/writeLiveState 12) - exercised today only through the real CLI in the BL-1393 shell e2e and BL-1640's feature, which Stryker's vitest coverage cannot see; the engineering rule's thin-wrapper shape (exported helpers, injected exec/fs seams) is the durable fix and is BL-1519's ruling-A slice, not this one.

  ## What is wanted

  - The run is repeated over the FULL unit suite first (the hardener's
    include set was three files; a no-coverage mutant here means no test
    in THAT set reached it); the evidence records the include set, the
    summary block, load and duration, and either zero survived and zero
    no-coverage or one accepted-equivalent record per remaining survivor
    with the code-level reason (BL-234).
  - Behaviour tests kill the rest, grouped by the census's declarations:
    runNightClosingCeremony's tick over an injected deps object for every action kind and every state it can write back (the fixture test/nightClosingCeremonyRun.test.js already builds); applyAction's dispatch per action; the pure helpers at their boundaries (day keys across midnight and DST, HH:MM parsing edge values, loud-code merging, gate bypass, deadline resolution for the daemon window and the sleep path).
  - The evidence lists, per declaration in the census, the test file and
    case that now rejects its mutants (scenario 02).
  - Any function `npm run crap` flags in the file under 6 (coverage
    first; a small refactor only where coverage cannot reach).
  - Evidence path: `backlog/evidence/BL-1676-night-closing-ceremony-run-mutation.md`.

  ## How (direction, not mandate)

  - `--mutate out/tools/night-closing-ceremony-run.js`, `perTest`, sibling links per the Verification
    rules; the hardener's scoped config shape
    (`vitest.bl1640.stryker.config.mjs`, uncommitted) widened to the full
    suite; the parcel's own scoped config is not committed. Check
    `mutation_cooldown_gate.bb` first and record its decision.
  - Drive time through the functions' own now-ms arguments and the
    fixtures `test/nightClosingCeremonyRun.test.js test/nightClosingCeremonyRotateDocumenterFallback.test.js` already builds; never a wall clock, never
    `process.chdir()`.
  - Documenter: nothing beyond the evidence file; no diagram trigger.

constraints: >
  Tests only unless a seam is missing, in which case the smallest
  extraction that exposes the behaviour to an in-process test; never a
  hand-edited manifest. The step handler lands with the feature (BL-233).
