  property lane never green - bl868+bl632 time out; needs a ticket."
  Coordinator verification evidence:
  backlog/evidence/property-lane-never-green-two-timeouts-20260820.md
  (commit 520d35fb1) - QA's claim reproduced exactly from QA's own run
  log; routing there also records why this is a standing lane
  condition, not a QA bounce (the failing files belong to no in-flight
  ticket).

  Specifier probe additions beyond the evidence: both budgets are
  deliberate and commented (not vitest defaults), so the defect is the
  calibration/cost, not missing discipline; bl868's per-case cost is a
  full child vitest boot, the dominant lever; the cap determination
  method should follow the pane-own-env lesson (tmux global env is how
  SWARMFORGE_PACK currently propagates; per-session probes and ps
  mislead). Related: BL-935 (the cap), BL-961 (in flight - launcher
  export; kept out of depends_on because this ticket must make the
  lane green regardless of BL-961's landing, and the two touch
  different files), BL-871 (benign artifact allowlist), BL-868/BL-632
  (the invariants the failing files protect - their coverage must
  survive the fix).

  Orthogonality for the coordinator: touches the two property test
  files and possibly vitest.properties.config.mjs; no overlap with
  BL-967 (bb daemon) or BL-970 (bb classifier). BL-961 (active) owns
  launcher/export scripts - distinct files, co-activation acceptable.

approval_context: >
  Two calls to say the word on: (1) severity high - the lane is a
  quality gate and one of the two masked invariants is BL-632's
  no-pipeline-code-on-main safety property; if you read a standing-red
  test lane as contained process debt instead, this drops to medium
  and loses the expedite lane. (2) The fix mix is left to the coder
  (cost reduction vs measured re-budget vs cap engagement) with the
  acceptance pinned to the outcome; firm lines are no unmeasured
  budget inflation and no coverage loss.

