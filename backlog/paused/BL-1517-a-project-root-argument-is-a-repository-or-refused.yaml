id: BL-1517
title: "Babashka CLIs that take `<project-root>` positionally accept a flag or a literal as the root and create it under cwd: `main_sync_status_cli.bb --help` wrote `--help/.swarmforge/daemon/` (2026-09-04), `operator_runtime.bb --tick-once` wrote `--tick-once/.swarmforge/operator/` (2026-07-13), `expedite_cli.bb` created `unpark/.swarmforge/expedite/` (2026-09-04); a shared root-argument check refuses a root that is not an existing git checkout before any directory is created"
milestone: M8
type: defect
severity: medium
# medium: real but contained. Each run wrote state to a wrong, ignored
# place and reported on it (a `--help` invocation returned a sync verdict
# about an empty directory); no live decision was taken on that state that
# we can find, and the misplaced files are removed by BL-1516. It is the
# fail-open shape - a wrong root answers instead of refusing - which is why
# it is not low.
