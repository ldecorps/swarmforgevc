id: BL-1438
title: "BL-1432's ruled re-point of the QA branch shipped with no live caller: post-land-repoint! is built and tested in land_step_lib.bb and nothing invokes it, so the QA branch keeps growing by a few commits per land and BL-1432's live check cannot be run; land_main_publish.sh, the script QA runs for every land, invokes it once a land has published, prints the outcome, and never lets a skipped re-point fail the land"
milestone: M8
type: defect
severity: medium
# medium: real but contained. The bounded walk (BL-1432's other half) is
# live, so lands are fast and the sibling report is honest; only the
# branch's convergence, which the human ruled, is not happening. A
# mechanism with zero callers is the BL-1235 class, and the ticket that
# minted it anchored only its step handler - the specifier's own miss.
status: todo
epic: swarm-reliability
priority: 6
direction: swarm-reported
