  verbatim per BL-680/BL-681:

  [telegram 2026-08-02T19:15:24.660Z] "Non je veux qu'elle tourne tout le
  temps. Est ce que l'operator et le babysitter arrivent à régler les
  problèmes de famine, assez courant depuis peu?"

  [telegram 2026-08-03T08:59:02.913Z] "Fix the process . If it were an
  intended pause I would have said so"

  [telegram 2026-08-03T09:00:09.063Z] "I said multiple times since
  yesterday evening I want the swarm to get back to work"

  Operator diagnostic [2026-08-03T08:36:29.160873Z]: "The coordinator keeps
  clearing handoffd's generic ticketless open-slot sweeps ('Nth identical
  nudge — cleared') without ever picking a concrete candidate. Auto-recovery
  (coder nudge loop + 5-min sweeps) has not taken. I can't promote (operator
  hard limit)."

notes: |
  ## Severity rationale

  `high`: a live fault degrading behaviour — the promotion path starved
  approved queue-jump work on an idle swarm until a human pushed, and the
  human states the famine is recurrent ("assez courant depuis peu").

  ## Disposition of the rest of SUP-1 (recorded here so the archive walks)

  - "Send me the base URL and the token bearer" — dispositioned live by the
    operator (no credentials over Telegram); the underlying need (phone
    access) shipped via BL-787 (named tunnel fixed URL) + BL-788 (pairing).
  - Operator's A-or-B question (full 7-role pack vs mono-router): answered
    by "Fix the process" — mono-router stays (BL-518 by design); the
    starvation defects are fixed instead (BL-795, BL-794, this ticket).
  - "Ok go" (full relaunch) — consumed live 2026-08-02; operator corrected
    itself and relaunched mono-router properly.

  ## e2e procedure for QA

  1. Fixture a repo with an open slot and approved paused candidates
     (one expedited defect, one higher-priority feature); run the sweep
     once (daemon poll-once); assert the delivered nudge names the
     expedited defect id and its approval state.
  2. Repeat the sweep past the escalation threshold without promoting;
     assert a promotion-inaction escalation reaches the operator channel
     and silent identical re-nudges stop.
  3. On a live mono-router: leave one approved ticket in paused/ with an
     open slot; observe the coordinator either promotes+routes or records
     a concrete blocking reason — never an uncaused clear.
