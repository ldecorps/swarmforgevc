approval_context: >
  Defaults I picked, all amendable. (1) severity high — this is the
  promotion-side sibling of BL-795's rotation-side starvation: the swarm sat
  idle ~2.5h with three approved defects unpromoted until the human pushed,
  and the human explicitly ordered "Fix the process". Flip to medium if you
  consider the BL-795 fixes sufficient mitigation. (2) The nudge NAMES
  candidates but the coordinator keeps promotion judgment (orthogonality,
  throttle) — the daemon never promotes on its own. (3) Escalation threshold
  defaults to 3 unacted nudges; amend if too chatty.

description: |
  ## What

  On 2026-08-03 morning three defects sat `human_approval: approved` in
  `backlog/paused/` for ~2.5h (BL-787 priority-2 queue-jump, BL-788,
  BL-789) while the swarm was fully idle (active:0, coder ready). handoffd's
  open-slot sweep kept nudging the coordinator, but the nudge draft
  (`chase_sweep_lib.bb::open-slot-nudge-draft-lines`) is GENERIC and
  ticketless — so the coordinator treated the Nth identical nudge as noise
  and cleared it without ever picking a concrete candidate. Auto-recovery
  never took; the human had to intervene over Telegram.

  Three coupled gaps:

  1. **The nudge carries no candidate.** A ticketless "open slot + paused
     work" poke gives the coordinator nothing concrete to act on and makes
     every nudge look identical — inviting dedup-as-noise.
  2. **Clearing is unaccountable.** The coordinator can clear the nudge with
     no promoted ticket and no recorded blocking reason, and nothing
     distinguishes a deliberate hold from inaction.
  3. **Inaction never escalates.** The sweep re-nudges on cooldown forever;
     N unacted nudges with an open slot and approved eligible work is a
     starvation signal that should reach the operator, not loop silently.

  ## Live integration points (verified 2026-08-03)

  - `swarmforge/scripts/chase_sweep_lib.bb` — `open-slot-nudge-draft-lines`
    (nudge content), `decide-open-slot-nudge?` (dedup/cooldown decision).
  - `swarmforge/scripts/handoffd.bb` — `open-slot-nudge-sweep!` /
    `nudge-coordinator-open-slot!` (the production sweep wiring).
  - `swarmforge/roles/coordinator.prompt` — the never-clear-without-cause
    duty (invariant 3) lands as a prompt amendment in the same parcel; the
    specifier owns that file and will apply it when this ticket activates.

  Candidate selection in the nudge is ADVISORY: Article 3.2.4 ordering
  (expedited defects first, fail-closed on missing severity, then ticket
  priority) plus human_approval state. Orthogonality and the circuit
  breaker stay coordinator judgment — the daemon never promotes.

  ## Out of scope

  - Rotation-side starvation (BL-795, active) and stale holders (BL-794).
  - Stranded-resident detection (BL-685).
  - The depth-warning miscount (BL-683).

acceptance: specs/features/BL-798-open-slot-nudge-names-candidate.feature.draft

source: |
  Intake SUP-1 (.swarmforge/operator/INTAKE-sup-1.md, archived
