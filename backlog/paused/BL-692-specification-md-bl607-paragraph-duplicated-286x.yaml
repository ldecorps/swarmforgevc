source: |
  ## What is wrong

  `docs/reference/Specification.MD` contains **286 copies** of a single
  ~2,900-character paragraph, `**Pipeline role clarifying questions into
  per-role topics (BL-607).**`. One belongs there. The other 285 are junk,
  interleaved between the real lines from line 1948 to the end of the file.

  The file is **1,361,287 bytes / 2,802 lines**. Stripped of the junk it is
  **531,668 bytes / 2,249 lines** — roughly 830 KB, 61% of the file, is one
  paragraph repeated.

  ## Where it came from — one commit, precisely

  | commit | copies | bytes |
  |---|---|---|
  | `16e82c766` (BL-560, before) | 0 | 502,857 |
  | `7fa17fecd` "Document BL-607…" | **286** | **1,335,926** |
  | …eleven later doc commits… | 286 | grows to 1,361,287 |

  `7fa17fecd` is `+573 / -1` in this file alone: 286 paragraph lines plus
  their blank lines. Every documenter pass since has committed on top of the
  corruption without noticing it — eleven commits, three days.

  ## The second, sharper defect: two variants, and the wrong one won

  The 286 copies are not identical. **284** carry a mangled CLI example:

      --options ''[opt1,opt2]''

  **2** carry the correct one, matching `role_ask.bb`'s real interface as
  documented in `swarmforge/roles/specifier.prompt`:

      --options '["opt1","opt2"]'

  The mangling is a lost layer of shell quoting, which is also the mechanism
  that explains the 286 inserts: the paragraph was appended through a shell
  loop rather than an editor. **A naive dedupe that keeps "the most common"
  copy preserves the broken example and deletes both good ones.**

  ## What is NOT wrong

  No content was lost. Every section that preceded the corruption survives,
  including the closing `## Gaps & Things Still Missing` and
  `## Out of Scope (v1)`. Verified by comparing all 1,509 non-blank
  non-duplicate lines against the pre-corruption revision: byte-identical.

  ## Re-measured 2026-08-10, unrepaired, on `main` at 622b11b6f3

  Fourteen days and ~25 further documenter commits later the corruption is
  still live and has grown with the file. Every diagnosis above still holds;
  only the magnitudes moved:

  | quantity | 2026-07-27 (as specced) | 2026-08-10 (now) |
  |---|---|---|
  | file size | 1,361,287 bytes / 2,802 lines | **1,447,994 bytes / 3,360 lines** |
  | copies of the paragraph | 286 | **286** |
  | mangled / correct variants | 284 / 2 | **284 / 2** |
  | span of the corrupted region | 1,948 → EOF | **2,486 → EOF** |
  | real non-blank lines interleaved in that region | — | **161** |

  The two CORRECT-variant copies are lines **2486 and 2491**. The BL-354
  paragraph sits at line 2483 and the BL-283 coordinator-handoff paragraph at
  2497, so the position scenario 03 asserts is still the right one.

  **The interleaving risk, measured:** the file's final lines are junk copies
  sitting *between* real bullets of the closing `## Out of Scope (v1)`
  section. Deleting the line range 2486→EOF wholesale destroys 161 lines of
  real content including both closing sections. This is the single largest
  risk in the ticket.

description: |
  Delete 285 of the 286 copies. Keep the one whose CLI example is correct, in
  the position it already occupies in the chronological narrative — between
  the BL-354 cross-thread paragraph and the BL-283 coordinator-handoff
  paragraph.

  The corruption also left 133 doubled blank lines behind. Collapse every run
  of consecutive blank lines in the file to one. **This intentionally also
  normalises the 2 doubled blanks that pre-date the corruption** — called out
  here so it is not read as scope creep at review: it makes the criterion a
  whole-file property (`no run of two blank lines anywhere`) instead of one
  needing a hand-drawn region boundary, and the two incidental spots carry no
  meaning.

  ## Constraints

  - **Prove nothing was lost, against a pinned blob.** Scenario 05's
    preservation check reads the pre-fix file from git, not from the working
    tree. Pin the sha of the commit immediately preceding the dedupe commit
    (its own parent) and **assert the pinned blob really does contain the 286
    copies**, so a wrong or drifted pin fails loudly instead of vacuously
    passing over an already-clean blob. At the time of this amendment `main`
    is `622b11b6f3` and 286 copies are verified present there.
  - **Removal only — do not rewrite surviving prose.** This is not a
    documenter pass: no rewording, resectioning, or "while I'm here" edits to
    the 161 surviving interleaved paragraphs. The only non-deletion content
    change permitted in the whole diff is keeping the correct variant at the
    surviving copy. Review should expect a deletion-shaped diff.
  - **Do not delete by line range.** See the interleaving risk in `source:`.
    Select the copies by their content, not their position.

  ## Why medium, stated plainly

  Not critical, not high: nothing at runtime reads this file, no safety or
  health signal is broken, and the swarm's behaviour is unaffected. But this
  is the project's reference specification — the document a human opens to
  learn what was built — and it is currently 61% garbage and unreadable at
  the point of corruption. Every agent that reads it pays 2.7x the tokens for
  it. Contained, real, and cheap to fix: medium.

  This severity was independently re-derived and put to the human a second
  time in BL-873 (now retired into this ticket), which argued explicitly that
  raising it to `high` would put a documentation cleanup ahead of live
  reliability work in the expedite lane and read as severity inflation. The
  human approved `medium` on that reading too.

  ## The generalisable bit

  A documenter shelled out to append prose instead of editing, lost a layer
  of quoting, and the loop ran once per remaining line. Nothing caught it —
  not the commit, not eleven subsequent doc passes, not QA. The recurrence
  guard is deliberately NOT in this ticket; it is BL-693, so this repair can
  land as the small mechanical change it is.

acceptance: specs/features/BL-692-specification-md-duplicate-paragraph-repair.feature.draft

out_of_scope: |
  - The recurrence guard. That is BL-693 — a standing duplicate-paragraph
    guard riding the suite every parcel runs. Do not build it here.
  - Reverting or re-writing `7fa17fecd`'s BL-607 documentation. The surviving
    copy is good prose; only its 285 clones are the defect.
  - Re-auditing the doc commits layered on top. They are sound; they simply
    did not notice what they were building on.
  - Any other file. The duplication is confined to
    `docs/reference/Specification.MD`, re-confirmed by measurement 2026-08-10:
    scanning every markdown file under `docs/` for a repeated line over 200
    characters finds exactly this one file and exactly these two variant
    groups, and nothing else in the tree.
  - Reconciling the specification's content against out-of-band commits.
    That is `spec-drift-realignment` / BL-564, not this deletion.
  - Splitting Specification.MD into smaller documents. Worth considering once
    it is ~620 KB rather than 1.45 MB; a separate decision either way.

qa_e2e: |
  1. `grep -c "Pipeline role clarifying questions into per-role topics (BL-607)"
     docs/reference/Specification.MD` prints `1` (it prints `286` on the
     commit this ticket was written against, and still did on 622b11b6f3).
  2. `grep -c "options ''\[opt1,opt2\]''" docs/reference/Specification.MD`
     prints `0`, and the one surviving copy carries
     `--options '["opt1","opt2"]'`.
  3. Content preservation, the load-bearing check: extract every distinct
     trimmed non-blank line from the pre-fix blob
     (`git show <pinned-parent-sha>:docs/reference/Specification.MD`) and from
     the current file, and confirm the two sets are identical — no paragraph
     was dropped along with the copies. Confirm the pinned blob itself really
     holds 286 copies, so the comparison cannot pass vacuously.
  4. Confirm by eye that the document still ends with
     `## Gaps & Things Still Missing` and `## Out of Scope (v1)` intact, and
     that no junk copy remains wedged between their bullets.
  5. Confirm the file is roughly 620 KB rather than 1.45 MB — a cheap sanity
     signal that the removal actually happened at scale.
  6. No run of two consecutive blank lines remains anywhere in the file —
     `grep -c -Pzo '\n\n\n' docs/reference/Specification.MD` (or any
     equivalent scan) finds none.

notes: |
  Gherkin parked as `.feature.draft` per BL-233; the coder promotes it and
  wires handlers in the same commit.

  Lint gate clean. IR-DRY leaves two medium findings, both reviewed and
  deliberately kept — do not "normalise" them: `repair runs` vs `runs again`
  is the idempotence scenario's second invocation, and `2 copies correct` vs
  `284 copies mangled` is the contrast this whole ticket turns on.

  Candidate for `required_stages: [coder, documenter, qa]` — this is a
  docs-only content deletion with no code, architecture or mutation surface.
  Deliberately left unset: `required_stages_routing_enabled` is off by
  default and BL-606 routing is under hawk-watch, so the safe full-chain
  default applies until an operator says otherwise.

  ## Consolidation record 2026-08-10 — BL-873 retired into this ticket

  BL-873 ("docs duplicate paragraph guard", specced 2026-08-10, human-approved)
  independently re-diagnosed this same corruption from a fresh documenter note
  and bundled the repair AND the recurrence guard into one slice. Three tickets
  for one defect; the coordinator called it. Reconciled under the specifier's
  consolidation authority (BL-680) and Article 5.3 — all three were paused, so
  spec-time consolidation applies and no in-flight ticket was rewritten.

  **Outcome:** the BL-692/BL-693 split is KEPT (the earlier-approved shape, and
  the better one: this repair is a delicate deletion over a 1.45 MB file with
  161 interleaved real paragraphs, and should not be enlarged by building a new
  guard in the same parcel — BL-634 envelope). BL-873 is retired as superseded.

  **What BL-873 contributed, folded in above:** (a) the re-measurement table
  and the interleaving risk stated as a measured constraint; (b) the pinned-blob
  preservation check with its own anti-vacuous-pass assertion, replacing a
  brittle absolute-line-count criterion that had already drifted wrong (the old
  scenario 07 asserted 2,249 lines; the file is now 3,360); (c) the
  removal-only / no-rewording constraint; (d) the `qa_e2e` procedure.

  **Human decisions carried forward from BL-873's approval, neither dropped:**
  severity stays `medium` on the explicit anti-inflation reasoning recorded in
  the description; and the human's approval of a bundled one-slice shape is
  noted here rather than silently discarded — it was approved, but so was the
  earlier split, and the split is the shape chosen for the reasons above. No
  new human approval is required for either ticket: both shapes were approved.
