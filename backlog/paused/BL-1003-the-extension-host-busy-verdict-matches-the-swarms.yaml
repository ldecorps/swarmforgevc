id: BL-1003
title: "the extension host still decides 'mid-turn' by substring-matching one marker anywhere in a pane capture, while BL-970 replaced that definition on the Babashka side with a structural frame match over the tail window - measured on real captures, the two now disagree in BOTH directions, and the false-idle direction disarms the one precheck standing between a forced respawn and a pane ten minutes into a turn"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
priority: 10
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1003-the-extension-host-busy-verdict-matches-the-swarms.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl1003::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "The two sides return the same verdict for every capture in the shared fixture set, in BOTH directions. A port that removes only the false-busy disagreement or only the false-idle one does not satisfy this - each direction comes from a different missing half of the definition."
  - "The port changes the busy VERDICT only. Agent-CLI-presence detection keeps its current behaviour: a pane running an agent CLI is still detected as such whether that pane is busy or idle."

description: >
  A mid-turn pane is classified twice, in two languages. BL-970 changed one of
  them and landed; the other was not in that parcel and still does what it
  always did.

  The swarm side (`chase_sweep_lib.bb`, BL-970, landed as `152f8331e`) decides
  busy STRUCTURALLY - a spinner-glyph-led line carrying verb words, an ellipsis
  and a digit-led parenthesized elapsed - and consults only the snapshot's
  20-line TAIL WINDOW. The hand-maintained verb list was removed outright.

  The extension host (`extension/src/panel/agentPaneState.ts:59-62`,
  `isPaneActivelyProcessing`) decides busy by case-insensitively substring-
  matching ONE marker, anywhere in the capture. No structure, no zone. Both
  halves of BL-970's fix are missing there, and each missing half produces one
  direction of disagreement.

  THIS IS MEASURED, NOT PREDICTED. Running both real classifiers over the seven
  shared captures in `specs/features/fixtures/BL-970/` - the Babashka
  `actively-processing?` at `main` against the compiled, exported
  `isPaneActivelyProcessing` - three of seven disagree:

  - `idle-quoted-busy-marker.txt`: swarm says idle, extension host says BUSY.
    A pane quoting the marker in old scrollback. Consequence: a legitimate
    respawn is refused. Visible and recoverable.
  - `midturn-unlisted-verb-no-counter.txt` and, more seriously,
    `midturn-unlisted-verb-real-capture.txt`: swarm says BUSY, extension host
    says idle. The second is a REAL capture whose live frame reads
    `✢ Precipitating… (10m 13s · ↓ 16.7k tokens)` - a pane ten minutes into a
    genuine turn - and neither fixture contains the marker substring at all.

  The second direction is why this is `high` and not the `medium` BL-997
  reasoned its way to. `tmuxClient.ts:441` calls this function as the precheck
  that refuses to type a forced respawn into a pane that is provably mid-turn.
  That check exists because of BL-137, where exactly that was typed into a
  coordinator pane mid-turn. On a real capture it now answers "not busy" and
  lets the respawn through: the one safety check in that path no longer fires
  for the case it was built for, and it fails silently in the direction that
  destroys work rather than the one that merely annoys.

  Full evidence, with the fixture-by-fixture table and a reproduction command:
  `backlog/evidence/BL-997-ts-bb-busy-verdict-drift-20260820.md`.

  How (direction, not mandate): give the extension host the same two-layer
  definition BL-970 gave the swarm - structural frame match, tail window - so
  the verdicts coincide. `isPaneActivelyProcessing` is the single chokepoint:
  its only consumers are `tmuxClient.ts:441`'s precheck and
  `isAgentActivelyWorking` in the same file, so both are fixed by changing that
  one function. The shared fixture directory is the natural carrier for the
  expected verdicts, since it already holds the marker under quarantine.

constraints: >
  Firm lines:

  - Do NOT change the Babashka side. BL-970 has landed and its definition is
    the reference; this ticket brings the TypeScript side to it. If the port
    surfaces a genuine flaw in the Babashka definition, that is a `note` and a
    new ticket, not an edit in this parcel.
  - Do NOT solve this by making the extension host shell out to Babashka to
    classify. That would put a subprocess in the UI's hot path, and the
    two-layer rule keeps the extension host and the swarm substrate as layers
    rather than one calling the other for trivia. (Same firm line as BL-997.)
  - Do NOT inline the marker literal into this ticket, its feature file, or a
    source comment a pane might display. It is a short English phrase, and any
    pane rendering it is classified busy by the very code under test - which is
    precisely the false-busy direction above. BL-970 quarantined it into
    `specs/features/fixtures/BL-970/` for this reason; keep it there. This
    ticket's YAML and feature file contain zero occurrences, deliberately.
  - Leave `UI_MARKERS` (`agentPaneState.ts:48`) ALONE. Despite carrying the
    same marker, it is not a busy verdict: it is one of the heuristics behind
    `isAgentCliRunning`, which answers "is an agent CLI present in this pane",
    a question whose answer must stay true for an idle pane. Changing it would
    break presence detection to fix a busy check. This is invariant 2, and it
    is the most likely over-sweep.
  - `extension/src/extension.ts:422` and
    `extension/src/watchdog/wedgedRespawn.ts:8` mention the marker in comments
    only and classify nothing. Leave them; a sweep that "fixes" a comment is
    churn.
  - Do NOT build the cross-language agreement GATE here. That is BL-997, which
    is active and whose firm lines forbid it from changing either definition.
    This ticket makes the sides agree; BL-997 makes them provably stay agreed.

qa_e2e_procedure: >
  From the repo root:

  1. Reproduce the defect first, on the parent commit, using the command block
     at the end of
     `backlog/evidence/BL-997-ts-bb-busy-verdict-drift-20260820.md`. Confirm
     the three disagreeing fixtures disagree exactly as the table says. A fix
     verified without seeing the drift first is not verified.
  2. At the parcel commit, re-run the same command block and confirm all seven
     fixtures now agree. Read the whole table, not the count - a port that
     flipped a previously-agreeing fixture has traded one bug for another.
  3. Confirm invariant 1 is satisfied by BOTH halves, separately. In the
     working tree, remove the tail-window restriction alone and confirm
     `idle-quoted-busy-marker.txt` goes red while the two mid-turn fixtures
     stay green; revert, then weaken the structural match to the old substring
     test alone and confirm the two mid-turn fixtures go red while
     `idle-quoted-busy-marker.txt` stays green. Revert both. Each half must be
     independently load-bearing.
  4. Confirm the BL-137 consequence directly against the real precheck in
     `tmuxClient.ts`, not just the classifier: drive `performVerifiedRespawn`
     with a capture from `midturn-unlisted-verb-real-capture.txt` and confirm
     the respawn is REFUSED with `skippedBusy`. Before this ticket it is
     allowed; that flip is the whole point.
  5. Confirm invariant 2: an idle pane running an agent CLI is still reported
     as having one. Drive `isAgentCliRunning` with `idle-real-qa-4-shells.txt`
     and `idle-quoted-busy-marker.txt` and confirm the presence answer is
     unchanged from the parent commit.
  6. Confirm the quarantine held: grep this ticket's YAML, its feature file and
     the diff's new source comments for the marker literal and assert zero
     occurrences outside `specs/features/fixtures/`.
  7. Run the acceptance feature, all scenarios green, handler registered in
     `specs/pipeline/steps/index.js`. Run the extension unit suite and confirm
     no regression in the pane-state and respawn paths.

notes: >
  Source: coder note `20260820T183008Z_000002` - "BL-997: real TS/BB
  busy-verdict drift confirmed; needs a follow-up ticket" - raised while
  working BL-997, whose `qa_e2e_procedure` step 1 instructed exactly this:
  report an arrival failure as a finding rather than adjusting the test to it.
  The coder was right to stop and report.

  The drift was re-confirmed independently by the specifier before this ticket
  was written, by running both real classifiers rather than by reading either
  one, and the finding turned out to be LARGER than the note or BL-997
  anticipated: BL-997 predicted only the false-busy direction and explicitly
  reasoned its `severity: medium` from that direction's blast radius ("a
  refused respawn - visible, recoverable, and rare"). The measured drift also
  runs the other way, on a real capture, and that direction is neither visible
  nor recoverable. Hence `severity: high` here. BL-997's own severity is not
  being changed - it is the gate, and the gate's blast radius genuinely is the
  smaller one.

  RELATIONSHIP TO BL-997, which matters for scheduling. BL-997 is the
  cross-language agreement gate and is ACTIVE. Its gate cannot go green until
  this ticket lands, because the sides genuinely disagree today. So the useful
  order is this ticket first, BL-997 second - which inverts the reasoning in
  BL-997's own `approval_context`, where the specifier argued the gate was most
  valuable landed FIRST so that drift would be caught as it happened. That
  argument assumed the drift was still in the future. It is not; it has already
  shipped, so the gate would arrive red and BL-997's step-1 instruction sends
  it straight back. `depends_on` is left empty deliberately rather than naming
  BL-997: nothing about this ticket waits on that one, the ordering runs the
  other way, and it is the coordinator's call, not a dependency.

  BL-970 is landed (`152f8331e`, on `main`) but its ticket is still in
  `backlog/active/` awaiting coordinator bookkeeping, which is why it is not
  named in `depends_on` either - there is nothing to wait for.

  Scope was verified against the live code before it was written, not inferred
  from BL-997's file list: `isPaneActivelyProcessing` has exactly two callers
  (`tmuxClient.ts:441` and `isAgentActivelyWorking`), both busy verdicts, so
  the one function is a true chokepoint; and `UI_MARKERS` is NOT a third
  classifier despite carrying the same marker - it feeds `isAgentCliRunning`,
  a presence question. BL-997's description groups `UI_MARKERS` with the busy
  classifiers, which is why the firm line above calls it out explicitly.

  `human_approval` is deliberately ABSENT rather than `pending`. There is no
  open design decision here to hold a `high` defect for: the definition being
  ported is BL-970's, which a human already approved, and the two firm lines
  that would otherwise be judgement calls (no shelling out, do not touch the
  Babashka side) are inherited from BL-997's approved constraints.

  IR-DRY: one near-duplicate found on the first pass - a positive and a
  negative assertion of the same respawn-precheck outcome, written as two
  scenarios. Resolved rather than waived, by folding them into one Scenario
  Outline parameterized on the expected refusal, which is what they always
  were. Re-run clean: 11 step occurrences, 9 unique, zero findings.
