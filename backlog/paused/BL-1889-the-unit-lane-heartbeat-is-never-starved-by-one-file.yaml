id: BL-1889
title: "The unit lane intermittently fails a fully green run with vitest's '[vitest-worker]: Timeout calling onTaskUpdate' (QA held BL-1834 on it, 2026-10-02): one test file holds its worker in a synchronous call longer than vitest's fixed 60 s RPC heartbeat under load; find the file and stop it starving the heartbeat, without the property lane's blanket dangerouslyIgnoreUnhandledErrors"
