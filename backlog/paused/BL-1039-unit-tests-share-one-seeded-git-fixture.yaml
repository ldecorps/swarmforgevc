invariants:
  - "No unit-lane test creates a git repository of its own: a repository comes from the shared seeded fixture, so the seeding cost is paid once per run rather than once per scenario."
  - "A shared fixture never leaks state between tests: no test observes a commit, ref, or working-tree change made by another."
  - "Speed is never bought with coverage: the recorded test_count never falls, and no test is deleted, skipped, or added to an exclude glob."

description: |
  ## What is measured

  Same profile as BL-1038 - the QA worktree's Vitest JSON report for the run
  finishing 2026-08-22 05:52, 460 collected files, 533.8s of summed work.

  **Fourteen unit-lane test files shell out to real `git init` and then build
  real commits**, most of them once per scenario. Together they cost
  **144.2s - 27.0% of the whole lane**:

  | file | measured | real `git` calls |
  |---|---|---|
  | `epicReorderBridge.test.js` | 49.7s | 20 |
  | `telegramFrontDeskBotCli.test.js` | 30.2s | 11 |
  | `topicMakeTopBridge.test.js` | 18.6s | 20 |
  | `drainAnswerFilesCli.test.js` | 13.8s | 8 |
  | `epicMakeTopBridge.test.js` | 9.3s | 15 |
  | `pilotAcceptanceGateCli.test.js` | 5.7s | 29 |
  | `negotiateOnboardingContractCli.test.js` | 3.1s | 3 |
  | `relayOnboardingNegotiationTelegramCli.test.js` | 2.9s | 3 |
  | `proposeOnboardingContractCli.test.js` | 2.8s | 6 |
  | `pausedPagerBridge.test.js` | 2.3s | 5 |
  | `commitIntegrityRunner.test.js` | 2.0s | 7 |
  | `proposeOnboardingPromptsCli.test.js` | 1.6s | 3 |
  | `runRoleBenchmarkCli.test.js` | 1.4s | 5 |
  | `leanLedgerCompose.test.js` | 0.8s | 6 |

  The shape is uniform. `epicReorderBridge.test.js` is representative: every
  scenario runs `git init -q`, two `git config` calls, an empty `git commit`,
  then `git add -A` and another commit to seed its backlog - four to six
  process spawns before the behaviour under test is even reached, repeated
  across 36 tests.

  ## Why this is a defect and not a style preference

  `engineering.prompt` is explicit: keep the unit suite in seconds, and use
  fakes for fs/network/tmux/VS Code API/timers. A test that spawns a real
  `git` process per scenario is an integration test wearing a unit test's
  filename, and it is charged to the lane every role runs on every parcel.

  It also keeps a hard gate permanently red. BL-378's per-file 7000ms budget
  has **19 live offenders** as measured, and **six of them are in the table
  above**. `check-suite-file-budget.js` runs on every `npm test` and its exit
  code is folded into the run's, so the lane cannot return green while this
  family exists. A gate that is always red trains everyone to wave it
  through - which is the reason its siblings BL-816 and the epic's slice C
  exist.

  ## How (direction, not mandate)

  Seed **one** repository fixture per run and hand each caller an
  independent working copy of it, rather than each test paying the
  `init`/`config`/`commit` cost itself. The sharing is what carries the risk,
  so isolation is invariant 2 rather than an implementation note: a fixture
  that leaks one test's commits into another's view has traded a slow suite
  for a lying one.

  Whether the copy is a filesystem clone of a pre-seeded template, a
  worktree, or something else is the implementer's call - as is whether a
  handful of tests that genuinely assert on `git` invocation itself should
  keep spawning it, behind an explicit exemption.

  A note on the guard, learned the expensive way (BL-1032): the fixture
  helper itself MUST call `git init`, so a guard that greps for that literal
  will flag its own machinery and go red precisely because the code is
  correct. Exclude the helper explicitly - scenario 06 exists to keep that
  honest.

  ## What this ticket does NOT do

  - It does not delete, skip, or exclude a test, and does not raise
    `SUITE_DURATION_BUDGET_MS` or BL-378's per-file 7000ms budget.
  - It does not touch fork-pool size or the BL-935 pack/platform ceiling.
    How much of the host the lane may use is a live operator question and is
    deliberately not decided here.
  - It does not touch the sibling cost family - tests that take the LIVE
    repository as their subject - which is BL-1038. The two file sets do not
    overlap.

qa_e2e_procedure: >
  1. At the parent commit, run the unit lane to completion in the QA
     worktree and keep its `.vitest-report.json`. Record `uptime` load before
     and after; a run at a wildly different load is not comparable and the
     comparison must be redone, not adjusted.

  2. From that report, record the measured duration of each of the fourteen
     files in the description's table, and confirm the total is in the same
     neighbourhood as the recorded 144.2s.

  3. At the parcel commit, run the lane again at comparable load. Confirm
     each converted file is materially faster, and that the six files in this
     family that were over BL-378's 7000ms per-file budget are now under it,
     or are named as recorded, justified exemptions.

  4. Confirm the guard is armed rather than vacuous: temporarily restore a
     direct `git init` into one converted test, run the guard, and confirm it
     FAILS and names that file. Restore.

  5. Confirm isolation is real, not assumed - this is the risk the ticket
     buys. Add a temporary test that commits to its own copy of the fixture,
     and a second that asserts the fixture's log is unchanged. Run the two in
     both orders and confirm the second passes either way. Remove both after.

  6. Confirm the cost is paid once: instrument or log the fixture seeding and
     confirm exactly one seeding happens per lane run, not one per calling
     file and not one per test.

  7. Confirm coverage was not traded for speed: diff the parcel against its
     parent and confirm no test file was deleted, no test skipped, no exclude
     glob widened, and that the newly recorded `test_count` in
     `.test-durations.jsonl` is not lower than the previous row's.

approval_context: >
  The second half of the answer to your "this is not acceptable" on the
  9m 18s trend. BL-1038 is the first half; the two together are 265.8s of
  the lane's 533.8s - just under half - and their file sets do not overlap.


  THE ARITHMETIC YOU NEED BEFORE JUDGING EITHER. The lane runs on ONE fork:
  BL-935 sets the fork ceiling to 1 for a full-forge pack on macOS,
  deliberately, because this host has 2 physical cores and 8 resident Claude
  sessions. So wall clock is roughly the sum of the work plus overhead.
  Cutting both of these tickets in full would take the lane to roughly 4-5
  minutes, not to 13 seconds. Reaching your original 13s ceiling needs a
  decision only you can make - about how much host the lane may use, or about
  what `npm test` should run at all. I have asked that separately rather than
  assuming it.


  ONE CALL OF MINE YOU MAY WANT TO OVERRIDE. **I kept this `severity:
  medium` even though it is the single largest fixed cut available.** It is a
  real but contained cost: it does not grow on its own, nothing ships wrong,
  no signal is falsified. Marking it `high` would expedite it past every
  non-expedited ticket, and I do not think buying queue position is what the
  severity field is for - the constitution says so explicitly. I gave it
  `priority: 9` instead, immediately behind BL-1038. If you want it expedited
  regardless, say so and I will flip it.


  THE ONE THING I WOULD PUSH BACK ON IF YOU ASKED ME TO GO FASTER. The
  sharing is the whole saving and also the whole risk: a shared fixture that
  leaks one test's commits into another's view converts a slow suite into a
  lying one. That is invariant 2, and its QA step (5) runs the two probes in
  both orders on purpose. I would rather this ticket bounce on isolation than
  ship fast and quietly wrong.

source: |
  Operator, 2026-08-22, direct: "WARN Suite duration trend: 9m 18s latest
  (-5m 46s vs prior). this is nit acceptable. somethinh must be done to
  reduce that duration"

  Slice B of epic `unit-suite-speed` (BL-791), split 2 of 2 from the fresh
  2026-08-22 profile. The epic deferred this scope explicitly - "Scope is
  written only once that profile exists; writing it now would be guessing" -
  and the profile now exists (BL-792 slice A, done, plus this measurement).

  Sibling: BL-1038 (seven tests that take the LIVE repository as their
  subject, 121.6s). Split rather than merged: different root causes,
  different fixes, disjoint file sets, and one ticket covering both would
  fail INVEST-Small.

notes: |
  ## Prior art this must not repeat

  - **BL-445** (done) - `isolate: false`, load-bearing, not to be reverted.
  - **BL-422 / BL-792 / BL-935** - the fork-pool caps, each closing a real
    incident. None may be quietly relaxed here.
  - **BL-378** - the per-file 7000ms hard budget, 19 live offenders, six of
    them in this ticket's table.
  - **BL-815 / BL-914 / BL-969 / BL-999 / BL-1007** - four measured budget
    raises in four days on this surface plus a fifth queued. This ticket
    removes cost rather than repricing it.

  ## Orthogonality

  No file in this ticket's table appears in BL-1038's. The two may safely be
  active together as far as file overlap goes; whether the swarm should hold
  two unit-lane tickets at once is the coordinator's call.
