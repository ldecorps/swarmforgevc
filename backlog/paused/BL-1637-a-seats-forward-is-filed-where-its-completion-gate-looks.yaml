id: BL-1637
title: "A seat's forward is filed where its completion gate looks: handoffd moves a delivered outbox file into the sent folder of the role named by its from header, which a seat stamps with its stage (coder), while done_with_current's forward-evidence gate (BL-1609) reads only the seat's own outbox and sent folders - so every forward coder@2 sends completes only through --no-op (BL-831, 2026-09-18: the forward delivered and claimed at the cleaner, the seat's sent folder empty since 2026-09-17, FORWARD_NOT_SENT) - the gate reads the seat's folders and its stage's, and the daemon files a seat's delivered mail under that seat, so the gate BL-1609 built is real for a second seat"
