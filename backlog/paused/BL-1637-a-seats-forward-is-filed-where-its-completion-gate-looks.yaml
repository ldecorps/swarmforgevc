notes: |
  Minted 2026-09-18 by the specifier while completing the coder's note,
  the same pass. AUTO-APPROVED under the 2026-09-17 operator hotfix
  (severity defect, no ruling_options) - see
  auto-approve-high-severity-defects-amendment-20260917.md. The coder was
  told the refusal is a real gate defect and its --no-op record stands;
  the coordinator was sent paused-ready. Until this lands: a coder@2
  forward that reaches its target and is refused at completion is this
  defect - complete with --no-op naming this ticket, never redo_from.sh a
  live parcel. INVEST: Independent (gate, daemon and seat rows exist),
  Negotiable (the seat header's name and the daemon's filing join are
  direction; the gate function name is the anchor), Valuable (the second
  seat completes truthfully and BL-1609's gate means something for it),
  Estimable (one scan set, one header, two filing sites - one sitting),
  Small (three scenarios, one invariant), Testable (BL-1609's fixture
  swarm in seconds).
