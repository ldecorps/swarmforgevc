description: |
  ## What the human asked for

  Operator, 2026-08-03, absolute priority: bring `npm test` in `extension/`
  under **13 seconds** wall-clock, without deleting tests, dropping coverage,
  or raising the budget to hide the number. 13s is the operational ceiling;
  the 10s `SUITE_DURATION_BUDGET_MS` already in code stays the ratchet.

  ## What is actually measured today

  `extension/.test-durations.jsonl`, latest row:

  ```
  {"finished_at":"2026-08-03T05:42:29.650Z","test_count":438,
   "result":"fail","duration_ms":169507}
  ```

  Two facts in that row matter equally, and only one of them is in the
  headline:

  1. **169.5s against a 10s budget.** File count has grown ~100 (July) →
     ~273 (BL-445 era) → **438**.
  2. **`result: fail`** — workers terminated mid-run. Every recorded run since
     2026-07-07 is a `fail`; the last `pass` rows are from 2026-07-07 at 99
     files and 82–136s.

  ## Why the epic starts by measuring rather than cutting

  169.5s is not a profile of test work. It is the wall-clock of a run in which
  workers died. Nobody — not the operator, not the specifier — currently knows
  how much of it is tests and how much is worker death and redone files. Cutting
  against that number is cutting against noise, which is precisely what the
  intake's own success criterion 3 ("profile first ... do not hit the number by
  deleting tests") forbids.

  So slice A (BL-792) makes the run **green and profiled**. It may well be that
  a green run is already far under 169.5s — in which case slice B is small or
  unnecessary, and the epic closes early. That is a good outcome, not a wasted
  slice.

  ## The prime suspect, named so slice A does not start from zero

  Two individually-correct decisions appear to collide at 438 files:

  - **BL-445 set `isolate: false`** (`vitest.config.mjs`). A worker no longer
    resets its module registry between test files — the change that cut the
    suite to ~25s and the reason it was worth making.
  - **BL-422 capped each worker at `PER_WORKER_HEAP_MB = 1280` across
    `MAX_WORKERS = 6`** forks, after an unbounded run drove the kernel OOM
    killer into a spiral that killed swarm agents twice in one day.

  With isolation off, one fork now accumulates the modules of roughly
  `438 / 6 ≈ 73` test files with no reset, against a hard 1280MB ceiling. A
  worker that hits it is terminated — which is exactly the observed failure,
  and would also explain a superlinear 1.6x-files → 6.8x-time blowup.

  This is a **suspect, not a finding**. Slice A confirms or refutes it against a
  real run. Neither BL-445's isolation nor BL-422's cap may simply be reverted:
  each was load-bearing, and undoing either re-opens the incident it closed.

  ## Out of scope for the whole epic

  - Gherkin / acceptance pipeline wall-clock — a separate surface with its own
    budget (the per-feature run_acceptance.sh is not where the hours are).
  - (Removed 2026-09-17) The property lane and the per-parcel multiplier were
    implicitly out of scope; they are IN scope since the human's intake of
    2026-09-17 - BL-1618 (one command per role), BL-1619 (property recorder),
    slice E (property register + ratchet).
  - Android JVM unit tests (BL-769's suite) — not this suite.
  - Raising `SUITE_DURATION_BUDGET_MS`, or any other change whose effect is to
    make the number look better without the run being faster.
  - Deleting, skipping, or excluding tests to reach the target.

approval_context: >
  Your 2026-08-03 absolute-priority request, specced. Firm, because you said
  it: under 13s, no deleted tests, no dropped coverage, no raised budget,
  profile before cutting.


  Two calls of mine that need your eye.


  (1) **Slice A measures before slice B cuts.** I know you asked for a number,
  not a report, and I have not slowed this down for ceremony: the last recorded
  run FAILED with workers being terminated, so 169.5s is not a measurement of
  test work at all. Slice A is bounded — make it green, publish the per-file
  profile — and it is genuinely possible that a green run already lands near
  the ceiling, which would make slice B small or unnecessary. If you would
  rather I spec one all-in ticket against the 169.5s number, say so and I will.


  (2) **I have named a prime suspect but not a fix.** `isolate: false`
  (BL-445, the change that made the suite fast) plus a hard 1280MB per-worker
  heap cap (BL-422, the change that stopped the OOM spiral killing agents) look
  like they collide at 438 files: no module-registry reset means one fork
  accumulates ~73 files' modules into a fixed ceiling. If that is right, the
  fix is neither "turn isolation back on" nor "raise the cap" — both re-open a
  closed incident — and slice B will have to be cleverer than either. Slice A
  confirms or kills the theory before anyone spends effort on it.


  Priority 00 on both tickets, per your "absolute — do not park behind medium
  adoption tickets".

