notes: |
  ## Prior art this epic must not repeat

  - **BL-445** (done) — cut the suite to ~25s at ~273 files via `isolate:false`
    and delivered the 10s budget verdict. The suite has since regressed hard.
  - **BL-362 / BL-363** — earlier spawn-tax cuts from a ~13s baseline: real
    timers and repeated engine boots in the two slowest files.
  - **BL-378** — the per-file 7s hard budget
    (`extension/scripts/check-suite-file-budget.ts`).
  - **BL-078 / BL-252** — suite-duration trend recording.

  Three of those five are gates that already exist and did not prevent this
  regression. Slice C's question is why, and it is a more interesting question
  than "add another gate".

  ## Why this is a correctness risk, not just a slowness one

  Every recorded run since 2026-07-07 is `result: fail`. A suite that always
  fails is a suite whose failures carry no signal — a real regression and
  worker-termination noise are indistinguishable in that log. Slice A restores
  the signal, which is worth landing even if the wall-clock never moves.

  2026-09-17 (specifier, backlog-root drain): the human's intake "the swarm
  knowingly runs tests for hours" widened this epic - the hours are six
  full-lane runs per parcel (320 s property lane x 6, a Stryker pass, the
  unit lane x 6) at cap 5-6, not a unit-lane pole. Minted BL-1618 (one
  verification command per role; interim prose lane sets landed in the five
  prompts the same commit), BL-1619 (property-lane duration recorder) and
  BL-1620 (slice D first cut); slices E-G recorded above. Intake archived:
  backlog/archive/INTAKE-test-lanes-run-for-hours-changed-path-selection-20260917.md.
  Evidence: backlog/evidence/BL-1618-specifier-adjudication-of-test-lanes-run-for-hours-intake-20260917.md.

lane_budget_decision_2026_09_16: |
  ## The delegated decision (specifier, 2026-09-16)

  The operator delegated slice C's open question (host budget and lane
  composition) to the specifier (coordinator note 008676, the only record
  of the operator's words; amend here if it misstates them). Measured
  first: `npm test` from `extension/` on the master checkout, 20 cores,
  fork pool 9 (resolveVitestWorkerPool under a 1-minute load of 10.8), 622
  files, wall 72.0 s, summed per-file work 546.1 s, 9 files over the 7 s
  per-file budget (273 s of the 546 s), median file 0.06 s, p90 1.5 s, 3
  failing files (two owned by BL-1593, bl1277 owned by BL-1600 this pass).
  Full profile: backlog/evidence/BL-791-slice-c-lane-budget-decision-20260916.md.

  1. Host budget: unchanged. The lane uses whatever fork pool
     resolveVitestWorkerPool sizes from free cores and RAM; the gate's
     numbers are fork-independent so the pool may change without moving
     the line.
  2. Lane composition: unchanged. npm test is the unit lane; no split, no
     change-scoped runs - a gate on a subset holds no line.
  3. The line is summed per-file WORK, not wall: 533.8 s on 2026-08-22
     (1 fork, macOS, 460 files) against 546.1 s today (9 forks, WSL, 622
     files) while wall went 689 s to 72 s. SUITE_WORK_BUDGET_MS 550000,
     tolerance 10 percent, refused above, ratcheted down by the parcel
     that lowers it, never raised (BL-1599).
  4. The per-file gate regains its signal through a committed pole
     register (BL-1598); the 13 s wall stays the epic's target, printed
     on every run as a distance, reached by slice D's pole cuts.
  5. Consequence stated plainly: at 9 forks the 69.9 s pole alone keeps
     wall near 70 s; with every pole under 7 s the derived wall is about
     30 s; 13 s additionally needs summed work under about 110 s, which
     is a fifth of today's. The line holds what exists; it does not
     promise the ceiling.

profile_2026_08_22: |
  ## 2026-08-22 re-profile — why slice B became two tickets, and why slice C waits

  Operator escalated again 2026-08-22: "WARN Suite duration trend: 9m 18s
  latest (-5m 46s vs prior). this is nit acceptable."

  Fresh profile, QA worktree Vitest JSON report for the run finishing
  2026-08-22 05:52 (wall clock 689420ms in .test-durations.jsonl):

  - 460 unit-lane files collected (589 in test/, 131 of them property files
    excluded from this lane), 533.8s of summed per-file work.
  - The lane runs on ONE fork. BL-935 (2026-08-19) sets the fork ceiling to 1
    for a full-forge pack on macOS - this host has 2 physical cores and 8
    resident Claude sessions. So wall clock is approximately the sum plus
    overhead, which is why 689s > 533.8s rather than being a fraction of it.
  - 19 files exceed BL-378's 7000ms per-file budget, accounting for 344.4s.
    Capping every one of them at exactly 7s would still leave 322.4s.

  That last line is the epic's central finding and it supersedes the epic's
  own framing: **the 13s ceiling is not reachable on this host by cutting
  poles alone.** It requires a decision about how much of the host the lane
  may use (BL-935's ceiling), or about what `npm test` runs at all (lane
  split, change-scoped runs). Both are operator calls - asked 2026-08-22,
  answer pending - and slice C's gate cannot be specced before that answer,
  because the number the gate would hold is exactly what the answer sets.

  The prime suspect the epic named in 2026-08-03 (isolate:false colliding with
  the 1280MB per-fork cap at 438 files) is not the current cause: BL-792
  closed that, and the recent runs record `pass` as well as `fail`.
