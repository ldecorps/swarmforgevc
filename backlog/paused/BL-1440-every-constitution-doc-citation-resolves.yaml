  design docs), Valuable (one outcome: the guard is green and cannot go
  red unseen again), Estimable (one index page, two seeded docs or one
  article line, one guard, one handler; low), Small (three scenarios,
  four runs, two invariants), Testable (fixture repository; the parcel's
  own tree).

