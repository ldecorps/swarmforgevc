id: BL-1104
title: "A ticket QA has already landed on origin/main but never notified the coordinator about stays in backlog/active/ forever - both existing active-ticket sweeps key on an ABSENT dispatch trail, and this ticket's trail is complete, so nothing looks at it"
type: defect
severity: high
# high: a live fault degrading behaviour plus a missing health signal, and it
# is recurring rather than theoretical - five instances measured, four on one
# day (BL-1043, BL-1083, BL-1086, BL-1088) each recovered only by chance
# discovery, plus BL-1030 still stranded and undiscovered at mint time. Each
# stranded ticket holds an active-depth slot against new promotion and makes
# the board misreport landed work as in-flight; the coordinator can then
# re-route it as fresh work. Not critical: nothing is lost or corrupted, the
# landed commit is safely on origin/main, and any human can close it by hand.
status: todo
assigned_to: coder
epic: swarm-reliability
priority: 10
direction: swarm-surfaced
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1104-qa-landed-ticket-never-closed-strands-in-active.feature
required_wiring:
  - 'swarmforge/scripts/handoffd.bb::landed-but-open::the sweep must be CALLED from the daemon, not merely defined in the lib - a detector nobody runs is the BL-419 shape. `landed-but-open` is the sweep/log name this ticket fixes so the gate has a literal to match.'
human_approval: pending
approval_context: >
  Firm: the state is real and currently unobserved. Five tickets have reached
  it, and BL-1030 is sitting in it right now - QA landed it (fd5da2686
  "Merge origin/main into QA-approved BL-1030 (3b5e2f7a13) for landing"),
  there is no close commit, and the file is still in backlog/active/.

  Your call on ONE thing: who the nudge goes to. QA proposed nudging QA to
  resend its notify, and I have specced that, because the missing act is
  QA's and Article 1.1 keeps bookkeeping coordinator-owned - a nudge to the
  coordinator would invite it to close a ticket whose approval it never
  received. If you would rather the coordinator be told directly (fewer
  hops, at the cost of closing on the daemon's word rather than QA's), say
  so and scenario 01's Then line changes; nothing else in the ticket does.

  Note this does NOT overlap BL-1093. That ticket is about a ticket with NO
  usable dispatch trail being invisible to both sweeps; this one is about a
  ticket whose trail is COMPLETE and therefore looks healthy to both. They
  touch the same lib and are independently fixable.
invariants:
  - A ticket is flagged only when QA's own approval for THAT ticket is reachable from origin/main - a ticket id appearing anywhere in another commit's message is never sufficient.
  - The sweep observes and nudges only - it never moves a backlog file, never closes a ticket, and never sends the coordinator notify on QA's behalf.
  - One stranded ticket yields at most one outstanding nudge - repeated sweeps over unchanged state send nothing further.
description: >
  WHAT: QA's landing sequence has four separable steps (land the commit, push
  origin, notify the coordinator, close the handoff). A session can stop after
  the push. The commit is safely on origin/main and the work is done, but the
  coordinator is never told, so it never moves the ticket out of
  backlog/active/. The ticket then holds a depth-cap slot against new
  promotion, the board shows landed work as in-flight, and the coordinator may
  re-route it as fresh work.

  WHY NOTHING CATCHES IT: `chase_sweep_lib.bb` has exactly two sweeps over
  active tickets - `dispatch-gap-items` (BL-222) and `unassigned-active-items`
  - and BOTH are built on `decide-dispatch-gaps`, which asks whether a ticket
  has NO dispatch trail. A ticket that walked the whole pipeline to QA has a
  complete trail, so it reads as healthy to both. The state is not mishandled;
  it is unobserved. This ticket adds the third sibling.

  EVIDENCE, measured 2026-08-23: BL-1043, BL-1083, BL-1086 and BL-1088 all
  reached it in one day, each recovered only when a human happened to notice.
  BL-1030 is in it right now and nobody has noticed - landed at fd5da2686,
  no close commit, still active, and the only coordinator-mailbox mentions of
  it are coordinator-to-coordinator self-notes, not a QA notify.

  How (direction, not mandate): a third sibling of the two sweeps above, run
  from the same `handoffd.bb` cycle. Reading QA approval off origin/main
  rather than off the mailbox is deliberate - `.swarmforge/` is local,
  gitignored runtime state that can be swept, while the landing commit is
  durable and is the same evidence a human uses to confirm the strand.

  TWO MEASURED TRAPS an implementer will otherwise walk into, both verified
  against the live repo:
  (a) `git log --grep=<id>` matches the commit BODY, not just the subject.
  Grepping origin/main for BL-1078 returns BL-1086's landing commit, because
  the id appears in that commit's body. Anchor the match to the subject, or
  the sweep flags tickets merely MENTIONED by someone else's landing. This is
  invariant 1 and scenario 04.
  (b) A `backlog/evidence/<id>-qa-pass-*.md` file looks like the obvious
  approval signal and is NOT reliable: none of the five cases has one, though
  other tickets do. Do not key on it.

  DIAGNOSABILITY, in scope: the sweep logs one boundary line per cycle under
  the name `landed-but-open`, action or no action, naming any ticket flagged
  and the approval commit that flagged it - so a false positive is
  diagnosable from the log alone without re-running the sweep by hand
  (same rule as BL-572/BL-662 and BL-967 invariant 2).

  NOT IN SCOPE: changing QA's landing sequence so the notify cannot be
  skipped - that is a worthwhile separate slice and a larger change to QA's
  own procedure; this ticket is the detector for when it is. Also out:
  closing or moving any backlog file (invariant 2), and BL-1093's
  nobody-spelling normalisation.
qa_e2e_procedure: >
  1. Seed a scratch repo with four active tickets: one whose QA approval is an
     ancestor of the main ref with no close commit (the strand); one whose
     parcel reached QA but has no approval on the ref; one with no dispatch
     trail at all; one with no assignee.
  2. Run the sweep. ONLY the first is flagged, and the nudge names it and its
     approval commit.
  3. Run the two existing sweeps over the same fixture: their results are
     unchanged, and no ticket is claimed by more than one of the three.
  4. Cross-ticket guard: add a commit whose SUBJECT names one ticket and whose
     BODY mentions another active ticket's id. The body-only ticket is not
     flagged. Before the fix a body-matching implementation flags it, which is
     trap (a) reproducing.
  5. Idempotence: run the sweep twice over unchanged state. Exactly one nudge
     exists, not two.
  6. Live check once landed: the handoffd log shows a `landed-but-open`
     boundary line each cycle, and BL-1030 (if still open at that point) is
     flagged by it.
notes: >
  Reached from a QA rule_proposal (scope `project`, 2026-08-23): "coordinator
  sweep should flag an active/ ticket whose commit is already ancestor of
  origin/main with no matching QA sent-notify, and nudge QA to resend."
  Accepted in substance and minted as this ticket rather than appended as
  prose to project.prompt: the proposal asks for a DETECTOR, which is code,
  and a prose rule would have been inert - the coordinator must not self-poll,
  so it cannot act on an instruction to go looking. The boot prefix also has
  zero headroom, so an inlined-article line would have failed the budget gate.
  QA notified of the disposition.

  The detector's predicate was validated against live data before minting
  rather than reasoned about: a subject-anchored match on QA's own approval
  fires on all five known cases and on no other active ticket. That check is
  what surfaced BL-1030 as a live, undiscovered instance.

  Relationship to BL-1093, recorded for the coordinator's orthogonality check
  rather than as a dependency: both touch `chase_sweep_lib.bb`'s active-item
  reading, so promoting them concurrently risks a conflict, but neither
  blocks the other and either can land first.

  IR-DRY disposition (checker run): ten findings, all reviewed and KEPT.
  Eight are the same parameterized step appearing with a different fixture
  ticket id per scenario - one step handler with a captured id, which is the
  intended shape rather than drift. The near-duplicate pair (scenarios 01 and
  06) is deliberate: both set up a landed ticket, but 01 asserts the flag and
  nudge while 06 gates invariant 2, that the sweep moves nothing - merging
  them would conflate the behaviour with its safety boundary. It cannot move
  to Background either, since scenarios 02-05 need the opposite setup.
  "whose QA approval is reachable" and "no QA approval is reachable" are
  flagged as synonyms but mean opposite things, as do "the sweep runs" and
  "the sweep runs again", which is the whole point of the idempotence case.

  RENUMBERED BL-1100 -> BL-1104 (specifier, 2026-08-23). Two distinct tickets
  were minted as BL-1100 in parallel and collided when the coordinator merged
  origin/main into main (51c7547e1, which flagged it and left the renumber to
  the specifier). The other BL-1100 - "promotion candidacy is decided by
  structured fields, never prose" - keeps the id because a human had already
  APPROVED it via Telegram (94887b9af) and that recorded decision must not be
  invalidated by bookkeeping; this ticket was still `human_approval: pending`,
  so no human decision is disturbed by moving it. Renamed: the YAML, its
  feature file, the `acceptance:` path, and all six scenario-name comments.
  `backlog/topics/BL-1104.json` now carries this thread and
  `backlog/topics/BL-1100.json` was restored to the approved ticket's thread,
  which the merge had overwritten - neither id had an entry in
  `.swarmforge/operator/backlog-topic-map.json`, so no live Telegram topic
  binding was moved. Nothing in the spec's substance changed. Second collision
  of this kind in two days (BL-1087/BL-1090 was the first); the guard gap that
  allows two sessions to mint one id is not ticketed and is not this ticket's
  scope.

  DOWNSTREAM CONSUMER, cross-referenced not merged (added 2026-08-23 after a
  second live instance): BL-1097 is "the router hands a role a parcel whose
  commit already contains that ticket's finished, QA-approved work". The
  router can only do that while the finished ticket is still in `active/`,
  which is exactly the state this ticket detects - so this one shrinks
  BL-1097's input. It does not replace it: a parcel can also outlive a
  correctly-closed ticket, which is what happened to BL-1063 on 2026-08-23.
  BL-1030 is one ticket in both states at once - landed, never closed, and
  `assigned_to` backfilled to `coder` as though it were unstarted.
