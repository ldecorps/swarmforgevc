acceptance: specs/features/BL-1053-the-intelligence-layer-can-route-work-to-a-local-model-seat.feature
human_approval: pending
approval_context: >
  Operator reframed the pair on 2026-08-22 via Let's Talk. BL-1052 is now
  the generic downloaded-local-model seat path (Qwen first). This ticket
  stays the bookkeeping half: give the intelligence layer a provider key
  and Steward registration so routing can select that seat. Needs your
