id: BL-1053
title: "The intelligence layer cannot route work to a local-model seat: provider->agent knows only cloud providers, so a downloaded model registered under the wrong key would launch through the wrong binary — first proof is Qwen"
milestone: M8
type: feature
status: todo
epic: swarm-intelligence-layer
priority: 0
direction: queue-jump
depends_on: [BL-1052]
mutation_cost: low
