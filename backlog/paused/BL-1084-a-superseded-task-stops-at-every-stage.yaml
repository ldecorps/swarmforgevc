invariants:
  - "A supersede recorded for a task name is durable and stage-independent: every stage that later starts a turn on a parcel for that task sees it, no matter which stage held the parcel when it was recorded, and no matter how many stages the work had already been forwarded through."
  - "The guard refuses only when it can positively name a recorded supersede. An absent marker store means 'nothing superseded' and must pass; a store that exists but cannot be read must refuse rather than read as empty - absence and unreadability are different answers."

required_wiring:
  - "swarmforge/scripts/ready_for_next.bb::supersede::the guard must be called from the one pre-turn entry point every role uses to start a turn (Article 2.4), beside BL-640's freshness guard - a supersede check that exists but is called from no receive path is this ticket's own failure mode repeated"

approval_context: >
  Filed medium rather than high, deliberately, because the expedite lane is
  already carrying nine or ten critical/high defects and the human has twice
  asked to unblock the queue-jump batch.

  The case for high is real and worth seeing: superseded, unapproved work did
  reach `main`, past four review stages, and none of them could have known.

  The case for medium, which is the call made: it needs a specific and rare
  race (a supersede landing while that ticket's commits are mid-pipeline), the
  existing rules did their job once a human-shaped check ran, nothing was lost,
  and the recovery is a normal revert. It is a gap in a safety net, not a
  fault in the running swarm.

  One decision needs your sign-off rather than a rubber stamp: this adds a
  refusal to the single entry point EVERY role uses to start a turn. Get it
  wrong and no role can take work at all. That is why invariant 2 is written
  the way it is - absent means pass, unreadable means refuse - and why the
  scope below deliberately keeps the marker a plain file the operator can
  delete by hand.

source: |
  Coder priority-00 note `00_20260823T002137Z_000835` and its report
  `backlog/evidence/BL-1052-supersede-breach-20260823.md`, 2026-08-23, closing
  with: "A supersede note reaches one role - whoever the specifier believes
  holds the parcel. It does not reach the copies of that work already moving
  down the pipeline. Here the note found the coder and missed four downstream
  stages, and the superseded work shipped past all of them. Article 3's
  'Amending An In-Flight Ticket's Spec' assumes a single holder; a ticket whose
  commits have already been forwarded has several, and nothing today tells the
  ones in front."

  The incident, verified this pass and written up in
  `backlog/evidence/BL-1052-BL-1053-supersede-disposition-20260823.md`:

  1. On 2026-08-22 the specifier reframed BL-1052/BL-1053 at `8accd9287` from a
     qwen-code cloud CLI seat to a downloaded-local-model seat, retiring both
     qwen-code feature files and setting `human_approval: pending`.
  2. The priority-00 supersede note went to the coder - correctly, per the
     mailbox sweep rule (BL-971) - and the coder acted on it correctly.
  3. But that ticket's commits (`8ad89d6fe`, `876df1f9f`, `1696fb41f`) had
     ALREADY been forwarded and were moving through cleaner, architect,
     hardener and documenter. Each of those stages received a parcel that
     looked entirely normal, reviewed it against the contract as it stood when
     the parcel was built, passed it, and forwarded it. All three reached
     `main`, and a cleaner refactor (`986ea5211`) then landed on top.
  4. Nobody in the chain erred. Every stage followed its own prompt. The
     supersede simply had no way to reach them.

  WHY THE EXISTING RULES DO NOT COVER THIS. The constitution's "Amending An
  In-Flight Ticket's Spec" (BL-317/BL-325) and the specifier's mailbox-sweep
  rule (BL-971) both fix the question "WHICH role do I send the note to?".
  They are correct and stay. The gap is a level up: a `note` is point-to-point
  and consumed once, so answering that question perfectly still only stops ONE
  stage. A parcel that has been forwarded exists as commits at several stages
  at once, and the note cannot be in more than one inbox.

  PRIOR ART TO FOLLOW, not to reinvent. BL-640 already added a pre-turn guard
  in exactly the right place and with exactly the right posture:
  `ready_for_next.bb` is, in its own words, "the one entry point every role
  (task or batch mode, any pack) uses to start a turn (constitution Article
  2.4)", its freshness check "runs BEFORE dispatch decides task vs batch, so a
  stale worktree refuses uniformly", and it "only ever refuses when it can
  positively name real drift". This ticket wants a second guard of the same
  shape beside it, keyed on task name instead of worktree staleness.

description: |
  Make a supersede decision durable and stage-independent, so that a ticket
  withdrawn mid-flight stops at whatever stage next picks it up rather than
  only at the one role a note happened to reach.

  ## What is wrong

  Superseding a ticket today is a `note` to one role. A ticket whose commits
  have already been forwarded is not held by one role - it exists as a parcel
  at one stage and as commits under review at others. The note stops the role
  it reaches and nothing else, so the work continues down the chain and lands.

  ## What should happen

  Recording a supersede for a task name puts a durable marker somewhere every
  role's turn-start already looks. When any stage then starts a turn on a
  parcel for that task, it refuses that parcel, says which task is superseded
  and why, and leaves the parcel where it is rather than forwarding, passing
  or bouncing it. A superseded parcel is not a defect in the work and must not
  be recorded as a bounce against the role that built it.

  ## How (direction, not mandate)

  Put the check beside BL-640's freshness guard in
  `swarmforge/scripts/ready_for_next.bb`, before dispatch decides task vs
  batch, so it applies uniformly to task roles, batch roles and any pack. Keep
  the marker a plain file under `.swarmforge/` that an operator can read and
  delete by hand - the recovery path when a supersede is recorded in error
  must not itself need a tool.

  Naming constraint, deliberate: the guard's function or file name must
  contain `supersede`, so the `required_wiring` gate above can see the call
  site. This ticket's entire value is the call site existing.

  ## What this does not change

  The specifier still sends the priority-00 note. It is faster than a marker
  anyone has to notice, it carries the reasoning, and it reaches a live role
  immediately. The marker is the backstop for the copies the note cannot
  reach, not a replacement for telling people.

acceptance: specs/features/BL-1084-a-superseded-task-stops-at-every-stage.feature

qa_e2e_procedure: |
  1. In a scratch clone, record a supersede for a task name that has a parcel
     sitting in a role's `inbox/new/`.
  2. Run `ready_for_next.sh` as that role. Confirm it refuses, names the task
     and the recorded reason, and that the parcel is still in the mailbox
     afterwards - not dequeued, not moved to `in_process/`.
  3. Run `ready_for_next.sh` as a DIFFERENT role that also has a parcel for
     the same task name. Confirm it refuses identically - this is the whole
     point of the ticket and the step that would have caught BL-1052.
  4. Confirm a role holding a parcel for any OTHER task is unaffected and
     takes its work normally.
  5. Delete the marker file by hand. Confirm both roles now take their parcels
     normally, with no residue.
  6. Confirm the bounce store carries no new charge against any role for the
     refused parcels (`node extension/out/tools/record-bounce.js` writes
     nothing here; a supersede is not a bounce).

out_of_scope: |
  - Deciding what happens to superseded work that has ALREADY landed on `main`.
    That is a disposition question per incident, answered for BL-1052/BL-1053
    in `backlog/evidence/BL-1052-BL-1053-supersede-disposition-20260823.md`,
    and it is a human call each time rather than something to automate.
  - Retracting or rewriting commits already forwarded. The constitution's
    revert rules (BL-490/BL-495, and the already-an-ancestor-of-`main`
    exception) already cover that ground and are unchanged.
  - Changing where the specifier sends the supersede note, or the mailbox
    sweep that decides who holds a parcel (BL-971). Both stay exactly as they
    are; this is a backstop underneath them.
  - Any automatic un-supersede. Clearing the marker is deliberate, and doing
    it by hand is the feature.
  - Blocking promotion of a superseded ticket. The promotion gates already
    refuse on `human_approval` and are a different chokepoint.

notes: |
  The report that produced this ticket is worth reading for a second reason:
  it is a clean example of the Guardrails rule that a merge must be diffed
  against BOTH parents. The merge itself reported nothing but "Merge made by
  the 'ort' strategy"; the superseded content was visible only in that diff.

  Severity note for whoever reviews: this is filed medium with the argument
  for high stated openly in `approval_context` rather than hidden. If the
  human reads "unapproved work reached main past four gates" as the headline,
  high is defensible and the expedite lane is where it belongs.
