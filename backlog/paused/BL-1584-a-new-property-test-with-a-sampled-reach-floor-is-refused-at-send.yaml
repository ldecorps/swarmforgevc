title: "A parcel that adds a property test asserting a reach floor after a sampled low-budget draw is refused at the git_handoff send, naming the file, the assertion, the budget and the two helpers; a pre-existing file or a high-budget one only warns, a constructed one passes, and a census CLI lists every property file's verdict from the same classifier"
milestone: M8
type: feature
status: todo
epic: sampled-reach-floors
priority: 1
direction: queue-jump
depends_on: []
