invariants:
  - "The verdict is computed from git objects and the received parcel commit recorded in the sender's in_process mailbox alone - commits, parents, merge bases, trees and blobs - never from any working tree, so the chronically-dirty shared master checkout and a role worktree's uncommitted drift (BL-1195) cannot change the answer."
  - "A line one side changed is a finding only when the other side never touched that hunk: a base line range both sides changed, or an insertion both sides made at the same base position, is contested and its resolution is free - a genuine same-line conflict is never refused, and a `This reverts commit <sha>` reachable from the forwarded commit that names the commit which authored the dropped hunk excuses it (BL-490/BL-495 convention, exactly as BL-1213 honours it)."
  - "Bounded to the merge commits reachable from the forwarded commit and not from the received commit, and to the paths those merges' parents changed since their merge base - never a full-tree walk, never a walk past the received commit, never a merge the sender did not make."

required_wiring:
