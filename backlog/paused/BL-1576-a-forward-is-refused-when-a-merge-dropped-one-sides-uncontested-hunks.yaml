id: BL-1576
title: "A merge the sender made on its own branch re-adds the six register rows the cleaner removed and drops nothing else, so BL-1213's byte-identical rollback gate, BL-1242's deletion hook and BL-1098's push-sweep predicate all read clean and the loss travels to QA: the git_handoff send refuses a merge between the received and forwarded commits that dropped one side's uncontested hunks"
