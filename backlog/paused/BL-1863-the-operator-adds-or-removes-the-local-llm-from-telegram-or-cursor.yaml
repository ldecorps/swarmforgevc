id: BL-1863
title: "The operator adds or removes the local LLM from Telegram or Cursor - /localllm remove and /localllm add run local_llm.sh behind one Confirm tap and reply with its output, /localllm add force passes the GPU override, and a bare /localllm (or /localllm status) relays local_llm.sh status without a confirm"
milestone: M8
type: feature
status: todo
epic: local-llm-swarm
priority: 9
direction: queue-jump
