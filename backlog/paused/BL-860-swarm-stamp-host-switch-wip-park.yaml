description: |
  ## What landed

  `f175bc56d1` (2026-08-01, swarm-intake[bot], Cursor co-author) — "Park local
  WIP for host switch: drain router depth, Bubble chiptunes, pilot-safe
  defects, answer archive." 4052 insertions, 1 deletion, 11 files, committed
  straight to `main` outside the pipeline.

  ## Disposition of every path (specifier audit, 2026-08-08)

  1. `extension/src/tools/pilotSafeDefects.ts` (155) and
     `extension/test/pilotSafeDefects.test.js` (98) — owned by **BL-722**,
     which is in `backlog/done/`. Authorized work; it simply travelled in
     this commit. NO ACTION.

  2. `extension/src/bridge/letsTalkBubbleConfig.ts` (120),
     `letsTalkChiptunes.ts` (36), `letsTalkChiptunes.json` (3565) — owned by
     **BL-765** (`backlog/paused/`, `human_approval: approved`). BL-765's own
     `notes:` already names these exact three files as "Adopt candidates
     already in the dirty master tree ... Coder adopts, does not re-derive",
     and its `required_wiring:` already declares the two GET routes they are
     missing. The park commit only committed what BL-765 had already planned
     to adopt. NO ACTION beyond promoting BL-765 in the normal course.

     Worth stating plainly so it is not re-reported as a defect: these
     modules currently have ZERO callers (`grep` for both symbols outside
     their own files returns nothing) and no evidence file, and none of
     BL-765's six `required_stages` has run. That is expected for an adopt
     candidate and is exactly what BL-765's `required_wiring` exists to
     close — it is not a separate finding.

  3. `swarmforge/packs/mono-router.conf` — the commit's one deletion:
     `active_backlog_max_depth 1` -> `0`, the "drain router depth" of the
     subject line. `0` is Article 3.5's SEVERE circuit-breaker value (freeze
     promotion entirely), committed here as a pack default for the host
     switch. **Verified superseded**: the file now reads `3`. No live effect.
     NO ACTION.

  4. `.cursor/rules/bugfix-process-tdd.mdc` (45) — Cursor host-agent process
     config (`alwaysApply: true`), restating the constitution's root-cause /
     TDD / CRAP-6 posture for the third writer on master. No ticket names it.
     The 2026-07-31 master-diff review
     (`backlog/evidence/master-diff-review-20260731.md`) examined it and left
     it explicitly undecided: "Either track it (it governs the third writer,
     so making it explicit has value) or gitignore `.cursor/`. Left in place;
     not the specifier's call." This commit tracked it, which answers that
     question de facto. THE ONE LIVE DECISION in the commit — confirm the
     tracking or gitignore `.cursor/`.

  5. `backlog/answers-archive/ANSWER-BL-764|765|766|768-*.md` (4 files, 32
     lines) — human answer archive, bookkeeping. NO ACTION.

  ## What this ticket asks the reviewer to do

  Re-derive the five dispositions above independently against the repo as it
  stands — this is a confirm-or-refute pass, not a re-implementation — and
  commit the result as
  `backlog/evidence/BL-860-architect-pass-<YYYYMMDD>.md` per Article 4.4.
  Refuting any one of them is a real finding; confirming all five is the
  expected outcome and is recorded as an explicit NONE.

