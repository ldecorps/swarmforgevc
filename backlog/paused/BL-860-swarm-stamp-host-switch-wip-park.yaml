notes: |
  Ledger mechanics (docs/how-to/BL-848-certify-an-operator-hotfix.md): the
  specifier ran `hotfix_ledger_update.bb --link f175bc56d1 BL-860` when
  minting this ticket, moving the entry `pending` -> `stamp-open` so the
  sweep stops nudging the coordinator. When this ticket reaches
  `backlog/done/` the entry becomes `awaiting-human`, and the human's
  decision is recorded with
  `bb swarmforge/scripts/hotfix_ledger_update.bb . --decide f175bc56d1
  approved|waived`. Reaching `done` is NOT itself certification — the ledger
  decision is the durable fact, and the sweep logs an anomaly if a stamp
  ticket lands `done` with no decision recorded.

  The acceptance file ships as `.feature.draft` because it has no step
  handlers yet; materialize it to a live `.feature` in the same parcel that
  lands them (BL-233).

  e2e QA procedure: confirm the ledger entry for f175bc56d1 reads
  `stamp_ticket: BL-860`; confirm the architect evidence file exists and
  dispositions all five items; confirm `swarmforge/packs/mono-router.conf`
  still does not read `active_backlog_max_depth 0`.

