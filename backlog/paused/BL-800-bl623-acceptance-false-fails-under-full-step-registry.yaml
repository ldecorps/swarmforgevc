id: BL-800
title: "BL-623's acceptance false-fails under the full step registry: BL-606's generic 'the parcel is delivered to (.+)' shadows BL-623's exact step"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
priority: 10
direction: normal
mutation_cost: low
acceptance: specs/features/BL-623-routing-skip-trail-records-actual-hop.feature

invariants:
