description: |
  ## What is wrong

  `swarmforge/scripts/test/test_pack_staffing_gate_wiring.sh` (BL-1318,
  `standing` row 387 of `suite-manifest.tsv`) sources the real
  `swarmforge/scripts/swarmforge.sh` against fixture roots and asserts that
  `parse_config` refuses an uncleared seat (cases 01, 03b, 04, 05a) and
  prints no warning on a cleared one (02). Each case runs
  `MODEL_STEWARD_STATE_DIR=... zsh -c "source ...; parse_config"` and
  inherits every other variable from the pane.

  `.swarmforge/swarm.env` line 46 exports
  `PACK_STAFFING_SKIP_GATE="${PACK_STAFFING_SKIP_GATE:-1}"` into every
  role pane - the documented operator escape hatch (`swarmforge.sh`
  550-608) kept in place because the full-forge pack has a seat the gate
  cannot resolve (BL-1437). Under it the launcher turns every refusal into
  a `WARNING: pack staffing gate OVERRIDE ...` line and lets `parse_config`
  return, so case 01's `RC1 -ne 0` fails first and the `set -e` test stops.

  Reproduced 2026-09-06 by the specifier on main at `00372da7f0`:

      FAIL: 01: an uncleared seat (cursor/nightly, no steward mapping) should have refused parse_config
      (OUT1: WARNING: pack staffing gate OVERRIDE (PACK_STAFFING_SKIP_GATE=1) — role 'QA' staffed ...
             PARSE_CONFIG_RETURNED)

  and `env -u PACK_STAFFING_SKIP_GATE bash <the test>`: `ALL CHECKS PASSED`.
  `test_pack_staffing_gate.sh` (the CLI adapter) and
  `pack_staffing_gate_lib_test_runner.bb` both pass: the gate is intact;
  the test asserts against the pane. This is the shape the hardender's
  2026-08-12 rule names ("a shell test unsets every SWARMFORGE_* var its
  tested script reads") for a variable outside that prefix; the rule's
  text was widened with this mint.

  Of the nine tests that source the launcher, the others (e.g.
  `test_backlog_depth_pack_override.sh`) set the override to 1 themselves
  or assert nothing about the gate, which is why only this file is red.

  ## What is wanted

  - Every case of the wiring test decides `PACK_STAFFING_SKIP_GATE` itself:
    refusal and no-warning cases run with it unset, case 03 with it set to
    `1`, each on the case's own invocation - never inherited (invariants).
    The test passes every case under `PACK_STAFFING_SKIP_GATE=1`, `=0`, and
    unset (scenario 01).
  - Every shell test that sources `swarmforge.sh` and asserts on the gate's
    refusal or override warning sets or unsets the variable explicitly
    before sourcing (scenario 02, derived by grep, never a list).
  - The landing commit removes this ticket's row from
    `backlog/standing-reds.tsv` (standing-red rule 2).

  ## How (direction, not mandate)

  - In the wiring test, `env -u PACK_STAFFING_SKIP_GATE` (or an explicit
    `PACK_STAFFING_SKIP_GATE=` assignment) on each `zsh -c` invocation, and
    `PACK_STAFFING_SKIP_GATE=1` on case 03 as it already is; or one `unset`
    at the top under the 2026-08-12 pattern plus the explicit `=1` on 03.
    Keep the test bash-3.2 safe.
  - Handler `specs/pipeline/steps/bl1445StaffingGateWiringTestDecidesOverrideSteps.js`:
    scenario 01 spawns the real test with the variable set to the row's
    value (or removed from the child env); scenario 02 greps
    `swarmforge/scripts/test/*.sh` for `source .*swarmforge.sh` and, among
    those, for `staffing gate|OVERRIDE` in assertions, then for an explicit
    `PACK_STAFFING_SKIP_GATE` assignment or `env -u`/`unset` before the
    source line - a structural check derived from the files (BL-1408 /
    BL-1398 posture).
  - Documenter: one sentence in `docs/how-to/BL-1318-*.md` (if it exists)
    or the model-steward how-to that the wiring test is hermetic to the
    escape hatch. No diagram trigger fires.

  ## Out of scope

  - Removing the escape hatch from `swarm.env`: it is the operator's, and
    it lapses when BL-1437 certifies the seat.
  - The launcher's own override behaviour (correct: a loud, distinct
    warning per seat).
  - `test_backlog_depth_pack_override.sh` and siblings that set the
    override to 1 on purpose.

qa_e2e_procedure: |
  1. In the QA pane (which exports the override):
     `bash swarmforge/scripts/test/test_pack_staffing_gate_wiring.sh` ends
     `ALL CHECKS PASSED`; so does
     `env -u PACK_STAFFING_SKIP_GATE bash ...` and
     `PACK_STAFFING_SKIP_GATE=0 bash ...`.
  2. The BL-1445 feature passes all four runs; BL-1318's feature stays
     green.
  3. `grep -c 'PACK_STAFFING_SKIP_GATE' swarmforge/scripts/test/test_pack_staffing_gate_wiring.sh`
     is at least 6 (one decision per invoking case); the override warning
     appears in the test's output exactly once (case 03).
  4. The landing removes the BL-1445 row from `backlog/standing-reds.tsv`;
     `bb swarmforge/scripts/standing_red_register_cli.bb` (BL-1428) reports
     no row for the file.

