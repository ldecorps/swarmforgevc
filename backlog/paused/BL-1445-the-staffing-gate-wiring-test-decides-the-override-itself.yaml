  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. Minted by the specifier the same
  pass as the coder's unowned-red note (2026-09-06T17:22Z, from the
  BL-1437 parcel) under the standing-red rule; reproduced on main in the
