id: BL-1445
title: "test_pack_staffing_gate_wiring.sh inherits the pane's PACK_STAFFING_SKIP_GATE=1 (the operator escape hatch swarm.env exports into every role since ~2026-09-04), so its refusal cases read as OVERRIDE warnings and case 01 fails on main in every lane while the same file passes under env -u: each case sets or unsets the override itself, and so does every launcher-sourcing test that asserts on the gate"
milestone: M8
type: defect
severity: high
# high (standing-red rule 2026-09-05): a standing manifest row red on main
# in every role's lane. The test is the one proof that the launcher's
# parse_config loop calls the staffing gate at all; while it is red for
# an environmental reason, a real regression of that wiring would be
# invisible behind the same FAIL line. Never medium for a red.
