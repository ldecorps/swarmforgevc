invariants:
  - "Every environment variable the launcher's gate path or the gate CLI reads (PACK_STAFFING_SKIP_GATE, MODEL_STEWARD_STATE_DIR) is set or unset explicitly by each case of the wiring test; none is inherited from the pane, so the test decides identically under every launch environment."
  - "The wiring test's own override case (03) stays the only place the override is on, and it turns it on explicitly for that case alone."

required_wiring:
