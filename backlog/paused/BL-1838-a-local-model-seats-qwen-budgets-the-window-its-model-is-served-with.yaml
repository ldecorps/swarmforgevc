description: |
  ## What happened

  - The seat crashed at 12:26Z: "Context is too large to send safely
    after automatic compression. Estimated prompt tokens: 32631; hard
    limit: 30852.8; compression status:
    COMPRESSION_FAILED_INFLATED_TOKEN_COUNT."
  - Ollama was already serving `ista-iq3s-coder:latest` at num_ctx 49152
    (the coordinator's bump, `ollama ps` CONTEXT 49152). 30852.8 is qwen's
    own limit from contextWindowSize 32768.
  - qwen read contextWindowSize from `~/.qwen/settings.json`. The
    worktree's `.qwen/settings.json`, written by BL-1829's
    `write_local_model_qwen_settings`, holds only the tool lists. The
    `start-swarm-ollama-ista-local-model-claude.sh` launcher adds the
    entry when missing and never updates it; the full-forge launch that
    staffs coder@iq3 never touches it.
  - The specifier set the user entry to 49152 by hand as part of the
    hotfix (2cdb259806); nothing keeps it true.

  ## What is wanted

  1. When the swarm writes a local-model seat's qwen settings, the
     worktree's `.qwen/settings.json` carries a provider entry for the
     seat's `--model` whose contextWindowSize is the num_ctx Ollama serves
     that model with (scenario 01).
  2. When Ollama reports no num_ctx, the swarm's own context length
     (`SWARMFORGE_OLLAMA_CONTEXT_LENGTH`) is used (scenario 02). With
     neither, write no entry and print one warning line naming the seat.
  3. The entry keeps what the hand-kept one carries: the loopback base
     URL, `envKey` OLLAMA_API_KEY, `extra_body.think: false`; and the tool
     lists BL-1829 writes stay exactly as they are (scenario 03).

  ## How (direction, not mandate)

  - The num_ctx reading belongs to `local_model_window_gate_cli.bb`
    `served-window` (POST /api/show); call it, or move it into
    `local_model_window_gate_lib.bb` and call it from both, rather than a
    second parser (IO-near code calls the owner, BL-1811).
  - The shape to copy is the gitignored master `.qwen/settings.json`'s
    `ista-iq3s-coder:latest` entry (timeout 600000, streamIdleTimeoutMs,
    maxRetries 1, samplingParams). Verify on a scratch HOME with a
    loopback fake endpoint, the way BL-1829 measured its tool lists, that
    qwen uses the project entry over a user entry for the same id.
  - Step handler `specs/pipeline/steps/bl1838QwenBudgetsTheServedWindowSteps.js`,
    registered in `specs/pipeline/steps/index.js` in the same commit as
    the feature's first green run (BL-233). The served window comes from a
    fake /api/show; never the live Ollama, never the live `~/.qwen`
    (throwaway HOME, BL-1829's method). Fixture roots under mkdtemp,
    `git init`, proven by `rev-parse --git-common-dir` (BL-1390).

  ## Scope

  `swarmforge/scripts/swarmforge.sh` `write_local_model_qwen_settings`
  and its caller's arguments, the served-window read, the shell test
  (`test_bl1829_local_model_qwen_settings.sh` or a sibling), the step
  handler and its registration, evidence.

out_of_scope: |
  - The launch prompt's "@" path: BL-1837.
  - Retiring the stand-alone ollama launchers' user-settings upsert: they
    are untracked operator scripts.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1838-a-local-model-seats-qwen-budgets-the-window-its-model-is-served-with.feature`:
     4 of 4 ok (two rows of 01, 02, 03). Measured 0 on main at mint: no
     handler exists yet.
  2. `bash swarmforge/scripts/test/test_bl1829_local_model_qwen_settings.sh`:
     ALL PASS (measured on main 7f38e5d7fe at mint).
  3. In-process probe on a mkdtemp scratch root with a fake /api/show
     answering num_ctx 49152: call the writer for a seat with
     `--model ista-iq3s-coder:latest`; the written file's entry reads
     contextWindowSize 49152 and think false.
  After the land (the coordinator's check on the next swarm launch, not
  QA's): `.worktrees/coder-iq3/.qwen/settings.json` carries the entry, and
  a coder@iq3 session passes 31000 input tokens without a compression
  error (`~/.qwen/usage/token-usage-<month>.jsonl`).

