id: BL-1193
title: "Deprecator freshness gate: retired-token extractor must name the item the RETIRED marker actually retires, not a co-occurring word"
milestone: M8
type: defect
severity: high
status: todo
epic: deprecator
priority: 40
direction: swarm-reported
depends_on: [BL-1173]
mutation_cost: high
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1193-deprecator-retired-token-must-name-the-actual-retired-item.feature
human_approval: approved
approval_context: >
  Discovered adjudicating BL-1190's Article 3.6 freshness HOLD (2026-08-27).
  `node extension/out/tools/deprecate-check.js . BL-1190` returned
  `{"decision":"hold","reason":"stale premise: depends_on done but
  description still names retired surface(s): Mint"}`. Traced to
  docs/how-to/BL-1095-retire-the-expedite-lanes-legacy-bug-type.md:21 —
  `| Mint hygiene (\`backlog_hygiene_lib.bb\`) | \`type: bug\` -> \`RETIRED-TICKET-TYPE
  ... use type: defect\` |` — whose RETIRED marker actually names `type: bug`,
  not "Mint". deprecate-check.js's loadRetiredTokens verb regex
  (`\b([a-z][a-z0-9_-]{2,})\b.*\bRETIRED\b`) captures the first a-z word on
  the line, not the word adjacent to/naming the marker, so any unrelated
  ticket whose description merely contains the common word "Mint" (this
  project's own vocabulary for creating a ticket — "mint a ticket",
  "mint-time gate") gets a false HOLD. BL-1190 confirmed-promote past this
  false hold (see its notes:); this ticket fixes the extractor itself so the
  Article 3.6 gate — mandatory before EVERY promotion — stops false-blocking
  any ticket that happens to use common vocabulary. Needs human sign-off per
  the standard human_approval gate before promotion; not an emergency
  queue-jump.

description: |
  ## What

  `deprecate-check.js`'s `loadRetiredTokens` scans `docs/` for lines matching
  `RETIRED`, then extracts a "retired token" via
  `/\b([a-z][a-z0-9_-]{2,})\b.*\bRETIRED\b/i` — the first word-like token
  anywhere earlier on the line, regardless of whether that word is what the
  RETIRED marker actually names. `collectRetiredSurfaceHits` then treats a
  bare substring match of that token anywhere in a candidate ticket's YAML
  text as proof the ticket references retired behaviour.

  This conflates "co-occurs on the same doc line as a RETIRED marker" with
  "is the thing the marker retires." A table row documenting that `type: bug`
  is `RETIRED-TICKET-TYPE` also happens to start with "Mint hygiene" (the
  ticket-minting hygiene checker's name) — an unrelated concept two columns
  away — and the regex extracts "Mint" instead of `type: bug`.

  Because "mint"/"Mint" is core vocabulary in this project (the specifier
  "mints" tickets; multiple existing tickets and gates are literally named
  "Mint-time ..."), this false-positive token can HOLD any paused ticket
  whose description happens to use the word — and Article 3.6 runs this
  check before every single promotion, fail-closed. A high false-positive
  rate on common vocabulary erodes the gate's credibility and burns
  specifier/coordinator cycles on manual adjudication for holds that are not
  real.

  ## How (direction, not mandate)

  Anchor the extracted token to the RETIRED marker's actual referent rather
  than "first word on the line" — for example, prefer a token immediately
  adjacent to (or delimited/backtick-quoted directly before) the RETIRED
  marker over one merely appearing earlier in the same line. The existing
  path-like extraction (`pathLike` regex) already anchors correctly by
  requiring a file-extension match immediately before the marker context;
  the verb-token branch needs the equivalent discipline. The fix lives in
  `extension/src/tools/deprecate-check.ts` (`loadRetiredTokens`); compile to
  `extension/out/tools/deprecate-check.js` per normal build.

  ## Constraints

  - Must not regress BL-1173's existing true-positive coverage (feature
    scenario `freshness-hold-retired-surface-02`): a ticket genuinely naming
    a retired module/verb/conf-key must still hold.
  - Fail-closed posture (Article 3.6) is unchanged — this fixes a
    false-positive extractor, not the fail-closed default.

qa_e2e_procedure: >
  Run `node extension/out/tools/deprecate-check.js . BL-1190` (or any live
  paused ticket whose description contains "Mint" but names no genuinely
  retired surface) against the current docs/ tree and confirm the decision
  is `allow`, not a false hold naming "Mint". Then run it against a fixture
  ticket whose description genuinely names `type: bug` and confirm it still
  holds with a reason naming `type: bug`.

out_of_scope: |
  - Rebuilding the freshness gate's other signals (supersede marker,
    depends_on-not-done, spec-gap bounce count) — untouched, working as
    designed.
  - Re-adjudicating BL-1190 itself — handled separately (see its notes:).

invariants:
  - "A retired-token hold's reason always names a token that is itself the marked-RETIRED referent on its source doc line, never a merely co-occurring word."

