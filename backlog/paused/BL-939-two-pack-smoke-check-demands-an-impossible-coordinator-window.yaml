approval_context: >
  One thing needs your eye, because it INVERTS how this defect was filed.
  The coder's evidence left it open whether the fix is "add the missing
  `window coordinator` line to the profile" or "the smoke check's own
  expectation is stale". I probed it: swarmforge.sh's parse_config REJECTS a
  `window coordinator` line and exits 1 ("coordinator is reserved
  infrastructure"), stabilize-two-pack.conf carries a comment saying exactly
  that, and no profile in swarmforge/profiles/ declares one. So the profile
  is right and the check is stale - and taking the check's own advice would
  have broken ./swarm for this pack. This ticket pins the check as the site
  to fix and forbids touching the profile. Severity is medium rather than low
  for that reason: the failure message actively misdirects whoever reads it.

source: |
  Coder priority-00 note 2026-08-19 alongside BL-937's git_handoff, defect D2
  of backlog/evidence/BL-937-surfaced-defects-not-fixed-20260819.md (in
  commit d3e98df25), under BL-937's constraint reserving surfaced assertion
  failures for a follow-up ticket. Diagnosis corrected by the specifier at
  spec time - see approval_context.

description: |
  ## The defect

  `swarmforge/scripts/smoke_check_stabilize_two_pack.sh` parses the profile's
  own `^window ` lines and compares the role names it finds against
  `expected=(coordinator coder cleaner)` (line 28), failing with:

      SMOKE FAIL: profile defines roles [coder cleaner], expected
      [coordinator coder cleaner] (coordinator+coder+cleaner only, per BL-203 scope)

  That expectation is unsatisfiable. BL-243 (2026-07-10) made the coordinator
  reserved infrastructure: `swarmforge.sh`'s `parse_config` rejects a
  `window coordinator` line outright and exits 1 -

      Error: coordinator is reserved infrastructure and may not be declared
      as a window in $CONFIG_FILE (line N) - it is always provisioned
      automatically.

  - while `provision_coordinator` always adds exactly one. The check was
  written for BL-203, before BL-243 moved where the coordinator comes from,
  and the two have drifted apart.

  ## The profile is correct; the check is stale

  Verified 2026-08-19 on the working tree and on `origin/main` alike:
  `stabilize-two-pack.conf` declares exactly two windows (coder, cleaner) and
  carries a comment stating "BL-243: the coordinator is provisioned
  automatically by ./swarm - it is reserved infrastructure and is rejected
  outright if declared here as a window line". No profile in
  `swarmforge/profiles/` declares a coordinator window: `cheap-copilot-seven-pack.conf`,
  `mono-router-gpt.conf` and `stabilize-two-pack.conf` all have zero.

  So the trap is real: acting on the check's own failure message - adding the
  missing line - would make `./swarm` exit 1 for this pack. The fix belongs in
  the check.

  Nothing caught the drift for five weeks because the check itself could not
  run: it died on `mapfile: command not found` at line 27 on this stock-bash-3.2
  host, before ever reaching the comparison. BL-937's port made it executable,
  which is what surfaced this.

  ## How (direction, not mandate)

  The narrow reading is that the check should expect the profile's
  pack-configurable roles only (coder, cleaner) and, if it wants to assert the
  coordinator at all, assert it against what `./swarm` actually provisions
  rather than against the conf text. Which of those two it does - and whether
  the BL-203 scope comment in the failure message needs rewording to match -
  is the implementer's call after reading BL-203's own scope statement.

invariants:
  - "swarmforge/profiles/stabilize-two-pack.conf is NOT changed. A `window coordinator` line is a hard parse error in swarmforge.sh's parse_config, so 'fixing' the profile would break ./swarm for this pack outright - the exact misdirection this ticket exists to close."
  - "The check is corrected, never deleted, skipped, or weakened into an always-pass. It must still fail when a genuinely pack-configurable role is missing from the profile."

acceptance: specs/features/BL-939-two-pack-smoke-check-stops-demanding-a-coordinator-window.feature

qa_e2e_procedure: |
  On the live swarm host, from the repo root, with stock /bin/bash:

  1. Reproduce the red state at the commit before the fix:
     `/bin/bash swarmforge/scripts/smoke_check_stabilize_two_pack.sh`
     Confirm it fails with "profile defines roles [coder cleaner], expected
     [coordinator coder cleaner]".
  2. At the fix commit, run the same command against the UNCHANGED profile.
     Confirm it passes.
  3. Confirm the profile really is unchanged in the parcel:
     `git show --stat <commit>` shows no
     swarmforge/profiles/stabilize-two-pack.conf, and
     `grep -c '^window coordinator' swarmforge/profiles/stabilize-two-pack.conf`
     is still 0.
  4. Confirm the rejection the invariant rests on is real: append
     `window coordinator claude coordinator` to a SCRATCH COPY of the profile,
     point SWARMFORGE_CONFIG at it, and confirm the parse exits 1 with
     "coordinator is reserved infrastructure". Delete the scratch copy.
  5. Non-vacuity: remove the `window cleaner` line from a scratch copy of the
     profile and confirm the smoke check FAILS naming the missing cleaner.

notes: |
