approval_context: >
  Split out of BL-1196's 2026-08-28 amendment rather than folded into it.
  BL-1196 was already human-approved AND already promoted to active with a
  coder on it, so widening its contract in place would be the BL-317/BL-325
  worktree-staleness failure. This is the half the human has not seen.

  The two are complementary, not redundant, and it is worth being clear why
  both are wanted. BL-1196 strips the variables inside vitest, which covers
  every JS test file. This ticket strips them one level out, where the guard
  launches the suite, which additionally covers every SHELL fixture the suite
  shells out to — the class that wrote 20 commits onto local main and detached
  the master checkout in BL-1200. A vitest setupFile can never reach those.

  Neither blocks the other and they touch different files. If you want only
  one, this is the broader of the two, but BL-1196 is the one already moving.

  APPROVED by you 2026-08-28 (commit 708a020b2). RESCOPED the same day, after
  that approval and its whole commit chain were destroyed by the main-reset
  bug and recovered from the reflog: by then the coder had already built the
  scrub inside BL-1196's parcel, because BL-1196's own scenario 04 drives this
  guard script end to end and cannot pass without it. So the SCRUB ships with
  BL-1196 rather than waiting for a second six-stage run of work that is
  already written and architect-reviewed. This ticket keeps what BL-1196 does
  not cover — the direct assertion on the launched suite's environment, the
  nested SHELL fixture, and the short-circuits-unchanged regression guard —
  and is now a small acceptance slice on top of a landed change. Your approval
  is honoured, not spent: nothing was retired and nothing shipped unseen.
description: |
  ## What

  `swarmforge/scripts/check_property_suite_drift.sh` must not pass the
  pre-commit hook's inherited git environment into the suite it launches.
  Scrub `GIT_DIR`, `GIT_WORK_TREE` and `GIT_INDEX_FILE` at the invocation, so
  every process in that run — the vitest workers and anything they shell out
  to — resolves git against its own working directory.

  **The scrub itself landed early, with BL-1196** (coder commit `55e138201`,
  `check_property_suite_drift.sh:204`), because BL-1196's scenario 04 drives
  this script end to end and is red without it. Confirm it is still there
  rather than writing it again. What this ticket owes is the coverage on this
  script's own surface that BL-1196 does not reach: the three scenarios in the
  feature file, their step handlers, and whatever unit coverage the shell test
  harness needs. If the scrub has gone missing, restoring it is in scope.

  ## Why

  The guard runs the suite as:

      run_default_suite() { (cd extension && npm run test:properties); }

  with no environment handling of any kind. It is invoked from the shared
  `swarmforge/git-hooks/pre-commit`, and git populates that hook's environment
  itself. Measured 2026-08-28 in an isolated scratch repo, committing from a
  linked worktree:

      GIT_DIR=<main>/.git/worktrees/<name>               (absolute)
      GIT_INDEX_FILE=<main>/.git/worktrees/<name>/index  (absolute)

  `GIT_WORK_TREE` is not set, which is why the working tree survives and only
  the ref and index are hit. A child that `cd`s outside the repository
  entirely still resolves to that gitdir and reports
  `HEAD -> refs/heads/<role-branch>`. So a fixture doing mkdtemp, `git init`,
  `git commit` does not get an isolated repository: it writes the branch of
  the very worktree whose commit triggered the guard.

  That has now happened at least five times in two days across four roles,
  including twice in a row on `swarmforge-hardender` on 2026-08-28 (hardener
  evidence `62da72445`), each time on ordinary work nobody chose to run — the
  guard's own trigger path is the delivery mechanism. It also explains why a
  manual `npm run test:properties` from a clean shell is harmless: only the
  hook path carries these variables.

  ## How (direction, not mandate)

  A prefix such as `env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE` on the
  suite invocation is the obvious shape and is expected to be sufficient. The
  ticket does not mandate it; what it requires is that no process in the
  launched run inherits those three.

  ## Constraints

  - Do not change which staged paths trigger the guard, or make the suite it
    runs narrower. Real costs, both, and both separate tickets.
  - The three existing short-circuits must behave exactly as today:
    `SWARMFORGE_SKIP_PROPERTY_SUITE_GUARD=1`, the `skip-paths` exit, and the
    exit-127 toolchain-missing skip.
  - The BL-1124 canary's snapshot/assert behaviour is untouched. This ticket
    removes a cause; BL-1202 is the one that makes the canary report reliably.
  - Do not scrub anything from the hook's own environment before the guard's
    other checks run — only the suite launch is in scope.

qa_e2e_procedure: >
  (1) In a SCRATCH clone — never this repository — create a linked worktree,
  install a pre-commit hook that records `env | grep ^GIT_`, and commit from
  the worktree; confirm GIT_DIR and GIT_INDEX_FILE are present and absolute.
  (2) With the guard pointed at a fake suite command that records its own
  environment, confirm none of GIT_DIR, GIT_WORK_TREE, GIT_INDEX_FILE reaches
  it. (3) With a fake suite that runs mkdtemp + `git init` + `git commit`,
  confirm the scratch worktree's branch ref and index are unchanged afterward
  — red before the fix. (4) Confirm the same holds for a fake suite that
  shells out to a nested script doing the same thing, which is the case a
  vitest setupFile cannot cover. (5) Confirm the three short-circuits are
  untouched, and that a normal green run still exits 0 and a mutated checkout
  still exits 1 with the BL-1124 message. (6) Run
  `swarmforge/scripts/test/test_property_suite_drift_guard.sh` and confirm it
  is no worse than its pre-change baseline.

  Do NOT verify any of this by running the real property suite against a live
  worktree.

out_of_scope: |
  - BL-1196, the vitest setupFile guard. Complementary, independently
    landable, already active.
  - BL-1202, the canary-on-every-exit-path and process-group takedown. That
    ticket assumes a fixture can still misbehave and is about reporting it;
    this one removes the vector.
  - BL-1200 and the ~60 per-file `git()` helpers. Not edited by this ticket;
    making their current shape safe by construction is the whole point.
  - Rescoping the guard's trigger set or the breadth of the suite it runs.

invariants:
  - "No process the property-suite guard launches inherits GIT_DIR, GIT_WORK_TREE or GIT_INDEX_FILE from the hook that invoked the guard."
  - "The guard's existing pass, fail and short-circuit behaviours are observable-identical to before this change."

required_wiring:
  - "swarmforge/scripts/check_property_suite_drift.sh::GIT_INDEX_FILE::the scrub must be in the guard that actually launches the suite; anchored to the variable name because any implementation must name it whatever the surrounding syntax, rather than to an identifier the implementer has not chosen yet (BL-874)"

