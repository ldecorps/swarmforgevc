id: BL-1222
title: "The property-suite guard hands the pre-commit hook's git environment straight to the suite, so shell fixtures it shells out to still reach the live worktree"
milestone: M8
type: defect
severity: high
# high: a broken safety signal. The guard exists to keep a suite run from
# touching the shared checkout, and it is the component that supplies the
# variables making that possible. Recoverable each time so far (no data loss),
# which is why it is not critical.
