approval_context: >
  Feature file written 2026-08-23; the approval the original context reserved.
  Four scenarios, and the shape is narrower than the ticket first read because
  the survey found most of the gate already built. BL-525 already proves the
  certification gate holds generically - a candidate is excluded from assign
  and cold-apply unless --override-uncertified is passed, and the rationale
  records the override. Those scenarios are deliberately not restated here.
  What the survey did find is a real hole worth your attention: certify builds
  its report from an empty result set, so today ANY identity can be certified
  with no evidence whatsoever. Invariant 1 is undeliverable while that is
  true, so this slice makes the compliance-battery scorecard the evidence
  certify requires - a general change, not a Cursor special case, and the one
  place this slice reaches beyond Cursor. Approve if that is the right scope;
  Amend if you would rather the certify hole became its own defect ticket and
  BL-1079 shipped only the identity registration.

required_wiring:
  - 'swarmforge/model-steward/seed/models.seed.json::"cursor"::the Cursor identity must live in the committed seed - an entry written only into gitignored .swarmforge runtime state does not travel, is not reviewable, and leaves production routing unchanged on every other host'
  - "specs/pipeline/steps/index.js::bl1079::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler"

invariants:
  - "Before ordinary pack routing or ModelFactory assignment, a Cursor identity is registered as candidate, runs the steward compliance battery, produces an evidence artifact, then certify — never a fabricated Anthropic id."
  - "Pack apply refuses a candidate Cursor unless certify has succeeded or an explicit spike-only escape is set."

description: |
  ## What is wrong

  BL-712's non-negotiable gate: an uncertified Cursor must not be silently
  routable on mono-router or full-forge production packs. Three concrete gaps
  stand between here and that:

  1. **No Cursor identity exists.** `swarmforge/model-steward/seed/
     models.seed.json` knows `anthropic`, `openai` and `cerebras` only, so
     there is nothing for the gate to gate. An identity added without
     `capabilities`, `role_matrix` and `adapters` entries would be inert:
     `role-recommendations` never returns it and ModelFactory never sees it.
  2. **`certify` certifies on nothing.** `model_steward_cli.bb`'s `run-certify`
     calls `build-certification-report` with an empty results vector, writes
     that empty report, and flips the status. No evidence is read, so
     "certified" carries no information — for Cursor or any other identity.
  3. **The provider→agent token is unchecked across the boundary.**
     `model_factory_lib.bb`'s `provider->agent` falls back to the provider name
     for anything unmapped, so provider `cursor` yields agent token `cursor`.
     That is only launchable because BL-1078 widens the shell allow-list; no
     import connects the Babashka map to the shell `case`, so the agreement
     has to be asserted or it drifts silently.

  ## How (direction, not mandate)

  Register the Cursor identity under provider `cursor` — never a borrowed
  vendor id, however the Cursor CLI labels the underlying model — as a
  **candidate**, with the capability, role-matrix and adapter entries that
  make it reachable. Make `certify` require the compliance battery's
  aggregated scorecard (`compliance_battery.bb scorecard`) as its evidence and
  refuse without it, naming the artifact it wanted. Assert the
  provider→agent token against the launcher's own allow-list source.

  Document the Cursor-specific residuals: bootstrap limits, remote-control
  differences versus Claude `/rc`, and cost attribution.

  Not in this slice: launcher whitelist (BL-1078); pack how-tos (BL-1080).
  Not restated here: BL-525's certification-gate and override scenarios.

qa_e2e_procedure: >
  1. On a clean checkout run model_steward_cli.bb status and confirm the
     Cursor identity appears as candidate under provider cursor, and that the
     three pre-existing identities are unchanged.
  2. Run model_factory_cli.bb assign --mode quality --role documenter with no
     override and confirm the documenter seat is NOT assigned Cursor. Repeat
     with --override-uncertified and confirm it is, and that the recorded
     rationale names the uncertified override.
  3. Run certify for the Cursor identity with no scorecard present: it must
     refuse, name the scorecard path it wanted, and leave the status at
     candidate. Confirm no certification report was written.
  4. Produce a real scorecard with compliance_battery.bb scorecard, re-run
     certify, and confirm the status flips to certified and the stored report
     names that scorecard rather than an empty result set.
  5. Re-run step 2 with no override: the documenter seat is now assigned
     Cursor, and the agent token in the applied overlay is one ./swarm accepts
     - launch the pack to prove it, do not read the token off and assume.
  6. Decertify with a reason and confirm routing reverts to refusing Cursor.

