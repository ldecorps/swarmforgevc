id: BL-1449
title: "OPERATOR_RUNTIME_BB_FILES has been retyped by hand eight times (BL-944 counted five, BL-1265 was the seventh, BL-1439 fixed the eighth on 2026-09-06), each drift a standing red until someone caught the list up: the export is computed from BL-944's own closure walk at module load, plus the declared extras, so a new load-file is in the fixture the moment it exists and the list can no longer drift"
milestone: M8
type: defect
severity: medium
# medium: nothing is broken on main today (BL-1439 caught the list up).
# What is wrong is a design that turns every new load-file into a
# standing red in the unit suite, on a cadence of every one to two
# weeks, each costing a ticket or a collateral fix. Not high: no safety
# signal is broken while the list is current.
status: todo
epic: code-quality-gates
