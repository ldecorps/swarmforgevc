description: |
  ## What

  Extend the epic reorder screen (epicReorderUiHtml.ts, served by
  bridgeServer.ts) with a drill-down view per epic: its live topics in
  displayed order (priority asc, id asc), one make-top button per row wired
  to BL-673's route, refusal/bound reasons displayed, dependency markers on
  rows that carry live depends_on, and back navigation. Read model comes
  from the extension host / bridge (fresh at render, like the tiles);
  the webview stays presentation-only — no browser storage, no direct
  filesystem access (webview boundary rules).

  This is the untestable-edge slice: all decision logic already lives in
  BL-672/BL-673's pure core. Keep any new logic in the HTML module thin;
  anything decision-shaped belongs in the testable modules, not here.

  Coder materializes the .feature.draft to .feature and wires step handlers
  in the same parcel (BL-441/BL-233). Documenter: the BL-572 screen's
  how-to and the console architecture diagram gain the drill-down.

  ## e2e QA procedure

  On the phone Mini App: open the reorder screen, drill into an epic with
  >=2 live topics, verify order matches the backlog YAML, tap make-top on
  a dependency-free topic and see the list re-render with it on top; tap a
  topic whose live dependency ranks worse and see the refusal reason with
  the blocker id; verify the pane header is present throughout and back
  returns to the tiles.
