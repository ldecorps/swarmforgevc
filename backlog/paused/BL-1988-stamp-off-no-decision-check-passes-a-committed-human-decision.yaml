description: |
  ## Status: hotfix 02f834ec44 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  Every stamp-off's "no green suite writes a decision" check read its
  reviewed commit's LIVE ledger row and required human_decision and
  decided_at to be null forever. That is true only until a human decides.
  The human's certification of the 98 QA-passed hotfix entries
  (8ce721bc4f) decided those rows, so the checks failed on main: the
  property files bl1323, bl1324, bl1333 and bl1346, and the step handlers
  of the BL-1333, BL-1342, BL-1346, BL-1560 and BL-1563 features. QA held
  BL-1925 on the first three.

  ## What the hotfix changed

  - New `extension/test/helpers/hotfixLedgerDecision.js`:
    `uncommittedDecision(repoRoot, ledgerText, commit)` returns null when
    the row is undecided, or decided exactly as `git show
    HEAD:backlog/hotfix-ledger.yaml` records it with a human_decision of
    approved or waived; otherwise the message to fail with. Only
    hotfix_ledger_update.bb --decide writes a decision, at a human's word,
    and it lands as a commit; BL-848's sweep never writes one.
  - The nine sites call it in place of their three null assertions.
    Everything else they check is unchanged: bl1323's run of its feature
    must still leave the ledger byte-identical, bl1324's parcel-artifact
    face and stamp_ticket link, and bl1560/bl1563's "the review never
    modifies the ledger" porcelain check.

  ## What the coder checks

  The helper against the invariant, and each of the nine sites against
  its old assertions. Also note, for the specifier, that the five
  features' step wording ("still reads pending", "carries no human
  decision") now describes the in-flight review, not a certified row; say
  whether you think they should be reworded or left. Evidence:
  backlog/evidence/BL-1988-coder-<date>.md.

notes: |
