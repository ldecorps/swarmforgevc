  Two things to confirm before this epic is promoted.

  1. **Only the foundation slice is minted.** The other four are named above
     with their scope but have no ticket yet, deliberately: each one's
     acceptance depends on the package contract BL-866 defines, and minting
     them now would fix their scenarios against a format that does not exist.
     They get minted once BL-866 lands. Say so if you would rather see all
     five specced up front.

  2. **BL-659 retarget is NOT applied yet.** This intake says the PWA
     knowledge-explorer's corpus goals "retarget here" as native Kotlin, and
     that Pages PWA is maintain-only, not a feature destination. BL-659 is
     paused, so retargeting it is allowed at spec time — but it changes what an
     already-approved ticket builds, so I am flagging it rather than rewriting
     it silently. Confirm and I will retarget BL-659 (or retire it in favour of
     the native-Kotlin slice) in a follow-up pass.

  Open question 3 from the intake is still unanswered and assumed YES: showing
  "as of <cache time>" honesty on cached data. Say if that is wrong.

