description: |
  ## Why

  Bubble is the sole phone client (the human closed "one app"). The Pages PWA
  and the Telegram Mini App become migration feedstock and temporary
  fallbacks, not feature destinations. For Bubble to be the operator phone it
  has to work in a tube or a plane: read the backlog and docs offline, and let
  the human groom while disconnected.

  The human settled the three lanes that were blocking this: the sync source is
  the **bridge** (not Pages artifacts), the wire format stays **REST + versioned
  JSON packages** (not protobuf), and the merged PWA pieces are **native
  Kotlin** over those same JSON shapes (not a reused WebView).

  ## The shape

  Offline is a package + on-device store + outbox problem, which is why
  protobuf does not buy it:

  - **Packages.** Backlog, docs tree / corpus slices, chiptunes, flags — each a
    versioned JSON package with a generation, listed in a companion-manifest.
  - **Read path.** Fetch from the bridge while online (bubble start, idle, Wi-Fi
    preference), network-first then cache. After one successful sync, reads work
    offline, labelled "as of <generation>".
  - **Write path.** Grooming while offline queues real mutations in a device
    outbox and syncs when the bridge is up — not read-only scratch.

  ## Probe finding (2026-08-09)

  The bridge has no package catalog today. `/lets-talk/manifest.json`
  (`bridgeServer.ts:1642`) is a PWA web-app manifest served as
  `application/manifest+json` — an install descriptor for the browser, unrelated
  to a package manifest. The companion-manifest is genuinely new surface, not an
  extension of that route.

  ## Not in scope for this epic

  - Protobuf / gRPC. Deferred by the human pending measured pain.
  - Growing the Telegram WebView as a home for new operator UX (maintain-only).
  - A second phone client, in any form.

