id: BL-1045
title: "The board's `location` union has no `hold`, so three tickets are invisible on it right now - two parked since 10 August, and a severity-high defect parked this morning"
milestone: M8
type: defect
severity: medium
# medium: real and load-bearing, but contained - nothing ships wrong, work
# just sits unseen. The harm is duration, not corruption: BL-844 and BL-845
# have been invisible for twelve days.
status: todo
epic: pipeline-board
assigned_to: none
priority: 16
direction: human-requested
depends_on: []
mutation_cost: low
