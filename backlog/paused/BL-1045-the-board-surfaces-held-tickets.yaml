notes: |
  ## Facts confirmed live while scoping

  - `extension/src/panel/backlogReader.ts:466-480` - `hold` already read
    (BL-672); `findBacklogItem` searches active+paused+hold+done.
  - `extension/src/concierge/pipelineBoard.ts:116` - the `location` union
    without `'hold'`. Consumers are few: line 350 builds the GitHub link path
    as `backlog/${location}/${filename}` (which works unchanged once `hold`
    is a member), and lines 469-471 branch on paused/active.
  - `PIPELINE_BOARD_NOT_STARTED_COLUMN` (BL-473/BL-505) is the precedent for a
    non-role state on the board.
  - `backlog/hold/` contents and dates as listed in the description, read
    2026-08-22.

  ## Related

  - **BL-473** - the board's completeness contract ("at least as complete as
    the static PWA") and the not-started sentinel this follows.
  - **BL-672** - added `hold` to the reader. The half this ticket completes.
  - **BL-1043** - currently held, and the live example.
  - The expedite path parks `active/` -> `hold/` by design and nothing
    restores it afterwards; that recurring gap is a separate concern, but it
    is another producer of exactly the invisible-parked-ticket state this
    ticket makes visible.
