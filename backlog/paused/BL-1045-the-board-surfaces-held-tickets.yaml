acceptance: specs/features/BL-1045-the-board-surfaces-held-tickets.feature
human_approval: approved

invariants:
  - "A held ticket is never rendered as in-flight: it appears in its own section, never in a role column and never as not-started, because no role holds it."
  - "The board is at least as complete as the backlog folders its own reader returns: every ticket the reader hands it appears somewhere on the board, or the board states how many it left out - never a silent omission."

description: |
  ## What is wrong

  `extension/src/panel/backlogReader.ts` already reads `backlog/hold/` -
  `hold: BacklogItem[]` has been in `readBacklogFolders` since BL-672, and
  `findBacklogItem` already searches active, paused, hold and done.

  `extension/src/concierge/pipelineBoard.ts` cannot represent it. Its
  `location` union is:

      location?: 'active' | 'paused' | 'done' | 'root';

  There is no `'hold'`. The read side was built; the render side never
  learned the state exists, so held tickets fall off the board entirely.

  ## What is invisible right now

      BL-1043  every-supervised-child-gets-a-real-startup-grace   parked 2026-08-22
      BL-844   hands-free-session-state-machine                   since 2026-08-10
      BL-845   offline-hey-bubble-wake                            since 2026-08-10

  BL-844 and BL-845 have sat for **twelve days**, last touched only by an
  unrelated priority rewrite. BL-1043 is `severity: high` and was minted this
  morning; it was parked deliberately and correctly (commit `97f822dd5`:
  *"paused/ was insufficient, re-promoted itself past the same-function
  conflict twice"*), and vanished from the board the moment it was.

  ## Why this state in particular gets forgotten

  Article 3.1 is explicit that `backlog/hold/` items *"sit until a human moves
  them back"* - nothing auto-promotes from there, by design. Every other
  backlog state has something that eventually moves it: paused has the
  coordinator's promotion sweep, active has the pipeline, done is terminal.
  Hold has only a human who has to remember. Making it the one state with no
  automatic mover AND no display is what turns a deliberate park into an
  indefinite one.

  ## How (direction, not mandate)

  Add `'hold'` to the union and render held tickets as their own section -
  not a pipeline column. The precedent to follow is BL-473's not-started
  sentinel: a distinct state for a ticket no role holds, deliberately outside
  the role columns. A held ticket is further out still, since it is not even
  awaiting a role.

  Show **how long it has been held**, because duration is the whole harm - a
  ticket parked yesterday and one parked twelve days ago need to read
  differently at a glance. Derive that from git rather than file mtime: mtime
  is rewritten by clones, worktree operations and checkouts, and this repo has
  already been bitten by trusting it.

  Note while scoping, offered rather than specced: **parking records
  nothing**. Commit `97f822dd5` moved the file and added no field - no
  `held_at`, no `hold_reason` - so the reason exists only in a commit message
  and the date only in git history. Surfacing works without it, but a
  `hold_reason` would make the section far more useful. Out of scope here on
  purpose: it changes the schema and the parking path, and this ticket should
  not grow to cover both.

  ## Out of scope

  - The parking path itself, and any new ticket field.
  - `backlog/root` intake, which is a separate state with its own handling.
  - The static PWA and the holistic UI. This is the pipeline board.
  - Auto-promoting anything out of `hold/`, which Article 3.1 forbids.

qa_e2e_procedure: >
  1. At the parent commit, confirm the omission against real data: with three
     tickets in `backlog/hold/`, render the board and confirm none of them
     appears anywhere on it.

  2. At the parcel commit, render again and confirm all three appear in a
     held section, each with its id and how long it has been held.

  3. Confirm they are not rendered as in-flight: confirm no held ticket
     appears in any role column, and none appears in the not-started column.

  4. Confirm the age is derived from history, not the filesystem: `touch` a
     held ticket's file and re-render, and confirm its reported age does NOT
     reset.

  5. Confirm the empty case: move every ticket out of `backlog/hold/` and
     confirm the board does not render an empty held section frame.

  6. Confirm no silent cap: put more held tickets in than the section renders
     and confirm the board states how many it left out, in the same style the
     board already uses for active tickets ("+N more").

  7. Confirm nothing else moved: diff the rendered board for a fixture with
     an EMPTY `hold/` against the parent commit's output and confirm it is
     unchanged.

approval_context: >
  Coordinator relayed your intake: the pipeline board must surface
  `backlog/hold/` tickets.


  IT IS A HALF-WIRED MECHANISM, NOT A MISSING ONE. `backlogReader.ts` has
  read `hold/` since BL-672 and `findBacklogItem` already searches it. The
  board simply cannot represent the state: its `location` union is
  `'active' | 'paused' | 'done' | 'root'`, with no `'hold'`. So this is a
  small, contained change rather than a new data path.


  WHAT IS INVISIBLE AS I WRITE. Three tickets. BL-844 and BL-845 have been in
  `hold/` since 10 August - twelve days, last touched only by an unrelated
  priority rewrite. And BL-1043, the severity-high supervisor startup-grace
  defect I minted this morning, was parked there a few hours ago and
  disappeared from the board in the same move. The park was correct - your
  commit message says paused/ was insufficient because it kept re-promoting
  itself past the same-function conflict - which is exactly the point: the
  right call made a live defect invisible.


  ONE CALL OF MINE, AND ONE THING I DELIBERATELY LEFT OUT.


  (1) **`severity: medium`.** Nothing ships wrong; work just sits unseen. The
  harm is duration rather than corruption. I have kept severities honest all
  week rather than using them to buy queue position, and this is consistent
  with that - but twelve days of invisibility is a real cost and I would not
  argue if you wanted it higher.


  (2) **Parking records nothing, and I did not fix that here.** The park
  commit added no field - no `held_at`, no `hold_reason` - so the reason lives
  only in a commit message and the date only in git history. Age can still be
  derived from git, so surfacing works without it. But a `hold_reason` would
  make the section considerably more useful, and it is a schema plus
  parking-path change that would roughly double this ticket. Say the word and
  I will mint it as its own slice.

