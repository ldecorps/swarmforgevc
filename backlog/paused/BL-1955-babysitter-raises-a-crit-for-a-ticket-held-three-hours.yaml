description: |
  ## Status: hotfix 74c3769083 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  Check 5 and the claim-reclaim ladder read a live spinner as work, and a
  rotating status phrase changes the pane hash every sweep, so check 7
  (busy but frozen) never sees three identical hashes. A seat could hold
  one ticket for hours with HEAD never moving and no check fired; the
  operator wakes only on a CRIT. The iq3 coder held BL-1858 that way for
  about 9 hours on the 2026-10-03 shift.

  ## What the hotfix changed

  - babysitterd_sweep_lib.bb check-seat-ticket-stuck (check 5b): a held
    parcel whose seat HEAD is still the claim commit 180 minutes after
    claimAtMs (else dequeued_at) is one CRIT seat-stuck-<role> per role;
    none during a control pause or for a GPU-quiet seat.
  - babysitter_check.bb held-seat-tickets gathers each in_process parcel's
    ticket, claim clock and HEAD baseline.
  - held-ticket-id (the specifier's addition) also reads a coordinator
    Work note's ticket from its message, which carries no task header.
  - The BL-611 runbook, the BL-653 wake model and docs/index.md say so.

  ## What the coder checks

  The change against the description and the invariant, and the test
  cases in babysitterd_sweep_lib_test_runner.bb. Evidence:
  backlog/evidence/BL-1955-coder-<date>.md.
