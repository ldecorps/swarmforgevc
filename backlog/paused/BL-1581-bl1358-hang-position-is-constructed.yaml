approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: the reach floor the file
  asserts today (the hang was followed by another mutant at least once,
  `hangFollowed > 0`) stays asserted at its value; the fix is to make the
  three hang positions - first, middle, last - reached BY CONSTRUCTION,
  one cell each, the way BL-1578 and BL-1580 iterate their arms - never
  to lower a floor, widen a tolerance, pin a seed or retry. FIRM: the draw
