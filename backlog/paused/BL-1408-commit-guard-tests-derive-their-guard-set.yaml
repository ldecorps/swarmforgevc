human_approval: pending
approval_context: >
  Re-pended 2026-09-06 (deliberately - see notes): scenario 04 was added
  for a fourth hand-written copy of the chain list found the same day; the
  three scenarios you approved on 2026-09-05 (74012e2058) are unchanged.
  No choice is posed and there are no ruling_options. Originally: a new
  feature file is authored here, so it needs a tap. Surfaced by the coder on BL-1275
  (2026-09-05): the runner test exits 127 at case 01. Reproduced by the
  specifier the same pass; the two in-sync copies were found by grepping
  every file that names a chain guard.

description: |
  ## What is wrong

  `swarmforge/scripts/test/test_run_commit_guards.sh` writes a passing stub
  for each name in a hand-written `ALL_GUARDS=` list of five, then drives the
  REAL `run_commit_guards.sh` against that stub directory. The runner now
  names seven guards: `check_handler_module_graph.sh` (BL-1385) and
  `check_bb_scripts_load.sh` (BL-1395) joined on 2026-09-04. `run_guard`
  execs `$GUARD_DIR/<name>`, so the two unstubbed guards exit 127, the chain
  refuses ("these guards did not refuse cleanly - they failed unexpectedly"),
  case 01 fails, and because the test's own `fail` exits under `set -e`,
  cases 02-11 never run. Reproduced 2026-09-05:

      FAIL: 01: a clean commit was refused (status 127):
        commit_guard_chain_lib.sh: line 33: .../guards/check_handler_module_graph.sh: No such file or directory
        commit_guard_chain_lib.sh: line 33: .../guards/check_bb_scripts_load.sh: No such file or directory

  It is a `standing` row in `suite-manifest.tsv`. The same file carries two
  more hand-lists: case 04 enumerates four cheap guards for "every cheap
  guard refuses" (the cheap tier is six), and case 10's regex of five names
  is the check that the hook calls no guard directly - which now fails OPEN
  for a direct call to either newer guard.

  Two more copies are in sync today and will go red the same way:

  - `swarmforge/scripts/test/test_pre_merge_commit_hook.sh`: `MERGE_GUARDS=`
    names the two guards the pre-merge-commit hook runs today.
  - `extension/test/bl1252CommitGuardAggregationInvariants.property.test.js`:
    `INDEX_GUARDS` (six) plus `SUITE_GUARD`, edited by hand for BL-1385 and
    again for BL-1395 the same day - its own comment says the list is
    hand-enumerated and names exactly this failure.

  This is the BL-973 / BL-1279 shape (a closure mirrored by hand goes red
  when the closure grows) and the THIRD ticket for this one list: BL-1398
  fixed the BL-632 property fixture, BL-1401 the BL-632 acceptance handler.
  This ticket sweeps every remaining copy so there is no fourth. Enumerated
  2026-09-05 by grepping every file that names
  `check_feature_handler_registration.sh`; the other hits (the bl1303,
  bl1332 and bl1375 handlers, `land_step_lib.bb`'s replay tree-guard list)
  reference one guard for their own reasons and are not copies of the
  chain list. `test_pipeline_code_on_main_guard.sh` was listed among them
  at mint and that reading was wrong - see "Since mint", the fourth copy.

  ## How (direction, not mandate)

  - Shell tests derive through node the way
    `test_bl1398_guard_fixture_derives_set.sh`'s `derive()` already does: a
    `node -e` that requires `extension/test/helpers/commitGuardFixtureSet.js`
    and prints JSON. For the runner test, `guards` of
    `deriveCommitGuardFixtureSet({ repoRoot })` is the stub list. For the
    pre-merge test, the hook's own entries: `parseRunGuardEntries` over
    `swarmforge/git-hooks/pre-merge-commit` is exported by the same helper;
    a per-source call of the one parser is not a second parser.
  - Case 04 becomes "every derived guard except the suite guard refuses".
    Case 10's direct-call regex matches ANY `check_*.sh` invoked directly
    (`check_[a-z_]+\.sh`), which needs no list at all.
  - Property test: `SUITE_GUARD` stays one named constant (the expensive
    tier has a single member; that is a production fact, not a list);
    `INDEX_GUARDS` is the derived set minus it, and the test asserts the
    derived set contains it (invariant 3).
  - Each shell test needs ONE seam so scenarios 02/03 can hand it a scratch
    chain copy: the runner path for the runner test, the hook path for the
    pre-merge test, with the derivation's `repoRoot` taken from that path
    (the seam tree carries `swarmforge/scripts/` and `swarmforge/git-hooks/`
    the way BL-1398's `make_seam`/`plant_guard` build one). The live files
    stay the default and are never written.
  - The observable for "stubbed and run": the test prints the guard set it
    derived, and case 01 asserts EVERY derived guard ran (today it checks the
    property guard alone) and says so on PASS. The acceptance handler reads
    those lines.
  - Do NOT write a second `run_guard` parser (invariant 2). If the helper
    lacks something a test needs, extend the helper.

  ## Explicitly NOT in scope

  - `land_step_lib.bb`'s replay tree-guard list: a different closure.
  - The runner test's own first-failure-stop shape (`fail` exits under
    `set -e`, which is what hid cases 02-11). Noted, not fixed here.
  - BL-570's stale wiring assertion, red for the same family of reasons:
    BL-1409, minted the same pass.

  ## Since mint (2026-09-06)

  The "in sync today" copies are not. BL-1440 (landed 2026-09-06) added
  `check_constitution_doc_citations.sh` to the runner's Tier 1:
  - `INDEX_GUARDS` in the BL-1252 property file lacked it; QA bounced the
    parcel (`5d6a055835`, class `unit`, `backlog/evidence/BL-1440-bounce-20260906.md`)
    and the coder hand-added the entry - the fifth hand edit of that list.
  - `ALL_GUARDS` in `test_run_commit_guards.sh` still lacks it: case 01
    exits 127 on main today, the standing red this ticket's register row
    names. Any guard the runner names between now and this landing is in
    scope by derivation, not by a further hand edit.
  - **The fourth copy (coder note, 2026-09-06T11:56Z, `unowned red`;
    reproduced by the specifier the same pass).**
    `test_pipeline_code_on_main_guard.sh` builds its fixture by copying the
    chain guard by guard (lines 33-46 and 55: eleven `cp` lines naming each
    guard and lib) and then copies the REAL `run_commit_guards.sh` and both
    hooks beside them. That is the chain list written as `cp` lines. The
    runner names four guards the copy set lacks - `check_handler_module_graph.sh`
    (BL-1385, 09-04), `check_bb_scripts_load.sh` (BL-1395, 09-04),
    `check_standing_red_register.sh` (BL-1428, 09-05),
    `check_constitution_doc_citations.sh` (BL-1440, 09-06) - so every
    commit the fixture attempts under the QA role is refused with four
    exit-127 "failed unexpectedly" lines. Case 01 passes by coincidence (a
    refusal is what it expects); case 02 fails ("expected the QA role to be
    allowed to commit extension/src/ on main"), and the test's `fail`
    exits, so cases 03-07 and the BL-925 cases never run. Red since
    2026-09-04, the day the first missing guard joined the runner
    (`9121b628c9`). It is a `standing` manifest row; register row added
    2026-09-06 naming this ticket. Fix by the same derivation: the copy
    set is `deriveCommitGuardFixtureSet({ repoRoot }).files` (the pre-commit
    chain) plus the pre-merge-commit hook's `parseRunGuardEntries` set,
    copied in a loop - the `mkFixtureRepo` shape BL-1401 gave the BL-632
    acceptance handler - so the eleven `cp` lines go and no guard is named
    by hand (invariants 1 and 2 apply to it as to the other three).
    Scenario 04 gates it.
  The landing commit removes BOTH of this ticket's rows from
  `backlog/standing-reds.tsv` (standing-red rule 2, 2026-09-05).

qa_e2e_procedure: |
  1. On the parcel: `bash swarmforge/scripts/test/test_run_commit_guards.sh`
     passes every case (was FAIL 01, status 127, on main 2026-09-05);
     `bash swarmforge/scripts/test/test_pre_merge_commit_hook.sh` passes;
     `bash swarmforge/scripts/test/test_pipeline_code_on_main_guard.sh`
     passes every case including the BL-925 cases (was FAIL 02, four
     exit-127 lines, on main 2026-09-06); the BL-1252 property file passes
     under the property-suite command.
  2. Seam: copy `run_commit_guards.sh` and the chain lib into a scratch tree,
     append `run_guard check_bl1408_extra.sh` with that script present beside
     it, run the runner test against the seam: it passes, its derived-set
     line names the extra guard, and case 01 reports every derived guard ran.
  3. Same with a copy of `swarmforge/git-hooks/pre-merge-commit` and a third
     `run_guard` line, against the pre-merge test.
  4. `grep -cE '^\s*(ALL_GUARDS|MERGE_GUARDS|INDEX_GUARDS)\s*=' ` on each of
     the three files returns 0; `grep -c commitGuardFixtureSet` on each of
     the FOUR files returns at least 1 (invariant 2); `grep -c 'cp .*check_'`
     on test_pipeline_code_on_main_guard.sh returns 0. Case 10's regex
     names no guard.
  5. Fixture roots are removed on the EXIT trap; nothing sweeps by prefix
     (BL-1385/BL-1390).

