  (Concurrent Work Orthogonality), not to run them side by side.

  IR-DRY at mint: 3 medium possible-synonyms, all deliberate. "a runner seam
  ..." vs "a pre-merge-commit hook seam ..." (02/03) and "the runner test
  runs against the seam" vs "the pre-merge hook test runs against the seam"
  are two different chains under two different tests - the reason the
  ticket is a sweep and not a one-file fix. "the runner test runs" vs "...
  against the seam" (01/02) is the real chain versus a scratch copy, the
  green-today case versus the follows-the-runner case. Kept.

