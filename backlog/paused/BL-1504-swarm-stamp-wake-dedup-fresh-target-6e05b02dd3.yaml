  On the parcel commit:
  1. `git diff main...HEAD --name-only` names only evidence, the feature,
     the step handler + index.js registration; no swarmforge/scripts/*.bb
     (invariant 1).
  2. `run_acceptance.sh` on the BL-1504 feature -> 4 scenarios green.
  3. `bash swarmforge/scripts/test/test_handoffd_startup_notify_fresh_target.sh`
     and `bb swarmforge/scripts/test/wake_dedup_lib_test_runner.bb` green.
  4. `backlog/hotfix-ledger.yaml` row 6e05b02dd3: `human_decision: null`.
  5. After done: the human runs `bb swarmforge/scripts/hotfix_ledger_update.bb .
     --decide 6e05b02dd3 approved|waived` and commits the ledger.
