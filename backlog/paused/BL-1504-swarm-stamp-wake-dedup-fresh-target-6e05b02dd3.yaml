description: |
  ## What

  An operator hotfix is live on main and has never been through a gate.
  This ticket is that gate: a REVIEW ticket, not a rewrite ticket -
  confirm or refute, and open narrow follow-ups for anything found.

  ## The failures it fixed (from the commit message and the daemon log)

  1. `wake_dedup_lib/decide-wake-dedup` suppressed on `unchanged-mailbox`
     / `cooldown` from a per-role sidecar holding only a mailbox
     fingerprint and a timestamp. The documenter seat was rotated at
     07:54Z on 2026-09-09 with its parcel still in in_process;
     startup-notify read the pre-rotation sidecar and skipped, and the
     fresh aider session never received
     `! ./swarmforge/scripts/ready_for_next.sh` (2h28m flow-stall
     escalation). Claude seats mask this by running the script at boot.
  2. In `chase-poke-and-notify!`'s `:wake` branch the per-sweep resident
     budget (`resident-wake-suppressed?`) was set BEFORE
     `handoff-wake-with-dedup!` decided, so the coder's suppressed wake
     (`wake-dedup-skip coder unchanged-mailbox` x171) starved every other
     role sharing the resident pane (`chase-wake-skip-dedup documenter`
     x477 in 2h).

  ## What landed (files to review)

  - `swarmforge/scripts/wake_dedup_lib.bb`: sidecar gains
    `lastTargetEpoch`; `decide-wake-dedup` takes `:target-epoch` /
    `:last-target-epoch` and answers `{:action :inject :inject-reason
    "fresh-target"}` when the epoch is non-blank and differs from the
    sidecar's; an empty mailbox still suppresses; a blank epoch keeps the
    pre-hotfix decision; `record-injection!` stores the epoch.
  - `swarmforge/scripts/handoffd.bb`: `wake-target-epoch` probes
    `tmux list-panes -t <wake-session> -F '#{pane_pid}'` -> `pane-pid:<n>`
    (nil when tmux cannot answer); `handoff-wake-with-dedup!` passes it
    and logs `wake-fresh-target`; the `:wake` branch consumes the budget
    only when `performed`.
  - Tests: `wake_dedup_lib_test_runner.bb` (+9 cases),
    `test_handoffd_startup_notify_fresh_target.sh` (new, registered
    standing in suite-manifest.tsv), both green on main 60623ebf02
    (specifier, 2026-09-10).

  ## Review goals

  1. Confirm a rotated/respawned seat with an unchanged mailbox is woken
     exactly once and then deduplicated on the new epoch (scenario 01).
  2. Confirm a legacy sidecar (no `lastTargetEpoch`) decides exactly as
     before the hotfix (scenario 02) - the compatibility claim.
  3. Confirm the budget rule: a suppressed wake for one resident-pane role
     leaves the budget for the next role in the same sweep (scenario 03).
  4. Note, do not fix: `wake_dedup_lib_test_runner.bb` leaks a temp root
     (owned by BL-1501); `test_handoffd_wake_attribution_wiring.sh` case
     05 is red since BL-1191 (owned by BL-1505) - both are pre-existing,
     registered, and out of this stamp's scope.

  ## Scenario notes for the coder

  - Scenario 01 drives `wake_dedup_lib.bb` directly through
    `load-decision` / `decide-wake-dedup` with a seeded sidecar and a
    fake mailbox, the runner's own shape; the "blank" row is the fixture-
    fake case (tmux cannot answer) and must equal the pre-hotfix answer.
  - Scenario 03 is `test_handoffd_startup_notify_fresh_target.sh`'s fake-
    tmux shape extended to two roles; the fake answers `list-panes` with
    one pid per session. Assert on the daemon log lines
    (`wake-dedup-skip` for the first, a landed wake for the second in the
    same sweep) or on the attribution jsonl.
  - Scenario 04's handler reads `backlog/hotfix-ledger.yaml` for the row
    `commit: 6e05b02dd3` and asserts `state` is not certified/waived and
    `human_decision` is null; BL-1346's handler is the precedent.

