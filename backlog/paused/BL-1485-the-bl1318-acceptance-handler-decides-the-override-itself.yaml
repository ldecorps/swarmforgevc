  BL-1462 (the per-feature runner's blind spot).

notes: |
  Minted 2026-09-08 by the specifier on the coder's unowned-red note, the
  same pass (standing-red rule: type defect, severity high at first
  sighting). Register row, lane `acceptance`, file BL-1318's feature,
  first_seen 2026-09-08 (first recorded; red since ~2026-09-04, the
  swarm.env export), added in the mint commit so the register never reads
  it unowned.

  Grepped first: no open ticket names the handler. BL-1445's scenario 02
  is scoped to `swarmforge/scripts/test/*.sh` and BL-1457's invariant 1 to
  `extension/test`; both exclude this file by construction. Not amended
  into either: BL-1445 is in flight (rewriting an active ticket is the
  BL-317/BL-325 hazard, and its own e2e step 2 is what found this), and
  BL-1457 is approved - re-pending an approved ticket posts no fresh ask
  (BL-1455), so an amendment there could never be re-approved by tap.

  On BL-1445 at QA: its e2e step 2 says "BL-1318's feature stays green",
  which is false in a pane for this reason alone. With this row in the
  register the red is OWNED, so Article 4.2 does not hold BL-1445; QA
  reads the row. A note to the coder says so.

  Mint-time INVEST: one observable outcome (BL-1318's feature is green
  whatever the pane exports), one sitting (one env decision at one spawn
  site plus a two-scenario handler following BL-1445's shape), no unbuilt
  dependency. IR-DRY at mint: 0 findings.
