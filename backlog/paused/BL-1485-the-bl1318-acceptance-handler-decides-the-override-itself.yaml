id: BL-1485
title: "BL-1318's own acceptance feature is red in every role pane: its handler spawns the launcher with the pane environment spread in, so the operator escape hatch PACK_STAFFING_SKIP_GATE=1 that swarm.env exports into every pane (since ~2026-09-04) turns every refusal row into an OVERRIDE warning and 4 of 7 rows fail, while the same feature is green under env -u (found 2026-09-08 by the coder on BL-1445's own e2e); the handler sets or removes the variable itself in the environment it spawns - the acceptance-lane sibling of BL-1445 (shell) and BL-1457 (vitest)"
milestone: M8
type: defect
severity: high
# high (standing-red rule 2026-09-05): the one acceptance proof that the
# launcher refuses an uncleared seat is red in every pane for an
# environmental reason; a real regression of that refusal would hide
# behind the same four "not ok" lines. Green in an offline shell, so it
# passed every offline expedite and was never seen. Never medium for a
# red.
