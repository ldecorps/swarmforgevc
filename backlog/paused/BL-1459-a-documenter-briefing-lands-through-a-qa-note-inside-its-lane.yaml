id: BL-1459
title: "A documenter briefing lands on main through a QA note inside its lane, once per day: check_documenter_briefing_tip.sh in the shared pre-merge-commit chain accepts a documenter commit that changes only docs/briefings/<date>.md (and its .json sidecar), refuses any other path - .sent.json first - and refuses a briefing for a day main already carries; before this the documenter's briefings reached main by cherry-pick (09-05), by hand (09-06) or not at all (human ruling A, 2026-09-07)"
