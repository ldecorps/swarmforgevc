notes: |
  Minted 2026-09-07 by the specifier on QA's unowned-red note, the same
  pass (standing-red rule: high at first sighting); register row `unit`
  for `extension/test/bridgeServer.test.js` names this ticket, first_seen
  2026-09-07. Grepped first: no open ticket names bridgeServer, the
  keepalive, or lastSnapshot; BL-1350 and BL-1351 (done) are the two
  tickets whose contracts meet here.

  Cause read from source, not inferred from the flake: `/events` connect
  writes `resolveEventsSnapshot(lastSnapshot, ...)` without assigning;
  `broadcastSnapshotIfChanged(undefined)` always broadcasts. BL-1351 added
  the shared producer and the compare; the seed was never added.

  required_wiring names the step handler only: the fix is one assignment
  inside a pre-existing route, so any anchor on the route would match
  unchanged code (BL-1235); scenario 01 drives the real server.
