qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `bash swarmforge/scripts/test/test_operator_runtime_tick.sh` three
     times -> `ALL CHECKS PASSED`, exit 0.
  2. `grep -n 'recover_miniapp_bridge.sh' swarmforge/scripts/test/test_operator_runtime_tick.sh`
     shows the copy of the real script into the fixture, no heredoc stub;
     `grep -n 'bounce-failed' swarmforge/scripts/test/test_operator_runtime_tick.sh`
     shows the tightened check.
  3. `git diff main...HEAD --name-only` names the test file, the handler,
     `specs/pipeline/steps/index.js`, the feature, evidence and the
     register-row removal; operator_runtime.bb and the three bridge shell
     scripts are unchanged.
  4. Break-then-restore: comment out the router copy; the "down bridge
     triggers a bounce attempt" check fails AND the tightened
     completed-cycle check fails (it must not stay green on exit=127);
     restore.
  5. Diff the parcel's merge into main against BOTH parents. The row for
     this file is gone from `backlog/standing-reds.tsv`.
