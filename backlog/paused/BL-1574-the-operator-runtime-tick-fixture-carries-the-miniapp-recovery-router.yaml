description: |
  ## What is wrong

  `swarmforge/scripts/test/test_operator_runtime_tick.sh` (lane shell,
  `standing`) fails on `main` 6d6e90ba7b, one check of 160:

  ```
  FAIL - miniapp-watchdog: down bridge triggers a bounce attempt
  operator_runtime smoke: FAILURES
  ```

  The section "mini app watchdog: a down /lets-talk endpoint triggers a
  bounded auto-bounce" (lines 75-92) writes a stub
  `bounce_bridge_headless.sh` into the fixture that appends to
  `miniapp-bounced.marker`, ticks `operator_runtime.bb` with
  `OPERATOR_MINIAPP_WATCHDOG_ENABLED=1`, threshold 1, cooldown 0 and
  `BRIDGE_HEADLESS_PORT=1`, and asserts the marker exists. Since BL-1571's
  442bdd1f40 (2026-09-14 19:57) `miniapp-bounce-bridge!` runs
  `recover_miniapp_bridge.sh`, and the fixture's `make_fixture` copies only
  the bb load closure (`copy_operator_runtime_sandbox`) plus the two
  operator_telegram files - no shell scripts. The fixture's runtime.log
  (specifier reproduction, this pass):

  ```
  miniapp-watchdog bounce-failed failures=1 exit=127 bash: <fixture>/swarmforge/scripts/recover_miniapp_bridge.sh: No such file or directory
  ```

  The stub is never reached, so the marker never appears. The section's
  second check ("watchdog state records a completed bounce cycle") still
  passes, because the sweep writes `consecutive-failures 0` and
  `last-bounce-at-ms` on the `bounce-failed` branch too - that check is
  green on a bounce that never ran, the BL-1445 fail-open shape.

  Red since 442bdd1f40 landed; first seen 2026-09-15 by the coder (note
  01:45Z) and QA (Article 4.2 hold on the BL-1569 parcel, ca69008ee5,
  evidence `backlog/evidence/BL-1569-QA-unowned-red-20260915.md` on the QA
  branch). QA's evidence attributes the file's last change to BL-653's
  309e11bdef; the trigger was the runtime reroute, not a change to the
  test. BL-1571's own mint (specifier, 2026-09-14) is at fault for the
  miss: it swept the four bridge scripts and the bl1159 test but not the
  sibling smoke test that stubs the leaf the reroute bypasses - the
  BL-1006 obligation to grep siblings for assertions the successor
  falsifies, unmet.

  ## What is wanted

  The test's fixture carries `recover_miniapp_bridge.sh` - the REAL script
  copied from `swarmforge/scripts/`, never a stub, so the fixture proves
  the runtime reaches the stubbed leaf through the router (with no
  `front-desk-supervisor.pid` the router execs `bounce_bridge_headless.sh`,
  which is the test's existing stub). The second watchdog check also
  asserts the fixture's runtime.log carries a `miniapp-watchdog bounced`
  line and no `bounce-failed` line, so a failed bounce can never read as a
  completed cycle again. The test prints `ALL CHECKS PASSED` on `main`;
  the register row this ticket adds is removed in the same land.

  ## How (direction, not mandate)

  - In `make_fixture` (or the watchdog section itself), after
    `copy_operator_runtime_sandbox`, `cp "$SRC/recover_miniapp_bridge.sh"
    "$d/swarmforge/scripts/"`. Do not extend
    `lib/operator_runtime_sandbox.sh`'s closure copy to shell scripts:
    fifteen other fixtures tick with the watchdog disabled and stub what
    they shell to by design; the bl1159 test already copies the router
    itself.
  - Tighten the existing second check (or add a third) to grep
    `$F/.swarmforge/operator/runtime.log` for `miniapp-watchdog bounced`
    and refuse `bounce-failed`. Keep it a `check` line, same style.
  - Step handler `specs/pipeline/steps/bl1574TickFixtureMiniappRouterSteps.js`
    (register in `index.js`, same commit as the feature, BL-233): scenarios
    01/02 read the test file; scenario 03 runs the real shell test as a
    subprocess (measured 61 s wall on this host, 49 s CPU; give it a
    180 s timeout - the whole feature is ~65 s per mutant, inside the
    BL-1358 300 s ceiling with margin, BL-1541); scenario 04 diffs the
    four production files against `main` (BL-1571's handler has the
    pattern).

  ## Not in scope

  - `operator_runtime.bb`, `recover_miniapp_bridge.sh`,
    `bounce_bridge_headless.sh`, `rearm_front_desk_bridge.sh`,
    `lib/operator_runtime_sandbox.sh`, BL-1159's and BL-1571's feature
    files and handlers are not touched.
  - The other 159 checks in the smoke test are not reworked.

