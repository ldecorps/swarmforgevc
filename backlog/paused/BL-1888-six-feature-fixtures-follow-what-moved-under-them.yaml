description: |
  ## Status: hotfix 364dabfd66 landed the fix

  This parcel is its stamp-off: the pipeline's review of what landed.
  Review it, do not re-apply it.

  ## What the hotfix changed

  1. BL-739, BL-741, BL-753, BL-758 (`bl739…`, `bl741…`, `bl753…`,
     `bl758…Steps.js`): each `baseDeps` predated two gate dependencies,
     `checkOrphanedAuthoredDocs` and `checkOriginMainLanding`, so
     `landPilotedTicket` threw "is not a function". Both are now stubbed in
     bl1221's shapes (a run that touched no authored docs; a landing
     reachable from origin/main).
  2. BL-633 (`bl633…Steps.js`): scenario 05 read
     BL-590's ticket file from `backlog/hold/`, which it left on
     2026-07-27 (it is in done); the handler now finds it in
     whichever backlog folder holds it. Scenario 03 checked the architect
     prompt for "One bounce per property, never one per site." with a
     period; 13a466571e bolded it with an em-dash, so the check drops the
     period.
  3. BL-1638 (`bl1638…Steps.js`): the register step asserted its hardening
     rows present and owned, and its land retired them (BL-1631), so it
     went red at the land. It now holds in both states: present and owned
     while BL-1638 is open, absent (and nothing unowned) once it is done.

  ## What is wanted in this parcel

  - Review the three changes. The scenario text of BL-633 05 still says
    "in the backlog hold folder"; say in the evidence whether that should
    be retired and replaced by a successor scenario.
  - Evidence: the review and one run of each of the six features.

  ## Scope

  The six step handlers and evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule), `node
  specs/pipeline/cli.js` on the features of BL-633 (5/5), BL-739 (5/5),
  BL-741 (5/5), BL-753 (5/5), BL-758 (6/6) and BL-1638 (4/4), as measured
  at the hotfix; before it 3/5, 3/5, 3/5, 2/5, 3/6 and 2/4.

