  ## Acceptance is parked as a draft, deliberately

  `acceptance:` points at a `.feature.draft`. The Node acceptance runner
  cannot execute Kotlin, and a live `.feature` with no step handlers
  hard-fails `specs/pipeline/runtime.js` (BL-233). The coder either binds the
  scenarios to handlers that drive the gradle unit suite (as BL-769's do) and
  promotes the draft, or records the manual procedure as the verification —
  never ships an unrunnable live feature file.

  ## E2E QA procedure (specifier, 2026-08-07)

  Device procedure, on a phone, after sideloading the rebuilt APK:

  1. **The reported failure is gone.** Phone volume HIGH, in-app slider LOW
     (or at the old 55% default). Trigger a reply. The voice must be LOUD.
     This is the exact configuration the human reported as inaudible.
  2. **The slider still does its own job.** From the same state, raise the
     slider. Hold music must get louder and the reply voice must NOT change.
     Both halves are the test — a fix that deadened the slider is also wrong.
  3. **Phone volume owns the voice.** Lower the phone volume mid-reply; the
     voice must follow it down.
  4. **Both reply legs.** Run 1-3 for a TTS reply AND for a MediaPlayer audio
     reply. The `KEY_PARAM_VOLUME` leg is a separate code path and a
     one-legged fix passes a one-legged test.
  5. **The tick cue returns.** At a low slider setting confirm the hold-music
     tick is audible, the secondary symptom of the shared gain path.
