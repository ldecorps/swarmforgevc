description: |
  ## What

  A human-landed fix is live in the master checkout and has never been
  through a gate. This ticket is that gate. REVIEW, not rewrite.

  ## The failure it fixed

  On Bubble "Let's Talk" the human heard replies very weakly. One shared gain
  path was scaling both surfaces:

  - `TalkEngine` init and `setVolumePercent` applied the same
    `volumePercent / 100f` gain to BOTH `holdMusic` and `replyPlayer`.
  - `ReplyAudioPlayer` defaulted `volumeGain` to `0.55f` and passed it into
    MediaPlayer and TTS `KEY_PARAM_VOLUME`, so even full phone volume was
    attenuated by the app default.

  BL-765 had already CONTRACTED the opposite behaviour — "the setting governs
  music only and the reply voice follows the phone's media volume" — so this
  is a regression against a written contract, not a new preference. The same
  shared gain also explains the earlier report of an inaudible hold-music
  tick cue at low slider settings.

  ## The diff must be landed before it can be reviewed

  At mint time this fix is UNCOMMITTED in the master checkout. That is the
  BL-811 situation exactly: leaving it uncommitted blocks build-sync and puts
  a live human fix one hot-sync away from a phantom revert (BL-373), and
  BL-839 exists because the master checkout is what actually executes.

  So the first action on this ticket is to LAND it, not to review it:

  - commit ONLY the Bubble paths listed below — `git add` them by name.
    Other unrelated ticket-less changes are in the same working tree and
    must not ride along (BL-506);
  - carry the trailer `Hotfix-Certification: pending` (BL-848's primary
    signal — this ticket is its first real dogfood);
  - name BL-850 in the message.

  Then review the committed diff, and record the resulting 10-hex commit in
  `backlog/hotfix-ledger.yaml`.

  ## What landed (files to review)

  - `android/app/src/main/java/com/swarmforge/floatcompanion/TalkEngine.kt`
    — reply player pinned at gain `1f`; slider updates hold music only.
  - `android/app/src/main/java/com/swarmforge/floatcompanion/ReplyAudioPlayer.kt`
    — default `volumeGain` `0.55f` -> `1f`.
  - `android/app/src/main/res/values/strings.xml` — "Volume" -> "Hold music
    volume".
  - `android/app/build.gradle.kts` — versionCode 24 -> 28, versionName
    `0.3.8-home-handsfree` -> `0.3.12-reply-phone-volume`.
  - `android/scripts/publish-apk.sh` — publishes the versioned APK alongside
    the fixed name.
  - `docs/how-to/BL-707-android-floating-overlay-companion.md`,
    `docs/how-to/BL-705-lets-talk-more-chiptunes.md` — wording now describes
    the split.

  ## Review goals

  1. Confirm the split matches BL-765's stated contract on both paths —
     MediaPlayer reply audio AND the TTS `KEY_PARAM_VOLUME` leg. A fix that
     only corrects one leaves the regression alive for the other.
  2. Confirm nothing else still applies the slider gain to the reply player;
     `setVolume` remains on `ReplyAudioPlayer` and a future caller could
     re-introduce the coupling. Invariant 1 is the property to check, not
     just the two call sites the diff touched.
  3. Confirm mute / pause-all semantics are unchanged.
  4. Confirm no remaining surface still claims a shared music+voice control
     (the documenter's sweep — the two how-tos are patched; check the rest).
  5. Confirm the version bump and publish script are intended and not
     collateral.

  ## Testability

  Per the local article's "Testability Boundary — Bubble": the gain
  arithmetic and the slider->hold-music-only routing are pure logic and
  belong in the JVM unit suite (`android/gradlew :app:testDebugUnitTest`).
  Actual loudness on a device is device-surface behaviour and is verified by
  the recorded manual procedure below, never by a test. Kotlin has no
  mutation/CRAP/DRY tooling wired — the hardener applies the documented
  unit-test-gap fallback and must record that it did.

