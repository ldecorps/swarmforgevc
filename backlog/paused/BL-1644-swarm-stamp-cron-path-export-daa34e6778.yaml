source: |
  backlog/hotfix-ledger.yaml row `daa34e6778` (detected 2026-09-18, state
  pending, no stamp ticket), appended by the operator's `--new` on
  2026-09-18 and found still uncommitted on the shared checkout at this
  mint; surfaced by the certification sweep as the note "hotfix daa34e6778
  has no stamp ticket - mint a review ticket" (reached the specifier
  2026-09-19 01:02Z as inbound 00_20260919T010255Z_001692). Hotfix landed
  by the operator (human-directed, Claude Code) 2026-09-18 19:26 BST with
  `Hotfix-Certification: pending`. From the commit message, verbatim:
  "cron runs jobs with a bare minimal PATH (no ~/.local/bin), so
  day-shift-start.sh's rotate_to_role.sh failed "exec: bb: not found"
  (rc=127) at this morning's launch" and "Applies the same PATH export
  start-swarm.sh already uses at its own top to every cron-invoked
  entrypoint in the bedtime chain: finish-shift and
  wait_for_expedite_then_bedtime.sh here (tracked); day-shift-start.sh,
  day-shift-bedtime.sh and night-start.sh got the identical fix locally
  (untracked, .swarmforge/ is gitignored)."

description: |
  ## What

  An operator hotfix is live on main and has never been through a gate.
  This ticket is that gate: a REVIEW ticket, not a rewrite ticket -
  confirm or refute, and open narrow follow-ups for anything found.

  ## The failure it fixed (from the commit message and day-shift.log)

  Cron runs its jobs with a bare PATH that lacks `~/.local/bin` and
  `~/.npm-global/bin`, where `bb`, `claude` and `tmux` live on this host.
  `.swarmforge/operator/day-shift.log` 2026-09-18T08:00:30Z:
  `day-shift-start rotated resident to recorded role cleaner rc=127`
  (`rotate_to_role.sh` -> `exec: bb: not found`). `start-swarm.sh` has
  carried the export at its own top (line 88) for exactly this reason;
  the bedtime chain's tracked entrypoints did not.

  ## What landed (files to review)

  - `finish-shift` line ~30: `export PATH="$HOME/.npm-global/bin:$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"`
    after `set -euo pipefail`, before `REPO_ROOT` and every shell-out.
  - `swarmforge/scripts/wait_for_expedite_then_bedtime.sh` line ~44: the
    same export after `set -u`, before `ROOT=` and its own
    `expedite_cli.bb` calls and the `finish-shift` call.
  - The three `.swarmforge/operator/*.sh` copies (untracked) are outside
    this review.

  ## Review goals

  1. Confirm the prelude works under cron's environment (scenario 01):
     for each of the two scripts, under `env -i HOME=<fixture>
     PATH=/usr/bin:/bin`, sourcing the script's prelude (its lines up to
     and including the export) makes `bb`, `tmux` and `claude` resolve to
     stubs placed at `<fixture>/.local/bin/`; and the export line precedes
     the first invocation of `bb`, `tmux`, `claude`, `node` or `npx` in
     the file (a static order check - an export below the first shell-out
     fixes nothing).
  2. Confirm the census of cron-invoked tracked entrypoints (scenario 02,
     BL-1445): the installed crontab names four tracked paths -
     `swarmforge/scripts/wait_for_expedite_then_bedtime.sh` (weekend
     bedtime), `swarmforge/scripts/daemon_log_freshness_check.sh` (its
     cron line sets PATH inline AND the script exports one),
     `swarmforge/scripts/descent_review_cli.bb` (invoked as a bare `bb`
     command) and, through `day-shift-bedtime.sh`, `finish-shift`. Pin
     that census in the scenario: every tracked bash entrypoint cron
     reaches carries the export before its first shell-out.
  3. PROBE, do not fix: `17 4 * * * bb .../descent_review_cli.bb review
     <root>` runs `bb` by bare name under the same bare cron PATH, so it
     may have failed every night since it was installed. Look for its
     output (`.swarmforge/` descent-review artifacts, their mtimes, cron
     mail) and RECORD the finding in evidence with the crontab line;
     confirmed broken -> note the specifier (the crontab is the human's
     file; the fix is a `PATH=` prefix on that line or an absolute `bb`
     path, never this parcel's).
  4. Record, do not review: the commit message also attributes the
     2026-09-18 bedtime's unstoppable babysitterd to this PATH gap.
     BL-1639 (minted 2026-09-19) found otherwise - a second babysitterd
     launched from an operator-local copy with its own pidfile, which the
     stop never signals. The PATH export stands on the rc=127 evidence
     alone; say so in evidence and do not extend the review into BL-1639.
  5. Regression, note only: `bash swarmforge/scripts/test/test_finish_shift_lib.sh`
     green on the parcel (the lib is untouched; the export sits in the
     wrapper above it).

  ## Scenario notes for the coder

  - Scenario 01's fixture is a mkdtemp HOME with executable stubs
    `.local/bin/bb`, `.local/bin/tmux`, `.local/bin/claude`; the handler
    runs `env -i HOME=<fx> PATH=/usr/bin:/bin bash -c 'source <(sed -n
    "1,/^export PATH=/p" <script>); command -v bb tmux claude'` per script
    and asserts each resolves under `<fx>/.local/bin/`. The order check
    is a line-number comparison on the real file.
  - Scenario 02 reads the crontab from a fixture copy of the installed
    lines (the handler must never read or edit the live crontab), derives
    the tracked bash entrypoints, and pins the count and the two names.
  - Scenario 03's handler reads `backlog/hotfix-ledger.yaml` for the row
    `commit: daa34e6778` and asserts `state` is not certified/waived and
    `human_decision` is null; BL-1557 / BL-1591 are the precedents.
  - The step handler is `bl1644SwarmStampCronPathExportSteps.js`, landing
    in the SAME commit as the feature (BL-233).

