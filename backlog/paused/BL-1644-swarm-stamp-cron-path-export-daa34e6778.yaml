qa_e2e_procedure: |
  On the parcel commit:
  1. `git diff main...HEAD --name-only` names only evidence, the feature,
     the step handler (+ lib/), and files under swarmforge/scripts/test/;
     neither finish-shift nor wait_for_expedite_then_bedtime.sh
     (invariant 1).
  2. `run_acceptance.sh` on the BL-1644 feature -> 3 scenarios green
     (scenario 01 = 2 rows).
  3. `bash swarmforge/scripts/test/test_finish_shift_lib.sh` ALL CHECKS
     PASSED.
  4. The evidence file records review goal 3's finding explicitly (the
     descent-review cron line, what artifacts exist and their mtimes).
  5. `backlog/hotfix-ledger.yaml` row daa34e6778: `human_decision: null`.
  6. After done: the human runs `bb swarmforge/scripts/hotfix_ledger_update.bb .
     --decide daa34e6778 approved|waived` and commits the ledger.
