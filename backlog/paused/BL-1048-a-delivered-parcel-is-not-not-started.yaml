id: BL-1048
title: "A parcel waiting at a role's door reads as NOT-STARTED: the board's stage scan sees only opened mail, so BL-1037 (at QA) and BL-1032 (at the cleaner) both render NS"
milestone: M8
type: defect
severity: high
# high: the board is the operator's health signal for where work is, and it
# is wrong for half the active board right now - two of four active tickets
# render NS while their parcels sit delivered at a role's door. It is also
# precisely the >10-minute chase window (Article 2.4) that the board is
# supposed to make visible, and instead hides. Not critical: nothing is lost
# or corrupted, the parcels are intact and the swarm keeps moving.
status: todo
epic: pipeline-board
assigned_to: none
priority: 18
direction: human-requested
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1048-a-delivered-parcel-is-not-not-started.feature
human_approval: pending

approval_context: >
  Firm: a delivered-but-unopened parcel must stop rendering NS. That is the
  reported defect and the spec below fixes it.

  Needs your call: whether the grid should DISTINGUISH "delivered, not yet
  opened" from "opened and being worked" - a second cell glyph plus a legend
  line. This spec deliberately does NOT do that: it collapses both to the
  role's own column, so the cell keeps its single `X` and the grid gains no
  legend. That is honest (the parcel IS at that role) but it does mean a
  parcel stranded at a dead role's door now reads as confidently in-flight,
  where before it at least looked odd as NS. If you want the distinction
  drawn, say so and it becomes its own slice against the render, not this one.

invariants:
  - "A ticket whose parcel has been delivered to a role is never rendered not-started: the not-started column means no role has the parcel, not that no role has opened it yet."
  - "One ticket resolves to exactly one role, whatever mix of delivered and opened parcels it is observed in - widening the scanned source set never reintroduces BL-464's double row."

description: |
  ## What is wrong

  `swarmforge/scripts/pipeline_stage_cli.bb`'s `role-ticket-pairs-for` scans
  exactly one directory per role:

      (let [dir (str (handoff-lib/mailbox-dir role-info :in_process))]

  `inbox/new/` is never read. A `git_handoff` that has been routed, delivered
  and woken - but whose recipient has not yet run `ready_for_next.sh` - names
  its ticket in a file no scan looks at. The ticket therefore appears in no
  `{ticket -> role}` pair, `filter-active` drops it, and the board's BL-473
  not-started sentinel renders it as NS.

  NS currently means two different realities that the operator cannot tell
  apart: "no role has this ticket" and "a role has this ticket at its door".

  ## What it is doing right now

  The live stage report resolves only two of four active tickets:

      $ bb swarmforge/scripts/pipeline_stage_cli.bb "$PWD" report
      {"BL-1038":"cleaner","BL-1041":"QA"}

  The other two are not idle. Their parcels are sitting in `inbox/new/`:

    - BL-1037 - `git_handoff` to QA, commit `cfd70ed26d`, in
      `.worktrees/QA/.swarmforge/handoffs/inbox/new/` - renders NS
    - BL-1032 - `git_handoff` to cleaner, commit `89e04323af`, in
      `.worktrees/cleaner/.swarmforge/handoffs/inbox/new/` - renders NS

  BL-1041 renders QA correctly for the only reason that separates it: its
  parcel is in `in_process/`, not `new/`.

  This is the fifth "durable false not-started" in this file's lineage, and
  the first that is not an id-extraction failure. BL-464 (note-aware read),
  BL-471 (case), BL-488 (non-leading id), BL-503 (missing hyphen) each taught
  the scan to resolve an id it was already looking at. This one is a SOURCE
  failure: the id is well-formed and the scan simply never opens the file.

  ## Why it matters more than a cosmetic wrong cell

  `inbox/new/` is exactly the state Article 2.4 puts a clock on - "a parcel
  stuck in `inbox/new/` >10 minutes: the coordinator must chase it". The
  board is the surface that chase is supposed to be spotted from, and it is
  blind to the only state that needs chasing.

  ## How (direction, not mandate)

  Scan the delivered state alongside the opened one, through the same file
  and `batch_` enumeration the `in_process` scan already uses. No new
  reconciliation is needed: `reconcile-stage-map` already collapses the same
  ticket observed at two roles down to one - most-downstream wins - which is
  the transition window this widening makes more common, not a new case.
  `ticket-id-from-headers`, `filter-active` and the allowlist are untouched.

notes: |
  Reported by the operator from the Pipeline Board topic, 2026-08-22: "1037 is
  not NotStarted? there is a little bug in this grid?" - correct, and it was
  two rows wrong, not one.

  Candidate follow-up, deliberately NOT scoped here and not asserted against
  in the feature file: a distinct cell glyph for delivered-vs-opened. See
  `approval_context` - it needs a human ruling before it is worth minting.

  Sibling on the same epic: BL-1045 (held tickets fall off the board because
  the location union has no `hold`). Same shape of gap - a state the board
  cannot represent - reached from the other side.


  IR-DRY: two `near-duplicate` findings were reviewed and deliberately kept -
  "that ticket's row names that role" vs "...the later role", and the matching
  Given pair. That "a role" / "the later role" distinction is precisely what
  scenario 03 asserts (most-downstream wins); collapsing it would delete the
  assertion. No `duplicate` findings. Do not normalize these away.

qa_e2e_procedure: |
  On the live swarm, with at least one `git_handoff` sitting in a role's
  `inbox/new/` and not yet picked up:

  1. Identify it: `for w in . .worktrees/*; do grep -H "^task:" \
     "$w/.swarmforge/handoffs/inbox/new/"*.handoff 2>/dev/null; done`
  2. Run `bb swarmforge/scripts/pipeline_stage_cli.bb "$PWD" report` and
     confirm that ticket now resolves to the role whose `new/` holds it.
  3. Confirm the ticket's row on the posted Pipeline Board carries its X in
     that role's column and NOT in NS.
  4. Confirm a ticket with no parcel in any `new/` or `in_process/` still
     renders NS, and that no ticket occupies two columns.
