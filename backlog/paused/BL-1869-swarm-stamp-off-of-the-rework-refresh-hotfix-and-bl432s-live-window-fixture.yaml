description: |
  ## What landed (review this diff)

  51591aab4a, the human's 2026-09-29 edits, unchanged:
  - `extension/src/tools/rework-observatory.ts`: `refreshReworkSignal`
    runs `runObservatory` (which persists) and returns the fresh signal;
    `loadRoleWorktreesOrEmpty` reads roles.tsv softly (empty on failure).
  - `emit-throttle-recommendation.ts` (BL-432): `main` refreshes before
    `emitThrottleRecommendation`, which still reads the persisted signal.
  - `suboptimality-verdict-line.ts` (BL-431): `main` refreshes, then
    diagnoses the fresh signal.
  - The three CLI unit files: a stale snapshot is not echoed; the verdict
    line fires from a live window with a bounced close.
  The compiled `extension/out` on master already ran this code before it
  landed: the 2026-10-01 16:49Z promotion refreshed the signal.

  ## What is red, and why

  `effective_backlog_depth_cli.bb` shells the throttle CLI at every
  promotion. BL-432's handler (`bl432AutoTuneIntakeThrottleSteps.js`)
  stages each diagnosis by persisting a rework signal, then runs that
  CLI, which now recomputes over it from the fixture's git history. The
  fixture has no closed tickets, so the fresh signal has no sample and
  the cap is never lowered. Measured on the hotfix tree at mint: 01
  (`Then the effective active-depth cap is one`), 02, 03 (`setup:
  expected the degraded recommendation already in effect`) and 05
  (ENOENT on `.swarmforge/coordinator/throttle-changes.jsonl`) red, 04
  ok. On HEAD before the hotfix, built in a scratch tree: 5 of 5 ok.

  ## What is wanted

  1. BL-432's handler builds each diagnosis from the fixture repo's own
     history on `main`, the shape `suboptimalityVerdictLineCli.test.js`
     already uses: tickets moved `backlog/active/` -> `backlog/done/`
     with commit dates inside the trailing 14 days (the live window) and
     14-28 days back (the baseline), plus `backlog/evidence/` files for
     the ones that bounced. Degraded, severe and cleared are rates the
     handler arranges, not signals it writes. Scenarios 01-05 keep their
     Gherkin text and go green.
  2. Add scenario 06 to BL-432's feature, with its handler, in the same
     commit (BL-233):

     ```
     # BL-432 auto-tune-intake-throttle-06
     Scenario: A degraded diagnosis left on disk does not lower the cap once the live window shows no rework
       Given a persisted rework diagnosis from an earlier run that reads degraded
       And no ticket closed in the live window was bounced
       When the coordinator decides whether to promote the next item
       Then the effective active-depth cap is the configured value
     ```

     Its comment line names this ticket ("added by BL-1869, the
     refresh-before-diagnose hotfix"), so the addition is greppable.
  3. The hardener's mutation pass covers the three hotfixed tool modules.
  4. Probes. Report each in the evidence; a confirmed finding is a note
     to the specifier, never an in-parcel change:
     a. **Cost.** Loading the completed-ticket records took 32 s on this
        repo at mint (1670 records, `loadCompletedTicketRecords` alone).
        The throttle CLI now pays it at every promotion decision, through
        `effective_backlog_depth_cli.bb`'s unbounded `process/sh`, and
        the verdict line at every briefing. Measure one run of
        `node extension/out/tools/emit-throttle-recommendation.js <root>`
        on the live checkout (it writes only what a promotion writes) and
        say whether the depth CLI needs a bound.
     b. **Metric.** `reworkObservatorySource.ts` `evidenceTicketIdSet`
        counts a ticket as bounced when ANY `backlog/evidence/` file
        names it; its comment says QA bounce evidence. The live signal at
        2026-10-01T16:49Z read 94.6% over a 99.5% baseline (205 samples,
        top role architect). Every ticket carries pass evidence, so the
        rate may sit near 100% in both windows and never fire. Count how
        many of the 205 have bounce evidence by file name.
     c. **Failure path.** `emit-throttle-recommendation`'s `main` calls
        `refreshReworkSignal` outside any try. If it throws, the CLI
        exits non-zero, and the depth CLI logs it and reads the
        throttle-recommendation file already on disk, which is the stale
        shape the hotfix exists to remove. Confirm or refute with an
        in-process probe on a mkdtemp root.

  ## How (direction, not mandate)

  - Fixture roots under mkdtemp, `git init`, proven by `rev-parse
    --git-common-dir` before any git command (BL-1390); commit dates set
    with `GIT_AUTHOR_DATE`/`GIT_COMMITTER_DATE` relative to the run's
    own clock, never a fixed calendar date, or the window drifts.
  - The handler stays discovered from its own file (BL-1371). Never write
    or read the live `.swarmforge/telemetry/observatory-signals.json`.

  ## Scope

  `specs/pipeline/steps/bl432AutoTuneIntakeThrottleSteps.js`, BL-432's
  feature (scenario 06 added, 01-05 untouched), evidence. No production
  file.

out_of_scope: |
  - Fixing the rework metric (probe b) or bounding the depth CLI (probe
    a): each is a ticket of its own if the probe confirms it.
  - BL-431's feature: green on the hotfix tree at mint (scenario 05 uses
    the pure formatter).

