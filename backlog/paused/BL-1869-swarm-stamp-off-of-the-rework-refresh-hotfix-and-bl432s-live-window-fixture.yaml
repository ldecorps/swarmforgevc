  1. `node specs/pipeline/cli.js specs/features/BL-432-auto-tune-intake-throttle.feature`:
     6 of 6 ok. Measured on the hotfix tree at mint: 01, 02, 03, 05 red
     as the register row owned by this ticket describes, 04 ok, 06 absent.
  2. The BL-430, BL-431, BL-1106, BL-1429 and BL-966 features: all ok
     (`# fail 0`), as measured on the hotfix tree at mint.
  3. `npx vitest run` on emitThrottleRecommendationCli,
     reworkObservatoryCli and suboptimalityVerdictLineCli: all pass (28
     of 28 at mint).
  4. The evidence answers probes a-c, and the hardener's evidence names
     the three modules' mutation scores.
  5. The register row naming BL-1869 is present and owned at the parcel
     commit; after the land it is gone (BL-1631).
  After QA: the human records the certification with
  `bb swarmforge/scripts/hotfix_ledger_update.bb . --decide 51591aab4a <approved|waived>`.

