id: BL-1454
title: "handoffd's coordinator-activity-feed-sweep (GH-24) kills the whole swarm every ~5 min: with no cursor file it selects all 6463 sent handoffs plus 500 commits, posts one bb subprocess per trace with no bound, overruns SUPERVISOR_IN_SWEEP_BUDGET_MS (225 s) so the supervisor rules stalled and BL-144 halt-swarm! kills every role session; the cursor is written only after a full drain, so it never advances and every cycle replays from item 0. A tick seeds at the newest trace on first run, posts at most a capped batch inside its own deadline, and persists the cursor after every successful post"
milestone: M8
type: defect
severity: critical
# critical: swarm-down, recurring. Four total deaths of all nine role
# sessions measured on 2026-09-06 (21:52:19Z, 21:59:42Z, 22:04:22Z,
# 22:10:32Z), every failure log `reason: stalled`, babysitterd restores the
# sessions and the next sweep kills them ~4.5 min later. Every death costs
# every agent its in-flight context. It does not self-heal: the cursor file
# has never been written, so the walk restarts from item 0 each cycle.
