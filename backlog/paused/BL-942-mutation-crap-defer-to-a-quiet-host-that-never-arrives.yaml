id: BL-942
title: "Mutation and CRAP gates defer to a quiet host that never arrives: 35 of 60 August hardener passes deferred, 2 ran"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
human_approval: approved
priority: 30
direction: swarm-surfaced
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
