invariants:
  - "A gate that did not run is never indistinguishable from a gate that passed — every deferral is recorded as a first-class, machine-readable row, not only as prose inside a per-parcel evidence file."
  - "The debt record names the exact file set that was skipped and why, so a later pass can discharge that specific debt rather than a different parcel's scope."

approval_context: >
  This ticket asks for the RECORDING half only, and that half is needed under
  every remedy. The remedy itself is the human decision, and it is a real fork
  with different costs — which is why this is `pending` rather than minted
  straight into the queue.

  What specifically needs sign-off: whether recording the debt is the right
  next step at all, and which direction the drain should eventually take.
  Three options, none of which this ticket builds:

  (a) Keep the gate and give it a window — reserve a slot where the swarm
  quiesces enough for a full-suite mutation and coverage run, and drain the
  ledger there. Costs throughput.

  (b) Keep the gate and make it fit the host — scope Stryker per parcel
  narrowly enough to run at concurrency 1 under load, accepting a longer wall
  clock instead of a skip. Costs per-parcel time, no throughput loss.

  (c) Stop claiming the gate — formally downgrade Article 4.1.3 for this host
  and say so in the constitution, so tickets stop closing as if mutation ran.
  Costs the gate; buys honesty.

  What is firm: the measurement below. It is reproducible from the evidence
  files and from `uptime` on this host, and it does not depend on which
  remedy is chosen.

source: |
  Surfaced while acting on a hardener `note` about BL-915's owed gates
  (see BL-941). The BL-915 deferral was correct by the rules; probing why the
  rules keep producing deferrals is what found this.

description: |
  ## The rule and its promise

  `swarmforge/roles/hardender.prompt` line 201, the office-hours mutation
  bypass (operator policy, 2026-07-06), defers heavy mutation on a busy host
  and promises repayment:

  > This does NOT weaken the gate: the coordinator sequences mutation-heavy
  > tickets to reach you overnight [...] so the full pass still runs — just
  > against a quiet host, not a contended daytime one.

  The promise has two halves. The coordinator's half — Article 3.4
  mutation-heavy scheduling — is about WHEN a ticket is promoted. There is no
  second half. Nothing records what was skipped, and nothing brings it back.

  ## What is actually happening

  Measured 2026-08-19 on this host:

  - `sysctl -n hw.ncpu` reports **4 cores**, so the rule's 2x-cores busy
    threshold is a load average of **8**.
  - `uptime` during this pass: **44.47 / 27.77 / 22.49** — between 3x and 5x
    over the threshold on the 15-minute average, which is the one that cannot
    be dismissed as a spike.
  - Of the **60 hardener evidence files** written in August, **35** record a
    deferral or bypass, and **2** record Stryker actually running. The
    remaining 23 are parcels with no wired mutation target at all — Babashka,
    shell, or docs-only.

  So among parcels where the gate applies, deferral is not the exception; it is
  very nearly the rule.

  ## Why the promise cannot be kept

  The bypass defers to "the off-peak/overnight window". That window was real
  when the policy was written in July. It is not real now: continuous 3x8
  shifts were armed 2026-08-18 — `.swarmforge/operator/continuous-shifts.json`,
  `"mode": "continuous-3-shift"`, all three shifts active, `scheduledStop:
  false`, `cooldownWindowEnabled: false`. Eight agent sessions run around the
  clock on 4 cores. There is no hour at which this host drops below a load
  average of 8, so the condition the deferral waits on is never satisfied.

  A gate whose fallback waits for a state that cannot occur is not a deferred
  gate. It is an unenforced one.

  ## The compounding half

  Even if a quiet hour did arrive, the debt could not be discharged, because
  nobody knows what it consists of. Each deferral is recorded as prose inside
  that parcel's own evidence file and nowhere else. A grep across
  `swarmforge/scripts/`, `swarmforge/roles/`, `extension/src/tools/` and
  `docs/reference/` for any deferred-mutation ledger returns nothing. The next
  quiet pass belongs to a different parcel with a different `--mutate` scope,
  so it cannot repay a debt it cannot see. BL-915's debt reached a holder only
  because its hardener hand-wrote a `note` — a discipline that worked, but one
  that depends on a human-shaped act at every single deferral.

  ## What this ticket builds

  The recording half, and only that. Every deferral becomes a durable row
  naming the parcel, the file set that was skipped, which gate, the blocking
  reason, and the measurement that justified it. The existing
  `backlog/hotfix-ledger.yaml` plus `hotfix_ledger_update.bb` is the proven
  in-repo precedent for a ledger of this shape; follow it rather than inventing
  a new storage idiom.

  Once the ledger exists, the outstanding debt is a number the operator can
  look at, and the remedy question in `approval_context` becomes answerable
  with evidence rather than argued from impressions.

out_of_scope: |
  - Choosing or building the drain: no reserved quiet window, no change to
    shift policy, no reduction in swarm concurrency, no rescoping of Stryker to
    run under load. Those are the remedy options in `approval_context` and each
    is its own ticket once the human rules.
  - Amending Article 4.1.3 or the office-hours bypass text. A constitution
    change follows Article 5 and needs the ruling first.
  - Back-filling the 35 August deferrals into the ledger. Start from the next
    deferral; the historical rows are recoverable from evidence files later if
    anyone wants them, and mining them is not what makes the gate enforceable.
  - The BL-149 file-change cooldown. That is a different, deliberate,
    time-bounded mechanism that does clear on its own — it is not part of this
    defect.

qa_e2e_procedure: |
  1. With the host busy — confirm `uptime` is above 2x `sysctl -n hw.ncpu` —
     drive a hardening pass that defers a full-suite gate, and confirm a new row
     appears in the ledger naming that parcel, the gate, the file set, and the
     load measurement that justified the skip.
  2. Confirm the row is machine-readable: read the outstanding debt back with
     the ledger's own reader and get the parcel and file set out, without
     parsing an evidence markdown file.
  3. Confirm a second deferral for the same file set does not create a
     duplicate row — the ledger is idempotent under redelivery the same way the
     hotfix ledger is.
  4. Confirm a pass where the gate RAN records no row. A ledger that fills up on
     successes tells the operator nothing.
  5. Read the ledger cold and confirm invariant 1 holds by inspection: a gate
     that did not run is visibly distinguishable from one that passed.

notes: |
  2026-08-19 specifier, on minting: filed from the BL-915 hardener note, but it
  is not a criticism of that pass. The hardener followed the rule, recorded the
  fallback, and flagged the debt — the failure is that the rule's repayment
  half was never built, and that its precondition stopped being satisfiable when
  the swarm went to continuous shifts.

  Measurement method, so it can be re-run rather than trusted: classify each
  August file in `backlog/evidence/` matching `hardener|hardender` by whether it
  matches `deferred|blocked by host|blocked by .*load|mutation bypass|skip-cooldown`
  versus `no surviving mutant|mutation score|stryker.*(ran|complete)`. Counts on
  2026-08-19 were 60 total, 35 deferred, 2 ran, 23 not applicable.

  Severity `high` rather than `critical`: nothing is down and no data is lost,
  but Article 4.1.3 is a mandatory gate that is not being enforced while tickets
  close as though it were — a broken safety signal, which is the `high` band.

  Related but distinct: BL-941 discharges one specific instance of this debt
  (BL-915's). BL-472 wires mutation tooling for Babashka, a different gap —
  that one is a tool that does not exist, this one is a tool that exists and
  never gets to run.

  IR-DRY disposition: the checker reports four medium findings, every one of
  them pairing a positive ledger assertion with its negative or with a Given
  that sets the row up. "holds a row" versus "holds no row" versus "still holds
  exactly one row" are three different claims; merging any pair would delete a
  scenario's point. Left as-is deliberately; do not "resolve" them.
