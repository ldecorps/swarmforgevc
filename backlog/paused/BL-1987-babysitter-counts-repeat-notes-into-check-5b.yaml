description: |
  ## What is wanted

  Each held ticket of a local-model seat carries
  `:repeat-notes-since-claim`: the number of REPEAT notes in that seat's
  current qwen session stamped at or after the ticket's progress origin
  (the same origin `held-seat-tickets` already computes for the dwell).
  BL-1985's check then raises the seat-stuck CRIT at ten, naming the count
  (scenario 02); nine do not (scenario 03); a commit for the ticket after
  the notes is progress (scenario 04). A seat that is not a local model has
  no session, so its count is 0 and nothing changes for it.

  ## Where to read (only these lines)

  - `swarmforge/scripts/babysitter_check.bb` `held-seat-tickets`
    (~869-910): `taken-ms` is the progress origin; add the count there,
    next to BL-1986's `:loop-dialog?`.
  - A seat's qwen sessions are `~/.qwen/projects/<worktree path with / and
    . as ->/chats/*.jsonl`; the current session is the newest one.
    `swarmforge/scripts/local_seat_report_lib.bb` already parses these
    files (`parse-session-events` ~91, `latest-session-id` ~42): reuse it,
    do not re-parse by hand.
  - A REPEAT note's text starts `REPEAT: you have now made` (written by
    `swarmforge/scripts/local_model_repeat_guard.bb`, ~120). Count the
    records carrying it with a timestamp at or after the origin. Confirm
    where the note sits in a real record on session cfca2aec before writing
    the counter (QA step 3 replays it).
  - Scenarios 03 and 04's fixtures hold a dwell under 60 minutes, or the
    dwell trigger fires on its own (hotfix 9b4ccdd827).

  ## What each stage checks

  - Coder: scenarios 02-04; test_babysitter_check.sh still passes.
  - Documenter: the babysitter runbook's check 5b section names both new
    triggers.

