description: |
  ## What

  Font size is adjustable on several phone / Mini App / dashboard surfaces,
  but stickiness is inconsistent. Live Screen (BL-609) resets to 13px on
  full Mini App reload by design; Pipeline Board and Paused pager use
  per-page localStorage; the PWA dashboard already sticks via a purge-exempt
  preferences Cache.

  Human ask (locked): make the font-size choice sticky across those pages —
  reopen / reload / leave-and-return keeps the size they picked.

  ## Why

  Operators on a phone pick a readable size once; losing it on every Mini App
  reload (especially Live Screen) forces them to re-tune constantly.

  ## How (direction, not mandate)

  1. Persist Live Screen pane font-size across reloads (undo the BL-609
     "reset on reload" operator note).
  2. Align Pipeline / Paused / Live Screen on one Rule-3-compatible sticky
     policy via extension-host preference (workspace state or host-served
     JSON). Prefer one shared "web UI text size" preference where honest;
     documented per-surface keys that all survive reload the same way are
     acceptable.
  3. Leave PWA A-/A+ on its existing Cache preference (do not regress).
  4. Clamp / step ranges may stay surface-specific (Live Screen 9–20px vs
     dashboard 16–40px). Stickiness is the ask, not one numeric range.

qa_e2e_procedure: >
  (1) On Live Screen, step font size away from 13px, fully reload the Mini
  App, confirm the chosen size returns.
  (2) Repeat for Pipeline Board and Paused pager A-/A+ after reload.
  (3) Confirm PWA A-/A+ still restores after reload.
  (4) Confirm Mini App persistence does not use localStorage/sessionStorage
  (or cite an explicit Rule-3 waiver on this ticket).
  (5) Delete/corrupt the stored preference and confirm each surface falls
  back to its default.

out_of_scope: |
  - Redesigning typography / layout of every page.
  - Forcing Bubble native chrome to use the same control if it has none yet.
  - Changing locale or other preferences.
  - Reminting BL-609's control UX (range/buttons) — only its non-sticky
    persistence contract is superseded here.

