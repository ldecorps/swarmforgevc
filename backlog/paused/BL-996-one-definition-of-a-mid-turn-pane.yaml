id: BL-996
title: "two consumers classify pane-busy themselves and never reach BL-970's chokepoint - babysitterd_sweep_lib's classify-pane-busy? and loop_detect_lib's busy-footer-re both carry the same whole-pane substring match, and in the loop detector a quoted marker holds the endless-loop circuit breaker open"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 20
direction: pipeline-note
depends_on: [BL-970]
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-996-one-definition-of-a-mid-turn-pane.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl996::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "There is one definition of 'this pane is mid-turn'. Every consumer that classifies pane text reaches the same verdict for the same text - a fixture one classifies busy and another classifies idle is a defect regardless of which verdict is right."
  - "Consolidation never widens a consumer past its own contract. loop_detect_lib's deliberate exclusion - a model API wait line must NOT read as busy, or the circuit breaker never fires - survives unchanged."

description: >
  BL-970 states that the four wake predicates (deliver, chase, rotate, nudge)
  funnel into the single pure classifier in `chase_sweep_lib.bb`, so fixing
  that chokepoint fixes every caller. **That claim is correct as scoped, and
  this ticket does not contradict it.** Verified: `babysitter_nudge_lib.bb:63`
  only carries a message string, and `remote_control_respawn.bb:75` delegates
  (`(chase-sweep-lib/actively-processing? (capture session))`).

  What the claim does not cover is that TWO OTHER consumers classify pane
  text themselves and never reach the chokepoint at all. Neither loads
  `chase_sweep_lib`:

  - `babysitterd_sweep_lib.bb:207` `classify-pane-busy?` - consumed by
    `babysitter_check.bb:192`. Its body is
    `(or (str/includes? text "<busy footer>") (and <spinner-glyph> <elapsed-time>))`.
    The first arm is a whole-pane substring match, which is exactly BL-970's
    false-busy direction (1).
  - `loop_detect_lib.bb:37` `busy-footer-re`, applied at `:57` by
    `classify-pane-loop-signal` via a whole-pane `re-find`.

  THE LOOP DETECTOR IS THE SERIOUS ONE, and it is why this is `high`. In
  that classifier `:busy` means DO NOT STRIKE - it is what protects a
  genuinely mid-turn pane from the endless-idle-loop circuit breaker. So a
  false-busy there does not merely mislabel a pane: it holds the breaker
  open. A role spinning `ready_for_next` -> `NO_TASK` forever, whose
  scrollback happens to quote the busy footer, never accumulates a strike and
  the breaker never fires. That breaker exists because burning tokens on an
  idle loop has no upside, and it is the one mechanism that halts the swarm
  for it.

  The self-referential edge makes this concrete rather than theoretical: the
  marker is a short English phrase, so any pane DISPLAYING text about the
  busy gate - a log line, this ticket, the source of the classifier itself -
  reproduces it. BL-970's own author already had to work around this: its
  YAML and feature file contain ZERO occurrences of the literal, which is
  quarantined into `specs/features/fixtures/BL-970/midturn-esc-footer.txt`
  precisely so that reading the ticket cannot trip the gate it describes.
  That workaround is evidence the hazard is real.

  How (direction, not mandate): both siblings should reach the same
  definition BL-970 is fixing rather than keep private copies - the
  chokepoint already exists and already has a test runner
  (`actively_processing_test_runner.bb`). Take care with `loop_detect_lib`:
  its own comment records a deliberate exclusion (an aider-style model API
  wait line must not count as busy, because that line appears during a
  NO_TASK spin's own API calls and would reset strikes forever). Delegating
  must not silently import busy-ness that the breaker depends on NOT having
  - that is invariant 2, and it is the one way this consolidation can make
  things worse.

constraints: >
  Firm lines:

  - Do NOT amend or reopen BL-970. It is active and in flight, its chokepoint
    claim is correct as scoped, and its fix is a prerequisite for this one -
    hence `depends_on: [BL-970]`. Funnelling these two siblings into the
    chokepoint BEFORE it is fixed would give them the shared definition
    complete with the bug.
  - Do NOT extend this to the TypeScript sites. `agentPaneState.ts` and
    `tmuxClient.ts` also classify from the same marker, but they run in the
    extension host and no import can bridge to a `.bb` lib - that is a
    different remedy (a cross-boundary agreement test) and is BL-997.
  - The loop detector's exclusions are behaviour, not incidental. Any
    consolidation that makes an API wait line read as busy has defeated the
    circuit breaker in a new way while fixing the old one.
  - Do not solve this by copying BL-970's fix into both siblings. Three
    corrected copies still drift; the point is one definition. This is the
    same failure family as a hand-maintained mirror list patched one name at
    a time.

qa_e2e_procedure: >
  From the repo root:

  1. Reproduce both, at the parcel's parent commit, against the REAL
     classifiers - not reimplementations. Feed each a pane fixture that rests
     at the idle prompt and merely quotes the busy footer (reuse
     `specs/features/fixtures/BL-970/` shapes; keep the literal in a fixture
     file, never inline in a ticket or feature file). Confirm
     `babysitterd-sweep-lib/classify-pane-busy?` returns true and
     `loop-detect-lib/classify-pane-loop-signal` returns `:busy`. Both are
     the defect.
  2. At the parcel commit, repeat and confirm both now classify the fixture
     idle / not-busy.
  3. Confirm invariant 1 as an equality, not three separate assertions: for
     each fixture, assert all three consumers return the SAME verdict. A
     fixture where two agree and one differs must fail, whichever is right.
  4. Confirm invariant 2 explicitly, because it is how this ticket could make
     things worse: feed a NO_TASK-spin fixture that shows a model API wait
     line and confirm `classify-pane-loop-signal` still returns the no-task
     spin signal and still records a strike. If delegation made that read
     busy, the circuit breaker is now defeated by a different string.
  5. Confirm the breaker end to end: drive the strike accumulation over a
     spin fixture carrying a quoted marker and confirm strikes accrue to the
     halt threshold. Asserting the classifier alone leaves the consequence
     untested.
  6. Run the existing sibling suites and confirm no regression -
     `babysitterd_sweep_lib_test_runner.bb`, `loop_detect_lib_test_runner.bb`
     and `actively_processing_test_runner.bb`. Note that
     `babysitterd_sweep_lib_test_runner.bb:250-256` asserts the CURRENT
     behaviour of `classify-pane-busy?` directly; those cases must be
     updated deliberately as part of the fix, not deleted.
  7. Run the acceptance feature, all scenarios green, handler registered in
     `specs/pipeline/steps/index.js`.
  8. Prove non-vacuity: restore each sibling's private classifier in turn and
     confirm scenario 01's corresponding row fails while the other rows pass.

notes: >
  Source: coder note 20260820T155459Z_000389, "babysitterd_sweep_lib carries
  its own whole-pane busy classifier (BL-970 class)". Correct, and the sweep
  it prompted found a second one the note did not name.

  The closure was DERIVED, not hand-listed - the standing lesson from BL-948
  (a gate that was itself a hand list of spellings, catching 1 of 6) and
  BL-964 (3 of 11 seams). Grepping every tracked `.bb`/`.ts`/`.js`/`.sh` for
  the marker returned 16 files; separating real classifiers from mentions
  gives:

  - REACHES the chokepoint, no change needed: `babysitter_nudge_lib.bb:63`
    (message string only), `remote_control_respawn.bb:75` (delegates).
  - PRIVATE classifier, this ticket: `babysitterd_sweep_lib.bb:207`,
    `loop_detect_lib.bb:37`.
  - PRIVATE classifier across the language boundary, BL-997:
    `extension/src/panel/agentPaneState.ts:48`,
    `extension/src/swarm/tmuxClient.ts`.
  - Comment-only mentions, no change: `extension/src/extension.ts:422`,
    `extension/src/watchdog/wedgedRespawn.ts:8`.

  Counting files would have overstated this by four (the comment-only and
  message-string sites) and understated the TypeScript half as one site;
  the separation is the useful artifact and is why it is written out here.

  IR-DRY: 2 medium-confidence findings, both reviewed and kept - one is the
  inherent outline-placeholder-vs-literal pairing, the other pairs "classified
  busy" against "classified idle", which is the contrast the feature exists to
  assert.

approval_context: >
  One judgement worth your eye: I set `depends_on: [BL-970]` rather than
  letting this run alongside. Funnelling two siblings into a chokepoint that
  is still being repaired would hand them the shared definition complete with
  the bug, and the two tickets touch the same classifier, so the coordinator's
  orthogonality rule would likely have separated them anyway. The cost is that
  this waits.

  Severity `high` rests on the loop detector rather than the health check. A
  false-busy there holds the endless-loop circuit breaker open, so a role
  spinning on NO_TASK forever is never caught - the breaker exists precisely
  because that burn has no upside. The babysitter half alone would be
  `medium`. Push back if you read the breaker path as less exposed than I do.

  Not a decision, but worth knowing: I did NOT touch BL-970 even though it is
  active and its description could be read as claiming more coverage than it
  has. Its claim is accurate as written, an in-flight amendment costs the
  holder a merge and a re-read, and this ticket carries the correction where
  it will actually be read.
