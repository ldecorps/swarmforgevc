    mechanism directly in swarmforge/git-hooks/pre-commit and in each of the
    four guard scripts. The note's cited precedent is NOT carried forward:
    BL-1242 fixed a silent deletion on the merge-up path and its ticket and
    feature file contain no masking claim. The correct precedent is
    constitutional Article 4.4 (complete review inventory, one bounce per
    pass), which this ticket applies to the mechanical gate. The observation
    itself is sound and is what the ticket rests on.
  - [2026-08-29] specifier: prior art confirmed after mint, from a follow-up
    hardender rule_proposal. The identical defect in the sibling `commit-msg`
    hook was found and fixed on swarmforge-hardender at 61735035f, verified by
    reading that commit and its test case 09. That commit's message cites
    Article 4.4 independently of this ticket, which corroborates the precedent
    correction in the note above. The rule was accepted and landed on main in
    engineering.prompt Guardrails plus engineering-detailed.prompt; scope was
    moved from role:hardender to engineering because the actor who must obey it
    is whoever writes a hook - here, this ticket's coder - not the hardener.
  - [2026-08-29] specifier: no multi-guard incident is asserted for pre-commit. The defect is
    structural and was found by reading the chain, not by anyone hitting it.
    Do not go looking for an incident report that does not exist.
  - [2026-08-29] specifier: IR-DRY checker leaves 3 medium findings, all the
    same deliberate parameterization of one step shape - `a staged commit that
    violates <X>` used with a placeholder in the outline and with literals in
