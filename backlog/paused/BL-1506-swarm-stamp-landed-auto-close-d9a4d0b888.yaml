approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. What needs sign-off is the
  DISPOSITION only: that reviewing the landed diff of d9a4d0b888 (BL-811 /
  BL-849 posture) rather than re-implementing it is right, and that
  medium is the right severity for a review of a fault already fixed.
  Worth knowing: this hotfix moves the ACT of closing from the
  coordinator's turn into the daemon, but not the authority - the daemon
  runs close_ticket.sh as SWARMFORGE_ROLE=coordinator through
  commit_integrity_cli.bb and ticket_close_guard_lib.bb, so Article 3.3
  reads unchanged and the specifier recorded the mechanism in
  coordinator.prompt in the mint commit rather than amending the
  constitution (boot prefix at budget, BL-859). Reject if you want the
  close to stay a coordinator-turn act. FIRM: the parcel changes no file
  under swarmforge/scripts except to add evidence; a refuted scenario is
  a narrow follow-up via note to the specifier. FIRM: the parcel never
  writes human_decision into backlog/hotfix-ledger.yaml (scenario 06).
  Minted by the specifier on the coordinator's ledger note of 2026-09-10
  07:11Z; the ledger row is linked to this ticket in the mint commit.

