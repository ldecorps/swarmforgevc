description: |
  ## What

  An operator hotfix is live on main and has never been through a gate.
  This ticket is that gate: a REVIEW ticket, not a rewrite ticket -
  confirm or refute, and open narrow follow-ups for anything found.

  ## The failure it fixed

  BL-1278 went through every stage on the all-GLM pack; QA landed it
  (land-approvals row, commit on origin/main, git_handoff to the
  coordinator), but the aider/GLM coordinator completed QA's parcel
  without the active/ -> done/ move, lost track, and chased a phantom
  "possible drop". Two gaps let that stand: the landed-but-open sweep
  detected landings by commit SUBJECT only ("QA-approved" / "QA pass
  inventory"; QA's "BL-1278: QA review pass evidence" never matched, so
  the sweep logged "none" 458 times that day), and a detected ticket only
  produced a note to QA.

  ## What landed (files to review)

  - `swarmforge/scripts/landed_ticket_autoclose_lib.bb` (new, pure):
    `parse-land-approval-lines` / `read-land-approval-rows` (one corrupt
    row never blinds the sweep), `index-store-approvals` (latest row per
    ACTIVE ticket whose commit passes an injected ancestry probe, asked
    once per ticket), `auto-close-candidates` (approved, active, no Close
    subject on main), `attempt-due?` with `default-cooldown-ms` 30 min in
    `.swarmforge/daemon/landed-auto-close-attempts.json`,
    `coordinator-note-message` capped at 80 chars, `attempt-auto-close!`
    through adapters `close!` / `notify!` / `log!` / `record-attempt!`.
  - `swarmforge/scripts/handoffd.bb`: `landed-commit-on-origin-main?`
    (`git merge-base --is-ancestor`), `close-landed-ticket!` (`bash
    close_ticket.sh <root> <id>` with `SWARMFORGE_ROLE=coordinator`),
    `notify-coordinator-auto-closed!` (swarm_handoff draft),
    `auto-close-landed-tickets!` (ONE attempt per tick; store approvals
    merged over the subject index; closed ids removed from the legacy
    landed-but-open items). Log tags: `landed-auto-close-candidates`,
    `landed-auto-close`, `-refused`, `-error`, `-notified`.
  - Tests: `landed_ticket_autoclose_test_runner.bb` (23 cases, registered
    standing) - green on main 60623ebf02 (specifier, 2026-09-10); it leaks
    temp roots, owned by BL-1501, out of scope here.

  ## Review goals

  1. Confirm candidate selection (scenario 01): the store row is a second
     signal, never a replacement for the guard; a ticket with a Close
     subject on main or already in done/ is never re-closed.
  2. Confirm the tick budget (scenario 02) - a guarded commit runs hooks
     and must stay inside the tick's stall window (BL-1490's supervisor).
  3. Confirm a refusal moves nothing and the legacy QA nudge still fires
     (scenario 03); read `ticket_close_guard_lib.bb`'s `close-verdict` to
     see which refusals are expected in production (no QA git_handoff /
     note in the coordinator mailbox yet is the common one) and say so in
     evidence.
  4. Confirm the coordinator note and the cooldown (scenario 04); check
     that a note the coordinator never consumes does not re-fire every
     tick.
  5. Confirm the prompt currency the specifier landed (scenario 05).
  6. Refute-worthy question for the architect: with the daemon closing as
     `SWARMFORGE_ROLE=coordinator`, does the close gate ("mailbox contains
     a QA git_handoff or note referencing the ticket") still see QA's
     parcel when the coordinator has ALREADY completed it, as on BL-1278?
     If the guard refuses exactly the incident case, the hotfix fixed
     detection but not the close - a follow-up, not a rewrite.

  ## Scenario notes for the coder

  - Scenarios 01-04 drive `landed_ticket_autoclose_lib.bb` directly with
    fake adapters and a fake ancestry probe - the runner's own shape
    (`bb -e` from a fixture root). Scenario 03's "legacy nudge still
    fires" is the runner's wiring check on `handoffd.bb` (closed ids are
    removed from the landed-but-open items; a refused id is not).
  - Scenario 05 reads `swarmforge/roles/coordinator.prompt` and asserts
    the literal `landed auto-close` and `d9a4d0b888` occur before the
    line beginning `2. **Close**`.
  - Scenario 06's handler reads `backlog/hotfix-ledger.yaml` for the row
    `commit: d9a4d0b888` and asserts `human_decision` is null; BL-1346's
    handler is the precedent.

