qa_e2e_procedure: |
  On the parcel commit:
  1. `git diff main...HEAD --name-only` names only evidence, the feature,
     the step handler + index.js registration; no swarmforge/scripts/*.bb
     (invariant 1).
  2. `run_acceptance.sh` on the BL-1506 feature -> 6 scenarios green.
  3. `bb swarmforge/scripts/test/landed_ticket_autoclose_test_runner.bb`
     green.
  4. Live: `.swarmforge/daemon/landed-auto-close-attempts.json` exists on
     the running host and the daemon log shows `landed-auto-close-candidates`
     lines only for active tickets with a land row.
  5. `backlog/hotfix-ledger.yaml` row d9a4d0b888: `human_decision: null`.
  6. After done: the human runs `bb swarmforge/scripts/hotfix_ledger_update.bb .
     --decide d9a4d0b888 approved|waived` and commits the ledger.
