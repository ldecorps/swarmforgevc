description: |
  ## What / why

  BL-531's pre-QA gate refuses documenter→QA parcels that drop lineage or
  miss declared wiring. It does **not** run on cleaner→architect,
  architect→hardender, or hardener→documenter sends. Entangled tips — commits
  whose tree diff vs `origin/main` includes another ticket's backlog YAML,
  feature file, or functional code — therefore ride the middle of the pipeline
  until QA's manual BL-506 inventory rejects them.

  The 2026-08-27 shift produced ten QA bounces classed `behavior`; the
  measured subset (BL-596, BL-754, BL-780, BL-980, BL-1173, BL-1174) shares
  one meta-cause: a handoff naming ticket A cites a commit whose diff vs
  `origin/main` includes functional paths for ticket B. Each costs a full QA
  pass, bounce write-up, and rebuild.

  ## The gate

  A pure decision lib consulted from `swarm_handoff.bb`'s existing `validate`,
  beside the BL-953 task/commit coherence guard and the BL-760 duplicate-chain
  guard. It arms on **every** `type: git_handoff` (all hops), not only the
  QA edge.

  Compare `git diff --name-only origin/main...<commit>`. For each changed path,
  if it positively belongs to a ticket id (backlog YAML basename, feature file
  basename, or other deterministic path→id mapping the implementer documents),
  and that id is not the task's ticket id, emit a finding. Evidence-only paths
  under `backlog/evidence/<task-id>-*` for the named task do not count as
  foreign overlap.

  Fail-open when `origin/main` cannot be resolved, git diff fails, or no
  foreign ticket can be positively identified — same posture as BL-953.

  How (direction, not mandate): reuse `pipeline-stage-lib/extract-ticket-id`
  and the path→ticket helpers already used by pre_qa_gate_gather_lib where
  possible; do not add a third ticket-id parser.

  Deliberately NOT in scope: replacing BL-531 at the QA edge, changing
  PIPELINE.md's preserve-the-task-name rule, or auto-rebuilding tip-pure
  commits (BL-1144 rematch remains QA-land's job).

qa_e2e_procedure: >
  In a scratch clone with origin/main fetched:

  1. Check out a commit known to entangle two tickets (e.g. documenter tip
     from BL-1174 bounce evidence that included BL-1185 paths).
  2. Attempt `swarm_handoff.sh` with `task:` naming BL-1174 — expect refusal
     naming BL-1185 and at least one conflicting path; confirm no mailbox file.
  3. Rebuild or cherry-pick a tip-pure BL-1174-only commit; repeat — expect
     accept and normal delivery.
  4. Repeat from cleaner hop (not documenter) to confirm the gate is not
     QA-edge-only.

