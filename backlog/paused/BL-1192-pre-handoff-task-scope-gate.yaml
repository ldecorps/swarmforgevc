description: |
  ## What / why

  BL-531's pre-QA gate refuses documenter→QA parcels that drop lineage or
  miss declared wiring. It does **not** run on cleaner→architect,
  architect→hardender, or hardener→documenter sends. Entangled tips — commits
  whose tree diff vs `origin/main` includes another ticket's backlog YAML,
  feature file, or functional code — therefore ride the middle of the pipeline
  until QA's manual BL-506 inventory rejects them.

  The 2026-08-27 shift produced ten QA bounces classed `behavior`; the
  measured subset (BL-596, BL-754, BL-780, BL-980, BL-1173, BL-1174) shares
  one meta-cause: a handoff naming ticket A cites a commit whose diff vs
  `origin/main` includes functional paths for ticket B. Each costs a full QA
  pass, bounce write-up, and rebuild.

  ## The gate

  A pure decision lib consulted from `swarm_handoff.bb`'s existing `validate`,
  beside the BL-953 task/commit coherence guard and the BL-760 duplicate-chain
  guard. It arms on **every** `type: git_handoff` (all hops), not only the
  QA edge.

  ## The range — CORRECTED 2026-08-28, this is a spec fix, read it

  This ticket originally said "Compare `git diff --name-only
  origin/main...<commit>`". **That mandate is wrong and must not be
  implemented.** The architect falsified it empirically against the very
  incident this ticket is modelled on: run over documenter tip `dd5b4c332`,
  that range yields **68 findings across 25 unrelated tickets**, drowning the
  one real signal (BL-1185) in routine backlog churn from every ticket that
  landed on the long-lived branch since it last synced with `origin/main`.
  Armed at every hop, it would refuse the majority of legitimate handoffs in
  this repo.

  The cause is that `origin/main...<commit>` answers a different question than
  the one this gate asks. **Two ranges, two purposes, and they must not be
  conflated:**

  - **"Did the author of THIS parcel do work outside its ticket?"** — the
    question this send-time gate asks. Its range is the paths introduced
    **since the task's own most recent ancestor handoff commit**, not since
    `origin/main`. Everything older is a sibling ticket's work the author
    inherited by working on a shared role branch, which is normal pipelining,
    not a scope violation. Use this range.

  - **"Would landing this commit put unreviewed work on `main`?"** — a real
    and different question, correctly asked against `origin/main...<commit>`,
    but only at the land step, and its remedy is not a bounce (see BL-1241).
    Explicitly not this ticket's.

  For each changed path in the corrected range, if it positively belongs to a
  ticket id (backlog YAML basename, feature file basename, or other
  deterministic path→id mapping the implementer documents), and that id is not
  the task's ticket id, emit a finding. Evidence-only paths under
  `backlog/evidence/<task-id>-*` for the named task do not count as foreign
  overlap.

  ### The corrected range needs the abandonment override too

  The "since the task's own most recent ancestor handoff" walk assumes the
  newly-cited commit DESCENDS from the previously-cited one. A deliberate
  tip-pure rebuild off `origin/main` breaks that assumption on purpose — and
  that rebuild is exactly the move a role makes to escape an entangled tip, so
  the gate must not block it. The coder demonstrated this live on 2026-08-28:
  the wiring false-positived against BL-1227's legitimate rebuild `af55356bd`.

  So the gate MUST honour the ticket's `abandoned_commits` field, the same
  documented override `pre_qa_gate_lib.bb` already implements
  (`read-abandoned-commits` / `abandoned-sha?`, and `backlog-schema.md`'s
  `abandoned_commits` row). When the previously-cited commit is recorded as
  abandoned, the walk starts from `origin/main` for that parcel rather than
  from a commit the new tip does not descend from — and does not report the
  ticket's own rebuilt paths as foreign.

  This is not optional polish. Without it the corrected range blocks the one
  remedy available for the condition BL-1241 describes, which would make this
  gate worse than the range it replaced.

  Before shipping, run BOTH checks: re-run the architect's falsification
  against `dd5b4c332` under the corrected range and record the finding count,
  AND confirm a rebuild-off-main parcel with `abandoned_commits` recorded
  passes cleanly. A range that still explodes has not been fixed, and one that
  blocks a recorded rebuild has broken something new, whatever the unit tests
  say.

  Fail-open when `origin/main` cannot be resolved, git diff fails, or no
  foreign ticket can be positively identified — same posture as BL-953.

  How (direction, not mandate): reuse `pipeline-stage-lib/extract-ticket-id`
  and the path→ticket helpers already used by pre_qa_gate_gather_lib where
  possible; do not add a third ticket-id parser.

  Deliberately NOT in scope: replacing BL-531 at the QA edge, changing
  PIPELINE.md's preserve-the-task-name rule, or auto-rebuilding tip-pure
  commits (BL-1144 rematch remains QA-land's job).

qa_e2e_procedure: >
  In a scratch clone with origin/main fetched:

  1. Check out a commit known to entangle two tickets (e.g. documenter tip
     from BL-1174 bounce evidence that included BL-1185 paths).
  2. Attempt `swarm_handoff.sh` with `task:` naming BL-1174 — expect refusal
     naming BL-1185 and at least one conflicting path; confirm no mailbox file.
  3. Rebuild or cherry-pick a tip-pure BL-1174-only commit; repeat — expect
     accept and normal delivery.
  4. Repeat from cleaner hop (not documenter) to confirm the gate is not
     QA-edge-only.

