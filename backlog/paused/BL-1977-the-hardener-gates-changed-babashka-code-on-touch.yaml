notes: |
  Split from BL-472 on 2026-10-04 (slice 3 of 3). Approval inherited.
  Inputs from BL-1976's evidence: which mutant runner is faster (wire that
  one: the human's "pick which ever test framework runs the fatser"), and
  whether crap4clj scores a swarm library. If it does, the gate also fails
  a touched function with CRAP above 6; if not, the gate reports CRAP as
  unavailable with BL-1976's reason, and that is not a failure.
  Runner mapping: swarmforge/scripts/<lib>.bb is tested by
  swarmforge/scripts/test/<lib>_test_runner.bb where one exists
  (gpu_pause_lib.bb -> gpu_pause_lib_test_runner.bb). A touched library
  with no runner is recorded with hardening_debt_ledger_update.bb and does
  not fail the gate (on-touch, never a big-bang flip - BL-472's
  "FIRST-PASS COST").
  Where to read: swarmforge/scripts/mutation_cooldown_gate.bb is the
  sibling hardener check; swarmforge/scripts/hardening_debt_ledger_update.bb
  for the debt row. clj-mutate's `--lines` and `--since-last-run` select
  forms; its `--test-command` takes the runner.
  The specifier's own half (BL-798): engineering.prompt's Startup Tools
  bullet (Babashka "NO mutation/CRAP/DRY wired (BL-472 deferred)") and
  hardender.prompt's .bb pass are amended on main by the specifier when
  this ticket is promoted, with "Until BL-1977 lands" interim wording,
  and the holder is told.

description: |
  ## What is wanted

  A gate the hardener runs on a parcel: for each library under
  swarmforge/scripts (not test/) the change touched, run clj-mutate on the
  touched forms, each mutant judged by that library's own test runner, and
  dry4clj on the touched files. It fails when a touched form keeps a
  surviving mutant or the change adds duplication, naming each one. Forms
  the change did not touch are not judged. A touched library with no
  runner passes with a debt row. Every tool runs with BL-1975's pinned
  toolchain and BL-1976's vendored tools.

  ## How (direction, not mandate)

  - A pure decision lib over the tools' reports and the change's touched
    line ranges, unit-tested on canned reports; a thin CLI that gathers the
    diff, runs the tools and prints the verdict.
  - The same office-hours, host-load and cooldown guards the TS Stryker
    pass already obeys.

  ## What each stage checks

  - Coder: the six scenarios; the lib's unit runner.
  - Hardender: runs the new gate on the gate's own lib and commits the
    verdict and timing.
  - Documenter: the hardener's how-to/runbook names the gate.
