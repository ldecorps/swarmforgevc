id: BL-622
title: "One token, one poller: a swarm never launches its front desk with an inherited Telegram token"
milestone: M8
type: defect
status: todo
epic: fleet-topology
human_approval: approved
severity: high
priority: 10
direction: operator-reported
depends_on: []
assigned_to: coder
mutation_cost: medium
invariants:
  - "Ambient-env Telegram creds resolve only for the one recorded primary root; any other swarm without per-swarm creds keeps its front desk DOWN with one loud line — no path brings up a second poller on the same token."
source: |
  backlog/INTAKE-20260724-onboarding-telegram-token-separation.md — human-
  confirmed incident 2026-07-24: an onboarding attempt (possibly from the old
  Mac) cloned TELEGRAM_BOT_TOKEN; the rival getUpdates poller silently
  consumed this swarm's inbound messages for ~9 hours (last provably-working
  inbound 17:16Z Jul 23). Items 2 and 3 of that intake are BL-621 and
  BL-620's audit half respectively; this ticket is item 1, the root cause.

description: |
  ## Root cause (verified inheritance channels, 2026-07-25)

  One bot token admits exactly ONE getUpdates poller — a Telegram API
  invariant. Today three live channels hand a new swarm the primary's token:
  1. Every launcher sources ~/.zshenv unconditionally (start-swarm.sh:74,
     start_ancillary_services.sh:26, provider wrappers) — which exports
     TELEGRAM_BOT_TOKEN/CHAT_ID/PRINCIPAL for the primary.
  2. Per-target .swarmforge/*.env sourcing hooks (travel by directory copy).
  3. fleet_telegram_creds_lib.bb:53-60 falls back to ambient env whenever no
     per-swarm creds file exists, while swarm_identity_lib.bb defaults the
     swarm name to "primary" when .swarmforge/swarm-identity is absent — so
     a second checkout resolves the primary's identity by default. BL-436's
     per-swarm creds files exist but nothing REQUIRES them; no telegram.json
     exists on this host at all, so everything resolves via env today.
  Enablement is derived (three env vars present, or a stale supervisor pid
  file via swarm_ensure.bb:314-335) — so a copied .swarmforge/ directory or
  an inherited shell is enough to bring up a rival poller. No 409 detection,
  no cross-swarm uniqueness check, and the single-instance guard is per
  project root only.

  ## The invariant this ticket lands

  Ambient-env credential fallback is reserved for the ONE recorded primary
  root on a host. Every other swarm launches its front desk only from its
  own per-swarm creds (BL-380 provisioning / BL-436 fleet store); with none,
  the front desk stays DOWN with one loud, actionable line naming the
  provisioning command. Refusal is always visible, never silent.

  Mechanism (coder latitude on details, invariant is firm):
  - Record the primary root durably on first primary launch (e.g.
    ~/.swarmforge/fleet/primary/root); env fallback in
    resolve-telegram-creds requires root == recorded primary. Operator
    migration = updating that record deliberately.
  - Launch gates (start_ancillary_services.sh, swarmforge.sh, swarm_ensure)
    honor the resolver's refusal — including the pid-file re-enable path.
  - Uniqueness guard: refuse launch when the resolved token equals another
    fleet swarm's recorded token (~/.swarmforge/fleet/*/telegram.json).
  - Docs: BL-439 FES bring-up how-to and the onboarding tutorial currently
    INSTRUCT launching "from a shell that still has the primary's token
    exported" — rewrite to per-swarm provisioning first.

  Relationship to BL-590 (onboarding facilitator, paused): BL-590 treats a
  bot token as a possession-checklist item and its remit ends before the
  target swarm launches; it never requires the token to DIFFER from the
  primary's. This ticket owns that invariant at the launch/resolve layer,
  so BL-590 inherits it for free. Extends the multi-swarm GROUP-separation
  finding to TOKEN separation.

acceptance: |
  specs/features/BL-622-onboarding-telegram-token-separation.feature

  Every scenario needs its step handler wired in this same parcel (BL-233).

  Scenario map: 01 non-primary never inherits the env token + loud line;
  02 recorded primary env fallback preserved (regression); 03 first primary
  launch records its root; 04 named-swarm creds file wins (BL-436 path);
  05 duplicate-token launch refusal names the conflicting swarm; 06 a stale
  pid file alone never re-enables an unresolvable desk (swarm_ensure hole);
  07 bring-up docs instruct per-swarm provisioning.

  Supporting gates:
  - resolve-telegram-creds decisions covered in the .bb unit suite
    (swarmforge/scripts/test/ — the ACTUAL gate for .bb code; no mutation
    toolchain exists for Babashka, BL-472 deferred).
  - Shell-level launch gating covered by shell tests using
    env -u SWARMFORGE_CONFIG and scrubbed cred vars before fixture confs
    (never live env); redirect live paths through env seams.
  - The loud refusal line asserts once per launch attempt, not per sweep
    (no log spam from ensure loops).

  QA end-to-end procedure (live swarm, scratch dirs — never the live
  primary creds):
  1. In a scratch checkout with the primary recorded elsewhere and fake
     TELEGRAM_* env exported: ./swarm launch — front desk does not start;
     the log shows the one-line needs-own-token refusal naming the
     provisioning command; pgrep shows no bot poller.
  2. Provision a scratch creds file for a named swarm; relaunch — desk
     starts with that token (fingerprint-match /proc/<bot>/environ).
  3. Copy a stale supervisor pid file into the scratch swarm; run ensure —
     desk still refuses, same loud line.
  4. Primary root: normal launch still comes up on env creds unchanged.

out_of_scope: |
  - Minting bot tokens or automating BotFather (BL-380 owns provisioning
    input; a human supplies tokens).
  - The onboarding facilitator flow itself (BL-590, paused).
  - 409-cause observability and sustained-outage escalation (BL-621).
  - Multi-swarm GROUP separation (already a recorded finding; this is the
    token half).
  - Removing the ~/.zshenv sourcing from launchers generally (other
    ancillary services legitimately read it; only Telegram cred RESOLUTION
    is being scoped to the recorded primary).

approval_context: >
  One genuine ruling: the primary-root record. Recommendation: first
  primary launch writes ~/.swarmforge/fleet/primary/root; env-token
  fallback then works only for that root, and moving the primary is a
  deliberate operator edit of that record. Alternative (stricter): kill env
  fallback entirely and require a creds file even for the primary — safer
  but adds a migration step for the live swarm on day one. Say which you
  want; the spec as written takes the first. Firm either way: a swarm
  without its own resolvable creds keeps its front desk DOWN and says so in
  one loud line — silent inheritance is the incident.
