description: |
  ## Status: hotfix 7376655875 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `extension/test/bl1300SingleEnforceableBudget.property.test.js` draws a
  tree size around the 44000 budget and asserts the verdict never names
  the retired 42000 ceiling. A draw of exactly 42000 (offset -2000) makes
  the gate print `ok — 42000/44000 chars`, and the measured size itself
  tripped the check - about 1 draw in 9000, so a rare red.

  ## What the hotfix changed

  - The second-budget check strips the verdict's own `<size>/<budget>`
    pair once, then looks for 42000 in what is left.
  - `RETIRED_CEILING - budget` joins the constant draws, so a tree of
    exactly 42000 is exercised most runs instead of almost never.

  ## What the coder does (all of it)

  1. Run `cd extension && npx vitest run --config vitest.properties.config.mjs test/bl1300SingleEnforceableBudget.property.test.js`
     once (the ticket is about this file alone), output saved to
     tmp/out.txt.
  2. Read `git show 7376655875` against the sections above and the
     invariant.
  3. Write backlog/evidence/BL-2011-coder-<date>.md: the result and one
     line saying whether the hotfix matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

