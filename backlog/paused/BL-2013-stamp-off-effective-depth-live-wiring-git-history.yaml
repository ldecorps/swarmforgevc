description: |
  ## Status: hotfix fe08621a87 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  Hotfix 51591aab4a (2026-10-01) made emit-throttle-recommendation refresh
  the rework signal from git history (`refreshReworkSignal`) before
  diagnosing. `test_effective_backlog_depth_cli.sh`'s live-wiring case
  hand-wrote `.swarmforge/telemetry/observatory-signals.json` in a fixture
  that is not a git repository, so the refresh overwrote it with "no
  sample", no recommendation was made, and the effective cap stayed 3 where
  the case expects 0.

  ## What the hotfix changed

  - The fixture is a git repository on `main`: 10 tickets closed into
    `backlog/done/` in the last 14 days (5 with a
    `backlog/evidence/<id>-bounce.md`) and 10 in the 14 days before (1
    bounced) - rate 0.5 against a 0.1 baseline, the severe signal the old
    fixture hand-wrote.
  - Commit dates use git's raw `<epoch> +0000` form (no `date -d`), so the
    test stays portable to macOS.
  - A BL-1390 check proves the fixture is its own repository before any
    commit.

  ## What the coder does (all of it)

  1. Run qa_e2e_procedure step 1 once, its output saved to tmp/out.txt.
  2. Read `git show fe08621a87` against the sections above and the
     invariant.
  3. Write backlog/evidence/BL-2013-coder-<date>.md: the result and one
     line saying whether the hotfix matches its description.
  4. Commit that file, forward to QA, run done_with_current.sh.

