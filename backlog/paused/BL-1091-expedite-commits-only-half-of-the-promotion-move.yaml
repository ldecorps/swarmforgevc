id: BL-1091
title: "The Telegram Expedite button commits only half of its promotion: promoteToActive renames paused/ -> active/, but the commit is pathspec-scoped to the destination alone, so the paused/ deletion is never committed and the ticket ends up live in BOTH folders"
type: defect
severity: high
# high: backlog folder semantics are corrupted repo-wide right now - 8 ticket
# ids are simultaneously in paused/ and active/, so active depth reads 10
# against a cap of 6 and every swarm_handoff.sh call prints "Active backlog
# depth exceeded". The coordinator's promotion gate is therefore deciding on a
# false count, and each orphaned paused/ copy is a live re-promotion candidate
# for a ticket that is already active. Not critical: no work is lost, both
# copies are byte-identical, and the pipeline keeps moving.
status: todo
epic: swarm-reliability
assigned_to: coder
priority: 12
direction: swarm-surfaced
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1091-expedite-commits-only-half-of-the-promotion-move.feature
human_approval: pending
approval_context: >
  No judgement call in the fix itself - a rename must be committed as both of
  its paths or neither, and the commit-integrity CLI already accepts a plural
  --path list, so the change is small. Flagging for approval only because the
  fix touches the locked commit-integrity path that BL-419/BL-490 hardened,
  and I would rather you saw that before a coder edits it.

  One thing I deliberately did NOT put in this ticket: cleaning up the 8
  ticket ids currently duplicated across paused/ and active/. That is backlog
  bookkeeping and belongs to the coordinator, not to a code fix, and doing it
  inside this parcel would mix a data migration into a behaviour change. I am
  surfacing it to the coordinator separately. If you would rather this ticket
  also carry the cleanup, say so and I will add it.
invariants:
  - A backlog move is committed as both of its paths or neither - a pathspec-scoped commit of a rename must never carry only the destination, leaving the source deletion uncommitted in a shared checkout that a later merge or checkout will restore.
  - backlog/paused/, active/, hold/ and done/ are disjoint - no ticket id ever appears in two of them at once.
description: >
  WHAT: the Expedite verb's promotion half is committed with a one-path
  pathspec, so only the `backlog/active/` addition lands. The
  `backlog/paused/` deletion stays uncommitted in the shared master checkout
  until some later merge or checkout restores the file, leaving the ticket
  live in both folders.

  EVIDENCE, observed 2026-08-23: `git show --stat` on
  `3810db5de "Expedite BL-844: record approval + promotion"` reports exactly
  `1 file changed, 132 insertions(+)` - an addition and no deletion. Twelve
  or more commits share that message shape, and eight ticket ids are
  duplicated across paused/ and active/ right now: BL-713, BL-777, BL-844,
  BL-845, BL-1045, BL-1078, BL-1079, BL-1080. `swarm_handoff.sh` currently
  prints "Active backlog depth exceeded (active=10, max=6)" on every send
  because of it.

  WHY it happens - the mechanism is a safety measure applied to the one
  caller it does not fit. `commitApprovalWrites`
  (`extension/src/util/commitIntegrityRunner.ts:47`) locates the ticket via
  `findBacklogFilePath` and commits that ONE repo-relative path. Its own
  comment explains the scoping as deliberate: pathspec-scoped "so a
  concurrent writer's own commit can never sweep this one in or out"
  (BL-419/BL-490). That reasoning is exactly right for the two callers that
  edit a ticket in place - `telegramFrontDeskBotCore.ts:1169`
  (Approve/Reject/Amend) and `bridgeServer.ts:820` (Approve) - each of which
  touches one path. Expedite is the only caller that MOVES the file:
  `promoteToActive` (`extension/src/panel/backlogWriter.ts:86`) renames
  paused/ -> active/, and a rename is two paths. `findBacklogFilePath` then
  resolves the ticket's FINAL path, so the source is never named and never
  staged.

  So the blast radius is precisely one call site,
  `commitExpediteWrites` (`telegram-front-desk-bot.ts:2134`) - the other two
  callers are correct as they stand and must stay single-path.

  How (direction, not mandate): the underlying `commitPaths` helper already
  takes a plural `relPaths` and spreads it into repeated `--path` arguments,
  so the commit layer needs no change. What is missing is the source path:
  `BacklogMoveResult` (`backlogWriter.ts:48`) carries only
  `{ moved, destination? }`, so the pre-move path is discarded before the
  commit step can name it. Surfacing the source on that result is the
  smallest change that makes the second pathspec available; recomputing it at
  the commit site would also work.

  NOTE the sibling movers: `parkToHold` and `reinstateFromHold`
  (`backlogWriter.ts:96`/`:108`) are the same find-then-rename shape and would
  carry the same defect if they are ever committed through a single-path
  helper. They are NOT in this ticket's scope - check them, and if either is
  already affected, say so in a bounce rather than widening this parcel.

  OUT OF SCOPE: cleaning up the 8 already-duplicated ids. That is coordinator
  bookkeeping, surfaced separately; this ticket stops new ones being created.
qa_e2e_procedure: >
  1. Seed a scratch target repo with a ticket in `backlog/paused/` carrying
     `human_approval: pending`. Drive the Expedite verb against it.
  2. `git show --stat HEAD` on the resulting commit - it must report BOTH a
     deletion under `backlog/paused/` and an addition under `backlog/active/`
     for that ticket. A stat line reading only `N insertions(+)` is the
     defect reproducing.
  3. `git status --short` must be clean afterwards for that ticket - no
     uncommitted deletion left in the working tree. This is the half that
     actually bites: the disk state looks right immediately after the run, so
     step 3 is what distinguishes a real fix from a cosmetic one.
  4. `find backlog -name 'BL-<id>-*.yaml'` returns exactly ONE path.
  5. Regression on the two in-place callers: exercise Approve (bridgeServer)
     and Approve/Reject/Amend (front-desk core) and confirm each still commits
     exactly one path - the pathspec narrowing they rely on must be intact.
  6. Repo-wide disjointness check, which is also the standing guard for
     invariant 2:
     `find backlog -name 'BL-*.yaml' | grep -oE 'BL-[0-9]+' | sort | uniq -d`
     must print nothing on a repo where the fix has been in force.
notes: >
  No `required_wiring:` on this ticket, deliberately. The value here is in the
  CONTENT of a commit, and scenario 01 plus e2e steps 2-3 gate that content
  end-to-end, so the fix cannot ship green-but-unwired - which is the failure
  `required_wiring:` exists to catch. Pinning a pattern would also mean
  guessing the identifier the implementer will choose for the surfaced source
  path, and a pattern that never matches arms the gate against a string nobody
  writes (BL-874).

  Provenance: found on 2026-08-23 by the specifier, not reported by a peer.
  Chased from an "Active backlog depth exceeded (active=10, max=6)" warning
  printed by an unrelated `swarm_handoff.sh` note; the accused component was
  initially the expeditor (`expedite_lib.bb`, whose `move-ticket!` correctly
  uses `git mv` and is innocent here) before the commit authorship trail led
  to the Telegram front-desk bot's Expedite verb.

  IR-DRY disposition (checker run, not skipped): the report ends on two
  `possible-synonym` findings, both reviewed and deliberately KEPT.
  "a ticket in backlog/paused/" vs "already in backlog/active/" is the entire
  distinction between scenarios 01 and 02, and "records a deletion under
  backlog/paused/" vs "records an addition under backlog/active/" is the
  paired assertion that IS the fix. The checker's own suggested_action is to
  normalize only accidental drift; neither is drift. Two earlier findings WERE
  drift and were resolved by merging the duplicate Given/When pair and making
  the in-place writer's Given explicitly folder-agnostic.
