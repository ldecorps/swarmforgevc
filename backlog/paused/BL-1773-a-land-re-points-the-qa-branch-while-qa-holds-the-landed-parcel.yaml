human_approval: approved
approval_context: >
  Minted approved under the 2026-09-17 operator hotfix (severity high
  defect, no choice posed, no ruling_options). New feature file. FIRM:
  only the in_process guard changes, and only for a parcel whose task
  names the landed ticket; the uncommitted-change guard, the
  origin/main guard, the keep/drop classification (BL-1467) and the
  skip-never-fails-the-land promise (BL-1438) are unchanged; with no
  landed ticket in view, any in-process parcel still blocks.

invariants:
  - "The re-point never resets a tree while any parcel in its in_process names no ticket or names a ticket other than the one just landed."

description: |
  ## What is wrong

  `post-land-repoint!` (`swarmforge/scripts/land_step_lib.bb` ~line 3089)
  refuses to reset a tree that might hold work. One guard skips when
  `<root>/.swarmforge/handoffs/inbox/in_process` holds any file
  (~line 3134, reason "a parcel in its in_process").
  - QA lands from its own worktree while the parcel it is landing sits in
    exactly that directory: it completes the parcel only after the land
    and the merge-up notes. `done_with_current.sh` then dequeues the next
    parcel at once, so there is no gap to re-point in either.
  - `.worktrees/QA/.swarmforge/daemon/land-repoint.log`: every attempt
    (2026-09-22 07:25, 07:29, 09:10, 09:17; 2026-09-24 08:39) is
    `:skipped "a parcel in its in_process"`.
  - The re-point has never fired from QA's worktree, so `swarmforge-QA`
    accumulates every merge, and QA's own memory (2026-09-26) records the
    land walk at ~2700 branch-only commits, ~20 min.

  Tonight's hotfix db4da5c573 (stamped by BL-1772) added the same
  re-point to `--push`, the path QA's recipe uses. QA note 003247 then
  showed QA had been passing the MASTER root to `--push`. There the
  in_process guard passes, and the re-point tried to reset `main`'s own
  checkout: `.swarmforge/daemon/land-repoint.log` 02:46Z and 02:47Z,
  stopped only by an uncommitted change. The specifier pinned QA.prompt
  to the QA worktree root in the same pass as this mint. That removes the
  master hazard, and it is exactly what makes this guard the one that
  decides.

  ## What is wanted
  - When the re-point knows the landed ticket (`:landed-task-ticket-id`,
    already passed by both `run_land` and `run_push`), a parcel in
    in_process that is a `git_handoff` whose `task:` names that ticket
    (the same `extract-ticket-id` the classifier uses) does not block.
  - Any other in-process file still blocks with the same reason, exactly
    as today:
    - a parcel naming another ticket;
    - a note, or a file naming no ticket;
    - an unreadable file;
    - a second file beside the landed one.
  - With no landed ticket in view (an old caller, a hand-run `repoint`),
    any in-process parcel still blocks.
  - After a proceed, the rest of the re-point is unchanged: dirty-tree
    guard, keep/drop classification, `LAND_REPOINTED` / `LAND_REPOINT_KEPT`
    / `LAND_REPOINT_DROPPED` lines.
  - BL-1438's scenario 02 row "a parcel in its in_process" stays green.
    Its fixture parcel carries no `task:`, so it names no ticket; nothing
    of BL-1438's is retired.

  ## How (direction, not mandate)
  - Read each in-process file's header lines (plain `field: value`, the
    handoff draft format) for `type:` and `task:`; any read or parse
    failure counts as blocking (fail-closed, as the guard already is).
  - The feature's fixture: a mkdtemp origin plus a clone standing in for
    the QA worktree (BL-1390), driving `land_step_cli.bb repoint <root>
    <task>` (the verb run_push calls).

  ## Scope
  - `swarmforge/scripts/land_step_lib.bb` (the guard),
    `swarmforge/scripts/test/land_step_lib_test_runner.bb`.
  - The feature, `specs/pipeline/steps/bl1773RepointLandedParcelInProcessSteps.js`,
    `specs/pipeline/steps/index.js`.
  - The land how-to naming the skip reasons (documenter), and evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1773-a-land-re-points-the-qa-branch-while-qa-holds-the-landed-parcel.feature`:
     all ok (1 + 3 rows). Record the duration.
  2. `node specs/pipeline/cli.js specs/features/BL-1438-the-publish-re-points-the-qa-branch-after-a-land.feature`:
     all ok (its in_process row still skips).
  3. `bb swarmforge/scripts/test/land_step_lib_test_runner.bb`: ALL PASS.
  4. After landing, THIS parcel's own land, published from `<qa-worktree>`
     with the landed code, prints `LAND_REPOINTED` or
     `LAND_REPOINT_SKIPPED` naming an uncommitted change, never "a parcel
     in its in_process". Record which. A dirty-tree skip is BL-1772's
     probe item 3, not a defect here. Quote the new
     `.worktrees/QA/.swarmforge/daemon/land-repoint.log` line in your
     evidence.
  5. `git diff main...HEAD --name-only` names only the Scope files and
     evidence.

