id: BL-1773
title: "The post-land re-point that BL-1438 (--land) and hotfix db4da5c573 / BL-1772 (--push) run after LAND_PUBLISHED skips on every land from QA's worktree - its guard refuses 'a parcel in its in_process', and QA always lands while the parcel being landed is in its in_process (land-repoint.log: every QA-worktree attempt since 2026-09-22 skipped for exactly that) - so the QA branch never converges and every land keeps walking ~2700 leftover commits (~20 min): an in-process parcel whose task names the landed ticket no longer blocks; any other in-process parcel still does"
milestone: M8
type: defect
severity: high
# high: a live fault degrading delivery. The operator had Cursor hotfix
# --push tonight precisely to end the ~20 min walk per land; with this
# guard the hotfix can never fire from the recipe QA runs, and BL-1772's
# own premise ("the next clean --push away from shrinking") does not
# hold. Not critical: lands still succeed, slowly.
