description: |
  ## What

  The Reorder epics screen lists every paused `type: epic` tracker, including
  ones with no live children. A tracker with nothing under it is a shell: it
  occupies a tile, and — worse — it occupies a Move up / Move down NEIGHBOUR
  slot, so a tap intended for a real epic can land on a shell instead.

  This is a REVIEW ticket, not a rewrite ticket. The behaviour is written and
  the human has locked its semantics. Confirm or refute the implementation
  against what is locked below; fix what the gates find; do not redesign it
  and do not start over.

  ## Locked by the human — verbatim, not negotiable

  > - A paused `type: epic` is shown on Reorder epics only when at least one
  >   live child exists (`paused/` + `hold/` + `active/`, never `done/`, never
  >   another epic tracker). Membership stays slug-resolved (BL-686).
  > - Childless trackers stay in `backlog/paused/` unchanged; they are omitted
  >   from the tile list **and** from Move up / Move down neighbours so a
  >   hidden shell cannot swallow a tap.
  > - Make-top's domination set is unchanged (still the full paused-epic list
  >   via its own reader).

  Read the third bullet carefully, because it is the one a reviewer is most
  likely to "helpfully" break: hiding is a VIEW concern only. Make-top still
  dominates against every paused epic, including the hidden ones. A tracker
  being invisible must never change what make-top computes.

  ## Already on disk — keep it, per the human's instruction

  Verified present in the master checkout at spec time:

  - `extension/src/bridge/epicTopicSlugMatch.ts` — `filterEpicsWithTopics`
    (exported, line 59)
  - `extension/src/bridge/bridgeServer.ts` — shared
    `readEpicReorderMembership` (line 882), consumed by both GET
    `/epic-reorder-state` (line 889) and POST `/epic-reorder/move` (line 998)
  - `extension/src/bridge/epicReorderUiHtml.ts`
  - tests in `epicReorderBridge.test.js`, `epicTopicSlugMatch.test.js`,
    `epicTopicSlugMatch.property.test.js`
  - `docs/how-to/BL-572-console-epic-priority-reorder.md` updated to match

  Diffstat: 7 files, +231/-75.

  That both endpoints go through ONE shared reader is the load-bearing
  detail. It is what makes the second locked bullet true by construction —
  the list you see and the neighbours a move resolves against cannot drift
  apart if they are the same read. A review that splits them back into two
  readers would satisfy the tests and reintroduce the bug.

  ## What the review must actually check

  - The three locked bullets hold, including the make-top one.
  - `done/` is excluded and an epic tracker never counts as its own child —
    both are stated in the locked bullet and both are easy to get subtly
    wrong under slug resolution.
  - Slug resolution is still BL-686's, not a second parallel implementation.
  - The normal gates: coverage, no surviving mutants, CRAP <= 6, DRY.

  ## Scope

  The files listed above. Not the make-top reader, not BL-686's slug
  resolution, not the epic YAMLs themselves.

invariants:
  - "The tile list and the Move up / Move down neighbour set are always derived from one read — no code path can make them disagree."
  - "Hiding is presentation-only: no epic YAML is written, moved, or reordered on disk as a result of being hidden, and make-top's domination set is unaffected."

qa_e2e_procedure: |
  Against a fixture backlog, then the live console:

  1. HIDDEN. A paused epic tracker with zero live children is absent from
     GET `/epic-reorder-state` and its YAML is untouched on disk.
  2. SHOWN, EACH FOLDER. A tracker with exactly one child in `paused/`, then
     one in `hold/`, then one in `active/` — shown in all three cases.
  3. NOT SHOWN BY A DONE CHILD. A tracker whose only child is in `done/` is
     hidden. This is the boundary the locked bullet names explicitly.
  4. NOT ITS OWN CHILD. A tracker whose only slug match is another epic
     tracker is hidden.
  5. THE TAP-SWALLOW REGRESSION. With a childless tracker positioned between
     two live epics, POST `/epic-reorder/move` "up" on the lower live epic.
     It must swap with the live epic ABOVE the shell, not with the shell.
     This is the behaviour the human filed the intake for.
  6. MAKE-TOP UNCHANGED. Make-top a live epic while a childless tracker
     exists; assert its resulting priority dominates the childless tracker
     too — hiding must not have shrunk the domination set.
  7. LIVE. Open Reorder epics on the phone console against the real backlog
     and confirm the screenshot complaint is gone: no empty epics listed, and
     Move up / Move down land where they look like they will.

