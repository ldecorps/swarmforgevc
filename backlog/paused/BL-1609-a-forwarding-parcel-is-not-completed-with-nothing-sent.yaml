id: BL-1609
title: "A forwarding git_handoff is completed with nothing sent: done_with_current has no evidence gate for parcels (BL-1422's gate covers Work notes only), so on 2026-09-16 the architect completed the cleaner's re-forwards of two fixed bounces 14 and 10 seconds after dequeue with no merge, review or forward, and BL-1595 and BL-1547 stalled 58 and 79 minutes until the coordinator chased; a code-worktree role completes a forwarding parcel only with a git_handoff for its ticket queued since dequeue or a stated no-op reason recorded on the completed file, on the task and batch paths alike, and BL-1422's git_handoff row retires"
milestone: M8
type: defect
severity: high
# high: a live fault degrading behaviour on the default pack - every
# re-forwarded fixed bounce reaching the architect stalled until chased
# today (coordinator notes 008873, 008894), the same lane BL-1605's
