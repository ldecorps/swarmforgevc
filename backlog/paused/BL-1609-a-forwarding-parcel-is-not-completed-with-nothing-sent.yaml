human_approval: pending
approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: the gate is BL-1422's
  shape - a forwarding git_handoff inbound held by a code-worktree role
  leaves in_process only when a git_handoff whose task names the same
  ticket was created after the dequeue in that role's outbox or sent
  mailbox, or when the role states a reason with --no-op that is stamped
  on the completed file as no_op_reason; a refusal names the ticket and
  both ways out and touches nothing. FIRM: a non-forwarding inbound
  (merge-only, Article 2.4) and a master-resident role (roles-table
  worktree-name master: specifier, coordinator - BL-1515's second roster
  shape) complete exactly as today. FIRM: the batch path applies the rule
  per item and refuses once naming every unforwarded forwarding item.
  FIRM: BL-1422 scenario 04's row "a git_handoff carrying a task" is
  retired, never reworded (BL-1006); its note row stays. FIRM: the No-Op Rule's clarification in
  handoff-protocol.md and the architect prompt bullet landed with this
  mint (specifier prose, BL-798), not the parcel's to write.

invariants:
  - "A code-worktree role's forwarding git_handoff inbound never leaves in_process without either a git_handoff for its ticket queued after its dequeue or a stated no-op reason recorded on the completed file; a non-forwarding inbound and a master-resident role complete exactly as today."
  - "A refusal has no side effects: the in_process file or batch, every sidecar and the mailbox are byte-identical after it, and the same invocation with the evidence in place then completes."

description: |
  ## What is wrong

  Mailbox trail for BL-1595 (architect worktree,
  `.swarmforge/handoffs/inbox/completed`, times Z):

  ```
  17:36:39  coordinator -> cleaner   note   "BL-1595: your fix 37a06e7417 never forwarded to architect - send it"
  17:37:11  cleaner -> architect     git_handoff 000752  commit 37a06e7417  (non-forwarding absent)
  17:37:16  architect dequeued 000752
  17:37:30  architect completed 000752         (14 s; reflog: no merge; no evidence; nothing sent)
  17:37:44  architect merges 5d1cf75373 and works BL-1554 until 17:43
  18:35:33  coordinator -> architect  note   "BL-1595: completed 37a06e7417 17:37, never fwd to hardener - resume"
  18:36:08  architect commits "BL-1595: architect review pass evidence (NONE)" 8d96211254
  18:38:13  architect -> hardender   git_handoff 002106
  ```

  BL-1547 is the same shape: 000756 (6cd22a3ec0) dequeued 17:44:16Z,
  completed 17:44:26Z, chased 19:03:27Z (note 008894), still with the
  architect at mint. Telemetry shows two short model turns per completion
  (17:37:19Z, 17:37:23Z; 140 and 195 output tokens). The coordinator's
  correction (note 008895): "architect (not cleaner) drops fwd x2
  today". Both waves are real - the cleaner's batch closed at 16:50:40Z
  with the bounce and its merge-only twin and no forward (BL-1605's
  mechanism), and the architect then completed each re-forward with
  nothing sent - so BL-1605 stands and this ticket owns the second drop.

  Why it could happen, twice, in seconds: both fix commits were
  evidence-only ("relocate cleaner evidence to backlog/evidence"), and
  handoff-protocol.md's No-Op Rule read "a role must not send or forward
  a git_handoff when the received commit produces no functional project
  change ... manifest-only, audit-only". Read against the last hop's own
  diff, that sentence tells the reviewer to complete a re-forwarded fixed
  bounce; read against the parcel it says the opposite. The rule is
  clarified in this mint (the received commit is the parcel, never the
  hop). And nothing mechanical objects: `done_with_current_task.bb`
  gates a Work note's completion on evidence since dequeue (BL-1422,
  `work-note-gate!`, `--no-work "<reason>"`, `no_work_reason` stamp) and
  a released QA hold (BL-1566), but a `git_handoff` completes on sight;
  `done_with_current_batch.bb` has no gate at all. BL-1422's own feature
  pins that: scenario 04's Examples row "a git_handoff" asserts it
  "completes as today" - a slice-boundary assertion this ticket
  falsifies and retires (BL-1006).

  ## What is wanted

  - `done_with_current` on the task path refuses to complete a forwarding
    git_handoff (no `non-forwarding: true`) held by a code-worktree role
    when no git_handoff whose task names the same ticket was created
    after the inbound's dequeue in this role's outbox or sent mailbox,
    unless invoked with `--no-op "<reason>"`; the refusal names the
    ticket and the two ways out and moves nothing (scenario 01,
    invariant 2). With such a git_handoff in outbox or in sent it
    completes plain; with a reason it completes and the completed file
    carries `no_op_reason` (scenario 02).
  - A non-forwarding inbound completes plain with nothing sent (scenario
    03); a master-resident role is not gated (scenario 06; the specifier
    receives tracer-bullet git_handoffs and answers with a note).
  - The batch path applies the same rule per item: a batch holding a
    forwarding parcel with no forward queued for its ticket is refused
    once, naming every such item; with the forward queued it completes
    (scenarios 04 and 05).
  - BL-1422 scenario 04's Examples row "a git_handoff carrying a task"
    retired in the same parcel (retire, never reword; the note row stays;
    the feature keeps its stamp discipline - the hardener re-stamps).
  - A bb unit-test runner for the pure decision (the lane's only gate for
    Babashka).

  ## How (direction, not mandate)

  - `swarmforge/scripts/forward_evidence_lib.bb` (BL-1422's
    `work_note_evidence_lib.bb` split): a pure
    `forward-completion-decision {:forwarding? :master-resident? :evidenced? :reason}`
    -> `:complete-plain | :complete-with-reason | :refuse`. Move
    `sent-handoff-names-ticket-since?` to the lib (or `handoff_lib.bb`)
    so both helpers share it; the ticket id comes from the inbound's
    `task` header through `pipeline-stage-lib/extract-ticket-id`.
  - `done_with_current_task.bb`: `forward-gate!` beside `work-note-gate!`,
    stamping `no_op_reason` the way `no_work_reason` is stamped; a
    non-forwarding inbound short-circuits to `:complete-plain`.
    Master residency from `handoff-lib`'s roles table (`worktree-name`
    "master"), never a role-name list (BL-1515).
  - `done_with_current_batch.bb`: gather every forwarding item's verdict
    first, refuse once with all of them (Article 4.4's shape), else
    proceed; `--no-op` applies to the whole batch.
  - `dispatch_lib.bb`: `--no-op "<reason>"` accepted by the same
    `refuse-unexpected-args!` family as `--no-work`, blank reason refused.
  - Scenarios drive the real helpers against a fixture swarm root (the
    BL-1422 handler's fixture, extended with a batch mailbox and two
    master-resident rows); all in seconds (BL-1541).
  - Documenter: handoff-protocol.md's `done_with_current` section names
    the gate and `--no-op`; `docs/diagrams/handoff-flow.mmd` if it draws
    the completion step (registry trigger: the handoff file lifecycle and
    its gates - this adds a gate; update if drawn).

constraints: >
  done_with_current_task.bb, done_with_current_batch.bb, dispatch_lib.bb,
  one new pure lib and its bb runner, handoff_lib.bb only if the shared
  reader moves there, the feature and handler, BL-1422's feature (one
  row retired), evidence and docs. No change to swarm_handoff.bb, the
  send gates, ready_for_next*, or any role prompt (the prose landed with
  the mint). The step handler lands with the feature (BL-233). Evidence
  named BL-1609-*.

out_of_scope: |
  - The merge-only twin that blocks a batch role's re-forward (BL-1605,
    lands first).
  - The coordinator's dropped-parcel sweep reading `no_op_reason` into
    its chase note (a follow-up once the stamp exists).
  - Why the architect's seat ran a review-free turn (prompt clarified
    with this mint; the gate makes the outcome impossible either way).

qa_e2e_procedure: |
  On the parcel commit:
  1. `bb swarmforge/scripts/test/forward_evidence_lib_test_runner.bb` (or
     the runner the coder names) -> green.
  2. Acceptance resolving all six scenarios
     (`bash specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1609-*.feature`)
     and BL-1422's feature still resolving with its retired row gone
     (`... specs/features/BL-1422-*.feature`).
  3. Live probe on the parcel's own chain: at each stage after the coder,
     run `done_with_current.sh` BEFORE sending the forward -> refused
     naming this ticket; send the forward; run it again -> completes.
     Record both outputs in the stage's evidence.
  4. `grep -c 'forward-gate!' swarmforge/scripts/done_with_current_task.bb swarmforge/scripts/done_with_current_batch.bb`
     -> at least 1 each.

