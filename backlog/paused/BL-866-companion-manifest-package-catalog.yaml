description: |
  ## What this slice adds

  The bridge gains the contract every later offline slice reads:

  - **A companion-manifest.** One authorized request lists each available
    package — backlog, docs tree, and the other corpus slices as they arrive —
    with its **generation** and its **format version**.
  - **Packages served against that generation.** A package body always carries
    the generation the manifest advertised for it, so a client that caches by
    generation can trust what it holds.
  - **Cheap refresh.** A client that names the generation it already holds is
    told the package is unchanged and receives no body. This is what makes the
    refresh silent, and it is what keeps the BL-659 corpus (~2-3 MB compressed)
    affordable to keep current on a phone.
  - **Honest availability.** A package whose source cannot be read is not
    advertised; one that became unreadable after being advertised is refused
    with a reason rather than served as an empty package. An unknown package
    name is refused clearly.
  - **Authorized only.** The manifest and the packages sit behind the bridge's
    existing client authorization, like the other bridge endpoints.

  Bridge-side only, and fully covered by the Node unit suite — no device, no
  emulator, no phone-side work in this slice.

  ## Not in scope

  - The phone-side fetch, cache, offline read path and "as of <generation>"
    labelling — a later slice of BL-865.
  - The offline groom mutation outbox — a later slice of BL-865.
  - Native Kotlin panels / the BL-659 retarget — a later slice of BL-865, and
    the retarget itself is still awaiting the human's confirmation on BL-865.
  - Protobuf. Deferred by the human; this slice is the REST + JSON contract.

acceptance: specs/features/BL-866-companion-manifest-package-catalog.feature

qa_e2e_procedure: |
  Against a running bridge with a real target repo:

  1. Request the companion manifest with a valid token — expect each available
     package listed with a generation and a format version.
  2. Request the backlog package — expect a body carrying the generation the
     manifest advertised.
  3. Re-request naming that generation — expect an unchanged answer and no
     body on the wire (check the response size, not just the status).
  4. Change the backlog on disk so the generation moves, re-request naming the
     old generation — expect the new body at the new generation.
  5. Make a package source unreadable, request the manifest — expect it absent
     from the listing while the others remain; request it directly — expect a
     refusal with a reason, not an empty package.
  6. Repeat step 1 with no token and with a bad token — expect refusals.

notes: |
  The generation is the cache key the whole epic depends on: the phone-side
  slice caches by it, the outbox slice will reconcile against it. Whatever
  identifies a generation must change whenever the package content changes, or
  a phone will hold stale data believing it is current — worth the architect's
  attention on this slice specifically.

  Format version is carried from the start, deliberately: the intake notes that
  with REST + JSON "schema discipline is social (`format`/`version`) not
  generated", so the version field is the discipline this contract does have.
