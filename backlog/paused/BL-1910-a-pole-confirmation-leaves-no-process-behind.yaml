  On the parcel commit, ONE run each:
  1. `node specs/pipeline/cli.js specs/features/BL-1910-a-pole-confirmation-leaves-no-process-behind.feature`:
     2 of 2 ok.
  2. Measured at mint on main after 9bbd0f461c, same expected:
     BL-1633's feature 5 of 5, BL-1761's 2 of 2, BL-1721's 3 of 3, BL-914's
     5 of 5, BL-969's 2 of 2, BL-935's 11 of 11 (`specs/features/BL-1633-*`,
     `BL-1761-*`, `BL-1721-*`, `BL-914-*`, `BL-969-*`, `BL-935-*`), and
     `npx vitest run confirmPoleAloneOutcomeShapes` from extension/
     3 passed (7 s).
  3. Afterwards, `ps -eo pid,ppid,args | grep vitest` lists no vitest process
     from those runs.
  4. ONE run each with `npx vitest run --config vitest.properties.config.mjs`
     from extension/: bl1892TerminatedLandNeverPushesLockless (1 passed,
     141 s alone at mint) and bl1529ScriptSenderAuditOutcomesInvariant (1
     passed, 88 s alone at load 18).
  5. ONE run each: `npx vitest run stepHandlerModuleLoadBudget` from
     extension/ (8 passed at mint), and BL-389's and BL-379's features
     (`specs/features/BL-389-*`, `BL-379-*`), 5 of 5 each at mint.

