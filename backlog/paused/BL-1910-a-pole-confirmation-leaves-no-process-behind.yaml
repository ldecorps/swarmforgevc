id: BL-1910
title: "recordTestDuration.js's confirmPoleAlone times out with spawnSync, which signals only the vitest process it started, so vitest's forked workers are orphaned and keep running; on the loaded swarm host that feeds itself (BL-1904's unit run failed four unrelated files at load about 44); a confirmation now leaves no process behind. Also the stamp-off of hotfix 9bbd0f461c (five step handlers that went red when the contracts under them moved: BL-1633, BL-1761, BL-914, BL-969, BL-935)"
milestone: M8
type: defect
