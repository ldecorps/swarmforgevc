source: |
  Coder note 002365 (2026-10-03 01:22Z), verbatim: "recordTestDuration
  confirmPoleAlone timeout orphans vitest workers under load". The coder's
  BL-1904 evidence (worktree, 2026-10-03), verbatim: "On an earlier run at
  load around 44, four files failed: startBridgeHeadlessCli,
  confirmPoleAloneOutcomeShapes, stepHandlerModuleLoadBudget (naming another
  handler) and bl1652HandoffdRespawnReadingsWiring. All four then passed
  alone ... The runaway that load came from, orphaned `vitest` workers left
  by `recordTestDuration.js` confirmPoleAlone's timeout kill, was noted to
  the specifier (002365)."
  Specifier trace, 2026-10-03: confirmPoleAlone (recordTestDuration.js)
  calls spawnSync(vitest, [...], { timeout: 3 * PER_FILE_DURATION_BUDGET_MS,
  stdio: 'ignore' }). spawnSync's timeout sends killSignal to that one child
  only, and spawnSync cannot start the child in its own process group.
  Measuring the confirmer's features for this ticket found two unowned
  reds, and checking the handlers that touch the vitest config found three
  more; all five are hotfixed in 9bbd0f461c (see description).

description: |
  ## What is wrong

  A confirmation that hits its timeout kills the vitest parent and leaves
  its forked workers running with no parent waiting on them.

  ## What is wanted

  - When a confirmation times out, every process it started is gone before
    confirmPoleAlone returns, and it still returns {failed} naming the
    timeout. A confirmation that finishes is unchanged.
  - Direction, not mandate: start vitest as the leader of its own process
    group (an async spawn with detached: true, waited on synchronously
    enough for the guard's synchronous caller, or a small wrapper) and
    signal the whole group on timeout, TERM then KILL after a short grace.
    Keep it working on macOS bash 3.2 hosts, so no setsid binary and no
    GNU-only timeout flags.
  - A seam for the timeout so scenario 01 runs in seconds (an optional
    argument or an env override read only by this function). The default
    stays three per-file budgets.
  - Step handler `bl1910ConfirmationLeavesNoProcessSteps`, registered in the
    same parcel. The fixture test file lives in a mkdtemp directory outside
    extension/test/ (BL-1390, as BL-1633's scenario 03 does). To find "every
    process the confirmation started", mark them, for example with an env
    variable unique to the scenario that every descendant inherits, and look
    for it after the call (/proc/<pid>/environ on Linux, `ps eww` on macOS).
    Matching by command line does not work: vitest's worker command lines
    do not name the test file.

  ## Stamp-off of hotfix 9bbd0f461c (review it, do not re-apply)

  Measured at mint with no register row: BL-1633's feature 0 of 5,
  BL-1761's 1 of 2, BL-914's 0 of 5, BL-969's 0 of 2, BL-935's 0 of 11.
  - bl1633NewPoleConfirmedAloneSteps.js: BL-1721 (2026-09-24) made a
    confirmation an outcome, {ms} or {failed}. This handler's fake
    confirmers still returned bare numbers and its real-confirmer checks
    expected a number. Both now use the outcome shape. Scenario 04 takes
    the fastest of up to three samples (one sample read 9.2 s; then 8.3 s
    and 3.8 s at load ~20, no code change).
  - bl1761ConfirmPoleAloneSandboxSteps.js: since BL-1867 (2026-10-02)
    vitest.config.mjs names a global teardown under test/helpers/. The
    sandbox fixture lacked test/helpers, vitest failed to load, and the
    report had no entry. The fixture now links test/helpers.
  - bl914PerTestTimeoutSteps.js and bl969BurndownNoflagsTimeoutSteps.js:
    since BL-1007 (2026-08-24) the config declares its default as
    resolveUnitLaneTimeout(20000) and the literal testTimeout: <number>
    they parsed is gone; they now read that base. BL-914 also follows
    BL-579's test renames ("the two maintained diagrams" became "the
    maintained diagrams").
  - bl935VitestForkPoolSteps.js: BL-1651 (2026-09-19) halved
    PER_WORKER_HEAP_MB, so the fixture RAM is derived from the exported
    constants; the real-config scenario patches os.platform inside its own
    subprocess (the swarm host moved from macOS to Linux), and reads the
    config's last output line (a [property-lane-budget] log line had made
    the property lane read NaN).
  Say in the evidence whether each stands, the os.platform patch above all.

  ## Stamp-off of hotfix b7db6f9ed1 (review it, do not re-apply)

  Added 2026-10-03: QA note 003741 (evidence ff09912f8d) held BL-1897 on two
  property reds with no owner. Same review as above.
  - bl1892TerminatedLandNeverPushesLockless.property.test.js: moment and
    target were drawn uniformly 16 times, then asserted reached twice each;
    pre-push came up once (about a 1.4% draw). Now moment x target is
    iterated by construction (runsPerCell over 18, assertReachFloor), signal
    and delay still random. Confirm the remaining midRepoint and honoured
    floors are outcomes of timing, not draws.
  - bl1529ScriptSenderAuditOutcomesInvariant.property.test.js: each cell's
    property draws fc.constant(null), so its second run repeated the first;
    it now runs once per cell. Confirm no assertion and no coverage was lost.

  ## Stamp-off of hotfix d39ed089f0 (review it, do not re-apply)

  Added 2026-10-03: QA note 003745 (evidence c703bbc70f) held BL-1891 on
  stepHandlerModuleLoadBudget.test.js: aDroppedMessageMustNotParkTheOffsetSteps.js
  cost 635.8 ms of incremental require time (budget 400 ms), with no owner.
  Its three compiled modules and its sibling handler are now lib/lazy.js
  getters called inside the steps. Confirm no step reads them at load.

  ## Scope

  extension/scripts/recordTestDuration.js (confirmPoleAlone), its step
  handler, the five handler fixes under review, evidence.

  ## Out of scope

  Reaping orphans other runs already left (the orphan janitor's job,
  BL-1907). The per-file budget itself.

