id: BL-1462
title: "BL-968's acceptance handler reads the live checkout instead of its fixture: scenario 03 hard-codes backlog/active/BL-968-*.yaml, which moved to backlog/done on 2026-08-20 (red since, hidden by the per-feature runner, found 2026-09-07 by the coder running BL-1450's e2e), and scenario 04 asserts the CURRENT checkout is a linked worktree, so the feature is green under .worktrees/ and red from the master checkout; the handler finds the ticket wherever bookkeeping put it and locates a role worktree itself"
milestone: M8
type: defect
severity: high
# high (standing-red rule 2026-09-05): an acceptance-lane feature red on
# main for 18 days, never a load flake, and now a register row. The
# production code it guards (BL-968's lazy step-file loading) is untouched
# and fine; what is broken is the safety signal, which is exactly what the
# rule refuses to call medium.
