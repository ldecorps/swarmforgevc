description: |
  ## What is wrong

  Coder note 002206 (2026-09-27 07:14Z), verbatim: "unowned-red:
  test_openrouter_provider_support.sh - see BL-1708 evidence". Coordinator
  note 012772 (2026-09-28 08:00Z), verbatim: "unowned-red
  test_openrouter_provider_support.sh - BL-1708 probe, see evidence". The
  BL-1708 coder evidence (goal 5, on the coder branch) ran the test once
  and got `FAIL: 03: cleaner should be OpenRouter`.

  Measured at mint on main (2026-09-28): the same failure, 0.6 s per run.
  Bisected by exporting `swarmforge/scripts` at each commit and running the
  test from the export: red at 4ed88430b2 (2026-09-01, the hotfix that
  put the bob mono-router on Token Plan and added
  `extra_cli_targets_qwen_cloud`), red at d7025811 (09-03) and f86be42f
  (09-09, BL-1328); the 08-29 exports printed no verdict line. So the red
  is 27 days old.

  Cause, read from `write_role_launch_script` (swarmforge.sh around line
  2186): for a claude agent the billing guard checks
  `extra_cli_targets_qwen_cloud "$extra_cli"` (any `--model qwen*`) BEFORE
  `role_uses_openrouter "$role"`, and BL-1328's comment says this order is
  deliberate ("the human's BL-1324 ruling asked for exactly this") and
  that "no live pack combines the two today, which is the only reason this
  is dormant rather than broken". The test's fixture conf is that
  combination: `window cleaner claude cleaner --model qwen/qwen3-32b`, and
  case 03 sets `SWARMFORGE_OPENROUTER_ROLES="coder cleaner"`. The
  cleaner's launch script therefore carries the Token Plan remap, not
  `openrouter.ai`.

  The evidence's own reading ("command not found:
  terminal_backend_can_open_sessions ... unrelated to anything this parcel
  touches") names a line the test prints on every run, green or red:
  `test_aider_seat_launch_config.sh` prints it and passes ALL PASS. It is
  noise from sourcing swarmforge.sh without a terminal adapter, not the
  failure.

  ## What is wanted

  The fixture conf pairs no `--model qwen*` slug with any role, so an
  OpenRouter-listed role reaches the `role_uses_openrouter` branch, and
  the test is green on main. Every existing assertion stays word for word.

  How (direction, not mandate): replace the cleaner's slug with a non-qwen,
  non-glm OpenRouter slug in the same shape as the others (for example
  `mistralai/mistral-large`); the `--model` value is inert for what the test
  asserts. Leave the coder, architect and documenter lines alone unless a
  case needs them.

  ## Scope
  - `swarmforge/scripts/test/test_openrouter_provider_support.sh` (fixture
    conf only).
  - The feature file and its step handler `bl1791OpenrouterFixtureSteps`,
    registered in `specs/pipeline/steps/index.js` in the same commit as
    the feature (BL-233).
  - The standing-red register row naming BL-1791. The land removes that
    row (BL-1631); a parcel never edits `backlog/standing-reds.tsv`.

  ## Not in scope
  - The BL-1328 precedence asymmetry: whoever first wants a live
    OpenRouter role on a qwen slug decides it, per the comment at the site.
  - The `terminal_backend_can_open_sessions` noise line.
  - Why a 27-day red went unseen: BL-1625 (the shell manifest as one
    recorded lane) owns that; this ticket is one more row of its evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1791-the-openrouter-provider-tests-fixture-names-no-qwen-slug-on-an-openrouter-role.feature`:
     2 of 2 (measured at mint: the shell run is 0.6 s on main).
  2. `bash swarmforge/scripts/test/test_openrouter_provider_support.sh`:
     ALL PASS, exit 0.
  3. `bash swarmforge/scripts/test/test_aider_seat_launch_config.sh` and
     `bash swarmforge/scripts/test/test_alternate_runtime_launch.sh`:
     ALL PASS on main at mint (2026-09-28, the first measured; the second
     is the pattern the fixture mirrors, run it and record the verdict).
  4. The register row for the file is present on the parcel commit and
     names BL-1791 as owner (the land removes it, never the parcel).
  5. `git diff main...HEAD --name-only` names only the test file, the step
     handler, its registration and evidence; swarmforge.sh is absent.
  6. After the land: REGISTER_ROW_RETIRED for
     `swarmforge/scripts/test/test_openrouter_provider_support.sh`.

