acceptance: specs/features/BL-1362-a-review-pass-records-its-evidence-by-tool.feature

invariants:
  - "A recorded evidence commit always satisfies the review-forward evidence gate: it is committed and it contributes content, so the role can forward THAT commit rather than the bare received hash (BL-536/BL-1293)."
  - "NONE and a D1..Dn inventory take the same path - a clean sweep is recorded, never skipped, and never through a second code path."
  - "The tool records the verdict it is given and never derives one: an inventory that is neither NONE nor a defect list is refused, never written as empty."

