approval_context: >
  Inherited from BL-1743 (approved) with no new scope. FIRM: every probe
  still proves its test red against the broken copy - no probe is deleted
  or weakened.

invariants:
  - "No test or step handler writes a file under the checkout it runs from to build a broken copy of a script; every broken copy lives under a temporary root that its run removes, and a root whose recorded owner pid is dead is reaped by the next probe run."

description: |
  ## What is wanted
  - Each site below builds its broken copy with BL-2116's
    createScratchRoot(prefix) and writeBrokenCopy(root, realPath,
    transform) and calls cleanup() in its finally. The copy sits at its
    repo-relative path inside the root, so bl1630's require of the copied
    helper and bl943's runner's relative loads resolve to the real tree.
    Every probe still fails its assertion against the broken copy.
  - The feature's handler, bl2118ProbeCensusSteps.js, derives the census
    as "every file under extension/test and specs/pipeline/steps that
    builds a broken copy of a script, whichever way" (a non-vacuity probe
    writing a mutated copy of a file it read: the old path.join pattern
    or a writeBrokenCopy call), checks no derived broken-copy path is
    under the checkout, and pins the population at the 9 files of the
    2026-10-07 re-census: bl1458, bl1459, bl1505, bl1630, bl1652, bl1671,
    bl1835, bl938, bl943 (BL-1445: a derivation that finds fewer is red).

  ## Sites (read with offset and limit around each line, never the whole file)
  - extension/test/bl1630NoStepHandlerModuleLoadWorkInvariants.property.test.js:124 (writes into extension/test/helpers/)
  - extension/test/bl1671MergeDeletionGuardInvariants.property.test.js:117
  - specs/pipeline/steps/bl938AgedNoteRotateFixtureRotationRouterSteps.js:212
  - specs/pipeline/steps/bl943FixtureCleanupVerdictSteps.js:223 (writes into swarmforge/scripts/test/)
  The salvage stash (see BL-2117) also swaps bl1630; reference only.

qa_e2e_procedure: |
  On the parcel commit, ONE run each.
  1. `node specs/pipeline/cli.js specs/features/BL-2118-no-probe-writes-beside-a-live-script.feature`: 1 of 1 ok.
  2. Read from the gather's property row: bl1630 and bl1671 green.
  3. The features whose handlers changed, once each, all ok: the BL-938
     and BL-943 features (`ls specs/features | grep -E '^BL-(938|943)-'`).
  4. BL-1743's census grep over extension/test and specs/pipeline/steps:
     no match.
  5. `git diff main...HEAD --name-only` names only the four files, the
     feature, its handler, and evidence.

