notes: |
  Minted 2026-09-25 by the specifier, 1:N split of the onboarding intake
  (epic BL-1755). Gaps 1 and 3 are one ticket: "whatever Gap 1's fix
  installs, make sure the engine it installs actually understands the
  config vocabulary of whatever pack it ships alongside" is true by
  construction only when both come from one place. Code claims
  re-verified at mint: swarm lines 6 and 16-26 (ARCHIVE_URL, the copy
  block); swarmforge.sh:453-459 (core.hooksPath). gpu-bargain-hunter's
  hand-built tree was inspected read-only (eight role prompts, 249 lines).
  ROLE PROMPTS LANDED (BL-798): 3fc659e997, 2026-09-25, after the human
  tapped ruling A. There are eight prompts under
  swarmforge/starter-kit/roles/ (QA, architect, cleaner, coder,
  coordinator, documenter, hardender, specifier), copied from
  gpu-bargain-hunter's hand-written set with one project-specific ticket
  reference removed, plus swarmforge/starter-kit/README.md. The feature
  was written for A, so nothing was rewritten.
  AMENDED 2026-09-26 by the specifier (still paused, nothing built): the
  installer takes the swarm name as a required argument and the conf it
  writes declares `config swarm_name <name>` (What item 1, scenario 04's
  last line). Source: backlog/INTAKE-second-swarm-telegram-line-to-the-human-20260926.md
  item 3, verbatim: "Wanted: onboarding writes `swarm_name` into the
  target's pack BEFORE provisioning, from the same value." The kit's
  mono-router.conf declares no swarm_name, so without this a kit target
  would default to "primary". Its sibling BL-1776 makes the provisioner
  refuse a name the target does not declare. Not re-pended: this adds one
  line to what ruling A already approved and implements the human's own
  intake. Intake item 2 (the kit's coordinator rule for notify_human.sh /
  human_replies.sh) lands in swarmforge/starter-kit/roles/coordinator.prompt
  once the human answers the intake's open question.
