description: |
  ## What is wrong

  `extension/test/bl1375ApprovedSiblingsCanLandInvariants.property.test.js`
  and `extension/test/bl1678LandNeverShipsUnapprovedForwardInvariants.property.test.js`
  failed in QA's BL-1958 gather, whose property lane took 917 s at a host
  load near 15, and pass alone. Both build git fixtures per run. Alone, the
  slowest invariants take 22.6 s (bl1375 invariant 1, under the lane's
  50000 ms default timeout) and 39.0 s (bl1678 invariant 1, under its own
  120000 ms timeout). The gather keeps a 4000-character excerpt, so which
  invariant failed and how was not recorded.

  ## What is wanted

  1. Record, for each of the five invariants, its time alone and its time
     in a loaded run (the whole property lane while the unit suite runs,
     or the lane's own fork count), and the failure each one shows, if
     any. Commit it: backlog/evidence/BL-1984-coder-<date>.md.
  2. Fix what fails: an explicit per-test timeout set from the loaded
     measurement with stated headroom (bl1678 invariant 1 already carries
     one), or a cheaper fixture. Never lower numRuns or drop an assertion
     (invariant).
  3. Both files pass in a loaded property-lane run, recorded in the same
     evidence.

  ## How (direction, not mandate)

  - Where to read: the test declarations at bl1375 lines 167, 220 and 299,
    and bl1678 line 115 (`{ timeout: 120000 }`); the lane's default timeout
    is `PROPERTY_LANE_DEFAULT_TIMEOUT_MS` in
    `extension/vitest.properties.config.mjs` (~line 140). Do not change
    the lane-wide default: the config's own comment records why per-test
    raises are preferred (BL-871).
  - extension/test/ is QA-only on main; this is an ordinary parcel, so
    that does not bind.

out_of_scope: |
  - The unit work ratchet's load sensitivity: BL-1983.
  - The gather's 4000-character excerpt (it is why the failure went
    unrecorded); a separate ticket if it bites again.

notes: |
