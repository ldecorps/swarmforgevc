qa_e2e_procedure: |
  On the parcel commit, from `extension/`, after `npm run compile`.
  1. `node specs/pipeline/cli.js specs/features/BL-1531-the-approval-ask-explains-each-ruling-option.feature`
     is green; BL-480, BL-589 and BL-1278 feature files still green.
  2. Fixture ticket under a mkdtemp root (BL-1390 fixture rules) with
     `human_approval: pending`, two `ruling_options` of ~150 characters
     (the second marked "(recommended)"), two `ruling_tradeoffs` lines and
     a ~1400-character `approval_context`. Drive one concierge tick over it
     with a captured sendMessage adapter: the captured text lists `A)` and
     `B)` with both full labels and both trade-offs lines, the approval
     context appears whole, the frozen "needs your approval" line is the
     last line, the total is under 4096, and the keyboard's first two rows
     read `A) ...` / `B) ...` with callback_data `rule:<id>:0` / `rule:<id>:1`
     followed by the Approve/Amend/Reject/Q jump and More/Ambulance rows.
  3. Same fixture with `ruling_tradeoffs` removed: the text lists `A)` and
     `B)` labels and no trade-offs line; nothing reads like a placeholder.
  4. Same fixture with a 6000-character approval_context: text length
     4096 or less, context ends with `…`, both labels and the frozen line
     present in full.
  5. Fixture without ruling_options: text has no option block, keyboard is
     the five-button default (BL-589 scenario 03 byte-for-byte).
  6. Tap `rule:<id>:1` on the captured ask: the ticket records
     `human_ruling` with the bare second label (no `B)` prefix) and
     `ruling_provenance: tapped`, as before.
