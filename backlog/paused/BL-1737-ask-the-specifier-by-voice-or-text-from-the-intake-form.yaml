description: |
  ## What is wanted

  - **Transport**: Let's Talk's turn loop as it is. `processLetsTalkTurn`
    (`extension/src/bridge/letsTalkRoutes.ts:324`) takes its agent as the
    injected `agentSession` (`{promptAgent, resetSession, readAgentId}`,
    `cursorBridgeAgentSession.ts:31-39`). Here that is an adapter over the
    draft's BL-1735 session. The turn routes sit under the form and are
    guarded like `/lets-talk/turn`.
  - **The panel** sits inside the form (answer 11) and reuses Let's Talk's
    controls: tap to talk, tap to send, optional hands-free, hold music
    and mute (answer 12, not hold-to-talk). It adds a text box for typing
    instead. Speech-to-text is local whisper.cpp on the bridge host and
    replies are spoken by the phone's `speechSynthesis` (BL-696). No new
    engine.
  - **Replies** are short and spoken-style, with the full text shown under
    the draft.
  - **Changes** the specifier wants arrive as BL-1734 suggestions (the same
    parser, `source: specifier`). Nothing applies without a tap (answer 9).
  - **Transcript**: Submit writes the conversation into the INTAKE file
    beside the Verify history.
  - **Cost**: each turn is one Claude call, the same as a Verify press.

  ## Scope

  - An agentSession adapter over the BL-1735 session; the form's Ask routes
    and panel; the intake writer's transcript section.
  - `specs/features/BL-1737-...feature` + the pinned handler (fake session
    and fake STT/TTS in acceptance).
constraints: >
  Let's Talk's own page, routes and engines are not changed; the Ask panel
  reuses them. Acceptance fakes the session, STT and TTS; the phone's
  audio is the unsuitable boundary.

out_of_scope: |
  - From the intake, for v1: the Bubble Android app and Telegram voice notes
    as Ask surfaces; hold-to-talk.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1737-ask-the-specifier-by-voice-or-text-from-the-intake-form.feature`:
     all ok (5 of 5).
  2. Live on the phone: open a draft, tap talk, ask "is there already a
     ticket for this?", and tap again. The answer is spoken and its text
     shown. Type a question: same.
  3. Ask it to add a scenario: a suggestion appears and the draft is
     unchanged until Accept.
  4. Press Verify: the run log shows the conversation's session id.
  5. Submit.
     Put "QA e2e test - retire on drain" in the notes field; the specifier
     archives that intake without minting.
     The INTAKE file holds the transcript.
  6. Art Director sign-off note on the panel's look (Article 1.10).
  7. `git diff main...HEAD --name-only` names only the Scope files, the
     feature, the handler, docs and evidence.

