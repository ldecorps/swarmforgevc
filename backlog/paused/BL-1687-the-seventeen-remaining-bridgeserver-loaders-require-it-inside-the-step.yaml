description: |
  ## What
  BL-1685's census was a substring grep for `bridge/bridgeServer`. Sixteen
  handlers build the path instead - `require(path.join(EXT_DIR, 'out',
  'bridge', 'bridgeServer'))` at module scope (the coder's finding, note
  000054) - and `bl709BubbleItsOwnTelegramTopicSteps.js` requires it
  inside a module-scope object literal that a `^const` grep does not
  match either. The loader itself settles it: requiring each handler
  alone in a fresh node process and checking `require.cache` for
  `extension/out/bridge/bridgeServer.js`, 29 of the 53 handlers whose
  source mentions bridgeServer load it (232-339 ms each at load 5-9);
  twelve are BL-1685's (bl591 and bl592 do not load it despite their
  column-0 mention) and seventeen are not, in census order:
  bl1634RejectedManifestOffersNoPageFromItSteps, bl551LlmCostLedgerSteps,
  bl565CostLedgerSyntheticPricingSteps, bl709BubbleItsOwnTelegramTopicSteps,
  bl788BubblePairingClientLogsAdoptSteps, bl829BubbleRemotePagePagerSteps,
  bl851SideloadApkPreauthSteps, bl866CompanionManifestPackageCatalogSteps,
  burnRateSteps, deviceRegistrySteps, gateAnswerSteps, gatesListSteps,
  noInboundMessageIsEverLostSteps, operatorProactiveNotifySteps,
  replyRelayAtLeastOnceSteps, standingOperatorTopicSteps,
  telegramTopicThreadsSteps.

  The guard's census is sequential and charges the shared graph to the
  alphabetically first eager loader. Today bl1634 reads 693-734 ms alone
  on the coder's host (259 ms at best); once BL-1685's twelve are lazy it
  is first and pays all of it, every run, then bl551, and so on.
  Adjudication, probe script and the full loader list:
  backlog/evidence/unowned-red-second-bridgeserver-population-adjudication-specifier-20260921.md;
  coder evidence (coder@2 branch):
  backlog/evidence/unowned-red-second-bridgeserver-population-path-join-style-coder-20260921.md.

  ## Why
  A standing red on the guard file bounces unrelated parcels and
  throttles intake (BL-1429); and two text censuses disagreed with the
  loader in one day (BL-1445's fail-open shape, twice). The require
  syntax is not the contract - what the loader loads is.

  ## How (direction, not mandate)
  - In each of the seventeen, move the bridgeServer require inside the
    step (or a small `getStartBridge()` helper called from the step) that
    starts the bridge - the shape BL-1658 and BL-1685 used. Nothing else
    in the handler changes.
  - The feature's handler reuses BL-1658's fresh-child loader intercept
    for scenario 01; scenario 02 lists `git grep -l bridgeServer --
    'specs/pipeline/steps/*Steps.js'` (53 at mint, 54 on main once
    BL-1681's handler landed) and requires each alone,
    asserting none loads the module and that at least fifty were examined
    (a floor over a growing directory, BL-1685's amendment lesson).

  ## Scope
  - The seventeen handlers under `specs/pipeline/steps/` named above
    (require placement only).
  - `specs/features/BL-1687-the-seventeen-remaining-bridgeserver-loaders-require-it-inside-the-step.feature`
    and `specs/pipeline/steps/bl1687BridgeServerLoadersRequireItInsideTheStepSteps.js`
    (same parcel, BL-233, registered in `specs/pipeline/steps/index.js`).
  - The register row for `extension/test/stepHandlerModuleLoadBudget.test.js`
    (re-pointed to this ticket in the mint commit) leaves in this parcel's
    land (BL-1631); the parcel never edits the register. No allowlist
    entry. Documenter: the BL-1630 how-to's lazy-require list gains the
    seventeen and names the probe as the census; no diagram trigger.

qa_e2e_procedure: |
  On the parcel commit, ONE run each.
  1. `cd extension && npx vitest run test/stepHandlerModuleLoadBudget.test.js`:
     green, no handler named over budget, allowlist unchanged by this parcel.
  2. `node specs/pipeline/cli.js specs/features/BL-1687-the-seventeen-remaining-bridgeserver-loaders-require-it-inside-the-step.feature`
     (repo root): all ok - scenario 02's own output states how many
     handlers it examined (at least fifty).
  3. The probe from the adjudication evidence over `git grep -l
     bridgeServer -- 'specs/pipeline/steps/*Steps.js'` prints no
     `"loaded":true` line.
  4. The seventeen features each run green through the runner once
     (about 20 s of registry load per feature - minutes, once).
  5. Register: the land retires the stepHandlerModuleLoadBudget row; the
     report after landing shows no unowned row and no BL-1687 row.

