id: BL-992
title: "active-ticket-yaml-content globs the SENDER'S OWN working tree for backlog/active, so a worktree that has not merged the promotion sees no declaration at all and every required_stages decision silently takes the no-declaration path - measured 2026-08-20, 2 of 7 active tickets were invisible to all six pipeline worktrees"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: pending
priority: 20
direction: swarm-surfaced
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-992-a-declaration-the-sender-has-not-merged-is-still-read.feature

required_wiring:
  - "specs/pipeline/steps/index.js::bl992::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "A declaration present on the freshest available ref is never invisible to the router, whatever the sender's working tree happens to contain."
  - "Reading the declaration never fails a send. A root with no resolvable ref, no remote, or no copy of the ticket anywhere delivers exactly as addressed and exits successfully - the lookup degrades, it never errors."
  - "The exact-id match survives the change. The ticket resolved is the one whose own id: field equals the id, never a filename-prefix match - BL-900 must not resolve BL-9005's file, by ref or by working tree."

description: >
  `active-ticket-yaml-content` (`swarmforge/scripts/swarm_handoff.bb`) looks
  the ticket up like this:

    (let [active-dir (fs/path root "backlog" "active")]
      (when (fs/exists? active-dir)
        (some ... (fs/glob active-dir "**.yaml"))))

  `root` is the SENDER'S project root - their own worktree. A pipeline role
  works on its own branch and merges `main` only at a handoff boundary, so
  between the coordinator promoting a ticket into `backlog/active/` on `main`
  and the sender merging, that file does not exist in the sender's checkout.
  `content` is nil, `decision` is nil, and the router takes the
  no-declaration path.

  This is not a rare race. Measured on main 2026-08-20 15:30: all 7 active
  tickets declared `required_stages`, and BL-969 (promoted 15:01) and BL-970
  (promoted 14:58) were absent from `backlog/active/` in all six pipeline
  worktrees - QA, architect, cleaner, coder, documenter, hardender. BL-951
  recorded an eleven-hour instance of the same window for BL-935. The window
  is worst exactly when a ticket is youngest, which is when its first hops
  happen.

  Note the shape of the failure: the sender's local `main` REF is usually
  fresh (the coder's `main` was at 15:20, well past both promotions) - it is
  the sender's WORKING TREE that lags. The data is already on the machine;
  the lookup is simply reading the wrong place.

  How (direction, not mandate): resolve the ticket text from the freshest
  ref that carries it, falling back to the working tree. `main` and
  `origin/main` can each be the stale one, so compare rather than trusting
  either - `git rev-list --left-right --count main...origin/main` is how the
  rest of this project decides that question. Keep the working-tree glob as
  the fallback path rather than replacing it: the acceptance fixtures build a
  real git repo with a single commit and NO remote, and roles legitimately
  run from roots where `origin/main` does not resolve.

constraints: >
  Out of scope:

  - Enforcement. Whether a declared stage may be jumped is BL-991. This
    ticket only changes WHERE the declaration is read from; it must not
    change what the router does once it has one.
  - Any change to `resolve-effective`, `next-required-stage`,
    `hop-skipped-stages` or `routes-forward?` in `required_stages_lib.bb`.
    The decision logic is correct; only its input is stale.
  - Making the sender merge `main` before sending. That is the BL-317/BL-325
    discipline and it is already a rule; this ticket exists precisely because
    a rule cannot be relied on at send time.
  - Any other reader of `backlog/active/` in the sender's worktree. There are
    several and they may share this bug, but widening the fix to all of them
    is a separate sweep - fix the routing lookup and say so.

  Hard constraint: the acceptance fixture roots (see
  `specs/pipeline/steps/bl951StageSkipsRecordedSteps.js`) are created with
  `git init -q` and a single seed commit, with no remote and no guaranteed
  branch name. A fix that requires `origin/main` to resolve will fail every
  fixture-driven scenario in BL-951's feature file as well as this one.

qa_e2e_procedure: >
  From the repo root:

  1. Reproduce the field condition first, before touching code. Run, on main:
     `for f in backlog/active/*.yaml; do ...` comparing each active ticket's
     filename against `.worktrees/*/backlog/active/`. Confirm at least one
     active ticket that declares `required_stages` is absent from every
     pipeline worktree. If the pipeline has quiesced and all worktrees are
     current, promote nothing to force it - instead reproduce in the fixture
     per step 2, and record in the evidence file that the field window was
     not open at verification time.
  2. Reproduce in a fixture at the parcel's parent commit: a git root whose
     COMMITTED `backlog/active/` carries a ticket declaring
     `[coder, qa]`, with that file deleted from the working tree. Send
     coder -> cleaner. Before the fix the parcel is delivered to cleaner (the
     declaration is unseen); after the fix it is delivered to QA.
  3. Confirm invariant 2 in three separate roots: one where no `main` ref
     resolves at all, one with a `main` ref but no `origin`, and one where
     the ticket exists in neither the ref nor the working tree. Each must
     deliver exactly as addressed AND exit zero. Assert the exit status, not
     only the recipient - a lookup that throws would otherwise look like a
     delivery decision.
  4. Confirm invariant 3 against the BL-900/BL-9005 collision: a ref carrying
     only BL-9005's file must not resolve a send for BL-900. This is the
     guard `active-ticket-yaml-content` documents today; a ref-based lookup
     that greps by filename reintroduces exactly the bug it was written to
     prevent.
  5. Confirm invariant 1's freshness rule: build a root where `main` and
     `origin/main` disagree about the declaration and verify the router acts
     on whichever ref is ahead - in both directions, since either can be the
     stale one.
  6. Run BOTH this ticket's feature file and BL-951's, which shares the
     fixture recipe: `./specs/pipeline/scripts/run_acceptance.sh
     specs/features/BL-992-a-declaration-the-sender-has-not-merged-is-still-read.feature`
     and
     `specs/features/BL-951-stage-skips-are-recorded-whatever-the-ticket-declares.feature`.
     Confirm the new handler is registered in `specs/pipeline/steps/index.js`.
  7. Prove non-vacuity: restore the working-tree-only glob and confirm
     scenarios 01 and 02 fail while 03, 04 and 05 still pass, then revert.

notes: >
  Surfaced while speccing BL-991 (the enforcement half of the operator's
  required_stages ruling) and split out rather than folded in, because the
  two are separately implementable and separately valuable. This one has
  standalone value today: without any enforcement change, a declaration the
  sender cannot see already costs a pruning rewrite and a rejection reason on
  the audit record. That is why `depends_on` is empty and why this ticket's
  scenarios assert only pruning and rejection-reason - both observable on
  today's code - rather than the binding behaviour BL-991 adds.

  It matters more once BL-991 lands, though, and the two should be promoted
  together if possible. BL-991 turns a declaration into a gate; this defect
  makes that gate silently inert for exactly the tickets most likely to be
  jumped. A gate that is blind in its most consequential window is the
  recurring failure this project keeps re-learning - BL-968's materialized
  tree gate was blind from its own landing, BL-986's standing-rule scanner
  reports a false zero. Both were found by accident.

  BL-951 already documented this window as its "third data point" and
  deliberately routed around it: its fix derives the skip RECORD from the hop
  itself so recording is immune to staleness. That was the right call for
  recording and it is why this is a fresh ticket rather than a BL-951
  regression - the rewrite decision was always left dependent on a visible
  declaration.

  IR-DRY: 5 medium-confidence findings, all reviewed and kept. Every one
  pairs the same step carrying a different role literal (`addressed to QA`
  vs `addressed to cleaner`, `delivered to QA` vs `delivered to cleaner`) or
  a different declaration token; the differing literal is the variable under
  test in each case, and one handler regex serves each pair. No Background
  extraction beyond `routing is enabled`: scenarios 01 and 02 share "the
  sender's working tree has no copy of the ticket" but scenarios 03, 04 and
  05 each contradict it, so hoisting it would change what three scenarios
  assert.

approval_context: >
  One decision is mine: the FALLBACK stays. When no ref resolves, the router
  reads the working tree exactly as it does today rather than refusing to
  route. That keeps the acceptance fixtures working and keeps a role running
  from an unusual root from having its sends blocked - but it does mean the
  fail-open still exists in principle, just narrowed from "any unmerged
  worktree" (the common case, measured above) to "a root with no resolvable
  ref" (which should never happen in the live swarm). Tell me if you would
  rather an unresolvable ref be a hard error.

  On severity: I have called this `high` on the same reading BL-951 used - a
  safety signal that is blind is worse than one that is absent, because the
  quiet looks like a pass. Push back to `medium` if you read it as contained
  while BL-991 is still unlanded, since until then the only cost is a missed
  pruning rewrite and a missing rejection reason on an audit record.
