id: BL-968
title: "BL-761 acceptance-contract gate is blind on effectively every send: three step files run git rev-parse at module load, so the materialized non-repo registry tree never loads and the gate warns-and-skips - make the registry loadable from a materialized tree and guard that property"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
human_approval: pending
priority: 20
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-968-step-registry-loadable-from-materialized-tree.feature

invariants:
  - "The step registry is loadable from a materialized, non-git, non-repo temp tree (the BL-761 gate's own materialization shape): no step file may run a subprocess, resolve a git root, or touch live repo state at module load - load-time work is limited to requires and pure constants; anything environmental binds lazily at step-execution time."
  - "A standing guard proves invariant 1 continuously: it materializes the CURRENT registry into a non-repo tree and asserts the resolver reports it loadable, so the next load-time-binding step file fails its own parcel's gates instead of silently blinding the acceptance-contract check for everyone."

description: >
  Severity rationale: high - a quality gate silently disabled in
  production. The BL-761 acceptance-contract check (the fuller pre-QA
  evaluation on QA-bound sends, BL-880's early pointer check's big
  sibling) has been failing OPEN with only a scrolling stderr warning:
  the documenter observed it on 2/2 sends (BL-957 and BL-958 forwards to
  QA, note 20260820T000811Z_000218), and the specifier reproduced it
  exactly against a third send's inputs - so it is effectively every
  send, not two.

  Reproduced mechanism (specifier, 2026-08-20, live lib call): the gate's
  gather (pre_qa_gate_gather_lib.bb) materializes the cited commit's
  specs/pipeline into a temp dir under /var/folders (fs/create-temp-dir -
  NOT a git repo, deliberately: it is the cited commit's tree, plus
  node_modules/extension symlinks) and runs
  specs/pipeline/scripts/resolve_contract_steps.js over it. Three step
  files call resolveMainCheckout(__dirname) at MODULE TOP LEVEL -
  headlessDarkEmitterAuditSteps.js:22, routingBreakEvenSteps.js:34,
  standingRuleViolationsSteps.js:23 - and lib/mainCheckout.js's
  resolveMainCheckout runs `git rev-parse --git-common-dir` with cwd set
  to that __dirname. Inside the materialized tree that throws "fatal: not
  a git repository", the require chain dies, the resolver reports the
  registry unloadable, and acceptance_contract_gate_lib records exactly
  the observed warning ("step registry could not be loaded at the cited
  commit (Command failed: git rev-parse --git-common-dir ...)") and skips
  the check. Any cited commit containing any of the three files - i.e.
  every recent send - takes this path. The helper itself is correctly
  parameterized; the defect is the callers' LOAD-TIME binding (the BL-863
  lesson shape).

  Fix wanted: (1) the three step files bind lazily - resolve the main
  checkout at step-execution time (memoized is fine), never at require
  time - so the registry loads cleanly from the materialized tree while
  the steps behave identically when actually executed from a real
  checkout; (2) a standing guard (the hardener's whole-tree guard shape,
  extension/test/) materializes the CURRENT specs/pipeline into a
  non-repo temp tree and asserts the resolver reports loadable - the
  regression trap for the whole class, not just these three files; (3)
  the parcel's evidence records since when the gate has been blind (first
  landed commit containing any load-time offender vs the gate's own
  landing).

  Deliberately unchanged: the gate's warn-do-not-block classification for
  registry-load failures (BL-761's documented infrastructure posture).
  Fail-closed here would have blocked every send in the swarm on this
  defect; the guard in (2) is what makes the blind spot structurally
  short-lived instead - the offender's own parcel goes red before the
  gate ever meets it.

constraints: >
  Out of scope:

  - Changing the BL-761/BL-880 gate evaluation, classification, or
    warning text - the gate correctly detected and reported the failure;
    only the registry's loadability and the standing guard change.
  - lib/mainCheckout.js's derivation itself - correct and parameterized;
    only its call sites' binding time moves.
  - The ancestry finding surfaced in the same reproduction (a batch-role
    commit stranded on swarm/coder) - separate, already-covered ground.
  - Auditing step files for OTHER load-time side effects beyond
    subprocess/git/repo-state - the guard catches what the resolver
    cannot load; do not hand-audit for hypothetical classes.

qa_e2e_procedure: >
  1. Reproduce pre-fix from durable data: at the parcel's merge-base, call
     pre_qa_gate_gather_lib's findings-for-git-handoff for a QA-bound
     send citing a commit that contains the three step files - the
     acceptance-contract warning names the git rev-parse failure. At the
     parcel commit, the same call yields NO registry-load warning and the
     acceptance-contract check actually evaluates.
  2. Run the new standing guard: green on the fixed tree; then, in a
     scratch copy, add a step file that shells out at module load and
     confirm the guard goes red naming it.
  3. Execute one scenario from each of the three fixed step files' own
     features from a role-worktree checkout - behavior unchanged (lazy
     resolution still finds the main checkout at run time).
  4. Evidence records the blind-window measurement (step 3 of the fix).
  Note: a full gate evaluation takes >120s on this host - run it
  backgrounded with output to a file (Bash tool cap, engineering rules).

notes: >
  Source: documenter priority-10 note 20260820T000811Z_000218 to
  specifier+coordinator ("BL-761 acceptance gate fails OPEN 2/2 sends:
  git rev-parse outside a repo"), per Article 4.4's
  spec-gap-leaves-by-note posture. N:1 - the coordinator independently
  processed the same documenter note (coordinator note
  20260820T001055Z_000638, evidence ad4d26201) and both sources fold
  here; this ticket and no other. The coordinator's two halves: (a)
  fail-open-by-design CONFIRMED - corroborates this ticket's deliberate
  non-change; (b) "trigger NOT reproduced" is SUPERSEDED by the
  specifier's reproduction above - the coordinator probed live worktree
  rev-parses, the ACCEPTANCE_POINTER_GATE warning grep, and
  swarm_handoff.bb's project-root path, none of which reach the
  acceptance-CONTRACT check's materialized-temp-tree registry load where
  the failure actually lives (its warning prefix also differs, and it
  prints only to the sender's pane stderr - why no grep finds it;
  durable surfacing of gate warnings is a fair follow-on if wanted).
  Preserved investigator trap from ad4d26201: "fatal: not a git
  repository" hits in handoffd-supervisor.log are the tool_miss_heal
  wrapper's own grep pattern inside reaped command lines, not git
  errors. Specifier probe went from the note's headline to the
  exact three call sites and reproduced the warning verbatim via a
  direct lib call from the documenter worktree (findings + warning
  captured in the mint-commit message's session; the >120s runtime of a
  full gate evaluation is itself recorded in qa_e2e).

  Related: BL-761 (the contract gate), BL-880 (early pointer check),
  BL-531 (pre-QA gather), BL-336 (why mainCheckout.js exists at all -
  the architect bounce that banned hardcoded checkout paths), BL-863
  lesson (caller binding time). The hardener's standing whole-tree guard
  rule (2026-08-19, accepted) is the home for the new guard's run
  discipline.

  Hardening note: mixed Babashka + Node - the guard lands in
  extension/test/ (vitest, full toolchain); the bb gather side has no
  mutation/CRAP/DRY wired (BL-472 deferred), gates on its runners with
  the degraded fallback recorded.

approval_context: >
  One deliberate non-change to confirm: the gate KEEPS warn-do-not-block
  for registry-load failures. Flipping it to fail-closed would have
  frozen every pipeline send on this very defect for however long the
  blind window turns out to be; the standing guard instead catches the
  class at the offending parcel. Say the word if you want fail-closed
  (or warn-plus-Telegram-surfacing) as a follow-on and I will spec it
  separately.

notes_coordinator_hold: >
