approval_context: >
  A new feature file, for the stamp-off of two hotfixes the human asked for
  ("Hot fix it + stamp off", 2026-10-01). FIRM: the grid's seats are every
  roles.tsv seat plus any sessions.tsv seat roles.tsv lacks, intersected
