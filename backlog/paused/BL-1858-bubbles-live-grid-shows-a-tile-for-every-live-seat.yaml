id: BL-1858
title: "Bubble's live grid took its seats from .swarmforge/sessions.tsv, which only a full launch writes, so a seat enabled later - coder@2, re-enabled as the local-model seat on 2026-10-01 by editing roles.tsv and running ./swarm ensure - and art-director got no tile: the human's phone showed eight tiles while ten seats ran; the grid now takes every roles.tsv seat plus any sessions.tsv seat roles.tsv lacks, puts coder@2 after coder, and each tile names its seat's model under the role name (coder@2 reads Qwen2.5 Coder 14B)"
milestone: M8
type: defect
severity: medium
# medium: a real fault, but contained. The human's live view hid a running
# seat (the local-model seat they are watching), but no work was lost, and
# the panes stayed reachable from tmux and the VS Code tiles.
status: todo
