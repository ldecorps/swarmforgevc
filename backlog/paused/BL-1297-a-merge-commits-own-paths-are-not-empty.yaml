id: BL-1297
title: "A merge commit's own changed paths come back empty, so the scope gate, the unregistered-test gate and the land step's replay all fail open on the pipeline's most common commit shape"
milestone: M8
type: defect
severity: critical
status: todo
epic: swarm-reliability
