description: |
  ## Status: hotfixes fe7833a272 and 8381fd02fb landed the fixes

  This parcel is their stamp-off: review them, do not re-apply them.

  ## What was wrong, and what the hotfix changed

  1. fe7833a272, specs/pipeline/steps/bl1253DeadFeederOwnsGetUpdatesStampSteps.js:
     BL-1253's scenario 05 ("The ledger row stays pending until a human
     decides") required the hotfix-ledger row for 2ec06b6ef1 to stay
     neither certified nor waived with human_decision null, forever. The
     human certified it on 2026-10-05, so it has been red on main since.
     02f834ec44 fixed the same check at nine other stamp-off sites with
     extension/test/helpers/hotfixLedgerDecision.js and missed this one,
     which wrote its own regexes. The Then step now calls
     `uncommittedDecision()`: an undecided row, or one decided exactly as
     HEAD's committed ledger records a human's decision, passes; a
     decision HEAD does not carry still fails.
  2. 8381fd02fb, specs/features/BL-764-front-desk-eats-host-bridge-updates.feature:
     scenario 05 asserted "2 waiting" on the edited liveness line for
     both of its rows. Operator hotfix 2b8d19d178 (2026-08-05, reviewed
     under BL-811) made the idle line a bare "Bridge: idle" on purpose,
     so the busy -> idle row has been red on main since then. The row is
     retired, never reworded, with a feature comment naming the
     superseding hotfix; the idle text is pinned by
     telegramCursorBridgeLiveness.test.js.

  ## What the coder does (all of it)

  1. Read `git show fe7833a272` and `git show 8381fd02fb` against the
     section above. For fe7833a272, confirm only the Then step's
     assertions and one require changed, and the When step's
     clean-ledger check is untouched. For 8381fd02fb, confirm only the
     one Examples row went and a comment came.
  2. Run the two features once each with output under tmp/.
  3. Write backlog/evidence/BL-2062-coder-<date>.md with the review
     result and the run results, and commit it.
