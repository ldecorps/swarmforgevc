approval_context: >
  Human ask (INTAKE-documenter-docs-web-pages.md, 2026-08-26): "Think about a
  series of web pages to render the docs the documenter has been writing" —
  phone-readable operator docs from docs/index.md Divio structure, not the
  Gherkin docs-tree.json explorer alone. Standing Bubble ramp over Telegram/PWA
  new UX (STEERING.md). Specifier chose: Bubble remote HTML in BL-829 pager,
