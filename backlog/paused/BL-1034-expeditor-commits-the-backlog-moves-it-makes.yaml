id: BL-1034
title: "every expedited run ends with its backlog moves STAGED in the shared master checkout and hands them to \"whoever next commits\" - a non-owner: main and the working tree disagree about where the tickets live until someone notices, and the next unrelated commit there sweeps them"
milestone: M8
type: defect
severity: medium
# medium, not high: BL-1024 landed, so a run now NAMES the staged moves in its
# closing summary and an operator reading the terminal is told. What is left is
# real but contained - the moves still sit in a shared index where an unrelated
# role's commit sweeps them silently, which is what keeps this above `low`.
status: todo
epic: swarm-reliability
assigned_to: specifier
priority: 55
direction: swarm-reported
depends_on: [BL-1024]
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1034-an-expedited-run-commits-the-backlog-moves-it-makes.feature

invariants:
  - "No expeditor exit path leaves a backlog move that run made staged and uncommitted in the shared master checkout."
  - "A commit the expeditor makes contains only the backlog paths that run moved - no other content in the shared master checkout, staged or unstaged, is ever carried into it."

human_approval: pending

approval_context: >
  This ticket REVERSES a documented deliberate deferral, so it needs a ruling
  before it is promoted rather than a reviewer discovering the reversal at
  architect stage.

  The manual (docs/reference/BL-567-expeditor-manual.md, "What it deliberately
  does not do") states: "No commit on `main` outside the QA stage's own merge
  ... Owner: whoever next commits in the master checkout - deliberately." The
  proposal is to delete that deferral and have the run commit its own backlog
  moves, leaving only the PUSH deferred to a human.

  What is firm, and is the argument for reversing it: "whoever next commits in
  the master checkout" is not an owner. It names no person, no role and no
  trigger, and the same sentence goes on to describe that actor as the hazard -
  "any role committing anything else there sweeps them into an unrelated
  commit". It is the shape of conditional directive that decays to "never".

  What is negotiable: WHEN the commit happens. The recommendation is at the
  moment of each move rather than accumulated to the single exit point,
  because the observed 2026-08-21 incident included a whole-swarm crash that
  left moves staged with no run left alive to finish them - an exit-time commit
  cannot survive that. Scenario 02 gates the recommendation.

  What is NOT proposed: no push (that stays a human decision on the next boot),
  no re-promotion of parked tickets (Article 3.1 keeps backlog/hold/ human-held),
  and no widening of what the run may move.

source: |
  Requested by the coordinator via note, 2026-08-22 06:04, priority 00:
  "expeditor commits its own backlog moves".

  Standing on two live observations of the same leaving:

  - 2026-08-21, after the BL-1021 expedited run (run 2) passed all seven
    stages: backlog/active/ empty, every mailbox empty, the pipeline idle.
    BL-586, BL-1012 and BL-1017 sat in backlog/hold/, and four backlog moves -
    those three parks plus BL-1021 paused/ -> done/ - sat STAGED and
    uncommitted in the shared master checkout. Committed main showed the
    pre-run backlog while the working tree showed the post-run one. The
    coordinator restored them by hand.
  - Earlier the same day, a whole-swarm crash left BL-1012/1017/586 staged
    into hold/ with no run alive to explain or finish it. The moves outlived
    the process that made them.

  BL-1024 fixed the half that could be fixed without reversing a documented
  decision: the run now NAMES what it left. This is the other half.

description: |
  ## What happens

  `move-ticket!` (expedite_cli.bb, line ~297) moves backlog tickets with
  `git mv` in the master checkout, which stages and nothing more. There is no
  `git commit` anywhere in expedite_cli.bb or expedite_lib.bb. Two kinds of
  move are affected: the parks `park-others!` makes (active/ -> hold/) and the
  run ticket's own active/ -> done/ move after a QA pass.

  So every run ends with `main` and the working tree disagreeing about where
  those tickets live, in a checkout every role shares. Three consequences,
  all observed:

  - The disagreement is silent. Nothing is wrong with the tree; it just is not
    what `main` says.
  - The next role to commit anything at all in that checkout sweeps the moves
    into an unrelated commit - the exact failure the master-checkout discipline
    rules exist for.
  - A crash between the move and any later cleanup strands them permanently,
    because the mover is gone.

  ## Why the current owner is not an owner

  The deferral is documented and its owner is written down: "whoever next
  commits in the master checkout - deliberately". That is a description of
  whoever happens to walk past, not an assignment. It names no role, no
  trigger, and no both-branches behaviour, and the same paragraph identifies
  that actor as the hazard. A conditional directive with no owner and no
  trigger decays to "never" - which is what both observations show.

  Contrast the tool's other deferrals, which are real handovers: "No push -
  owner: a human, on the next boot"; "No promotion - owner: the coordinator,
  through ordinary promotion"; "No revert on bounce - owner: the role the
  bounce routed to". Each names an actor who will act. This one does not.

  ## Why the expeditor is the right actor

  The expeditor runs with the stack STOPPED. There is no concurrent writer in
  the master checkout at that moment, which makes it the safest point in the
  whole cycle to commit there - safer than the live-swarm commits every role
  makes routinely. It already commits on `main` at the QA stage's own merge, so
  committing there is not new to the tool, only newly extended to its own
  bookkeeping.

  Committing does NOT publish: `main` stays unpushed, and publishing remains a
  human decision on the next boot. The handover shrinks from "four uncommitted
  moves plus an unpushed branch" to "an unpushed branch", which is a deferral
  the manual already owns.

  ## How (direction, not mandate)

  - Commit each backlog move at the moment it is made, not accumulated to the
    run's single exit point. The exit point is unreachable by a killed or
    crashed run, and that is one of the two observed cases.
  - Stage nothing. The move already staged exactly what should be committed;
    commit by explicit pathspec so the commit cannot pick up whatever else is
    in that shared index or working tree. There is no pre-flight cleanliness
    check on the master checkout, so assume it is dirty - it usually is.
  - Never make an empty commit. A run that moved nothing (a dry run, or a run
    with nothing to park that dies before its own ticket moves) commits nothing.
  - Commit on whatever branch the master checkout is already on. Do not switch,
    create or detach a branch.
  - Give the commit a message that says which run made it and carries a role
    byline. It buys nothing from any gate (BL-972: no predicate reads commit
    subjects) - it is for the human reading `git log`.
  - The commit touches only paths under `backlog/`, which is outside the
    QA-exclusive path set (`extension/src/`, `extension/test/`,
    `specs/pipeline/steps/`), so it does not reach Article 4.2's
    pipeline-code-on-main check and needs no approval-store interaction.
    Keeping the commit backlog-only is what keeps that true.

  ## Retiring BL-1024's boundary assertions (BL-1006)

  BL-1024's feature file froze the pre-fix boundary into executable
  assertions, and this slice falsifies them. Retiring them is IN SCOPE here -
  retire, never reword; this ticket's own scenarios are the coverage:

  - `specs/features/BL-1024-an-expedite-run-names-what-it-leaves-behind.feature`
    scenario 03 (`uncommitted-backlog-moves-are-named-03`, "backlog moves left
    staged are named as work someone must finish") asserts the summary lists
    "the uncommitted backlog moves" and names who must commit them. Retire it.
  - The same file's ended-badly Scenario Outline carries the line
    `And the closing summary lists "the uncommitted backlog moves" as
    outstanding`. Retire that line; its parked-tickets assertions stay.
  - That file's `Feature:` narrative and Background comment state as present
    fact that "the backlog moves end the run STAGED and uncommitted". Re-tense
    them - a durable contract carrying a false sentence is still a lie,
    executable or not.
  - Any step handler orphaned by the retirement: grep every `.feature` file for
    its patterns before deleting it (engineering rule, step-registry deletion).

  ## Scope

  - swarmforge/scripts/expedite_cli.bb - commit at the move sites
  - swarmforge/scripts/expedite_lib.bb - `outstanding-work`'s
    `the uncommitted backlog moves` item becomes the commit it made plus the
    push that is still owed
  - specs/features/BL-1034-*.feature and its step handlers
  - specs/features/BL-1024-*.feature - the retirement above
  - docs/reference/BL-567-expeditor-manual.md ("What it deliberately does not
    do", and the closing-summary example block) and
    docs/how-to/BL-567-expedite-one-ticket-with-the-swarm-stopped.md

  Out of scope: pushing; re-promoting parked tickets (Article 3.1 keeps
  backlog/hold/ human-held); BL-1023's separate defect that the done-move
  silently no-ops when the run ticket is not in backlog/active/ - this slice
  commits whatever moves happen, and does not change which moves happen.

qa_e2e_procedure: >
  1. At the parent commit, drive an expedited run (stage-runner seam, stages
     seeded to pass) for a ticket in backlog/active/ with at least one OTHER
     ticket also active. Confirm the absence first: `git status --porcelain`
     in the master checkout shows the park and done moves STAGED and
     uncommitted, and `git log -1` shows no commit made by the run.

  2. At the parcel commit, repeat with the same fixture. Confirm `git status`
     shows no staged backlog moves, `git show --stat` on the run's commits
     shows only paths under backlog/, and the committed tree holds the parked
     ticket in backlog/hold/ and the run ticket in backlog/done/.

  3. Repeat with an unrelated dirty file AND an unrelated staged change present
     in the master checkout before the run. Confirm both survive the run
     untouched - the staged one still staged and uncommitted, the dirty one
     still dirty - and appear in none of the run's commits.

  4. Repeat with the restart phase forced to fail, and again with the run
     killed mid-flight after `park-others!`. Confirm in both cases that the
     parks are already committed. The kill case is the 2026-08-21 crash.

  5. Confirm the two honesty cases: a `--dry-run` makes no commit and leaves
     `git status` exactly as it was, and a run with nothing to park that fails
     before its own ticket moves makes no commit at all.

  6. Read the closing summary. It reports the commit it made and names who must
     publish it, and no longer offers "the uncommitted backlog moves" as
     outstanding work.

notes: |
  IR-DRY reviewed, not merely run. One medium-confidence `possible-synonym`
  finding remains and must NOT be "fixed": `the committed backlog holds
  "<ticket>" in "<folder>"` scores 0.6 against `the committed backlog holds
  "other" in "backlog/hold/"`. These are ONE step - the outline's parameterised
  form and scenario 02's concrete form - and must bind to ONE handler. The
  checker does not normalise quoted literals, so it scores them as distinct
  texts (a known limitation, seen on BL-1024 too).

  The Background deliberately does NOT carry "one other ticket is in
  backlog/active/", even though six of the seven scenarios open with it: a
  Background must hold for every scenario, and scenario 06 requires that there
  is nothing to park. An earlier draft put it in the Background and negated it
  in 06; the checker flagged the negation as a near-duplicate, which was the
  right complaint about the wrong line.

  No `required_wiring:` is declared, deliberately, for the same reason BL-1024
  declared none: the mechanism here IS the commit at the move sites, so a
  commit that never happens fails every scenario in the feature file. Naming a
  pattern would mean guessing an identifier that does not exist yet - the
  BL-874 failure mode.

  Sibling of BL-1023 (both are the expeditor's teardown bookkeeping) but
  independent of it: BL-1023 is about the run ticket's done-move happening at
  all, this is about every move that does happen being committed. Neither
  blocks the other and they touch different functions.
