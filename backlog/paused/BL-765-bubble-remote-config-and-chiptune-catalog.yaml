notes: |
  Adopt candidates already in the dirty master tree — new
  `extension/src/bridge/letsTalkBubbleConfig.ts`,
  `extension/src/bridge/letsTalkChiptunes.ts`,
  `extension/src/bridge/letsTalkChiptunes.json`, `resolveJsonModule` in
  `extension/tsconfig.json`, the `android/app/**` changes, and the how-to
  updates under `docs/how-to/BL-705-*` and `docs/how-to/BL-707-*`. Coder
  adopts, does not re-derive.

  `letsTalkChiptunes.json` is ~3.5k lines of step data. It is data, not logic —
  keep it out of coverage/mutation scope and gate the loader, not the payload.

  Android has no automated seam in this repo yet (see BL-761), so the phone-side
  half of each scenario is verified manually until that lands; the bridge-side
  half must still be an executable scenario.

  e2e QA procedure: with Bubble paired to a live bridge, remove
  `.swarmforge/operator/lets-talk-bubble-config.json` and confirm Bubble still
  opens with every bundled capability; restore it with one capability disabled
  and confirm that control disappears after a resume without reinstalling; add a
  song to the catalog, redeploy the bridge, and confirm it appears in the
  playlist dialog on the phone with no APK change.
