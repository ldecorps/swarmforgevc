description: |
  ## What

  Bubble currently hard-codes its capability set and its hold-music catalog in
  the APK, so turning a feature off or adding a tune means building, publishing
  and installing a new APK on the phone. Serve both from the bridge instead:

  - `GET /lets-talk/bubble-config.json` — a versioned capability document
    (text turns, hands-free, hold music, playlist, new session, pause all,
    bridge-bounce auto session reset). Bubble applies it on pair/resume and
    falls back to bundled defaults when it is absent or unusable.
  - `GET /lets-talk/chiptunes.json` — the hold-music catalog as data, so new
    songs ship with a bridge redeploy.

  Also in scope, from the same working tree: hold-music volume and reply-voice
  volume stop sharing one control — the setting governs music only and the
  reply voice follows the phone's media volume. The debug version label moves
  to a plain `v<version>` string on the pairing screen and talk panel.

  ## Why

  The phone is the surface the human actually uses, and it is the slowest thing
  in the loop to change. Remote config and a remote catalog turn a
  build-publish-install cycle into a bridge redeploy, and give a way to disable
  a misbehaving capability without touching the installed app.

  ## Out of scope

  - Shared-token inbound fan-out and bridge liveness (BL-764).
  - Bridge bounce detection / `GET /lets-talk/meta` and Cursor Remote always-on
    (BL-763).
  - Tunnel hostname discovery (BL-716).
  - Migrating Live Screen from the Mini App to Bubble — that intake is parked in
    the backlog root pending a human answer; do not widen into it.

