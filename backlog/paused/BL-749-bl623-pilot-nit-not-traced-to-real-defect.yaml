description: |
  ## What

  This review batch's own cleaner-lens pass on BL-623 already noticed
  `log-routing-skip!` has no try/catch despite the ticket's own guardrail
  language — but judged it a non-blocking nit rather than tracing the
  actual call site to see whether the missing try/catch has a real
  consequence (it does: it sits before the real-time delivery call in the
  same `let`, so a write failure there skips delivery entirely).

  ## Question to answer

  When a reviewer notices a missing error-handling guard that the ticket's
  OWN text explicitly promises ("a record-write failure must not block the
  send"), should that observation always be traced to its actual call-site
  consequence before being downgraded to a non-blocking nit? Harden
  `/pilot` (and this project's own review-role guidance) so a
  reviewer-noticed gap against a ticket's own explicit guardrail claim is
  never dismissed without first confirming — by reading the call site, not
  just the function in isolation — whether the guardrail is actually
  upheld.
