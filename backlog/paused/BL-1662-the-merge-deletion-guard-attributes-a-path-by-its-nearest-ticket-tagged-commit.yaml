human_approval: approved
approval_context: >
  One scenario is added to a landed feature file, so it would ordinarily
  need a tap; it is minted approved under the 2026-09-17 operator hotfix
  (severity defect, no choice posed, no ruling_options). FIRM: the guard
  still refuses a merge that deletes a path whose owning ticket the
  message does not name - BL-1242's and BL-1341's scenarios are
  unchanged and stay green. FIRM: the id is derived from the path's
  history, never from the message alone (a message naming any ticket
  must not self-certify a deletion). FIRM: the subject stays free of a
  closed ticket id (BL-1617); the body carries it.

invariants:
  - "For every deleted path the guard names an owning ticket whenever ANY commit in the path's history on either side of the merge carries a ticket id in its subject, so the guard's own remedy (name that id in the message) is always satisfiable."

description: |
  ## What is wrong

  `swarmforge/scripts/check_merge_deletion.sh`'s `attribution_for_path`
  (lines 147-163) reads `git log -1 --format=%s HEAD -- <path>` and, if
  that ONE subject carries no ticket id, the same for MERGE_HEAD; when
  neither most-recent commit is tagged, `id` is empty and line 180's
  exemption (`[[ -n "$id" ]] && message contains id`) can never fire -
  the refusal's own remedy, "name the affected ticket id(s) in the commit
  message", is unsatisfiable. Two rules make the untagged subject
  mandatory for exactly this case: `check_closed_ticket_subject.sh`
  (BL-1617) refuses a role-branch subject naming a closed ticket, and the
  specifier's closed-owner recipe (condition (f), 2026-09-20) removes a
  closed ticket's abandoned-build residue in a commit whose subject names
  no ticket id. 2026-09-20: coder@2 removed
  `swarmforge/scripts/test/test_handoffd_bl1652_chase_respawn_busy_lane_guard.sh`
  (introduced by 4eacde9068 "BL-1652: ...", listed in BL-1652's
  abandoned_commits) in bd840b6d7a, untagged as ruled; merging the
  cleaner's reverse hop af3c69b525 (which carries the file) is refused:
  `merge deletes '...' ((unattributed), introduced at bd840b6d7a on the
  incoming branch), not named in the commit message`; a retry naming
  BL-1652 in the subject is refused by BL-1617. Evidence
  `backlog/evidence/BL-1652-merge-deletion-guard-deadlock-20260920.md`
  (coder@2 worktree). The same wall meets every branch that later merges
  across that removal, in either direction (BL-1341), on every branch
  that carries the file (all but coder@2 today).

  ## What is wanted

  - `attribution_for_path` walks the path's history on HEAD, then on
    MERGE_HEAD, and returns the FIRST commit whose subject carries a
    ticket id (the introducing `BL-1652:` commit here), skipping untagged
    restores and sync merges; only when no commit on either side is
    tagged does it report no id, as today.
  - The exemption keeps reading the whole message, so the id lands in
    the BODY while the subject stays untagged (BL-1617).
  - `test_check_merge_deletion.sh` (or the guard's existing shell test)
    gains the case; BL-1242's feature gains this scenario, step in the
    same commit:

    ```
      # BL-1242 an-untagged-removal-of-a-closed-owner-path-merges-when-the-body-names-it-09
      # BL-1662 (2026-09-20): the closed-ticket subject guard forbids the
      # id in the subject, so the removal commit is untagged by rule;
      # attribution reaches past it to the commit that introduced the path.
      Scenario: a merge carrying a deliberate untagged removal of a closed ticket's path is accepted when the message body names that ticket
        Given a path introduced by a commit whose subject names ticket BL-9001 and later removed by a commit whose subject names no ticket
        And a branch that still carries the path
        When that branch is merged with a commit message whose body names BL-9001
        Then the merge-deletion guard accepts the merge
        And the same merge with a message naming no ticket is refused naming BL-9001
    ```

  ## How (direction, not mandate)

  - `git log --format='%h%x09%s' HEAD -- "$path" | grep -m1 -E $'\t.*[A-Za-z]+-[0-9]+'`
    per side, keeping the existing regex; keep the diagnostics line for
    the untagged case. Mirror `bl1242...Steps.js`'s mkdtemp fixture for
    the new step.

constraints: >
  The guard's two directions (BL-1242, BL-1341) and check_ticket_deletion.sh
  (BL-901) keep their behaviour for every tagged path. No change to
  check_closed_ticket_subject.sh. The step handler lands with the
  scenario (BL-233). Fixture roots are mkdtemp git init repositories.

out_of_scope: |
  - Removing the BL-1652 residue itself from the seven branches: done
    per condition (f) after this lands (ruling of 2026-09-20 in
    BL-1652-specifier-ruling-merge-deletion-deadlock-20260920.md).
  - check_ticket_deletion.sh's own attribution (BL-901): it accepted
    bd840b6d7a with the id in the body; unchanged.

qa_e2e_procedure: >
  (1) `node specs/pipeline/cli.js specs/features/BL-1242-merge-never-silently-drops-branch-work.feature`
  ONCE on the parcel commit: every scenario ok including the new one.
  (2) The guard's shell test once: green. (3) In a scratch clone of the
  parcel commit: reproduce coder@2's shape (add a file in a `BL-9001:`
  commit, remove it untagged on one branch, merge a branch that keeps it
  with a body naming BL-9001) - the merge commits; the same with no
  ticket in the message is refused naming BL-9001. Never "run it N
  times".

