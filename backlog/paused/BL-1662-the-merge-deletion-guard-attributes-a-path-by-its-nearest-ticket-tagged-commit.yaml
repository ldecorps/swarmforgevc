id: BL-1662
title: "check_merge_deletion.sh attributes a deleted path by the subject of the most recent commit that touched it on each side, so a path removed by an untagged commit - the only removal check_closed_ticket_subject.sh allows for a closed ticket's residue - can never be merged: no message satisfies the guard, and coder@2 is stuck mid-merge on 2026-09-20 with every future merge across that removal refused; the guard attributes by the nearest ticket-tagged commit in the path's history and accepts the id anywhere in the message"
milestone: M8
type: defect
