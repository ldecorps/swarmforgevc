id: BL-748
title: "log-routing-skip! has no try/catch and sits before try-sync-deliver! in the same let - a journal write failure kills the real-time wake and leaks the draft, contradicting the ticket's own guardrail"
milestone: M8
type: defect
severity: medium
# medium, not high: the parcel is durably in the outbox one binding earlier, so
# the daemon's backup mailbox path still delivers it. The cost is a lost
# real-time wake, a leaked draft file and an uncaught-exception trace instead of
# a controlled message - degraded, not lost. Not low: it defeats a guardrail the
# originating ticket stated explicitly, and nothing exercises the path.
status: todo
epic: swarm-reliability
priority: 79
direction: normal
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-748-routing-skip-recording-failure-never-withholds-delivery.feature

invariants:
  - "A failure in routing-skip recording never changes a handoff's delivery outcome or whether the draft is consumed - recording is observational only."
  - "A suppressed recording failure is never silent: it always leaves a diagnostic on stderr."

human_approval: pending

approval_context: >
  No open design decision - this is a confirmation that the acceptance contract
  is the right one. The fix direction is settled by in-repo precedent:
  try-sync-deliver!, twelve lines above the defect in the same file, already
  catches, reports on stderr and returns a sentinel. What is firm: recording
  must not be able to withhold delivery, and the suppression must not be
  silent. Scenario 03 pins that the guard stays scoped to the recording call -
  a blanket try/catch around the whole `let` would also swallow real delivery
  failures and is not what this asks for.

source: |
  Found during BL-723 (pilot-tonight quality review), hardener viewpoint
  pass, 2026-07-30/31. The cleaner's own BL-723 pass already noted this as
  a non-blocking nit ("log-routing-skip! has no try/catch despite the
  ticket's own 'a record-write failure must not block the send' guardrail
  — no scenario exercises that path"), but did not trace the actual call
  chain. Traced it directly in `swarmforge/scripts/swarm_handoff.bb`:

  `-main` (line 572, invoked bare at line 623 with no wrapping try/catch)
  binds, in a single `let`:
    1. `outbox-file` via `write-handoff!` (line 594) — durably installs the
       parcel to `.swarmforge/handoffs/outbox/` and returns.
    2. `_` via `(when-let [skip (:routing-skipped routed)]
       (log-routing-skip! ...))` (line 599-600).
    3. `sync-result` via `try-sync-deliver!` (line 601-603) — the real-time
       tmux injection that wakes the recipient role.

  Clojure `let` bindings evaluate strictly in order. If `log-routing-skip!`
  throws (disk full, permission denied, or any I/O failure writing
  `.swarmforge/routing-skips.jsonl` or creating its parent dir via
  `fs/create-dirs`), the exception propagates uncaught out of the whole
  `let` — `-main` has no try/catch around any of this, and there is no
  wrapping try anywhere between it and the top-level `(apply -main
  *command-line-args*)` at line 623. Consequence: `sync-result` (real-time
  delivery) is NEVER computed — `try-sync-deliver!` never runs — and
  `(fs/delete draft)` (line 604) never runs either, even though the parcel
  was already durably written to outbox moments earlier at step 1. The
  process exits with an uncaught-exception stack trace rather than a
  controlled message.

  This directly contradicts this ticket's own stated guardrail that "a
  record-write failure must not block the send." No scenario in
  `bl623RoutingSkipTrailSteps.js` or the feature file exercises a
  `log-routing-skip!` write failure.

  Not filed as high severity: the parcel itself is not lost (already
  durably in outbox before this point), and this repo's own constitution
  documents a backup delivery path for exactly a missed sync-inject
  ("Only when ready_for_next.sh returns a task you were not woken for
  (backup mailbox delivery) may you briefly note that unseen mail was
  picked up") — so the practical failure mode is a delayed wake plus an
  ugly crash trace and a leftover draft file, not silent data loss.

description: |
  ## What

  Make a failure while appending the routing-skip journal degrade to a warning
  instead of aborting the send, so `try-sync-deliver!` and the draft cleanup
  still run.

  ## Why

  `log-routing-skip!` (swarm_handoff.bb:664-667) writes via `fs/create-dirs`
  and `spit` with no try/catch, and its call site at line 792-793 sits inside
  the same `let` as `try-sync-deliver!` (796) and ahead of `(fs/delete draft)`
  (797). Clojure `let` bindings evaluate in order and `-main` has no wrapping
  try - it is invoked bare at the foot of the file. So a journal I/O failure
  costs the recipient their real-time wake, leaks the draft, and exits on an
  uncaught-exception trace, all after the parcel was already durably written to
  the outbox. That contradicts the originating ticket's own stated guardrail
  that a record-write failure must not block the send.

  ## How (direction, not mandate)

  Follow the posture already used by `try-sync-deliver!` in the same file:
  catch, report on stderr, keep going. Keep the guard scoped to the recording
  call - wrapping the whole `let` would also swallow genuine delivery failures
  that today are surfaced deliberately.

  ## Scope

  - `swarmforge/scripts/swarm_handoff.bb` - the `log-routing-skip!` call site
    at 792-793, and/or the function at 664-667.
  - A test that makes the journal write throw (unwritable parent directory, and
    unwritable journal file) and asserts delivery and draft cleanup still
    happen and stderr carries the diagnostic.
  - The existing BL-623 routing-skip-trail scenarios stay green.

qa_e2e_procedure: |
  In a scratch clone (never the live master checkout), with a fake tmux target
  so delivery is observable:

  1. Stage an active ticket declaring `required_stages: [coder, qa]` with
     `stage_skip_reasons`, and write a coder git_handoff draft addressed
     directly to QA - a hop that skips four stages, so recording runs.
  2. Make the journal parent unwritable: create `.swarmforge/` and
     `chmod a-w .swarmforge`.
  3. Run `swarm_handoff.sh <draft>`. Assert: the command does not print a
     Clojure stack trace; it reports the parcel delivered or queued; the draft
     file is gone; stderr names the routing-skip recording failure.
  4. Restore `chmod u+w .swarmforge`, then create `routing-skips.jsonl` and
     `chmod a-w` the file itself. Repeat step 3 - same four assertions.
  5. Restore write permission and send again: a routing-skips line is appended,
     the parcel is delivered, and stderr carries no recording failure.
  6. Send a documenter -> QA adjacent hop with the journal parent still
     unwritable: it delivers cleanly and reports no recording failure, proving
     the guard did not widen into a blanket catch.

