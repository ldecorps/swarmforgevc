  NeedsApprovalEntry declaration together and established which half
  is wrong - the optional marker on the interface is the tiebreaker,
  and it points at the producer. Confirmed the test's strictness by
  reading its import (node:assert/strict, under which deepEqual is
  deepStrictEqual and an own undefined key is fatal). Traced the
  field's arrival to `7270c6af0` (BL-649, the swarm-start doorbell)
  and confirmed the readers - pendingApprovalsAnnouncement.ts:84,
  conciergeTick.ts:301, topicRouter.ts:182 - all treat a missing
  context as nothing to render, so making it absent breaks no
  consumer. Read the "explicit rather than absent" comment at
  :63-68 in full to be sure it did not authorise the current shape;
  it does not, it is about the top-level fields.

  Grepped backlog/{active,paused,hold} for "backlogDashboard",
