human_approval: approved
approval_context: >
  A new feature file needs your review before this slice promotes. The ask:
  that a QA checklist gather run (extension/out/tools/qa-gather.js) and a
  direct acceptance run (node specs/pipeline/cli.js) count as a running
  lane for the chase ladder, exactly as vitest, Stryker and the bb test
  runners already do (BL-1652). FIRM: scoped to the chased role's own
  worktree, as today - a run under another worktree changes nothing for
  QA. FIRM: the existing posture carries over unchanged - a role with a
  lane alive is chased, never respawned, for as long as the lane lives,
  so a hung gather now holds a quiet QA the same way a hung vitest already
  does; no new timeout is added here.

invariants:
  - "A chase respawn never fires for a role while a lane entry point that role's prompt directs it to run is alive scoped to that role's worktree."

description: |
  ## What is wrong

  The 2026-09-24 closing-ceremony packet named "16 chases in QA" as its
  second hypothesis. The lifecycle ledger
  (`.swarmforge/lean/2026-09-24.jsonl`) has QA's BL-1694 parcel chased
  sixteen times from 06:29:34Z to 07:01:18Z, then a respawn row at
  07:02:50Z. The respawn was real: QA's Claude session 1007da45 ended at
  07:02:52Z and 4c3d9ab6 began at 07:02:51Z.

  What QA was doing: its first `timeout 590 node
  extension/out/tools/qa-gather.js --ticket BL-1694` hit the 590 s
  timeout; at 06:31:08Z it re-ran the same command in the background
  (no timeout) and ended its turn to wait. The pane went quiet, the
  heartbeat aged, and at the ceiling `decide-stale-item-action` answers
  "respawned" unless `pane-busy?` or `lane-running?` holds. The gather
  was still alive - its background task file reads "Terminated
  [killed]", mtime 07:02Z, and its redirected result file is 0 bytes -
  so `lane-running?` answered false with a lane running.

  Why: `lane-process-lib/lane-process-pattern` is
  `stryker|vitest\.properties\.config\.mjs|\bnpm exec vitest\b|\bnpx vitest\b|\(vitest|_test_runner\.bb|run_acceptance\.sh`.
  `node extension/out/tools/qa-gather.js` matches none of it, and
  neither does `node specs/pipeline/cli.js <feature>`, the acceptance
  command every `qa_e2e_procedure` names. Between child processes (the
  gatherer runs its lanes one after another through spawnSync) nothing
  in the table matches at all.

  ## What is wanted

  - Scenario 01 (outline): with QA's heartbeat dead, its pane quiet and
    its items at the chase ceiling, a live `qa-gather.js` process or a
    live `specs/pipeline/cli.js` process scoped to the QA worktree means
    the sweep triggers no respawn for QA.
  - Scenario 02: the same gather process scoped to the coder worktree
    leaves QA's respawn to its own readings - exactly one respawn fires.

  ## How (direction, not mandate)

  - Widen `lane-process-pattern` in `swarmforge/scripts/lane_process_lib.bb`
    (it is deliberately its own literal, not worktree_stray_lib's - the
    file header says why; keep it that way). The scoping
    (`project-scoped-process?` on cmdline or cwd) is unchanged.
  - The feature reuses BL-1652's fixture (daemon-shaped `.swarmforge`,
    aged heartbeat, items at the ceiling) with its own scoped handler;
    a real short-lived process whose cmdline carries the lane command,
    with its cwd under the fixture worktree, stands in for the run.
  - Record in the evidence the census of lane entry points the role
    prompts name (`grep -n 'qa-gather\|specs/pipeline/cli.js\|run_acceptance\|vitest'
    swarmforge/roles/*.prompt`) and which the widened pattern now covers,
    so the next missed entry point is a one-line diff with its reason.

  ## Scope

  - `swarmforge/scripts/lane_process_lib.bb` (the pattern and its
    comment) and its bb test.
  - `specs/features/BL-1714-...feature` + the pinned handler.
  - Docs: the chase-ladder reference that lists what holds a respawn.

  ## Not in scope

  - Why the second gather run produced nothing in 31 minutes, and why
    the first exceeded 590 s - no mechanism in hand yet; a hypothesis
    in the 2026-09-24 lean-pass evidence, ticketed if it recurs.
  - How skipped respawns are recorded (BL-1551).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1714-a-qa-lane-run-in-flight-holds-the-chase-respawn.feature`:
     all ok (3 of 3).
  2. `node specs/pipeline/cli.js specs/features/BL-1652-the-chase-sweep-never-respawns-a-busy-role-and-respawns-at-most-once-per-sweep.feature`:
     all ok (4 of 4) - the existing guard is unchanged.
  3. Live read, no respawn provoked: while your own qa-gather run for
     this ticket is alive, `bb -e '(load-file "swarmforge/scripts/lane_process_lib.bb") (prn (lane-process-lib/lane-running? "<your worktree>"))'`
     prints true.
  4. The evidence carries the lane entry-point census.
  5. `git diff main...HEAD --name-only` names only the Scope files, the
     feature, the handler, docs and evidence.

