id: BL-1093
title: "The dispatch-gap sweep auto-routes to `to: none` and swarm_handoff rejects it, while the unassigned-active nudge built for exactly this case cannot see the ticket because the field is PRESENT - so it strands between two sweeps and the daemon retries every ~10s forever"
type: defect
severity: high
# high: the daemon's third duty is failing 100% - handoffd.log shows 6
# dispatch-gap-autoroute-error lines and ZERO successes, re-firing roughly
# every 10 seconds indefinitely. Active tickets sit with no dispatch while the
# board shows them active. Not critical: nothing is lost or corrupted, the
# tickets are intact, and a coordinator can route any of them by hand.
status: todo
epic: swarm-reliability
assigned_to: coder
priority: 10
direction: swarm-surfaced
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1093-an-active-ticket-with-no-real-assignee-strands-between-two-sweeps.feature
human_approval: pending
approval_context: >
  Firm: an active ticket whose `assigned_to` names nobody must reach the
  coordinator. That path already exists and was built for exactly this case -
  it simply cannot see these tickets.

  Your call on ONE thing: which spellings count as nobody. BL-1047 measured
  four in the live corpus - the key absent, present-but-blank, the string
  `none`, and the string `unassigned` - 104 tickets between them. I recommend
  treating all four as nobody, because the field records which convention a
  minting session happened to use rather than a decision. If you would rather
  only `none` be added now, the ticket still works and the other two spellings
  keep stranding silently.

  Note this does NOT overlap BL-1047 (paused, approved). That ticket is about
  `assigned_to: specifier` costing a wasted specifier hop; this one is about a
  value that names nobody producing an INVALID handoff. Fixing either leaves
  the other. Cross-referenced from here only - BL-1047's YAML is untouched.
invariants:
  - An active ticket is always reachable by exactly one sweep - a value that names nobody makes it unassigned (the coordinator nudge), never an assignee (the auto-route), and no value leaves it invisible to both.
  - A handoff the daemon generates is one the daemon could itself send - the auto-route never emits a recipient `swarm_handoff.sh` will reject.
  - A failed auto-route records WHY it failed, so a persistent retry loop is diagnosable from the log alone.
description: >
  WHAT: `dispatch-gap-draft-lines` (`swarmforge/scripts/chase_sweep_lib.bb`)
  builds the auto-route draft with `(str "to: " (:assigned-to item))` -
  the ticket's `assigned_to` verbatim. When that value is the literal string
  `none`, the emitted draft is `to: none` and `swarm_handoff.sh` refuses it:
  "Unknown recipient role 'none'."

  The second half is what makes it strand rather than merely fail once.
  `unassigned-active-items` - the sibling sweep whose entire purpose is to
  nudge the coordinator about an active ticket with no assignee - does NOT
  match these tickets, because it looks for a MISSING assignee and the field
  is present. So the ticket is too assigned for the nudge and not assigned to
  anything real for the route. Nothing else looks at it.

  EVIDENCE, live 2026-08-23: `.swarmforge/daemon/handoffd.log` holds six
  `dispatch-gap-autoroute-error` lines and zero successes, re-firing about
  every 10 seconds. Running the sweep functions directly against the live
  directories returns six gaps and an unassigned-active count of ZERO.
  Three of the six are this defect - BL-777, BL-844, BL-845, all
  `assigned_to: none`. The other three (BL-1078/1079/1080) failed for an
  unrelated reason, a dangling `acceptance:` pointer, which the specifier
  fixed in the same session by writing the missing feature files; they are
  NOT this ticket's concern and should be green before it starts.

  WHY the spelling matters: BL-1047 measured the live corpus and found FOUR
  spellings of nobody - key absent (63), the string `none` (28), the string
  `unassigned` (7), present-but-blank (6): 104 tickets. Only the absent case
  is handled today. The field records which convention a minting session used,
  not a decision, so treating one spelling as special is what produced this.

  How (direction, not mandate): normalise at the read boundary -
  `read-active-items` and `read-unassigned-active-items` should agree on one
  predicate for "names nobody", so a ticket is claimed by exactly one of them.
  A recipient check before emitting is a reasonable belt-and-braces, but it
  alone would only turn a rejected send into a skipped one and leave the
  ticket stranded and invisible, which is the actual harm.

  DIAGNOSABILITY, in scope because the fix cannot be verified without it:
  `handoffd.bb` logs `dispatch-gap-autoroute-error <id> <assigned-to>
  HANDOFF INVALID: <draft path>` - the draft path, never the reason. The two
  causes above are indistinguishable in the log, and both drafts are deleted
  and rebuilt each sweep, so diagnosing this required hand-running a draft
  through `swarm_handoff.sh` to see the real error. Pass the underlying
  reason through (same rule as BL-572/BL-662: show the actual failure, never
  a bare status).

  NOT IN SCOPE: changing any ticket's `assigned_to` data - a routing decision
  and the coordinator's to make; BL-1047's specifier-hold routing.
qa_e2e_procedure: >
  1. Seed a scratch repo with an active ticket for each nobody-spelling -
     absent, blank, `none`, `unassigned` - each with no dispatch trail.
  2. Run the dispatch-gap sweep. No draft may be generated naming any of them
     as a recipient, and nothing may be rejected with "Unknown recipient".
  3. Run the unassigned-active sweep over the same fixture: every one of the
     four is nudged to the coordinator. Before the fix only the absent case
     is, which is the defect reproducing.
  4. Disjointness, which is invariant 1: no ticket is returned by BOTH sweeps,
     and no active ticket is returned by neither.
  5. A ticket with a REAL assignee and no dispatch trail still auto-routes to
     that assignee - the fix must not disarm the working path.
  6. Live check on this repo once landed: `grep dispatch-gap-autoroute
     .swarmforge/daemon/handoffd.log | tail` shows successes, and any
     remaining error line names a REASON, not just a draft path.
notes: >
  Reached from a coder note, "4 misroutes: active tickets keep mint
  status:todo assigned_to:coder forever". The count and the field both turned
  out differently once the sweep was run rather than reasoned about: the four
  `assigned_to: coder` actives (BL-1015, BL-1045, BL-1069, BL-713) all HAVE
  dispatch trails and are correctly not re-routed, so they are not misroutes.
  The six real gaps carry `none` and `specifier`, not `coder`.

  Also measured and deliberately not ticketed: every active ticket reads
  `status: todo`, and nothing in `swarmforge/scripts/` writes that field at
  all. It is inert rather than wrong - no routing reads it - so it is recorded
  here as a known-inert default, not filed as a defect.

  IR-DRY disposition (checker run): three `possible-synonym` findings, all
  reviewed and KEPT. The parameterized `<spelling>` Given and scenario 04's
  semantic "names nobody" sit at deliberately different levels - one
  enumerates the spellings, the other asserts about any of them. "assigned to
  the coder" is the somebody/nobody contrast that scenario 02 exists to draw.
  "claimed by both" vs "claimed by neither" are the paired halves of the
  disjointness invariant and mean opposite things.

  CROSS-REFERENCE added after minting, before approval: BL-1087 is the second,
  larger cause of the same 0-successes symptom - the auto-route cites HEAD and
  the BL-953 coherence gate refuses it because HEAD's subject names a different
  ticket. The two are independent and BOTH must land: this ticket's recipient
  validation fires first (BL-777/BL-844/BL-845 never reach coherence), while
  BL-1079/BL-1080 have a valid recipient and are stopped only by BL-1087.
  Fixing either alone leaves the other's tickets stranded. This ticket's
  severity and scope are unchanged by that discovery.
