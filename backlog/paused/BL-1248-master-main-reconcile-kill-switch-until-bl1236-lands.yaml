  Restart context for the coordinator: the swarm is currently DOWN and the
  restart is blocked by the BL-1191 ops hold
  (.swarmforge/operator/INTAKE-bl1191-pilot-cleanup-gate-before-restart.md,
  ninth reading). The sweep cannot fire while the daemon is down, so there
  is no live bleeding this minute - but a restart rearms it, which is why
