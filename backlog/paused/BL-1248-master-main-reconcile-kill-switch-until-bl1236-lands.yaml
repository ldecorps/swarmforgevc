  first, since it is the unblocked half.

approval_context: >
  This is your own 12:16Z directive returned as a ticket, because it had no
  lever and no owner: there is no enable/disable key for this sweep anywhere
  in the tree, so "disable it" could not be done as a config edit. Approving
  this authorises building the switch and shipping it OFF, with BL-1236
  named as the condition for turning it back on.

  Two calls to say the word on if you disagree: (1) the switch ships
  defaulted OFF and fails closed, so an absent key disables the sweep for
  everyone, not only here - say so if you would rather it default ON and be
  disabled only by this repo's conf. (2) It is scoped as a pure stopgap and
  deliberately does NOT fix the conflict predicate, so that it cannot be
  delayed by BL-1236's own pending approval. Severity critical: twelve
  realised commit losses, one of them a human ruling.
