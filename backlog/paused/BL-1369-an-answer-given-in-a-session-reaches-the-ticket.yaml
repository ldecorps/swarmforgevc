id: BL-1369
title: "A human answering ruling_options inside an agent session has no path to the ticket: the answer is real, no store witnesses it, and an honest report is indistinguishable from an unverifiable claim"
milestone: M8
type: defect
severity: medium
# medium: no wrong content lands and the fail is closed - an unrecorded answer
# leaves the ticket pending, which is safe. The cost is turns and trust: one
# answered question consumed four agent turns and produced a false accusation
# against the reporting role before the truth came out. Not high because
# nothing is corrupted and the human can always re-answer on the ask.
status: todo
epic: question-attention-path
