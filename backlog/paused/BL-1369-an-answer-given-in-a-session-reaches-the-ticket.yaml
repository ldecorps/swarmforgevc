human_approval: pending
approval_context: >
  No choice is posed and there are no ruling_options - deliberately, since this
  is the ticket about answers going missing and it should not add another
  question that can go missing.
  .
  What to know before approving. This builds a path for an agent to write a
  ruling you gave in conversation onto a ticket. That is worth reading the
  bounds on, because it is a mechanism for an agent to record something you
  said, and the obvious failure is an agent recording something you did not.
  .
  The bounds are the three invariants. It can never write `human_approval` -
  that stays your tap, always. Every recorded ruling says whether it was
  relayed or tapped and by whom, so nothing pretends to be your own hand. It
  cannot overwrite a ruling you tapped, and any later tap of yours supersedes a
  relayed one. And an answer matching none of the declared options is refused
  rather than interpreted.
  .
  If you would rather no agent could ever write that field, say so on approval
  and I will retire this in favour of the manual archive route - which works
  today, and which is what I did for BL-1296 by hand.

description: |
  ## What is wrong

  A ticket poses a choice through `ruling_options`. The answer is recorded when
  the human taps the ask. But the human does not always answer there - they
  answer in whichever agent session they are already talking to, and that
  channel writes to no swarm store.

  From the swarm's side, an in-session answer is byte-for-byte identical to no
  answer at all: `human_ruling:` absent, `human_approval:` untouched, the
  stored Telegram ask stale, no operator decision record. There is no way to
  tell an honest report of a real answer from an unverifiable claim.

  ## Observed - the full cost, 2026-09-03

  BL-1296's echo-vs-worker fork was re-pended to collect a ruling. The operator
  answered it in the coder's interactive session. Then:

  1. The coder reported the ruling and asked for the approval to be restored.
  2. The specifier checked four stores, found nothing, declined to restore the
     approval, and recorded the claim as unverifiable - proposing, wrongly,
     that the coder had read option 1's "(recommended)" label back out of the
     ticket as if it were an answer.
  3. The coder corrected its own evidence file rather than defending it, and
     stated the real provenance.
  4. The specifier filed the answer to `backlog/answers-archive/` by hand.

  Four turns, one already-answered question, and a false inference about a
  colleague's conduct committed to `main` on the way. Every step was reasonable
  on the evidence available; the evidence was simply not there to be had.

  Same family from the other end as BL-1245 (a role-ask answer that reaches the
  human but pairs with nothing), and a sibling of BL-1367 (an approval surface
  that cannot record a ruling at all).

  ## How (direction, not mandate)

  - A CLI an agent runs to relay an answer it was given: the ticket, the option,
    who relayed it. It goes through `pendingApprovalReply.ts`'s existing
    `human_ruling:` writer rather than growing a second one - a second writer is
    how the two drift and how invariant 3 quietly stops holding.
  - Matching the answer to a declared option should be exact or refused, never
    fuzzy. An agent paraphrasing the human into the nearest option is precisely
    the failure this must not enable.
  - The provenance field is invariant 2 and is the whole reason this is safe to
    build. A relayed ruling that reads identically to a tapped one would be
    worse than no mechanism.
  - Filing the human's words to `backlog/answers-archive/` stays the
    specifier's, and stays a separate act from writing the field.

  ## Explicitly NOT in scope

  - Writing `human_approval` from any relay path. Invariant 1, and not
    negotiable.
  - The paused-pager route that cannot record a ruling at all (BL-1367) and the
    hardcoded approval byline (BL-1368).
  - A general capture of everything the human says in a session. This records
    an answer to a question a ticket actually asked, and nothing else.

qa_e2e_procedure: |
  1. Fixture ticket declaring three options, pending. Relay option 2. Confirm
     `human_ruling:` holds option 2, carries relayed-provenance and the relaying
     role, and that `human_approval:` is untouched (invariants 1 and 2).
  2. Relay an answer matching no declared option. Confirm refusal naming the
     options, and no field written.
  3. Tap option 1 on the ask, then relay option 3. Confirm the relay is refused
     and the tapped ruling is byte-identical afterwards (invariant 3).
  4. Relay option 2, then tap option 1. Confirm the tapped ruling wins and its
     provenance says tapped (invariant 3, other direction).
  5. Attempt to relay on a ticket declaring no `ruling_options`. Confirm refusal.
  6. Grep the implementation for any write to `human_approval` on the relay
     path and confirm there is none.
  7. Remove the fixture root in a `finally`, sweeping by prefix before the run
     too (BL-971).

notes: |
  Minted 2026-09-03 by the specifier, from a coder note flagging the gap after
  correcting its own evidence file on BL-1296. The coder raised it rather than
  minting it, which is the right split - and it is worth recording that the
  correction came voluntarily, because this ticket's whole premise is that the
  swarm cannot otherwise distinguish an honest relay from a careless one.

  Verified this pass rather than assumed:
  - `pendingApprovalReply.ts:142` is the sole `human_ruling: |` writer.
  - No CLI under `extension/out/tools/` records a ruling; `deliver-role-answer.js`
    serves role asks only, a different store and a different question.
  - BL-772's slices were checked for overlap before minting: slice D covers a
    single source of truth for whether a question is OUTSTANDING, which is the
    other side of this. No slice covers capturing an answer given out of band.

  Both `required_wiring` entries are real. The first anchors
  `pendingApprovalReply.ts`'s existing writer - a pre-existing live consumer the
  relay must route through, not a symbol this parcel introduces (BL-1235).

  IR-DRY: nine findings after one fix, max 0.75, all contrasts the scenarios
  exist to draw (relayed vs tapped, records vs records-no, pending before vs
  still-pending after). One genuine exact duplicate at 1.0 - "an answer is
  relayed" against "the answer is relayed" - was fixed by giving scenario 03 the
  Given the other scenarios have, rather than by rewording the step.

