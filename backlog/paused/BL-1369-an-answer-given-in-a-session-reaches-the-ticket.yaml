acceptance: specs/features/BL-1369-an-answer-given-in-a-session-reaches-the-ticket.feature

invariants:
  - "Relaying an answer NEVER records approval: human_approval is the human's own tap and no relay path may write it, however well attested the answer is."
  - "A recorded ruling always carries its provenance - relayed or tapped, and by whom - so a reader can weigh it rather than having to trust it."
  - "A relay never overwrites a tapped ruling, and a later tap always supersedes a relayed one - the human's own hand wins in both directions."

required_wiring:
  - 'extension/src/concierge/pendingApprovalReply.ts::human_ruling::the sole existing ruling writer is the live consumer a relay must go through, never a second writer'
