id: BL-1036
title: "every front-desk respawn is followed by \"409: Conflict: terminated by other getUpdates request\" - 12 restarts, 12 conflicts in 105 minutes - and the log announces the degradation but never the recovery, so a human cannot tell an outage from a blip"
milestone: M8
type: defect
severity: high
# high: the front desk is the only interactive surface between a human and a
# running swarm, and each conflict window is dead air on it. Not critical:
# no data is lost and the bot does recover between windows.
status: todo
epic: swarm-reliability
priority: 18
direction: swarm-reported
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1036-a-restart-does-not-cost-a-telegram-conflict-window.feature

invariants:
  - "A restart initiated by the supervisor never leaves two holders of the bot token polling at once, whether the old process exited gracefully or was killed outright."
  - "Every degraded-poll report is eventually followed by a recovery report or an unresolved report - the log never leaves a degradation open."

source: |
  Split 2 of 3 from .swarmforge/operator/INTAKE-front-desk-freshness-watchdog
  -restart-storm-20260822.md (human report relayed via Cursor 2026-08-22
  ~05:50 UTC). This is the intake's suspect (2).

  The human's report, verbatim:

    "front desk is not listening, I sent something in the Onboarding topic,
    and no answer there either"

  The intake's standing constraint on any fix here, verbatim:

    "Whatever the fix, it must be observable in the supervisor log (this
    intake was only possible because the log already names each event
    clearly) - do not regress that."

  And the intake's direction for this half, verbatim:

    "Investigate and fix the 409-on-every-restart independent of (1): confirm
    whether it is the unclean-SIGKILL-leaves-a-dangling-poll theory above or
    something else, and whether a longer graceful-shutdown window, or
    explicitly waiting out Telegram's own conflict window before the new
    process's first poll, resolves it."

  Siblings from the same intake: BL-1035 (a stale heartbeat file condemns the
  replacement) and BL-1037 (the build-freshness restart cadence).

description: |
  ## What happens

  Every respawn in `.swarmforge/operator/front-desk-supervisor.log` is followed
  immediately by:

      front-desk bot: poll degraded - 5 consecutive failures, still retrying:
      Telegram API responded with status 409: Conflict: terminated by other
      getUpdates request; make sure that only one bot instance is running

  Twelve bot respawns between 04:30Z and 06:14Z on 2026-08-22; twelve
  conflicts. The log has 58 such lines.

  ## What has already been ruled out (do not re-derive)

  The message accuses a second poller. There is none on this host, confirmed
  live at spec time:

  - Exactly one front-desk bot process runs (`ps` at 06:14Z: pid 5562, child
    of the single supervisor pid 92164). No orphan from a previous respawn
    survives - `make-kill-pid!` SIGTERMs, waits `FRONT_DESK_KILL_GRACE_MS`
    (default 2000), then SIGKILLs, and the old pid is gone before `spawn!`.
  - The only other process holding `TELEGRAM_BOT_TOKEN` is
    `telegram-cursor-bridge.js` (pid 17643), and it runs with
    `CURSOR_BRIDGE_INBOUND_QUEUE=1`, which is exactly the mode that drains the
    inbound queue and calls `getUpdates` never
    (`telegramCursorBridgeCore.js`, `shouldUseCursorBridgeInboundQueue`).
  - This is not the `not-principal` drop pattern in
    `front-desk-diagnostics.log`; that is a separate, already-diagnosed
    authorization mismatch.

  So the conflict is with the token's own just-killed poll, not with a live
  rival. The intake's working theory - a SIGKILLed child never closes its
  in-flight long-poll connection, and Telegram holds that slot open for some
  seconds - remains the leading suspect and is explicitly NOT yet confirmed.
  Confirming or refuting it against real Telegram Bot API behaviour is part of
  this ticket, not an assumption it may skip.

  ## The second half: the log never says it recovered

  There is no recovery line anywhere in 626860 lines of supervisor log. The bot
  reports "poll degraded ... still retrying" and then, if it recovers, says
  nothing. A human reading the log sees a wall of degradations with no ends,
  and cannot distinguish "conflicted for four seconds" from "conflicted until
  the next restart". That ambiguity is why the intake needed a hand-built
  timeline table to make the case at all.

  ## How (direction, not mandate)

  - Confirm the cause before fixing it. A longer graceful-shutdown window and
    an explicit wait before the replacement's first poll are two candidate
    remedies for two different causes; measure which one the evidence supports
    rather than shipping both.
  - Whatever the mechanism, the observable contract is scenario 01: a
    supervisor-initiated restart ends with the replacement completing a poll
    cycle without a conflict.
  - Keep it bounded on the unhappy path. A child that ignores SIGTERM is
    killed outright by design; that case must degrade to a bounded retry, not
    an unbounded conflict window (scenario 03).
  - Announce recovery. A degradation report that never closes is the
    observability defect above; pair it with a recovery report, and with an
    explicit unresolved report when the retry budget is spent.

  ## Scope

  - swarmforge/scripts/front_desk_supervisor_lib.bb - `check-one!`'s
    kill-then-spawn path and `make-kill-pid!`
  - swarmforge/scripts/front_desk_supervisor.bb - `FRONT_DESK_KILL_GRACE_MS`
    and any pre-poll wait it needs to configure
  - extension/src/tools/telegram-front-desk-bot.ts - the poll loop's
    degraded/recovered reporting and its retry budget
  - specs/features/BL-1036-a-restart-does-not-cost-a-telegram-conflict-window
    .feature and its step handlers

  Out of scope: the stale-heartbeat stall loop (BL-1035) and the restart
  cadence (BL-1037). This ticket makes each restart cheap; those two make
  restarts rarer.

qa_e2e_procedure: >
  1. At the parent commit, restart the front-desk bot through the supervisor
     (or its fixture) with a stub Telegram endpoint that models a held poll
     slot. Confirm the absence first: the replacement's first poll cycles
     return 409 and the log reports a degradation with no closing line.

  2. At the parcel commit, repeat identically. Confirm the replacement's first
     completed poll cycle carries no conflict.

  3. Repeat with the old child ignoring SIGTERM so it is killed outright.
     Confirm the conflict window still closes within the bot's retry budget,
     and that the log names the recovery.

  4. Force the conflict to outlast the retry budget. Confirm the log records
     it as unresolved rather than retrying in silence.

  5. Against the live swarm, restart the front desk once and confirm from
     `.swarmforge/operator/front-desk-supervisor.log` that the respawn is
     followed by no 409 line - the pattern this ticket exists to end.

notes: |
  IR-DRY reviewed, not merely run. One medium finding remains and must NOT be
  "fixed": `the conflict does not clear within the bot's retry budget`
  (scenario 05's Given) against `the conflict window ends within the bot's own
  retry budget` (scenario 03's Then). They are the deliberate opposite ends of
  one predicate - bounded recovery versus budget exhaustion - and collapsing
  them would erase the distinction the two scenarios exist to draw.

  `mutation_cost: medium` rather than low: the fix touches a timing-sensitive
  restart path plus the bot's poll-loop reporting, and the confirm-the-cause
  step is genuine investigation rather than a known edit.

  No `required_wiring:` is declared: every call site involved already exists
  (`check-one!` already calls `kill-pid!` then `spawn!`; the poll loop already
  reports degradation), so there is no new wiring to pin - only behaviour to
  change. Naming a pattern for an identifier that does not exist yet is the
  BL-874 failure mode.
