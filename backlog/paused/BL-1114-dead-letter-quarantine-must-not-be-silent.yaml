id: BL-1114
title: "A dead-lettered handoff can sit in a worktree inbox/new as *.handoff.dead after exhausted recovery with no role-visible next step — quarantine looks silent to the holder"
milestone: M8
type: defect
severity: high
# high: broken safety/health signal — mail can be quarantined and recovery
# exhausted while the owning role sees only debris and no actionable wake.
status: todo
epic: swarm-reliability
priority: 14
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1114-dead-letter-quarantine-must-not-be-silent.feature
human_approval: pending
approval_context: >
  Firm: a *.handoff.dead must never be a silent dead-end for the holding
  role after recovery is exhausted. Firm: corrupt quarantine and chase
  dead-letter share one visible escalate/announce surface.

  Measured nuance for your call: Operator notify state already lists this
  file under announcedFilePaths, so "Telegram never fired" is not the whole
  story — decide whether the fix is role-visible escalation, post-announce
  disposition of the .dead file, or both.
invariants:
  - "Every new *.handoff.dead is either announced with a recorded reason, or the notify sweep records a named refusal — never a silent no-op."
  - "When recovery attempts reach the configured max, a needs-human (or equivalent) escalation is raised and the owning role is not left with only silent debris."
description: >
  WHAT. Coder reported (2026-08-23 note): "DEFECT unticketed: inbox .dead
  quarantine is silent; see coder inbox/new/*.dead". Live evidence still on
  disk at mint time:
  `.worktrees/coder/.swarmforge/handoffs/inbox/new/00_20260822T222158Z_from_operator_to_coder_for_coder.handoff.dead`
  with sibling `.recovery.json` `{"attempts":3}`. The parcel body is a valid
  operator note (BL-1052/1053 reframe), not structural corruption.

  WHY. Dead-letter + recovery exist so mail cannot rot unseen (BL-353 notify,
  handoffRecovery). Exhausted recovery with only a .dead file left is a
  broken health signal from the holder's point of view even if Operator was
  announced once.

  HOW (direction, not mandate). Close the gap between announce-once and
  role-visible terminal escalation / disposition; ensure corrupt quarantine
  (handoff_lib quarantine-corrupt-handoff!) rides the same surface as chase
  dead-lettering.

qa_e2e_procedure: >
  (1) Place a fixture *.handoff.dead in a worktree inbox/new; run
  notify-dead-letters — announce or named refusal. (2) Set recovery
  attempts to max; run recovery — needs-human escalation and a role-visible
  signal. (3) Force corrupt quarantine at dequeue — same announce path as
  chase .dead. (4) Confirm the measured coder path is either cleared or
  escalated, not left as silent debris.

notes: >
  Source: specifier in_process residue from coder note
  50_20260823T091237Z_000860 (completed into full-sweep without a ticket;
  orphaned claim-progress/nudge sidecars cleared 2026-08-24 via
  handoff_lib/remove-sidecars-of! so false "continue TASK" wakes stop).
  Related: BL-353, BL-365, BL-122 recovery, BL-499.
