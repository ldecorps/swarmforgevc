invariants:
  - "A queued prompt is answered in exactly one topic: the one it was asked in, or the Cursor Remote topic when no origin was recorded — never both, never neither."
  - "A bridge state file written before this change still parses and still drains; a missing origin topic is a fallback, never a parse failure and never a dropped prompt."

required_wiring:
