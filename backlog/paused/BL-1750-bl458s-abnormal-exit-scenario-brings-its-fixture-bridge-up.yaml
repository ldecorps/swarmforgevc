description: |
  ## What is wrong

  BL-458's scenario 05 was red at BL-1738's mint census with
  `Error: fixture bridge never came up`, and BL-1738's text predicted it
  might stay red after the roots are fixed. coder note 002136 (evidence
  `backlog/evidence/BL-1738-coder-20260925.md`, 6887fd5988) confirms it:
  still red, BL-458 5 of 6. Its root (`ctx.root`,
  `aps-fixture-reaper-abnormal-exit-`) never reaches `operator_runtime.bb`,
  so BL-1517's refusal is not the cause. The front-desk launch path has
  no git-checkout guard (checked at mint).

  `specs/pipeline/steps/lib/fixtureReaperAbnormalExitHarness.js`
  symlinks the compiled `extension/out` into the root. It runs
  `launch_front_desk.sh <root>` with fake Telegram creds, waits 5000 ms
  for `.swarmforge/operator/bridge-token`, then waits 5000 ms for
  `GET /pipeline` to answer 200, and throws at ~line 68.

  Hypotheses, none verified:
  (a) The two 5 s waits are too short for a cold bb supervisor plus a
      node bridge at this host's usual load (10-30 on 20 cores).
  (b) The supervisor refuses its resolution and exits without claiming
      the pid (the BL-622 branch `launch_front_desk.sh` describes).
  (c) Something else in the fixture root.
  The supervisor's own log is `<root>/.swarmforge/operator/front-desk-supervisor.log`.
  The harness's teardown removes it, so read it before teardown.

  ## What is wanted
  - The evidence names the cause, quoting the supervisor/bridge log line.
  - The harness, or the step that prepares its root, is fixed so the
    bridge comes up and scenario 05 runs to its own assertions. BL-458
    runs 6 of 6.
  - STOP RULE: if the cause is in production code (the launcher, the
    supervisor, the bridge), do not fix it here. Record it and send the
    specifier a `note` (spec-gap) so it gets its own ticket.

  ## Scope
  - `specs/pipeline/steps/lib/fixtureReaperAbnormalExitHarness.js` and/or
    `specs/pipeline/steps/bl458AcceptanceFixtureProcessLeakSteps.js`
    (scenario 05's root and waits only).

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-458-acceptance-fixture-process-leak.feature`:
     all ok (6 of 6); record the host load.
  2. The evidence names the cause with a quoted log line. If it names a
     production cause, the parcel came with a spec-gap note and not a
     fix.
  3. No front-desk process from the fixture outlives the run:
     `pgrep -af 'aps-fixture-reaper-abnormal-exit-'` is empty afterwards.
  4. After landing: REGISTER_ROW_RETIRED for BL-458's acceptance row.

