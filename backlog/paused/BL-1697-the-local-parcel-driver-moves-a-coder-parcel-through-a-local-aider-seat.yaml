approval_context: >
  Queue-jump slice L2 (core) of INTAKE-local-aider-seats-20260924, minted
  approved under the human's own jump request (STEERING.md 2026-09-23;
  2026-09-15 ruling). No choice is posed here. FIRM: Claude seats and
