invariants:
  - "The driver queues a git_handoff for a parcel only when all five hold: the acceptance run failed after the merge and before the model turn, it passes after the last model turn, at least one commit exists after the post-merge HEAD, every spec file is byte-identical to its pre-turn copy, and every path those commits touch is in the editable set the driver added to the chat; every other outcome ends in exactly one escalation naming the first failed condition and no handoff."
  - "While the driver owns a seat, every text that enters that seat's pane is typed by the driver; no other handoffd injection (new-mail wake, chase poke, in-process resume banner) reaches it."
  - "Every seat whose provider lacks the parcel-driver capability (every Claude seat) receives byte-identical wake, chase and resume text to before this ticket."

description: |
  ## What is wrong
  A local aider seat cannot move a parcel. The live qwen2.5-coder
  mono-router moved nothing in 45 minutes on 2026-09-23: its coder held
  BL-1687's parcel since 09:43Z, never saw the task after a relaunch,
  asked for it twice and replied `! true`. Headless aider has no command
  channel (BL-1696 description). The overnight lab
  (`backlog/evidence/aider-seat-lab-20260924.md`) settled the design:
  - a 7B model cannot hold a multi-step procedure even with a stateful
    relay (0/4 on the six-command row; 0/2 as a model-led coder);
  - a deterministic driver ran the lifecycle flawlessly (S6, S6d);
  - given the chance the model games the test: S6d edited the READ-ONLY
    acceptance test to match its bug, the suite went green with a commit,
    and only the driver's spec-untouched check stopped a false pass;
  - `/read-only` is advisory under `--yes-always` ("Allow edits to file
    not in chat?" is auto-accepted), so the spec must be protected
    outside aider;
  - aider drops edits to files not yet in the chat
    (`check_for_file_mentions` runs before `apply_updates`), so the files
    the model must edit are added up front;
  - the first S6 run handed off an UNCHANGED tree in 96 s because the old
    tests already passed, so "tests green" alone is never a pass.
  - any repo path in a model reply is auto-added to the chat as editable
    (lab section 1, fact 3), so the files a model may change must be
    checked at the gate, not assumed from the chat set.

  ## Why
  This is the piece that lets a local model do real parcel work at all.
  handoffd already owns every pane injection from one loop; a driver
  outside it would race the wake and chase injections, so it lives there.

  ## What is wanted
  A driver in `swarmforge/scripts/local_parcel_driver_lib.bb` (filename
  fixed at mint; the wiring anchor names it), run from handoffd's loop,
  for seats whose provider carries a new parcel-driver capability in
  `prompt_engine_lib.bb`'s `provider-capabilities` (set on `aider` only).
  In this slice it drives the `coder` role's `git_handoff` parcels. A
  seat is a **driver seat** when its provider carries the capability AND
  its current role is one the driver drives (here: `coder`); an aider
  seat in any other role is not a driver seat and is left exactly as
  today, wakes included.

  Per parcel, in order, recording each step in a per-role state file
  under `.swarmforge/local-driver/`:
  1. **Serve.** `seat next` for the seat's role (run by the driver in the
     seat's checkout with the seat's role env); the driver reads the
     `in_process` parcel file itself.
  2. **Merge.** `seat merge <sender> <commit>` from the parcel's payload.
     Exit 3 (conflict) -> escalate "merge conflict" with the paths.
  3. **Red check.** `seat test` with `SEAT_TICKET=<BL>` and
     `SEAT_ACCEPTANCE=<the ticket's acceptance: path>` in its
     environment. It must FAIL; a pass escalates "acceptance passed
     before any edit" and no instruction is sent.
  4. **Chat set.** Clear the chat; `/read-only` the ticket YAML and its
     acceptance feature (the spec); `/add` the existing files the ticket
     names as editable. Record the spec files' bytes (hash) and remove
     their write permission for the duration of the model turns.
  5. **One instruction**, typed WITHOUT the aider no-narration suffix:
     implement BL-<n> exactly as the read-only ticket describes so the
     read-only acceptance passes; never edit a read-only file.
  6. **Gate** after the pane is idle: `seat test` (same env) passes; at
     least one commit after the post-merge HEAD; every spec file
     byte-identical; every path those commits touch is in the editable
     set of step 4 (a path mentioned in a reply is auto-added by aider
     and can be edited; lab S1 watched a 7B model rewrite a pipeline
     script that way). On a failure, type one fix request naming the failed
     condition and gate again, up to `seat_fix_turns` (pack `config`,
     default 3) fix requests.
  7. **Pass** -> `seat handoff <next role> <BL>` then `seat done`.
     **Fail after the last fix turn** -> `seat ask "<BL>: <condition>"`
     and the parcel stays `in_process` with the state file marked
     escalated (the hold's release is BL-1698). Spec write permission is
     restored on every exit path.

  handoffd's new-mail wake, chase poke and in-process resume paths skip
  a driver seat (its driver is the only writer to that pane) and are
  unchanged for every other seat, including an aider seat in a role the
  driver does not drive.

  ## How (direction, not mandate)
  - Capability, not provider name (capability-branching-01): the driver
    and the injection paths read the flag, never the string "aider".
  - Model output comes from the seat's `--llm-history-file`
    (`.swarmforge/aider-llm-history/<role>.log`, ab1d4cb2bd); the pane is
    only for typing and idle detection (the existing
    capture/pending-input helpers in `agent_runtime_inject.bb`). Never
    scrape the pane for the model's reply.
  - Raw typing without the suffix: `notify-agent!` appends
    `aider-no-narration-suffix` to any `:text`; add a raw path next to it
    rather than stripping text after the fact.
  - The next role: whatever the existing forward routing computes for the
    coder (chain order plus `required_stages`), never a literal
    "cleaner".
  - "Files the ticket names": repo-relative paths in the ticket that exist
    in the checkout, plus the `required_wiring` paths; a named path that
    does not exist yet is created by `/add`. Never `/add` anything under
    `swarmforge/scripts/`, `swarmforge/roles/` or `swarmforge/constitution/`
    (Firm: no pipeline script in a seat's chat).
  - Idle detection must tolerate aider's own `--auto-test` loop (BL-1699
    adds it): the turn ends when aider returns to its prompt, not at the
    first reply.
  - Tests (T1): a fake tmux that records typed text and serves a scripted
    capture, a canned llm-history file, a `mkdtemp` + `git init` project
    proven by `rev-parse --git-common-dir` before any mutating git
    command (BL-1390), and a stand-in model that reacts to the
    instruction by committing a prepared edit. No real model, no live
    router.
  - Documenter: a how-to for the driver (what it does per parcel, the
    state file, the escalation texts); `handoff-flow.mmd`'s change
    trigger (the handoff file lifecycle, its gates) fires - add the
    driver's serve/gate/escalate path for driver seats to it in this
    parcel.

  ## Scope
  - New: `swarmforge/scripts/local_parcel_driver_lib.bb`.
  - `swarmforge/scripts/handoffd.bb` (run the driver; skip driver seats
    in wake/chase/resume).
  - `swarmforge/scripts/prompt_engine_lib.bb` (the capability flag) and
    `swarmforge/scripts/agent_runtime_inject.bb` (the raw typing path).
  - New: `specs/pipeline/steps/bl1697LocalParcelDriverSteps.js` (BL-233).
  - Docs: one how-to; `docs/diagrams/handoff-flow.mmd`.
  - Out of scope: resume after a restart, the escalation hold's release,
    note parcels, babysitterd (BL-1698); aider launch flags and bootstrap
    text (BL-1699); non-coder roles on driver seats (the BL-1702 ruling);
    any Claude seat or pack.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule). The live router is
  NOT started (intake test tiers: this slice is T1).
  1. `node specs/pipeline/cli.js specs/features/BL-1697-the-local-parcel-driver-moves-a-coder-parcel-through-a-local-aider-seat.feature`:
     all scenarios ok.
  2. The shell and bb suites that cover handoffd's wake, chase and resume
     paths (`swarmforge/scripts/test/test_handoffd_chase_sweep_wiring.sh`
     and its siblings in `suite-manifest.tsv`) are green, one run.
  3. Read the diff: every wake/chase/resume skip reads the capability
     flag, not the provider name (`grep -n '"aider"'` in the changed
     handoffd lines prints nothing new).
  4. `git diff main...HEAD --name-only` names only the Scope files,
     tests, docs, the diagram and evidence.

