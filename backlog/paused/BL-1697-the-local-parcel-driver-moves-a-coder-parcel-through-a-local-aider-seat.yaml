notes: |
  Minted 2026-09-24 by the specifier (claude-opus-5-5 seat). Approved at
  mint under the human's explicit queue-jump request (STEERING.md
  2026-09-23; 2026-09-15 ruling); no choice posed. Amended the same
  morning, before promotion, to add the fifth gate condition (commits
  touch only the editable set) while scoping BL-1701's hazards. The
  intake's L2 is
  split here: this ticket is the per-parcel loop and gate; BL-1698 takes
  resume after restart, the hold's release, note parcels and babysitterd.

  Deviation from the intake, stated: the intake's chat set protects "files
  the inbound commit ADDED". That is the lab fixture's shape; in this
  repository the ticket and its feature are minted on main long before
  the coordinator's routing commit, so the spec is named from the ticket
  itself (the YAML and its `acceptance:` path).

  INVEST: Independent (BL-1696 only, sequenced by depends_on), Negotiable
  (state file shape, idle detection, path extraction are direction),
  Valuable (the first path by which a local model's edit reaches the next
  role), Estimable (one lib, three small edits, one handler; justified
  high band), Small (six scenarios, three invariants; the rest split to
  BL-1698), Testable (fake pane, stand-in model, throwaway project).
