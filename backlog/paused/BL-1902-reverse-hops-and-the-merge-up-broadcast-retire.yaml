description: |
  ## What is wanted

  - `swarmforge/packs/full-forge.conf`: the cleaner window drops
    `back-one` and the architect window drops `back-all`, so both are
    forward-only (the default). Measured at mint: those are the only two
    reverse-hop declarations among the pack's 8 role windows.
  - `ceremony_handoff_lib.bb`: the `merge-up` ceremony is removed, with
    its test-runner rows. The `bookkeep` ceremony, which the lander sends,
    is unchanged.
  - handoff-protocol.md stops describing the merge-up broadcast and
    reverse hops as live (documenter).
  - The step handler `bl1902ReverseHopsAndMergeUpRetireSteps`, registered
    in the same parcel.
  - The prose that names the merge-up broadcast or reverse hops (QA.prompt's
    approval steps, Article 2.3 "Reverse hops", Article 2.5, workflow.prompt
    "QA merge-up broadcast", PIPELINE.md step 5) is the specifier's, landed
    when this ticket activates (BL-798). Nothing the coder builds depends
    on it.

  ## Scope

  The pack conf, the ceremony lib and its runner, handoff-protocol.md, the
  step handler, evidence.

qa_e2e_procedure: |
  Before taking it up, confirm `.swarmforge/roles.tsv` shows `task` for
  the cleaner and the hardender (see notes).
  On the parcel commit:
  1. ONE run: `node specs/pipeline/cli.js specs/features/BL-1902-reverse-hops-and-the-merge-up-broadcast-retire.feature`:
     all ok.
  2. `bb swarmforge/scripts/test/ceremony_handoff_lib_test_runner.bb`: green.
  3. After the land and the next relaunch: a forward from the cleaner or
     the architect writes no non-forwarding copy to an earlier role's
     inbox, and a land sends no merge-up note.

notes: |
  Minted 2026-10-02 by the specifier from the root intake above, one of
  three slices (BL-1901 notes carry the full split).
  Promotion precondition: the cleaner and hardender seats must be live in
  task mode. At mint `.swarmforge/roles.tsv` reads `batch` for both
  (launched before BL-1871 landed at 10:31), while `full-forge.conf`
  already declares `task`. A relaunch from the pack makes it true. While
  a batch seat is live, the merge-up note is how it syncs, so retiring it
  early would strand that seat's branch.
