id: BL-1680
title: "BL-1384's acceptance handler fakes the local endpoint's catalogue as ['qwen3:14b'] but lets the REAL runLocalSeatTurn resolve the model id from the live process.env (resolveLocalSeatModelId(process.env, deps.modelId) with no modelId passed and SWARMFORGE_LOCAL_SEAT_MODEL never scrubbed), so scenario 02 'the bridge draining the queue answers in the local seat topic' is red on every session whose pack exports SWARMFORGE_LOCAL_SEAT_MODEL=qwen2.5-coder:latest - all of them today: 'Local seat cannot answer: the endpoint is up but does not hold \"qwen2.5-coder:latest\" (it holds: qwen3:14b)'; first sighted by the coder from inside BL-1658 (note 000045, 14:07Z); the handler pins the model id it fakes and BL-1384's feature is green whatever the host exports"
