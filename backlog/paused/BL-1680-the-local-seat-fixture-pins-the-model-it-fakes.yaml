invariants:
  - "No acceptance handler or unit test reaches resolveLocalSeatModelId with the live process.env: every caller of the real runLocalSeatTurn pins modelId or the SWARMFORGE_LOCAL_SEAT_MODEL seam (census 2026-09-21, six files: bl1235LocalQwenSeatSteps.js pins; bl1384LocalSeatTopicForwardedSteps.js leaks; bl1235LocalQwenSeat.test.js and bl1235LocalQwenSeatLive.test.js pin; bl1296BubbleSeatLive.test.js and telegramCursorBridgeLive.test.js stub the turn function entirely)."

description: |
  ## What
  `specs/pipeline/steps/bl1384LocalSeatTopicForwardedSteps.js` (line ~176)
  wraps the REAL `runLocalSeatTurn` and fakes only the endpoint:
  `readEndpoint` returns `catalogue: ['qwen3:14b']`, the module's
  `DEFAULT_LOCAL_SEAT_MODEL_ID`. The turn then asks for the model
  `resolveLocalSeatModelId(process.env, deps.modelId)` returns
  (`extension/src/tools/localQwenSeatLive.ts` line ~206;
  `localQwenSeat.ts` lines 44-56: configured, else the env var
  `SWARMFORGE_LOCAL_SEAT_MODEL`, else the default). The handler passes no
  `modelId` and never scrubs the env var, so on any session that exports
  the var to another model the seat refuses:
  `Local seat cannot answer: the endpoint is up but does not hold
  "qwen2.5-coder:latest" (it holds: qwen3:14b). Endpoint
  http://fixture.invalid. No other seat has been asked.` - scenario 02
  red, 3/4 green. Every live session on this host exports
  `SWARMFORGE_LOCAL_SEAT_MODEL=qwen2.5-coder:latest` (read from the
  coder, coder@2, QA and specifier sessions' /proc environ; exported by
  no tracked file - the launcher's environment).

  ## Why
  A test that reads the host's environment through a seam it left open
  is red or green by pack, not by code (engineering.prompt: redirect
  through env seams; BL-1445's fail-open census shape - nobody ran a
  landed feature until BL-1658 touched its handler). It is a standing red
  on main (register row, this mint) that blocks BL-1658's QA approval and
  every future parcel touching the handler, and it reads as a seat fault
  to whoever runs it. Adjudication:
  backlog/evidence/unowned-red-bl1384-sc02-live-env-model-id-adjudication-specifier-20260921.md.

  ## How (direction, not mandate)
  - In the handler's `runLocalSeatTurnFn` wrapper pass
    `modelId: DEFAULT_LOCAL_SEAT_MODEL_ID` (import it from
    `extension/out/tools/localQwenSeat`) beside the faked catalogue so
    the two can never drift - or hand the turn a scrubbed env through the
    resolver's own `env` parameter if the wrapper exposes one. Never
    `delete process.env.SWARMFORGE_LOCAL_SEAT_MODEL` globally in a
    handler that runs beside others (Vitest/node:test isolation).
  - Scenario 01 runs BL-1384's feature in a child process
    (`node specs/pipeline/cli.js <feature>`) with the env var unset and
    set to `qwen2.5-coder:latest`; both must be all-ok. Scenario 02 drives
    the fixture turn directly and asserts the completion was requested for
    the catalogue's own model.

  ## Scope
  - `specs/pipeline/steps/bl1384LocalSeatTopicForwardedSteps.js` (the fix;
    BL-1658's parcel edits this file's require line - merge, do not fork).
  - `specs/features/BL-1680-the-local-seat-fixture-pins-the-model-it-fakes.feature`
    and `specs/pipeline/steps/bl1680LocalSeatFixturePinsItsModelSteps.js`
    (same parcel, BL-233, registered in `specs/pipeline/steps/index.js`).
  - The register row for BL-1384's feature leaves in this parcel's land
    (BL-1631); the parcel never edits the register (coder.prompt
    2026-09-20). Documenter: the BL-1235/BL-1384 how-to notes that the
    handler pins its model; no diagram trigger.

qa_e2e_procedure: |
  On the parcel commit, from the repo root, ONE run each.
  1. `echo $SWARMFORGE_LOCAL_SEAT_MODEL` (expect qwen2.5-coder:latest on
     this host), then `node specs/pipeline/cli.js specs/features/BL-1384-the-local-seat-topic-reaches-the-bridge-through-the-front-desk.feature`:
     4/4 ok, scenario 02 posts "Hello from qwen".
  2. `node specs/pipeline/cli.js specs/features/BL-1680-the-local-seat-fixture-pins-the-model-it-fakes.feature`:
     all ok.
  3. `grep -c 'modelId' specs/pipeline/steps/bl1384LocalSeatTopicForwardedSteps.js`
     is at least 1 (or the scrubbed-env form is present), and the seat's
     production files are untouched: `git diff --stat origin/main -- extension/src/tools/localQwenSeat.ts extension/src/tools/localQwenSeatLive.ts` is empty.
  4. Standing-red register: the land retires the BL-1384 row; the register
     report after landing shows no unowned row and no BL-1680 row.

