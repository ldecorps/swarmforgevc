description: |
  ## What is wrong

  `extension/src/quality/qaGather.ts` `collectFailingAndUnidentified`
  gives a red unit or properties row that names no failing file one entry,
  `{ file: <check id>, join: 'unidentified' }`, and nothing else. The unit
  lane (`extension/scripts/recordTestDuration.js`) exits 1 without any FAIL
  line for three reasons it prints itself:
  - vitest's own exit 1 on an unhandled error (`Unhandled Error` block,
    e.g. `[vitest-worker]: Timeout calling "onTaskUpdate"`, BL-1889's
    flake), with every test passing;
  - the per-file budget guard's refusal (`printGuardReport`: `suite file
    budget exceeded:` and the new-pole or unowned-row lines that follow);
  - the suite work ratchet's refusal (`formatSuiteWorkVerdict`, labelled
    `REFUSED`, BL-1599).
  QA had to dig each of these out by hand (source).

  ## What is wanted

  - A red unit row that names no failing file gets one join entry per
    cause its whole output printed, each naming the cause
    (`unhandled-error`, `file-budget`, `work-ratchet`) and carrying the
    lane's own line(s) for it (the error message, the refused files, the
    verdict line).
  - A red unit row whose output printed none of them keeps today's exact
    `unidentified` entry.
  - The properties row is unchanged: its lane ignores unhandled errors
    (BL-871, `dangerouslyIgnoreUnhandledErrors`), so one in its output is
    never its exit cause.
  - A row that names a failing file is joined exactly as today.

  ## How (direction, not mandate)

  - Read the same whole output BL-1769's join reads (`rawOutputByCheckId`),
    never the excerpt.
  - Keep the classifier pure over the output text. The step handler builds
    its fixture output with the lanes' own formatters (`formatGuardReport`,
    `formatSuiteWorkVerdict` from `extension/out`) so a format change
    breaks the test rather than silently blinding the parser (BL-897); the
    unhandled-error block is vitest's, so copy its real shape once into the
    fixture and say where from.
  - Keep `collectFailingAndUnidentified` and `buildRegisterJoin` inside
    their complexity baseline (BL-1769's hardener extraction).

