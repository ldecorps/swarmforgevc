id: BL-1058
title: "The entire shell test lane is dark on this host: tmp_cleanup.sh calls mktemp in BSD-only syntax, so all 83 suites that source it die at source time with no output and no test ever runs"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
priority: 6
direction: swarm-detected
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1058-the-shell-test-lane-is-dark-on-gnu-mktemp.feature

invariants:
  - "The tmp-cleanup helper behaves identically under BSD/macOS and GNU/Linux mktemp: the registry is created, and every registered fixture root is swept on both the clean-exit and the failed-command path. No single platform's mktemp dialect appears in the call."
  - "Sourcing the helper never leaves a shell partially initialized. Either the registry variable names a usable file, or the source fails loud with an error naming the tmp-cleanup registry as what could not be created - never a state where a later register_tmp_dir hits an unbound variable."

description: |
  ## What is wrong

  `swarmforge/scripts/test/lib/tmp_cleanup.sh:55` creates its registry with:

      __SWARMFORGE_TMP_CLEANUP_REGISTRY="$(mktemp -t swarmforge-tmp-cleanup-registry)"

  `mktemp -t <prefix>` is BSD/macOS syntax. GNU coreutils `mktemp` treats the
  operand as a TEMPLATE and requires at least three trailing `X`s, so on a GNU
  userland the call is a hard error:

      mktemp: too few X's in template 'swarmforge-tmp-cleanup-registry'

  Every one of the **83** shell test files that sources this helper does so at
  the top, under `set -euo pipefail`. The failed command substitution exits the
  script immediately - before a single test body runs. Reproduced on this host:

      $ bash swarmforge/scripts/test/test_bounce_bridge_headless.sh
      mktemp: too few X's in template 'swarmforge-tmp-cleanup-registry'
      EXIT=1

  No test output at all. `swarmforge/scripts/test/test_tmp_cleanup_lib.sh` -
  the helper's own suite, the one thing that would have caught this - sources
  the same helper and dies the same way (`EXIT=1`).

  ## Why it matters more than one bad flag

  Babashka and shell have **no mutation, CRAP or DRY tooling wired**
  (engineering.prompt, Startup Tools). Their only gate is this unit suite. With
  it dark, every swarm-machinery ticket's quality gate is unenforced on this
  host - the hardener has nothing to run and QA has nothing to check.

  The failure is at least LOUD (exit 1, message on stderr) rather than a false
  green, so nothing has silently shipped past a passing-looking gate. But the
  lane is fully non-functional until this is fixed.

  ## How it got here

  Introduced by BL-801 (`d5b784115`, 2026-08-10), which correctly replaced a
  shell array with a file to survive subshell forks. That fix was authored and
  verified on macOS, where `mktemp -t <prefix>` is valid, and the host moved to
  WSL2/Linux on 2026-08-22 - which is when all 83 suites went dark at once.
  BL-801's own reasoning is sound and must be preserved: the registry stays a
  FILE keyed per top-level process, and the `while read` sweep stays as-is.
  Only the call that creates it is wrong.

  ## What is wanted

  1. Create the registry in a form both userlands accept. An explicit template
     with no `-t` is the portable shape - `mktemp "${TMPDIR:-/tmp}/<prefix>.XXXXXX"`
     works identically on BSD and GNU. This is direction, not mandate; any form
     both accept is fine.
  2. Fail loud and named if the registry cannot be created, rather than
     propagating a bare tool error and leaving the variable unset. Today the
     only clue is mktemp's own message, which never mentions this helper, the
     test, or the tmp-cleanup registry (invariant 2).
  3. `swarmforge/scripts/test/test_tmp_cleanup_lib.sh` must cover BOTH mktemp
     dialects, not just whichever one the authoring host happened to have. A
     shim on `PATH` that accepts only GNU template syntax, and one that accepts
     only BSD prefix syntax, is the seam - that is what makes this regression
     catchable on either host instead of only after a migration.

  ## Scope

  `swarmforge/scripts/test/lib/tmp_cleanup.sh` and its own suite. Exactly one
  `mktemp -t` occurrence exists in the tracked tree (swept 2026-08-22), so this
  is a one-call fix plus its guard.

  ## Out of scope

  - The wider BSD-vs-GNU portability class. It is real and partly addressed
    already (`swarmforge/scripts/portable_stat_lib.sh` for `stat -f`/`-c`,
    BL-803 for `sed -i`), and there are GNU-only `sed -i` calls sitting in four
    test scripts that are the exact mirror bomb for the next macOS host. That
    sweep, and the fact that nothing runs this suite on both userlands, is
    recorded on the epic's remaining_slices - not folded in here.
  - BL-974 (paused) is a different defect in the same lane (fixture roots
    overrunning the 100-char socket guard). Independent; do not bundle.

qa_e2e: |
  On this GNU coreutils host, at the parcel commit:

  1. `bash swarmforge/scripts/test/test_tmp_cleanup_lib.sh` exits 0 with test
     output, where it exits 1 with only an mktemp error today.
  2. Run every shell test that sources the helper. None may fail while sourcing
     it. Suites that fail for their OWN reasons are fine and are not this
     ticket's business - what must be gone is the class of failure where the
     output is a bare mktemp error and nothing else:

         for f in swarmforge/scripts/test/*.sh; do
           out="$(bash "$f" 2>&1)" || true
           case "$out" in *"too few X's in template"*) echo "STILL DARK: $f";; esac
         done

     That loop must print nothing.
  3. Confirm no fixture roots leak: after the run, no new
     `swarmforge-tmp-cleanup-registry*` file remains under `$TMPDIR`.

source: >
  QA note to specifier 2026-08-22 (handoff 20260822T130558Z_000876):
  "mktemp -t GNU syntax breaks tmp_cleanup.sh, ~83 shell tests - please spec".
  Reproduced and swept by the specifier the same day; the 83 figure is
  confirmed exact.

notes: |
  SEVERITY RATIONALE: `high`, not `critical`. The swarm is up and the pipeline
  is moving, and the failure is loud rather than a false green, so no work has
  shipped past a gate that only appeared to pass. But the only quality gate the
  Babashka/shell lane has is unenforceable until this lands, which is a broken
  safety signal - Article 3.2.4's `high` band. This ticket is therefore
  expedited ahead of non-expedited work.

  TOOLING FALLBACK: this fix lands in the shell lane, which has NO mutation,
  CRAP or DRY tooling wired. Its gate is its own unit suite. The hardener must
  record that degraded fallback explicitly and must not report a mutation or
  CRAP result it did not run.

  PRESERVE BL-801: that ticket's file-not-array registry design is the reason
  registrations made inside `$(...)` subshells survive at all, and its
  `while read` sweep is what keeps the EXIT trap safe under bash 3.2's empty-array
  `unbound variable` behaviour. Change the creation call only; do not revisit
  the registry's shape.
