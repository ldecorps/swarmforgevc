description: |
  ## Metric (locked)

  Count of tickets landed (moved into `backlog/done/`) in each **8 consecutive
  hours** window. Aggregation: max over rolling 8h windows per calendar day
  (preferred default — one chartable point per day that answers "hardest
  8-hour stretch"). Document if implementer chooses shift-aligned blocks
  instead; chart and telemetry must share one definition.

  ## History + axis

  Prefer existing telemetry if it answers the window; else create append-only
  jsonl going forward; git lifecycle closes fill history. Plot as far back as
  sources allow. **Non-linear time axis** — recent values more precise than
  older (warped / log-ish time); Y may stay linear.

qa_e2e_procedure: >
  (1) Fixture closes → 8h window count. (2) Git history backfill without a
  second reader. (3) Chart/PNG path includes series with non-linear time.
  (4) Telemetry append if created. (5) Epic trackers not counted as landed.

out_of_scope: |
  - PWA burndown (BL-659).
  - Replacing BL-599 intake balance or BL-896 open burndown.
  - Changing swarm shift schedule length.

