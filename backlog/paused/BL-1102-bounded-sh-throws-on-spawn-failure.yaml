id: BL-1102
title: "The daemon's bounded shell-out throws on a spawn failure instead of returning one: every caller of daemon_cycle_guard_lib/sh! is one unspawnable binary away from an unhandled IOException, and handoffd's delivery loop has no catch to stop it"
milestone: M8
type: defect
severity: high
# high, not critical: it needs a binary that cannot be started at all, which a
# healthy host does not have - but the swarm has hit exactly that (a PATH
# missing tmux, measured 2026-08-23), and when it fires the failure is silent
# and total. The delivery loop's only wrapper is a finally, so the throw ends
# the loop and the last log line is a clean "stopped": delivery, chase and the
# endless-loop halt all stop while the record reads like an orderly shutdown.
# A broken safety signal, which is the high bar. Not critical: the supervisor
# still sees a non-zero exit and the swarm is not down until it fails to
# restart.
status: todo
assigned_to: coder
epic: swarm-reliability
priority: 10
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1102-bounded-sh-throws-on-spawn-failure.feature

human_approval: pending
approval_context: >
  One decision needs sign-off, and it is the same trade-off BL-1031 was asked
  about, pointing the other way. Making a spawn failure a RETURNED result means
  every existing caller's `(:exit result)` check absorbs it as an ordinary
  command failure - a missing tmux stops being a loud crash and becomes dozens
  of quiet wrong answers, unless each caller is taught the difference. The
  direction below is to return it AND make it distinguishable (the shape
  BL-1071's coder already chose locally for babysitter_check.bb's own `sh!`:
  a synthesised exit plus a `:spawn-failed?` flag), on the grounds that a
  daemon whose job is to notice trouble must not die of it. The alternative is
  to keep the throw and instead give the delivery loop a catch that logs and
  continues, which localises the change to one place but leaves every non-daemon
  caller of the shared lib exposed. What is firm either way: an unspawnable
  binary must not end the delivery loop, and it must never be recorded as a
  command that ran.

invariants:
  - "No spawn failure leaves the bounded shell-out as a throw - every call returns a result map, whatever state the named binary is in."
  - "A spawn that never happened, a command that ran and exited non-zero, and a wait-bound hit are three outcomes a caller can tell apart; no two of them present identically."
  - "A call that does spawn is unaffected: same exit code, same stdout, same stderr, same options honoured as before the change."

description: >
  WHAT. swarmforge/scripts/daemon_cycle_guard_lib.bb's `sh!` is the daemon's
  bounded subprocess chokepoint: it bounds the wait, destroys the tree on a
  bound hit, and returns `{:exit 124 ...}` so callers' existing `(:exit result)`
  checks keep working. It does not cover the SPAWN. When the named binary
  cannot be started, `process/process` throws IOException out of `sh!` before
  any of that runs. Measured 2026-08-23:
  `(daemon-cycle-guard-lib/sh! {:continue true} "definitely-not-a-real-binary")`
  throws - `:continue` suppresses a non-zero EXIT, never a failed start.

  WHY IT MATTERS. handoffd.bb calls this lib from roughly twenty sites,
  including its tmux wrapper (line 318) and `poll-once!`, the delivery tick.
  The main loop's outer form is a `try` with a `finally` and NO `catch`
  (line ~3318): a throw from `poll-once!` runs the finally - deleting the pid
  file and logging `stopped` - and then leaves the loop. So one unspawnable
  binary stops delivery, chase, the dispatch-gap sweep and the endless-loop
  halt at once, and the last thing in the log is a line that reads like an
  orderly shutdown. `canary-sweep!` and the cadence sweeps are individually
  wrapped; `poll-once!` is not.

  CONSTRAINTS. This is the SPAWN half of the chokepoint contract and is
  deliberately separate from BL-1031, which routes more call sites INTO `sh!`
  for the WAIT bound - the two are orthogonal, and BL-1031 landing first makes
  this one matter more, not less, because it widens the set of calls that
  inherit the throw. Do not narrow the existing catch behaviour that BL-1071's
  coder pass deliberately left wide (its finding 3): the fix here adds a
  distinguishable outcome, it does not make any other throw class abort a sweep
  again.

  HOW (direction, not mandate). Mirror the shape BL-1071's coder already chose
  inside babysitter_check.bb: catch the spawn failure at the chokepoint,
  synthesise a result carrying the exception message and a flag that says the
  spawn never happened, and leave every other path byte-identical. Whether the
  delivery loop also gains its own catch is a second question the approval
  above settles.

qa_e2e_procedure: >
  (1) In a scratch checkout, run a one-liner that calls the shared `sh!` on a
  binary name that exists nowhere on PATH; before the fix it throws, after it
  must return a result whose spawn-failure marker is present. (2) Repeat with a
  real command that exits non-zero and confirm the two results differ in a
  field, not only in wording. (3) Repeat with a real command that succeeds and
  diff the result map against the pre-change behaviour - exit, out and err
  unchanged. (4) Start handoffd with a PATH from which tmux has been removed,
  watch the log for one full cycle: it must record the spawn failure and log a
  further heartbeat, and must NOT log `stopped`. (5) Restore PATH and confirm
  normal delivery resumes.

notes: >
  Filed by the specifier 2026-08-23 from the coder's BL-1071 findings note
  (follow-up b, backlog/evidence/BL-1071-coder-findings.md on the coder branch):
  "daemon_cycle_guard_lib/sh! does not catch spawn failure. Every caller of that
  lib is one unspawnable binary away from the failure mode this whole ticket is
  about. babysitter_check.bb's own sh! is now protected; the shared one is not,
  and its callers are outside this ticket's scope." The coder measured the throw
  directly and reproduced the downstream effect live (with tmux absent from every
  PATH entry, the babysitter's observer threw and the sweep printed the
  all-clear).
  Specifier's own reading of handoffd.bb while triaging: the main loop's `finally`
  with no `catch` is what turns the throw into a clean-looking `stopped` line.
  The narrower diagnosability defect - that an abnormal daemon exit is logged
  identically to an orderly one - is recorded on the swarm-reliability epic's
  remaining_slices rather than ticketed here, so this slice stays one sitting.
