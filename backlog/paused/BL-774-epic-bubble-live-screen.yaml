notes: |
  ## The BL-569 overlap, RESOLVED 2026-08-06

  This epic used to warn that **BL-569** (`live screen interactive pane input`,
  human-approved, priority 96, `status: needs_design`) — a principal-gated
  remote keyboard on the Live Screen *in the Mini App* — was slice C wearing
  different clothes, and would be paid for twice if Live Screen then moved to
  Bubble natively.

  **The human's remote-HTML ruling dissolves that.** Both surfaces now render
  the same bridge-side Live Screen, so BL-569's keyboard lands on the Mini App
  and on Bubble at once; it is not duplicate work and there is nothing to fold.
  BL-569 is therefore recorded as this epic's **slice C** in `decomposes_into`
  and amended for the Bubble principal, rather than a second steer ticket being
  minted alongside it.

  That also discharges the steer directive from
  `INTAKE-bubble-live-screen-coordinator-resident.md` ("a text input (+
  deliberate send) that steers that agent as if the human typed into the tmux
  pane... human wants the capability locked in"), which is recorded on BL-569
  rather than on BL-775 — BL-775 stays read-only.

  Two further raw intakes in the backlog root also describe Live Screen content
  in Bubble — `INTAKE-bubble-host-agent-thinking-live-screen.md` and
  `INTAKE-bubble-live-screen-coordinator-resident.md`. Both belong to this
  epic when they are drained; they are among the intakes waiting on BL-769.

  ## Why the epic depends on BL-769

  Every slice is Android. Until BL-769's JVM unit seam lands, an Android
  ticket's acceptance contract runs zero scenarios — five tickets have already
  shipped that way. This epic's children must not be promoted before it.
