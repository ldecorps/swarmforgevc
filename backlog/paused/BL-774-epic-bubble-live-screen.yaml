id: BL-774
title: "EPIC — Bubble Live Screen: move the operator Live Screen off the Telegram Mini App onto Bubble; do not promote directly; tracks children"
milestone: M8
status: todo
type: epic
epic: bubble-live-screen
priority: 14
depends_on: [BL-769]
mutation_cost: high
decomposes_into: [BL-775]
remaining_slices:
  - "Slice B — read-model rendering parity: every status block the Mini App Live Screen shows today renders in Bubble, at or better than its current refresh behaviour."
  - "Slice C — action wiring parity: the controls the Mini App Live Screen offers produce the same canonical side effects when driven from Bubble."
  - "Slice D — cutover guard and Mini App deprecation path: dual-run period, the gate that ends it, and what the Mini App route does afterwards (redirect, deprecate, or remove behind a flag)."
