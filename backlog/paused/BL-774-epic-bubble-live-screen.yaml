notes: |
  ## Overlap the human should be aware of

  **BL-569** (`live screen interactive pane input`, `status: needs_design`,
  approved, paused) adds a principal-gated remote keyboard to the Live Screen
  *in the Mini App*. It is slice C of this epic wearing different clothes. If
  BL-569 is built on the Mini App and Live Screen then moves to Bubble, that
  work is paid for twice. Recommendation: fold BL-569 into this epic's slice C
  rather than building it on a surface scheduled for retirement — but that is
  a human call, and BL-569 is not touched by this ticket.

  Two further raw intakes in the backlog root also describe Live Screen content
  in Bubble — `INTAKE-bubble-host-agent-thinking-live-screen.md` and
  `INTAKE-bubble-live-screen-coordinator-resident.md`. Both belong to this
  epic when they are drained; they are among the intakes waiting on BL-769.

  ## Why the epic depends on BL-769

  Every slice is Android. Until BL-769's JVM unit seam lands, an Android
  ticket's acceptance contract runs zero scenarios — five tickets have already
  shipped that way. This epic's children must not be promoted before it.
