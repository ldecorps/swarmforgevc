description: |
  ## Why this epic exists

  Live Screen — the resident-pane view served by `bridgeServer.ts` at
  `/resident-pane` and rendered in the Telegram Mini App — is today bound to
  Mini App hosting and Telegram webview constraints. Operator flow is split
  across surfaces, which costs attention and control friction. Product
  direction is one phone surface, and that surface is Bubble.

  The outcome wanted is parity first, then cutover: Live Screen fully available
  in Bubble with equivalent or better usability, no loss of core actions,
  status visibility or response speed, and the Mini App route retired or
  reduced to a clear fallback.

  ## The boundary this epic must respect

  Local engineering rule 5 names two phone-viewable surfaces that are not
  interchangeable: the static backlog-dashboard PWA (a git-SHA-reproducible
  projection, no auth, no write path) and the LIVE holistic UI (token auth,
  live endpoints, control actions). Live Screen is unambiguously the second —
  it reads live pane state and, in later slices, writes control actions. No
  slice of this epic may route Live Screen data through the static PWA.

  ## Open questions and the defaults taken

  1. *Native UI only, or a staged WebView-backed migration?* — **Native**, from
     slice A. A WebView would carry the webview constraints this migration
     exists to escape, and Bubble already speaks to the bridge natively through
     `BridgeClient.kt`.
  2. *Deprecation plan and timeline for the Mini App Live Screen?* — **Deferred
     to slice D, deliberately.** Nothing is deprecated until parity is proven;
     slice A explicitly leaves the Mini App untouched.
  3. *Which checks confirm migration success?* — parity is asserted per slice
     against the same `/resident-pane` snapshot both surfaces read, so the two
     cannot silently diverge. Slice E adds the operator-scenario sweep.
  4. *Dual-run period and cutover gate?* — **Yes, dual-run**, gated in slice D.
     Slices A–C are additive: Bubble gains Live Screen while the Mini App keeps
     working.

  ## Out of scope for the whole epic

  - Re-architecting the bridge protocols. Existing contracts are reused; a
    contract change must be its own ticket with its own justification.
  - Any feature beyond parity and migration safety.

