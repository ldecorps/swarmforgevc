id: BL-984
title: "property-lane fixture helper executes fixtures stranded by a killed run: sweep by prefix before writing, since nothing traps SIGKILL"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
human_approval: approved
priority: 20
direction: pipeline-note
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-984-sweep-stale-property-fixtures-before-run.feature

required_wiring:
  - 'extension/test/helpers/propertyLaneFixtureRunner.js::sweepStaleFixtures(::both generated-fixture entry points must actually call the sweep, not merely export it'

invariants:
  - "A property-lane fixture run's verdict is decided only by fixtures that run wrote itself - a file left behind by any earlier run never contributes to it."
  - "The sweep removes only files carrying the helper's own basename prefix in the helper's own fixture directory, and only those whose originating run is gone."

description: >
  Severity rationale: high - a broken quality-gate signal, the same class as
  BL-971. A stranded fixture is executed by every subsequent run of the lane,
  on a file nobody wrote and nobody will recognise, and it survives reboots.

  extension/test/helpers/propertyLaneFixtureRunner.js generates real
  *.property.test.js files, writes them into extension/test/, runs them
  through the REAL vitest.properties.config.mjs, and deletes them again. The
  placement is deliberate and correct: the lane's include is
  `test/**/*.property.test.js` resolved from extension/
  (vitest.properties.config.mjs:50), so a fixture anywhere else is never
  collected and the helper cannot prove what it exists to prove.

  Cleanup today is thorough for every exit the process can observe - a
  `finally` per run, plus process.on('exit') and SIGINT/SIGTERM handlers that
  sweep every tracked path. SIGKILL is the hole and it cannot be closed: a
  kill -9, an OOM kill, or a supervisor escalating past SIGTERM runs no
  handler at all.

  Observed live, not hypothesised (architect, BL-971 review): five files
  bl868-fixture-74865-*.property.test.js orphaned by PID 74865 in
  .worktrees/architect/extension/test/, still present at spec time. Each such
  fixture boots a child vitest process when the lane collects it, so the leak
  adds real load to a lane already under investigation for wall-clock
  exhaustion - it can masquerade as, or compound, BL-971's timeouts.

  How (direction, not mandate): before writing its fixtures, the helper
  removes pre-existing files matching its own basename prefix in its own
  target directory. Cleanup-after stays exactly as it is; the sweep-before is
  what makes the guarantee hold across a kill.

constraints: >
  Firm lines:

  - Do NOT try to make cleanup complete. Nothing traps SIGKILL, so a rule or
    a fix phrased as "never leave a file behind" is unsatisfiable. The
    guarantee is refusing to CONSUME a leak, not preventing one.
  - Do NOT move fixtures out of the include glob and do NOT add the prefix to
    the config's `exclude` as the primary fix. An excluded fixture is also an
    uncollectable one, which breaks the helper outright. An exclude may be
    added as belt-and-braces only, never as the mechanism.
  - The sweep must be safe under a concurrent peer run in the same worktree.
    Generated names already embed process.pid; a blind prefix sweep would
    delete a live peer's in-flight fixtures. Claim only files whose
    originating run is gone (own pid, or a pid that is not alive, is the
    suggested discriminator - the coder picks the mechanism).
  - The sweep never touches a file outside the helper's own fixture directory
    and never touches one lacking the helper's basename prefix. A human's
    real *.property.test.js in extension/test/ must be untouchable.
  - The exported sweep entry point is named `sweepStaleFixtures`. This name
    is fixed ONLY so required_wiring can be armed against a literal per
    BL-874; it is not a design opinion, and nothing else about the shape is
    mandated.

notes: >
  Source: architect `rule_proposal` (scope engineering) raised from the
  BL-971 review, accepted and sharpened by the specifier in commit 87e7768a1.
  The accepted rule is in engineering.prompt "Test Speed And Isolation"; the
  full narrative, including why the proposal's original "must not leave
  files" phrasing was replaced by the pre-run sweep, is in
  reference/engineering-detailed.prompt.

  Relationship to BL-971: sibling, not duplicate. BL-971 is about the two
  property tests exhausting their wall-clock budgets; this is about the lane
  executing files no run wrote. They share a victim (the lane's
  trustworthiness) and can compound each other, but neither fix implies the
  other. Worth checking during this ticket whether any BL-971 measurement was
  taken on a worktree that also held stranded fixtures - if so, say so on
  BL-971 rather than silently re-baselining it.

  The five observed leaked files are in the ARCHITECT's worktree and are that
  worktree's to clear - not swept by the specifier, per "never delete what you
  did not create". They are useful evidence while they last.

  BL-233: all four scenarios are in scope for this single slice, so their step
  handlers must land in the same parcel - the acceptance runner throws on any
  scenario lacking one.

qa_e2e_procedure: >
  1. Scenario 01: in a scratch copy of the fixture directory, plant a file
     named for each prefix in the Examples table carrying a pid that is not
     alive, invoke the helper, and assert the planted file is gone BEFORE the
     child vitest is spawned - and that the returned verdict reflects only the
     fixture the helper wrote.
  2. Scenario 02: plant a prefixed file carrying a pid that IS alive (a
     sleeping child is enough), invoke the helper, and assert the planted file
     survives the run.
  3. Scenario 03: plant a *.property.test.js with no helper prefix, invoke the
     helper, assert it survives.
  4. Scenario 04: run the helper to normal completion and assert its own
     fixture is gone - the existing cleanup path must not have regressed.
  5. Live check: from a worktree, SIGKILL a running helper invocation
     (kill -9 on the node pid), confirm a fixture is stranded, then run the
     helper again and confirm the strand is swept and the lane's verdict is
     clean.

approval_context: >
  Two points to confirm, both engineering calls I made rather than guessed at
  - flag either if you disagree.

  First, the accepted rule deliberately does NOT say "do not leak". The
  architect proposed that wording; it is unsatisfiable under SIGKILL, so the
  rule and this ticket are both phrased as a pre-run sweep instead. The leak
  is tolerated; consuming it is not.

  Second, concurrency: a blind prefix sweep would delete a live peer run's
  fixtures in the same worktree. I constrained the sweep to files whose
  originating run is gone. I did not raise this as a clarifying question
  because I already have one pending (the BL-951 bounce-fix re-entry
  question) and the one-pending rule applies - if you would rather the helper
  simply refuse to run while a peer is active, say so and I will amend.
