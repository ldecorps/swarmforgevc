notes: |
  ## Severity rationale

  `medium`. Live, working, and useful — but unreviewed code in the tree can
  become an ancestor of an unrelated QA approval (BL-506), and this body
  changed the app's install identity and touched two unauthenticated,
  publicly-reachable routes. Nothing is swarm-down or losing data.

  ## Acceptance contract is runnable (BL-761/BL-769)

  Every scenario drives Node code — the bridge's pairing page, its APK route,
  and the tunnel notifier — through the existing acceptance runner. There are
  deliberately NO scenarios for Android device behaviour: `AppLog`'s Settings
  button, the overlay, and the deep-link apply path cannot bind to a step
  handler in this repository today, and writing them would manufacture exactly
  the inert contract BL-761 and BL-769 exist to stop.

  The Kotlin side is not left unverified, it is verified elsewhere:
  `PairingSaveTest.kt`'s six JVM unit tests over `PairingSave.merge` run under
  gradle. The hardener should run them and record the output in evidence rather
  than translating them into Gherkin.

  ## Relationship to BL-769 — read before scoping

  BL-769 was written to create Bubble's first JVM unit seam, and gave that as
  the reason eleven Bubble intakes are blocked. Part of that seam now EXISTS,
  hand-built in this body: `build.gradle.kts` gained
  `testImplementation("junit:junit:4.13.2")` and `android/app/src/test/`
  gained a real test class.

  This ticket adopts those two files because they are inseparable from the
  `PairingSave` code they cover. BL-769 has been amended to narrow to what is
  genuinely still missing — the seam POLICY in `local-engineering.prompt`,
  extending coverage to `BridgeClient` and `PairingDeepLink`, and wiring the
  gradle unit run into the pipeline gate so those tests actually gate a parcel.
  Neither ticket should re-create the other's files.

  ## IR-DRY findings — reviewed, deliberately kept

  Two medium-confidence `possible-synonym` findings remain, both benign:

  - The APK request step's literal-filename instance versus its
    `<requested>` placeholder form. These are the SAME step pattern, so one
    handler serves both — this is the DRY-correct outcome, and the checker is
    reporting the parameterized step matching its own literal instance.
  - That same request step versus the Background's "operator public directory
    contains <file>". Different concepts (setup versus action) that merely
    share the filename token.

  An earlier draft phrased the download scenario as "requests the published APK
  by name", which read as one finding but genuinely needed a second handler for
  the same action; it was normalized away.

  ## e2e procedure for QA

  1. Start the bridge; request `/pair?token=<valid>` unauthenticated. Expect the
     page to render, to contain an `intent://` link whose `package=` equals the
     `applicationId` in `android/app/build.gradle.kts`, and to offer copy
     fallbacks for URL and token. Confirm it does not auto-navigate.
  2. Request the published APK filename unauthenticated: expect 200, content
     type `application/vnd.android.package-archive`, `cache-control: no-store`.
  3. Request `/swarmforge-float-companion/../../../../etc/passwd.apk` and a
     percent-encoded traversal variant: expect 404 both times, and confirm no
     read outside `.swarmforge/operator/public/`.
  4. Run the Android JVM unit tests under `android/` via gradle; expect
     `PairingSaveTest`'s six tests green. Record the output in evidence.
  5. Grep the repository for `com.swarmforge.floatcompanion`: expect it only
     where it is still correct (the gradle `namespace`, historical prose), never
     as the install id in a pairing instruction.
  6. Confirm `docs/index.md` links the hotfix how-to.
