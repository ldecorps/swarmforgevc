approval_context: >
  This adopts work the human did by hand on 2026-08-02 and is running on the
  phone today, so reverting it would take Bubble down; adopt-and-review is the
  right fork (BL-506, BL-709, BL-763). Three things need sign-off because the
  review is being asked to CHANGE the hand work, not rubber-stamp it:

  1. The build now installs under a NEW applicationId
  (`com.swarmforge.floatcompanion` -> `com.swarmforge.bubble`). That is an app
  IDENTITY change: every existing install is orphaned rather than upgraded, and
  the old package lingers on the device until manually removed. It was done to
  escape a signing-key clash after the Linux -> Mac host switch. Confirm this
  is intended as permanent, because reverting it later orphans installs a
  second time.

  2. `release` builds are signed with the DEBUG signing config. For a
  sideloaded internal app that may be deliberate, but a release build carrying
  a debug key should be a recorded decision, not an accident of the hotfix.
  Say which it is; the spec currently asks the review to make it explicit
  rather than silently keep it.

  3. Local-engineering Architecture Rule 7 currently says the
  `floatcompanion` package id "may stay". After change 1 that parenthetical is
  factually stale. The specifier owns that article; correcting it is in scope
  here, but the human should confirm the rename is the intended end state
  first.

description: |
  ## What

  The 2026-08-02 Mac-host hotfix shipped a working Bubble pairing and
  client-log path by hand. It is functional and in production, but it is
  ticket-less, unreviewed, and partly untracked. This ticket adopts it through
  the normal chain, with corrections.

  In the master working tree (2026-08-02):

  - `android/.../AppLog.kt` (untracked) — ring buffer + logcat tag
    `SwarmForgeBubble`, Settings "Copy logs", instrumentation on the pair,
    session and turn paths.
  - `android/.../PairingSave.kt` (untracked) — the pairing merge decision.
  - `android/app/src/test/.../PairingSaveTest.kt` (untracked) — six JVM unit
    tests over `PairingSave.merge`.
  - `android/app/build.gradle.kts` (modified) — `testImplementation` JUnit,
    `applicationId` -> `com.swarmforge.bubble`, versionCode 24 -> 28,
    versionName -> `0.3.12-pairing-persist`, v1+v2 signing, and a `release`
    buildType signed with the debug config.
  - `AndroidManifest.xml`, `MainActivity.kt`, `BridgeClient.kt`,
    `CompanionPrefs.kt`, `PairingDeepLink.kt`, `TalkEngine.kt`,
    `TalkPanelActivity.kt`, `dialog_settings.xml`, `strings.xml` (modified).
  - `extension/src/bridge/bridgeServer.ts` (modified) — pre-auth `/pair` page
    using `intent://` with copy fallbacks instead of a custom-scheme
    auto-redirect, and a pre-auth APK route.
  - `extension/src/concierge/residentSpyTunnelNotify.ts`,
    `extension/src/tools/notify-resident-spy-tunnel.ts` and their test
    (modified) — `pairingHttpsUrl`.
  - `docs/how-to/hotfix-2026-08-02-bubble-client-logs-and-pairing.md` and
    `backlog/evidence/hotfix-2026-08-02-bubble-client-logs-and-pairing.md`
    (untracked).

  ## Why now

  BL-787's notes named this body as needing its own BL-506 disposition pass and
  deliberately did not fold it in. This is that pass. Unreviewed functional code
  in the tree becomes an ancestor of unrelated QA approvals, and this body is
  large and touches an externally reachable route.

  ## Scope — adopt, with these corrections

  1. **Make the signing decision explicit.** `release` currently uses the debug
     signing config. Either keep it with a comment stating why (sideloaded
     internal distribution) or give release its own config. Silent debug-signed
     releases are not acceptable either way.

  2. **Correct the stale package id in the how-to.** The how-to's table still
     documents `package=com.swarmforge.floatcompanion` for the `intent://`
     button while the shipped bridge and build now use
     `com.swarmforge.bubble`. A pairing how-to that names the wrong package is
     a broken instruction.

  3. **Update local-engineering Architecture Rule 7.** Its parenthetical that
     the `floatcompanion` package id "may stay" is stale once the applicationId
     is `com.swarmforge.bubble`. Specifier-owned file; approval-gated (see
     approval_context).

  4. **Pin the pre-auth routes with the acceptance contract.** The `/pair` page
     and the APK route are unauthenticated and publicly reachable over the named
     tunnel. The traversal defence already present (`path.basename` plus an
     anchored `^swarmforge-float-companion[\w.\-]*\.apk$` pattern) is sound on
     reading — this ticket does not allege a hole. It pins that behaviour under
     test so a later edit cannot quietly widen it, and asks the architect to
     confirm the exposure itself (any file the operator drops in the public
     directory matching that glob is world-readable through the tunnel) is
     intended.

  5. **Link the how-to from `docs/index.md`** (BL-756 orphan lesson).

  ## Out of scope

  - The named-tunnel launcher body — BL-787.
  - The Mac host-switch freshness/bridge body — BL-789.
  - Extending the Android test seam beyond what is already written, and the
    Android-seam POLICY itself — BL-769. This ticket adopts the seam files that
    already exist because they are inseparable from the pairing code they test;
    it does not settle where Android behaviour is verified in general. See
    notes.
  - A shared release keystore so host switches stop forcing uninstall — a real
    follow-up named in the hotfix evidence, deliberately not attempted here.
  - Publishing a rebuilt APK. The tree is at `0.3.12-pairing-persist`; whether
    that is published is an operator action, not a pipeline one.

  ## STEERING note

  Adopt-and-review of live operator work, same posture as BL-787. Queue-jump so
  it does not rot, but do not displace priority-0/1 work — in particular do not
  displace BL-769, which unblocks eleven intakes.

