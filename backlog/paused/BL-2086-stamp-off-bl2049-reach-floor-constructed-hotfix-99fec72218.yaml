description: |
  ## Status: hotfix 99fec72218 landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong

  `extension/test/bl2049PropertyRunnerReachInvariants.property.test.js`
  invariant 2 drew `n` with `fc.integer({ min: 2, max: 4 })` over
  `numRuns: 60` and asserted 10 runs per value of `n`, a reach floor
  sampled rather than constructed (BL-1062). A cell lands under 10 when
  Binomial(60, 1/3) is 9 or less: about 0.6% per cell, about 2% per run.
  QA's gather of BL-2084 at 96a694b92b drew n=4 9 times (evidence
  767f2ac0a5, note 003930). No register row named the file.

  ## What the hotfix changed

  99fec72218, test only: invariant 2 loops over `n` in [2, 3, 4] with
  `runsPerCell(60, 3)` runs each (20), the cell held as `fc.constant`.
  The property body, the floor and the total run budget are unchanged.
  `sampled_reach_floor_census_cli.bb` now reads the file `constructed`
  (it read `sampled-low` before). Invariant 1 was already constructed (one
  cell, 15 runs, floor 15) and is untouched.

  ## What the coder does (all of it)

  1. Read `git show 99fec72218` and confirm the property body and the
     floor are unchanged apart from indentation, and that each cell's
     runs meet its floor by construction.
  2. Run the property file and the feature in qa_e2e_procedure once each,
     output under tmp/.
  3. Write backlog/evidence/BL-2086-coder-<date>.md with the result and
     commit it.

constraints: >
