  The intake's words on the passive path, kept verbatim because they are the
  constraint:

  > **Passive (offline):** always listen only for the wake phrase **"hey bubble"**,
  > entirely on-device in the app — no LLM, no bridge turn, no cloud STT for that
  > trigger.

  > Caveat: Android's stock `SpeechRecognizer` is often cloud-backed — **not**
  > acceptable for the passive path. Passive must use a true on-device spotter
  > (e.g. Porcupine-class or equivalent open on-device model), not "always-on
  > cloud dictation."

  > Human constraint: **red stays active listening** (hot mic to the model).
  > Passive wake listening must not be red.

  > **Agreed passive (wake-only) color: soft teal** `#2A9D8F`
