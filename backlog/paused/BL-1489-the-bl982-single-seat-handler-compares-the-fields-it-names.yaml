approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: BL-982's feature text and
  mutation stamp are not edited (the scenario's claim is right; the
  handler over-asserted), and the launcher is untouched. Found by the
  specifier's mint-time sweep for BL-1485 on 2026-09-08 (every
  parse_config-driving feature run both ways); this row fails with and
  without the pane hatch, so it is not the BL-1486 class.

invariants:
  - "BL-982's single-seat comparison asserts only the fields its scenario names - session, worktree, launch script names, prompt artifact names - and passes when any other roles.tsv column differs between the live and the pinned launcher."

description: |
  ## What is wrong

  `specs/pipeline/steps/bl982SecondSeatSteps.js` lines 204-216, scenario
  04's Then step: it provisions `SINGLE_SEAT_CONF` through the live
  `swarmforge.sh` and through a pre-change copy pinned by blob sha
  (`preChangeScriptDir`, lines 108-121), then

      assert.equal(norm(ctx.root), norm(preRoot), 'single-seat roles.tsv (sessions, worktrees) must be byte-identical to the pre-change script');

  over the whole `.swarmforge/roles.tsv`. Since `44d2d42591` (2026-08-30,
  "Steal upstream reverse git_handoff hops") the live launcher writes a
  ninth column, the reverse-hop mode, on every row:

      + 'coder\tcoder\tROOT/.worktrees/coder\tswarmforge-coder\tCoder\tclaude\ttask\toff\tforward-only\n'
      - 'coder\tcoder\tROOT/.worktrees/coder\tswarmforge-coder\tCoder\tclaude\ttask\toff\n'

  The pinned launcher can never write it, so the byte comparison fails on
  every run and always will. Reproduced by the specifier 2026-09-08 on
  main `3dfa366fd9` from the master checkout, with and without
  `PACK_STAFFING_SKIP_GATE`: `# pass 5`, `# fail 1` (row 04); the other
  five rows pass WITH the hatch and five of them fail without it, which is
  BL-1486's class and not this ticket.

  The scenario's claim is narrower than the assertion: sessions,
  worktrees, launch script names and prompt artifact names - and the
  handler already checks the last two by name (lines 213-215). Only the
  roles.tsv check over-reaches. This is BL-1482's shape (a handler pins a
  whole line where the scenario names a field) and BL-1006's: an
  "unchanged from before this slice" assertion frozen against a pinned
  launcher goes red on the next unrelated launcher change and can only go
  green again by reverting it.

  ## What is wanted

  BL-982's feature passes 6 of 6 from the master checkout and from a
  linked role worktree with all six scenarios' text unchanged (scenario
  01). The single-seat comparison passes when the live launcher writes a
  column the pinned one does not (scenario 02) and still fails, naming the
  field, when a session or worktree differs (scenario 03; invariant 1).
  The register row leaves with the fix.

  ## How (direction, not mandate)

  - Compare roles.tsv by the columns the scenario names: role (1),
    worktree (3), session (4) per row, keyed by role, with the root
    normalised as today; leave the launch/prompt name checks as they are.
    Parsing into rows with `rolesRows` (line 100, already there) and
    comparing a projection is enough.
  - Do NOT re-pin the blob to a launcher that has the ninth column: the
    next column would turn it red again, and a pinned launcher that
    post-dates the slice no longer proves "before this slice".
  - Seam for scenarios 02/03: the handler already builds the pinned
    launcher into a scratch dir (`preChangeScriptDir`); let the comparison
    take the launcher path as a parameter so the new handler can hand it a
    scratch copy that writes an extra column or a different session /
    worktree for the coder row. Scratch roots under mkdtemp with their own
    git init (BL-1390).
  - Hardener: BL-982's feature text is unchanged, so its stamp stays; the
    handler change is covered by the feature run.
  - Documenter: no registered diagram depicts this; if a how-to cites the
    single-seat comparison, one line that it compares named fields. Remove
    the register row in the same land.

constraints: >
  BL-982's feature file is not edited: its six scenarios keep their text
  and mutation stamp. No production code: the launcher's roles.tsv
  columns stay as the reverse-hop work left them. The handler keeps
  proving single-seat provisioning against a pre-change launcher pinned
  by blob sha; it is not replaced by a self-comparison of the live
  launcher. No hand-edited mutation manifests.

out_of_scope: |
  - The five BL-982 rows that pass only under the pane hatch: BL-1486
    (scenario 03 there covers this handler by derivation).
  - roles.tsv's ninth column and the reverse-hop mechanism (landed,
    correct).
  - A sweep of other handlers that byte-compare a generated file against
    a pinned baseline: a lean-pass candidate recorded in the adjudication
    evidence, not this slice.

