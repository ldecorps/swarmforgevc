  tenth column to every roles.tsv row, the comparison passes; in one that
  writes a different session name for the coder row, it fails naming the
  session. (5) `backlog/standing-reds.tsv` carries no row for BL-982's
  feature and `standing_red_register_cli.bb` agrees.

