id: BL-934
title: "The Bash heal wrapper appends the pinned worktree as an extra rm argument, so Claude Code treats every rm of a temp file as a dangerous rm of the repo"
milestone: M8
type: defect
severity: high
status: todo
epic: tool-miss-auto-heal
human_approval: approved
priority: 10
direction: human-intake
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-934-heal-wrapper-must-not-look-like-rm-of-the-worktree.feature

invariants:
  - "The generated wrapper's classified source never concatenates the original command with the pinned worktree as an additional positional argument."
  - "A genuine original command that already names the pinned worktree as an rm target remains visible as a command in the wrapper source. The fix must not hide a real rm of the worktree from the classifier."

approval_context: >
  Severity high is the call I want your eye on. Nothing is down and no
  data is lost, so it is not critical. I filed high because it breaks
  the unattended contract on a common command: every Claude role runs
  with --dangerously-skip-permissions, and this prompt still fires on
  every `rm` of a temp file, Yes-only, with no don't-ask-again. The
  specifier was stuck on it live (18-Aug-26). Say medium if you read
  it as contained to rm; only the expedite lane changes.

  The slice is the classified wrapper source, not Claude Code's
  classifier and not a prompt-pad. The one design constraint I locked
  because the other shape would be worse: do not obfuscate the original
  command to hide it from the classifier. A real `rm` of the worktree
  must still look like one.

source: |
  Minted 2026-08-19 by Cursor at the human's direction, from the live
  specifier pane. Human sentences, verbatim (Article 5.3):

  - "Why does it keep asking?"
  - "Mint it"

  The pane showed Claude Code's Bash permission prompt over a BL-913
  heal wrapper (`__sfh_ec`) around:

      rm -f tmp/bl933-ir.json tmp/bl933-dry.json

  Warning text, verbatim: "Dangerous rm operation on working directory
  or its ancestor: /Users/ldecorps/projects/swarmforgevc". Options were
  Yes / No only (Esc to cancel, Tab to amend, ctrl+e to explain). The
  specifier is launched with --dangerously-skip-permissions.

description: |
  ## What happens

  BL-913's PreToolUse hook rewrites every Bash command into a
  self-healing wrapper before Claude Code runs it. One inlined heal
  branch is missing-root-argv: the original command with the pinned
  worktree appended as a trailing argument. For the live command that
  is this source, classified before anything executes:

      rm -f tmp/bl933-ir.json tmp/bl933-dry.json '/Users/ldecorps/projects/swarmforgevc'

  Claude Code's dangerous-rm gate reads that as rm of the working
  directory. The fallback never actually runs here (`rm -f` of those
  temp files does not fail with a missing-root usage error). The
  classifier still sees the whole wrapper.

  Yes approves only that invocation. The next `rm` of a different temp
  file is a new command, so the prompt returns. There is no don't-ask-
  again for this danger class.

  ## What this is NOT

  It is not a model that "should stop using rm". It is not Claude
  Code's classifier to replace. It is not a prompt reminder. It is not
  the Cursor Shell surface (held on BL-912). The original `rm -f tmp/...`
  is a descendant, not the worktree or an ancestor; the false positive
  is the wrapper, not the model's command.

  ## How (direction, not mandate)

  Stop emitting the missing-root-argv heal as a literal
  `original-command 'worktree'` in the source Claude Code classifies.
  The runtime heal for a non-rm CLI that actually missed that way must
  still supply the project root once (scenario 03 / BL-913 neighbour).
  The original command's own text must remain a visible command in the
  wrapper, so a genuine `rm` of the worktree is still classifiable
  (invariant 2). Do not disable the PreToolUse hook and do not pad
  role prompts.

out_of_scope: |
  - Not BL-912 slices B/C/D, and not the Cursor Shell working_directory
    surface recorded on that tracker.
  - Not teaching roles to avoid rm, and not changing Claude Code.
  - Not dropping missing-root-argv as a runtime heal for non-rm CLIs.
  - Not hiding every rm from the classifier by encoding the original
    command so a real rm of the worktree would also slip through.

notes: |
  Reproduced by generating the current wrapper for the live command:

      bb -e '(load-file "swarmforge/scripts/tool_miss_heal_lib.bb")
             (print (tool-miss-heal-lib/build-healing-wrapper-command
               "rm -f tmp/bl933-ir.json tmp/bl933-dry.json"
               "/Users/ldecorps/projects/swarmforgevc"))'

  The missing-root-argv branch is exactly
  `rm -f tmp/bl933-ir.json tmp/bl933-dry.json '/Users/ldecorps/projects/swarmforgevc'`.
  That string is what the screenshot's `__sfh_ec` fragment is.

  Step handlers (specs/pipeline/steps/bl934HealWrapperRmFalsePositiveSteps.js)
  do not exist yet and must land in the coder's parcel - the acceptance
  runner throws on a scenario with no handler (BL-233).

qa_e2e_procedure: |
  1. The classified source, which is the actual deliverable. Generate the
     wrapper for `rm -f tmp/bl934-probe.json` with the pin set to this
     repo root. Confirm the source does not contain an invocation that is
     that original command with the repo root appended as an extra
     argument. Confirm the original `rm -f tmp/bl934-probe.json` still
     appears as a command in the wrapper (invariant 2).
  2. Neighbour: run the existing BL-913 unit, property, wiring, and
     acceptance suites and confirm they still pass. A fix that stops the
     false positive by dropping missing-root-argv entirely is a fail.
  3. Live pane. In a Claude swarm role launched with
     --dangerously-skip-permissions, issue `rm -f tmp/bl934-probe.json`.
     Confirm Claude Code does not show "Dangerous rm operation on
     working directory or its ancestor". Confirm the command runs.
  4. Genuine danger still visible. Generate the wrapper for an original
     command that removes the pinned worktree itself. Confirm that
     original command still appears as a command in the wrapper source,
     not only inside an encoded string the classifier would not parse
     as rm.
