description: |
  ## Status: four hotfixes landed the fix

  This parcel is their stamp-off: review them, do not re-apply them.

  ## What was wrong

  - BL-1307's and BL-1293's step handlers ran swarm_handoff.bb once and
    read any non-zero exit as a refusal. Since BL-1529 the first valid call
    of a git_handoff draft prints AUDIT_REQUIRED and exits non-zero, so
    every "the forward is allowed" row failed: 3 of 6 in each feature, red
    on main since 2026-09-12. BL-1602 swept the drivers it listed by name,
    and these two were not in its Examples (its population check is
    "contains", so a driver outside the list is never checked). Neither
    feature had a register row.
  - BL-1529 scenario 06 pinned a census of six git_handoff-drafting
    scripts; BL-1697's local_parcel_driver_lib.bb (09-24) and BL-1700's
    model_steward_coder_probe_lib.bb (09-26) made it eight, red since
    09-24 with no register row.
  - bl1699AiderBootstrapNoRepoPaths.property.test.js (gitLines) and
    bl611BabysitterdLifecycleSteps.js (listTrackedFiles) read the repo's
    whole `git ls-files` through Node's default 1 MiB exec buffer; main's
    listing is 1,012,198 bytes (1,012,578 with untracked files), about 36
    KB from ENOBUFS. BL-1916's second QA pass saw bl1699 go red once 64 KB
    of venv paths were committed.

  ## What the hotfixes changed

  - ae5d0646a0, 56910c695b: both drivers send through
    specs/pipeline/steps/lib/sendGitHandoffTwoCall.js (BL-1602's helper).
  - da781b0fef: scenario 06 also names local_parcel_driver_lib.bb and
    model_steward_coder_probe_lib.bb and pins eight; neither sends through
    the real swarm_handoff (the driver writes its requeue copy straight
    into the stage queue; the probe drafts against a stub), so the audit
    cannot swallow either. The feature's mutation stamp is now stale; the
    next hardener pass on it re-mutates.
  - 1dbe9de8e1: both readers pass `maxBuffer: 64 * 1024 * 1024`. Every
    other ls-files exec under extension/test and specs/pipeline/steps is
    pathspec-filtered or runs in a fixture repo (census:
    `grep -rn "ls-files" extension/test/*.js specs/pipeline/steps/*.js | grep -E "execFileSync|spawnSync|execSync" | grep -v maxBuffer`,
    plus bl1699's multi-line call).

  ## What each stage checks

  - Coder: each hotfix against this description and the invariant; the
    census above re-run; and whether any other driver that expects an
    allowed git_handoff still sends once (the mint sweep found none among
    the 20 features it ran). Evidence: backlog/evidence/BL-1930-coder-<date>.md.

