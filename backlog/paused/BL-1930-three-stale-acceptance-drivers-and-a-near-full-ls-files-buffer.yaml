description: |
  ## Status: seven hotfixes landed the fix

  This parcel is their stamp-off: review them, do not re-apply them. Four
  stamp-offs were folded into this one on 2026-10-05; each section below
  keeps its own ticket's text word for word. One evidence file covers all
  seven, one heading per hotfix: backlog/evidence/BL-1930-coder-<date>.md
  (the BL-1953, BL-1957 and BL-1973 evidence paths named below are
  superseded by it).

  ## Hotfixes ae5d0646a0, 56910c695b, da781b0fef, 1dbe9de8e1

  ### What was wrong

  - BL-1307's and BL-1293's step handlers ran swarm_handoff.bb once and
    read any non-zero exit as a refusal. Since BL-1529 the first valid call
    of a git_handoff draft prints AUDIT_REQUIRED and exits non-zero, so
    every "the forward is allowed" row failed: 3 of 6 in each feature, red
    on main since 2026-09-12. BL-1602 swept the drivers it listed by name,
    and these two were not in its Examples (its population check is
    "contains", so a driver outside the list is never checked). Neither
    feature had a register row.
  - BL-1529 scenario 06 pinned a census of six git_handoff-drafting
    scripts; BL-1697's local_parcel_driver_lib.bb (09-24) and BL-1700's
    model_steward_coder_probe_lib.bb (09-26) made it eight, red since
    09-24 with no register row.
  - bl1699AiderBootstrapNoRepoPaths.property.test.js (gitLines) and
    bl611BabysitterdLifecycleSteps.js (listTrackedFiles) read the repo's
    whole `git ls-files` through Node's default 1 MiB exec buffer; main's
    listing is 1,012,198 bytes (1,012,578 with untracked files), about 36
    KB from ENOBUFS. BL-1916's second QA pass saw bl1699 go red once 64 KB
    of venv paths were committed.

  ### What the hotfixes changed

  - ae5d0646a0, 56910c695b: both drivers send through
    specs/pipeline/steps/lib/sendGitHandoffTwoCall.js (BL-1602's helper).
  - da781b0fef: scenario 06 also names local_parcel_driver_lib.bb and
    model_steward_coder_probe_lib.bb and pins eight; neither sends through
    the real swarm_handoff (the driver writes its requeue copy straight
    into the stage queue; the probe drafts against a stub), so the audit
    cannot swallow either. The feature's mutation stamp is now stale; the
    next hardener pass on it re-mutates.
  - 1dbe9de8e1: both readers pass `maxBuffer: 64 * 1024 * 1024`. Every
    other ls-files exec under extension/test and specs/pipeline/steps is
    pathspec-filtered or runs in a fixture repo (census:
    `grep -rn "ls-files" extension/test/*.js specs/pipeline/steps/*.js | grep -E "execFileSync|spawnSync|execSync" | grep -v maxBuffer`,
    plus bl1699's multi-line call).

  ### What each stage checks

  - Coder: each hotfix against this description and the invariant; the
    census above re-run; and whether any other driver that expects an
    allowed git_handoff still sends once (the mint sweep found none among
    the 20 features it ran). Evidence: backlog/evidence/BL-1930-coder-<date>.md.

  ## Hotfix 35a8448e4c (was BL-1953)

  ### What was wrong

  The iq3 coder worked BL-1929 on a line that also held BL-1851's work,
  and resolved a suite-manifest.tsv merge conflict on it. BL-1929's land
  (fd4c492d3b, a tip-pure replay) took suite-manifest.tsv whole and
  published the row `local_seat_tuning_report_lib_test_runner.bb
  standing`, which is BL-1851's (its commit 4afccb0400 adds the row and
  the runner). BL-1851 has not landed, so main named a runner it lacks,
  and run_bb_suite.sh failed with MISSING. BL-1830 exists to stop exactly
  this, and its feature still passes.

  ### What the hotfix changed

  The row is removed from main's manifest. BL-1851's land brings the row
  back with its runner.

  ### What the coder checks

  The hotfix against the description and the invariant, then why BL-1830's
  guard let the row through: was the row inside BL-1929's own diff (the
  merge resolution), or is BL-1851's line invisible to the guard because
  it is in flight rather than queued to land? Evidence:
  backlog/evidence/BL-1953-coder-<date>.md. A guard gap goes to the
  specifier as a note; it is not built in this parcel.

  ## Hotfix 897e5f4d62 (was BL-1957)

  ### What was wrong

  specs/pipeline/steps/bl757RealTreeOrphanGateSteps.js hand-built its own
  landing-gate deps, so it never got checkOriginMainLanding when the gate
  grew it. Scenarios 05 and 06 failed at "When the pilot runs the landing
  gate". BL-1667 found and fixed the same rot in bl755's handler.

  ### What the hotfix changed

  baseDeps starts from makeAcceptanceGateDeps
  (extension/test/helpers/pilotAcceptanceGateDeps.js, BL-1229) and layers
  the fixture's own overrides on top.

  ### What the coder checks

  The change against the description; grep the other step handlers for a
  hand-built landing-gate deps object and report any in the evidence as a
  note to the specifier. Evidence: backlog/evidence/BL-1957-coder-<date>.md.

  ## Hotfix bdb172641b (was BL-1973)

  The coder reviews it and never re-applies it (the BL-1858 and BL-1868
  shape): read the commit, run the file, and run the mutant the file's
  header names (computeReach's reverse walk cut to direct importers, in a
  scratch copy) to confirm the seeded draws still fail it. A review that
  finds the change wrong says so in a note to the specifier.

  ### What each stage checks

  - Coder: the review and the mutant run, recorded in committed evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule). Steps 1-4 were
  BL-1930's, 5-8 BL-1953's, 9 BL-1957's, 10-11 BL-1973's.
  1. `node specs/pipeline/cli.js specs/features/BL-1307-*.feature` passes (measured at mint: 6 of 6 ok).
  2. `node specs/pipeline/cli.js specs/features/BL-1293-*.feature` passes (measured at mint: 6 of 6 ok).
  3. `node specs/pipeline/cli.js specs/features/BL-1529-a-script-originated-git-handoff-is-never-swallowed-by-the-audit.feature` passes (measured at mint: 7 of 7 ok).
  4. Read from the gather row's `npm run test:properties`: bl1699AiderBootstrapNoRepoPaths.property.test.js passes (2 of 2 at mint).
  5. Read from the gather's acceptance row: the BL-1830 feature all pass.
     Measured at mint on 35a8448e4c: 3/3.
  6. `bash swarmforge/scripts/check_test_file_registration.sh`: exit 0.
  7. Every manifest row names an existing file:
     `python3 -c "import os;r=[l.split(chr(9))[0] for l in open('swarmforge/scripts/test/suite-manifest.tsv') if l.strip() and not l.startswith('#')];print([f for f in r if not os.path.exists('swarmforge/scripts/test/'+f)])"`
     prints `[]`.
  8. Read the coder's evidence: it names why BL-1830's guard let the row
     through, or that it could not tell, and a note to the specifier when a
     guard gap is real.
  9. Read from the gather's acceptance row: the BL-757 feature all pass.
     Measured at mint on 897e5f4d62: 7/7 (5/7 before).
  10. Read from the gather's property row: bl1877PropertyReachNeverSkips
      passes (measured at the hotfix bdb172641b: 1/1).
  11. Read the coder's committed review evidence: it records the mutant run
      the file's header names (computeReach's reverse walk cut to direct
      importers) failing on seed 18770, and the floor's draw counts.

