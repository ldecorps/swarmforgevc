description: |
  ## What

  The Pipeline STATUS GRID PWA (`/pipeline-grid`, `pipelineGridLive.ts`) is far
  less accurate than Resident Spy about who is doing what. On the phone grid,
  almost every active ticket shows X under CO while Spy correctly shows
  hardender, architect, QA, etc. actively working different tickets.

  ## Why

  `capturePipelineGridLive` still stages from
  `.swarmforge/board/ticket-stage-map.json` via `readTicketStageMap` — the
  coordinator cache. Telegram's board already uses live
  `pipeline_stage_cli.bb report` each tick (BL-487 / `readLiveRoleHeldTickets`).

  ## How (direction, not mandate)

  1. Wire `pipelineGridLive.ts` to the same live report path Telegram uses.
  2. Align working marks with Spy's in_process claim + live pane signal.
  3. Treat mailbox `new/` distinctly from claimed work.

qa_e2e_procedure: >
  (1) With swarm running, open /pipeline-grid — stage marks match Telegram live
  board and Spy (not all CO). (2) Deep coder new/ queue — tickets at
  hardender/QA still show those stages. (3) Move a ticket; next tick reflects
  move without manual cache sync.

out_of_scope: |
  - Replacing Resident Spy.
  - BL-670 health dots (consume when landed).

