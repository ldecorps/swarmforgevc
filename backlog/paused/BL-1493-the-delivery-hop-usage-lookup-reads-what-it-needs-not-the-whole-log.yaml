id: BL-1493
title: "handoffd's delivery hop stamps an llm_invocation record per recipient by reading the whole 67 MB context-events.jsonl (258 157 rows) through read-events! to find the role's latest turn: measured 3.1 s per recipient on 2026-09-08, a third of the ~9 s each delivery costs, growing with every event ever recorded; the lookup reads from the tail and is bounded by the distance to the role's latest row, never by the file's length"
milestone: M8
type: defect
severity: medium
# medium: real but contained once BL-1490 lands - today it is a third of the
# delivery burst that gets the swarm killed; afterwards it is three seconds
# per delivery that grow with lifetime volume (BL-1476's shape), on a
# cost-control theme the human has named.
status: todo
epic: swarm-reliability
