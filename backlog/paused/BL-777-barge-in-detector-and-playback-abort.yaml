notes: |
  ## e2e procedure for QA

  On a device with a Bubble build, hands-free: ask something that produces a
  long spoken reply, speak over it, and confirm the speech stops promptly and
  the mic is listening — repeat five times to shake out a stuck mic. Then let a
  full reply play with the room quiet and confirm Bubble never aborts itself.
  Then switch to push-to-talk and confirm speaking over playback does nothing.
