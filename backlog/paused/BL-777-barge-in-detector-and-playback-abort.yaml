invariants:
  - "Playback and capture are never both live except during the detection overlap this slice introduces, and that overlap always terminates: every barge-in path ends with playback stopped."
  - "At most one listening session exists at any instant, on every path including repeated and concurrent barge-ins; the mic is never left open with nothing consuming it and never left closed after an abort."
  - "Barge-in detection is active in hands-free mode only; in push-to-talk no audio input can abort playback."

required_wiring:
  - "android/app/src/main/java/com/swarmforge/floatcompanion/TalkEngine.kt::bargeIn::the detector is driven from the live talk loop, not only from tests (the BL-419 shape)"
