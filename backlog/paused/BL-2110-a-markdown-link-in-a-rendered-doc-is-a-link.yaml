id: BL-2110
title: "A Markdown link in a rendered doc is a link: markdownToOperatorDocsHtml renders [text](url) as literal bracket-and-paren text, the first line of every Article draft (the episode's music pick) among them; an absolute http/https link now renders as a link and any other target as its text alone"
