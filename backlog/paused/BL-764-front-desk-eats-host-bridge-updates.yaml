description: |
  ## What

  When the Telegram front desk and `telegram-cursor-bridge` are configured with
  the SAME bot token, both call `getUpdates` on it. Telegram hands each update
  to exactly one caller, so Host / Cursor Remote and Bubble messages landed at
  whichever poller won the race. The front desk's rule for a bridge-owned topic
  was `drop`, so a message that reached the front desk first was discarded and
  the human saw a single tick and no reply — the Host topic read as dead while
  every process reported healthy.

  Make the front desk the sole `getUpdates` caller on a shared token and
  fan updates out to the bridge over an on-disk queue
  (`cursor-bridge-inbound.jsonl`): the front desk appends bridge-owned updates
  instead of dropping them, and the bridge drains that file instead of competing
  on Telegram. An exclusive `CURSOR_BRIDGE_BOT_TOKEN` keeps owning `getUpdates`
  directly — the queue is the shared-token path only.

  Ships with a standing busy/idle liveness line on the Cursor Remote topic,
  edit-in-place and change-gated, showing whether the bridge is working a turn
  and how many are waiting — the cue whose absence made this defect invisible.

  Also in scope, from the same intake: `--help` / `-h` on
  `telegram-cursor-bridge.js` must print usage and exit, never treat the flag as
  a repo root and open a long poll. A historical `--help` process was doing
  exactly that and stealing updates.

  ## Why

  A whole operator surface was silently unusable with no failing signal
  anywhere. Two pollers on one token is a standing hazard, not a one-off: any
  future consumer of that token reintroduces it unless the single-poller rule is
  encoded and the fan-out is the documented way to add a second consumer.

  ## Out of scope

  - Bubble remote configuration and hold-music catalog (BL-765).
  - Keeping Cursor Remote up across ancillary/night stop (BL-763, BL-762).
  - Mini App Let's Talk retirement (BL-766).

acceptance: specs/features/BL-764-front-desk-eats-host-bridge-updates.feature

