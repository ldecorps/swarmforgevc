notes: |
  Adopt candidates already in the dirty master tree — new
  `extension/src/tools/cursorBridgeInboundQueue.ts`,
  `extension/src/tools/telegramCursorBridgeLiveness.ts`, modifications to
  `telegramFrontDeskBotCore.ts` (`forwardCursorBridgeUpdate`, `ownedTopicIds`,
  Bubble topic ownership), `telegramCursorBridgeCore.ts`,
  `telegramCursorBridgeLive.ts`, `telegramCursorBridgeRedeploy.ts`,
  `telegram-cursor-bridge.ts`, and their vitest files. Coder adopts, does not
  re-derive.

  Redelivery/idempotence is the invariant to design against up front:
  `drainCursorBridgeInboundUpdates` currently clears the file with a truncating
  write before parsing, so an append landing between the read and the truncate
  is lost. That is the third invariant, and it wants a property test rather than
  more example scenarios.

  e2e QA procedure: with front desk and bridge sharing one token, type in the
  Host topic and confirm an Agent-started acknowledgement and a reply while the
  front desk stays healthy; confirm `node extension/out/tools/telegram-cursor-bridge.js --help`
  exits 0 without Telegram env and opens no poll; confirm the Cursor Remote
  liveness line flips busy → idle in place rather than posting a new message per
  turn.
