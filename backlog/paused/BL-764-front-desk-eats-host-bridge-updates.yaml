id: BL-764
title: "DEFECT — Front desk and Host bridge share one bot token, so Host/Bubble messages are silently dropped"
milestone: M8
type: defect
severity: high
status: todo
epic: swarmforge-console
human_approval: pending
assigned_to: none
priority: 1
direction: queue-jump
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]

invariants:
  - "At most one process calls Telegram getUpdates for a given bot token; any second consumer of that token reads its updates from the on-disk fan-out instead."
  - "An inbound update addressed to a bridge-owned topic is either forwarded to that bridge or explicitly dropped with a recorded reason — never routed to SUP/Operator, and never silently discarded."
  - "Draining the inbound queue is idempotent under redelivery: an update drained once is not acted on twice, and a concurrent append is never lost by the drain."

required_wiring:
  - "extension/src/tools/telegramFrontDeskBotCore.ts::forwardCursorBridgeUpdate::front desk forwards instead of dropping"
  - "extension/src/tools/telegramCursorBridgeLive.ts::drainCursorBridgeInboundUpdates::bridge consumes the queue"
  - "extension/src/tools/telegramCursorBridgeCore.ts::shouldUseCursorBridgeInboundQueue::shared-token default"
  - "swarmforge/scripts/start_cursor_bridge.sh::CURSOR_BRIDGE_INBOUND_QUEUE::shared-token launch default"

