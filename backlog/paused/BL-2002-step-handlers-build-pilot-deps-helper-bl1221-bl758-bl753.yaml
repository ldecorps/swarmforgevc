description: |
  ## What is wanted

  In each of these step handlers, the object passed to `landPilotedTicket`
  as its deps is built by `makeAcceptanceGateDeps({ ...overrides })`
  (extension/test/helpers/pilotAcceptanceGateDeps.js) instead of an object
  literal that lists every member by hand:
  - `specs/pipeline/steps/bl1221PilotGateDepsStubsSteps.js` (`benignDeps`)
  - `specs/pipeline/steps/bl758PilotInjectRolePromptsPerHatSteps.js`
  - `specs/pipeline/steps/bl753PilotUnreachableStepHandlerUntestedBehaviorSteps.js`

  ## Where to read (only these lines)

  - `specs/pipeline/steps/bl757RealTreeOrphanGateSteps.js` lines 23 and
    75-100: the require and `baseDeps(ctx)` - the shape to copy.
  - In each handler, `grep -n checkOriginMainLanding` finds the hand-built
    object. Keep the members whose values differ from the helper's
    defaults as overrides; drop the rest.

  ## What the coder does (all of it)

  1. Edit the three handlers, one at a time, running that handler's
     feature (qa_e2e_procedure) after each, its output saved to
     tmp/out.txt.
  2. Write backlog/evidence/BL-2002-coder-<date>.md: the three results.
  3. Commit, forward to QA, run done_with_current.sh.

notes: |
