description: |
  ## What

  `sendDocument` in `extension/src/notify/telegramClient.ts`: token, chat
  id, file bytes, filename, optional `message_thread_id`, optional
  caption, an injectable post function (the `SendVoicePostFn` seam
  sendVoiceNote already has - reuse or generalise it), returning the same
  `{ success, error? }` shape with `formatApiFailureError` /
  `formatNetworkError` redaction. Bot API method `sendDocument`, field
  `document`.

  A headless CLI under `extension/src/tools/` (name is the implementer's;
  `send-telegram-document.ts` fits the neighbours): `<project-root> <file>
  [--caption <text>]`, resolves the Concierge topic exactly as
  `notify-dead-letters.ts` does (`topicForSubject(readTopicMap(root),
  OPERATOR_SUBJECT_ID)`), exits non-zero with
  `operator-topic-not-yet-created` when the map has no such topic, reads
  `TELEGRAM_BOT_TOKEN` / `TELEGRAM_CHAT_ID` from the environment, honours
  `TELEGRAM_NOTIFY_FORCE_RESULT` for the no-network path. `main()` is a
  thin wrapper over an exported helper driven in-process by the tests
  with stubbed argv and env.

  ## Why

  Nothing in the swarm can hand the operator a file today; the scoring
  table the operator asked for (BL-1510) is the first consumer, and a
  generic upload serves the briefing and evidence exports later.

  ## Scenario notes for the coder

  - Scenario 01: the fake post function captures the URL and the FormData;
    assert the endpoint ends in `/sendDocument`, and the form's `chat_id`,
    `message_thread_id` and the `document` entry's filename.
  - Scenario 02: mirror telegramClient's existing failure tests for
    sendVoiceNote (non-ok status with description; thrown network error);
    assert the token substring is absent from the error.
  - Scenario 03: drive the exported helper with a fixture root whose topic
    map does / does not name the Concierge subject; the send function is
    injected, so no network.

  ## Not in scope

  - The scoring report itself (BL-1510).
  - A Telegram /command that triggers uploads; the front desk is untouched.

qa_e2e_procedure: |
  On the parcel commit, from `extension/`:
  1. `npm test` green; Stryker over the compiled client and CLI helpers
     with no surviving mutants on the new functions.
  2. Live, from the repo root with the front desk's token and chat in the
     environment: `node extension/out/tools/send-telegram-document.js .
     README.md --caption "BL-1509 e2e"` -> the file appears in the
     Concierge topic as an attachment; exit 0.
  3. With a scratch root whose topic map lacks the Concierge subject the
     same command exits non-zero printing operator-topic-not-yet-created.
