id: BL-1032
title: "The tmux-reaper guard fires on a step file that only ASSERTS ABOUT tmux argv - it cannot tell executing from asserting, and the default unit lane is RED at HEAD"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
assigned_to: specifier
priority: 20
direction: normal
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1032-tmux-reaper-guard-scopes-by-hazard-not-by-token.feature

invariants:
  - "The guard is in scope for a file exactly when that file can cause a real tmux server to run - a file that only names tmux subcommands as data is never in scope."
  - "No file is made compliant by adding a reaper call it does not need: every in-scope file's track()/reap() guards a server that file actually starts."

human_approval: approved
approval_context: >
  One open decision, with a recommendation, and one measured warning about the
  obvious fix. The decision is how the guard decides scope. Recommendation is
  to scope by HAZARD - the file can cause tmux to run - rather than by the
  presence of a quoted 'new-session' token. What is firm: BL-1018's step file
  must go green WITHOUT gaining a reaper call (a file that never starts a
  server has nothing to reap, and adding one to satisfy a gate is a lie the
  next reader has to disbelieve), and all nine genuinely-spawning step files
  must stay in scope. What is negotiable: how the hazard is detected.
  The WARNING is measured, not theoretical: the naive discriminator - "no
  literal execFileSync('tmux' in the file, therefore out of scope" - is
  WRONG. Measured across the 11 matching step files it exempts
  bl958ControlPlaneLossSteps.js too, which reaches tmux through a PATH stub
  it writes at bin/tmux rather than a literal spawn. bl958 happens to be
  compliant today, so exempting it regresses nothing visibly - which is
  exactly what makes that hole worth naming before it is dug.

source: |
  Reported by the coder via note, 2026-08-22: "2 guards RED at HEAD, not mine:
  BL-1018 tmux-reaper, BL-1025 temp-dir-trap". The temp-dir-trap half is a
  real violation and is ticketed separately as BL-1033; this ticket is the
  tmux-reaper half, which speccing found to be a guard defect, not a
  violation.

  Reproduced at HEAD from extension/:
    npx vitest run test/tmuxReaperGuard.test.js
  FAIL - "the real specs/pipeline/steps tree has zero tmux-reaper violations",
  exactly one violation:
    specs/pipeline/steps/bl1018SingleRoleRepairNeverKillsServerSteps.js:
      starts a tmux server ('new-session') but does not require
      ./lib/fixtureReaper and call track()

  The accusation is false. That file's own header, lines 8-9, reads: "Nothing
  here runs tmux, and that is the design, not a shortcut: the defect under
  test is 'a repair took down the whole tmux server', which is not..." It
  spawns exactly one binary, `bb -e <expr>` at line 52, to evaluate resolved
  command VECTORS as data, then asserts about them:

    line  83: const creates = ctx.commands.filter((c) => has(c, 'new-session'));
    line 107: const creates = ctx.commands.filter((c) => has(c, 'new-session'));
    line 116: ['tmux', '-S', SOCKET]                  // inside an assert.ok
    line 132: assert.ok(!has(cmd, 'kill-server'), ...)

  No tmux process is ever started. Measured: `tmux-spawn=0` for this file
  against a spawn-call-with-tmux-literal scan, versus 1-7 for every genuinely
  spawning sibling.

  The guard (specs/pipeline/steps/lib/tmuxReaperGuard.js, BL-817) detects with
  STARTS_TMUX_SERVER = /['"]new-session['"]/. Its own comment explains the
  quoting: it is there so "a substring match inside an unrelated string (an
  HTTP path like /lets-talk/new-session, a data-testid, or prose in an error
  message) never false-positives - every real tmux-server starter in this repo
  passes 'new-session' as its own argv array element, quoted exactly like
  this."

  That reasoning has an unstated converse the guard never checks: a file that
  ASSERTS ABOUT tmux argv also writes 'new-session' as a quoted argv element,
  because it is comparing against argv. The quoting closed the unlikely
  false-positive class (prose, URLs) and left the likely one wide open - and
  the likely one is precisely the shape of a test file for a ticket about
  which tmux commands a repair may resolve to.

notes: |
  The guard is RED-WHEN-CORRECT here, which is the inversion worth naming.
  BL-1018's file is flagged BECAUSE it correctly refuses to run tmux. The two
  ways to make it green today are to add a require+track() pair that guards
  nothing, or to obfuscate the string - both worse than the current state.
  A guard whose cheapest satisfying move is to write a lie is not measuring
  the hazard it names.

  This has already happened once, in the corpus, on the record.
  specs/pipeline/steps/bl958ControlPlaneLossSteps.js:38 carries the comment
  "Required by extension/test/tmuxReaperGuard.test.js." next to its reap()
  call, and that file writes a FAKE tmux at bin/tmux via a PATH stub rather
  than spawning the real one. Its reaper adoption is at least partly
  guard-driven rather than hazard-driven. That is the first invariant's
  reason for existing, and it is why the naive fix must not simply exempt
  every file lacking a literal tmux spawn.

  Blast radius: extension/test/tmuxReaperGuard.test.js runs in the DEFAULT
  unit lane (`npm test` -> scripts/recordTestDuration.js -> vitest over
  extension/test), so every pipeline role currently sees this red and must
  decide whether to baseline it. That is the mechanism by which a real defect
  gets normalized as "pre-existing", which is why the severity here is about
  the broken signal, not about tmux.

  Sibling guard: specs/pipeline/steps/lib/../../../extension/src (BL-459's
  tempDirTrapGuard.js) shares the same deliberate FILE-LEVEL shape. Its
  current finding is a TRUE positive (BL-1033), so it is NOT re-scoped here -
  noted only so a reader does not assume both guards are wrong.

description: |
  ## What

  Make the tmux-reaper guard scope by the hazard it names - this file can
  cause a real tmux server to run - instead of by the presence of a quoted
  'new-session' token anywhere in the file.

  Today it cannot distinguish a file that STARTS a tmux server from one that
  merely ASSERTS ABOUT the argv of a command that would. The second shape is
  common and legitimate: it is what a test for "which tmux commands may this
  repair resolve to?" looks like.

  ## Why now

  extension/test/tmuxReaperGuard.test.js is in the default unit lane. It is
  RED at HEAD on a file that is behaving correctly, so every role in the
  pipeline is currently being asked to baseline a red suite.

  ## How (direction, not mandate)

  Scope by hazard. A file that never causes tmux to run has nothing to reap.
  Note the measured warning in approval_context before reaching for the
  obvious version of this: keying purely on a literal spawn call with 'tmux'
  as its command also exempts bl958ControlPlaneLossSteps.js, which reaches
  tmux via a PATH stub. Whatever discriminator is chosen must keep all nine
  genuinely-spawning files in scope and must not silently drop bl958.

  ## Out of scope

  Re-scoping the sibling tempDirTrapGuard (BL-459). Its current finding is
  real; see BL-1033.

qa_e2e_procedure: |
  From extension/, against the parcel:

  1. Baseline the defect on a PRE-fix checkout: `npx vitest run
     test/tmuxReaperGuard.test.js` must FAIL with exactly one violation,
     bl1018SingleRoleRepairNeverKillsServerSteps.js.
  2. Confirm the accusation is false on that same checkout: grep the accused
     file for a spawn call naming tmux. There must be none - its only spawn is
     `bb -e`. Its 'new-session' occurrences must all sit inside filter/assert
     expressions over ctx.commands.
  3. Run the guard on the parcel. It must PASS, and
     bl1018SingleRoleRepairNeverKillsServerSteps.js must still contain NO
     require of ./lib/fixtureReaper and NO track() call. A green guard bought
     by adding a reaper to that file FAILS this ticket.
  4. Prove non-vacuity, the important step. For each of the nine genuinely
     tmux-spawning step files, remove its fixtureReaper require in a scratch
     checkout and re-run the guard. Each must be reported. Restore. A guard
     that no longer catches any of them has been widened into uselessness.
  5. Prove the bl958 hole named in approval_context is not present:
     bl958ControlPlaneLossSteps.js reaches tmux through a stub it writes at
     bin/tmux, not a literal spawn. Remove its reaper adoption in a scratch
     checkout and re-run. It must still be reported. Restore.
  6. Run the full default unit lane (`npm test`). It must be green apart from
     any failure separately tracked by BL-1033, and record which.
  7. Confirm the acceptance feature runs via specs/pipeline/cli.js, including
     scenario 03's second Then over the committed tree.
