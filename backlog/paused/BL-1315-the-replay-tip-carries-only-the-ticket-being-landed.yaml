notes: >
  Distinct from three neighbours, all checked at spec time. BL-1297 (done)
  gave `:delivered` a real diff where it used to return nothing for a merge -
  this is the residual of that fix being too wide, not a regression of it.
  BL-1308 (done) widened the DETECTOR only, by its own written statement.
  BL-1309 (paused) blocks the mandatory land step when the tip carries
  unlanded content - the safety net, not the fix; it does not let an entangled
  parcel land its own work.

  ORTHOGONALITY, for the coordinator: do NOT promote this concurrently with
  BL-1272, which touches `land_step_lib.bb` for the opposite direction (a
  false POSITIVE on an already-landed sibling). Same file. BL-1309 is a
  different file (`land_main_publish.sh`) and may run concurrently.

  AMENDED 2026-08-31 by the specifier, after QA held BL-1303 on the same
  computation in the opposite direction (ruling:
  backlog/evidence/BL-1303-specifier-ruling-qa-hold-upheld-under-include-20260831.md).
  Widened title, a new description section, scenario 06, e2e step 6, and
  `priority:` 6 -> 4. This is a DESCRIPTION GAP being closed, not new scope:
  invariant 1 already forbade the dropped-path outcome, and the amendment
  makes it executable. Scope stays one function (`own-paths`), one root cause
  (the base of the path set), one sitting.

  The HUMAN APPROVAL WAS DELIBERATELY NOT RESET, and that is not an oversight
  to correct later. `human_ruling` reads "narrow the replay tip by attribution,
  so an entangled parcel can still land its own work" - the amendment adds no
  fork and makes that clause's second half true, and `approval_context`
  explicitly recommended "option 1 with both invariants enforced". Re-pending
  would erase a genuine approval to ask a question already answered.

  ROUTING, for the coordinator: this is a defect in the land step, so a parcel
  built normally reaches `swarmforge-QA` - the branch already carrying this
  entanglement - and is held by the very defect it repairs. Route via
  `swarmforge/scripts/expedite.sh BL-1315 --no-restart`, as BL-1297/BL-1298
  were. Two hazards to carry in: the expedite path skips the `required_wiring`
  gate, so verify both anchors by hand; and `--dry-run` is not dry once
  `.worktrees/expedite-BL-1315` exists.

  IR-DRY, resolved not ignored: the checker's remaining medium findings pair a
  step written with a placeholder in an outline against the same step written
  with a literal in a plain scenario, plus one false synonym between a Given
  and an unrelated Background step. All normalize to one handler pattern per
  step; there is no duplication in the registry. Do not "fix" them by making
  plain scenarios into artificial outlines.
