notes: >
  Distinct from three neighbours, all checked at spec time. BL-1297 (done)
  gave `:delivered` a real diff where it used to return nothing for a merge -
  this is the residual of that fix being too wide, not a regression of it.
  BL-1308 (done) widened the DETECTOR only, by its own written statement.
  BL-1309 (paused) blocks the mandatory land step when the tip carries
  unlanded content - the safety net, not the fix; it does not let an entangled
  parcel land its own work.

  ORTHOGONALITY, for the coordinator: do NOT promote this concurrently with
  BL-1272, which touches `land_step_lib.bb` for the opposite direction (a
  false POSITIVE on an already-landed sibling). Same file. BL-1309 is a
  different file (`land_main_publish.sh`) and may run concurrently.

  IR-DRY, resolved not ignored: the checker's remaining medium findings pair a
  step written with a placeholder in an outline against the same step written
  with a literal in a plain scenario, plus one false synonym between a Given
  and an unrelated Background step. All normalize to one handler pattern per
  step; there is no duplication in the registry. Do not "fix" them by making
  plain scenarios into artificial outlines.
