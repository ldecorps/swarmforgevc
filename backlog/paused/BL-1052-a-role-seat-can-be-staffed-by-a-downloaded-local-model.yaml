qa_e2e_procedure: |
  On the live host, after a local Qwen (or Qwen-backed) model is available:

  1. Launch the new pack against a SCRATCH target - never the live repo.
  2. Confirm the seat is a real agent, not a narrator: ask it to run
     ready_for_next.sh and confirm the pane shows the command's actual
     output.
  3. Confirm a second model identity can be selected on the same seat path
     without a new adapter - at least by configuration or registration,
     even if the second weights file is a fixture stub.
  4. Confirm secrets and weights paths never reached a committed file.
  5. Confirm existing cloud packs are untouched.

assigned_to: specifier
