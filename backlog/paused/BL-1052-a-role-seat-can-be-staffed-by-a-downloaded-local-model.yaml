qa_e2e_procedure: |
  On the live host, after BL-1082 has landed and a local Qwen coder model is
  being served:

  1. Launch the new pack against a SCRATCH target - never the live repo.
  2. Confirm the seat is a real agent, not a narrator: ask it to run
     ready_for_next.sh and confirm the pane shows the command's actual output,
     not a description of it.
  3. Stop the local server, launch again, and confirm the launch is REFUSED
     naming the unreachable endpoint - not a seat that starts and then fails.
  4. Confirm a second model id can be staffed on the same seat path by editing
     only the window line - no new launch branch, capability entry or pack
     family. A stub second model is acceptable here.
  5. Confirm no credential value reached a generated launch script or any
     committed file.
  6. Confirm the existing cloud packs, and qwen-mono-router.conf in particular,
     are untouched.

