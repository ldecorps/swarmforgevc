id: BL-1052
title: "A role seat can be staffed by a downloaded local model: the swarm has no on-host model seat path, so a model served on this machine has no agent shape, no launch adapter and no pack to run in"
milestone: M8
type: feature
status: todo
epic: swarm-intelligence-layer
priority: 0
direction: queue-jump
depends_on: [BL-1082]
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1052-a-role-seat-can-be-staffed-by-a-downloaded-local-model.feature
human_approval: pending
approval_context: >
  Operator reframed this ticket on 2026-08-22 via Let's Talk. The previous
  shape was qwen-code-only (a cloud Token Plan CLI). The real ask is generic:
  download a model, run it on this host, staff a swarm seat with it. Qwen is
  the FIRST PROOF of that path, not the permanent product of the ticket. The
  specifier has since drained the 2026-08-22 intake across three slices:
  BL-1082 pulls and serves the model, this ticket staffs a seat against it, and
  BL-1053 lets the intelligence layer route to it. Two decisions in this ticket
  need your sign-off: the seat agent is registered under the new agent key
  `local-model` (never folded into `codex` or `aider`), and the pack points at
  a loopback OpenAI-compatible endpoint rather than any cloud base URL. Any
  coder work already started against the qwen-code-only shape is out of date
  and must not continue under that contract.

required_wiring:
  - 'swarmforge/scripts/prompt_engine_lib.bb::"local-model"::the capability entry for the local-model seat agent must land in the live provider-capabilities map - the launch adapter reads its shape from there, and an adapter built against a map with no entry falls through to normalize-agent default claude and silently launches the wrong agent shape'
  - 'swarmforge/scripts/swarmforge.sh::local-model)::the launch adapter branch and the validate_agent allow-list both live here - an agent key that is not in the allow-list exits 1 at parse time, and a key allow-listed with no launch branch exits 1 at compose time, so the seat is unlaunchable until this file names it'
  - "specs/pipeline/steps/index.js::bl1052::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "A capability entry describes the AGENT, never the model. The local-model seat agent and any file-editor path that happens to share a model catalog must never share a capability shape - they differ in whether the agent can execute a shell command at all."
  - "The path is model-generic. Staffing a second downloaded model must not require a second copy of this ticket's launch branch, capability entry or pack family - only the model id passed on the window line."
  - "Secrets never land in a pack file, a generated launch script, a prompt, or anything that reaches a commit. Credentials reach the pane only through the launching environment and tmux -e."

description: |
  ## What is wrong

  The swarm can staff seats with a fixed set of cloud agent CLIs. Once BL-1082
  serves a downloaded model on this host, nothing can sit in front of it: there
  is no agent key for an on-host seat, no launch branch that composes its
  command, and no pack that staffs role windows with it.

  The previous draft of this ticket solved only the Qwen cloud CLI case
  (`qwen-code` against the Token Plan endpoint). That is a useful first quest,
  but it is not the product. A second local model must not need another bespoke
  agent shape, launch adapter and pack of the same size.

  ## First quest (not the whole product)

  Prove one seat end to end against the local endpoint BL-1082 serves: a
  shell-capable agent that actually executes (not an aider-shaped narrator that
  describes `ready_for_next.sh` instead of running it), launched by a pack
  against a scratch target. The second model id in the acceptance feature is
  there to prove the path is generic - the model is a window-line argument, not
  a code change.

  ## How (direction, not mandate)

  Specifier decisions, open to challenge at approval but not to be
  re-litigated in a coder ticket:

  - **Agent key: `local-model`.** Its own key, never folded into `codex`
    (which resolves to a cloud CLI) and never into `aider` (which cannot
    execute at all). The invariant that a capability entry describes the AGENT
    is exactly what a shared key would break.
  - **Capability shape: the vibe/gemini shape** - `:wake-style :chat-message`,
    `:bootstrap-style :embedded` - because the seat is an agentic CLI with a
    real shell, not a file editor.
  - **Endpoint: loopback, from configuration.** The base URL and model id come
    from the pack and environment, never a hard-coded vendor host.
  - Which concrete CLI sits in that branch is the builder's call, provided it
    speaks an OpenAI-compatible base URL, executes shell commands, and takes
    the model id as an argument.

  Health is checked before a seat is launched: a window launched against an
  endpoint that is not ready must be refused, naming the endpoint, rather than
  starting an agent that will fail on its first completion. The checker itself
  is BL-1082's deliverable; this ticket is its call site.

  Deliberately NOT in this slice: pulling and serving the model (BL-1082);
  ModelFactory provider->agent routing and Model Steward registration
  (BL-1053); autonomous seat mutation; replacing the live Claude pipeline;
  every possible runtime backend in one go.

