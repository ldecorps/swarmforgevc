description: |
  ## What is wanted

  - A **Verify** button on each draft. It runs, on demand at any hour:
    - **IR-DRY over the draft's steps.** Write the draft's scenarios as a
      temporary feature under the bridge's own temp root, then run the
      vendored `bb gherkin-parser` and `bb gherkin-ir-dry-checker` from
      `swarmforge/vendor/aps/`, as the specifier does at mint (answer 5).
    - **Near-duplicate narrative values**: a draft value that differs from
      an existing vocabulary value only by case, an article or spacing
      ("operator" and "the operator"), or by a small edit distance.
    - **Backlog overlap**: tickets in `backlog/active`, `paused` and `done`
      whose title or feature narrative already delivers the draft's action.
      The top few, each named by id.
  - Each finding becomes one **suggestion**: what was found, and
    optionally a proposed change to the draft. Each has Accept and Reject,
    with Accept all over the open ones (answer 4). Accepting a suggestion
    with a proposed change applies it. Accepting one without a change (such
    as "BL-123 already delivers this") just acknowledges it. Nothing is
    applied without a tap.
  - The suggestion shape is the one BL-1735's specifier session and
    BL-1737's Ask panel will also produce. Keep it source-agnostic, with a
    `source` field.

  ## Scope

  - The form page and routes; a verify module with the three checks and
    the suggestion model.
  - `specs/features/BL-1734-...feature` + the pinned handler.
constraints: >
  Verify runs entirely on the bridge host in this slice: no Claude call,
  no handoff, nothing sent to any pipeline seat. The IR-DRY run's temp
  feature file lives under a swept temp root and never under
  specs/features/.

out_of_scope: |
  - The specifier session's INVEST review: BL-1735.
  - Staleness, one Verify at a time, and the history in the INTAKE file:
    BL-1736.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1734-verify-returns-suggestions-i-accept-or-reject.feature`:
     all ok (5 of 5).
  2. Live at phone width: a draft whose two scenarios share a Given step,
     with actor "operator" and the action "file a new intake from my
     phone". Verify lists the repeated step, the actor near-duplicate and
     at least one existing ticket, each with Accept and Reject. Reject
     one: the draft is unchanged. Accept all: every proposed change
     applies.
  3. `git diff main...HEAD --name-only` names only the Scope files, the
     feature, the handler, docs and evidence.

