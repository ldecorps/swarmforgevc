id: BL-1022
title: "The daemon's subprocess-API gate walks only the load-file closure, so any script it reaches by spawning is outside the guard - the blind spot that let the banned API back onto the critical path"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
priority: 95
direction: swarm-reported
depends_on: [BL-1021]
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1022-daemon-guard-closure-follows-process-spawn-edges.feature

invariants:
  - "The subprocess-API ban is enforced over every file the daemon can reach, by any edge kind - a file reachable by spawning is inside the closure exactly as one reachable by loading."
  - "The gate reports the closure it actually covered, so a shrinking closure is visible rather than silently passing."

source: |
  Specifier verification 2026-08-21, while speccing BL-1021 from
  .swarmforge/operator/INTAKE-handoffd-dispatch-gap-deadlock-20260821.md.
  BL-1021 is the live deadlock; this is the reason it was invisible.

description: |
  ## The blind spot

  `daemon_cycle_guard_lib_test_runner.bb` asserts "no subprocess path outside
  the chokepoint anywhere in handoffd.bb's load-file closure", computed from:

      {:entrypoints #{"handoffd.bb"} :read-file read-file}

  The assertion is true and the gate is worth keeping. But it walks ONE edge
  kind. `handoffd.bb:1756` reaches its collaborator by spawning it:

      (daemon-cycle-guard-lib/sh! ["bb" (swarm-handoff-script) (str draft)] ...)

  `swarm_handoff.bb` is therefore not in the closure, and
  `swarm_handoff.bb:6` requires `clojure.java.shell` - the very API the gate
  exists to ban - where it has sat on the daemon's critical path unseen.
  BL-1021 is what happened next.

  ## Why this is its own ticket

  BL-1021 removes the banned call from the one script we found. That fixes
  the outage and fixes nothing about the next script. The gate's promise -
  "no subprocess path escapes the chokepoint" - is read by every future
  author as covering the daemon, and it does not. Until the closure follows
  spawn edges, the guarantee is narrower than its own assertion message
  claims, and the next collaborator added by spawn re-opens the hole with no
  failing test.

  A derived guard is not automatically a complete one: it still has a depth,
  and one hop is the default nobody notices choosing.

  ## How (direction, not mandate)

  - Extend the closure walk to follow process-spawn edges alongside
    load-file edges: a literal vector spawn whose first element is a
    runtime (`bb`) and whose next element resolves to a script in this
    repo is an edge to that script.
  - Keep both edge kinds transitive and mutually recursive - a spawned
    script that loads a file that spawns another is all one closure.
  - Some spawn targets are computed, not literal (`swarm-handoff-script`
    is a function returning a path). Resolving every dynamic target is not
    tractable; deciding what the gate does with one it cannot resolve is
    the real design question. Failing loud on an unresolvable spawn target
    is the conservative answer and probably the right one, but it is the
    implementer's call with the architect - what must NOT happen is
    silently skipping it, which is the same class of blind spot one level
    up.
  - Have the gate report the closure it covered. A gate whose closure
    silently shrinks passes for the wrong reason, which is how this one
    read green while missing the file that took production down.

  ## Scope

  - swarmforge/scripts/test/daemon_cycle_guard_lib_test_runner.bb - the
    closure walk and its reporting
  - whatever library the walk lives in, if it is extracted
  - specs/features/BL-1022-daemon-guard-closure-follows-process-spawn-edges.feature
    and its step handlers

  Out of scope: removing the banned API from any specific script (BL-1021),
  and the bounded-wait behaviour of `sh!` itself (BL-1021).

qa_e2e_procedure: >
  1. Confirm the blind spot at the parent commit: run the gate and confirm it
     passes, then confirm by inspection that swarmforge/scripts/swarm_handoff.bb
     contains a clojure.java.shell reference and is NOT in the reported
     closure. A gate that passes while missing a reachable offender is the
     defect.

  2. At the parcel commit, run the gate and confirm swarm_handoff.bb is in the
     reported closure, reached by a spawn edge.

  3. Fixture-drive the negative case: add a fixture script inside the closure
     that uses an unbounded clojure.java.shell call, run the gate, and confirm
     it FAILS naming that script and that call. Remove the fixture and confirm
     it passes again. A gate that cannot be made to fail is not gating.

  4. Confirm transitivity across mixed edges with a three-file fixture chain
     (spawn -> load -> spawn) and confirm all three appear in the closure.

  5. Confirm the unresolvable-target decision is honoured: introduce a spawn
     whose target cannot be resolved statically and confirm the gate does
     whatever the architect settled on - and that it is loud, not silent.

  6. Confirm the acceptance feature runs: all four scenarios execute with
     registered handlers (no runtime THROW on a missing handler).

notes: |
  depends_on BL-1021 is ordering, not blocking on discovery: BL-1021 removes
  the known offender, so this gate should go green on the real tree once it
  lands. If this ticket is worked first the gate will fail on swarm_handoff.bb,
  which is correct behaviour and not a reason to weaken it.

  Same family as the repo's existing "derive the list, do not hand-maintain
  it" lessons: a gate that enumerates what it checks eventually checks less
  than it claims.
