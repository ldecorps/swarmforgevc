  pass is fine, it does not block promotion of this ticket.

qa_e2e_procedure: |
  On the live host, once built:

  1. Seed a seat's guard-window history with N consecutive clean periods at
     its current notch and run the descent review; confirm a proposal names
     the next lower effort notch and that the seat's live model/effort (or,
     under the guarded-auto-apply ruling, the applied notch plus its guard
     window) matches exactly what the chosen ruling_option specifies — never
     more.
  2. Seed a seat already at its lowest effort notch for its current model;
     run the review; confirm the proposal names a cheaper model at HIGH
     effort, never low, with the stated reason.
  3. Seed partial clean-period progress at a descended notch, record a guard
     trip, and confirm ladder state returns to the last known-good notch
     immediately with the partial progress discarded.
  4. Shift a seat's model's price validity window (via BL-1056's query) and
     confirm the next review re-evaluates and surfaces a new proposal rather
     than silently keeping the old terminal notch.
  5. Confirm the review is actually scheduled: inspect the live crontab (or
     its swarmforge-managed equivalent) for the new descent-review entry
     installed by `install_swarmforge_crons.sh`.

