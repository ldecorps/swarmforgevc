id: BL-1904
title: "BL-1871's take-up moves whatever checkout the receive runs from, for whatever role SWARMFORGE_ROLE names: on 2026-10-02 a BL-1317 acceptance run made a coder receive in QA's worktree and swarmforge-QA was moved onto origin/main twice mid-pass, dropping QA's parcel; a take-up now moves only the running role's own roles.tsv worktree"
milestone: M8
type: defect
severity: high
# high: a live role branch was moved mid-pass and the parcel QA was gating
# fell off its line (QA caught it in its own reflog and re-merged). Any role
# that runs BL-1317's feature, or any shell whose cwd sits in another role's
# checkout when it runs a receive, does the same today.
status: todo
epic: landing-is-a-merge
priority: 4
depends_on: []
