description: |
  ## What is wrong

  QA note 003166, evidence e81a640797 (BL-1717's pass): the per-file
  budget guard refused `extension/test/emitLifecycleSnapshotCli.test.js`,
  16.1 s in-suite and still 9.6 s run alone, with no register row. That
  makes it an unowned red. BL-1721 (done 2026-09-24) owned the same file
  and fixed only the guard's reporting. It measured the file alone on
  main, 16 ms, and so never found the cause.

  The cause is test 4, "the compiled CLI runs against the real repo".
  It runs `out/tools/emit-lifecycle-snapshot.js` with
  `repoRoot = path.join(__dirname, '..', '..')`, which is whatever
  checkout the suite runs in. The CLI does the one full-history backlog
  `git log` walk (BL-897) unless
  `.swarmforge/briefing/lifecycle-snapshot.json` there already holds
  today's `dayKey`. Found at mint (08:15Z): main holds today's snapshot
  (the daemon writes it) and the file takes 35 ms alone at load 31.
  QA's and coder@2's worktrees hold no snapshot, and coder's is dated
  2026-09-06, so the test walks there. Its `finally` then deletes the new
  snapshot or restores the stale one, so the next run walks again. The
  test also writes into a live `.swarmforge/` that its own comment says
  is "shared with any live daemon in this same worktree".

  ## What is wanted
  - Test 4 runs the compiled CLI against a fixture checkout (`git init`
    under mkdtemp, a commit or two under `backlog/`), not the live one,
    and asserts the same path/walked JSON. The file runs in well under
    the budget in every checkout, whether or not that checkout holds a
    snapshot.
  - The other three tests already use injected seams. They stay as they
    are.

  ## Scope
  - `extension/test/emitLifecycleSnapshotCli.test.js`.

qa_e2e_procedure: |
  On the parcel commit, in the QA worktree (which holds no lifecycle
  snapshot), ONE run each (2026-09-17 rule).
  1. `cd extension && npx vitest run --config vitest.config.mjs test/emitLifecycleSnapshotCli.test.js --reporter=json --outputFile=tmp/bl1741.json`:
     4 of 4 pass, and the file's duration in the report is under 7000 ms.
     Record the duration and the 1-minute load.
  2. `ls .swarmforge/briefing/lifecycle-snapshot.json` in the QA worktree:
     absent after the run, as it was before (the test wrote nothing
     there).
  3. `node specs/pipeline/cli.js specs/features/BL-897-briefing-gathers-lifecycles-once.feature`:
     all ok.
  4. After landing: REGISTER_ROW_RETIRED for this ticket's unit row.

