approval_context: >
  No new feature file. Minted approved under the 2026-09-17 operator
  hotfix (severity defect, no ruling_options). FIRM: the test still runs
  the compiled CLI as a subprocess and still asserts its path/walked JSON.
  FIRM: the fixture root is a `git init` under mkdtemp, proven by
  `rev-parse --git-common-dir` before any git command (Guardrails,
