type: defect
severity: high
# high (standing-red rule 2026-09-05): an acceptance-lane feature red on
# main since 2026-07-16, deterministic, now a register row. The concierge
# behaviour is right (the bell is what the human chose); the broken thing
# is a durable contract still asserting the superseded glyph, which is
# exactly what the rule refuses to call medium.
status: todo
