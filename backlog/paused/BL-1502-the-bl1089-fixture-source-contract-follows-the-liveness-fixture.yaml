  posed and there are no ruling_options. FIRM: the liveness fixture
  (swarmforge/scripts/test/test_front_desk_supervisor_liveness.sh) is not
  edited - BL-1285's shape stands; the fix is in the property test's
  fixture-source contract only. FIRM: the contract keeps refusing a 5000ms
  backdate (scenario 02, backdate row) - BL-1089 invariant 1 forbids a green bought by
  asserting less. FIRM: the file is not added to
  property_suite_standing_allowlist.tsv. Direction, not mandate: pin the
  property, not the helper's name - "the helper that models served-then-
  stopped stamps write_heartbeat "$root" 0" can be matched on the stamp
  line itself, or on a stamp_own_heartbeat* helper whose body contains it.
  Minted by the specifier on QA's unowned-red note of 2026-09-10 07:08Z
