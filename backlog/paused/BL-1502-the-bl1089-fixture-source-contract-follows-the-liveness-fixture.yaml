description: |
  ## What is wrong

  `extension/test/bl1089FrontDeskLivenessFixture.property.test.js` line 166:

  ```
  assert.match(src, /stamp_own_heartbeat_then_age_past_stall/, 'aging helper must exist');
  ```

  BL-1285 (`9021f12bb2`, landed 2026-09-08 22:41 BST, now in
  `backlog/done/`) rewrote the fixture so it no longer sleeps past the
  stall window: the helper became `stamp_own_heartbeat_immediately_stale`
  (fixture line 75), still writing `write_heartbeat "$root" 0` (line 79),
  and every caller sets `FRONT_DESK_STALL_MS=1` so the age-0 stamp is
  stale the moment it is written. The renamed helper satisfies every
  other line of the contract - the age-0 stamp, the absence of
  `write_heartbeat "$F" 5000`, the healthy-poll `write_heartbeat "$F"
  10` - only the name pin fails. BL-1285's parcel did not re-read the
  property that drives the fixture it changed (the BL-1465 shape); this
  ticket is the retirement it owed.

  Reproduced by the specifier on main 60623ebf02:
  `cd extension && npx vitest run --config vitest.properties.config.mjs
  test/bl1089FrontDeskLivenessFixture.property.test.js` -> 1 failed | 2
  passed, `AssertionError: aging helper must exist`. QA's isolated re-run
  the same morning read identically (dcbfd47ffc).

  ## What is wanted

  The contract asserts what BL-1089 actually owns - the served-then-
  stopped helper stamps an OWN heartbeat at age 0 and never a 5000ms
  backdate - phrased so it holds for the fixture BL-1285 landed and still
  fails for a backdating copy. The property lane is green on `main`; the
  register row this ticket adds is removed in the same land.

  ## How (direction, not mandate)

  - Match the stamp line, not the helper name: the fixture must contain a
    `stamp_own_heartbeat` helper whose body reaches `write_heartbeat
    "$root" 0`, and must not contain `write_heartbeat "$F" 5000`. Keep the
    healthy-poll `write_heartbeat "$F" 10` check.
  - Put the predicate in one small helper under `extension/test/helpers/`
    (name is the implementer's) that takes the fixture TEXT and returns a
    verdict naming the failing rule; the property test and the BL-1502
    step handler both require it (invariant 1). Scenario 02's backdate row feeds it a
    copy of the real fixture with the age-0 stamp replaced by a 5000ms
    backdate, the file's own documented "break 2".
  - Do not touch `test_front_desk_supervisor_liveness.sh`; BL-1285's
    feature (`specs/features/BL-1285-*.feature`) is that fixture's
    contract now.

  ## Not in scope

  - BL-1285's parcel not re-reading this property is the BL-1465 shape;
    no process change is minted here, the closing ceremony will see the
    ledger row.

