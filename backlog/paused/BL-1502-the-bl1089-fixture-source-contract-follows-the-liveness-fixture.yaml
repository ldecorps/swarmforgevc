qa_e2e_procedure: |
  On the parcel commit, from `extension/`:
  1. `npx vitest run --config vitest.properties.config.mjs
     test/bl1089FrontDeskLivenessFixture.property.test.js` -> 3 passed.
  2. `git diff main...HEAD --name-only` names the property test, one
     helper under extension/test/helpers, the step handler + index.js
     registration, the feature, evidence, and the register row removal;
     `swarmforge/scripts/test/test_front_desk_supervisor_liveness.sh`
     and `property_suite_standing_allowlist.tsv` are unchanged.
  3. Break-then-restore: in a scratch copy of the fixture replace
     `write_heartbeat "$root" 0` with `write_heartbeat "$root" 5000`,
     point the predicate at it, confirm it fails; restore.
  4. `bash swarmforge/scripts/test/test_front_desk_supervisor_liveness.sh`
     still passes (the fixture is untouched, this is the control).
