id: BL-1065
title: "bl1025's property runner deletes its temp root as a bare top-level form, so any git failure leaks it - and it is the ONE violation that makes the standing BL-872 guard, and the unit lane on main, red right now"
milestone: M8
type: defect
severity: high
status: todo
epic: code-quality-gates
priority: 96
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-872-tempdir-trap-guard-standing.feature

invariants:
  - "The temp root a harness creates is removed on a failing exit as well as a clean one; no cleanup depends on control reaching the last form of the script."

description: >
  `swarmforge/scripts/test/bl1025_expedite_approval_property_runner.bb` creates
  its fixture root at line 48
  (`(def root (str (fs/create-temp-dir {:prefix "bl1025-prop-"})))`) and removes
  it at line 181 with a bare top-level `(fs/delete-tree root)`. There is no
  `try`/`finally` and no shutdown hook, so the delete only runs if control
  reaches the last form.

  Control frequently will not. The file's own `g` helper throws on any nonzero
  git exit:

    (when-not (zero? exit)
      (throw (ex-info (str "git failed: " ...) {})))

  so a single failing git call anywhere in the 32-case sweep aborts the script
  above line 181 and leaks the root permanently. This is the engineering rule
  "a fixture dir is removed in a `finally`, never only after the last assertion -
  a throw or bounce otherwise leaks it forever".

  THE GUARD ALREADY CATCHES THIS, AND IS RED. BL-459/BL-872 shipped exactly this
  check, and it works: `scanForTempDirTrapViolations('swarmforge/scripts')`
  returns this file and this reason - "creates a temp root
  (fs/create-temp-dir) but has no shutdown hook and no try/finally delete-tree" -
  and it is the ONLY violation in the whole tree. Verified 2026-08-22 by running
  `npx vitest run --config vitest.config.mjs test/tempDirTrapGuard.test.js` from
  extension/: **1 failed | 3 passed**, the failure being the standing assertion
  "the real swarmforge/scripts tree has zero temp-dir-trap violations". So the
  unit lane is red on `main` for every role until this one file is fixed, which
  is why this is severity high despite being a one-line fix.

  HOW (direction, not mandate). Follow the convention 69 of the 88 temp-creating
  runners under `swarmforge/scripts/test/` already use - a registered shutdown
  hook draining a list of created dirs. `bl719_dropped_parcel_invariants_property_runner.bb`
  lines 111-118 is the concrete pattern:

    (def created-temp-dirs (atom []))
    (.addShutdownHook (Runtime/getRuntime)
      (Thread. (fn [] (doseq [d @created-temp-dirs]
                        (try (fs/delete-tree d) (catch Exception _ nil))))))

  A `try`/`finally` around the sweep is equally acceptable - the guard accepts
  either - so pick whichever reads better against this file's top-level shape.
  Note the file also has two inner `delete-tree` calls (lines 96, 116) with the
  same exposure; bringing them under the same mechanism is in scope.

  NO NEW ACCEPTANCE CONTRACT IS NEEDED. `specs/features/BL-872-tempdir-trap-guard-standing.feature`
  already carries the scenario "the real swarmforge/scripts tree has no
  unguarded temp-root creator", with step handlers already registered
  (`bl872TempdirTrapGuardStandingSteps.js`). That IS this ticket's contract;
  writing a parallel feature file would duplicate a live contract for a one-line
  fix. This ticket therefore adds no scenarios and needs no new step handlers.

  NO `required_wiring` DELIBERATELY. The guard accepts EITHER a shutdown hook or
  a try/finally, so any pattern I pinned would falsely block the other valid
  remediation - precisely the BL-874 failure of arming a gate against a string
  nobody may write. The existing acceptance scenario gates the outcome directly
  and needs no anchor.

qa_e2e_procedure: >
  1. At the parent commit, run `npx vitest run --config vitest.config.mjs
  test/tempDirTrapGuard.test.js` from extension/ and confirm the absence of the
  behaviour: the standing "real swarmforge/scripts tree has zero temp-dir-trap
  violations" test fails, naming bl1025_expedite_approval_property_runner.bb.
  2. At the parcel commit, repeat and confirm it passes and that the scan
  returns zero violations tree-wide - not merely that bl1025 was excluded from
  the scan. 3. Confirm the runner still does its job: run
  `bb swarmforge/scripts/test/bl1025_expedite_approval_property_runner.bb` and
  confirm it reports its exhaustive 32-case sweep and exits zero. 4. Confirm
  cleanup on the FAILING path, which is the actual defect: force a git failure
  inside the sweep (for example by making the fixture repo unwritable partway,
  or by temporarily raising an exception in `g`), confirm the runner exits
  nonzero, and confirm no `/tmp/bl1025-prop-*` directory survives. 5. Confirm
  the same for a killed run: start the runner, SIGTERM it mid-sweep, and confirm
  no `bl1025-prop-*` root survives. (SIGKILL is not gateable - nothing traps it -
  so do not require it.) 6. Confirm the guard is still non-vacuous: plant a
  throwaway .bb file that creates a temp root with no cleanup, confirm the
  standing test goes red naming it, then remove it.

notes: >
  PROVENANCE. Hardender `note` 00_20260822T135029Z_000518: "bl1025_expedite_approval_property_runner.bb
  leaks its temp dir, ticket it". The report is accurate and specific; this
  ticket is a straight 1:1 mint of it.

  SCOPE CHECKED, NOT WIDENED. An initial count suggested 66 of 88 runners lacked
  a `finally` and this might be systemic. It is not: 69 of the 88 use the
  shutdown-hook convention instead, which the guard accepts, and running the
  real scan returns exactly ONE violation - this file. The systemic reading was
  wrong and is recorded here so nobody re-derives it. There is no fleet-wide
  remediation to do.

  PROCESS QUESTION FOR THE LEAN PASS, NOT FOR THIS TICKET. A file violating a
  standing guard reached `main` while that guard's own test fails on it. This
  ticket fixes the file; how a red gate was passed is a closing-ceremony
  question (the BL-816 "a red suite waved through is not a quiet default"
  family), and deliberately not scoped here.

  RELATED, NOT DUPLICATED. BL-1061..BL-1064 (same day, same epic) came from a
  separate QA report about the PROPERTY lane. This one is the unit lane and a
  different mechanism; the only thing they share is the epic.

source: >
