id: BL-931
title: "The resident-invoked rotate never asks whether the pack rotates at all, so on a standing full-forge pack it respawns the first roles.tsv pane - evicting the standing specifier and booting it as a second coder"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: pending
priority: 15
direction: operator-intake
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-931-rotation-is-refused-on-a-pack-that-has-no-rotation-router.feature

invariants:
  - "Whether a pack is a rotation router is resolved ONE way, shared by every gate that asks (swarm-identity `rotation` key, else the persisted active pack conf, else the default conf). No pack may ever read as router for one gate and non-router for another."
  - "rotate-resident-to! never throws and never exits the process. Every outcome, refusal included, is a result map the caller reads - handoffd's chase calls it directly and must not be able to die on it."
  - "The change may only turn proceed into refuse, and only when the pack is not a rotation router. No rotation that succeeds today on a router pack may stop succeeding."

approval_context: >
  Three things want your sign-off.

  Severity high. Nothing is down and no data is lost, so this is not critical.
  I filed high rather than medium because it evicts a working pane: the
  standing specifier was killed mid-shift twice in one evening, its mailbox
  then sat unread (a QA note from 22:30 was still unclaimed at 23:24, 54
  minutes), and the eviction produced two live Coders sharing .worktrees/coder
  under one --remote-control name. That last part is the same concurrent
  same-worktree writer shape that was already recorded as an operator incident
  earlier the same day, where two processes each committed over the other's
  uncommitted work and converged only by luck. Say so if you read it as medium;
  only the expedite lane changes.

  The gate is deliberately NOT overridable. SWARMFORGE_ROTATE_FORCE=1 exists to
  override the unfinished-parcel gate (BL-805) and I did not want to overload
  it into also meaning "steal a colleague's pane". On a standing pack the
  target role already has its own pane, so there is no case where rotating is
  the right answer - a refusal with no escape hatch is the honest shape. If you
  want an escape hatch anyway it should be its own distinctly named variable,
  and scenario rotate-pack-gate-03 changes.

  I landed the prose half myself instead of minting a second ticket. The intake
  suggested a split, and its half 2 (boot-inlined PIPELINE.md rotate-home text)
  is prose in a file the specifier owns, with no gateable acceptance of its own
  - per BL-798 that is mine to land, not a coder parcel. It is committed and
  named in notes: below; the wording is yours to amend. The remaining half, the
  code gate, is what this ticket is.

source: |
  Operator intake, captured live by the human via Cursor on 2026-08-18 ~22:52
  CEST after a check found the specifier pane running as Coder. Drained 1:1
  into this ticket from backlog/INTAKE-full-forge-rotate-steals-specifier-pane.md
  (archived to backlog/archive/ in the same pass).

  The human's ask, verbatim:

  > Let specifier know about this bug

  Locked decisions carried verbatim from that intake:

  > Capture for specifier to mint. Do **not** ad-hoc kill either live
  > Coder (the stolen specifier pane is mid-BL-930; the standing coder
  > pane is on BL-925).

  > Do **not** Qjump unless the human says so.

  > Specifier pane is currently the stolen Coder — a specifier mailbox
  > wake will land on that occupant until someone rotates the pane
  > back with `rotate_to_role.sh specifier` (or respawns `specifier.sh`
  > into `swarmforge-specifier`). The durable copy is this root file.

  And on scope, verbatim:

  > Do not fold this into BL-926/BL-927. Those assume rotation is
  > supposed to happen.

  Observed twice the same evening. Earlier (~20:26 CEST) the specifier pane
  was already running coder.sh (PID 38149) while swarmforge-coder held a
  second --remote-control SwarmForge-Coder (PID 12937). Again at ~22:27,
  right after BL-930 was specced and approved: pane pid 97604 running
  .swarmforge/launch/coder.sh, child 97895, cwd .worktrees/coder, marker
  .swarmforge/mono-router-active-role flipped to `coder`. The occupant of the
  stolen pane raised its own identity-mismatch ask: session
  swarmforge-specifier, env SWARMFORGE_ROLE=coder.

description: |
  ## What happens

  Rotation is a `config rotation router` mechanism. Under it ONE resident pane
  serves every pipeline role in turn, so respawning that pane as a different
  role is exactly right. On a standing pack (full-forge: seven pipeline roles,
  each with its own tmux session) there is no resident and nothing to rotate.

  Every other gate in the family asks the pack first:

  - ready_for_next_task.bb gates ROTATE_HOME on conf-rotation-router?
  - handoffd.bb gates its chase rotation and its context-clear sweep on it
  - swarm_ensure.bb and babysitter_check.bb both resolve it before judging
    topology

  The resident-invoked path does not ask. rotate_to_role.bb calls
  handoff-lib/respawn-as!, which gates only on the departing role's own
  in_process box (BL-805, narrowed by BL-926), then calls
  handoff-lib/rotate-resident-to! unconditionally. Neither function reads the
  pack.

  It then addresses the pane through handoff-lib/mono-router-resident-session,
  whose definition is literally "first non-coordinator roles.tsv session".
  On this repo's live roles.tsv that first row is:

      specifier	master	<root>	swarmforge-specifier	Specifier	claude	task	off

  So `rotate_to_role.sh coder` on full-forge does
  `tmux respawn-pane -k -t swarmforge-specifier` with coder.sh, and then
  write-mono-router-active-role! stamps the marker `coder`. The standing
  specifier is killed, its pane comes back as a second Coder in
  .worktrees/coder alongside the real one, and specifier mail has no reader.

  ## What was verified, and what was NOT

  Verified by reading and running this checkout at capture time:

  - `.swarmforge/swarm-identity` records `launch_pack full-forge` with an
    empty `rotation` field; full-forge.conf carries no rotation line.
  - `mono-router-lib/conf-rotation-router?` on full-forge.conf returns false,
    and `rotate-home?` for a specifier with home coder returns false. The
    ROTATE_HOME gate is therefore WORKING - this was not a gate failure, and
    the intake's first hypothesis is disproved. Do not "fix" ready_for_next.
  - `rotate-resident-to!` / `respawn-as!` contain no pack check of any kind
    (`conf-rotation-router?` appears zero times in handoff_lib.bb).
  - The daemon's chase path is incidentally safe here, not gated: chase reaches
    :rotate only when the target role has no session of its own
    (dormant-mailbox-chase-action returns :wake-own-session first), and on a
    standing pack every role has one. handoffd logged chase-wake-skip-busy
    coder, never chase-rotate, which matches. That safety is a side effect of
    session topology, so the fix belongs in the shared helper, not in the
    caller that happens to be safe today.

  NOT proven: which of the two triggers fired. The intake offers a gate failure
  or boot-inlined prose; the gate is now disproved, leaving the prose - the
  PIPELINE.md BL-550 paragraph telling a non-home role to rotate home is
  inlined into every role's boot prefix including the standing specifier, and
  specifier.prompt itself never mentions rotate_to_role. That is consistent but
  is not a log line, and this ticket does not depend on settling it: the code
  gate has to hold whoever invokes the rotation.

  ## Why it matters

  The pane it kills is a working colleague, not an idle resident. Twice in one
  evening it took out the standing specifier mid-shift, left a QA note unread
  for 54 minutes with nobody in the hat, and produced two Coder processes
  sharing one worktree under one remote-control name.

  ## Scope

  swarmforge/scripts/handoff_lib.bb (rotate-resident-to!, respawn-as!) and
  whichever pure/shared helper the router resolution ends up in.

  ## How (direction, not mandate)

  The gate reads most naturally inside rotate-resident-to! - the BL-911 comment
  already names it as the one chokepoint both drivers share, so a check placed
  there covers the resident path and the daemon path together. Its contract is
  "never System/exit - safe for handoffd chase", so a refusal is
  `{:ok false :reason ...}` and respawn-as!'s own reason-to-exit-code table
  grows a case with a message that says what is wrong (this pack does not
  rotate; every role has its own pane) rather than the misleading existing
  "is this swarm a mono-router launch?" text.

  Invariant 1 is the part to be careful with. The identity-else-conf resolution
  is currently hand-copied in four places (handoffd.bb rotation-router-mode?,
  swarm_ensure.bb, babysitter_check.bb, swarm_status.bb). Reuse one of them or
  lift the shared shape; do not add a fifth copy, and do not reach for
  conf-rotation-router? alone - it reads conf text only and would miss a swarm
  whose identity records the rotation mode.

out_of_scope: |
  - Do NOT fold this into BL-926 or BL-927 (operator directive, quoted in
    source: above). Those two narrow the unfinished-parcel gate and fix the
    departing-role lookup; both assume rotation is supposed to happen at all,
    which is precisely the assumption this ticket removes.
  - Do NOT delete or weaken the BL-550 ROTATE_HOME path. It is correct on a
    router pack and was verified working here.
  - Do NOT change mono-router-resident-session's "first non-coordinator row"
    definition. Making it address a specific resident is BL-645's stereo-router
    territory; on a router pack the singleton definition is right.
  - No change to the live swarm's running panes as part of this ticket, and no
    killing of either live Coder (operator directive, quoted in source:).
  - The PIPELINE.md prose half is already landed by the specifier - see notes:.
    Do not re-do it in this parcel.

notes: |
  Prose half, landed out of band by the specifier per BL-798 (prompt and
  constitution prose is the specifier's to land, and neither required_stages
  nor required_wiring can schedule it): swarmforge/PIPELINE.md's "Mono-router
  idle and open slots" section now carries an explicit scope line saying a
  standing pack never rotates, and the BL-550 sentence names the router pack
  condition in-sentence rather than relying on the heading. The reference
  elaboration swarmforge/constitution/articles/reference/pipeline-detailed.md
  is mirrored. Boot prefix budget gate run on the change (it was at
  43313/44000 before, so headroom was only ~687 chars - anything added here has
  to be near-neutral). Commit named in the specifier's coordinator note for
  this ticket. Nothing the coder builds changes because of it.

  Note on the live pack: a standing pane only re-reads a composed role prompt
  on respawn or recompose, so the prose fix does not reach the currently
  running full-forge panes. The code gate is what protects this pack now; the
  prose is preventative for future boots. That asymmetry is the reason the code
  half is the one that got a ticket.

  No required_wiring: declared, deliberately. The gate goes inside an existing
  hot path with existing callers, so its value does not depend on a new call
  site appearing; the tempting wrong implementation (gating rotate_to_role.bb
  only and leaving handoffd's direct rotate-resident-to! call bare) is caught
  behaviourally by scenario rotate-pack-gate-04 instead. A pattern here would
  have had to be a placeholder for a helper name that does not yet exist, which
  is exactly the BL-874 failure.

  IR-DRY: one medium-confidence possible-synonym finding, reviewed and kept.
  It pairs the outline step "the pack declares <rotation mode>" with its own
  concrete value "the pack declares no rotation line" used by the three
  non-outline scenarios. After substitution these are the same step text and
  one handler serves all four scenarios, so it is deliberate parameterisation,
  not accidental drift.

qa_e2e_procedure: |
  1. Non-router refusal, the core case. On a fixture root whose pack conf has
     no rotation line and whose roles.tsv lists a pipeline role first, run
     rotate_to_role.sh for some other role. Confirm it refuses, exits nonzero,
     and that the message names the pack (not a parcel, and not the old
     "is this swarm a mono-router launch?" text). Confirm no tmux respawn was
     issued and .swarmforge/mono-router-active-role is byte-identical to before
     the run - assert on the marker too, not only on the exit code, because
     write-mono-router-active-role! is what made the live incident's marker
     read `coder` on a full-forge pack.
  2. Router pack still rotates (invariant 3). Same fixture with
     `config rotation router` added to the conf. Run the same rotation and
     confirm it proceeds exactly as before the change. Repeat with the mode
     recorded in swarm-identity's `rotation` key instead of in the conf, and
     confirm it also proceeds - that is invariant 1's second resolution branch,
     and a conf-only check would silently break it.
  3. Daemon caller (invariant 2). Call handoff-lib/rotate-resident-to! directly
     on the non-router fixture, the way handoffd's chase does. Confirm it
     returns a result map naming the pack and that the calling process is still
     alive - no exception escaping, no System/exit.
  4. Override does not unlock it. Non-router fixture with
     SWARMFORGE_ROTATE_FORCE=1 set and a real undrained parcel in the departing
     role's in_process box. Confirm it still refuses for the pack reason, and
     that the parcel is untouched afterwards.
  5. Live-shape regression on this repo. With the real full-forge roles.tsv
     (specifier first), confirm nothing in the change alters who
     mono-router-resident-session names - the fix refuses the rotation, it does
     not re-address it. Then run the Babashka unit suite under
     swarmforge/scripts/test/ green. Babashka has no mutation/CRAP/DRY tooling
     wired, so that suite plus the acceptance run is the whole gate here and
     any hardening pass must record that degraded fallback rather than imply
     mutation ran.
