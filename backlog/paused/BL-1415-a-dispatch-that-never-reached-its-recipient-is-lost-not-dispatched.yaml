approval_context: >
  RE-PENDED deliberately after your Approve tap (88d25c1108, 06:32:01 local):
  the ticket you approved said the coder never received the two Work notes.
  That was wrong. The specifier had searched only the master checkout's
  mailboxes; worktree roles keep theirs under .worktrees/<role>/.swarmforge/,
  where both notes sit completed (05:14:42Z and 05:15:09Z). The defect is
  the sweep's stall clock, not a lost dispatch, and the feature file changed
  accordingly, so it needs your tap again. No choice is posed and there are
  no ruling_options.

description: |
  ## What is wrong

  The coordinator's evidence
  (`backlog/evidence/coordinator-dispatch-trail-false-positive-20260905.md`,
  572173b1bd, with the specifier's two adjudications appended) reports two
  dropped-parcel self-notes on 2026-09-05, "BL-1402 no parcel in flight -
  possible drop" and the same for BL-1384, followed by
  `route_backlog_to_coder.sh` refusing both as "already has a dispatch
  trail", and a `--force` for each.

  What actually happened, from the coder's worktree mailbox
  (`.worktrees/coder/.swarmforge/handoffs/inbox/completed/`):

      10_20260905T032729Z_004166 ... Work BL-1384 ...  dequeued 05:14:03Z  completed 05:14:42Z
      10_20260905T035759Z_004203 ... Work BL-1402 ...  dequeued 05:15:02Z  completed 05:15:09Z

  Both Work notes were delivered at 03:27Z and 03:57Z and waited unread
  while the coder (task mode, one ticket at a time) finished BL-1275,
  BL-1370 and BL-1353. While they waited, `live-mail?` was true and
  `decide-dropped-parcel?` correctly did not fire. The moment the coder
  completed them, live mail cleared, and `newest-trail-event-ms` - which
  reads only each handoff's `enqueued_at`/`created_at` header
  (`handoff-event-ms`) - answered 03:57Z: 1h18m old, past the 45-minute
  stall threshold. Both tickets were reported as drops within a minute of
  the coder starting on them. The router's DISPATCHED refusal was the
  correct answer under BL-1097; the `--force` that followed sent a second
  Work note for each (004300/004301), which the coder also completed in
  seconds because it was already on BL-1402.

  Two things were true at once: BL-1402 was a FALSE drop (the coder was
  working it from 05:15Z, its commit is being retried at 06:46 local), and
  BL-1384 was a REAL one - the coder dequeued a second Work note twenty
  seconds after completing the first, and a task-mode coder can hold one
  ticket. The sweep could not tell them apart because its clock never
  looked at what the recipient did.

  ## What is wanted

  - The stall clock starts at the freshest of: the dispatch's creation, the
    recipient copy's `dequeued_at`, its `completed_at`, and any later
    handoff naming the ticket. A recipient that acted on a dispatch less
    than the threshold ago is never a drop.
  - A dispatch completed past the threshold with no parcel for the ticket
    in any mailbox state after it, and no commit naming the ticket on any
    role branch since, is DROPPED: the sweep nudges as today, and
    `route_backlog_to_coder.sh` routes without `--force`, warning which
    completed dispatch it is repairing.
  - Live mail, or a `git_handoff` for the ticket anywhere, stays
    DISPATCHED and the router keeps refusing.
  - `dispatch_trail_cli.bb` prints the third verdict, DROPPED, with the
    sweep's reason, so the coordinator never has to guess at `--force`.

  ## How (direction, not mandate)

  - `handoff-event-ms` (or a sibling used only by the trail clock) takes
    the max of `created_at`/`enqueued_at`/`dequeued_at`/`completed_at`;
    BL-978's single-pass trail index derives the same value in one place
    (its invariant 2 - do not add a second derivation).
  - `decide-dropped-parcel?` keeps its shape; the caller passes the new
    newest-trail-ms. A verdict fn `ticket-dispatch-verdict` returns
    `:dispatched` / `:dropped` / `:undispatched` with a reason string; the
    CLI prints it; `route_backlog_to_coder.sh` three-way branches.
  - "No work anywhere": no handoff naming the ticket in any mailbox state
    newer than the completed dispatch. A git-branch check is optional and
    must stay read-only (`git log --all --grep`); if added, it is the same
    call the coordinator ran by hand on 2026-09-05.
  - Tests: `dropped_parcel_test_runner.bb`,
    `bl1097_router_dispatch_trail_test_runner.bb`,
    `test_bl1097_router_refuses_dispatched_ticket.sh` gain the
    completed-recently / completed-long-ago / worked fixtures. Fixture
    trees under mkdtemp, removed in a finally, never a prefix sweep.
  - BL-1097's and BL-1301's features stay green; nothing retired.

  ## Out of scope

  - The coder dequeuing a second Work note while holding a ticket (BL-1384's
    actual loss): the double-dequeue is `done_with_current.sh`'s behaviour
    (operator memory 09-05) and a candidate successor - not this slice.
  - The BL-536 auth-observer false positive seen the same hour: BL-1416.

qa_e2e_procedure: |
  1. The three runners above pass with the new fixtures; the BL-1415 feature
     passes all six scenario runs; BL-1097, BL-1223 and BL-1301 features
     still pass.
  2. Live, read-only: `bb swarmforge/scripts/dispatch_trail_cli.bb . dispatched BL-1402`
     on the real checkout prints DISPATCHED while BL-1402's parcel is in
     flight; the same for a done ticket prints DISPATCHED; an active ticket
     whose only trail is a Work note completed over 45 minutes ago with
     nothing after it prints DROPPED naming that note.
  3. Scratch tree: a Work note copy with `completed_at` 30 s ago and none
     after it: not dropped; set `completed_at` to 50 min ago: the sweep's
     one-shot (`handoffd.bb` dropped-parcel sweep against the scratch root)
     nudges and `route_backlog_to_coder.sh BL-9001 <scratch>` routes with
     the warning; add a git_handoff for BL-9001 to a worktree mailbox:
     refuses.
  4. `grep -n DROPPED swarmforge/scripts/route_backlog_to_coder.sh
     swarmforge/scripts/dispatch_trail_cli.bb` and `grep -n completed_at
     swarmforge/scripts/chase_sweep_lib.bb` return the call sites
     (required_wiring).
  5. Scratch trees are gone after the runners exit.

