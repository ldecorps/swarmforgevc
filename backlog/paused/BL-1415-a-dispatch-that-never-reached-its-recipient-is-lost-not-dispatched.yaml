description: |
  ## What is wrong

  The coordinator's evidence
  (`backlog/evidence/coordinator-dispatch-trail-false-positive-20260905.md`,
  572173b1bd) reports two dropped-parcel self-notes on 2026-09-05 (BL-1402,
  BL-1384: "no parcel in flight - possible drop"), both tickets approved
  and active with `assigned_to: coder`, no work commit on any role branch,
  and `route_backlog_to_coder.sh` refusing both with "already has a
  dispatch trail" (`dispatch_trail_cli.bb . dispatched <id>` = DISPATCHED).
  The coordinator forced both routes by hand.

  The evidence attributes the DISPATCHED verdict to a specifier->coordinator
  bookkeeping note ("Root drained: BL-1402 ..."). The specifier verified
  that this is not the cause: `dispatch-trail-ticket-id` (chase_sweep_lib.bb,
  BL-1223) counts a `message:` only when it matches the verb-first
  `\b(Spec|Work)\s+BL-…` form; "Root drained: BL-1402" does not match.
  What matched are the coordinator's own Work notes, present ONLY in its
  sent/ directory:

      .swarmforge/handoffs/coordinator/sent/10_20260905T032729Z_004166_from_coordinator_to_coder.handoff
          message: Work BL-1384-the-local-seat-topic-reaches-the-bridge-through-the-front-desk: ...
      .swarmforge/handoffs/coordinator/sent/10_20260905T035759Z_004203_from_coordinator_to_coder.handoff
          message: Work BL-1402-the-front-desk-keeps-a-routed-photo-so-the-operator-can-see-it: ...

  Neither handoff id exists anywhere in the coder's mailbox (new,
  in_process, completed, done, abandoned), in any failed/ dir, or in
  handoffd.log. The coordinator did dispatch both; the coder never held
  either. `dispatch-trail-states` (`[:new :in_process :completed :sent
  :outbox]`) counts the sender's own sent/ copy as proof of dispatch, so a
  parcel that was lost between the sender and the recipient is, forever,
  "already routed", and BL-1097's refusal (built so a WORKED ticket is not
  routed twice) blocks the one mechanism that would repair the loss.

  ## What is wanted

  A sender-side copy (sent/, outbox/) proves dispatch only when a matching
  recipient-side copy exists in that recipient's mailbox in any state.
  Without one the dispatch is LOST:
  - `dispatch_trail_cli.bb <root> dispatched <id>` prints `LOST <sent-copy>`;
  - `route_backlog_to_coder.sh` routes and warns, naming the lost parcel;
  - `undispatched-active` and the dispatch-gap sweep list the ticket with
    the same reason, because it is the same predicate.
  A recipient-side copy in any state, or a git_handoff in any worktree
  role's mailbox, stays DISPATCHED and the router keeps refusing.

  ## How (direction, not mandate)

  - In chase_sweep_lib.bb, `collect-dispatched-ticket-ids` already walks
    every state dir; make the sent/outbox contribution conditional: parse
    the handoff id and recipient from the filename
    (`<prio>_<stamp>_<seq>_from_<A>_to_<B>.handoff`), look for
    `*_<stamp>_<seq>_from_<A>_to_<B>_for_<B>.handoff` under B's mailbox
    states. Return the trail as a map id -> {:verdict :dispatched|:lost
    :evidence path} so the CLI and the sweep print the same reason.
  - `ticket-dispatched?` keeps its boolean shape for existing callers;
    add `ticket-dispatch-verdict`.
  - route_backlog_to_coder.sh: three-way branch on DISPATCHED / LOST /
    UNDISPATCHED; LOST prints `route_backlog_to_coder: earlier dispatch
    <file> never reached <role> - re-routing` to stderr and proceeds.
  - Tests: extend `bl1097_router_dispatch_trail_test_runner.bb`,
    `test_bl1097_router_refuses_dispatched_ticket.sh` and
    `dropped_parcel_test_runner.bb` with the sender-only fixture. Fixture
    trees under mkdtemp, removed in a finally, never a prefix sweep
    (BL-1385).
  - Retire nothing in BL-1097's feature: its scenarios assert refusal for a
    WORKED ticket and router/sweep agreement, both preserved.

  ## Out of scope

  - Why the two Work notes vanished between the coordinator's sent/ and
    the coder's inbox (03:27Z and 03:57Z, during chaser respawns of the
    coder at 03:20Z/03:26Z on BL-1275). No log names it; the specifier
    recorded it as an open diagnostic in the coordinator's evidence file
    rather than a ticket with nothing to test.
  - Mention-only notes as trail evidence: already BL-1223.

qa_e2e_procedure: |
  1. `bb swarmforge/scripts/test/bl1097_router_dispatch_trail_test_runner.bb`,
     `bash swarmforge/scripts/test/test_bl1097_router_refuses_dispatched_ticket.sh`
     and `bb swarmforge/scripts/test/dropped_parcel_test_runner.bb` pass with
     the new sender-only cases; the BL-1415 feature passes all six runs;
     BL-1097's and BL-1223's features still pass.
  2. Live replay, read-only: `bb swarmforge/scripts/dispatch_trail_cli.bb .
     dispatched BL-1384` on the real `.swarmforge/` prints DISPATCHED (the
     forced 05:16Z route 004301 now has a coder-side copy). Copy the two
     04:xx sent files into a scratch mailbox tree with no coder-side copies
     and run the CLI there: LOST naming the sent copy.
  3. In the scratch tree, `route_backlog_to_coder.sh BL-9001 <scratch>` with
     `SWARMFORGE_SKIP_DAEMON=1` routes and prints the lost-parcel warning;
     add a coder-side completed copy and run again: refuses.
  4. `grep -n LOST swarmforge/scripts/route_backlog_to_coder.sh
     swarmforge/scripts/dispatch_trail_cli.bb` returns both call sites
     (required_wiring).
  5. The scratch trees are gone after the runners exit.

