id: BL-1623
title: "bl1309LandDecideEntanglementInvariants.property.test.js is red in a full property lane with no owner (QA's BL-1609 pass, 2026-09-17 11:52Z: an approved fixture sibling read back as 'no backlog ticket file found', green alone 17-29 s): its module-load sweep removes EVERY bl1309-property-* root under the shared temp dir, a live peer lane's included - the BL-1385/BL-1390 shape; seven property files carry the same blind sweep, each records its owner pid in the root name and sweeps only roots whose owner is gone through one helper, and a unit-lane guard pins the census"
