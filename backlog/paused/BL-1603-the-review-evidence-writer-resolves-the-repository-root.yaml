id: BL-1603
title: "record-review-evidence.js takes its root from process.cwd(), so a role that runs it from extension/ (where npm must run) writes and commits a correct evidence file under extension/backlog/evidence/ that no repo-root grep or bounce-history read ever sees - six such files are on main (cleaner x4, hardender x1, QA x1), five with no repo-root copy; the writer resolves the repository root itself, refuses to write anywhere but <root>/backlog/evidence/, the orphans move to where they belong, and a test with the working directory stubbed to a subdirectory proves it"
milestone: M8
type: defect
severity: medium
# medium: real but contained - the files exist and are committed, only
