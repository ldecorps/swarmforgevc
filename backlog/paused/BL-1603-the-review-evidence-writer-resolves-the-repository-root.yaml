id: BL-1603
title: "record-review-evidence.js takes its root from process.cwd(), so a role that runs it from extension/ (where npm must run) writes and commits a correct evidence file under extension/backlog/evidence/ that no repo-root grep or bounce-history read ever sees - six such files are on main (cleaner x4, hardender x1, QA x1), five with no repo-root copy; the writer resolves the repository root itself, refuses to write anywhere but <root>/backlog/evidence/, the pre-commit guard chain refuses any staged path whose backlog area directory is not at the repository root and names the root path (absorbed from BL-1552, 2026-09-21), the orphans move to where they belong, and a test with the working directory stubbed to a subdirectory proves it"
milestone: M8
type: defect
severity: medium
# medium: real but contained - the files exist and are committed, only
# their location is wrong; the harm is a bounce-history or Article 4.4
# read from main missing a pass record. Not high: no gate is red.
status: todo
epic: code-quality-gates
priority: 12
direction: swarm-reported
depends_on: []
