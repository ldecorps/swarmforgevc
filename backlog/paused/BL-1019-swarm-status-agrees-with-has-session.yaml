id: BL-1019
title: "./swarm status reports every agent DOWN while the panes are alive, so after an attach miss a human cannot tell a real absence from the usual lie"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarm-reliability
priority: 40
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1019-swarm-status-agrees-with-has-session.feature

invariants:
  - "The two liveness surfaces never contradict each other: status never reports DOWN for a role whose session tmux has-session reports present and under which a live claude process is found."
  - "An unavailable check is reported as unknown, never as DOWN - absence of evidence is never rendered as evidence of absence, the same posture the sweep already takes with its UNAVAILABLE severity."

description: >
  WHAT. `./swarm status` reports every agent DOWN while the panes are alive. The
  pane's own command is the shell (pane_current_command=zsh) and claude runs as
  its CHILD, so a check reading only the pane's own command concludes the agent
  is down. Make status agree with the honest check.

  WHY IT IS NOT COSMETIC. This is a diagnostic that lies in the one situation it
  exists for. During the 2026-08-21 incident the specifier session really WAS
  gone; a human who looked at status afterwards saw the same all-DOWN display
  they always see, and so could not distinguish "the session is genuinely
  missing" from "status is wrong as usual". A signal that reads identically in
  the healthy and the broken case carries no information, and it cost real time
  in an incident that was already confusing.

  PRIOR ART, AND WHY THE FIX IS KNOWN-GOOD. babysitterd_sweep_lib.bb already
  distinguishes the three states correctly: pane absent (CRIT), pane present but
  no claude process (CRIT, half-launch/exit), and process gather failed
  (UNAVAILABLE, per BL-802 - explicitly NOT reported as the absence CRIT).
  Invariant 2 is that BL-802 posture applied to status. The discrimination logic
  is already written and proven in the sweep; this slice is about status telling
  the same truth, not about inventing a new liveness test.

  How (direction, not mandate). Status should key off session presence plus a
  claude process under the pane - the same two facts the sweep gathers - rather
  than the pane's own command string. Whether it reuses the sweep's gatherer or
  keeps its own is the implementer's call; invariant 1 is the constraint that the
  two must not disagree.

  SCOPE. Status's verdict only. Not attach - attach's has-session is already the
  honest check and the intake explicitly makes teaching a different attach
  command a non-goal.

qa_e2e_procedure: >
  1. Run the feature's four scenarios: a shell pane (zsh and bash) with claude
     underneath reports UP; a pane with no claude underneath reports DOWN; a
     missing session reports DOWN; and a failed process gather reports unknown
     rather than DOWN.
  2. Assert the agreement invariant directly rather than reading it off the
     scenarios: for a role whose session is present with a live claude process,
     status and has-session must both say present. A test that only checks
     status in isolation would not catch a future divergence.
  3. Guard against a vacuous pass. The pre-fix code reports DOWN for
     EVERYTHING, so any test asserting DOWN passes on the broken build too -
     confirm scenario 01 is genuinely RED before the fix and green after, and
     say so in the evidence. This is the whole reason the UP case leads.
  4. Live confirmation, recorded as a manual procedure: on a healthy pack run
     `./swarm status` and confirm the live roles read UP and that the list
     agrees with `tmux -S <socket> ls`.

source: |
  Intake .swarmforge/operator/INTAKE-attach-swarm-specifier-session-missing.md,
  goal 3's optional half, quoted verbatim from the intake: "Optional: status must
  not report DOWN when `has-session` is true (separate lie, fold or split)."
  Archived on drain per BL-311. The intake offered fold-or-split and the
  specifier SPLIT it: the fault is in a different surface from the session
  recreation, is independently valuable, and would have inflated BL-1017 past one
  sitting. Goal 3's other half - "attach keeps telling the truth" - needs no work:
  attach was already correct during the incident. Siblings: BL-1017 (goal 1, and
  the primary carrying the human's verbatim ask), BL-1018 (goal 2), BL-1020
  (goal 4).

notes: |
  2026-08-21 specifier. Severity medium, chosen deliberately and not by default:
  nothing is broken in the swarm's operation and no work is lost, so this is not
  high by the rubric ("a live fault degrading behaviour"). It is squarely above
  cosmetic, though - it degrades a HEALTH SIGNAL a human relies on during an
  incident, which is why it is not low.

  IR-DRY findings on the feature file are all polarity contrasts - UP vs DOWN vs
  unknown, claude-present vs claude-absent. Those contrasts ARE the behaviour
  under test; collapsing them would delete the point of the scenarios.
