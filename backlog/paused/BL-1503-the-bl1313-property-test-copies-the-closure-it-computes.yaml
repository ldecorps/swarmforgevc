description: |
  ## What is wrong

  `extension/test/bl1313BatchGuardVisibilityInvariants.property.test.js`
  lines 59-71 hard-code `LIB_CLOSURE`, eleven `.bb` names, and
  `beforeAll` copies exactly those into a shared temp dir; every bb
  invocation then `load-file`s the copied `handoff_lib.bb`, whose own
  `load-file` lines resolve relative to the copy. Its own comment says
  "Nothing is re-derived by hand" about the CONTENT - but the SET is.

  Hotfix `32fb1ff7e1` (2026-09-09 14:23 BST, hotfix-ledger row `pending`,
  `stamp_ticket: null`) added `(load-file "respawn_bootstrap_lib.bb")` to
  `handoff_lib.bb` line 65. The copied `handoff_lib.bb` now asks for a
  sibling that was never copied:

  ```
  java.io.FileNotFoundException: /tmp/sfvc-bl1313-libs-XXXX/respawn_bootstrap_lib.bb
  ```

  Both invariants die at load, before a single generated case runs; the
  generator-reach test still passes, so the file reads as 1/3 green.
  Reproduced by the specifier on main 60623ebf02:
  `cd extension && npx vitest run --config vitest.properties.config.mjs
  test/bl1313BatchGuardVisibilityInvariants.property.test.js` -> 2 failed
  | 1 passed. QA's isolated re-run read identically (dcbfd47ffc).

  This is the drift BL-973 documented three times for shell fixtures
  (BL-911 prompt_engine_lib, BL-967 daemon_cycle_guard_lib, BL-1029
  shell_quote_lib) and answered with a computed closure
  (`bb_closure_copy.sh` for shell; `operatorRuntimeBbClosure.js`'s
  `computeClosure(scriptsDir, entryFile)` for JS). Two sibling property
  files already seed from it
  (`bl1100PromotionProseNeverBlocks.property.test.js`,
  `bl1188PipelineGridLiveStageParityInvariants.property.test.js`); this
  one predates that and was never migrated.

  ## What is wanted

  The test copies the union of `computeClosure(SCRIPTS_DIR,
  'handoff_lib.bb')` and `computeClosure(SCRIPTS_DIR,
  'duplicate_chain_guard_lib.bb')` - the two entry points it drives -
  instead of a typed list, so the next load-file edge is copied the day
  it lands. The property lane is green on `main`; the register row this
  ticket adds is removed in the same land.

  ## How (direction, not mandate)

  - `const { computeClosure } = require('../../specs/pipeline/steps/lib/operatorRuntimeBbClosure');`
    then seed from the set union in `beforeAll`. Keep `mkSharedTmpDir`,
    the per-file isolation, and every bb script unchanged - the seed is
    the only thing that moves.
  - Scenario 02's third `Then`: the handler reads the property file and
    collects quoted string literals ending in `_lib.bb`; after the fix
    only the two entry points remain. The header comment names both libs
    in prose without quotes and must keep doing so without tripping it.
  - Retire the "verified: handoff_lib.bb loads the first eight ..."
    comment with the list; a computed set needs no hand census.

  ## Census (BL-1445), for the coder and the architect to re-run

  On main 60623ebf02, from the repo root:
  - `grep -l "_lib.bb'" extension/test/*.property.test.js | wc -l` -> 69
    property files name at least one bb lib as a quoted literal (most load
    one lib directly, which is not a copy set).
  - `... | xargs grep -l "cpSync\|copyFileSync"` -> 5 of those copy a lib
    into a fixture.
  - `... | xargs grep -L "computeClosure\|operatorRuntimeBbClosure\|bb_closure_copy"`
    -> 4 copy without the closure helper: bl1143ColdSwapDayShift (1 lib),
    onboarderLauncherPidGuard (1 lib), bl1309LandDecideEntanglementInvariants
    (2 libs), and this file (11 + the 2 entry points = 13 literals).
  This file is the only one that hand-copies a multi-file CLOSURE, which
  is why it is the only red; the other three copy a single lib that loads
  nothing, and are out of scope. Whether a guard should refuse a
  hand-copied closure in a vitest file the way BL-973's closure guard does
  for shell fixtures is the open membership question recorded on
  BL-1496's out_of_scope, not this slice.

  ## Not in scope

  - Stamping hotfix 32fb1ff7e1; its stamp ticket, when minted, should not
    re-touch this property file (it will run it, and find it green).
  - A closure guard for vitest fixtures (see Census).

