source: |
  backlog/INTAKE-host-queue-poll-clear-ttl.md — raw intake, human via Cursor,
  2026-08-05 ~09:40 CEST. Archived to the intake's resulting ticket (this one)
  on drain.

  Surface: the Host / Cursor Remote bridge question queue (`pendingPrompts` on
  the cursor-bridge state). NOT `role_ask`, NOT Approvals, NOT the pane menus.

description: |
  ## What the human asked for

  When the Host bridge finishes a turn with questions waiting, present them as
  a Telegram poll; a tap runs that question next and removes it; a clear-all
  option empties the queue without running anything; anything older than 72
  hours is dropped with a receipt; and all of this happens without the human
  remembering to type `/queue`.

  ## This is completion, not greenfield

  Most of the transport exists in
  `extension/src/tools/telegramCursorBridgeLive.ts` and must be extended
  rather than replaced:

  ```
  postQueueSelectionPoll      (line 1308)  posts the poll, guards on pendingPromptPoll
  processQueuedPollAnswer     (line 1339)  handles a vote, dequeues the chosen item
  pendingPromptPoll           (state)      the existing one-live-poll guard
  createdAtMs                 (per item)   already stamped at enqueue (line 345)
  auto-present attempt        (line 1534)  already called at end of the poll loop
  ```

  What is missing is the clear-all option, the 72h expiry sweep and its
  receipt, and enough reliability around the existing auto-present that it
  reads as a product surface rather than a best-effort call.

  ## The fan-out is already live — verified, not assumed

  The intake asked for the vote to ride "the real shared-token / front-desk
  `poll_answer` fan-out" and warned against leaving another dark
  producer/consumer pair. Checked at spec time:

  ```
  telegramFrontDeskBotCore.ts:875   forwards Host/Bubble/poll_answer updates
  cursorBridgeInboundQueue.ts        the queue those forwarded updates land in
  telegramCursorBridgeLive.ts:1460   consumes update.poll_answer
  ```

  Producer and consumer both exist. So this slice adds no transport; it must
  keep riding the existing one, which is what scenario 10 and the
  `required_wiring` entry are for. A second delivery path would be a defect,
  not a feature.

  ## Human decisions, carried through

  All seven of the intake's locked decisions hold unchanged: native Telegram
  poll with one option per queued item; select runs and dequeues only that
  item; clear-all always present on a non-empty queue; 72h measured from the
  existing `createdAtMs`; auto-present on the idle transition with `/queue`
  surviving as a manual refresh; one live poll at a time; and the v1
  exclusions (reordering, multi-select run-all, re-asking a queued choice
  question, Bubble UI for this queue).

  ## Specifier rulings on the intake's three open questions

  The human authorised defaults; these are those defaults, stated so the coder
  does not re-derive them.

  **R1 — clear-all is one tap.** A poll option, no confirmation dialog. The
  human explicitly asked for an option on the poll rather than a second
  prompt, and the cost of a mistap is bounded: the questions are dropped, not
  answered wrongly, and the receipt (R2) says what went.

  **R2 — one summary receipt, with a small-N exception.** A drop posts a
  single line naming how many went and their age span. When three or fewer
  were dropped, name them individually — at that size the detail is useful
  rather than noise. This is what keeps invariant 1 true: nothing leaves the
  queue invisibly.

  **R3 — origin topic when known, Host topic otherwise.** This follows
  BL-767's spirit (an answer belongs where the question was asked) without
  depending on BL-767 landing first: when no origin is recorded, the Host
  topic is the fallback and behaviour is exactly as today. No `depends_on` for
  the same reason.

  **R4 — 72h is a named constant, not a literal at the sweep site.** It is a
  policy number the human chose and will plausibly revisit; scenario 07 probes
  either side of it rather than asserting the number itself.

  **R5 — the sweep runs on the existing poll loop.** The intake left the
  cadence to the specifier. Reuse the loop that already runs, at the same idle
  transition that triggers auto-present, rather than introducing a timer.
  Consequence worth stating: a bridge that never runs its loop never expires
  anything, which is correct — expiry exists to protect the human from stale
  prompts firing, and a dormant bridge fires nothing.

acceptance: specs/features/BL-810-host-queue-selection-poll-clear-all-and-ttl.feature

