  ## Original spec notes (unchanged, kept for the record)

  Sibling: BL-767 (approved, paused) — a queued answer landing in the Cursor
  Remote topic rather than its origin topic. Its own out-of-scope note
  anticipated this "choose which queued question runs next" feature as
  separate work; this ticket is that feature plus clear-all and TTL. Not a
  `depends_on`: R3's fallback means this slice is correct whether BL-767 has
  landed or not, and they touch the queue from different angles.

  Related transport: BL-764 (shared-token front-desk fan-out) and
  `docs/how-to/BL-764-front-desk-shared-token-bridge-fanout.md`.

  Docs are part of this slice, per the intake's requested outcome 4: the
  how-to covering `/queue` needs auto-present, clear-all and the 72h TTL.

  ## E2E QA procedure (specifier, 2026-08-05)

  Run against the live bridge and a real Telegram topic — the whole point of
  this ticket is a human-facing surface, and a fake poll proves nothing about
  it.

  1. **Auto-present (scenarios 01, 02).** Queue two questions while the Host
     is working. When it goes idle, confirm the selection poll appears in the
     Host topic without anyone typing `/queue`. Confirm no poll appeared while
     it was still busy, and none appears on an idle bridge with an empty
     queue.

  2. **Select runs and dequeues one (scenario 04).** With three queued, vote
     the second. Confirm that question runs as the Host's next turn, leaves
     the queue, and the other two are still queued and still offered on the
     next poll.

  3. **Clear-all (scenarios 05, 06).** With three queued, tap clear-all in one
     action. Confirm the queue empties, NO Host turn starts, and a receipt
     names what was cleared. Confirm the option is absent — or the poll is not
     posted at all — when the queue is empty.

  4. **Expiry and receipt (scenarios 07, 08, 09).** Age two queued items past
     72h by back-dating their `createdAtMs`, leave one fresh. Run the sweep.
     Confirm both old items are dropped, never sent to the Host, a receipt
     names the count and age span, and the next poll offers only the fresh
     one. Repeat with a single dropped item to confirm the per-item detail
     path (R2).

  5. **No duplicate polls (scenario 03).** With a poll outstanding, force
     another idle transition. Confirm no second poll is posted and the first
     still accepts a vote.

  6. **The vote really rides the fan-out (scenario 10).** Vote from the phone
     and confirm the bridge acts on it end to end — front desk to
     `cursorBridgeInboundQueue` to the bridge. This is the check that the
     feature is not dark; run it last and do not substitute a unit test.
