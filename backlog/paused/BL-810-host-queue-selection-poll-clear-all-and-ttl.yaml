out_of_scope: |
  - Reordering queued questions, multi-select run-all, and answering a queued
    choice question without re-asking it. The human's own decision 7.
  - A Bubble Android UI for this queue. Same decision; the origin-topic
    routing in R3 is as far as this slice goes toward Bubble.
  - role_ask, Approvals, and pane AskUserQuestion menus (BL-568, BL-772, the
    Bubble clarification sheet intake). Different queues, different surfaces —
    the intake says do not merge these without asking, and nothing here does.
  - The Cursor Remote -> Host rename (BL-725). Use current topic names in
    prose; do not block on it.
  - Making the unit suite green. Separate intake.
  - Changing what the Host agent decides. This slice changes only how queued
    human prompts are presented, expired, and drained.

