id: BL-1625
title: "The shell suite manifest's 518 standing tests are no role's lane - BL-1618's table has no shell lane and QA runs only the suites a ticket names - so test_bl1388_land_step_guard_fixture.sh was red on main for thirteen days before a cleaner's incidental re-run found it (BL-1624); one runner executes every standing row sequentially, appends one duration row per completed run with the pole and the failing files, prints a verdict and exits with the suite's status - the recorder half (BL-1619's shape for the shell lane), changing no role's lane set until the census is in"
milestone: M8
type: feature
epic: unit-suite-speed
priority: 4
direction: swarm-reported
