source: |
  docs/briefings/2026-08-06.md — Flagged #2 / Asks #3 (verbatim ask to file).

  Live on 2026-08-06 (4-core host):
  - `uptime` load average 78–101 (≈20–25× cores)
  - three consecutive QA full-suite runs each failing a different random
    set of files to `vitest-worker onTaskUpdate` timeouts
  - `suiteDurationTrend.warn: true` at ~415s
  - `docs/briefings/2026-08-06.json`: `resourceSamplesObserved: true`

  CORRECTION (specifier, 2026-08-07, by reading the committed sidecar
  rather than the reported summary): the briefing's `resourceAnomalies`
  for 2026-08-06 was NOT `[]`. It held exactly one entry — role `coder`,
  rssBytes 860160 (≈840 KB), cpuPercent 0.0, rssTrend direction `down`.
  Every other day in the same week is the same shape or empty:
  2026-08-01 specifier/documenter/QA at 2.5–3.7 MB / 0% cpu; 2026-08-04
  coder/coordinator at 0.8–1.3 MB / 0% cpu; 2026-08-02/03/05/07 empty.

  This matters to the acceptance, not just the record: an assertion that
  merely says "the sidecar does not claim none found" passes VACUOUSLY on
  the real 2026-08-06 data, because a role anomaly was present and the
  "none found" branch never rendered. The scenarios must assert the
  host-load signal is itself present. See the feature file's scenario 02.

  The ticket's actual claim — that nothing on the sampling path ever reads
  host load, and nothing in the detector ever consults it — is confirmed:
  `sampleProcessStats` runs only `ps -o rss=,%cpu=`, and
  `computeResourceAnomalies` reads only per-role trends. That gap is real
  and is what this ticket fixes.

  Separately surfaced by the same probe and split out as BL-847
  (defect/high, paused): those sub-4 MB / 0% figures are the pane's ROOT
  SHELL, not the agent — `resolvePanePid` asks tmux for `#{pane_pid}`
  while the live `claude` process sits at ~391 MB / 7.8% cpu. Out of
  scope here by construction, since this ticket keeps per-role RSS/CPU
  unchanged and additive.

description: |
  ## The defect

  `computeResourceAnomalies` in `extension/src/notify/costHealthSidecar.ts`
  only flags a role when its RSS or CPU hour-over-hour relative change is
  ≥ `RESOURCE_ANOMALY_THRESHOLD` (0.1). Samples come from
  `sampleProcessStats` in `extension/src/metrics/resourceTelemetry.ts`,
  which runs `ps -o rss=,%cpu=` for each role pid — nothing else.

  Host load average is never recorded on the resource-sample path and never
  consulted by the anomaly detector. A sustained load of 78–101 on 4 cores
  can thrash vitest workers and trip `suiteDurationTrend.warn` without any
  single swarm role's RSS/%cpu moving 10% hour-over-hour, so
  `resourceAnomalies` stays `[]` while `resourceSamplesObserved` is `true`
  and the briefing renders "none found".

  ## Not a BL-350 reopen

  BL-350 fixed "nothing samples headless" and explicitly left anomaly
  thresholds / definitions out of scope. The 2026-08-06 sidecar proves that
  fix held (`resourceSamplesObserved: true`). This ticket is the gap BL-350
  deferred: what the detector looks at.

  ## Fix direction — specifier rulings (2026-08-07)

  The ticket delegated two decisions to the specifier. Both are settled
  here; the coder should treat them as the contract, not as suggestions.

  **RULING 1 — a sibling field, not inside `resourceAnomalies[]`.**
  Host load goes in its own optional field on `CostHealthSidecar` (e.g.
  `hostLoad?`), additive, `schemaVersion` unchanged — the same posture
  every other added field on that interface already uses
  (`suiteDurationTrend`, `costPerTicket`, `topExpensiveOriginsByHorizon`).
  It must NOT be pushed into `resourceAnomalies[]`: a `ResourceAnomaly` is
  `{role, rssBytes, cpuPercent, rssTrend, cpuTrend}`, and `pwa/app.js`
  (≈L795-798) iterates that array reading `.role` and `.rssBytes`
  unconditionally. A host measurement has no role and no RSS, so widening
  the element type would render `undefined` in the static PWA — a pure
  renderer over committed JSON, with no way to guard per-entry.

  **RULING 2 — severe requires a ratio AND a duration.**
  - ratio = `os.loadavg()[0] / os.cpus().length`, per sample.
  - severe-ratio threshold: **4**. Deliberately above the existing
    `mutation_busy_load_multiplier` default of 2
    (`swarmforge/scripts/mutation_cooldown_lib.bb`) — "too busy to START
    mutation testing" is a lower bar than "this day was resource
    abnormal", and the two must not drift into contradiction. 2026-08-06
    ran at 20–25×, so this catches it with room to spare.
  - sustained window: **15 minutes**, expressed as
    `matchingSampleCount * samplingIntervalMs >= sustainedMs` rather than
    a hardcoded sample count, so the dial keeps its meaning if
    `DEFAULT_SAMPLER_INTERVAL_MS` (5 min) ever changes.
  - Both dials config-overridable in the same `config <key> <value>` shape
    the rest of `swarmforge.conf` uses, read fresh at decision time.

  ## Implementation shape

  1. Record host load on the SAME tick that already writes `resource_sample`
     lines, as a distinct event type (e.g. `host_load_sample`) in the same
     monthly `chaser-<YYYY-MM>.jsonl`. That reader already tolerates unknown
     `type` values — `resource_sample` itself joined that family the same
     way — so this needs no second file convention.
  2. Record it on every tick INDEPENDENTLY of whether any role pid
     resolved. A host-load sample needs no pid, and a day where role
     sampling was broken but the host was on fire is exactly the day worth
     recording. It must not touch `resourceSamplesObserved` (invariant 3).
  3. Fold the verdict into `renderAnomalyLines`. **This is the
     load-bearing half**: emitting `hostLoad` into the JSON while the
     prose still prints "**Resource anomalies:** none found." below it
     ships the defect intact. The "none found" branch may only be taken
     when host load is ALSO not severe, and a severe day renders its own
     line in that block whether or not any role anomaly exists.
  4. Keep per-role RSS/CPU anomalies untouched (invariant 2).

acceptance: specs/features/BL-822-resource-anomalies-miss-host-load-spikes.feature

required_wiring:
  - "extension/src/notify/costHealthSidecar.ts::hostLoad::the sidecar must actually carry the field, not just compute it in a helper"
  - "extension/src/notify/costHealthSidecar.ts::renderAnomalyLines::the rendered 'none found' verdict must consult host load, or the defect ships intact behind a correct JSON field"
  - "extension/src/tools/sample-resources.ts::host load::the headless sampler is the only caller that runs with no editor attached (BL-350); a host-load sampler it never invokes records nothing"

out_of_scope: |
  - Changing the existing per-role RSS/CPU 10% relative threshold, except
    insofar as a shared helper is introduced and must keep that behaviour
    green under existing BL-350 scenarios.
  - Fixing the vitest-worker timeouts or suite-duration creep themselves —
    those are symptoms / adjacent work (BL-815 classification, BL-816
    disposition). This ticket only makes the host-load signal visible.
  - Mutation cooldown / other gates that already read host load (e.g. any
    BL-797-class path): reuse if clean, do not redesign those gates here.

notes: |
  2026-08-07 human: PROMOTE — second independent data point (BL-826 QA
  vitest onTaskUpdate timeouts under load; suiteDurationTrend.warn still
  true). Briefing flagged item; keep additive host-load coverage as written.

  Related same-shift context, do not merge: BL-815 (classify timeout fails
  on a quiet host) and BL-816 (record a disposition when waving a red suite
  through). Those address how roles behave under load; this one addresses
  why the briefing's automated resource health line stayed quiet through it.

  2026-08-07 specifier spec pass: corrected the source's `resourceAnomalies:
  []` claim (see source), settled both delegated rulings (see description),
  promoted the acceptance draft to a live feature file, and split the
  wrong-pid finding out as BL-847.

  IR-DRY note, so it is not re-litigated downstream: the checker still
  reports 6 near-duplicate/synonym findings on the feature file. They are
  resolved, not ignored — three prose forms of the host-load Given were
  collapsed into ONE parameterisable sentence ("stayed at <N> times the
  core count for <M> minutes"), so the step-handler surface is one regex
  serving five call sites. The residual findings are (a) data variation on
  that single pattern, which is what a parameterised step is FOR, and (b)
  four deliberate positive/negative assertion pairs, where merging the
  members would destroy the contrast the scenarios exist to draw.

  E2E QA procedure:
  1. Build the sidecar over an injected sample series with load ≫ core
     count sustained past the window and flat per-role RSS/CPU. Assert
     BOTH that the host-load field is severe AND that the rendered
     markdown does not contain "none found" — the JSON check alone is
     insufficient, see implementation shape 3.
  2. Same, but with one role anomaly ALSO present (the real 2026-08-06
     shape): both signals must appear. This is the anti-vacuity check —
     without it, step 1's assertion passes on 2026-08-06 data for the
     wrong reason.
  3. Quiet load + quiet role trends → "none found" still renders, and
     resourceSamplesObserved is still true. BL-350's distinction intact.
  4. Zero roles resolvable + severe load → resourceSamplesObserved false,
     host load still severe. A host-load sample never stands in for role
     sampling having run.
  5. Re-run the existing BL-350 and BL-100 acceptance scenarios unchanged;
     they must stay green (invariant 2).

