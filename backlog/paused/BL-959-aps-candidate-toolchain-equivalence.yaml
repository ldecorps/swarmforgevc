approval_context: >
  Three things need sign-off. (1) The new feature file (specifier draft, not
  yet human-reviewed). (2) The adopt/defer/reject decision this ticket
  embodies: the 2026-08-19 upstream-scan intake recommended adopting APS
  codex/bb-tools-equivalence in "targeted slices"; my probe found adoption is
  actually an ATOMIC human pin bump (the branch sits directly on our pin
  accaa33d, and engineering.prompt forbids reimplementing APS commands), so
  this ticket delivers a validation run + evidence report ONLY — the
  swarmforge.lock.json bump and install_aps_tools.sh re-vendor remain a
  separate human commit after reading the evidence. (3) A judgement call of
  mine: the harness fetches and runs the NON-pinned candidate toolchain in a
  throwaway work dir, never touching swarmforge/vendor/aps/ or the lock file.
  I read the pin rule as governing what is vendored/installed for live gates,
  not read-only sandboxed evaluation; if that reading is wrong, this ticket
  should be rejected rather than amended.

invariants:
