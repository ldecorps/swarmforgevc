  - "A gate outcome missing from either result set is reported INCOMPLETE with a non-zero exit — absence is never read as equivalence (fail closed)."

source: |
  backlog/INTAKE-20260819-upstream-adoption-matrix-for-specifier.md (archived
  to backlog/archive/ with this ticket's mint; decision note recorded in
  docs/upstream-deviations.md, 2026-08-19 entry). Operator decision request,
  verbatim:

    "Produce an intake decision note with:
     1. Adopt / defer / reject per matrix row,
     2. top three claims this intake might be wrong about,
     3. one falsifiable acceptance scenario for each adopted slice."

  Row A specifier challenge prompts, verbatim (these define the evidence
  report's required sections):

    "- Which of these commits are behavior changes vs pure porting?
     - For behavior changes, which existing local tests fail to protect us?
     - Can we isolate parser inference as one parcel and metadata relocation
       as another?
     - Do we need compatibility shims for any local scripts still invoking
       old tool entry points?"

description: |
  ## What / why

  APS's codex/bb-tools-equivalence branch (head 1001283af, 2026-08-14) is the
  only live upstream candidate from the 2026-08-19 scan worth adopting. It
  sits DIRECTLY on our install pin (git merge-base with aps/main is exactly
  accaa33d..., our swarmforge.lock.json pin), so a pin bump is a clean
  fast-forward of the vendored bb tools. But two of its seven commits change
  behavior our gates depend on:

    - 3a1d7b063 "Add default parameter inference to the Gherkin parser":
      infers literal step/background values into pN placeholders and example
      columns, merges into existing tables, validates explicit placeholders,
      adds --do-not-infer. This changes the parser IR — the input to our
      gherkin_lint_gate.sh, the IR-DRY checker, and gherkin-mutation site
      enumeration. Note: it may change the known "IR-DRY does not normalize
      quoted literals" behavior our review habits assume.
    - 1001283af "Move gherkin mutation metadata to work dir": relocates
      mutation metadata; our specs/pipeline/scripts/run_gherkin_mutation.sh
      passes --work-dir, and specs/pipeline/{gherkinMutationOutcome,
      runnerAdapter,mutationWorker}.js read APS outputs.

  The remaining five commits classify (per probe) as porting/docs: 1dd6bc09a,
  db9818e69, 55dc7e0aa (help output), 1847a252e (removes Go tools — a no-op
  for us, we vendor bb-only), 445efe487 (docs). The evidence report must
  confirm or correct this classification for ALL SEVEN commits, not the five
  the intake listed.

  ## Deliverable

  A dual-run equivalence harness plus one committed evidence report at
  backlog/evidence/BL-959-aps-equivalence-report.md containing:
    1. Per-commit classification: behavior change vs pure porting (all 7).
    2. A per-corpus-entry, per-gate verdict matrix (EQUIVALENT / DIVERGENT /
       INCOMPLETE) from running BOTH toolchains — the pinned vendored copy
       and the candidate fetched at exactly 1001283af into a throwaway work
       dir — over:
         a. every live specs/features/*.feature through the lint-gate parse,
         b. the same corpus through IR generation + the IR-DRY checker
            (verdict compares finding sets, not file bytes),
         c. the existing gherkin-mutation fixture path through mutation-site
            enumeration (enumeration only — no mutation loop run).
    3. The entry-point compat check the intake asked for: for each local
       caller of swarmforge/vendor/aps (gherkin_lint_gate.sh,
       gherkin_lint_gate_lib.bb, pre_qa_gate_gather_lib.bb, specs/pipeline/*,
       swarmforge/scripts/test/*), whether the candidate preserves the CLI
       entry points and output paths it invokes, and what shim (if any) a
       bump would need.
    4. A recommendation: bump / do-not-bump / bump-with-shims, with the
       divergence list as the argument.

  ## How (direction, not mandate)

  The comparator over two result sets is a small pure module (result sets
  in, verdict matrix + exit code out) driven by the acceptance step handlers
  and unit tests — the network fetch and dual invocation live in a thin
  script boundary around it, per the thin-wrapper rule. Reuse
  install_aps_tools.sh's clone-at-SHA-and-verify pattern for the candidate
  fetch (clone to a temp dir, verify rev-parse HEAD equals 1001283af, never
  copy into vendor/).

  ## Constraints

  - Read-only toward every pinned surface (invariant 1). The pin bump, the
    re-vendor, and any upstream-watch.json edit are HUMAN commits, out of
    scope here (engineering.prompt; upstream-watch.json _comment).
  - Never reimplement an APS command (engineering.prompt) — this ticket runs
    both real toolchains and compares outcomes; it ports nothing.
  - The candidate run must not be wired into any live gate; live gates keep
    consuming swarmforge/vendor/aps/ at the pin.

  ## Out of scope

  - Bumping swarmforge.lock.json / re-vendoring (human-only, after evidence).
  - Adopting parser-inference style guidance into our feature-file authoring
    rules (only meaningful if the bump lands; file separately then).
  - The intake's Row B (squad — DEFERRED) and Row C (two/four/six-pack —
    SKIPPED): dispositioned in docs/upstream-deviations.md 2026-08-19, no
    tickets minted.

qa_e2e_procedure: |
  Against the live repo, network available, swarm otherwise idle:
  1. Run the harness end-to-end: it fetches the candidate at 1001283af into
     a throwaway work dir (verify the harness refuses to proceed if
     rev-parse HEAD mismatches), dual-runs the corpus, writes the verdict
     matrix, and the evidence report exists at
     backlog/evidence/BL-959-aps-equivalence-report.md with all four
     required sections.
  2. Verify fail-closed live: delete one candidate-side result file from the
     work dir, re-run the comparator step alone, confirm INCOMPLETE verdict
     and non-zero exit.
  3. Verify read-only (invariant 1): git status must show
     swarmforge/vendor/aps/, swarmforge.lock.json and upstream-watch.json
     untouched after the full run; the live gherkin_lint_gate.sh still runs
     against the pinned vendor copy.
  4. Spot-check one DIVERGENT or INCOMPLETE row (if any) by re-running that
     single corpus entry through both toolchains by hand and confirming the
     matrix told the truth.

