approval_context: >
  A new feature file is authored here, so it needs a tap. No choice is
  posed and there are no ruling_options. FIRM: swarm_handoff.bb is not
  edited and no audit bypass (env or fixture marker) is added - each test
  makes the identical second call the protocol requires, and asserts the
  first call's AUDIT_REQUIRED where the case is about the send itself.
  FIRM: the first call is tolerated under both exit conventions (`|| true`
  on the challenge call) so this parcel is green whether or not BL-1529's
  ruling changes the challenge's exit code; the two tickets stay
  independent. FIRM: 03b's drain wait becomes a bounded wait on the
  daemon's own delivery evidence with a deadline no shorter than today's,
  never a bare sleep extension. FIRM: the three register rows this mint
  adds are removed in the land that turns the files green. Minted by the
  specifier on 2026-09-11 from the coder's two unowned-red notes (04:36Z,
  from the BL-1518 parcel) plus a census that found the third file;
  evidence backlog/evidence/BL-1529-BL-1530-specifier-unowned-red-census-20260911.md.

invariants:
  - "Every shell test that sends a git_handoff through swarm_handoff.sh asserts the queue on the second identical invocation, never the first, and none reaches the queue by bypassing the audit."

description: |
  ## What is wrong

  Since 44d2d42591 (2026-08-30) `swarm_handoff.bb` answers the first
  invocation of any `type: git_handoff` draft with `AUDIT_REQUIRED` /
  `HANDOFF_NOT_QUEUED`, queues nothing, and exits 0; the identical second
  call queues (Article 2.3, BL-1306). Three standing shell tests send
  once and assert a queue, and have been red since (reproduced on `main`
  4d019c0f91, 2026-09-11):

  - `swarmforge/scripts/test/test_rule_proposal.sh` case 04
    (`run_swarm_handoff` once per draft, `assert_queued` greps `^HANDOFF
    QUEUED (mailbox only, no tmux inject):`): the `git_handoff` row of the
    loop gets the challenge text. Cases 01/03/03b/02 pass. 03b was the
    coder's sighting (04:36Z, "daemon did not drain the outbox"): its
    drain wait is a fixed 40 x 0.25 s poll on the outbox count, which a
    loaded host (the coder's mutation run beside it) can miss; the
    specifier's two runs on `main` passed it. Same file, same row.
  - `swarmforge/scripts/test/test_handoff_state_dir_worktree_root.sh`
    case 01 (`bb swarm_handoff.bb "$DRAFT" > /dev/null` from
    `$CODER_WT/extension`, then `outbox_count == 1`): 0.
  - `swarmforge/scripts/test/test_required_stages_ticket_lookup_collision.sh`
    `send` helper (~line 70-73): one call, then `sed` for a `.handoff`
    path in the output - "no installed handoff file reported for
    task=BL-900-demo-task".

  None is in `backlog/standing-reds.tsv`; all three are `standing` in
  `suite-manifest.tsv`; nothing runs the standing shell suite, which is
  why a 12-day red surfaced only when the coder ran the files by hand.

  Census (BL-1445): shell tests that invoke `swarm_handoff.(sh|bb)` AND
  contain a `type: git_handoff` draft -
  `for f in $(grep -l -E 'swarm_handoff\.(sh|bb)' swarmforge/scripts/test/test_*.sh); do grep -q 'type: git_handoff' "$f" && echo "$f"; done`
  - 11 files. Run on 2026-09-11: 6 green, these 3 red on the audit, 2 red
  on BL-1529's production fault (`test_redo_from.sh`, `test_reroute.sh`).

  ## What is wanted

  The three files are green on `main` without any change to
  `swarm_handoff.bb`: each sends the identical draft twice (a small
  `send_twice`/`queue_after_audit` helper per file, or one shared under
  `swarmforge/scripts/test/lib/`), tolerates the first call's exit code,
  and asserts the queue grammar on the second. Where a case is about the
  send itself (test_rule_proposal.sh 04's `git_handoff` row), it also
  asserts the first call printed `AUDIT_REQUIRED` and queued nothing, so
  the protocol is pinned rather than papered over. 03b waits on delivery
  evidence (the specifier inbox file or the audit line the case then
  reads) with a bounded deadline at least as long as today's 10 s. The
  three register rows go in the same land.

  ## How (direction, not mandate)

  - `test_rule_proposal.sh`: `run_swarm_handoff` gains a second call for
    the `git_handoff` row only (awake/note stay single-call, which is the
    point of case 04). Keep the mailbox-only grammar assertion.
  - `test_handoff_state_dir_worktree_root.sh`: case 01 and 02 both send;
    call twice in each and keep the nested-state assertion (the audit
    challenge must not create `extension/.swarmforge` either - assert it
    after the FIRST call too, that is the ticket's own BL-056 property).
  - `test_required_stages_ticket_lookup_collision.sh`: `send` calls twice
    and parses the second output; the first output is asserted to carry
    `HANDOFF_NOT_QUEUED` (BL-1306's reroute-after-audit contract, which
    this file's collision case exercises for real).
  - The step handler runs the three files and greps them for the
    two-call shape; do not make it re-implement the tests.

  ## Not in scope

  - `test_redo_from.sh` and `test_reroute.sh`: red for a production
    reason (BL-1529), not a test one.
  - Wiring a runner for the standing shell suite (BL-541's
    remaining_slices already carry "nothing runs the shell test suite").

