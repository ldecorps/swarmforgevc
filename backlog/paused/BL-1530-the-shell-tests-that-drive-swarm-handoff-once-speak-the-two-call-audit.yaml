qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `for t in test_rule_proposal.sh test_handoff_state_dir_worktree_root.sh
     test_required_stages_ticket_lookup_collision.sh; do bash
     swarmforge/scripts/test/$t || echo "FAIL $t"; done` -> ALL PASS each,
     no FAIL line, five runs in a row for test_rule_proposal.sh.
  2. `git diff main...HEAD --name-only` names only the three test files,
     an optional shared helper under swarmforge/scripts/test/lib/, the
     step handler, the feature, evidence, and the register rows;
     `swarmforge/scripts/swarm_handoff.bb` is unchanged.
  3. `grep -n -E 'AUDIT|SKIP' swarmforge/scripts/swarm_handoff.bb` shows no
     new env-var read.
  4. Break-then-restore: in test_rule_proposal.sh drop the second call for
     the git_handoff row; the file goes red on 04 and the BL-1530
     acceptance scenario 01 fails; restore.
  5. `git diff main...HEAD -- backlog/standing-reds.tsv` shows the three
     rows removed and nothing else in that file.
