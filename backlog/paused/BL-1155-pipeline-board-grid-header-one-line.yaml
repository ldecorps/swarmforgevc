description: |
  ## What

  Live Pipeline Board topic on phone soft-wraps the stage header so QA
  breaks mid-label (Q then A on the next line). Pinned preview still shows
  one line. This is after tip 646ffe85d / BL-1117 (numeric &#160;); the code
  already notes raw NBSP still soft-wraps before QA on some clients.

  ## Why

  The board is the phone glance surface; a wrapped QA column destroys the
  matrix alignment the operator relies on.

  ## How (direction, not mandate)

  Fit the composed header to the phone `<pre>` width via
  PIPELINE_BOARD_GRID_MAX_WIDTH / gutter / STAGE_CELL_WIDTH, or another
  house-legal Telegram HTML layout. Prefer a durable width/budget contract
  over another entity-only tweak. Do not drop the QA column or rename
  stages without an explicit human decision.

qa_e2e_procedure: >
  (1) At parent tip, reproduce wrap on a phone-width fixture / live topic
  (evidence jpg).
  (2) At parcel commit, confirm header is one line with intact QA under the
  stated width budget, and columns still align.
  (3) Confirm the gate/property names a width/wrap budget, not only &#160;
  presence.
  (4) After the next board post, confirm the live Pipeline Board topic on
  phone shows one header line.

out_of_scope: |
  - Re-certifying BL-1117 / rewriting that stamp-off how-to alone.
  - Pipeline Board Mini App / web grid unless the same wrap shows there.
  - Unified s1/s2 grid work (BL-1009).
  - Dropping or renaming the QA column.

