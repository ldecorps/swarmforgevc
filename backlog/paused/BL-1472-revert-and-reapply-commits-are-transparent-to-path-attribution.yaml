id: BL-1472
title: "A bounce revert plus its reapply on the reviewing branch are untagged touches on another ticket's paths, and own-paths keeps a path with any untagged touch for the landing ticket (BL-1315), so after QA restored BL-1348's merge on 2026-09-07 the land step credited BL-1348's unapproved ruling-B code and tests to BL-1463 as its own, silently; a revert or reapply commit is transparent to path attribution - the paths it undoes or redoes belong to the commits it undoes or redoes"
milestone: M8
type: defect
severity: high
# high: a land would have published another ticket's unapproved, bounced,
# mid-rework production code under the landing ticket's name with the
# land step reporting nothing wrong; QA caught it only by reading the
# own-path set. Not critical: nothing landed and the QA prompt carries
# the interim hand review.
status: todo
epic: swarm-reliability
priority: 6
direction: swarm-reported
depends_on: []
mutation_cost: medium
