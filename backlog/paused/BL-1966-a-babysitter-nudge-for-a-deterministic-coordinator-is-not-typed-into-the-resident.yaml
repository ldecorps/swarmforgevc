description: |
  ## What is wanted

  With the coordinator resolving to no wake session (BL-1964),
  `nudge-resident!` returns `:no-session` and types nothing. The babysitter
  then records the finding as handled (writes the dedup state, as it does
  for `:nudged`) so the same finding is not attempted again on the next
  sweep, and logs one line naming the coordinator and `no-session`.

  ## What each stage checks

  - Coder: the scenario; babysitter_nudge_lib_test_runner.bb and
    test_babysitter_check.sh pass.
  - Hardender: a hand-mutant pass on the new dedup write (BL-472 fallback
    recorded).
