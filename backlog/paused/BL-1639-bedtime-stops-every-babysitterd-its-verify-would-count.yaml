id: BL-1639
title: "Bedtime stops every babysitterd its own verify would count: finish-shift's babysitterd stop, its verify and kill_all_swarm's babysitterd signal read one root-scoped process census, so a second babysitterd launched from an operator-local copy is signalled at bedtime instead of surviving it as REFUSE rc=1 and an orphan (2026-09-18 16:00Z; babysitterd named in 3 of the last 7 recorded bedtime refusals)"
milestone: M8
type: defect
severity: high
# high: a broken safety signal plus a live fault. finish-shift is the cron
# bedtime; when its verify counts a babysitterd its stop never signalled,
# it exits rc=1 (REFUSE) and the survivor keeps sweeping a dead stack every
# 300 s until a human kills it (283 finding lines logged 16:01Z-18:21Z on
# 2026-09-18, including CRIT resume-overdue and NUDGE-SKIP against a
# coordinator that no longer existed). day-shift.log records REFUSE on
# 08-26, 08-27, 09-04, 09-08 and 09-18; three of those name babysitterd.
# Not critical: the pipeline itself was stopped and nothing was lost.
status: todo
epic: swarm-reliability
priority: 8
direction: human-requested
depends_on: []
# BL-611 (babysitterd), BL-637 (verify, never trust exit codes) and BL-762
# (finish-shift bedtime) are all in backlog/done; this fixes the seam
# between the stop they share and the verify they share.
mutation_cost: low
# low: shell only (no mutation/CRAP/DRY wired, BL-472): one census helper,
# three call sites, one shell test on the existing ps-snapshot seam, one
