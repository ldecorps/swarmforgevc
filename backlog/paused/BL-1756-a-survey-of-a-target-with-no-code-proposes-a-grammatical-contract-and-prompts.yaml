approval_context: >
  New feature file; no choice posed. What needs sign-off: an empty survey
  says plainly that the target has no code and no stack yet (the same
  posture USE-CASES.md already takes). FIRM: a survey with any language
  produces byte-identical output to today's.

invariants:
  - "For every survey with at least one language, the proposed contract and prompts are byte-identical to today's."

description: |
  ## What is wrong

  `extension/src/onboarding/contractSurvey.ts` and `promptProposal.ts`
  both set `languageList` to `'the surveyed'` when `facts.languages` is
  empty. They then interpolate it into "Work within the existing
  ${languageList} codebase (layout: ${facts.layoutSummary})." and "Rewriting
  or replacing the existing ${languageList} stack.", and use it as the
  whole `# Tech Stack` section of engineering.prompt. For a greenfield
  target the layout summary is a full sentence ("Greenfield project: only
  README.md ... exist. No source tree, no chosen language/runtime yet."),
  and it lands mid-sentence too. Measured live on gpu-bargain-hunter,
  2026-09-25 (source).

  ## What is wanted

  - An empty `languages` survey proposes a contract whose scope says the
    target has no code yet (and so nothing existing to rewrite), and an
    engineering.prompt whose Tech Stack says no stack is chosen yet. No
    line reads "existing the surveyed".
  - Any survey with a language: byte-identical output (the invariant).

  ## How (direction, not mandate)

  - Prior art: `deriveUseCaseInventory` / `generateUseCaseInventoryMarkdown`
    already say "No discernible use cases were found in this codebase."
  - One shared "no code yet" predicate for both functions is the
    obvious move; the wording is the coder's.

  ## Scope

  - `extension/src/onboarding/contractSurvey.ts`,
    `extension/src/onboarding/promptProposal.ts`, their unit tests.
  - New: `specs/pipeline/steps/bl1756SurveyWithNoCodeSteps.js`.
  - Docs: the onboarding how-to/tutorial if it quotes the proposed text.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1756-a-survey-of-a-target-with-no-code-proposes-a-grammatical-contract-and-prompts.feature`:
     every scenario ok (01, 02 x2).
  2. The onboarding unit tests (contract survey, prompt proposal) green.
  3. `git diff main...HEAD --name-only` names only the Scope files,
     tests, docs and evidence.

