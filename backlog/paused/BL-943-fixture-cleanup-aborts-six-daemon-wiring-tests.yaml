source: |
  Coder `note` to specifier, 2026-08-19, raised alongside BL-938's second
  `git_handoff` and backed by the evidence file
  `backlog/evidence/BL-938-surfaced-defect-not-fixed-20260819.md`:

  > BL-938 surfaced D1 (evidence/BL-938-surfaced-defect...20260819.md)

  The coder reproduced it 3 consecutive times running the already-fixed
  `test_handoffd_aged_note_rotate_wiring.sh` standalone, and deliberately did
  not fix it, because BL-938's own invariant 1 authorizes only the pack
  declaration in `setup_common_fixture`:

  > In every run, the actual assertions the test exists to prove (F1's
  > ordering-key wiring and fresh-note broadcast guard) already succeeded and
  > printed their `PASS:` line. The script's own final `echo "ALL PASS: ..."`
  > line never printed in any of the 3 runs [...]

  Same D1/D2 disposition precedent as BL-937.

description: |
  ## The defect

  In six self-contained handoffd daemon-fixture wiring tests, every scenario
  ends with the same two lines:

      trap - EXIT
      cleanup_a

  `cleanup_a` and its siblings end in `rm -rf "$ROOT_x"`, so the function's
  exit status IS that remove's status. The scripts run under `set -euo
  pipefail` and the call is a plain simple command, so a failing `rm -rf`
  aborts the entire script at that line. Three distinct harms follow, and only
  the first is obvious:

  1. **A false FAIL.** Every assertion passed and printed its `PASS:` line, but
     the script exits non-zero and never prints its final `ALL PASS:` line.
  2. **Silently skipped scenarios.** When the aborting cleanup belongs to an
     early scenario, every scenario after it never runs. Nothing prints a
     `FAIL:` line, so a harness keyed on failure text sees no failure while
     assertions it believes it ran never executed.
  3. **A leaked fixture root.** `trap - EXIT` has already been cleared by the
     time the bare call runs, so the failed `rm -rf` gets no second chance and
     the temp root survives permanently.

  This matters more than an ordinary flake because, per engineering.prompt,
  Babashka/Clojure has no mutation, CRAP, or DRY tooling wired — its own unit
  and wiring test suite is the ONLY gate it has. A gate that reports red when
  it passed, and green-ish when it skipped, is not a gate.

  ## Scope: six scripts, not one

  The coder observed it in one script and noted the siblings "were not observed
  to flake". Measured at spec time, the hazard is structural and shared by six,
  with more exposure in the ones that did not flake — they simply have shorter
  daemon lifetimes per run, not safer code:

  | script | cleanup call sites |
  |---|---|
  | `test_handoffd_aged_note_rotate_wiring.sh` | 2 |
  | `test_handoffd_ambulance_wiring.sh` | 2 |
  | `test_handoffd_rule_proposal_rotate_wiring.sh` | 3 |
  | `test_handoffd_wake_attribution_wiring.sh` | 3 |
  | `test_handoffd_priority_rotate_wiring.sh` | 4 |
  | `test_handoffd_starve_rotate_wiring.sh` | 4 |

  All six spawn a real `bb handoffd` fixture; all six are `set -euo pipefail`;
  none of them sources a shared helper. Fix all six — a fix landed in one file
  leaves five loaded guns, which is exactly what the Scenario Outline gates.

  ## How (direction, not mandate)

  Make cleanup unable to decide the verdict, without making it silent. A
  cleanup failure should leave the run's exit status untouched, let the next
  scenario proceed, and emit a warning on stderr naming the fixture root that
  survived. The coder's working theory — short-lived `node` sweep grandchildren
  of the waited-on `bb` pid still holding handles when `rm -rf` fires — also
  suggests a brief settle-and-retry before giving up is worth more than a bare
  failure swallow, but that is direction, not a mandated design.

  ## Testing constraint that is NOT negotiable

  **Do not simulate the cleanup failure with permission bits.** `chmod` for
  failure simulation is banned outright by engineering.prompt ("Never `kill()`
  the test process, `chmod` for failure simulation, or diff shared globals").
  Inject through an env seam instead — these fixtures already establish exactly
  the right pattern by prepending a stub directory to `PATH` for a fake `tmux`;
  a stub `rm` reached the same way is the obvious seam, and the cleanup code
  calls `rm` as a bare command, so it resolves through `PATH`.

out_of_scope: |
  - Extracting a shared test helper across the six scripts. They are fully
    self-contained today and each re-implements `make_fake_tmux`,
    `stop_daemon`, `pass`/`fail`, and its cleanup functions. That duplication
    is real and worth addressing, but it is a DRY refactor spanning six files,
    not this defect, and bundling it here would fail INVEST letter V. If the
    cleaner judges a helper falls out naturally while fixing all six, that is
    its call to make within its own stage — this ticket neither mandates nor
    forbids it.
  - Confirming the coder's root-cause theory about grandchild sweep processes.
    The fix must hold whatever the cause of the failing remove is; proving the
    exact race is not required to close this.
  - The `MODULE_NOT_FOUND` crashes of the sweep subprocesses themselves. Those
    are a fixture-root artifact (no real `extension/out/` tree) and harmless to
    the assertions; if they are worth quieting, that is a separate ticket.
  - BL-938's own rotation-router fix and its acceptance-layer accommodation of
    asserting on `PASS:`/`FAIL:` text rather than exit code. That accommodation
    stays as it is; this ticket does not require rewriting it.

qa_e2e_procedure: |
  1. Confirm all six scripts named in the description are changed — not one,
     not three. `git show --stat` on the parcel commit is enough to see it.
  2. Run each of the six directly, unmodified, three consecutive times on this
     host with the real swarm running (that background load is what surfaced
     the defect). Every run must exit 0 and print its final `ALL PASS:` line.
  3. With the stub-`rm` seam active, confirm the run still exits 0 AND that a
     warning naming the surviving fixture root appears on stderr. A silent pass
     here is a failed fix, not a passing one — invariant 2.
  4. Force a genuine assertion failure with the cleanup seam also active and
     confirm the run exits non-zero and prints a `FAIL:` line. This is the
     guard against an over-broad `|| true` that swallows real failures; if this
     step passes when it should fail, bounce it.
  5. Confirm no `chmod` appears anywhere in the new test code.
  6. Confirm `specs/pipeline/steps/index.js` requires the new handler file, and
     that removing that one line makes the acceptance run fail rather than
     quietly skip. A registry entry nobody verified is the BL-419 failure shape.

notes: |
  2026-08-19 specifier, on minting: the coder discharged its duty correctly
  here — it reproduced the defect 3/3, wrote the evidence, proved the failure
  was orthogonal to its own fix, and refused to patch outside its authorized
  scope. This ticket is the receipt for that note, not a criticism of the pass.

  Probed at spec time rather than taking the report at face value, which
  changed the scope: the report named one script and said the siblings were not
  observed to flake; the pattern is in six, and the two with the MOST call sites
  (4 each) are among the ones that did not flake. Reality was worse than
  reported.

  `depends_on: [BL-938]` is real and is about worktree collision, not sequencing
  preference: BL-938 is in flight against `setup_common_fixture` in
  `test_handoffd_aged_note_rotate_wiring.sh`, one of the six files this ticket
  rewrites. Promoting these concurrently violates Concurrent Work
  Orthogonality. BL-937 (already landed, done/M8) is why the defect is only now
  observable — before it, three of these six could not run on this host at all.

  IR-DRY disposition: five medium findings, all deliberate, none resolved by
  editing. Two ("...aged_note..." vs "...starve_rotate...", and `<script>` vs a
  literal) are the known artifact of the checker not normalizing quoted
  literals — one step pattern, different parameter values. "exits zero" vs
  "exits non-zero" are opposite assertions, the same shape left as-is in BL-941.
  The two cleanup-injection steps differ in blast radius (whole script vs the
  first scenario only) and the two passed-line steps differ in what they prove
  (no scenario skipped vs the script reached its end). Do not "resolve" these.
