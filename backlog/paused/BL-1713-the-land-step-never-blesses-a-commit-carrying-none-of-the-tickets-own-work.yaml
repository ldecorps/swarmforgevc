id: BL-1713
title: "land_step_cli.bb printed LAND_CLEAN three times on 2026-09-24 (BL-1691 twice, BL-1694 once) for a built commit whose only change retired the ticket's standing-red register row - QA ran it from its worktree citing HEAD with the shared checkout as repo root, the CLI resolved HEAD there (origin/main), found nothing delivered and blessed the empty land; the CLI refuses a citation that means different commits in the caller's checkout and the repo root, and the plan refuses a range with no commit credited to the landing ticket"
milestone: M8
type: defect
severity: high
# high: a live fault in the land step (the integration point, Article
# 1.8) that builds and blesses a commit retiring a ticket's standing-red
# register row while landing none of its fix - a broken safety signal:
# the register would stop throttling on a red that is still red, and the
# ticket would close as done. Not critical: QA diffed the built commit
# by hand each time and landed tip-pure commits it built itself
# (75b3d014df, a0c48e9a39), so nothing wrong reached origin/main.
status: todo
