invariants:
  - "Between the sweep's re-delivery and the cross-seat deadline, a reclaimed item is claimable by exactly the seat that held it; every sibling seat's poll leaves it in place, whatever the item's type."
  - "Every deferral is fail-open: a passed deadline, an unreadable age, or a held-by seat no roster row matches releases the item to any seat of its stage - nothing waits forever, and a stage with one seat never defers."

description: |
  ## What is wrong

  `orphan_claim_sweep_lib.bb`'s `reclaim-file!` (BL-648) moves a dead
  session's claimed handoff from the role's `inbox/in_process/` back to the
  same role's `inbox/new/` under its original basename, drops the claim
  sidecars, and logs `BL-648 RECLAIM: role=<role> ...`. On a stage with two
  seats the `coder` row's `new/` IS the stage queue: `stage-queue-dir`
  (BL-983) resolves `coder@2`'s stage queue to that directory and the
  dispatcher reads the union of the stage queue and the seat's own new/
  (BL-1615). The moved file carries no seat identity, and
  `seat_affinity_lib.bb`'s `rework-claim-decision` defers only a
  `git_handoff` whose task a sibling has already WORKED (its completed
  sets); a reclaimed note is `{:action :claim}` for whichever seat polls
  first. So the seat that held the claim - whose worktree holds the
  half-built work - loses it to its sibling in the seconds after relaunch.

  2026-09-20, from the launch log and the mailboxes: the 01:00 relaunch's
  sweep logged `BL-648 RECLAIM: role=coder owning session not alive -
  reclaiming orphaned claim .../.worktrees/coder/.swarmforge/handoffs/inbox/in_process/10_20260919T062510Z_009782_from_coordinator_to_coder_for_coder.handoff
  -> .../.worktrees/coder/.swarmforge/handoffs/inbox/new/...` (the coder
  seat had claimed that Work note for BL-1652 on 2026-09-19 at ~06:54Z and
  was mid-build when the shift ended). coder@2 dequeued it at
  `2026-09-20T00:00:26Z` (the file now sits in
  `.worktrees/coder2/.swarmforge/handoffs/inbox/completed/`) and built the
  ticket (4eacde9068, 00:41Z). The coder seat, with no claim and no inbound,
  finished the same work from its dirty worktree (43213a6bc2, 00:08Z) and
  forwarded to the cleaner at 00:22Z; the reviewed lineage reached the
  documenter at 00:39Z. coder@2 noticed and stood down at 00:43Z; the
  documenter's forward to QA was refused (`PRE_QA_GATE_FAIL ancestry
  BL-1652 4eacde9068 stranded on swarmforge-coder@2`) until the specifier
  recorded the abandon (89198196ee). The documenter's evidence attributes
  this to the "coder@2 stage-queue-dir reads the shared coder mailbox"
  watch entry; that shared directory is BL-983's design and BL-1615 made
  the seat read it correctly - the missing piece is that a reclaimed file
  says nothing about who held it, so the BL-1004 deferral cannot fire.

  ## What is wanted

  - The reclaim records the seat that held the claim on the re-delivered
    item (a tool-stamped envelope header registered beside the other
    reserved headers in `swarmforge/handoff-protocol.md`, or a sidecar the
    claim path reads and drops - the coder's call; either way it travels
    with the file and is gone once claimed), and the reclaim line names it.
  - A seat polling the stage queue treats an item reclaimed from a
    DIFFERENT seat exactly as BL-1004 treats a sibling's rework: inside the
    cross-seat deadline it is left in place with a deferral line that
    names no seat; at or past the deadline, or with no readable age, it is
    claimed with the cross-seat claim line. Age follows
    `rework-claim-decision`: `enqueued_at` then `created_at`, never mtime.
    The seat that held it claims it at once (self-affinity wins). Any type
    defers - a note as much as a git_handoff.
  - `deferral-hold?` (the hold `flow_watchdog_lib.bb` and
    `chase_sweep_lib.bb` consult so a designed wait is not a stuck parcel)
    holds a reclaimed item inside the same window, for any type.
  - A stage with one seat and a master-resident seat re-claim their own
    reclaimed item as today, with no deferral line.

  ## How (direction, not mandate)

  - `reclaim-file!` already has the role-info and the target path; stamp
    there. `rework-claim-decision` and `deferral-hold?` each take one more
    input (the held-by seat, nil when absent) and the dispatcher passes it
    from the parsed file; `ready_for_next_task.bb`'s claim loop already
    has the seat id and the deadline in scope (its `:defer`/
    `:claim-cross-seat` branches). Mirror BL-1004's handler
    (`bl1004ReworkClaimSteps.js`) and BL-1615's
    (`bl1615SeatDispatcherClaimsSeatMailSteps.js`): the REAL
    `ready_for_next_task.bb` over a fixture roles.tsv with
    `SWARMFORGE_ROLE` set, and `relaunch_resume_cli.bb sweep <root> ""`
    with no `.swarmforge/tmux-socket` file (every session reads dead) for
    the sweep. The existing runners (`orphan_claim_sweep_lib_test_runner.bb`,
    `test_relaunch_resume_cli.sh`, the seat-affinity property runner) gain
    cases; BL-648's feature scenarios are unchanged and stay green.

constraints: >
  No change to which directory the sweep re-delivers into, to BL-648's
  reclaim decision (claim-reclaim?), or to the deadline's source. The
  step handler lands in the same commit as the feature (BL-233). Fixture
  roots are mkdtemp directories registered for reaping (BL-1636). Every
  diagnostic line the claim path prints must pass BL-1004's no-seat-id
  property runner unchanged.

out_of_scope: |
  - A seat that forwards a parcel with no claim in its in_process (the
    coder seat on 2026-09-20 committed and forwarded from its dirty
    worktree before its first ready_for_next.sh): a separate observation,
    recorded for the specifier.
  - The land step honouring abandoned_commits for the stray this race left
    in coder@2's history: BL-1650 (active).
  - Reclaims that happen mid-run (the sweep has one caller,
    relaunch_resume_cli.bb, at launch).

qa_e2e_procedure: >
  (1) `node specs/pipeline/cli.js specs/features/BL-1655-a-reclaimed-claim-stays-with-the-seat-that-held-it.feature`
  ONCE on the parcel commit: every scenario ok. (2)
  `bb swarmforge/scripts/test/orphan_claim_sweep_lib_test_runner.bb` once:
  green. (3) `grep -n 'reclaimed' swarmforge/scripts/seat_affinity_lib.bb`
  shows the held-by input in both the claim decision and the hold. Never
  "run it N times".

