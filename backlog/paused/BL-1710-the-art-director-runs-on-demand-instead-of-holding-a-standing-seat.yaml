human_approval: pending
approval_context: >
  Your 2026-09-24 correction ("I meant Art Director") applied to the slice
  I first minted for the documenter; the documenter stays a standing seat
  exactly as before, and the documenter-prompt text I had added on the
  wrong premise is removed. Please review the feature file. What goes is
  the Art Director's standing session (its window, process, context and
  idle tokens); its worktree and mailbox stay as files, because mail is
  how it is called and the worktree is where it commits. This reverses
  BL-1418's "standing pane" seat shape. FIRM - the Art Director stays
  outside the chain (Article 1.10) and keeps its lane and its QA land
  path (BL-1444); every note it sends or receives is unchanged; a dormant
  on-demand role is never reported as a dead or stuck seat; standing
  roles behave exactly as before. One consequence to confirm - once
  on-demand, the Art Director does only work it is called for (QA sign-off
  notes, review calls, briefs asked of it); it runs no unprompted review
  passes of the artifact inventory.

invariants:
  - "An on-demand role's mail is handled exactly like a standing role's (same mailbox, same helpers, same notes); the only difference is that its session exists only while it has mail or a consult marker."
  - "Every role whose window is not declared on-demand is launched, woken, chased and health-checked byte-identically to before this ticket."

description: |
  ## What is wanted
  1. **Pack declaration.** A `window` line may carry the token
     `on-demand` in the position list after the worktree (beside the
     receive mode, e.g. `window art-director claude art-director
     on-demand --model ...`). The launch writes the role's `roles.tsv` row
     as today, marked on-demand, creates its worktree and mailbox as
     today, and creates no tmux session for it.
  2. **Start on mail.** When handoffd would wake a role whose row is
     on-demand and whose session does not exist, it starts the role's own
     `roles.tsv` session through the consult path (the one-atomic-command
     session create of BL-1018 and the consult marker format
     `.swarmforge/daemon/consult/<role>.json`, as `consult_spawn_cli.bb`
     does), once, in a helper named `spawn-on-demand-session!` (the name
     is fixed; the wiring anchor names it), then delivers the wake. A
     second pass with the session already up starts nothing.
  3. **Teardown.** The existing `consult-teardown-sweep!` ends the session
     when it is idle with nothing actionable, exactly as it does for a
     consult today; no new teardown code is expected.
  4. **Quiet while dormant.** The chase sweep and babysitterd's health
     pass treat a missing session for an on-demand role with an empty
     inbox as normal, not missing/stuck/dead; with mail waiting, the
     start-on-mail path owns it.
  5. **full-forge** declares its art-director window `on-demand`.

  ## Why
  The human, 2026-09-23: "As for documentor: a bit like model steward or
  recruiter, it does not need to be a seat, more a role. It can be called
  by any agent who needs to publish something, typically like the
  documentor." Corrected 2026-09-24: "About the documentor as "not a
  seat": I probably messed up when I asked for that: I meant Art
  Director." The Art Director reviews the look and feel of what the swarm
  publishes for a human; the documenter is its typical caller. The
  machinery exists already for other reasons: the consult spawn (hotfix
  5bdf93beed, stamped by BL-1549) and `consult_spawn_cli.bb` (hotfix
  2026-09-16). This slice makes "started by its mail" the Art Director's
  normal life.

  ## How (direction, not mandate)
  - Reuse, do not fork, the consult spawn: the session create and marker
    write should be the same code `consult_spawn_cli.bb` and
    `spawn-consult-session!` use (they are deliberately separate today;
    if sharing them is out of reach, call the CLI).
  - The on-demand mark in `roles.tsv`: a new trailing column or a
    separate list; whatever the readers already tolerate (the roster
    parsers must not misread a new column - check `handoff_lib.bb` and
    `pack_staffing_gate_lib.bb` readers).
  - The mechanism is role-agnostic; only full-forge's art-director line
    uses it in this slice. Mono-router packs are out of scope: their
    dormant roles already work by rotation and consult.
  - The call contract (any role, typically the documenter, sends a note
    naming the artifact and where it renders; the Art Director answers
    `LGTM` or a defect list, as it answers QA's sign-off) is prompt prose,
    landed by the specifier in `swarmforge/roles/art-director.prompt`;
    this slice builds no CLI for it.
  - Tests (T1): fake tmux recording `new-session`/`kill-session`, a
    `mkdtemp` project with a pack conf and mailboxes; drive the real
    handoffd passes, the real chase sweep and babysitterd's real health
    pass.
  - Documenter: `architecture.mmd`'s change trigger (the tmux substrate
    relationship) fires if it draws one session per role - mark on-demand
    roles; the Art Director's reference/how-to page (if any) says it is
    started by its mail.

  ## Scope
  - `swarmforge/scripts/swarmforge.sh` (launch: parse the token, register
    the row, skip the session), `swarmforge/scripts/handoffd.bb` (start on
    mail; quiet chase), babysitterd's health pass, `swarmforge/packs/full-forge.conf`.
  - New: `specs/pipeline/steps/bl1710ArtDirectorOnDemandSteps.js` (BL-233).
  - Docs and diagrams as above.
  - Out of scope: the documenter (it stays a standing seat); mono-router
    packs; giving the freed window to another role; a call CLI; any
    change to Article 1.10, the Art Director's lane or its QA land path.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule). QA does not
  relaunch the live swarm.
  1. `node specs/pipeline/cli.js specs/features/BL-1710-the-art-director-runs-on-demand-instead-of-holding-a-standing-seat.feature`:
     all scenarios ok.
  2. The handoffd chase/consult wiring tests and the babysitter tests in
     `suite-manifest.tsv` are green, one run.
  3. `grep -n 'on-demand' swarmforge/packs/full-forge.conf` shows exactly
     the art-director window line; no other pack conf changed.
  4. `git diff main...HEAD --name-only` names only the Scope files, tests,
     docs, diagrams and evidence.
  5. After landing, on the next live launch of full-forge (operator):
     `tmux ls` shows no art-director session while its inbox is empty, and
     the next QA sign-off note to the art-director starts one.

