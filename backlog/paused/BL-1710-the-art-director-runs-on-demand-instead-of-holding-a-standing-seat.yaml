id: BL-1710
title: "The Art Director runs on demand instead of holding a standing seat - a pack window declared on-demand keeps its roles.tsv row, worktree and mailbox so every note it sends and receives is unchanged, starts no session at launch, gets its own session started through the consult path when its mail arrives (QA's sign-off note, a review call from the documenter or any role) and torn down by the existing consult sweep when idle, raises no missing-session alarm while dormant, and full-forge declares its art-director on-demand"
