id: BL-921
title: "Chase trusts the mono-router active-role marker over the pane's live identity, so a diverged marker turns every dormant-role poke into a false wake"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 10
direction: human-requested
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-921-chase-verifies-live-pane-identity.feature

invariants:
  - "Wake text reaches the resident pane only when the pane's own live identity equals the target role. The active-role marker is never sufficient evidence on its own, and an identity that cannot be read is treated as divergence, never as agreement."
  - "The identity check only ever tightens the gate: for every input, no case that resolves to skip or rotate today may resolve to wake once the check is in place."
  - "A role holding its own standing session is decided exactly as it is today, independent of both the marker and the resident pane's identity."

required_wiring:
  - "swarmforge/scripts/mono_router_lib.bb::live-role::both dormant-mailbox-chase-action and should-rotate-resident? must consult the pane's live identity, not the marker alone — fixing one leaves the other still false-waking"
  - "swarmforge/scripts/handoffd.bb::live-role::the daemon must actually probe the pane and pass the result in; a pure gate nothing feeds is the BL-419 shape (mechanism shipped, wired into zero call sites)"

severity_rationale: >
  Filed high, not critical. Nothing is down and no data is lost — the pipeline
  work was recoverable in full once a human rotated the pane by hand. But this
  is a live fault that both degrades behaviour and breaks a safety signal, which
  is exactly the high band: it burned 300+ agent turns in one night, and it
  silently strands real parcels in a dormant role's mailbox while the pipeline
  reports a healthy, busy resident. It is not critical because the swarm keeps
  serving every other role and one manual rotate clears it.

source: |
  Three independent reports of the same fault, all 2026-08-18:

  - Coordinator note 000463 (05:57Z) and note 000464 (07:05Z), both asking the
    specifier to mint this defect.
  - Operator intake `.swarmforge/operator/INTAKE-active-role-file-identity-mismatch-holding-loop.md`
    (human via Cursor, ~07:51-08:00 Europe/London), the evidence pack those
    notes lacked. Explicitly: "mint a defect", "do not treat this as already
    covered by BL-685 or BL-870", "Do not merge this intake into BL-685."
  - Recurrence history in the operator incident log spanning 2026-08-07, -13,
    -14, -16 and -18, previously misdiagnosed as spurious wake injection with
    no backing delivery.

description: |
  ## The defect

  Under mono-router one pane serves every role in turn, and its current identity
  is recorded in `.swarmforge/mono-router-active-role`. Two chase decisions read
  that marker and nothing else:

  - `mono_router_lib.bb` `dormant-mailbox-chase-action` returns `:wake-resident`
    when `active-role` equals the target role.
  - `mono_router_lib.bb` `should-rotate-resident?` returns `:already-active` on
    the same equality, refusing the rotate.

  Both conclude "the resident already IS this role, so just wake it." Neither
  asks the pane. When the marker disagrees with the identity the pane is really
  running, the wake lands on the wrong persona: it runs `ready_for_next.sh` as
  itself, reads its own empty mailbox, gets `NO_TASK`, and idles — correctly for
  who it thinks it is. The target role's mail is untouched, so the next sweep
  makes the identical decision, ~every 20 seconds, indefinitely.

  ## Measured, this repository

  On 2026-08-18 the marker read `cleaner` from ~03:48Z while the pane ran
  `coder.sh` (pane title "SwarmForge Coder", `SWARMFORGE_ROLE=coder`).

  `.swarmforge/telemetry/wake-attribution-2026-08.jsonl` (the BL-870 instrument)
  records for that day **535 landed wakes for `cleaner`**, every one with
  `handoffPresent?: true`, every one naming the same unclaimed parcel
  `00_20260818T005728Z_000264_from_QA_to_..._for_cleaner.handoff`, firing on a
  ~19-20s cadence for hours. Meanwhile cleaner's mailbox genuinely held work —
  two QA merge-up notes plus three `git_handoff`s for BL-913 — and the coder
  persona reading its own empty mailbox answered "Holding." to each wake.

  The whole file is 89,903 records and 23MB for one month, 88,613 of them
  `skipped`; the volume is itself a symptom.

  ## Why every existing safeguard missed it

  - **BL-870 records wakes, it does not stop them.** Its attribution keys on the
    TARGET role, so the storm appears as well-motivated `cleaner` wakes with a
    real handoff behind each one. Nothing in the record says the pane that
    received the text was running a different role. Diagnosable after the fact,
    and only if someone thinks to look.
  - **BL-685 is a different failure by construction.** It detects an idle
    resident sitting off home with EMPTY mailboxes and no dispatch note. Here the
    mailbox is non-empty and the pane is not idle — the false wakes keep it
    visibly busy. Its signature cannot fire. Per the intake: do not merge.
  - **BL-550 `ROTATE_HOME`** only prints when `ready_for_next.sh` is invoked as a
    non-home role. The pane was invoking it as coder, which is home.
  - **The fault masks its own repair.** Once the specifier was asked to mint this
    ticket, every specifier chase poke returned `skipReason: busy` — the pane
    looked busy because it was answering false wakes. A stall that keeps the
    resident too "busy" to be rotated onto the role that would ticket it.

  This is the 2026-07-19 incident already narrated in `dormant-mailbox-chase-action`'s
  own docstring ("wake-session remapped cleaner→resident while the resident was
  still identity=coder"). The `:rotate` branch written to prevent it is bypassed
  precisely when the marker claims the resident is already the target.

  ## How (direction, not mandate)

  The pane's live identity is directly readable and unambiguous — `tmux
  list-panes -F '#{pane_start_command}'` on the resident session currently
  returns `zsh '<root>/.swarmforge/launch/specifier.sh'`, naming the launch
  script that `rotate-resident-to!` itself installs. `#{pane_title}` carries the
  same fact in prose form. Reading it is one tmux call.

  Thread that observed identity into both decision functions as `live-role`, so
  the "resident already is the target" conclusion requires the marker, the live
  identity, and the target role to agree. On any disagreement — or on an identity
  that cannot be read — take the existing `:rotate` / `respawn-as!` path, which
  makes the identity true rather than assuming it. Keep the probe impure and in
  `handoffd.bb`; both gates stay pure functions of their arguments.

  Detection and prevention are the same equality check here, so they are sized
  together rather than split.

  ## Scope

  In: the two chase decision functions and the daemon call site that feeds them.

  Out: **why** the marker diverged in the first place. The marker read `cleaner`
  from ~03:48Z, the same minute the tmux sessions were created, which points at
  the boot/ensure path (`resolve-boot-role`, BL-648) rather than at rotation —
  see `approval_context`. Fixing chase stops the storm and un-strands the mail
  whatever the origin; the origin is a separate slice if it proves real.

approval_context: >
  The evidence pack is complete and the severity was directed, so neither needs
  sign-off. One thing does, because it is a fork the intake did not consider.

  Investigating this turned up a second, arguably deeper defect: the marker and
  the pane diverged at ~03:48Z, the minute the tmux sessions were created. That
  is the boot path, not the rotation path — BL-648's `resolve-boot-role` is
  supposed to boot the resident AS the recorded active role, and here the pane
  booted as coder while the marker said cleaner. I scoped that OUT and specced
  the chase fix only.

  Confirm that split. The case for it: the chase fix stops the token burn and
  un-strands the mail regardless of how the divergence arose, it is small, and
  a marker can always diverge for reasons nobody has enumerated yet — chase
  should be robust to that on its own merits. The case against: if boot is
  reliably the origin, fixing it removes the divergence at the source and this
  ticket becomes belt-and-braces.

  I recommend both, in this order, as separate tickets — say so and I will mint
  the boot-origin ticket alongside. Only the scope changes; the spec below
  stands either way.

qa_e2e_procedure: |
  Against the live swarm, with the resident pane up:

  1. Record the true identity of the resident pane:
     `tmux list-panes -t "$(cat .swarmforge/mono-router-resident-session 2>/dev/null || echo swarmforge-coder)" -F '#{pane_start_command}'`
     Note which `launch/<role>.sh` it names.
  2. Force a divergence WITHOUT rotating: write a different pipeline role's name
     into `.swarmforge/mono-router-active-role` by hand (e.g. `cleaner` while the
     pane runs coder). Leave the pane alone.
  3. Place or confirm a real parcel in that other role's mailbox, so chase has
     something to poke about.
  4. Watch two full chase sweeps (~40s). Confirm from
     `.swarmforge/telemetry/wake-attribution-*.jsonl` and the pane itself that
     NO "You have new handoff mail" text is injected into the resident pane for
     the diverged role. Before the fix this is a wake every ~20s.
  5. Confirm the daemon instead attempted a rotate — `chase-rotate` or a
     `chase-rotate-<reason>` line in the operator log — and that once the pane
     respawns as that role, `ready_for_next.sh` picks the parcel up.
  6. Restore the marker to the pane's real identity and confirm ordinary
     dormant-role chasing still works: a parcel for a genuinely different dormant
     role still produces a rotate, and a role with its own standing session (if
     the pack has one) is still woken directly.

notes: |
  Cross-links, per the intake: BL-550, BL-576, BL-685 (deliberately NOT merged —
  different signature on two axes), BL-870 (records, does not prevent), and the
  2026-07-19 incident comment on `dormant-mailbox-chase-action`.

  Answering the human's question "why did the specifier not pick this up": the
  specifier is dormant on this pack and never got a turn. The mint request from
  05:57Z was suppressed on delivery (BL-576 dormant-note wake suppression), was
  not chase-actionable for 20 minutes (`default-note-actionable-after-ms`), and
  was then refused on every poke as `skipReason: busy` — busy answering the very
  false wakes this ticket describes. Not a reasoning miss.

  Two operational observations made while specifying this, neither part of the
  slice:
  - `.swarmforge/telemetry/wake-attribution-2026-08.jsonl` is 23MB / 89,903 lines
    for a single month with no rotation. Worth a separate look once the storm
    stops.
  - At the time of writing, cleaner's `inbox/in_process/batch_20260818T065623Z_000001`
    still holds three unfinished `git_handoff` parcels from coder while the
    resident has rotated to specifier, against the intake's instruction to leave
    cleaner alone until its batch completed. Surfaced to the coordinator, not
    acted on here.
