description: |
  ## Defect

  In `extension/src/bridge/pausedPagerUiHtml.ts` (~line 222), the POST action
  handler's non-OK branch renders `opts.failText + ' (HTTP ' + r.status + ')'`
  and then swallows the response body:

      if (!r.ok) {
        setStatus(opts.failText + ' (HTTP ' + r.status + ')');
        return r.json().catch(function () { return {}; });
      }

  The bridge sends a JSON `reason` on failure (e.g. `ticket not found in
  active/paused` on 404), and the OK-but-unsuccessful branch directly below
  already displays `payload.reason` — only the non-OK branch discards it. The
  human sees "HTTP 404" and has to guess which of several possible causes
  applies.

  ## Fix shape

  Read the body FIRST on the non-OK branch and prefer its `reason` for the
  status line, falling back to `failText (HTTP <status>)` only when the body
  has none or fails to parse. BL-572's bounce-#3 rework applied exactly this
  to the epic reorder screen (commit decc3f7d6, "fix reason-swallowing UI
  bug") — match that pattern rather than inventing a sibling variant; when
  BL-572 lands on main, the two screens should read identically.

  Sweep the rest of pausedPagerUiHtml.ts (and any other status-line writer in
  the same file) for the same shape while in there — the invariant above
  covers every response path of this screen, not just the one named line.

  ## Acceptance signal

  Driving the screen's action against a bridge returning 404 + reason shows
  the reason text in the status line, not a bare HTTP code; a reasonless
  non-OK response still shows the failText + status fallback.

