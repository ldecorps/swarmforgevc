description: |
  ## What

  Give Bubble (the phone app's talk surface) its own Telegram forum topic
  instead of dumping Let's Talk turns into Cursor Remote. Cursor Remote goes
  back to being operator control only: slash verbs and typed direct prompts.

  ## Why

  Bubble turns appearing in Cursor Remote make that topic look like the agent's
  memory when it is only a control and chat surface. Separating the two gives
  conversation history its own home, keeps operator command logs readable, and
  removes a UX that implies persistence the system does not have.

  | Surface | Role after this slice |
  |---------|----------------------|
  | Bubble standing topic (`BUBBLE`, display name `Bubble`) | Let's Talk turns, choice polls, typed follow-ups made in that topic |
  | Cursor Remote | Host-agent remote control only — slash verbs, typed direct prompts |

  The shared `agentId` is unchanged: Bubble voice turns and Cursor Remote typed
  prompts still reach the same host-agent session. This is routing, not a
  session split.

  ## State of the code (verified 2026-07-30 — read before scoping)

  An implementation of this behaviour already exists as UNCOMMITTED changes in
  the master working tree, with unit tests but no acceptance contract and no
  pipeline review: `telegramCursorBridgeCore.ts` (`BUBBLE_SUBJECT_ID`,
  `BUBBLE_TOPIC_NAME`, `bubbleTopicIdFromMap`, inbound scoping),
  `telegramCursorBridgeLive.ts` (topic ensure/create, turn mirror preferring
  `bubbleTopicId`), `telegram-front-desk-bot.ts` (`readBubbleTopicId`, map
  scrub), `bridgeServer.ts`. It is ticket-less work under the BL-506 rule and
  must be reviewed as parcel content, never assumed correct. See
  `approval_context` for the adopt-vs-rebuild fork.

  ## Out of scope

  - Splitting Bubble and Cursor Remote onto different backend `agentId`s
  - Making Telegram history reloadable as model memory
  - Reworking the Concierge role-topic assignment model
  - Any new Telegram UI beyond the topic these turns already need

  ## STEERING note

  Explicitly human-requested (2026-07-30), so eligible for pull under the
  standing freeze: it is routing and operator clarity on existing surfaces, not
  growth of the Telegram product surface.

