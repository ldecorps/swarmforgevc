notes: |
  e2e QA procedure: with the cursor bridge and front desk live, confirm the
  Bubble topic exists in the forum (reused, not duplicated, across a bridge
  restart); take one Let's Talk turn from Bubble and confirm both sides of the
  turn appear in the Bubble topic and nothing appears in Cursor Remote; type a
  slash verb in Cursor Remote and confirm its answer stays there; type a
  follow-up in the Bubble topic and confirm the reply comes back into Bubble;
  confirm the front-desk topic map on disk binds neither topic.
