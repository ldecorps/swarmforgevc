  Human via Cursor 2026-07-30 asked for this directly, so the freeze does not
  veto it. One fork needs a tap before the coder starts: an UNREVIEWED,
  UNCOMMITTED implementation of exactly this behaviour already sits in the
  master working tree (BUBBLE_SUBJECT_ID / BUBBLE_TOPIC_NAME, topic ensure,
  turn mirror preferring bubbleTopicId, front-desk scrub, inbound scoping,
  plus unit tests) with no ticket, no acceptance contract and no pipeline
