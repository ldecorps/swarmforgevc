     4 of 4 ok (scenario 01 and the outline's 3 rows). Measured 0 on main at
     mint: no handler exists yet.
  2. `bash swarmforge/scripts/test/test_bl982_multi_seat_identity.sh`:
     exit 0, `ALL PASS`. Measured on main at mint: exit 1 on case 7, 4.5 s
     at load 6.6.
  3. `bash swarmforge/scripts/test/run_bb_suite.sh bl982`: the standing
     suite's own selection of this file passes.
  After the land (the coordinator's check, not QA's): no row in
  `backlog/standing-reds.tsv` names
  `swarmforge/scripts/test/test_bl982_multi_seat_identity.sh`; the land
  step retires it (BL-1631).

