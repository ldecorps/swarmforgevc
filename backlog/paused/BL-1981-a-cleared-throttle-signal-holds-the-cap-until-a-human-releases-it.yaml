id: BL-1981
title: "A cleared throttle signal holds the cap until a human releases it: effective_backlog_depth_cli.bb keeps the lowest cap a throttle episode reached after its signal clears, and only a human answer recorded with a new release CLI (release, or keep at N) lifts it - Article 3.5 as amended 2026-10-05"
