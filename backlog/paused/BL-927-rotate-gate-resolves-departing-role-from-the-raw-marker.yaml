invariants:
  - "The departing role is the role the pane is actually running. The active-role marker is never sufficient evidence on its own, and an identity that cannot be read is treated as divergence, never as agreement - the same rule BL-921 established for the chase decisions."
  - "The gate still fails OPEN whenever the departing role cannot be determined at all. BL-805's choice to proceed rather than guess an identity is preserved; divergence must widen that fail-open, never narrow it."
  - "The daemon's own rotation path is untouched. rotate-resident-to! stays ungated so chase-driven drain can never deadlock on the parcel it is clearing."

approval_context: >
  Wants sign-off on severity, the only judgement call here.

  Filed medium, one band below its sibling BL-926. The deadlock actually
  observed on 2026-08-18 is cleared by BL-926 alone, and the residual case this
  ticket closes - a diverged marker where the rotation target is a THIRD role,
  so BL-926's target-equality never fires - was not observed, only derived from
  the same divergence. It is a real reachable state rather than a hypothetical
  one, which is why it is medium and not low, but I did not want to claim
  first-hand evidence I do not have for it.

  If you would rather this rode as one ticket with BL-926, say so - see that
  ticket's approval_context for why I split them.

source: |
  Derived by the specifier on 2026-08-18 ~19:04 BST from the same first-hand
  incident that produced BL-926, while reading
  handoff-lib/departing-role-blocking-handoff to understand the refusal.

  The residual case is stated as derived, not observed. What WAS observed
  first-hand that day: the active-role marker read `coder` while the pane's
  live identity was `specifier`. That divergence is the input this ticket is
  about; only the third-role consequence is inferred from the source.

description: |
  ## What happens

  handoff-lib/departing-role-blocking-handoff decides whose in_process box the
  resident-invoked rotate gate protects. It reads
  .swarmforge/mono-router-active-role and nothing else:

      (let [role (str/trim (slurp (str marker-path)))]
        (when-not (str/blank? role)
          (when-let [role-info (load-role-info role)]
            (first (handoff-files (mailbox-dir role-info :in_process))))))

  Its docstring is explicit that it fails OPEN - returns nil, rotation proceeds
  - whenever the departing role cannot be determined, "rather than guessing an
  identity and gating on the wrong role's mailbox". But the only two ways it
  can fail to determine the role are a missing/blank marker and an unknown
  roles.tsv row. A marker that is present, well-formed, and simply WRONG is
  indistinguishable from a correct one, so it fails CLOSED into exactly the
  outcome the docstring set out to avoid: gating on the wrong role's mailbox.

  ## Why a wrong marker is not a hypothetical

  BL-921 (done) established that marker-vs-pane divergence is a real,
  recurring, high-volume condition in this swarm. Its measured evidence:
  535 landed wakes for `cleaner` on 2026-08-18, all against one unclaimed
  parcel, while the pane ran the coder persona. The whole reason BL-921 shipped
  live-role-agrees? and wired it into both chase decisions is that the marker
  cannot be trusted on its own. This call site did not get the same treatment.

  Directly observed here on 2026-08-18: marker `coder`, pane `specifier`.

  ## The residual case, and why BL-926 does not close it

  BL-926 makes the gate proceed when the rotation target equals the role whose
  box holds the parcel. That clears the observed deadlock (target and marker
  both `coder`).

  It does not clear the case where the marker is diverged AND the target is a
  third role. Concretely: marker says `cleaner`, pane is really `coder`,
  cleaner's box holds a real parcel, and the coder finishes its work and
  forwards to `documenter`. Target `documenter` does not equal `cleaner`, so
  BL-926's equality never fires; the gate refuses the coder's perfectly
  legitimate forward-rotation to protect a parcel the coder never claimed and
  cannot complete. The pane is stuck again, for a different reason.

  Resolving the departing role from live identity closes both: the pane is
  really `coder`, coder's own box is empty, so the gate proceeds.

  ## Shape of the fix (direction, not mandate)

  BL-921 already built the pieces. handoffd.bb has resident-live-role, a tmux
  probe of the pane's real identity, and mono-router-lib has live-role-agrees?
  with the unreadable-is-divergence rule. The work here is to let this gate ask
  the same question before choosing whose mailbox to read, and to treat
  disagreement as "the departing role is not the marker's role" - which, per
  invariant 2, means falling open rather than gating on someone else's box.

  Reuse those definitions rather than restating them. Per the engineering
  article's constant-across-a-language-boundary rule, a second predicate
  answering the same question differently is the defect, not the fix.

  ## What must still be refused

  A resident that really IS the role named by the marker, departing over its
  own real undrained parcel. That is BL-805's whole purpose and neither this
  ticket nor BL-926 weakens it.

qa_e2e_procedure: |
  1. Fixture: marker names role A, the pane's live identity is role B, role A's
     in_process holds a real *.handoff parcel, role B's box is empty. Invoke
     the resident rotation entry targeting a third role C. Confirm it proceeds
     - today it refuses on A's parcel. This is the residual case and the
     single most important positive.
  2. Same fixture but role B's own box holds a real parcel. Confirm the
     rotation is refused and names B's parcel, not A's. Protecting the right
     mailbox is the point; proceeding here would be a new defect.
  3. Marker and live identity agree, that role holds a real parcel, target is a
     different role. Confirm it still refuses exactly as today - BL-805's
     behaviour under agreement is untouched.
  4. Make the live identity unreadable (no resident session, probe fails).
     Confirm the outcome is the fail-open of invariant 2 and never a
     refusal derived from the marker alone - unreadable is divergence, not
     agreement (BL-921's rule).
  5. Missing marker, and blank marker. Confirm both still fail open exactly as
     BL-805 specified.
  6. Confirm the daemon path is untouched: drive handoffd's own chase-driven
     rotation against a role whose in_process holds a parcel and confirm it
     still rotates, ungated (invariant 3).
  7. On the live host, with a genuinely diverged marker, run a normal
     forward-rotation to the next pipeline role and confirm it is not refused
     on the marker role's mailbox.

required_wiring:
  - "swarmforge/scripts/handoff_lib.bb:::live-role::departing-role-blocking-handoff must actually consult a live identity probe; a resolver nothing feeds still reads the marker alone and the gate is unchanged (BL-419 shape)"

out_of_scope: |
  - Making the gate proceed when the rotation target owns the blocking parcel.
    That is BL-926, minted from the same incident and independent of this one.
  - Detecting a stranded resident (BL-685).
  - Fixing whatever WRITES a stale marker. This ticket makes the gate robust to
    divergence; it does not attempt to stop divergence happening. If the write
    path is worth fixing, that is a separate ticket and neither BL-921, BL-926
    nor this one covers it.
  - Re-deciding anything BL-921 already landed on the chase path. Those two
    call sites are correct; do not touch them.

notes: |
  Sibling of BL-926, same incident, deliberately not folded in. BL-926 is a
  pure decision change to a three-branch cond with no new I/O. This one adds a
  live tmux probe to a call site that has none, which is a new wiring seam with
  its own failure mode - exactly the BL-419 shape BL-921 had to arm
  required_wiring against. Different risk, different mutation cost, so
  different parcels.

  The severity gap is deliberate. BL-926 is high because it is first-hand
  observed and does not self-clear. This is medium because its specific
  residual case is derived, not observed - see approval_context. Both feed the
  same expedite lane question, so if the human disagrees with either band it is
  a one-field change.

  Do not let this land as a second definition of live identity. handoffd.bb
  already has resident-live-role and mono_router_lib.bb already has
  live-role-agrees? with the unreadable-is-divergence rule, both from BL-921.
  Reuse them. A duplicated predicate that answers the same question differently
  across two files is the failure the engineering article's mirrored-constant
  rule exists to prevent, and here there is no language boundary forcing it -
  both are Babashka, so an import genuinely is available.

  Fail-open is load-bearing, and it is easy to lose. The tempting shape - "if
  live identity disagrees with the marker, gate on the LIVE role's box instead"
  - is fine when the live role resolves, but must not become "if we cannot tell
  who we are, refuse". Invariant 2 forbids that; step 4 of the QA procedure is
  the case that catches it.

  mutation_cost medium, not low: the probe seam has to be injectable for tests
  (no live tmux in the unit suite), which is more design than BL-926 needs.
  Existing suites to extend rather than replace:
  swarmforge/scripts/test/mono_router_lib_test_runner.bb and
  swarmforge/scripts/test/test_rotate_to_role_stuck_parcel_gate.sh.

  Shell-test discipline. Stock macOS /bin/bash 3.2 target, empty-array-safe
  expansion, `env -u SWARMFORGE_CONFIG` before fixture confs, reap fixture tmux
  by socket path never session name, remove temp fixture dirs in a finally.

  BL-233 obligation. All scenarios are new and their step handlers must land in
  THIS parcel; the acceptance runner throws on any scenario it cannot resolve.
  Outline columns must validate against explicit KNOWN_VALUES, not pass
  through.
