human_approval: approved
approval_context: >
  Inherited from BL-1625 (approved), split 2026-10-06 with no new scope.
  FIRM (BL-1625): rows are per ITEM, appended as each completes, so a run
  killed part-way leaves the rows of the completed items and no more; the
  runner never runs beside the unit or property lane.

description: |
  ## What is wanted

  A new script, `swarmforge/scripts/test/run_recorded_lane.sh`:

      run_recorded_lane.sh --lane <name> --list <file> --durations <path> [--limit N]

  - Each line of `--list` is `<item>` TAB `<command ...>`. The runner runs
    the lines in order, one at a time (never in parallel), with `--limit N`
    running only the first N lines.
  - Around each command: `date +%s%3N` before and after. The moment the
    command returns, append ONE line to `--durations` with `>>`:
    `{"finished_at":"<iso>","lane":"<name>","file":"<item>","result":"pass|fail","duration_ms":<n>}`
    (`result` is `pass` when the command exits 0). Build it with `printf`.
  - After the last item, print a verdict: the count passed and failed,
    every failing item by name, the ten slowest with their seconds, and
    the wall. Exit 1 when any item failed, else 0.
  - Use `set -uo pipefail` and capture each item's status
    (`"$@" || st=$?`). Never `set -e` across the loop (BL-1242), and never
    `kill` anything.

  And the step handler `specs/pipeline/steps/bl2019RecordedLaneRunnerSteps.js`
  for the feature's scenarios 03, 04 and 05:
  - Fixture lists go in a mkdtemp dir from `trackedTmpRoot`
    (`require('./lib/fixtureReaper')`, see the top of
    `bl1782VerificationDebtLedgerSteps.js`). An item that passes is
    `true`, one that fails is `false`. Durations go to a file in the same
    mkdtemp dir, never a repo path.
  - The kill case: make the second item `sleep 30`, spawn the runner,
    poll the durations file until it holds one row, then kill the spawned
    runner (the child process you started, never the test process).
  - Register every step with `registry.defineScoped(re, fn, FEATURE)`
    where FEATURE is the feature's exact `Feature:` text. Validate the
    Outline placeholders (`<shape>`, `<runs>`, `<rows>`, `<exit>`,
    `<names>`) against explicit KNOWN_VALUES tables, never passthrough.

  ## Not in scope

  - The front-ends (BL-2020 features, BL-2021 shell) and the docs (BL-2021).
  - A separate shell test for the runner: BL-1625's How suggested one
    beside the step handler; the handler drives the real runner on the
    same fixtures, so it is dropped (no suite-manifest row is needed: the
    manifest registers test_*.sh and *_test_runner.bb only).

