human_approval: pending
approval_context: >
  Second of three slices from the human's 2026-10-07 intake: "GPU
  inference stays 1-at-a-time - load balancing seats is not concurrent
  decode". A new feature file needs the human's look. No choice is posed.
  What needs sign-off: the slot lives in the shim every local seat already
  goes through, and it follows a seat across its burst of requests rather
  than taking turns per request, because each change of seat costs iq3 a
  23-66 s re-prefill. FIRM: one slot (a second does not fit the card);
  shell, tests and git never take it; a lone seat never waits, so today's
  mono-router pack behaves exactly as now.

invariants:
  - "At most one chat completion is in flight to Ollama at any moment, from any number of seats; the shim's own extra upstream calls for one client request (the BL-1920 nudge, a BL-1978 warm-up) run under that request's slot."
  - "A request reaches Ollama with the same body it would have without the slot - the slot decides only when - and calls other than chat completions never wait."
  - "With one seat on the host, every chat completion is forwarded as soon as it arrives."

description: |
  ## What is wrong

  Nothing in SwarmForge decides which local seat may use the model. Ollama
  (OLLAMA_NUM_PARALLEL 1 on this host) queues concurrent completions and
  serves them first come first served. iq3's qwen35 cache cannot rewind
  to a shared prefix (BL-1978), so a completion that follows another
  seat's re-processes the whole prompt: 23-38 s at 20-30k tokens, 66 s at
  50k (serve.log, 2026-10-08), where a cached turn costs 4-7 s. Standing
  local seats taking turns per request would pay that on nearly every
  request. The `config single_inference_slot 1` line in the live pack is
  read by nothing since BL-1752.

  ## What is wanted

  - The shim keeps one decode slot. A chat completion from the seat that
    holds it is forwarded at once; one from another seat waits (scenario
    01).
  - The holder keeps the slot while it keeps asking: its next completion,
    arriving within the idle grace after its last reply, goes before any
    waiting seat - until it has held the slot past the hold quantum while
    another seat waits, when it queues behind that seat (scenario 03).
  - A holder that sends nothing for the idle grace (running tests, git,
    any tool) gives the slot to the longest-waiting seat (scenario 02).
  - A waiting streamed completion gets keepalive comments, as a long
    upstream call does today, and its reply once it gets the slot
    (scenario 04); nothing a seat waits on fails it with a client timeout.
  - `GET /shim/health` shows the slot: holder, held ms, the waiting seats
    with their waits, the idle grace and the hold quantum. One log line
    per hand-over: seat, wait ms, previous holder (scenario 02).
  - The slot covers the whole client request, the shim's own extra
    upstream calls included (invariant 1).
  - Living doc: docs/how-to/BL-1052-local-model-seat-launch.md gains the
    decode slot beside the shim section BL-2076 extends.

  ## How (direction, not mandate)

  - A small lease object with an injected clock, used around the upstream
    work in the shim's chat-completion path; `serve` takes the idle grace
    and the hold quantum as options so the handler can use short values.
  - Starting values from the 2026-10-08 measurements (notes): idle grace
    about 30 s, hold quantum about 5 min. A quantum of 5 min keeps a
    waiting seat's wait at a depth of 3 under qwen's 900 s
    streamIdleTimeoutMs even if a keepalive comment were not counted as
    activity.
  - The waiting happens inside the existing keepalive path (the worker
    thread around ~704), so a waiting stream is kept alive the same way.
  - The architect reviews the lease against the three invariants, and the
    handover rules for a holder whose client disconnects mid-request.

constraints: >
  A fake Ollama and a free port only: never the live shim on 11439, the
  live Ollama or the live shim log. The unit tests use an injected clock,
  never real sleeps; the acceptance handler may use short real waits
  (grace and quantum passed as options). The step handler lands with the
  feature (BL-233). A running shim is not restarted by a land: QA's live
  step restarts it.

out_of_scope: |
  - More than one slot: a second 73728-token context needs about 2.4 GB of
    KV that the 16 GB card does not have (notes); a later slice measures
    before it adds a count.
  - The standing forge pack and its gate (BL-2078).
  - Unloading or swapping weights per seat.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2077-one-decode-slot-on-the-host-held-by-a-seat-across-its-burst.feature`:
     5 of 5 ok (01, 02, 03 x2, 04).
  2. `node specs/pipeline/cli.js specs/features/BL-2076-the-tool-call-shim-names-the-seat-behind-every-chat-completion.feature`:
     4 of 4 ok.
  3. `bash swarmforge/scripts/test/test_bl1917_local_model_seat_url.sh`
     (no lane runs it; it runs the shim's unittest file, the invariants'
     property tests included): all PASS.
  4. After the land, at the next relaunch (stop the old shim first; the
     live pack is mono-router, one seat): `GET /shim/health` shows the
     slot with the live seat as holder and no waiters, and the seat's
     turns are not slower than before (invariant 3); record the health
     answer in the QA evidence.

