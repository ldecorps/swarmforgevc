id: BL-1753
title: "The night closing ceremony never starts a documenter session beside a mono-router resident - when rotate_to_role.sh refuses because the resident holds a parcel, the ceremony keeps asking for the rotate on every tick until the briefing's hard deadline and then takes BL-1641's deadline briefing path, instead of spawning the documenter through consult_spawn_cli.bb (ruling A, recommended; B forces the rotate)"
milestone: M8
type: defect
severity: medium
# medium: the ceremony's fallback breaks the pack's one-resident definition
# whenever a router pack runs at bedtime with the resident mid-parcel; this
# repo's night runs full-forge, so no live exposure here today. Not high:
# nothing is degraded, and BL-1641 already guarantees a briefing at the
# deadline.
status: todo
epic: local-llm-swarm
priority: 11
direction: human-directive
depends_on: []
mutation_cost: medium
# medium: TypeScript under Stryker - nightClosingCeremonyLive.ts (the pure
# machine) and night-closing-ceremony-run.ts (the executor, which carries
# first-run survivor debt owned by BL-1676). The change is small: drop one
