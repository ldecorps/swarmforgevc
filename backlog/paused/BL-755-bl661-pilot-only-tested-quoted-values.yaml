description: |
  ## What

  `take-flow-reason` has three distinct branches (double-quoted,
  single-quoted, unquoted) but every test this ticket added exercises
  only the double-quoted branch. Coder/cleaner/architect all praised the
  parsing-hazard tests that DO exist (quoted reasons with commas and
  braces) without noticing the other two branches had zero coverage.

  ## Question to answer

  When a ticket's own fix is a multi-branch parser, should a gate require
  at least one test per branch before landing — not just "some tests for
  the parsing hazard the ticket names"? Harden `/pilot`'s hardener-
  equivalent step to enumerate a new/changed function's branches (cond/
  case/if-else arms) and check each has at least one distinct test,
  rather than accepting coverage of the branch the ticket happens to
  narrate.
