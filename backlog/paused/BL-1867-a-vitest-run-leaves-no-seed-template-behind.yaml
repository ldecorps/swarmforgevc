id: BL-1867
title: "The BL-1039 shared-repo fixture seeds a new template on every copy and never removes it in a vitest worker: one test file of 11 tests leaves 11 bl1039-seed-template dirs, and /tmp held 445,231 of them on 2026-10-01 (about 76 GB and 18M of the root filesystem's inodes, growing about 40,000 a day); a process now seeds one template and a run leaves none behind"
milestone: M8
type: defect
severity: high
# high: a live fault degrading behaviour. At about 1.6M inodes a day
# against 45M free, the root filesystem runs out of inodes in about four
# weeks (swarm-down). Today every directory listing of /tmp costs about
# half a second, which is the cost behind BL-1866's standing red.
status: todo
