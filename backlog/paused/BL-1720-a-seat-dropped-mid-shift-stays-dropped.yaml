id: BL-1720
title: "A seat dropped mid-shift does not stay dropped: on 2026-09-24 the coordinator killed swarmforge-coder@2 and dropped its window from the pack (fe664164b0, 09:49Z), babysitterd resurrected it from the start-time roles.tsv at 09:53Z, and after the master roles.tsv was edited by hand (09:55Z) sessions.tsv and all eight worktree roles.tsv copies still listed coder@2 - so cleaner and architect kept addressing reverse-hop copies to it (three BL-1703 copies stranded in its inbox) and each one's wake landed in the specifier's pane (BL-1719); one retire operation takes a seat out of every roster copy, and nothing resurrects or addresses it afterwards"
milestone: M8
type: defect
severity: high
# high: a live fault degrading behaviour - an operator directive (drop a
# seat) cannot be carried out against a running swarm: killing the pane
# is undone by the babysitter within minutes, editing the conf changes
# nothing until the next launch, and a hand-edited master roster leaves
# every worktree sender addressing the gone seat. Not critical: nothing is
# lost; stranded copies are merge-only and the next full launch rewrites
# every copy.
status: todo
epic: swarm-reliability
priority: 6
direction: human-requested
depends_on: []
# No open ticket touches seat retirement or the worktree roster copies
# (grep of paused/ and active/, 2026-09-24). BL-1719 (the wake remap) is
# the sibling; neither depends on the other.
mutation_cost: medium
# medium: Babashka/shell only (no mutation/CRAP/DRY wired, BL-472): a
# retire verb that reuses swarmforge.sh's own roster writers
# (write_roles_file / write_sessions_file / the per-worktree cp at
# swarmforge.sh:1304) and kills the session; one feature over a fixture
# swarm on a private tmux server.
slice_size_envelope: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]

acceptance: specs/features/BL-1720-a-seat-dropped-mid-shift-stays-dropped.feature

