id: BL-1704
title: "The full-stack stop and kill_all_swarm stop the ollama server the swarm started, with its model runner children, leave a server the swarm found running (named in the stop log), and clear a stale record - dead pid or a pid now owned by something else - without signalling anything"
milestone: M8
type: feature
status: todo
epic: local-llm-swarm
priority: 2
direction: human-requested
depends_on: [BL-1703]
mutation_cost: low
# low: bash stop steps on BL-1703's lib (no Stryker lane); the Gherkin
# handler runs stand-in processes, seconds per run.
slice_size_envelope: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]

acceptance: specs/features/BL-1704-the-swarm-stop-paths-stop-the-ollama-server-the-swarm-started.feature

