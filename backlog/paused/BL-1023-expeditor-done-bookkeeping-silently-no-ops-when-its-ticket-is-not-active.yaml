id: BL-1023
title: "the expeditor's done-bookkeeping silently no-ops when its run ticket is not in backlog/active/, so a fully passed expedited ticket stays reading as un-started work"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarm-reliability
priority: 70
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1023-expeditor-refuses-a-run-ticket-it-cannot-bookkeep.feature

invariants:
  - "The expeditor never finishes a run reporting success while the ticket's backlog state is unchanged - either it moves the ticket or it says loudly that it could not."

source: |
  Found by the specifier stage of the BL-1021 expedited run, 2026-08-21, while
  checking that the run it was inside would actually complete its bookkeeping.
  BL-1021 had been written into backlog/paused/ and never promoted, because an
  expedited run has no coordinator to promote it.

description: |
  ## What happens

  `expedite_cli.bb` ends a passing run with:

      (when (and (= :done (:ticket staged)) (not (:dry-run? opts)))
        (move-ticket! root ticket "active" "done"))

  and `move-ticket!` is `(when-let [src (ticket-file project-root from ticket)] ...)`.
  If the run ticket is not in `backlog/active/`, `ticket-file` returns nil, the
  `when-let` body never runs, and the function returns nil. Nothing is logged,
  nothing fails, and the run reports success.

  The result is a ticket that has been specced, built, gated by all seven
  stages and landed - and still sits in `backlog/paused/` reading as work
  nobody has started. That is worse than a hard failure: the run's own summary
  says it passed, so there is no prompt to go looking.

  ## Why the state is reachable, not exotic

  It is the DEFAULT for an expedited run. `park-others!` moves every OTHER
  active ticket out to make room, but nothing ever moves the run ticket IN -
  promotion is a coordinator duty (Article 3.3) and the expeditor deliberately
  runs with the stack stopped and no coordinator. So an expedited ticket that
  was specced straight into `backlog/paused/` - the specifier's normal output
  location, per "New backlog items are proposals, not active work" - hits this
  on every run unless a human promoted it first.

  BL-1021 hit exactly this. It was moved to `active/` by hand mid-run so the
  bookkeeping would land.

  ## How (direction, not mandate)

  - Decide the ticket's location ONCE, up front, where the operator can still
    react: at initiation, not at teardown. A run whose ticket cannot be
    bookkept at the end should say so before it spends seven stages.
  - Either the expeditor adopts the ticket into `active/` as part of
    initiation (it already rearranges the backlog there - `park-others!` is
    the precedent), or it refuses to start. Adopting is likelier right: the
    expeditor is the whole stack for the duration, so there is no coordinator
    whose authority it would be usurping.
  - Whichever is chosen, `move-ticket!` must stop being able to fail silently.
    A no-op move is a fact the caller needs, not a nil to discard.

  ## Scope

  - swarmforge/scripts/expedite_cli.bb - `move-ticket!`, `park-others!`/initiation, teardown
  - swarmforge/scripts/expedite_lib.bb - if the decision is a pure planning step
  - specs/features/BL-1023-expeditor-refuses-a-run-ticket-it-cannot-bookkeep.feature and step handlers

  Out of scope: the park/unpark behaviour for OTHER tickets (correct today),
  the bounce and restart paths, and coordinator promotion in the normal live
  swarm.

qa_e2e_procedure: >
  1. At the parent commit, drive an expedited run (stage-runner seam, all
     stages seeded to pass) for a ticket that exists only in backlog/paused/.
     Confirm the run reports success AND the ticket is still in
     backlog/paused/ - the silent no-op. Confirm this before confirming it is
     gone.

  2. At the parcel commit, repeat. Confirm the run either moved the ticket to
     backlog/done/ or refused to start with a message naming the ticket and
     its actual location - and that in neither case does it report a silent
     success with the ticket unmoved.

  3. Confirm the existing behaviour is intact for the normal case: a run
     ticket already in backlog/active/ still ends in backlog/done/, and other
     active tickets are still parked to backlog/hold/ with a park-record.

notes: |
  IR-DRY reviewed, not merely run. The first draft scored 9 findings; two were
  real and are fixed - a `Then` had reused the `Given`'s filing-location
  phrasing, and "another ticket is filed as active" collided with the run
  ticket's own setup step. The remaining 4 are deliberate and should NOT be
  "fixed": `the run ticket is filed as <location>` / `... as active` /
  `... as paused` are one parameterized step meant to bind to ONE handler, and
  `the run completes` vs `the run completes as a dry run` are two genuinely
  different modes. Rewording either family to silence the checker would create
  MORE handlers, which is the opposite of what IR-DRY is for.

  Sibling of BL-1021 only by discovery, not by mechanism - no dependency
  either way. BL-1021 worked around it by hand; this ticket removes the need
  for the workaround.

  Watch the dry-run path when fixing: `park-others!` already guards its writes
  with `dry-run?`, and any adopt-at-initiation step must do the same or a
  dry run will start mutating the backlog.
