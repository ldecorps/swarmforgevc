description: >
  BL-967 landed (QA pass a5ecfc281, main 2026-08-20T05:44:55Z; closed
  999b9fe72) with its qa_e2e step 3 explicitly recorded by QA as
  "owed, not passed" - by its own wording it is only runnable AFTER
  the parcel lands and the daemon restarts on it (QA evidence
  backlog/evidence/BL-967-qa-pass-20260820.md: "Whoever observes the
  daemon after this lands should check those two files"). The
  documenter flagged that no ticket tracked the owed observation
  (note 20_20260820T054749Z_000227); this chore is that tracking
  artifact. Step 4 (BL-789's slow-but-healthy posture preserved) is
  the same observation's other half and rides along.

  The work (verification only - no code): observe a 30-minute window
  of post-fix daemons and record the verdict in an evidence file
  this ticket's acceptance scenarios gate. PASS: zero new handoffd
  entries in .swarmforge/daemon/freshness-incidents.log in the
  window, handoffd.log showing completed heartbeat cycles (boundary
  lines appear on heavy cycles only), and no kill of a
  legitimately-slow 120-232s cycle. FAIL: any handoffd freshness
  restart or attributed in-cycle timeout in the window - then
  BL-967's own step-3 branch applies: the G6 timeout line names the
  guilty sweep and call; record that as the identified cause and
  mint the follow-on defect naming it.

  Window facts (CORRECTED at mint+6min by the coordinator's
  independent precondition check, evidence commit 9fe9d3a74, and
  re-verified by the specifier): the daemon runs from the MASTER
  checkout's local main, which at 05:50Z was 27 commits BEHIND
  origin/main and did NOT contain the fix - the 05:50:19Z daemon
  (pid 96980) loaded PRE-fix code (running sha 22544178a), despite
  the fix being on origin/main since 05:44:55Z. The specifier's
  original pin of that daemon as post-fix was WRONG (the
  local-main-lags-origin lesson, live). Local main took origin/main
  by ~05:56Z (a5ecfc281 now an ancestor; cycle-guard code present
  in the checkout). The soak window therefore opens at the FIRST
  handoffd start in daemon-start-audit.log AFTER the local-main
  merge that brought in a5ecfc281 - QA must pin that start (and,
  where determinable, verify the running daemon's loaded sha
  post-dates the fix) rather than trusting any earlier pin. Every
  restart before that point - including 05:26:40 / 05:38:01 /
  05:44:02Z and the 05:50 flap - killed or started PRE-fix daemons
  and must NOT count against the soak. The observation is log-based
  and retro-evaluable: freshness-incidents.log and
  daemon-start-audit.log persist across restarts; handoffd.log
  truncates per restart, but a truncation implies a restart, which
  the persistent logs already witness.

  Also observed at mint, NOT this chore's scope: the fresh daemon's
  first cycle opened with a 12-line chase-wake-skip-busy burst
  across four roles in ~6 seconds - that is BL-970's classifier
  surface (pending approval), recorded here only so the soak
  reviewer does not mistake skip-busy noise for a stall by itself.

constraints: >
  - Verification only: this chore changes no code, no config, no
    daemon state. It reads logs and writes one evidence file (plus
    the follow-on mint request if the verdict demands one).
  - Routing (coordinator): required_stages is [qa] - route this
    directly to QA; there is nothing for coder/cleaner/architect/
    hardender/documenter to do, and the verdict authority is QA's
    (it recorded the debt). If direct-to-QA routing is unsupported
    on this pack, route to QA via a Work note rather than walking
    the full chain.
  - Do not re-litigate BL-967's gates: they all ran and passed; only
    steps 3-4 were owed.
  - Pre-fix incidents (the 05:26/05:38/05:44Z restarts) are context,
    never counted in the window.

qa_e2e_procedure: >
  1. Establish the window start from daemon-start-audit.log: the
     first handoffd claim AFTER the master checkout's local main
     merged origin/main containing a5ecfc281 (~05:56Z; confirm the
     merge commit's time yourself - the 05:50:19Z start was PRE-fix,
     see the corrected window facts).
  2. Confirm the swarm was active during the window (roles working;
     an idle-swarm window proves little - extend or choose a later
     30-minute active window if needed).
  3. Read freshness-incidents.log for handoffd entries with epoch
     inside the window: zero -> PASS half 1. Any entry -> FAIL path.
  4. Read handoffd.log (current daemon) for completed heartbeat
     cycles; on heavy cycles, per-sweep boundary lines. An attributed
     timeout line names sweep+call -> record as identified cause.
  5. Step-4 half: confirm no kill of a slow-but-healthy cycle
     (120-232s legit range, BL-789) occurred in the window.
  6. Write backlog/evidence/BL-975-soak-<date>.md with: window
     start/end epochs, daemon pids observed, incident delta, cycle
     evidence, verdict PASS or the attributed cause + the follow-on
     ticket id requested from the specifier. Acceptance scenarios
     01-02 gate this file's content.

