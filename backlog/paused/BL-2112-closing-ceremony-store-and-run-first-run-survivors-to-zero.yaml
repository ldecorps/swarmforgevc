description: |
  ## What is wrong

  BL-2009's hardener ran the deferred BL-1968 mutation pass over
  closingCeremonyRun.ts, closingCeremonyStore.ts and closingCeremony.ts
  on 2026-10-10 (evidence backlog/evidence/BL-2009-mutation-20261010.md,
  hardender branch, per-mutant list in it): 742 tested, 579 killed, 145
  survived, 18 never covered, all first-run debt on code BL-1968 landed.
  This slice owns 48 (48 survived, 0 never
  covered). Census by enclosing declaration (survived/no-coverage),
  counted by the specifier from that list against main's
  extension/out with BL-1519's census method:
  closingCeremonyStore: isCeremonyRunShape 9/0, recordCeremonyOutcome 9/0, listCeremonyRuns 6/0, isValidFoldedLineCounts 5/0, recordCeremonyAdjustment 5/0, ceremonyDir 3/0, readCeremonyRun 2/0, writeCeremonyRun 1/0; closingCeremonyRun: readPackConfText 6/0, runClosingCeremony 2/0.

  The survivors sit in the store's shape guards (isCeremonyRunShape, isValidFoldedLineCounts: each field's type and bound), the outcome and adjustment recorders' refusal messages and branches, the run-list filter and sort, and readPackConfText's fallback text.

  ## What is wanted

  - The run over the full unit suite, `--mutate out/metrics/closingCeremonyStore.js,out/metrics/closingCeremonyRun.js`, is
    repeated at the parcel commit; the evidence records the summary
    block, load and duration, and per declaration above either zero
    survived and zero no-coverage or one accepted-equivalent record per
    remaining mutant with the code-level reason (BL-234).
  - Behaviour tests kill the rest, grouped by the census's declarations.
  - The evidence lists, per declaration, the test file and case that now
    rejects its mutants (scenario 02).
  - Any function `npm run crap` flags above 6 in these declarations comes
    under 6 (coverage first; a small refactor only where coverage cannot
    reach).
  - Evidence path: backlog/evidence/BL-2112-mutation.md.

  ## How (direction, not mandate)

  - perTest, sibling links per the Verification rules; check
    mutation_cooldown_gate.bb first and record its decision.
  - Extend the fixtures test/closingCeremonyStore.test.js test/closingCeremonyRun.test.js already build; never a wall clock,
    never process.chdir().
  - The step handler bl2112ClosingCeremonyStoreRunSurvivorsSteps.js reads the parcel's evidence file
    and lands with the feature, registered in specs/pipeline/steps/index.js
    (BL-233).

constraints: >
  Tests only unless a seam is missing, in which case the smallest
  extraction that exposes the behaviour to an in-process test; never a
  hand-edited manifest. The census is re-derived at the parcel's start if
  the file changed since 2026-10-10.

out_of_scope: |
  - Mutants in the other closing-ceremony declarations (BL-2112, BL-2113,
    BL-2114 split the 163 between them).
  - Any change to what the ceremony decides.

qa_e2e_procedure: |
  On the parcel commit, ONE run (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-2112-closing-ceremony-store-and-run-first-run-survivors-to-zero.feature`: 2 of 2 ok.
  2. Read from the gather's unit row: test/closingCeremonyStore.test.js test/closingCeremonyRun.test.js green with the new
     cases.
  3. Read the parcel's evidence: Stryker totals over the full unit suite
     with at least 240 mutants, and per census declaration
     survived 0 and no-coverage 0, or each remainder with its reason.
     QA starts no mutation run.

