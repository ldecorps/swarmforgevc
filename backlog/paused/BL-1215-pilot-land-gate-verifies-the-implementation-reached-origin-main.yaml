  - BL-701 stage-boundary orphan cleanup and the /tmp + worktree leftover
    half of that checklist — a different gap, not this one.
  - Verifying BL-1191 itself.
  - Making the land happen (pushing). Verification only.

invariants:
  - "A piloted ticket reaches backlog/done/ only when its implementation commit is reachable from origin/main."
  - "An origin/main that cannot be read is treated as not-landed, never as landed."

