id: BL-2103
title: "Shim ensure replaces a running shim older than its code: local_model_tool_call_shim.py ensure reuses any process whose /shim/health names the shim and the upstream, whatever code it runs, so a shim started before BL-2076 survived the 2026-10-09 relaunch and the coder seat's every wake failed '404 page not found' on the new /seat/coder/v1 route until QA killed it by hand - ensure reuses only a shim running the code on disk and replaces any other"
