description: |
  ## Status: hotfix c416adc5fb landed the fix

  This parcel is its stamp-off: review it, do not re-apply it.

  ## What was wrong, and what the hotfix changed

  After a stale-build restart the front desk's poll heartbeat was over
  90 s old, so the cursor bridge's dead-feeder fallback (BL-1253,
  2ec06b6ef1) took getUpdates on the shared token. The front desk's polls
  then failed with 409, its backoff grew to the 60 s cap, a contested
  request plus the wait ran past 90 s, and the heartbeat never came back
  fresh: the bridge never handed the token back, and the supervisor
  killed the bot as stalled about every 5 minutes until it gave up for 15
  (06:59, 08:00 and 09:14Z on 2026-10-07). Every update in between reached
  the bridge, which answers the callback query and drops an approve: or
  reject: tap it has no route for. The human's taps on BL-2058 and
  BL-2059 recorded nothing.

  In extension/src/tools/telegramFrontDeskBotCore.ts the hotfix adds
  `POLL_CONFLICT_BACKOFF_MAX_MS` (5000) and `decidePollFailureDelayMs`,
  which caps the backoff at 5 s when the poll error carries a 409 and
  keeps the full backoff for any other error; `runPollCycle`'s failure
  delay goes through it. extension/test/telegramFrontDeskBotCore.test.js
  gains three cases. No bridge or supervisor change.

  ## What the coder does (all of it)

  1. Read `git show c416adc5fb` against the section above. Confirm the
     only production change is the new constant, the new function and the
     one call site in runPollCycle, and that a 409 is the only error the
     cap applies to.
  2. Run telegramFrontDeskBotCore.test.js once, alone, and the BL-1036 and
     BL-582 features once each, with output under tmp/.
  3. Write backlog/evidence/BL-2060-coder-<date>.md with the review result
     and the run results, and commit it.

  ## What the hardener does

  A Stryker pass scoped to the hotfix's lines (Stryker's
  `out/tools/telegramFrontDeskBotCore.js:<start>-<end>` mutate form,
  over decidePollFailureDelayMs and runPollCycle's delay line), not the
  whole file: the file's first-run debt is BL-1519's. Every mutant on
  those lines is killed or recorded as an accepted equivalent with its
  code-level reason.
