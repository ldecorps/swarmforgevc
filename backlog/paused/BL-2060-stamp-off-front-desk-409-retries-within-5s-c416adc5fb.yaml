description: |
  ## Status: hotfixes c416adc5fb and 4453766c28 landed the fixes

  This parcel is their stamp-off: review them, do not re-apply them.

  ## What was wrong

  The front desk and the cursor bridge share one bot token, so only one
  of them may call getUpdates. start_cursor_bridge.sh decided
  CURSOR_BRIDGE_INBOUND_QUEUE once, at start, from the front-desk
  heartbeat, and cursor_bridge_supervisor.bb handed that value to every
  bridge it respawned. The live supervisor started on 2026-10-06 at 19:45
  local, during the swarm death, with the front desk down, so it carried
  0 from then on. "0" forces getUpdates even with a live front desk: the
  token had two pollers for 14 hours, every front-desk poll failed with
  409, the supervisor killed the front desk as stalled about every 5
  minutes, and every approval tap that reached the bridge was answered
  and dropped. The human's taps on BL-2058 and BL-2059 recorded nothing.

  ## What the hotfixes changed

  1. c416adc5fb, extension/src/tools/telegramFrontDeskBotCore.ts: adds
     `POLL_CONFLICT_BACKOFF_MAX_MS` (5000) and
     `decidePollFailureDelayMs`, which caps the backoff at 5 s when the
     poll error carries a 409 and keeps the full backoff for any other
     error; `runPollCycle`'s failure delay goes through it, so the
     heartbeat stays under 90 s through a conflict.
     extension/test/telegramFrontDeskBotCore.test.js gains three cases.
  2. 4453766c28: start_cursor_bridge.sh still decides the flag and says
     so (BL-1253 scenario 04 unchanged) and now marks its decision
     `CURSOR_BRIDGE_INBOUND_QUEUE_SOURCE=auto`;
     cursor_bridge_supervisor.bb forwards the marker; in
     extension/src/tools/telegramCursorBridgeCore.ts
     `shouldUseCursorBridgeInboundQueue` ignores an auto-marked flag, so
     the per-poll feeder liveness decides (queue while the front desk is
     live, getUpdates only while it is dead). An operator's explicit 0 or
     1 keeps its meaning. extension/test/telegramCursorBridgeCore.test.js
     gains three cases.

  ## What the coder does (all of it)

  1. Read `git show c416adc5fb` and `git show 4453766c28` against the
     section above. For c416adc5fb, confirm the only production change is
     the constant, the function and the one call site, and that a 409 is
     the only error the cap applies to. For 4453766c28, confirm an
     explicit 0 or 1 still forces its mode (no SOURCE marker, or a marker
     other than auto) and that the start script's stderr still names its
     decision.
  2. Run the four unit test files once each, alone, the four features in
     the procedure once each, and the shell test and bb runner once each,
     with output under tmp/.
  3. Write backlog/evidence/BL-2060-coder-<date>.md with the review
     result and the run results, and commit it.

  ## What the hardener does

  Scoped Stryker passes over each hotfix's TypeScript lines only
  (`out/tools/<file>.js:<start>-<end>`): decidePollFailureDelayMs and
  runPollCycle's delay line; shouldUseCursorBridgeInboundQueue's
  auto-marker branch. The files' first-run debt is BL-1519's. A
  hand-mutant pass over cursor_bridge_supervisor.bb's forwarding line and
  start_cursor_bridge.sh's marker lines, each run against
  cursor_bridge_supervisor_test_runner.bb and
  test_start_stop_cursor_bridge.sh.

  ## What the documenter does

  docs/how-to/BL-1253-swarm-stamp-dead-feeder-owns-getupdates.md (the
  start-script default line), docs/how-to/BL-764-front-desk-shared-token-bridge-fanout.md
  (the `CURSOR_BRIDGE_INBOUND_QUEUE=0|1` bullets) and
  docs/reference/Specification.MD's BL-1253 entry say what is true after
  4453766c28: the start script's own decision is marked auto and yields
  to the per-poll feeder liveness; only an explicit 0 or 1 forces a mode.
