human_approval: approved
approval_context: >
  The human asked for it in the specifier pane (source) and answered both
  choices put to them there: "Real work, then lab (Recommended)" and
  "Command-line report (Recommended)". This slice is the first half of
  "real work": the record the report (BL-1851) groups by. No choice is
  left open. FIRM: recording never stops or delays a seat's start by more
  than 3 seconds. FIRM: no credential value is ever written to the record.

invariants:
  - "Recording a seat's settings never stops its start: any failure is logged, the seat starts, and the recorder takes at most 3 seconds."
  - "The settings record never holds a credential value: apiKey and every key naming a token, secret or password are dropped before writing."

source: |
  The human, 2026-09-30 ~20:15Z, specifier pane, verbatim:

  > can iq3 be instrumented so we canundertand how to better tweak it?

  Answers to the two questions the specifier put in the same pane:
  "How should iq3 be measured for tuning?" -> "Real work, then lab
  (Recommended)"; "Where should the tuning results show up?" ->
  "Command-line report (Recommended)".

  The human, 2026-09-30 ~20:45Z, specifier pane, verbatim:

  > note that I reduced the card power from 180W to 150W about 15 minutes ago, that might have a negative impact of iq3 performance

description: |
  ## Why

  The seat's records already say what each request did: qwen's session
  file carries every `qwen-code.api_response` (ttft_ms, duration_ms,
  input, output and thinking tokens), every `qwen-code.tool_call` (name,
  duration, success) and every `chat_compression`. None of it says which
  settings were in force. On 2026-09-30 the window, the KV cache, the
  Modelfile's num_predict and the card all changed within a few hours, and
  the before/after reading had to be rebuilt by hand from timestamps
  (`backlog/evidence/iq3-window-vram-census-20260930-specifier.md`).

  ## What is wanted

  `bb swarmforge/scripts/local_seat_settings_snapshot_cli.bb <root> --seat <seat> --model <model> --endpoint-url <url> --card <prompt file> --worktree <seat worktree>`
  appends one JSON row to `.swarmforge/local-agent/seat-settings/<seat>.jsonl`:
  - `at` (ISO time), `seat`, `model`;
  - from Ollama: `/api/version`, and `/api/show`'s `parameters` parsed to
    a map (num_ctx, num_predict, temperature, and whatever else it lists)
    and `details.quantization_level`. When Ollama does not answer within 2
    seconds, these are recorded as unknown (scenario 04);
  - from qwen: its version, the provider entry qwen will use for the
    model (the seat worktree's `.qwen/settings.json` replaces the user
    list when it carries one, per QA's BL-1838 reading), and any chat
    compression settings, all with credentials dropped (scenario 03);
  - the card: path, bytes, sha256;
  - the GPU: name, enforced power limit and default power limit, from
    `nvidia-smi --query-gpu=name,enforced.power.limit,power.default_limit
    --format=csv,noheader` within 2 seconds, else unknown (a host with no
    NVIDIA tool, macOS among them) (scenarios 01, 04);
  - `fingerprint`: sha256 of every field above except `at` (scenario 02).

  The same command run by hand appends a row the same way. The how-to
  says to run it after changing a setting outside the swarm, such as the
  GPU power limit, so BL-1851 can split the requests before and after.

  Every local-model seat's generated launch script runs it before qwen
  starts, `|| true` and bounded, so a start is never held (invariant 1).
  How Ollama actually served the model (layers on the GPU, KV cache type,
  flash attention) is not known at start, because the model loads on the
  first request. BL-1851 reads it per session from the Ollama log.

  ## How (direction, not mandate)

  - Pure lib (parse /api/show parameters, pick the provider entry,
    sanitise, fingerprint) plus thin CLI; HTTP and paths are arguments
    with seams (`--qwen-home`, default `~/.qwen`) so fixtures never read
    the operator's `~/.qwen` or the live Ollama.
  - The launch-script line mirrors BL-1775's identity line: written by
    swarmforge.sh for `local-model` seats only, run on every execution.
  - Step handler `specs/pipeline/steps/bl1850SeatSettingsRecordSteps.js`,
    discovered from its own file (BL-1371), fixtures under mkdtemp, a stub
    HTTP server on an ephemeral port for Ollama.

  ## Scope

  The lib, CLI and bb test; the swarmforge.sh line and a shell test in the
  shape of `test_bl1838_qwen_provider_entry_via_launch_script.sh` proving
  a generated local-model launch script runs the snapshot before qwen and
  a non-local seat's does not; the step handler; docs; evidence.

qa_e2e_procedure: |
  On the parcel commit, ONE run each (2026-09-17 rule).
  1. `node specs/pipeline/cli.js specs/features/BL-1850-a-local-model-seat-records-the-settings-it-starts-with.feature`:
     8 of 8 ok (01, four rows of 02, 03, two rows of 04). Measured 0 on main at mint:
     no handler exists yet.
  2. The bb test for the lib, and the new launch-script shell test:
     ALL PASS.
  3. Live, into a scratch root: run the CLI once with a mkdtemp `<root>`,
     the real endpoint `http://127.0.0.1:11434`, `--model
     ista-iq3s-coder:latest`, `--card .swarmforge/prompts/coder@iq3.md`
     and `--worktree .worktrees/coder-iq3`. The row carries num_ctx 49152,
     num_predict 4096, Ollama 0.32.15 and whatever power limit
     `nvidia-smi` reports at the time (150 W against a 180 W default at
     amendment), and `grep -ci apikey` on the row finds no value.
  After the land (the coordinator's check, not QA's): a launch script
  runs the new line only once it is regenerated (`./swarm ensure`), so
  after the next coder@iq3 respawn,
  `.swarmforge/local-agent/seat-settings/coder@iq3.jsonl` has a row.

