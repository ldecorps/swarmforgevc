id: BL-1850
title: "A local-model seat records the settings it starts with - every start of a local-model seat appends one row to .swarmforge/local-agent/seat-settings/<seat>.jsonl with the model's Ollama parameters and version, qwen's provider entry for the model (never a credential), the card's size and sha256, the GPU's power limit, and a fingerprint that changes only when a setting does, so a change in the seat's behaviour can be tied to the setting that changed"
