description: |
  ## What is wrong

  These closed tickets' acceptance features have no step handler at all.
  Run, every scenario fails with "no step handler matched". Each holds a
  register row, and the register's size throttles intake until it is back
  to 10 rows (Article 3.5). Scenarios that were unwireable, superseded or
  never built were retired on 2026-10-04 (evidence above); what remains
  describes behaviour that ships.

  ## What is wanted

  One step-handler file per feature, binding every remaining step as
  written, so each feature passes against the shipped code:

  - `specs/features/BL-699-pilot-quality-bounce-backs.feature` (4 scenarios): composePilotExpeditorPrompt (pure) + the expedite-lock gate on a mkdtemp lock; S.
  - `specs/features/BL-700-pilot-telegram-status-posts.feature` (1 scenarios): formatPilot*Status helpers (scenario 04); S.
  - `specs/features/BL-701-pilot-orphan-cleanup-stage-boundaries.feature` (1 scenarios): the STAGE-BOUNDARY CLEANUP block of the pilot prompt (scenario 01); S.
  - `specs/features/BL-704-operator-shifts-holidays-docs.feature` (2 scenarios): holiday refusal via handleInboundDecision (M) and the shift/holiday round-trip via executeOperatorVerb (S).
  - `specs/features/BL-705-lets-talk-more-chiptunes.feature` (1 scenarios): getLetsTalkChiptunesCatalog (chip-01); S.

  ## How (direction, not mandate)

  - Drive compiled modules (`extension/out/...`) and scripts in-process,
    the way the sibling handlers named above do. Build fixtures under
    mkdtemp; prove a fixture repo with `rev-parse --git-common-dir` before
    any mutating git command.
  - These step texts are often generic. Register them with `defineScoped`
    under each feature's own `Feature:` name, so they never answer another
    feature's steps (BL-1277). The collision guard in the unit lane must
    stay green.
  - A scenario that fails on its merits once bound is a real defect in
    shipped behaviour. Send the specifier a note naming the scenario and the
    observed value, and keep binding the rest. Never edit a scenario to pass.
