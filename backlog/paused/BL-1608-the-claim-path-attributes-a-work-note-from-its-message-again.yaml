description: |
  ## What is wrong

  `specs/features/BL-1185-work-note-missing-task-header-defers-hard-seat.feature`
  scenario 02 fails on main (specifier run 2026-09-16, 37 s, 3 pass 1
  fail):

  ```
  Scenario "the hard seat claims an ambulance patient Work note when easy is idle" failed at step "Then the Work note is claimed rather than skipped as defer-better-fit": hard should claim Work note; out=NO_TASK
  new=10_work_1789583561812.handoff in_process=
  ```

  The coder's BL-1602 sweep found the same single failure before and
  after the audit-helper change and raised it as its own unowned-red note
  (`00_20260916T182510Z_002003_from_coder_to_specifier_coordinator`,
  `.worktrees/coder/backlog/evidence/BL-1602-coder-20260916.md` "BL-1185
  note"): this driver's drafts are `type: note`, which the self-audit
  never gates, so it is not BL-1602's class. The specifier's census had
  flagged it "same class by structure, confirm in the sweep"; the sweep
  said no.

  Mechanism (read, not guessed): `difficulty-allows-claim?`
  (`swarmforge/scripts/ready_for_next_task.bb:92-108`) computes
  `cost (mutation-cost-for-task (handoff-lib/header-field handoff-file "task"))`.
  A Work note carries no `task:` header (task is git_handoff-only,
  `swarm_handoff` validation), so the cost is nil, and
  `seat-difficulty-lib/difficulty-claim-decision` on a hard seat with an
  idle easy sibling answers defer-better-fit; the note stays in `new/`
  and the seat prints NO_TASK. That is the fault BL-1185 fixed on
  2026-08-27 (8fa2a5c2fb) with `task-name-for-difficulty`: prefer the
  task header, else `supersede-lib/task-name-from-content` on the note
  (the `Work BL-...` message). BL-1167's land the same afternoon
  (ccc63d8cfd, "bypass tier routing when stage seats share the same
  model") rewrote the predicate's signature and replaced that call with
  the bare header read - the diff removes `task-name-for-difficulty`
  outright, one commit after 465281d90d's architect pass said "keep
  BL-1185 attribution". A merge that silently reverts already-landed work
  (BL-571/BL-958); nothing ran BL-1185's feature again until today.
  `apply-effort-for-task!` (line 65, BL-1316) reads the same bare header
  at the claim moment, so a claimed Work note also applies no
  ticket-specific effort.

  ## What is wanted

  - One shared attribution in `ready_for_next_task.bb` - `claim-task-name`
    - that returns the `task` header when present, else the `Work BL-...`
    ticket slug from the note's message (`supersede-lib/task-name-from-content`,
    the same reader BL-1185 used), else nil; both `difficulty-allows-claim?`
    and `apply-effort-for-task!` resolve the task through it, and neither
    reads the header directly for a cost (scenario 01, source-level, with
    the call-site count pinned; scenario 02 drives the function on three
    handoff shapes).
  - BL-1185's feature resolves 4 of 4 on the parcel (e2e; it is this
    ticket's register row), and BL-1001, BL-1004 and BL-1167 stay green.
  - A bb unit test in `swarmforge/scripts/test/` for the shared
    attribution (the three shapes of scenario 02), the lane's only gate
    for Babashka (engineering.prompt: no mutation/CRAP/DRY wired).
  - The register row for BL-1185's feature removed in the same land, with
    `bb swarmforge/scripts/standing_red_register_cli.bb .` reporting no
    row for it and `"unowned":[]`.

  ## How (direction, not mandate)

  - Restore the eight lines ccc63d8cfd removed (see `git show ccc63d8cfd
    -- swarmforge/scripts/ready_for_next_task.bb`), under the name
    `claim-task-name`, and call it at lines 65 and 97 in place of
    `(handoff-lib/header-field handoff-file "task")`. Line 229's
    `claim-task` and line 359's `:task` feed the rework-claim decision
    (BL-1004, git_handoff parcels only) and are not cost readers - leave
    them.
  - Scenario 01's handler reads the script and asserts: both function
    bodies contain `claim-task-name`; the literal
    `mutation-cost-for-task (handoff-lib/header-field` is absent; the
    count of `(claim-task-name ` call sites is exactly 2 (BL-1445: a
    census, not a hope). Scenario 02's handler writes three fixture
    handoff files and calls the function through `bb -e` with the script
    loaded, about a second each.
  - Test: `swarmforge/scripts/test/ready_for_next_claim_task_name_runner.bb`
    (the `seat_difficulty_lib_test_runner.bb` shape).
  - Documenter: `docs/how-to` page for seat difficulty routing (BL-1001)
    or handoff-protocol.md's Work-note section says a Work note's ticket
    is attributed from its message at claim time; no diagram trigger.

constraints: >
  swarmforge/scripts/ready_for_next_task.bb, one bb test runner, the
  feature and its handler, evidence; no change to seat_difficulty_lib.bb,
  supersede_lib.bb, handoff_lib.bb or any feature file other than this
  ticket's own; no task header written onto any note. The step handler
  lands with the feature (BL-233). Evidence named BL-1608-*.

