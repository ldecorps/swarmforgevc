qa_e2e_procedure: |
  On the parcel commit, from the repo root:
  1. `./specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1185-work-note-missing-task-header-defers-hard-seat.feature`
     -> 4 pass, 0 fail (the failing step above is gone).
  2. The same for `specs/features/BL-1001-*.feature`, `BL-1004-*.feature`,
     `BL-1167-*.feature` -> all green (BL-1602's audit fix must be on the
     parcel's base for these; merge main first).
  3. `./specs/pipeline/scripts/run_acceptance.sh specs/features/BL-1608-*.feature`
     -> both scenarios green.
  4. `bb swarmforge/scripts/test/ready_for_next_claim_task_name_runner.bb` -> green.
  5. `grep -n 'header-field handoff-file "task"' swarmforge/scripts/ready_for_next_task.bb`
     -> only the rework-claim sites (no line inside difficulty-allows-claim?
     or apply-effort-for-task!).
  6. After landing, `bb swarmforge/scripts/standing_red_register_cli.bb .`
     reports no row for BL-1185's feature and `"unowned":[]`.

