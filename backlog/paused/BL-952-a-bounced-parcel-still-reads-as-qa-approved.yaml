id: BL-952
title: "QA approval is inferred from swarmforge-QA ancestry, so a parcel QA BOUNCED still reads as approved and rides onto main under the next landing — BL-945's twice-bounced code is live on origin/main now"
milestone: M8
type: defect
severity: high
status: todo
epic: swarm-reliability
human_approval: approved
priority: 15
direction: swarm-surfaced
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-952-a-bounced-parcel-never-reads-as-qa-approved.feature

invariants:
  - "A parcel QA bounced never reads as QA-approved until QA actually approves it, whatever refs its commits are reachable from."
  - "Every consumer of the approval predicate gets the same answer from one definition; no consumer keeps a private notion of approved."
  - "An undeterminable verdict fails CLOSED - refuse to publish and report the cause. Unknown is never approved."

description: >
  `qa-ancestor?` (`swarmforge/scripts/handoffd.bb:2477`) is documented as "the
  ONE definition of 'is <sha> a QA-approved tip'", and it is exactly one thing:

    git merge-base --is-ancestor <sha> swarmforge-QA

  But QA merges a parcel into `swarmforge-QA` in order to REVIEW it. A parcel
  QA then BOUNCES stays reachable from that ref, so it keeps reading as
  approved forever. The predicate cannot tell "QA approved this" from "QA
  merged this to look at it and rejected it".

  The only thing that removes a bounced commit from the ref is the manual
  revert required by the constitution ("A Bounce Must Be Reverted Out Of The
  Bouncing Branch", BL-490/BL-495). So the publish gate silently inherits
  whether a human remembered that step, and fails OPEN when they did not.
  That is a safety gate whose correctness rests on the discipline it exists
  to backstop.

  Measured on main 2026-08-19, live right now:

  - 12:00:24 QA merges BL-945's documenter parcel into the QA ref
    (`57bf1d6f2`).
  - 12:22:05 QA BOUNCES it (`65e0154ed`, "raw mkdtemp bypasses shared tmpDir
    helper"). No revert follows - `git log --grep=revert` over the window
    shows none.
  - 12:23 and 12:39 QA lands BL-943 and BL-942 and pushes. BL-945's commits
    ride along.
  - Result: `0bfd52db4` ("BL-945: land docs/branding/icon-system.md ... and
    gate future dangling doc citations") is an ancestor of BOTH `main` and
    `origin/main`. `docs/branding/icon-system.md` and
    `specs/pipeline/steps/lib/constitutionDocCitations.js` are live on
    `origin/main`.
  - BL-945 itself is still `backlog/active/`, bounced twice, and its current
    documenter->QA hop is sitting UNPROCESSED in QA's `inbox/new`
    (`00_20260819T121439Z_000197`). Unreviewed code is published; the ticket
    that owns it has no approval.

  Confirmed directly: `git merge-base --is-ancestor 57bf1d6f2 swarmforge-QA`
  and the same for `0bfd52db4` both return true. The bounced parcel reads as
  approved to every consumer of the predicate.

  How (direction, not mandate): approval wants to be a POSITIVE, durable
  record of a verdict rather than an inference from reachability - QA already
  writes bounce commits and `bounce_history`, so the verdict exists, it is
  just not what the gate consults. An alternative is to make the BL-490/BL-495
  revert verified rather than trusted, failing loud when a bounced parcel is
  still reachable from the QA ref. Either closes it; the choice is the coder's
  and architect's. What must not survive is "reachable from swarmforge-QA"
  standing alone as the definition of approved.

constraints: >
  Out of scope:

  - BL-631 (active). Its invariant is "reachable from `main` but NOT from
    `swarmforge-QA` is a violation", which is correct for the class it
    watches - work that bypassed QA entirely - and is BLIND to this one by
    construction, because these commits ARE reachable from `swarmforge-QA`.
    Different violation class, different predicate. Do not widen BL-631 to
    cover this; that ticket is in flight and rewriting an active ticket's
    YAML is the staleness failure BL-317/BL-325 exist for. The two detectors
    should compose, not merge.
  - Reverting BL-945's already-published commits. The constitution's explicit
    exception applies: already an ancestor of `main` -> do NOT revert, report
    the breach. Disposition of the landed code is the operator's call, noted
    below.
  - Re-litigating where a bounce-fix re-enters the pipeline. That is a
    separate open question with the operator; this ticket holds whatever the
    answer turns out to be, because a bounced parcel must not read as
    approved under any routing rule.
  - Changing what QA reviews or how it decides. This is about how a decision
    already made is READ by the publish path.

qa_e2e_procedure: >
  From the repo root:

  1. Reproduce before the fix, from durable git data only:
     `git merge-base --is-ancestor 57bf1d6f2 swarmforge-QA` and
     `git merge-base --is-ancestor 0bfd52db4 swarmforge-QA` both exit 0,
     while BL-945 sits in `backlog/active/` with no approval. That is the
     defect in one line - a bounced parcel reading as approved.
  2. At the parcel commit, drive the publish gate over a fixture repo whose
     QA ref contains one bounced-and-unreverted parcel plus one genuinely
     approved parcel. The gate must REFUSE and name the bounced parcel.
  3. Same fixture with the bounced parcel properly reverted, or its verdict
     recorded as approved: the gate must ALLOW.
  4. Confirm invariant 3: for each undeterminable case in scenario 04
     (unresolvable commit, missing record, corrupt record) the gate refuses
     AND reports the cause. A bare refusal with no cause fails this step, and
     so does any case that reads unknown as approved.
  5. Confirm invariant 2: ask every consumer of the predicate about the same
     bounced parcel - the handoffd publish gate and
     `swarmforge/scripts/check_pipeline_code_on_main.sh`, which shells the
     same `is_qa_ancestor.sh` - and confirm they agree it is NOT approved.
     A consumer still answering "approved" means the change landed in one
     call site only.
  6. Prove non-vacuity: restore the ancestry-only predicate and confirm
     scenario 01's `bounced` row and scenario 02 both fail, then revert. A
     fix whose bounced-row still passes under the old predicate is not
     testing the defect.
  7. Confirm no legitimate landing regressed: a normal approved parcel
     publishes exactly as before (scenario 03), and the existing gate suites
     from BL-629/BL-630/BL-855/BL-925 stay green with no test weakened.

notes: >
  Source: coordinator note to specifier, priority 00, 2026-08-19 12:33
  (`00_20260819T123347Z_000573_from_coordinator`): "0bfd52db4 (BL-945,coder)
  landed test/guard code on main, no QA lineage".

  The report is correct in substance, and probing sharpened the mechanism
  rather than overturning it. Two things the note's wording could mislead a
  reader on, both worth stating:

  First, this was not a coder committing to `main`. The commit is authored in
  the coder's worktree with byline "By coder." and travelled the normal chain
  (coder -> cleaner -> architect -> hardener -> documenter -> QA). It reached
  `main` through QA's own branch, carried by later landings. Nobody bypassed
  the pipeline; the gate approved something it should have refused.

  Second, one hypothesis was raised and DISPROVED, recorded so nobody spends
  the same hour: `push-sweep-qa-gate-facts!` has a tip-is-qa-ancestor fast
  path that returns `:tip-is-qa-ancestor? true` without enumerating ahead
  commits, and the BL-855 comment directly below it warns that exactly such a
  fast path "would leave f28a84ad's exact path open again". That looked like
  the cause. It is not what fired here - `git merge-base --is-ancestor main
  swarmforge-QA` currently returns FALSE, so the gate does enumerate. The
  defect is in the per-commit predicate itself, which both the fast path and
  the enumeration share. Fixing only the fast path would leave this open.

  IR-DRY: 3 medium findings, all reviewed and kept. One flags scenario 05's
  `verdict is bounced` against scenario 01's `verdict is <verdict>` - that is
  the outline's own instantiation, i.e. step reuse, not duplication. The other
  two pair `it allows the push` with `it refuses the push` and the
  verdict-known step with the verdict-undeterminable one; both contrasts are
  the assertion, and merging either would hide which guard a regression broke.

  Not fixed here, flagged for whoever picks this up: `is_qa_ancestor.sh` is
  the shared predicate script, called by both `handoffd.bb` and
  `check_pipeline_code_on_main.sh`. Changing its meaning changes both
  consumers at once - which invariant 2 wants, but it means the blast radius
  of a naive edit is wider than the publish path alone. Read both call sites
  before deciding where the verdict lookup belongs.

approval_context: >
  Two calls worth your eye before this runs.

  First, the shape of the fix. I have deliberately NOT mandated one. A
  positive verdict record is the more honest model - approval becomes a thing
  QA asserts, not a thing inferred from a merge - but it is the larger change,
  because something must own and persist that record. Verifying the
  BL-490/BL-495 revert instead is much smaller and closes today's hole, but it
  keeps approval defined by branch shape and will fail again the next time a
  revert is skipped for a different reason. I lean to the positive record and
  wrote the scenarios so either satisfies them; say if you want it pinned to
  the cheaper one.

  Second, and needing a decision independent of this ticket: BL-945's
  unapproved code is on `origin/main` RIGHT NOW - `docs/branding/icon-system.md`
  and `specs/pipeline/steps/lib/constitutionDocCitations.js`. The constitution
  says do not revert something already an ancestor of `main`, report it, so I
  have reported rather than touched it. The ticket that owns that code is
  still active and bounced twice on an unrelated defect (raw mkdtemp). You
  may want it left to land normally when BL-945 finally passes, or pulled
  now. That disposition is yours, not this ticket's.
