id: BL-1067
title: "The tmux-reaper guard certifies a reaper that cannot reach the server: reap() finds a fixture's tmux server only via <root>/.swarmforge/tmux-socket, and the guard checks track() was CALLED, never that anything taught it the socket"
milestone: M8
type: defect
severity: medium
# medium: real but contained. A false NEGATIVE in a standing leak guard - it
# certifies as adopted a file whose reaper provably cannot kill anything, and
# BL-1049 leaked eighteen real tmux servers across two runs while it was
# green. Not high: the damage is host resources during acceptance runs, no
# credential exposure, no data loss, no swarm-down, and the whole-tree
# assertion still catches the no-adoption-at-all class it was built for.
status: todo
epic: code-quality-gates
priority: 60
direction: agent-proposed
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1067-tmux-reaper-guard-certifies-track-without-the-socket-pointer.feature
human_approval: pending

required_wiring:
  - "specs/pipeline/steps/index.js::bl1067::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this feature file rather than silently skipping them. Verified absent from index.js at spec time, so the anchor cannot pass before the work is done"

invariants:
  - "The guard never demands reaper wiring of any kind from a file that cannot start a REAL tmux server - a query-only file, a file that only evaluates tmux argv as data, and a no-op PATH stub all stay clean however little they say about sockets."
  - "The guard's verdict is a pure function of one file's basename and text: it reads no fixture filesystem, starts no process, and consults no tmux state."

approval_context: >
  This came in as a hardener rule_proposal against BL-1049 and the rule half is
  already accepted and landed on main (swarmforge/roles/hardender.prompt,
  commit 1e0694838). This ticket is the machine half, and it needs your call on
  one thing only.


  SHOULD THE GUARD ENFORCE THIS AT ALL, OR IS THE PROSE ENOUGH? Prose in the
  hardener prompt binds the hardener. It does not bind the CODER, who writes
  step handlers too, and the guard is what runs on every parcel. That asymmetry
  is the argument for building it. The argument against is that this is the
  third scoping change to one guard (BL-817 built it, BL-1032 rescoped it, this
  would strengthen it), and every turn of that screw risks the mirror-image
  failure BL-1032 documented at length: a check whose cheapest satisfying move
  is to write wiring that guards nothing. Invariant 1 exists precisely to hold
  that line, and scenario 03 pins it with the three shapes that must stay clean.


  I recommend building it. The evidence is not hypothetical - the guard was
  green across both BL-1049 runs that leaked nine servers each, and a leak here
  is structurally invisible from inside the run, so the gate is the only thing
  that could have caught it.


  NOT ASKED, DELIBERATELY: how the file should teach the reaper its socket. The
  description sketches two routes and leaves the choice to the implementer.

description: >
  `specs/pipeline/steps/lib/fixtureReaper.js`'s `reap(root)` reaches a fixture's
  tmux server exactly one way: it reads `<root>/.swarmforge/tmux-socket` and
  passes the contents to `killTmuxServer`. `track(root)` registers the root for
  the exit/SIGINT/SIGTERM handlers and never discovers a socket. Every read in
  `reap()` is deliberately best-effort, so a missing pointer file is not an
  error, not a warning and not a log line - the tmux branch simply does not run.

  `specs/pipeline/steps/lib/tmuxReaperGuard.js`'s `findTmuxReaperViolation`
  returns null - clean - as soon as `REQUIRES_FIXTURE_REAPER` and `CALLS_TRACK`
  both match. Its header states the trust boundary outright: "a file that does
  both is trusted to have wired them together correctly". For the tmux half
  that trust is misplaced, because the pointer file is a third ingredient the
  check has no representation of at all.

  SO THE CERTIFIED-BUT-INERT SHAPE IS CLEAN TODAY: spawn a real server on
  `path.join(root, 'x.sock')`, call `track(root)`, write no pointer file. The
  whole-tree assertion in `extension/test/tmuxReaperGuard.test.js` - which every
  parcel runs - reports zero violations, and nothing dies.

  BL-1049 IS THE LIVE INSTANCE. Its provider-secret scrub steps did exactly
  that and two runs each left nine real tmux servers alive. The hardener found
  it by hand, fixed its own file
  (`specs/pipeline/steps/bl1049ProviderSecretScrubSteps.js:93` now writes the
  pointer file immediately above the `track()` call) and proposed the rule this
  ticket's machine half comes from.

  THE SECOND BACKSTOP SHARES THE BLIND SPOT AND OVERSTATES ITS REACH.
  `specs/pipeline/steps/lib/socketFixtureRoot.js` installs a `process.on('exit')`
  hook calling the same `reap(root)`, and its header claims it reaps "any
  fixture tmux server by SOCKET PATH first". That is true only when the pointer
  file exists - the helper knows the root it minted and never the socket chosen
  inside it. Correcting that comment is in scope; a durable contract carrying a
  false sentence is still a lie.

  AUDIT AT SPEC TIME: no other live offender. Every other step file under
  `specs/pipeline/steps/` that starts a real server already writes the pointer
  file. `bl1032TmuxReaperScopeSteps.js`'s apparent match is fixture TEXT it
  plants for the guard to scan, not a server it starts - which is itself a
  reminder that the new check must key on the hazard, not on a token.

  HOW (direction, not mandate). The check needs a third ingredient beside
  require-and-track, applied only on the route that can start a REAL server.
  Two routes are open and the choice is the implementer's: recognise the
  pointer-file write in the file's own text, or add a shared
  `fixtureReaper` helper that writes the pointer file and tracks in one call
  and recognise THAT. The second is the better long-run shape - it makes the
  correct thing the shortest thing to write - but it is a bigger change and
  either satisfies the acceptance.

  SCOPE. `tmuxReaperGuard.js`, its test, the `socketFixtureRoot.js` comment,
  and any step file the strengthened guard newly flags. NOT the BL-1049 parcel
  itself - the hardener already fixed that file in its own worktree; do not
  reach into it. NOT `fixtureReaper.reap()`'s discovery strategy: making reap()
  find sockets by itself (scanning the root for `*.sock`) is a different and
  larger ticket, and would collide with the BL-817 live-socket refusal.

qa_e2e_procedure: >
  1. At the parent commit, prove the false negative rather than assuming it:
  write a scratch file under specs/pipeline/steps/ that spawns tmux with
  'new-session', requires ./lib/fixtureReaper and calls track(root) but writes
  no pointer file, run the whole-tree assertion in
  extension/test/tmuxReaperGuard.test.js, and confirm it reports ZERO
  violations. Delete the scratch file. 2. At the parcel commit, repeat step 1
  and confirm the same file is now FLAGGED and the reason names the missing
  socket pointer. 3. Confirm invariant 1 against the three shapes in scenario
  03, using real files already in the tree rather than only fixtures:
  bl1018SingleRoleRepairNeverKillsServerSteps.js (argv-as-data),
  bl571SequentialRotationDormantParitySteps.js and
  bl952BouncedParcelNeverApprovedSteps.js (no-op PATH stubs), and one
  query-only file - each must stay clean. 4. Confirm the whole committed tree
  is clean under the strengthened guard (scenario 04), and that any file the
  parcel newly fixed writes a real pointer file rather than a decorative one.
  5. Confirm the reap actually happens now, which is the outcome the guard is a
  proxy for: count `pgrep -f '[t]mux -S' | wc -l` before and after a full
  acceptance run of the suite this parcel touches; the two numbers must match.
  6. Confirm invariant 2: findTmuxReaperViolation must still be callable on a
  fixture STRING with no filesystem present - drive it directly with a basename
  and text and confirm a verdict with no fixture root existing anywhere.
  7. Confirm socketFixtureRoot.js's header no longer claims a socket-path reach
  it does not have.

notes: >
  ORIGIN: hardener rule_proposal (scope role:hardender) received 2026-08-22,
  50_20260822T140822Z_000521_from_hardender_to_specifier. Body verbatim:
  "fixtureReaper.track(root) alone can't kill a fixture's tmux server - reap()
  finds it only via a .swarmforge/tmux-socket pointer file. Write that file too,
  or afterEach silently no-ops." Rationale verbatim: "BL-1049: a step file
  called track() but not the pointer file; two runs each leaked 9 real tmux
  servers. tmuxReaperGuard missed it - checks track() called, not reap()'s
  reach."

  DISPOSITION WAS BOTH HALVES, NOT A CHOICE BETWEEN THEM. The proposal is a
  durable rule AND a defect report. The rule half was ACCEPTED and appended to
  swarmforge/roles/hardender.prompt at commit 1e0694838. This ticket is the
  defect half, filed because prose in one role prompt cannot bind the coder,
  who also writes step handlers, and because the guard is what actually runs on
  every parcel.

  VERIFIED AT HEAD BY THE SPECIFIER BEFORE MINTING, not taken on the proposer's
  word: reap()'s tmux branch reads <root>/.swarmforge/tmux-socket and nothing
  else; findTmuxReaperViolation returns null once require+track both match;
  tmuxReaperGuard.test.js's own case "a file that requires fixtureReaper and
  calls track() is not flagged" passes a text with no pointer file; and neither
  main nor .worktrees/hardender contains any pointer-file check. Checked for a
  duplicate before minting (the BL-1065 lesson): no paused, active or done
  ticket covers this. BL-1032 is the nearest neighbour and is the OPPOSITE
  defect - a false positive in the same guard's scoping - which is why its
  lesson is carried into invariant 1 rather than merged into this ticket.

  IR-DRY judgment recorded: 4 findings -> 2 resolved, 2 kept. Resolved: scenario
  03's "teaches the reaper nothing about a socket" was accidental drift from
  scenario 01's "never teaches the reaper where its socket is" - unified to the
  latter, so both scenarios now share one step and one handler (unique steps 14
  -> 13). Kept: the two remaining near-duplicates are polarity pairs
  ("never teaches"/"teaches", "reports a violation"/"reports no violation"),
  where the negation IS the behavioural variable under test; collapsing either
  would delete the contract.

  NO BACKGROUND EXTRACTION beyond the guard setup, deliberately. Scenarios 01
  and 02 share two Givens, but scenario 03 must NOT start a real server -
  hoisting them would change what it asserts, which the extract-Background rule
  forbids.

