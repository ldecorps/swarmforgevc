id: BL-1072
title: "A registered detached run can die with no EXIT marker, no KILLED marker and no notice in its own log, so its owner cannot tell a dead run from a slow one - and the rule that told them silence means alive was wrong"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarm-reliability
priority: 58
direction: swarm-reported
depends_on: []
mutation_cost: medium
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1072-detached-run-dies-with-no-ending-marker.feature

required_wiring:
  - "specs/pipeline/steps/index.js::./bl1072::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them. The anchor is the require path prefix, not a full handler name: name the file whatever reads best so long as it starts bl1072. Verified absent from index.js at spec time, so the anchor cannot pass before the work is done"

invariants:
  - "A detached run's log always reaches a terminal state: a run that stops producing output has either written an ending marker or had the reason appended to that same log. Silence is never the complete record."
  - "Whatever signals a detached job's processes records that kill where the job's OWNER will look - the job's own log - and not only in a daemon log the owner has no reason to open."
  - "A live, registered, unexpired detach is spared as a WHOLE: no part of its process tree is signalled while its registration stands."

description: |
  ## What

  `swarmforge/scripts/detach_job.sh` documents a two-ending contract, and the
  hardener's prompt (until this ticket's sibling amendment, commit below)
  stated the consequence as a guarantee:

      The helper writes `[detach_job] STARTED pgid=...` first, then exactly
      one of two endings: `[detach_job] EXIT=<code>` or
      `[detach_job] KILLED by SIGTERM ...`. Neither marker means it is still
      running.

  A third outcome exists on this host. The hardener reports a detached run
  dying twice mid-run with NEITHER ending marker and no notice in the job's
  own log, leaving children orphaned under its pgid. Under the guarantee as
  written, the correct reading of that log was "still running" - so the rule
  instructed its reader to wait indefinitely on a dead job.

  ## Why this is the machinery's defect and not the reader's

  The log is the sanctioned way to collect a detached result: the rule says
  in terms to read the markers and never infer from silence. When the
  machinery can end a run without writing an ending, that instruction cannot
  be followed, and the failure is invisible in exactly the place the owner
  was told to look. BL-995 already fixed one instance of this shape - the
  reaper killing registered jobs and recording it only in
  `handoffd-supervisor.log`, "a supervisor log the owner had no reason to
  open" - and added `append-reap-notice!` so the kill lands in the job's own
  log. That fix assumed every kill flows through that one path. This ticket
  is the evidence that at least one does not.

  ## What is established, and what is not

  Established at `main`, 2026-08-22:

  - The hardener observed the silent death twice, on bl787's real-subprocess
    property file, and completed cleanly after reaping the pgid and re-running
    per-invariant in the foreground under 120s each.
  - `.swarmforge/daemon/handoffd-supervisor.log` does carry `reap-job-orphan`
    lines for `node (vitest 5)` at 16:23:44Z and `node (vitest 2)` at
    16:38:32Z - so the "no supervisor-log entry" half of the report is
    imprecise as stated: entries exist. Whether either corresponds to the
    hardener's job, and whether it named that job's registered pgid, is the
    open question.
  - `handoffd_supervisor.bb` keys sparing strictly on the group:
    `(get regs (str pgid))`, spared only when a registration exists and is
    unexpired. Anything whose pgid does not match a live registration is
    reaped regardless of what it belongs to.

  NOT established, and NOT to be written up as fact without evidence: WHICH
  path killed the run. Candidate mechanisms worth eliminating in order, the
  first being cheapest to test:

  1. A part of the job's tree running under a pgid that is not the registered
     one - vitest workers are the obvious candidate - so the reaper spares the
     leader, reaps the workers, and the job dies while its registration
     stands. This would produce exactly the reported signature, and invariant
     3 is what forbids it.
  2. A kill arriving from something other than the reaper, which therefore
     never reaches `append-reap-notice!` at all - the OOM killer is a live
     candidate on this host, which has a recorded history of orphaned vitest
     workers exhausting memory.
  3. The wrapper's own TERM trap not firing because the wrapper was killed
     with a signal it does not trap, SIGKILL being the obvious one.

  Whichever it is, invariants 1 and 2 must hold afterwards: the run's own log
  must reach a terminal state, and the reason must be discoverable there.

  ## Why medium and not high

  Recorded deliberately, because the case for high is real. For high: a
  hardening pass dies mid-flight, and the health signal its owner was told to
  trust reports the opposite of the truth - the "reads live but is inert"
  failure this repo keeps paying for. Against high: it is contained to the
  detached-run path used by the property lane, nothing in production is
  harmed, no work was lost (the hardener recovered and completed), and the
  recovery procedure is now written down in the hardener's prompt. Medium is
  the honest reading; the invariants are what stop it decaying.

  ## How (direction, not mandate)

  Make the third outcome either impossible or discoverable - impossible is
  better where it can be had. Widening what the registration spares would
  address mechanism 1 at the source; a terminal-state check that notices a
  registered job whose group has vanished without an ending, and appends the
  finding to that job's log, would cover all three including kills that never
  pass through the reaper. Neither shape is mandated, and the two are not
  exclusive.

out_of_scope: |
  - The hardener-prompt half. Already landed by the specifier at the commit
    named in notes, per the specifier's own rule that a prompt deliverable is
    the specifier's to land. Do not re-land or re-word it.
  - Widening the reaper's pattern to reach processes it does not currently
    match. That is a policy decision about what should be reaped; this ticket
    is about a job that dies without saying so.
  - The ~120s foreground cap and the detach escape hatch as concepts. Both
    stay exactly as they are.
  - The BL-1008 boundedWatchWait deadline defect, and BL-1063's property-file
    repairs. Adjacent lanes, different files.

qa_e2e_procedure: >
  1. Establish the contract at the parent commit: launch a detached job whose
  worker exits normally and confirm `[detach_job] EXIT=0`; launch another and
  reap it with the supervisor's own path, confirming `KILLED by SIGTERM` or an
  appended reap notice. Both endings must be shown working before the third
  outcome means anything. 2. Reproduce the third outcome deterministically:
  kill a REGISTERED job's worker in a way that does not signal the wrapper's
  TERM trap - SIGKILL to the worker, or a signal to a child under a different
  pgid - and confirm at the parent commit that the log ends with STARTED and
  nothing else while the registration still stands. That reproduction is the
  ticket's premise; if it cannot be produced, say so and bounce rather than
  proceeding on the report alone. 3. At the parcel commit, repeat step 2 and
  confirm the log now reaches a terminal state naming the group and the
  reason. 4. Confirm the notice lands in the JOB'S OWN log, not only in
  `handoffd-supervisor.log` - open the job log alone, as its owner would, and
  confirm the death is discoverable from it with no other file consulted. 5.
  Confirm a live, registered, unexpired detach is still spared as a whole:
  with a real multi-process run (vitest, which spawns workers), confirm no
  part of its tree is signalled while its registration stands, and confirm
  the workers' pgids relative to the registered one - record them either way,
  since that reading is what settles mechanism 1. 6. Confirm the expired-
  registration path is unchanged: an expired entry is still reaped, its
  notice still appended, its registration still removed (BL-995 invariant 2).
  7. Confirm an unregistered orphan is still reaped exactly as before (BL-995
  invariant 1) - this ticket must not become a way to survive the reaper by
  accident. 8. Record the degraded gate honestly: the changed surface spans
  a POSIX-sh/python helper and a Babashka daemon, neither of which has
  mutation, CRAP or DRY wired (engineering.prompt, Startup Tools). The gate is
  the runners under `swarmforge/scripts/test/` plus these scenarios; a
  hardening pass must record that fallback and must never imply mutation ran.
  Any new bash array expansion uses `${arr[@]+"${arr[@]}"}` (BL-801).

notes: |
  ## Provenance

  Hardener `rule_proposal` (scope `role:hardender`) 2026-08-22: "A
  detach_job.sh run can die silently - no EXIT/KILLED marker, no
  supervisor-log entry - leaving orphaned children under its pgid. Reap the
  pgid, retry per-test in the foreground." Rationale as sent: "BL-1061:
  bl787's real-subprocess property file killed a detached job twice mid-run
  with no trace; splitting into per-invariant foreground runs (<120s each)
  completed cleanly."

  Dispositioned in two halves, because the proposal contained both a working
  practice and a defect report:

  - ACCEPTED as a role rule - the operational half. The prompt's own sentence
    "Neither marker means it is still running" was an unconditional guarantee
    the host falsifies, and it told its reader to wait on a dead job. Landed
    by the specifier in `swarmforge/roles/hardender.prompt` at commit
    1011115048, together with the reap-and-retry-in-foreground
    recovery and an instruction to report rather than absorb it.
  - MINTED as this defect - the machinery half. A rule telling the hardener to
    work around silent death is a mitigation, not a fix; without this ticket
    the defect would have been permanently absorbed into a role's habits.

  One correction to the report, recorded so it is not carried forward: the
  supervisor log is not empty. It holds `reap-job-orphan` entries for
  `node (vitest N)` at 16:23:44Z and 16:38:32Z on 2026-08-22. Whether either
  is this job is exactly what step 5 settles.

  ## Related, do not conflate

  - **BL-995** - taught the reaper to spare a REGISTERED detach and to append
    the kill to the job's own log. This ticket is the case that fix does not
    cover; it extends BL-995 rather than revisiting it.
  - **BL-108** - the original orphan-reaper. Its behaviour on unregistered
    orphans is unchanged here and is protected by QA step 7.
  - **BL-1061** - the property-lane triage whose pass surfaced this. Different
    defect, same evening's evidence.

