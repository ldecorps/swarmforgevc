id: BL-1059
title: "516 of 792 closed tickets say status: todo — the field mirrors the folder by hand, was swept clean once in July, and drifted all the way back within six weeks"
milestone: M8
type: defect
severity: medium
status: todo
epic: code-quality-gates
priority: 40
direction: swarm-detected
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1059-closed-tickets-say-they-are-still-open.feature

invariants:
  - "No ticket YAML states a lifecycle position that contradicts the folder it sits in — across every backlog folder and every done/ milestone subfolder, not only the ones a sweep happened to visit."
  - "Every path that moves a ticket between folders leaves the corpus compliant, including a plain hand `git mv`. A path that can reintroduce the contradiction without anything failing is the defect, not a gap in the sweep."
  - "A value that records a decision somebody made — needs_design, blocked, superseded — survives untouched. Nothing here removes or rewrites a design state, whichever direction is approved."

human_approval: approved
approval_context: >
  One decision, with a recommendation, and one thing that is firm.

  The decision is whether the `status:` field should MIRROR the folder or STOP
  mirroring it. Recommendation: stop. Every mover in the repo already declines
  to write the field deliberately and says so in a comment — backlogWriter.ts
  markDone ("Moves the file only - it never rewrites the status field. The
  done/ folder is the authoritative signal (BL-033)") and readBacklog ("The
  folder is authoritative ... so a promoted item may still say status: todo").
  Making the field mirror the folder means teaching five movers plus the
  coordinator's hand `git mv` to keep a second copy of a fact the folder
  already carries, which is exactly the hand-mirrored-constant drift class
  engineering.prompt names. Retiring the mirror leaves `status:` meaning one
  thing — the design state BL-1047 is about to route on — instead of two.

  What is firm: doing neither is no longer available. c556942b5 (2026-07-09)
  swept 64 stale tickets to `status: done` as a mechanical fix with no
  mechanism behind it; six weeks later the count is 516. A second sweep with
  no mechanism is a measured non-fix, and a ticket that lands one fails this
  ticket.

  What is negotiable: everything else — which direction, where the gate lives,
  whether the sweep is a one-shot CLI or a scripted edit.

source: >
  Coordinator note to specifier 2026-08-22 (handoff
  50_20260822T132818Z_000981): "status:todo on 169/170 done/ tickets, not just
  BL-611 - systemic." Reproduced and measured repo-wide by the specifier the
  same day; the coordinator's 169 is exactly backlog/done/M8, whose measured
  denominator is 175.

description: |
  ## What is wrong

  A ticket's YAML carries a `status:` field. Nothing keeps it in step with the
  folder the ticket actually sits in, so most closed tickets state, in writing,
  that they are still to do.

  Measured over the committed corpus on 2026-08-22, across `backlog/done/` and
  its milestone subfolders (792 ticket YAMLs):

    | status:     | count | contradicts the folder |
    |-------------|-------|------------------------|
    | todo        |   515 | yes                    |
    | done        |   178 | no                     |
    | (absent)    |    91 | no — silence is not a claim |
    | superseded  |     7 | no — a recorded decision |
    | paused      |     1 | yes                    |

  516 of 792 closed tickets contradict their own folder. Broken down by folder:

    | folder                     | todo / total |
    |----------------------------|--------------|
    | backlog/done (flat)        |    346 / 490 |
    | backlog/done/M8            |    169 / 175 |
    | backlog/done/M1..M6        |      0 / 127 |

  The M1..M6 subfolders are clean for one reason: commit c556942b5
  (2026-07-09, "Backlog: sync status: field on all done/ tickets to reflect
  reality") rewrote 64 of them by hand. Its own message records the cause —
  "no governance doc (constitution, PIPELINE.md, coordinator.prompt,
  backlog-schema.md) ever instructed anyone to update the internal status:
  field on close - only the folder move (active/ -> done/) is treated as
  authoritative" — and then fixed the 64 without fixing that. Six weeks later
  the number is 516. That is the finding: the sweep is not the fix, and this
  ticket exists because the sweep has already been tried.

  ## Why the field is not simply wrong to have

  `status:` is not purely a shadow of the folder. Four live tickets carry
  `status: needs_design` (BL-555, BL-568, BL-569, BL-578), and BL-1047 is
  approved to make the promotion router read exactly that value to decide the
  specifier-first hold. `superseded` and `blocked` likewise record a decision
  no folder can express. So the field has a real job; what it does not have is
  a keeper for the half of its vocabulary that duplicates the folder.

  ## Why nothing has visibly broken

  Every machine consumer found reads the folder first:

  - `extension/src/panel/backlogReader.ts` overrides done-folder items
    regardless of their YAML status, by design (BL-033).
  - `swarmforge/scripts/ticket_status_lib.bb` derives status from the folder
    scan alone and never opens the file.
  - `swarmforge/scripts/promotion_gates_lib.bb` scans by folder.

  There is exactly one machine reader of the value itself:
  `extension/src/tools/drain-answer-files.ts:119` refuses to act on an answer
  whose ticket is closed, checking the done folder first and `status === 'done'`
  second. Because the folder check runs first, the 516 stale values have not
  yet produced a wrong decision — and because no live ticket currently carries
  `status: done`, the inverse (an open ticket wrongly refused) has not fired
  either. The cost today is that every agent and human who greps a closed
  ticket reads a false sentence, and that BL-1047 is about to raise the stakes
  on the same field.

  ## What done looks like

  1. The contract is written down where a minting session will meet it —
     `swarmforge/backlog-schema.md` does not mention `status:` at all today,
     which is why nobody knew what it was for.
  2. A gate can be pointed at the backlog and reports every contradiction it
     finds, or reports none.
  3. The committed corpus passes that gate.
  4. Closing a ticket by any route in use leaves the corpus still passing —
     including a hand `git mv`, which is how the coordinator does it.

  ## How (direction, not mandate)

  `swarmforge/scripts/backlog_hygiene_lib.bb` is the natural home for the
  check, with `backlog_epic_milestone_audit.bb` as the model for the repo-wide
  sweep and `specifier_backlog_hygiene_gate.sh` as the model for the
  per-file gate wrapper. Under the recommended direction the movers strip the
  folder-shadow line rather than rewriting it, which is what makes a hand
  `git mv` compliant for free; under the alternative they write it, and the
  hand-`git mv` path needs its own answer.

qa_e2e_procedure: |
  1. From the repo root, run the gate this ticket adds over the whole backlog.
     It must exit clean and report zero contradictions.
  2. Reintroduce one by hand, in a scratch copy — take any ticket under
     `backlog/done/` and give it the open-state value the corpus no longer
     uses. Re-run the gate: it must fail, naming that ticket's id and the
     folder it sits in. Discard the scratch edit.
  3. Close a ticket end to end and confirm the corpus stays compliant. With a
     scratch ticket in `backlog/active/`, exercise each mover in turn — the
     panel's markDone, `done_with_current_task.sh`, and a plain
     `git mv backlog/active/<f> backlog/done/` — re-running the gate after
     each. All three must leave it clean.
  4. Confirm the answer-drain gate still refuses a closed reference: run
     `node extension/out/tools/drain-answer-files.js <repo-root>` against a
     scratch `backlog/ANSWER-*.md` naming a ticket in `backlog/done/`. It must
     report the answer as arrived-late and NOT execute it — the behaviour must
     be identical to today whichever direction was approved.
  5. Confirm no design state was lost:
     `grep -rn "needs_design\|superseded\|blocked" backlog/` must still return
     the same tickets it returned before the sweep.

notes: |
  SEVERITY RATIONALE: `medium`, not `high`. No work is lost and no machine
  decision is currently wrong — every consumer reads the folder first, and the
  one that reads the value reads it behind the folder check. It is not a
  broken safety signal, so it does not meet the `high` band. It is real and
  contained: a corpus in which two thirds of closed tickets assert they are
  open is a corpus no reader can trust, and BL-1047 is about to make the same
  field load-bearing. Deliberately NOT inflated to buy the expedite lane.

  ORTHOGONAL TO BL-1047, and the boundary is worth stating. BL-1047 (paused,
  approved) changes `promotion_gates_lib.bb` and reasons about `backlog/paused`
  and `backlog/active`; it explicitly scopes no backlog sweep. This ticket's
  corpus edits are confined to `backlog/done/`, where `status: todo` is false.
  In the live folders `todo` is TRUE of an open ticket and is not a
  contradiction, so this ticket has no reason to touch a file BL-1047 reasons
  about. Invariant 3 is the guard on the one place the two meet: BL-1047's
  signal is `needs_design`, and nothing here may disturb it. Sibling, not a
  dependency — neither needs the other built first.

  THE SWEEP IS NOT THE DELIVERABLE. c556942b5 already shipped the sweep. If
  this parcel lands corpus edits and no mechanism, it has reproduced the
  July commit and invariant 2 fails. The reviewing stages should read the
  mover paths first and the diffstat second.

  WIRING: a gate nobody runs is the BL-419 shape — built, green, and reaching
  zero of the places it was filed to fix. `required_wiring:` is deliberately
  not declared here because the call site depends on which direction is
  approved, and a placeholder pattern would arm the pre-QA gate against a
  string nobody will ever write (BL-874). Invariant 2 and scenario 04 carry
  the obligation instead: if the parcel adds a standalone script and wires it
  into nothing, those scenarios cannot pass.

  TOOLING NOTE: the check is likely to land in the Babashka/shell lane, which
  has no mutation, CRAP or DRY tooling wired. Its gate is its own unit suite.
  A hardening pass must record that degraded fallback explicitly and must not
  report a mutation or CRAP result it did not run.

  APPROVED AS WRITTEN at 9c0fcd5e4 (2026-08-22), with no amendment to the
  approval_context. The recommended direction therefore stands: the field
  stops mirroring the folder. The coder does not need to re-open that choice —
  what remains negotiable is where the gate lives and how the sweep is run.
