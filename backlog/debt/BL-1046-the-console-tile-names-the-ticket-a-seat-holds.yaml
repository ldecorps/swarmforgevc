id: BL-1046
title: "The console's role grid says who the seats ARE and never what they are DOING: put the held ticket and its claim age on the tile, as BL-1044 does for the terminal title bars"
milestone: M8
type: feature
severity: low
status: todo
epic: swarmforge-console
assigned_to: none
priority: 30
direction: human-requested
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1046-the-console-tile-names-the-ticket-a-seat-holds.feature
human_approval: approved

approval_context: >
  Two calls are mine and worth your veto. (1) I scoped this to the HELD form
  only. BL-1044's not-held form ("the last ticket this pane acted on", read
  from completed/) needs a resolver nobody has built yet, in a language that
  may not be reusable here - see notes. Say so if you want the idle form on
  the console in this same slice and I will fold it in. (2) Scenario 03
  surfaces a held COUNT for the batch seats (cleaner, hardender), which needs
  a small server-side addition; without it a cleaner holding three parcels
  silently advertises one, the BL-068 regression. Drop it if you would rather
  ship the pure view change.

invariants:
  - "A tile names a ticket only when THAT seat's own mailbox resolution produced one: never a ticket resolved for a different seat, and never the board's stage-level fold, which deliberately collapses two seats of one stage onto one column and would make them title each other."
  - "The grid tile and the fullscreen Expand view read the SAME resolved payload fields - the tile never computes a second derivation of its own, so the two can never disagree about who holds what."

description: |
  ## What

  Operator, with a screenshot of the eight-tile role grid on the live console:
  *"can you port the recent ticket changes regarding the terminal title bars on
  this page as well (who is working what since when)"*.

  The grid renders the role name and an `Expand` button per tile and nothing
  more. Eight tiles, and a glance across them says who the seats ARE and never
  what they are DOING - the same complaint BL-1044 answers for the six terminal
  windows, on the surface the operator actually looks at from a phone.

  Put the held ticket on the tile: the ticket id, a short slug, and how long
  that seat has held it.

  ## The data is already on the wire - this is mostly a view change

  Nothing new needs computing for the held case. `residentPaneLive.ts`'s
  `tryCaptureRolePane` already calls `resolveResidentHeldTicketMetaForRoles`
  for every role pane, so each `PaneLiveSnapshot` already carries `ticketId`,
  `ticketTitle`, `claimEnteredAtMs`, `roleLabel` and `modelLabel`. The
  fullscreen Expand view renders all of it (`buildTicketBlockHtml`, and
  `buildPaneHeadHtml`'s `pane-ticket` block).

  Only the grid drops it, and deliberately -
  `residentSpyUiHtml.ts`'s `renderPane` writes the role name and the Expand
  hint and stops, under the comment *"Grid: role name + Expand only. Full
  metadata/transcript stay in fullscreen Expand."* That decision is what this
  ticket reverses, at the operator's request.

  Two consequences worth stating, because they are the whole reason this is
  small:

  - **Do not write a second derivation.** Invariant 2. The tile renders the
    payload fields the fullscreen view already reads. A grid that recomputed
    "who holds what" could disagree with the view one tap away.
  - **Ungate the claim age.** `renderAllPanes` currently computes
    `showClaim = panes[i].id === 'resident' || panes[i].id === 'coder'`, so the
    age is offered for two seats out of eight. The operator asked "since when"
    about the grid, not about the coder - scenario 02 pins every role.

  ## The derivation is already the per-seat one, and must stay that way

  `resolveResidentHeldTicketMeta` reads the seat's OWN `inbox/in_process/`
  through `mailboxDir(roleEntry, ...)` - which is the right resolution, and the
  one BL-1044 had to argue for at length, because master-resident roles
  (specifier, coordinator) keep their mailbox at
  `.swarmforge/handoffs/<role>/inbox/` while worktree-resident roles keep
  theirs under their worktree. The claim clock is the held handoff's own
  `dequeued_at`. It falls back to the stage map's `heldTicketIds[0]` only when
  the mailbox yields nothing.

  Invariant 1 exists to keep that fallback from widening. BL-1040 deliberately
  folds seat ids onto their stage so the BOARD renders one column per stage;
  that fold is right for the board and wrong here, because two seats of one
  stage working two different tickets would both show whichever ticket the fold
  kept. The seat is the key.

  ## Batch seats hold more than one parcel

  `resolveResidentHeldTicketMeta` returns a single ticket - the earliest claim.
  For the two batch roles that is a half-truth: a cleaner holding three parcels
  would advertise one and silently drop two. That is exactly the regression
  BL-068 fixed in the extension tiles and BL-1044 calls out for the title bars.

  Scenario 03 asks for the oldest claim plus a count of the rest ("BL-1010 +2"),
  which needs the resolver to carry a held count alongside the ticket it picks.
  Small, contained, and the difference between "who is doing what" being true
  and being misleading for two seats out of eight.

  ## What this slice does NOT do

  The **not-held form** - BL-1044's invariant 2, "a pane holding nothing shows
  the last ticket that pane itself took an action on, in a visibly not-held
  form" - is not here. It needs a `completed/` read that no resolver on either
  side performs today, and BL-1044's own direction puts its implementation in a
  Babashka daemon updater, which the TypeScript console cannot import. Folding
  it in here would either block this ticket on BL-1044 or mint the second
  cross-language derivation the shared engineering rules warn about.

  So an idle tile here names no HELD ticket (scenario 04, phrased so a later
  past-form addition does not falsify it) and keeps showing its role. Unlike a
  title bar, a console tile has never had a blank-identity problem - the role
  name is the tile's own heading - so BL-1044's "fall back to the role" ruling
  needs no port.

  ## How (direction, not mandate)

  Render a ticket strip inside `renderPane`'s tile head from the existing
  payload fields, and drop the `showClaim` gate. `formatClaimEnteredAgo`
  already exists but yields `entered 32m ago`, which is long for a tile in a
  two-column phone grid; a compact sibling next to it is the implementer's
  call. Exact strip layout, slug budget, and the "+N" marker are likewise the
  implementer's.

  Explicitly not wanted, as in BL-1044: `ticketColors.ts` (BL-139) and its
  per-ticket palette. The operator's own pointer on BL-1044 was *"it even has
  colour coding, which we don't need here"*.

  ## Out of scope

  - The not-held / last-acted-on form (above).
  - The terminal title bars (BL-1044) and the tmux status line.
  - The static backlog-dashboard PWA. This is the LIVE holistic UI - live
    mailbox state, behind the console's auth - and Architecture Rule 5 keeps
    the two surfaces distinct.
  - Any new state file, sweep, or telemetry. This reads what the payload
    already carries.

qa_e2e_procedure: >
  1. With the swarm running and at least one role holding a parcel, open the
     live console's role grid on a phone-width viewport. Confirm the defect at
     the parent commit: every tile shows only the role name and Expand.

  2. At the parcel commit, reload the grid. Confirm the holding role's tile now
     shows the ticket id, a slug, and a claim age, and still shows its role name.

  3. Cross-check the age against the source of truth: read that seat's own
     `inbox/in_process/` handoff header and confirm the tile's age matches
     `now - dequeued_at`, not some other clock.

  4. Tap Expand on that tile and confirm the fullscreen view names the SAME
     ticket id (invariant 2).

  5. Confirm the age now renders for a role that is neither coder nor resident
     - the coordinator or specifier tile - which it did not before.

  6. With a batch role (cleaner or hardender) holding more than one parcel,
     confirm the tile names the oldest claim and counts the remainder, and that
     the count matches the number of `*.handoff` files in that seat's own
     `in_process/`.

  7. Confirm an idle role's tile names no held ticket, still shows its role,
     and still expands.

