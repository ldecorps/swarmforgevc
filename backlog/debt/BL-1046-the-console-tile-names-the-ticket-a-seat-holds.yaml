  - BL-1044 explicitly listed "the holistic UI" in its own Out of scope, so
    this is its intended sibling rather than an overlap.
  - Live surfaces touched: `extension/src/bridge/residentSpyUiHtml.ts`
    (`renderPane`, `renderAllPanes`), reading `PaneLiveSnapshot` from
    `extension/src/bridge/residentPaneLive.ts`; derivation stays in
    `extension/src/concierge/residentPaneSpy.ts`
    (`resolveResidentHeldTicketMeta`). Verified 2026-08-22 that the payload
    already carries the held-case fields, so the held form needs no new read.
  - Scenario 03's held count is the only server-side change; if it is dropped
    at approval, the slice becomes a pure view change.
