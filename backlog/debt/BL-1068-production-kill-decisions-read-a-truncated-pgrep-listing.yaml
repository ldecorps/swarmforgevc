id: BL-1068
title: "Three production sites decide or record from a pgrep listing GNU truncates to the process name, so a port guard signals what it was written to spare, a supervisor filter can never exclude anything, and the daemon postmortem cannot tell a daemon from its supervisor"
milestone: M8
type: defect
severity: medium
status: todo
epic: swarm-reliability
priority: 60
direction: swarm-reported
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1068-production-kill-decisions-read-a-truncated-pgrep-listing.feature

required_wiring:
  - "specs/pipeline/steps/index.js::./bl1068::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them. The anchor is the require path prefix, not a full handler name: name the file whatever reads best so long as it starts bl1068, following the registry's existing bl<id><Name>Steps convention. Verified absent from index.js at spec time, so the anchor cannot pass before the work is done"

invariants:
  - "A decision about a process is made from text that can actually identify it: no production branch reads ownership, identity or class out of a listing that does not carry the argument list."
  - "Ownership of a process is decided by which root it BELONGS to, never by substring containment: a nested worktree path is not evidence that a process belongs to the master root, and vice versa."

description: |
  ## What

  `pgrep -fl` means two different things on the two userlands SwarmForge
  targets. `-f` decides what pgrep MATCHES - the full command line, correct
  everywhere. `-l` decides what it PRINTS: BSD/macOS prints the full argument
  list, procps-ng prints the process NAME alone. Measured on this host
  (procps-ng 4.0.4, 2026-08-22): `pgrep -fl -- "sleep 45"` prints
  `343923 sleep`, where `pgrep -af` prints `343923 sleep 45`.

  BL-1061 found this and repaired the one site it owned,
  `tunnel_ownership_lib.sh`. This ticket owns every other site.

  ## The eight sites, classified

  Read at `main` on 2026-08-22. This enumeration supersedes the rougher count
  in BL-1061's own out-of-scope note.

  Decide or record from the truncated TEXT - **in scope**:

  - `start_bridge_headless.sh:137-139` - frees the port by signalling every
    candidate whose printed line does not contain `$ROOT`.
  - `kill_pipeline_swarm.sh:243` - reaps stray handoffd and pipes the listing
    through `grep -v handoffd_supervisor`.
  - `collect_daemon_postmortem.sh:31` - records the handoffd process table
    into the postmortem artefact.

  Read only `${line%% *}`, the pid, and are **unaffected** - do not touch:

  - `stop_bridge_headless.sh:48`
  - `stop_ancillary_services.sh:93`
  - `stop_ancillary_services.sh:97`

  Already repaired by BL-1061 and **out of scope**: `tunnel_ownership_lib.sh`.

  ## What each in-scope site actually does today

  1. **The port guard signals what it was written to spare.** The condition
     is `[[ "$pid" =~ ^[0-9]+$ ]] && [[ "$line" != *"$ROOT"* ]]`. Truncated,
     `$line` is `4242 node` and can never contain a path, so the second test
     is always true and every candidate on the port is TERMed - including
     this root's own bridge, which the guard exists to protect.

  2. **The supervisor filter can never exclude anything.** The listing never
     carries `handoffd_supervisor`, so `grep -v` removes nothing. Note what
     this does and does not mean today: the pgrep pattern is
     `handoffd\.bb.*$ROOT`, and `handoffd_supervisor.bb` does not contain the
     substring `handoffd.bb`, so the supervisor is not currently matched in
     the first place. The filter is therefore inert AND redundant right now -
     which is precisely why it is worth fixing rather than deleting. It reads
     as a live defence, so the next person to widen that pattern will believe
     they are protected, and will not be.

  3. **The postmortem cannot make the one distinction it exists for.** Its
     section reads `602143 bb` / `602162 bb`. That artefact is collected
     after a daemon death specifically to say which process was which, and
     for which root; it can say neither.

  ## The second, independent defect on the same line

  The port guard decides "belongs to another root" by asking whether the
  command line CONTAINS `$ROOT` as a substring. Worktrees are nested under
  their master root, so:

  - from the master root, a worktree's bridge path contains the master root
    and reads as ours - and a worktree orphan holding the port is the exact
    case the block's own comment says it is for;
  - from a worktree, `$ROOT` is the worktree path, so the master's bridge
    does NOT contain it and reads as foreign.

  **The two defects are coupled and cannot be split.** While the listing is
  truncated the containment test never runs at all, so repairing the listing
  alone converts a block that over-signals into one that signals nothing.
  Both are in scope here. Reviewers: the containment repair is IN SCOPE and
  is not an out-of-scope diff.

  ## Why medium and not high

  Recorded deliberately, because the argument for high is real and should not
  have to be reconstructed. Against high: nothing is currently mis-killed
  across roots - the port guard's pattern is anchored to a single port, so
  the bridge it wrongly signals is one already holding the port this run is
  about to take; the supervisor filter is redundant today, so its inertness
  costs nothing yet; and the postmortem degradation is forensic, felt only
  after an incident. For high: two of the three ARE broken safety defences,
  and a defence that reads live but is inert is the failure mode this repo
  keeps paying for. Medium is the honest reading of impact today, and the
  invariants are what stop it decaying into high later.

  ## How (direction, not mandate)

  BL-1061 moved the listing to `ps -o pid= -o args=` after narrowing with
  pgrep - POSIX on both userlands. The same shape fits here, and a single
  shared helper is preferable to three copies. For ownership, compare roots
  as paths with a boundary rather than as substrings. Neither shape is
  mandated. Do not touch the three pid-only sites; they are correct.

out_of_scope: |
  - `tunnel_ownership_lib.sh` - repaired by BL-1061.
  - The three pid-only sites listed above; they read `${line%% *}` and are
    correct as written.
  - Widening `kill_pipeline_swarm.sh`'s pgrep pattern to actually reach the
    supervisor. That is a separate decision about what should be reaped, not
    about whether the filter works.
  - Any change to what the port-freeing block is FOR; this fixes how it
    decides, not its policy.

qa_e2e_procedure: >
  1. **Confirm the truncation on this host before anything else**, so the
  premise is measured rather than assumed: run `pgrep -fl -- "sleep 45"` and
  `pgrep -af -- "sleep 45"` against a real `sleep 45` and confirm the first
  prints the process name alone. 2. **The port guard.** At the parent commit,
  start a bridge for THIS root on a port, run the port-freeing block, and
  confirm this root's own bridge is signalled - the behaviour the fix must
  remove. At the parcel commit, confirm it is spared, that another root's
  bridge on the same port is signalled, and that a worktree bridge nested
  under this root is signalled. 3. **The supervisor filter.** With a daemon
  and its supervisor both running for this root, confirm the reap signals the
  daemon and not the supervisor, and confirm this holds when the listing
  carries only the process name. 4. **The postmortem.** Kill a daemon,
  collect the postmortem, and confirm its process-table section distinguishes
  the daemon from its supervisor and this root's processes from another
  root's. 5. **The unaffected sites still work**: exercise
  stop_bridge_headless.sh and stop_ancillary_services.sh and confirm they
  still signal what they should - they were not to be edited, so any diff
  touching them is itself a finding. 6. **Portability**: confirm the listing
  does not depend on `pgrep -a`, which macOS does not have. 7. Record the
  degraded gate: shell only, so no mutation, CRAP or DRY applies - the gate
  is the runners under `swarmforge/scripts/test/` plus these scenarios, and
  the stock bash 3.2 target applies (BL-801).

notes: |
  ## Provenance

  Two independent reports of the same finding, merged here N:1 under the
  specifier's Consolidation Authority:

  - The coder's BL-1061 pass, which found the truncation in six other
    production scripts and classified two of them as deciding a kill from
    the command text.
  - Architect `note` 50_20260822T161538Z_000633 to specifier and coordinator:
    "2 more pgrep -fl truncation bugs found (BL-1061 evidence) - worth a
    ticket?" - answered yes, this is it. Forwarded again by the coordinator
    as note 50_20260822T162008Z_001007.

  The third in-scope site (`collect_daemon_postmortem.sh`) and the
  containment defect on the port guard's own line are the specifier's
  findings, from re-reading all eight sites at `main` while verifying the
  reports. That re-read is also why this ticket's enumeration, not BL-1061's
  out-of-scope note, is the authoritative count.

  ## Degraded gate, recorded up front

  Shell only: no mutation/CRAP/DRY is wired for that layer
  (engineering.prompt, Startup Tools). The gate is the runners under
  `swarmforge/scripts/test/` plus the acceptance scenarios. A hardening pass
  must record that fallback and must never imply mutation ran. Any new array
  expansion must use `${arr[@]+"${arr[@]}"}` for stock bash 3.2 (BL-801).

  ## IR-DRY judgment recorded: 1 finding -> 1 resolved

  A medium-confidence possible-synonym (0.636) between "a daemon and its own
  supervisor are running for this root" and "a stray daemon and its own
  supervisor are both running for that root" - real drift, two phrasings of
  one setup. Both scenarios now use the single phrasing, and the shared
  `Given the swarm root is "/repo"` moved into a `Background:`. Re-run clean:
  0 findings.

  ## Related, do not conflate

  - **BL-1061** (in flight) - the same truncation in `tunnel_ownership_lib.sh`
    plus a fixture binding the production tunnel name. Repaired there; this
    ticket must not touch that file.
  - **BL-1058** (active) - BSD-only `mktemp -t`, inert on Linux. Same class:
    authored on macOS, silently wrong on GNU, green either way.

  ## Orthogonality: four tickets share kill_pipeline_swarm.sh

  **This ticket may not be active at the same time as BL-782, BL-888 or
  BL-730.** BL-782's own specifier cross-reference already names the first
  three as a mutually-exclusive set on this file; this ticket is the fourth
  member and has been added to that list from its end too, so the set is
  walkable from either ticket.

  The overlap is adjacency, not duplication, and the distinction matters
  when they are read side by side:

  - **BL-782** fixes which processes the reap MATCHES - the pgrep pattern's
    scope to `$ROOT` (lines ~230/271).
  - **This ticket** fixes what the reap READS once matched - the `-l` listing
    that prints the process name alone, defeating the supervisor filter at
    line 243.

  A pass that repaired only the pattern would leave the filter inert, and a
  pass that repaired only the listing would leave the pattern unscoped.
  Neither subsumes the other; whichever lands second must merge `main` and
  re-read the file before assuming its line numbers still hold.

