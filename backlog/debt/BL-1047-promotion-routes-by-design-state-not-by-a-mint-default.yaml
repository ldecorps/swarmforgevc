id: BL-1047
title: "promotion routes on a value mint writes by default - 74 of 195 tickets are armed to spend a specifier hop, and route-target never rewrites the one value that causes it"
milestone: M8
type: defect
severity: medium
status: todo
epic: code-quality-gates
priority: 45
direction: normal
depends_on: []
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1047-promotion-routes-by-design-state-not-by-a-mint-default.feature

invariants:
  - "A ticket is routed to the specifier exactly when its design is still unsettled - never because of a value a minting session left behind."
  - "The router's decision and the assignment it records never disagree: a ticket routed to the coder is never left carrying an assignment naming another role."

human_approval: approved
approval_context: >
  One decision, with a recommendation and measured evidence, and one thing
  that is firm.
  The decision is what the router should read as "the specifier holds this
  first". Recommendation is status: needs_design - a field that already
  exists, that nothing currently reads, and that on the committed corpus
  identifies EXACTLY the four tickets whose design is genuinely unsettled,
  all four of which also carry the stale assignment. Routing on it makes the
  70 inert assignments harmless without anyone editing 70 files, which is why
  no backfill sweep is scoped here.
  What is firm: the specifier-first hold must survive. It is not a wart - it
  is what stops a needs_design ticket being promoted straight into the coder
  pipeline, and nothing else checks that today. A fix that simply deletes the
  hold, or that routes every ticket to the coder unconditionally, fails this
  ticket.
  What is negotiable: the signal itself. If needs_design is judged too
  overloaded to carry routing, an explicit field is fine - the constraint is
  that it must record a DECISION somebody made, not a default somebody
  inherited.

source: |
  Found by the specifier, 2026-08-22, while working a "Work BL-1032" note it
  should never have received.

  BL-1032 was fully specced, its feature file tracked and lint-clean, and
  human-approved at c83441f9f ("operator confirmed the ticket's proposed
  direction"). It was promoted with assigned_to: specifier - the value it had
  carried since mint - and route_backlog_to_coder.sh duly routed it to the
  specifier. There was no spec work to do.

  The reason it could not simply be forwarded is the interesting half.
  promotion_gates_lib.bb route-target, lines 232-234:

    (if (= "specifier" assigned-to)
      {:route-to "specifier" :rewrite-assigned-to? false}
      {:route-to "coder" :rewrite-assigned-to? (not= "coder" assigned-to)})

  "specifier" is the ONE value the router never rewrites, and its docstring
  says so deliberately. So the ticket routes back to the specifier on every
  sweep until a human or the specifier edits the field by hand, which is what
  unstuck BL-1032 (b76c412e1).

  Measured across the 195 tickets committed in backlog/paused and
  backlog/active on 2026-08-22:

    | assigned_to     | count | of which status: needs_design |
    |-----------------|-------|-------------------------------|
    | specifier       |    74 |                             4 |
    | key absent      |    63 |                             0 |
    | the string none |    28 |                             0 |
    | coder           |    14 |                             0 |
    | unassigned      |     7 |                             0 |
    | present, blank  |     6 |                             0 |
    | coordinator     |     2 |                             0 |
    | documenter      |     1 |                             0 |

  There are FOUR spellings of "nobody" - absent, blank, `none` and
  `unassigned`, 104 tickets between them - so the field records which
  convention the minting session happened to use rather than a decision. 69
  of the 74 specifier rows are status: todo, i.e. inert defaults. The
  coordinator and documenter rows are rewritten to coder at promotion, which
  is invariant 2 working as intended on a stale value.
  And the four that genuinely need design all carry status: needs_design:
  BL-555, BL-568, BL-569, BL-578. The design state is already written down,
  in a field no script reads: `grep -rn needs_design swarmforge/scripts/`
  returns nothing.

notes: |
  Why this is severity medium and not high. It does not lose work and does
  not break a safety signal: a diligent specifier notices there is nothing to
  spec and releases the hold, as happened here. What it costs is a hop of the
  most expensive role in the pack, on up to 74 tickets, plus the chance that
  a less careful pass simply re-routes and loops. Contained, real, and
  cheap to fix.

  Sibling, not a duplicate: BL-1027 adds a MINT-TIME gate refusing a dangling
  acceptance: pointer. Same family (code-quality-gates) and the same moment
  in a ticket's life, and if both land the checks may well share one gate -
  but BL-1027 is already a 178-line slice with its own two invariants, and
  folding this in would push it past the size envelope for no gain. Kept
  separate deliberately.

  Deliberately NOT scoped here: editing the 70 stale assignments. If the
  router reads the design state instead, those values stop mattering and the
  router rewrites them to coder at promotion anyway. A 70-file backlog sweep
  would also collide with whatever else is in flight, for no behavioural
  gain. If the approved discriminator turns out to still read assigned_to,
  the sweep becomes necessary and is a separate ticket.

description: |
  ## What

  Make the promotion router decide the specifier-first hold from a recorded
  DESIGN STATE rather than from the assigned_to value a minting session left
  behind.

  ## Why now

  74 of 195 committed tickets are armed to route to the specifier on
  promotion, and only 4 of them should. Because "specifier" is the one value
  route-target never rewrites, each of the other 70 needs a hand edit before
  it can move at all. BL-1032 - specced, approved, and needing nothing from
  the specifier - just paid that cost.

  ## How (direction, not mandate)

  Read the recommendation and the firm constraint in approval_context before
  choosing. The shape that fits the evidence is to key the hold on
  status: needs_design and let every other ticket route to the coder with
  assigned_to rewritten as it already is today. Keep the hold itself: it is
  the only thing stopping a needs_design ticket from being promoted straight
  into the coder pipeline.

  Scenario 03 is the non-vacuous one and is the reason the corpus numbers are
  in the source: it runs the decision over the committed backlog and requires
  that exactly the unsettled tickets route to the specifier. A change that
  passes 01 and 02 over fixtures but leaves the corpus routing as it does
  today has not fixed anything.

  ## Out of scope

  - Editing the 70 stale assignments (see notes).
  - Whether needs_design should block promotion outright. Today it does not,
    and the specifier-first hold is what covers for that; changing it is a
    separate question.
  - BL-1027's dangling-acceptance gate.

qa_e2e_procedure: |
  From the repo root, against the parcel:

  1. Baseline on a PRE-fix checkout: for each of BL-555, BL-568, BL-569 and
     BL-578 (status: needs_design) and for one settled ticket carrying
     assigned_to: specifier, run
     `bb swarmforge/scripts/promotion_gates_cli.bb route-target . <yaml>`.
     All five must report the specifier - including the settled one. That is
     the defect.
  2. Run the same five against the parcel. The four needs_design tickets must
     still report specifier with no rewrite; the settled one must report
     coder WITH the rewrite flag.
  3. Prove non-vacuity over the corpus, which is scenario 03: run route-target
     across every yaml in backlog/paused and backlog/active. Exactly the
     needs_design tickets may report specifier. Record the counts - on the
     tree as measured this is 4 of 195, against 74 before.
  4. Prove the hold still works end to end: promote a needs_design ticket in a
     scratch checkout via promote_and_route_next.sh and confirm the Work note
     addresses the specifier and that its assigned_to was not rewritten.
  5. Confirm the acceptance feature runs through specs/pipeline/cli.js,
     including scenario 03 over the committed tree.
  6. Run the default unit lane (`npm test` from extension/) and record any
     failure already tracked by another ticket.
