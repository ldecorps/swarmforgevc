id: BL-1055
title: "A hydrate run has no end condition: when the specifier finishes draining and hands off to the coder, nothing stops the swarm, so the run either builds what hydrate promised not to build or idles until a human notices"
milestone: M8
type: feature
status: todo
epic: swarm-reliability
priority: 42
direction: human-requested
depends_on: [BL-1054]
mutation_cost: low
required_stages: [coder, cleaner, architect, hardender, documenter, qa]
acceptance: specs/features/BL-1055-a-hydrate-run-ends-when-the-specifier-hands-work-to-the-coder.feature
human_approval: approved
approval_context: >
  Nothing needs deciding; this is the stop condition BL-698 already pinned,
  made real on the pack. Flagged pending only because the feature file is new.

  Worth knowing: with BL-1054's lock but without this, a finished hydrate run
  is SAFE but manual - the specifier hands off, the coder never wakes because
  the lock holds, and the swarm sits idle until you stop it. This ticket turns
  that idle into a clean drain-stop.

required_wiring:
  - "specs/pipeline/steps/index.js::bl1055::the new step handler must be registered in the step registry - specs/pipeline/runtime.js THROWS on any scenario with no handler, so an unregistered file fails every scenario in this ticket's feature file rather than silently skipping them"

invariants:
  - "The drain-stop never discards work. The handoff that triggers it is delivered and durable before anything is torn down, so the queued parcel is waiting intact for the ordinary swarm that picks it up next."

description: |
  ## What is wrong

  BL-698 pinned `/hydrate` and `/mint` as specifier-only, with the rule that
  the coder does not start: a `git_handoff` to coder ends the run. BL-1054
  makes the resident stay on the specifier, but nothing acts on that handoff.
  So a hydrate run that has finished its job looks exactly like one that is
  still working - the specifier has stopped, the coder is locked out, and the
  swarm burns a seat waiting for a human to notice.

  ## How (direction, not mandate)

  When the specifier sends a `git_handoff` to the coder while the hydrate lock
  is held, treat it as the run's completion signal: let the handoff be
  delivered normally, then drain-stop the swarm. No coder pane ever starts.
  The same applies to `/mint`.

  Not in this slice: the lock itself (BL-1054, which this depends on), and any
  change to how an ordinary swarm handles a specifier-to-coder handoff.

notes: |
  Source intake:
  `.swarmforge/operator/INTAKE-mono-router-hydrate-lock-resident-on-specifier.md`
  (operator via Cursor, 2026-07-28; archived on drain). Split 1:N with
  BL-1054 - this ticket carries the intake's "What we need" item 3 and the
  exit half of item 4.

  The operator's words, verbatim: "**Stop condition (already pinned on
  BL-698):** when the specifier would hand off to coder (`git_handoff` or
  equivalent), **do not start coder** — auto drain-stop the swarm instead
  (hydrate complete). Same for `/mint`." And item 4: "**Exit lock:** leaving
  hydrate mode (successful drain-stop, or explicit `/start` full pack /
  unlock) restores normal mono-router home = coder behaviour."

  IR-DRY: zero findings on this feature file.

  The exit-lock half needs no mechanism of its own here: BL-1054 chose a pack
  -carried lock precisely so that stopping the run ends the mode, with no
  durable state to restore.

qa_e2e_procedure: |
  On the live host, against a scratch target, after BL-1054 has landed:

  1. Launch the hydrate pack with one raw intake in the backlog root.
  2. Let the specifier drain it and hand the resulting work to the coder.
  3. Confirm the swarm drain-stops on its own, and that no coder pane ever
     existed on the socket at any point.
  4. Confirm the handoff survived: the parcel is sitting in the coder's
     mailbox, intact, and the specced ticket is committed.
  5. Launch an ordinary mono-router run and confirm the queued parcel is
     picked up normally - the hydrate run left nothing behind that blocks it.
