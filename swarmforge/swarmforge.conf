# Swarm-wide settings. `config <key> <value>` lines are read by the coordinator.
# active_backlog_max_depth: max number of items allowed in backlog/active/ at once.
# The coordinator holds new work in backlog/paused/ and promotes the next item to
# active only while the active count is below this cap. Keeps the pipeline at a
# pace the human can follow.
# A value of -1 means NO LIMIT: the coordinator promotes every eligible paused
# item regardless of active count. Concurrent Work Orthogonality still applies
# (skip/hold overlapping-scope items) — removing the depth cap does not remove
# the orthogonality rule.
config active_backlog_max_depth 3

# BL-606: the specifier-declared required_stages routing kill-switch. OFF
# (the default) makes required_stages completely inert - swarm_handoff.bb's
# send path never reads it, and every ticket's `to:` is byte-identical to
# today's full-chain behaviour regardless of what any ticket's
# required_stages says. Flip to true to let a git_handoff whose destination
# stage is not in a ticket's declared required_stages get rewritten straight
# to that ticket's next required stage instead - conservative,
# off-by-default per the human's "extreme care with this" caveat (BL-606).
# SWARMFORGE_REQUIRED_STAGES_ROUTING=1 in the process environment overrides
# this to ON regardless of the config line - a test-only seam, the same
# shape as SWARMFORGE_SKIP_DAEMON.
config required_stages_routing_enabled true

# BL-149: mutation-testing eligibility gate (mutation_cooldown_gate.bb), read
# fresh by the hardener before each mutation pass - never a remembered value.
# mutation_cooldown_days: a production file last committed-touched within this
# many days is still actively churning and is skipped unconditionally,
# regardless of time of day or host load.
config mutation_cooldown_days 3
# mutation_busy_load_multiplier: once a file is past cooldown, the existing
# office-hours bypass applies - the host is "busy" when its load average
# exceeds this multiplier times the core count (was a hardcoded "~2x cores"
# in hardender.prompt's prose; now configurable here instead).
config mutation_busy_load_multiplier 2

# BL-822: the cost-health sidecar's host-load severity verdict
# (resourceTelemetry.ts's computeHostLoadVerdict), read fresh at decision
# time - never a remembered value. Severe requires BOTH dials: a ratio
# (os.loadavg()[0] / os.cpus().length) at or above host_load_severe_ratio,
# sustained for at least host_load_sustained_minutes. host_load_severe_ratio
# is deliberately above mutation_busy_load_multiplier above (default 2) -
# "too busy to START mutation testing" is a lower bar than "this day was
# resource abnormal", and the two must not drift into contradiction. Absent
# or malformed values degrade to the code defaults below (never a crash) -
# resourceTelemetry.ts's DEFAULT_HOST_LOAD_SEVERE_RATIO/
# DEFAULT_HOST_LOAD_SUSTAINED_MINUTES are the single source of truth for
# those literals, so they are not duplicated here.
# config host_load_severe_ratio 4
# config host_load_sustained_minutes 15

# BL-144: daemon-death alarm email. handoffd_supervisor.bb runs headless (no
# VS Code needed) and cannot read the extension's swarmforge.notify.email.*
# VS Code settings, so the alarm path gets its own config here instead - the
# API key still comes from the RESEND_API_KEY env var, same as the extension.
# Uncomment and set notify_email_to to enable the alarm email (the failure
# log + hard-stop happen either way, configured or not).
# BL-215: RESEND_API_KEY is read from the DAEMON's own process environment,
# not VS Code SecretStorage - a headless launch (CLI, no VS Code, or a
# supervisor self-relaunch) MUST export RESEND_API_KEY in that same launch
# environment (shell profile / systemd unit / launcher), or the alarm and
# BL-214 briefing emails cannot send. A configured-but-keyless daemon no
# longer no-ops silently: it logs a loud warning naming RESEND_API_KEY to
# .swarmforge/daemon/handoffd-supervisor.log (deduped, not spammed).
config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev

# BL-258: the headless daemon's own morning trigger for briefing GENERATION
# (complements BL-214's send-time sweep above) - "HH:MM" 24h UTC. Read fresh
# each sweep by handoffd.bb's configured-morning-time, never hardcoded. A
# blank/absent/malformed value falls back to 08:00 UTC
# (briefing_generation_schedule_lib.bb's default-morning-time) rather than
# crashing the sweep.
config briefing_morning_time_utc 04:30

# BL-617: the nightly cooldown window - handoffd.bb's cooldown sweep
# applies a timed pause (the same control-pause.json BL-423's manual
# Telegram pause writes) when this window opens, so the swarm stops
# burning tokens overnight, and lets BL-423's existing auto-resume sweep
# thaw it at the window's close. Times are "HH:MM" 24h LOCAL wall-clock on
# the swarm host (not UTC, unlike briefing_morning_time_utc above) and the
# window may span midnight. Read fresh each sweep; a blank/absent/malformed
# value degrades to disabled/19:00/07:00 (cooldownWindowCore.ts's own
# defaults) rather than crashing the sweep. At most one automatic pause is
# applied per window - a human resume-now inside the window consumes that
# window's application, per this ticket's manual-override rule.
# Disabled so day/evening/night shifts can run continuously (operator request 2026-08-04; same as 2026-08-03).
# Re-enable only when the human revokes continuous 3-shift mode.
config cooldown_window_enabled false
config cooldown_start_local 17:00
config cooldown_end_local 09:00

# BL-256: the deployed PWA dashboard's base URL (read by
# extension/src/metrics/pwaDeepLinks.ts), used to build deep links from
# briefing items (e.g. #ticket=BL-123, #approval=BL-123) into their PWA
# view. There is no universal default - the GitHub Pages URL is assigned
# per deployment (or a later custom domain) - so this line is commented
# out until the operator sets it; absent/blank degrades to plain ticket
# IDs with no link, never a broken URL. Example:
# config pwa_base_url https://<user>.github.io/<repo>/

# BL-223: the phone recert PWA's inbound recertification address (read by
# extension/src/docs/recertificationStore.ts, published into recert-batch.json
# for the static PWA to consume - never hardcoded in pwa/app.js a second
# time). Defaults to the operator's Resend-managed receiving domain
# (tolokarooo.resend.app - no DNS/MX setup needed) when this line is absent.
# A later branded custom domain (e.g. recert@inbound.musicalsifu.com) is a
# swap of this one line, not a code change.
config recert_email_to recert@tolokarooo.resend.app

# BL-576: under `config rotation router` a `type: note` (design kickoffs,
# steering, merge-up instructions) sitting in a dormant role's inbox/new is
# refused by every chase sweep forever, since actionable-mail? deliberately
# excludes fresh notes to avoid thrashing the resident on a QA merge-up
# broadcast. note_actionable_after_ms is the age (in milliseconds, via the
# parcel's enqueued_at/created_at header, never file mtime) past which such
# a note counts as actionable and the chase rotates the resident to drain
# it. Absent, malformed, zero, and negative all degrade to the default
# below — mono-router-lib/default-note-actionable-after-ms is the single
# source of truth for that literal, so it is not duplicated here.
# config note_actionable_after_ms 1200000

# BL-577: the flow watchdog - a handoffd sweep sibling that alarms on ANY
# parcel (any mailbox, any type, any role) sitting unprocessed past a
# threshold, measured from its own enqueued_at/created_at header (never file
# mtime). Unlike liveness-based self-heal, this catches a stall even while
# every liveness signal reads green. flow_watchdog_warn_ms/
# flow_watchdog_escalate_ms are the GLOBAL fallback pair (re-alarm only on a
# tier change, never a repeat within the same tier). Per-spec thresholds are
# resolved outside decide-tier from a calibrated percentile table
# (.swarmforge/daemon/flow-watchdog-thresholds.json): warn ≈ p67 (slowest
# ~33% of historical ages for that from→to|type), escalate ≈ p97 (slowest
# ~3%), falling through *->to|type → these globals when a spec lacks enough
# samples OR its raw p67 falls below the 60s min-warn-ms reject gate (BL-835:
# a floor that CLAMPED a sub-gate percentile up to 60s instead of rejecting
# it false-alarmed WARN on healthy ~1-minute hops). The alarm itself lands
# in the durable Telegram
# OPERATOR-topic outbox (.swarmforge/operator/telegram-reply-outbox.jsonl),
# the same path the endless-loop and claim-progress halts already use.
# Absent, malformed, zero, and negative all degrade to the defaults below —
# flow-watchdog-lib/default-warn-ms and default-escalate-ms are the single
# source of truth for those literals, so they are not duplicated here.
# config flow_watchdog_warn_ms 900000
# config flow_watchdog_escalate_ms 3600000

# BL-651: under `config rotation router`, preferred-rotate-target orders
# rotation candidates by handoff priority band, then (inside a band) by
# newest parcel first (BL-636) - nothing weighs how LONG a role's oldest
# actionable parcel has already waited, so a queue that keeps receiving
# fresher mail at the same priority (normally home/coder) can outrank an
# older dormant parcel for as long as the fresh mail keeps arriving, with
# nothing bounding the wait. rotation_starve_after_ms bounds that: inside
# the best priority band only (age never inverts priority order), a role
# whose oldest actionable parcel (via its own enqueued_at/created_at
# header, never file mtime) has waited at or past this threshold is
# preferred over a fresher same-priority role, oldest first. The literal
# `off` disables the age input entirely, restoring pure BL-636 ordering.
# Absent, malformed, zero, and negative all degrade to the default below —
# mono-router-lib/default-rotation-starve-after-ms is the single source of
# truth for that literal (10 minutes, deliberately below
# flow_watchdog_warn_ms above so a dormant queue drains before the human is
# ever alarmed about it), so it is not duplicated here.
# config rotation_starve_after_ms 600000

# BL-536: handoffd.bb's chase sweep observes every standing role's pane
# scrollback for auth-class failure text (Invalid API key / Unauthorized /
# AuthenticationError - same detection as provider_compat_lib.bb/
# agent_runtime_lib.bb's classify-provider-error :auth) and force-respawns
# the role with provider-compat env when found - a credential error leaves
# the process alive but wedged, so ordinary liveness checks miss it (SRE
# incident 2026-07-19). auth_respawn_max_attempts bounds respawns per
# failure episode (an unbroken run of auth-class observations; a healthy
# observation ends the episode and resets the count) - once the cap is
# reached, further ticks are quiet (no more respawns) and an operator alert
# (Telegram OPERATOR topic + email) fires exactly once for that episode.
# Absent, malformed, zero, and negative all degrade to the default below -
# provider-auth-observe-lib/default-config is the single source of truth
# for that literal, so it is not duplicated here.
# config auth_respawn_max_attempts 3

# BL-840: the SAME pane scrollback handoffd.bb's chase sweep already
# captures for BL-536's auth-class observation above is also fed to a
# provider-outage observer (classify-provider-error's :unavailable class -
# rate-limit/overloaded/503/429/529 text) - no second tmux capture. A
# standing outage banner is durably recorded (.swarmforge/telemetry/
# provider-outage-YYYY-MM.jsonl) at most once per role per this interval,
# so a multi-hour outage costs a bounded number of lines rather than one
# per sweep. flow-watchdog-sweep! then subtracts every recorded interval
# that overlaps a waiting parcel's span (BL-650's provider-outage-intervals,
# gap-grouped at 10 minutes - keep this well under that so a throttled
# stream still reconstructs one contiguous interval). Absent, malformed,
# zero, and negative all degrade to the default below -
# provider-outage-evidence-lib/default-observe-min-interval-ms is the
# single source of truth for that literal, so it is not duplicated here.
# config provider_outage_observe_min_interval_ms 60000

# Format: window <role> <agent> <worktree> [task|batch] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
# Any fields after the receive mode are passed to the agent CLI, e.g. --yolo.
# --remote-control [name] enables Claude Remote Control (claude.ai/code, mobile app).
# BL-243: the coordinator is provisioned automatically by ./swarm - it is
# reserved infrastructure and is rejected outright if declared here as a
# window line (see swarmforge.sh's provision_coordinator/parse_config).
window specifier claude master --model claude-opus-5 --dangerously-skip-permissions --effort xhigh --remote-control SwarmForge-Specifier
window coder claude coder --model claude-sonnet-5 --dangerously-skip-permissions --effort xhigh --remote-control SwarmForge-Coder
window cleaner claude cleaner batch --model claude-sonnet-5 --dangerously-skip-permissions --effort high --remote-control SwarmForge-Cleaner
window architect claude architect --model claude-sonnet-5 --dangerously-skip-permissions --effort high --remote-control SwarmForge-Architect
window hardender claude hardender batch --model claude-sonnet-5 --dangerously-skip-permissions --effort high --remote-control SwarmForge-Hardender
window documenter claude documenter --model claude-sonnet-5 --dangerously-skip-permissions --effort medium --remote-control SwarmForge-Documenter
window QA claude QA --model claude-sonnet-5 --dangerously-skip-permissions --effort high --remote-control SwarmForge-QA
