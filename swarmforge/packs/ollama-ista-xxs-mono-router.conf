# ollama-ista-xxs-mono-router — EXPERIMENT (2026-10-10, human directive,
# RETRY with the vision-stripped alias): the prepared ISTA-DASLab
# Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_XXS alias on BOTH standing sides of the
# mono-router topology - the coordinator pane AND the rotation-router
# resident pipeline pane - sharing the one Ollama-loaded model concurrently
# via OLLAMA_NUM_PARALLEL=2, rather than the qwen-coord pack's split (cloud
# coordinator / local resident).
#
# 2026-10-10 update: now points at the -novision alias (coordinator work,
# backlog/evidence/coordinator-vision-strip-local-coder-20261010.md). The
# base tag ships a bundled CLIP projector (931 MiB) this text-only swarm
# never uses; `ollama show` on the vision-carrying alias lists `vision` and
# a `Projector` section, the -novision one does not (verified, plus a live
# /api/generate smoke test).
#
# Context window: the -novision alias's Modelfile now pins num_ctx 65536
# (doubled from the 32768 the 2026-10-09 probe passed 5/5 at, single-slot -
# load-tested working at 65536 single-slot, NOT yet tested at 2 concurrent
# slots). Sized for TWO concurrent slots at that window on a 16GB card:
#   weights (loaded, no projector)                               ~9.4 GiB
#   KV+compute, 2 slots @65536 (q8_0 KV; this architecture is a HYBRID
#     SSM/attention model - full_attention_interval 4 means only 16 of 64
#     layers carry a growing KV cache, the rest are fixed-size SSM state,
#     so a pure-transformer KV formula OVERSTATES real cost here)   ~2.4-4.8 GiB (unverified at 2 slots)
#   -------------------------------------------------------------------
#   total                                                     ~11.8-14.2 GiB
# against ~15.9 GiB free after unload (172 MiB baseline) - margin ranges
# ~1.7-4.1 GiB depending where the real number falls. Re-check with
# `ollama ps` + nvidia-smi after both sides have generated once; shrink
# num_ctx on the alias's Modelfile and `ollama create` again if it's tight
# (65536 -> 32768 is the known-safe fallback, already probed 5/5).
#
# PREREQ:
#   - ollama serve running with OLLAMA_NUM_PARALLEL=2 in its environment
#     (restart required - it's a server-startup var, not per-request).
#   - prepared-ista-daslab-qwen3.8-27b-gsq-rco-gguf-iq3_xxs-novision:latest
#     present (already created and load-tested 2026-10-10; rebuild via
#     `ollama create <alias> -f Modelfile` with FROM pointing at the bare
#     model blob if missing - see the evidence file above for the exact
#     blob digest and Modelfile shape).
#   - `qwen` on PATH (local-model agent driver).
#
# LAUNCH: SWARMFORGE_PACK=ollama-ista-xxs-mono-router ./start-swarm.sh

config active_backlog_max_depth 1
config rotation router
config single_inference_slot 1
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true
config coordinator_agent local-model
config coordinator_model prepared-ista-daslab-qwen3.8-27b-gsq-rco-gguf-iq3_xxs-novision:latest
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

window coder      local-model coder            --model prepared-ista-daslab-qwen3.8-27b-gsq-rco-gguf-iq3_xxs-novision:latest
window specifier  local-model master           --model prepared-ista-daslab-qwen3.8-27b-gsq-rco-gguf-iq3_xxs-novision:latest
window cleaner    local-model cleaner batch    --model prepared-ista-daslab-qwen3.8-27b-gsq-rco-gguf-iq3_xxs-novision:latest
window architect  local-model architect        --model prepared-ista-daslab-qwen3.8-27b-gsq-rco-gguf-iq3_xxs-novision:latest
window hardender  local-model hardender batch  --model prepared-ista-daslab-qwen3.8-27b-gsq-rco-gguf-iq3_xxs-novision:latest
window documenter local-model documenter       --model prepared-ista-daslab-qwen3.8-27b-gsq-rco-gguf-iq3_xxs-novision:latest
window QA         local-model QA               --model prepared-ista-daslab-qwen3.8-27b-gsq-rco-gguf-iq3_xxs-novision:latest
