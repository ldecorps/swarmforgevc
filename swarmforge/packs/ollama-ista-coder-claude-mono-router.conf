# ollama-ista-coder-claude-mono-router — mono-router with ONE local seat:
# coder runs aider on hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S (local
# ollama, GPU) under handoffd's local parcel driver; every other seat and the
# coordinator run Claude, staffed exactly like anthropic-mono-router.conf.
#
# 2026-09-28 (human via Claude Code): replaces ollama-ista-iq3s-mono-router,
# which put aider on every seat and could not move a parcel. aider is a file
# editor that cannot execute (prompt_engine_lib.bb), and the parcel driver
# only knows the coder procedure (BL-1697, driving-roles #{"coder"}), so a
# QA/architect/... rotation or an aider coordinator (--dry-run) stalled
# forever - BL-1788 sat in QA in_process from 2026-09-27. Interim shape in
# the spirit of the human's BL-1702 ruling A (local coder, Claude elsewhere);
# BL-1702 itself delivers the canonical full-forge + coder@2 --seat-tier easy
# version. Unlike BL-1702, every coder ticket goes to the local model here.
#
# No specifier window (human: specifier seat disabled 2026-09-28); the
# coordinator promotes paused tickets itself.
# No `config single_inference_slot 1`: only coder uses the local slot, so a
# consult spawn never contends with the resident for it.
#
# PREREQ: ollama serve (OLLAMA_CONTEXT_LENGTH=8192) with the ISTA tag pulled;
#         repo-root .aider.model.settings.yml (think:false) and
#         .aider.model.metadata.json (8192) entries for the ISTA slug.
# LAUNCH: ./start-swarm-ollama-ista-coder-claude.sh

config active_backlog_max_depth 1
config rotation router
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true
config coordinator_agent claude
config coordinator_model claude-sonnet-5
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

window coder      aider coder        --model openai/hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window cleaner    claude cleaner batch --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window architect  claude architect   --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window hardender  claude hardender batch --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window documenter claude documenter  --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window QA         claude QA          --model claude-opus-5-5 --dangerously-skip-permissions --effort xhigh
