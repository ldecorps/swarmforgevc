# candidate-diversified-fallback-mono-router — tier-2 fallback: survives
# b.ai AND Anthropic exhausted together.
#
# Every seat's Fallback 1 (backlog/INTAKE-model-score-report-and-
# resilience-tiered-confs.md, operator, 2026-09-09, section 3) is
# claude-sonnet-5/claude-fable-5-1 (Anthropic) - anthropic-mono-router.conf
# already IS the tier-1 fallback, no new file needed there. This pack is
# the tier-2 conf for when BOTH b.ai and Anthropic are down at once: every
# pipeline seat staffed from a THIRD plan (Cursor, OpenAI, the Alibaba
# Token Plan), picked per the intake's own discipline - never repeat a
# plan two seats in a row where a same-or-better alternate from a
# different plan exists - so one exhausted plan degrades one tier, not
# the whole swarm.
#
# Role → agent → model (plan) - rationale:
#   coder (HOME) → codex → gpt-5.3-codex        (OpenAI)
#     Fallback 2 per the intake's own table. OpenAI, not Cursor, so the
#     seat right after it (specifier) can use Cursor without repeating.
#   specifier    → cursor → auto                (Cursor)
#     Fallback 2 per the intake. Cursor, diversifying from coder's OpenAI.
#   cleaner      → cursor → auto                (Cursor)
#     Fallback 2 per the intake; Cursor again is fine here because the
#     seat before it (specifier) already broke from coder's OpenAI - the
#     discipline is never repeating the PREVIOUS seat's plan, not global
#     uniqueness.
#   architect    → codex → gpt-5.3-codex        (OpenAI)
#     Fallback 2 per the intake. OpenAI, diversifying from cleaner's Cursor.
#   hardender    → cursor → auto                (Cursor)
#     Fallback 2 per the intake. Cursor, diversifying from architect's OpenAI.
#   documenter   → aider → qwen/qwen3.7-plus    (Alibaba Token Plan)
#     The intake's own Fallback 2 table names claude-sonnet-5 here, which
#     is Anthropic and so cannot serve a pack for "both b.ai and Anthropic
#     unavailable" - the ticket's FIRM correction: qwen3.7-plus is the
#     documenter's next certified non-Anthropic pick (0.72-0.8 per the
#     intake), a third plan the four Cursor/OpenAI seats around it never
#     use.
#   QA           → cursor → auto                (Cursor)
#     Fallback 2 per the intake. Cursor, diversifying from documenter's
#     Alibaba Token Plan.
#   coordinator  → claude → claude-sonnet-5     (Anthropic - human_ruling)
#     NOT diversified. Per the intake: only Anthropic (claude-sonnet-5)
#     and b.ai (glm-5.3-flash) are PROVEN LIVE on coordinator this
#     session - no role-matrix data at all for a third pick - and this
#     ticket's own human ruling keeps claude-sonnet-5 rather than list an
#     untested coordinator pick (cursor/auto, claude-fable-5-1) as a real
#     fallback. If both b.ai and Anthropic are genuinely down, the
#     coordinator seat itself has no proven fallback yet; a real
#     coordinator trial is a separate ticket (see the intake's own
#     discipline: only score what was actually run).
#
# Every seat's eligibility (steward `eligible`, no `--override-uncertified`)
# was verified on the LAUNCH root (`/home/carillon/swarmforgevc`) by the
# specifier on 2026-09-16 - all seven picks eligible when named by the id
# the staffing gate resolves (cursor/auto, openai/gpt-5.3-codex,
# qwen/qwen3.7-plus - the aider `--model openai/qwen3.7-plus` prefix is
# aider's own OpenAI-compatible routing convention, not the steward id;
# the gate maps the Token Plan API host to provider `qwen`). The
# `.swarmforge/` steward state itself is gitignored, per-worktree runtime
# data, so this pack's acceptance never reads it directly - see
# backlog/evidence/BL-1512-coder-verdict-20260916.md and
# backlog/evidence/BL-1512-specifier-eligibility-adjudication-20260916.md.
#
# The staffing gate on the launch root (2026-09-16): the four Cursor lines
# read PASS. The two codex lines (coder, architect) read
# seat-model-unresolved - pack_staffing_gate_lib.bb's agent-model-providers
# table has no `codex` row yet (BL-1597, minted the same pass). The
# documenter line reads role-gate-not-pass - its scorecard has no recorded
# documenter-gate entry. None of this is a defect in the picks themselves
# (eligibility above is affirmative for all seven); it is steward-side
# wiring/evidence still catching up, so the hatch stays and PREREQ names
# exactly these three verdicts.
#
# PREREQ (keys in ~/.zshenv / .swarmforge/swarm.env — never in this file):
#   CURSOR_API_KEY (or the cursor agent's own logged-in session) for
#   specifier, cleaner, hardender and QA
#   OPENAI_API_KEY for coder and architect (codex agent)
#   B_AI_API_KEY is NOT this pack's documenter key - the Alibaba Token
#   Plan key the qwen-mono-router.conf documenter line already uses
#   (--openai-api-base token-plan.ap-southeast-1.maas.aliyuncs.com) for
#   the documenter seat
#   Anthropic subscription (claude on PATH, logged in) for the coordinator
#   seat (human_ruling: claude-sonnet-5, not diversified - see above)
#   PACK_STAFFING_SKIP_GATE=1 in the LAUNCHING shell - the gate refuses
#   three verdicts on the launch root today: `seat-model-unresolved` on
#   the two codex lines (clears when BL-1597 lands - a `codex` row in
#   pack_staffing_gate_lib.bb's agent-model-providers) and
#   `role-gate-not-pass` on the documenter line (clears with
#   `bb swarmforge/scripts/compliance_battery.bb gate documenter`, then
#   `bb swarmforge/scripts/model_steward_cli.bb show qwen/qwen3.7-plus`).
#   The four Cursor lines already pass without the hatch.
#
# LAUNCH:
#   source ~/.zshenv
#   SWARMFORGE_TERMINAL=none PACK_STAFFING_SKIP_GATE=1 ./swarm <root> --pack candidate-diversified-fallback-mono-router

config active_backlog_max_depth 1
config rotation router
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true

config coordinator_agent claude
config coordinator_model claude-sonnet-5
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

# FIRST line = resident home (must be coder). Non-first lines are dormant
# rotation targets until rotate_to_role respawns the pane as that role.
window coder      codex coder        --model gpt-5.3-codex
window specifier  cursor master      --model auto
window cleaner    cursor cleaner batch --model auto
window architect  codex architect    --model gpt-5.3-codex
window hardender  cursor hardender batch --model auto
window documenter aider documenter   --model openai/qwen3.7-plus --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
window QA         cursor QA          --model auto
