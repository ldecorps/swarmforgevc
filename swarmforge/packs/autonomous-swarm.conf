# BL-628: full pipeline for a brand-new AUTONOMOUS swarm on its own bare
# host - its own coordinator, its own backlog, its own target repo. Unlike
# packs/second-swarm.conf this carries NO `config swarm_mode` line at all:
# swarmforge.sh's own default (SWARM_MODE="autonomous", swarmforge.sh) is
# exactly what an autonomous box needs - a coordinator window at launch,
# and the box promotes/assigns from its own backlog rather than working
# only tickets a primary coordinator assigned it.
#
# Generated per-host by generate_autonomous_conf.sh, which substitutes the
# swarm_name below - every box needs a name unique among the operator's
# live swarms (an unmodified copy of this template, still named
# "autonomous", is refused - see generate_autonomous_conf.sh).
#
# Launch:
#   SWARMFORGE_TERMINAL=none ./swarm <target> --pack <this box's name>

config swarm_name autonomous

window specifier claude master --model claude-sonnet-5 --dangerously-skip-permissions --effort low --remote-control SwarmForge-Autonomous-Specifier
window coder claude coder --model claude-sonnet-5 --dangerously-skip-permissions --effort high --remote-control SwarmForge-Autonomous-Coder
window cleaner claude cleaner batch --model claude-sonnet-5 --dangerously-skip-permissions --effort medium --remote-control SwarmForge-Autonomous-Cleaner
window architect claude architect --model claude-sonnet-5 --dangerously-skip-permissions --effort low --remote-control SwarmForge-Autonomous-Architect
window hardender claude hardender batch --model claude-sonnet-5 --dangerously-skip-permissions --effort high --remote-control SwarmForge-Autonomous-Hardender
window documenter claude documenter --model claude-sonnet-5 --dangerously-skip-permissions --effort low --remote-control SwarmForge-Autonomous-Documenter
window QA claude QA --model claude-sonnet-5 --dangerously-skip-permissions --effort low --remote-control SwarmForge-Autonomous-QA
