# cursor-forge — standing full-forge topology with Cursor seats (NO specifier).
# Every pipeline role that exists has its own pane; no mono-router rotation.
# Specifier is intentionally absent — same posture as cursor-mono-router:
# already-specced paused/active work only; cold intake stays undrained until a
# specifier-capable pack runs. Spec-defect bounces that need a specifier
# surface to the human.
#
# PREREQ: cursor-agent on PATH; CURSOR_API_KEY in the environment.
#
# LAUNCH:
#   ./swarm <root> --pack cursor-forge
#   # or: SWARMFORGE_PACK=cursor-forge SWARMFORGE_TERMINAL=none ./swarm <root> --pack cursor-forge
#
# Day-shift-only: work 09:00–17:00; cooldown covers evening+night (17:00–09:00).
# Leave cooldown disabled for the night this pack first lands so that shift can
# finish; after it ends, flip cooldown_window_enabled true (start/end below).
#
# remote_control off: cursor-agent has no Claude-style --remote-control /rc.

config active_backlog_max_depth 3
config required_stages_routing_enabled true
config rotation standing
config remote_control off
config coordinator_agent cursor
config coordinator_model auto
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

# Keep OFF until tonight's night shift finishes; then flip to true for day-only.
# (Not 17:00–01:00 — that was 3-shift evening-only; night still ran after 01:00.)
config cooldown_window_enabled false
config cooldown_start_local 17:00
config cooldown_end_local 09:00

# Standing panes — full Cursor forge, NO specifier window.
window coder     cursor coder      --model auto
window cleaner   cursor cleaner batch --model auto
window architect cursor architect  --model auto
window hardender cursor hardender batch --model auto
window documenter cursor documenter --model auto
window QA        cursor QA         --model auto
