# cursor-forge — standing full-forge topology with Cursor seats (7+1).
# Every pipeline role has its own pane; no mono-router rotation.
#
# PREREQ: cursor-agent on PATH; CURSOR_API_KEY in the environment.
#
# LAUNCH:
#   ./swarm <root> --pack cursor-forge
#   # or: SWARMFORGE_PACK=cursor-forge SWARMFORGE_TERMINAL=none ./swarm <root> --pack cursor-forge
#
# Day-shift-only cooldown: leave disabled for the night this pack first
# lands so the current night shift can finish; enable after that shift ends
# (config cooldown_window_enabled true with start/end below).
#
# remote_control off: cursor-agent has no Claude-style --remote-control /rc.

config active_backlog_max_depth -1
config required_stages_routing_enabled true
# Standing panes (no mono-router): omit rotation — parser only accepts
# sequential|router. "standing" was refused at launch 2026-08-25.
config remote_control off
config coordinator_agent cursor
config coordinator_model auto
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

# Day + night (operator 2026-08-28): evening OFF. Cooldown covers 17:00→01:00.
config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

# Standing panes — full Cursor forge.
# BL-1001: main coder takes hard-tier work; second seat spills easy-only when idle.
# BL-1167: both seats share --model auto → tier filtering bypassed (idle-first either seat).
window specifier       cursor master         --model auto
window coder           cursor coder          --model auto --seat-tier hard
window coder@cursor2   cursor coder-cursor2  --model auto --seat-tier easy
window cleaner         cursor cleaner batch  --model auto
window architect       cursor architect      --model auto
window hardender       cursor hardender batch --model auto
window documenter      cursor documenter     --model auto
window QA              cursor QA             --model auto
