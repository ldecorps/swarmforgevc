# ollama-qwen2.5-coder-mono-router — mono-router on local Ollama, ONE model
# on every seat: qwen2.5-coder:latest (Qwen2.5-Coder-7B-Instruct, Q4_K_M).
# The certified local baseline: the only local model that has cleared the
# Model Steward's certification safety gate (c5f8472bf9) as of 2026-09-21 -
# both coordinator safety probes clean across 3 trials x 3 rounds - and the
# best coder on the fair 15-check battery (mean 12.80/15 over 5 runs, stdev
# 0.40; its only consistent misses are Ollama-style JSON tool calls, which
# aider does not use).
#
# Sibling of ollama-mixed-mono-router.conf (which splits the review tier
# onto a second model) - use this one when no second local model is
# certified for that tier. Same shape as every local pack here (BL-1142:
# rotation router, active_backlog_max_depth 1). Consumes already-specced
# backlog/active/ work at the coder seat; does not mint tickets.
#
# The coordinator seat runs aider with --dry-run --no-auto-commits
# (swarmforge.sh, 101094cc62): it cannot write or commit through aider
# whatever the model does.
#
# PREREQ: ollama serve + qwen2.5-coder:latest; aider on PATH.
# LAUNCH: ./start-swarm-ollama-qwen2.5-coder.sh
# GATES:  BL-1127 coder battery pass (backlog/evidence/, 2026-09-20 pass on
#         this tag) + BL-1142 shape gate.

config active_backlog_max_depth 1
config rotation router
config remote_control off
config coordinator_agent aider
config coordinator_model openai/qwen2.5-coder:latest
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

window coder      aider coder        --model openai/qwen2.5-coder:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
# specifier: DISABLED (human, 2026-09-21) - no window line, so it is never a
# rotation target. This pack consumes already-specced backlog/active/ work
# only; a downstream bounce that would otherwise go to specifier has no
# seat here and must be routed elsewhere (cloud full-forge) or handled by
# a human. Same shape as cursor-mono-router.conf, which also has none.
window cleaner    aider cleaner batch --model openai/qwen2.5-coder:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window architect  aider architect    --model openai/qwen2.5-coder:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window hardender  aider hardender batch --model openai/qwen2.5-coder:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window documenter aider documenter   --model openai/qwen2.5-coder:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window QA         aider QA           --model openai/qwen2.5-coder:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
