# bob-multi-provider-forge — BoB standing forge (7+1) spanning every provider
# we can actually launch with keys already on this host.
#
# One distinct vendor per pipeline seat (operator ask 2026-08-31: "BoB conf
# using all models available from all providers"). Not every catalog model —
# seven seats — but every live provider family with a working key.
#
# Role → agent → model (provider):
#   specifier  → claude  → claude-sonnet-5              (Anthropic)
#   coder      → aider   → deepseek-v4-flash            (DeepSeek direct)
#   cleaner    → vibe    → (Mistral Vibe default)       (Mistral)
#   architect  → gemini  → gemini-2.5-pro               (Google Gemini CLI)
#   hardender  → cursor  → auto                         (Cursor)
#   documenter → aider   → qwen3.7-plus                 (Qwen Token Plan)
#   QA         → cursor  → auto                         (Cursor; steward QA matrix)
#   coordinator→ claude  → claude-sonnet-5              (Anthropic; reserved)
#
# PREREQ (keys in ~/.zshenv / .swarmforge/swarm.env — never in this file):
#   Anthropic subscription (claude) · DEEPSEEK_API_KEY · MISTRAL_API_KEY ·
#   GEMINI_API_KEY · CURSOR_API_KEY · QWEN_API_KEY / BAILIAN_TOKEN_PLAN_API_KEY ·
#   OPENCODE_API_KEY
#   claude, aider, vibe, gemini, cursor-agent on PATH
#
# LAUNCH:
#   source ~/.zshenv
#   SWARMFORGE_PACK=bob-multi-provider-forge SWARMFORGE_TERMINAL=none \
#     ./swarm <root> --pack bob-multi-provider-forge
#
# Notes: DeepSeek / OpenCode / Qwen seats use window --openai-api-base; the
# launcher remaps the matching *_API_KEY → OPENAI_API_KEY for that pane only
# (same posture as Perplexity/Cerebras). Aider cannot run swarm shell helpers
# well — prefer Vibe/Cursor/Claude for protocol-heavy seats; coder/QA on
# aider here are model-diversity seats, watch for simulated ready_for_next.

config active_backlog_max_depth 3
config required_stages_routing_enabled true
config master_main_reconcile_enabled true
config remote_control off

config coordinator_agent claude
config coordinator_model claude-sonnet-5
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

# Day + night (operator 2026-08-28): evening OFF.
config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

# Format: window <role> <agent> <worktree> [task|batch] [extra-cli...]
window specifier  claude master      --model claude-sonnet-5 --dangerously-skip-permissions --effort high
window coder      aider  coder       --model openai/deepseek-v4-flash --openai-api-base https://api.deepseek.com --no-gitignore --no-show-model-warnings --no-check-update
window cleaner    vibe   cleaner batch back-one --max-price 2.00
window architect  gemini architect   --model gemini-2.5-pro
window hardender  cursor hardender batch --model auto
window documenter aider  documenter  --model openai/qwen3.7-plus --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
window QA         cursor QA          --model auto
