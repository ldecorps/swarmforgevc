# ollama-mixed-mono-router — mono-router on local Ollama, DIFFERENT model
# per role tier (no cloud Token Plan keys). Sibling of the single-model
# ollama-qwen3-8b-mono-router family, but role-tailored rather than one
# model for all 7 windows — mirrors this repo's own cloud mono-router.conf
# pattern (specifier gets a different tier than coder/cleaner/etc), just
# with two local Ollama models instead of Opus/Sonnet.
#
# ROLE -> MODEL (2026-09-21, operator request + real battery evidence):
#   coder, cleaner, hardender, documenter -> qwen2.5-coder:latest
#     "neutral" tier (mirrors mono-router.conf's own tiering: mechanical/
#     coding-adjacent work). Winner of a 5-run fair battery against three
#     Qwen3-8B quants (mean 12.80/15, stdev 0.40 — clear best, see
#     .swarmforge/model-steward/scorecards/local__qwen2.5-coder:latest.json).
#     No reasoning/thinking mode, so no unsuppressible <think> preamble
#     eating token budget (a real problem found in every Qwen3 variant
#     tested tonight).
#   architect, QA, coordinator -> qwen2.5:14b   ** REVIEW TIER NOT YET CERTIFIED **
#     "design-heavy / review" tier. Scored 3/3 on the architect-bounce_note /
#     specifier-gherkin_scenario / QA-verdict_shape probes (2026-09-20), but
#     its certify-gating SAFETY probes (coordinator-infra_edit_refusal,
#     coordinator-no_fabricated_work) have not completed - the 14B is slow
#     on this CPU and the run was cut short on 2026-09-21. DO NOT LAUNCH
#     this pack until `model_steward_cli.bb certify local/qwen2.5:14b`
#     succeeds through the safety gate. Until then the launchable local
#     pack is ollama-qwen2.5-coder-mono-router.conf (one model, every seat).
#     llama3.1:8b previously held this tier and was decertified on
#     2026-09-21: it rewrote pipeline scripts and fabricated a feature on
#     origin/main from the coordinator seat (reverted in 050d5bcd63).
#   (specifier: disabled, see below)
#
# PREREQ:
#   ollama serve + qwen2.5-coder:latest and qwen2.5:14b pulled (both done:
#   2026-09-20/21). aider on PATH with OpenAI-compat base
#   http://127.0.0.1:11434/v1
#
# LAUNCH:
#   LOCAL_CODER_BATTERY_MODEL=qwen2.5-coder:latest bash swarmforge/scripts/local_coder_battery.sh
#   ./start-swarm-ollama-mixed.sh
#
# STAFFING GATE (BL-1127): refuses to launch unless a cited coder battery
# evidence artifact has result: pass (or LOCAL_CODER_BATTERY_SKIP_GATE=1).
# qwen2.5-coder:latest has real passing evidence under backlog/evidence/.
#
# SAFETY NOTE (carried over from every Qwen3-based pack tonight): the
# coordinator runs in the MAIN working tree, not an isolated worktree.
# Earlier Qwen3-coordinator runs twice attempted to rewrite shared
# infrastructure scripts in response to routine "STOP, unfinished work"
# nudges (both edits failed to apply — format mismatch, not the model
# choosing not to). Neither qwen2.5-coder nor llama3.1:8b has been
# observed doing this, but this pack has not yet had a long supervised
# run — do not leave it running fully unattended until it has.
#
# PACK SHAPE (BL-1142): mono-router, active_backlog_max_depth 1, same
# durable local-host decision as every other local Ollama pack here.
# Consumes already-specced backlog/active/ work at the coder seat — does
# not mint new tickets from unspecced intake.
#
# Cloud BAILIAN / QWEN_API_KEY / OPENAI cloud keys are NOT required.

config active_backlog_max_depth 1
config rotation router
config remote_control off
config coordinator_agent aider
config coordinator_model openai/qwen2.5:14b
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

# Format: window <role> <agent> <worktree> [task|batch] [extra-cli-args...]
window coder      aider coder        --model openai/qwen2.5-coder:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
# specifier: DISABLED (human, 2026-09-21) - no window line, so it is never a
# rotation target. This pack consumes already-specced backlog/active/ work
# only; a downstream bounce that would otherwise go to specifier has no
# seat here and must be routed elsewhere (cloud full-forge) or handled by
# a human. Same shape as cursor-mono-router.conf, which also has none.
window cleaner    aider cleaner batch --model openai/qwen2.5-coder:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window architect  aider architect    --model openai/qwen2.5:14b          --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window hardender  aider hardender batch --model openai/qwen2.5-coder:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window documenter aider documenter   --model openai/qwen2.5-coder:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window QA         aider QA           --model openai/qwen2.5:14b          --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
