# qwen-anthropic-forge — standing full-forge (7+1) on Alibaba Token Plan
# (Anthropic-compat). Every pipeline role has its own pane; no mono-router
# rotation. Claude Code seats → token-plan …/apps/anthropic.
#
# Explicit operator ask (cloud Qwen full forge). Lite Personal Token Plan
# concurrency is 1–2 agents — standing eight panes will contend for that
# budget; prefer Team Edition for automation.
#
# Role → model (Token Plan SEA catalog):
#   all pipeline seats + coordinator → qwen3.7-plus
# Also on plan: qwen3.8-max, qwen3.7-max, qwen3.6-flash, deepseek-v4-pro, glm-5.2.
#
# PREREQ (Token Plan — docs.qwencloud.com/token-plan/personal/):
#   export BAILIAN_TOKEN_PLAN_API_KEY=sk-sp-…   # preferred; or QWEN_API_KEY
#   SWARMFORGE_USE_QWEN=1                      # maps key → ANTHROPIC_* at launch
#   claude on PATH
#
# LAUNCH:
#   source ~/.zshenv
#   SWARMFORGE_PACK=qwen-anthropic-forge ./start-swarm-qwen.sh
#
# Notes: key NEVER written into launch scripts. Personal ToS limits use to
# interactive coding tools; headless swarm may risk key revocation.

config active_backlog_max_depth 3
config required_stages_routing_enabled true
config master_main_reconcile_enabled true
config remote_control off
config coordinator_agent claude
config coordinator_model qwen3.7-plus
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

# Day + night (operator 2026-08-28): evening OFF. Cooldown covers 17:00→01:00.
config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

# Standing panes — full Token Plan forge (Claude Code → Anthropic-compat).
# Format: window <role> <agent> <worktree> [task|batch] [extra-cli...]
window specifier claude master      --model qwen3.7-plus --dangerously-skip-permissions --effort high
window coder     claude coder       --model qwen3.7-plus --dangerously-skip-permissions --effort high
window cleaner   claude cleaner batch back-one --model qwen3.7-plus --dangerously-skip-permissions --effort medium
window architect claude architect back-all  --model qwen3.7-plus --dangerously-skip-permissions --effort high
window hardender claude hardender batch --model qwen3.7-plus --dangerously-skip-permissions --effort medium
window documenter claude documenter --model qwen3.7-plus --dangerously-skip-permissions --effort medium
window QA        claude QA          --model qwen3.7-plus --dangerously-skip-permissions --effort high
