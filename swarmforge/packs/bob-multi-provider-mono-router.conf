# bob-multi-provider-mono-router — BoB mono-router starting cast.
#
# 2026-09-08 (human via Claude Code): staged diversification plan history -
#   Stage 0 — all-Anthropic, byte-identical shape to anthropic-mono-router.conf.
#   Stage 1 — cleaner -> Qwen Token Plan (qwen3.7-plus), Anthropic-compat
#             endpoint via the claude agent.
#   GLM-depletion, attempt 1 — every working role -> tencentcloud2/
#             glm-5.3-flash via b.ai/aider. Briefly reverted on an early
#             human report ("GLM won't run commands"); the human then
#             corrected that after watching it longer ("no it seems GLM is
#             able to run commands") - the earlier read looks like it was
#             just too soon to tell, not a real defect. Certification
#             evidence (top-ranked 1.0 live-battery run, same day) agrees.
#   Qwen-depletion (brief detour) — swapped every worker role to Qwen Token
#             Plan while re-checking GLM. Caught and fixed a real bug along
#             the way: SWARMFORGE_USE_QWEN=1 in the launching shell did not
#             propagate to the coordinator's pane (real OpenAI + a
#             nonexistent model name, live-verified), while the
#             structurally-identical SWARMFORGE_USE_BAI=1 path DID work
#             correctly for that same coordinator seat with b.ai minutes
#             earlier - a Qwen-specific propagation gap, not chased down
#             further. Worth a look if Qwen is revisited; not relevant to
#             this state, which is back on b.ai/GLM (coordinator included,
#             since that path is the one already verified working).
#   GLM-depletion, attempt 2 (this state) — back to every working role on
#             tencentcloud2/glm-5.3-flash via b.ai/aider, coordinator
#             included. specifier's window line stays REMOVED entirely (no
#             window line at all, not merely unstaffed) so nothing can ever
#             rotate the resident into it: no new tickets get minted or
#             re-specced, so the pack in effect just drains whatever is
#             already sitting in backlog/paused/ (already minted, already
#             spec-approved) through coder -> cleaner -> architect ->
#             hardender -> documenter -> QA.
#
# tencentcloud2/glm-5.3-flash is CERTIFIED in the model steward registry,
# and top-ranked (1.0, live-battery:coordinator-run-20260908) on
# coder/architect/QA/documenter/hardender/cleaner's own role matrices
# already - real evidence, not a guess. coordinator is NOT yet on that
# matrix, so launch still needs PACK_STAFFING_SKIP_GATE=1; worker roles
# should pass the gate clean on their own.
#
# Original 2026-09-01 intent (coder on Qwen Token Plan for the 1M context
# window) and the staged-diversification plan above are both still valid
# future directions - this is a deliberate detour, not an abandonment of
# either. Restore an Anthropic/mixed cast by reverting this file in git
# history once this experiment has run its course.
#
# Role → agent → model (provider):
#   coder (HOME) → aider → openai/glm-5.3-flash   (b.ai / tencentcloud2, OpenAI-compat)
#   specifier    → (none - role removed, nothing can rotate here)
#   cleaner      → aider → openai/glm-5.3-flash   (b.ai / tencentcloud2, OpenAI-compat)
#   architect    → aider → openai/glm-5.3-flash   (b.ai / tencentcloud2, OpenAI-compat)
#   hardender    → aider → openai/glm-5.3-flash   (b.ai / tencentcloud2, OpenAI-compat)
#   documenter   → aider → openai/glm-5.3-flash   (b.ai / tencentcloud2, OpenAI-compat)
#   QA           → aider → openai/glm-5.3-flash   (b.ai / tencentcloud2, OpenAI-compat)
#   coordinator  → aider → openai/glm-5.3-flash   (b.ai / tencentcloud2; auto-provisioned)
#
# PREREQ (keys in ~/.zshenv / .swarmforge/swarm.env — never in this file):
#   B_AI_API_KEY for every seat
#   aider on PATH
#   SWARMFORGE_USE_BAI=1 in the LAUNCHING shell (not just the pane env) -
#   required for the coordinator specifically: provision_coordinator's own
#   aider branch (swarmforge.sh) never adds --openai-api-base, so its pane
#   only gets remapped via the "already opted in" branch of the b.ai guard,
#   never the per-pane host-sniff branch every worker window line below
#   gets for free (their own --openai-api-base https://api.b.ai/v1 literal
#   triggers that automatically). Worker roles do not need this set
#   externally; the coordinator does. Verified live working for this exact
#   seat earlier today - unlike the Qwen equivalent, above.
#   PACK_STAFFING_SKIP_GATE=1 in the LAUNCHING shell - coordinator is not
#   yet on the model steward's role matrix for glm-5.3-flash (worker roles
#   are already certified/top-ranked and should not need this, but the
#   whole launch shares one flag).
#
# LAUNCH:
#   source ~/.zshenv
#   SWARMFORGE_USE_BAI=1 PACK_STAFFING_SKIP_GATE=1 SWARMFORGE_PACK=bob-multi-provider-mono-router ./start-swarm.sh

config active_backlog_max_depth 1
config rotation router
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true

config coordinator_agent aider
config coordinator_model openai/glm-5.3-flash
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

# FIRST line = resident home (must be coder). Non-first lines are dormant
# rotation targets until rotate_to_role respawns the pane as that role.
# specifier is deliberately ABSENT - see the header note above.
window coder      aider coder        --model openai/glm-5.3-flash --openai-api-base https://api.b.ai/v1 --no-gitignore --no-show-model-warnings --no-check-update
window cleaner    aider cleaner batch --model openai/glm-5.3-flash --openai-api-base https://api.b.ai/v1 --no-gitignore --no-show-model-warnings --no-check-update
window architect  aider architect    --model openai/glm-5.3-flash --openai-api-base https://api.b.ai/v1 --no-gitignore --no-show-model-warnings --no-check-update
window hardender  aider hardender batch --model openai/glm-5.3-flash --openai-api-base https://api.b.ai/v1 --no-gitignore --no-show-model-warnings --no-check-update
window documenter aider documenter   --model openai/glm-5.3-flash --openai-api-base https://api.b.ai/v1 --no-gitignore --no-show-model-warnings --no-check-update
window QA         aider QA           --model openai/glm-5.3-flash --openai-api-base https://api.b.ai/v1 --no-gitignore --no-show-model-warnings --no-check-update
