# bob-multi-provider-mono-router — BoB mono-router starting cast.
#
# 2026-09-08 (human via Claude Code): staged diversification plan history -
#   Stage 0 — all-Anthropic, byte-identical shape to anthropic-mono-router.conf.
#   Stage 1 — cleaner -> Qwen Token Plan (qwen3.7-plus), Anthropic-compat
#             endpoint via the claude agent.
#   GLM-depletion (two attempts, b.ai/aider) and Qwen-depletion via aider
#             both tried and both hit real problems: GLM needed a longer
#             observation window before it was confirmed actually running
#             commands; Qwen via aider never did - human report "outputting
#             the commands as opposed to running them". Checked the actual
#             qwen3.7-plus/coder certification evidence
#             (.swarmforge/model-steward/trials/qwen-token-plan-lite-20260829/
#             qwen3-7-plus-coder-cli.json): it is Claude Code CLI's own
#             output shape (session_id, num_turns, subagent_stats) - the
#             certification was earned entirely through the claude agent's
#             Anthropic-compat path, NEVER through aider. No aider-based
#             Qwen trial exists anywhere in the model-steward's records.
#             aider+Qwen was therefore genuinely unproven, not just unlucky.
#   Qwen-depletion via claude agent (this state) — every role, including
#             coordinator this time, back on the claude agent (Anthropic-
#             compat, same proven path as Stage 1's cleaner and this
#             model's own certification evidence) instead of aider.
#             specifier's window line stays REMOVED entirely (no minting/
#             re-speccing possible) - still draining backlog/paused/ only.
#             Earlier today's aider-specific coordinator propagation bug
#             (SWARMFORGE_USE_QWEN not reaching an aider pane with no
#             --openai-api-base flag) is a DIFFERENT code path
#             (qwen_guard_map_if_flagged/OPENAI_*) from this one
#             (qwen_guard_map_anthropic_compat/ANTHROPIC_*, triggered by
#             extra_cli_targets_qwen_cloud sniffing the coordinator's own
#             --model qwen3.7-plus flag) - expected NOT to recur here, but
#             verify live before trusting it (same as every stage above).
#
# Role → agent → model (provider):
#   coder (HOME) → claude → qwen3.7-plus   (Qwen Token Plan, Anthropic-compat)
#   specifier    → (none - role removed, nothing can rotate here)
#   cleaner      → claude → qwen3.7-plus   (Qwen Token Plan, Anthropic-compat)
#   architect    → claude → qwen3.7-plus   (Qwen Token Plan, Anthropic-compat)
#   hardender    → claude → qwen3.7-plus   (Qwen Token Plan, Anthropic-compat)
#   documenter   → claude → qwen3.7-plus   (Qwen Token Plan, Anthropic-compat)
#   QA           → claude → qwen3.7-plus   (Qwen Token Plan, Anthropic-compat)
#   coordinator  → claude → qwen3.7-plus   (Qwen Token Plan; auto-provisioned)
#
# PREREQ (keys in ~/.zshenv / .swarmforge/swarm.env — never in this file):
#   QWEN_API_KEY / BAILIAN_TOKEN_PLAN_API_KEY / BAILIAN_CODING_PLAN_API_KEY for every seat
#   claude on PATH
#   No SWARMFORGE_USE_QWEN needed at launch - swarmforge.sh's
#   extra_cli_targets_qwen_cloud detects each seat's own --model qwen* and
#   remaps that pane's ANTHROPIC_BASE_URL/ANTHROPIC_AUTH_TOKEN to the Token
#   Plan endpoint automatically, coordinator included this time (its own
#   generated --model flag is qwen3.7-plus too, unlike the aider branch
#   which never carried a base-url flag for host-sniffing to find).
#   PACK_STAFFING_SKIP_GATE=1 in the LAUNCHING shell - pack_staffing_gate_lib.bb's
#   agent-model-providers table has an entry for ["claude" "qwen3.8-max"]
#   but not qwen3.7-plus, a code-table gap (the model itself IS certified),
#   same class of gap Stage 1's cleaner already needed this for.
#
# LAUNCH:
#   source ~/.zshenv
#   PACK_STAFFING_SKIP_GATE=1 SWARMFORGE_PACK=bob-multi-provider-mono-router ./start-swarm.sh

config active_backlog_max_depth 1
config rotation router
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true

config coordinator_agent claude
config coordinator_model qwen3.7-plus
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

# FIRST line = resident home (must be coder). Non-first lines are dormant
# rotation targets until rotate_to_role respawns the pane as that role.
# specifier is deliberately ABSENT - see the header note above.
window coder      claude coder       --model qwen3.7-plus --dangerously-skip-permissions --effort high
window cleaner    claude cleaner batch --model qwen3.7-plus --dangerously-skip-permissions --effort medium
window architect  claude architect   --model qwen3.7-plus --dangerously-skip-permissions --effort high
window hardender  claude hardender batch --model qwen3.7-plus --dangerously-skip-permissions --effort medium
window documenter claude documenter  --model qwen3.7-plus --dangerously-skip-permissions --effort medium
window QA         claude QA          --model qwen3.7-plus --dangerously-skip-permissions --effort high
