# bob-multi-provider-mono-router — BoB mono-router, Token Plan Qwen pipeline
# with Anthropic Max coordinator only.
#
# Operator hotfix 2026-09-01: staff every pipeline seat on Token Plan
# qwen3.8-max (Claude agent → apps/anthropic) for a quality trial, and keep
# coordinator on first-party claude-sonnet-5 so wake/poke stays Max-backed.
#
# Context: Claude Code mis-sizes unrecognized gateway model IDs (~50k
# auto-compact). Launcher exports CLAUDE_CODE_MAX_CONTEXT_TOKENS=1000000 on
# every Qwen Claude seat so the real 1M Token Plan window is used.
#
# Role → agent → model (provider):
#   coder (HOME) → claude → qwen3.8-max               (Qwen Token Plan /apps/anthropic)
#   specifier    → claude → qwen3.8-max               (Qwen Token Plan /apps/anthropic)
#   cleaner      → claude → qwen3.8-max               (Qwen Token Plan /apps/anthropic)
#   architect    → claude → qwen3.8-max               (Qwen Token Plan /apps/anthropic)
#   hardender    → claude → qwen3.8-max               (Qwen Token Plan /apps/anthropic)
#   documenter   → claude → qwen3.8-max               (Qwen Token Plan /apps/anthropic)
#   QA           → claude → qwen3.8-max               (Qwen Token Plan /apps/anthropic)
#   coordinator  → claude → claude-sonnet-5           (Anthropic Max; auto-provisioned)
#
# PREREQ (keys in ~/.zshenv / .swarmforge/swarm.env — never in this file):
#   Anthropic subscription (claude) for coordinator
#   BAILIAN_TOKEN_PLAN_API_KEY=sk-sp-… (or QWEN_API_KEY) for every pipeline seat
#   claude on PATH
#
# Do NOT set SWARMFORGE_USE_QWEN=1 at pack launch — that remaps EVERY Claude
# seat onto Token Plan (including coordinator). The launcher remaps only seats
# whose --model is qwen*.
#
# LAUNCH:
#   source ~/.zshenv
#   SWARMFORGE_PACK=bob-multi-provider-mono-router ./start-swarm.sh
#   # or: SWARMFORGE_TERMINAL=none ./swarm <root> --pack bob-multi-provider-mono-router

config active_backlog_max_depth 1
config rotation router
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true

config coordinator_agent claude
config coordinator_model claude-sonnet-5
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

# FIRST line = resident home (must be coder). Non-first lines are dormant
# rotation targets until rotate_to_role respawns the pane as that role.
window coder      claude coder       --model qwen3.8-max --dangerously-skip-permissions --effort high
window specifier  claude master      --model qwen3.8-max --dangerously-skip-permissions --effort high
window cleaner    claude cleaner batch --model qwen3.8-max --dangerously-skip-permissions --effort medium
window architect  claude architect   --model qwen3.8-max --dangerously-skip-permissions --effort high
window hardender  claude hardender batch --model qwen3.8-max --dangerously-skip-permissions --effort medium
window documenter claude documenter  --model qwen3.8-max --dangerously-skip-permissions --effort medium
window QA         claude QA          --model qwen3.8-max --dangerously-skip-permissions --effort high
