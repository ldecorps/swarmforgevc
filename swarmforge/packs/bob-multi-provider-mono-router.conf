# bob-multi-provider-mono-router — BoB mono-router starting cast.
#
# 2026-09-09 (human via Claude Code): PROVIDER-EXHAUSTION SWITCH. Operator
# reports Qwen Cloud Token Plan exhausted (was the previous state here,
# claude-agent+Anthropic-compat), Copilot and Cursor exhausted, and
# Anthropic itself nearly exhausted. b.ai (GLM) is the only plan with real
# headroom left, so EVERY seat including coordinator moved there, same
# shape as the earlier same-day "back to GLM (human confirmed it does run
# commands)" state (commit 651ff50095).
#
# 2026-09-09 (later, same day): TRYING b.ai's Anthropic-compat surface
# (confirmed real via docs.b.ai/llmservice/api/ - same host
# https://api.b.ai/v1, path /messages, Anthropic Messages protocol) via the
# claude agent instead of aider's OpenAI-compat path, on coder ONLY for
# now (same incremental-rollout posture as Stage 1's cleaner-only Qwen
# test) - new code path (extra_cli_targets_bai_cloud +
# bai_guard_map_anthropic_compat in swarmforge.sh / bai_launch_guard_lib.sh),
# unverified before this pack's own launch. Verify live via
# /proc/<pid>/environ (ANTHROPIC_BASE_URL=https://api.b.ai/v1,
# ANTHROPIC_AUTH_TOKEN set) before trusting it beyond this one seat -
# every other seat + coordinator STAY on the already-proven aider path
# below, since that is the only thing keeping the swarm alive right now.
#
# Role → agent → model (provider):
#   coder (HOME) → claude → glm-5.3-flash         (b.ai, Anthropic-compat - NEW, unverified until launched)
#   specifier    → (none - role removed, nothing can rotate here)
#   cleaner      → aider → openai/glm-5.3-flash   (b.ai, OpenAI-compat)
#   architect    → aider → openai/glm-5.3-flash   (b.ai, OpenAI-compat)
#   hardender    → aider → openai/glm-5.3-flash   (b.ai, OpenAI-compat)
#   documenter   → aider → openai/glm-5.3-flash   (b.ai, OpenAI-compat)
#   QA           → aider → openai/glm-5.3-flash   (b.ai, OpenAI-compat)
#   coordinator  → aider → openai/glm-5.3-flash   (b.ai; auto-provisioned)
#
# PREREQ (keys in ~/.zshenv / .swarmforge/swarm.env — never in this file):
#   B_AI_API_KEY for every seat
#   aider on PATH
#   SWARMFORGE_USE_BAI=1 in the LAUNCHING shell - provision_coordinator's
#   aider branch carries no explicit --openai-api-base flag of its own, so
#   the coordinator's remap can only happen via this already-opted-in
#   branch (verified working for b.ai earlier today, unlike the analogous
#   SWARMFORGE_USE_QWEN path which never propagated to the coordinator).
#   PACK_STAFFING_SKIP_GATE=1 in the LAUNCHING shell - pack_staffing_gate_lib.bb's
#   agent-model-providers table has no ["aider" "openai/glm-5.3-flash"]
#   entry despite the model itself being certified.
#
# LAUNCH:
#   source ~/.zshenv
#   SWARMFORGE_USE_BAI=1 PACK_STAFFING_SKIP_GATE=1 SWARMFORGE_PACK=bob-multi-provider-mono-router ./start-swarm.sh

config active_backlog_max_depth 1
config rotation router
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true

config coordinator_agent aider
config coordinator_model openai/glm-5.3-flash
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

# FIRST line = resident home (must be coder). Non-first lines are dormant
# rotation targets until rotate_to_role respawns the pane as that role.
# specifier is deliberately ABSENT - see the header note above.
window coder      claude coder       --model glm-5.3-flash --dangerously-skip-permissions --effort high
window cleaner    aider cleaner batch --model openai/glm-5.3-flash --openai-api-base https://api.b.ai/v1 --no-gitignore --no-show-model-warnings --no-check-update
window architect  aider architect    --model openai/glm-5.3-flash --openai-api-base https://api.b.ai/v1 --no-gitignore --no-show-model-warnings --no-check-update
window hardender  aider hardender batch --model openai/glm-5.3-flash --openai-api-base https://api.b.ai/v1 --no-gitignore --no-show-model-warnings --no-check-update
window documenter aider documenter   --model openai/glm-5.3-flash --openai-api-base https://api.b.ai/v1 --no-gitignore --no-show-model-warnings --no-check-update
window QA         aider QA           --model openai/glm-5.3-flash --openai-api-base https://api.b.ai/v1 --no-gitignore --no-show-model-warnings --no-check-update
