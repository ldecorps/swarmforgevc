# bob-multi-provider-mono-router — BoB mono-router starting cast.
#
# 2026-09-08 (human via Claude Code): staged diversification plan history -
#   Stage 0 — all-Anthropic, byte-identical shape to anthropic-mono-router.conf.
#   Stage 1 — cleaner -> Qwen Token Plan (qwen3.7-plus), Anthropic-compat
#             endpoint via the claude agent.
#   GLM-depletion (same day) — every working role -> tencentcloud2/
#             glm-5.3-flash via b.ai/aider. REVERTED same day: human report
#             "GLM won't run commands" - real tool-use failure through
#             aider despite passing today's live-battery certification
#             (certification exercised something narrower than actual
#             command execution reliability - worth a look separately, not
#             re-litigated in this file).
#   Qwen-depletion (this state) — every working role -> Qwen Token Plan
#             (qwen3.7-plus) via aider (OpenAI-compat), same "drain what is
#             already minted" shape as the GLM attempt: specifier's window
#             line stays REMOVED entirely (no minting/re-speccing possible).
#             Chose aider (not the claude agent's Anthropic-compat path,
#             Stage 1's approach) so every worker role shares one uniform
#             agent/provider combo instead of mixing claude-Qwen and
#             aider-Qwen seat-to-seat.
#
# Original 2026-09-01 intent (coder on Qwen Token Plan for the 1M context
# window) is subsumed by this state (coder is now Qwen too, via aider
# rather than claude - context sizing note below). Restore an
# Anthropic/mixed cast by reverting this file in git history once this
# experiment has run its course.
#
# Role → agent → model (provider):
#   coder (HOME) → aider → openai/qwen3.7-plus   (Qwen Token Plan, OpenAI-compat)
#   specifier    → (none - role removed, nothing can rotate here)
#   cleaner      → aider → openai/qwen3.7-plus   (Qwen Token Plan, OpenAI-compat)
#   architect    → aider → openai/qwen3.7-plus   (Qwen Token Plan, OpenAI-compat)
#   hardender    → aider → openai/qwen3.7-plus   (Qwen Token Plan, OpenAI-compat)
#   documenter   → aider → openai/qwen3.7-plus   (Qwen Token Plan, OpenAI-compat)
#   QA           → aider → openai/qwen3.7-plus   (Qwen Token Plan, OpenAI-compat)
#   coordinator  → aider → openai/qwen3.7-plus   (Qwen Token Plan; auto-provisioned)
#
# One model everywhere (qwen3.7-plus, not the cheaper qwen3.6-flash
# qwen-mono-router.conf uses for coordinator) deliberately: qwen3.7-plus is
# already CERTIFIED in the model steward registry (qwen3.6-flash is only
# "candidate"), so this is one fewer uncertified-model gap to carry through
# PACK_STAFFING_SKIP_GATE.
#
# PREREQ (keys in ~/.zshenv / .swarmforge/swarm.env — never in this file):
#   QWEN_API_KEY / BAILIAN_TOKEN_PLAN_API_KEY / BAILIAN_CODING_PLAN_API_KEY for every seat
#   aider on PATH
#   SWARMFORGE_USE_QWEN=1 in the LAUNCHING shell (not just the pane env) -
#   required for the coordinator specifically: provision_coordinator's own
#   aider branch (swarmforge.sh) never adds --openai-api-base, so its pane
#   only gets remapped via qwen_guard_map_if_flagged's "already opted in"
#   branch, never the per-pane host-sniff branch every worker window line
#   below gets for free (their own --openai-api-base literal naming the
#   Token Plan host triggers qwen_guard_require_token_plan_endpoint
#   automatically). Worker roles do not need this set externally; the
#   coordinator does.
#   PACK_STAFFING_SKIP_GATE=1 in the LAUNCHING shell - coordinator is not
#   yet on the model steward's role matrix for qwen3.7-plus (worker roles
#   are already certified and likely on-matrix, but the whole launch
#   shares one flag).
#
# LAUNCH:
#   source ~/.zshenv
#   SWARMFORGE_USE_QWEN=1 PACK_STAFFING_SKIP_GATE=1 SWARMFORGE_PACK=bob-multi-provider-mono-router ./start-swarm.sh

config active_backlog_max_depth 1
config rotation router
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true

config coordinator_agent aider
config coordinator_model openai/qwen3.7-plus
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

# FIRST line = resident home (must be coder). Non-first lines are dormant
# rotation targets until rotate_to_role respawns the pane as that role.
# specifier is deliberately ABSENT - see the header note above.
window coder      aider coder        --model openai/qwen3.7-plus --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
window cleaner    aider cleaner batch --model openai/qwen3.7-plus --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
window architect  aider architect    --model openai/qwen3.7-plus --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
window hardender  aider hardender batch --model openai/qwen3.7-plus --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
window documenter aider documenter   --model openai/qwen3.7-plus --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
window QA         aider QA           --model openai/qwen3.7-plus --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
