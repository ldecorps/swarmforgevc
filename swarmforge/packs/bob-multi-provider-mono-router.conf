# bob-multi-provider-mono-router — BoB mono-router starting cast.
#
# 2026-09-08 (human via Claude Code): RESET to an all-Anthropic starting
# cast, Stage 0 of a deliberate staged diversification plan (agreed with
# the human, not yet built beyond this reset):
#   Stage 0 — all-Anthropic, byte-identical shape to anthropic-mono-router.conf.
#   Stage 1 (this state, since 2026-09-08) — cleaner -> Qwen Token Plan
#             (qwen3.7-plus), Anthropic-compat endpoint via the claude
#             agent, real tool use, the same proven path
#             qwen-anthropic-mono-router already uses. See the window line's
#             own comment below for the exact remap mechanism/gate note.
#   Stage 2 — coder (the resident/HOME seat) -> Qwen Token Plan too, for the
#             1M-context window (this pack's original 2026-09-01 intent).
#             Higher stakes: measure bounce rate like the fable-5 experiment.
#   Stage 3 — one b.ai model (e.g. GLM via api.b.ai) on a low-stakes seat
#             (documenter/cleaner), via the aider agent (OpenAI-protocol,
#             real tool use) - NOT the claude agent. b.ai's models are
#             OpenAI-compatible chat-completions underneath, not Anthropic
#             protocol; this repo already learned that routing a
#             non-Claude model through the Anthropic-compat path is
#             unreliable (openrouter-anthropic-mono-router.conf's own
#             "avoids Kimi 429/404 churn" note). The GLM Telegram seat built
#             2026-09-04/05 is a passive sidecar chat only (no tool use) -
#             this stage is the first real test of a b.ai model actually
#             doing pipeline work.
#   Stage 4 — an OpenAI seat via the codex agent (native, already proven -
#             codex-mono-router.conf), not routed through b.ai.
#   Stage 5+ — keep diversifying one seat at a time; keep at least one
#             judgment-heavy seat (specifier/architect) on plain Anthropic
#             until each new provider has real runs behind it.
# Every new model/agent combo will need its own model-steward pass
# (registration, likely PACK_STAFFING_SKIP_GATE=1 short-term, real
# certification later) - expect that at every stage above, not just once.
#
# Role → agent → model (provider), Stage 1:
#   coder (HOME) → claude → claude-sonnet-5           (Anthropic)
#   specifier    → claude → claude-sonnet-5           (Anthropic)
#   cleaner      → claude → qwen3.7-plus              (Qwen Token Plan, Anthropic-compat)
#   architect    → claude → claude-sonnet-5           (Anthropic)
#   hardender    → claude → claude-sonnet-5           (Anthropic)
#   documenter   → claude → claude-sonnet-5           (Anthropic)
#   QA           → claude → claude-sonnet-5           (Anthropic)
#   coordinator  → claude → claude-sonnet-5           (Anthropic; auto-provisioned)
#
# PREREQ (keys in ~/.zshenv / .swarmforge/swarm.env — never in this file):
#   Anthropic subscription (claude) for every non-cleaner seat
#   ANTHROPIC_BASE_URL/ANTHROPIC_AUTH_TOKEN/ANTHROPIC_API_KEY unset globally
#   (first-party, not a gateway) - the cleaner seat's own remap is scoped to
#   its pane only, per the window line's comment above
#   QWEN_API_KEY / BAILIAN_TOKEN_PLAN_API_KEY / BAILIAN_CODING_PLAN_API_KEY for cleaner
#   claude on PATH
#
# LAUNCH:
#   source ~/.zshenv
#   SWARMFORGE_PACK=bob-multi-provider-mono-router ./start-swarm.sh
#   # or: SWARMFORGE_TERMINAL=none ./swarm <root> --pack bob-multi-provider-mono-router

config active_backlog_max_depth 1
config rotation router
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true

config coordinator_agent claude
config coordinator_model claude-sonnet-5
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

# FIRST line = resident home (must be coder). Non-first lines are dormant
# rotation targets until rotate_to_role respawns the pane as that role.
#
# 2026-09-08 (human via Claude Code): Stage 1 - cleaner moved to Qwen Token
# Plan (qwen3.7-plus, certified in the model steward registry), Anthropic-
# compat endpoint via the claude agent. No SWARMFORGE_USE_QWEN needed at
# launch - swarmforge.sh's extra_cli_targets_qwen_cloud detects this seat's
# own --model qwen* and remaps ONLY this pane's ANTHROPIC_BASE_URL/
# ANTHROPIC_AUTH_TOKEN to the Token Plan endpoint; sibling Anthropic seats
# keep first-party subscription auth unchanged (swarmforge.sh:2003-2012).
# Needs QWEN_API_KEY / BAILIAN_TOKEN_PLAN_API_KEY / BAILIAN_CODING_PLAN_API_KEY
# in the launch environment (~/.zshenv). Gate note: pack_staffing_gate_lib.bb's
# agent-model-providers table only has an entry for qwen3.8-max, not
# qwen3.7-plus - this is a code-table gap (qwen3.7-plus IS the certified
# model), not an uncertified-model refusal, so launch needs
# PACK_STAFFING_SKIP_GATE=1 until that table gets the entry added.
window coder      claude coder       --model claude-sonnet-5 --dangerously-skip-permissions --effort high
window specifier  claude master      --model claude-sonnet-5 --dangerously-skip-permissions --effort high
window cleaner    claude cleaner batch --model qwen3.7-plus --dangerously-skip-permissions --effort medium
window architect  claude architect   --model claude-sonnet-5 --dangerously-skip-permissions --effort high
window hardender  claude hardender batch --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window documenter claude documenter  --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window QA         claude QA          --model claude-sonnet-5 --dangerously-skip-permissions --effort high
