# bob-multi-provider-mono-router — BoB mono-router spanning every live provider.
#
# ONE resident (coder home) that rotates through every pipeline role, each
# seat on a different vendor (operator 2026-08-31). Coder stays on Claude so
# handoffd wake / poke stays reliable; other stages pick up their own agent
# + model on rotate_to_role respawn.
#
# Role → agent → model (provider):
#   coder (HOME) → claude → claude-sonnet-5           (Anthropic)
#   specifier    → gemini → gemini-2.5-pro            (Google)
#   cleaner      → vibe   → Mistral Vibe default      (Mistral)
#   architect    → aider  → deepseek-v4-flash         (DeepSeek)
#   hardender    → cursor → auto                      (Cursor)
#   documenter   → aider  → qwen3.7-plus              (Qwen Token Plan)
#   QA           → cursor → auto                      (Cursor; steward QA matrix)
#   coordinator  → claude → claude-sonnet-5           (auto-provisioned)
#
# 2026-08-31: QA moved off opencode/nemotron-3-ultra-free — globally
# "certified" but QA-gate still pending and absent from QA role-matrix.
# See backlog/INTAKE-pack-launch-steward-staffing-gate.md.
#
# PREREQ: same keys as bob-multi-provider-forge.conf (see that pack header).
#
# LAUNCH:
#   source ~/.zshenv
#   SWARMFORGE_PACK=bob-multi-provider-mono-router ./start-swarm.sh
#   # or: SWARMFORGE_TERMINAL=none ./swarm <root> --pack bob-multi-provider-mono-router

config active_backlog_max_depth 1
config rotation router
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true

config coordinator_agent claude
config coordinator_model claude-sonnet-5
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

# FIRST line = resident home (must be coder). Non-first lines are dormant
# rotation targets until rotate_to_role respawns the pane as that role.
window coder      claude coder       --model claude-sonnet-5 --dangerously-skip-permissions --effort high
window specifier  gemini master      --model gemini-2.5-pro
window cleaner    vibe   cleaner batch back-one --max-price 2.00
window architect  aider  architect   --model openai/deepseek-v4-flash --openai-api-base https://api.deepseek.com --no-gitignore --no-show-model-warnings --no-check-update
window hardender  cursor hardender batch --model auto
window documenter aider  documenter  --model openai/qwen3.7-plus --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
window QA         cursor QA          --model auto
