# ollama-slevin-local-model-forge — standing forge (BL-2078 shape) with the
# prepared Slevin Qwen3.6-35B-A3B IQ3 -novision alias on every pipeline seat
# AND the coordinator. Same topology as
# ollama-slevin-local-model-claude-coord-forge (no rotation router, depth 3),
# but the coordinator is local-model too — human directive 2026-10-10.
# Allowed only behind the shim's decode slot (one GPU load, seats queue).
#
# Model: prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
# (num_ctx 65536 on the alias Modelfile; ~13 GiB weights — one concurrent
# decode via the shim; coordinator bookkeeping shares that slot with seats).
#
# PREREQ: ollama serve; the -novision alias present; `qwen` on PATH;
#         local-model tool-call shim on (default).
# LAUNCH: ./start-swarm-ollama-slevin-local-model-forge.sh

config active_backlog_max_depth 3
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true
config coordinator_agent local-model
config coordinator_model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

window coder      local-model coder            --model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
window specifier  local-model master           --model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
window cleaner    local-model cleaner batch    --model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
window architect  local-model architect        --model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
window hardender  local-model hardender batch  --model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
window documenter local-model documenter       --model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
window QA         local-model QA               --model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
