# ollama-ista-iq3s-mono-router — mono-router on local Ollama, ONE model on
# every seat: hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S (GSQ-RCO
# non-uniform GGUF quant of Qwen3.8-27B, ~12GB). Sibling of
# ollama-qwen2.5-coder-mono-router.conf, model swapped only (BL-1142 shape
# preserved: rotation router, active_backlog_max_depth 1).
#
# 2026-09-23: this base model is a hybrid-reasoning ("thinking") model — it
# emits a full <think>...</think> block before its answer unless suppressed.
# Ollama's native `think` request param (not the in-prompt `/no_think`
# convention, which this fine-tune does not honor) structurally suppresses
# it, cutting output tokens ~3.5x and wall time ~3x on this CPU host in
# testing. Wired via the repo-root .aider.model.settings.yml entry for this
# exact model id (extra_params: {think: false}, plus reasoning_tag: think
# as a defense-in-depth strip if a future prompt ever leaks one anyway).
# Verified end-to-end: aider produced a clean SEARCH/REPLACE diff with zero
# leaked reasoning against this model + settings file.
#
# Generation is slower than qwen2.5-coder (~2.3-2.7 tok/s vs ~5.4 tok/s on
# this host) — a real per-edit latency cost, accepted knowingly when staffing
# this pack over the qwen2.5-coder baseline.
#
# PREREQ: ollama serve + hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S
#         pulled; aider on PATH; repo-root .aider.model.settings.yml present
#         (think:false wiring — do not staff this model without it).
# LAUNCH: ./start-swarm-ollama-ista-iq3s.sh
# GATES:  BL-1127 coder battery pass (backlog/evidence/BL-1127-coder-battery-
#         ollama-hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S-
#         20260923T063726Z.md) + BL-1142 shape gate.

config active_backlog_max_depth 1
config rotation router
# 2026-09-23 (Claude Code, operator hotfix 7d109d3b2e): one llama-server
# slot (`-np 1`) serves every seat on this host - a consult spawn (e.g.
# QA consulted mid-coder-parcel) is a second requester for that one slot,
# not a cheap parallel win. Refuses the consult-spawn escape hatch outright
# rather than let it contend with whatever already holds the slot.
config single_inference_slot 1
config remote_control off
config coordinator_agent aider
config coordinator_model openai/hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

window coder      aider coder        --model openai/hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window cleaner    aider cleaner batch --model openai/hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window architect  aider architect    --model openai/hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window hardender  aider hardender batch --model openai/hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window documenter aider documenter   --model openai/hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window QA         aider QA           --model openai/hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
