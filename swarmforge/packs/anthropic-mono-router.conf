# anthropic-mono-router — first-party Anthropic on every seat, no exceptions.
#
# Same lineage as bob-multi-provider-mono-router, minus the coder-on-Qwen
# carve-out (BL-1323, 09-01: coder pinned to Token Plan qwen3.8-max for the
# 1M-token context window while the Anthropic Token Plan quota was exhausted).
# Pure single-provider mono-router, first-party Claude subscription (not
# OpenRouter; see openrouter-anthropic-mono-router for that variant).
# Model/effort per seat matches full-forge.conf (specifier and QA on
# claude-opus-5-5 / xhigh; everyone else on claude-sonnet-5).
#
# Role → agent → model / effort (provider) — matches full-forge.conf:
#   coder (HOME) → claude → claude-sonnet-5   / xhigh  (Anthropic)
#   specifier    → claude → claude-opus-5-5   / xhigh  (Anthropic)
#   cleaner      → claude → claude-sonnet-5   / medium (Anthropic)
#   architect    → claude → claude-sonnet-5   / medium (Anthropic)
#   hardender    → claude → claude-sonnet-5   / medium (Anthropic)
#   documenter   → claude → claude-sonnet-5   / medium (Anthropic)
#   QA           → claude → claude-opus-5-5   / xhigh  (Anthropic)
#   coordinator  → claude → claude-sonnet-5   / medium (Anthropic; auto-provisioned)
#
# PREREQ:
#   Anthropic subscription (claude on PATH, logged in) for every seat
#   ANTHROPIC_BASE_URL/ANTHROPIC_AUTH_TOKEN/ANTHROPIC_API_KEY unset (first-party, not a gateway)
#
# LAUNCH:
#   source ~/.zshenv
#   SWARMFORGE_PACK=anthropic-mono-router ./start-swarm.sh
#   # or: SWARMFORGE_TERMINAL=none ./swarm <root> --pack anthropic-mono-router

config active_backlog_max_depth 1
config rotation router
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true

config coordinator_agent claude
config coordinator_model claude-sonnet-5
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

# FIRST line = resident home (must be coder). Non-first lines are dormant
# rotation targets until rotate_to_role respawns the pane as that role.
#
# 2026-09-28 (operator): model/effort table aligned with full-forge.conf
# so the first-party Anthropic mono-router and the standing Anthropic
# forge staff the same seats the same way. Specifier and QA take
# claude-opus-5-5 / xhigh; coder stays sonnet-5 but at xhigh; architect
# drops high -> medium. Cleaner / hardender / documenter / coordinator
# already matched. Still first-party Anthropic, so the header's "no
# exceptions" is about provider, not model uniformity. Takes effect next
# time the resident rotates into a role (rotate_to_role re-execs
# .swarmforge/launch/<role>.sh), not the current pane.
# pack_staffing_gate_lib.bb has no agent-model-providers entry for
# claude-opus-5-5, so a launch needs PACK_STAFFING_SKIP_GATE=1 (same
# hatch full-forge.conf already uses for this id).
window coder      claude coder       --model claude-sonnet-5 --dangerously-skip-permissions --effort xhigh
window specifier  claude master      --model claude-opus-5-5 --dangerously-skip-permissions --effort xhigh
window cleaner    claude cleaner batch --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window architect  claude architect   --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window hardender  claude hardender batch --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window documenter claude documenter  --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window QA         claude QA          --model claude-opus-5-5 --dangerously-skip-permissions --effort xhigh
