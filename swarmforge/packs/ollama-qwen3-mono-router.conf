# ollama-qwen3-mono-router — mono-router on local Ollama (no cloud Token Plan keys).
#
# PREREQ:
#   ollama serve + a coder model pulled (e.g. qwen2.5-coder)
#   aider on PATH with OpenAI-compat base http://127.0.0.1:11434/v1
#
# LAUNCH:
#   bash swarmforge/scripts/local_coder_battery.sh   # claim/edit/test/handoff → pass
#   ./start-swarm-ollama-qwen.sh
#
# STAFFING GATE (BL-1127): start-swarm-ollama-qwen.sh refuses to launch unless
# a cited coder battery evidence artifact has result: pass (or
# LOCAL_CODER_BATTERY_SKIP_GATE=1). Fail/absent must not staff this pack.
#
# Cloud BAILIAN / QWEN_API_KEY / OPENAI cloud keys are NOT required.

config active_backlog_max_depth 1
config rotation router
config remote_control off
config coordinator_agent aider
config coordinator_model openai/qwen2.5-coder
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

# Common aider OpenAI-compat flags for every seat (local Ollama :11434).
# Repeated per window — pack format has no macros; keep flags identical.
# aider … --model openai/qwen2.5-coder --openai-api-base http://127.0.0.1:11434/v1 \
#   --no-gitignore --no-show-model-warnings --no-check-update

window coder     aider coder       --model openai/qwen2.5-coder --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window specifier aider master      --model openai/qwen2.5-coder --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window cleaner   aider cleaner batch --model openai/qwen2.5-coder --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window architect aider architect   --model openai/qwen2.5-coder --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window hardender aider hardender batch --model openai/qwen2.5-coder --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window documenter aider documenter --model openai/qwen2.5-coder --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window QA        aider QA          --model openai/qwen2.5-coder --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
