# ollama-ista-local-model-claude-mono-router — canary: ONE local seat with
# REAL tools. coder runs the local-model agent (qwen CLI, -y) against
# hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S on loopback Ollama;
# every other seat and the coordinator run Claude, staffed like
# anthropic-mono-router.conf / ollama-ista-coder-claude-mono-router.conf.
#
# Why this pack exists: the aider hybrid (ollama-ista-coder-claude-mono-
# router) can only emit diffs — aider has no execute channel. This canary
# swaps the agent token only (aider → local-model) so the same ISTA tag
# gets Bash/Read/Edit via qwen's tool loop. Parcel driver is NOT used
# (local-model is execute-capable; :parcel-driver is aider-only).
#
# Specifier window disabled (same interim as the aider hybrid). No
# single_inference_slot: only coder uses the local slot.
#
# PREREQ: ollama serve with ista-iq3s-coder:latest created from
#         swarmforge/packs/ista-iq3s-coder.Modelfile (FROM the ISTA IQ3_S
#         GGUF, PARAMETER num_ctx 32768 — the full coder.md bootstrap is
#         ~16k tokens, so 8192 OOMs the first turn); `qwen` on PATH;
#         .qwen/settings.json registers the alias with think:false.
# LAUNCH: ./start-swarm-ollama-ista-local-model-claude.sh

config active_backlog_max_depth 1
config rotation router
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true
config coordinator_agent claude
config coordinator_model claude-sonnet-5
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

window coder      local-model coder        --model ista-iq3s-coder:latest
window cleaner    claude cleaner batch --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window architect  claude architect   --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window hardender  claude hardender batch --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window documenter claude documenter  --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window QA         claude QA          --model claude-opus-5-5 --dangerously-skip-permissions --effort xhigh
