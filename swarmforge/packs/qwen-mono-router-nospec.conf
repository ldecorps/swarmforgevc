# qwen-mono-router-nospec — Qwen Token Plan mono-router (specifier enabled).
#
# (Name kept for launcher continuity; "nospec" is historical — specifier IS on.)
#
# All pipeline seats + coordinator on Alibaba Token Plan via aider:
#   specifier / architect → qwen3.8-max   (design-heavy / intake boundary)
#   hardender / QA        → qwen3.7-max    (gate judgment / verification)
#   coder / cleaner / documenter → qwen3.7-plus
#   coordinator / Operator / front desk → qwen3.7-plus (coordinator_model)
#
# No Kimi / OpenRouter / DashScope paygo — Token Plan only.
#
# PREREQ: BAILIAN_TOKEN_PLAN_API_KEY or QWEN_API_KEY; aider on PATH
# LAUNCH: ./start-swarm-qwen-nospec.sh
# Base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1

config active_backlog_max_depth 1
config rotation router
config remote_control off
config coordinator_agent aider
config coordinator_model openai/qwen3.7-plus
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

# Format: window <role> <agent> <worktree> [task|batch] [extra-cli...]
# First line (coder) = standing resident / home.
window coder     aider coder       --model openai/qwen3.7-plus --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
window specifier aider master      --model openai/qwen3.8-max --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
window cleaner   aider cleaner batch --model openai/qwen3.7-plus --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
window architect aider architect   --model openai/qwen3.8-max --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
window hardender aider hardender batch --model openai/qwen3.7-max --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
window documenter aider documenter --model openai/qwen3.7-plus --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
window QA        aider QA          --model openai/qwen3.7-max --openai-api-base https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 --no-gitignore --no-show-model-warnings --no-check-update
