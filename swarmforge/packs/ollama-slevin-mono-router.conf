# ollama-slevin-mono-router — EXPERIMENT (2026-10-10, human directive):
# same mono-router shape as ollama-ista-xxs-mono-router, but every standing
# seat (coordinator + rotation-router resident) is the prepared Slevin
# Qwen3.6-35B-A3B IQ3 -novision alias. Swap trial after XXS QA stalled on
# BL-2108 (~2.5h claimed, arrange-loop / no feature run outputs).
#
# Model: prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
# (Modelfile pins num_ctx 65536 / num_predict 4096; BL-1700 probe passed 5/5
# at 32768 and was faster than ISTA XXS on every scenario).
#
# VRAM note (16GB card): weights ~13 GiB (no projector). MoE KV is denser
# than XXS's hybrid SSM/attention - two concurrent slots @65536 may be
# tight under OLLAMA_NUM_PARALLEL=2. If ollama OOM / unload flaps, shrink
# num_ctx on the alias (65536 -> 32768) and `ollama create` again; keep
# single_inference_slot 1 so the swarm still serialises decode intent.
#
# PREREQ:
#   - ollama serve with OLLAMA_NUM_PARALLEL=2 (server-startup var).
#   - prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
#   - `qwen` on PATH.
#
# LAUNCH: SWARMFORGE_PACK=ollama-slevin-mono-router ./start-swarm.sh
#
# Loop guards (2026-10-10): seat `.qwen/settings.json` already sets
# model.skipLoopDetection true (heuristic dialog off). Qwen's always-on
# identical-shell / stagnation guards stay on and cannot be disabled that
# way — a handoff-draft amend-hash chase (BL-2121) still halts the seat.
# Backstop is the local-model card rule: write tmp/handoff.txt after the
# work commit, set commit: once, never amend just to refresh that field.

config active_backlog_max_depth 1
config rotation router
config single_inference_slot 1
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true
config coordinator_agent local-model
config coordinator_model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

window coder      local-model coder            --model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
window specifier  local-model master           --model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
window cleaner    local-model cleaner batch    --model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
window architect  local-model architect        --model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
window hardender  local-model hardender batch  --model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
window documenter local-model documenter       --model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
window QA         local-model QA               --model prepared-slevinw-qwen3.6-35b-a3b-gguf-qwen3.6-35b-a3b-iq3-novision:latest
