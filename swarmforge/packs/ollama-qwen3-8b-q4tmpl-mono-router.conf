# ollama-qwen3-8b-q4tmpl-mono-router — mono-router on local Ollama
# qwen3-8b-q4km-tmpl (Q4_K_M weights, PROPER Qwen3 chat template — no
# cloud Token Plan keys). Sibling of ollama-qwen3-8b-mono-router.conf
# (Q4_K_M, broken/raw template) and ollama-qwen3-8b-q6-mono-router
# (never built), model swapped only (BL-1142 shape preserved: rotation
# router, depth 1).
#
# WHY THIS MODEL (2026-09-20): the original ollama-qwen3-8b-mono-router
# pack's qwen3-8b-q4km:latest was imported with a broken Modelfile
# (`TEMPLATE {{ .Prompt }}` — no real chat structure at all), which made
# its earlier clean 15/15 compliance-battery score a template artifact,
# not real quality. Rebuilding the SAME Q4_K_M weights with the correct
# Qwen3 chat template (copied from a real hf.co pull) and re-running a
# fair battery (larger token budgets, corrected grading) 5 times each
# against this and a Q6_K variant found: qwen3-8b-q4km-tmpl mean 10.60/15
# (range 10-12) vs qwen3-8b-q6k mean 9.20/15 (range 8-10), exact
# permutation test p~=0.04 — statistically significant. Quant level barely
# matters here once the template bug is fixed; this smaller/faster Q4
# quant measurably beat the bigger Q6 quant. See
# .swarmforge/model-steward/scorecards/local__qwen3-8b-q4km-tmpl:latest.json
# and the certification report for the evidence.
#
# PREREQ:
#   ollama serve + qwen3-8b-q4km-tmpl:latest built (already done: 2026-09-20,
#   `ollama create qwen3-8b-q4km-tmpl -f <Modelfile with proper Qwen3 template>`)
#   aider on PATH with OpenAI-compat base http://127.0.0.1:11434/v1
#
# LAUNCH:
#   LOCAL_CODER_BATTERY_MODEL=qwen3-8b-q4km-tmpl:latest bash swarmforge/scripts/local_coder_battery.sh
#   ./start-swarm-ollama-qwen3-8b-q4tmpl.sh
#
# STAFFING GATE (BL-1127): start-swarm-ollama-qwen3-8b-q4tmpl.sh refuses to
# launch unless a cited coder battery evidence artifact has result: pass (or
# LOCAL_CODER_BATTERY_SKIP_GATE=1). Fail/absent must not staff this pack.
# Model steward certification: registered + certified as
# local/qwen3-8b-q4km-tmpl:latest (2026-09-20, real 15-check compliance
# battery — see .swarmforge/model-steward/certification-reports/).
#
# SAFETY NOTE (2026-09-20, operator observed, carried over from the
# ollama-qwen3-8b-mono-router pack this supersedes): that sibling pack's
# coordinator — which runs in the MAIN working tree, not an isolated
# worktree — twice responded to a routine "STOP, unfinished in_process
# work" nudge by generating large diffs attempting to rewrite shared
# infrastructure scripts (swarmforge/scripts/swarmforge.sh) and inventing
# fixes for problems that did not exist. Both edits happened to fail to
# apply (aider whole-edit-format vs. the model emitting unified-diff-style
# patches), verified via git status/diff — no damage landed, but this is
# a real behavior risk under this small local model, template fix or not,
# and is NOT guaranteed to keep failing to apply. Supervise this pack's
# coordinator closely; do not leave it running unattended for long
# stretches, especially on a fresh launch.
#
# PACK SHAPE (BL-1142): durable decision for this WSL/CPU host is mono-router
# stay with active_backlog_max_depth 1 (rotation router). Do not copy cloud
# full-forge depth. Uncapped standing multi-seat and qwen-forge / Token Plan
# forge are refused by local_ollama_pack_shape_gate.sh. This pack consumes
# already-specced backlog/active/ work at the coder seat — it does not mint
# new tickets from unspecced intake.
#
# Cloud BAILIAN / QWEN_API_KEY / OPENAI cloud keys are NOT required.

config active_backlog_max_depth 1
config rotation router
config remote_control off
config coordinator_agent aider
config coordinator_model openai/qwen3-8b-q4km-tmpl:latest
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

# Common aider OpenAI-compat flags for every seat (local Ollama :11434).
# Repeated per window — pack format has no macros; keep flags identical.
# aider … --model openai/qwen3-8b-q4km-tmpl:latest --openai-api-base http://127.0.0.1:11434/v1 \
#   --no-gitignore --no-show-model-warnings --no-check-update

