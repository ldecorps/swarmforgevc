# ollama-ista-local-model-mono-router — every seat is the full-forge local
# qwen seat (qwen CLI / local-model, ista-iq3s-coder:latest on loopback
# Ollama). No Claude, no aider, no coder@iq3 side seat.
#
# Same launch shape as full-forge.conf's coder@iq3 line and
# local-model-mono-router.conf: `qwen --auth-type openai -y`, model id
# ista-iq3s-coder:latest (num_ctx 49152, think:false via .qwen/settings.json).
# One resident plus the coordinator, depth 1. single_inference_slot because
# this host has one GPU slot for the 27B.
#
# PREREQ: ollama serve; ista-iq3s-coder:latest; `qwen` on PATH.
# LAUNCH: SWARMFORGE_PACK=ollama-ista-local-model-mono-router ./start-swarm.sh

config active_backlog_max_depth 1
config rotation router
config single_inference_slot 1
config remote_control off
config coordinator_mode deterministic

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

window coder      local-model coder            --model ista-iq3s-coder:latest
window specifier  local-model master           --model ista-iq3s-coder:latest
window cleaner    local-model cleaner batch    --model ista-iq3s-coder:latest
window architect  local-model architect        --model ista-iq3s-coder:latest
window hardender  local-model hardender batch  --model ista-iq3s-coder:latest
window documenter local-model documenter       --model ista-iq3s-coder:latest
window QA         local-model QA               --model ista-iq3s-coder:latest
