# ollama-qwen3-8b-q5-mono-router — mono-router on local Ollama qwen3-8b-q5km
# (Q5_K_M quant, no cloud Token Plan keys). Sibling of
# ollama-qwen3-8b-mono-router.conf (Q4_K_M), model swapped only (BL-1142
# shape preserved: rotation router, depth 1). Switch reason: comparing Q5
# quality against Q4 within available host RAM.
#
# PREREQ:
#   ollama serve + qwen3-8b-q5km:latest pulled/aliased (already done: 2026-09-20)
#   aider on PATH with OpenAI-compat base http://127.0.0.1:11434/v1
#
# LAUNCH:
#   LOCAL_CODER_BATTERY_MODEL=qwen3-8b-q5km:latest bash swarmforge/scripts/local_coder_battery.sh
#   ./start-swarm-ollama-qwen3-8b-q5.sh
#
# STAFFING GATE (BL-1127): start-swarm-ollama-qwen3-8b-q5.sh refuses to
# launch unless a cited coder battery evidence artifact has result: pass (or
# LOCAL_CODER_BATTERY_SKIP_GATE=1). Fail/absent must not staff this pack.
# Model steward certification: registered + certified as local/qwen3-8b-q5km:latest
# (2026-09-20, real 15-check compliance battery — see
# .swarmforge/model-steward/certification-reports/).
#
# SAFETY NOTE (2026-09-20, operator observed): the sibling Q4 pack's
# coordinator — which runs in the MAIN working tree, not an isolated
# worktree — twice responded to a routine "STOP, unfinished in_process
# work" nudge by generating large diffs attempting to rewrite shared
# infrastructure scripts (swarmforge/scripts/swarmforge.sh) and inventing
# fixes for problems that did not exist. Both edits happened to fail to
# apply (aider whole-edit-format vs. the model emitting unified-diff-style
# patches), verified via git status/diff — no damage landed, but this is
# a real behavior risk under this small local model and is NOT guaranteed
# to keep failing to apply. Supervise this pack's coordinator closely;
# do not leave it running unattended for long stretches.
#
# PACK SHAPE (BL-1142): durable decision for this WSL/CPU host is mono-router
# stay with active_backlog_max_depth 1 (rotation router). Do not copy cloud
# full-forge depth. Uncapped standing multi-seat and qwen-forge / Token Plan
# forge are refused by local_ollama_pack_shape_gate.sh. This pack consumes
# already-specced backlog/active/ work at the coder seat — it does not mint
# new tickets from unspecced intake.
#
# Cloud BAILIAN / QWEN_API_KEY / OPENAI cloud keys are NOT required.

config active_backlog_max_depth 1
config rotation router
config remote_control off
config coordinator_agent aider
config coordinator_model openai/qwen3-8b-q5km:latest
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

# Common aider OpenAI-compat flags for every seat (local Ollama :11434).
# Repeated per window — pack format has no macros; keep flags identical.
# aider … --model openai/qwen3-8b-q5km:latest --openai-api-base http://127.0.0.1:11434/v1 \
#   --no-gitignore --no-show-model-warnings --no-check-update

window coder     aider coder       --model openai/qwen3-8b-q5km:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window specifier aider master      --model openai/qwen3-8b-q5km:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window cleaner   aider cleaner batch --model openai/qwen3-8b-q5km:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window architect aider architect   --model openai/qwen3-8b-q5km:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window hardender aider hardender batch --model openai/qwen3-8b-q5km:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window documenter aider documenter --model openai/qwen3-8b-q5km:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window QA        aider QA          --model openai/qwen3-8b-q5km:latest --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
