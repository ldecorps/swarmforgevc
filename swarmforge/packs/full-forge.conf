# Full-forge (7+1): standing specifier, coder, cleaner, architect, hardender,
# documenter, QA + auto-provisioned coordinator. No rotation — every pipeline
# role has its own pane.
#
# Launch:
#   SWARMFORGE_PACK=full-forge ./start-swarm.sh
#   SWARMFORGE_TERMINAL=none ./swarm <target> --pack full-forge
#
# Staffing (operator 2026-08-20): sonnet everywhere; specifier on opus;
# coder RESTORED to claude-fable-5 to finish the 2026-08-19 bounce experiment.
# Depth pulled to 1 the same evening so the standing seven-pack can be
# watched before the cap is raised. Raised to 2 2026-08-18 (operator,
# Cursor); raised to 3 the same evening — three orthogonal active
# tickets; raised to 4 2026-08-19 (operator); raised to 5, then 6, the
# same morning (operator); raised to 7 the same day (operator). Do not
# fall back to seven-pack Haiku or to an uncapped pipeline.
#
# Swarm-wide settings. `config <key> <value>` lines are read by the coordinator.
# active_backlog_max_depth: max number of items allowed in backlog/active/ at once.
# The coordinator holds new work in backlog/paused/ and promotes the next item to
# active only while the active count is below this cap. Keeps the pipeline at a
# pace the human can follow.
# A value of -1 means NO LIMIT: the coordinator promotes every eligible paused
# item regardless of active count. Concurrent Work Orthogonality still applies
# (skip/hold overlapping-scope items) — removing the depth cap does not remove
# the orthogonality rule.
config active_backlog_max_depth 7

# BL-606: specifier-declared required_stages routing. Kept ON to match the
# live project conf (swarmforge/swarmforge.conf).
config required_stages_routing_enabled true

# BL-149: mutation-testing eligibility gate (mutation_cooldown_gate.bb), read
# fresh by the hardener before each mutation pass - never a remembered value.
# mutation_cooldown_days: a production file last committed-touched within this
# many days is still actively churning and is skipped unconditionally,
# regardless of time of day or host load.
config mutation_cooldown_days 3
# mutation_busy_load_multiplier: once a file is past cooldown, the existing
# office-hours bypass applies - the host is "busy" when its load average
# exceeds this multiplier times the core count (was a hardcoded "~2x cores"
# in hardender.prompt's prose; now configurable here instead).
config mutation_busy_load_multiplier 2

# BL-144: daemon-death alarm email. handoffd_supervisor.bb runs headless (no
# VS Code needed) and cannot read the extension's swarmforge.notify.email.*
# VS Code settings, so the alarm path gets its own config here instead - the
# API key still comes from the RESEND_API_KEY env var, same as the extension.
# Uncomment and set notify_email_to to enable the alarm email (the failure
# log + hard-stop happen either way, configured or not).
# BL-215: RESEND_API_KEY is read from the DAEMON's own process environment,
# not VS Code SecretStorage - a headless launch (CLI, no VS Code, or a
# supervisor self-relaunch) MUST export RESEND_API_KEY in that same launch
# environment (shell profile / systemd unit / launcher), or the alarm and
# BL-214 briefing emails cannot send. A configured-but-keyless daemon no
# longer no-ops silently: it logs a loud warning naming RESEND_API_KEY to
# .swarmforge/daemon/handoffd-supervisor.log (deduped, not spammed).
config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev

# BL-258: the headless daemon's own morning trigger for briefing GENERATION
# (complements BL-214's send-time sweep above) - "HH:MM" 24h UTC. Read fresh
# each sweep by handoffd.bb's configured-morning-time, never hardcoded. A
# blank/absent/malformed value falls back to 08:00 UTC
# (briefing_generation_schedule_lib.bb's default-morning-time) rather than
# crashing the sweep.
config briefing_morning_time_utc 04:30

# Full-time 3-shift (operator 2026-08-18): cooldown OFF so evening is not
# auto-paused. Window times kept so flipping back is a one-line change.
config cooldown_window_enabled false
config cooldown_start_local 17:00
config cooldown_end_local 01:00

# BL-256: the deployed PWA dashboard's base URL (read by
# extension/src/metrics/pwaDeepLinks.ts), used to build deep links from
# briefing items (e.g. #ticket=BL-123, #approval=BL-123) into their PWA
# view. There is no universal default - the GitHub Pages URL is assigned
# per deployment (or a later custom domain) - so this line is commented
# out until the operator sets it; absent/blank degrades to plain ticket
# IDs with no link, never a broken URL. Example:
# config pwa_base_url https://<user>.github.io/<repo>/

# BL-223: the phone recert PWA's inbound recertification address (read by
# extension/src/docs/recertificationStore.ts, published into recert-batch.json
# for the static PWA to consume - never hardcoded in pwa/app.js a second
# time). Defaults to the operator's Resend-managed receiving domain
# (tolokarooo.resend.app - no DNS/MX setup needed) when this line is absent.
# A later branded custom domain (e.g. recert@inbound.musicalsifu.com) is a
# swap of this one line, not a code change.
config recert_email_to recert@tolokarooo.resend.app

# Format: window <role> <agent> <worktree> [task|batch] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
# Any fields after the receive mode are passed to the agent CLI, e.g. --yolo.
# --remote-control [name] enables Claude Remote Control (claude.ai/code, mobile app).
# Coordinator staffing retained from the live mono-router pack (Sonnet /
# medium). Absent this, provision_coordinator falls back to Sonnet / high.
# 2026-08-19 (operator): bumped sonnet-5 -> opus-5 (spare token budget;
# explicitly temporary/in-situ, see project memory). Takes effect on the
# coordinator's own next respawn, not this running session.
config coordinator_model claude-sonnet-5
config coordinator_effort medium

# BL-243: the coordinator is provisioned automatically by ./swarm - it is
# reserved infrastructure and is rejected outright if declared here as a
# window line (see swarmforge.sh's provision_coordinator/parse_config).
# Model/effort table copied from the live mono-router pack; per-role
# --remote-control names because these panes run concurrently.
#
# 2026-08-19 (operator experiment): coder moved to claude-fable-5, effort
# left at xhigh - already the ceiling. 45 of the last 56 recorded bounces
# blame coder (class: behavior, ~68% overall), specifier only 2. Track
# coder-blamed bounce rate on the next 10-15 coder-authored tickets against
# this 45/56 baseline before deciding to keep it.
# 2026-08-19 (operator, same day): specifier also moved to claude-fable-5
# (was opus-5). Cleaner/architect/hardender/documenter/QA bumped
# sonnet-5 -> opus-5 (spare token budget; explicitly temporary/in-situ, see
# project memory - not meant to be a durable staffing decision). All of
# this takes effect on each role's own next pane respawn/launch, not the
# currently-running sessions.
#
# 2026-08-20 (operator): the experiment was briefly ended by a staffing
# change (coder -> opus-5 at ~06:5xZ) and is now RESTORED to fable-5 to run
# to completion. Progress at restore: 31 tickets closed since 2026-08-19
# carrying 13 recorded bounces; of the 10 closed on the 2026-08-19/20 night
# shift, 5 bounces, ALL coder-blamed (BL-935 x2, BL-571 x2, BL-959 x1;
# classes invariant-unencoded / behavior / integration). Baseline to beat:
# 45 of 56 bounces coder-blamed (~68% overall, ~80% of bounces).
#
# CONFOUND, stated so the result is read honestly: the specifier is NOT
# being returned to fable-5 (operator directive 2026-08-20 keeps it on
# opus-5). Specifier quality feeds coder bounce rate - a spec gap becomes a
# coder behaviour bounce - so this run is "coder fable-5 under an opus
# specifier", not a clean replay of the 2026-08-19 conditions. Compare with
# that caveat, or return specifier to fable-5 for a like-for-like run.
#
# 2026-08-20 (operator directive): the fable-5 bounce-rate experiment above
# is ABANDONED as of this seat's addition. A second coder seat's bounces
# post as blamed:coder (BL-983 invariant 3: seat identity never escapes the
# mailbox layer), indistinguishable from the fable-5 seat's, so the
# coder-blamed metric can no longer isolate the fable-5 variable from here
# on. Human chose to stand up the seat and accept the experiment's end
# rather than hold it for the sample to complete. Do not resume reading
# the coder-blamed rate as evidence about fable-5 past this point.
#
# 2026-08-20 (operator directive): main coder ("coder1") moved back to
# claude-opus-5. Takes effect on the coder seat's own next pane
# respawn/launch, not the currently-running session.
window specifier claude master --model claude-opus-5 --dangerously-skip-permissions --effort xhigh --remote-control SwarmForge-Specifier
window coder claude coder --model claude-opus-5 --dangerously-skip-permissions --effort xhigh --remote-control SwarmForge-Coder
window coder@sonnet2 claude coder-sonnet2 --model claude-sonnet-5 --dangerously-skip-permissions --effort xhigh --remote-control SwarmForge-Coder-Sonnet2
window cleaner claude cleaner batch --model claude-sonnet-5 --dangerously-skip-permissions --effort medium --remote-control SwarmForge-Cleaner
window architect claude architect --model claude-sonnet-5 --dangerously-skip-permissions --effort xhigh --remote-control SwarmForge-Architect
window hardender claude hardender batch --model claude-sonnet-5 --dangerously-skip-permissions --effort high --remote-control SwarmForge-Hardender
window documenter claude documenter --model claude-sonnet-5 --dangerously-skip-permissions --effort high --remote-control SwarmForge-Documenter
window QA claude QA --model claude-sonnet-5 --dangerously-skip-permissions --effort high --remote-control SwarmForge-QA
