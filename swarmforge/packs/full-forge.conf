window architect claude architect back-all --model claude-sonnet-5 --dangerously-skip-permissions --effort medium --remote-control SwarmForge-Architect
window hardender claude hardender batch --model claude-sonnet-5 --dangerously-skip-permissions --effort medium --remote-control SwarmForge-Hardender
