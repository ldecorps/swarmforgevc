# cursor-mono-router — mono-router topology (BL-518) with Cursor seats,
# Opus-only specifier.
#
# Verification / operator pack: prove Cursor can hold the pipeline. Specifier
# stays Claude Opus for real spec-defect bounces; cold intake should NOT be
# fed to this swarm (mono-router home is coder — already-specced work only).
#
# PREREQ:
#   cursor-agent on PATH; CURSOR_API_KEY in the environment (tmux -e / BL-130)
#   claude on PATH + Anthropic auth (specifier seat only)
#   Model Steward: cursor/auto certified (or SWARMFORGE_CURSOR_SEAT_SPIKE=1)
#
# LAUNCH:
#   source ~/.zshenv   # if keys live there
#   ./start-swarm-cursor.sh
#   # or: SWARMFORGE_PACK=cursor-mono-router SWARMFORGE_TERMINAL=none ./swarm <root> --pack cursor-mono-router
#
# remote_control off: cursor-agent has no Claude-style --remote-control /rc path.

config active_backlog_max_depth 2
config rotation router
config remote_control off
config coordinator_agent cursor
config coordinator_model auto
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

# Format: window <role> <agent> <worktree> [task|batch] [extra-cli...]
# First line (coder) is the standing resident / home. Specifier is Claude Opus
# only — every other pipeline seat and the coordinator are Cursor.
window coder     cursor coder       --model auto
window specifier claude master      --model claude-opus-5 --dangerously-skip-permissions --effort xhigh
window cleaner   cursor cleaner batch --model auto
window architect cursor architect   --model auto
window hardender cursor hardender batch --model auto
window documenter cursor documenter --model auto
window QA        cursor QA          --model auto
