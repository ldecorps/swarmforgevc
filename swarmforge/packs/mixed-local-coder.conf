# mixed-local-coder (BL-1702) — full-forge's own shape, unchanged, PLUS a
# second coder seat, coder@2, staffed by a local model under the BL-1697
# parcel driver at the easy seat tier — BL-1001's live claim filter then
# gives it mutation_cost: low tickets only, while the unchanged Claude
# coder seat still takes every other ticket and every local give-up
# (BL-1715). Every other seat (cleaner, architect, hardender, documenter,
# QA, art-director, specifier) stays exactly as full-forge.conf's own —
# copy the window lines verbatim from there if this pack drifts.
#
# Ruled A (human, 2026-09-24, refined the same day: coder@2 rather than a
# whole second pack — backlog/done/BL-1702-*.yaml's own human_ruling/source).
#
# STAFFING GATE (BL-1702, wired into swarmforge.sh's parse_config itself,
# not a separate pre-launch script): a launch of THIS pack refuses unless
# the NEWEST steward probe summary (BL-1700/BL-1701,
# backlog/evidence/local-coder-probe-<model>-<UTC>.md) for coder@2's
# declared --model records at least 4 of 5 coder fixtures handed off and
# no breached hazard — whatever PACK_STAFFING_SKIP_GATE says (that escape
# hatch clears the OLDER, separate BL-1318 pack_staffing_gate below, which
# every local/loopback aider seat needs regardless — no api-base host
# mapping exists for 127.0.0.1 — but never this newer gate). Certify a
# model first:
#   bb swarmforge/scripts/model_steward_cli.bb probe <model> --all \
#     --endpoint-url http://127.0.0.1:11434/v1
# then point the window line below at whatever model that probe named.
# qwen3-14b:latest is today's probe subject (backlog/evidence/local-coder-
# probe-qwen3-14b-latest-*.md) but has NOT yet cleared the bar — this pack
# cannot launch until either it does, or a different model's probe does.
#
# PREREQ: ollama serve + the probed model pulled; aider on PATH; an
# OpenAI-compat endpoint reachable at the URL the window line below names
# (override with SWARMFORGE_LOCAL_MODEL_ENDPOINT_URL).
#
# LAUNCH (operator act, after this lands — the canary itself, BL-1702 item
# 4, is evidence, never a scenario):
#   SWARMFORGE_TERMINAL=none ./swarm <target> --pack mixed-local-coder

config active_backlog_max_depth 7
config required_stages_routing_enabled true
config master_main_reconcile_enabled true

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

config recert_email_to recert@tolokarooo.resend.app

config coordinator_model claude-sonnet-5
config coordinator_effort medium

# BL-1696: coder@2's own `seat test` command (aider's --auto-test loop and
# the driver's own red/green gate both call `seat test`, never a
# project-specific command inline). This project's own real test command;
# an operator launching this pack against a DIFFERENT target project
# overrides it per-launch (SWARMFORGE_CONFIG pointed at a copy of this
# file with this one line changed).
config seat_test_command cd extension && npm test

# Format: window <role> <agent> <worktree> [task|batch] [extra-cli-args...]
# Every line below but coder@2 is copied verbatim from full-forge.conf.
window specifier claude master --model claude-opus-5-5 --dangerously-skip-permissions --effort xhigh --remote-control SwarmForge-Specifier
window coder claude coder --model claude-sonnet-5 --seat-tier hard --dangerously-skip-permissions --effort xhigh --remote-control SwarmForge-Coder
# BL-1702: the local coder seat. driver-capable agent (aider) + role
# "coder" (its seat suffix stripped) makes this a DRIVER seat
# (local_parcel_driver_lib.bb's driver-seat?) — BL-1697's driver moves its
# parcels, never handoffd's ordinary pane injections. --seat-tier easy is
# pack routing metadata (BL-1001, stripped before reaching aider) — this
# seat claims mutation_cost: low tickets only. A parcel it cannot finish
# after its fix turns goes to the Claude coder above (BL-1715 give-up).
window coder@2 aider coder2 --model openai/qwen3-14b:latest --openai-api-base http://127.0.0.1:11434/v1 --seat-tier easy --no-gitignore --no-show-model-warnings --no-check-update
window cleaner claude cleaner batch back-one --model claude-sonnet-5 --dangerously-skip-permissions --effort medium --remote-control SwarmForge-Cleaner
window architect claude architect back-all --model claude-sonnet-5 --dangerously-skip-permissions --effort medium --remote-control SwarmForge-Architect
window hardender claude hardender batch --model claude-sonnet-5 --dangerously-skip-permissions --effort medium --remote-control SwarmForge-Hardender
window documenter claude documenter --model claude-sonnet-5 --dangerously-skip-permissions --effort medium --remote-control SwarmForge-Documenter
window QA claude QA --model claude-opus-5-5 --dangerously-skip-permissions --effort xhigh --remote-control SwarmForge-QA
window art-director claude art-director --model claude-sonnet-5 --dangerously-skip-permissions --effort medium --remote-control SwarmForge-ArtDirector
