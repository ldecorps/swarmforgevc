# copilot-forge — full 7-role build swarm on GitHub Copilot CLI.
#
# WHY: Claude quota is scarce. Copilot bills a separate subscription, so work
# roles here cost zero Claude tokens.
#
# COST POSTURE (2026-08-31, mirrors cursor-forge):
#   specifier → auto (hard intake / spec judgment)
#   every other window → gpt-5.4-mini (cheap pinned)
# Coordinator stays Claude (provision_coordinator hardcodes the provider;
# see INTAKE-coordinator-provider-hardcoded-to-claude.md) on the cheapest
# defensible tier.
#
# PREREQ: Linux-native copilot CLI on Node >= 24, authenticated.
#   Windows-npm shim under /mnt/c will NOT work (Windows paths vs WSL worktrees).
#   Auth: COPILOT_GITHUB_TOKEN / GH_TOKEN / GITHUB_TOKEN, or `copilot` + /login.
#
# LAUNCH:
#   SWARMFORGE_CONFIG="$PWD/swarmforge/packs/copilot-forge.conf" \
#   SWARMFORGE_TERMINAL=none zsh swarmforge/scripts/swarmforge.sh <project-root>
#   # or: ./swarm <root> with SWARMFORGE_CONFIG pointing here

config active_backlog_max_depth -1
config required_stages_routing_enabled true

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

# Day + night cooldown (same envelope as cursor-forge).
config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

# --- coordinator (BL-314): the one role that cannot leave Claude. ---
config coordinator_model claude-sonnet-5
config coordinator_effort medium

# --- work roles, all on Copilot ---
# Format: window <role> <agent> <worktree> [task|batch] [extra-cli-args...]
#
# swarmforge.sh's copilot launch body already supplies
#   --yolo --allow-all-paths --add-dir <root> -C <worktree> --name ... -i <prompt>
# Do NOT pass Claude-only flags (--dangerously-skip-permissions, --effort,
# --remote-control). --model is the Copilot pin.
#
# Cheap pin: gpt-5.4-mini (confirmed in Copilot model catalogues 2026).
# Specifier stays auto. If a host's plan lacks gpt-5.4-mini, swap the cheap
# id after `copilot` /model lists what you have (claude-haiku-4.5 is the
# usual fallback).
window specifier       copilot master        --model auto
window coder           copilot coder         --model gpt-5.4-mini
window cleaner         copilot cleaner batch --model gpt-5.4-mini
window architect       copilot architect     --model gpt-5.4-mini
window hardender       copilot hardender batch --model gpt-5.4-mini
window documenter      copilot documenter    --model gpt-5.4-mini
window QA              copilot QA            --model gpt-5.4-mini
