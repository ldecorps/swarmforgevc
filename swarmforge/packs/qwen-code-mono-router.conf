# qwen-code-mono-router — mono-router topology (BL-518) on qwen-code, Alibaba's
# own agentic CLI, against the Token Plan OpenAI-compat endpoint (SEA).
#
# NOT packs/qwen-mono-router.conf. That pack drives the SAME models, the same
# endpoint and the same key through `aider`, a file editor with no autonomous
# shell execution — a role staffed that way narrates `ready_for_next.sh`
# instead of running it. qwen-code really executes. Both packs are kept; pick
# by what the seat has to DO, not by the model catalog they share.
#
# Role → model (Token Plan SEA catalog — operator list 2026-07-20):
#   workers (coder / specifier / cleaner / architect / hardender /
#            documenter / QA) → qwen3.7-plus
#   coordinator               → qwen3.6-flash  (cheaper mechanical bookkeeping)
# Also available on this plan (not used by default): qwen3.8-max-preview,
# qwen3.7-max, deepseek-v4-pro, glm-5.2.
#
# PREREQ:
#   npm i -g @qwen-code/qwen-code   # installs the binary as `qwen`
#   export QWEN_API_KEY=sk-…        # or BAILIAN_CODING_PLAN_API_KEY (fallback)
# Base URL (OpenAI-compat), exported into the pane by the launcher's qwen
# guard — the CLI reads it from the environment, there is no flag for it:
#   https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
#
# LAUNCH:
#   source ~/.zshenv
#   SWARMFORGE_TERMINAL=none ./swarm <root> --pack qwen-code-mono-router
#
# Notes: qwen-code is launched with `--auth-type openai -y` from
# write_role_launch_script; window lines only need --model. The API key is
# NEVER written into launch scripts — it reaches the pane via tmux -e (BL-130).
#
# TERMS OF SERVICE — READ BEFORE LAUNCHING. Carried verbatim from
# qwen-mono-router.conf, because it is about the PLAN, not the CLI. Kept on ONE
# line on purpose: wrapped across two, the warning stops being greppable and a
# reader (or a check) can pick up half of it.
#
# "Personal ToS limits use to interactive coding tools; headless swarm may risk key revocation — prefer Team Edition for automation, or verify eligibility in console first."
#
# This pack makes the seat possible; it does not decide that running it
# headless on a Personal plan is allowed. That call is the operator's, per
# launch.

config active_backlog_max_depth 1
config rotation router
config remote_control off
config coordinator_agent qwen-code
config coordinator_model qwen3.6-flash
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

# Format: window <role> <agent> <worktree> [task|batch] [extra-cli...]
window coder      qwen-code coder            --model qwen3.7-plus
window specifier  qwen-code master           --model qwen3.7-plus
window cleaner    qwen-code cleaner batch    --model qwen3.7-plus
window architect  qwen-code architect        --model qwen3.7-plus
window hardender  qwen-code hardender batch  --model qwen3.7-plus
window documenter qwen-code documenter       --model qwen3.7-plus
window QA         qwen-code QA               --model qwen3.7-plus
