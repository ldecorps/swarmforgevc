# ollama-ista-local-model-claude-coord-forge — BL-2078: the live
# ollama-ista-local-model-qwen-coord-mono-router pack's seven iq3 seats
# (ista-iq3s-coder:latest on loopback Ollama, one model load) standing
# together instead of rotating one resident, plus its Claude coordinator.
# Allowed only while the seats reach Ollama through the tool-call shim's
# decode slot (BL-2077); the local pack-shape gate refuses this pack with
# SWARMFORGE_LOCAL_MODEL_SHIM=off, naming the missing decode slot.
#
# active_backlog_max_depth 3 (human ruling A, 2026-10-09: depth 3 of the
# A/B/C options, 2/3/5) - the slot serves one seat at a time, so more than
# about three parcels in flight mostly queue on it.
#
# No `config rotation router`: standing, not mono-router (BL-1142 stays the
# default for router packs). No `config single_inference_slot` line: that
# key has been read by nothing since BL-1752 - BL-2077's decode slot is
# what keeps inference one at a time here.
#
# PREREQ: ollama serve; ista-iq3s-coder:latest created from
#         swarmforge/packs/ista-iq3s-coder.Modelfile; `qwen` on PATH;
#         .qwen/settings.json registers the alias with think:false;
#         `claude` on PATH for the coordinator; the local-model tool-call
#         shim running (SWARMFORGE_LOCAL_MODEL_SHIM, default on).
# LAUNCH: ./start-swarm-ollama-ista-local-model-claude-forge.sh

config active_backlog_max_depth 3
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true
config coordinator_agent claude
config coordinator_model claude-sonnet-5
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

window coder      local-model coder            --model ista-iq3s-coder:latest
window specifier  local-model master            --model ista-iq3s-coder:latest
window cleaner    local-model cleaner batch     --model ista-iq3s-coder:latest
window architect  local-model architect         --model ista-iq3s-coder:latest
window hardender  local-model hardender batch   --model ista-iq3s-coder:latest
window documenter local-model documenter        --model ista-iq3s-coder:latest
window QA         local-model QA                --model ista-iq3s-coder:latest
