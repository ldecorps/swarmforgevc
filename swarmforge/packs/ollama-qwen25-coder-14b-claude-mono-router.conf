# ollama-qwen25-coder-14b-claude-mono-router — mono-router with ONE local seat:
# coder runs aider on qwen2.5-coder:14b (local ollama, GPU) under handoffd's
# local parcel driver; every other seat and the coordinator run Claude,
# staffed exactly like anthropic-mono-router.conf / the ISTA hybrid pack.
#
# 2026-09-29 (human via Cursor): same interim shape as
# ollama-ista-coder-claude-mono-router (BL-1702 ruling A spirit: local coder,
# Claude elsewhere), swapping the ISTA 27B for Qwen2.5-Coder-14B Q4 on the
# 16 GB GPU. Specifier is Claude opus (same as anthropic-mono-router.conf);
# no single_inference_slot (only coder uses the local slot).
#
# PREREQ: ollama serve with qwen2.5-coder:14b pulled;
#         repo-root .aider.model.metadata.json entry for the slug.
# LAUNCH: ./start-swarm-ollama-qwen25-coder-14b-claude.sh

config active_backlog_max_depth 1
config rotation router
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true
config coordinator_agent claude
config coordinator_model claude-sonnet-5
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 04:30
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

window coder      aider coder        --model openai/qwen2.5-coder:14b --openai-api-base http://127.0.0.1:11434/v1 --no-gitignore --no-show-model-warnings --no-check-update
window specifier  claude master      --model claude-opus-5-5 --dangerously-skip-permissions --effort xhigh
window cleaner    claude cleaner batch --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window architect  claude architect   --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window hardender  claude hardender batch --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window documenter claude documenter  --model claude-sonnet-5 --dangerously-skip-permissions --effort medium
window QA         claude QA          --model claude-opus-5-5 --dangerously-skip-permissions --effort xhigh
