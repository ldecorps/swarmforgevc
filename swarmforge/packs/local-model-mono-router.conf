# local-model-mono-router — mono-router topology (BL-518) on a downloaded
# local model seat (BL-1052). Completions run on this host through an
# OpenAI-compatible loopback endpoint served by BL-1082.
#
# NOT packs/qwen-mono-router.conf. That pack drives overlapping model catalogs
# through `aider`, a file editor with no autonomous shell execution — a role
# staffed that way narrates `ready_for_next.sh` instead of running it. The
# `local-model` agent really executes. Both packs are kept; pick by what the
# seat has to DO, not by the model catalog they share.
#
# Role → model (first quest: a local Qwen coder; second id proves generic):
#   workers + coordinator → qwen2.5-coder:7b-instruct
# Swap the model id on the window line only — no second launch branch,
# capability entry, or pack family (ticket invariant).
#
# PREREQ:
#   npm i -g @qwen-code/qwen-code   # installs the binary as `qwen`
#   BL-1082 pull+serve for the named model (loopback OpenAI-compat endpoint)
#   No cloud provider credential is required. An optional local OpenAI-compat
#   client token may be set in the launching environment; it reaches the pane
#   via tmux -e only, never a pack or launch file.
# Base URL (OpenAI-compat), forced into the pane by the launcher:
#   http://127.0.0.1:11434/v1   (override with SWARMFORGE_LOCAL_MODEL_ENDPOINT_URL)
#
# LAUNCH:
#   source ~/.zshenv
#   SWARMFORGE_TERMINAL=none ./swarm <scratch-root> --pack local-model-mono-router
#
# Notes: local-model is launched with `qwen --auth-type openai -y` from
# write_role_launch_script; window lines only need --model. Secrets are
# NEVER written into launch scripts (BL-130). Launch is refused when the
# local endpoint is not ready.

config active_backlog_max_depth 1
config rotation router
config remote_control off
config coordinator_agent local-model
config coordinator_model qwen2.5-coder:7b-instruct
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

# Format: window <role> <agent> <worktree> [task|batch] [extra-cli...]
window coder      local-model coder            --model qwen2.5-coder:7b-instruct
window specifier  local-model master           --model qwen2.5-coder:7b-instruct
window cleaner    local-model cleaner batch    --model qwen2.5-coder:7b-instruct
window architect  local-model architect        --model qwen2.5-coder:7b-instruct
window hardender  local-model hardender batch  --model qwen2.5-coder:7b-instruct
window documenter local-model documenter       --model qwen2.5-coder:7b-instruct
window QA         local-model QA               --model qwen2.5-coder:7b-instruct
