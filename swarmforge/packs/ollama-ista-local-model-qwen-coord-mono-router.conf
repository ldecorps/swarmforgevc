# ollama-ista-local-model-qwen-coord-mono-router — every pipeline seat is
# local-model (qwen CLI / ista-iq3s-coder:latest on loopback Ollama); the
# coordinator is Claude Code on Qwen Cloud Token Plan (qwen3.6-flash via
# Anthropic-compat). Depth 1, mono-router.
#
# Name history: "qwen-coord" marks the intended default day/evening pack
# after the 2026-10-08 evening restart (day_shift_pack). Pipeline seats stay
# on the ISTA IQ3_S local seat; coordinator is Token Plan qwen so bookkeeping
# does not share the 16 GB decode slot with the resident.
#
# PREREQ: ollama serve; ista-iq3s-coder:latest; `qwen` on PATH; `claude` on
#         PATH; QWEN_API_KEY or BAILIAN_TOKEN_PLAN_API_KEY in ~/.zshenv.
# LAUNCH: ./start-swarm-ista-iq3-qwen-cloud.sh
#    or:  SWARMFORGE_PACK=ollama-ista-local-model-qwen-coord-mono-router ./start-swarm.sh

config active_backlog_max_depth 1
config rotation router
config single_inference_slot 1
config remote_control off
config required_stages_routing_enabled true
config master_main_reconcile_enabled true
config coordinator_agent claude
config coordinator_model qwen3.6-flash
config coordinator_effort medium

config mutation_cooldown_days 3
config mutation_busy_load_multiplier 2

config notify_email_to ldecorps@gmail.com
config notify_email_from onboarding@resend.dev
config briefing_morning_time_utc 08:00
config recert_email_to recert@tolokarooo.resend.app

config cooldown_window_enabled true
config cooldown_start_local 17:00
config cooldown_end_local 01:00

window coder      local-model coder            --model ista-iq3s-coder:latest
window specifier  local-model master           --model ista-iq3s-coder:latest
window cleaner    local-model cleaner batch    --model ista-iq3s-coder:latest
window architect  local-model architect        --model ista-iq3s-coder:latest
window hardender  local-model hardender batch  --model ista-iq3s-coder:latest
window documenter local-model documenter       --model ista-iq3s-coder:latest
window QA         local-model QA               --model ista-iq3s-coder:latest
